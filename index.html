<script>

    const allData = {"general": [{"title": "Dow falls for a third day as bond yields hit fresh highs: Live updates", "full_content": "The Dow Jones Industrial Average fell for a third straight session on Thursday, as Treasury yields at multidecade highs continued to weigh on the most cyclical parts of the market.\n\nThe 30-stock index slid 161.61 points, or 0.31%, to 51,349.98. The S&P 500 ticked lower by 0.02% to 7,704.13. The Nasdaq Composite eked out a 0.01% gain to 26,939.37\n\nStocks came off their session lows after Reuters, citing sources, reported that U.S. and Iranian negotiators in New York are considering a deal that would bring a phased end to the conflict in the Middle East, whereby Iran would reopen the Strait of Hormuz and the U.S. would lift its economic blockade on Tehran.\n\nBut oil prices and bond yields remained elevated. Brent crude , the international benchmark, rose more than 3% to close above $106 per barrel. U.S. West Texas Intermediate futures climbed nearly as much to settle at about $95 per barrel.\n\nThe 30-year Treasury bond yield hit a high of 5.475%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.183%, near levels not reached since July 2007. The 2-year note yield rose to 4.914%.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a nearly 71% likelihood that the Federal Reserve lifts its key rate once more in October, per the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nYet, Wednesday's readings from S&P Global's manufacturing and services purchasing managers' indexes suggested that U.S. businesses are continuing to boom.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:42 AM IST", "pub_date_relative": "just now"}, {"title": "MGM Resorts shares sink 11% after Barry Diller's People Inc. rescinds takeover offer", "full_content": "Barry Diller's People Inc. has rescinded its proposal to buy MGM Resorts International , sending shares of the casino giant down roughly 11% on Thursday.\n\nThe update comes nearly four months after Diller's company offered to purchase MGM Resorts for $48.30 per share. People Inc. already owns a roughly 26.1% stake in MGM.\n\nDiller, chairman of People Inc. \u2014 formerly known as IAC \u2014 attributed the decision to the complicated nature of the deal.\n\n\"There are lots of ingredients that go into a proposal of this kind on its way to completion,\" Diller said in the press release. \"We didn't feel the mix was coming together in the way we had hoped and have decided not to pursue taking the company private at this time.\"\n\nCNBC's David Faber reported Thursday that Diller backed off the deal in part because of the significant debt load it would have created for the company.\n\n\"We at People Incorporated remain open to and interested in the possibility of a strategic transaction with MGM Resorts and look forward to considering a range of alternatives,\" he said in the release.\n\nEarlier this week, shareholders of Caesars Entertainment approved an offer from billionaire Tilman Fertitta to acquire the casino company for $17.6 billion. Caesars shareholders will receive $31 per share in cash.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:41 AM IST", "pub_date_relative": "2m ago"}, {"title": "Nearly 170,000 pounds of raw meat recalled for false inspection labels - The Washington Post", "full_content": "Nearly 170,000 pounds of raw meat recalled for false inspection labels The Washington Post More than 167,000 pounds of meat with false inspection labels recalled nationwide CNN More than 160,000 pounds of meat bearing false USDA inspection labels recalled AP News Over 160,000 Pounds of Meat Recalled Due to Lack of Inspection, Receives Highest Risk Level From USDA TODAY.com Massive meat recall affects beef, pork and more: USDA thehill.com", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 01:34 AM IST", "pub_date_relative": "9m ago"}, {"title": "Oracle sends 'force majeure' notice about data center project \u2014 stock drops 3%", "full_content": "Oracle shares fell more than 3% on Thursday following news that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\n\"Project Jupiter remains on our planned schedule,\" Oracle said in a statement to CNBC. \"We are fully committed to New Mexico and confident in our path forward.\"\n\nBloomberg was first to report the news, citing sources familiar with the matter.\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it fails to come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital , CNBC confirmed. Blue Owl also saw its shares fall on Thursday.\n\n\"This notice does not change the financial commitments to this multi-year project,\" Blue Owl Capital said in a statement to CNBC.\n\nThe New Mexico data center project, which is part of the broader Stargate artificial intelligence infrastructure build-out with President Donald Trump , has been riddled with setbacks and regulatory hurdles.\n\nThat includes local opposition to data centers ahead of the upcoming midterm elections and concerns from environmental groups. The site has also faced delays with the buildout of a natural gas pipeline intended to fuel the facility.", "source": "CNBC World Economy", "pub_date_str": "25 Sep 2026, 01:30 AM IST", "pub_date_relative": "13m ago"}, {"title": "Pete Hegseth reports at least $3.1 million in cash, investments and bitcoin", "full_content": "Defense Secretary Pete Hegseth reported at least $3.1 million in cash, retirement investments and bitcoin in his newly released 2025 annual financial disclosure , including more than $1 million in cash held in a single bank account.\n\nThe Office of Government Ethics filing provides the latest look at the finances of the former firebrand Fox News host, who was confirmed as defense secretary in January 2025. Hegseth is facing calls to be impeached from members of his own party related to his handling of the war in Iran .\n\nThe disclosure lists five retirement accounts containing investments worth roughly $2.05 million to $4.35 million. Hegseth's three accounts accounted for about $500,000 to $1.25 million of that total, while his wife, Jennifer Hegseth, reported roughly $1.55 million to $3.1 million in two rollover IRAs.\n\nThe household also reported three cash accounts, including one worth more than $1 million, and bitcoin valued at between roughly $16,000 and $65,000.\n\nBecause financial disclosures report assets in broad ranges rather than exact amounts, it is not possible to determine whether Hegseth\u2019s total wealth increased or decreased from a year earlier. His December 2024 nominee disclosure listed roughly $1.4 million to $3.4 million in financial assets. His new filing shows at least $3.1 million, but no comparable upper limit because one bank account is reported only as \"worth more than $1 million.\"\n\nThe clearest change is in cash. In Hegseth's 2024 filing, an account listed as \"U.S. bank #2\" held between $15,001 and $50,000.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:27 AM IST", "pub_date_relative": "16m ago"}, {"title": "Here's how to check your business credit score with Dun & Bradstreet", "full_content": "If you run a small business and plan to apply for a loan or line of credit, check your business credit score first. Yes, businesses have credit scores, too \u2014 and lenders may use them when evaluating your application.\n\nChecking your business credit report can give you a better sense of where your business stands and whether there are any errors you should address before applying for financing. Dun & Bradstreet , a credit reporting bureau that provides credit reports and scores for businesses, is one of the better-known sources. Other major business credit bureaus include Experian Business and Equifax Small Business.\n\nHere's how to check your business credit with Dun & Bradstreet.\n\nTo get your Dun & Bradstreet score, you need to first get your D-U-N-S number \u2014 it's a 9-digit number that identifies your Dun & Bradstreet business credit file. It's free to sign up for and you can do so on the Dun & Bradstreet website .\n\nThen, you'll sign up for D&B Credit Insights. There are four pricing plans that give you a different level of access to your credit profile:\n\nFree tier; Basic: $49/month; Plus: $149/month; Premium: $199/month\n\nDun & Bradstreet calculates several different types of scores for your business:\n\nSimilar to your personal credit score , you can improve your business credit score by making debt payments on time and in full, and requesting that your suppliers and vendors report your on-time payments to Dun & Bradstreet.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:26 AM IST", "pub_date_relative": "17m ago"}, {"title": "Bond yields keep rising. How income investors can best take advantage of the moves", "full_content": "As Treasury yields reach multiyear highs, income investors should employ these winning moves.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:21 AM IST", "pub_date_relative": "22m ago"}, {"title": "Oil prices settle up about 3% as Houthi attack on Saudi Arabia lifts supply fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 01:19 AM IST", "pub_date_relative": "24m ago"}, {"title": "KFC debuts Open House restaurant in Texas to test new customer experiences", "full_content": "KFC is debuting a restaurant concept, Open House, where it will test new offerings such as breakfast, late-night and table service, the company said in a release Thursday .\n\nExpanded menu offerings include breakfast items \u2014 a first for KFC \u2014 such as breakfast sandwiches, mini cronuts and hot and iced coffee. There will also be beverages, including boba refreshers, and new sides such as fried green beans and spicy pickles. Table service will be available, in addition to dual drive-thru lanes and self-ordering kiosks.\n\nThe brand will use the space to identify ideas for implementation in restaurants nationwide, particularly as it works to regain its market share .\n\n\"It gives guests a reason to try us, or try us again, while giving us a real restaurant where we can learn what works for guests, our teams and the business, and scale the strongest ideas across the system,\" Catherine Tan-Gillespie, president of KFC U.S., said in a news release.\n\nThe 3,400-square-foot space will open Sept. 26 in McKinney, Texas, with a celebration planned for Sunday.\n\nOpen House comes with broader rebranding effort from KFC, part of Yum Brands . The fast-food chain recently announced changes such as emphasizing boneless chicken and expanding sauce choices.\n\nThose initiatives come as the company adjusts to competition from other fast-food chicken chains . In August, QSR Magazine reported that KFC ranked fifth among U.S. fast-food chicken chains in sales, behind Chick-fil-A, Popeyes, Raising Cane's and Wingstop.\n\nIn Yum Brands' second-quarter earnings report, KFC saw a same-store sales growth rate of 2% . Its largest market is in China, where sales rose 6% in that period.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:17 AM IST", "pub_date_relative": "25m ago"}, {"title": "White House allows blocked reporters in after judge lifts Trump ban", "full_content": "The White House on Thursday began readmitting journalists from three media outlets \u2014 MS NOW, CNN and Politico \u2014 after a federal judge temporarily lifted President Donald Trump 's ban on those outlets.\n\nThe move came after Secret Service officers initially barred some journalists from those outlets from entering the White House earlier Thursday despite the order by Judge Timothy Kelly .\n\nKelly ordered Trump and other defendants in a lawsuit by the outlets reply to their new court filing notifying him of non-compliance with his temporary restraining order against the president's ban .\n\nThe White House's director of operations responded to Kelly with a declaration that said the White House had restored press passes to the affected outlets. The outlets by that time had begun reporting that their journalists were being admitted to the White House.\n\nKelly issued his restraining order, which will last for at least 14 days, late Wednesday night. It directed the White House to \"immediately\" restore access to the three outlets.\n\nThe outlets had been blocked from entering the White House since Saturday, a day after Trump announced his ban.\n\nThe president had initially said he was blocking the outlets from the White House because of \"cumulative stories\" that contained lies about him and his administration.\n\nThe outlets in their civil complaint said that statement by Trump, and subsequent ones, bolstered their claim that he was violating their First Amendment rights to a free press by targeting them for what they reported about him.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:16 AM IST", "pub_date_relative": "27m ago"}, {"title": "RedBird Capital to acquire majority stake in Puck at $250 million valuation, memo says", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 01:13 AM IST", "pub_date_relative": "30m ago"}, {"title": "Mutual fund inflows over 1 year: Which equity, debt and hybrid categories attracted money despite being in the red?", "full_content": "Mutual fund investors did not always put their money into categories that delivered the highest returns. In some categories, investors continued to add money despite negative returns, while others saw outflows even though they delivered positive returns.\n\nData for the 12 months ended August 2026 shows a mixed trend in net inflows across equity , debt and hybrid mutual fund categories, according to the latest Franklin Templeton India Mutual Fund report.\n\nSome categories attracted substantial inflows alongside positive returns; several others recorded outflows despite being in the green.\n\nHere is a look at the mutual fund categories that saw the highest inflows and outflows over the last 1 year, and how their category-average returns compare.\n\n*Source: Franklin Templeton India Mutual Fund Report for net inflows; Value Research for category-average returns as of 23 September 2026.\n\nFlexi-cap funds recorded the highest total inflows among equity categories at \u20b9 89,087 crore in the 12 months to August 2026. Small-cap funds and mid-cap funds followed with inflows of \u20b9 62,331 crore and \u20b9 61,016 crore, respectively.\n\nHowever, small-cap funds delivered the highest category-average return among the equity categories at 10.53%, followed by mid-cap funds at 6.66%.\n\nThe flow-return trend was not uniform. Large-cap funds attracted \u20b9 17,329 crore despite delivering a negative category-average return of 2.25%. In contrast, dividend yield funds saw an outflow of \u20b9 1,339 crore even though they posted a positive return of 0.11%.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 01:12 AM IST", "pub_date_relative": "30m ago"}, {"title": "Companies keep raising prices. The Fed is trying to get them to reconsider.", "full_content": "Inflation pressures have been so persistent this year in part because businesses have been able to pass along higher prices to consumers.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 01:12 AM IST", "pub_date_relative": "31m ago"}, {"title": "I\u2019m afraid of \u2018starving to death.\u2019 Social Security stopped our checks due to a hacked bank account. What can we do?", "full_content": "\u201cWe are relying on our church for our current needs.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 01:10 AM IST", "pub_date_relative": "33m ago"}, {"title": "SoftBank pays steep price for record bond sale to fund OpenAI bet", "full_content": "Masayoshi Son\u2019s group pays yields of up to 9.75% to raise more than $11bn in the largest junk bond offering on record", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 01:09 AM IST", "pub_date_relative": "34m ago"}, {"title": "Federal Reserve unveils proposed framework for stablecoin issuers", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 01:08 AM IST", "pub_date_relative": "35m ago"}, {"title": "New York sues Polymarket U.S., two months after filing lawsuit against Kalshi", "full_content": "New York State filed suit against Polymarket U.S. on Thursday, nearly two months after the state sued the platform's competitor, Kalshi.\n\n\"By skirting New York's laws, Polymarket is targeting the most vulnerable and depriving New York families of critical services and support,\" state Attorney General Letitia James said in a statement.\n\nThe lawsuit claims Polymarket operates an illegal gambling platform and is in violation of state gambling laws, including having no license with the New York State Gaming Commission. The lawsuit further claims Polymarket allows activity by users over 18 and cited a report from the state's Office of Addiction Services and Supports that those between 18 and 24 are at \"high-risk\" of gambling addictions.\n\n\"By running an unlicensed gambling operation, Polymarket has done more than just knowingly violate state law, they have put New Yorkers at risk, especially those underage who are most vulnerable to problem gaming,\" Governor Kathy Hochul said in a statement.\n\nThe lawsuit asks for penalties, including three times the amount of any Polymarket gains, and to pay $100,000 for each attempt or offer of \"sports wagering or mobile sports wagering\" in New York. The lawsuit also asks Polymarket U.S. to provide an account of all trades placed on the platform, the money lost by users and the amount Polymarket U.S. earned.\n\nPolymarket U.S. debuted in December 2025 and is regulated by the Commodity Futures Trading Commission, the federal agency that regulates prediction markets platforms. The company also runs an offshore predictions platform, which was founded in 2020. The CFTC didn't immediately respond to a request for comment.\n\nThe lawsuit is the latest in the escalating regulatory feud between states and the platforms. The CFTC has retaliated, suing several states and asserting it has the right to regulate the markets.\n\nPolymarket defended itself against the latest New York action.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:07 AM IST", "pub_date_relative": "35m ago"}, {"title": "Mach Natural Resources stock hits 52-week low at $10.46", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 01:05 AM IST", "pub_date_relative": "38m ago"}, {"title": "Agnc stock hits 52-week low at 9.63 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 01:04 AM IST", "pub_date_relative": "39m ago"}, {"title": "What must happen for Boeing stock to get unstuck. The company needs, at least, to do its part", "full_content": "Some of the headwinds facing the jetmaker \u2014 both in and out of its control \u2014 need to clear up.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:57 AM IST", "pub_date_relative": "46m ago"}], "cfa": [{"title": "Dow falls for a third day as bond yields hit fresh highs: Live updates", "full_content": "The Dow Jones Industrial Average fell for a third straight session on Thursday, as Treasury yields at multidecade highs continued to weigh on the most cyclical parts of the market.\n\nThe 30-stock index slid 161.61 points, or 0.31%, to 51,349.98. The S&P 500 ticked lower by 0.02% to 7,704.13. The Nasdaq Composite eked out a 0.01% gain to 26,939.37\n\nStocks came off their session lows after Reuters, citing sources, reported that U.S. and Iranian negotiators in New York are considering a deal that would bring a phased end to the conflict in the Middle East, whereby Iran would reopen the Strait of Hormuz and the U.S. would lift its economic blockade on Tehran.\n\nBut oil prices and bond yields remained elevated. Brent crude , the international benchmark, rose more than 3% to close above $106 per barrel. U.S. West Texas Intermediate futures climbed nearly as much to settle at about $95 per barrel.\n\nThe 30-year Treasury bond yield hit a high of 5.475%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.183%, near levels not reached since July 2007. The 2-year note yield rose to 4.914%.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a nearly 71% likelihood that the Federal Reserve lifts its key rate once more in October, per the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nYet, Wednesday's readings from S&P Global's manufacturing and services purchasing managers' indexes suggested that U.S. businesses are continuing to boom.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:42 AM IST", "pub_date_relative": "just now", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "MGM Resorts shares sink 11% after Barry Diller's People Inc. rescinds takeover offer", "full_content": "Barry Diller's People Inc. has rescinded its proposal to buy MGM Resorts International , sending shares of the casino giant down roughly 11% on Thursday.\n\nThe update comes nearly four months after Diller's company offered to purchase MGM Resorts for $48.30 per share. People Inc. already owns a roughly 26.1% stake in MGM.\n\nDiller, chairman of People Inc. \u2014 formerly known as IAC \u2014 attributed the decision to the complicated nature of the deal.\n\n\"There are lots of ingredients that go into a proposal of this kind on its way to completion,\" Diller said in the press release. \"We didn't feel the mix was coming together in the way we had hoped and have decided not to pursue taking the company private at this time.\"\n\nCNBC's David Faber reported Thursday that Diller backed off the deal in part because of the significant debt load it would have created for the company.\n\n\"We at People Incorporated remain open to and interested in the possibility of a strategic transaction with MGM Resorts and look forward to considering a range of alternatives,\" he said in the release.\n\nEarlier this week, shareholders of Caesars Entertainment approved an offer from billionaire Tilman Fertitta to acquire the casino company for $17.6 billion. Caesars shareholders will receive $31 per share in cash.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:41 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Oracle sends 'force majeure' notice about data center project \u2014 stock drops 3%", "full_content": "Oracle shares fell more than 3% on Thursday following news that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\n\"Project Jupiter remains on our planned schedule,\" Oracle said in a statement to CNBC. \"We are fully committed to New Mexico and confident in our path forward.\"\n\nBloomberg was first to report the news, citing sources familiar with the matter.\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it fails to come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital , CNBC confirmed. Blue Owl also saw its shares fall on Thursday.\n\n\"This notice does not change the financial commitments to this multi-year project,\" Blue Owl Capital said in a statement to CNBC.\n\nThe New Mexico data center project, which is part of the broader Stargate artificial intelligence infrastructure build-out with President Donald Trump , has been riddled with setbacks and regulatory hurdles.\n\nThat includes local opposition to data centers ahead of the upcoming midterm elections and concerns from environmental groups. The site has also faced delays with the buildout of a natural gas pipeline intended to fuel the facility.", "source": "CNBC World Economy", "pub_date_str": "25 Sep 2026, 01:30 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Pete Hegseth reports at least $3.1 million in cash, investments and bitcoin", "full_content": "Defense Secretary Pete Hegseth reported at least $3.1 million in cash, retirement investments and bitcoin in his newly released 2025 annual financial disclosure , including more than $1 million in cash held in a single bank account.\n\nThe Office of Government Ethics filing provides the latest look at the finances of the former firebrand Fox News host, who was confirmed as defense secretary in January 2025. Hegseth is facing calls to be impeached from members of his own party related to his handling of the war in Iran .\n\nThe disclosure lists five retirement accounts containing investments worth roughly $2.05 million to $4.35 million. Hegseth's three accounts accounted for about $500,000 to $1.25 million of that total, while his wife, Jennifer Hegseth, reported roughly $1.55 million to $3.1 million in two rollover IRAs.\n\nThe household also reported three cash accounts, including one worth more than $1 million, and bitcoin valued at between roughly $16,000 and $65,000.\n\nBecause financial disclosures report assets in broad ranges rather than exact amounts, it is not possible to determine whether Hegseth\u2019s total wealth increased or decreased from a year earlier. His December 2024 nominee disclosure listed roughly $1.4 million to $3.4 million in financial assets. His new filing shows at least $3.1 million, but no comparable upper limit because one bank account is reported only as \"worth more than $1 million.\"\n\nThe clearest change is in cash. In Hegseth's 2024 filing, an account listed as \"U.S. bank #2\" held between $15,001 and $50,000.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:27 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bond yields keep rising. How income investors can best take advantage of the moves", "full_content": "As Treasury yields reach multiyear highs, income investors should employ these winning moves.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:21 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "KFC debuts Open House restaurant in Texas to test new customer experiences", "full_content": "KFC is debuting a restaurant concept, Open House, where it will test new offerings such as breakfast, late-night and table service, the company said in a release Thursday .\n\nExpanded menu offerings include breakfast items \u2014 a first for KFC \u2014 such as breakfast sandwiches, mini cronuts and hot and iced coffee. There will also be beverages, including boba refreshers, and new sides such as fried green beans and spicy pickles. Table service will be available, in addition to dual drive-thru lanes and self-ordering kiosks.\n\nThe brand will use the space to identify ideas for implementation in restaurants nationwide, particularly as it works to regain its market share .\n\n\"It gives guests a reason to try us, or try us again, while giving us a real restaurant where we can learn what works for guests, our teams and the business, and scale the strongest ideas across the system,\" Catherine Tan-Gillespie, president of KFC U.S., said in a news release.\n\nThe 3,400-square-foot space will open Sept. 26 in McKinney, Texas, with a celebration planned for Sunday.\n\nOpen House comes with broader rebranding effort from KFC, part of Yum Brands . The fast-food chain recently announced changes such as emphasizing boneless chicken and expanding sauce choices.\n\nThose initiatives come as the company adjusts to competition from other fast-food chicken chains . In August, QSR Magazine reported that KFC ranked fifth among U.S. fast-food chicken chains in sales, behind Chick-fil-A, Popeyes, Raising Cane's and Wingstop.\n\nIn Yum Brands' second-quarter earnings report, KFC saw a same-store sales growth rate of 2% . Its largest market is in China, where sales rose 6% in that period.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:17 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "White House allows blocked reporters in after judge lifts Trump ban", "full_content": "The White House on Thursday began readmitting journalists from three media outlets \u2014 MS NOW, CNN and Politico \u2014 after a federal judge temporarily lifted President Donald Trump 's ban on those outlets.\n\nThe move came after Secret Service officers initially barred some journalists from those outlets from entering the White House earlier Thursday despite the order by Judge Timothy Kelly .\n\nKelly ordered Trump and other defendants in a lawsuit by the outlets reply to their new court filing notifying him of non-compliance with his temporary restraining order against the president's ban .\n\nThe White House's director of operations responded to Kelly with a declaration that said the White House had restored press passes to the affected outlets. The outlets by that time had begun reporting that their journalists were being admitted to the White House.\n\nKelly issued his restraining order, which will last for at least 14 days, late Wednesday night. It directed the White House to \"immediately\" restore access to the three outlets.\n\nThe outlets had been blocked from entering the White House since Saturday, a day after Trump announced his ban.\n\nThe president had initially said he was blocking the outlets from the White House because of \"cumulative stories\" that contained lies about him and his administration.\n\nThe outlets in their civil complaint said that statement by Trump, and subsequent ones, bolstered their claim that he was violating their First Amendment rights to a free press by targeting them for what they reported about him.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:16 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "RedBird Capital to acquire majority stake in Puck at $250 million valuation, memo says", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 01:13 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mutual fund inflows over 1 year: Which equity, debt and hybrid categories attracted money despite being in the red?", "full_content": "Mutual fund investors did not always put their money into categories that delivered the highest returns. In some categories, investors continued to add money despite negative returns, while others saw outflows even though they delivered positive returns.\n\nData for the 12 months ended August 2026 shows a mixed trend in net inflows across equity , debt and hybrid mutual fund categories, according to the latest Franklin Templeton India Mutual Fund report.\n\nSome categories attracted substantial inflows alongside positive returns; several others recorded outflows despite being in the green.\n\nHere is a look at the mutual fund categories that saw the highest inflows and outflows over the last 1 year, and how their category-average returns compare.\n\n*Source: Franklin Templeton India Mutual Fund Report for net inflows; Value Research for category-average returns as of 23 September 2026.\n\nFlexi-cap funds recorded the highest total inflows among equity categories at \u20b9 89,087 crore in the 12 months to August 2026. Small-cap funds and mid-cap funds followed with inflows of \u20b9 62,331 crore and \u20b9 61,016 crore, respectively.\n\nHowever, small-cap funds delivered the highest category-average return among the equity categories at 10.53%, followed by mid-cap funds at 6.66%.\n\nThe flow-return trend was not uniform. Large-cap funds attracted \u20b9 17,329 crore despite delivering a negative category-average return of 2.25%. In contrast, dividend yield funds saw an outflow of \u20b9 1,339 crore even though they posted a positive return of 0.11%.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 01:12 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Companies keep raising prices. The Fed is trying to get them to reconsider.", "full_content": "Inflation pressures have been so persistent this year in part because businesses have been able to pass along higher prices to consumers.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 01:12 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SoftBank pays steep price for record bond sale to fund OpenAI bet", "full_content": "Masayoshi Son\u2019s group pays yields of up to 9.75% to raise more than $11bn in the largest junk bond offering on record", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 01:09 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "New York sues Polymarket U.S., two months after filing lawsuit against Kalshi", "full_content": "New York State filed suit against Polymarket U.S. on Thursday, nearly two months after the state sued the platform's competitor, Kalshi.\n\n\"By skirting New York's laws, Polymarket is targeting the most vulnerable and depriving New York families of critical services and support,\" state Attorney General Letitia James said in a statement.\n\nThe lawsuit claims Polymarket operates an illegal gambling platform and is in violation of state gambling laws, including having no license with the New York State Gaming Commission. The lawsuit further claims Polymarket allows activity by users over 18 and cited a report from the state's Office of Addiction Services and Supports that those between 18 and 24 are at \"high-risk\" of gambling addictions.\n\n\"By running an unlicensed gambling operation, Polymarket has done more than just knowingly violate state law, they have put New Yorkers at risk, especially those underage who are most vulnerable to problem gaming,\" Governor Kathy Hochul said in a statement.\n\nThe lawsuit asks for penalties, including three times the amount of any Polymarket gains, and to pay $100,000 for each attempt or offer of \"sports wagering or mobile sports wagering\" in New York. The lawsuit also asks Polymarket U.S. to provide an account of all trades placed on the platform, the money lost by users and the amount Polymarket U.S. earned.\n\nPolymarket U.S. debuted in December 2025 and is regulated by the Commodity Futures Trading Commission, the federal agency that regulates prediction markets platforms. The company also runs an offshore predictions platform, which was founded in 2020. The CFTC didn't immediately respond to a request for comment.\n\nThe lawsuit is the latest in the escalating regulatory feud between states and the platforms. The CFTC has retaliated, suing several states and asserting it has the right to regulate the markets.\n\nPolymarket defended itself against the latest New York action.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:07 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Pioneer founder says Exxon \u2018set him up\u2019 after $60bn takeover", "full_content": "Shale oil magnate says supermajor launched \u2018smear campaign\u2019 to stop him joining company\u2019s board", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 12:57 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Banxico holds benchmark rate at 6.5% as core inflation proves sticky", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:56 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Treasury Rout Threatens Popular EM Carry Trade as Citi Pulls Back", "full_content": "(Bloomberg) -- The surge that sent US Treasury yields to the highest in decades is threatening carry trades that had become the go-to strategy for emerging-market investors this year.\n\nCitigroup Inc. closed its carry basket that included long positions in the South African rand, Mexican and Colombian pesos and Turkish lira against the Canadian dollar and Swiss franc. The move came after a strong US PMI report, a weak 5-year Treasury auction and geopolitical headlines stoked volatility in markets, according to a Thursday note.\n\n\u201cWe have shown in the past that carry typically does poorly during high volatility and high crowding periods,\u201d analysts wrote.\n\nThe so-called carry trade consists in borrowing in a low-interest-rate currency to invest in a higher-yielding one, profiting from the difference in rates. It\u2019s become popular this year, with carry trades funded by the US dollar on their longest quarterly winning run since 2008.\n\nBut concerns around global inflation fueled by higher oil prices are starting to force a rethink. A Bloomberg index measuring cumulative carry returns for eight major developing-nation currencies is set for its biggest monthly decline since March, down almost 1%. Favored currencies for the trade, like the Colombian and Mexican pesos, have underperformed since the Federal Reserve hiked interest rates last week, down by 6.6% and 2.6%, respectively.\n\nBank of America Corp. is among those turning increasingly cautious on developing-world currencies, warning that positioning is getting stretched.\n\n\u201cFor carry to keep performing, we need rates volatility to head lower and, ideally, US rates to remain range-bound,\u201d Raghav Adlakha, a strategist at Bank of America Corp, said in an interview. \u201cIf that happens alongside oil below $100, then the theme can come back.\u201d\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 12:52 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dow Jones bearish Marubozu tests 51,480 support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:48 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dollar ascends to fresh 2-month high on inflation worry, Fed hike expectations", "full_content": "NEW YORK, Sept 24 (Reuters) - The dollar hit a fresh two-month high on Thursday as Treasury yields rose and expectations of further Federal Reserve interest rate hikes strengthened after hawkish remarks from several central bank officials and solid economic data.\n\nTreasury yields continued to climb after sharp moves in the prior session, with the 30-year US bond yield at its highest since June 2004 and the benchmark 10-year note at its highest in nearly two decades following economic data that indicated a jump in business activity along with mounting price pressures.\n\nData on Thursday showed weekly initial jobless claims dipped by 1,000 to 197,000, below the 201,000 estimate of economists polled by Reuters, indicating a steadying labor market.\n\nAdding to inflation concerns, oil prices were up almost 4% in choppy trading after a Houthi missile attack on Saudi Arabia revived supply disruption fears, although gains eased on reports the US and Iran discussed reopening the Strait of Hormuz.\n\nSince the central bank's rate hike of 25 basis points last week to the 3.75%-4.00% range, several Federal Reserve officials have flagged the possibility of more rate increases if inflation does not moderate.\n\n\"We've got the two-year at the top of a post-2008 range, and we've got the 30s that are 22-year high, and the ten-year at a 19-year high. I don't think FX traders need to know too much more than that,\" said Joseph Trevisani, senior analyst at FXStreet in New York.\n\n\"The Fed knows that this is a supply shock for oil, they're looking beyond that, one of the things they're looking at is the projected growth from the economy in the third quarter.\"\n\nThe dollar index, which measures the greenback against a basket of currencies, was on track for a fourth straight daily advance as it rose 0.15% to 101.28 after hitting 101.39, its highest since July 29.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 12:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "30-year Treasury yield hits highest level since 2004 as bond market rout continues", "full_content": "U.S. Treasury yields continued their upward momentum after hitting a 19-year high on Wednesday.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US Federal Reserve\u2019s Anna Paulson sees scope for more interest rate hikes amid inflation risks", "full_content": "Philadelphia Federal Reserve President Anna Paulson indicated that additional interest rate hikes could be warranted to combat inflation. She stated that inflation remains persistently high, with underlying inflation at about 2.5 to 3%. Paulson characterized the US economy as relatively strong despite external pressures from tariffs and the Middle East conflict. Policymakers expect one further rate increase by the end of the year to manage inflation levels.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 12:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This stock\u2019s defensive appeal faces a valuation test. Here's where else investors can look", "full_content": "Investors looking for defensive stocks need to be wary. Best-of-breed companies can become pricey relative to other options.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "25 Sep 2026, 01:43 AM IST", "total_stories": 396};

            return;
        }

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
