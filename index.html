_date_relative": "1h ago"}, {"title": "US stocks: Nasdaq ends lower as oil prices surge ahead of earnings, economic data", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Nasdaq ends lower as oil prices surge ahead of earnings, economic data Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Nasdaq ends lower as oil prices surge ahead of earnings, economic data SECTIONS US stocks: Nasdaq ends lower as oil prices surge ahead of earnings, economic data Reuters Last Updated: Oct 13, 2026, 01:39:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Nasdaq composite index faced a downturn as oil prices surged following attacks on a Saudi airport. With major banks set to release their earnings reports, investor focus sharpens this week. The S&P 500 and Dow Jones saw mixed performances, while the energy sector thrived. Heightened inflation concerns due to rising oil costs have begun to sway investor confidence, mirroring a cautious market atmosphere tied to earnings and economic uncertainties.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 01:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Here's what personal loan lenders look for when you apply", "full_content": "If you're thinking about taking out a personal loan , it helps to know what lenders look for when reviewing your application.\n\nRequirements vary by lender, but factors like your credit score , income and existing debt can all play a role in whether you're approved. Here's what to know before you apply.\n\nLenders use your credit score and credit history to assess how likely you are to repay a loan. Generally, a higher credit score can make it easier to qualify for a personal loan and secure a lower interest rate.\n\nA FICO \u00ae Score of 580 to 669 is considered \u201cFair,\u201d but minimum credit score requirements vary by lender. For example, Upstart doesn't require a minimum credit score in most states , instead considering factors like income and employment history when evaluating applications. Still, borrowers with lower credit scores may face higher interest rates if approved.\n\nUpstart considers applicants with FICO Scores of 300 (the lowest possible) and those with insufficient credit history.\n\nWe like that Upstart considers factors besides credit score, including education, income and employment history. However, co-signers aren't accepted.\n\nIf your credit score could use some work, consider improving it before applying. Factors that affect your FICO Score include payment history, amounts owed, length of credit history, credit mix and new credit. Making payments on time, paying down credit card balances and keeping older accounts open when practical may help strengthen your credit profile over time.\n\nLenders want to make sure you have enough income to repay the loan. To verify your income, they may ask for documents like recent pay stubs, bank statements or tax returns.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 01:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "Centre & states to draft rules for existing arrest cases under GST", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Centre & states to draft rules for existing arrest cases under GST The Economic Times daily newspaper is available online now. Read Today's Paper Centre & states to draft rules for existing arrest cases under GST SECTIONS Centre & states to draft rules for existing arrest cases under GST ET Bureau Last Updated: Oct 13, 2026, 01:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Centre will collaborate with states to create standard procedures for handling arrest cases. Starting April 1, 2027, an invoice management system will be mandatory, minimizing human errors during digital matching. A quarterly review of GST refund risk assessment will also be implemented to maintain consistency across jurisdictions. The proposed changes aim to decriminalize several GST offences and decrease litigation for businesses.\n\nGST Council reforms address key industry concerns, focus shifts to implementation, says Dept of Revenue official\n\nGST reforms: What changes in compliance, input tax credit, refunds and litigation from 2027\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 01:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "Meta is back on the AI leaderboard with its new family of Wonder models", "full_content": "The company\u2019s stock was up more than 3% following the release of Muse Wonder and Muse Wonder Full, which analysts expect to drive new business opportunities.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 01:13 AM IST", "pub_date_relative": "2h ago"}, {"title": "IonQ to acquire cybersecurity firm Elisity in an all-stock deal for up to $1.3 billion", "full_content": "Quantum computing platform IonQ said on Monday it will acquire cybersecurity company Elisity in an all-stock deal worth up to $1.3 billion, including up to $150 million in performance-based earnouts.\n\nThe move is designed to defend against and uncover attackers targeting generative artificial intelligence large-language models and AI agents, and to protect against emerging quantum threats, the companies said in a press release .\n\nCEO Niccolo de Masi told CNBC's Morgan Brennan on Monday that the addition of Elisity's platform will help bolster his company's quantum security strategy.\n\n\"This means that we can protect not only critical infrastructure \u2014 we believe better than anyone in the world \u2014 but of course the Fortune 500,\" de Masi said.\n\nThe all-stock deal is expected to close in the fourth quarter, subject to regulatory approval, and would expand the quantum-computing company's cybersecurity portfolio.\n\nIonQ shares fell more than 9% in afternoon trading. Other quantum computing stocks, including Rigetti Computing and D-Wave Quantum , also traded lower.\n\nElisity will retain its current leadership, including CEO James Winebrenner.\n\nIonQ's stock has surged in recent months amid a buying spree. Most recently, the company bought semiconductor maker SkyWater Technology for $1.8 billion in July. In the past year and a half, IonQ has acquired several quantum companies, most notably U.K.-based quantum computing startup Oxford Ionics .", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 01:05 AM IST", "pub_date_relative": "2h ago"}, {"title": "Oil rallies, sending dollar higher on expectations of higher US rates", "full_content": "NEW YORK/MILAN, - Oil prices climbed on Monday as attacks on Saudi Arabia overshadowed hopes for supply improvements, and expectations for higher US interest rates to fight inflation drove the dollar higher on a narrowly mixed day for global stocks.\n\nThe action came after US President Donald Trump hailed fresh Russian diesel exports and a Russia-Ukraine energy ceasefire.\n\nThe dollar's rise in recent months has been driven in large part by expectations that high prices for energy and other goods will force the Federal Reserve to raise interest rates at a time when US growth is stronger than in other rich economies. This could expand the rate differentials that drive currency movements.\n\nWhile the US bond market was closed for the Columbus Day holiday, investors were cautiously waiting for September inflation data and the third-quarter earnings season, which begins on Tuesday with earnings from major US banks.\n\n\"There's a lot to be wary of,\" said Robert Pavlik, senior portfolio manager at Dakota Wealth Management. \"You're walking down a train line and you don't know, because it's dark, if a train is coming and so, you know, you're just being real careful right today.\"\n\nBesides the wait for earnings and economic data, Pavlik noted that stocks were also \"being kept in check because of higher oil\" and a lack of direction from the bond market, which tends to influence stocks and other assets.\n\nUS Treasury yields hit 24-year highs this month as high energy costs fueled concerns that inflation could stay elevated, keeping policymakers hawkish and pressuring equity valuations.\n\nOn Wall Street on Monday afternoon, the Dow Jones Industrial Average was up 0.3%, the S&P 500 was off 0.2% and the Nasdaq Composite was down 0.5%.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 01:01 AM IST", "pub_date_relative": "2h ago"}, {"title": "India draws $351 billion in greenfield FDI, outpaces China", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India draws $351 billion in greenfield FDI, outpaces China The Economic Times daily newspaper is available online now. Read Today's Paper India draws $351 billion in greenfield FDI, outpaces China SECTIONS India draws $351 billion in greenfield FDI, outpaces China By Sharmistha Mukherjee , ET Bureau Last Updated: Oct 13, 2026, 01:15:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Speaking to ET, Nikolaus Lang, managing director & senior partner at BCG highlighted the Indian market as the biggest draw for investors amid a sweeping global realignment. He, however, stressed on sustained focus on infrastructure development, skilling and cost competitiveness for India to further enhance its manufacturing footprint on a global scale.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 12:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "Wheat sowing faces heat from water shortage this winter", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Wheat sowing faces heat from water shortage this winter The Economic Times daily newspaper is available online now. Read Today's Paper Wheat sowing faces heat from water shortage this winter SECTIONS Wheat sowing faces heat from water shortage this winter By Jayashree Bhosale , ET Bureau Last Updated: Oct 13, 2026, 12:52:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Farmers in India are likely to reduce wheat planting this winter due to water scarcity and low minimum support prices. Regions such as Rajasthan, Gujarat, and Madhya Pradesh may see the most significant impact from these conditions. The state governments are encouraging farmers to consider crops that require less water, which may lead to a shift in crop choices.\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 12:52 AM IST", "pub_date_relative": "2h ago"}, {"title": "Demand for Crude Oil May Have Peaked Last Year, FGE Says", "full_content": "(Bloomberg) -- Demand for crude oil may have peaked in 2025, partly as higher need for fuels is increasingly met by biofuels, according to FGE NexantECA.\n\n\u201cThe world will keep consuming more liquids, but not necessarily more crude,\u201d Chairman Emeritus Fereidun Fesharaki and analyst Cuneyt Kazokoglu said in a report. Demand is increasingly being met by biofuels and hydrocarbons derived from processing natural gas, such as ethane.\n\nFGE NexantECA sees some oil demand lost after this year\u2019s Hormuz crisis disrupted flows through the key Middle East chokepoint. It notes the crisis came about six years after Covid, echoing the gap between the 1973 and 1979 oil shocks that led to lasting demand destruction in power generation.\n\nThis time around, road transport \u2014 which accounts for about 45% of global oil demand \u2014 is at the center of substitution, with electric vehicles eroding gasoline demand and beginning to hit diesel consumption.\n\nDemand in biofuels and natural gas liquids combined has grown faster than crude from 2019 to 2025, according to FGE NexantECA. All US oil demand growth since 2010 has come from ethane. Biofuels made up 10% of oil demand growth in the last decade and its role will increase as uptake by airlines and ships expand.\n\n\u201cJust like the 1970s, two big crises six years apart have shocked the oil market in the last decade,\u201d Fesharaki and Kazokoglu wrote. The trend \u201ccreates a growing challenge for refiners, upstream investment and OPEC policy.\u201d\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 12:45 AM IST", "pub_date_relative": "2h ago"}, {"title": "Katie Stockton says retail stocks could be primed for a counter-trend rally. These stocks may lead the bounce", "full_content": "Retail stocks are stabilizing following their recent correction.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:39 AM IST", "pub_date_relative": "2h ago"}, {"title": "Pickleball facility franchisor files for bankruptcy as founder acknowledges business mistake: 'I own it' - Fox Business", "full_content": "Pickleball facility franchisor files for bankruptcy as founder acknowledges business mistake: 'I own it' Fox Business Why Pickleball Clubs Are Closing: The Real, Brutal Math The Dink Pickleball The Picklr files for bankruptcy, plans reorganization Sports Business Journal The Picklr CEO Says \u2018That\u2019s on Us\u2019 After Fast-Growing Pickleball Chain Files for Bankruptcy Inc.com Indoor Pickleball Chain, The Picklr, Files for Bankruptcy as Rapid Growth Meets Costly Lease Obligations Holly Springs Update", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 12:36 AM IST", "pub_date_relative": "2h ago"}, {"title": "Assocham seeks review of bidders' qualificationfor transmission units", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Assocham seeks review of bidders' qualificationfor transmission units The Economic Times daily newspaper is available online now. Read Today's Paper Assocham seeks review of bidders' qualificationfor transmission units SECTIONS Assocham seeks review of bidders' qualificationfor transmission units By Shilpa Samant , ET Bureau Last Updated: Oct 13, 2026, 12:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Assocham has suggested that the ministry improve technical qualification requirements for companies involved in transmission projects. This proposal aims to ensure that only experienced developers participate in the bidding process. The current framework allows companies to qualify based on broad infrastructure experience, which may delay project execution. The association recommends that qualifications be tailored to project value, voltage class, and complexity.\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 12:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "Getty Images to File for Bankruptcy, Go Private In Restructuring Deal - The Hollywood Reporter", "full_content": "Getty Images to File for Bankruptcy, Go Private In Restructuring Deal The Hollywood Reporter Getty Images plans bankruptcy filing, to go private Reuters Getty Images to File for Bankruptcy, Go Private Via Koch Deal WSJ Koch, Getty Families Team Up to Take Getty Images Private in Bankruptcy Deal Bloomberg.com The Getty Family and Koch Equity Development Commit to Equity Investment of up to $533 Million in Getty Images, Reflecting Confidence in Long-Term Growth Potential Getty Images Newsroom", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 12:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Dividend, rights issue record date: Last chance to buy today to qualify for amount- Vedanta, TCS, Continental Controls", "full_content": "Dividends, rights issue record date: Shares of Vedanta Limited, Tata Consultancy Services , Continental Controls will remain in focus during Tuesday\u2019s trading session due to their corporate actions record dates. These three firms have announced dividends and rights issue.\n\nAll these three firms have fixed Wednesday, October 14, as the record date to determine eligibility of shareholders for dividend and rights issue. Additionally, Energy Infrastructure Trust has fixed Wednesday as record date for income distribution.\n\nAs the Indian stock market follows T+1 settlement cycle, investors must own a stock before record date to qualify for any corporate action. Hence, Tuesday, October 13, effectively becomes the last day for investors to buy these stocks and qualify for the payout.\n\nVedanta has announced an interim dividend of \u20b9 5 per equity share with a face value of Re 1 each. The company\u2019s dividend amounted to \u20b9 1,955 crore.\n\n\u201cWe wish to inform you that the Board of Directors of Vedanta Limited (the \u201cCompany\u201d), have, today i.e. October 08, 2026, approved the First Interim Dividend 2026-27 of \u20b9 5/- per equity share on face value of \u20b9 1/- per equity share for the Financial Year 2026-27 amounting to c. \u20b9 1,955 Crores,\u201d the company stated in its BSE filing. The company has fixed Wednesday, October 14, as the record date. Vedanta share price has fixed 0.47% higher at \u20b9 264.75 per share.\n\nThe IT services heavyweight has announced an interim dividend of \u20b9 12 per equity share with a face value of Re 1 each. The declared dividend will be paid to eligible shareholders on Friday, October 30, 2026.\n\n\u201cThe second interim dividend shall be paid on Friday, October 30, 2026, to the equity shareholders of the Company, whose names appear on the Register of Members or in the records of the Depositories as beneficial owners of the shares as on Wednesday, October 14, 2026, which is the Record Date fixed for this purpose,\u201d stated the firm in its BSE filing.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 12:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "UK announces \u00a31 billion in new commercial deals with India", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a UK announces \u00a31 billion in new commercial deals with India The Economic Times daily newspaper is available online now.
