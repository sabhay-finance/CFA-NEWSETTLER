<script>

    const allData = {"general": [{"title": "Meghalaya pension scheme: Why college teachers dispute the government's claim over the preparation of 2023 draft rules", "full_content": "The Meghalaya College Teachers\u2019 Association (MCTA) has categorically challenged the state Education Department\u2019s claim that teachers proposed the 2023 Draft Pension Scheme, stating that the document was prepared by the state government. Subsequently, it was shared with the association for suggestions. In order to back their claim, the association cited court records to support its position, as detailed in a recent report by The Shillong Times .\n\nIn a firm rebuttal to the department\u2019s clarification on the issue, the MCTA put forward the Meghalaya High Court\u2019s 20 September judgment in WP(C) Number 281 of 2017. It emphasised and highlighted Paragraph 2, which stated that a trust was created and a draft scheme was prepared by the state government before being handed over to the petitioner for their response, views and suggestions.\n\nThe association explained that the government had undertaken the task to prepare an acceptable pension scheme on 22 March 2023. Later, on 6 September 2023, the then Advocate General (AG) handed over the government-prepared draft rules to the MCTA in open court. Subsequently, the association submitted its suggestions on 5 October that year.\n\nThe association also touched upon and discussed the High Court\u2019s 15 December 2025 order that held that the state government was legally bound to notify the pension scheme.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 01:05 PM IST", "pub_date_relative": "6m ago"}, {"title": "Son claims a share in property inherited by his father: Supreme Court rejects his claim under Hindu Succession Act", "full_content": "Imagine a grandfather dies, leaving behind property that passes to his children. One of his sons receives a share, but later sells it. Can that son's own child challenge the sale, claiming that the property belonged to the family and that he acquired a share in it by birth?\n\nThis question came before the Supreme Court in a dispute involving a son who sought half the share in a property inherited by his father. The case examined the difference between ancestral coparcenary property and property inherited under the Hindu Succession Act, 1956.\n\nThe dispute concerned a 1,811-square-foot plot originally owned by N. Ramakrishnan.\n\nIn 1993, Ramakrishnan's daughter, G. Lalitha, filed a partition suit to divide his property among the legal heirs. A compromise was reached on 3 February 1994 under which his son, M. Kumaran, received the disputed plot.\n\nKumaran subsequently sold the property to two buyers through sale deeds dated 3 April and 17 April 1997.\n\nHowever, Kumaran's son, J. Rajesh, born on 6 January 1994, challenged the transaction. He sought a half share in the property, arguing that it was ancestral property and that he had acquired coparcenary rights by birth.\n\nA coparcener is a member of a Hindu undivided family who has a legal interest in coparcenary property, traditionally acquired by birth. The case was filed in 1997 in his name by his mother, who acted as his natural guardian.\n\nThe Chennai trial court initially granted a preliminary partition decree in Rajesh's favour. However, the appellate court reversed it, and the Madras High Court upheld that decision on 11 August 2010. Rajesh subsequently approached the Supreme Court.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 01:02 PM IST", "pub_date_relative": "10m ago"}, {"title": "Texas Instruments director Jean Hobby sells $2.7M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:01 PM IST", "pub_date_relative": "11m ago"}, {"title": "Talen Energy SVP Casulli sells $1.26M in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 01:01 PM IST", "pub_date_relative": "11m ago"}, { o Industries president Cira sells $1.59 million in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 12:46 PM IST", "pub_date_relative": "26m ago"}, {"title": "Eplus COO Darren Raiguel sells $419,379 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 12:46 PM IST", "pub_date_relative": "26m ago"}, {"title": "Analysis: Companies love a \u2018rockstar\u2019 CEO. Until they depend on one", "full_content": "When Jensen Huang quit, it struck me how quickly the conversation shifted from his departure to whether Nvidia could manage without him.\n\nIt wasn't about whether the company had the technology, customers or talent to keep growing, but whether anyone else could do what Huang had been doing for the business. That made me wonder: did investors believe in Nvidia, or just Huang?\n\nThe company is hardly short of capable people. Interim CEO and Chief Financial Officer Colette Kress has been with Nvidia since 2013. Nvidia has experienced engineers, established customer relationships and a leading position in the artificial intelligence chip market.\n\nBut, listening to guests on CNBC this week, I noticed how much of their concern was about the influence Huang had built outside Nvidia.\n\nOn Friday, just a day after Huang quit, Dylan Patel of SemiAnalysis told CNBC's \"Squawk Box Asia\" how Huang would persuade executives at smaller companies that make critical components to commit capacity to Nvidia. This helped it secure \"the majority of supply chain capacity,\" he said.\n\nWithout Huang, competitors could try to persuade those suppliers to allocate more capacity to them, Patel argued. And so the big question is, how much of Nvidia's advantage comes from its technology and how much comes from the relationships Huang built?\n\nThere are obvious benefits to elevating CEOs to be rockstars . They can attract investors, open doors and give a company a new identity. A charismatic leader attracts attention, reassures investors and makes a company's strategy easier to sell.\n\nHuang was particularly good at this. He helped shape the conversation about where AI was heading and made Nvidia central to it. Donning his trademark leather jacket, Huang took to stages around the world , courting world leaders to lay out his vision and explain why Nvidia would be at its center.", "source": "CNBC World Economy", "pub_date_str": "14 Nov 2026, 12:38 PM IST", "pub_date_relative": "33m ago"}, {"title": "Up 325% in 4 years! Multibagger brewery stock with 1:10 stock split history declares Q2 Results 2026; revenue up 203%", "full_content": "Multibagger brewery stock Asgard Alcobev shares will be in focus on Monday, November 16, after the brewery company announced a sharp improvement in its September-quarter performance, with revenue more than doubling and net profit rising over 14 times year-on-year.\n\nThe stock, which has delivered a multibagger 325% return over four years, also has a 1:10 stock split in its corporate-action history. Its latest results reflect the company's transition towards a brewing-led business following its acquisition of a controlling stake in CMJ Breweries in February 2026.\n\nAsgard Alcobev reported consolidated revenue from operations of \u20b9 48.93 crore in Q2 FY27, up 102.84% from \u20b9 24.12 crore in the corresponding quarter last year. Consolidated profit after tax (PAT) increased to \u20b9 2.55 crore from \u20b9 16.95 lakh, marking growth of 1,402.3%.\n\nEBITDA rose to \u20b9 7.33 crore from \u20b9 88.97 lakh a year earlier. Sequentially, EBITDA increased 42.31%, while its margin expanded to 14.98% from 9.71% in Q1 FY27, an improvement of 527 basis points. PAT grew 50.48% quarter-on-quarter.\n\nOperationally, production increased 18.6% sequentially to 13.82 lakh cases, while dispatches rose 14% to 13.58 lakh cases. Capacity utilisation improved to 78.6% from 63.1%. Can production climbed 67.7% to 4.99 lakh cases, accounting for 36.1% of total production.\n\nFor the first half of FY27, revenue stood at \u20b9 101.96 crore, up 125.17%, while PAT increased 416.08% to \u20b9 4.24 crore. Gross borrowings declined from \u20b9 72.54 crore as of March 31, 2026, to \u20b9 60.84 crore at the end of September.\n\nThe company clarified that its line of business changed from February 17, 2026, following its transition to brewing. Consequently, prior-year figures reflect the earlier business, and operating metrics are compared sequentially.\n\nManaging Director Ronak Jain said the quarter's performance reflected improvements in manufacturing operations and profitability following the company's transition to brewing.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 12:38 PM IST", "pub_date_relative": "33m ago"}, {"title": "Microsoft Outage: Tech Giant Says Consumer Products Services Fully Restored", "full_content": "The status page covered both its business and enterprise services under Microsoft 365 and its consumer products.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:35 PM IST", "pub_date_relative": "36m ago"}, {"title": "US Flights Grounded Highlights: Nationwide Shutdown Lifted, Officials Assure 'No Threat To Public'", "full_content": "", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:32 PM IST", "pub_date_relative": "39m ago"}, {"title": "Ramayana Vs Dhurandhar 2 Box Office: Ranbir Kapoor's Film Crosses Rs 1,100 Crore, But Trails Ranveer Singh-Starrer", "full_content": "Ramayana entered the Rs 500 crore club in seven days, trailing Dhurandhar 2, which achieved the milestone in just six days.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:31 PM IST", "pub_date_relative": "40m ago"}, {"title": "Nvidia Shareholders Push For Slow, Measured CEO Search; Urge To Consider Huang's Potential Return", "full_content": "Nvidia shareholders and US-based Investment firms Altimeter and Atreides Management urged Nvidia Board to pursue a slow, measured, and deliberate process regarding the future leadership of Nvidia that leaves all options on the table, including the potential return of Jensen Huang.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:25 PM IST", "pub_date_relative": "47m ago"}, {"title": "Sukanya Samriddhi Yojana Partial Withdrawal Rules: When Can You Exercise 50% Limit; What Happens To Remaining Balance?", "full_content": "The scheme aims to help parents build savings for their daughters' future, especially for higher education and marriage.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stranded After Flight Cancellation By FAA? Here\u2019s What The Airline Owes You", "full_content": "Under the regulation established by the US Department of Transportation (DOT), passengers are entitled to certain protections when their flights are cancelled.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "India vs Bhutan Live Streaming: When And Where To Watch SAFF Championship 2026 Semi-Final", "full_content": "Here is everything you need to know about the India vs Bhutan SAFF Championship 2026 semi-final, including the live streaming details.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rekha Jhunjhunwala stock VA Tech Wabag: \u20b92,400 cr Saudi project cancelled - Should you buy after 18% rise in 6 months?", "full_content": "Pranati Deva Published 14 Nov 2026, 11:53 AM IST Prefer Livemint on Google Rekha Jhunjhunwala portfolio stock VA Tech Wabag shares are likely to remain in focus on Monday, November 16, after the company disclosed that a major desalination project in Saudi Arabia, valued at approximately \u20b9 2,400 crore, had been cancelled by the customer, Saudi Water Authority, citing internal reasons.\n\nRekha Jhunjhunwala holds an 8.0% stake in VA Tech Wabag Ltd as of September 2026.\n\nThe shares ended 2% lower at \u20b9 2,040.10 apiece on the BSE on Friday. The stock had touched a 52-week high of \u20b9 2,320 in September 2026 and a 52-week low of \u20b9 1,033.95 in January 2026. Despite the recent decline, it has gained 3.5% in one month, 8% in three months, 48% in six months, 45% in one year and 506% over five years.\n\nIn an exchange filing on Saturday, November 14, VA Tech Wabag said it had received the award in July 2025 to execute a 300 million litres per day (MLD) mega seawater desalination plant at Yanbu, Saudi Arabia. Following the award, the company completed the required formalities and executed the contract, which was submitted to the customer for counter-signature and formal commencement of the project.\n\nHowever, Saudi Water Authority subsequently notified all tender participants through the Kingdom's Etimad electronic government procurement and tendering platform that the tender had been cancelled due to internal reasons attributable to the customer.\n\nWabag said it was approaching the authority to obtain further clarity on the reasons for the cancellation and determine the next course of action.\n\nThe project covered the design, engineering, supply, construction and commissioning of a 300 MLD desalination facility at Yanbu on Saudi Arabia's west coast.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 11:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia Shares Crash 13% In A Week, Wiping Out $573 Billion As Jensen Huang Exits", "full_content": "Nvidia fell 13% this week, erasing more than $573 billion in value as its co-founder Jensen Huang resigned.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Germany Has an Edge in a Lower Oil Price World: Taking Stock", "full_content": "The German stock market has a lot going for it right now, with lower oil prices and a broadening rally from software to chemicals and consumer stocks powering the country\u2019s shares.\n\nAfter underperforming most European and benchmarks in 2026, the DAX has rallied 6% to a record high this quarter. Falling oil prices have done most of the heavy lifting, benefiting the energy-intensive firms that make up about a third of the index. The scare in the artificial intelligence trade has been a boon for software stocks such as S SE, which accounts for about 12% of the DAX\u2019s weight.\n\n\u201cThe DAX has benefited from its cyclical sector mix, particularly its high technology exposure, where the combination of software and hardware has provided some protection,\u201d said Deutsche Bank AG strategist Carolin Raab. \u201cThe relatively low exposure to traditional energy and basic resources has also helped.\u201d\n\nThe rally has been broadening fast, with about 80% of DAX members trading above their 200-day moving average and 18% making fresh 52-week highs just this week. Only the ultra-defensive Swiss SMI is seeing stronger momentum among major European benchmarks. In last month\u2019s Bank of America Corp. fund manager survey, Germany was the second-most preferred market in Europe, with a net 16% of investors intending to overweight its stocks in the next year.\n\nBloomberg Intelligence strategists led by Laurent Douillet said local conditions have historically had little influence over the DAX, given that its members generate only 15% of sales domestically. That relationship now appears to be changing, with US and German PMIs becoming more significant at the expense of Chinese indicators.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi AQI Hits 350; Ministers Order 50% Work From Home Amid PM 2.5 Spike", "full_content": "The decision aims to help control vehicular emissions, responsible for nearly 50% local air pollution in the national capital.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "6 out of 10 top performing largecap stocks in November delivered multibagger returns in long run. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 6 out of 10 top performing largecap stocks in November delivered multibagger returns in long run. Do you own any? Written by Debaroti Adhikary , ETMarkets.com | Nov 14, 2026, 11:40:38 AM IST 1 / 11 \u200bTop Performers The Indian stock market has seen a stellar rebound in November, with Sensex soaring over 7,000 points and Nifty rallying more than 9% in just the first half of the month as a sharp surge in FII buying following months of selloff, along with other factors boosted investor sentiment on Dalal Street. One of the key trends noticeable during this bull attack was the outperformance of the largecaps over midcaps and smallcaps. During the same period of time, Nifty Midcap 100 and Nifty Smallcap 250 indices gained 7-8%. Here are the 10 largecap stocks that recorded the biggest jump in November so far, including six who have delivered multibagger returns in the longer run.\n\nShriram Finance shares recorded the sharpest gains among all the largecap stocks in November so far, jumping nearly 22%. The shares of the non banking financial company dropped 2% in a month and 5% in 2026 so far, but gained over 19% in one year. In the longer term, the stock delivered multibagger returns of 147% in three years and 199% in five years.\n\nMuthoot Finance followed, rising more than 21% in November so far. The shares of the gold loan provider dropped over 1% in a week but gained 8% in a month, although they remain 26% down in 2026 so far. In the longer term, the stock delivered multibagger returns of over 120% in three years and gained 68% in five years.\n\nAlso read | MSCI rejig: Which stocks may see the biggest inflows & outflows?\n\nMahindra & Mahindra (M&M) shares gained 20% so far this month, ranking third among all the largecap stocks with highest returns in the first half of November.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ecuador wants to monetize its biodiversity \u2014 while still drilling for oil", "full_content": "Ecuador, known for its \" megadiverse \" Galapagos Islands, Amazon rainforest, Andes and Pacific coast, wants to protect its natural landscapes for years to come \u2014 but it faces a tricky balancing act.\n\nAs well as preserving its nature, the South American country also plans to capitalize on its critical minerals and continue to extract oil from parts of the Amazon \u2014 both of which have led to protests from Indigenous and environmental groups.\n\nOne way Ecuador is planning to channel funds into its nature is via new financial tools, such as \"debt-for-nature\" swaps and its first sovereign green bond. It is also aiming to raise its environmental profile on the global stage by hosting the U.N.'s biodiversity summit , known as COP18, in 2028.\n\nEcuador, which uses the U.S. dollar, is no stranger to green finance. In March, IDB Invest, the private-sector arm of the Inter-American Development Bank, and Ecuadorian lender Banco Bolivariano issued a $120 million biodiversity bond to back conservation projects. The government also completed two swaps in 2023 and 2024 \u2014 deals in which a country's debt is refinanced on better terms in exchange for commitments to spend the savings on conservation. Together, they freed up about $1.1 billion for conservation in the Amazon and Galapagos Islands .\n\nJuan Carlos Blum, Ecuador's minister of environment and energy, said the country hopes to issue sovereign green bonds for the first time in 2027, to raise finance to protect its coastal and mountainous regions and the people whose livelihoods depend on them. The government is looking to the European Union for advice on such instruments, he said. The bloc set green bond standards in 2024.\n\nFor Blum, one of the challenges is public awareness.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "OPS pension denied after switching universities: How retired professor won legal battle in Karnataka High Court?", "full_content": "A change of employer towards the later part of a career can create uncertainty over retirement benefits, particularly when an employee moves between institutions governed by different service conditions.\n\nThis became a pension dispute for a Karnataka university professor who spent nearly 28 years in academic service but was denied pension under the Old Pension Scheme after his appointment to another university.\n\nThe dispute reached the Karnataka High Court after the state government challenged an earlier order directing it to release his pensionary benefits. Here\u2019s what happened and how a former Karnataka University professor won his pension battle.\n\nChidananda Reddy S. Patil joined Karnataka University, Dharwad, as a lecturer on 14 March 1996 through regular recruitment. He subsequently progressed to the position of Associate Professor.\n\nIn 2013, he applied for the post of Professor at Karnataka State Law University, Hubballi, through his existing employer and with its permission. Following his selection, he moved to the new university on 16 July 2013.\n\nHis resignation from Karnatak University was accepted as a technical resignation under Rule 252(b) of the Karnataka Civil Services Rules (KCSR). A technical resignation is a formal resignation used to facilitate an employee's move to another eligible post without automatically treating the move as a complete break in service for applicable service benefits.\n\nHe continued working at Karnataka State Law University until his retirement on 31 December 2024, after nearly 28 years of academic service.\n\nThe dispute arose because the state did not agree to count his 1996\u20132013 service at Karnatak University towards his pension eligibility.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 11:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u20b94K cr Ramayana movie VFX maker parent Prime Focus shares in focus after 14x profit jump in Q2; stock up 61% in a year", "full_content": "Pranati Deva Published 14 Nov 2026, 11:21 AM IST Prefer Livemint on Google Prime Focus Ltd, the parent company of visual effects and animation studio DNEG, is likely to remain in focus on Monday after announcing its September-quarter results late on Friday. The company, associated with the visual effects work for Ranbir Kapoor-starrer Ramayana, reported a sharp rise in consolidated profit and revenue for Q2 FY27, supported by demand for visual effects services.\n\nThe results come amid heightened attention on the company's stock following the film's release. Despite the buzz around the project and its box-office performance, Prime Focus shares have come under pressure in recent sessions.\n\nPrime Focus shares have fallen around 11% since the film's release and are trading more than 26% below their 52-week high. The stock ended at \u20b9 270 on Friday, November 13, down 1.7%. It has declined 5% in one week and 3% over the past month. The shares are down 2% over six months, but have gained 19.29% year-to-date and 61% over one year. Over five years, the stock has delivered multibagger returns of 244%.\n\nThe film emerged as Ranbir Kapoor's biggest opening ever, collecting more than \u20b9 1,000 crore worldwide so far, according to Sacnilk. In India, Ramayana opened with a net collection of \u20b9 64.85 crore, setting a record for Kapoor. However, the opening was below the \u20b9 86.75 crore recorded by Prabhas-starrer Adipurush.\n\nProfit booking has been cited as one reason for the post-release weakness. Prime Focus shares had more than doubled over the preceding year amid excitement around Ramayana and gained another 13% in the two weeks before its release. Both the stock and the wider entertainment sector declined on the film's release day.\n\nThe project's scale has also drawn attention.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 11:21 AM IST", "pub_date_relative": "1h ago"}, {"title": "Behind Jensen Huang\u2019s spy scandal, a shadow war for Trump\u2019s ear on China - The Washington Post", "full_content": "Behind Jensen Huang\u2019s spy scandal, a shadow war for Trump\u2019s ear on China The Washington Post Nvidia\u2019s week of chaos, explained CNN Nvidia\u2019s cult of personality was bound to end badly Financial Times EXCLUSIVE: Former Nvidia CEO Huang had a relationship with a second employee, sources say Reuters Silicon Valley plots Jensen Huang\u2019s comeback Politico", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 11:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "India's Troika Of Good Luck | Joining The Dots", "full_content": "Thirty-five days ago, India was unloved, Huang was untouchable and inflation was contained. A week, it turns out, is long enough to change all three.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 11:06 AM IST", "pub_date_relative": "2h ago"}, {"title": "Uber Discloses Data Breach Involving Third-Party Vendor Fireworks AI, Exposing Personal Information", "full_content": "The probe confirmed compromised credentials exposed Uber data, including US drivers\u2019 licence details. While exact totals remain undisclosed, filings across multiple US states suggest thousands of people were likely impacted.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 11:05 AM IST", "pub_date_relative": "2h ago"}, {"title": "India Well On Track To Achieve $1 Trillion Target For Exports This Fiscal: Goyal", "full_content": "Goyal highlighted that India had recorded an all-time high exports of nearly USD 90 billion in October 2026, comprising approximately USD 50 billion in merchandise exports and USD 40 billion in services exports.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 11:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "8th Pay Commission: Will central government salaries and pensions be revised every 5 years? What employee unions demand", "full_content": "The 8th Pay Commission was constituted on 3 November 2025. It is a temporary 3-member commission headed by Justice Ranjana Prakash Desai. The commission was initially given 18 months to table its final report to the central government, as per the commission's terms of reference (ToR).\n\nThe objective of the 8th Pay Commission is primarily to listen to the grievances, views, and ideas of eligible unions and associations and then make a decision on the new fitment factor, allowances, salary and pension revisions, along with a host of other associated aspects.\n\nNow, among the numerous demands listed by prominent unions and associations in their official memoranda, one of the most important ones is that eligible employee unions propose revising salaries and pensions every 5 years rather than 10.\n\nIf this demand is accepted and implemented, central government employees and pensioners might not have to wait a decade for their next pay revision. This demand has been made by several prominent employee unions and associations after consideration of basic factors such as rising inflation, day-to-day expenses, living costs, and rapidly changing economic conditions, which collectively warrant an earlier revision, as these factors are eroding the purchasing power of serving central government employees and pensioners.\n\nFor these core reasons only, the request to revise salaries every 5 years is urged, rather than every 10. Furthermore, a shorter revision cycle, as per the unions, will be of immense help, as it can ensure that the salaries and pensions of serving employees remain aligned with fundamentals and economic realities.\n\nProminent employee unions and associations have put forward different demands regarding the reduction of the 10-year revision cycle.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 10:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "FICCI calls for comprehensive India-Africa trade framework", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a FICCI calls for comprehensive India-Africa trade framework The Economic Times daily newspaper is available online now. Read Today's Paper FICCI calls for comprehensive India-Africa trade framework SECTIONS FICCI calls for comprehensive India-Africa trade framework PTI Last Updated: Nov 14, 2026, 10:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India and Africa are encouraged to develop a comprehensive trade arrangement to enhance economic cooperation. Ficci emphasizes the importance of a predictable framework to address trade barriers and promote investment. With the upcoming visit of Commerce Minister Piyush Goyal to Egypt, both regions aim to strengthen ties. Egypt's strategic location provides opportunities for Indian companies in various sectors.\n\nHow India\u2019s INR22.5 lakh crore gold loan boom is hiding a big hole\n\nKYC and KYB: Pidilite's margin keeps finding its way back, though costlier raw materials can knock it off course \u2013 Part 2 of 3\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "14 Nov 2026, 10:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "Amtrak Booking System Faces Glitches Amid Nationwide Flight Disruptions", "full_content": "Amtrak faced significant booking and service disruptions starting before 5 pm on Friday, peaking around 6 pm. Users attempting to access its website, mobile app, and customer service channels were met with an \"unknown error\" message.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 10:46 AM IST", "pub_date_relative": "2h ago"}, {"title": "Was It Really the Affair? The 'Secret Memo' That Complicates The Story Of Jensen Huang's Nvidia Exit", "full_content": "Huang's argument to Washington was straightforward. Keep selling to China and Chinese companies would keep building on American technology. Cut them off and they would have a reason to build their own.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 10:45 AM IST", "pub_date_relative": "2h ago"}, {"title": "Ramayana Language Row: NCP Leader Questions Marathi\u2019s Exclusion, Demands Marathi Dub And Re-Release", "full_content": "Patil argued that as Maharashtra is a major theatrical market, Marathi audiences deserve to watch the film in their mother tongue. He clarified the demand isn't against other languages, but aims for equal respect and representation.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 10:43 AM IST", "pub_date_relative": "2h ago"}, {"title": "FAA lifts ground stop after more than four hours, but flight cancellations will stretch into the weekend", "full_content": "The U.S. halted flight departures across the country for hours on Friday for the second time since 9/11, blaming aging technology that was overloaded, affecting key information for multiple air traffic control centers.\n\nMore than 10,000 flights were disrupted during the nationwide ground stop, and delays and cancellations were set to stretch into the weekend, if not longer.\n\nTransportation Secretary Sean Duffy said at a press conference late Friday that that telecommunications routers were overloaded with data. \"They went down,\" he said.\n\nHomeland Security Secretary Markwayne Mullin said Friday at the White House that there was no indication that the issues were a threat to the United States. He later said at a press conference that it doesn't appear to be a cyber attack, and that it \"appears this was mechanically driven.\"\n\nThe Federal Aviation Administration canceled the ground stop at 8:15 p.m. ET Friday after it lasted formore than four hours and disrupted the travel plans of hundreds of thousands of travelers, including some sports teams.\n\nThe agency earlier said in post on X that there was a \"temporary telecommunications outage\" and that it halted flights out of an \"abundance of caution.\"\n\nWhen it issued the ground stop at about 4 p.m., the FAA said the communications issues were \"impacting multiple Air Route Traffic Control Centers.\" These facilities guide airplanes at high altitudes along their routes.\n\nWhile the FAA lifted the ground stop, travel chaos continued at airports, which were forced to find places for parked planes. Delays were set to continue even as flights start taking off again.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 10:38 AM IST", "pub_date_relative": "2h ago"}, {"title": "12 ITIs In Uttarakhand To Be Reopened For Students To Seek Technical Education in Rural Areas", "full_content": "Twelve non-operational government industrial training institutes (ITIs) will reopen from the next academic session in Uttarakhand", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 10:38 AM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic IPO buyers have more influence on price than SpaceX", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Anthropic IPO buyers have more influence on price than SpaceX Powered By The Economic Tim pub_date_relative": "2h ago"}, {"title": "Treat prediction markets like futures trading", "full_content": "Critics say these sites are just a form of gambling \u2014 but they said that about the Chicago Board of Trade too", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "China\u2019s beaten-down tech stocks could offer AI with a little less drama", "full_content": "Opportunities in China lie as much in the picks and shovels of the AI supply chain", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "How bonds got interesting again", "full_content": "Despite the short-term volatility, for those approaching retirement, fixed income products are not the rank outsider they used to be", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "What Europe\u2019s rising public debt means for your portfolio", "full_content": "How do you invest when hard-up governments are looking for cuts and tax raids?", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Around 600% jump in 5 years: Citi maintains 'buy' on Maharatna defence PSU HAL for up to 28% - Check target, rationale", "full_content": "Pranati Deva Published 14 Nov 2026, 10:28 AM IST Prefer Livemint on Google Hindustan Aeronautics Ltd (HAL) shares have recently faced selling pressure, with the Maharatna defence public sector undertaking (PSU) stock declining 3.5% in one week, 1% in one month and 3% in three months. However, the stock remained in positive territory over longer periods, gaining 4% in six months and 1% in one year. It also delivered multibagger returns of around 600% over five years.\n\nIn the previous trading session, HAL shares fell 0.7% to close at \u20b9 4,809.80. Despite the recent weakness, international brokerage Citi maintained its bullish stance on the defence major, retaining its 'Buy' rating and target price of \u20b9 6,175 per share. The target indicated an upside potential of around 28% from the previous close.\n\nCiti said HAL's Q2 revenue was in line with its estimates, although EBITDA missed expectations due to weaker gross margins. The brokerage added that the company's engines, helicopters and repair work helped offset the delayed Mk1A ramp-up. HAL's inventory also increased 39% year-on-year (YoY), signalling rising preparedness for execution, according to the report.\n\nThe Maharatna central public sector enterprise reported its financial results for the July-September quarter during market hours on Thursday.\n\nHAL posted a 16% YoY increase in consolidated profit after tax (PAT) to \u20b9 1,935.64 crore in the second quarter of FY27 , compared with \u20b9 1,669.05 crore in the corresponding quarter of the previous financial year.\n\nThe defence major's revenue from operations rose nearly 15% YoY to \u20b9 7,613.25 crore in Q2 FY27, against \u20b9 6,628.61 crore reported in the year-ago period. Expenses, meanwhile, increased around 16% YoY to \u20b9 6,132 crore during the quarter under review.\n\nWhile revenue growth remained in line with Citi's estimates, the brokerage flagged weaker gross margins as the reason for the EBITDA shortfall.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 10:28 AM IST", "pub_date_relative": "2h ago"}, {"title": "Ari Emanuel Blames FAA Issues On Pete Buttigieg - Deadline", "full_content": "Ari Emanuel Blames FAA Issues On Pete Buttigieg Deadline EXCLUSIVE: Trump's FAA touts new AI-powered tool helping thousands of passengers avoid flight delays Fox News AI company behind FAA\u2019s SMART tool denies link to ground stop, Duffy confirms The Hill FAA ground stop raises questions after rollout of new AI air-traffic system KCRA Of Course Americans Blamed the Ground Stop on AI The Atlantic", "source": "Google News Business", "pub_date_str": "14 Nov 2026, 10:25 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Meghalaya pension scheme: Why college teachers dispute the government's claim over the preparation of 2023 draft rules", "full_content": "The Meghalaya College Teachers\u2019 Association (MCTA) has categorically challenged the state Education Department\u2019s claim that teachers proposed the 2023 Draft Pension Scheme, stating that the document was prepared by the state government. Subsequently, it was shared with the association for suggestions. In order to back their claim, the association cited court records to support its position, as detailed in a recent report by The Shillong Times .\n\nIn a firm rebuttal to the department\u2019s clarification on the issue, the MCTA put forward the Meghalaya High Court\u2019s 20 September judgment in WP(C) Number 281 of 2017. It emphasised and highlighted Paragraph 2, which stated that a trust was created and a draft scheme was prepared by the state government before being handed over to the petitioner for their response, views and suggestions.\n\nThe association explained that the government had undertaken the task to prepare an acceptable pension scheme on 22 March 2023. Later, on 6 September 2023, the then Advocate General (AG) handed over the government-prepared draft rules to the MCTA in open court. Subsequently, the association submitted its suggestions on 5 October that year.\n\nThe association also touched upon and discussed the High Court\u2019s 15 December 2025 order that held that the state government was legally bound to notify the pension scheme.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 01:05 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Viyash Q2 FY27 slides: revenue up 16%, margin expansion continues", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Nov 2026, 12:57 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Up 325% in 4 years! Multibagger brewery stock with 1:10 stock split history declares Q2 Results 2026; revenue up 203%", "full_content": "Multibagger brewery stock Asgard Alcobev shares will be in focus on Monday, November 16, after the brewery company announced a sharp improvement in its September-quarter performance, with revenue more than doubling and net profit rising over 14 times year-on-year.\n\nThe stock, which has delivered a multibagger 325% return over four years, also has a 1:10 stock split in its corporate-action history. Its latest results reflect the company's transition towards a brewing-led business following its acquisition of a controlling stake in CMJ Breweries in February 2026.\n\nAsgard Alcobev reported consolidated revenue from operations of \u20b9 48.93 crore in Q2 FY27, up 102.84% from \u20b9 24.12 crore in the corresponding quarter last year. Consolidated profit after tax (PAT) increased to \u20b9 2.55 crore from \u20b9 16.95 lakh, marking growth of 1,402.3%.\n\nEBITDA rose to \u20b9 7.33 crore from \u20b9 88.97 lakh a year earlier. Sequentially, EBITDA increased 42.31%, while its margin expanded to 14.98% from 9.71% in Q1 FY27, an improvement of 527 basis points. PAT grew 50.48% quarter-on-quarter.\n\nOperationally, production increased 18.6% sequentially to 13.82 lakh cases, while dispatches rose 14% to 13.58 lakh cases. Capacity utilisation improved to 78.6% from 63.1%. Can production climbed 67.7% to 4.99 lakh cases, accounting for 36.1% of total production.\n\nFor the first half of FY27, revenue stood at \u20b9 101.96 crore, up 125.17%, while PAT increased 416.08% to \u20b9 4.24 crore. Gross borrowings declined from \u20b9 72.54 crore as of March 31, 2026, to \u20b9 60.84 crore at the end of September.\n\nThe company clarified that its line of business changed from February 17, 2026, following its transition to brewing. Consequently, prior-year figures reflect the earlier business, and operating metrics are compared sequentially.\n\nManaging Director Ronak Jain said the quarter's performance reflected improvements in manufacturing operations and profitability following the company's transition to brewing.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 12:38 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia Shareholders Push For Slow, Measured CEO Search; Urge To Consider Huang's Potential Return", "full_content": "Nvidia shareholders and US-based Investment firms Altimeter and Atreides Management urged Nvidia Board to pursue a slow, measured, and deliberate process regarding the future leadership of Nvidia that leaves all options on the table, including the potential return of Jensen Huang.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 12:25 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Rekha Jhunjhunwala stock VA Tech Wabag: \u20b92,400 cr Saudi project cancelled - Should you buy after 18% rise in 6 months?", "full_content": "Pranati Deva Published 14 Nov 2026, 11:53 AM IST Prefer Livemint on Google Rekha Jhunjhunwala portfolio stock VA Tech Wabag shares are likely to remain in focus on Monday, November 16, after the company disclosed that a major desalination project in Saudi Arabia, valued at approximately \u20b9 2,400 crore, had been cancelled by the customer, Saudi Water Authority, citing internal reasons.\n\nRekha Jhunjhunwala holds an 8.0% stake in VA Tech Wabag Ltd as of September 2026.\n\nThe shares ended 2% lower at \u20b9 2,040.10 apiece on the BSE on Friday. The stock had touched a 52-week high of \u20b9 2,320 in September 2026 and a 52-week low of \u20b9 1,033.95 in January 2026. Despite the recent decline, it has gained 3.5% in one month, 8% in three months, 48% in six months, 45% in one year and 506% over five years.\n\nIn an exchange filing on Saturday, November 14, VA Tech Wabag said it had received the award in July 2025 to execute a 300 million litres per day (MLD) mega seawater desalination plant at Yanbu, Saudi Arabia. Following the award, the company completed the required formalities and executed the contract, which was submitted to the customer for counter-signature and formal commencement of the project.\n\nHowever, Saudi Water Authority subsequently notified all tender participants through the Kingdom's Etimad electronic government procurement and tendering platform that the tender had been cancelled due to internal reasons attributable to the customer.\n\nWabag said it was approaching the authority to obtain further clarity on the reasons for the cancellation and determine the next course of action.\n\nThe project covered the design, engineering, supply, construction and commissioning of a 300 MLD desalination facility at Yanbu on Saudi Arabia's west coast.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 11:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Germany Has an Edge in a Lower Oil Price World: Taking Stock", "full_content": "The German stock market has a lot going for it right now, with lower oil prices and a broadening rally from software to chemicals and consumer stocks powering the country\u2019s shares.\n\nAfter underperforming most European and benchmarks in 2026, the DAX has rallied 6% to a record high this quarter. Falling oil prices have done most of the heavy lifting, benefiting the energy-intensive firms that make up about a third of the index. The scare in the artificial intelligence trade has been a boon for software stocks such as S SE, which accounts for about 12% of the DAX\u2019s weight.\n\n\u201cThe DAX has benefited from its cyclical sector mix, particularly its high technology exposure, where the combination of software and hardware has provided some protection,\u201d said Deutsche Bank AG strategist Carolin Raab. \u201cThe relatively low exposure to traditional energy and basic resources has also helped.\u201d\n\nThe rally has been broadening fast, with about 80% of DAX members trading above their 200-day moving average and 18% making fresh 52-week highs just this week. Only the ultra-defensive Swiss SMI is seeing stronger momentum among major European benchmarks. In last month\u2019s Bank of America Corp. fund manager survey, Germany was the second-most preferred market in Europe, with a net 16% of investors intending to overweight its stocks in the next year.\n\nBloomberg Intelligence strategists led by Laurent Douillet said local conditions have historically had little influence over the DAX, given that its members generate only 15% of sales domestically. That relationship now appears to be changing, with US and German PMIs becoming more significant at the expense of Chinese indicators.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 11:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "6 out of 10 top performing largecap stocks in November delivered multibagger returns in long run. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 6 out of 10 top performing largecap stocks in November delivered multibagger returns in long run. Do you own any? Written by Debaroti Adhikary , ETMarkets.com | Nov 14, 2026, 11:40:38 AM IST 1 / 11 \u200bTop Performers The Indian stock market has seen a stellar rebound in November, with Sensex soaring over 7,000 points and Nifty rallying more than 9% in just the first half of the month as a sharp surge in FII buying following months of selloff, along with other factors boosted investor sentiment on Dalal Street. One of the key trends noticeable during this bull attack was the outperformance of the largecaps over midcaps and smallcaps. During the same period of time, Nifty Midcap 100 and Nifty Smallcap 250 indices gained 7-8%. Here are the 10 largecap stocks that recorded the biggest jump in November so far, including six who have delivered multibagger returns in the longer run.\n\nShriram Finance shares recorded the sharpest gains among all the largecap stocks in November so far, jumping nearly 22%. The shares of the non banking financial company dropped 2% in a month and 5% in 2026 so far, but gained over 19% in one year. In the longer term, the stock delivered multibagger returns of 147% in three years and 199% in five years.\n\nMuthoot Finance followed, rising more than 21% in November so far. The shares of the gold loan provider dropped over 1% in a week but gained 8% in a month, although they remain 26% down in 2026 so far. In the longer term, the stock delivered multibagger returns of over 120% in three years and gained 68% in five years.\n\nAlso read | MSCI rejig: Which stocks may see the biggest inflows & outflows?\n\nMahindra & Mahindra (M&M) shares gained 20% so far this month, ranking third among all the largecap stocks with highest returns in the first half of November.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 11:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ecuador wants to monetize its biodiversity \u2014 while still drilling for oil", "full_content": "Ecuador, known for its \" megadiverse \" Galapagos Islands, Amazon rainforest, Andes and Pacific coast, wants to protect its natural landscapes for years to come \u2014 but it faces a tricky balancing act.\n\nAs well as preserving its nature, the South American country also plans to capitalize on its critical minerals and continue to extract oil from parts of the Amazon \u2014 both of which have led to protests from Indigenous and environmental groups.\n\nOne way Ecuador is planning to channel funds into its nature is via new financial tools, such as \"debt-for-nature\" swaps and its first sovereign green bond. It is also aiming to raise its environmental profile on the global stage by hosting the U.N.'s biodiversity summit , known as COP18, in 2028.\n\nEcuador, which uses the U.S. dollar, is no stranger to green finance. In March, IDB Invest, the private-sector arm of the Inter-American Development Bank, and Ecuadorian lender Banco Bolivariano issued a $120 million biodiversity bond to back conservation projects. The government also completed two swaps in 2023 and 2024 \u2014 deals in which a country's debt is refinanced on better terms in exchange for commitments to spend the savings on conservation. Together, they freed up about $1.1 billion for conservation in the Amazon and Galapagos Islands .\n\nJuan Carlos Blum, Ecuador's minister of environment and energy, said the country hopes to issue sovereign green bonds for the first time in 2027, to raise finance to protect its coastal and mountainous regions and the people whose livelihoods depend on them. The government is looking to the European Union for advice on such instruments, he said. The bloc set green bond standards in 2024.\n\nFor Blum, one of the challenges is public awareness.", "source": "CNBC Top News", "pub_date_str": "14 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "OPS pension denied after switching universities: How retired professor won legal battle in Karnataka High Court?", "full_content": "A change of employer towards the later part of a career can create uncertainty over retirement benefits, particularly when an employee moves between institutions governed by different service conditions.\n\nThis became a pension dispute for a Karnataka university professor who spent nearly 28 years in academic service but was denied pension under the Old Pension Scheme after his appointment to another university.\n\nThe dispute reached the Karnataka High Court after the state government challenged an earlier order directing it to release his pensionary benefits. Here\u2019s what happened and how a former Karnataka University professor won his pension battle.\n\nChidananda Reddy S. Patil joined Karnataka University, Dharwad, as a lecturer on 14 March 1996 through regular recruitment. He subsequently progressed to the position of Associate Professor.\n\nIn 2013, he applied for the post of Professor at Karnataka State Law University, Hubballi, through his existing employer and with its permission. Following his selection, he moved to the new university on 16 July 2013.\n\nHis resignation from Karnatak University was accepted as a technical resignation under Rule 252(b) of the Karnataka Civil Services Rules (KCSR). A technical resignation is a formal resignation used to facilitate an employee's move to another eligible post without automatically treating the move as a complete break in service for applicable service benefits.\n\nHe continued working at Karnataka State Law University until his retirement on 31 December 2024, after nearly 28 years of academic service.\n\nThe dispute arose because the state did not agree to count his 1996\u20132013 service at Karnatak University towards his pension eligibility.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 11:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "\u20b94K cr Ramayana movie VFX maker parent Prime Focus shares in focus after 14x profit jump in Q2; stock up 61% in a year", "full_content": "Pranati Deva Published 14 Nov 2026, 11:21 AM IST Prefer Livemint on Google Prime Focus Ltd, the parent company of visual effects and animation studio DNEG, is likely to remain in focus on Monday after announcing its September-quarter results late on Friday. The company, associated with the visual effects work for Ranbir Kapoor-starrer Ramayana, reported a sharp rise in consolidated profit and revenue for Q2 FY27, supported by demand for visual effects services.\n\nThe results come amid heightened attention on the company's stock following the film's release. Despite the buzz around the project and its box-office performance, Prime Focus shares have come under pressure in recent sessions.\n\nPrime Focus shares have fallen around 11% since the film's release and are trading more than 26% below their 52-week high. The stock ended at \u20b9 270 on Friday, November 13, down 1.7%. It has declined 5% in one week and 3% over the past month. The shares are down 2% over six months, but have gained 19.29% year-to-date and 61% over one year. Over five years, the stock has delivered multibagger returns of 244%.\n\nThe film emerged as Ranbir Kapoor's biggest opening ever, collecting more than \u20b9 1,000 crore worldwide so far, according to Sacnilk. In India, Ramayana opened with a net collection of \u20b9 64.85 crore, setting a record for Kapoor. However, the opening was below the \u20b9 86.75 crore recorded by Prabhas-starrer Adipurush.\n\nProfit booking has been cited as one reason for the post-release weakness. Prime Focus shares had more than doubled over the preceding year amid excitement around Ramayana and gained another 13% in the two weeks before its release. Both the stock and the wider entertainment sector declined on the film's release day.\n\nThe project's scale has also drawn attention.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 11:21 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India's Troika Of Good Luck | Joining The Dots", "full_content": "Thirty-five days ago, India was unloved, Huang was untouchable and inflation was contained. A week, it turns out, is long enough to change all three.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 11:06 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "8th Pay Commission: Will central government salaries and pensions be revised every 5 years? What employee unions demand", "full_content": "The 8th Pay Commission was constituted on 3 November 2025. It is a temporary 3-member commission headed by Justice Ranjana Prakash Desai. The commission was initially given 18 months to table its final report to the central government, as per the commission's terms of reference (ToR).\n\nThe objective of the 8th Pay Commission is primarily to listen to the grievances, views, and ideas of eligible unions and associations and then make a decision on the new fitment factor, allowances, salary and pension revisions, along with a host of other associated aspects.\n\nNow, among the numerous demands listed by prominent unions and associations in their official memoranda, one of the most important ones is that eligible employee unions propose revising salaries and pensions every 5 years rather than 10.\n\nIf this demand is accepted and implemented, central government employees and pensioners might not have to wait a decade for their next pay revision. This demand has been made by several prominent employee unions and associations after consideration of basic factors such as rising inflation, day-to-day expenses, living costs, and rapidly changing economic conditions, which collectively warrant an earlier revision, as these factors are eroding the purchasing power of serving central government employees and pensioners.\n\nFor these core reasons only, the request to revise salaries every 5 years is urged, rather than every 10. Furthermore, a shorter revision cycle, as per the unions, will be of immense help, as it can ensure that the salaries and pensions of serving employees remain aligned with fundamentals and economic realities.\n\nProminent employee unions and associations have put forward different demands regarding the reduction of the 10-year revision cycle.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 10:59 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FICCI calls for comprehensive India-Africa trade framework", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a FICCI calls for comprehensive India-Africa trade framework The Economic Times daily newspaper is available online now. Read Today's Paper FICCI calls for comprehensive India-Africa trade framework SECTIONS FICCI calls for comprehensive India-Africa trade framework PTI Last Updated: Nov 14, 2026, 10:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India and Africa are encouraged to develop a comprehensive trade arrangement to enhance economic cooperation. Ficci emphasizes the importance of a predictable framework to address trade barriers and promote investment. With the upcoming visit of Commerce Minister Piyush Goyal to Egypt, both regions aim to strengthen ties. Egypt's strategic location provides opportunities for Indian companies in various sectors.\n\nHow India\u2019s INR22.5 lakh crore gold loan boom is hiding a big hole\n\nKYC and KYB: Pidilite's margin keeps finding its way back, though costlier raw materials can knock it off course \u2013 Part 2 of 3\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "14 Nov 2026, 10:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic IPO buyers have more influence on price than SpaceX", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Anthropic IPO buyers have more influence on price than SpaceX Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic IPO buyers have more influence on price than SpaceX SECTIONS Anthropic IPO buyers have more influence on price than SpaceX By Anthony Hughes , Bloomberg Last Updated: Nov 14, 2026, 10:33:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic PBC is gearing up for its initial public offering, setting ambitious price targets to capture investor interest. The firm aspires to achieve record fundraising that could eclipse SpaceX's previous achievements. High-profile tech investors back Anthropic's private financing, indicating strong market confidence. Its traditional IPO pricing strategy, distinct from SpaceX's, positions Anthropic to navigate through the challenges of market fluctuations smoothly.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 10:33 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Hedge fund woes expose the dangers of hot money once again", "full_content": "Recent stumbles have come about as a result of the pursuit of heady growth without the risk management capability and structures to deal with it", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Treat prediction markets like futures trading", "full_content": "Critics say these sites are just a form of gambling \u2014 but they said that about the Chicago Board of Trade too", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "How bonds got interesting again", "full_content": "Despite the short-term volatility, for those approaching retirement, fixed income products are not the rank outsider they used to be", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "What Europe\u2019s rising public debt means for your portfolio", "full_content": "How do you invest when hard-up governments are looking for cuts and tax raids?", "source": "FT Markets", "pub_date_str": "14 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Around 600% jump in 5 years: Citi maintains 'buy' on Maharatna defence PSU HAL for up to 28% - Check target, rationale", "full_content": "Pranati Deva Published 14 Nov 2026, 10:28 AM IST Prefer Livemint on Google Hindustan Aeronautics Ltd (HAL) shares have recently faced selling pressure, with the Maharatna defence public sector undertaking (PSU) stock declining 3.5% in one week, 1% in one month and 3% in three months. However, the stock remained in positive territory over longer periods, gaining 4% in six months and 1% in one year. It also delivered multibagger returns of around 600% over five years.\n\nIn the previous trading session, HAL shares fell 0.7% to close at \u20b9 4,809.80. Despite the recent weakness, international brokerage Citi maintained its bullish stance on the defence major, retaining its 'Buy' rating and target price of \u20b9 6,175 per share. The target indicated an upside potential of around 28% from the previous close.\n\nCiti said HAL's Q2 revenue was in line with its estimates, although EBITDA missed expectations due to weaker gross margins. The brokerage added that the company's engines, helicopters and repair work helped offset the delayed Mk1A ramp-up. HAL's inventory also increased 39% year-on-year (YoY), signalling rising preparedness for execution, according to the report.\n\nThe Maharatna central public sector enterprise reported its financial results for the July-September quarter during market hours on Thursday.\n\nHAL posted a 16% YoY increase in consolidated profit after tax (PAT) to \u20b9 1,935.64 crore in the second quarter of FY27 , compared with \u20b9 1,669.05 crore in the corresponding quarter of the previous financial year.\n\nThe defence major's revenue from operations rose nearly 15% YoY to \u20b9 7,613.25 crore in Q2 FY27, against \u20b9 6,628.61 crore reported in the year-ago period. Expenses, meanwhile, increased around 16% YoY to \u20b9 6,132 crore during the quarter under review.\n\nWhile revenue growth remained in line with Citi's estimates, the brokerage flagged weaker gross margins as the reason for the EBITDA shortfall.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 10:28 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street\u2019s wild ride delivers big paydays and bigger bruises", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Wall Street\u2019s wild ride delivers big paydays and bigger bruises Powered By The Econom "}, {"title": "Ramayana Box Office Run: Will Ranbir's Film Earn Another Rs 100 Crore On Weekend? Check Region Wise Earnings", "full_content": "Directed by Nitesh Tiwari, the film has maintained a strong hold in theatres despite witnessing a decline in its daily earnings during the second week.", "source": "NDTV Profit", "pub_date_str": "14 Nov 2026, 10:16 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India's biggest small-cap mutual fund adds 8 stocks, exits 4 in October 2026; ITC tops fresh buys; expense ratio rises", "full_content": "India's biggest active small-cap mutual fund by assets under management (AUM), Nippon India Small Cap Fund , managed \u20b9 76,903 crore as of October 2026. The fund added eight new stocks and completely exited four others, while also reshuffling its existing holdings.\n\nThe fund has 260 stocks in its portfolio. The fresh additions include large-cap stocks such as ITC and Bank of Baroda. Here's what investors need to know about the changes in the fund's portfolio.\n\nThe fund added eight new stocks to its portfolio in October. ITC topped the list with 2.15 crore shares, followed by Bank of Baroda , with around 82.21 lakh shares.\n\nOther notable additions included Aequs , with 36.38 lakh shares, and Sahajanand Medical Technologies , with 14.37 lakh shares.\n\nNippon India Small Cap Fund completely exited four stocks in October. These included Fineotex Chemical, Jio Financial Services, Vedant Fashions, and Asian Paints.\n\nApart from fresh purchases and complete exits, the fund also adjusted its existing stock positions in October.\n\nThe fund increased its holdings in 21 stocks. These included Swiggy, Tata Steel and Kotak Mahindra Bank, with the number of shares added in each at 50 lakh.\n\nOn the other hand, the fund reduced its holdings in 11 stocks. State Bank of India, Allied Blenders and Distillers, and UTI Asset Management Company were among the stocks where its exposure declined.", "source": "LiveMint Money", "pub_date_str": "14 Nov 2026, 10:05 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia has worst week since Trump tariff selloff as Huang exits", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Nvidia has worst week since Trump tariff selloff as Huang exits Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Nvidia has worst week since Trump tariff selloff as Huang exits SECTIONS Nvidia has worst week since Trump tariff selloff as Huang exits By Carmen Reinicke , Bloomberg Last Updated: Nov 14, 2026, 09:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nvidia Corp. has witnessed a drastic stock plunge after the ousting of CEO Jensen Huang amid scandals. A staggering 13% decrease in stock value within a week represents its most significant drop since April 2025. With analysts downgrading their ratings, concerns regarding Nvidia's future performance and corporate culture have emerged.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\ cord date to determine shareholders' eligibility for the dividend. This effectively makes Tuesday, November 17, the last date for investors to qualify for the corporate action.\n\n\u201cThe record date fixed for the payment of interim dividend is 18 November 2026. The date fixed for payment of dividend is on or before 11 December 2026,\u201d read the BSE filing.\n\nThe company has stated that the dividend payment will be completed on or before December 11, 2026.", "source": "LiveMint Markets", "pub_date_str": "14 Nov 2026, 09:52 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin\u2019s billion-dollar wipeouts are becoming a familiar sight", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Crypto \u203a Crypto News \u203a Bitcoin\u2019s billion-dollar wipeouts are becoming a familiar sight The Economic Times daily newspaper is available online now. Read Today's Paper Bitcoin\u2019s billion-dollar wipeouts are becoming a familiar sight SECTIONS Bitcoin\u2019s billion-dollar wipeouts are becoming a familiar sight Bloomberg Last Updated: Nov 14, 2026, 09:50:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bitcoin liquidation events exceeding $500 million have become common, reflecting significant market volatility. Recent trading sessions have seen large losses, including a $1.3 billion liquidation. Factors affecting the market include high oil prices and potential Federal Reserve rate hikes. Additionally, investors seem to be favoring artificial intelligence stocks over cryptocurrencies amid a tech selloff. These trends indicate an evolving landscape in the crypto trading environment.\n\nList n latest Fed survey", "full_content": "Artificial intelligence has emerged as a top concern for financial stability, according to a recent report from the Federal Reserve. A staggering 87% of respondents cited AI as a key risk, bringing attention to potential cyber threats and declining corporate earnings. There\u2019s been a dramatic increase in debt tied to AI infrastructure investments.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 09:25 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed's Jefferson says he is taking his policy cues from inflation", "full_content": "Federal Reserve Vice Chair Philip Jefferson emphasized inflation as the main factor in determining monetary policy. He highlighted that economic growth and a stable labor market have been observed. Jefferson indicated that upcoming adjustments to policy should rely on data trends and the evolving economic outlook. Concerns about artificial intelligence displacing workers were also mentioned in his remarks.", "source": "Economic Times Markets", "pub_date_str": "14 Nov 2026, 09:20 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tamil Nadu govt imposes stock limits on paddy, rice and pulses amid price rise", "full_content": "The Tamil Nadu government has set stock limits on essential commodities like rice and pulses to combat price inflation. Wholesalers can stock a maximum of 2,000 metric tonnes of rice, while retailers are restricted to eight tonnes. Miller stock is limited to one month's production capacity, ensuring regular supply. Importers are prohibited from holding stock longer than 45 days post customs clearance, promoting quick turnover.", "s
