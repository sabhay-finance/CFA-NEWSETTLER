 Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Indian finance hub eyes dual share model to kickstart public offers: Report The Economic Times daily newspaper is available online now. Read Today's Paper Indian finance hub eyes dual share model to kickstart public offers: Report SECTIONS Indian finance hub eyes dual share model to kickstart public offers: Report Reuters Last Updated: Nov 20, 2026, 01:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian regulators are currently assessing a new proposal that would allow companies to introduce dual-class shares for listings in both domestic markets and GIFT City. This initiative seeks to invigorate equity market activity in GIFT City, which has faced challenges regarding limited primary market participation. One class of shares would be traded in rupees, while the other would be dollar-denominated, granting foreign investors easier access alongside reduced tax implications.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Nov 2026, 01:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IPO GMP race: Mahanadi Coalfields vs Crystal Crop Protection vs Watrana Rentals - Check grey market winner | Key dates", "full_content": "With three IPOs currently open for subscription, investor attention is gradually shifting towards their potential listing-day performance. One of the key indicators investors tracks to gauge the likely debut of a public issue is the grey market premium (GMP), which offers an early indication of the demand for shares ahead of their stock market listing.\n\nWhile the subscription process is still open for all of the issues, investors are closely tracking their respective GMPs to assess potential listing gains.\n\nAlthough the GMP provides an indication of the likely listing price, it does not guarantee the actual listing price, as it fluctuates daily depending on market sentiment and demand. Moreover, the grey market is unofficial and unregulated, and the GMP should be viewed only as an early indicator rather than the sole basis for investment decisions.\n\nAmong the three IPOs, Watrana Rentals is commanding the highest GMP at \u20b9 67 per share, indicating a potential listing premium of 27.35% over its upper issue price of \u20b9 245 per share.\n\nMeanwhile, Crystal Crop Protection is trading at a GMP of \u20b9 17 per share, suggesting a potential listing premium of 6.25% over its upper issue price of \u20b9 272 per share.\n\nMahanadi Coalfields is indicating a relatively muted debut, with its GMP standing at \u20b9 2 per share, implying a potential listing premium of 1.47% over its upper issue price of \u20b9 136 per share.\n\nWatrana Rentals Ltd, a provider of material handling equipment (MHE) and aerial work platform (AWP) rental solutions, received a strong response from investors, with its IPO fully subscribed on the opening day on Thursday. The issue attracted subscriptions of 7.13 times the shares on offer.\n\nThe non-institutional investors (NII) portion was oversubscribed 11 times, while the retail investors' portion was subscribed 9.58 times. The qualified institutional buyers (QIB) segment has not yet opened for bidding.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Tech stocks fall as Anthropic IPO fails to reignite AI trade", "full_content": "Markets in Europe and Asia follow Wall Street lower despite Claude AI maker\u2019s record listing", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Pristine Logistics & Infraprojects Gets SEBI's Nod To Float IPO", "full_content": "Its operations are centred on long-haul rail transportation, supported by first- and last-mile road connectivity and a network of strategically located logistics terminals across domestic and export-import (EXIM) corridors.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SoftBank suffers worst day in over two years as AI sell-off hits Asian tech stocks", "full_content": "Shares in Japan's SoftBank Group closed 14.48% lower on Friday, marking their worst day since August 2024, as a broader sell-off swept through Asian technology stocks following the highly anticipated market debut of artificial intelligence startup Anthropic .\n\nThe sharp decline underscores growing investor concerns over SoftBank's aggressive bets on artificial intelligence, particularly its exposure to OpenAI, as markets question whether massive investments in AI infrastructure will generate sufficient returns.\n\nThe group is one of the biggest backers of OpenAI, Anthropic's rival, having invested a total of $64.6 billion in the ChatGPT maker.\n\nShares of SoftBank on 20 Nov. SoftBank's heavy exposure to OpenAI as well as its ownership of chip designer Arm has made its shares particularly sensitive to shifts in sentiment toward the AI sector. The stock lost 30% in October and is down 31% so far this month.\n\nJapanese semiconductor stocks also tumbled, with Tokyo Electron closing 7.06% lower, Lasertec shedding 9.21% and Renesas Electronics losing 7.02%.\n\nThe sell-off extended to South Korea, where Nvidia suppliers SK Hynix and Samsung Electronics fell 5.92% and 7.01%, respectively, pressuring the benchmark Kospi, which ended 5.21% lower.\n\nElsewhere in the region, Taiwan Semiconductor Manufacturing Co , or TSMC, closed 4.76% lower in Taiwan.\n\nAs of the last hour of trading, Chinese tech giant Tencent was down 2.01%, while memory chipmaker CXMT fell 5.31% to a fresh record low, while Baidu dropped 4.79%. AI chipmaker Enflame , dubbed as one of China's \" four little dragons \" fell 7.16%.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 12:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India\u2019s \u2018no AI play\u2019 remains a bother for fund managers even as foreign investors return", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nForeign portfolio investors\u2019 (FPI) interest in Indian equities is reigniting. After two consecutive months of heavy selling, foreign investors bought Indian equities worth over \u20b9 1 trillion so far in November, data from NSDL showed.\n\nThere seems to be a loss of conviction in the artificial intelligence (AI) theme globally, which may be prompting a rotation of foreign funds into India, a market previously shunned for its limited AI exposure. Stocks of AI-focused companies in the US and Asia have corrected amid rising concerns over potential regulation of AI-related spending in the US and a lack of visibility on the revenue-generating potential of AI projects.\n\nDespite this, the absence of an AI play remains a key concern for Indian equities, according to the latest Asia Fund Managers Survey by BofA Securities. About 29% of those surveyed saw the dearth of direct AI-linked investment opportunities in India as a dampener. This was followed by a lack of reforms (19%), depreciation of the Indian rupee (14%) and high valuations of Indian equities (10%).\n\nThe October BofA Asia Fund Manager Survey had shown that 15% of respondents were worried about weak growth. However, this concern did not feature in the November list, even as downside risks to economic growth are mounting.\n\nIndia\u2019s gross domestic product (GDP) growth data for the July-September quarter (Q2FY27) is due later this month. Given the adverse impact of the West Asia war and El Ni\u00f1o conditions, Bank of Baroda estimates growth to moderate to 7.4% from 8.1% in Q2FY26.\n\nAmong key components, the agriculture and trade and services sectors are expected to face headwinds amid a deficient south-west monsoon, which could affect the early harvest. The main kharif harvest takes place in Q3, it added.\n\nThe repercussions of the West Asia war and El Ni\u00f1o have started pushing retail inflation higher.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why Stock Market Is Rising Today? Sensex Rebounds 1,300 Points From Day's Low; Nifty Above 25,700 | Three Reasons Explained", "full_content": "The recovery in domestic equities was led by strong buying in IT and banking stocks, while selling pressure in metal, pharmaceutical and energy stocks capped the upside.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Talking Points This Week: Nvidia's Exit, Anthropic's Test and Money Returning Home", "full_content": "From Nvidia's leadership shake-up and Anthropic's IPO to returning FII flows and Asia's shifting growth outlook, markets are reassessing where the next leg of returns will come from, Niraj Shah writes.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "\u2018More than just a game\u2019: How GTA VI\u2019s blockbuster launch fuels a booming content economy", "full_content": "Grand Theft Auto VI has exploded out of the gate after a 13-year wait, drawing millions of buyers while fueling a parallel economy of livestreams, clips and other content built around people watching the game as much as playing it.\n\nGTA VI has delivered a blockbuster debut , with about 19.1 million copies sold \u2014 including preorders \u2014 by Thursday morning, representing roughly $1.84 billion in sales, according to Sensor Tower. The GTA franchise itself has sold more than 470 million units worldwide.\n\nTake-Two Interactive , which owns the studio behind the game, has not yet disclosed a profit figure for the title.\n\nRoss Gerber, president and CEO of Gerber Kawasaki Wealth & Investment Management, told CNBC's \"Squawk Box Asia\" that he sees further upside for Take-Two, which his firm holds in its portfolio.\n\n\"It's crazy good. I've never seen anything like it,\" Gerber said, hailing the title as \"more than just a game\" and pointing to the franchise's potential to expand into film and television.\n\nBut that launch is also spawning a second economy around the enormous global hype and demand for GTA VI content.\n\nViewers watched 125.5 million hours of the title's content in its first 24 hours across platforms including Twitch, YouTube and Kick, according to Streams Charts.\n\nYouTube creator Darren \" IShowSpeed \" Watkins Jr. led streamers with 4.47 million hours viewed across YouTube and Twitch. Separately, Twitch tracker CastAccord recorded about two million hours watched over roughly 36 hours of streamer Kai Cenat 's launch broadcast.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 12:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PC Jeweller, Kalyan Jewellers to Senco Gold: Jewellery stocks fall 5% as gold prices slips below \u20b91.25 lakh;buy or sell?", "full_content": "SENCO Dhanya Nagasundaram Published 20 Nov 2026, 12:37 PM IST Prefer Livemint on Google Jewellery stocks came under pressure on Friday, 20 November, as a sharp correction in gold prices weighed on investor sentiment. PC Jeweller share price fell nearly 5%, Kalyan Jewellers slumped around 7%, while Senco Gold declined about 2%, tracking the weakness in bullion prices.\n\nOn the Multi Commodity Exchange (MCX), gold prices slipped below the crucial \u20b9 1.25 lakh-per-10-gram mark. MCX gold opened sharply lower at \u20b9 1,23,629 and extended losses to hit an intraday low of \u20b9 1,21,424, reflecting the sharp selloff in the precious metal.\n\nThe weakness in domestic bullion prices mirrored a broader global selloff. International gold prices fell for a fifth consecutive session on Friday, putting the metal on course for its steepest weekly decline since March. Spot gold dropped 1.9% to $3,551.68 per ounce by 0257 GMT, after touching its lowest level since September 2025 earlier in the session. Bullion was down nearly 8.9% for the week, its sharpest weekly fall since the week of 20 March. US gold futures for December delivery declined 3.6% to $3,551.90, Reuters reported.\n\nThe pressure on gold has intensified amid growing expectations of further US interest-rate hikes, with the Federal Reserve signalling a hawkish stance against the backdrop of persistent inflation.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Sensex Jumps 600 Points, Nifty 50 Hits 25,700, Bank Nifty Above 64,000 For First Time", "full_content": "Nifty IT emerged as the top gainer with over 2% rally, followed by Nifty Realty, Nifty Private Bank and Nifty Auto indices. Selling was seen in Nifty Metals, Nifty PSU Bank, Nifty Oil & Gas, Nifty Pharma and Nifty FMCG indices.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "iPhone Users In USA And Canada Targeted, 17 From Fake Gurugram Call Centre Arrested", "full_content": "Police arrested 17 people in Gurugram for running a fake call centre targeting Apple users in the US and Canada with cyber fraud.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold, silver ETFs crash up to 7.5%: Why the bullion sell-off is deepening on Fed rate-hike fears", "full_content": "The gold and silver exchange-traded funds (ETFs) came under heavy selling pressure in trading today, 20 November, with several prominent schemes declining between 5% and 7.5%. The decline followed a sharp correction in international bullion prices as expectations of further US Federal Reserve rate hikes weighed on precious metals.\n\nSilver ETFs, on the other hand, recorded steeper losses than gold ETFs, whereas international gold prices headed towards their biggest weekly decline since March. The sell-off also dragged domestic gold and silver futures sharply on the MCX in early trading today.\n\nSubsequently, MCX gold futures prices slumped 3.91% lower at \u20b9 1,23,120 per 10 grams, while MCX silver futures crashed by around 6.06% to \u20b9 1,48,730 per kg in early trading today.\n\nSilver ETFs suffered the most amid today's brutal sell-off, with the Nippon India Silver ETF declining by 7.47%. SBI Silver ETF, ICICI Prudential Silver ETF, and Tata Silver ETF also registered losses exceeding 7%.\n\nGold ETFs were also not spared, with several schemes falling more than 5%. Keeping in view the weak market sentiment in the bullion market:\n\nGold prices dropped for a 5th consecutive session today in the international market, declining 2.3% to $3,543.19 per ounce at about 10:20 am Singapore time. The yellow metal was on track to lose nearly 9% during the week, marking its steepest weekly rout since March. Silver prices also corrected by 2.3% to $41.98 per ounce, taking their weekly losses to around 14%.\n\nThe core reason behind these significant losses has been the growing expectation of further US interest rate hikes amid persistently high and sticky inflation.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Who is Roaring Kitty? The man behind GameStop's meme rally", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Who is Roaring Kitty? The man behind GameStop's meme rally Written by Anupam Nagar , ETMarkets.com | Nov 20, 2026, 12:58:39 PM IST 1 / 6 Roaring Kitty's surprise return sends GameStop shares higher GameStop shares gain after Keith Gill, popularly known as Roaring Kitty, makes his first social media post in nearly two years. Gill shares a mysterious image of Cat Mario on X on Thursday, November 19, sending GameStop stock higher by around 3% and drawing fresh attention from retail investors. His return revives memories of the 2021 meme-stock rally. (Sources: Yahoo Finance, Barron's)\n\nKeith Gill became a prominent figure in the GameStop meme-stock frenzy of 2020-21. His bullish commentary and online posts helped attract retail investors to the company's shares, triggering a historic buying frenzy and a short squeeze that put pressure on hedge funds betting against the stock. His latest post comes after an extended social media absence, with his previous post dating back to January 2025.\n\nGill's latest post features Cat Mario, a power-up character from Nintendo's Super Mario 3D World. The image carries no caption or explanation, leaving investors guessing about its significance. The mysterious post coincides with the launch of Grand Theft Auto VI, adding to the excitement around gaming stocks and raising speculation about whether Gill's return could reignite retail interest in GameStop.\n\nThe launch of Grand Theft Auto VI is generating significant excitement across the gaming industry. The blockbuster release could bring more customers to GameStop stores for gaming consoles and accessories.", "source": "Economic Times Markets", "pub_date_str": "20 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Hindustan Zinc vs Tata Steel vs JSW Steel: Which metal stock to buy amid big fall in the metal stocks | Targets", "full_content": "TATASTEEL JSWSTEEL Pranati Deva Published 20 Nov 2026, 12:15 PM IST Prefer Livemint on Google Metal stocks to buy : Indian metal stocks witnessed heavy selling on Friday, November 20, with the Nifty Metal index falling nearly 3% intraday as a stronger US dollar and a sharp correction in global base metal prices weighed on investor sentiment. With 14 of the 15 index constituents trading in the red, investors are assessing whether the correction offers a buying opportunity in stocks such as Hindustan Zinc , Tata Steel and JSW Steel .\n\nWhile all three companies reported strong year-on-year earnings growth in Q2FY27, their technical structures differ considerably. Mayank Jain, Market Analyst at PhonePe Invest, and Deepesh Sarawagi, Technical Research Analyst at Choice Broking, favour JSW Steel over the other two counters based on its stronger technical positioning.\n\nThe Nifty Metal index declined around 2.59% intraday to 11,980. APL Apollo Tubes led the losses, falling over 5% to \u20b9 2,040, while Vedanta Aluminium Metal and Tata Steel declined around 3% each. Hindustan Zinc, JSW Steel, Hindustan Copper and SAIL dropped between 1.5% and 2%.\n\nHindustan Zinc has lost 3% in one month and 7% in six months, although it remains up 10% over one year. Tata Steel gained 2% in one month but declined 3% in three months and 14% in six months. It is up 3% over one year. JSW Steel outperformed, gaining 6% in one month, 1% in three months, 3% in six months and 12% in one year.\n\nTheir Q2FY27 financial performances were strong. JSW Steel reported revenue of \u20b9 54,486 crore, up 20.67% year-on-year, while EBITDA increased 42.23% to \u20b9 10,120 crore. Net profit surged 225.58% to \u20b9 5,359 crore.\n\nTata Steel reported revenue of \u20b9 65,436.24 crore, up 11.5%, and EBITDA of \u20b9 10,665 crore, an increase of 17.1%. Consolidated net profit rose 16.2% to \u20b9 3,699.59 crore.\n\nHindustan Zinc reported its highest-ever quarterly revenue of \u20b9 15,093 crore, up 76.5%.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty Bank Crosses New Milestone With 15% November Rally. Is The Rally Just Getting Started?", "full_content": "The banking index has outperformed the Nifty this month, with public sector and private lenders contributing to the gains.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:12 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold prices near \u20b91.2 lakh, down 32% from peak: 3 in 4 years ended with positive returns since 1980. Will 2026 follow?", "full_content": "Gold prices have declined in 2026 amid a stronger US dollar, uncertainty over the US Federal Reserve 's interest-rate outlook and heightened selling pressure in global bullion markets.\n\nGold prices in the Indian market stood at \u20b9 1.22 lakh per 10 grams on 20 November, down nearly 32% from their January 2026 peak of around \u20b9 1.80 lakh, according to bullions.co.in .\n\nHowever, sharp corrections are not unusual for gold. FundsIndia's November 2026 Wealth Conversations report found that gold witnessed temporary declines of 10-15% almost every year since 1980. Yet, it ended the calendar year with positive returns 78% of the time, despite these intra-year corrections.\n\nAn intra-year drawdown measures the maximum decline in gold prices from an earlier peak within a given year. Calendar-year returns, on the other hand, capture the overall price change between the beginning and end of that year.\n\n*Source: FundsIndia Wealth Conversations Report \u2013 November 2026\n\nThe data show that a sharp temporary correction does not automatically mean gold will deliver negative returns for the year. For instance, in 2008, gold fell 20% during the year but eventually delivered a 29% calendar-year return. Similarly, in 2020, despite a 15% drawdown, it ended the year with a 28% gain.\n\nHowever, the pattern is not guaranteed. In 2013, a 24% drawdown was accompanied by an 18% annual loss.\n\nIn 2025, yellow metal witnessed an intra-year drawdown of 8% but still delivered the highest calendar-year return of 76%. In 2026, gold has already witnessed a 25% correction and was down 5% on a calendar-year basis as of 31 October.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 12:11 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "A bubble in . . . defensive stocks?", "full_content": "Plus, crypto and desperation", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 12:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Crude Oil Volatility To Stay High, Citi Says; Diesel Cracks Key For Refiners", "full_content": "The analyst said refining margins had remained strong, although some moderation was visible in gasoline cracks. Diesel cracks had held up better.", "source" Thursday about the voluntary share delisting..\n\nAccording to stock market experts, voluntary stock delisting is a good news for the existing shareholders as promoters will be buying the shares at a premium price, fixed by the company board after the finalisation of the floor price. They said that current rally in the stock can be attributed to this additional benefit expected by the market. However, they also predicgted a high volatility in Tips Films shares ahead of the announcement of the floor price and share delisting price and advised investors to maintain a strict stop-loss at \u20b9 374.\n\nSpeaking on the reason for rise in Tips Films shares, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cWhen there is a voluntary delisting announced by a listed entity, promoters buy the tendered shares by the existing shareholders at the given price. In the case of Tips Films share delisting, the promoters are yet to declare the floor price and share delisting price.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 11:40 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'Private Banks Will Regain Market Share': Bernstein's Pranav Gundalapalle Sees 20% Earnings Growth For Banks", "full_content": "Bernstein expects private sector lenders to regain market share in lending as the factors that supported the outperformance of public sector banks over the past few years begin to fade.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 11:39 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic Is Just Five Years Old. Its Employees Could Soon Be Worth $44 Million Each After Blockbuster Listing", "full_content": "The estimate is based on the number of shares linked to outstanding stock options and restricted stock units disclosed in the company's SEC filing.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 11:36 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Forget Anthropic: In Europe, the IPO hype is about a blue lagoon", "full_content": "While investors are fixated on Anthropic's blockbuster stock market debut , a very different IPO is making waves in Europe: Iceland's Blue Lagoon, the operator of one of the world's most famous geothermal spas.\n\nBlue Lagoon Corp. raised roughly 14.3 billion Icelandic kronur ($110 million) through the offering, valuing the Icelandic geothermal spa operator at about $787 million, according to the company's investor presentation .\n\nThe Blue Lagoon traces its origins to 1992, when Blue Lagoon Ltd. was founded to study the water in the Blue Lagoon, an open-air pool of warm, milky-blue water set in a black lava field in southwestern Iceland. It grew into a business spanning a spa, hotels and skincare made with ingredients from the lagoon.\n\nShares will trade under the ticker \"BLUE\" on one of Europe's smallest stock exchanges, Nasdaq Iceland Main Market, part of the Nasdaq Nordic group, which also operates exchanges in Sweden, Denmark and Finland.\n\n\"Wellness is the new luxury, and we know that the wellness economy is growing faster than the economy as a whole, so we have tailwind from that,\" CEO Sigr\u00ed\u00f0ur Margr\u00e9t Oddsd\u00f3ttir told CNBC on Thursday.\n\n\"Now is the right time for us to list,\" she added. \"We are a company that thinks long-term, we have a clear vision for the next decade, and being publicly listed gives investors the opportunity to participate in our journey.\"\n\nThe company's operations are centered on Iceland's Reykjanes Peninsula, where, as well as the Blue Lagoon geothermal spa, it runs the Silica Hotel, the Retreat luxury hotel and spa, and the Michelin-starred Moss restaurant.\n\nIt also operates the Kerlingarfj\u00f6ll Highland Base and Hrauneyjar properties in Iceland's highlands, and sells Blue Lagoon-branded skincare products internationally.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Home Sales Are Booming. So Why Is Revenue Falling? Runwal Explains The Real Estate Puzzle", "full_content": "Runwal's rising bookings and collections have not translated into higher reported revenue, with project handovers, revenue recognition and the mix of homes delivered shaping its financial performance.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 11:22 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u20b9200 small-cap stock jumps 4%: Public shareholders' stake can shrink from 50.11% to 10.03% after this update. Details", "full_content": "Shanti Education Initiatives shares rose as much as 3.8% after BSE issued no adverse observations on a restructuring scheme involving Grew Energy. The company can proceed toward filing with the NCLT, but must first meet regulatory requirements and obtain relevant approvals.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 11:12 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Apollo Hospitals, Aster or Molbio \u2014 which is a better bet as healthcare stocks rally up to 4% despite D-Street weakness?", "full_content": "Hospital stocks attracted investor attention after Macquarie turned more positive on Apollo Hospitals and Max Healthcare, raising both price targets. It expects improving utilisation and earnings to support the sector, but cautioned that regulatory changes, new-hospital costs.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 10:58 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "So, Anthropic is finally a public company. What now?", "full_content": "A blockbuster IPO postmortem", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 10:49 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Treasury rally spills over to Indian bonds, debt supply slows move", "full_content": "Indian government bonds saw slight gains, reflecting the upward trend in US Treasuries. Investors are keeping a close eye on the forthcoming weekly debt auction, pivotal for market movements. With retail inflation and fluctuating oil prices in play, the Reserve Bank of India may entertain further rate hikes. Although benchmark Brent crude holds steady, it remains vulnerable to geopolitical shifts, prompting caution among traders as they await auction results.", "source": "Economic Times Markets", "pub_date_str": "20 Nov 2026, 10:49 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rupee rises past 93 vs USD as portfolio inflows, bear retreat fuel rally", "full_content": "The Indian rupee has shown remarkable     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
