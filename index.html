hly 7 million barrels a day of crude and refined fuels are crossing Hormuz, Macquarie Group Ltd. said Monday, citing conversations with clients. That compares with pre-war levels of about 20 million. US officials have repeatedly pointed to robust exports.\n\nIran and Oman have been seeking to formalize control of the strait, and could eventually charge transit fees. The US, which is blockading Iranian ports to curb exports from the Islamic Republic, wants the waterway to return to its pre-war status as a freely navigable waterway.\n\nSaudi Aramco\u2019s oil facilities in Jazan near the Red Sea came under fresh attack on Monday, although the strike didn\u2019t cause major damage, according to people familiar with the matter.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 06:40 AM IST", "pub_date_relative": "24m ago"}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20148 September 2026", "full_content": "Buy or sell stocks : Indian equities remained under pressure in Monday\u2019s session on September 7, marking another weak trading day as heightened tensions in the Middle East kept crude oil prices elevated. Meanwhile, stronger-than-expected US job growth boosted expectations of a potential Federal Reserve rate hike at next week\u2019s meeting, leading investors to turn cautious and reduce exposure to riskier assets.\n\nThe Nifty 50 extended its losing streak to four consecutive sessions, declining 0.57% to close at 23,779. The Sensex also fell 0.5% to end at 76,132. During the session, both benchmark indices touched their lowest levels since July 24.\n\nNifty 50 closed at 23,779.15, down 118.55 points (-0.50%), extending its recent weakness after failing to hold the early session high of 23,890. The index remained under selling pressure for most of the session and ended close to the lower end of the day\u2019s range, reflecting a cautious short-term setup.\n\n\"With RSI at 34.72, momentum remains weak, 6:30 AM IST", "pub_date_relative": "34m ago"}, {"title": "South Korea nominal GDP jumps at fastest pace in 47 years in Q2", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:26 AM IST", "pub_date_relative": "38m ago"}], "cfa": [{"title": "Stock market today: Trade guide for Sensex, Nifty 50, crude oil to gold | eight stocks to buy", "full_content": "Stock market today: The Indian stock market benchmark indices, Sensex and Nifty 50, are expected to open in the red on Tuesday, 8 September, amid mixed global cues.\n\nThe domestic equity indices ended lower in the previous session, with the benchmark Nifty 50 closing below 23,800 level.\n\nThe Sensex dropped 382.62 points, or 0.50%, to close at 76,132.81 , while the Nifty 50 settled 118.55 points, or 0.50%, lower at 23,867.70.\n\nThe Gift Nifty Live Chart shows a negative start for the Indian stock market today. By 6:55 AM, the Gift Nifty was trading around the 23,799 level, a discount of 69 points from the Nifty futures\u2019 previous close of 24,048.10.\n\nPonmudi R, CEO of Enrich Money, said Indian equity markets are expected to remain cautious, with elevated crude oil prices continuing to dominate the macro backdrop. Escalating geopolitical tensions have kept energy markets on edge, with WTI crude briefly touching the $93-per-barrel mark before holding in the $92\u201393 range. For India, persistently high oil prices remain a key risk, given their potential to widen the import bill, stoke inflationary pressures and strain the current-account balance.\n\nThe geopolitical backdrop remains fragile as the US-Iran conflict shows few signs of easing. Uncertainty surrounding the Strait of Hormuz and the timing of its full reopening continues to underpin concerns over global oil supplies and broader market sentiment.\n\nAsian markets are trading on a mixed note, with Japan's Nikkei 225 largely flat while South Korea's Kospi is up more than 0.5%. The mixed regional performance suggests investors remain selective in taking on risk as they continue to monitor crude oil prices, geopolitical developments and the outlook for US monetary policy.\n\nSensex formed a bearish candle on the daily chart, indicating continued selling pressure and weakness in the overall momentum.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 07:01 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EverBank to combine with WaFd in $3.9 billion reverse merger", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:48 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: All You Need To Know Before Going Into Trade On Sept 8", "full_content": "Stocks in the news, big brokerage calls of the day, complete trade setup and much more!", "source": "NDTV Profit", "pub_date_str": "08 Sep 2026, 06:45 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: SCREEN Holdings lifts outlook after soft Q1 in 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:44 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BSE IPO index surges 35% in FY27, hits record high on strong listings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More a_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "'Submission To US Intimidation': Iran Slams Canada For Targeting Tehran With 'Distorting Statements'", "full_content": "The Canadian statement, issued jointly by the two ministers, said Ottawa would maintain \"significant pressure\" on Iran, including continuing sanctions under the US-led Operation Economic Outcast.", "source": "NDTV Profit", "pub_date_str": "08 Sep 2026, 06:44 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Oil Prices On September 8: Brent Crude Nears $100 Again As Iran-Oman Hormuz Deal Fails To Ease Supply Fears", "full_content": "Brent crude has gained 1.6% over the past two sessions, while West Texas Intermediate was trading above $92. Brent briefly moved above $98 on Monday, pushing the benchmark to its highest level in nearly six weeks.", "source": "NDTV Profit", "pub_date_str": "08 Sep 2026, 06:43 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Dow futures slip amid Fed hike bets, surging oil", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Sep 2026, 06:43 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Oil holds near $100 as traders await Iran-Oman deal on Strait of Hormuz shipping", "full_content": "Oil held gains near $100 a barrel as traders watched for details of an Iranian deal with Oman to manage shipping through the Strait of Hormuz, while strong Chinese buying tightened the market.\n\nGlobal benchmark Brent crude has risen 1.6% over the past two sessions, while West Texas Intermediate was above $92. Iran said the accord is imminent and will include a temporary safe route through the strait, raising questions about how the US would respond after it struck Iranian tankers over the weekend. Tehran warned that ships face the risk of attack near Oman.\n\nRenewed fighting between the US and Iran over the past week has pushed up oil futures due to due to concerns about deeper disruptions to energy flows through Hormuz. Chinese refiners have recently ramped up oil buying, driving up prices of African, Canadian and Latin American crude, although the increase doesn\u2019t necessarily signal a revival in longer-term demand.\n\nBrent has surged more than 30% since the conflict began at the end of February, although it\u2019s well below the high of $126 a barrel reached in late April. Refined fuels such as diesel have rallied even further as the Russia-Ukraine war added to tightness. Despite risks to shipping in Hormuz, oil continues to exit the Persian Gulf.\n\nRoughly 7 million barrels a day of crude and refined fuels are crossing Hormuz, Macquarie Group Ltd. said Monday, citing conversations with clients. That compares with pre-war levels of about 20 million. US officials have repeatedly pointed to robust exports.\n\nIran and Oman have been seeking to formalize control of the strait, and could eventually charge transit fees. The US, which is blockading Iranian ports to curb exports from the Islamic Republic, wants the waterway to return to its pre-war status as a freely navigable waterway.\n\nSaudi Aramco\u2019s oil facilities in Jazan near the Red Sea came under fresh attack on Monday, although the strike didn\u2019t cause major damage, according to people familiar with the matter.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 06:40 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20148 September 2026", "full_content": "Buy or sell stocks : Indian equities remained under pressure in Monday\u2019s session on September 7, marking another weak trading day as heightened tensions in the Middle East kept crude oil prices elevated. Meanwhile, stronger-than-expected US job growth boosted expectations of a potential Federal Reserve rate hike at next week\u2019s meeting, leading investors to turn cautious and reduce exposure to riskier assets.\n\nThe Nifty 50 extended its losing streak to four consecutive sessions, declining 0.57% to close at 23,779. The Sensex also fell 0.5% to end at 76,132. During the session, both benchmark indices touched their lowest levels since July 24.\n\nNifty 50 closed at 23,779.15, down 118.55 points (-0.50%), extending its recent weakness after failing to hold the early session high of 23,890. The index remained under selling pressure for most of the session and ended close to the lower end of the day\u2019s range, reflecting a cautious short-term setup.\n\n\"With RSI at 34.72, momentum remains weak, while the index continues to trade below its key moving averages. The 23,600\u201323,750 zone remains crucial on the downside, while 23,950\u201324,000 is likely to act as an immediate hurdle. A sustained break below the support zone could intensify selling pressure, whereas a recovery above resistance would provide some relief. With volatility edging higher and Call OI concentrated at higher strikes, the near-term bias remains cautious to bearish,\" said Sumeet Bagadia, Executive Director at Choice Broking.\n\nBank Nifty ended at 57,088.30, down 281.35 points (-0.49%), as the index failed to sustain its early recovery and came under renewed profit booking. The index slipped to an intraday low of 57,002.95 before closing slightly above the day\u2019s low. The break below the 50-Day EMA has weakened the short-term setup, while the index is now testing its broader rising trendline support.\n\n\u201cThe 57,000\u201357,200 region is therefore critical for the next directional move.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 06:39 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sebi eases FPI compliance rules for G-Sec bets", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Sebi eases FPI compliance rules for G-Sec bets Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Sebi eases FPI compliance rules for G-Sec bets SECTIONS Sebi eases FPI compliance rules for G-Sec bets By ET Bureau Last Updated: Sep 08, 2026, 06:36:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Securities and Exchange Board of India has taken a significant step by relaxing compliance regulations for foreign investors. Foreign Portfolio Investors (FPIs) who are exclusively investing in government securities will no longer be required to disclose their investor group details. This amendment follows a recent circular from the Reserve Bank of India, which abolished concentration limit requirements. The updated rules are in effect immediately, streamlining investment processes.\n\nSpain has announced a new initiative requiring banks to participate in a syndicated 20-year green government bond, aimed at generating about four billion euros soon. Leading financial institutions such a Nifty falls over 1,000 points from August high; Can Fibonacci support help bulls stage a comeback?", "full_content": "The Nifty failed to build on Friday\u2019s modest rebound and returned to the declining trend on Monday, September 7. The index began the session about 14 points lower and remained weak for most of the day, eventually ending 118.35 points down at 23,779.15.\n\nThe decline took the index to an intraday low of 23,737.90. Some recovery was seen during the Closing Auction Session, which helped the Nifty move off the day\u2019s low, though it did little to change the weakness seen through the session.\n\nWith touching intraday low of 23,737.90 on Monday, the index has now fallen by more than 1,000 points from the early-August swing high of 24,774.\n\nOn the daily time frame, the index has formed a bearish bodied candle, carrying lower high and lower low compared with the previous session. The sequence keeps the short-term price structure on a weak footing.\n\nThe moving averages have also begun to reflect this deterioration. The 20-DMA moved below the 50-DMA on Monday, marking a negative short-term crossover. Meanwhile, the 100-DMA has flattened, pointing to a loss of strength in the medium-term trend.\n\nThe Nifty is currently placed below its major short-, medium- and long-term moving averages. Recovery attempts have also struggled to hold at higher levels, suggesting that sellers continue to emerge on rallies.\n\nAttention now shifts to 23,721 on the downside. This level represents the 61.8 per cent Fibonacci retracement of the advance from the June low to the August high and therefore remains an important technical reference.\n\nHolding above 23,721 could provide room for a near-term rebound or some short-covering. However, a clear breach of this level would add to the existing weakness and bring the July swing low of around 23,606 into focus.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 06:22 AM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Asian Stock Markets Today: Asia-Pacific Stocks Mostly Lower As Crude Oil Prices Stoke Inflation Concerns", "full_content": "Regional equities weakened as Middle East tensions kept crude prices elevated, while investors assessed the potential impact on inflation and the outlook for US monetary policy.", "source": "NDTV Profit", "pub_date_str": "08 Sep 2026, 06:11 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Deepa Jewellers IPO listing today: GMP at \u20b925.5; Share price prediction ahead of NSE, BSE debut", "full_content": "Deepa Jewellers IPO listing date has been scheduled for today (Tuesday, 8 September) on the bourses at 10:00 IST. Deepa Jewellers IPO allotment was finalised on Friday, 4 September. According to details on the BSE website, Deepa Jewellers share price will list in a special pre-open session on both the BSE and NSE during Tuesday's trades. Deepa Jewellers share price today will be available for trade from 10:00 IST.\n\nMembers of the Exchange are notified that starting Tuesday, 8 September 2026, the equity shares of Deepa Jewellers Limited will be listed and permitted for trading on the Exchange within the 'B' Group of Securities, as per the BSE notice.\n\nDeepa Jewellers IPO GMP today, or grey market premium, is +25.5. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Deepa Jewellers share price was indicated at \u20b9 202.5 apiece, which is 14.41% higher than the IPO price of \u20b9 177.\n\nAccording to grey market trends observed over the past 13 sessions, the current GMP of \u20b9 25.5 suggests a pessimistic outlook. Over this timeframe, the GMP fluctuated between \u20b9 0.00 and \u20b9 55, according to experts.\n\nMahesh M. Ojha, Vice President \u2013 Research & Business Development at Kantilal Chhaganlal Securities Pvt Ltd, said Deepa Jewellers has established itself as an organised B2B jewellery supplier, specialising in vaddanam (gold waist belts) and CNC machine-cut bangles. The company serves 373 customers, including prominent retail chains such as Joyalukkas, Kalyan Jewellers and Lalithaa.\n\nAccording to Ojha, the company has delivered strong financial growth, with revenue, EBITDA and PAT recording CAGRs of 37%, 102.3% and 107.5%, respectively, between FY24 and FY26. Its asset-light, machine-led outsourced manufacturing model allows it to operate with only 41 karigars, while inventory holding stood at just 18 days in FY26.", "source": "LiveMint Markets", "pub_date_str": "08 Sep 2026, 06:07 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ESDS rally sparks 5.19% NAV jump in Motilal Oswal Digital India Fund", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ESDS rally sparks 5.19% NAV jump in Motilal Oswal Digital India Fund The Economic Times daily newspaper is available online now. Read Today's Paper ESDS rally sparks 5.19% NAV jump in Motilal Oswal Digital India Fund SECTIONS ESDS rally sparks 5.19% NAV jump in Motilal Oswal Digital India Fund By Prashant Mahesh , ET Bureau Last Updated: Sep 08, 2026, 06:07:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A recent IPO listing significantly boosted the Motilal Oswal Digital India Fund's net asset value. ESDS Software's stock more than doubled on its market debut, contributing to the fund's gain. This sharp rise in the fund's NAV is considered rare for diversified equity schemes. The fund manager noted the strong performance of an anchor allocation from the IPO. Future NAV increases are possible as ESDS Software continues its upward trend.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Public insurance registry explained: What policyholders need to know", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe public insurance registry (PIR) is being conceptualised as a digital public infrastructure for insurance, designed to create an ecosystem in which data, with the customer\u2019s consent, can flow seamlessly among stakeholders.\n\nThe larger aim is to shift India from the old adage that \u201cinsurance is sold\u201d towards a market where \u201cinsurance is also bought\u201d. The proposal could bring several changes for policyholders, from putting all their insurance policies in one place and making health insurance portability easier to enabling product comparisons, simpler servicing and better visibility into agents and intermediaries. Here are key takeaways:\n\nPIR proposes a consent-based, unified view of a policyholder\u2019s insurance portfolio across insurers . This could help nominees and family members discover unknown policies and unclaimed insurance money. Once a death claim is processed by one insurer and reported to PIR with the claimant\u2019s consent, the registry could identify other policies and prompt the relevant insurers to initiate the claim process. If family members do not know the policy number, other details could help facilitate a search for unclaimed amounts.\n\n\u201cIt is a useful feature, certainly, but legacy data could turn out to be the biggest practical challenge. India has millions of old policies with different formats, incomplete records and inconsistent identifiers,\u201d said Mayank Gosar, CEO, Softcon Capital. \u201cConverting this historical data into common standards and linking the same customer correctly across insurers could be a huge exercise.\u201d\n\nA policyholder with several policies could potentially submit a single request to update details such as nominee, phone number, email, address or bank account, with the request communicated across insurers with consent.", "source": "LiveMint Money", "pub_date_str": "08 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "08 Sep 2026, 07:04 AM IST", "total_stories": 343};

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
