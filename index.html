"Should I put my nest egg in a 30-year Treasury bond?", "full_content": "Risk comes in many forms, even with \u201csafe\u201d investments.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 07:41 PM IST", "pub_date_relative": "9m ago"}, {"title": "US Stock Market Today: S&P, Nasdaq Gain On Lower Oil And Bond Yields", "full_content": "US stocks gained in early trade as easing oil prices and lower Treasury yields lifted sentiment, with the S&P 500 and Nasdaq leading the advance.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:39 PM IST", "pub_date_relative": "10m ago"}, {"title": "S&P 500 rises to record high as oil and yields move lower: Live updates", "full_content": "The S&P 500 rose to a fresh all-time intraday high on Tuesday, boosted by gains in key technology names as well as declines in oil prices and Treasury yields.\n\nThe broad market index was last up 0.5%, while the Dow Jones Industrial Average gained 205 points, or 0.4%. The Nasdaq Composite added 0.5% and had hit a new all-time high as well.\n\nThe moves higher were bolstered by a rise in chipmakers. Shares of Marvell Technology popped 7%, while others such as Nvidia and Broadcom traded up around 1% each.\n\nAdditionally, the benchmark 10-year Treasury note yield fell 2 basis points to 5.29% after scaling to levels not seen since 2002 on Monday. The 2-year Treasury yield declined 3 basis points to 4.802%.\n\nBonds have been volatile over the past six weeks, Morgan Stanley Wealth Management investment chief Lisa Shalett said in a note to clients. She cited a potentially new Fed policy framework, economic growth and high oil prices while the Middle East conflict stretches on as factors.\n\n\"Nevertheless, while intraday implied volatility has risen, the six-week stretch has not reached the extremes that catalyzed the 2022 equity bear market,\" Shalett wrote.\n\nTraders are now looking ahead to the Federal Reserve's minutes from its September meeting due Wednesday, which could  attached to her late father's land grant.\n\nThe authorities rejected her application on the ground that a married daughter was not eligible to claim the land.\n\nShanti challenged the decision, arguing that she was not seeking a fresh allotment of government land. Instead, she was claiming the rights arising from the existing grant made in favour of her father.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 07:34 PM IST", "pub_date_relative": "16m ago"}, {"title": "S&P 500 hits record high as AI stocks shrug off bond market slump", "full_content": "Wall Street\u2019s blue-chip index touches fresh peak but rally increasingly reliant on handful of tech stocks", "source": "FT Markets", "pub_date_str": "06 Oct 2026, 07:33 PM IST", "pub_date_relative": "16m ago"}, {"title": "This struggling gaming stock is bound to bounce back, Deutsche Bank says", "full_content": "The investment bank upgraded the gambling stock to buy from hold.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 07:33 PM IST", "pub_date_relative": "16m ago"}, {"title": "Blaize shares plunge as guidance cut and DOJ subpoenas prompt Wall St downgrades", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 07:33 PM IST", "pub_date_relative": "16m ago"}, {"title": "Toshiba and Seagate seek to acquire TDK\u2019s magnetic head unit, Goldman comments", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 07:33 PM IST", "pub_date_relative": "17m ago"}, {"title": "UBS raises Valero Energy stock price target on refining strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 07:32 PM IST", "pub_date_relative": "17m ago"}, {"title": "UBS reiterates Abbvie stock rating on positive cancer trial data", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 07:32 PM IST", "pub_date_relative": "17m ago"}, {"title": "UBS reiterates Delta Air Lines stock rating on Q3, Q4 outlook he told CNBC's Julia Boorstin in the latest episode of the \"CNBC Changemakers\" podcast.\n\nIbrahim has spent almost a decade helping Google DeepMind build artificial intelligence and stay ahead of the thorny ethical, and downright existential , questions that surround the rapidly advancing technology. Now, she is focused on whether workers, schools and communities are prepared for what comes next.\n\nEarlier this year, Ibrahim shifted into her new role from being Google DeepMind's chief operating officer. The job, she says, is not about DeepMind's own readiness for AI, but about helping the rest of the world understand and adapt as changes accelerate and as AI moves beyond the lab and into more parts of everyday life, from scientific research and weather forecasting to education and workplace productivity.\n\nFor Ibrahim, the question is not whether AI will become more capable, or exactly how it will. The more important question, she says, is whether people have a say in how it is used. \"While I might not know what it will do, I know that we still can \u2013 we have the agency to shape how we get there,\" she said. But she added, \"You can't shape the right future unless you do so with the communities that it's going to impact.\"\n\nFor workers confronting headlines about AI-driven layoffs and automation, her advice is simple: begin using the technology.\n\n\"You have to start using AI yourself and create the time and space to do it,\" she said. \"You don't have to be the smartest in the room.\"", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 07:30 PM IST", "pub_date_relative": "20m ago"}, {"title": "64% of Gen Z has tried manifestation, psychics or other mystical dating tactics: \u2018People don't feel like they're in control,' says relationship coach", "full_content": "When it comes to their love lives, young people are leaning into the mystical.\n\nManifestation, psychics, astrology, tarot cards, love spells \u2014 64% of Gen Z and 51% of millennial adults have tried at least one, according to a new survey of 1,013 Americans ages 18 to 60 by DatingNews (with an estimated margin of error of \u00b13.1 percentage points at the 95% confidence level). That compares with 25% of Gen X and 12% of Boomers.\n\nAmy Chan, relationship coach and author of \" Unsingle : How to Date Smarter and Create Love That Lasts,\" is seeing these trends now more than ever. \"Especially the astrology thing,\" she says , adding that, \"I can't escape the conversation about astrology and Mercury in retrograde.\"\n\nNew York City-based psychologist Sabrina Romanoff has seen an uptick in this behavior among her clients as well. \"In the past I've heard people bring it up as a joke,\" she says . Now they're embracing it.\n\nA tarot card reading can cost up to $162, according to Thumbtack . Love spells can go for as little as $2 on Etsy . Here's why Chan and Romanoff think young singles are getting witchy, and their advice to people trying these tactics as they look for love.\n\nThe bottom line of why people try psychics and love spells is uncertainty.\n\n\"When people don't feel like they're in control \u2014 and right now, dating is a dumpster fire,\" says Chan, \"people become more vulnerable to magical thinking.\" It gives them the sense that they're taking the reins and even provides some hope.\n\nGen Zers in particular are just starting their adult lives and face many unknowns. \"There's just so much uncertainty,\" says Romanoff, \"not just with love, but every single expectation that a lot of Gen Z had about their future has kind of just crumbled.\" That might make them more susceptible to leaning into the mystical than anyone, she says.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 07:30 PM IST", "pub_date_relative": "20m ago"}, {"title": "My brother-in-law convinced his parents to sign over their home and savings to buy a $3 million compound. Do I intervene?", "full_content": "\u201cHe estimates the mortgage will be $10,000 a month once both homes are sold, or $14,000 if they are not sold in time.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 07:30 PM IST", "pub_date_relative": "20m ago"}, {"title": "Prediction markets are coming for pop culture", "full_content": "What to know before buying event contracts around your favorite reality shows and entertainers.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 07:28 PM IST", "pub_date_relative": "22m ago"}, {"title": "Would you buy a Yankees ETF?", "full_content": "Everything is gambling these days", "source": "FT Markets", "pub_date_str": "06 Oct 2026, 07:26 PM IST", "pub_date_relative": "24m ago"}, {"title": "Wall Street is hyping AI. This fund manager is betting instead on fires, HVAC and Berkshire Hathaway.", "full_content": "The co-portfolio manager at Heartland Advisors urges investors to shut out Wall Street\u2019s hype on AI and look for companies that can use its technology as costs come down.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 07:24 PM IST", "pub_date_relative": "26m ago"}, {"title": "Russian lab worker's suspected plague death leaves experts puzzled", "full_content": "The unexplained death of a lab technician at a Russian research institute handling plague bacteria has raised questions among infectious disease experts, who say the circumstances surrounding the case are unusual and key details remain unanswered.\n\nAccording to local reports, some 200 people have been put under medical observation , or quarantined, in the Siberian area of Irkutsk. Other reports say an incident in the lab dealing with the bacteria preceded the fatality. CNBC has not been able to independently verify these reports.\n\nRussia told the World Health Organization on Tuesday that no cases of plague had been recorded in Irkutsk, according to a WHO spokesperson. It wasn't immediately clear if that included the diseased lab worker.\n\nWhile the WHO and health authorities around the world say the risk of a wider outbreak appears low, experts told CNBC that the reported circumstances of the death are difficult to reconcile with the stringent safeguards normally used when working with the deadly pathogen.\n\nJavier Pizarro-Cerda, head of the Yersinia Research Unit at the Institut Pasteur in Paris, told CNBC he was \"very surprised\" by the report coming out of Russia, since people working with plague normally take serious protective measures because of the dangers of exposure.\n\n\"You work with a full body suit. You work with masks. You work with gloves. So even if you break a tube, normally you should be protected,\" he said. In Russia, there's also a vaccine for plague. However, it doesn't meet the standards expected elsewhere and offers low, transient protection, Pizarro-Cerda added.\n\nPlague is an often fatal disease with very rapid progression. The fatality rate of pneumonic plague is nearly 100% if left untreated, and about 50% if treated.\n\nSeveral experts on the Yersinia pestis bacterium that causes plague told CNBC that isolation and monitoring of anyone who had been in contact with the diseased person is a normal and sensible strategy.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 07:22 PM IST", "pub_date_relative": "27m ago"}, {"title": "Titan Q2FY27 update: Consumer businesses grow 25% YoY, jewellery up 21%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Titan Q2FY27 update: Consumer businesses grow 25% YoY, jewellery up 21% Titan Company Share Price Kalyan Jewellers India Share Price Thangamayil Jewellery Share Price PC Jeweller Share Price Bluestone Jewellery and Lifestyle Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Titan Q2FY27 update: Consumer businesses grow 25% YoY, jewellery up 21% SECTIONS Titan el AI rally ETMarkets.com Last Updated: Oct 06, 2026, 07:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Tuesday, the S&P 500 and Nasdaq hit all-time highs, buoyed by falling Treasury yields and easing oil prices. Investors are optimistic as they look forward to the upcoming earnings season, particularly for technology stocks. While many of the Magnificent Seven saw upward trends, Apple and Alphabet experienced minor losses.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 07:22 PM IST", "pub_date_relative": "27m ago"}, {"title": "Anduril lands $2.9 billion Navy submarine shipyard contract days after Luckey joins Pentagon weapons group", "full_content": "Anduril won an up to $2.9 billion contract with the U.S. Navy on Tuesday to boost submarine production, days after co-founder Palmer Luckey was named to a Pentagon future weapons task force.\n\nThe company is also investing $3.7 billion to scale a new shipyard at Sparrows Point, outside Baltimore, Maryland, slated to start operations in 2030 and create about 3,100 jobs.\n\nAnduril said the 2 million-square-foot facility will build components for the Virginia-class submarine. Some parts, including torpedo tubes, will be manufactured at a 160,000-square-foot facility in Orange County, California.\n\n\"This is about putting more food on the table and being able to meet the requirements that our country has to produce more submarines,\" said Anduril President and Chief Strategy Officer Chris Brose in a press briefing.\n\nThe deal comes days after the Department of Defense tapped Luckey to join a new initiative called Project Meridian to identify and develop capabilities for future U.S. conflicts, raising questions over defense tech's growing sway in Washington as the companies compete for government contracts.\n\nFormer House Speaker Newt Gingrich and SpaceX CEO Elon Musk are also part of the project. Both SpaceX and Anduril are actively working with the U.S. government.\n\nDefense tech companies and their leaders have seen their influence grow in Washington in recent months as President Donald Trump seeks to bolster U.S. military capabilities, including shipbuilding.\n\nMarc Andreessen , whose venture firm Andreessen Horowitz pours billions into defense tech firms, including Anduril, was named to the Pentagon's defense policy board this summer, alongside Thiel Capital's Blake Masters.", "source": "CNBC World Economy", "pub_date_str": "06 Oct 2026, 07:22 PM IST", "pub_date_relative": "27m ago"}, {"title": "McKesson and CD&R strike $5.8bn deal to buy infusion services provider", "full_content": "Acquisition of Option Care Health is latest buyout of a healthcare services company trading below historic valuation multiples", "source": "FT Markets", "pub_date_str": "06 Oct 2026, 07:22 PM IST", "pub_date_relative": "28m ago"}, {"title": "Private equity inflow in office assets rises 7 pc to USD 945 million in Apr-Sep: Anarock", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Mar full_content": "Avengers: Endgame: Encore earned Rs 24.87 lakh on Day 11, registering a 76.6% decline from Rs 1.06 crore on the previous day.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:19 PM IST", "pub_date_relative": "31m ago"}, {"title": "Investor awareness key to long-term wealth creation, technology double-edged sword: ANMI President Kamlesh Shroff", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Investor awareness key to long-term wealth creation, technology double-edged sword: ANMI President Kamlesh Shroff The Economic Times daily newspaper is available online now. Read Today's Paper Investor awareness key to long-term wealth creation, technology double-edged sword: ANMI President Kamlesh Shroff SECTIONS Investor awareness key to long-term wealth creation, technology double-edged sword: ANMI President Kamlesh Shroff ANI Last Updated: Oct 06, 2026, 07:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Investor education in India is vital for effective market participation and wealth accumulation. The trend of younger investors signifies a promising advantage for early market entry. Nonetheless, the escalating prevalence of online financial scams threatens investor assets. SEBI highlights capital protection through regulated investment pathways and stresses the necessity for investors to cautiously validate the legitimacy of entities before making fund transfers, thereby mitigating scam risks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 07:17 PM IST", "pub_date_relative": "32m ago"}, {"title": "Real estate investment for NRIs: Why you shouldn't treat your property in India as passive asset", "full_content": "Indian property can be a good investment for Non-Resident Indians (NRIs). However, buying a home or plot does not end their responsibilities. Property needs regular attention even when its owner lives abroad. Treating it as something you can buy and forget may create expensive problems.\n\nNRiSimplify co-founder Gaurav Matta said, \u201cIndian real estate can be an excellent investment for an NRI, but it is rarely passive. The investment doesn't end when you buy the property. Someone has to manage the tenant, rent, maintenance, taxes, documentation and compliance. When you sell, you have to deal with capital gains, TDS and repatriation.\u201d\n\nUnlike a mutual fund investment, property involves work. Someone must collect rent, manage tenants, arrange repairs and check property tax payments.\n\nHousing society disputes and sudden plumbing problems also need attention. Distance and time zone differences can make these tasks harder.\n\nA trusted local representative or paid property manager can help handle these responsibilities. Without supervision, minor maintenance problems may lead to serious damage.\n\nUnchecked property issues can also lead to disputes over illegal occupation. Owners must therefore budget for management, rather than assuming rent will arrive without effort.\n\nTaxes and paperwork add another layer of responsibility. NRIs must follow rules under the Foreign Exchange Management Act when buying or selling. Rent earned in India is taxable. Owners need to manage their PAN details and file local tax returns.\n\nSelling brings further tax complications, including Tax Deducted at Source (TDS). The supplied text says buyers deduct TDS from the entire sale amount.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 07:14 PM IST", "pub_date_relative": "35m ago"}, {"title": "Meesaya Murukku 2 Box Office Collection Day 11: Hiphop Tamizha Starrer Sees Sharp Slide \u2014 Check Earnings", "full_content": "Meesaya Murukku 2 recorded a collection of Rs 2.1 crore on Day 6, marking a 10.6% decline from the previous day. With this, the film's India net collection reached Rs 21.45 crore, while its India gross stood at Rs 25 crore.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:13 PM IST", "pub_date_relative": "37m ago"}, {"title": "E-Commerce GST Overhaul On Cards: One-Time Verification, 'Same Delivery, Same Tax' Proposed", "full_content": "The move could bring greater consistency to GST treatment across e-commerce business models and address differences arising from the way platforms structure their contracts with service providers.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:10 PM IST", "pub_date_relative": "39m ago"}, {"title": "Despite 13% drop in 2026, Antique gives a 'buy' rating to this T&D stock | check target, stop loss, rationale", "full_content": "Domestic brokerage firm Antique Stock Broking, in its latest report, has initiated coverage on Transrail Lighting with a bullish outlook even as the stock remains stuck in the bear zone.\n\nThe shares have lost 13.5% of their value in 2026 and fallen to a record low last month, but Antique Stock Broking sees a reversal in the rally as it sees an opportunity in the structural and multi-year power T&D investment cycle, supported by rising renewable capacity, increasing power demand, grid modernization, and the growing need for high-voltage transmission infrastructure.\n\nAntique Stock Broking believes that the company is well-positioned to capitalize on the rising demand and underscores that it has entered this growth phase with strong execution capabilities, an established presence across domestic and international markets, and a robust order book of \u20b9 160 billion, including L1, providing more than two years of revenue visibility.\n\nThe brokerage highlighted the company's steady order inflows, standing at \u20b9 85 billion in FY26, which is also well diversified across geographies, with international orders accounting for 39%, thereby reducing dependence on the domestic market.\n\nIn addition, the company is also witnessing a healthy bidding pipeline across India and overseas markets, providing a strong opportunity to replenish the order book and sustain growth beyond the existing execution visibility.\n\nAided by favorable power T&D capex tailwinds, a healthy tender pipeline and order book position, doubling of manufacturing capacity, and a focus on disciplined execution, Antique Stock Broking believes that the company is on course for a healthy growth trajectory.\n\nTherefore, Antique Stock Broking has initiated coverage on the stock with a 'buy' rating and set a target price of \u20b9 851, which indicates a massive 76.5% surge from the stock's Tuesday closing price of \u20b9 482.\n\nOver FY22-26, the company has gradually emerged as a strong financial franchise by delivering robust performan.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 07:10 PM IST", "pub_date_relative": "40m ago"}, {"title": "Google makes a fresh bet on nuclear power as the AI energy crunch intensifies", "full_content": "Constellation\u2019s stock is rising sharply following a deal that equates to as much power as would be supplied by a new nuclear reactor.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 07:10 PM IST", "pub_date_relative": "40m ago"}, {"title": "Vitol chief warns of tanker shortage and risk of $200-a-barrel oil", "full_content": "Head of world\u2019s largest independent oil trader says shipping squeeze is creating new bottleneck despite increased Gulf flows", "source": "FT Markets", "pub_date_str": "06 Oct 2026, 07:09 PM IST", "pub_date_relative": "41m ago"}, {"title": "Trent Q2 Results: Date, Time, Dividend News, Share Price History, Earnings Call Schedule And More", "full_content": "Trent Ltd. will announce its Q2 FY27 earnings on October 29, 2026, with investors focusing on revenue growth, store expansion, and margin trends amid no dividend declaration.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:06 PM IST", "pub_date_relative": "43m ago"}, {"title": "Trump is promising $90 Medicare rebate checks ahead of the midterms. Here\u2019s the hidden cost.", "full_content": "The president is betting that he can make seniors forget rising healthcare costs", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 07:06 PM IST", "pub_date_relative": "44m ago"}, {"title": "Messi's Farewell: Why Roma Blocked Paulo Dybala, Nahuel Molina From Argentina's Match Against Benin", "full_content": "Roma has blocked Dybala and Molina from attending Messi's farewell due to the long journey and the proximity of the club's next fixtures.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:04 PM IST", "pub_date_relative": "45m ago"}, {"title": "Paramount Closes Warner Bros. Merger In Historic Hollywood Deal", "full_content": "The new company, which will be called Skydance, combines two of the five largest Hollywood film studios, uniting the homes of major franchises such as Harry Potter and Mission Impossible.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:04 PM IST", "pub_date_relative": "46m ago"}, {"title": "Utkarsh SFB Q2 Business Update: Disbursements Jump 55%; CASA Growth Outpaces Deposits", "full_content": "Utkarsh Small Finance Bank reported a sharp rise in Q2 disbursements, led by non-JLG lending, while CASA deposits grew more than twice as fast as overall deposits.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:02 PM IST", "pub_date_relative": "47m ago"}, {"title": "The best October Prime Day tech deals we found - The Verge", "full_content": "The best October Prime Day tech deals we found The Verge It\u2019s Prime Day (Again). Here Are The Best Deals From Amazon\u2019s Prime Big Deal Days. The New York Times October Prime Day deals are live: The best Amazon sales from Hanes, Carhartt, Apple and more during Big Deal Days Yahoo Prime Big Deal Days: Our biggest deals to kick off fall and holiday shopping October 6-7 About Amazon We're live-tracking Amazon's Prime Big Deal Days sale today, Oct. 6 usatoday.com", "source": "Google News Business", "pub_date_str": "06 Oct 2026, 06:57 PM IST", "pub_date_relative": "52m ago"}, {"title": "Fed minutes coming tomorrow could give markets important clues about future rate hikes", "full_content": "Minutes from the September meeting may provide extra context, as the real fed-funds rate is now surprisingly low.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 06:57 PM IST", "pub_date_relative": "53m ago"}, {"title": "Trump allows cheaper, dyed diesel on highways to blunt historic fuel cost spike ahead of midterms", "full_content": "President Donald Trump has allowed the use of cheaper red-dyed diesel, typically reserved for farm operations, to be used more broadly in an attempt to bring down record-high fuel costs.\n\nTrump signed an executive order Monday evening stateside to temporarily allow truckers and farmers to use red-dyed diesel \u2014 which is exempt from highway fuel taxes \u2014 and deferred related taxes on the fuel through the end of this year.\n\nThe tax-free diesel is typically used by farm equipment, construction machinery, trucks and other off-road vehicles. It is therefore exempt from a 24.4-cent-per-gallon tax applied to diesel fuel sold for highway transportation.\n\nUsing dyed diesel in vehicles operated on public roads is considered illegal, and could result in fines for tax evasion. But several states this year have relaxed restrictions on the tax-exempt diesel to help Americans cope with surging fuel prices.\n\nThe U.S. national average price of diesel topped $6 a gallon in September for the first time ever, as fuel supply disruptions triggered by the conflicts in Ukraine and Iran pushed up transportation costs across the country. Americans are spending about $700 million more per day on gas and diesel than they did a year ago, according to Bob McNally, president of Rapidan Energy.\n\nThe White House said truckers could save more than $100 per fill-up .\n\nThe order also directed the Treasury secretary , in consultation with the Department of Defense, to defer collection of the federal excise tax on highway diesel through the end of 2026, without interest or penalties, according to a fact sheet released by the White House. The Treasury is also directed to \"explore pathways to eliminate the obligation to pay the deferred taxes\" altogether.\n\nThe Trump administration cited tight global supply tied to the war in Ukraine and a lack of refining capacity as pushing up diesel prices and household costs.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 06:56 PM IST", "pub_date_relative": "53m ago"}, {"title": "Proposal to scrap GST officers' arrest powers based on 'trust'; states likely to back move: Sources", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Proposal to scrap GST officers' arrest powers based on 'trust'; states likely to back move: Sources The Economic Times daily newspaper is available online now. Read Today's Paper Proposal to scrap GST officers' arrest powers based on 'trust'; states likely to back move: Sources SECTIONS Proposal to scrap GST officers' arrest powers based on 'trust'; states likely to back move: Sources PTI Last Updated: Oct 06, 2026, 06:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The 57th meeting of the GST Council, to be chaired by Union Finance Minister Nirmala Sitharaman and comprising state finance ministers, will on October 8 deliberate significant changes to the GST enforcement framework, including removing the arrest powers of GST officers.\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "06 Oct 2026, 06:55 PM IST", "pub_date_relative": "54m ago"}, {"title": "Wrong Labels, High Pesticide Residues Holding Back Agri Exports | The Reason Why", "full_content": "India needs stronger domestic food-safety and labelling standards, with best practices becoming part of everyday business for farmers, traders and food companies.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 06:54 PM IST", "pub_date_relative": "55m ago"}, {"title": "Mideast Oil Chiefs Warn World Needs To Share Iran War Costs", "full_content": "The conflict has led to widespread damage to oil pipelines, refineries, gas plants and dozens of tankers, racking up a bill for new investment that is already in the tens of billions of dollars.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 06:53 PM IST", "pub_date_relative": "56m ago"}], "cfa": [{"title": "Russia\u2019s neighbor backs push to lift ban on nuclear weapons, prompting outcry from Moscow", "full_content": "The Kremlin on Tuesday warned a preliminary decision by Lithuanian lawmakers to lift a constitutional ban on hosting nuclear weapons and the potential deployment of a NATO military base in the country will mark \"another significant escalation\" of regional tensions.\n\nThe comments come shortly after Lithuania's parliament voted in favor of advancing a constitutional change on deploying nuclear weapons on its territory. It is the first of two ballots required for the change, with the latter scheduled for Jan. 12 next year.\n\nThe country, which is a member of both the European Union and NATO and shares a border with Russia's Kaliningrad exclave on the Baltic Sea, has been looking to remove the constitutional ban to strengthen its resilience amid growing security concerns.\n\nLithuania has been one of Ukraine's staunchest allies during Russian President Vladimir Putin 's more than 4\u00bd-year conflict with Kyiv, providing extensive military equipment and financial support.\n\nPresident Donald Trump , meanwhile, said he would consider Lithuania's request for a permanent U.S. military base in the country. \"They are friends of mine. They are great people, so we will certainly look at it,\" Trump said Monday.\n\nAsked about the developments, Kremlin spokesperson Dmitry Peskov said Tuesday that they \"cannot be perceived as anything other than a step toward escalating tensions, just as the deployment of nuclear weapons in a neighboring country cannot,\" according to Russian state news agency Tass.\n\n\"Neither of these developments will contribute to stability and predictability on the European continent. On the contrary, they will, to our regret, mark yet another significant escalation of tensions.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 07:45 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Should I put my nest egg in a 30-year Treasury bond?", "full_content": "Risk comes in many forms, even with \u201csafe\u201d investments.", "source": "MarketWatch Top Stories", "pub_date_str": "06 Oct 2026, 07:41 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "US Stock Market Today: S&P, Nasdaq Gain On Lower Oil And Bond Yields", "full_content": "US stocks gained in early trade as easing oil prices and lower Treasury yields lifted sentiment, with the S&P 500 and Nasdaq leading the advance.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:39 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "S&P 500 rises to record high as oil and yields move lower: Live updates", "full_content": "The S&P 500 rose to a fresh all-time intraday high on Tuesday, boosted by gains in key technology names as well as declines in oil prices and Treasury yields.\n\nThe broad market index was last up 0.5%, while the Dow Jones Industrial Average gained 205 points, or 0.4%. The Nasdaq Composite added 0.5% and had hit a new all-time high as well.\n\nThe moves higher were bolstered by a rise in chipmakers. Shares of Marvell Technology popped 7%, while others such as Nvidia and Broadcom traded up around 1% each.\n\nAdditionally, the benchmark 10-year Treasury note yield fell 2 basis points to 5.29% after scaling to levels not seen since 2002 on Monday. The 2-year Treasury yield declined 3 basis points to 4.802%.\n\nBonds have been volatile over the past six weeks, Morgan Stanley Wealth Management investment chief Lisa Shalett said in a note to clients. She cited a potentially new Fed policy framework, economic growth and high oil prices while the Middle East conflict stretches on as factors.\n\n\"Nevertheless, while intraday implied volatility has risen, the six-week stretch has not reached the extremes that catalyzed the 2022 equity bear market,\" Shalett wrote.\n\nTraders are now looking ahead to the Federal Reserve's minutes from its September meeting due Wednesday, which could shed some light on policymakers' move to raise rates.\n\nAlongside Treasury yields, a drop in oil prices also gave equities a boost Tuesday. Brent crude traded 2% lower at around $98 per barrel. West Texas Intermediate futures shed 1% to roughly $87 a barrel.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 07:38 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Shares Of SK Hynix, SanDisk And Intel Buck Wider Trend, Commencing Trade In Red Amid Investor Caution", "full_content": "Other chip stocks traded at a marginal uptick, with Advanced Micro Devices's share price being up 1.36% to $640.34", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:37 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Can a married daughter be denied inheritance rights? Here's what Himachal Pradesh HC ruled", "full_content": "The Himachal Pradesh High Court has ruled that a woman cannot be denied her claim to government-allotted family land merely because she is married.\n\nThe court held that the Himachal Pradesh Nautor Land Rules, 1968, do not expressly disqualify a married daughter from succeeding to land granted to her parents. It also ruled that an administrative clarification cannot impose a restriction that is not contained in the statutory rules.\n\nThe judgment, delivered on September 14, involved a woman\u2019s claim to 3 bigha and 2 biswas of agricultural land in Shimla that had originally been granted to her father in 1972.\n\nThe Himachal Pradesh government had granted the agricultural land to Mina Ram under the Nautor Land Rules, 1968, on August 25, 1972. While possession of the land was handed over, the patta, or official document recording the grant, was not executed by the revenue authorities.\n\nAfter Mina Ram died in 1990, his wife Sewati Devi approached the authorities seeking the patta. However, the document remained unsigned.\n\nFollowing Sewati Devi's death in 2012, the couple's only daughter, Shanti, sought the patta and claimed the rights attached to her late father's land grant.\n\nThe authorities rejected her application on the ground that a married daughter was not eligible to claim the land.\n\nShanti challenged the decision, arguing that she was not seeking a fresh allotment of government land. Instead, she was claiming the rights arising from the existing grant made in favour of her father.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 07:34 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500 hits record high as AI stocks shrug off bond market slump", "full_content": "Wall Street\u2019s blue-chip index touches fresh peak but rally increasingly reliant on handful of tech stocks", "source": "FT Markets", "pub_date_str": "06 Oct 2026, 07:33 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "UBS reiterates Delta Air Lines stock rating on Q3, Q4 outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Oct 2026, 07:32 PM IST", "pub_date_relative": "17m nd toward long-term investments in India's dynamic real estate market.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 07:19 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Investor awareness key to long-term wealth creation, technology double-edged sword: ANMI President Kamlesh Shroff", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Investor awareness key to long-term wealth creation, technology double-edged sword: ANMI President Kamlesh Shroff The Economic Times daily newspaper is available online now. Read Today's Paper Investor awareness key to long-term wealth creation, technology double-edged sword: ANMI President Kamlesh Shroff SECTIONS Investor awareness key to long-term wealth creation, technology double-edged sword: ANMI President Kamlesh Shroff ANI Last Updated: Oct 06, 2026, 07:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Investor education in India is vital for effective market participation and wealth accumulation. The trend of younger investors signifies a promising advantage for early market entry. Nonetheless, the escalating prevalence of online financial scams threatens investor assets. SEBI highlights capital protection through regulated investment pathways and stresses the necessity for investors to cautiously validate the legitimacy of entities before making fund transfers, thereby mitigating scam risks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 07:17 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Real estate investment for NRIs: Why you shouldn't treat your property in India as passive asset", "full_content": "Indian property can be a good investment for Non-Resident Indians (NRIs). However, buying a home or plot does not end their responsibilities. Property needs regular attention even when its owner lives abroad. Treating it as something you can buy and forget may create expensive problems.\n\nNRiSimplify co-founder Gaurav Matta said, \u201cIndian real estate can be an excellent investment for an NRI, but it is rarely passive. The investment doesn't end when you buy the property. Someone has to manage the tenant, rent, maintenance, taxes, documentation and compliance. When you sell, you have to deal with capital gains, TDS and repatriation.\u201d\n\nUnlike a mutual fund investment, property involves work. Someone must collect rent, manage tenants, arrange repairs and check property tax payments.\n\nHousing society disputes and sudden plumbing problems also need attention. Distance and time zone differences can make these tasks harder.\n\nA trusted local representative or paid property manager can help handle these responsibilities. Without supervision, minor maintenance problems may lead to serious damage.\n\nUnchecked property issues can also lead to disputes over illegal occupation. Owners must therefore budget for management, rather than assuming rent will arrive without effort.\n\nTaxes and paperwork add another layer of responsibility. NRIs must follow rules under the Foreign Exchange Management Act when buying or selling. Rent earned in India is taxable. Owners need to manage their PAN details and file local tax returns.\n\nSelling brings further tax complications, including Tax Deducted at Source (TDS). The supplied text says buyers deduct TDS from the entire sale amount.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 07:14 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Meesaya Murukku 2 Box Office Collection Day 11: Hiphop Tamizha Starrer Sees Sharp Slide \u2014 Check Earnings", "full_content": "Meesaya Murukku 2 recorded a collection of Rs 2.1 crore on Day 6, marking a 10.6% decline from the previous day. With this, the film's India net collection reached Rs 21.45 crore, while its India gross stood at Rs 25 crore.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:13 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Despite 13% drop in 2026, Antique gives a 'buy' rating to this T&D stock | check target, stop loss, rationale", "full_content": "Domestic brokerage firm Antique Stock Broking, in its latest report, has initiated coverage on Transrail Lighting with a bullish outlook even as the stock remains stuck in the bear zone.\n\nThe shares have lost 13.5% of their value in 2026 and fallen to a record low last month, but Antique Stock Broking sees a reversal in the rally as it sees an opportunity in the structural and multi-year power T&D investment cycle, supported by rising renewable capacity, increasing power demand, grid modernization, and the growing need for high-voltage transmission infrastructure.\n\nAntique Stock Broking believes that the company is well-positioned to capitalize on the rising demand and underscores that it has entered this growth phase with strong execution capabilities, an established presence across domestic and international markets, and a robust order book of \u20b9 160 billion, including L1, providing more than two years of revenue visibility.\n\nThe brokerage highlighted the company's steady order inflows, standing at \u20b9 85 billion in FY26, which is also well diversified across geographies, with international orders accounting for 39%, thereby reducing dependence on the domestic market.\n\nIn addition, the company is also witnessing a healthy bidding pipeline across India and overseas markets, providing a strong opportunity to replenish the order book and sustain growth beyond the existing execution visibility.\n\nAided by favorable power T&D capex tailwinds, a healthy tender pipeline and order book position, doubling of manufacturing capacity, and a focus on disciplined execution, Antique Stock Broking believes that the company is on course for a healthy growth trajectory.\n\nTherefore, Antique Stock Broking has initiated coverage on the stock with a 'buy' rating and set a target price of \u20b9 851, which indicates a massive 76.5% surge from the stock's Tuesday closing price of \u20b9 482.\n\nOver FY22-26, the company has gradually emerged as a strong financial franchise by delivering robust performan.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 07:10 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trent Q2 Results: Date, Time, Dividend News, Share Price History, Earnings Call Schedule And More", "full_content": "Trent Ltd. will announce its Q2 FY27 earnings on October 29, 2026, with investors focusing on revenue growth, store expansion, and margin trends amid no dividend declaration.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:06 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Paramount Closes Warner Bros. Merger In Historic Hollywood Deal", "full_content": "The new company, which will be called Skydance, combines two of the five largest Hollywood film studios, uniting the homes of major franchises such as Harry Potter and Mission Impossible.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 07:04 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trump allows cheaper, dyed diesel on highways to blunt historic fuel cost spike ahead of midterms", "full_content": "President Donald Trump has allowed the use of cheaper red-dyed diesel, typically reserved for farm operations, to be used more broadly in an attempt to bring down record-high fuel costs.\n\nTrump signed an executive order Monday evening stateside to temporarily allow truckers and farmers to use red-dyed diesel \u2014 which is exempt from highway fuel taxes \u2014 and deferred related taxes on the fuel through the end of this year.\n\nThe tax-free diesel is typically used by farm equipment, construction machinery, trucks and other off-road vehicles. It is therefore exempt from a 24.4-cent-per-gallon tax applied to diesel fuel sold for highway transportation.\n\nUsing dyed diesel in vehicles operated on public roads is considered illegal, and could result in fines for tax evasion. But several states this year have relaxed restrictions on the tax-exempt diesel to help Americans cope with surging fuel prices.\n\nThe U.S. national average price of diesel topped $6 a gallon in September for the first time ever, as fuel supply disruptions triggered by the conflicts in Ukraine and Iran pushed up transportation costs across the country. Americans are spending about $700 million more per day on gas and diesel than they did a year ago, according to Bob McNally, president of Rapidan Energy.\n\nThe White House said truckers could save more than $100 per fill-up .\n\nThe order also directed the Treasury secretary , in consultation with the Department of Defense, to defer collection of the federal excise tax on highway diesel through the end of 2026, without interest or penalties, according to a fact sheet released by the White House. The Treasury is also directed to \"explore pathways to eliminate the obligation to pay the deferred taxes\" altogether.\n\nThe Trump administration cited tight global supply tied to the war in Ukraine and a lack of refining capacity as pushing up diesel prices and household costs.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 06:56 PM IST", "pub_date_relative": "53m     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
