further problems might arise as the news develops. \"What else has Jensen done?\" he said.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 08:05 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Baird downgrades Nvidia on China curbs, AI demand worries", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Baird downgrades Nvidia on China curbs, AI demand worries Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Baird downgrades Nvidia on China curbs, AI demand worries SECTIONS Baird downgrades Nvidia on China curbs, AI demand worries Reuters Last Updated: Nov 11, 2026, 08:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Baird downgraded Nvidia's stock and cut its price target significantly due to various market risks. Concerns over US restrictions on chip sales to China have emerged, affecting Nvidia's revenue outlook. Demand for Nvidia's chips is showing signs of softening amid supply constraints and market uncertainties. Additionally, multiple brokerages have removed Nvidia from their top picks due to recent stock declines.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 08:04 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil Rebounds After Two-Day Drop on U.S.-Iran Conflict Uncertainty - WSJ", "full_content": "Oil Rebounds After Two-Day Drop on U.S.-Iran Conflict Uncertainty WSJ Oil rises from two-month low as Hormuz shipping attacks offset Iran truce hopes CNBC COMMENTARY: Trump\u2019s Iran war pause is as costly as new strikes Reuters Oil Prices Rebound as Middle East Supply Risks Persist WSJ Dow Jones Top Energy Headlines at 4 AM ET: Oil Prices Rebound as Middle East Supply Risks Persist | KKR, ... Moomoo", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why Nvidia Stock Is Rising Despite Wall Street\u2019s First Call for Jensen Huang to Step Down - Barron's", "full_content": "Why Nvidia Stock Is Rising Despite Wall Street\u2019s First Call for Jensen Huang to Step Down Barron's Jim Cramer says Nvidia investors need to prepare for a future without Jensen Huang CNBC Nvidia stock gets its first boost of the Jensen Huang scandal era. What's driving shares higher today? Fast Company Michael Burry calls Nvidia 'a heck of a trade' while betting big on MercadoLibre (NVDA:NASDAQ) Seeking Alpha Is Nvidia Still Cheap? Real Investment Advice", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 07:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fed's Goolsbee calls inflation report 'borderline disturbing' as central bank weighs more hikes", "full_content": "Chicago Federal Reserve President Austan Goolsbee called the latest inflation data \"borderline disturbing.\"\n\n\"It's another distressing report \u2014 borderline disturbing,\" Goolsbee said in an interview with the PBS NewsHour Tuesday.\n\n\"We've got a real inflation issue on our hands that has been developing,\" Goolsbee said. \"We're going to have to deal with that.\"\n\nThe consumer price index rose 0.4% on a seasonally adjusted basis in October, according to the Bureau of Labor Statistics' Tuesday morning release. That was higher than economists had predicted, and the third straight month of outsized price increases.\n\nGoolsbee said he had not seen drivers of prices like tariffs fade over time like he had hoped. He also said continuously high inflation on services concerned him.\n\nAnd the Chicago Fed chief said lofty prices are a top issue for many people he meets.\n\n\"It's on everyone's mind,\" Goolsbee said. \"It's on business mind. It's on nonprofits' minds. It's on ordinary consumers' mind.\"\n\nTuesday's inflation report landed at a critical juncture for the central bankers at the Federal Reserve as they considers their next interest-rate move \u2014 and the moves they may have to make in the months ahead if the numbers continue to come in hot.", "source": "CNBC Finance", "pub_date_str": "11 Nov 2026, 07:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Small-cap fund inflows cool in October while large-cap funds gain favour. Is the investor mood changing?", "full_content": "Equity mutual fund inflows fell about 14% month-on-month to \u20b9 32,994 crore in October, compared with \u20b9 38,307 crore in the previous month, as investments in small and mid-cap funds eased from record highs.\n\nSmall-cap fund inflows declined 29% to nearly \u20b9 6,408 crore, while mid-cap fund inflows fell 38% to \u20b9 4,893 crore, according to data released by the Association of Mutual Funds in India (AMFI).\n\nNet inflow refers to the money a particular mutual fund category receives after subtracting repurchases and redemptions from funds mobilised.\n\nHowever, the trend changed for large-cap funds , which recorded a 20% increase in inflows to \u20b9 1,032 crore in October, compared with \u20b9 859 crore last month.\n\nThis marks the second consecutive monthly rise in investments in large-cap funds, suggesting a correction in valuations has renewed retail investor interest.\n\n\u201cWithin equities, the continued improvement in large-cap inflows is encouraging, particularly as valuations have become relatively attractive, suggesting investors are increasingly looking to balance their exposure across market capitalisations,\u201d Saugata Chatterjee, President and Deputy chief executive at Nippon India Mutual Fund, said in a statement.\n\nThe difference in market performance during October may also explain the shift. The benchmark Nifty 50 and BSE Sensex gained 1.9% and 2.7%, respectively, while small-caps and mid-caps fell 4.1% and 3.4%.\n\nMarket sentiment has further improved in November, with benchmark indices rising around 10% so far this month, putting them on track for their strongest monthly gains since November 2020, Reuters reported.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 07:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "EasyJet shareholders approve \u00a35.7 billion Apollo takeover", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a EasyJet shareholders approve \u00a35.7 billion Apollo takeover Powered By The Economic Times daily newspaper is available online now. Read Today's Paper EasyJet shareholders approve \u00a35.7 billion Apollo takeover SECTIONS EasyJet shareholders approve \u00a35.7 billion Apollo takeover By Reuters Last Updated: Nov 11, 2026, 07:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis EasyJet's shareholders voted to approve a \u00a35.7 billion takeover by Apollo on Wednesday. This decision marks a major step towards removing EasyJet from the London stock market. With 97.07% of scheme shares in favor, the airline is targeting a deal completion by the first quarter of next year. Nonetheless, the takeover faces regulatory scrutiny in the EU regarding airline ownership rules.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 07:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nifty 50 target: Index in sweet spot? 28,000 soon? HSBC, Citi and Bernstein raise targets after sharp 13.5% recovery", "full_content": "The Indian stock market continued its bullish run, with both frontline indices surging nearly 1% in Wednesday's trade, hitting an 8-month high and extending last week's phenomenal rally.\n\nThe Nifty 50 has now recovered around 13.5% from its war-induced lows, while its year-to-date losses have narrowed to just 3.35% after previously slipping into double-digit declines.\n\nAlthough the Indian market's performance was relatively subdued compared with its Asian peers, most of which were trading with stronger gains, domestic equities continued to build on their recent recovery, supported by improving investor confidence and renewed buying interest.\n\nThe recovery has largely been supported by the return of overseas investors, as India becomes an increasingly attractive investment destination following the global AI-led sell-off.\n\nAdditionally, the decline in crude oil prices has helped ease inflationary pressures and improved the outlook for India's macroeconomic fundamentals. FPIs have pumped \u20b9 53,739 crore into domestic stocks in November so far, according to NSDL data.\n\nIndia\u2019s relatively limited exposure to the AI trade had made its stocks among Asia\u2019s worst performers. However, as the once high-flying trade begins to unravel, that weakness has quickly turned into a blessing.\n\nThe recent losses have also made Indian stocks more attractive, while better-than-expected corporate performance has helped support valuation multiples. This has given investors an opportunity to return to Dalal Street after largely overlooking the market for nearly two years in pursuit of AI-linked stocks.\n\nThe fallout in AI-linked stocks and the decline in crude oil prices have also caught the attention of global brokerages, prompting them to raise their targets for the Nifty 50.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 07:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Zelenskyy warns Ukraine is 'not real estate' as experts say a Russia peace deal remains elusive", "full_content": "Ukrainian President Volodymyr Zelenskyy warned that his country \"was not real estate,\" as a second and final day of U.S.-brokered peace talks wrapped up.\n\nSpeaking to reporters in Denmark late Tuesday, Zelenskyy said he was \"happy\" with what he was hearing from the peace talks in Abu Dhabi between Russian and Ukrainian representatives, but said he had been clear with U.S. envoys Steve Witkoff and Jared Kushner that \"this is a country of our nation, it is not real estate.\"\n\nHis comments come amid discussions on the future borders of Ukraine and post-war security guarantees, issues where the countries remain far apart.\n\n\"Everybody is ready for dialog. First, stop the war in Ukraine. Second, security guarantees for Ukraine. Third, maybe some dialog about these topics of security,\" Zelenskyy said. \"This sequence is very, very important.\"\n\nIt comes as the first trilateral peace talks between Russia, Ukraine and the U.S. since February concluded on Wednesday.\n\nSpeaking post-meeting, Kushner called the talks \"productive\" and said the parties had also discussed the difficult issue of territorial boundaries. The Ukrainian negotiator meanwhile said momentum was good and a solution could be reached before the end of the year.\n\nRussia chief negotiator and Putin aide Vladimir Medinsky said the parties on Wednesday had reached an agreement on a large-scale prisoner exchange, and that details would be announced soon.\n\nAnother round of exchanges of prisoners of war would be welcomed, Mykola Bielieskov, senior analyst at Ukrainian NGO Come Back Alive, told CNBC Tuesday. \"Otherwise there is no room for compromise,\" he said, adding, \"I don't have any expectations of major progress towards settlement.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India to switch bonds worth 250 billion rupees next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India to switch bonds worth 250 billion rupees next week Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India to switch bonds worth 250 billion rupees next week SECTIONS India to switch bonds worth 250 billion rupees next week Reuters Last Updated: Nov 11, 2026, 07:43:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On November 16, the Reserve Bank of India will initiate a significant switch auction worth 250 billion rupees. This maneuver involves replacing six bonds that are set to mature between 2027 and 2029 with longer-term securities extending to maturity in 2062. By doing so, the government seeks to optimize its debt repayment schedule. This follows a similar strategy of bond buyback and issuance enacted in October.\n\nDebt mutual funds staged a sharp turnaround in October, recording net inflows of Rs 1.13 lakh crore after heavy outflows in September. Liquid and overnight funds accounted for the bulk of the inflows, reflecting a seasonal reversal of quarter-end withdrawals. However, the recovery remained uneven, with several duration-oriented categories continuing to witness outflows.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Wednesday", "full_content": "CoreWeave lifts the AI trade, and my advice to Nvidia.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Amul Milk Price Hike From November 12: What Gold, Taaza And Other Variants Will Cost Now", "full_content": "The dairy cooperative has increased prices by Rs 2-4 per litre across its fresh pouch milk range, citing higher input and processing costs.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "At 3.6% Of US GDP, The AI Boom Is Bigger Than Dotcom Bubble. SBI MF Explains", "full_content": "AI expenditure marks one of the largest capital spending cycles in history, with average annual capex estimated at around 3.6% of US GDP over 202532, more than the 1.1% during the 2000 dotcom cycle and 2.2% during the 19th-century railroad boom.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 07:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Your CIBIL Score Now Moves Almost Weekly: Why Paying Monthly Bills May Not Be Helpful?", "full_content": "Credit reporting in India has become consid t 'business as usual' in return to office after affair revelation", "full_content": "Nvidia CEO Jensen Huang walked into the chipmaker's Santa Clara, California, headquarters on Monday and conducted his regular morning meeting with top-level executives, people familiar with the meeting told CNBC.\n\nOn Sunday, Huang had disclosed an extramarital affair to employees .\n\nHuang kicked off the closed-door gathering by addressing his infidelity and sharing how sorry he was to his staff, according to the people, who asked not to be named because they were not authorized to speak publicly. They said Huang didn't take any questions and quickly pivoted to business and top agenda items of the day.\n\nThe CEO was also in the office on Tuesday, conducting meetings just one week ahead of the company's quarterly earnings report.\n\nPeople inside the artificial intelligence chip giant said Huang tried to project \"business as usual,\" even as the probe moved forward into his affair with an alleged Chinese spy. The CEO was in a romantic relationship with Alice Huang , a former Megaspeed executive, according to the Financial Times .\n\nSentiment toward Jensen Huang shifted on Sunday after the 63-year-old revealed in an email to employees that he had an affair, though he did not disclose with whom he had the relationship.\n\n\"I know an apology cannot undo what I have done,\" he wrote. \"I hope our family will heal and that, over time, I can earn back your trust.\" Nvidia's board opened an investigation and hired Wachtell, Lipton, Rosen & Katz to conduct the probe on Tuesday.\n\nEmployees inside the firm described the mood to CNBC as \"sad.\" One employee told CNBC that they were shocked by Jensen Huang's revelations.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 07:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
