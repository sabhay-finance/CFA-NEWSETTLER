mentum as selling pressure returned at higher levels.\n\nThe index later slipped below 24,000 and also breached the previous session\u2019s low, falling to 23,952.55. A late recovery during the Closing Auction Session (CAS) helped trim most of the losses, with the Nifty eventually ending at 24,055.80, down 24.60 points or 0.10%.\n\nThe session formed a small-bodied candle with long shadows on both sides, resembling a High Wave candle. The pattern reflects sharp intraday swings and a lack of clear control between buyers and sellers.\n\nFrom a price structure perspective, the formation of a lower low along with a negative close keeps the near-term setup under pressure. At the same time, the index has managed to retain the 24,000 mark on a closing basis for the second straight session.\n\nIn both sessions, the Nifty slipped below the previous day\u2019s low but recovered before the close. The index is also hovering near the 61.8% retracement level of the recent upswing, making the current zone important for the next directional move.\n\nThe 23,950 level remains the immediate support to track. A sustained move below this level could weaken the setup further and bring the July 27 gap area between 23,892 and 23,824 into focus.\n\nOn the higher side, resistance is seen in the 24,209-24,244 band. This zone includes the 50-DMA as well as the declining trendline drawn from the August 3 swing high. A decisive move above this band could improve the near-term structure and allow the index to move towards the 20-DMA near 24,312.\n\nThe Nifty continues to trade below both the 20-DMA and 50-DMA. The 20-DMA is sloping lower, while the 50-DMA has turned largely flat, indicating that the earlier upward momentum has faded.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 06:16 AM IST", "pub_date_relative": "46m ago"}, {"title": "U.S. completes fresh strikes on Iran as Mideast tensions flare again", "full_content": "U.S. forces completed another wave of strikes against Iran late Tuesday stateside, hitting multiple sites across the country, in a renewed exchange of fire between the warring parties after a nearly month-long hiatus.\n\nIn a post on X, the U.S. Central Command said that the targets struck included air defense and communications sites, and radar systems, in retaliation against the \"recent attempted attacks\" by Iran against commercial shipping in the Strait of Hormuz and against American service members.\n\nTehran has responded to American strikes, targeting U.S. ally Jordan. The country's armed forces said that it was targeted by a missile attack that originated from Iranian territory.\n\nA spokesperson for Jordan's armed forces said on X that 10 of 13 missiles were intercepted by the country's air defense systems, with the three fell in remote areas. No injuries or deaths were reported.\n\nBahrain's interior ministry also announced \"an alert of potential threat\" early Wednesday local time, urging citizens to head to the nearest safe location. The nature of the threat was not immediately clear.\n\nOil prices continued to rise in Asia trading Wednesday following the strikes, after international benchmark Brent rose 4.5% to $94.52 a barrel on Tuesday, while U.S. West Texas Intermediate futures added about 5% to $90.03 per barrel, hitting levels not seen since July 24.\n\nIn a Truth Social post Tuesday U.S. President Donald Trump called the latest U.S. strikes \"large and powerful,\" and threatened further military action if Tehran retaliated against what he called a \"very justified attack.\"\n\nIranian forces on Monday stateside had hit a U.S. base in Jordan after American forces attacked rocket launchers on Iran's Larak Island the day before. Washington claimed that the launchers were preparing to fire rockets carrying sea mines into the strait.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 06:14 AM IST", "pub_date_relative": "49m ago"}], "cfa": [{"title": "Cognition set to raise $1 billion at $47 billion  to see whether they have been granted shares and the quantity received. The IPO allotment status also displays the number of shares assigned. For those who did not receive shares, the company will initiate the refund process. Allotted shares will be deposited into the recipients' demat accounts.\n\nThe initiation of the refund process will start on Thursday, 3 September, for individuals not given shares. Those allotted will receive their shares in their demat accounts on Thursday. ESDS Software Solution IPO listing date is scheduled for Friday, 4 September.\n\nIf you have applied for the ESDS Software Solution IPO, you can do a ESDS Software Solution IPO status check on the website of the IPO registrar, which is MUFG Intime India Private Ltd.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 06:46 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20142 September 2026", "full_content": "Buy or sell stocks : Benchmark indices Sensex and Nifty closed slightly lower on Tuesday, weighed down by elevated crude oil prices and renewed tensions between the US and Iran, which dampened investor sentiment.\n\nThe 30-share BSE Sensex ended 12.99 points, or 0.02 per cent, lower at 76,944.28 after a highly volatile session. The index was trading at 76,685.48 at 3:12 pm, down 271.79 points, before recovering most of its losses during the Closing Auction Session (CAS), which the Securities and Exchange Board of India (Sebi) began implementing in a phased manner from August 3.\n\nDuring the session, the Sensex fell as much as 301.15 points, or 0.39 per cent, to hit an intraday low of 76,656.12.\n\nMeanwhile, the 50-share NSE Nifty declined 24.60 points, or 0.10 per cent, to settle at 24,055.80 on the weekly expiry day. The index had also slipped nearly 100 points to 23,980.55 at 3:20 pm before paring losses by the close.\n\nNifty 50 ended marginally lower at 24,055.80, declining 24.60 points (-0.10%), after opening at 24,077.55, with an intraday high of 24,143.15 and low of 23,952.55. The index once again found support around the 24,000 zone and bounced initially, but later faced rejection near the previous resistance area and witnessed a sharp decline.\n\nAccording to Sumeet Bagadia, Executive Director at Choice Broking, Nifty closed below the 24,000 level and formed a bearish doji-like candle on the daily chart, reflecting indecision with selling pressure at higher levels. The index continues to trade below all key moving averages, while RSI stands at 42.86, keeping the overall momentum cautious.\n\n\u201cTechnically, Nifty is likely to maintain a Sideways bias, with the 24,000 zone continuing to remain important for the near-term structure. Immediate support is placed at 23,900\u201323,950, while 24,200\u201324,250 remains the key resistance zone.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 06:35 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ICICI closes in on HDFC Bank's no.1 spot in Nifty as share show diverges", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ICICI Bank closes in on HDFC Bank for Nifty\u2019s top spot as share trends diverge HDFC Bank Share Price ICICI Bank Share Price Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper ICICI Bank closes in on HDFC Bank for Nifty\u2019s top spot as sh efense systems, with the three fell in remote areas. No injuries or deaths were reported.\n\nBahrain's interior ministry also announced \"an alert of potential threat\" early Wednesday local time, urging citizens to head to the nearest safe location. The nature of the threat was not immediately clear.\n\nOil prices continued to rise in Asia trading Wednesday following the strikes, after international benchmark Brent rose 4.5% to $94.52 a barrel on Tuesday, while U.S. West Texas Intermediate futures added about 5% to $90.03 per barrel, hitting levels not seen since July 24.\n\nIn a Truth Social post Tuesday U.S. President Donald Trump called the latest U.S. strikes \"large and powerful,\" and threatened further military action if Tehran retaliated against what he called a \"very justified attack.\"\n\nIranian forces on Monday stateside had hit a U.S. base in Jordan after American forces attacked rocket launchers on Iran's Larak Island the day before. Washington claimed that the launchers were preparing to fire rockets carrying sea mines into the strait.", "source": "CNBC Top News", "pub_date_str": "02 Sep 2026, 06:14 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stock recommendations for 2 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Benchmark stock indices Sensex and Nifty ended marginally lower on Tuesday as high crude oil prices and fresh US-Iran tensions weighed on investor sentiment.\n\nAfter a volatile session, the 30-share BSE Sensex ended 12.99 points, or 0.02%, lower at 76,944.28. The benchmark had fallen as much as 301.15 points, or 0.39%, to 76,656.12 during the day. At 3:12 pm, it was down 271.79 points at 76,685.48, before recovering most of its losses during the Closing Auction Session (CAS), introduced by the Securities and Exchange Board of India (Sebi) from 3 August in a phased manner, according to the Press Trust of India .\n\nThe 50-share NSE Nifty slipped 24.60 points, or 0.10%, to end at 24,055.80 on the weekly expiry day. It was down nearly 100 points at 23,980.55 at 3:20 pm, according to the PTI report.\n\nAmong the 30 Sensex constituents, Maruti, State Bank of India, InterGlobe Aviation, Bajaj Finserv, Mahindra & Mahindra and Axis Bank were the major laggards.\n\nIndian equities ended a volatile session on a subdued note on 1 September, with the Nifty 50 at 24,055.80, down 24.60 points or 0.10%, after moving between 23,952.55 and 24,143.15. The index recovered sharply from afternoon lows but remained below the previous close of 24,080.40. Market breadth was notably weak, with 1,345 stocks advancing, 2,196 stocks declining, and 108 remaining unchanged, translating into an advance-decline ratio of roughly 0.61, indicating broader selling pressure despite the modest headline-index decline.\n\nSector-wise, IT (+0.98%) and FMCG (+0.94%) provided support. Meanwhile, Healthcare (-1.60%), Pharma (-1.45%), Realty (-1.42%), Consumer Durables (-1.40%), Auto (-1.22%), and PSU Banks (-1.21%) remained under pressure.", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 06:10 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Brokers brace for impact as Sebi\u2019s closing auction session weighs on F&O volumes", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStockbrokers see revenue fall by up to 20% as the Securities and Exchange Board of India's (Sebi) new closing-price mechanism weighs on futures and options (F&O) trading income, according to industry executives.\n\nSince its 3 August debut, the new framework has wiped out about half of the trading volume and value in Bank Nifty futures, according to a Mint analysis of National Stock Exchange (NSE) data.\n\nAs of 31 August, Bank Nifty futures volumes had fallen about 41% to 14,484 contracts, while traded value declined by a similar 41% to \u20b9 2,512.95 crore. Nifty futures volumes fell 8% to 51,118 contracts, while traded value dropped 9% to \u20b9 8,056.79 crore.\n\nSince a significant portion of stockbrokers' income is tied to trading activity, they may see their revenue decline by 15-20% due to lower F&O volumes, said Nilesh Sharma, executive director and president at Samco Securities. As trading volumes decline, brokerage income is expected to fall proportionately, he said.\n\nThe revenue impact, however, could vary depending on a brokerage\u2019s business mix.\n\nThe implications of weaker derivatives activity extend beyond brokerage revenues. F&O markets provide liquidity , helping investors enter and exit positions while contributing to price discovery across the broader market.\n\n\u201cThe fall in F&O volumes is certainly not positive for market sentiment,\u201d said Raj Shah, executive director at EPP Securities. \u201cA sustained decline in volumes could reduce liquidity and impact the overall market ecosystem.\u201d", "source": "LiveMint Markets", "pub_date_str": "02 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: All You Need To Know Going Into Trade On Sept 2", "full_content": "Stocks in the news, big brokerage calls of the day, complete trade setup and much more!", "source": "NDTV Profit", "pub_date_str": "02 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
