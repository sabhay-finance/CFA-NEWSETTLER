    const allData = {"general": [{"title": "Steel prices are rising again: Is it wise to buy metal stocks? Experts pick Tata Steel, JSW and 4 others | Targets, SL", "full_content": "JINDALSTEL SAMBHV MONOLITH Dhanya Nagasundaram Published 17 Nov 2026, 02:48 PM IST Prefer Livemint on Google Steel stocks are back on investors\u2019 radar as a recovery in domestic steel prices, improving operating spreads and resilient infrastructure demand lift the sector\u2019s earnings outlook. With domestic hot-rolled coil (HRC) prices hovering near four-year highs and margins improving in November, the steel sector appears to be entering a more favourable phase after a prolonged period of volatility.\n\nMarket experts believe the improving price environment offers an opportunity to selectively accumulate steel and metals stocks, rather than bet on the entire sector. While stronger realisations, infrastructure spending and capacity expansion are supporting the earnings outlook, rising coking coal costs, import pressures and global trade developments remain key risks.\n\nAnalysts are favouring companies with captive raw material resources, backward integration, operational efficiencies and a growing share of value-added products. Their preferred picks range from integrated steelmakers and specialised downstream players to companies benefiting from secondary steelmaking and improving capacity utilisation.\n\nAmong the stocks highlighted by experts are Tata Steel , JSW Steel, Jindal Steel , Lloyds Metals & Energy, Sambhv Steel Tubes and Monolithisch India . Some of these offer fundamental earnings recovery opportunities, while others are emerging as technical bets with identifiable breakout levels and upside targets.\n\nHere is what experts are saying about the steel sector and the stocks investors should watch.\n\nBhavik Bhagwanji Shah, CFA, Analyst \u2013 Metals & Mining at Choice Institutional Equities, believes selective accumulation makes sense as domestic steel prices, particularly across long products and value-added tubes, have staged a meaningful recovery after the monsoon.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:48 PM IST", "pub_date_relative": "3m ago"}, {"title": "Why is Red Cat stock crashing today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:43 PM IST", "pub_date_relative": "8m ago"}, {"title": "Earnings call transcript: Telkom posts stronger H1 2027 profits as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:43 PM IST", "pub_date_relative": "8m ago"}, {"title": "Why is Red Cat Holdings stock plummeting today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:42 PM IST", "pub_date_relative": "9m ago"}, {"title": "US to curb China\u2019s access to AI chips as Trump heads to Asia", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:42 PM IST", "pub_date_relative": "9m ago"}, {"title": "Intellia at Jefferies global healthcare conference: launch and pipeline in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:41 PM IST", "pub_date_relative": "10m ago"}, {"title": "Align Technology at jefferies global healthcare conference: leadership shift, cautious outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:41 PM IST", "pub_date_relative": "10m ago"}, {"title": "Stryker at Jefferies Global Healthcare Conference: growth, recovery and scale", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:40 PM IST", "pub_date_relative": "11m ago"}, {"title": "VF Corp at global luxury & brands conference: turnaround gains pace", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:40 PM IST", "pub_date_relative": "11m ago"}, {"title": "Mahanadi Coalfields IPO single profit calculator basis latest GMP: What investors may earn on listing?", "full_content": "Pranati Deva Published 17 Nov 2026, 02:40 PM IST Prefer Livemint on Google Mahanadi Coalfields IPO : The much-awaited Mahanadi Coalfields IPO, a Coal India subsidiary, is set to open for subscription on November 19, with investors eyeing potential listing gains as the grey market premium (GMP) provides an early indication of market expectations.\n\nAt the latest GMP of \u20b9 4.60 per share, retail investors applying for a single lot could potentially make a gain of around \u20b9 506 on listing day, translating into an estimated return of 3.38%.\n\nThe \u20b9 8,981-crore initial public offering (IPO) of the Coal India subsidiary will close on November 23. The price band has been fixed at \u20b9 129-136 per equity share, with a face value of \u20b9 2 per share.\n\nMahanadi Coalfields' GMP stood at \u20b9 4.60 per share on Tuesday, November 17, according to the latest available market data.\n\nConsidering the upper end of the IPO price band at \u20b9 136, the stock is estimated to list at approximately \u20b9 140.60, implying a potential listing premium of 3.38%.\n\nFor retail investors applying for one lot of 110 shares, the investment at the upper price band would amount to \u20b9 14,960. At the estimated listing price of \u20b9 140.60, the holding would be worth approximately \u20b9 15,466, translating into an estimated profit of around \u20b9 506.\n\nRetail investors can apply for a maximum of 13 lots. Small High Net-worth Individuals (sHNIs) can apply for a minimum of 14 lots and a maximum of 66 lots, while big High Net-worth Individuals (bHNIs) must apply for at least 67 lots.\n\nBased on the latest GMP of \u20b9 4.60 per share, the estimated listing profits are:", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:40 PM IST", "pub_date_relative": "11m ago"}, {"title": "Andfjord Salmon Q3 2026 slides: biomass doubles, capacity hits 11,000t", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:39 PM IST", "pub_date_relative": "11m ago"}, {"title": "Stocks slide as Nvidia results loom", "full_content": "Investors fret over tighter US chip export controls and potential slowdown in AI data centre build-out", "source": "FT Markets", "pub_date_str": "17 Nov 2026, 02:35 PM IST", "pub_date_relative": "16m ago"}, {"title": "Prepay 7.9% car loan or buy mutual funds? 24-year-old\u2019s \u20b91.27 lakh salary, \u20b921 lakh portfolio dilemma sparks debate", "full_content": "A 24-year-old professional earning a monthly salary of \u20b9 1.27 lakh has sparked a classic personal finance debate on Reddit: Is it better to aggressively pay down a 7.9% vehicle loan or funnel the surplus cash into high-yielding equity mutual funds?\n\nPosting on the subreddit r/personalfinanceindia, the Pune resident said he allocates nearly 40% of his take-home pay to investments. Despite his disciplined approach, he questioned his strategy, asking the community: \u201cWhat am I doing wrong?\u201d\n\nThe user provided a transparent look into his current savings, investments, and liabilities. His total assets amount to \u20b9 21.55 lakh, diversified across traditional and market-linked instruments:\n\nAgainst this, he holds a single liability: a car loan taken in January 2026. The original loan of \u20b9 8.42 lakh at a 7.9% interest rate now has an outstanding balance of \u20b9 5.79 lakh, with an EMI of approximately \u20b9 17,100.\n\nThe 24-year-old asked the community a very specific question: the mathematical benefits of debt repayment relative to market returns.\n\n\u201cShould I aggressively prepay the 7.9% car loan or continue my current \u20b9 50,000 monthly investment habit?\u201d he asked.\n\nHe also questioned his asset allocation, asking if his 40:20:20:20 mutual fund split was optimal or if his \u201cheavy exposure to equity warranted a shift toward debt funds or arbitrage funds.\u201d\n\nOn paper, equity mutual funds historically offer long-term annualised returns of 12% to 15%. Mathematically, investing surplus cash in the market rather than prepaying a 7.9% loan generates a positive interest rate spread, allowing the borrower's wealth to grow faster than their debt compounds.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 02:24 PM IST", "pub_date_relative": "27m ago"}, {"title": "HFCL, Sterlite Technologies hit 5% lower circuits after multibagger rallies; should investors buy the dip?", "full_content": "HFCL A Ksheerasagar Published 17 Nov 2026, 02:23 PM IST Prefer Livemint on Google Multibagger stocks HFCL and Sterlite Technologies have both hit their respective 5% lower circuits in Tuesday's trade, November 17, extending their recent sell-off after delivering phenomenal rallies over the past year.\n\nHFCL shares have come under severe selling pressure since hitting a record high last month, as investors appear to be booking profits following a stellar rally that made the stock one of the biggest wealth creators in the small-cap segment, even as the broader market remained volatile.\n\nAfter delivering a 240% gain through October, the stock lost momentum and has declined 20% so far in November. However, its year-to-date returns still stand at 173%. The latest weakness comes despite a sharp improvement in the company's financial performance.\n\nLast week, the company reported a multi-fold increase in consolidated net profit for the September quarter, supported by strong demand for optical fibre cables from artificial intelligence (AI) data centres. It has also outlined an ambitious growth outlook, backed by a sizeable order book and planned investments to expand its manufacturing capacity.\n\nHFCL posted a multi-fold jump in consolidated net profit to \u20b9 394.22 crore, compared with approximately \u20b9 72 crore in the corresponding quarter last year. Consolidated revenue from operations more than doubled to \u20b9 2,541.79 crore during the quarter, from \u20b9 1,043.34 crore in the year-ago period.\n\nBuilding on its strong quarterly performance, HFCL has raised its growth ambitions, projecting revenue growth of at least 80% in FY27 compared with FY26.\n\nBeyond its telecom and optical fibre businesses, the company is looking to develop its defence and aerospace operations into another major growth engine.\n\nSterlite Technologies shares have also come under renewed pressure following a phenomenal run-up.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:23 PM IST", "pub_date_relative": "28m ago"}, {"title": "U.S. companies from Nvidia to Apple face a growing China dilemma", "full_content": "BEIJING \u2014 How does the U.S. stay ahead of China in the artificial intelligence race? Keep advanced chips out of Beijing's reach, or sell weaker versions to keep Chinese companies reliant on American technology?\n\nThe consequences for U.S. businesses came into sharper focus after Jensen Huang's resignation as Nvidia CEO, ahead of U.S. President Donald Trump's meeting with Chinese leader Xi Jinping this week.\n\nHuang, who resigned last week amid reports he'd had an affair with a woman U.S. intelligence suspects of being a Chinese spy, had argued that keeping U.S. technology available in China could help the U.S. stay ahead in the tech race.\n\nOthers want tougher restrictions on chip sales: The Trump administration tightened restrictions on Chinese companies' remote access to advanced U.S. chips on Monday, seeking to prevent them from bypassing export controls by using data centers overseas.\n\nThe question facing Nvidia is part of a broader dilemma for U.S. tech companies: how far to remain invested in China as tensions between the two countries put their access to customers and supply chains at risk.\n\nOn Sunday, nine countries, including Singapore and the U.K., signed the U.S. State Department's \"San Francisco Declaration\" to safeguard sensitive technologies.\n\n\"Companies operating in China face competing pressures from Washington and Beijing,\" a client brief from New York-based consulting firm Strategy Risks said following the Nvidia scandal.\n\n\"Actions that satisfy one government can create serious problems with the other, putting market access, investments, and corporate reputation at risk,\" the brief said.", "source": "CNBC Finance", "pub_date_str": "17 Nov 2026, 02:22 PM IST", "pub_date_relative": "29m ago"}, {"title": "Odisha govt hikes Dearness Allowance by 3% for state employees", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Odisha govt hikes Dearness Allowance by 3% for state employees The Economic Times daily newspaper is available online now. Read Today's Paper Odisha govt hikes Dearness Allowance by 3% for state employees SECTIONS Odisha govt hikes Dearness Allowance by 3% for state employees PTI Last Updated: Nov 17, 2026, 02:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Odisha Chief Minister Mohan Charan Majhi announced a three percent hike in Dearness Allowance for government employees. The increase raises the DA from 60 percent to 63 percent, effective from July 1. Pensioners will also benefit from the same three percent increase in Dearness Relief. Approximately 8.5 lakh government employees and pensioners will receive this additional financial support. Payments reflecting the increased DA will be included in the November salary.\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nHow India\u2019s INR22.5 lakh crore gold loan boom is hiding a big hole\n\nKYC and KYB: Pidilite's margin keeps finding its way back, though costlier raw materials can knock it off course \u2013 Part 2 of 3\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Nov 2026, 02:22 PM IST", "pub_date_relative": "29m ago"}, {"title": "Asian Stocks to Fall Ahead of Nvidia, Anthropic: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks to Fall Ahead of Nvidia, Anthropic: Markets Wrap Bloomberg.com Stocks slide to kick off major week for Wall Street CNN Stock futures are mixed after Nvidia pressures tech to start the week: Live updates CNBC Shares slide on tech weakness ahead of Nvidia earnings Reuters Stock Market News, November 16, 2026: Nasdaq Slides 2.5% as Nvidia Drama Continues WSJ", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:21 PM IST", "pub_date_relative": "30m ago"}, {"title": "Metal stock jumps 17%, inches close to 52-week high after this CAPEX update; will the rally continue? Target, stop-loss", "full_content": "Pranati Deva Updated 17 Nov 2026, 02:14 PM IST Prefer Livemint on Google Metal stock Krishca Strapping Solutions shares rallied as much as 17% to hit an intraday high of \u20b9 208.50 on Tuesday, November 17, after the company announced the successful completion of trial production at its subsidiary Vajra Alloys Private Limited's manufacturing facility in Tamil Nadu.\n\nThe development marked a significant milestone in the company's expansion into superalloys and special steel manufacturing, with commercial production expected to begin by the end of November 2026.\n\nThe company informed the stock exchanges that Vajra Alloys had successfully completed trial production on November 16 at its manufacturing facility in Ulundai Village, Tiruvallur district, Tamil Nadu. The facility is focused on developing specialised alloy materials for applications across aerospace, defence, oil and gas, critical industrial components and precision engineering.\n\nKrishca Strapping Solutions shares have gained around 11% over the past month and 25% in three months. The stock has advanced 16% over the past two months and approximately 6% over the past year. It is just 10% away from its 52-week high of \u20b9 232.15, hit in September 2026.\n\nThe successful completion of trial production at Vajra Alloys brings the subsidiary closer to commencing commercial operations, which are expected by the end of November 2026. The development is an important step in Krishca's diversification strategy, as it seeks to enter specialised manufacturing segments catering to high-value industrial applications.\n\n\"Vajra Alloys Private Limited, its subsidiary company, has successfully carried out trial production at its manufacturing facility in Ulundai Village, Tiruvallur District, Tamil Nadu.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:13 PM IST", "pub_date_relative": "38m ago"}, {"title": "Harshvardhan Rane Gets Rs 3.5 Crore Land Rover From 'Sanam Teri Kasam' Producer", "full_content": "Sanam Teri Kasam producer Deepak Mukut has gifted Harshvardhan Rane a Land Rover Defender Octa, reportedly worth over Rs 3.5 crore in India.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 02:12 PM IST", "pub_date_relative": "39m ago"}, {"title": "FMCG stock under \u20b950 Aayush Wellness jumps 7%, has history of 1:10 stock split, 1:2 bonus shares; do you own?", "full_content": "FMCG stock Aayush Wellness share price jumped nearly 7% on Tuesday, 17 November, drawing attention to the company's recent product launch, its corporate action history and its performance across different time frames.\n\nThe stock has delivered strong returns over the past few weeks, gaining more than 26% in the last fortnight and around 26.4% over one month. However, the broader picture remains mixed, with the stock still down nearly 50% so far in 2026.\n\nAayush Wellness share price today opened at \u20b9 31.40 apice on the BSE, the stock touched an intraday high of \u20b9 32.50 per share, and an intraday low of \u20b9 31 per share.\n\nThe latest investor attention follows the company's 13 November announcement of Himalayan Shilajit Drops, marking its entry into the Shilajit-based wellness and vitality supplement category.\n\nAayush Wellness said the launch is part of its strategy to diversify its nutraceutical portfolio and tap specialised consumer wellness segments with potential in domestic and international markets.\n\nThe company cited rising consumer interest in preventive healthcare, everyday energy, stamina and overall wellness as factors supporting demand for such products. It also referred to a 2024 Supradyn Fatigue Survey commissioned by Bayer, which found that 85% of urban Indians aged 25\u201335 reported waking up tired, while 81% experienced declining energy levels during the day.\n\nThe company also highlighted the growth potential of the global Shilajit market. According to the market estimates cited in its announcement, the global market was valued at approximately $206.64 million in 2025 and is projected to reach $436.72 million by 2034, registering a compound annual growth rate (CAGR) of around 8.67% between 2026 and 2034.\n\nThe Asia-Pacific region accounted for approximately 61% of the global market in 2025, while liquid Shilajit represented around 60.72% of the market, according to the figures cited by the company.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:09 PM IST", "pub_date_relative": "41m ago"}, {"title": "Your Bank Is Charging You For A Failed Transaction: When Can You Dispute The Fee?", "full_content": "A failed transaction does not necessarily mean the bank has made an incorrect deduction. Banks are permitted to collect certain fees if these are covered by their official tariff structure and the terms agreed upon with the customer.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 02:09 PM IST", "pub_date_relative": "42m ago"}, {"title": "Stock futures are mixed after Nvidia pressures tech to start the week: Live updates", "full_content": "U.S. stock futures were mixed early Tuesday, following a losing session as Nvidia weighed on the tech sector.\n\nS&P 500 futures were 0.15% lower, Dow Jones Industrial Average futures fell 0.34%, while Nasdaq-100 futures gained 0.1%.\n\nIn Asia, Japan's Nikkei 225 fell 1.34% to close at 58,860.43, while the Topix lost 1.57% to 3,840.02.South Korea's Kospi dropped 2.59% to 4,968.48, while the small-cap Kosdaq declined 2.34% to 650.06. Australia's S&P/ASX 200 closed 1.79% lower at 8883.20.\n\nMainland China's CSI 300 slipped 0.08% to 3,976.46, while Hong Kong's Hang Seng Index fell 1.03% as of its last hour of trade.\n\nIn regular U.S. trading Monday, Nvidia shares pulled back 4.1%, as traders dumped the chipmaker ahead of its fiscal third-quarter report, due Tuesday after the bell. Other stocks linked to the artificial intelligence trade fell as well, including AMD, Micron Technology and Sandisk.\n\n\"The tape feels increasingly fragile as Nvidia's AI premium continues to unwind and investors reassess the durability of the ecosystem built around its dominance,\" said Ben Emons, founder of FedWatch Advisors, in a note. \"This backdrop has fueled the 'dispersion trade,' gradually eroding the extreme concentration that has defined the S&P 500 and Nasdaq.\"\n\nNvidia has been tumbling since last week. Jensen Huang resigned from the CEO post Thursday after reports emerged that he had multiple affairs , including one with an alleged Chinese spy . Further, the chipmaker's board of directors is not considering bringing Huang back as CEO, a person familiar with the matter told CNBC. The stock has dropped almost 24% this month, putting it on pace for its biggest monthly decline since April 2022 \u2014 when it plunged 32%.\n\nThe 30-stock Dow on Monday slid more than 700 points, or 1.4%, while the S&P 500 lost 1.9%. The tech-heavy Nasdaq Composite dropped 2.5%, its biggest one-day decline since Nov. 5.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 02:09 PM IST", "pub_date_relative": "42m ago"}, {"title": "Hunt For New JNU Vice Chancellor Begins As Education Ministry Invites Applications For Post", "full_content": "The Ministry of Education issued a notification and outlined the eligibility requirement and selection procedure for the university's top post.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 02:06 PM IST", "pub_date_relative": "45m ago"}, {"title": "Up 70% in 6 months! Small-cap stock under \u20b9100 hits 52-week high logging intraday rally of 4.5%; do you own?", "full_content": "Asit Manohar Published 17 Nov 2026, 02:06 PM IST Prefer Livemint on Google Small-cap stock under \u20b9 100: Following the rally in the Indian stock market, shares of Highway Infrastructure Ltd attracted strong buying on Tuesday. The small-cap stock opened flat at \u20b9 76.90 per share and touched an intraday high of \u20b9 80.74, recording an intraday rise of over 4.50%. While climbing to this intraday high, the infra stock also touched a new 52-week high.\n\nAccording to stock market experts, Highway Infrastructure's share price has rallied over the month for these 4 reasons: strong toll collection order wins, attractive corporate actions such as a \u20b9 409 crore fundraise through the preferential route, the acquisition of a 51% controlling stake in the Indore-based real estate company, and strong financial numbers.\n\nOn reasons that are continuously fueling Highway Infrastructure shares, Anuj Gupta, a SEBI-registered market expert, said, \"There have been multiple reasons for the strong rally in Highway Infrastructure shares. Strong order wins, sustained order flow, \u20b9 49 crore fundraising, acquiring a 51% controlling stake in an Indore-based real estate company, and strong financials of the company were a combination of reasons which attracted strong buying in this stock.\u201d\n\nIn October 2026, the small-cap company recently secured two user fee collection contracts from the National Highways Authority of India (NHAI), together worth about \u20b9 431.86 crore.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:06 PM IST", "pub_date_relative": "45m ago"}, {"title": "Budget 2027 Is Approaching: Which Tax Questions Should Salaried Employees Prepare For?", "full_content": "From income tax slabs and deductions to the benefits available under the old and new tax regimes, tax payers are looking forward to decisions on several aspects.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 02:00 PM IST", "pub_date_relative": "51m ago"}, {"title": "Reit payouts decoded: How distributions work and are taxed", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nReal estate investment trusts (Reits) offer investors a way to participate in rental income generated by commercial properties without owning the assets. They pool investors\u2019 money to acquire income-generating real estate and are required to distribute at least 90% of their net cash flows to unitholders. But these payouts are not as straightforward as they may appear: they can comprise different streams of income, each with a distinct tax treatment.\n\nDistribution per unit (DPU) is the cash payout a Reit makes for each unit held by an investor\u2014essentially the equivalent of a company\u2019s dividend per share. To understand how DPU is determined, it is important to trace how rental income flows through the Reit structure.\n\nRental income first flows into special purpose vehicles (SPVs)\u2014entities created to hold and manage the underlying real estate assets. After accounting for property-level expenses, taxes and external debt, the SPVs upstream the remaining cash to the Reit. Once the trust meets its own expenses, the remaining surplus is available for distribution. Under Sebi rules, at least 90% of this surplus must be distributed to unitholders at least once every six months.\n\nReit distributions can comprise four streams: dividends, repayment of capital, interest and rental income. The precise mix depends on how the Reit has structured ownership of its properties and funded its SPVs.\n\n\u201cTypically, unitholders receive direct rental income only when the Reit owns the properties directly on its balance sheet rather than through SPVs.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 01:56 PM IST", "pub_date_relative": "55m ago"}, {"title": "Treasury yields are broadly flat as investors await retail sales data", "full_content": "U.S. Treasury yields were little changed on Tuesday morning as investors awaited economic data and comments from Federal Reserve officials later in the session.\n\nThe benchmark 10-year Treasury yield was broadly flat at 5.118%, while the long-dated 30-year Treasury bond was up just above the flatline to 5.472%. Meanwhile, the 2-year Treasury note yield was down 2 basis points to 4.806%.\n\nOne basis point is equal to 0.01%, and yields and prices move in opposite directions.\n\nOctober's retail sales data is due later on Tuesday morning, with economists forecasting retail sales to grow 0.6% on the month, down from 0.8% in September. A stronger-than-expected reading could reinforce the case for higher Fed interest rates.\n\nInvestors will also parse comments from the Fed's Alberto Musalem, Christopher Waller and John Williams, who are all due to speak publicly at separate engagements on Tuesday.\n\nThe latest FOMC meeting minutes are due on Wednesday, with investors watching for insights on the Fed's October decision to leave interest rates unchanged. Traders are currently pricing in a 95% chance of a quarter-percentage-point hike in December, per the CME Group's FedWatch tool.\n\nElsewhere in the market, a selloff in key technology and AI stocks continued on Monday amid growing calls to reinstate Jensen Huang as Nvidia's CEO. A source familiar with the matter told CNBC on Monday that Nvidia's board of directors is not discussing bringing back the founder.\n\nAdditionally, the Commerce Department on Monday moved to close a loophole that let Chinese firms lease Nvidia's computing power from locations in other countries.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 01:53 PM IST", "pub_date_relative": "58m ago"}, {"title": "Parents Have Rs 30 Lakh In Savings But No Pension: How Can They Generate Monthly Income?", "full_content": "Putting the entire Rs 30 lakh into one investment avenue may not be the wisest approach. Retired parents should keep a separate cash reserve for medical bills, household emergencies and other unplanned expenses.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:53 PM IST", "pub_date_relative": "58m ago"}, {"title": "Sexual And Violent Reels On Your Instagram Feed? Meta Is Cracking Down; Here's What You Must Know", "full_content": "Meta said it is using more capable AI models that check content against its Recommendations Guidelines directly.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why cash flow matters as much as asset allocation", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWhen families discuss long-term wealth management, the focus often falls on strategic asset allocation: how much to invest in equities versus fixed income, domestic versus international markets, real estate or gold. But even the most carefully constructed portfolio can unravel if it is disconnected from an investor's cash flow.\n\nIn over two decades of advising families as a financial life planner, I have observed this recurring vulnerability. Investors devote considerable time to calibrating their exposure across asset classes but often overlook the cash flow dynamics that determine whether their portfolios can withstand financial pressures.\n\nToo often, these two disciplines are treated separately. Cash flow is seen as routine financial bookkeeping, covering household expenses, advance tax obligations and loan commitments, while asset allocation is viewed as portfolio construction. In practice, they are two sides of the same rupee. For investors with established, multi-asset portfolios, understanding how cash flow shapes portfolio durability is essential to preserving wealth over the long term.\n\nAn investor's balance sheet may reflect a high psychological appetite for risk, but actual risk capacity is determined by liquidity.\n\nConsider a senior corporate executive, startup founder or successful business owner in India with significant wealth spread across real estate, mutual funds and direct equity holdings. While their net worth may be substantial, their operating cash flows could be vulnerable to variable compensation cycles, business slowdowns or delayed milestone payouts.\n\nIf such an investor maintains an aggressive growth portfolio , heavily weighted towards mid-cap equity mutual funds and long-term capital assets, without an accompanying liquidity strategy, a sudden cash crunch can create an uncomfortable dilemma.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 01:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "VIDEO: Ramayana's Shurpanaka Rakul Preet Singh Shares BTS On Four-Hour Hair-Makeup Marathons", "full_content": "Actor Rakul Preet Singh shares the behind-the-scenes effort behind her four-hour transformation into Surpanakha for Nitesh Tiwari's 'Ramayana'.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi Sees Third Building Collapse In Three Weeks, Two Dead", "full_content": "Several others are feared trapped beneath the debris, prompting a major rescue operation by police, fire personnel, and local residents.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Guarantor loan liability: Can banks deduct EMIs from your pension account if borrower defaults? What High Court ruled", "full_content": "Imagine retiring from government service and relying on your monthly pension to meet household expenses. You had stood as a guarantor for someone\u2019s loan while you were still employed. Years later, the borrower stops paying the EMIs, and the bank begins deducting money from your pension account to recover the outstanding dues.\n\nThis is what happened to a retired police personnel in Jammu and Kashmir, who approached the court after the bank allegedly continued making deductions despite his request to stop them.\n\nThe Jammu and Kashmir and Ladakh High Court examined this issue in its 13 November 2026 judgment in Nazir Ahmad Kuchay vs Jammu and Kashmir Bank Limited .\n\nThe case raised an important question: can a bank use a pension account to recover a loan taken by someone else when the pensioner had guaranteed its repayment?\n\nThe retired police personnel, Nazir Ahmad Kuchay, had stood as a guarantor for another individual who obtained financial assistance from Jammu and Kashmir Bank. A guarantor is someone who promises to repay a loan if the borrower fails to do so.\n\nWhen the borrower defaulted on the loan instalments, the bank began deducting the dues from Kuchay's bank account. By then, he had retired from government service and was dependent on his pension to support himself and his family.\n\nAfter learning about the deductions, he approached the bank and explained his financial dependence on pension income. The bank assured him that further deductions would stop. However, the deductions allegedly continued.\n\nKuchay subsequently filed a civil suit seeking recovery of the deducted money and an injunction, which is a court order restraining someone from taking a particular action. He also sought interim relief, or temporary protection, until the case was decided.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 01:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kaynes Technology stock in pain as Street falls out of love", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nKaynes Technology India\u2019s shares dropped to a 52-week low of \u20b9 2,744 on Monday after September quarter (Q2FY27) earnings plunged. Consolidated net profit fell 62% year-on-year, thanks to high interest and depreciation expenses due to the commissioning of new projects.\n\nOperating cash flow was negative. Kaynes changed its statutory auditor and restated its FY26 financial statements involving changes in provisioning, borrowings and other items.\n\nEbitda fell 16% y-o-y to \u20b9 126 crore and revenue grew 4% to \u20b9 952 crore, with smart meter sales dropping almost 80%. The segment\u2019s revenue contribution shrank to 6% from 30% a year ago.\n\nThe core electronics manufacturing services (EMS) revenue grew 34% y-o-y. EMS growth was 42% in H1. The management is confident of 30%-plus growth in FY27. The total order book grew 31% to \u20b9 10,000 crore in Q2.\n\nUnderstandably, Nuvama Institutional Equities cut its earnings-per-share for FY27 and FY28 by 37% each to factor the Q2 earnings miss and outlook.\n\nThe management reduced meter supplies to prioritize the recovery of outstanding receivables from state government, which rose to \u20b9 1,402 crore in Q1, 1.5 times FY26 segment sales. Kaynes reduced the outstanding to \u20b9 1,091 crore by Q2 and plans to ramp up supplies only after it falls below \u20b9 750 crore.\n\nIt is in discussions with potential partners to handle installation and operations and maintenance, while retaining manufacturing .", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 01:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Sensex Zooms 500 Points, Nifty Above 25,400; Asian Paints Extends Gains, Brainbees Solutions Zooms 12%", "full_content": "Brent crude fell below $92 per barrel on Tuesday, extending losses from the previous session as expectations of higher global supply outweighed persistent geopolitical tensions in the Middle East.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "From DINKs to SINKs: how household type shapes money plan", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHousehold traditionally meant a married couple with children, living on one or two incomes, with money going towards running the home, raising children, paying for their education and saving for retirement. Today, the picture looks different. Some couples are child-free by choice, some are waiting for the right time to start a family, while others have pets instead of children.\n\nThese changing choices have given rise to a vocabulary of household acronyms: DINK (dual income, no kids), SINK (single income, no kids), DEWK (dual earners with kids), HENRY (high earners, not rich yet) and DINKWAD (dual income, no kids, with a dog). Made popular in the west, these household labels are finding their way into Indian conversations, too. Most households won\u2019t fit one acronym for life, but each stage asks something different of your money. Read on for a quick lowdown on how each of these households should think about their household money at each stage.\n\nThe DINK stage often feels like the most comfortable phase of life. Two incomes split the bills, there are no childcare costs, and couples enjoy extra cash, faster savings and full control over their schedule.\n\nAnooj Mehta, Partner at 1Finance, says a DINK couple has two salaries and nobody else draws from them, but the bigger danger is lifestyle inflation.\n\nSuresh Sadagopan, founder of Ladder7 Financial Advisories, said having no kids is a double-edged sword: financial planning becomes easier, but expenses catch up with income, and with a fair amount of protection, people tend to take more risk and spend on indulgences.\n\nChandigarh-based Manpreet Kaur and Jaspreet Singh, married for six years, live on freelance incomes that vary every month. \u201cWith our current lifestyle, saving has been difficult,\u201d Kaur said, citing spending on travel, eating out and organic groceries.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 01:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "From Skyfall' To Spectre': How Much The 7 Highest-Grossing James Bond Films Earned Worldwide", "full_content": "A look at the seven highest-grossing James Bond films that topped the worldwide box office charts, with a look at their collections, stories and star casts.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Large-Cap Allocation Rising In Portfolios, Says WhiteOak Capital's Aashish Somaiyaa", "full_content": "Somaiyaa expects mutual fund redemptions to increase as investors who remained invested through the recent period of subdued returns begin to recover their capital and book profits.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Promoter pledging climbs as more companies cross the 90% mark", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMore companies joined the ranks of those with almost all their promoter holdings pledged in the September quarter, raising questions about funding pressures and their vulnerability to a market correction.\n\nA Mint analysis of 4,592 BSE-listed companies showed that 12.4% of them had promoter shares pledged at the end of September (Q2). Of the total, 42 companies, or about 1%, had more than 90% of promoter holdings pledged, up from 34 in Q1 and 36 a year earlier, according to ACE Equity data.\n\nThe count rose almost 24% sequentially to its highest level in the five quarters examined. After falling from 36 in September 2025 to 29 in December, it climbed to 30 in March, 34 in June and 42 in September.\n\n\u201cThe increase in companies with over 90% of promoter holdings pledged, from 34 in June to 42 in September, is a concern worth monitoring, though it does not necessarily indicate financial distress,\u201d said Mayur Shah, head PMS\u2013fund manager at Anand Rathi Advisors.\n\nPromoters may borrow against shares to fund expansion, for working capital or for personal needs. Rising pledging alongside declining promoter ownership, weak cash flows and increasing debt could, however, point to financial stress, he said.\n\nThe distinction between promoter borrowing and a company\u2019s finances is important.\n\n\u201cThe first thing to understand is that it is not the company but the promoter who is pledging the shares,\u201d said Aswini Bajaj, CEO of business consultancy firm Leveraged Growth.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 01:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump administration moves to block China from indirect access to American AI technology - AP News", "full_content": "Trump administration moves to block China from indirect access to American AI technology AP News Trump administration tightens restrictions on flow of AI chips ahead of China trip CNN Clampdown on China Chip Loophole Puts Billions in Loans at Risk Bloomberg.com Asian Stocks Fall as U.S. Moves to Tighten Chip Curbs WSJ Opinion | The Enraging Hypocrisy at the Heart of the Nvidia Scandal The New York Times", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 01:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Banking, Telecom, Insurance And More: 178 Brands Websites Exposed To Malicious Code, Says Report", "full_content": "Affected sites include Zoom, the BBC, CNN, Salesforce, GitLab, IKEA, HSBC, Equifax, Air France-KLM, Ledger and Peacock.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia Q3 Preview: After Jensen Huang's Exit As CEO And $2 Trillion Wipeout, Can Strong Earnings Change The Narrative?", "full_content": "Nvidia is scheduled to report its Q3 CY26 results later on Tuesday, with the Street closely tracking its data centre business, AI infrastructure demand, margins and management's outlook for the coming quarters.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "SBI Clerk Prelims Result 2026 Likely Today; How To Check Scorecard, Cut-Off And Mains Exam Details", "full_content": "State Bank Of India conducted the clerk preliminary examination on September 26 and 27, under the recruitment process for Junior Associate positions", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kaynes Technology shares extend losses, fall another 4%; should investors worry about its Q2 performance?", "full_content": "A Ksheerasagar Published 17 Nov 2026, 01:09 PM IST Prefer Livemint on Google After plunging 13% in the previous session, the sell-off in Kaynes Technology showed no signs of easing, with the electronics manufacturing services (EMS) major falling another 4% in Tuesday's trade on November 17 to \u20b9 3,845 apiece. This extended its earnings-led decline for a second consecutive session.\n\nThe Street was disappointed with Kaynes Technology's performance in the September quarter, which was impacted by the scale-down of its smart-metering business. The company reported several weak operating metrics.\n\nNot only did its profit after tax decline 62% year-on-year (YoY), but gross debt also increased to \u20b9 1,810 crore, while working capital days rose to 225 from 210.\n\nIts commitment to refrain from raising funds over the next 12 months also raised concerns, as this could either require a curtailment of capex or greater reliance on debt, potentially putting further pressure on its profit and loss (P&L), said domestic brokerage firm JM Financial.\n\nThe weak performance not only weighed on investor sentiment and prompted brokerages to reassess their outlook on the stock. JM Financial cut its target price to \u20b9 3,050 from \u20b9 3,850 and retained its Reduce rating.\n\nJefferies also lowered its target price on Kaynes Technology to \u20b9 3,625 per share, implying an upside of approximately 22% from Monday's closing price of \u20b9 2,980. The brokerage said the company's Q2 FY27 performance had sharply missed estimates, prompting it to lower its earnings forecasts for FY27-FY29.\n\nMotilal Oswal, however, reiterated its Buy rating on the stock with a target price of \u20b9 3,820, based on 30 times its December 2027 estimated earnings per share (EPS).\n\nThe brokerage cut its FY27 and FY28 earnings estimates by 28% and 22%, respectively, factoring in the muted quarterly performance and lower earnings expectations across the core EMS, OSAT, PCB, and smart-metering businesses.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 01:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "NSE or BSE: Why are experts bullish on NSE shares? Here's what technical charts hint at? | Target price, stop-loss", "full_content": "Dhanya Nagasundaram Published 17 Nov 2026, 12:59 PM IST Prefer Livemint on Google The rally in exchange stocks has brought the spotlight back on two of India's leading market infrastructure companies \u2014 the National Stock Exchange of India (NSE) and Bombay Stock Exchange (BSE). While NSE has strengthened its position as a dominant player in the country's capital markets, BSE has been gaining ground, supported by improving trading activity and market-share gains. With both stocks scaling fresh highs, investors are now weighing which exchange offers the more attractive opportunity.\n\nNSE shares have climbed nearly 20% above their IPO price of \u20b9 1,785, extending their gains after a modest listing. The stock debuted on the BSE at \u20b9 1,800, a premium of 0.84% over the issue price. It touched an intraday high of \u20b9 1,878 during its debut session before settling at \u20b9 1,818.\n\nThe rally has gathered momentum since then. NSE shares recently crossed the \u20b9 2,000 mark, hitting a fresh high today of \u20b9 2,134 on the BSE on Tuesday, up around 3% during the session. At this level, the exchange's market capitalisation stood at approximately \u20b9 5.26 lakh crore, surpassing the \u20b9 5 trillion milestone.\n\nBSE shares have also participated in the rally. The stock gained around 2.6% to touch an intraday high of \u20b9 3,989.70 on the NSE, approaching the psychologically important \u20b9 4,000 mark. Its market capitalisation stood at approximately \u20b9 1.63 lakh crore.\n\nThe broader buying interest in exchange stocks comes amid improving trading volumes, renewed institutional and foreign investor activity, expectations of relief on long-term capital gains taxation, and a more constructive outlook from brokerages. Reduced stress in the margin trading facility (MTF) segment has also added to the supportive market backdrop.\n\nHowever, the investment case for the two exchanges is not identical.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "SEBI May Tighten Rules On Leveraged Stock Bets As Margin Funding Hits Record Levels: Report", "full_content": "SEBI is also discussing the possibility of introducing hard limits on the proportion of a company's free float that can be financed through MTF, the report said.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "1,441 Ukrainian Drones Downed Overnight Over Russian Regions, Russia Claims", "full_content": "Moscow was a main target in the reported drone operation; roughly 800 drones headed towards the region overnight.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 12:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio Platforms, BLS Polymers, Shiprocket, more: 23 stocks to watch as anchor lock-in expires this week | List", "full_content": "SFCTECH BONFIG HORIZONIND LALITHAA Pranati Deva Published 17 Nov 2026, 12:55 PM IST Prefer Livemint on Google IPO lock-in ends : As many as 23 recently listed companies are set to witness the expiry of their anchor investor lock-in periods between November 16 and November 30, potentially bringing a fresh supply of shares into the stock market.\n\nTonbo Imaging India, BLS Polymers, Shiprocket, Jio Platforms, Zetwerk Manufacturing Business and Paras Healthcare are among the prominent names facing the expiry, with several stocks already delivering substantial returns over their initial public offering (IPO) issue prices.\n\nAccording to the latest IPO Lock-In Monitor by PL Capital's research division, 11 companies will see their 30-day anchor investor lock-in periods expire, while another 12 companies will witness the expiry of their 90-day lock-in periods.\n\n\"Between 16 November and 30 November 2026, 23 companies are scheduled for an anchor lock-in expiry, with 11 companies under the 30-day lock-in period and 12 companies under the 90-day lock-in period. Across the upcoming 30-day expiries, the proportion of shares becoming eligible for trading ranges from approximately 13% to 22% of the respective companies' total shares, with most companies around 15% of total shares,\" PL Research said.\n\nThe unlocking of shares does not necessarily mean anchor investors will sell their holdings. However, the additional supply could influence near-term stock movements depending on investor decisions and market demand.\n\nAmong the 11 companies approaching their 30-day anchor investor lock-in expiry, Fusion CX, Zetwerk Manufacturing Business and Paras Healthcare have the highest proportion of shares becoming eligible for trading, at approximately 22% each.\n\nHD Fire Protect, Tonbo Imaging India, Sahajanand Medical Technologies , Bonfiglioli Transmissions , EAAA India Alternatives, BLS Polymers and SFC Environmental Technologies will each see approximately 15% of their total shares unlocked.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "FIIs, MFs raise stakes in 5 largecap stocks for two straight quarters; shares rally up to 80%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News FIIs, MFs raise stakes in 5 largecap stocks for two straight quarters; shares rally up to 80% Written by Ritesh Presswala , ETMarkets.com | Nov 17, 2026, 12:58:06 PM IST 1 / 6 Smart Money Institutional investors, such as foreign institutional investors (FIIs) and mutual funds (MFs), closely track companies through extensive research and analysis. Their shareholding patterns can offer valuable insights into institutional investment trends, particularly when both investor groups increase their exposure to the same stocks. An ET Markets analysis of shareholding data reveals that FIIs and mutual funds have raised their stakes for two consecutive quarters \u2013 April-June and July-September \u2013 in five large-cap stocks. Interestingly, all five stocks have delivered double-digit returns, with gains ranging from 12% to 80% in FY27 so far. (Data Source: ACE Equity)\n\nThe stock has surged 79% in FY27 so far, climbing from Rs 141 to Rs 251. Institutional interest has risen sharply alongside the rally. FIIs increased their stake from 4.17% in March 2026 to 5.19% in June and further to 9.84% in September. Mutual funds followed a similar trajectory, raising their holding from 4.91% to 8.15% and then 11.68% over the same period.\n\nShares have rallied 50% in FY27 so far, rising from Rs 150 to Rs 225. FIIs steadily increased their exposure, taking their stake from 2.51% in March 2026 to 6.89% in June and 10.90% in September. Mutual fund holdings also climbed from 5.25% to 8.69% and further to 10.72% during the three quarters.\n\nThe stock has gained 47% in FY27 so far, advancing from Rs 501 to Rs 735. Institutional ownership has expanded significantly, with FII holdings jumping from 4.26% in March 2026 to 12.76% in June and 18.26% in September.", "source": "Economic Times Markets", "pub_date_str": "17 Nov 2026, 12:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "India May Attract More Foreign Flows As AI Trade Loses Steam, Says KCM Trade's Tim Waterer", "full_content": "Waterer said the direction of the AI trade and crude oil prices would be important in determining how long the current trend in emerging markets lasts.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 12:51 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Steel prices are rising again: Is it wise to buy metal stocks? Experts pick Tata Steel, JSW and 4 others | Targets, SL", "full_content": "JINDALSTEL SAMBHV MONOLITH Dhanya Nagasundaram Published 17 Nov 2026, 02:48 PM IST Prefer Livemint on Google Steel stocks are back on investors\u2019 radar as a recovery in domestic steel prices, improving operating spreads and resilient infrastructure demand lift the sector\u2019s earnings outlook. With domestic hot-rolled coil (HRC) prices hovering near four-year highs and margins improving in November, the steel sector appears to be entering a more favourable phase after a prolonged period of volatility.\n\nMarket experts believe the improving price environment offers an opportunity to selectively accumulate steel and metals stocks, rather than bet on the entire sector. While stronger realisations, infrastructure spending and capacity expansion are supporting the earnings outlook, rising coking coal costs, import pressures and global trade developments remain key risks.\n\nAnalysts are favouring companies with captive raw material resources, backward integration, operational efficiencies and a growing share of value-added products. Their preferred picks range from integrated steelmakers and specialised downstream players to companies benefiting from secondary steelmaking and improving capacity utilisation.\n\nAmong the stocks highlighted by experts are Tata Steel , JSW Steel, Jindal Steel , Lloyds Metals & Energy, Sambhv Steel Tubes and Monolithisch India . Some of these offer fundamental earnings recovery opportunities, while others are emerging as technical bets with identifiable breakout levels and upside targets.\n\nHere is what experts are saying about the steel sector and the stocks investors should watch.\n\nBhavik Bhagwanji Shah, CFA, Analyst \u2013 Metals & Mining at Choice Institutional Equities, believes selective accumulation makes sense as domestic steel prices, particularly across long products and value-added tubes, have staged a meaningful recovery after the monsoon.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:48 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Telkom posts stronger H1 2027 profits as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 02:43 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mahanadi Coalfields IPO single profit calculator basis latest GMP: What investors may earn on listing?", "full_content": "Pranati Deva Published 17 Nov 2026, 02:40 PM IST Prefer Livemint on Google Mahanadi Coalfields IPO : The much-awaited Mahanadi Coalfields IPO, a Coal India subsidiary, is set to open for subscription on November 19, with investors eyeing potential listing gains as the grey market premium (GMP) provides an early indication of market expectations.\n\nAt the latest GMP of \u20b9 4.60 per share, retail investors applying for a single lot could potentially make a gain of around \u20b9 506 on listing day, translating into an estimated return of 3.38%.\n\nThe \u20b9 8,981-crore initial public offering (IPO) of the Coal India subsidiary will close on November 23. The price band has been fixed at \u20b9 129-136 per equity share, with a face value of \u20b9 2 per share.\n\nMahanadi Coalfields' GMP stood at \u20b9 4.60 per share on Tuesday, November 17, according to the latest available market data.\n\nConsidering the upper end of the IPO price band at \u20b9 136, the stock is estimated to list at approximately \u20b9 140.60, implying a potential listing premium of 3.38%.\n\nFor retail investors applying for one lot of 110 shares, the investment at the upper price band would amount to \u20b9 14,960. At the estimated listing price of \u20b9 140.60, the holding would be worth approximately \u20b9 15,466, translating into an estimated profit of around \u20b9 506.\n\nRetail investors can apply for a maximum of 13 lots. Small High Net-worth Individuals (sHNIs) can apply for a minimum of 14 lots and a maximum of 66 lots, while big High Net-worth Individuals (bHNIs) must apply for at least 67 lots.\n\nBased on the latest GMP of \u20b9 4.60 per share, the estimated listing profits are:", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:40 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks slide as Nvidia results loom", "full_content": "Investors fret over tighter US chip export controls and potential slowdown in AI data centre build-out", "source": "FT Markets", "pub_date_str": "17 Nov 2026, 02:35 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Prepay 7.9% car loan or buy mutual funds? 24-year-old\u2019s \u20b91.27 lakh salary, \u20b921 lakh portfolio dilemma sparks debate", "full_content": "A 24-year-old professional earning a monthly salary of \u20b9 1.27 lakh has sparked a classic personal finance debate on Reddit: Is it better to aggressively pay down a 7.9% vehicle loan or funnel the surplus cash into high-yielding equity mutual funds?\n\nPosting on the subreddit r/personalfinanceindia, the Pune resident said he allocates nearly 40% of his take-home pay to investments. Despite his disciplined approach, he questioned his strategy, asking the community: \u201cWhat am I doing wrong?\u201d\n\nThe user provided a transparent look into his current savings, investments, and liabilities. His total assets amount to \u20b9 21.55 lakh, diversified across traditional and market-linked instruments:\n\nAgainst this, he holds a single liability: a car loan taken in January 2026. The original loan of \u20b9 8.42 lakh at a 7.9% interest rate now has an outstanding balance of \u20b9 5.79 lakh, with an EMI of approximately \u20b9 17,100.\n\nThe 24-year-old asked the community a very specific question: the mathematical benefits of debt repayment relative to market returns.\n\n\u201cShould I aggressively prepay the 7.9% car loan or continue my current \u20b9 50,000 monthly investment habit?\u201d he asked.\n\nHe also questioned his asset allocation, asking if his 40:20:20:20 mutual fund split was optimal or if his \u201cheavy exposure to equity warranted a shift toward debt funds or arbitrage funds.\u201d\n\nOn paper, equity mutual funds historically offer long-term annualised returns of 12% to 15%. Mathematically, investing surplus cash in the market rather than prepaying a 7.9% loan generates a positive interest rate spread, allowing the borrower's wealth to grow faster than their debt compounds.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 02:24 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "HFCL, Sterlite Technologies hit 5% lower circuits after multibagger rallies; should investors buy the dip?", "full_content": "HFCL A Ksheerasagar Published 17 Nov 2026, 02:23 PM IST Prefer Livemint on Google Multibagger stocks HFCL and Sterlite Technologies have both hit their respective 5% lower circuits in Tuesday's trade, November 17, extending their recent sell-off after delivering phenomenal rallies over the past year.\n\nHFCL shares have come under severe selling pressure since hitting a record high last month, as investors appear to be booking profits following a stellar rally that made the stock one of the biggest wealth creators in the small-cap segment, even as the broader market remained volatile.\n\nAfter delivering a 240% gain through October, the stock lost momentum and has declined 20% so far in November. However, its year-to-date returns still stand at 173%. The latest weakness comes despite a sharp improvement in the company's financial performance.\n\nLast week, the company reported a multi-fold increase in consolidated net profit for the September quarter, supported by strong demand for optical fibre cables from artificial intelligence (AI) data centres. It has also outlined an ambitious growth outlook, backed by a sizeable order book and planned investments to expand its manufacturing capacity.\n\nHFCL posted a multi-fold jump in consolidated net profit to \u20b9 394.22 crore, compared with approximately \u20b9 72 crore in the corresponding quarter last year. Consolidated revenue from operations more than doubled to \u20b9 2,541.79 crore during the quarter, from \u20b9 1,043.34 crore in the year-ago period.\n\nBuilding on its strong quarterly performance, HFCL has raised its growth ambitions, projecting revenue growth of at least 80% in FY27 compared with FY26.\n\nBeyond its telecom and optical fibre businesses, the company is looking to develop its defence and aerospace operations into another major growth engine.\n\nSterlite Technologies shares have also come under renewed pressure following a phenomenal run-up.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:23 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. companies from Nvidia to Apple face a growing China dilemma", "full_content": "BEIJING \u2014 How does the U.S. stay ahead of China in the artificial intelligence race? Keep advanced chips out of Beijing's reach, or sell weaker versions to keep Chinese companies reliant on American technology?\n\nThe consequences for U.S. businesses came into sharper focus after Jensen Huang's resignation as Nvidia CEO, ahead of U.S. President Donald Trump's meeting with Chinese leader Xi Jinping this week.\n\nHuang, who resigned last week amid reports he'd had an affair with a woman U.S. intelligence suspects of being a Chinese spy, had argued that keeping U.S. technology available in China could help the U.S. stay ahead in the tech race.\n\nOthers want tougher restrictions on chip sales: The Trump administration tightened restrictions on Chinese companies' remote access to advanced U.S. chips on Monday, seeking to prevent them from bypassing export controls by using data centers overseas.\n\nThe question facing Nvidia is part of a broader dilemma for U.S. tech companies: how far to remain invested in China as tensions between the two countries put their access to customers and supply chains at risk.\n\nOn Sunday, nine countries, including Singapore and the U.K., signed the U.S. State Department's \"San Francisco Declaration\" to safeguard sensitive technologies.\n\n\"Companies operating in China face competing pressures from Washington and Beijing,\" a client brief from New York-based consulting firm Strategy Risks said following the Nvidia scandal.\n\n\"Actions that satisfy one government can create serious problems with the other, putting market access, investments, and corporate reputation at risk,\" the brief said.", "source": "CNBC Finance", "pub_date_str": "17 Nov 2026, 02:22 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Odisha govt hikes Dearness Allowance by 3% for state employees", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Odisha govt hikes Dearness Allowance by 3% for state employees The Economic Times daily newspaper is available online now. Read Today's Paper Odisha govt hikes Dearness Allowance by 3% for state employees SECTIONS Odisha govt hikes Dearness Allowance by 3% for state employees PTI Last Updated: Nov 17, 2026, 02:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Odisha Chief Minister Mohan Charan Majhi announced a three percent hike in Dearness Allowance for government employees. The increase raises the DA from 60 percent to 63 percent, effective from July 1. Pensioners will also benefit from the same three percent increase in Dearness Relief. Approximately 8.5 lakh government employees and pensioners will receive this additional financial support. Payments reflecting the increased DA will be included in the November salary.\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nHow India\u2019s INR22.5 lakh crore gold loan boom is hiding a big hole\n\nKYC and KYB: Pidilite's margin keeps finding its way back, though costlier raw materials can knock it off course \u2013 Part 2 of 3\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Nov 2026, 02:22 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Asian Stocks to Fall Ahead of Nvidia, Anthropic: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks to Fall Ahead of Nvidia, Anthropic: Markets Wrap Bloomberg.com Stocks slide to kick off major week for Wall Street CNN Stock futures are mixed after Nvidia pressures tech to start the week: Live updates CNBC Shares slide on tech weakness ahead of Nvidia earnings Reuters Stock Market News, November 16, 2026: Nasdaq Slides 2.5% as Nvidia Drama Continues WSJ", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:21 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Metal stock jumps 17%, inches close to 52-week high after this CAPEX update; will the rally continue? Target, stop-loss", "full_content": "Pranati Deva Updated 17 Nov 2026, 02:14 PM IST Prefer Livemint on Google Metal stock Krishca Strapping Solutions shares rallied as much as 17% to hit an intraday high of \u20b9 208.50 on Tuesday, November 17, after the company announced the successful completion of trial production at its subsidiary Vajra Alloys Private Limited's manufacturing facility in Tamil Nadu.\n\nThe development marked a significant milestone in the company's expansion into superalloys and special steel manufacturing, with commercial production expected to begin by the end of November 2026.\n\nThe company informed the stock exchanges that Vajra Alloys had successfully completed trial production on November 16 at its manufacturing facility in Ulundai Village, Tiruvallur district, Tamil Nadu. The facility is focused on developing specialised alloy materials for applications across aerospace, defence, oil and gas, critical industrial components and precision engineering.\n\nKrishca Strapping Solutions shares have gained around 11% over the past month and 25% in three months. The stock has advanced 16% over the past two months and approximately 6% over the past year. It is just 10% away from its 52-week high of \u20b9 232.15, hit in September 2026.\n\nThe successful completion of trial production at Vajra Alloys brings the subsidiary closer to commencing commercial operations, which are expected by the end of November 2026. The development is an important step in Krishca's diversification strategy, as it seeks to enter specialised manufacturing segments catering to high-value industrial applications.\n\n\"Vajra Alloys Private Limited, its subsidiary company, has successfully carried out trial production at its manufacturing facility in Ulundai Village, Tiruvallur District, Tamil Nadu.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:13 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FMCG stock under \u20b950 Aayush Wellness jumps 7%, has history of 1:10 stock split, 1:2 bonus shares; do you own?", "full_content": "FMCG stock Aayush Wellness share price jumped nearly 7% on Tuesday, 17 November, drawing attention to the company's recent product launch, its corporate action history and its performance across different time frames.\n\nThe stock has delivered strong returns over the past few weeks, gaining more than 26% in the last fortnight and around 26.4% over one month. However, the broader picture remains mixed, with the stock still down nearly 50% so far in 2026.\n\nAayush Wellness share price today opened at \u20b9 31.40 apice on the BSE, the stock touched an intraday high of \u20b9 32.50 per share, and an intraday low of \u20b9 31 per share.\n\nThe latest investor attention follows the company's 13 November announcement of Himalayan Shilajit Drops, marking its entry into the Shilajit-based wellness and vitality supplement category.\n\nAayush Wellness said the launch is part of its strategy to diversify its nutraceutical portfolio and tap specialised consumer wellness segments with potential in domestic and international markets.\n\nThe company cited rising consumer interest in preventive healthcare, everyday energy, stamina and overall wellness as factors supporting demand for such products. It also referred to a 2024 Supradyn Fatigue Survey commissioned by Bayer, which found that 85% of urban Indians aged 25\u201335 reported waking up tired, while 81% experienced declining energy levels during the day.\n\nThe company also highlighted the growth potential of the global Shilajit market. According to the market estimates cited in its announcement, the global market was valued at approximately $206.64 million in 2025 and is projected to reach $436.72 million by 2034, registering a compound annual growth rate (CAGR) of around 8.67% between 2026 and 2034.\n\nThe Asia-Pacific region accounted for approximately 61% of the global market in 2025, while liquid Shilajit represented around 60.72% of the market, according to the figures cited by the company.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:09 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Your Bank Is Charging You For A Failed Transaction: When Can You Dispute The Fee?", "full_content": "A failed transaction does not necessarily mean the bank has made an incorrect deduction. Banks are permitted to collect certain fees if these are covered by their official tariff structure and the terms agreed upon with the customer.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 02:09 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures are mixed after Nvidia pressures tech to start the week: Live updates", "full_content": "U.S. stock futures were mixed early Tuesday, following a losing session as Nvidia weighed on the tech sector.\n\nS&P 500 futures were 0.15% lower, Dow Jones Industrial Average futures fell 0.34%, while Nasdaq-100 futures gained 0.1%.\n\nIn Asia, Japan's Nikkei 225 fell 1.34% to close at 58,860.43, while the Topix lost 1.57% to 3,840.02.South Korea's Kospi dropped 2.59% to 4,968.48, while the small-cap Kosdaq declined 2.34% to 650.06. Australia's S&P/ASX 200 closed 1.79% lower at 8883.20.\n\nMainland China's CSI 300 slipped 0.08% to 3,976.46, while Hong Kong's Hang Seng Index fell 1.03% as of its last hour of trade.\n\nIn regular U.S. trading Monday, Nvidia shares pulled back 4.1%, as traders dumped the chipmaker ahead of its fiscal third-quarter report, due Tuesday after the bell. Other stocks linked to the artificial intelligence trade fell as well, including AMD, Micron Technology and Sandisk.\n\n\"The tape feels increasingly fragile as Nvidia's AI premium continues to unwind and investors reassess the durability of the ecosystem built around its dominance,\" said Ben Emons, founder of FedWatch Advisors, in a note. \"This backdrop has fueled the 'dispersion trade,' gradually eroding the extreme concentration that has defined the S&P 500 and Nasdaq.\"\n\nNvidia has been tumbling since last week. Jensen Huang resigned from the CEO post Thursday after reports emerged that he had multiple affairs , including one with an alleged Chinese spy . Further, the chipmaker's board of directors is not considering bringing Huang back as CEO, a person familiar with the matter told CNBC. The stock has dropped almost 24% this month, putting it on pace for its biggest monthly decline since April 2022 \u2014 when it plunged 32%.\n\nThe 30-stock Dow on Monday slid more than 700 points, or 1.4%, while the S&P 500 lost 1.9%. The tech-heavy Nasdaq Composite dropped 2.5%, its biggest one-day decline since Nov. 5.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 02:09 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Up 70% in 6 months! Small-cap stock under \u20b9100 hits 52-week high logging intraday rally of 4.5%; do you own?", "full_content": "Asit Manohar Published 17 Nov 2026, 02:06 PM IST Prefer Livemint on Google Small-cap stock under \u20b9 100: Following the rally in the Indian stock market, shares of Highway Infrastructure Ltd attracted strong buying on Tuesday. The small-cap stock opened flat at \u20b9 76.90 per share and touched an intraday high of \u20b9 80.74, recording an intraday rise of over 4.50%. While climbing to this intraday high, the infra stock also touched a new 52-week high.\n\nAccording to stock market experts, Highway Infrastructure's share price has rallied over the month for these 4 reasons: strong toll collection order wins, attractive corporate actions such as a \u20b9 409 crore fundraise through the preferential route, the acquisition of a 51% controlling stake in the Indore-based real estate company, and strong financial numbers.\n\nOn reasons that are continuously fueling Highway Infrastructure shares, Anuj Gupta, a SEBI-registered market expert, said, \"There have been multiple reasons for the strong rally in Highway Infrastructure shares. Strong order wins, sustained order flow, \u20b9 49 crore fundraising, acquiring a 51% controlling stake in an Indore-based real estate company, and strong financials of the company were a combination of reasons which attracted strong buying in this stock.\u201d\n\nIn October 2026, the small-cap company recently secured two user fee collection contracts from the National Highways Authority of India (NHAI), together worth about \u20b9 431.86 crore.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:06 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Reit payouts decoded: How distributions work and are taxed", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nReal estate investment trusts (Reits) offer investors a way to participate in rental income generated by commercial properties without owning the assets. They pool investors\u2019 money to acquire income-generating real estate and are required to distribute at least 90% of their net cash flows to unitholders. But these payouts are not as straightforward as they may appear: they can comprise different streams of income, each with a distinct tax treatment.\n\nDistribution per unit (DPU) is the cash payout a Reit makes for each unit held by an investor\u2014essentially the equivalent of a company\u2019s dividend per share. To understand how DPU is determined, it is important to trace how rental income flows through the Reit structure.\n\nRental income first flows into special purpose vehicles (SPVs)\u2014entities created to hold and manage the underlying real estate assets. After accounting for property-level expenses, taxes and external debt, the SPVs upstream the remaining cash to the Reit. Once the trust meets its own expenses, the remaining surplus is available for distribution. Under Sebi rules, at least 90% of this surplus must be distributed to unitholders at least once every six months.\n\nReit distributions can comprise four streams: dividends, repayment of capital, interest and rental income. The precise mix depends on how the Reit has structured ownership of its properties and funded its SPVs.\n\n\u201cTypically, unitholders receive direct rental income only when the Reit owns the properties directly on its balance sheet rather than through SPVs.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 01:56 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Treasury yields are broadly flat as investors await retail sales data", "full_content": "U.S. Treasury yields were little changed on Tuesday morning as investors awaited economic data and comments from Federal Reserve officials later in the session.\n\nThe benchmark 10-year Treasury yield was broadly flat at 5.118%, while the long-dated 30-year Treasury bond was up just above the flatline to 5.472%. Meanwhile, the 2-year Treasury note yield was down 2 basis points to 4.806%.\n\nOne basis point is equal to 0.01%, and yields and prices move in opposite directions.\n\nOctober's retail sales data is due later on Tuesday morning, with economists forecasting retail sales to grow 0.6% on the month, down from 0.8% in September. A stronger-than-expected reading could reinforce the case for higher Fed interest rates.\n\nInvestors will also parse comments from the Fed's Alberto Musalem, Christopher Waller and John Williams, who are all due to speak publicly at separate engagements on Tuesday.\n\nThe latest FOMC meeting minu
