<script>

    const allData = {"general": [{"title": "Container ship sinks in Strait of Hormuz as Iran steps up attacks", "full_content": "A container ship sank in the Strait of Hormuz on Wednesday as Iran escalated its attacks on commercial vessels.\n\nThe GFS Pride, registered in Singapore, sank after it was struck by an unidentified projectile and caught fire. The ship's 21 crew members were safely evacuated and no injuries were reported, according to the Maritime and Port Authority of Singapore .\n\n\"Such attacks are unprovoked, unjustifiable and a breach of international law,\" the Singapore maritime authority said in a statement Wednesday.\n\nContainers were floating in the water after the vessel sank, Pakistani maritime authorities warned in a navigational alert .\n\nIran's Revolutionary Guard claimed early Wednesday that a container ship exploded and sank after hitting a naval mine, according to the state news agency Tasnim . But there is no independent evidence to confirm that a mine is what caused the Pride to sink, according to the maritime security firm Marisks.\n\nIran's claims are \"consistent with an ongoing psychological operations campaign aimed at generating fear, increasing uncertainty and discouraging commercial shipping\" in Hormuz, Marisks said in a security alert.\n\nIran has escalated its strikes on commercial ships transiting Hormuz in recent weeks, as it tries to choke off a rebound in crude oil exports through the strait.\n\nMore than 20 vessels, mostly oil tankers, have come under attack this month in Hormuz, the Persian Gulf and Gulf of Oman, according to incident reports from the United Kingdom Maritime Trade Operations Centre.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:34 PM IST", "pub_date_relative": "just now"}, {"title": "Will mortgage rates stay above 7% in 2027?", "full_content": "Two new forecasts spell bad news for home buyers and sellers", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 11:31 PM IST", "pub_date_relative": "4m ago"}, {"title": "Berkshire Hathaway adds $330mn to stake in tech group Bending Spoons", "full_content": "Shares of conglomerate that owns AOL and Vimeo jumped more than 40% on news of expanded investment before dropping back", "source": "FT Markets", "pub_date_str": "14 Oct 2026, 11:28 PM IST", "pub_date_relative": "6m ago"}, {"title": "Social Security Administration announces 3.6% cost-of-living adjustment for 2027", "full_content": "The Social Security cost-of-living adjustment will be 3.6% in 2027, the Social Security Administration said Wednesday.\n\nThe cost-of-living adjustment, or COLA, provides an annual inflation adjustment to both Social Security and Supplemental Security Income, or SSI, benefits.\n\nSocial Security retirement benefits will increase by $75 per month on average, the agency said.\n\n\"Social Security will implement this cost-of-living adjustment for 76 million Americans, giving them greater financial stability,\" Social Security Commissioner Frank Bisignano said in a statement.\n\nAround 72 million Social Security recipients will see the benefit increases in January, according to SSA. About 7.3 million SSI beneficiaries will receive higher payments starting Dec. 31, the agency said.\n\nThe 3.6% COLA for 2027 is in line with Social Security experts' projections , which last month forecast an increase of 3.5% to 3.6%.\n\nThe 3.6% COLA for 2027 is the largest increase to benefits since 2023. That year, beneficiaries received an 8.7% benefit boost \u2014 the highest in four decades \u2014 in response to rising inflation.\n\nNew government inflation data released Wednesday shows consumer price increases are accelerating. The consumer price index rose 3.7% over the past 12 months, as gas prices jumped.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:24 PM IST", "pub_date_relative": "11m ago"}, {"title": "Investing, not homeownership, is the No. 1 milestone that makes Gen Z renters feel successful", "full_content": "\u201cInstead of focusing on homeownership, many are prioritizing financial freedom and debt-free living.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 11:24 PM IST", "pub_date_relative": "11m ago"}, {"title": "Kootenay Silver at Precious Metals & Critical Minerals Virtual Investor Conference: growth push", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:14 PM IST", "pub_date_relative": "20m ago"}, {"title": "We bought SpaceX at $121. Here's why we're buying more at higher prices", "full_content": "SpaceX's Starlink, mobile and AI businesses are expanding. Here's why we're adding to the position after the stock's pullback.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:13 PM IST", "pub_date_relative": "21m ago"}, {"title": "'Office' is actually having a scarcity problem", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nBarely a few years after what some saw as a pandemic-driven collapse of the U.S. office market, the sector is roaring back to health at an unexpectedly fast clip. That speedy recovery is resulting in a shortage, especially of premium space.\n\nThe office market posted its fifth consecutive quarter of positive net absorption, with occupiers adding 6 million square feet in the third quarter of this year, according to a new report from JLL. And employers are expanding, with signed leases now averaging a 13% increase in footprint. Just two years ago, the main theme in office was downsizing.\n\nThis all comes at a time when supply is falling \u2014 and falling faster than demand is recovering. Just 3.5 million square feet of new office space was delivered in the third quarter, which matches the near-record low supply seen in the second quarter. At the same time, 9.6 million square feet was removed through either conversions or redevelopments. The inventory of office space nationally has lost 45 million square feet since the end of 2023.\n\nThere is currently just 23 million square feet of new office space under construction, and with demand for premium office surging, this new space is becoming increasingly scarce. JLL deems it a \"flight to scarcity.\" As a result, rents are finally rising.\n\nEffective rents for first-generation trophy space are now up more than 20% compared with the third quarter of 2025. The lack of available trophy space is now pushing more occupiers to second-generation space. In turn, rents for that sector are up 10% annually.\n\n\"Office, which is having a real renaissance right now.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:05 PM IST", "pub_date_relative": "29m ago"}, {"title": "Trump administration cuts ACA subsidies for 189,000 enrollees", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:05 PM IST", "pub_date_relative": "30m ago"}, {"title": "Uganda central bank raises rates to 12% to support shilling", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:04 PM IST", "pub_date_relative": "30m ago"}, {"title": "Reliance Jio IPO: Good news for RIL shareholders! Check what the reservation quota is for them", "full_content": "The upcoming initial public offering (IPO) of Jio Platforms has reserved equity shares worth up to \u20b9 2,500 crore for eligible shareholders of Reliance Industries , according to its Red Herring Prospectus (RHP).\n\nEligible Reliance Industries shareholders include individuals and Hindu Undivided Families (HUFs), either directly or through the karta, who held public equity shares of the company as of October 14, 2026, the date of filing of the RHP.\n\nThe reservation is subject to applicable laws and the eligibility conditions detailed in the prospectus.\n\nAccording to the company\u2019s Draft Red Herring Prospectus (DRHP), eligible Reliance Industries shareholders applying under the shareholder reservation portion can bid at the cut-off price, provided their bid amount does not exceed \u20b9 2 lakh.\n\nMeanwhile, the issue also includes a reservation of equity shares worth up to \u20b9 500 crore for eligible employees. Large IPOs often reserve a portion of the issue for eligible employees, allowing them to participate in the public offering. Such reservations may also come with a discount on the issue price, subject to the terms and conditions specified in the offer document.\n\nJio Platforms is best known for its telecom arm, Reliance Jio Infocomm, which disrupted India\u2019s telecom industry after its launch in 2016 by offering affordable voice and data services.\n\nJio played a key role in accelerating digital adoption across the country through its low-cost data plans and free voice-calling services, attracting millions of subscribers within a short period.\n\nThe mega IPO will open for subscription on Wednesday, October 21, and close on Friday, October 23, 2026. The anchor investor bidding is scheduled for Monday, October 19. The company has fixed the IPO price band at \u20b9 1,065\u2013 \u20b9 1,119 per equity share.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:01 PM IST", "pub_date_relative": "34m ago"}, {"title": "OpenAI\u2019s Sachin Katti to leave infrastructure role, stay on as advisor", "full_content": "OpenAI's infrastructure lead, Sachin Katti, announced on Wednesday that he is departing his role after roughly a year at the artificial intelligence company.\n\nKatti said in a post on LinkedIn that he \"decided to move on to build something new,\" and he'll continue to support OpenAI as an advisor after his last day on Nov. 15. Uday Ruddarraju, who has been serving as OpenAI's CTO of compute, will replace Katti and lead the company's overall compute organization, according to a spokesperson.\n\n\"Building AI infrastructure at this scale has given me an incredible view into every dimension of the compute world, from silicon and systems to datacenters, energy, supply chains, financing, and the economics of AI,\" Katti wrote. \"I'm enormously proud of what our teams accomplished together and grateful to the partners who helped make it possible.\"\n\nOpenAI's compute organization is crucial to its overall strategy; it's tasked with developing the company's infrastructure roadmap and ensuring that it can train and serve its models. OpenAI is targeting roughly $600 billion in total compute spend by 2030, and it's involved with massive, multi-billion-dollar data center projects in states like Ohio , Texas and Georgia .\n\nThe latest leadership shakeup lands during a tense moment for AI infrastructure in the U.S., where backlash against data centers has mounted over concerns about noise, electricity rates and water consumption. The issue has become a flashpoint in the upcoming midterm elections, where both Republican and Democratic candidates have campaigned against the facilities.\n\n\"I'm proud of what we've built and have total confidence in Uday and the team to carry it forward,\" Katti said in a statement. \"I'm a builder at heart, and I'm looking forward to building something new.\"\n\nRuddarraju joined OpenAI in July of last year, according to his LinkedIn.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 10:55 PM IST", "pub_date_relative": "39m ago"}, {"title": "The steel stock that has the shorts and options traders on edge", "full_content": "Fool me once, shame on you. Fool me twice, shame on me. That seems to be the refrain for Cleveland-Cliffs investors as the steel giant prepares to report earnings.\n\nCleveland-Cliffs steps into the earnings spotlight on Oct.19, and options traders are bracing for impact. After a massive, nearly 16% one-day price jump following its July quarterly report \u2014 nearly double its long-term historical average move of slightly over 8% \u2014 short-term implied volatility (IV) has been aggressively bid up as traders fear a repeat. And who could blame them? Short interest is running close to 14%, and the CEO is famous for fighting the naysayers, noting that he likes boil them \"like frogs\" and that they are \"messing with the wrong guy.\"\n\nWith rhetoric like that, it's little wonder options traders are bracing for big moves.\n\nFor strategic premium sellers, this inflated near-term fear creates a compelling opportunity to deploy what I call a \"strangle-swap.\" You'll sometimes see traders or strategists refer to this as a \"double-diagonal\" spread. This structure allows traders to capitalize on the anticipated post-earnings decline in implied volatility (aka \"vol crush\") without taking on the unlimited risk of a naked short strangle.\n\nTo execute this strangle-swap, you sell a shorter-dated strangle and buy a longer-dated strangle to define your risk.\n\nThe key to this trade is the differential in IV decay between the shorter-dated November expirations being sold and the longer-dated January options being purchased. Traders are heavily bidding November options on concerns that the sharp move from the last quarterly earnings release may repeat.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:52 PM IST", "pub_date_relative": "42m ago"}, {"title": "Jio Platforms IPO confirms RIL reservation quota \u2014 How will it impact Reliance share price? Experts' views", "full_content": "Jio Platforms IPO | Reliance Digital | Reliance share | RIL share: The digital arm of Reliance Industries Ltd (RIL) today submitted the much-awaited Jio Platforms IPO RHP (Red Herring Prospectus) with the Registrar of Companies, Gujarat, at Ahmedabad, for the IPO on Wednesday. The Reliance Group subsidiary company also declared the Jio Platforms IPO price band at \u20b9 1,065 to \u20b9 1,119 per equity share. So, Reliance's digital arm is expected to raise between \u20b9 28,755 crore and \u20b9 30,213 crore. The public issue will open on 21 October 2026, and it is proposed for listing on the BSE and the NSE.\n\nReliance's digital arm also declared a \u20b9 54-per-share rebate for Eligible Employees bidding under the Employee Reservation Portion. Jio Platforms also confirmed the shareholders' quota in the final prospectus for the upcoming IPO, reserving up to \u20b9 2,500 crore worth of Jio Platforms shares, leaving open the question of whether Reliance shares would react to this development on Thursday.\n\nSpeaking on the impact of Jio Platforms IPO RHP filing and its impact on the Reliance shares in the wake of a large \u20b9 2,500 crore shareholders' quota, Arun Kejriwal, Founder of Kejriwal Research and Investment Services, said, \u201cI am not expecting any impact on RIL shares on Thursday due to the Jio Platforms IPO RHP filing. In fact, it has become clear after the Jio Platforms' RHP filing that investors buying Reliance shares from tomorrow onwards won't be eligible for applying to the Jio Platforms IPO under the shareholders' quota because the RHP filing date is considered the cutoff date for finalising the list of eligible shareholders of the company.\u201d\n\nPointing towards the upside trend in RIL share price today, Mahesh M Ojha, VP \u2014 Research and Business Development, said, \u201cThose who bought Reliance shares on Wednesday may also not be able to avail the benefit of applying under the shareholders' quota. This is because of the 'T+1' rule applicable to buying and selling of shares.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 10:52 PM IST", "pub_date_relative": "42m ago"}, {"title": "Utz Brands announces death of longtime leader Michael Rice", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 10:50 PM IST", "pub_date_relative": "44m ago"}, {"title": "How high inflation became a 'fact of life' in the U.S.", "full_content": "U.S. consumers are in the midst of one of the longest stretches of elevated inflation of the past century. Some are beginning to act like it's a new normal, raising alarm bells for members of the Federal Reserve .\n\nWednesday's consumer price index release showed a 3.7% increase year over year in September. CPI has now registered around 65 months \u2014 that's more than five years \u2014 of consecutive annual readings above 2%, a widely accepted target for inflation in the U.S.\n\nThis yearslong spell of high inflation has cast a dark cloud over everyday Americans' view of the economy, and could shape everything from how they budget to how they vote in next month's midterm elections. At the Fed, leaders are left questioning whether consumers' inflationary expectations are becoming too entrenched to rein in.\n\n\"They're starting to accept high inflation as just a fact of life,\" Cleveland Fed President Beth Hammack wrote in a social media post last week. \"That's concerning.\"\n\nThe current streak of stubborn inflation ranks among the most persistent in modern U.S. history.\n\nThe uninterrupted string of above-2% monthly CPI readings is the longest of the 21st century, according to a CNBC analysis of data from the Bureau of Labor Statistics. The U.S. has seen longer periods on only two other occasions going back to the late 1940s.\n\nSince inflation started running above 2% in early 2021, the average CPI reading has sat around 4.5%. The last time a streak had a mean reading that high was during a period ending in the 1980s .\n\nConsumers are expecting inflation to accelerate. The one-year inflation outlook in September rose three-tenths of a percentage point to 3.9%, its highest reading in more than three years, according to the New York Fed's Survey of Consumer Expectations released last week.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:50 PM IST", "pub_date_relative": "44m ago"}, {"title": "Anduril allows staff to sell shares at $90 billion valuation - report", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 10:50 PM IST", "pub_date_relative": "45m ago"}, {"title": "BlackRock, Goldman Sachs, Nomura among key investors as Zetwerk mops up Rs 2,251 crore in anchor bidding; IPO opens on Oct 15", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a BlackRock, Goldman Sachs, Nomura among key investors as Zetwerk mops up Rs 2,251 crore in anchor bidding; IPO opens on Oct 15 SBI Life Insurance Company Share Price Life Insurance Corporation of India Share Price HDFC Life Insurance Company Share Price ICICI Life Insurance Share Price Max Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper BlackRock, Goldman Sachs, Nomura among key investors as Zetwerk mops up Rs 2,251 crore in anchor bidding; IPO opens on Oct 15 SECTIONS BlackRock, Goldman Sachs, Nomura among key investors as Zetwerk mops up Rs 2,251 crore in anchor bidding; IPO opens on Oct 15 By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 10:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Zetwerk Manufacturing Businesses raised Rs 2,251 crore from 99 anchor investors, including BlackRock, Goldman Sachs and Nomura, ahead of its IPO opening on October 15. The Rs 5,012 crore issue, priced at Rs 143\u2013151 per share, comprises a fresh issue and an offer for sale. Subscription closes on October 19.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:48 PM IST", "pub_date_relative": "46m ago"}, {"title": "US lawmakers ask FAA to conduct review before allowing Amazon drone hub near Boston", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 10:48 PM IST", "pub_date_relative": "46m ago"}, {"title": "US Fed\u2019s Bowman sees no urgency for another rate hike", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Fed\u2019s Bowman sees no urgency for another rate hike Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Fed\u2019s Bowman sees no urgency for another rate hike SECTIONS US Fed\u2019s Bowman sees no urgency for another rate hike ETMarkets.com Last Updated: Oct 14, 2026, 10:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Michelle Bowman, the Vice Chair for Supervision of the US Federal Reserve, spoke during the IMF-World Bank meetings in Bangkok. She stated that the central bank does not feel urgency for further rate hikes at this time. Bowman's comments came after a recent rate increase that set the target range to 3.75%-4.00%. Additionally, she addressed the need for stronger oversight in light of recent bank failures.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:48 PM IST", "pub_date_relative": "47m ago"}, {"title": "Stripchat loses legal fight against EU tech label", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 10:42 PM IST", "pub_date_relative": "52m ago"}, {"title": "Iran says it\u2019s \u2018counting the moments\u2019 until it can strike U.S. warships; Saudi Aramco facilities attacked", "full_content": "Saudi officials said Wednesday that an administrative building belonging to oil giant Saudi Aramco was targeted overnight, as the Tehran-backed Houthi militants step up their attacks on the kingdom.\n\nThe strike caused a fire, but no injuries were reported at the site in the city of Dhahran on the country's eastern coast, according to a statement from the Saudi Ministry of Energy.\n\nThe Houthis, a Yemen-based militia group backed by Iran, have launched a series of strikes on Saudi targets over the past week. Airport attacks in the capital city of Riyadh led to multiple fatalities, flight cancellations and property damage. Riyadh's King Khalid International Airport remains closed until Saturday.\n\nYemen's civil war has returned to full-scale fighting between the Houthis and the country's internationally recognized government amid a wider regional escalation linked to the U.S.-Iran war.\n\nIran Revolutionary Guard chief Ali Ozmaei said Wednesday that Tehran is \"counting the moments\" until it can sink American warships, according to Iranian state-affiliated media.\n\n\"If the Americans think the Strait of Hormuz is open, let them come closer. We are impatient to sink American warships,\" Ozmaei reportedly said in a televised interview.\n\n\"We are waiting for U.S. warships to approach the entrance to the Strait of Hormuz so we can sink them. We are counting down every moment until this happens.\"\n\nThe Wall Street Journal reported Tuesday that the Islamic Republic has been strengthening defenses around sensitive locations like nuclear sites, and telling regional officials that Tehran will respond to any new U.S. strikes with retaliatory measures across the Middle East as it prepares its population for renewed war in the coming weeks.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:42 PM IST", "pub_date_relative": "52m ago"}, {"title": "Prices increased sharply in September in last inflation report ahead of elections - The Washington Post", "full_content": "Prices increased sharply in September in last inflation report ahead of elections The Washington Post Inflation rose to 3.7% last month in last snapshot of consumer prices before the midterms CNN Stock market today: Hot inflation report drops tech, drives S&P 500, Nasdaq down Yahoo Finance Here's the inflation breakdown for September 2026 \u2014 in one chart CNBC Steve Moore warns stubborn inflation could complicate Fed rate decision KOMO", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 10:39 PM IST", "pub_date_relative": "56m ago"}, {"title": "Delta One gets a boozy upgrade with $200 wines, luxe dining and new suites on the way - The Points Guy", "full_content": "Delta One gets a boozy upgrade with $200 wines, luxe dining and new suites on the way The Points Guy The New Era of Delta One Delta News Hub Delta's business-class revamp: New seats, menus, plates and more Porsches CNBC Delta One gets major upgrade to dining, passenger experience The Business Journals Delta One Adds Blanton\u2019s Bourbon and Hugo Spritzes to Revamped Menu VinePair", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 10:39 PM IST", "pub_date_relative": "56m ago"}, {"title": "Morgan Stanley tops estimates as equities trading revenue beats expectations by $909 million", "full_content": "Morgan Stanley posted third-quarter results that beat expectations on blockbuster results in its equities trading franchise.\n\nThe company said profit climbed 6.5% to $4.91 billion, or $3.03 a share. Revenue rose 12% to $20.34 billion.\n\nThe firm's equities trading division, long a marquee business for Morgan Stanley, posted a 41% increase in revenue to $5.8 billion, exceeding the StreetAccount estimate by about $909 million.\n\nMorgan Stanley noted widespread strength across its equities products and regions, but cited Asia as a source of particular strength in the quarter. The gains in that business helped offset disappointments elsewhere.\n\nFixed income trading revenue fell 7% to $2.01 billion, driven by declines in credit and commodities, which is roughly $260 million below expectations.\n\nInvestment banking revenue edged 2% higher to $2.16 billion, about $110 million below expectations. The bank cited an increase in advisory revenue on more completed mergers, but declines in equity underwriting on lower initial public offerings and a drop in fixed income underwriting.\n\nStill, the results were \"good, but not great,\" as some business metrics showed slower improvement in the quarter, Wells Fargo analyst Mike Mayo said Wednesday in a note.\n\nThe economy is subject to two key forces right now: the boost from the artificial intelligence build-out and the drag from geopolitical strife, Morgan Stanley CEO Ted Pick told CNBC's Leslie Picker on Wednesday.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 10:38 PM IST", "pub_date_relative": "56m ago"}, {"title": "Fannie Mae sharply raises mortgage rate forecast for 2027", "full_content": "Economists at Fannie Mae are now predicting much higher mortgage rates through the end of 2026 and into 2027. It now puts the average rate on the 30-year fixed at 7.4% for the fourth quarter of this year and 7.5% through all of next year. It previously forecast 6.8% for the fourth quarter and 6.7% for all of next year.\n\nThe average rate on the 30-year fixed stood at 7.46% Tuesday, according to Mortgage News Daily, but will likely move higher today. Bond yields are rising after a hotter-than-expected inflation report.\n\nMortgage rates have been rising sharply since the start of September, as inflation remains stubbornly high and bond markets sell off due to several factors. The Federal Reserve also raised its benchmark rate for the first time in more than three years. Mortgage rates do not follow the Fed's rate exactly, but they do react to how the central bank sees inflation going forward.\n\nMortgage rates loosely follow the yield on the 10-year Treasury, which has been rising sharply on higher oil prices and growing concerns in the global economy.\n\nCNBC's Property Play with Diana Olick covers new and evolving opportunities for the real estate investor, delivered weekly to your inbox.\n\nHigher rates have already put the housing market in an early deep freeze this fall. Pending sales, counted by signed contracts on existing homes, were down 8.5% in September year-over-year, according to Zillow. Mortgage demand continues to drop sharply, as buyers face higher prices and weakening affordability. Not only can fewer buyers now afford a home, but fewer can qualify for a mortgage.\n\nFannie Mae did not respond to requests for comment on its latest forecast.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:38 PM IST", "pub_date_relative": "57m ago"}, {"title": "Progressive earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 10:36 PM IST", "pub_date_relative": "58m ago"}, {"title": "CoreWeave shares tumble as bond yields near 15% on concern about AI borrowing binge", "full_content": "CoreWeave 's stock and bonds were both hit on Wednesday as investor fear grew that some technology companies are borrowing too heavily for the artificial intelligence build-out.\n\nShares of the so-called neocloud nosedived 16%, while yields on its debt jumped higher. The yield to maturity on its 9.625% bond due in 2032 is sitting at 14.8%, while that of its 9.75% bond due in 2031 is around 14.9%. Bond yields move inversely to prices.\n\nWhile investors were once excited about getting in on the AI action, investor sentiment has started to shift, said Luis Alvarado, co-head of global fixed income strategy at Wells Fargo Investment Institute.\n\nNow, investors are demanding more risk compensation, he said.\n\n\"The era of easy money, which we experienced in the first nine months of the year, is starting to disappear and dissipate,\" Alvarado noted. \"Now the extra dollar or the marginal dollar is going to be more looked at with a microscope into the concessions that the issuer is giving you back.\"\n\nTech investor Chamath Palihapitiya , founder and CEO of investment firm Social Capital and CEO of AI company 8090, called out CoreWeave's soaring yields on X late Tuesday. That prompted Tesla and SpaceX CEO Elon Musk to respond, \"yikes.\"\n\nPalihapitiya shared a chart of the 2032 bond, noting that the yield \"touched 15%\" and then \"closed at a new high\" on Tuesday. He also included part of his deep dive into whether the AI build-out is creating a private credit bubble, in which he noted \"how little extra lenders appear to charge for AI risk.\"\n\nCoreWeave's balance sheet is \"relatively bad\" compared to its neocloud peers, said Paul Meeks, head of technology research at Freedom Capital Markets. That's because CoreWeave has done more borrowing and is currently building more data centers, he explained.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 10:36 PM IST", "pub_date_relative": "59m ago"}, {"title": "'The power of shrink' \u2014 tour the little-known $25B company that chipmakers can't live without", "full_content": "Here's a deep dive into Qnity and how its products help build the AI semiconductors that power the world.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "3 things that are driving inflation higher", "full_content": "Struggling with elevated prices? You don\u2019t have to look much further than your local gas station.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 10:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Treasury says largest U.S. banks let politics influence who received banking services", "full_content": "The Treasury Department's Office of the Comptroller of the Currency found some of the largest banks serving the U.S. allowed political considerations, public pressure and social concerns to influence decisions about who received banking services, according to a sweeping report released Wednesday.\n\nThe OCC said it reviewed the nine largest national banks under its supervision, examining nearly 100,000 complaints and about 420,000 pages of documents. It found that all nine had used \"reputation risk\" policies that lacked \"clear,\" \"objective\" standards and could disadvantage customers because of their political or religious views or lawful business activities.\n\n\"Banks should make decisions based on financial risk, not the political or social preferences of their employees or executives,\" Comptroller of the Currency Jonathan Gould said, according to a transcript of his in remarks Wednesday in Lexington, Kentucky.\n\nThe findings may lend new regulatory weight to a grievance President Donald Trump has pressed since returning to office. Trump has repeatedly accused and sued major banks for discriminating against conservatives and has said he was personally \" debanked \" after the Jan. 6, 2021, Capitol insurrection , claims banks have denied .\n\nThe report lands a day after the OCC and other Treasury regulators imposed more than $1.2 billion in penalties on Bank of America over separate anti-money-laundering failures . At the same time, the OCC said it is examining whether banks' efforts to comply with anti-money-laundering rules have themselves contributed to debanking.\n\nThe review covered JPMorgan Chase , Bank of America, Citibank , Wells Fargo , U.S.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank of America shares drop 8% after third-quarter revenue miss and regulatory penalty", "full_content": "Bank of America on Wednesday posted a sharp profit decline after being hit with a $1.2 billion penalty by U.S. regulators, while revenue also disappointed after trading operations generated about $750 million less than expected.\n\nThe bank's third-quarter profit fell 17% to $6.93 billion, or 91 cents a share. Excluding the penalty, which sapped income by 17 cents, EPS would've been $1.08 a share.\n\nCompanywide revenue rose 3.2% to $30.12 billion in the quarter, on an FTE basis, but that was below expectations by about $570 million, largely on misses from Wall Street trading operations.\n\nFixed income trading revenue dropped 17% to $2.55 billion on weakness in mortgages, municipals and credit activity. That is roughly $450 million below the StreetAccount estimate.\n\nEquities trading revenue climbed 10% to $2.51 billion, but that was also below analysts' expectations, by nearly $300 million.\n\nThe trading disappointment comes after CEO Brian Moynihan told analysts last month that trading revenue would be roughly flat; instead the combined bond and stock trading results fell by 5%.\n\nInvestment banking revenue dropped 11% to $1.8 billion, roughly in line with expectations and Moynihan's September guidance.\n\nNet interest income, a key profitability driver watched closely by Bank of America investors, rose 7.9% to $16.6 billion, slightly edging out the $16.53 billion StreetAccount estimate.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 10:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio IPO sparks investor buzz: GMP hits 20% as Reliance\u2019s telecom arm announces price band, dates", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio IPO sparks investor buzz: GMP hits 20% as Reliance\u2019s telecom arm announces price band, dates Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO sparks investor buzz: GMP hits 20% as Reliance\u2019s telecom arm announces price band, dates SECTIONS Jio IPO sparks investor buzz: GMP hits 20% as Reliance\u2019s telecom arm announces price band, dates By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 10:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms\u2019 IPO grey market premium climbed to Rs 220 after the company filed its red herring prospectus (RHP) on Wednesday. The GMP implies a nearly 20% premium over the upper price band of Rs 1,119. The Rs 30,213 crore IPO, opening on October 21 and closing on October 23, is set to surpass Hyundai Motor India\u2019s 2024 offering to become India\u2019s largest-ever public issue.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "SC makes insurance mandatory for all train tickets from Oct 27; here's what it means for customers booking offline", "full_content": "The Supreme Court has directed Indian Railways to extend insurance coverage to passengers buying train tickets at station counters from October 27, 2026. At present, passengers can get this facility when making train travel reservations online by paying a nominal additional amount.\n\nA bench of Justices Ahsanuddin Amanullah and R Mahadevan pronounced the order on October 6 while hearing a petition filed in the aftermath of the Odisha train accident that happened in June 2023.\n\nThe plea sought an inquiry into the crash, alleging that the failure to implement the Kavach train protection system had contributed to the tragedy. It also called for the safety system to be rolled out across the railway network.\n\nIn earlier hearings, the Supreme Court had given Indian Railway authorities time to devise a mechanism to extend insurance coverage to passengers buying tickets offline, including those from economically weaker sections of society.\n\nHowever, during the October 6 hearing, the bench noted that no progress had been made and decided to issue a directive mandating coverage.\n\nIt also warned that the Railway Board would be held directly responsible for any failure to implement the order.\n\n\u201cThe Court has granted sufficient time to the authorities to devise a mechanism for extending such coverage to persons belonging to the lowest strata of society, who, in most cases, purchase their tickets at the railway reservation counters while undertaking journeys by train. As there has been no progress on this aspect either, we direct that within two weeks, i.e., with effect from 27.10.2026, all tickets sold over the counter at all railway stations shall also be covered by insurance in the same manner as tickets purchased online,\u201d the order read, according to Livelaw .\n\nCurrently, travel insurance is only available if you purchase train tickets from the official Indian Railway Catering and Tourism Corporation's ( IRCTC ) web portal or mobile app.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump's diesel dilemma \u2014 by the numbers", "full_content": "Diesel prices are surging as midterms approach \u2013 and they are likely to stay high in the near future, according to analysts.\n\nThe International Energy Agency's monthly report for October, released Wednesday, was the latest to predict that constraints on the diesel market will likely keep prices elevated into next year. The group warned that even if refineries step up production of diesel into the year-end, inventories will likely remain strained until the second half of 2027.\n\nLast Friday, President Donald Trump unexpectedly paused sanctions on Russian diesel fuel and announced that he reached a deal with President Vladimir Putin in which the Kremlin would release 4.8 million metric tons of diesel , or nearly 36 million barrels, to the global market.\n\nOver the weekend, he took to Truth Social to announce an \"energy ceasefire\" between Russia and Ukraine , but Ukrainian President Volodymyr Zelenskyy later accused Russia of attacking the country's energy facilities .\n\nThe foreign policy developments come as rising fuel prices \u2014 particularly skyrocketing diesel \u2014 have become a major flashpoint ahead of this year's midterm election. But releasing Russian diesel to the global market is unlikely to drop prices in the near term. A note from Goldman Sachs last week even predicted that diesel prices will remain high through 2027 as refineries struggle to meet demand.\n\nWholesale diesel prices have more than doubled since the beginning of 2026 through the end of September as both the war in Iran and Russia's war in Ukraine have dramatically cut global supply.\n\nTrump has insisted that the war in Ukraine is to blame for high diesel prices. On July 8, Russia banned diesel exports after Ukraine struck its refineries. In the U.S., the price of a gallon of diesel rose nearly 40% between July 6 and Sept.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "10-year Treasury yield jumps as September core inflation comes in hotter than expected", "full_content": "The 10-year Treasury note yield rose on Wednesday following the latest U.S. inflation print.\n\nThe yield on the 10-year Treasury note \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 jumped more than 2 basis points to 5.242%. It had reached the highest level since Oct. 8 earlier in the day.\n\nThe longer-dated 30-year U.S. Treasury yield \u2014 which tends to react most to geopolitical events \u2014 was up less than 1 basis point to 5.568%.\n\nThe 2-year Treasury \u2014 which closely tracks the Fed's interest rate decisions \u2014 gained more than 5 basis points to 4.852% after earlier hitting its highest level since Sept. 29.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely.\n\nThe consumer price index rose 3.7% year over year in September, higher than the Dow Jones consensus estimate of 3.6%. Core inflation, excluding food and energy prices, came in at 2.6% on an annualized basis, versus the 2.5% consensus estimate.\n\nThe latest inflation reading comes just two weeks before the Fed's next interest rate decision.\n\nWith inflation remaining sticky, the central bank may need to raise rates higher and keep them there for longer in 2027, said Christopher Rupkey, chief economist at Fwdbonds.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Netflix Film VP Doug Belgrad Out In Layoffs - The Hollywood Reporter", "full_content": "Netflix Film VP Doug Belgrad Out In Layoffs The Hollywood Reporter Netflix to lay off roughly 1,000 employees, or 6% of workforce CNBC Netflix cuts 1,000 jobs in company\u2019s biggest layoffs ever, despite strong revenue growth San Francisco Chronicle Netflix cuts about 6% of jobs in biggest layoff since 2022 Reuters Exclusive | Netflix Eliminates About 1,000 Jobs in Biggest Cuts Since 2022 WSJ", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 10:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ukraine warns Starlink limits are disrupting military operations as Russia pounds its energy infrastructure", "full_content": "Ukraine has accused Elon Musk's SpaceX of imposing new restrictions on its military-grade Starlink internet service without warning, disrupting Ukrainian military operations.\n\nIt comes as Russia intensifies attacks on the country's energy infrastructure despite President Donald Trump's proposed \"energy ceasefire.\"\n\nSerhii Beskrestnov, an adviser to President Volodymyr Zelenskyy on defense technology, said Wednesday that SpaceX has implemented a speed limit on Starlink terminals in motion without notifying Ukrainian defense forces, disrupting some missions. The restrictions apply to the sister service Starshield, which supports national security.\n\nMeanwhile, Russia unleashed an attack on Ukrainian energy infrastructure overnight, leaving at least 600,000 people without power in the Kyiv and Kharkiv regions, raising further questions about the \"energy ceasefire\" announced by Trump on Sunday.\n\n\"There is significant damage to facilities and equipment \u2013 at 26 facilities of our power system and four facilities in the oil and gas sector,\" Zelenskyy said in a post on X early Wednesday.\n\nHe highlighted a targeted ballistic missile strike against the energy infrastructure that Zelenskyy said should have been covered by the \"energy ceasefire\" announced by President Donald Trump on Sunday.\n\n\"The strike was entirely deliberate and demonstrative in its scale \u2013 Russia has never before shown such ostentatious disrespect toward the United States,\" Zelenskyy said.\n\nThe attack comes after the Ukrainian president on Monday accused Russia of violating Trump's proposal that the adversaries stop attacking each other's energy facilities to help bring down the cost of oil and diesel.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "BlackRock's Larry Fink warns a data center moratorium could trigger a recession", "full_content": "BlackRock CEO Larry Fink warned that a halt to data center construction could trigger an economic slowdown.\n\n\"If we have a moratorium of some sort in this country, we will be in a recession,\" Fink told CNBC Wednesday, after BlackRock reported better-than-expected third-quarter earnings early Wednesday. BlackRock advanced about 1% in late morning trading.\n\n\"So much of our economy is based on the buildout of this capex,\" Fink added, referring to the massive investments made to develop artificial intelligence infrastructure.\n\nFink's warning comes as strong, local opposition to data center construction has emerged as a key issue in the Nov. 3 midterm elections, as communities struggle with rising utility costs, water use, environmental damage and questions over investment transparency.\n\nWhile Fink acknowledged fears about the data center buildout, he also noted \"most of it is on misinformation.\"\n\nThe stakes are high. Wall Street analysts estimate total AI capital expenditures could climb above $1 trillion in 2027 and total in excess of $5 trillion by 2030 .\n\n\"Data centers are not the problem. They're creating more new jobs than ever before,\" the BlackRock CEO explained. The scale of investment has created demand for construction workers, physical digital infrastructure, AI compute hardware and energy infrastructure to secure grid power, he said.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 09:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Yuvraj Singh Told What Delhi Capitals Expect From Him As Assistant Coach For IPL 2027", "full_content": "Yuvraj's appointment offers Delhi Capitals players an opportunity to learn from one of India's most celebrated limited-overs cricketers.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 09:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rising bond yields and higher inflation leave the Fed trapped in a rate-hike dilemma", "full_content": "There isn\u2019t any way to spin Wednesday\u2019s hot consumer-price index report as good, especially when looking at the bond market\u2019s reaction.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 09:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "CoreWeave shares tumble as bond yields near 15% on concern about AI borrowing binge - CNBC", "full_content": "CoreWeave shares tumble as bond yields near 15% on concern about AI borrowing binge CNBC Traders pile into 'bubble puts' on CoreWeave as neocloud stocks plunge CNBC Prediction: CoreWeave Could Be One of the Most Explosive AI Stocks of the Decade Yahoo Finance CoreWeave Bonds Tumble Into Distress, Drawing \u2018Yikes\u2019 From Musk Bloomberg.com CoreWeave targets \u2018unlimited\u2019 insurance money to fund AI build-out Financial Times", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 09:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Morgan Stanley beats quarterly profit estimates on equity trading strength - Reuters", "full_content": "Morgan Stanley beats quarterly profit estimates on equity trading strength Reuters See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "US regulator accuses nation's largest banks of debanking customers over political views - Fox Business", "full_content": "US regulator accuses nation's largest banks of debanking customers over political views Fox Business Federal watchdog says 9 large US banks denied service to customers over political or religious views Yahoo Finance Treasury says largest U.S. banks let politics influence who received banking services CNBC US bank regulator faults several large lenders over debanking practices Reuters Debanking Probe Finds JPMorgan, Banks Cut Off MAGA Sellers and Democrat Groups WSJ", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 09:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio IPO: 5 strengths that put the Reliance-backed digital giant in spotlight", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio IPO: 5 strengths that put the Reliance-backed digital giant in spotlight The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO: 5 strengths that put the Reliance-backed digital giant in spotlight SECTIONS Jio IPO: 5 strengths that put the Reliance-backed digital giant in spotlight By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 09:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reliance Jio Platforms has highlighted five key strengths in its RHP ahead of its Rs 30,213 crore IPO, including strong revenue growth, profitability, a vast customer base, extensive network infrastructure and proprietary technology. The company also sees growth opportunities in fixed broadband, AI-led services, digital subscriptions and overseas technology monetisation.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Your Social Security check will rise an average of $75 a month \u2014 will it be able to keep up with inflation?", "full_content": "The 3.6% COLA for 2027 is aimed at helping more than 68 million beneficiaries keep pace with the cost of living", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "LASK Vs Liverpool Live Streaming: Likely Lineups; How To Watch Champions League Match?", "full_content": "LASK host Liverpool in the Champions League as the Reds aim to return to winning ways. Check live telecast and streaming details.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 09:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Earnings season is heating up. UBS thinks these stocks could beat expectations", "full_content": "The investment bank called out a few names whose results are likely to impress Wall Street.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 09:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Abilene Christian University is giving Ivy League endowments a run for their money in the market", "full_content": "While universities like Harvard and Yale carry around endowments that are larger than some small countries' economies, this bull market has provided an environment in which their market performance can be rivaled by nimble collegiate counterparts lacking their vast resources and donor networks.\n\nYale University's $44 billion endowment, a close comp to Nepal's GDP, has returned 9.4% over the past decade through June 2025 \u2014 good, but not good enough to beat Abilene Christian University, a private Christian university in Abilene, Texas , and its 11.4% over the same period, which recently led it to surpass the $1 billion in assets milestone .\n\nThrough June 2026, ACU's 10-year return climbed to 13.6%, against 9.1% for a benchmark of 70% global stocks and 30% bonds, according to data provided by the school. But it's more than just a good year: ACU's 20-year 10.9% average through June 2026 is well above its 6.8% benchmark.\n\nFor many schools, this is the period (September to November) when fiscal year investment performance is released, but not all information is released at the same time. Yale, for instance, has yet to publish its 2026 numbers. The most-cited annual study of hundreds of endowments, the NACUBO-Commonfund Study of Endowments , will be published in February 2027 for FY 2026 performance data.\n\nJoe Lee, president and chief investment officer of ACIMCO (Abilene Christian Investment Management Company), a university-controlled investment company that manages the school's portfolio, said that many small, but good, sound decisions early on, years ago, have compounded over time.\n\n\"We do the standard stuff that other endowments do,\" Lee said, pointing to a philosophy that is equity-oriented, incorporates super long time horizons, and employs good managers and diversification techniques.\n\nBut he also said being small can be an advantage, \"if you lean into the advantages of a smaller endowment,\" Lee said.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 09:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asked to be an executor? Know your duties before you agree", "full_content": "You have chosen the sensible approach of understanding your role as an executor before accepting the responsibility.\n\nUnder law, the deceased\u2019s property vests in the executor, who acts as the legal representative of the estate. In practice, you have to locate the will and assets, pay funeral expenses, debts and taxes from the estate, and then transfer the assets to the legatees as the will directs.\n\nYou will also need to complete formalities such as obtaining a PAN card for the estate, opening an estate bank account and dealing with various authorities and institutions, depending on the nature of the assets. These could include land revenue authorities, housing societies and provident fund authorities. The entire process can last months and often years.\n\nProbate is no longer mandatory anywhere in India after December 2025, but you may still have to apply for it if family members are likely to dispute the will or if a regulator or financial institution requires it under its policies. Once probate is granted, you must file an inventory of the estate in court within six months and an account within a year.\n\nYou are not entitled to a fee for acting as executor unless the will provides for remuneration. That said, reasonable expenses, such as travel costs and legal and professional fees, can be paid or reimbursed from the estate.\n\nPresumably, your friend has asked you to be the executor of a will that he intends to sign imminently. Before accepting, you should discuss some good practices with him to make administering the estate easier.\n\nHe should also take legal advice to ensure that the will is clear and unambiguous. Urge him to name a co-executor or alternate executor, ideally someone younger or a family member, in case you are unable or unwilling to follow through with this responsibility later.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 09:43 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Container ship sinks in Strait of Hormuz as Iran steps up attacks", "full_content": "A container ship sank in the Strait of Hormuz on Wednesday as Iran escalated its attacks on commercial vessels.\n\nThe GFS Pride, registered in Singapore, sank after it was struck by an unidentified projectile and caught fire. The ship's 21 crew members were safely evacuated and no injuries were reported, according to the Maritime and Port Authority of Singapore .\n\n\"Such attacks are unprovoked, unjustifiable and a breach of international law,\" the Singapore maritime authority said in a statement Wednesday.\n\nContainers were floating in the water after the vessel sank, Pakistani maritime authorities warned in a navigational alert .\n\nIran's Revolutionary Guard claimed early Wednesday that a container ship exploded and sank after hitting a naval mine, according to the state news agency Tasnim . But there is no independent evidence to confirm that a mine is what caused the Pride to sink, according to the maritime security firm Marisks.\n\nIran's claims are \"consistent with an ongoing psychological operations campaign aimed at generating fear, increasing uncertainty and discouraging commercial shipping\" in Hormuz, Marisks said in a security alert.\n\nIran has escalated its strikes on commercial ships transiting Hormuz in recent weeks, as it tries to choke off a rebound in crude oil exports through the strait.\n\nMore than 20 vessels, mostly oil tankers, have come under attack this month in Hormuz, the Persian Gulf and Gulf of Oman, according to incident reports from the United Kingdom Maritime Trade Operations Centre.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:34 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Social Security Administration announces 3.6% cost-of-living adjustment for 2027", "full_content": "The Social Security cost-of-living adjustment will be 3.6% in 2027, the Social Security Administration said Wednesday.\n\nThe cost-of-living adjustment, or COLA, provides an annual inflation adjustment to both Social Security and Supplemental Security Income, or SSI, benefits.\n\nSocial Security retirement benefits will increase by $75 per month on average, the agency said.\n\n\"Social Security will implement this cost-of-living adjustment for 76 million Americans, giving them greater financial stability,\" Social Security Commissioner Frank Bisignano said in a statement.\n\nAround 72 million Social Security recipients will see the benefit increases in January, according to SSA. About 7.3 million SSI beneficiaries will receive higher payments starting Dec. 31, the agency said.\n\nThe 3.6% COLA for 2027 is in line with Social Security experts' projections , which last month forecast an increase of 3.5% to 3.6%.\n\nThe 3.6% COLA for 2027 is the largest increase to benefits since 2023. That year, beneficiaries received an 8.7% benefit boost \u2014 the highest in four decades \u2014 in response to rising inflation.\n\nNew government inflation data released Wednesday shows consumer price increases are accelerating. The consumer price index rose 3.7% over the past 12 months, as gas prices jumped.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:24 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Kootenay Silver at Precious Metals & Critical Minerals Virtual Investor Conference: growth push", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:14 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "'Office' is actually having a scarcity problem", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nBarely a few years after what some saw as a pandemic-driven collapse of the U.S. office market, the sector is roaring back to health at an unexpectedly fast clip. That speedy recovery is resulting in a shortage, especially of premium space.\n\nThe office market posted its fifth consecutive quarter of positive net absorption, with occupiers adding 6 million square feet in the third quarter of this year, according to a new report from JLL. And employers are expanding, with signed leases now averaging a 13% increase in footprint. Just two years ago, the main theme in office was downsizing.\n\nThis all comes at a time when supply is falling \u2014 and falling faster than demand is recovering. Just 3.5 million square feet of new office space was delivered in the third quarter, which matches the near-record low supply seen in the second quarter. At the same time, 9.6 million square feet was removed through either conversions or redevelopments. The inventory of office space nationally has lost 45 million square feet since the end of 2023.\n\nThere is currently just 23 million square feet of new office space under construction, and with demand for premium office surging, this new space is becoming increasingly scarce. JLL deems it a \"flight to scarcity.\" As a result, rents are finally rising.\n\nEffective rents for first-generation trophy space are now up more than 20% compared with the third quarter of 2025. The lack of available trophy space is now pushing more occupiers to second-generation space. In turn, rents for that sector are up 10% annually.\n\n\"Office, which is having a real renaissance right now.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:05 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Uganda central bank raises rates to 12% to support shilling", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 11:04 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Reliance Jio IPO: Good news for RIL shareholders! Check what the reservation quota is for them", "full_content": "The upcoming initial public offering (IPO) of Jio Platforms has reserved equity shares worth up to \u20b9 2,500 crore for eligible shareholders of Reliance Industries , according to its Red Herring Prospectus (RHP).\n\nEligible Reliance Industries shareholders include individuals and Hindu Undivided Families (HUFs), either directly or through the karta, who held public equity shares of the company as of October 14, 2026, the date of filing of the RHP.\n\nThe reservation is subject to applicable laws and the eligibility conditions detailed in the prospectus.\n\nAccording to the company\u2019s Draft Red Herring Prospectus (DRHP), eligible Reliance Industries shareholders applying under the shareholder reservation portion can bid at the cut-off price, provided their bid amount does not exceed \u20b9 2 lakh.\n\nMeanwhile, the issue also includes a reservation of equity shares worth up to \u20b9 500 crore for eligible employees. Large IPOs often reserve a portion of the issue for eligible employees, allowing them to participate in the public offering. Such reservations may also come with a discount on the issue price, subject to the terms and conditions specified in the offer document.\n\nJio Platforms is best known for its telecom arm, Reliance Jio Infocomm, which disrupted India\u2019s telecom industry after its launch in 2016 by offering affordable voice and data services.\n\nJio played a key role in accelerating digital adoption across the country through its low-cost data plans and free voice-calling services, attracting millions of subscribers within a short period.\n\nThe mega IPO will open for subscription on Wednesday, October 21, and close on Friday, October 23, 2026. The anchor investor bidding is scheduled for Monday, October 19. The company has fixed the IPO price band at \u20b9 1,065\u2013 \u20b9 1,119 per equity share.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:01 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "OpenAI\u2019s Sachin Katti to leave infrastructure role, stay on as advisor", "full_content": "OpenAI's infrastructure lead, Sachin Katti, announced on Wednesday that he is departing his role after roughly a year at the artificial intelligence company.\n\nKatti said in a post on LinkedIn that he \"decided to move on to build something new,\" and he'll continue to support OpenAI as an advisor after his last day on Nov. 15. Uday Ruddarraju, who has been serving as OpenAI's CTO of compute, will replace Katti and lead the company's overall compute organization, according to a spokesperson.\n\n\"Building AI infrastructure at this scale has given me an incredible view into every dimension of the compute world, from silicon and systems to datacenters, energy, supply chains, financing, and the economics of AI,\" Katti wrote. \"I'm enormously proud of what our teams accomplished together and grateful to the partners who helped make it possible.\"\n\nOpenAI's compute organization is crucial to its overall strategy; it's tasked with developing the company's infrastructure roadmap and ensuring that it can train and serve its models. OpenAI is targeting roughly $600 billion in total compute spend by 2030, and it's involved with massive, multi-billion-dollar data center projects in states like Ohio , Texas and Georgia .\n\nThe latest leadership shakeup lands during a tense moment for AI infrastructure in the U.S., where backlash against data centers has mounted over concerns about noise, electricity rates and water consumption. The issue has become a flashpoint in the upcoming midterm elections, where both Republican and Democratic candidates have campaigned against the facilities.\n\n\"I'm proud of what we've built and have total confidence in Uday and the team to carry it forward,\" Katti said in a statement. \"I'm a builder at heart, and I'm looking forward to building something new.\"\n\nRuddarraju joined OpenAI in July of last year, according to his LinkedIn.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 10:55 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "The steel stock that has the shorts and options traders on edge", "full_content": "Fool me once, shame on you. Fool me twice, shame on me. That seems to be the refrain for Cleveland-Cliffs investors as the steel giant prepares to report earnings.\n\nCleveland-Cliffs steps into the earnings spotlight on Oct.19, and options traders are bracing for impact. After a massive, nearly 16% one-day price jump following its July quarterly report \u2014 nearly double its long-term historical average move of slightly over 8% \u2014 short-term implied volatility (IV) has been aggressively bid up as traders fear a repeat. And who could blame them? Short interest is running close to 14%, and the CEO is famous for fighting the naysayers, noting that he likes boil them \"like frogs\" and that they are \"messing with the wrong guy.\"\n\nWith rhetoric like that, it's little wonder options traders are bracing for big moves.\n\nFor strategic premium sellers, this inflated near-term fear creates a compelling opportunity to deploy what I call a \"strangle-swap.\" You'll sometimes see traders or strategists refer to this as a \"double-diagonal\" spread. This structure allows traders to capitalize on the anticipated post-earnings decline in implied volatility (aka \"vol crush\") without taking on the unlimited risk of a naked short strangle.\n\nTo execute this strangle-swap, you sell a shorter-dated strangle and buy a longer-dated strangle to define your risk.\n\nThe key to this trade is the differential in IV decay between the shorter-dated November expirations being sold and the longer-dated January options being purchased. Traders are heavily bidding November options on concerns that the sharp move from the last quarterly earnings release may repeat.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:52 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms IPO confirms RIL reservation quota \u2014 How will it impact Reliance share price? Experts' views", "full_content": "Jio Platforms IPO | Reliance Digital | Reliance share | RIL share: The digital arm of Reliance Industries Ltd (RIL) today submitted the much-awaited Jio Platforms IPO RHP (Red Herring Prospectus) with the Registrar of Companies, Gujarat, at Ahmedabad, for the IPO on Wednesday. The Reliance Group subsidiary company also declared the Jio Platforms IPO price band at \u20b9 1,065 to \u20b9 1,119 per equity share. So, Reliance's digital arm is expected to raise between \u20b9 28,755 crore and \u20b9 30,213 crore. The public issue will open on 21 October 2026, and it is proposed for listing on the BSE and the NSE.\n\nReliance's digital arm also declared a \u20b9 54-per-share rebate for Eligible Employees bidding under the Employee Reservation Portion. Jio Platforms also confirmed the shareholders' quota in the final prospectus for the upcoming IPO, reserving up to \u20b9 2,500 crore worth of Jio Platforms shares, leaving open the question of whether Reliance shares would react to this development on Thursday.\n\nSpeaking on the impact of Jio Platforms IPO RHP filing and its impact on the Reliance shares in the wake of a large \u20b9 2,500 crore shareholders' quota, Arun Kejriwal, Founder of Kejriwal Research and Investment Services, said, \u201cI am not expecting any impact on RIL shares on Thursday due to the Jio Platforms IPO RHP filing. In fact, it has become clear after the Jio Platforms' RHP filing that investors buying Reliance shares from tomorrow onwards won't be eligible for applying to the Jio Platforms IPO under the shareholders' quota because the RHP filing date is considered the cutoff date for finalising the list of eligible shareholders of the company.\u201d\n\nPointing towards the upside trend in RIL share price today, Mahesh M Ojha, VP \u2014 Research and Business Development, said, \u201cThose who bought Reliance shares on Wednesday may also not be able to avail the benefit of applying under the shareholders' quota. This is because of the 'T+1' rule applicable to buying and selling of shares.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 10:52 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How high inflation became a 'fact of life' in the U.S.", "full_content": "U.S. consumers are in the midst of one of the longest stretches of elevated inflation of the past century. Some are beginning to act like it's a new normal, raising alarm bells for members of the Federal Reserve .\n\nWednesday's consumer price index release showed a 3.7% increase year over year in September. CPI has now registered around 65 months \u2014 that's more than five years \u2014 of consecutive annual readings above 2%, a widely accepted target for inflation in the U.S.\n\nThis yearslong spell of high inflation has cast a dark cloud over everyday Americans' view of the economy, and could shape everything from how they budget to how they vote in next month's midterm elections. At the Fed, leaders are left questioning whether consumers' inflationary expectations are becoming too entrenched to rein in.\n\n\"They're starting to accept high inflation as just a fact of life,\" Cleveland Fed President Beth Hammack wrote in a social media post last week. \"That's concerning.\"\n\nThe current streak of stubborn inflation ranks among the most persistent in modern U.S. history.\n\nThe uninterrupted string of above-2% monthly CPI readings is the longest of the 21st century, according to a CNBC analysis of data from the Bureau of Labor Statistics. The U.S. has seen longer periods on only two other occasions going back to the late 1940s.\n\nSince inflation started running above 2% in early 2021, the average CPI reading has sat around 4.5%. The last time a streak had a mean reading that high was during a period ending in the 1980s .\n\nConsumers are expecting inflation to accelerate. The one-year inflation outlook in September rose three-tenths of a percentage point to 3.9%, its highest reading in more than three years, according to the New York Fed's Survey of Consumer Expectations released last week.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:50 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anduril allows staff to sell shares at $90 billion valuation - report", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 10:50 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "BlackRock, Goldman Sachs, Nomura among key investors as Zetwerk mops up Rs 2,251 crore in anchor bidding; IPO opens on Oct 15", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a BlackRock, Goldman Sachs, Nomura among key investors as Zetwerk mops up Rs 2,251 crore in anchor bidding; IPO opens on Oct 15 SBI Life Insurance Company Share Price Life Insurance Corporation of India Share Price HDFC Life Insurance Company Share Price ICICI Life Insurance Share Price Max Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper BlackRock, Goldman Sachs, Nomura among key investors as Zetwerk mops up Rs 2,251 crore in anchor bidding; IPO opens on Oct 15 SECTIONS BlackRock, Goldman Sachs, Nomura among key investors as Zetwerk mops up Rs 2,251 crore in anchor bidding; IPO opens on Oct 15 By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 10:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Zetwerk Manufacturing Businesses raised Rs 2,251 crore from 99 anchor investors, including BlackRock, Goldman Sachs and Nomura, ahead of its IPO opening on October 15. The Rs 5,012 crore issue, priced at Rs 143\u2013151 per share, comprises a fresh issue and an offer for sale. Subscription closes on October 19.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips ,
