tor Act , is designed to protect the bloc's industries from unfair international competition by prioritizing European-made goods.\n\nAn EU official told the Financial Times in September that London would need to raise tariffs on Chinese EVs and align more closely with EU trade policy to avoid \"Made in Europe\" barriers.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 11:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Micron Stock Drops. Why Samsung\u2019s Record Profit Didn\u2019t Give It a Lift. - Barron's", "full_content": "Micron Stock Drops. Why Samsung\u2019s Record Profit Didn\u2019t Give It a Lift. Barron's Samsung, SK Hynix record earnings fuel South Korea spending on AI, youth Nikkei Asia Samsung and TSMC fail to excite investors used to torrid AI growth The Japan Times The Memory Trade Cools After Samsung\u2019s Preliminary Results Disappoint Yahoo Finance Memory crisis puts Samsung on track for the biggest quarterly operating profit in tech history TechSpot", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 11:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Media attorneys ask court for help in preventing White House ban until legal case is resolved", "full_content": "An attorney for three news organizations told a federal judge Thursday that the Trump administration must be prevented from barring their reporters from the White House, saying the ban is a classic example of \"viewpoint discrimination\" that is punishing people for what they say \u2014 and violating the media outlets' First Amendment rights.\n\nThe hearing was the latest development in the escalating drama between the Trump administration and the news media, which has raged in various arenas during his second term as president. At its core, though, are multiple free-speech questions. The dispute has produced sanctions and restrictions on White House and Pentagon reporter and led to several lawsuits that are progressing through the federal court system.\n\nU.S. District Judge Timothy Kelly said he intended to rule by Tuesday, possibly sooner, on whether to extend his own order maintaining White House access for journalists from MS NOW, CNN and Politico. Granting the news outlets' request for a preliminary injunction would preserve the status quo \u2014 access \u2014 until the litigation is resolved.\n\nKelly, nominated to the bench by Republican President Donald Trump, didn't say how he intends to rule but described key government arguments as an \"uphill climb\" and a \"tough lift\" at this stage of the litigation. The judge also challenged a government attorney to specify the national security concerns that the administration claims are at stake.\n\n\"We've always been clear that it's not just national security,\" Justice Department attorney Michael Velchik said, arguing that false reporting can impact policy and adversely affect national security.\n\n\"He doesn't mind negative press stories if he deserves them. He has problems with trafficking verifiable falsehoods,\" Velchik said of Trump.\n\nTheodore J.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Little relief expected for gas prices ahead of Election Day, according to prediction markets", "full_content": "Affordability is seen as one of voters' top issues heading into the 2026 midterm elections . And gas prices \u2014 one of the items where consumers are getting squeezed the most \u2014 are expected to remain elevated through Election Day.\n\nSpeculators on prediction market platform Kalshi give an 87% chance that the AAA national average for gas prices will remain above $4 per gallon on Nov. 3.\n\nBut while they expect prices to stay above that mark, they do think there's a chance they'll come down from the levels where they currently are, giving just a 42% chance the average is above $4.25 on Election Day. As of Thursday, the national average is currently at $4.36 per gallon.\n\nGas prices peaked at an average of $4.56 per gallon in late May, following an initial spike in March after the start of the Iran war and the latter country's closure of the Strait of Hormuz , a critical passageway for oil exports from the Middle East. They then fell to as low as $3.79 per gallon in early July before rising again throughout the rest of the summer.\n\nDiesel prices hit new peaks in September, though, reaching almost $6.53 per gallon on Sept. 22. Prices have since fallen to $6.28, though traders on Kalshi place 68% odds that figure remains above $6 per gallon on Nov. 3.\n\nRising diesel prices have a particular impact in states with larger agriculture industries , such as Iowa and Kansas, and states such as Alaska that rely on diesel fuel for electricity. All three are home to competitive races for the U.S. Senate this November.\n\nAs gas prices have remained elevated, Democrats' chances for flipping the Senate have improved . Traders on Kalshi give the party 63% odds of taking the upper chamber from Republican control.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Finance", "pub_date_str": "08 Oct 2026, 11:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Oil Rises, Nasdaq Slips on Fresh Tanker Attack - WSJ", "full_content": "Stock Market Today: Oil Rises, Nasdaq Slips on Fresh Tanker Attack WSJ S&P 500 falls, weighed down by oil prices; Nasdaq craters as AI stocks falter: Live updates CNBC US Stock Futures Slip on Mounting Energy Shock, AI Bubble Fears Bloomberg.com Wall St slips as climbing oil, yields amplify inflation fears Reuters Stock Market Today: Dow, S&P 500 and Nasdaq fall as tech stocks struggle; oil prices ease after Trump signals U.S. won't attack Iran before midterm elections; Treasury yields retreat MarketWatch", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 11:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Working At TCS, Infosys, Wipro On H-1B And Waiting For A Green Card? Here's What The PERM Ban Means For You", "full_content": "The US has frozen PERM processing for several tech firms amid an H-1B abuse probe, raising concerns for Indian workers relying on employer sponsorship for green cards.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "India, 14 others ink joint ministerial statement to curb structural excess capacity", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, 14 others ink joint ministerial statement to curb structural excess capacity The Economic Times daily newspaper is available online now. Read Today's Paper India, 14 others ink joint ministerial statement to curb structural excess capacity SECTIONS India, 14 others ink joint ministerial statement to curb structural excess capacity By Kirtika Suneja , ET Bureau Last Updated: Oct 08, 2026, 11:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India has joined the US, EU, UK and 12 other economies in a joint statement to tackle structural excess capacity and production, despite facing a US trade probe over alleged overcapacity. The signatories will examine key sectors including EVs, batteries, chemicals, semiconductors and solar panels through dedicated sectoral platforms.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 11:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Personal loans jump 32% in Q1 FY27: How home, auto and consumer loans compare \u2014 and what borrowers should watch", "full_content": "If you are considering taking a personal loan for a large purchase, home renovation, wedding, or another expense, the latest credit-market numbers show that unsecured borrowing is growing considerably faster than home loans.\n\nAn Experian Industry Insights report reveals that personal-loan sourcing \u2014 the value of new loans originated or sanctioned during the quarter \u2014 rose 32% year-on-year to \u20b9 3 lakh crore during April-June 2026 (Q1 FY27).\n\nPersonal-loan assets under management (AUM), which represent the outstanding loan portfolio, stood at \u20b9 16.2 lakh crore as of June 2026, up 14% YoY.\n\nThat compares with home loan AUM of \u20b9 43.6 lakh crore, which grew 13% YoY. So while personal loans are growing faster, the home-loan portfolio remains substantially larger.\n\nAccording to Experian findings, the broader unsecured-credit segment grew 26% YoY in Q1 FY27, making it a significant driver of credit growth. Personal loans and consumer loans contributed significantly, while credit cards showed some resurgence.\n\nPersonal loans alone saw 32% growth in new sourcing, compared with the more measured expansion in home loans. For consumers, this suggests that smaller and relatively quicker-to-access forms of borrowing are becoming an increasingly important part of the credit market.\n\nThe difference becomes clearer when looking at portfolio size and ticket values.\n\nThe home-loan average ticket size increased from \u20b9 32.2 lakh in Q1 FY26 to \u20b9 34.8 lakh in Q1 FY27. Banks also increased their presence in the above- \u20b9 80 lakh premium housing segment.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Trump says U.S. will not attack Iran before midterm election", "full_content": "President Donald Trump said Thursday that the U.S. will not attack Iran before the Nov. 3 midterm election , explicitly tying the timing of potential further military action to the domestic political calendar.\n\n\"We will not be attacking Iran at any time prior to the Midterm Elections,\" Trump said in a post on Truth Social, adding that the U.S. was having \"productive discussions\" with Tehran.\n\nTrump's declaration came after he told reporters late Wednesday that his administration was considering renewed strikes against Tehran before the election, helping send oil prices higher amid fears of further escalation. Brent crude rose more than 4% Thursday to above $104 a barrel.\n\nTrump said the U.S. naval blockade of Iran would remain in place and reiterated that Tehran would not be allowed to obtain a nuclear weapon.\n\nIt's a shift from his posture less than a day ago. At a campaign rally Wednesday night, Trump said a deal with Iran was \"not really something that I wanted to do.\"\n\nThe more diplomatic tone comes as voters are already casting midterm ballots and public support for the war has fallen. Just 31% of Americans supported U.S. military action against Iran in an August Reuters/Ipsos poll , down from 37% in March, while 83% expected the conflict to be prolonged.\n\nThe war has helped push fuel costs higher, compounding Republicans' vulnerability on affordability as they fight to retain control of Congress. Poll after poll has ranked the cost of living among voters' top concerns heading into the Nov. 3 election.\n\nGas prices have climbed roughly 40% from a year ago, according to AAA data. The national average stood at $4.36 a gallon Thursday, up from $2.98 just before war began in late February.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 11:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Honasa Consumer shares: 54% up in 6 months; target price \u20b9550 as Mamaearth stock gets BUY rating from HDFC Securities", "full_content": "Domestic brokerage firm HDFC Securities, in its latest report, has maintained its \u2018Buy\u2019 rating on Honasa Consumer , the parent company of Mamaearth, with a target price of \u20b9 550.\n\nThe brokerage highlighted the company\u2019s efforts to sustain strong growth across both Mamaearth and The Derma Co., with annual recurring revenue (ARR) for both brands now above \u20b9 10 billion, despite operating in a competitive landscape.\n\nAlongside these two established brands, Honasa has built a portfolio of emerging brands and expanded into newer personal care categories. The brokerage pointed out that Mamaearth and The Derma Co. are now scaling faster across offline channels, where the company has adopted a differentiated approach by leveraging chemists alongside cosmetics retailers.\n\nFor offline direct-reach retail, management has set a target of reaching 300,000 outlets by FY31, up from around 120,000 currently. It also said that the company has also materially strengthened its presence in modern trade over the past few years and now has 95% penetration.\n\nIn addition, the younger brands Aqualogica, Dr. Sheth\u2019s, BBlunt, and Reginald are well placed in the \u20b9 1-2 billion revenue band, which the brokerage expects to scale further across channels by leveraging the playbook established by Mamaearth and The Derma Co.\n\nHDFC Securities believes Reginald has strong potential to accelerate growth, supported by its focused positioning in male skincare and relatively limited market presence. Management also highlighted encouraging traction for Staze, which is approaching \u20b9 1 billion in revenue.\n\nWhile traditional FMCG players are consolidating around fewer, larger bets, Honasa continues to leverage emerging trends with a clear focus on efficacy.\n\nOn Tuesday, shares of the company advanced 12% following its second-quarter business update, taking the stock\u2019s six-month return to 54% and its year-to-date gains to 63%.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 11:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TCS Q2 Concall Highlights: Revenue Per Employee Slips As AI Revenue Crosses $3.1 Billion", "full_content": "TCS Q2 Results Highlights: Track the earnings announcement, dividend decision, management commentary, key financial metrics and TCS share price reaction here.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Inflation on many everyday items was entirely due to tariffs, NY Fed says", "full_content": "The cost of many everyday items would have declined last year and early this year without President Donald Trump 's tariffs, according to the New York Federal Reserve .\n\nThe cost of 67 categories of goods was 2.9 percentage points higher as of February thanks to tariffs, according to a paper from a team of researchers at the central bank's New York arm.\n\nWithout the levies, the team found that prices for the products they studied would have pulled back by almost 1%.\n\nThe New York Fed's report offers the clearest evidence yet of the impact of Trump's tariffs \u2014 a core policy of his most recent campaign and second term in the White House \u2014 on consumers' wallets. Economists had widely expected his levies to push up prices, though the precise effects had been hard to estimate due to the changing nature of the policy and the lack of transparency on how companies set their prices.\n\n\"The Trump administration has consistently maintained that the cost of tariffs will ultimately be borne by foreign exporters who rely on access to the American economy,\" White House spokeswoman Taylor Rogers said in a statement to CNBC.\n\nThe researchers didn't say which 67 types of goods they evaluated.\n\nFor each percentage point increase in the average tariff, the team said that consumer goods prices were higher by roughly a quarter of a percent a year later.\n\nAnnual price growth in the dozens of goods they tracked peaked at the start of 2026, according to the report. But consumers are still expected to pay elevated prices into 2027 as a result of the policy, it said.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 11:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Treasury yields are lower after reaching multiyear highs, traders weigh latest bond auction", "full_content": "The yield on the 10-year Treasury was relatively unchanged on Thursday as traders digested comments from a top Federal Reserve official along with another long-dated bond auction.\n\nThe benchmark 10-year Treasury yield was last down 4 basis points at 5.237% after reaching its highest level since 2002 this week. The 30-year Treasury bond yield fell nearly 5 basis points to 5.614% after trading around a 24-year high recently.\n\nOne basis point is equal to 0.01%, and yields and prices move in opposite directions.\n\nFed Governor Christopher Waller said on Thursday that more hikes are needed to bring inflation down after around 5-and-a-half years above the central bank's 2% target, but suggested rates did not need to rise immediately.\n\n\"The hikes do not need to come at consecutive meetings,\" Waller told a Central Bank of Turkey forum in Istanbul. \"But they should be in place in an acceptable period of time.\"\n\nHis comments initially sent yields higher on the day. However, rates gave back those advances after President Donald Trump said the U.S. won't attack Iran until after the November midterm election . Yields also pulled back after a solid 30-year Treasury bond auction.\n\nThe department sold $22 billion in 30-year paper, with indirect bidders \u2014 which include central banks \u2014 scooping up 72.3% of the sale. That's above a 10-auction average of 68%. Direct bidders, including institutional investors, took 20.9% of the auction, just below an average of 22%. The yield at auction ease 5.618%.\n\nThat marks the final auction of the week. The department sold $58 billion in 3-year notes on Tuesday and another $39 billion in 10-year notes.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 10:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CNBC's Financial Advisor 100: Best financial advisors, top firms for 2026 ranked", "full_content": "Many consumers face tough investing decisions amid rising inflation , the artificial intelligence boom and geopolitical uncertainty , among other factors that affect the stock and bond markets.\n\nBut the best advisors do more than manage your portfolio . They can help craft a roadmap to meet competing goals such as saving for retirement , reducing your taxes , protecting your family , building a legacy and more.\n\nCNBC's Financial Advisor 100 list ranks the country's best financial advisors and top financial advisory firms. Investors can use this list as a starting point \u2014 along with referrals \u2014 to find an expert who is well-suited for their family's needs.\n\nTo make a list of prospective advisors, always verify credentials and check for complaints via the Financial Industry Regulatory Authority's BrokerCheck or the U.S. Securities and Exchange Commission 's Investment Adviser Public Disclosure . Then you can interview your short list of candidates.\n\nCNBC's Financial Advisor 100 list is determined through a blend of data analysis and editorial review. Firms do not apply or pay to be considered, and inclusion and ranking are based solely on the list's methodology. The list takes months to compile, with multiple steps and checks designed to ensure rigor and consistency.\n\nTo prepare the 2026 list, CNBC worked with AccuPoint Solutions, a wealth management data and research firm specializing in advisor intelligence and industry analytics. The process started with 41,578 registered investment advisor firms, or RIAs, narrowed to 1,015 that met CNBC's requirements. These firms also passed a due diligence check, including any regulatory disclosures.\n\nTo get more details, CNBC surveyed the finalists about their practices and fact-checked responses via publicly available resources. AccuPoint used CNBC's weighted criteria to rank the firms. Read more about the methodology below.\n\nFor 2026, CNBC's top advisors collectively manage $329.7 billion.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 10:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Treasury sanctions 17 tankers linked to Iran's 'shadow fleet' in economic pressure campaign", "full_content": "The additional sanctions are part of the Trump administration's military and economic campaign against Iran.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 10:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "TDS statements can be filed directly through TRACES portal: What changed from tax year 2026\u201327? Expert explains", "full_content": "TDS and TCS compliance has moved to an online filing setup from Tax Year 2026-27 onwards, changing how deductors submit quarterly statements. The process brings fresh forms, a separate compliance environment, and updated filing steps. Here\u2019s what deductors need to know.", "source": "LiveMin ow to provide guaranteed retirement income while paying no commissions", "full_content": "Unlike the stock market, whose future returns are anything but assured, a TIPS ladder\u2019s payout is guaranteed.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 10:27 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Google Launches Workplace AI Agent That Acts Like Colleague", "full_content": "The launch is aimed at winning business customers that Google needs to justify its hundreds of billions of dollars in AI infrastructure spending.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 10:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trade Setup For Oct 9: Nifty's Support Slips To 21,950; Will Bearish Trend Continue?", "full_content": "The index has remained under pressure as selling continues to dominate the broader market, with investors tracking global cues, crude oil prices, foreign fund flows and domestic monetary policy developments.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 10:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "OpenAI annualised revenues $20bn less than previously signalled - Financial Times", "full_content": "OpenAI annualised revenues $20bn less than previously signalled Financial Times Tech stocks drop after report that OpenAI\u2019s revenue is lower than expected CNN Nvidia, Oracle, CoreWeave and other AI stocks sink on OpenAI revenue report CNBC Oil Rise Spurs Fresh Selling in Stocks and Bonds: Markets Wrap Bloomberg.com OpenAI Revenue $20B Below Previous Reports, ORCL, NVDA Tumble Yahoo Finance", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 10:12 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Effective GST Rate Falls To 10.84% As Tax Base Widens, Revenue Grows", "full_content": "The decline comes even as the GST base continues to expand. Taxable supply has risen 25.8%, while GST revenue grew 11% in FY2026-27.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 10:10 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buying your first home: How to save when rates are high and hacks for getting the best deal", "full_content": "Here's everything you need to know about buying your first home, including mortgage calculators, interest rate estimators and the best mortgage lenders.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 10:10 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US mortgage rates rise for seventh straight week to hit highest since 2023", "full_content": "Benchmark borrowing costs continue to climb against backdrop of surging Treasury yields, elevated energy prices and expected tightening by Fed", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 10:08 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nifty sinks to an 18-month low as rate fears bite", "full_content": "The slide, into its ninth straight week now, has deepened concerns over further market losses, with surging oil prices threatening to keep inflation elevated, trigger more rate hikes and prolong the pain in the market.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 10:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'Faster decisions, lower compliance costs': PM Modi welcomes new round of GST reforms", "full_content": "Prime Minister Narendra Modi on Thursday welcomed the new round of GST reforms approved by the Goods and Services Tax (GST) Council, saying the measures will enable faster decisions, lower compliance costs, automated refunds and a trust-based administration.", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 10:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}], "updated_at": "09 Oct 2026, 12:50 AM IST", "total_stories": 361};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
