media and privacy.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 07:06 PM IST", "pub_date_relative": "just now"}, {"title": "Stocks slide again as Treasury yields push higher, Oracle leads Nasdaq names lower: Live updates", "full_content": "Stocks fell on Thursday as Treasury yields kept marching higher, with traders anticipating further rate hikes from the Federal Reserve. A pullback in Oracle weighed on tech.\n\nThe Nasdaq Composite sank 0.8%, while the Dow Jones Industrial Average fell 182 points, or 0.4%. The S&P 500 was down 0.5%.\n\nOracle shares sank more than 5% after Bloomberg News reported , citing sources, that the company was citing force majeure in order to protect itself from a data center project being built in New Mexico if it is delayed.\n\nThe 30-year Treasury bond yield touched 5.446%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.15%, near levels not reached since July 2007. The 2-year note yield was flat on the day, but scaled to a 2023 high earlier in the week.\n\nThose moves came as oil prices rose sharply. International Brent crude futures rose 1% to around $105 a barrel, while West Texas Intermediate crude gained 1% to around $93.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a greater than 70% likelihood that the policy-setting Federal Open Market Committee lifts its key rate once more in October, according to the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nIn a note Thursday, strategists at UBS Global Wealth Management said their base case was for energy disruption to remain relatively limited and an inflation shock insufficiently broad or persistent to derail economic growth.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 07:05 PM IST", "pub_date_relative": "1m ago"}, {"title": "OpenAI says agent hacked Australian government website without being told to do so", "full_content": "An artificial intelligence agent developed by OpenAI gained unauthorized access to an Australian government website, Prime Minister Anthony Albanese said , raising fresh questions about the risks posed by increasingly autonomous AI systems.\n\nThe incident comes as AI companies increasingly develop agents that can perform multistep tasks and interact with external websites and software with less human involvement, raising questions about how developers can prevent unexpected behavior as the technology becomes more autonomous.\n\nThe breach occurred on June 18 and involved an OpenAI agent accessing the Medicare statistics reporting service portal, which is administered by Services Australia, Albanese said.\n\nOpenAI's agent accessed both public and non-public files, according to the prime minister. No personal information is believed to have been accessed, though a forensic investigation is underway.\n\nThe portal contains non-sensitive Medicare information, including statistics on spending.\n\nAlbanese said he had spoken with OpenAI CEO Sam Altman to express Australia's \"extreme concern\" over the incident, and criticized the length of time it took the company to notify the government.\n\nThe AI company informed Australian authorities on Sept. 10, nearly three months after the June incident.\n\nOpenAI said the activity occurred during an internal evaluation as its models attempted to look up answers and statistics about Australia.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 07:02 PM IST", "pub_date_relative": "4m ago"}, {"title": "Yields are soaring to levels not seen in decades. What could stop the rout in bonds?", "full_content": "Bonds are the current obsession of Wall Street, and rightly so.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 07:02 PM IST", "pub_date_relative": "4m ago"}, {"title": "Mark Zuckerberg debuts $1,299 Meta VR Glasses and Muse Charm pendant as part of AI agent push", "full_content": "Meta CEO Mark Zuckerberg is continuing his metaverse while simultaneously pushing forward on AI agents.\n\nAt Meta Connect , the Facebook co-founder revealed on Wednesday the Meta VR Glasses, a smaller and slimmer device compared to the company's older Quest-branded family of VR headsets, and a handheld device called the Muse Charm that works with the company's recently released Muse AI personal agent . He revealed the products while speaking on stage at the annual Connect conference for developers.\n\nZuckerberg shared few details about what Muse Charm can do, only to say that people will be able to speak to the gadget to interact with their Meta AI agents \"without having to unlock a phone or open an app.\" He didn't say how much it would cost, but said that Meta needs to \"finalize laying out the components\" and is \"planning to have this ready to ship in time for the holidays in December.\"\n\n\"We've packed a lot of technology with this little guy,\" Zuckerberg said. \"So, if you're not wearing glasses, this is going to be by far the fastest way to talk to your Muse and to show it what's going on around you.\"\n\nThe Meta VR Glasses are slimmer and lighter than the company's older Quest-branded VR headsets, but they are also more expensive, costing $1,299 when they go on sale in spring 2027. They represent Meta's first VR device since 2024, when the company debuted the $299 Quest 3S.\n\nThe Meta VR Glasses are powered by an external puck that houses a Qualcomm processor and battery, allowing it to function as a mini-computer that also helps reduce the glasses' overall weight and size.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 07:01 PM IST", "pub_date_relative": "5m ago"}, {"title": "NATO commander says US to provide limited support as Europe expands role", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago"}, {"title": "Oil extends gains amid U.S.-Iran diplomacy doubts", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 07:00 PM IST", "pub_date_relative": "6m ago"}, {"title": "Egypt\u2019s central bank holds interest rates steady", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:58 PM IST", "pub_date_relative": "8m ago"}, {"title": "Tractor Supply expands support to over 1,000 U.S. fairs", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:58 PM IST", "pub_date_relative": "8m ago"}, {"title": "Oracle shares drop on report it sent 'force majeure' notice about data center project", "full_content": "Oracle shares fell 4% on Thursday following a report that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\nBloomberg reported the news, citing sources familiar with the matter.\n\n\"Project Jupiter remains on our planned schedule,\" an Oracle said in a statement to CNBC. \"We are fully committed to New Mexico and confident in our path forward.\"\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it doesn't come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital. The company also saw its shares fall on Thursday.\n\n\"This notice does not change the financial commitments to this multi-year project,\" Blue Owl Capital said in a statement to CNBC.\n\nThe New Mexico data center project, which is part of the broader Stargate artificial intelligence infrastructure buildout with President Donald Trump, has been riddled with setbacks and regulatory hurdles.\n\nThat includes local opposition to data centers ahead of the upcoming midterm elections and concerns from environmental groups.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:58 PM IST", "pub_date_relative": "8m ago"}, {"title": "Stitch Fix stock price target lowered to $4 by Bernstein on consumer headwinds", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:57 PM IST", "pub_date_relative": "9m ago"}, {"title": "Wall St set for lower open as oil gains on Mideast uncertainty, eyes on Trump-Xi talks", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:56 PM IST", "pub_date_relative": "10m ago"}, {"title": "Earnings call transcript: Kri-Kri lifts H1 2026 sales, trims profit outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:56 PM IST", "pub_date_relative": "10m ago"}, {"title": "US current account deficit widens sharply in second quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:55 PM IST", "pub_date_relative": "10m ago"}, {"title": "Satellos stock jumps after FDA clears FSHD trial for forazapadin", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:54 PM IST", "pub_date_relative": "11m ago"}, {"title": "Our top 10 things to watch in the stock market Thursday", "full_content": "The Trump-Xi summit kicks off today, and Meta delivers a big boost to its hardware lineup.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago"}, {"title": "Sebi board allows FPI access in non-farm goods, approves revamp of PMS, settlement rules", "full_content": "The Securities and Exchange Board of India (Sebi) board has approved a proposal to allow foreign portfolio investors (FPI) into physically-settled non-agri commodities, along with a slew of other measures, at its board meeting on Thursday.\n\nForeign investors would now be allowed to trade in non-agricultural index derivatives because such contracts are cash settled, regardless of the nature of their underlying commodities. For physically settled non-agricultural commodities, FPIs would have to square off positions before the start of the tender or staggered delivery period, three days before expiry.\n\nFPIs currently have access to non-agricultural commodity derivatives that are cash settled, while bullion and base-metal contracts are physically deliverable.\n\nIf they do not do so, open positions could be automatically transferred to a designated trading member or trading-cum-clearing member\u2019s proprietary account. The move is aimed at improving foreign investor participation in India\u2019s commodity markets, which would help boost volumes in the segment.\n\nThe regulatory board has also approved an overhaul of portfolio management services (PMS) regulations.\n\nThe Sebi board has allowed portfolio managers' route for investing in mutual fund units (PRIM) to offer professionally managed portfolios of mutual fund investments. PMS firms can now introduce mutual-fund-only PMS schemes, which would allow portfolio managers to offer professionally managed portfolios of mutual fund investments.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:53 PM IST", "pub_date_relative": "13m ago"}, {"title": "Judge lifts Trump ban of media outlets from White House \u2014 access still denied for some", "full_content": "A federal judge on Thursday ordered that White House access to journalists from CNN, MS NOW and Politico be immediately restored for up to two weeks, saying U.S. President Donald Trump 's media ban was likely unconstitutional.\n\nThe ruling represents a victory for the three media outlets, which had argued the ban violated their First Amendment rights, and comes as Trump hosts Chinese President Xi Jinping for a high-stakes meeting .\n\nDespite the ruling, some journalists from all three outlets were barred from entering the White House on Thursday morning. MS NOW reporter Laura Barr\u00f3n-L\u00f3pez and a MS NOW producer had their press passes confiscated when they tried to enter, but a second MS NOW producer was allowed to enter. Politico said that at least one of their reporters was also blocked, and CNN reported that some of its staff was denied access, but at least one was allowed in.\n\nIt was not clear if Secret Service officers were denying access to some journalists from the three outlets because of a lag in electronically reactivating their press passes and not as a result of a refusal to comply with the new judicial ruling.\n\nCNBC has requested comment from the White House on the ruling and about the continued denial of access for some reporters from the three outlets.\n\nIn his ruling, District Judge Tim Kelly said the three outlets should have their access immediately restored from the ban that the president had announced on Sept. 18 , rejecting a request by the Justice Department to delay it for at least two days. The judge was nominated by Trump to the federal bench in 2017.\n\nKelly said the Trump administration must return, reinstate and restore the White House \"hard pass\" press credentials held by employees of the three outlets that had been revoked.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:52 PM IST", "pub_date_relative": "14m ago"}, {"title": "Why is Oracle stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago"}, {"title": "NSE debut boosts BSE's cash market turnover", "full_content": "National Stock Exchange Ltd (NSE), which made its much-awaited stock-market debut on Thursday, contributed well over two-fifths of rival BSE's cash turnover, indicating a Day 1 trading frenzy in the scrip on Asia's oldest equity bourse.\n\nThe NSE stock notched up a turnover of \u20b9 9,483.28 crore, which was 46% of BSE's total equity cash turnover of \u20b9 20,672.36 crore, showed exchange data. It was the top traded stock by turnover.\n\nThe BSE 's overall turnover on Thursday was more than twice its average daily cash turnover of \u20b9 10,117 crore so far this fiscal year, thanks to the NSE listing.\n\nThis will help BSE marginally increase its cash market turnover share from about 7% currently, according to market analysts. Indian regulations don't allow a stock exchange to be listed on its own platform.\n\n\u201cFor the first few days, there will be a pop in BSE's overall turnover as this has been the most-awaited public listing, but after that, it will be back to normal. I expect only a marginal increase in BSE cash market share,\u201d said V.K. Vijayakumar, chief investment strategist at Geojit Financial Services.\n\nAmit Chandra, vice president at HDFC Securities , agreed. \u201cThe needle will move up by 1-2% in terms of equity cash market share after the listing euphoria dies down.\u201d\n\nFor instance, exchange data showed that BSE had a 7% market share in equity cash in 2025-26. This will increase to around 8.29% if NSE chips in about 20% to BSE's average daily turnover.\n\nThe stock notched a delivery volume of 48.78% on BSE\u2014that is, 25.1 million shares actually changed hands out of 51.5 million shares traded.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago"}], "cfa": [{"title": "Meta's standoff with Amazon over Muse could be a sign of things to come", "full_content": "Meta's rollout of its Muse AI personal agent has been a big hit with consumers and investors. The stock has jumped more than 20% in the two weeks since its introduction, and the app has shot up to the top of Apple's App Store, eclipsing ChatGPT.\n\nCEO Mark Zuckerberg took to the stage late Wednesday afternoon at the company's annual Connect conference for developers to relish in the excitement. He described the Muse AI agent as the \"centerpiece\" of his company's efforts to make the technology more easily available to the broader public and not just coders.\n\n\"In the coming years, I expect that Muse is going to grow into the personal superintelligence that billions of people around the world are going to use to accomplish their goals and improve their lives,\" Zuckerberg said.\n\nBut there are reasons for skepticism regarding Meta's latest effort to find a real and lasting niche in the consumer artificial intelligence market.\n\nMeta is touting Muse's ability to book appointments and travel, fill out electronic forms for users, and monitor home security cameras. It can also shop on a user's behalf, searching for a specific product across various sites and marketplaces and linking to Shopify or Stripe for payment.\n\nAmazon has said that's a no-go, blocking Muse from purchasing products on the e-commerce app, claiming that it would violate the company's terms of service. Whether it's other retailers taking similar steps out of concern that they're at risk of losing the direct relationship with customers, or it's consumers that don't trust the Facebook parent with sensitive data, experts say the social media giant has a long way to go to turn its early momentum in Muse into a winning product.\n\n\"People are going to be very wary,\" said Joseph Turow , a professor emeritus at the University of Pennsylvania and an expert on digital media and privacy.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 07:06 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks slide again as Treasury yields push higher, Oracle leads Nasdaq names lower: Live updates", "full_content": "Stocks fell on Thursday as Treasury yields kept marching higher, with traders anticipating further rate hikes from the Federal Reserve. A pullback in Oracle weighed on tech.\n\nThe Nasdaq Composite sank 0.8%, while the Dow Jones Industrial Average fell 182 points, or 0.4%. The S&P 500 was down 0.5%.\n\nOracle shares sank more than 5% after Bloomberg News reported , citing sources, that the company was citing force majeure in order to protect itself from a data center project being built in New Mexico if it is delayed.\n\nThe 30-year Treasury bond yield touched 5.446%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.15%, near levels not reached since July 2007. The 2-year note yield was flat on the day, but scaled to a 2023 high earlier in the week.\n\nThose moves came as oil prices rose sharply. International Brent crude futures rose 1% to around $105 a barrel, while West Texas Intermediate crude gained 1% to around $93.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a greater than 70% likelihood that the policy-setting Federal Open Market Committee lifts its key rate once more in October, according to the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nIn a note Thursday, strategists at UBS Global Wealth Management said their base case was for energy disruption to remain relatively limited and an inflation shock insufficiently broad or persistent to derail economic growth.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 07:05 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "OpenAI says agent hacked Australian government website without being told to do so", "full_content": "An artificial intelligence agent developed by OpenAI gained unauthorized access to an Australian government website, Prime Minister Anthony Albanese said , raising fresh questions about the risks posed by increasingly autonomous AI systems.\n\nThe incident comes as AI companies increasingly develop agents that can perform multistep tasks and interact with external websites and software with less human involvement, raising questions about how developers can prevent unexpected behavior as the technology becomes more autonomous.\n\nThe breach occurred on June 18 and involved an OpenAI agent accessing the Medicare statistics reporting service portal, which is administered by Services Australia, Albanese said.\n\nOpenAI's agent accessed both public and non-public files, according to the prime minister. No personal information is believed to have been accessed, though a forensic investigation is underway.\n\nThe portal contains non-sensitive Medicare information, including statistics on spending.\n\nAlbanese said he had spoken with OpenAI CEO Sam Altman to express Australia's \"extreme concern\" over the incident, and criticized the length of time it took the company to notify the government.\n\nThe AI company informed Australian authorities on Sept. 10, nearly three months after the June incident.\n\nOpenAI said the activity occurred during an internal evaluation as its models attempted to look up answers and statistics about Australia.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 07:02 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Egypt\u2019s central bank holds interest rates steady", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:58 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oracle shares drop on report it sent 'force majeure' notice about data center project", "full_content": "Oracle shares fell 4% on Thursday following a report that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\nBloomberg reported the news, citing sources familiar with the matter.\n\n\"Project Jupiter remains on our planned schedule,\" an Oracle said in a statement to CNBC. \"We are fully committed to New Mexico and confident in our path forward.\"\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it doesn't come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital. The company also saw its shares fall on Thursday.\n\n\"This notice does not change the financial commitments to this multi-year project,\" Blue Owl Capital said in a statement to CNBC.\n\nThe New Mexico data center project, which is part of the broader Stargate artificial intelligence infrastructure buildout with President Donald Trump, has been riddled with setbacks and regulatory hurdles.\n\nThat includes local opposition to data centers ahead of the upcoming midterm elections and concerns from environmental groups.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:58 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Earnings call transcript: Kri-Kri lifts H1 2026 sales, trims profit outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:56 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US current account deficit widens sharply in second quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:55 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Our top 10 things to watch in the stock market Thursday", "full_content": "The Trump-Xi summit kicks off today, and Meta delivers a big boost to its hardware lineup.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:54 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi board allows FPI access in non-farm goods, approves revamp of PMS, settlement rules", "full_content": "The Securities and Exchange Board of India (Sebi) board has approved a proposal to allow foreign portfolio investors (FPI) into physically-settled non-agri commodities, along with a slew of other measures, at its board meeting on Thursday.\n\nForeign investors would now be allowed to trade in non-agricultural index derivatives because such contracts are cash settled, regardless of the nature of their underlying commodities. For physically settled non-agricultural commodities, FPIs would have to square off positions before the start of the tender or staggered delivery period, three days before expiry.\n\nFPIs currently have access to non-agricultural commodity derivatives that are cash settled, while bullion and base-metal contracts are physically deliverable.\n\nIf they do not do so, open positions could be automatically transferred to a designated trading member or trading-cum-clearing member\u2019s proprietary account. The move is aimed at improving foreign investor participation in India\u2019s commodity markets, which would help boost volumes in the segment.\n\nThe regulatory board has also approved an overhaul of portfolio management services (PMS) regulations.\n\nThe Sebi board has allowed portfolio managers' route for investing in mutual fund units (PRIM) to offer professionally managed portfolios of mutual fund investments. PMS firms can now introduce mutual-fund-only PMS schemes, which would allow portfolio managers to offer professionally managed portfolios of mutual fund investments.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:53 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Judge lifts Trump ban of media outlets from White House \u2014 access still denied for some", "full_content": "A federal judge on Thursday ordered that White House access to journalists from CNN, MS NOW and Politico be immediately restored for up to two weeks, saying U.S. President Donald Trump 's media ban was likely unconstitutional.\n\nThe ruling represents a victory for the three media outlets, which had argued the ban violated their First Amendment rights, and comes as Trump hosts Chinese President Xi Jinping for a high-stakes meeting .\n\nDespite the ruling, some journalists from all three outlets were barred from entering the White House on Thursday morning. MS NOW reporter Laura Barr\u00f3n-L\u00f3pez and a MS NOW producer had their press passes confiscated when they tried to enter, but a second MS NOW producer was allowed to enter. Politico said that at least one of their reporters was also blocked, and CNN reported that some of its staff was denied access, but at least one was allowed in.\n\nIt was not clear if Secret Service officers were denying access to some journalists from the three outlets because of a lag in electronically reactivating their press passes and not as a result of a refusal to comply with the new judicial ruling.\n\nCNBC has requested comment fro ket share,\u201d said V.K. Vijayakumar, chief investment strategist at Geojit Financial Services.\n\nAmit Chandra, vice president at HDFC Securities , agreed. \u201cThe needle will move up by 1-2% in terms of equity cash market share after the listing euphoria dies down.\u201d\n\nFor instance, exchange data showed that BSE had a 7% market share in equity cash in 2025-26. This will increase to around 8.29% if NSE chips in about 20% to BSE's average daily turnover.\n\nThe stock notched a delivery volume of 48.78% on BSE\u2014that is, 25.1 million shares actually changed hands out of 51.5 million shares traded.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Allied Blenders among 7 stocks that hit 52-week highs and rallied up to 17% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Allied Blenders among 7 stocks that hit 52-week highs and rallied up to 17% in a month Written by Ritesh Presswala , ETMarkets.com | Sep 24, 2026, 06:51:09 PM IST 1 / 8 Fresh Highs On Thursday, the benchmark Sensex slipped 1,247 points to close at 73,580. Despite the fall in the market, seven stocks from the BSE 500 Index touched fresh 52-week highs, marking their highest price levels in the past year. A 52-week high refers to the highest price at which a stock has traded over the previous year and can indicate increased market activity and investor interest.\n\nNew 52-week high: Rs 723.15| CMP: Rs 713.15. In the last one month stock has gained about 17%.\n\nNew 52-week high: Rs 1369.05| CMP: Rs 1295.05. In the last one month stock has gained about 15%.\n\nNew 52-week high: Rs 2990.6| CMP: Rs 2865.8.  of the Day Yahoo Finance What Surging US Bond Yields Mean for Your Money Bloomberg Here's what happens to the economy when Treasury yields soar like they are now CNBC Bond Markets Are on Edge and Oil Prices Rise The New York Times", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 06:44 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Five is the magic number for US Treasuries", "full_content": "The 10-year yield on government debt cannot sustainably go much higher", "source": "FT Markets", "pub_date_str": "24 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "31 of 46 flexi-cap mutual funds delivered positive 1-year returns despite market fall: Check the schemes in red", "full_content": "Flexi-cap mutual funds saw a wide variation in one-year performance even as the Nifty 500 declined. While several schemes delivered positive returns, some slipped into negative territory. Here\u2019s a look at how individual schemes fared against the benchmark.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 06:39 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI Slaps Penalty On Hero Fincorp For Excess Interest, Fines Ola Arm For KYC Breaches", "full_content": "Hero Fincorp Ltd.collected excess interest from certain loan accounts while Ola Financial Services failed to carry out risk categorisation of certain customers, as per RBI.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 06:33 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Ethical & Professional Standards"]     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
