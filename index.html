ng (IPO) on Monday. The company reported a sharp increase in revenue and outlined substantial spending commitments, fuelling investor interest ahead of its expected stock market debut next month.\n\nAhead of the results, shares of Google parent Alphabet rose 0.9% as investors positioned themselves ahead of the company\u2019s third-quarter earnings announcement.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mutual fund direct plans to become default on AMC apps from November 1; what investors need to know", "full_content": "SEBI chairman Tuhin Kanta Pandey has announced that direct mutual fund plans will become the default option on asset management companies\u2019 (AMCs) digital platforms from 1 November. Investors who choose regular plans will have to be informed about their higher expense ratios, a move aimed at improving transparency around mutual fund costs.\n\nThe announcement, made at NDTV Profit Ignite in Mumbai on 28 October, comes as more Indian households invest in mutual funds through systematic investment plans (SIPs) and digital platforms. The change seeks to ensure investors are more aware of the costs associated with their investment choices.\n\n\u201cProtection also depends on what investors are told,\u201d Pandey said in his address, adding that direct plans would become the default on AMC digital platforms from 1 November.\n\nDirect and regular plans of the same mutual fund scheme invest in the same portfolio and are managed by the same fund manager. The main difference lies in distribution costs and the expense ratio charged to investors.\n\nDirect plans are purchased without a distributor and generally have lower expense ratios. Regular plans are purchased through mutual fund distributors, with distribution commissions reflected in the scheme\u2019s expenses. Since expenses are deducted from the scheme\u2019s assets, a higher expense ratio can reduce investors\u2019 net returns over time, all else being equal.\n\nFor example, if the annual expense ratio of a regular plan is 0.5 percentage points higher than that of its direct counterpart, the difference on an investment of \u20b9 5 lakh would amount to \u20b9 2,500 over a year, assuming the investment value remains unchanged throughout that period. The actual difference will vary with the value of the investment and the expense ratios applicable to the scheme.\n\nOver longer investment horizons, even small differences in costs can affect the final corpus because expenses reduce the amount available to generate returns.", "source": "LiveMint Money", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Federal Reserve holds interest rates steady as stubborn inflation puts future rate hikes in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Federal Reserve holds interest rates steady as stubborn inflation puts future rate hikes in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Federal Reserve holds interest rates steady as stubborn inflation puts future rate hikes in focus SECTIONS US Federal Reserve holds interest rates steady as stubborn inflation puts future rate hikes in focus By Akash Podishetti , ETMarkets.com Last Updated: Oct 28, 2026, 11:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US Federal Reserve has decided to keep its benchmark interest rate unchanged to evaluate inflation trends. Policymakers are assessing how high inflation might affect future monetary policy amid the upcoming midterm elections. Rising energy prices and tariffs contribute significantly to the ongoing inflation pressures faced by the economy. Traders are closely monitoring the upcoming Personal Consumption Expenditures inflation report for indications of future rate hikes.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Looking for yield? This could be one of the best times in recent market history to buy corporate bonds", "full_content": "Looking for yield? Investing experts say now may be one of the best moments in recent market history to buy corporate bonds.\n\nWith the 10-year Treasury yield still flirting around 5% and the Federal Reserve holding rates steady at its FOMC meeting on Wednesday, fixed income experts say the environment for highly rated investment-grade corporates is attractive \u2014 some have called it a \"generational opportunity.\"\n\nLeading the market are hyperscalers including Alphabet, Amazon, Meta and Microsoft, companies that have been aggressively issuing debt for artificial intelligence projects, including buying chips and building data centers and power plants to run them.\n\n\"You're typically not able to buy AA [and similarly rated] companies at these attractive yields,\" said Steven Purdy, group managing director and co-head of global credit at TCW in Los Angeles, which manages over $150 billion in fixed income investments.\n\nNevertheless, investors need to be cautious as cash flow is under pressure at even the most cash-rich companies in the market \u2014 Meta's free cash flow just went negative for the first time since its 2012 IPO.\n\nFor investors looking to the bond market for income opportunities, here is what to know about the current situation with corporates.\n\nThe major hyperscalers have strong balance sheets and highly manageable debt, even though it's larger than it has been in the past, said Joseph Matus, principal in the West Conshohocken, Pennsylvania office of Cerity Partners. \"It's not very often that investors get a chance to invest in above-average credit quality at average or above-average yields. That makes this a unique opportunity,\" he said.\n\nThe VettaFi AI Hyperscaler Bond Index, which tracks the debt of large tech giants like Microsoft, Alphabet, Oracle, Amazon and Meta, had a yield of 6.51% at the end of September.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fed holds rates steady despite concerns over inflation - CNBC", "full_content": "Fed holds rates steady despite concerns over inflation CNBC Federal Reserve makes interest rate decision ahead of midterms Fox Business Fed Rate Decision Live Coverage Bloomberg.com Fed Pauses Interest Rates as CRE Market Preps for December Hike Commercial Observer Fed meeting live updates: Federal Reserve weighs elevated inflation, midterm elections as October meeting kicks off Yahoo Finance", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 11:30 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Federal Reserve issues FOMC statement", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 2:00 p.m. EDT Share --> --> --> --> --> --> The Federal Open Market Committee approved the following statement for release by a 10 \u00e2\u0080\u0093 2 vote:\n\nThe Committee decided to maintain the target range for the federal funds rate at 3-3/4 to 4 percent, in support of the Federal Reserve's dual mandate. The Committee is continuing its policy of maintaining ample reserves in the banking system.\n\nEconomic activity is expanding at a strong pace. While uncertainty remains elevated owing, in part, to geopolitical developments, domestic spending has been resilient. Productivity growth is strong, and capital investment is robust. Job gains have kept pace with the workforce, and the unemployment rate has changed little.\n\nInflation remains elevated. The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal. The Committee will deliver price stability.\n\nVoting against the monetary policy action were Lisa D. Cook and Beth M. Hammack, who preferred to raise the target range for the federal funds rate by 1/4 percentage point at this meeting.\n\nFor media inquiries, please email [email protected] or call 202-452-2955.", "source": "Federal Reserve", "pub_date_str": "28 Oct 2026, 11:30 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Watch Live: Options traders break down a massive Alphabet trade into earnings", "full_content": "Options traders took contrasting views on Alphabet as the hyperscaler gets set to report earnings after the close.\n\nCurrent options prices are implying a nearly 6% move, well about its eight quarter median move of 2.6%. Traders were decidedly bullish heading into the first. Just before noon, a trader bought 2271 contracts of the 350/365 call spread for about $4.4. The trade target a move higher to $365, a 13% jump from its current price. The trade is a bet the in the near term, the worst is behind Alphabet, which has seen its shares fall nearly 20% from its all time highs reached back in May.\n\nSome traders are taking a different tact into the print. Specifically, a separate trader put on a bearish 3x1 put diagonal, collected $1.9M by selling 9,000 of the Nov. 20 expiration 290-strike puts at $4.15 per contract while buying 3,000 of the Jan. 15, 2027 exp. 300-strike puts at $2.15 per contract for a total debit of $2.5M\n\nThis is a trade that looks to take advantage of high near-term volatility in Alphabet's shorter dated puts. The goal is for those short-dated puts to expire worthless, with the trader then long the 300-strike puts, looking for a 9% move lower through mid January.\n\nThe market's mini rally faces a key test after the bell when tech giants Alphabet and Microsoft report. The technical set-up and options expectations could not be more different.\n\nMicrosoft is less than one percent below its closing record reached earlier this month, while Alphabet is flirting with technical bear-market territory, off 20% from its closing high in May. Market-makers are pricing a 5.8% move for Alphabet stock after its report, compared to under a 5% swing for Microsoft, Cboe LiveVol data show. For Microsoft, it's a smaller implied move than its 2-year average swing of 6%.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Micron Stock Advances as Rival SK Hynix Fuels AI Frenzy With Two Bombshells - Barron's", "full_content": "Micron Stock Advances as Rival SK Hynix Fuels AI Frenzy With Two Bombshells Barron's Why Micron Technology Stock Rallied Today Yahoo Finance Prediction: Micron\u2019s Next Earnings Cycle Could Reset Expectations for the Stock 24/7 Wall St. After Two Spectacular Micron Buy Ratings, I\u2019m Calling It Quits (Downgrade To Sell) (MU) Seeking Alpha Prediction: This Artificial Intelligence (AI) Memory Stock Will Go Parabolic on Oct. 30 The Motley Fool", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 11:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Biotechs buck a sluggish IPO market, but investors should tread warily", "full_content": "While a number of IPOs have been pulled or delayed in 2026, the biotech sector has bucked the trend, with 26 companies debuting in U.S. markets.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Vertiv earnings just sent an upbeat signal about AI ahead of Big Tech results", "full_content": "The AI infrastructure company beat sales expectations by the widest margin in more than five years and raised its capex outlook.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 11:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump is using tariffs as a 'tool for grift,' Raskin says in demand for donor records", "full_content": "A top House Democrat on Wednesday accused President Donald Trump of using tariffs as a \"tool for grift and self-enrichment,\" pointing to what he says are suspicious import-tax exemptions for industries whose leaders have curried Trump's favor with gifts and donations .\n\n\"You took care to cut lots of sweetheart deals with corporations and industries that won carve-outs from your tariffs when you saw you could get something good in return,\" Rep. Jamie Raskin, D-Md., told Trump in a fiery letter obtained first by CNBC.\n\nRaskin, the ranking member of the House Judiciary Committee and the former top Democrat on the House oversight committee, highlighted three such tariff carve-outs \u2014 for Brazilian meat , diamonds and smartphones \u2014 that he says \"make little to no sense\" under the criteria set by the Trump administration.\n\n\"They do, however, make sense when factoring in the now world famous Trump Tariff Discount,\" Raskin wrote, coining a term to describe the president's alleged willingness to cut breaks for his allies and benefactors \"when the price is right.\"\n\nThe letter asks Trump to hand over multiple categories of records spanning his second term, including communications between the White House and the Office of the U.S. Trade Representative, or USTR, related to any form of tariff relief for more than a dozen industries.\n\nIt makes a similar request for communications involving private-sector representatives, including Apple executive chairman Tim Cook and Rolex CEO Jean-Frederic Dufour. Raskin asked for those records by Nov.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 11:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Forget LRS Limits, India Should Relax Remittance Reporting Rules, Says Deepak Shenoy", "full_content": "Capitalmind Mutual Fund CEO Deepak Shenoy has called for easing overseas remittance reporting rules, arguing that India should simplify compliance instead of tightening LRS limits.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Q2 Results Highlights: Hero MotoCorp Results Meet Estimates, Bandhan Bank Net Profit Jumps Multifold", "full_content": "Hindustan Unilever, Vedanta, TVS Motor Company, Hyundai Motor India, and Hero MotoCorp are among the 120 companies that announced their Q2 FY27 results today, October 28.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Big Adani stocks Q2 comparison: Adani Ports vs Adani Power vs Adani Green Energy shares; Who delivered beyond estimates?", "full_content": "ADANIGREEN ADANIPORTS Sharmila Bhadoria Published 28 Oct 2026, 10:57 PM IST Prefer Livemint on Google Adani Ports vs Adani Power vs Adani Green Energy : Three of the top Adani Group firms, ie Adani Ports and Special Economic Zone Limited, Adani Green Energy Limited, and Adani Power Limited reported their second quarter result announcement this week.\n\nOut of these three stocks, which Adani Group firm delivered beyond estimates and has promising growth guidance for the rest of financial year 2026-27? Let\u2019s find out.\n\nAdani Power and Adani Green Energy outperformed market expectations in the second quarter of FY27, while Adani Ports Q2FY27 results were largely in-line with estimates, highlighted Prathamesh Kadiwal , Research Analyst at Bonanza.\n\n\u201cAdani Ports has offered the most promising guidance for the rest of FY27, as it raised its EBITDA target to Rs. 26,000 to 27,000 Cr and also lifted its revenue and capex plans. Rising cargo volumes and a healthy net debt to EBITDA ratio of 1.8x give these targets solid support,\u201d explained Prathamesh Kadiwal.\n\n\u201cAdani Power has strong long term visibility, with 62% of its 23.7 GW thermal pipeline tied up under power purchase agreements, but a 40% YoY rise in fuel costs may squeeze margins in Q3FY27. Adani Green\u2019s capacity grew 24% YoY to 20.8 GW and it may beat its 10 GWh battery target, yet transmission delays at Khavda could slow growth,\u201d Kadiwal added.\n\nAPSEZ reported an 18% surge in consolidated net profit at \u20b9 3,682.44 crore for the quarter ended September 2026, driven by higher revenues from operations. The consolidated net profit of the company stood at \u20b9 3,120.20 crore in the quarter ended September 30, 2025.\n\nAdani Ports share price closed 0.27% lower at \u20b9 1759 per share on BSE on Wednesday, October 28.\n\nAdani Green Energy reported a 16% annual surge in its net consolidated profit to \u20b9 747 crore in the September quarter, boosted by strong revenue growth in the power supply business.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 10:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trade Setup For Oct 29: Nifty Finds Support At 22,500 As Bulls Eye 23,000", "full_content": "Market experts recommend a level-based trading approach as the benchmark continues to show volatile and non-directional movement.", "source": "NDTV Profit", "pub_date_     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
