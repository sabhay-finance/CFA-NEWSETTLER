ults 2026 Today: What to expect and what street expects from revenue, profit, margins and AI deal wins", "full_content": "TCS Q2 Results 2026 Today : IT major Tata Consultancy Services (TCS) is set to announce its second-quarter results for FY27 on Thursday, 8 October, with investors closely watching revenue growth, profitability, margins and the pace of artificial intelligence-led deal wins.\n\nMarket analysts expect TCS to report a relatively muted quarter, with constant-currency revenue growth likely to remain subdued. While large deal wins and seasonal tailwinds could support performance, softer discretionary spending, geopolitical uncertainty and pricing pressure remain key concerns.\n\nKunal Bajaj, Research Analyst at Choice Institutional Equities, expects TCS to report flat quarter-on-quarter (QoQ) organic constant-currency revenue growth in Q2FY27.\n\nAccording to Bajaj, growth is likely to be supported by the international business, along with steady execution in the banking, financial services and insurance (BFSI) and Technology and Services segments. However, this could be offset by continued softness in the Consumer vertical.\n\nAI-led productivity gains are also emerging as a key challenge for the sector. Bajaj said productivity improvements are increasingly translating into deflation in the existing business book, putting pressure on traditional revenue growth.\n\nSeema Srivastava, Senior Research Analyst at SMC Global Securities, expects TCS to deliver steady Q2FY27 numbers, supported by seasonal tailwinds, operational efficiencies and healthy deal intake. She highlighted large contracts such as BSNL, MHP and Metro as potential growth drivers.\n\nHowever, Srivastava anticipates geopolitical uncertainty and softer demand during parts of the quarter to limit constant-currency growth.\n\nWhile analysts expect muted revenue growth, TCS\u2019s profitability is likely to remain supported by operational efficiencies and its strong balance sheet.", "source":  backing Trump refinery plan emerges top Venezuelan oil buyer outside U.S.", "full_content": "Indian billionaire Mukesh Ambani's Reliance Industries , which is investing in a historic U.S. oil refinery project proposed by President Donald Trump, has now emerged as the biggest buyer of Venezuelan crude outside the U.S.\n\nTrump has been pushing India to buy more Venezuelan oil , but while state-owned oil companies are making opportunistic purchases, Reliance has been the primary buyer, according to Kpler data shared with CNBC. It shows that outside the U.S., India is the biggest destination for these supplies, with Reliance purchasing the bulk of that crude.\n\n\"Reliance's Jamnagar complex has been the main destination for Venezuelan crude in India, and we expect it to remain the primary buyer,\" Sumit Ritolia, lead research analyst at Kpler, told CNBC.\n\nIn September, India imported 257,000 barrels per day of Venezuelan crude, of which 76% went to Reliance Industries, data showed. The Jamnagar refinery is the world's \" largest and most complex single-site refinery\" with crude processing capacity of 1.4 million barrels per day, according to Reliance.\n\nVenezuelan heavy and extra-heavy grades of crude are relatively difficult barrels to process and are not universally suitable across India's refining system, Ritola said, adding that the Jamnagar complex is particularly well configured for these barrels.\n\nIn March, Trump had announced that the U.S. will build its first refinery in 50 years with investment from India's Reliance Industries. The president had thanked Reliance for this \"tremendous investment.\"\n\nWhile Reliance has not confirmed the size of investment, Trump in a Truth Social post had said that \"THIS IS A HISTORIC $300 BILLION DOLLAR DEAL \u2014 THE BIGGEST IN U.S. HISTORY.\"\n\nReliance is the most valued company in India, with a market capitalization of more than $169 billion.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:55 PM l_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:41 PM IST", "pub_date_relative": "24m ago"}, {"title": "\u20b950 lakh income-tax case: ITAT quashes reassessment after tax department issued notice beyond the legal deadline", "full_content": "A taxpayer who had declared \u20b9 50 lakh under the Income Declaration Scheme (IDS), 2016, but could not complete the process after a bank-related payment issue, has received relief from the Income Tax Appellate Tribunal (ITAT). In Harshali Lavishkumar Jain v. ITO, Ward-1(2)(1), Surat (ITA No. 1463/SRT/2025), the Surat bench quashed the reassessment after finding that the tax department's fresh notice under section 148 was issued beyond the permissible time limit.\n\nThe case relates to the assessment year 2017-18. Jain had filed her return declaring income of \u20b9 6.88 lakh. The tax department later received information that she had declared \u20b9 50 lakh under IDS 2016 for assessment year 2012-13 but had not completed the declaration process by submitting Form-4, the certificate of final acceptance. The department subsequently reopened her assessment and eventually added the entire \u20b9 50 lakh as unexplained income.\n\nUnder IDS 2016, Jain had declared \u20b9 50 lakh and claimed that she had paid the required tax of \u20b9 22.50 lakh. However, she said a payment of \u20b9 5.625 lakh could not be credited to the government's account before the deadline because of a technical error at the bank's end.\n\nAccording to her submissions before the tribunal, the bank issued a certificate acknowledging the error. She argued that the assessing officer had also accepted that the full \u20b9 22.50 lakh tax had ultimately been paid, but Form-4 could not be submitted because of the payment issue.\n\nThe assessing officer nevertheless treated the \u20b9 50 lakh as unexplained income and added it under \"income from other sources\". The assessment was completed under section 147 read with sections 144 and 144B in May 2023. The taxpayer challenged the addition, but the Commissioner of Income Tax (Appeals) dismissed her appeal.\n\nBefore the ITAT, Jain also challenged the validity of the reassessment notice itself.\n\nThe original notice under section 148 had been issued on 30 June 2021, under the old reassessment regime.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 12:39 PM IST", "pub_date_relative": "26m ago"}, {"title": "AI startup Manus raises $500 million in first funding round since Meta breakup", "full_content": "AI agent startup Manus has raised more than $500 million in its first funding round since Meta was forced to abandon its acquisition of the company.\n\nButterfly Effect, Manus' parent company, said Thursday that the round was led by private equity firm Boyu Capital and venture investor IDG Capital, with follow-on investment from existing shareholders Tencent , HSG and ZhenFund.\n\nThe company did not disclose its post-funding valuation. Bloomberg reported last month that Manus was set to double its valuation to $4 billion in this financing round, making it the country's most valuable AI agent maker.\n\nThe raise suggests investors aren't deterred by Beijing's unprecedented order to block Meta's short-lived $2 billion acquisition. Meta was working to integrate Manus' team and technology into its system when authorities blocked the deal. It also shows that appetite for AI-agent startups has held up, even as the underlying foundation models improve quickly and price competition intensifies.\n\n\"The fundraising shows that the short-term fallout of the Meta case has been contained and investors are willing to back Manus as an independent company,\" said Dan Wang, China director at Eurasia Group, also noting the renewed confidence in the commercial potential of AI agents.\n\nManus could ultimately aim for a public listing but the more imminent task would be revamping its business and ownership structure to prove profitability and align with Beijing's regulatory requirement, analysts say.\n\n\"The immediate task for Manus now is proving scale, profitability and regulatory alignment,\" said Han Lin, China country director at The Asia Group.\n\nEarlier this month, Manus said it had resumed independent operations after its split from Meta and that its founding team would continue to push forward generative AI agents for users globally.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 12:29 PM IST", "pub_date_relative": "36m ago"}, {"title": "Indian firms seen posting faster profit growth despite global headwinds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Indian firms seen posting faster profit growth despite global headwinds State Bank of India Share Price Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Indian firms seen posting faster profit growth despite global headwinds SECTIONS Indian firms seen posting faster profit growth despite global headwinds Reuters Last Updated: Oct 08, 2026, 12:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian companies are projected to achieve profit growth during the September quarter despite various challenges affecting different sectors. Foreign investors are retreating from Indian stocks, impacting the benchmark Nifty 50 index's performance this year. Strong domestic demand and favorable conditions in certain sectors are expected to sustain earnings growth for many firms. Analysts believe that financials will be a significant driver of earnings, supported by healthy loan growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 12:28 PM IST", "pub_date_relative": "37m ago"}, {"title": "Shyam Metalics Q2 volumes shine; capex, value addition central to medium-term growth", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nShyam Metalics and Energy\u2019s shares gained over 5% after reporting that its September quarter (Q2FY27) consolidated sales volume rose 26% year-on-year (y-o-y) to 1.5 million tonnes. September was a strong month, with volumes rising 32% y-o-y and revenue growing almost 40% to over \u20b9 2,000 crore.\n\nThe integrated metal producer also announced a memorandum of understanding with the Maharashtra government on Monday to set up a 9 million tonne per annum (mtpa) integrated steel plant in Chandrapur, entailing an investment of \u20b9 50,000 crore.\n\nThe Q2 volume growth marks a significant improvement versus 8% y-o-y growth in Q1. Blended realization increased by about 7% in Q2, although some of the benefit is likely to be offset by higher coking coal prices.\n\nThus, revenue growth for H1FY27 now stands at 29% compared with the management\u2019s guidance of 20% growth for FY27. The Q1 Ebitda had risen by 32% to \u20b9 765 crore, as against the company\u2019s 20% growth guidance for FY27.\n\nSeveral levers support medium-term profit growth. The company is undertaking projects entailing capital expenditure of about \u20b9 14,000 crore and has already spent \u20b9 3,300 crore. This will increase its capacity to 14.6 mtpa across various categories of steel, intermediates and aluminium products by FY31, from the current 9 mtpa.\n\nCaptive renewable power generation is expected to help lower energy costs . The company targets a 600-700 basis point increase in return-on-equity under its Vision 2031 from about 10% in FY26.\n\nHowever, the bigger gains could come from prudent capital deployment and faster project execution.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:24 PM IST", "pub_date_relative": "41m ago"}, {"title": "Stock market crash: Terrible Thursday for Sensex, Nifty as over \u20b97 lakh cr investors wealth eroded - what went wrong?", "full_content": "Stock market crash: Bears took charge on Dalal street as Nifty fell nearly 1.11%, and Sensex was down close to 700 points during Thursday\u2019s intraday trading session. Crude oil price volatility, elevated US treasury yields, FII selling, Rupee weakness, and the Reserve Bank of India (RBI) repo rate decision were among the key factors that dragged the Indian stock market lower on October 8.\n\nMeanwhile, stock market investors eagerly await the Tata Consultancy Services (TCS) result for the second quarter. The IT heavyweight is scheduled to announce Q2FY27 result post market trading session on Thursday. Nifty 50 was trading 1.08% lower at 22,359 points at 12:16 pm on October 8. Whereas, BSE Sensex was down 755 points at 71,883.\n\nThe weakness in the Indian stock market today was largely driven by the hawkish stance by the RBI. The Central Bank raised the repo rate by 25 basis points on Wednesday, for the first time since February 2023.\n\n\u201cThe recent rise in the repo rate by 25 basis points has made investors more apprehensive about liquidity and cost of borrowing. With the global markets also coming under pressure, investors have turned defensive. In the short run, volatility will stay high, and the course of the market will depend on quarterly results, crude prices, and the RBI,\u201d explained Siddharth Maurya, Founder & Managing Director, Vibhavangal Anukulakara Pvt. Ltd.\n\nContinued foreign selling, high bond yields, concerns around sticky inflation further contributed. \u201cThe weakness seen today in the market is largely attributed to the hawkish stance of the RBI, increasing crude prices, and continued foreign selling. Increasing crude prices are fueling worries about inflation, and high bond yields and weakening rupee are other reasons why investors are remaining cautious,\u201d explained Maurya.\n\nThe 10-year US Treasury yield is hovering around 5.3%, which makes it an attractive investment option for foreign institutional investors (FIIs).", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:23 PM IST", "pub_date_relative": "42m ago"}, {"title": "TCS Q2 Results 2026 Today: 5 triggers could decide share price's next move post earnings announcement | Experts' view", "full_content": "TCS Q2 Results 2026 Today: The IT major Tata Consultancy Services (TCS) is going to declare its Q2 results 2026 today. The market is expecting stable second-quarter numbers from the Tata Group company. As TCS share has remained under selling pressure throughout the year, losing around 35% YTD, TCS shareholders would be keen to find a trigger that may attract Dalal Street bulls post the announcement of TCS Q2 results 2026 .\n\nAccording to stock market experts, TCS results are expected post-market close today, and it will have an impact on TCS's share price movement when the market reopens on Friday. They highlighted that AI-led revenue and guidance, deal wins and net revenue generated during the July to September 2026 quarter is expected to remain under the observations of Indian market observers. However, margins and dividends would be additional triggers expected to dictate TCS's share price movement post- TCS Q2 results today .\n\nSpeaking on the major triggers, which are expected to dictate TCS share price movement post-TCS Q2 results today, Mahesh M Ojha, VP \u2014 Research at KC Securities, said, \"The top 5 triggers, which are expected to dictate TCS share price movement post-earnings, are: revenue growth, margins, deal wins, AI-led revenue and guidance, and dividend .\n\nSpeaking on the first trigger post-TCS Q2 results for the TCS shares, Mahesh M Ojha said, \u201cThe market estimates growth in the company's revenue in terms of YoY and QoQ; however, it is not very bullish on the revenue growth. So, the exact revenue growth will be in focus of both bulls and bears, when the TCS Q2 results 2026 is announced today.\u201d\n\nHighlighting the importance of margins in TCS Q2 results today, Anuj Gupta, a SEBI-registered market expert, said, \u201cAmid a weak Indian Rupee against the US Dollar, the company's report on the margins will be an important takeaway for the market investors.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:21 PM IST", "pub_date_relative": "44m ago"}, {"title": "TSMC\u2019s September sales surge year-over-year as AI drives chip demand", "full_content": "The world's largest contract chipmaker Taiwan Semiconductor Manufacturing Co posted revenue of $511.86 billion New Taiwan dollars ($16.03 billion) for September, up 54.6% on the year prior, but down 0.6% on August .\n\nThe company closed 1.35% lower ahead of releasing monthly figures.\n\nShares of TSMC TSMC, which counts Nvidia and Apple among its customers, has been a major beneficiary of surging demand for advanced AI chips.\n\nIn September, TSMC committed to using ASML's High NA extreme ultraviolet lithography machines, a key technology for producing more advanced chips, joining Samsung Electronics among customers adopting the technology.\n\nIt is scheduled to report its third-quarter earnings next week.\n\nCorrection: The story has been updated to reflect that sales did not hit a record high in September.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 12:20 PM IST", "pub_date_relative": "45m ago"}, {"title": "GST Council meet: Scrapping tax officers' arrest powers, decriminalisation among reforms on agenda", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST Council meet: Scrapping tax officers' arrest powers, decriminalisation among reforms on agenda The Economic Times daily newspaper is available online now. Read Today's Paper GST Council meet: Scrapping tax officers' arrest powers, decriminalisation among reforms on agenda SECTIONS GST Council meet: Scrapping tax officers' arrest powers, decriminalisation among reforms on agenda PTI Last Updated: Oct 08, 2026, 12:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council is poised to address significant reforms that could transform GST compliance for businesses. Among the proposed measures are the removal of arrest powers held by GST officers and higher thresholds for criminal prosecution. Small e-commerce sellers might find it easier to register through platform warehouses without needing tax officer intervention.\n\nIndia's GST Revolution: How India\u2019s biggest indirect tax reform changed its economy and its way of doing business\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 12:16 PM IST", "pub_date_relative": "49m ago"}, {"title": "Why Is Stock Market Crashing Today? Crude Jitters, RBI Tone Among 3 Reasons Behind D-Street Selloff", "full_content": "Nifty 50 cracked below 22,400 in the first half of trade, whereas Sensex slumped over 700 points. Here's a look at what led to the markets tumbling in early trade.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 12:13 PM IST", "pub_date_relative": "52m ago"}, {"title": "Life Insurers' First-Year Premium Jumps 21% In September; LIC Reports 19% YoY Increase At Rs 27,529 Crore", "full_content": "Among private insurers, ICICI Prudential Life Insurance recorded the strongest growth among the major players, with first-year premium rising 25% YoY to Rs 2,701 crore.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "UPI MDR rollout delayed? 0.4% fee on payments above \u20b92,000 may start in January 2027", "full_content": "India is considering delaying the implementation of a proposed fee on large-value transactions through the Unified Payments Interface (UPI) by a few months, Reuters reported on Thursday, citing a regulatory official and an industry executive familiar with the discussions.\n\nThe proposed 0.4% fee on merchant transactions above \u20b9 2,000 was scheduled to take effect from 15 October. A final decision has not yet been taken by the National Payments Corporation of India (NPCI), the sources told Reuters.\n\nThe delay, if approved, could push the implementation to January, giving payment companies more time to upgrade their systems and allowing merchants to navigate the upcoming festive shopping season without an immediate change to UPI payment costs.\n\nThe development comes after India moved last month to introduce a charge on large UPI merchant transactions, ending more than six years of zero-cost UPI payments. The proposed fee is an interchange or merchant-side charge and does not mean consumers will directly pay 0.4% every time they make a UPI payment.\n\nUPI has become a major part of India's payments ecosystem, with more than 500 million users. NPCI data shows that UPI processed 24.51 billion transactions worth \u20b9 29.82 lakh crore in August 2026.\n\nThe proposed 15 October implementation would have coincided with India's festive season, when consumer spending typically rises sharply. According to the sources cited by Reuters, postponing the rollout could prevent disruptions to retail payments during this period while giving payment companies additional time to prepare.\n\nThe industry is also expected to use the additional time to upgrade systems and work out how the new fee will be handled without passing the cost on to consumers.\n\nThe proposed charge has already faced opposition from retailers and a large broker. Its introduction was expected to create a new monetisation opportunity for digital payments companies, which could receive a share of the fee.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "PC Jeweller share price jumps over 7% on Q2 update | Stock up 54% YTD \u2014 What lies ahead?", "full_content": "PC Jeweller shares jumped over 7% on Thursday, 8 October, after the jewellery retailer reported a strong second-quarter business update, with consolidated revenue rising 28% year-on-year in Q2 FY27 amid healthy consumer demand.\n\nThe company also highlighted its improved financial position after becoming debt-free during the September quarter. PC Jeweller said it had repaid the outstanding debt of all 14 consortium banks, with repayments completed ahead of their scheduled due dates.\n\nThe company had opted for a one-time settlement (OTS) with its consortium of banks in September 2024 to resolve its outstanding dues. Its total debt at the time was around \u20b9 3,000 crore.\n\nAccording to a regulatory filing, consolidated revenue grew around 28% year-on-year during July-September 2026.\n\nPC Jeweller also received \u20b9 142 crore in remittances from outstanding export debtors during the quarter, it said.\n\nThe company said achieving debt-free status will help reduce its interest costs going forward, which is expected to support profitability and strengthen its balance sheet.\n\n\u201cDuring the September quarter, the company achieved debt-free status after successful repayment of outstanding debt of all the banks, with all repayments completed ahead of the scheduled due dates,\u201d PC Jeweller said.\n\n\u201cWith no bank debts outstanding, the company will be saving on the interest cost in the future, which will positively impact its bottom line and strengthen its balance sheet,\u201d it added.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "ET Alpha Wealth Summit 2.0: Bear markets can breed best investment ideas, says Nilesh Shah", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ET Alpha Wealth Summit 2.0: Bear markets can breed best investment ideas, says Nilesh Shah The Economic Times daily newspaper is available online now. Read Today's Paper ET Alpha Wealth Summit 2.0: Bear markets can breed best investment ideas, says Nilesh Shah SECTIONS ET Alpha Wealth Summit 2.0: Bear markets can breed best investment ideas, says Nilesh Shah By Surbhi Khanna , ET Online Last Updated: Oct 08, 2026, 11:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nilesh Shah from Kotak Mutual Fund highlights the advantage of bear markets in uncovering robust investment opportunities. He points out that India's growth potential surpasses that of South Korea due to its remarkable talent pool and infrastructure. Shah advises diversifying portfolios with alternative investments like SIFs, credit AIFs, and global funds, suggesting that 15% to 20% be dedicated to international assets.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "TCS Q2 Results 2026, Dividend Amount Announcement Today: 5 numbers shareholders, investors, stock traders must watch", "full_content": "TCS Q2 results 2026, dividend amount announcement today: IT major Tata Consultancy Services (TCS) is set to kick off the second-quarter earnings season with the announcement of its September-quarter results on Wednesday, October 8.\n\nWith TCS\u2019s September-quarter results approaching, investors will be watching closely for signs of a recovery in demand, stability in margins and fresh updates on the impact of artificial intelligence (AI) on its business.\n\nIndia\u2019s largest IT services company is expected to kick off the Q2 earnings season on a cautious note, with investors focusing on the company\u2019s outlook and management commentary.\n\nAccording to Seema Srivastava, Senior Research Analyst at SMC Global Securities, Tata Consultancy Services is expected to report steady Q2FY27 numbers driven by seasonal tailwinds, resilient operational efficiencies, and solid deal intake from mega-contracts like BSNL, MHP, and Metro, even as modest constant currency growth faces geopolitical friction and soft mid-quarter demand.\n\nAlongside a anticipated second interim dividend with a mid-October record date, the results take on added significance following Accenture\u2019s upbeat guidance, which signals early enterprise stabilization.\n\nSrivasatava further added that integrating these operational strengths with broader global tech cues confirms TCS as a compelling long-term wealth creator. Its fortress balance sheet, high utilization rates, and robust structural positioning in large-scale cloud and GenAI migrations insulate it from near-term macroeconomic volatility. While discretionary spending remains constrained, current valuation corrections paired with consistent shareholder returns enhance its defensive appeal.\n\nDomestic brokerage firm JM Financial expects Tata Consultancy Services (TCS) to post 0.5% quarter-on-quarter (QoQ) growth in constant-currency (CC) revenue in Q2 FY27, marking a 20-basis-point sequential moderation in growth.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "India bonds hemmed in as market digests higher rates", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds hemmed in as market digests higher rates Aditya Birla Sun Life AMC Share Price ICICI Prudential Asset Management Company Share Price HDFC Asset Management Company Share Price Nippon Life India Asset Management Share Price UTI Asset Management Company Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds hemmed in as market digests higher rates SECTIONS India bonds hemmed in as market digests higher rates Reuters Last Upda  Amount", "full_content": "Vijay Sethupathi-starrer 'Baththa' earned Rs 1.29 crore net on Day 6, taking its total India net collection to Rs 14.04 crore, while the India gross stands at Rs 16.26 crore.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "SWP Explained: How To Create Regular Income From Your Mutual Fund Corpus", "full_content": "A Systematic Withdrawal Plan (SWP) can act as a supplemental income, providing regular cash flow during retirement years.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: China stocks slide as tech valuations face earnings test", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China stocks slide as tech valuations face earnings test Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China stocks slide as tech valuations face earnings test SECTIONS Global Market: China stocks slide as tech valuations face earnings test By Anupam Nagar , ETMarkets.com Last Updated: Oct 08, 2026, 11:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chinese stocks fell after the holiday break amid renewed US-China tensions, higher US Treasury yields and concerns over elevated technology valuations. The CSI300 and Shanghai Composite declined, while the STAR 50 suffered sharper losses. Investors are reassessing high-valued chip and technology stocks, with trade tensions, earnings expectations and global yields weighing on sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "'We All Have To Go Someday\u2019: What Nana Patekar Said On Life In Last Public Appearance 4 Days Before Death", "full_content": "Maharashtra Cultural Affairs Minister Ashish Shelar on Thursday announced that veteran actor Nana Patekar will be accorded a state funeral in recognition of his contribution to theatre and cinema.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today LIVE: Sensex Crashes Over 700 Points, Nifty 50 Slips Below 22,400; ITC, JSW Steel, SBI Life Among Top Losers", "full_content": "Among sectors, Nifty Metals dropped over 2%, emerging as the top losers, followed by Nifty Realty, Nifty Pharma, Nifty Auto and Nifty FMCG indices. On the contrary, gains were seen in Nifty IT and Nifty PSU Bank indices.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "TCS shares pre vs post quarterly results performance data explainer: Before-after; how IT stock fared in Q2, Q3, Q4, Q1", "full_content": "Domestic IT bellwether Tata Consultancy Services (TCS) is set to announce its July-September quarter (Q2FY27) results on Thursday, 8 October.\n\nTCS may announce a muted quarter-on-quarter (QoQ) constant currency (CC) revenue growth for Q2FY27, according to experts. Steady execution in BFSI and 'technology and services' is likely to be offset by softness in the consumer vertical.\n\nInvestors' focus is likely to be on the demand environment, the pace of revenue growth, and further clarity on the partnership with Porsche.\n\nAlong with its Q2FY27 financial results, the IT major is also expected to announce a second interim dividend today.\n\nThe IT stock climbed almost 3% in the morning session on Thursday, rising to an intraday high of \u20b9 2,142, looking set to snap its two-day losing run.\n\nShare performance before and after Q2FY26 results: TCS reported its Q2FY26 results after market hours on 9 October 2025. The stock rose 1.16% on the day of the results and declined 1.10% the next day on the BSE after the results announcement. The company's revenue at \u20b9 65,799 crore increased 3.7% QoQ and 0.8% in constant currency.\n\nShare performance before and after Q3FY26 results: The IT major reported its Q3FY26 results after market hours on 12 January 2026. The stock rose 0.86% on the result day. It extended gains for the second consecutive session on the next day, rising 1%, on the BSE. The company reported a 2% QoQ increase in revenue to \u20b9 67,087 crore, while in CC terms, revenue grew by 0.8% QoQ.\n\nShare performance before and after Q4FY26 results: TCS reported its Q4FY26 results after market hours on 9 April 2026. The stock jumped 1.09% on the result day, but after the result announcement, it dropped 2.45% on the next day on 10 April. TCS revenue in the quarter increased by 1.2% QoQ in CC.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Piero Cipollone: Interview with Corriere della Sera", "full_content": "Not at all. Perhaps some people initially feared that the aim of the digital euro was to replace cash. But that is not the case. The ECB\u2019s work to develop and ultimately introduce a new series of euro banknotes with different designs and the latest anti-counterfeiting features, is proof of that. The digital euro will complement cash, offering the same high level of security and, let me stress, at no cost to individuals, just like cash today.\n\nSo, when can we expect the digital euro? Could it be in 2029?\n\nYes. But let me take a step back for a moment. This is not just a technical matter, and not everything is up to the ECB.\n\nSupport for the single currency stands at over 80% in the latest Eurobarometer survey. That tells us that the project has solid foundations: people trust the euro, our common currency. But the world is changing. I hardly need to point out that we live in a digital age. We all carry a phone in our pocket. It would be strange not to complement euro banknotes with a digital form of cash, wouldn\u2019t it?\n\nI see. That perhaps harks back to what you learned from Federico Caff\u00e8, with his emphasis on the social dimension of economics\u2026\n\nMore simply, alongside the cash that our parents and grandparents tell us to carry in our pockets \u201cjust in case\u201d, we will have an app on our phones. It will be provided by the ECB, our own bank or another payment service provider, and we will be able to hold an amount of digital euro in it.\n\nBut what is the point of having a digital euro on our phones when we already have so many ways to pay, from cards such as Visa and Mastercard to payment services such as Satispay and PayPal? We can already send money with a single tap.\n\nThey are very different things. Ask merchants what happens today when customers pay by card, whether directly or using their phones. Merchants often have no real alternative when it comes to accepting those payments and have to pay fees that are opaque and often high.", "source": "ECB Press", "pub_date_str": "08 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Japanese investors sell foreign bonds for third straight week as Treasury yields jump", "full_content": "Home ETPrime Marke
