de internet access available.\n\nThe agents stopped their intrusion when they determined they had accessed real company systems, not just part of the testing environment, Google said.\n\n\"In a standard evaluation, the model found public information online and guessed credentials to access websites it thought were part of the test,\" Heather Adkins, Google Vice President of Security Engineering, said in a statement. \"In all three of these instances, the model stopped.\"\n\nThe disclosure comes as scrutiny over misbehaving artificial intelligence intensifies in Washington and Silicon Valley.\n\nOpenAI, Anthropic and Meta have in recent weeks disclosed incidents where its artificial intelligence models had broken out of their testing environments and attempted to hack other companies to gain unauthorized access to computer systems.\n\nThe disclosures of so-called \"misaligned\" artificial intelligence models prompted Anthropic CEO Dario Amodei to call for the artificial intelligence industry to collectively slow down or \"pace\" the development of the most advanced AI models until companies can ensure they are safe.", "source": "CNBC World Economy", "pub_date_str": "19 Sep 2026, 06:23 AM IST", "pub_date_relative": "40m ago"}, {"title": "Bitcoin, Strategy Stock, Coinbase Surge. Why Cryptos Are Rallying Against All Odds. - Barron's", "full_content": "Bitcoin, Strategy Stock, Coinbase Surge. Why Cryptos Are Rallying Against All Odds. Barron's Bitcoin surges 5% to top $80,000 as investors look past Clarity Act's failure Yahoo Finance Bitcoin reclaims $80,000, Solana and Hyperliquid rally as crypto markets shrug off Clarity setback The Block CFTC Shock Sends Bitcoin Back Above $80,000 Two Days After Fed Hike Forbes Bitcoin Climbs Above $80,000 WSJ", "source": "Google News Business", "pub_date_str": "19 Sep 2026, 06:22 AM IST", "pub_date_relative": "41m ago"}, {"title": "Adaptive Biotechnologies CPO Francis Lo sells $3.2m in stock", "full_content": "", "source": "Investing t \u20b9 300 quoted in the unlisted market.\n\nIt was like buying a Kanjeevaram silk saree at full price, only to watch that the store announced a massive 72% clearance sale days later, said an investor on the condition of anonymity.\n\nMint spoke to unlisted-share platforms and brokers and found that the \u20b9 280-300 levels for Hero Motors attracted few, if any, confirmed buyers.\n\n\u201cAt least on our platform, we didn't see a person actually buying Hero shares at the \u20b9 280 to \u20b9 300 levels,\u201d said Abhishek Ginodia, founder and chief excutive officer (CEO) of unlisted-share platform Altius Investech.\n\n\"Since there isn't much information available, prices are based on whatever sellers feel like asking, and websites report those numbers. And because so few shares change hands, there is no real price discovery\" said Ginodia.\n\nThe price that was being quoted is also a 52-week high, meaning sellers quoted the highest they could, said another broker who didn't want to be named.\n\nThe problem is compounded by the limited supply of shares available for trading in the private market. Promoters and the promoter group own 85.57% of Hero Motors, leaving 14.43% as public shareholding.", "source": "LiveMint Markets", "pub_date_str": "19 Sep 2026, 05:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gemini hacked three companies in first known breakout by Google's AI - reuters.com", "full_content": "Gemini hacked three companies in first known breakout by Google's AI reuters.com Google's Gemini becomes latest AI model to break out and hack computer systems cnbc.com Gemini AI Hacked Three Companies in a Testing Breakout, Google Says The New York Times Google says its Gemini AI model hacked three other companies The Guardian Google is the latest AI lab with a security testing mishap Axios", "source": "Google News Business", "pub_date_str": "19 Sep 2026, 05:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump says he's banning MS NOW, CNN and Politico from White House", "full_content": "President Donald Trump said Friday that he is banning MS NOW, CNN and Politico from the White House over their coverage of him.\n\nTrump said in a Truth Social post that those outlets \"shouldn't be able to constantly write or report FICTION and LIES when they're covering the President of the United States, the Trump Administration, or the United States of America.\"\n\nIn the Oval Office later Friday afternoon, Trump said he was imposing the ban in response to \"cumulative stories\" by the three outlets.\n\nThe White House under Trump briefly tried to suspend a CNN reporter's press pass in 2018, and it is currently in a lawsuit over an attempted ban of Associated Press journalists from certain spaces.\n\nTrump said Friday that the effort to bar news outlets is worthwhile, even if it does not hold up in court.\n\n\"I think it's good to point it out whether it survives or doesn't,\" Trump said.\n\nTrump has long targeted news outlets and individual journalists over what he claims is unfair coverage. He encourages his supporters at political rallies to boo and jeer at reporters present, and he regularly takes to social media to call out journalists by name and insult them in personal terms.\n\nBut the attempt to block White House access to disfavored news outlets takes Trump's open hostility for critical reporting to a new extreme.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 05:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m in my 50s. My mother died from Alzheimer\u2019s. Do I need long-term-care insurance?", "full_content": "\u201cBy the time my mother died, the insurance company had paid out almost $600,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "19 Sep 2026, 05:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump says U.S. to build a 'large Military presence' in Greenland as part of a security deal with it and Denmark", "full_content": "President Donald Trump on Friday announced an agreement with Greenland and Denmark that gives the U.S. what he described as \"permanent control over security, and all other needs\" in the Danish island territory.\n\n\"We will immediately begin the process of developing a large Military presence in the appropriate part of Greenland, of which there are many,\" Trump said in a Truth Social post .\n\nGreenland already has a U.S. military presence under a decades-old defense agreement with Denmark.\n\nThe deal as described in Trump's post appears to stop far short of his prior insistence that Greenland must be made a part of the United States.\n\nGreenland has maintained it is not for sale, and the European Union earlier this year united to rebuke Trump over his push to acquire the island.\n\nBut Trump signaled Friday that he was satisfied by the new deal, claiming that it addresses \"ALL of our many U.S. concerns.\"\n\nThe Danish prime minister's office in a press release later Friday said that the three governments expect to sign the agreement at the United Nations General Assembly next week.\n\nGreenland Prime Minister Mette Frederiksen said in an included statement that the deal \"strengthens our common security in the Arctic and the North Atlantic area and therefore is great for NATO and Europe as well.\"", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 04:58 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Ximen Mining seeks funding for Kenville gold mine development", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Sep 2026, 06:38 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Google's Gemini becomes latest AI model to break out and hack computer systems", "full_content": "Google said on Friday that its Gemini model had hacked three other companies, the first time the search giant has disclosed that one of its models autonomously gained access to third-party computer systems without permission.\n\nIn May, the Gemini model accessed three separate private computer systems by guessing passwords and by twice using a repository of publicly listed passwords, Google said.\n\nThe incident happened as part of a \"capture-the-flag\" security test run by Israeli startup Irregular, and Google's agents were never supposed to access the broader internet, but a bug in the testing environment made internet access available.\n\nThe agents stopped their intrusion when they determined they had accessed real company systems, not just part of the testing environment, Google said.\n\n\"In a standard evaluation, the model found public information online and guessed credentials to access websites it thought were part of the test,\" Heather Adkins, Google Vice President of Security Engineering, said in a statement. \"In all three of these instances, the model stopped.\"\n\nThe disclosure comes as scrutiny over misbehaving artificial intelligence intensifies in Washington and Silicon Valley.\n\nOpenAI, Anthropic and Meta have in recent weeks disclosed incidents where its artificial intelligence models had broken out of their testing environments and attempted to hack other companies to gain unauthorized access to computer systems.\n\nThe disclosures of so-called \"misaligned\" artificial intelligence models prompted Anthropic CEO Dario Amodei to call for the artificial intelligence industry to collectively slow down or \"pace\" the development of the most advanced AI models until companies can ensure they are safe.", "source": "CNBC World Economy", "pub_date_str": "19 Sep 2026, 06:23 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Bitcoin, Strategy Stock, Coinbase Surge. Why Cryptos Are Rallying Against All Odds. - Barron's", "full_content": "Bitcoin, Strategy Stock, Coinbase Surge. Why Cryptos Are Rallying Against All Odds. Barron's Bitcoin surges 5% to top $80,000 as investors look past Clarity Act's failure Yahoo Finance Bitcoin reclaims $80,000, Solana and Hyperliquid rally as crypto markets shrug off Clarity setback The Block CFTC Shock Sends Bitcoin Back Above $80,000 Two Days After Fed Hike Forbes Bitcoin Climbs Above $80,000 WSJ", "source": "Google News Business", "pub_date_str": "19 Sep 2026, 06:22 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trump signs Russia-Iran sanctions law, opens door to 100% tariffs on India", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Trump signs Russia-Iran sanctions law, opens door to 100% tariffs on India The Economic Times daily newspaper is available online now. Read Today's Paper Trump signs Russia-Iran sanctions law, opens door to 100% tariffs on India SECTIONS Trump signs Russia-Iran sanctions law, opens door to 100% tariffs on India By PTI Last Updated: Sep 19, 2026, 06:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US President Trump signed the Sanctioning Russia and Iran Act into law. This legislation imposes significant tariffs on Russia and its energy buyers. China and India face potential 100 percent duties on Russian oil and gas. The act targets Russia's leadership and energy sector directly. It also addresses collaborators in Moscow's defense industry.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Sep 2026, 06:14 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic Pursues IPO Despite Its A.I. Safety Warnings - The New York Times", "full_content": "Anthropic Pursues IPO Despite Its A.I. Safety Warnings The New York Times Anthropic\u2019s Annualized Revenue to Top $100 Billion in 2026, NYT Says Bloomberg.com Anthropic IPO Date: What Investors Need to Know Before It Prices Yahoo Finance Anthropic tells investors it will be profitable for second straight quarter, FT reports reuters.com Anthropic Shifts Planned IPO to November WSJ", "source": "Google News Business", "pub_date_str": "19 Sep 2026, 05:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hero Motors, NSE show two realities of India\u2019s unlisted market", "full_content": "Investors who bought Hero Motors' unlisted shares at \u20b9 300 apiece could be staring at steep losses after the company set its IPO price band at \u20b9 79-84.\n\nAt the upper end of \u20b9 84, the IPO price was 72% below the \u20b9 300 unlisted quote, while at the lower end of \u20b9 70, the discount was 77%. Now, hardly anyone is buying the shares at \u20b9 300 quoted in the unlisted market.\n\nIt was like buying a Kanjeevaram silk saree at full price, only to watch that the store announced a massive 72% clearance sale days later, said an investor on the condition of anonymity.\n\nMint spoke to unlisted-share platforms and brokers and found that the \u20b9 280-300 levels for Hero Motors attracted few, if any, confirmed buyers.\n\n\u201cAt least on our platform, we didn't see a person actually buying Hero shares at the \u20b9 280 to \u20b9 300 levels,\u201d said Abhishek Ginodia, founder and chief excutive officer (CEO) of unlisted-share platform Altius Investech.\n\n\"Since there isn't much information available, prices are based on whatever sellers feel like asking, and websites report those numbers. And because so few shares change hands, there is no real price discovery\" said Ginodia.\n\nThe price that was being quoted is also a 52-week high, meaning sellers quoted the highest they could, said another broker who didn't want to be named.\n\nThe problem is compounded by the limited supply of shares available for trading in the private market. Promoters and the promoter group own 85.57% of Hero Motors, leaving 14.43% as public shareholding.", "source": "LiveMint Markets", "pub_date_str": "19 Sep 2026, 05:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trump says he's banning MS NOW, CNN and Politico from White House", "full_content": "President Donald Trump said Friday that he is banning MS NOW, CNN and Politico from the White House over their coverage of him.\n\nTrump said in a Truth Social post that those outlets \"shouldn't be able to constantly write or report FICTION and LIES when they're covering the President of the United States, the Trump Administration, or the United States of America.\"\n\nIn the Oval Office later Friday afternoon, Trump said he was imposing the ban in response to \"cumulative stories\" by the three outlets.\n\nThe White House under Trump briefly tried to suspend a CNN reporter's press pass in 2018, and it is currently in a lawsuit over an attempted ban of Associated Press journalists from certain spaces.\n\nTrump said Friday that the effort to bar news outlets is worthwhile, even if it does not hold up in court.\n\n\"I think it's good to point it out whether it survives or doesn't,\" Trump said.\n\nTrump has long targeted news outlets and individual journalists over what he claims is unfair coverage. He encourages his supporters at political rallies to boo and jeer at reporters present, and he regularly takes to social media to call out journalists by name and insult them in personal terms.\n\nBut the attempt to block White House access to disfavored news outlets takes Trump's open hostility for critical reporting to a new extreme.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 05:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks face a key hurdle in next week\u2019s U.S.-China summit. Here\u2019s what\u2019s at stake", "full_content": "The S&P 500 and the Dow Industrials posted weekly losses as investors grappled with rising yields. Next week's U.S.-China summit could be a wildcard for stocks.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 04:44 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "S&P 500, Nasdaq advance, turning the page on a tumultuous week - reuters.com", "full_content": "S&P 500, Nasdaq advance, turning the page on a tumultuous week reuters.com Dow falls Friday and posts worst week since March as Treasury yields rise: Live updates cnbc.com Dow Drops To Record Worst Week In Six Months Amid Elevated Yields, Oil \u2014 NVDA, TSLA, SPCX, ONON In Focus Yahoo Finance Wall yber solution?\" Cramer said. \"Why don't they, like, talk to the cybersecurity guys?\"\n\nBefore that, homebuilder KB Home reports Tuesday. Cramer expects its results to reinforce the challenges facing the housing industry in a tightening interest-rate environment, similar to what investors heard from Lennar earlier last week.\n\nWednesday brings earnings from uniform rental provider Cintas and payroll company Paychex , which have significant exposure to small and medium-sized businesses.", "source": "CNBC Top News", "pub_date_str": "19 Sep 2026, 03:47 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic selects Accenture as first embedded evaluator to help implement Amodei's slowdown proposal", "full_content": "Anthropic on Friday announced it has selected Accenture as an embedded evaluator, the company's first concrete step toward implementing CEO Dario Amodei's proposal to slow down the pace of artificial intelligence development.\n\nBoth Anthropic and Accenture have agreed to invest at least $1 billion to \"building capacity in this area\" over the next five years, according to a release. But Anthropic said that given the \"importance and urgency,\" it will fund Accenture's work directly.\n\n\"Long-term, we think funding should come from pooled or government sources, as we called for in our Advanced AI Framework in June,\" Anthropic said. \"As neither exists today, we plan to work with different evaluators under different funding arrangements.\"\n\nOn Saturday, Amodei rocked the tech sector by publishing a three-step plan to temper how quickly AI companies improve their most advanced models. Anthropic and its chief rival, OpenAI , have been under intense scrutiny in recent weeks after a growing chorus of researchers warned about the potential for  but returns are only part of the comparison. Their capital gains tax treatment is different too. Here\u2019s what \u20b91 lakh invested 20 years ago could be worth today and how much an investor may keep after tax.", "source": "LiveMint Money", "pub_date_str": "19 Sep 2026, 01:56 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Netflix Stock Falls After Wells Fargo Downgrade: \u201cEngagement Trends Look Worrying to Us\u201d - hollywoodreporter.com", "full_content": "Netflix Stock Falls After Wells Fargo Downgrade: \u201cEngagement Trends Look Worrying to Us\u201d hollywoodreporter.com NFLX Stock Heads For 4-Day Slide, Extends September Losing Streak After Wells Fargo Flags \u201cWorrying\u201d Engagement In Downgrade Yahoo Finance Netflix Stock Falls After Downgrade. Why It\u2019s Losing the Streaming Wars to Disney. Barron's Wells Fargo downgrades Netflix to underweight on engagement risks (NFLX:NASDAQ) Seeking Alpha Netflix Stock Downgraded To Sell As Viewer Engagement Wanes Investor's Business Daily", "source": "Google News Business", "pub_date_str": "19 Sep 2026, 01:55 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US stocks today: US stocks slip as higher Treasury yields weigh on sentiment", "full_content": "US stocks ended mixed on Friday as Treasury yields topped 5% and crude oil stayed above $100 a barrel, keeping inflation worries alive. The Nasdaq gained as semiconductor stocks rallied, while the Dow slipped. Investors also assessed the Fed's rate outlook, triple witching volatility and fresh corporate developments.", "source": "Economic Times Markets", "pub_date_str": "19 Sep 2026, 01:45 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI cloud provider Nscale files to go public - cnbc.com", "full_content": "AI cloud provider Nscale files to go public cnbc.com Nvidia-Backed Data Center Firm Nscale Files Publicly for IPO Bloomberg.com Startup Nscale\u2019s CEO pay nearly matched the FTSE 100 record, because of course it did Financial Times Nvidia-backed AI cloud firm Nscale reveals revenue surge in US IPO filing reuters.com Nvidia-Backed Cloud Startup Nscale Files for IPO WSJ", "source": "Google News Business", "pub_date_str": "19 Sep 2026, 01:32 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "19 Sep 2026, 07:04 AM IST", "total_stories": 381};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
