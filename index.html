<script>

    const allData = {"general": [{"title": "Nvidia\u2019s turmoil is prompting a rotation across chip stocks. Here's what we know", "full_content": "Nvidia 's leadership crisis is creating an opening for its biggest rivals as well as partners, as investors bet that Jensen Huang's departure could loosen the AI chip giant's grip on an industry it has long dominated.\n\nFrom AMD to Broadcom and even partner TSMC , chipmakers are emerging as potential beneficiaries of the upheaval, with market watchers pointing to a possible redistribution of manufacturing capacity and a narrowing of Nvidia's technological lead.\n\n\"What you're seeing in markets now is a bit of a rotation into other advanced chip design companies, on the assumption that this will enable other companies effectively to catch up,\" said Mark Franklin, head of multi-asset solutions for Asia at Manulife Investment Management.\n\nThat shift comes as Nvidia grapples with the fallout from Huang's resignation, following revelations about his multiple affairs including with a woman believed by the U.S. intelligence community to be a Chinese spy .\n\nHuang's departure could give competitors an opportunity to close the gap as Nvidia navigates leadership uncertainty, Franklin highlighted, adding that the rotation was already helping fuel positive momentum in other semiconductor stocks.\n\nFarzin Azam, managing director of equities trading at Mizuho Americas, said the shift was evident on trading desks, with investors moving toward chipmakers less exposed to Nvidia's management turmoil.\n\n\"Names such as TSMC, names such as Broadcom, names such as Advanced Micro will come as winners of this because they don't have this overhang of a management disruption,\" Azam told CNBC.\n\nNvidia shares have plunged 11% so far this week, while rivals AMD and Broadcom have gained 30% and 24%, respectively.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:37 PM IST", "pub_date_relative": "5m ago"}, {"title": "Widespread Microsoft outage takes down Outlook and other 365 services", "full_content": "Microsoft suffered a widespread outage on Thursday and Friday, as engineers scrambled to fix server issues that caused disruption to millions of its customers around the world.\n\nConnectivity issues began shortly before 1 p.m. ET on Thursday and continued into Friday, with Outlook and Teams, along with multiple Microsoft 365 services such as Sharepoint and Copilot, affected. External services that connect with Outlook features such as Calendar were also hit.\n\nEmail and other tools were unavailable for Microsoft users through much of the Asian business day and into the European morning, though some access to Teams was restored.\n\nIn an update just before 7:30 a.m. in London (2:30 a.m. ET), Microsoft said users may still be unable to connect to multiple Microsoft 365 services, including Outlook on either web or desktop.\n\nIt did not give a timeline for restoring full service but said it was seeing \"positive results for server stability\" after applying a new patch fix to some infrastructure.\n\n\"As of now, we are not aware of any malicious activity that is causing this incident. We will continue to treat this incident with urgency and priority until full resolution,\" Microsoft said, adding that it would provide a full report with further details once the problem was mitigated.\n\nMicrosoft said on Thursday the connectivity problems related to infrastructure \"elevated load across multiple regions,\" caused by a \"number of servers being unexpectedly unavailable; straining the remaining infrastructure.\" Some servers were failing automated health checks, it said.\n\nGovernments and businesses in Asia-Pacific and Europe said they were monitoring the situation, which was causing widespread disruption.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:35 PM IST", "pub_date_relative": "7m ago"}, {"title": "Promoter holding at 3-year high, FII ownership at 14-year low: Did insiders buy what FIIs sold?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMUMBAI: Promoters are returning to the buy side of India's equity market after years of selling, even as foreign investors pare their holdings to a 14-year low. Could this shift signal that company insiders are finding value in stocks that foreign investors are exiting, and point to a broader market recovery?\n\nPrivate promoters held 41.93% of companies listed on the National Stock Exchange (NSE) at the end of the September 2026 quarter, their highest ownership since June 2023, when it stood at 42.16%, according to Prime Database. The last time it was significantly higher was September 2020, at 45.34%. The Nifty 50 went on to rally 57% over the following 12 months.\n\nPromoters did cash out between 2021 and early 2026. Shashank Udupa, a research analyst registered with the Securities and Exchange Board of India (Sebi) and founder of Vayu Capital, said founders monetized stakes amid a buoyant market and a strong initial public offering (IPO) window. He believes that phase is now over.\n\n\u201cPromoters have now bought for four straight quarters, \u20b9 36,336 crore in the June quarter and \u20b9 6,595 crore in September,\u201d he said.\n\nThe shift comes as foreign institutional investor (FII) holding in NSE-listed companies has dropped to 15.57% as of end of the September quarter, the lowest in 14 years, since the June quarter of 2012, when it stood at 15.34%.\n\nDomestic institutional investor (DII) ownership, meanwhile, has climbed to a record 19.31% as of the September quarter, according to Prime Database.\n\nPromoter and DII holdings are rising even as FII ownership declines. However, the data does not establish that promoters are buying shares sold by foreign investors; domestic institutions, mutual funds, retail investors and others could also be absorbing the supply.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 01:35 PM IST", "pub_date_relative": "7m ago"}, {"title": "Morgan Stanley reiterates Overweight on Cerebras stock amid delays", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:34 PM IST", "pub_date_relative": "8m ago"}, {"title": "German wholesale prices climb 8.8% in October", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:34 PM IST", "pub_date_relative": "8m ago"}, {"title": "Everpure CEO Charles Giancarlo sells $7.05M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:31 PM IST", "pub_date_relative": "11m ago"}, {"title": "Tutor Perini director Reiss sells $831,012 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:31 PM IST", "pub_date_relative": "11m ago"}, {"title": "Ecolab director David MacLennan buys $184,875 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:30 PM IST", "pub_date_relative": "11m ago"}, {"title": "China\u2019s access to some Nvidia chips in doubt as curbs gain traction in US Congress", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:30 PM IST", "pub_date_relative": "12m ago"}, {"title": "Stock futures edge lower after markets slide amid Nvidia woes: Live updates", "full_content": "U.S. equity futures edged lower early Friday after major indexes declined and Nvidia shares fell, following the exit of its founder and CEO Jensen Huang amid an ongoing scandal.\n\nFutures tied to the Dow Jones Industrial Average were marginally down, while S&P 500 futures were down 0.12%. Nasdaq-100 futures fell 0.38%.\n\nThe action comes after the Nasdaq Composite and S&P 500 dropped about 0.4% each in regular trading. The Dow slid almost 190 points, or 0.4%. Nvidia's 4.3% decline dragged down the three major averages, even as the chip stock ended the session off its lows.\n\nAsia-Pacific markets were mostly lower, with South Korea's Kospi down 0.85% and Hong Kong's Hang Seng index down 1.4%. Mainland China's CSI 300 declined 0.66%. Japan's Nikkei 225 bucked the trend to rise 0.53%. Australia's S&P/ASX 200 fell 0.62%.\n\nOn Thursday, Huang stepped down from his post at the chip company following reported extramarital affairs , including a relationship with a woman U.S. intelligence officials believe is a Chinese spy. Analysts told CNBC that Huang's exit could trigger a 20% correction in the stock.\n\nNvidia's chief financial officer Colette Kress , who's worked at the company for more than a decade, will lead the chipmaker as interim CEO. The company's board is looking both internally and externally for a full-time replacement for Huang.\n\nA jump in oil prices also kept stocks under pressure Thursday, with Brent crude rising more than 3% on the day to settle at $95.82 a barrel. Oil climbed after President Donald Trump said in a Truth Social post , \"We don't need a deal with Iran.\" The comment raised concerns that the U.S.-Iran war could drag on further.\n\nAnother market catalyst awaits on Friday in the form of October's producer price index reading, a measure of wholesale inflation. Economists polled by Dow Jones see headline PPI rising 0.4% on the month and 6.6% from 12 months earlier.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:29 PM IST", "pub_date_relative": "13m ago"}, {"title": "Morgan Stanley downgrades Netskope stock rating on valuation concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:29 PM IST", "pub_date_relative": "13m ago"}, {"title": "Earnings call transcript: Precise Biometrics posts weak q3 2026 amid merger costs", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:27 PM IST", "pub_date_relative": "15m ago"}, {"title": "Global Microsoft outage leaves millions without access to Outlook email, Teams and other tools - CNN", "full_content": "Global Microsoft outage leaves millions without access to Outlook email, Teams and other tools CNN Microsoft outage live: Microsoft\u2019s global outage will cost Australia billions, expert says; US tech giants and Indian airlines also affected The Guardian Microsoft working \u2018urgently\u2019 to fix outages Al Jazeera Microsoft Outage Gums Up Markets, Forces Traders to Use Phones Bloomberg.com Microsoft outage hits companies and governments worldwide as it struggles to restore services The Seattle Times", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 01:27 PM IST", "pub_date_relative": "15m ago"}, {"title": "French consumer prices rose 0.4% in October 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:26 PM IST", "pub_date_relative": "16m ago"}, {"title": "Hyundai Insurance Q3 2026 slides: underwriting gains offset by losses", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:25 PM IST", "pub_date_relative": "17m ago"}, {"title": "Can Ola Electric\u2019s pivot to dealership model hedge revenue decline?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nOla Electric Mobility Ltd\u2019s September quarter (Q2FY27) brought no relief, with the electric two-wheeler maker reporting a higher-than-expected consolidated Ebitda loss of \u20b9 218 crore. The company\u2019s revenue was down 39% year-on-year to \u20b9 421 crore.\n\nOla\u2019s revenue has shrunk from about \u20b9 5,000 crore in FY24 to \u20b9 2,250 crore in FY26. H1FY27 revenue declined 42% year-on-year to \u20b9 875 crore. The revenue plunge reflects Ola\u2019s move from a high-growth, company-owned, direct-to-consumer (D2C) model to a dealership-based model.\n\nThe transition is yet to translate into better quarterly operating performances. Ola needs this shift to yield the desired results in terms of recovering volumes and protecting profit margins.\n\nIndia\u2019s electric two-wheeler market is expanding rapidly, with industry volumes reaching 599,000 units in Q2, up almost 83% year-on-year, as per government vehicle registration data. But Ola\u2019s growth trajectory has diverged. However, Ola\u2019s vehicle deliveries were down 34% year-on-year to 34,667 units in Q2.\n\nThe trend persisted in October too, when electric two-wheeler registrations reached 224,064 units, up 48% year-on-year, while Ola\u2019s dropped by 26% to about 12,000 units. Ola\u2019s market share narrowed to 5.4% in October from about 35% in 2024.\n\n\u201cThe company will have to sustainably reach 25,000 monthly volumes in order to achieve cash breakeven levels,\u201d said analysts from Kotak Institutional Equities. They added that the quarterly consolidated free cash flow outflow of \u20b9 350 crore remains an area of concern.\n\nOn the Q2 earnings call, Ola\u2019s management said demand now exceeds supply, citing a paid-order backlog and delayed delivery of roughly 5,000 units due to a charger shortage.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 01:24 PM IST", "pub_date_relative": "18m ago"}, {"title": "Astro-tourism is on the rise in India: Travellers look beyond hills and beaches; how much does a \u2018cosmic trip\u2019 cost?", "full_content": "More travellers in India are planning holidays around what they can see after sunset. Hills and beaches still draw crowds, but dark skies offer another reason to travel. This growing interest in travelling to watch the night sky is called astro-tourism. The experience can be as simple as spotting the Milky Way with your own eyes.\n\nIn Ladakh , Hanle is home to India's first Dark Sky Reserve. The village sits above 4,500 metres and houses the Indian Astronomical Observatory. Limits on bright lights help keep the skies dark.\n\nOn clear nights, visitors can spot planets, star clusters and even meteor showers. Some homestays arrange stargazing sessions with local guides.\n\nSpiti Valley offers a mountain setting for stargazing. Remote villages like Kaza, Langza and Hikkim have little artificial lighting. Monasteries and prayer flags form part of the backdrop.\n\nIn summer, fewer clouds and drier air can improve visibility in Hanle and Spiti. That makes the season suitable for first-time stargazers and people who photograph the night sky.\n\nThe white salt flats of the Rann of Kutch offer a wide, open horizon. The flat landscape gives visitors an open view of the sky in every direction. Some local camps pair astronomy sessions with folk music.\n\nIn Kanha and Pench, visitors can watch the stars after a day of tracking tigers. Forest lodges often hold sessions in open clearings. Visitors may hear insects, rustling leaves, and distant animal calls as they look up.\n\nBeginners can use a phone app to identify stars and planets. Binoculars can help them see more. Camps in Hanle, Spiti and Kutch offer guided telescope sessions and workshops on photographing stars. The trips also give travellers time to slow down and spend a quiet evening outdoors.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 01:22 PM IST", "pub_date_relative": "20m ago"}, {"title": "List: Which everyday expenses are hitting your pocket harder as CPI crosses 6%, food inflation nears 9% in Oct 2026?", "full_content": "India's retail inflation accelerated in October 2026, putting household budgets under pressure as prices of several essential goods and services continued to rise. Consumers faced higher inflation in food, transport, clothing, restaurants and other everyday expenses, adding to the cost of managing monthly household budgets.\n\nThe Consumer Price Index ( CPI ) inflation rose to 6.09% in October 2026, from 5.54% in September 2026, crossing the Reserve Bank of India's ( RBI ) upper tolerance limit of 6%.\n\nFood inflation also increased to 8.94% from 7.74% during the same period, according to data released by the Ministry of Statistics and Programme Implementation (MoSPI) on Thursday.\n\nHere is a look at the everyday expenses that are becoming costlier and how their inflation rates changed in October.\n\nThe Consumer Price Index (CPI) measures changes in the prices of goods and services that households regularly purchase. These include food, beverages, clothing, housing, transport, healthcare, education, and other everyday necessities.\n\nFor example, if a household basket cost \u20b9 100 in October 2025 and costs \u20b9 106.09 in October 2026, it represents a 6.09% increase in consumer prices over the year.\n\nSource: MoSPI; top five items recording the highest inflation at the all-India combined level.\n\nAt the all-India combined level, onion recorded the highest inflation among the listed individual items at 116.22% in October, up from 108.13% in September. This means onion prices were more than twice their year-ago level.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 01:20 PM IST", "pub_date_relative": "22m ago"}, {"title": "Trump calls Huang saga a 'horrible thing' and 'so sad to see'", "full_content": "Nvidia CEO Jensen Huang is stepping down as CEO of the chipmaker he co-founded 33 years ago and built into a $4 trillion company that powered the artificial intelligence boom, the company announced Thursday.\n\n\"The Board has full confidence in Colette and the leadership team, and we expect the company's operations, customer commitments and product roadmap to continue without interruption,\" said board chair Harvey Jones in a release announcing the news.\n\nThe company will begin the search for a permanent CEO to replace Huang and will consider both internal and external candidates, according to the release.\n\nKress also provided a statement in the release, but Huang was not quoted.\n\nAfter a meteoric rise to fame due to Nvidia's central role in AI, Huang's dramatic fall has been even more rapid, following a series of stinging revelations about his romantic ties to a woman believed by the U.S. intelligence community to be a Chinese spy.\n\nHuang, 63, apologized on Sunday for being \"unfaithful to my wife,\" though he provided no details about the affair with businesswoman Alice Huang, who has worked for a Chinese company and Nvidia customer called Megaspeed. Late Wednesday, The New York Times reported that the Nvidia CEO also had a separate affair, this one with Kimberly Powell, vice president of health care at the chipmaker. Later that afternoon, The Times and other outlets reported that Nvidia's board met to discuss the company's future.\n\nHuang's downfall also puts the spotlight on President Donald Trump , who formed a particularly close relationship with the CEO of what, until recently, was the world's most valuable company. Huang became a key voice on U.S.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:19 PM IST", "pub_date_relative": "22m ago"}, {"title": "Mega AI Anthropic IPO details: Share price band, valuation, listing date - All you need to know about the upcoming issue", "full_content": "Anthropic IPO : Artificial intelligence (AI) startup Anthropic is gearing up for one of the biggest stock market debuts, with its proposed initial public offering (IPO) attracting significant attention from global investors.\n\nThe company behind the Claude AI chatbot has launched its IPO roadshow, targeting a fundraising of up to $64.4 billion through the sale of 825 million shares. Anthropic has set an indicative price band of $70-$78 per share, while its proposed fully diluted valuation could reach approximately $1.41 trillion.\n\nAnthropic has fixed an indicative price band of $70-$78 per share for its proposed IPO. The company plans to offer 825 million shares of Class A common stock, including 801.35 million shares issued by the company and 23.65 million shares offered by existing shareholders.\n\nAt the upper end of the price band, the offering could raise approximately $64.4 billion, making it one of the largest IPOs in global stock market history.\n\nThe company has also granted underwriters an option to purchase up to an additional 123.75 million shares within 30 days of the offering.\n\nAnthropic is targeting a fully diluted valuation of up to approximately $1.41 trillion at the upper end of its IPO price band. At the midpoint price of $74 per share, the company's valuation would be around $1.33 trillion on a fully diluted basis.\n\nHowever, the valuation is approximately $1 trillion when calculated excluding options and restricted stock, according to the company's IPO disclosures.\n\nApart from the public offering, Anthropic has also lined up a concurrent private placement worth $26 billion from major technology companies and strategic investors.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 01:11 PM IST", "pub_date_relative": "30m ago"}, {"title": "EPFO alert: Employers must file October 2026 ECR and deposit EPF contributions by November 15", "full_content": "The Employees\u2019 Provident Fund Organisation (EPFO) has reminded employers to file the Electronic Challan-cum-Return (ECR) for the October 2026 wage month and deposit the corresponding Employees\u2019 Provident Fund (EPF) contributions by November 15, 2026.\n\nEPFO issued the reminder on November 12 through its official X handle. Employers should complete both the return filing and the payment by the deadline to ensure contributions are credited on time and late payment charges are avoided. For any queries, employers can visit the EPFO website or check the full post.\n\n\u0905\u0915\u094d\u091f\u0942\u092c\u0930 2026 \u0935\u0947\u0924\u0928 \u092e\u093e\u0939 \u0915\u093e ECR \u0914\u0930 \u0926\u0947\u092f EPF \u0905\u0902\u0936\u0926\u093e\u0928 15 \u0928\u0935\u0902\u092c\u0930 \u0924\u0915 \u091c\u092e\u093e \u0915\u0930\u0928\u093e \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0947\u0902\u0964\n\n\u0938\u092e\u092f \u092a\u0930 \u0905\u0928\u0941\u092a\u093e\u0932\u0928 \u0938\u0947 \u0915\u0930\u094d\u092e\u091a\u093e\u0930\u093f\u092f\u094b\u0902 \u0915\u0947 \u0916\u093e\u0924\u094b\u0902 \u092e\u0947\u0902 \u0905\u0902\u0936\u0926\u093e\u0928 \u0915\u093e \u0938\u092e\u092f \u092a\u0930 \u0915\u094d\u0930\u0947\u0921\u093f\u091f \u0939\u094b\u0917\u093e \u0914\u0930 \u0935\u093f\u0932\u0902\u092c \u0936\u0941\u0932\u094d\u0915 \u0938\u0947 \u092d\u0940 \u092c\u091a\u093e\u0935 \u0939\u094b\u0917\u093e\u0964\n\nEnsure that the ECR for the October 2026 wage month and the EPF contributions due are submitted by November 15.\n\nTimely compliance will ensure that contributions are credited to employees' accounts on time and will also help avoid late payment charges.\"\n\nThe Electronic Challan-cum-Return (ECR) is the monthly electronic return that helps ensure employers report employees' provident fund contributions and submit the corresponding payment details. Timely submission and filing of these returns and payment details are critical for maintaining regular EPFO compliance.\n\nHence, employers should verify employee details , personal data, wage particulars, and contribution calculations before submitting the return. They should also ensure the payment is cleared successfully by the stipulated deadline.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 01:11 PM IST", "pub_date_relative": "31m ago"}, {"title": "Q2 Results Live: Gillette India Profit Rises 10%, Goodyear India Profit Rises 31%; Eicher Motors, Grasim Also In Focus", "full_content": "Grasim Industries, Eicher Motors, ABB India, TMPV, RVNL, Godrej Industries, and Gillette India hundreds of other companies are scheduled to announce their Q2 results today. Track the latest earnings announcements, financial performance, and management commentary live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 01:07 PM IST", "pub_date_relative": "35m ago"}, {"title": "IRCTC, RVNL, IRFC, RailTel to IRCON: Railway stocks fall up to 3%; opportunity to buy on dip? Experts' views, target, SL", "full_content": "Asit Manohar Published 13 Nov 2026, 01:04 PM IST Prefer Livemint on Google Following the weak trends in the Indian stock market, railway stocks are under pressure since morning. Flagship railway stock, IRCTC is down by near 3%, RVNL share price is down by around 2.50%, IRCON International and Railtel Corporation shares are down by around 2%, RailTel Corporation share price, whereas IRFC share price today is down by around 1.90%.\n\nAccording to stock market experts, railway stocks are under pressure due to a mix of fundamental corrections, margin pressures, and broader market headwinds. FII outflows, rebalancing valuations, and macro headwinds are some other reasons that are dragging the railway stocks, say experts.\n\nHighlighting the reasons behind the selling pressure in the railway stocks today, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cRailway stocks are currently under pressure and trading down significantly due to a mix of fundamental corrections, margin pressures, and broader market headwinds. Railway companies face margin compression due to lower-margin competitive open-bidding projects (moving away from purely nominated or high-margin rail contracts) and execution challenges in projects like Vande Bharat rollouts.\u201d\n\n\u201cThe railway sector faces a wider risk-off wave, FII outflows, and monthly F&O expiry volatility impacting high-beta and capex-heavy PSUs. Investors are closely tracking quarterly results and order book execution speed to see if revenue growth can justify previous high price-to-earnings (P/E) multiples,\u201d said Anuj Gupta, a SEBI-registered market expert.\n\nIf this fall in the railway stocks an opportunity for bottom fishing, Avinash Gorakshkar said, \u201cThose looking for a value pick can look at IRFC shares. The company deals in the credit lending and some recent Capex pipeline announcement are expected to benefit IRFC.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 01:04 PM IST", "pub_date_relative": "38m ago"}, {"title": "Amitabh Bachchan Returns To Kaun Banega Crorepati 18 After Health Break | Watch", "full_content": "Amitabh Bachchan had stepped away from Kaun Banega Crorepati and social media to take some rest, which left fans waiting for news about his return.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 01:00 PM IST", "pub_date_relative": "42m ago"}, {"title": "Nvidia without Jensen Huang. What lies ahead for Asian chipmakers?", "full_content": "Nvidia's leadership shake-up is unlikely to cause immediate disruption for major Asian semiconductor suppliers, such as Samsung Electronics and Taiwan Semiconductor Manufacturing Co., but Jensen Huang's departure has raised questions about the company's longer-term product strategy and supply chain relationships.\n\nThe bigger issue for investors and suppliers is whether Nvidia can maintain the pace of innovation and close ties with key partners that Huang helped drive as the company built its dominance in artificial intelligence chips.\n\nIn a Friday research note, Nam Dae-jong and Kim Yeon-mi, analysts at South Korean brokerage Daol Investment & Securities, said Huang's departure was unlikely to affect the semiconductor industry's near-term outlook.\n\nHowever, they flagged uncertainty over Nvidia's medium- to long-term product roadmap, including how its new leadership would coordinate with partners across the AI ecosystem.\n\nFor chipmakers in Asia, one key question is whether Nvidia's relationships with its manufacturing partners could change under new leadership.\n\nNam and Kim expect Nvidia's foundry relationship with TSMC to remain unchanged, given the companies' established partnership.\n\nThey also expect Nvidia's relationship with Samsung's foundry business to continue, citing growing cooperation between the companies, including manufacturing involving Samsung's 4-nanometer process and work on next-generation high-bandwidth memory technology.\n\nThe analysts said custom AI chips, or application-specific integrated circuits, or ASICs, are emerging as alternatives to Nvidia's graphic processing units and could accelerate diversification in the AI chip market.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 12:59 PM IST", "pub_date_relative": "43m ago"}, {"title": "Has Jensen Spy Narrative Run Ahead of Evidence? 6 Points That Question Espionage Theory", "full_content": "The US has not established that Alice Huang was a Chinese spy, while Singapore says it never investigated her for espionage. Six questions highlight the gaps in the narrative around Jensen Huang and NVIDIA.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:53 PM IST", "pub_date_relative": "49m ago"}, {"title": "Kwality Walls shares rally 8.5% today, up over 53% in 6 months - Should you still buy ice cream stock? Q2 highlights", "full_content": "Kwality Wall's (India) shares extended their winning streak for the third consecutive session on Friday, November 13, surging as much as 8.5% amid sustained buying interest.\n\nThe stock has gained over 14% in just four trading sessions, taking its rally to 94% from its 52-week low of \u20b9 22.25, recorded in March 2026. The latest surge has brought the stock closer to its 52-week high of \u20b9 50.64, touched in August 2026, although it remains below that level.\n\nThe stock opened at \u20b9 39.65 and climbed to an intraday high of \u20b9 43.10. Its recent performance has been equally impressive across different timeframes, with gains of 14% over one month, 15% in three months and 53% in six months.\n\nWith the stock witnessing renewed buying interest, investors are now assessing whether the rally has further room to run. Technical analysts have identified important support and resistance levels that could determine its next move.\n\nKwality Wall's reported a net loss of \u20b9 17.2 crore in Q2 FY27 , significantly lower than the loss of \u20b9 100.2 crore in the corresponding quarter last year. Revenue from operations stood at \u20b9 463.6 crore, while sales of products amounted to \u20b9 453 crore.\n\nThe company recorded organic sales growth of 42.2%, supported by volume growth of 31.8% and price growth of 7.9%. However, revenue from operations declined 47.3% sequentially from \u20b9 879.8 crore in Q1 FY27, when it had reported a net profit of \u20b9 50.7 crore.\n\nDespite the quarterly loss, EBITDA before exceptional items remained positive at \u20b9 27.2 crore, with a margin of 6%. Gross margin improved 282 basis points year-on-year to 46.4%, supported by a favourable product mix, productivity measures and disciplined pricing, despite higher input costs associated with the transition of its in-home portfolio to dairy-based products.\n\nThe company said the quarter marked its highest organic sales growth in the last 16 quarters, with volumes contributing the largest share.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:53 PM IST", "pub_date_relative": "49m ago"}, {"title": "SpiceJet Share Price Hits 5% Upper Circuit After Fundraising Plan Announcement. Flies 13% In Three Sessions", "full_content": "The company proposes to raise funds by way of issuance of equity shares, preference shares, debt securities and/or other permissible instruments, through preferential issue, qualified institutions placement or any other mode.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:52 PM IST", "pub_date_relative": "50m ago"}, {"title": "Isabel Schnabel: Made in Europe", "full_content": "We are living through a period of radical transformation. Technological progress is accelerating alongside profound geopolitical shifts, rewriting the rules that have governed global growth, trade and security for decades. [ 1 ]\n\nIn this polarised world, Europe is often portrayed as a continent in decline, squeezed between geopolitical rivals, held back by excessive regulation and struggling to keep pace with rapid technological change.\n\nIn my remarks this morning, I will argue that although this narrative is appealing in its simplicity, it is misleading.\n\nBy many measures, Europe is among the regions with the highest quality of life, grounded in strong institutions, a high degree of social protection and an exceptional capacity to adapt in times of crisis.\n\nEurope can build on these fundamentals to become even stronger.\n\nI will explain that the key is to unlock the full potential of the Single Market \u2013 one of Europe\u2019s most powerful assets \u2013 to deliver what Europe lacks today: not talent, not ideas, not research \u2013 but scale.\n\nBy giving firms seamless access to the entire European market, it would provide the scale needed to convert innovation into economic growth. It would allow Europe to compete as one economy rather than 27, and help create something Europe has long been missing: a true \u201cMade in Europe\u201d brand.\n\nEurope stands out globally for its quality of life, built on strong economic, social and institutional foundations.", "source": "ECB Press", "pub_date_str": "13 Nov 2026, 12:50 PM IST", "pub_date_relative": "52m ago"}, {"title": "Happy Children\u2019s Day 2026 Speech Ideas: Five Speeches In English For Students", "full_content": "Children's Day is celebrated across India every year on November 14 to mark the birth anniversary of the country's first PM Jawaharlal Nehru.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:49 PM IST", "pub_date_relative": "52m ago"}, {"title": "1,600 Nvidia Employees Rally Behind Jensen Huang, Demand Boss' Return After Exit Over Affair", "full_content": "The staffer said they stood by Huang not because they believed anyone was infallible, but because backing fairness should not mean keeping a distance from a leader who had meant so much to the company.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:49 PM IST", "pub_date_relative": "53m ago"}, {"title": "Why Singapore keeps turning up in the fight over Nvidia chips and China", "full_content": "Singapore, a hub for billions of dollars' worth of Nvidia sales each year, finds itself increasingly in the crosshairs of Washington's push to stop advanced AI chips from reaching China, as the chipmaker CEO's scandal once again thrusts the city-state into the spotlight.\n\nThe Southeast Asian nation said Thursday that it had barred Alice Huang, the businesswoman at the center of a scandal that catalyzed the end of Jensen Huang's run as Nvidia CEO, from re-entering the country.\n\nA fifth person was handed 41 charges on Friday in a Singapore fraud case involving computer servers that might have contained Nvidia chips and were exported to Malaysia. The alleged transactions in the broader case totaled about $390 million, prosecutors said March last year.\n\nThe investigations into several companies and key officials, including Megaspeed International, began in February 2025 and remained ongoing as of Thursday.\n\nAuthorities have been examining whether servers exported through Singapore to Malaysia without entering the domestic market were subsequently rerouted to another destination, contrary to declarations made in Singapore, the Ministry of Home Affairs said in a statement late Thursday.\n\nSingapore has faced growing international scrutiny, particularly from the U.S., over its role as a major billing and potential transit hub for Nvidia chips that U.S. officials say have reached China.\n\nThe U.S. has imposed export restrictions on Nvidia's most cutting-edge AI chips to China since 2022 to curb Beijing's surging AI development.\n\nNvidia's revenue linked to Singapore rose to 22% in the fiscal quarter ending July 2025, up from 8% in 2023, with the country's trade ministry estimating chips physically delivered there accounted for less than 1% of the chipmaker's revenue.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 12:45 PM IST", "pub_date_relative": "57m ago"}, {"title": "AI agents shouldn\u2019t have to pretend to be us", "full_content": "Service providers from banks to online platforms need to offer a standard channel of access on fair terms", "source": "FT Markets", "pub_date_str": "13 Nov 2026, 12:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Who Is Maruthi R Akella? IISc Honours Scientist Whose Algorithms Helped Guide IM-1 Lunar Lander", "full_content": "Akella's recognition highlights the global impact of IISc alumni.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Four SpiceJet Flights Cancelled From Dubai Airport, DNATA Suspends Check-In Services", "full_content": "SpiceJet cancelled four Dubai flights on November 12 after Dnata halted check-in services over unpaid dues.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold Price Jumps By Rs 1,300, But Rate Still Below Rs 1,37,000 On MCX", "full_content": "Gold prices rebounded as bargain hunting and technical buying supported bullion after a nearly 3% decline in international prices in the previous session.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "After IPO listing, NSE shares hit \u20b92,000 mark for the first time - Buy, sell or hold? What stock market experts say", "full_content": "NSE share price: Extending the uptrend during the early morning session on Friday, NSE shares crossed the psychological \u20b9 2000 mark and hit a new peak of \u20b9 2007.60 per share on the BSE. While hitting this new peak, the NSE shares crossed the \u20b9 2000 mark for the first time after the IPO listing. By 11:50 AM, the NSE share price was trading around \u20b9 1,988 per share, up over 21% from the 52-week low of \u20b9 1,640.25 per share. This 52-week low was made after the selling pressure witnessed in the NSE shares after listing of the NSE IPO in September 2026.\n\nAccording to stock market experts, NSE shares have been on an uptrend after hitting the 52-week low of \u20b9 1640.25 per share. They said that NSE share price has crossed the psychological \u20b9 2000 for the first time post-IPO listing. So, it would be important to see whether it closes above the net weighted average price of \u20b9 1995, or below this level.\n\nCalling NSE shares as a hedge against volatility, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cNSE is a market leader in cash equities, index F&O, stock F&O, and clearing & settlement. Around 60% of its operating revenue comes from the F&O derivative trading, which is almost unchallenged with BSE being the nearest rival with a long gap. So, NSE is expected to continue its uptrend as it reported a strong Q2 Results 2026. Its subsidiary NSE Clearing reported a total income of \u20b9 1,152 crore (up 16% YoY) and a PAT of \u20b9 597 crore in H1 FY27.\u201d\n\nJefferies India is also bullish on NSE shares. The global investment bank expects a fast growth in the NSE's revenue. Jefferies India believes the NSE's operating revenue CAGR was 6% between FY24-26, as its equity F&O business was adversely impacted by regulatory changes and higher taxes. We think these are now largely in the base.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tesla-SpaceX Merger: Musk eyes December deal announcement", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Tesla-SpaceX Merger: Musk eyes December deal announcement Written by Anupam Nagar , ETMarkets.com | Nov 13, 2026, 12:44:25 PM IST 1 / 5 Tesla-SpaceX Merger Could Be Announced In December Elon Musk's Tesla and SpaceX are reportedly making progress on merger discussions, with an announcement possible as early as December. The proposed combination could become one of the largest corporate transactions in history. The announcement could coincide with Tesla's December 3 annual shareholder meeting, although the timeline could extend into early 2027. (Sources: TradingView, Investors.com)\n\nNegotiations have reportedly advanced to discussions over deal structure, valuation and governance arrangements. Boards and advisers from both companies are involved in the process, with independent director committees established to evaluate a potential combination. However, no final agreement has been reached, and there is no guarantee that a deal will materialise.\n\nA merger could bring together SpaceX's estimated $1.9 trillion valuation and Tesla's market capitalisation of approximately $1.6 trillion. The combination would bring Musk's major businesses under one corporate structure and could rank among the largest mergers ever. The share-exchange ratio and ownership allocation between investors remain key issues in the negotiations.\n\nThe proposed merger could combine Tesla's electric vehicle and robotics operations with SpaceX's aerospace and satellite businesses. Both companies have overlapping ambitions in artificial intelligence and advanced computing, creating potential opportunities in AI software, chip design, robotics and SpaceX's Starlink satellite network.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Leh road trip turns into nightmare for Royal Enfield owner after bike loses power: How he won \u20b91 lakh in consumer court?", "full_content": "A motorcycle breakdown during a high-altitude road trip can quickly turn an adventure into a nightmare, particularly when the vehicle develops trouble despite being serviced before the journey. A Royal Enfield owner's experience on a Leh trip eventually turned into a consumer dispute over the service provided before his ride.\n\nThe South Delhi District Consumer Disputes Redressal Commission has directed Eicher Motors and Noida-based Shree Mahadev Motors to jointly pay \u20b9 1 lakh to the motorcycle owner over the incident. The commission passed its order on 4 November 2026.\n\nRoyal Enfield is a motorcycle brand owned by Eicher Motors , which manufactures and markets its motorcycles in India and international markets. Here's what happened and how the bike owner won the case.\n\nThe complainant, Hasan Murtaza, purchased a Royal Enfield Interceptor 650 from Ess Aar Motors on 13 April 2019. Before travelling to Leh in September 2021, he took the motorcycle to Shree Mahadev Motors in June 2021 for servicing.\n\nMurtaza informed the centre about his planned high-altitude journey and requested an electronic control unit (ECU) update to address reported power-loss issues at high altitudes. He alleged that the service centre assured him that the update had been installed and the motorcycle was ready for the trip.\n\nHowever, during the journey, the motorcycle reportedly lost power at an altitude of around 15,912 feet. Murtaza claimed that he had to drag the approximately 200 kg motorcycle downhill to get it started again. The problem continued during the ride to Leh, where he arrived on 21 September 2021.\n\nHe took the motorcycle to an authorised Royal Enfield service centre the following day. He was informed that the ECU update had not been carried out and that the workshop did not have the necessary equipment to perform it.\n\nConcerned about the motorcycle's condition, Murtaza left it at a hotel in Leh before eventually returning to collect it.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Zee Entertainment buyback: What happened with ZEEL stock after \u20b9600 cr announcement? Check record date, price", "full_content": "Pranati Deva Published 13 Nov 2026, 12:20 PM IST Prefer Livemint on Google Zee Entertainment Enterprises has announced a \u20b9 600 crore share buyback, offering shareholders an opportunity to tender their shares at \u20b9 91 apiece. The company's board approved the proposal on November 12, 2026, for the buyback of up to 6.59 crore fully paid-up equity shares with a face value of \u20b9 1 each.\n\nThe media stock fell over 3% on Friday, Nov 13, to its day's low of \u20b9 75.49 per share on BSE post the announcement of the buyback. The stock has lost 3% in 1 month, 26% in 3 months, 19% in 6 months and 28% in last 1 year.\n\nThe proposed buyback will be conducted through the tender offer route on a proportionate basis, with November 25, 2026, fixed as the record date to determine eligible shareholders.\n\nThe company said the move followed a detailed assessment of its financial position, free cash flow, business outlook and shareholder expectations. Here are the key things investors should know about the proposed Zee Entertainment buyback.\n\nZee Entertainment's board has approved a buyback of up to 6,59,34,065 fully paid-up equity shares, representing up to 6.86% of the company's existing paid-up equity share capital. The total buyback amount has been capped at \u20b9 600 crore.\n\nThe buyback size represents 7.22% and 6.61% of the aggregate paid-up equity share capital and free reserves, based on the company's latest standalone and consolidated audited financial statements, respectively, as of March 31, 2026.\n\nThe company has fixed the buyback price at \u20b9 91 per equity share, payable in cash. The offer will be made to shareholders and beneficial owners whose names appear on the company's records as of the record date.\n\nThe board has also authorised the possibility of revising the buyback price upwards and reducing the number of shares proposed to be bought back, provided the overall buyback size remains unchanged. Such a revision can be made up to one working day before the record date.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Alice Huang-Linked Firm Procured Banned Nvidia Chips in China - Bloomberg.com", "full_content": "Alice Huang-Linked Firm Procured Banned Nvidia Chips in China Bloomberg.com Chinese AI sell-off deepens over fears of tougher Nvidia chip restrictions Financial Times How Jensen Huang\u2019s ouster is paving the way for the policy outcome he fiercely battled Politico Nvidia Fallout Hits Alibaba and Other China Stocks as Tighter Regulation Looks Likely Barron's China's access to some Nvidia chips in doubt as curbs gain traction in US Congress Reuters", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 12:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pink Line Metro, Vande Bharat Train: PM Modi To Take Part In Series Of Events In Karnataka", "full_content": "PM Modi will flag off the services on the new metro line and take a ride from Tavarekere to IIM Bangalore metro station.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "'What If Alice Huang Isn't A Spy?': Founder Floats Counter Theory On Jensen Huang Exit From Nvidia", "full_content": "French entrepreneur Arnaud Bertrand pointed to reports that Beijing had ordered Alibaba and ByteDance to cancel Nvidia orders and sent customs teams to ports to inspect advanced chips.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 12:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why Page Industries\u2019 optimism needs a reality check", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nPage Industries Ltd. is aiming high. Despite achieving 5.6% volume growth in the first half of FY27 (H1FY27), it is targeting double-digit growth for the full year. The company expects sales to accelerate in H2, driven by festive demand and new launches across key categories. The management said its newly launched Disney and Marvel collections have received an encouraging response from consumers.\n\nPage Industries manufactures, markets and distributes apparel brands such as Jockey and Speedo.\n\n\u201cAchieving the full-year double-digit volume growth guidance now requires around 14% volume growth in H2FY27, making the recovery fairly demanding,\u201d said Systematix Shares and Stocks (India).\n\nPage Industries\u2019 optimism on volume growth is yet to reflect in its earnings performance. In the June quarter (Q1FY27), Page lost 3-4 billing days due to the implementation of its auto replenishment system, with a corresponding benefit expected in Q2. But that did not play out. While volumes grew in double digits in July and August, September sales were muted. The festive shift to Q3 deferred primary volumes, while product availability challenges in select categories led to lower fulfilment rates.\n\nPage acknowledged supply-side constraints, with order fulfilment declining from its historical 98-99% levels to 96-97% in Q2. This led to an estimated 3-4% loss in primary orders, particularly in men\u2019s innerwear and women\u2019s outerwear. Volumes grew 5.5% in Q2, while revenue rose 11.5% year-on-year, aided by price hikes and premiumization.\n\nRaw material inflation pulled gross margin down 272 basis points (bps) year-on-year to 57.2%. The pressure was partially offset by a 2.5% price hike. Inflationary pressures have persisted, with the benefit of low-cost inventory exhausted in Q1.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Value Nvidia, not Huang", "full_content": "Plus, sclerotic labour markets", "source": "FT Markets", "pub_date_str": "13 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Saw 100 Foot Crane Falling Towards Me': Kajal Aggarwal Recalls Terrifying Accident On Indian 2 Set", "full_content": "A 100 foot tall crane suddenly fell while Indian 2 team was shooting an action scene, which took three lives and left several people injured.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rs 10 Lakh In One Bank Or Rs 5 Lakh Each In Two Banks: Is Your Money Equally Protected?", "full_content": "Cybercrimes, internal frauds and many other factors can put your money at risk.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic IPO how to apply from India: Can Indian investors apply online? Check eligibility and step by step bid guide", "full_content": "Anthropic IPO: Anthropic, the AI firm behind the Claude chatbot, is gearing up for its stock market debut, giving investors an opportunity to gain exposure to the rapidly expanding generative AI sector.\n\nAnthropic has set its IPO price range at $70 to $78 per share for an offering of 825 million shares of Class A common stock on the Nasdaq under the ticker symbol \"ANT\".\n\nFor Indian investors, the proposed listing raises several questions, including whether they are eligible to subscribe to the IPO, how they can buy Anthropic shares and the tax implications of investing in overseas stocks.\n\nWith Anthropic targeting a valuation of up to $1.4 trillion and planning to raise as much as $64.4 billion, the offering could become one of the largest IPOs in stock market history. However, Indian investors may face an important limitation: India is not included in the list of countries covered under Anthropic's proposed international retail IPO programme.\n\nAccording to the list of international retail brokers and selling agents shared by Anthropic on its Claude Help Centre, the proposed retail IPO offering will be available across Australia, Canada, Japan, the UK, Switzerland and nine European countries, including Denmark, Finland, France, Germany, Ireland, the Netherlands, Norway, Spain and Sweden. India, however, is not included in the list of eligible markets.\n\nAnthropic has also clarified that it has not authorised any other firm or platform to promote or facilitate access to shares under its international retail offering.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 11:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "OM Director Reveals Mammootty's Unique Script Preparation Method: 'He Took His Own Time\u2019", "full_content": "OM director Rajkumar Periasamy recently shared how much effort Mammootty puts behind a film before shooting begins.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "NSEIX Global Access Expands Investment Opportunities Across European Markets", "full_content": "A key part of the expansion is access to UCITS ETFs, which are investment funds listed and traded on stock exchanges and follow the European regulatory framework.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Nvidia\u2019s turmoil is prompting a rotation across chip stocks. Here's what we know", "full_content": "Nvidia 's leadership crisis is creating an opening for its biggest rivals as well as partners, as investors bet that Jensen Huang's departure could loosen the AI chip giant's grip on an industry it has long dominated.\n\nFrom AMD to Broadcom and even partner TSMC , chipmakers are emerging as potential beneficiaries of the upheaval, with market watchers pointing to a possible redistribution of manufacturing capacity and a narrowing of Nvidia's technological lead.\n\n\"What you're seeing in markets now is a bit of a rotation into other advanced chip design companies, on the assumption that this will enable other companies effectively to catch up,\" said Mark Franklin, head of multi-asset solutions for Asia at Manulife Investment Management.\n\nThat shift comes as Nvidia grapples with the fallout from Huang's resignation, following revelations about his multiple affairs including with a woman believed by the U.S. intelligence community to be a Chinese spy .\n\nHuang's departure could give competitors an opportunity to close the gap as Nvidia navigates leadership uncertainty, Franklin highlighted, adding that the rotation was already helping fuel positive momentum in other semiconductor stocks.\n\nFarzin Azam, managing director of equities trading at Mizuho Americas, said the shift was evident on trading desks, with investors moving toward chipmakers less exposed to Nvidia's management turmoil.\n\n\"Names such as TSMC, names such as Broadcom, names such as Advanced Micro will come as winners of this because they don't have this overhang of a management disruption,\" Azam told CNBC.\n\nNvidia shares have plunged 11% so far this week, while rivals AMD and Broadcom have gained 30% and 24%, respectively.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:37 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Widespread Microsoft outage takes down Outlook and other 365 services", "full_content": "Microsoft suffered a widespread outage on Thursday and Friday, as engineers scrambled to fix server issues that caused disruption to millions of its customers around the world.\n\nConnectivity issues began shortly before 1 p.m. ET on Thursday and continued into Friday, with Outlook and Teams, along with multiple Microsoft 365 services such as Sharepoint and Copilot, affected. External services that connect with Outlook features such as Calendar were also hit.\n\nEmail and other tools were unavailable for Microsoft users through much of the Asian business day and into the European morning, though some access to Teams was restored.\n\nIn an update just before 7:30 a.m. in London (2:30 a.m. ET), Microsoft said users may still be unable to connect to multiple Microsoft 365 services, including Outlook on either web or desktop.\n\nIt did not give a timeline for restoring full service but said it was seeing \"positive results for server stability\" after applying a new patch fix to some infrastructure.\n\n\"As of now, we are not aware of any malicious activity that is causing this incident. We will continue to treat this incident with urgency and priority until full resolution,\" Microsoft said, adding that it would provide a full report with further details once the problem was mitigated.\n\nMicrosoft said on Thursday the connectivity problems related to infrastructure \"elevated load across multiple regions,\" caused by a \"number of servers being unexpectedly unavailable; straining the remaining infrastructure.\" Some servers were failing automated health checks, it said.\n\nGovernments and businesses in Asia-Pacific and Europe said they were monitoring the situation, which was causing widespread disruption.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:35 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Promoter holding at 3-year high, FII ownership at 14-year low: Did insiders buy what FIIs sold?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMUMBAI: Promoters are returning to the buy side of India's equity market after years of selling, even as foreign investors pare their holdings to a 14-year low. Could this shift signal that company insiders are finding value in stocks that foreign investors are exiting, and point to a broader market recovery?\n\nPrivate promoters held 41.93% of companies listed on the National Stock Exchange (NSE) at the end of the September 2026 quarter, their highest ownership since June 2023, when it stood at 42.16%, according to Prime Database. The last time it was significantly higher was September 2020, at 45.34%. The Nifty 50 went on to rally 57% over the following 12 months.\n\nPromoters did cash out between 2021 and early 2026. Shashank Udupa, a research analyst registered with the Securities and Exchange Board of India (Sebi) and founder of Vayu Capital, said founders monetized stakes amid a buoyant market and a strong initial public offering (IPO) window. He believes that phase is now over.\n\n\u201cPromoters have now bought for four straight quarters, \u20b9 36,336 crore in the June quarter and \u20b9 6,595 crore in September,\u201d he said.\n\nThe shift comes as foreign institutional investor (FII) holding in NSE-listed companies has dropped to 15.57% as of end of the September quarter, the lowest in 14 years, since the June quarter of 2012, when it stood at 15.34%.\n\nDomestic institutional investor (DII) ownership, meanwhile, has climbed to a record 19.31% as of the September quarter, according to Prime Database.\n\nPromoter and DII holdings are rising even as FII ownership declines. However, the data does not establish that promoters are buying shares sold by foreign investors; domestic institutions, mutual funds, retail investors and others could also be absorbing the supply.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 01:35 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures edge lower after markets slide amid Nvidia woes: Live updates", "full_content": "U.S. equity futures edged lower early Friday after major indexes declined and Nvidia shares fell, following the exit of its founder and CEO Jensen Huang amid an ongoing scandal.\n\nFutures tied to the Dow Jones Industrial Average were marginally down, while S&P 500 futures were down 0.12%. Nasdaq-100 futures fell 0.38%.\n\nThe action comes after the Nasdaq Composite and S&P 500 dropped about 0.4% each in regular trading. The Dow slid almost 190 points, or 0.4%. Nvidia's 4.3% decline dragged down the three major averages, even as the chip stock ended the session off its lows.\n\nAsia-Pacific markets were mostly lower, with South Korea's Kospi down 0.85% and Hong Kong's Hang Seng index down 1.4%. Mainland China's CSI 300 declined 0.66%. Japan's Nikkei 225 bucked the trend to rise 0.53%. Australia's S&P/ASX 200 fell 0.62%.\n\nOn Thursday, Huang stepped down from his post at the chip company following reported extramarital affairs , including a relationship with a woman U.S. intelligence officials believe is a Chinese spy. Analysts told CNBC that Huang's exit could trigger a 20% correction in the stock.\n\nNvidia's chief financial officer Colette Kress , who's worked at the company for more than a decade, will lead the chipmaker as interim CEO. The company's board is looking both internally and externally for a full-time replacement for Huang.\n\nA jump in oil prices also kept stocks under pressure Thursday, with Brent crude rising more than 3% on the day to settle at $95.82 a barrel. Oil climbed after President Donald Trump said in a Truth Social post , \"We don't need a deal with Iran.\" The comment raised concerns that the U.S.-Iran war could drag on further.\n\nAnother market catalyst awaits on Friday in the form of October's producer price index reading, a measure of wholesale inflation. Economists polled by Dow Jones see headline PPI rising 0.4% on the month and 6.6% from 12 months earlier.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:29 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Morgan Stanley downgrades Netskope stock rating on valuation concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:29 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: Precise Biometrics posts weak q3 2026 amid merger costs", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 01:27 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Can Ola Electric\u2019s pivot to dealership model hedge revenue decline?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nOla Electric Mobility Ltd\u2019s September quarter (Q2FY27) brought no relief, with the electric two-wheeler maker reporting a higher-than-expected consolidated Ebitda loss of \u20b9 218 crore. The company\u2019s revenue was down 39% year-on-year to \u20b9 421 crore.\n\nOla\u2019s revenue has shrunk from about \u20b9 5,000 crore in FY24 to \u20b9 2,250 crore in FY26. H1FY27 revenue declined 42% year-on-year to \u20b9 875 crore. The revenue plunge reflects Ola\u2019s move from a high-growth, company-owned, direct-to-consumer (D2C) model to a dealership-based model.\n\nThe transition is yet to translate into better quarterly operating performances. Ola needs this shift to yield the desired results in terms of recovering volumes and protecting profit margins.\n\nIndia\u2019s electric two-wheeler market is expanding rapidly, with industry volumes reaching 599,000 units in Q2, up almost 83% year-on-year, as per government vehicle registration data. But Ola\u2019s growth trajectory has diverged. However, Ola\u2019s vehicle deliveries were down 34% year-on-year to 34,667 units in Q2.\n\nThe trend persisted in October too, when electric two-wheeler registrations reached 224,064 units, up 48% year-on-year, while Ola\u2019s dropped by 26% to about 12,000 units. Ola\u2019s market share narrowed to 5.4% in October from about 35% in 2024.\n\n\u201cThe company will have to sustainably reach 25,000 monthly volumes in order to achieve cash breakeven levels,\u201d said analysts from Kotak Institutional Equities. They added that the quarterly consolidated free cash flow outflow of \u20b9 350 crore remains an area of concern.\n\nOn the Q2 earnings call, Ola\u2019s management said demand now exceeds supply, citing a paid-order backlog and delayed delivery of roughly 5,000 units due to a charger shortage.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 01:24 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "List: Which everyday expenses are hitting your pocket harder as CPI crosses 6%, food inflation nears 9% in Oct 2026?", "full_content": "India's retail inflation accelerated in October 2026, putting household budgets under pressure as prices of several essential goods and services continued to rise. Consumers faced higher inflation in food, transport, clothing, restaurants and other everyday expenses, adding to the cost of managing monthly household budgets.\n\nThe Consumer Price Index ( CPI ) inflation rose to 6.09% in October 2026, from 5.54% in September 2026, crossing the Reserve Bank of India's ( RBI ) upper tolerance limit of 6%.\n\nFood inflation also increased to 8.94% from 7.74% during the same period, according to data released by the Ministry of Statistics and Programme Implementation (MoSPI) on Thursday.\n\nHere is a look at the everyday expenses that are becoming costlier and how their inflation rates changed in October.\n\nThe Consumer Price Index (CPI) measures changes in the prices of goods and services that households regularly purchase. These include food, beverages, clothing, housing, transport, healthcare, education, and other everyday necessities.\n\nFor example, if a household basket cost \u20b9 100 in October 2025 and costs \u20b9 106.09 in October 2026, it represents a 6.09% increase in consumer prices over the year.\n\nSource: MoSPI; top five items recording the highest inflation at the all-India combined level.\n\nAt the all-India combined level, onion recorded the highest inflation among the listed individual items at 116.22% in October, up from 108.13% in September. This means onion prices were more than twice their year-ago level.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 01:20 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mega AI Anthropic IPO details: Share price band, valuation, listing date - All you need to know about the upcoming issue", "full_content": "Anthropic IPO : Artificial intelligence (AI) startup Anthropic is gearing up for one of the biggest stock market debuts, with its proposed initial public offering (IPO) attracting significant attention from global investors.\n\nThe company behind the Claude AI chatbot has launched its IPO roadshow, targeting a fundraising of up to $64.4 billion through the sale of 825 million shares. Anthropic has set an indicative price band of $70-$78 per share, while its proposed fully diluted valuation could reach approximately $1.41 trillion.\n\nAnthropic has fixed an indicative price band of $70-$78 per share for its proposed IPO. The company plans to offer 825 million shares of Class A common stock, including 801.35 million shares issued by the company and 23.65 million shares offered by existing shareholders.\n\nAt the upper end of the price band, the offering could raise approximately $64.4 billion, making it one of the largest IPOs in global stock market history.\n\nThe company has also granted underwriters an option to purchase up to an additional 123.75 million shares within 30 days of the offering.\n\nAnthropic is targeting a fully diluted valuation of up to approximately $1.41 trillion at the upper end of its IPO price band. At the midpoint price of $74 per share, the company's valuation would be around $1.33 trillion on a fully diluted basis.\n\nHowever, the valuation is approximately $1 trillion when calculated excluding options and restricted stock, according to the company's IPO disclosures.\n\nApart from the public offering, Anthropic has also lined up a concurrent private placement worth $26 billion from major technology companies and strategic investors.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 01:11 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "EPFO alert: Employers must file October 2026 ECR and deposit EPF contributions by November 15", "full_content": "The Employees\u2019 Provident Fund Organisation (EPFO) has reminded employers to file the Electronic Challan-cum-Return (ECR) for the October 2026 wage month and deposit the corresponding Employees\u2019 Provident Fund (EPF) contributions by November 15, 2026.\n\nEPFO issued the reminder on November 12 through its official X handle. Employers should complete both the return filing and the payment by the deadline to ensure contributions are credited on time and late payment charges are avoided. For any queries, employers can visit the EPFO website or check the full post.\n\n\u0905\u0915\u094d\u091f\u0942\u092c\u0930 2026 \u0935\u0947\u0924\u0928 \u092e\u093e\u0939 \u0915\u093e ECR \u0914\u0930 \u0926\u0947\u092f EPF \u0905\u0902\u0936\u0926\u093e\u0928 15 \u0928\u0935\u0902\u092c\u0930 \u0924\u0915 \u091c\u092e\u093e \u0915\u0930\u0928\u093e \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0947\u0902\u0964\n\n\u0938\u092e\u092f \u092a\u0930 \u0905\u0928\u0941\u092a\u093e\u0932\u0928 \u0938\u0947 \u0915\u0930\u094d\u092e\u091a\u093e\u0930\u093f\u092f\u094b\u0902 \u0915\u0947 \u0916\u093e\u0924\u094b\u0902 \u092e\u0947\u0902 \u0905\u0902\u0936\u0926\u093e\u0928 \u0915\u093e \u0938\u092e\u092f \u092a\u0930 \u0915\u094d\u0930\u0947\u0921\u093f\u091f \u0939\u094b\u0917\u093e \u0914\u0930 \u0935\u093f\u0932\u0902\u092c \u0936\u0941\u0932\u094d\u0915 \u0938\u0947 \u092d\u0940 \u092c\u091a\u093e\u0935 \u0939\u094b\u0917\u093e\u0964\n\nEnsure that the ECR for the October 2026 wage month and the EPF contributions due are submitted by November 15.\n\nTimely compliance will ensure that contributions are credited to employees' accounts on time and will also help avoid late payment charges.\"\n\nThe Electronic Challan-cum-Return (ECR) is the monthly electronic return that helps ensure employers report employees' provident fund contributions and submit the corresponding payment details. Timely submission and filing of these returns and payment details are critical for maintaining regular EPFO compliance.\n\nHence, employers should verify employee details , personal data, wage particulars, and contribution calculations before submitting the return. They should also ensure the payment is cleared successfully by the stipulated deadline.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 01:11 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Q2 Results Live: Gillette India Profit Rises 10%, Goodyear India Profit Rises 31%; Eicher Motors, Grasim Also In Focus", "full_content": "Grasim Industries, Eicher Motors, ABB India, TMPV, RVNL, Godrej Industries, and Gillette India hundreds of other companies are scheduled to announce their Q2 results today. Track the latest earnings announcements, financial performance, and management commentary live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 01:07 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IRCTC, RVNL, IRFC, RailTel to IRCON: Railway stocks fall up to 3%; opportunity to buy on dip? Experts' views, target, SL", "full_content": "Asit Manohar Published 13 Nov 2026, 01:04 PM IST Prefer Livemint on Google Following the weak trends in the Indian stock market, railway stocks are under pressure since morning. Flagship railway stock, IRCTC is down by near 3%, RVNL share price is down by around 2.50%, IRCON International and Railtel Corporation shares are down by around 2%, RailTel Corporation share price, whereas IRFC share price today is down by around 1.90%.\n\nAccording to stock market experts, railway stocks are under pressure due to a mix of fundamental corrections, margin pressures, and broader market headwinds. FII outflows, rebalancing valuations, and macro headwinds are some other reasons that are dragging the railway stocks, say experts.\n\nHighlighting the reasons behind the selling pressure in the railway stocks today, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cRailway stocks are currently under pressure and trading down significantly due to a mix of fundamental corrections, margin pressures, and broader market headwinds. Railway companies face margin compression due to lower-margin competitive open-bidding projects (moving away from purely nominated or high-margin rail contracts) and execution challenges in projects like Vande Bharat rollouts.\u201d\n\n\u201cThe railway sector faces a wider risk-off wave, FII outflows, and monthly F&O expiry volatility impacting high-beta and capex-heavy PSUs. Investors are closely tracking quarterly results and order book execution speed to see if revenue growth can justify previous high price-to-earnings (P/E) multiples,\u201d said Anuj Gupta, a SEBI-registered market expert.\n\nIf this fall in the railway stocks an opportunity for bottom fishing, Avinash Gorakshkar said, \u201cThose looking for a value pick can look at IRFC shares. The company deals in the credit lending and some recent Capex pipeline announcement are expected to benefit IRFC.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 01:04 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia without Jensen Huang. What lies ahead for Asian chipmakers?", "full_content": "Nvidia's leadership shake-up is unlikely to cause immediate disruption for major Asian semiconductor suppliers, such as Samsung Electronics and Taiwan Semiconductor Manufacturing Co., but Jensen Huang's departure has raised questions about the company's longer-term product strategy and supply chain relationships.\n\nThe bigger issue for investors and suppliers is whether Nvidia can maintain the pace of innovation and close ties with key partners that Huang helped drive as the company built its dominance in artificial intelligence chips.\n\nIn a Friday research note, Nam Dae-jong and Kim Yeon-mi, analysts at South Korean brokerage Daol Investment & Securities, said Huang's departure was unlikely to affect the semiconductor industry's near-term outlook.\n\nHowever, they flagged uncertainty over Nvidia's medium- to long-term product roadmap, including how its new leadership would coordinate with partners across the AI ecosystem.\n\nFor chipmakers in Asia, one key question is whether Nvidia's relationships with its manufacturing partners could change under new leadership.\n\nNam and Kim expect Nvidia's foundry relationship with TSMC to remain unchanged, given the companies' established partnership.\n\nThey also expect Nvidia's relationship with Samsung's foundry business to continue, citing growing cooperation between the companies, including manufacturing involving Samsung's 4-nanometer process and work on next-generation high-bandwidth memory technology.\n\nThe analysts said custom AI chips, or application-specific integrated circuits, or ASICs, are emerging as alternatives to Nvidia's graphic processing units and could accelerate diversification in the AI chip market.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 12:59 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Kwality Walls shares rally 8.5% today, up over 53% in 6 months - Should you still buy ice cream stock? Q2 highlights", "full_content": "Kwality Wall's (India) shares extended their winning streak for the third consecutive session on Friday, November 13, surging as much as 8.5% amid sustained buying interest.\n\nThe stock has gained over 14% in just four trading sessions, taking its rally to 94% from its 52-week low of \u20b9 22.25, recorded in March 2026. The latest surge has brought the stock closer to its 52-week high of \u20b9 50.64, touched in August 2026, although it remains below that level.\n\nThe stock opened at \u20b9 39.65 and climbed to an intraday high of \u20b9 43.10. Its recent performance has been equally impressive across different timeframes, with gains of 14% over one month, 15% in three months and 53% in six months.\n\nWith the stock witnessing renewed buying interest, investors are now assessing whether the rally has further room to run. Technical analysts have identified important support and resistance levels that could determine its next move.\n\nKwality Wall's reported a net loss of \u20b9 17.2 crore in Q2 FY27 , significantly lower than the loss of \u20b9 100.2 crore in the corresponding quarter last year. Revenue from operations stood at \u20b9 463.6 crore, while sales of products amounted to \u20b9 453 crore.\n\nThe company recorded
