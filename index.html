, provident fund and savings accounts, such people can invest in small savings schemes offered by the government through post offices.\n\nOne such option is the post office time deposit (TD), commonly known as a post office fixed deposit. Just like bank FD , the scheme requires a one-time deposit for a set period, with the principal and accumulated interest paid at maturity.\n\nThe scheme offers four tenures of one, two, three and five years, allowing depositors to choose a period based on their financial needs. It can be a suitable option for those seeking assured returns without exposure to market fluctuations that can be witnessed in stocks and mutual funds.\n\nInterest rates under the post office TD scheme vary according to the investment period. As per official details, the annual rates are 6.9% for one year, 7% for two years, 7.1% for three years and 7.5% for five years. The five-year deposit offers the highest interest rate among these options.\n\nFurthermore, interest is calculated quarterly and credited annually. The eventual rate depends on the tenure that is chosen by the individual investor.\n\nLets' say you want to make an one-time investment of \u20b9 1 lakh. Before committing the money, it is important to assess the potential returns. Here are the estimated returns based on calculations from Paisabazaar post office TD calculator:\n\n\u2014 1-year deposit: At 6.9% interest, a one-time deposit of \u20b9 1 lakh will earn around \u20b9 7,081. The maturity amount is \u20b9 \u20b9 1,07,081.\n\n\u2014 2-year deposit: At 7%, the investment earns an interest of approximately \u20b9 14,888 until maturity, taking the final corpus to \u20b9 1,14,888.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 11:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Scene Box Office Collection Day 6: Suriya Starrer Maintains Strong Pace, Check Earnings", "full_content": "Suriya leads Scene, a Tamil action comedy that blends crime, conflict and chaos. The film also stars Pooja Hegde and Jyothika in key roles and continues to attract audiences in theatres.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Nasdaq Jumps at Open After CoreWeave Earnings \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Jumps at Open After CoreWeave Earnings \u2014 Live Updates WSJ CoreWeave CEO Intrator tells CNBC he has canceled his planned share sale program CNBC CoreWeave turns to customer prepayments, shorter contracts to fund AI growth TechCrunch CoreWeave sparks AI cloud stock rally, lifts Nvidia as results ease bubble fears Reuters CoreWeave Finds a Workaround to Capital Constraints\u2014for Now WSJ", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 11:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Highlights: Hindustan Copper Profit Rises 47%; Cupid's Revenue More Than Doubles; Tata Power Profit Up 49%", "full_content": "Tata Power, Garden Reach Shipbuilders & Engineers, Hindustan Copper, Triveni Turbine, Power Mech Projects were among the companies that announced September quarter earnings today.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:14 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bought Indo Thai Securities shares in 2026? Stock crashes 90% after two years of multibagger gains; what went wrong?", "full_content": "A Ksheerasagar Published 11 Nov 2026, 11:12 PM IST Prefer Livemint on Google Brokerage firm Indo Thai Securities , which once rewarded shareholders with handsome returns, is now struggling to regain momentum as its shares remain caught in a downward spiral in 2026, leaving investors who entered the stock earlier this year facing significant losses.\n\nAfter delivering multibagger returns for two consecutive years, the stock has plunged nearly 90% in 2026, falling to \u20b9 31.70, its lowest level in more than two years. The steep sell-off has also dragged the company's market capitalisation down to around \u20b9 420 crore.\n\nFor shareholders who were attracted by the stock's extraordinary past performance, those who entered in 2026 have been left with substantial losses.\n\nAccording to Trendlyne shareholding data, retail and other public shareholders collectively held a 45% stake in the company at the end of the September quarter, up from 39.5% in the corresponding period last year.\n\nPromoters continued to remain the largest shareholders, with a 54.8% stake in the company. Despite erasing much of its 2025 gains, the stock's five-year returns remain relatively strong at 188%. It finished the last annual year with a 132%, building on a massive 455% in 2024 .\n\nThe crash in the stock followed the company's failure to impress the Street with its financial performance, while the sharp rally in previous years may have also left the stock vulnerable to profit booking.\n\nThe company reported a consolidated net loss of \u20b9 35.58 crore in the second quarter of FY27, compared with a net profit of \u20b9 14.61 crore in the year-ago period.\n\nRevenue from operations declined 68.1% year-on-year to \u20b9 7.54 crore from \u20b9 23.62 crore. The company's EBITDA also turned negative at \u20b9 42.51 crore, against a positive EBITDA of \u20b9 20.17 crore in Q2 FY26.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:12 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia shares rebound as Jensen Huang faces scrutiny ahead of earnings", "full_content": "Nvidia 's stock rose close to 5% on Wednesday, after falling for two days amid the scandal that has rocked the world's most valuable tech company.\n\nShares closed down 5.47% on Tuesday as more details were revealed about the impact of CEO Jensen Huang 's affair with an alleged Chinese spy . They fell 4.3% Monday.\n\nOn Tuesday, Nvidia announced it had hired law firm Wachtell, Lipton, Rosen & Katz to investigate whether company secrets or national security were compromised.\n\nHuang tried to project \"business as usual\" as he returned to the office on Monday, people familiar with the matter told CNBC. The CEO was also in the office on Tuesday, conducting meetings, ahead of the company's quarterly earnings on Nov. 17.\n\nInvestors are assessing whether the matter will have damaging spillover effects on the business.\n\nNvidia shares over the past five days. In a Tuesday note, Bank of America said it saw three scenarios with differing investment outcomes. In one scenario, the impact is contained with leadership continuity, and in another, prolonged uncertainty pressures valuation before earnings.\n\nIn the final scenario, the impact is escalated, with \"adverse findings, leadership disruption or tighter restrictions requiring earnings reassessment,\" BofA research analyst Vivek Arya said in the note.\n\nZacks' Chief Equity Strategist John Blank said the selloff reflected two concerns: that the U.S. might impose further restrictions in the wake of the affair and that further problems might arise as the news develops. \"What else has Jensen done?\" he said.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 11:09 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CoreWeave soars 26% as CEO reaffirms AI compute demand after strong Q3 report", "full_content": "CoreWeave shares jumped 26% Wednesday after the neocloud posted quarterly earnings that beat estimates and raised its guidance for the year.\n\n\"Demand for the infrastructure is and remains overwhelming.\" CEO Michael Intrator told CNBC's \"Squawk on the Street\" Wednesday.\n\n\"I think I said that we are 10x oversubscribed to the existing capacity that we have left in 2027, and we are multiples ... oversubscribed on the capacity we have out in 2028,\" he said.\n\nNeoclouds such as CoreWeave, Nebius and IREN have come under scrutiny this month as investors assessed the sustainability of the AI trade. CoreWeave, in particular, sparked alarm when spreads on its CDS widened past 11% , generally viewed as a distress level, as investors have to pay up for protection against default. With the price of its high-yield debt climbing, CoreWeave highlighted additional routes to finance its data center build-out with less alarming yields, quelling investor concerns for the time being.\n\n\"Our asset level debt has basically been rock solid through this entire thing,\" Intrator told CNBC. \"There is an enormous demand for that product. We're about to launch another asset-level debt in the next week or two that has already been rated high investment grade.\" Intrator added that he expects it \"will be underwritten in the market at 7% to 7.5% interest,\" which will bring down the average weighted cost of capital for the company.\n\nCoreWeave shares this year. The three months to Sept. 30 marked a \"breakout quarter\" for CoreWeave, Intrator said on the conference call, adding that growth was supported by multiple sources of funding, including financing backed by customer contracts and around $9 billion in customer prepayments and deposits.\n\nRevenue jumped 168% to $3.7 billion in the third quarter, the company said in a Tuesday statement .\n\nOther neclouds also rose on CoreWeave's strong results, with Nebius up 19%, Applied Digital up 9% and Iren up 8% in midday trading.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 11:08 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "American Airlines brings fresh food back to NY-Chicago first class for first time since 2019", "full_content": "American Airlines said Wednesday it's bringing small, fresh \"bites\" to first class on flights between its hubs in New York and Chicago, the carrier's latest effort to win over higher-spending customers .\n\nThe changes start this month. Customers will be able to pick between two options, which include prosciutto and melon or apple cinnamon chia pudding for breakfast and a Thai noodle salad or mezze plate for lunch and dinner, American said Wednesday.\n\nAmerican last offered fresh food for first class on these routes in 2019, a spokeswoman said. Currently, customers in first class on these flights get a smaller, packaged snack. Airlines largely have limited food options for shorter flights, even in first class.\n\nAmerican has fallen behind Delta Air Lines and United Airlines in profits and investments in premium options. The airline has been working to step up those premium offerings in recent years with new cabins, lounges and plans for seatback screens on its narrow-body fleets.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 11:04 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Moody's Hikes India's FY27 GDP Growth Estimate To 7% On Investment, Consumption Dynamics", "full_content": "In its Global Macro Outlook 2027-28, Moody's, however, said that near-term risks to growth persist as household consumption remains vulnerable to \"intensifying and broadening price pressures\", with headline inflation close to the upper end of the RBI's inflation target range.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:04 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CFTC investigates if Kalshi improperly self-certified event contracts", "full_content": "The Commodity Futures Trading Commission is investigating whether prediction market platform Kalshi failed to properly inform the agency of proposed event contracts, Kalshi confirmed to CNBC.\n\nKalshi called it a minor issue in how the contracts were filed and said it is working with the CFTC to address the matter. The CFTC flagged weather-related contracts, Kalshi said. The leading prediction market platform didn't say when the agency began investigating Kalshi. The CFTC didn't immediately respond to a request for comment.\n\nPolitico first reported on the probe on Tuesday, noting charges could happen soon, based on the CFTC's private notification to Kalshi. The platform declined to comment on any possible charges.\n\nPrediction market platforms are allowed to self-certify event contracts without the federal agency's prior approval, as long as they comply with the Commodity Exchange Act. The self-certification allows for faster introduction of new contracts.\n\n\"The notice is about a procedural error involving the submission of a handful of contracts, many of which weren't live,\" said Elisabeth Diana, head of communications at Kalshi. \"We are already addressing the issue.\"\n\nThe move is the latest by the CFTC as it seeks to rein in prediction markets, which face growing scrutiny in Washington from regulators and members of Congress .\n\nIn August, the CFTC ordered Kalshi to take down sports-related \" mention markets \" \u2014 where speculators can trade on what individuals will say in a broadcast or speech \u2014 while it looked into the event contract type.\n\nThe agency is also conducting a broad probe into competitor Polymarket , which includes reviewing if the company violated a 2022 settlement with the CFTC to prohibit U.S. traders from accessing its international trading platform. Polymarket's domestic exchange operates separately from the global platform.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 10:52 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "JetBlue unveils new first class seats to bring back profits", "full_content": "JetBlue Airways is unveiling its new domestic first-class seats Wednesday as more of the country's carriers bet on the premium travel boom to make them profitable again.\n\nJetBlue announced it would offer a domestic first class \u2014 BlueFirst \u2014 in December 2024 and plans to start flying aircraft with the new seats and full on-board product next month. The carrier is showing off the new cabin at its home hub at John F. Kennedy International Airport on Wednesday. Retrofits will continue during 2027, CEO Joanna Geraghty told CNBC late last month.\n\nThe rollout comes as the New York airline tries to stabilize after last posting a profit in 2019. Last month, JetBlue executives sought to calm investors after shares in the airline hit a record low following a report that bondholders had contracted restructuring advisors.\n\n\"We have no intention, no plans to file for bankruptcy. We are not engaged with any restructuring company,\" Geraghty told CNBC in an interview on Oct. 27.\n\nGeraghty told CNBC's Phil LeBeau on Wednesday that JetBlue has \"met with a few of the creditors over the last couple of weeks as part of ... normal investor engagement.\" She said the company made it clear to bondholders that JetBlue doesn't need to reorganize.\n\nThe airline's shares are up more than 40% this month, more than other passenger carriers, as of midday Wednesday, though they are still off about 11% so far this year.\n\nJetBlue is betting that resilient travel demand, especially for for roomier seats will help fuel its turnaround plan, which aims to get the carrier to an operating profit next year and $1 in adjusted earnings per share in 2028.\n\nAirline executives have said they expect fares to stay elevated next year as they grapple with higher costs, including but not limited to fuel, such as labor and airport fees. Geraghty said Wednesday that even if fuel prices moderate next year, \"I don't think fares are going to fall as much as people expect.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 10:50 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street thinks the Fed made a 'mistake' \u2014 and now more hikes are coming - Yahoo Finance", "full_content": "Wall Street thinks the Fed made a 'mistake' \u2014 and now more hikes are coming Yahoo Finance Goldman adds another rate hike to Fed outlook after hot inflation data Reuters Economists say Fed could go overboard on rate hikes after hot October inflation report Business Insider Get ready for rate hike(s) Axios Fed could hike at each of its next three meetings, Deutsche Bank says MarketWatch", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 10:50 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trade Setup For Nov 12: Nifty Faces Resistance At 25,500; Will Overbought Zone Trigger Pullback?", "full_content": "Trade Setup For Nov 12: Market analysts highlighted that Nifty is trading in the overbought zone, indicating the possibility of a mild retracement towards the 25,00024,800 levels.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 10:36 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Yes Bank bondholders press for compliance with Supreme Court's AT-1 order", "full_content": "Yes Bank bondholders filed a contempt petition in the Supreme Court regarding the restoration of AT-1 bonds. The Supreme Court upheld a ruling that set aside the lender's write-off of 84 billion rupees in bonds. Axis Trustee Services, representing the bondholders, asked for directions to enforce the court's ruling. Yes Bank had not complied with the restoration order, prompting the trustee's legal action.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 10:25 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FD auto-renewal: Your fixed deposit auto-renewed at a lower interest rate? Can you reverse it? Know here", "full_content": "When a fixed deposit matures, the bank repays or renews it according to the depositor\u2019s instructions. Here's whether you can reverse the auto-renewal after it happens.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 10:21 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fed's Goolsbee calls inflation report 'borderline disturbing' as central bank weighs more hikes", "full_content": "The consumer price index rose more than expected in October, raising alarm among Federal Reserve officials.", "source": "CNBC Finance", "pub_date_str": "11 Nov 2026, 10:19 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rs 10 Lakh Lump Sum In Small Cap Mutual Fund: Only Invest When You're Sure About These 5 Things", "full_content": "Investors considering a one-time investment should look beyond historical returns and growth expectations.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 10:11 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic\u2019s IPO is said to be multiple times oversubscribed", "full_content": "Anthropic PBC is witnessing an overwhelming response for its initial public offering, potentially accumulating up to $90.4 billion. This bullish sentiment reflects a staggering anticipated market valuation of around $1.4 trillion. With a significant revenue run rate of $81 billion as of October 31, investor enthusiasm remains high. The IPO is managed by Goldman Sachs Group Inc.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 09:55 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia shares recover 4.5% after steep sell-off; China spy probe and November 17 earnings to test investor confidence", "full_content": "Nvidia shares rebounded nearly 4.5% Wednesday after recent steep losses, sup     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
