5 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 01:01 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bank strike Sept 28-30: Will financial services work? All ATM, digital wallet and UPI FAQs answered", "full_content": "Bank customers across India could face disruption in terms of accessing in-branch services from September 28 to 30, 2026, as the United Forum of Bank Unions (UFBU) plans a three-day nationwide strike to press for its key demands, including a five-day banking week and pension reforms.\n\nThe proposed strike comes immediately after the weekend holidays on September 26 and 27, which raised concerns of an effective five-day disruption in banking operations. In response, the government has announced Sunday as a working day for all public-sector and rural-sector banks employees in the country.\n\nNo, online financial services will not be impacted by the bank strike as they work round the clock, whether banks are operational or not.\n\nIndividuals can continue to use UPI or their respective bank's app to make payments and receive money. Digital wallets will also continue to work as usual. These services may be temporarily unavailable only if a bank takes them offline for scheduled maintenance, in which case customers are notified in advance.\n\nTherefore, even if the strike materialises, customers can continue making their scheduled payments without visiting a bank branch.\n\nSimilar to digital payment services, ATMs and Automated Deposit and Withdrawal Machines (ADWMs) will also remain available for customers who need cash during the bank strike.\n\nATMs will continue to operate round the clock, subject to cash availability and any scheduled maintenance activity.\n\nServices that require physical documents and assistance from bank staff could be delayed if branches are affected by the strike, which include cheque clearance, demand draft issuance and locker access.", "source": "LiveMint Money", "pub_date_str": "25 Sep 2026, 12:54 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Motilal Oswal group gets SEBI custodian licence to start operations from Q4", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Motilal Oswal group gets SEBI custodian licence to start operations from Q4 Motilal Oswal Financial Services Share Price Aditya Birla Capital Share Price L&T Finance Share Price HDB Financial Services Share Price Sundaram Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Motilal Oswal group gets SEBI custodian licence to start operations from Q4 SECTIONS Motilal Oswal group gets SEBI custodian licence to start operations from Q4 By Veer Sharma , ETMarkets.com Last Updated: Sep 25, 2026, 12:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Motilal Oswal Financial Services\u2019 wholly ate Thursday, the highest level since 2007, while the 30-year yield reached 5.502%.\n\nThis week's ascent in yields was fueled by hawkish comments from Federal Reserve Governor Michael Barr, persistently high energy prices due to the Iran war, and a hot purchasing managers' report. Fed funds futures trading suggests a roughly 68% likelihood of a rate hike in October, according to the CME FedWatch tool .\n\nThe 30-year fixed rate mortgage , which tracks the 10-year note, rose to 7.45%, the highest level since 2024, as borrowing costs for consumers looked poised to increase ahead of the midterm elections.\n\n\"Even before the moves of the past few days, the declines in credit card [annual percentage rates] and auto loan rates that occurred from mid- 2024 through the start of 2026 had stalled, and mortgage rates reaccelerated,\" Heather Berger, economist at Morgan Stanley, wrote in a note to clients.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FTSE 100 today: Stocks rise as U.S.-Iran ceasefire talks offset Hormuz supply fear", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 12:44 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Live: Sensex Trades In Narrow Range, Nifty50 Near 23,100; M&M, Axis Bank Rise 2% Each, Meesho Slips 6%", "full_content": "In the previous session, the BSE Sensex crashed 1.67%, or 1,247.71 points, to 73,580.54, while the NSE Nifty50 ended at 23,063.10, down 383.70 points, or 1.64%.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 12:43 PM IST", "pub_date_re onths, it has jumped 32%.\n\nDespite the stock's healthy rise in the recent past, Axis Direct (Axis Securities) believes it has more steam left.\n\nAxis Securities has fixed a target price of \u20b9 705 for Indegene shares.\n\nIndegene, a digital-first life-sciences company, combines deep life-sciences domain expertise with proprietary technology, AI and data analytics to support complex and highly regulated workflows.\n\nAxis believes the company offers a unique AI analytics offering in the life sciences domain, backed by stable cash flows and lower operational leverage.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 12:35 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Retail investors raise stakes in 10 smallcaps; 3 turn multibaggers in 3 months", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Retail investors raise stakes in 10 smallcaps; 3 turn multibaggers in 3 months Written by Ritesh Presswala , ETMarkets.com | Sep 25, 2026, 12:47:55 PM IST 1 / 13 Retail Stakes Rise While market headlines often focus on institutional activity, retail investors have also been increasing their exposure to the smallcap segment. An analysis of June 2026 quarter shareholding data shows that retail investors raised their stakes in nearly 766 BSE smallcap stocks compared with the previous quarter. Retail investors include resident individuals holding nominal share capital of up to Rs 2 lakh.\n\nAmong the stocks that saw an increase in retail ownership, around 25 smallcap companies delivered price gains of more than 50% in less than three months following the June 2026 quarter, outperforming the broader market indices. Notably, 10 stocks from this list surged between 80% and 200% during the period. Three of these stocks more than doubled in value, with their share prices rising over 100% in less than three months. (Data Source: ACE Equity)\n\nIn less than three months following the June 2026 quarter, the stock surged 198%, rising from Rs 270 to Rs 806. Retail shareholding increased marginally from 19.05% in March 2026 to 19.19% in June 2026.\n\nIn less than three months following the June 2026 quarter, the stock surged 129%, rising from Rs 45 to Rs 102. Retail shareholding increased from 4.61% in March 2026 to 4.66% in June 2026.\n\nIn less than three months following the June 2026 quarter, the stock surged 121%, rising from Rs 30 to Rs 65. Retail shareholding increased from 9.67% in March 2026 to 9.83% in June 2026.\n\nIn less than three months following the June 2026 quarter, the stock surged 97%, rising from Rs 203 to Rs 401.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 12:27 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Borosil Share Price Jumps Over 5% After DGTR Recommends Anti-Dumping Duty On Chinese Glassware", "full_content": "The DGTR has recommended an anti-dumping duty of $1,526 per tonne on most covered imports from China. For a qualifying producer, Anhui Deli Glassware Group, the recommended duty stands at $703 per tonne.", "source": "NDTV Profit", "pub_date_str": "25 Sep 2026, 12:27 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ola Electric shares fall 9% | What\u2019s behind today\u2019s sudden sell-off?", "full_content": "Ola Electric Mobility share price came under pressure on Friday, 25 September, falling as much as 9% and snapping a four-session gaining streak.\n\nThe sell-off followed the company\u2019s announcement that its board will meet on 28 September to consider raising fresh capital through a rights issue of equity shares. The proposal will be subject to the necessary regulatory and statutory approvals.\n\nOla Electric disclosed the proposed fundraising in an exchange filing under Regulation 29(1)(d) of the SEBI Listing Regulations. The announcement comes only a few months after the electric two-wheeler manufacturer raised \u20b9 780 crore through a qualified institutional placement (QIP) in June. The QIP was subscribed 56% above the shares on offer.\n\nThe June fundraise attracted several institutional investors, including global names such as Goldman Sachs and BNP Climate Fund, as well as Indian mutual funds such as Motilal Oswal Mutual Fund, Mirae Asset Mutual Fund, Kotak Mahindra Mutual Fund, JM Financial Mutual Fund, and Baroda BNP Paribas Mutual Fund. Ola Electric\u2019s Fundraising Committee later approved the closure of the issue after receiving applications and funds from eligible investors.\n\nMeanwhile, the company has reported a sharp improvement in vehicle registrations. VAHAN registrations almost doubled sequentially to 43,719 units in the first quarter of FY27, compared with 22,252 units in the March quarter, according to an exchange filing dated 1 July.\n\nJune emerged as the strongest month in recent quarters, with 16,144 registrations.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 12:19 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India doesn't plan huge changes to dispute resolution with foreign companies, source says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a India doesn't plan huge changes to dispute resolution with foreign companies, source says The Economic Times daily newspaper is available online now. Read Today's Paper India doesn't plan huge changes to dispute resolution with foreign companies, source says SECTIONS India doesn't plan huge changes to dispute resolution with foreign companies, source says Reuters Last Updated: Sep 25, 2026, 12:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is unlikely to make major changes to its bilateral investment treaty dispute-resolution framework, despite foreign businesses complaining about lengthy legal processes. Under current rules, foreign investors must pursue disputes through Indian courts for five years before seeking international arbitration. The government\u2019s review is examining concerns over delays and investment barriers, but no major overhaul is planned.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "25 Sep 2026, 12:09 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why did Akamai stock surge after Anthropic\u2019s $11.6 billion deal?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Why did Akamai stock surge after Anthropic\u2019s $11.6 billion deal? Written by Anupam Nagar , ETMarkets.com | Sep 25, 2026, 12:21:35 PM IST 1 / 10 \u200bAkamai Stock Surges After Anthropic Deal Akamai Technologies shares jumped more than 20% in after-hours trading on Thursday after the company announced an $11.6 billion, seven-year cloud computing agreement with AI company Anthropic. (Sources: Akamai, Reuters, TradingView)\n\nUnder the agreement, Anthropic will use Akamai Cloud\u2019s distributed infrastructure and software to support its growing CPU workload requirements. The contract runs for seven years.\n\nThe agreement allows for an additional $9 billion in commitments. If fully expanded, the relationship could reach approximately $20 billion, or $20.6 billion including the related warrant structure described by Akamai.\n\nAkamai issued Anthropic a warrant representing up to about 5% of its common stock on an as-converted basis. About 2% is tied to the initial commitment, while the remaining portion depends on additional spending.\n\nAkamai expects about $5.5 billion of capital expenditure related to the commitment. The company also expects roughly $1.7 billion of additional 2026 capex to secure and pre-purchase critical supply-chain components, including memory.\n\nThe Anthropic agreement adds to more than $2.8 billion in multi-year cloud infrastructure commitments Akamai had announced earlier in 2026. Akamai's Cloud Infrastructure Services revenue reached $99 million in the second quarter, up 39% year over year.\n\nThe agreement highlights growing demand for computing infrastructure beyond traditional AI GPUs.", "source": "Economic Times Markets", "pub_date_str": "25 Sep 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"             return;
        }
        renderAll();

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
