<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Fed Chair Warsh says central bank to reduce the number of rate-setting meetings in coming years", "full_content": "The Federal Reserve held steady on rates at the conclusion of its October meeting, maintaining its target range of 3.75% to 4%.\n\nTwo members of the Federal Open Market Committee dissented from the decision: Governor Lisa Cook and Cleveland Fed President Beth Hammack were in favor of raising rates by a quarter percentage point.\n\nFed Chairman Kevin Warsh announced that the central bank will reduce he number of rate-setting meetings starting in 2027, noting that while eight meetings per year is \"the right number\" for the FOMC, one of them will focus exclusively on broad monetary policy strategy starting in 2027. The remainder will be policy-setting meetings.\n\nIn 2028, the Fed will plan to host two meetings focused on strategy discussions and the remaining six will be centered on policy setting, Warsh said.\n\nWarsh said the Fed's discussion over recent days \"focused mainly on the price stability side of our remit.\"\n\nHe said the full employment side of its dual mandate has been \"quite positive,\" citing a decreasing jobless rate compared with a year ago. Warsh also noted that the unemployment insurance claims volume, when looking at a four-week average, is at \"the lowest level in generations.\"\n\nFed Chairman Kevin Warsh said the central bank will cut back on the number of meetings where members vote on rates. Said Warsh: \"We believe eight meetings per year is the right number for the FOMC, but in 2027, one meeting will focus exclusively on broad monetary policy strategy, with neither a vote on the federal funds rate nor a policy statement anticipated. The rest will be regular FOMC policy setting meetings, and I expect that in 2028 we'll have two meetings dedicated discussions of strategy and six for setting policy.\"\n\nLater Warsh added that he doesn't \"anticipate\" making a policy decision during these strategy meetings.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:25 AM IST", "pub_date_relative": "1m ago"}, {"title": "Oracle stock pops 10% on forecast for 35% average revenue growth through 2030", "full_content": "Oracle shares jumped on Wednesday after the software company issued a revenue forecast of $225 billion for fiscal 2030, implying 35% average annual growth, and said it will limit additional fundraising over that stretch to $20 billion.\n\nAnalysts polled by LSEG expected growth of 8% in fiscal 2027, followed by significant acceleration over the next two years. They're projecting revenue in fiscal 2030 of $224.2 billion.\n\nOracle said, as part of its commitment to limit additional funding for fiscal 2027 through 2030, that the amount will be divided equally between equity and debt.\n\n\"Vendor financing, customer-provided hardware and customer prepayments are expected to reduce upfront cash requirements through the transition to positive free cash flow,\" Oracle said in a filing with the Securities and Exchange Commission.\n\nPrior to Wednesday, Oracle had lost about one-third of its value this year on concern that rising interest rates and the company's hefty debt load will make its artificial intelligence buildout too costly. Oracle has issued $117 billion in long-term debt and is clinging to an investment-grade credit rating of BBB-, the lowest level of investment grade above junk, according to S&P.", "source": "CNBC World Economy", "pub_date_str": "29 Oct 2026, 12:25 AM IST", "pub_date_relative": "1m ago"}, {"title": "S&P 500 gains for a third day as Fed pauses on rate hikes, Oracle shares rally: Live updates", "full_content": "The S&P 500 rose on Wednesday as investors reacted to the Federal Reserve's latest interest rate decision and awaited earnings reports from mega-cap technology companies.\n\nThe broad market index gained 0.2%, while the Nasdaq Composite added 0.1%. The Dow Jones Industrial Average climbed 122 points, or 0.2%.\n\nThe Fed kept interest rates steady at a target rate range of 3.75% to 4%. Policymakers had raised rates by a quarter percentage point at their September meeting, marking its first hike since 2023.\n\n\"The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal,\" the Fed said in its post-meeting statement.\n\nTraders had widely anticipated the move. Heading into Wednesday's meeting, fed funds futures trading priced in a nearly 93% chance that the central bank would maintain the current interest rate, per CME's FedWatch tool .\n\n\"We expect the Fed to resume rate hikes in December,\" said Kay Haigh, global head and CIO of fixed income and liquidity solutions at Goldman Sachs Asset Management. \"September's strong CPI print is a reminder that upside inflation risks remain, and the Fed is likely to look to take out further insurance. While the September dot-plot suggests just one more hike, another increase in energy prices or further strong data prints could bring additional tightening into play next year.\"\n\nU.S. chipmakers moved higher Wednesday, buoyed by SK Hynix posting record quarterly profit \u2014 a development that sent U.S. shares of the South Korean chipmaker up 13%. Micron Technology was up 4%, while Arm Holdings advanced 3%. Marvell Technology moved up more than 2%, and Advanced Micro Devices increased around 2%.\n\nInvestors' attention will remain on the artificial intelligence trade after the bell, as \"Magnificent Seven\" giants Alphabet and Microsoft are set to report their latest quarterly results.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:24 AM IST", "pub_date_relative": "3m ago"}, {"title": "FTC demands Walmart, Uber, Delta and others hand over data on personalized pricing: Reuters", "full_content": "The Federal Trade Commission is demanding information from Walmart , Uber and seven other companies on whether and how they use consumers' personal data such as location, browsing history and income to set individual prices, wages and job offers, a senior FTC official told Reuters on Wednesday.\n\nThe FTC is flexing its consumer protection powers ahead of the U.S. congressional elections next week, as voters consistently rank the cost of living as the most important issue.\n\nTarget , along with app services Lyft , DoorDash and Instacart, and airlines Delta , United , JetBlue , are also receiving demands, the official said.\n\nThe FTC will use the information to eventually publish a study to help inform regulators and lawmakers about personalized pricing and wage setting practices.\n\nThe advance of algorithmic pricing technology, including tools that incorporate AI, has fueled concern that companies are able to set prices for shoppers on an individual basis in order to extract the maximum price each shopper would be willing to pay.\n\nPersonalized pricing strategies are difficult to observe from the outside, because they serve different prices to different people. The FTC study aims to fill in that knowledge gap, demanding comprehensive information about the tools, strategies, and data companies use as well as how they affect prices, wages and job offers.\n\nEfforts by state lawmakers to ban personalized pricing, along with the use of algorithms to individually tailor wages, have taken off in recent years.\n\nThe National Retail Federation has criticized the laws and defended retailers' use of data-driven discounts as a means of incentivizing loyalty.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:21 AM IST", "pub_date_relative": "6m ago"}, {"title": "Earnings call transcript: Central Pacific Financial beats EPS in Q3 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:16 AM IST", "pub_date_relative": "11m ago"}, {"title": "How can US Fed FOMC meeting outcome impact Indian stock market? Sensex, Nifty to rise? Experts decode", "full_content": "Nishant Kumar Updated 29 Oct 2026, 12:20 AM IST Prefer Livemint on Google The US Federal Reserve maintained the status quo on interest rates on Wednesday, 28 October, in line with market expectations, even as the central bank said inflation remains elevated while economic activity is growing strongly.\n\nThe Federal Open Market Committee (FOMC) decided to maintain the target range for the federal funds rate at 3.75% to 4%, which was raised to this level on 16 September this year, marking the first US Fed interest rate hike since 2023.\n\nThe FOMC approved the policy decision by a 10 \u2013 2 vote, with Governor Lisa Cook and Cleveland Fed President Beth Hammack dissenting in favour of a 25-basis-point rate hike.\n\n\"Economic activity is expanding at a strong pace. While uncertainty remains elevated owing, in part, to geopolitical developments, domestic spending has been resilient. Productivity growth is strong, and capital investment is robust. Job gains have kept pace with the workforce, and the unemployment rate has changed little,\" the FOMC statement read.\n\n\"Inflation remains elevated. The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2% goal.\"\n\nThe Federal Reserve's policy decision is unlikely to have any impact on the Indian stock market, as the policy decision avoided any negative surprise by keeping interest rates steady.\n\nDue to a status quo on rates, the market's focus is on elevated oil prices and rising bond yields in the US, both major negatives for the Indian stock market.\n\n\"A pause is already discounted by the market and, therefore, is unlikely to have any impact. A positive trend in the market is that value buying is emerging since many segments of the market are becoming attractively valued,\" said V K Vijayakumar, Chief Investment Strategist, Geojit Investments.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:16 AM IST", "pub_date_relative": "11m ago"}, {"title": "Blue Ant Media at Planet MicroCap Showcase: Toronto 2026: growth via global rights", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:16 AM IST", "pub_date_relative": "11m ago"}, {"title": "Dynacor at Planet MicroCap Showcase: Toronto 2026: growth tests and new markets", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:15 AM IST", "pub_date_relative": "11m ago"}, {"title": "New Horizon Aircraft at Planet MicroCap Showcase: Toronto 2026: hybrid bet", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:15 AM IST", "pub_date_relative": "11m ago"}, {"title": "Apple brings touch to the Mac, reversing years-old stance on touchscreen laptop", "full_content": "Apple on Wednesday announced its first laptop with a touch screen, which it is calling MacBook Pro with ProLED XDR Display.\n\nApple said that the laptop has a new display, using OLED technology, that offers more brightness, better colors and wider viewing angles. It's using Apple's M5 Pro or Max chips, and Apple said on Wednesday that it's lighter than Apple's current pro laptops.\n\nIt's still an Apple laptop, and is running MacOS, not a version of the iPhone or iPad operating system. In a video, Apple showed users swiping on the screen to manipulate videos or images. It also has a glowing Apple logo on the laptop's lid.\n\nThe new laptop will go on sale on Nov. 6 and the 14-inch version will start at $2,899. The 16-inch version will cost at least $3,399. Both are notable price increases from existing models.\n\nThis is Apple's third major product launch under new CEO John Ternus, signaling a faster cadence for hardware releases. It's also a major reversal for Apple, which has resisted putting touchscreens on its laptops for decades as some Windows machines gained the feature.\n\n\"Yes, for the very first time, we are bringing touch to the Mac,\" Ternus said in live remarks to media and analysts in Los Angeles.\n\nThe new MacBook Pro comes at a time when the laptop market has been going through one of its worst slumps ever. Overall shipments are expected to be down 11% this year. Analysts say the AI-driven global market shortage of memory has contributed to higher laptop prices, which has hurt sales and demand.\n\nIn the third quarter, total PC shipments dropped 20% on a year-over-year basis, according to market researcher IDC. Apple's own shipments fell 11% during the quarter, according to the estimate.", "source": "CNBC World Economy", "pub_date_str": "29 Oct 2026, 12:14 AM IST", "pub_date_relative": "12m ago"}, {"title": "AerCap Holdings NV stock hits all-time high at 158.81 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:14 AM IST", "pub_date_relative": "13m ago"}, {"title": "Why is Canadian Natural Resources stock climbing today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:14 AM IST", "pub_date_relative": "13m ago"}, {"title": "Earnings call transcript: Route Mobile beats Q2 2026 estimates as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:13 AM IST", "pub_date_relative": "13m ago"}, {"title": "Oracle expects to turn cash flow positive in second half of fiscal 2028", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:13 AM IST", "pub_date_relative": "14m ago"}, {"title": "Meta delays indefinitely its rollout of new commercial terms after publishers\u2019 concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:12 AM IST", "pub_date_relative": "14m ago"}, {"title": "Zurn Elkay Water Solutions stock hits 52-week low at $43.05", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:11 AM IST", "pub_date_relative": "16m ago"}, {"title": "US Fed Meeting Live Updates: Warsh Highlights Changes In FOMC Schedule From Next Fall; FOMC Holds Interest Rates Steady", "full_content": "US Fed Meeting Live Updates: Track the Fed's rate decision, Kevin Warsh's comments and the impact on the US dollar, Wall Street and global markets.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 12:10 AM IST", "pub_date_relative": "17m ago"}, {"title": "We're adding a new, high-profile AI play to our Bullpen stocks to watch list", "full_content": "With the Club portfolio now down to 31 positions, we are working on new ideas to add to the Bullpen.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:03 AM IST", "pub_date_relative": "23m ago"}, {"title": "I\u2019m planning a trip to Europe. Is it dumb to take travel advice from influencers?", "full_content": "\u201cHow can I tell if something is a real experience in my price range?\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 12:00 AM IST", "pub_date_relative": "27m ago"}, {"title": "Investing in US stocks from India? How much can you invest, can you directly apply for IPOs? Complete guide here", "full_content": "Investing in foreign stocks from India allows investors to participate in the growth of some of the world's most recognised companies, such as Apple, Meta and Amazon. It also provides exposure to popular sectors such as artificial intelligence (AI), which may have limited investment options in India.\n\nSeveral regulatory channels are available to Indian residents looking to invest in international stocks. Access to overseas markets, including the United States, has become easier through the Reserve Bank of India\u2019s Liberalised Remittance Scheme (LRS) and investment platforms operating through GIFT City .\n\nThe RBI's LRS route allows you to remit up to $250,000 per financial year for permitted purposes, including investments in foreign stocks and overseas-listed exchange-traded funds (ETFs), as well as expenses such as travel and education.\n\nThe entire $250,000 limit can be used for investments in the US market if the investor does not need to use any part of it for other permitted overseas expenses during the specified financial year.\n\nAs Claude-maker Anthropic, headed by Dario Amodei, moves closer to a stock market debut, with a Nasdaq listing reportedly targeted for the end of November, Indian investors may be wondering if they can buy its shares at the offer price.\n\nLike we already discussed, Indian residents are permitted to invest in overseas securities, subject to applicable rules. However, accessing a US IPO can be challenging as unlike India, the US market does not have a fixed retail or foreign retail quota for initial public offerings ( IPOs ).\n\nMost US IPOs allocate around 90% of their shares to institutional investors, such as pension funds, hedge funds and large asset managers and the remaining 10% goes to US retail investors, according to a blog post by INDmoney .", "source": "LiveMint Money", "pub_date_str": "28 Oct 2026, 11:59 PM IST", "pub_date_relative": "28m ago"}, {"title": "CNBC TEC Summit live updates: How technology executives are navigating enterprise AI adoption", "full_content": "At a defining moment for business and technology, artificial intelligence is transforming how organizations operate \u2014 and introducing new complexities for the leaders responsible for what comes next.\n\nSo how are companies adapting and shaping technology's next era \u2014 from compute ROI and cybersecurity to regulation and quantum computing?\n\nCNBC is convening technology executives, industry experts, and CNBC journalists at the annual Technology Executive Council Summit in New York today to discuss the increasingly central role that technology leaders are playing in this transformation.\n\nThe TEC Summit is an exclusive event for members; learn more about the TEC and apply for membership at www.cnbccouncils.com/tec .\n\nKeia Cole, the chief digital officer of Brooklyn Sports & Entertainment, recalled the excitement of the New York Liberty's first WNBA title in 2004 at the 2026 CNBC Technology Executive Council Summit.\n\nBut there was another off-court moment Cole said ranks up there during her tenure with the organization: a company-wide AI lab launched earlier this year.\n\n\"We were trying to figure out how to increase AI fluency across the organization, and we were doing the typical things: training, office hours, and meeting with specific departments,\" Cole told CNBC's Scott Wapner. \"It wasn't getting us where we needed to go.\"\n\nCole said the strategy needed to shift, and a decision was made to encourage certain AI behaviors.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 11:54 PM IST", "pub_date_relative": "33m ago"}, {"title": "Inter Miami vs New York Red Bulls Live Streaming: When And Where To Watch Messi's MLS Match In India", "full_content": "Inter Miami look to return to winning ways against FC Cincinnati, who arrive in Miami after consecutive victories in MLS.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:54 PM IST", "pub_date_relative": "33m ago"}, {"title": "IIP growth eases to 4-month low in September as mining output contracts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a IIP growth eases to 4-month low in September as mining output contracts The Economic Times daily newspaper is available online now. Read Today's Paper IIP growth eases to 4-month low in September as mining output contracts SECTIONS IIP growth eases to 4-month low in September as mining output contracts By ET Bureau Last Updated: Oct 28, 2026, 11:49:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis September witnessed a decline in India's factory output growth, falling to 6.7%, the lowest rate observed in four months. The drop is largely linked to a high base effect and decreased mining activity. Despite this, manufacturing output surged by 7.6% compared to the previous year, while electricity generation also grew, spurred by robust demand even with insufficient rainfall. Economists anticipate GDP growth to surpass 7% for the July-September period.\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "28 Oct 2026, 11:49 PM IST", "pub_date_relative": "38m ago"}, {"title": "US Fed FOMC meeting outcome news today: Top highlights and what led to no rate hike decision", "full_content": "As widely anticipated, the US Federal Reserve left interest rates unchanged on Wednesday, October 28, giving policymakers more time to assess the impact of the previous rate hike on the economy and financial conditions, even as inflation remained above the central bank\u2019s target.\n\nThe Federal Reserve voted 10-2 to keep interest rates unchanged at 3.75%\u20134%, with two policymakers dissenting in favour of a 25-basis-point hike. Fed Governor Lisa Cook and Cleveland Fed President Beth Hammack dissented from the policy decision, favouring a 25-basis-point interest rate hike.\n\n\u201cInflation remains elevated,\u201d the Fed said in a statement released after its two-day policy meeting. Holding off on an increase will allow \u201cthe accumulation of more information\u201d that will help determine what policy the Fed should pursue \u201cto ensure a timely return of inflation\u201d to the central bank\u2019s 2% inflation target, the statement said.\n\nThe latest decision also comes less than a week before the US midterm elections, with the cost of living and affordability among the key concerns for voters.\n\nThe policymakers need more information to assess the economic outlook and determine the future course of monetary policy. Persistent inflationary pressures, alongside signs of moderation in the labour market, remain key factors shaping the central bank\u2019s policy outlook.\n\nThe economic activity continued to expand at a solid pace, with consumer spending remaining resilient, productivity staying strong and capital expenditure holding up. The inflation remained elevated, while job gains slowed in September.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:39 PM IST", "pub_date_relative": "48m ago"}, {"title": "US Fed Holds Key Rates Steady At 3.75-4% To Support 'Dual Mandate'; Seeks More Info For Policy Stance", "full_content": "US Fed Verdict: FOMC said that inflation remains elevated, while job gains have kept pace with workforce. It also added that the US economic activity is expanding at a \"strong\" pace. The monetary policy vote in favor of keeping the benchmark rate unchanged was 10-2.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:37 PM IST", "pub_date_relative": "50m ago"}, {"title": "US Fed meeting outcome news: FOMC decides no rate hike - Details", "full_content": "The Federal Reserve, on Wednesday, held interest rates steady in 3.75%-4.00% range. The US Fed opted to delay any changes to borrowing costs until after next week's US midterm elections and awaiting further data on the path of inflation.\n\nThe US Federal Reserve decision has come even as inflation has surged over the past few months amid crude oil price rally due to geopolitical uncertainty. Meanwhile, the Fed\u2019s latest policy meeting concludes less than a week before the midterm elections, which have focused heavily on concerns about the cost of living and affordability.\n\nThe US Fed raised its key rate in September , for the first time in three years, from about 3.6% to 3.9%. Many experts perceived it as the first step toward a renewed effort to bring down inflation.\n\nThe US Fed announcement is likely to be followed by Kevin Warsh \u2019s press conference at 12 am midnight. He will likely repeat the Fed's desire for a \u201ctimelier\u201d return of inflation to the 2% target.\n\nSome may view that as a sign the Fed will boost its key rate at its next meeting, in December, a move already widely expected by Wall Street investors.\n\nInflation in September saw significant uptick as consumer prices rose 3.7% compared with a year earlier. The increase was much bigger than the 2.4% rate in February, just before the Iran war.\n\nApart from the US Fed outcome, a separate inflation measure will be closely tracked on Thursday. A separate inflation measure, the personal consumption expenditures price index, is scheduled to be released on Thursday, October 29.\n\nThe measure is forecast to have jumped 3.6% in September from a year earlier, up from 3.4% in August, according to AP report. Core prices, which exclude the food and energy categories, are forecast to have risen 3.1%, up from 3% the previous month.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:35 PM IST", "pub_date_relative": "52m ago"}, {"title": "Where to put your money no matter what the Fed does", "full_content": "After raising the federal funds rate in September, the Federal Open Market Committee (FOMC) declined to adjust its benchmark rate on Wednesday.\n\nWhen the FOMC raises rates to combat high inflation, it increases borrowing costs for consumers and businesses \u2014 but it can also mean more attractive returns on CD s and high-yield savings accounts . When the Fed lowers the target range, borrowing costs tend to fall, making credit cards, auto loans and other kinds of financing more affordable.\n\nWith persistent inflation, a rate cut is increasingly unlikely in the near term. In a recent Reuters poll , 100% of economists said they expected another rate hike in December.\n\nBut that doesn't mean you should sit on your hands until then.\n\nRegardless of whether the Fed raises or lowers its benchmark rate, paying down high-interest debt is always a smart move. Credit card bills are a big culprit, and interest rates on cards are already so high that a small decrease in the target range won't make much difference .\n\nOne popular strategy for tackling credit card debt is a balance transfer card with an introductory 0% APR period. This effectively stops the clock, giving you months to pay your bill without accruing additional interest. It's only a wise gambit if you have a plan to pay the full balance by the end of the intro period, though. Otherwise, you'll just be hit with another hefty APR.\n\nThe Citi Simplicity\u00ae Card has one of the longest interest-free periods on the market, while Chase Freedom Unlimited\u00ae includes a welcome bonus and cash-back rewards on everyday spending.\n\n4.3 Learn More CNBC Select Rating 4.3 Learn More Spotlight Receive a 0% intro APR for 18 months on balance transfers and purchases from the date of account opening.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:33 PM IST", "pub_date_relative": "53m ago"}, {"title": "Buy, Sell Or Hold: GEC, Eternal, Hindustan Zinc, Jio Platforms And Varun Beverages \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including GEC, Eternal, Hindustan Zinc, Jio Platforms and Varun Beverages.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "55m ago"}, {"title": "Chip stocks on the fly! AMD, Micron among shares gain up to 5% as SK Hynix\u2019s earnings boost AI trade", "full_content": "Share prices of technology companies surged earlier in the day in Asia, as blockbuster earnings from South Korean chipmaker SK Hynix boosted optimism around the artificial intelligence (AI) trade ahead of results from Wall Street giants Microsoft and Alphabet after the closing bell.\n\nSK Hynix, which has been at the forefront of the AI-driven chip boom, reported on Wednesday that its third-quarter operating profit soared 632% year-on-year to a record 83.33 trillion won ($62.8 billion), driven by strong demand for advanced semiconductors.\n\nThe results lifted SK Hynix\u2019s US-listed American depositary receipts (ADRs) by 12.17% to the day\u2019s high of $160 apiece. Micron shares gained 5.5%, while AMD rose 2.25% at their day's high. The broader chip rally also extended to other AI-linked companies, with Arm Holdings and Marvell Technology gaining around 2%.\n\nIn South Korea, SK Hynix shares surged nearly 11% on Wednesday, while rival Samsung Electronics, which is scheduled to report its earnings on Thursday, gained 9%. The gains offered much-needed relief to SK Hynix shares, which had come under pressure during the second half of 2026.\n\nSK Hynix and Samsung Electronics have been among the market\u2019s frontrunners since the beginning of 2026 as enthusiasm around AI gathered momentum. The rally propelled South Korea\u2019s benchmark KOSPI index to gains of around 120% at its peak.\n\nThe results added to optimism surrounding the sector after Anthropic, the developer of Claude AI, filed for an initial public offering (IPO) on Monday. The company reported a sharp increase in revenue and outlined substantial spending commitments, fuelling investor interest ahead of its expected stock market debut next month.\n\nAhead of the results, shares of Google parent Alphabet rose 0.9% as investors positioned themselves ahead of the company\u2019s third-quarter earnings announcement.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "55m ago"}, {"title": "Mutual fund direct plans to become default on AMC apps from November 1; what investors need to know", "full_content": "SEBI chairman Tuhin Kanta Pandey has announced that direct mutual fund plans will become the default option on asset management companies\u2019 (AMCs) digital platforms from 1 November. Investors who choose regular plans will have to be informed about their higher expense ratios, a move aimed at improving transparency around mutual fund costs.\n\nThe announcement, made at NDTV Profit Ignite in Mumbai on 28 October, comes as more Indian households invest in mutual funds through systematic investment plans (SIPs) and digital platforms. The change seeks to ensure investors are more aware of the costs associated with their investment choices.\n\n\u201cProtection also depends on what investors are told,\u201d Pandey said in his address, adding that direct plans would become the default on AMC digital platforms from 1 November.\n\nDirect and regular plans of the same mutual fund scheme invest in the same portfolio and are managed by the same fund manager. The main difference lies in distribution costs and the expense ratio charged to investors.\n\nDirect plans are purchased without a distributor and generally have lower expense ratios. Regular plans are purchased through mutual fund distributors, with distribution commissions reflected in the scheme\u2019s expenses. Since expenses are deducted from the scheme\u2019s assets, a higher expense ratio can reduce investors\u2019 net returns over time, all else being equal.\n\nFor example, if the annual expense ratio of a regular plan is 0.5 percentage points higher than that of its direct counterpart, the difference on an investment of \u20b9 5 lakh would amount to \u20b9 2,500 over a year, assuming the investment value remains unchanged throughout that period. The actual difference will vary with the value of the investment and the expense ratios applicable to the scheme.\n\nOver longer investment horizons, even small differences in costs can affect the final corpus because expenses reduce the amount available to generate returns.", "source": "LiveMint Money", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago"}, {"title": "US Federal Reserve holds interest rates steady as stubborn inflation puts future rate hikes in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Federal Reserve holds interest rates steady as stubborn inflation puts future rate hikes in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Federal Reserve holds interest rates steady as stubborn inflation puts future rate hikes in focus SECTIONS US Federal Reserve holds interest rates steady as stubborn inflation puts future rate hikes in focus By Akash Podishetti , ETMarkets.com Last Updated: Oct 28, 2026, 11:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US Federal Reserve has decided to keep its benchmark interest rate unchanged to evaluate inflation trends. Policymakers are assessing how high inflation might affect future monetary policy amid the upcoming midterm elections. Rising energy prices and tariffs contribute significantly to the ongoing inflation pressures faced by the economy. Traders are closely monitoring the upcoming Personal Consumption Expenditures inflation report for indications of future rate hikes.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago"}, {"title": "Looking for yield? This could be one of the best times in recent market history to buy corporate bonds", "full_content": "Looking for yield? Investing experts say now may be one of the best moments in recent market history to buy corporate bonds.\n\nWith the 10-year Treasury yield still flirting around 5% and the Federal Reserve holding rates steady at its FOMC meeting on Wednesday, fixed income experts say the environment for highly rated investment-grade corporates is attractive \u2014 some have called it a \"generational opportunity.\"\n\nLeading the market are hyperscalers including Alphabet, Amazon, Meta and Microsoft, companies that have been aggressively issuing debt for artificial intelligence projects, including buying chips and building data centers and power plants to run them.\n\n\"You're typically not able to buy AA [and similarly rated] companies at these attractive yields,\" said Steven Purdy, group managing director and co-head of global credit at TCW in Los Angeles, which manages over $150 billion in fixed income investments.\n\nNevertheless, investors need to be cautious as cash flow is under pressure at even the most cash-rich companies in the market \u2014 Meta's free cash flow just went negative for the first time since its 2012 IPO.\n\nFor investors looking to the bond market for income opportunities, here is what to know about the current situation with corporates.\n\nThe major hyperscalers have strong balance sheets and highly manageable debt, even though it's larger than it has been in the past, said Joseph Matus, principal in the West Conshohocken, Pennsylvania office of Cerity Partners. \"It's not very often that investors get a chance to invest in above-average credit quality at average or above-average yields. That makes this a unique opportunity,\" he said.\n\nThe VettaFi AI Hyperscaler Bond Index, which tracks the debt of large tech giants like Microsoft, Alphabet, Oracle, Amazon and Meta, had a yield of 6.51% at the end of September.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago"}, {"title": "Fed holds rates steady despite concerns over inflation - CNBC", "full_content": "Fed holds rates steady despite concerns over inflation CNBC Federal Reserve makes interest rate decision ahead of midterms Fox Business Fed Rate Decision Live Coverage Bloomberg.com Fed Pauses Interest Rates as CRE Market Preps for December Hike Commercial Observer Fed meeting live updates: Federal Reserve weighs elevated inflation, midterm elections as October meeting kicks off Yahoo Finance", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 11:30 PM IST", "pub_date_relative": "57m ago"}, {"title": "Federal Reserve issues FOMC statement", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 2:00 p.m. EDT Share --> --> --> --> --> --> The Federal Open Market Committee approved the following statement for release by a 10 \u00e2\u0080\u0093 2 vote:\n\nThe Committee decided to maintain the target range for the federal funds rate at 3-3/4 to 4 percent, in support of the Federal Reserve's dual mandate. The Committee is continuing its policy of maintaining ample reserves in the banking system.\n\nEconomic activity is expanding at a strong pace. While uncertainty remains elevated owing, in part, to geopolitical developments, domestic spending has been resilient. Productivity growth is strong, and capital investment is robust. Job gains have kept pace with the workforce, and the unemployment rate has changed little.\n\nInflation remains elevated. The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal. The Committee will deliver price stability.\n\nVoting against the monetary policy action were Lisa D. Cook and Beth M. Hammack, who preferred to raise the target range for the federal funds rate by 1/4 percentage point at this meeting.\n\nFor media inquiries, please email [email protected] or call 202-452-2955.", "source": "Federal Reserve", "pub_date_str": "28 Oct 2026, 11:30 PM IST", "pub_date_relative": "57m ago"}, {"title": "Piyush Goyal's Work Hours Remark Draws Criticism From Karnataka IT Employees' Union", "full_content": "The union described the comments as a glorification of excessive work and warned against normalising workplace practices that undermine employees' dignity, health and personal lives.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:29 PM IST", "pub_date_relative": "58m ago"}, {"title": "Watch Live: Options traders break down a massive Alphabet trade into earnings", "full_content": "Options traders took contrasting views on Alphabet as the hyperscaler gets set to report earnings after the close.\n\nCurrent options prices are implying a nearly 6% move, well about its eight quarter median move of 2.6%. Traders were decidedly bullish heading into the first. Just before noon, a trader bought 2271 contracts of the 350/365 call spread for about $4.4. The trade target a move higher to $365, a 13% jump from its current price. The trade is a bet the in the near term, the worst is behind Alphabet, which has seen its shares fall nearly 20% from its all time highs reached back in May.\n\nSome traders are taking a different tact into the print. Specifically, a separate trader put on a bearish 3x1 put diagonal, collected $1.9M by selling 9,000 of the Nov. 20 expiration 290-strike puts at $4.15 per contract while buying 3,000 of the Jan. 15, 2027 exp. 300-strike puts at $2.15 per contract for a total debit of $2.5M\n\nThis is a trade that looks to take advantage of high near-term volatility in Alphabet's shorter dated puts. The goal is for those short-dated puts to expire worthless, with the trader then long the 300-strike puts, looking for a 9% move lower through mid January.\n\nThe market's mini rally faces a key test after the bell when tech giants Alphabet and Microsoft report. The technical set-up and options expectations could not be more different.\n\nMicrosoft is less than one percent below its closing record reached earlier this month, while Alphabet is flirting with technical bear-market territory, off 20% from its closing high in May. Market-makers are pricing a 5.8% move for Alphabet stock after its report, compared to under a 5% swing for Microsoft, Cboe LiveVol data show. For Microsoft, it's a smaller implied move than its 2-year average swing of 6%.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Micron Stock Advances as Rival SK Hynix Fuels AI Frenzy With Two Bombshells - Barron's", "full_content": "Micron Stock Advances as Rival SK Hynix Fuels AI Frenzy With Two Bombshells Barron's Why Micron Technology Stock Rallied Today Yahoo Finance Prediction: Micron\u2019s Next Earnings Cycle Could Reset Expectations for the Stock 24/7 Wall St. After Two Spectacular Micron Buy Ratings, I\u2019m Calling It Quits (Downgrade To Sell) (MU) Seeking Alpha Prediction: This Artificial Intelligence (AI) Memory Stock Will Go Parabolic on Oct. 30 The Motley Fool", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 11:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Biotechs buck a sluggish IPO market, but investors should tread warily", "full_content": "While a number of IPOs have been pulled or delayed in 2026, the biotech sector has bucked the trend, with 26 companies debuting in U.S. markets.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Lava Diwali Sale 2026: Check Smartphone And Feature Phone Prices On Amazon, Flipkart", "full_content": "Lava's Diwali deals include bank discounts and EMI plans on eligible online orders, while feature phone offers run on Amazon from October 30 to November 2, 2026.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kumar Sangakkara Alleges 'Threatening', 'Discriminatory' Behaviour By Ryanair Gate Staff", "full_content": "In a post on X, Sangakkara questioned whether other passengers had faced similar treatment from the airline's gate staff at Dublin Airport.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Vertiv earnings just sent an upbeat signal about AI ahead of Big Tech results", "full_content": "The AI infrastructure company beat sales expectations by the widest margin in more than five years and raised its capex outlook.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 11:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Over 900 Babies Born In Odisha During Cyclone; Parents Name Newborns Arnab, Barsha, Toofan", "full_content": "Odisha shifted 2,245 pregnant women to healthcare institutions before Cyclone Arnab, with mothers and newborns reported to be doing well.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump is using tariffs as a 'tool for grift,' Raskin says in demand for donor records", "full_content": "A top House Democrat on Wednesday accused President Donald Trump of using tariffs as a \"tool for grift and self-enrichment,\" pointing to what he says are suspicious import-tax exemptions for industries whose leaders have curried Trump's favor with gifts and donations .\n\n\"You took care to cut lots of sweetheart deals with corporations and industries that won carve-outs from your tariffs when you saw you could get something good in return,\" Rep. Jamie Raskin, D-Md., told Trump in a fiery letter obtained first by CNBC.\n\nRaskin, the ranking member of the House Judiciary Committee and the former top Democrat on the House oversight committee, highlighted three such tariff carve-outs \u2014 for Brazilian meat , diamonds and smartphones \u2014 that he says \"make little to no sense\" under the criteria set by the Trump administration.\n\n\"They do, however, make sense when factoring in the now world famous Trump Tariff Discount,\" Raskin wrote, coining a term to describe the president's alleged willingness to cut breaks for his allies and benefactors \"when the price is right.\"\n\nThe letter asks Trump to hand over multiple categories of records spanning his second term, including communications between the White House and the Office of the U.S. Trade Representative, or USTR, related to any form of tariff relief for more than a dozen industries.\n\nIt makes a similar request for communications involving private-sector representatives, including Apple executive chairman Tim Cook and Rolex CEO Jean-Frederic Dufour. Raskin asked for those records by Nov.", "source": "CNBC World Economy", "pub_date_str": "28 Oct 2026, 11:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Forget LRS Limits, India Should Relax Remittance Reporting Rules, Says Deepak Shenoy", "full_content": "Capitalmind Mutual Fund CEO Deepak Shenoy has called for easing overseas remittance reporting rules, arguing that India should simplify compliance instead of tightening LRS limits.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 Results Highlights: Hero MotoCorp Results Meet Estimates, Bandhan Bank Net Profit Jumps Multifold", "full_content": "Hindustan Unilever, Vedanta, TVS Motor Company, Hyundai Motor India, and Hero MotoCorp are among the 120 companies that announced their Q2 FY27 results today, October 28.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Big Adani stocks Q2 comparison: Adani Ports vs Adani Power vs Adani Green Energy shares; Who delivered beyond estimates?", "full_content": "ADANIGREEN ADANIPORTS Sharmila Bhadoria Published 28 Oct 2026, 10:57 PM IST Prefer Livemint on Google Adani Ports vs Adani Power vs Adani Green Energy : Three of the top Adani Group firms, ie Adani Ports and Special Economic Zone Limited, Adani Green Energy Limited, and Adani Power Limited reported their second quarter result announcement this week.\n\nOut of these three stocks, which Adani Group firm delivered beyond estimates and has promising growth guidance for the rest of financial year 2026-27? Let\u2019s find out.\n\nAdani Power and Adani Green Energy outperformed market expectations in the second quarter of FY27, while Adani Ports Q2FY27 results were largely in-line with estimates, highlighted Prathamesh Kadiwal , Research Analyst at Bonanza.\n\n\u201cAdani Ports has offered the most promising guidance for the rest of FY27, as it raised its EBITDA target to Rs. 26,000 to 27,000 Cr and also lifted its revenue and capex plans. Rising cargo volumes and a healthy net debt to EBITDA ratio of 1.8x give these targets solid support,\u201d explained Prathamesh Kadiwal.\n\n\u201cAdani Power has strong long term visibility, with 62% of its 23.7 GW thermal pipeline tied up under power purchase agreements, but a 40% YoY rise in fuel costs may squeeze margins in Q3FY27. Adani Green\u2019s capacity grew 24% YoY to 20.8 GW and it may beat its 10 GWh battery target, yet transmission delays at Khavda could slow growth,\u201d Kadiwal added.\n\nAPSEZ reported an 18% surge in consolidated net profit at \u20b9 3,682.44 crore for the quarter ended September 2026, driven by higher revenues from operations. The consolidated net profit of the company stood at \u20b9 3,120.20 crore in the quarter ended September 30, 2025.\n\nAdani Ports share price closed 0.27% lower at \u20b9 1759 per share on BSE on Wednesday, October 28.\n\nAdani Green Energy reported a 16% annual surge in its net consolidated profit to \u20b9 747 crore in the September quarter, boosted by strong revenue growth in the power supply business.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 10:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trade Setup For Oct 29: Nifty Finds Support At 22,500 As Bulls Eye 23,000", "full_content": "Market experts recommend a level-based trading approach as the benchmark continues to show volatile and non-directional movement.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 10:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "World Bank sees commodity prices surging 23% in 2026 on Middle East war", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a World Bank sees commodity prices surging 23% in 2026 on Middle East war Powered By The Economic Times daily newspaper is available online now. Read Today's Paper World Bank sees commodity prices surging 23% in 2026 on Middle East war SECTIONS World Bank sees commodity prices surging 23% in 2026 on Middle East war ETMarkets.com Last Updated: Oct 28, 2026, 11:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Commodity prices were projected to rise 23% in 2026 as the Middle East war disrupted energy supplies and shipping, while grain disruptions and safe haven demand pushed food and metals prices higher. The World Bank warned that further conflict escalation and a severe El Ni\u00f1o could intensify inflation and food security risks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 10:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "ICC Rankings: Abhishek Sharma Reclaims No 1 T20I Batting Spot, Marco Jansen Tops Test Charts", "full_content": "The latest ICC rankings update also saw Laura Wolvaardt replace Smriti Mandhana as the world's top-ranked women's ODI batter.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wendy\u2019s buyout offer suggests the burger chain\u2019s overhaul could be very expensive", "full_content": "Nelson Peltz\u2019s Trian Fund Management has made a $1.4 billion offer for Wendy\u2019s and says the company \u201crequires significant capital investment\u201d to get back on track.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Fed Chair Warsh says central bank to reduce the number of rate-setting meetings in coming years", "full_content": "The Federal Reserve held steady on rates at the conclusion of its October meeting, maintaining its target range of 3.75% to 4%.\n\nTwo members of the Federal Open Market Committee dissented from the decision: Governor Lisa Cook and Cleveland Fed President Beth Hammack were in favor of raising rates by a quarter percentage point.\n\nFed Chairman Kevin Warsh announced that the central bank will reduce he number of rate-setting meetings starting in 2027, noting that while eight meetings per year is \"the right number\" for the FOMC, one of them will focus exclusively on broad monetary policy strategy starting in 2027. The remainder will be policy-setting meetings.\n\nIn 2028, the Fed will plan to host two meetings focused on strategy discussions and the remaining six will be centered on policy setting, Warsh said.\n\nWarsh said the Fed's discussion over recent days \"focused mainly on the price stability side of our remit.\"\n\nHe said the full employment side of its dual mandate has been \"quite positive,\" citing a decreasing jobless rate compared with a year ago. Warsh also noted that the unemployment insurance claims volume, when looking at a four-week average, is at \"the lowest level in generations.\"\n\nFed Chairman Kevin Warsh said the central bank will cut back on the number of meetings where members vote on rates. Said Warsh: \"We believe eight meetings per year is the right number for the FOMC, but in 2027, one meeting will focus exclusively on broad monetary policy strategy, with neither a vote on the federal funds rate nor a policy statement anticipated. The rest will be regular FOMC policy setting meetings, and I expect that in 2028 we'll have two meetings dedicated discussions of strategy and six for setting policy.\"\n\nLater Warsh added that he doesn't \"anticipate\" making a policy decision during these strategy meetings.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:25 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oracle stock pops 10% on forecast for 35% average revenue growth through 2030", "full_content": "Oracle shares jumped on Wednesday after the software company issued a revenue forecast of $225 billion for fiscal 2030, implying 35% average annual growth, and said it will limit additional fundraising over that stretch to $20 billion.\n\nAnalysts polled by LSEG expected growth of 8% in fiscal 2027, followed by significant acceleration over the next two years. They're projecting revenue in fiscal 2030 of $224.2 billion.\n\nOracle said, as part of its commitment to limit additional funding for fiscal 2027 through 2030, that the amount will be divided equally between equity and debt.\n\n\"Vendor financing, customer-provided hardware and customer prepayments are expected to reduce upfront cash requirements through the transition to positive free cash flow,\" Oracle said in a filing with the Securities and Exchange Commission.\n\nPrior to Wednesday, Oracle had lost about one-third of its value this year on concern that rising interest rates and the company's hefty debt load will make its artificial intelligence buildout too costly. Oracle has issued $117 billion in long-term debt and is clinging to an investment-grade credit rating of BBB-, the lowest level of investment grade above junk, according to S&P.", "source": "CNBC World Economy", "pub_date_str": "29 Oct 2026, 12:25 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500 gains for a third day as Fed pauses on rate hikes, Oracle shares rally: Live updates", "full_content": "The S&P 500 rose on Wednesday as investors reacted to the Federal Reserve's latest interest rate decision and awaited earnings reports from mega-cap technology companies.\n\nThe broad market index gained 0.2%, while the Nasdaq Composite added 0.1%. The Dow Jones Industrial Average climbed 122 points, or 0.2%.\n\nThe Fed kept interest rates steady at a target rate range of 3.75% to 4%. Policymakers had raised rates by a quarter percentage point at their September meeting, marking its first hike since 2023.\n\n\"The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal,\" the Fed said in its post-meeting statement.\n\nTraders had widely anticipated the move. Heading into Wednesday's meeting, fed funds futures trading priced in a nearly 93% chance that the central bank would maintain the current interest rate, per CME's FedWatch tool .\n\n\"We expect the Fed to resume rate hikes in December,\" said Kay Haigh, global head and CIO of fixed income and liquidity solutions at Goldman Sachs Asset Management. \"September's strong CPI print is a reminder that upside inflation risks remain, and the Fed is likely to look to take out further insurance. While the September dot-plot suggests just one more hike, another increase in energy prices or further strong data prints could bring additional tightening into play next year.\"\n\nU.S. chipmakers moved higher Wednesday, buoyed by SK Hynix posting record quarterly profit \u2014 a development that sent U.S. shares of the South Korean chipmaker up 13%. Micron Technology was up 4%, while Arm Holdings advanced 3%. Marvell Technology moved up more than 2%, and Advanced Micro Devices increased around 2%.\n\nInvestors' attention will remain on the artificial intelligence trade after the bell, as \"Magnificent Seven\" giants Alphabet and Microsoft are set to report their latest quarterly results.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:24 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FTC demands Walmart, Uber, Delta and others hand over data on personalized pricing: Reuters", "full_content": "The Federal Trade Commission is demanding information from Walmart , Uber and seven other companies on whether and how they use consumers' personal data such as location, browsing history and income to set individual prices, wages and job offers, a senior FTC official told Reuters on Wednesday.\n\nThe FTC is flexing its consumer protection powers ahead of the U.S. congressional elections next week, as voters consistently rank the cost of living as the most important issue.\n\nTarget , along with app services Lyft , DoorDash and Instacart, and airlines Delta , United , JetBlue , are also receiving demands, the official said.\n\nThe FTC will use the information to eventually publish a study to help inform regulators and lawmakers about personalized pricing and wage setting practices.\n\nThe advance of algorithmic pricing technology, including tools that incorporate AI, has fueled concern that companies are able to set prices for shoppers on an individual basis in order to extract the maximum price each shopper would be willing to pay.\n\nPersonalized pricing strategies are difficult to observe from the outside, because they serve different prices to different people. The FTC study aims to fill in that knowledge gap, demanding comprehensive information about the tools, strategies, and data companies use as well as how they affect prices, wages and job offers.\n\nEfforts by state lawmakers to ban personalized pricing, along with the use of algorithms to individually tailor wages, have taken off in recent years.\n\nThe National Retail Federation has criticized the laws and defended retailers' use of data-driven discounts as a means of incentivizing loyalty.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:21 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Central Pacific Financial beats EPS in Q3 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:16 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How can US Fed FOMC meeting outcome impact Indian stock market? Sensex, Nifty to rise? Experts decode", "full_content": "Nishant Kumar Updated 29 Oct 2026, 12:20 AM IST Prefer Livemint on Google The US Federal Reserve maintained the status quo on interest rates on Wednesday, 28 October, in line with market expectations, even as the central bank said inflation remains elevated while economic activity is growing strongly.\n\nThe Federal Open Market Committee (FOMC) decided to maintain the target range for the federal funds rate at 3.75% to 4%, which was raised to this level on 16 September this year, marking the first US Fed interest rate hike since 2023.\n\nThe FOMC approved the policy decision by a 10 \u2013 2 vote, with Governor Lisa Cook and Cleveland Fed President Beth Hammack dissenting in favour of a 25-basis-point rate hike.\n\n\"Economic activity is expanding at a strong pace. While uncertainty remains elevated owing, in part, to geopolitical developments, domestic spending has been resilient. Productivity growth is strong, and capital investment is robust. Job gains have kept pace with the workforce, and the unemployment rate has changed little,\" the FOMC statement read.\n\n\"Inflation remains elevated. The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2% goal.\"\n\nThe Federal Reserve's policy decision is unlikely to have any impact on the Indian stock market, as the policy decision avoided any negative surprise by keeping interest rates steady.\n\nDue to a status quo on rates, the market's focus is on elevated oil prices and rising bond yields in the US, both major negatives for the Indian stock market.\n\n\"A pause is already discounted by the market and, therefore, is unlikely to have any impact. A positive trend in the market is that value buying is emerging since many segments of the market are becoming attractively valued,\" said V K Vijayakumar, Chief Investment Strategist, Geojit Investments.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:16 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Route Mobile beats Q2 2026 estimates as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:13 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Fed Meeting Live Updates: Warsh Highlights Changes In FOMC Schedule From Next Fall; FOMC Holds Interest Rates Steady", "full_content": "US Fed Meeting Live Updates: Track the Fed's rate decision, Kevin Warsh's comments and the impact on the US dollar, Wall Street and global markets.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 12:10 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "We're adding a new, high-profile AI play to our Bullpen stocks to watch list", "full_content": "With the Club portfolio now down to 31 positions, we are working on new ideas to add to the Bullpen.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:03 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Investing in US stocks from India? How much can you invest, can you directly apply for IPOs? Complete guide here", "full_content": "Investing in foreign stocks from India allows investors to participate in the growth of some of the world's most recognised companies, such as Apple, Meta and Amazon. It also provides exposure to popular sectors such as artificial intelligence (AI), which may have limited investment options in India.\n\nSeveral regulatory channels are available to Indian residents looking to invest in international stocks. Access to overseas markets, including the United States, has become easier through the Reserve Bank of India\u2019s Liberalised Remittance Scheme (LRS) and investment platforms operating through GIFT City .\n\nThe RBI's LRS route allows you to remit up to $250,000 per financial year for permitted purposes, including investments in foreign stocks and overseas-listed exchange-traded funds (ETFs), as well as expenses such as travel and education.\n\nThe entire $250,000 limit can be used for investments in the US market if the investor does not need to use any part of it for other permitted overseas expenses during the specified financial year.\n\nAs Claude-maker Anthropic, headed by Dario Amodei, moves closer to a stock market debut, with a Nasdaq listing reportedly targeted for the end of November, Indian investors may be wondering if they can buy its shares at the offer price.\n\nLike we already discussed, Indian residents are permitted to invest in overseas securities, subject to applicable rules. However, accessing a US IPO can be challenging as unlike India, the US market does not have a fixed retail or foreign retail quota for initial public offerings ( IPOs ).\n\nMost US IPOs allocate around 90% of their shares to institutional investors, such as pension funds, hedge funds and large asset managers and the remaining 10% goes to US retail investors, according to a blog post by INDmoney .", "source": "LiveMint Money", "pub_date_str": "28 Oct 2026, 11:59 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IIP growth eases to 4-month low in September as mining output contracts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a IIP growth eases to 4-month low in September as mining output contracts The Economic Times daily newspaper is available online now. Read Today's Paper IIP growth eases to 4-month low in September as mining output contracts SECTIONS IIP growth eases to 4-month low in September as mining output contracts By ET Bureau Last Updated: Oct 28, 2026, 11:49:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis September witnessed a decline in India's factory output growth, falling to 6.7%, the lowest rate observed in four months. The drop is largely linked to a high base effect and decreased mining activity. Despite this, manufacturing output surged by 7.6% compared to the previous year, while electricity generation also grew, spurred by robust demand even with insufficient rainfall. Economists anticipate GDP growth to surpass 7% for the July-September period.\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "28 Oct 2026, 11:49 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Fed FOMC meeting outcome news today: Top highlights and what led to no rate hike decision", "full_content": "As widely anticipated, the US Federal Reserve left interest rates unchanged on Wednesday, October 28, giving policymakers more time to assess the impact of the previous rate hike on the economy and financial conditions, even as inflation remained above the central bank\u2019s target.\n\nThe Federal Reserve voted 10-2 to keep interest rates unchanged at 3.75%\u20134%, with two policymakers dissenting in favour of a 25-basis-point hike. Fed Governor Lisa Cook and Cleveland Fed President Beth Hammack dissented from the policy decision, favouring a 25-basis-point interest rate hike.\n\n\u201cInflation remains elevated,\u201d the Fed said in a statement released after its two-day policy meeting. Holding off on an increase will allow \u201cthe accumulation of more information\u201d that will help determine what policy the Fed should pursue \u201cto ensure a timely return of inflation\u201d to the central bank\u2019s 2% inflation target, the statement said.\n\nThe latest decision also comes less than a week before the US midterm elections, with the cost of living and affordability among the key concerns for voters.\n\nThe policymakers need more information to assess the economic outlook and determine the future course of monetary policy. Persistent inflationary pressures, alongside signs of moderation in the labour market, remain key factors shaping the central bank\u2019s policy outlook.\n\nThe economic activity continued to expand at a solid pace, with consumer spending remaining resilient, productivity staying strong and capital expenditure holding up. The inflation remained elevated, while job gains slowed in September.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:39 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Fed Holds Key Rates Steady At 3.75-4% To Support 'Dual Mandate'; Seeks More Info For Policy Stance", "full_content": "US Fed Verdict: FOMC said that inflation remains elevated, while job gains have kept pace with workforce. It also added that the US economic activity is expanding at a \"strong\" pace. The monetary policy vote in favor of keeping the benchmark rate unchanged was 10-2.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:37 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Fed meeting outcome news: FOMC decides no rate hike - Details", "full_content": "The Federal Reserve, on Wednesday, held interest rates steady in 3.75%-4.00% range. The US Fed opted to delay any changes to borrowing costs until after next week's US midterm elections and awaiting further data on the path of inflation.\n\nThe US Federal Reserve decision has come even as inflation has surged over the past few months amid crude oil price rally due to geopolitical uncertainty. Meanwhile, the Fed\u2019s latest policy meeting concludes less than a week before the midterm elections, which have focused heavily on concerns about the cost of living and affordability.\n\nThe US Fed raised its key rate in September , for the first time in three years, from about 3.6% to 3.9%. Many experts perceived it as the first step toward a renewed effort to bring down inflation.\n\nThe US Fed announcement is likely to be followed by Kevin Warsh \u2019s press conference at 12 am midnight. He will likely repeat the Fed's desire for a \u201ctimelier\u201d return of inflation to the 2% target.\n\nSome may view that as a sign the Fed will boost its key rate at its next meeting, in December, a move already widely expected by Wall Street investors.\n\nInflation in September saw significant uptick as consumer prices rose 3.7% compared with a year earlier. The increase was much bigger than the 2.4% rate in February, just before the Iran war.\n\nApart from the US Fed outcome, a separate inflation measure will be closely tracked on Thursday. A separate inflation measure, the personal consumption expenditures price index, is scheduled to be released on Thursday, October 29.\n\nThe measure is forecast to have jumped 3.6% in September from a year earlier, up from 3.4% in August, according to AP report. Core prices, which exclude the food and energy categories, are forecast to have risen 3.1%, up from 3% the previous month.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:35 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Where to put your money no matter what the Fed does", "full_content": "After raising the federal funds rate in September, the Federal Open Market Committee (FOMC) declined to adjust its benchmark rate on Wednesday.\n\nWhen the FOMC raises rates to combat high inflation, it increases borrowing costs for consumers and businesses \u2014 but it can also mean more attractive returns on CD s and high-yield savings accounts . When the Fed lowers the target range, borrowing costs tend to fall, making credit cards, auto loans and other kinds of financing more affordable.\n\nWith persistent inflation, a rate cut is increasingly unlikely in the near term. In a recent Reuters poll , 100% of economists said they expected another rate hike in December.\n\nBut that doesn't mean you should sit on your hands until then.\n\nRegardless of whether the Fed raises or lowers its benchmark rate, paying down high-interest debt is always a smart move. Credit card bills are a big culprit, and interest rates on cards are already so high that a small decrease in the target range won't make much difference .\n\nOne popular strategy for tackling credit card debt is a balance transfer card with an introductory 0% APR period. This effectively stops the clock, giving you months to pay your bill without accruing additional interest. It's only a wise gambit if you have a plan to pay the full balance by the end of the intro period, though. Otherwise, you'll just be hit with another hefty APR.\n\nThe Citi Simplicity\u00ae Card has one of the longest interest-free periods on the market, while Chase Freedom Unlimited\u00ae includes a welcome bonus and cash-back rewards on everyday spending.\n\n4.3 Learn More CNBC Select Rating 4.3 Learn More Spotlight Receive a 0% intro APR for 18 months on balance transfers and purchases from the date of account opening.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:33 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Buy, Sell Or Hold: GEC, Eternal, Hindustan Zinc, Jio Platforms And Varun Beverages \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including GEC, Eternal, Hindustan Zinc, Jio Platforms and Varun Beverages.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:31 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chip stocks on the fly! AMD, Micron among shares gain up to 5% as SK Hynix\u2019s earnings boost AI trade", "full_content": "Share prices of technology companies surged earlier in the day in Asia, as blockbuster earnings from South Korean chipmaker SK Hynix boosted optimism around the artificial intelligence (AI) trade ahead of results from Wall Street giants Microsoft and Alphabet after the closing bell.\n\nSK Hynix, which has been at the forefront of the AI-driven chip boom, reported on Wednesday that its third-quarter operating profit soared 632% year-on-year to a record 83.33 trillion won ($62.8 billion), driven by strong demand for advanced semiconductors.\n\nThe results lifted SK Hynix\u2019s US-listed American depositary receipts (ADRs) by 12.17% to the day\u2019s high of $160 apiece. Micron shares gained 5.5%, while AMD rose 2.25% at their day's high. The broader chip rally also extended to other AI-linked companies, with Arm Holdings and Marvell Technology gaining around 2%.\n\nIn South Korea, SK Hynix shares surged nearly 11% on Wednesday, while rival Samsung Electronics, which is scheduled to report its earnings on Thursday, gained 9%. The gains offered much-needed relief to SK Hynix shares, which had come under pressure during the second half of 2026.\n\nSK Hynix and Samsung Electronics have been among the market\u2019s frontrunners since the beginning of 2026 as enthusiasm around AI gathered momentum. The rally propelled South Korea\u2019s benchmark KOSPI index to gains of around 120% at its peak.\n\nThe results added to optimism surrounding the sector after Anthropic, the developer of Claude AI, filed for an initial public offeri
