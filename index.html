<script>

    const allData = {"general": [{"title": "Copper Slips as AI Selloff Saps Appetite for Risk Across Markets", "full_content": "(Bloomberg) -- Copper wavered as traders weighed investor angst around overheated spending on metal-intensive AI infrastructure against continued supply risks.\n\nAI and technology stocks dropped across global markets following a slew of warnings that the rapid buildout of data centers will become more difficult to finance. South Korea\u2019s equity benchmark \u2014 which has been correlated with copper prices at times this year \u2014 slumped as much as 7%.\n\nCopper bulls argue that AI infrastructure will be a key source of demand in the coming decade, and any doubts about the pace of spending can hit sentiment. Still, the major driver for the red metal\u2019s 18% rally this year has been the threat of US import tariffs, which has pulled huge volumes into the country and cut availability elsewhere.\n\n\u201cWhile not acting as the sole rationale behind the copper price performance in 2026 thus far, AI-driven sentiment is expected to continue to shape, if not dominate, the narrative in the coming years,\u201d BMI, a Fitch Solutions company, said in a note.\n\nThe pull of metal into the US has helped tighten the copper market, as have a series of disruptions at key mines. The cash price for copper was at a premium of about $132 a ton to benchmark three-month futures on Tuesday, a condition called backwardation that indicates there\u2019s not enough immediate supply.\n\nIn China, meanwhile, the Yangshan import premium \u2014 a gauge of demand \u2014 last week hit its highest level since 2022.\n\nCopper was 0.2% lower at $14,596 a ton on the London Metal Exchange as of 1:31 p.m. local time. Aluminum dropped 0.6% and zinc steadied.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 01:19 AM IST", "pub_date_relative": "5m ago"}, {"title": "Williams says Fed may not have to hike rates in 2027, at odds with traders", "full_content": "New York Federal Reserve President John Williams said Tuesday that he doesn't see additional rate hikes in 2027 after one more increase this year.\n\n\"I haven't changed my view that it may be appropriate to have one more rate hike,\" Williams said in an interview with Bloomberg News. \"I don't think at this time I have any reason to believe that we would need to do more.\"\n\nWilliams' comments place him at odds with the market and some other members of the central bank.\n\nFed funds futures traders are largely betting that the central bank will raise rates at least once in 2027, according to CME's FedWatch data as of Tuesday. Latest trading gave about 90% odds that the Fed overnight rate would end 2027 at least a half percentage point higher than where it is today.\n\nThe New York Fed head is also at odds with many Federal Open Market Committee members, though he is still in-line with the majority. Eight of the 18 who gave a rate forecast for 2027 see one more increase after an additional hike this year. Williams is a permanent voting member of FOMC, the body that decides where interest rates should be set at each Fed policy gathering.\n\nThe Fed in September issued its first rate increase since 2023 . Fed officials indicated plans for another hike in meeting minutes, but did not clarify when. The central bank meets at the end of this month and then one more time in December.\n\nTo be sure, Williams told Bloomberg that \"we'll have to see\" when it comes to forecasting into the new year.\n\n\"This economy is being affected by lots of different influences, and we just have to keep watching the data,\" Williams said.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 01:16 AM IST", "pub_date_relative": "8m ago"}, {"title": "S&P 500 is little changed as traders mull over bank earnings; chip stocks slide: Live updates", "full_content": "The S&P 500 traded near the flatline on Tuesday, with traders digesting a slew of corporate earnings reports from major banks along with a steep overnight decline in South Korea that put pressure on memory chip names.\n\nThe S&P 500 was little changed on the day, while the Nasdaq Composite dropped 0.1%. The Dow Jones Industrial Average slipped 135 points, or 0.3%, lower, giving back an earlier gain. At its high of the day, the 30-stock index was up more than 460 points.\n\nJPMorgan Chase reported third-quarter earnings and revenue that missed analyst expectations, but the bank raised its net interest income guidance for 2026. Shares were last little changed on the day. Wells Fargo shed 2% on mixed Q3 numbers, while Goldman Sachs rose slightly after its revenue for the third quarter surpassed expectations.\n\n\"These banks still reported strong numbers, it's just that expectations were high, and higher expectations is a risk for companies across the board during this current earnings season,\" said Rebecca Walser, chief investment officer at Walser Wealth Management.\n\nUnitedHealth , meanwhile, was marginally higher after the insurance giant's results exceeded analyst expectations.\n\nThe early reports could set the tone for an earnings season with lofty expectations. Analysts on average expect S&P 500 profits grew by nearly 30% from the year-earlier period, according to FactSet.\n\nMemory stocks were under pressure after South Korea's Kospi benchmark dropped 5.5% \u2014 reaching its lowest level since July 31 \u2014 on valuation concerns in the space along with growing competition out of China. This week, China's CXMT said it plans to release a new, more powerful chip by year-end.\n\nSK hynix slipped nearly 4%. Seagate Technology and Western Digital lost 2%. Micron Technology and Sandisk fell almost 5% and more than 2%, respectively.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 01:08 AM IST", "pub_date_relative": "16m ago"}, {"title": "Fed\u2019s Williams sees no need for rate hike in 2027, Bloomberg News reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 12:54 AM IST", "pub_date_relative": "30m ago"}, {"title": "Apple releases HomeView smart home hub with screen as showcase for Siri AI", "full_content": "Apple on Tuesday announced a home hub called HomeView, marking CEO John Ternus' first launch outside of iPhones since he took over from Tim Cook at the start of September.\n\nApple said the device with a 7-inch screen was designed to be mounted on a wall or placed on a table. It's designed for multiple people in a household, and will recognize the user by their face to display pertinent information. It starts at $299 and ships on Nov. 13.\n\nTuesday's launch event is the second under Ternus, who was the company's longtime hardware boss before being promoted to CEO. Last month, Apple announced new models of its most important product, the iPhone, including a foldable model called the Duo that retails for nearly $2,000.\n\nApple also announced new Apple TV and HomePod hardware on Tuesday. The new Apple TV 4K costs $299 and has a redesigned remote that can play a sound if it is lost. Apple's HomePod Mini speaker comes in new colors and costs $149, a slight increase over its previous $129 price.\n\nThe products announced Tuesday are less critical for Apple than the iPhone, and investors remain focused on iPhone sales, but the accessories were positioned on Tuesday as a showcase for the company's new Siri abilities released last month.\n\nApple said HomeView features Siri AI, which can answer a broad range of questions. Users will be able to converse with Siri, and their conversations will continue on their iPhone or iPad. It has a built-in speaker for playing music.\n\nApple's HomeView can be placed on a table or mounted on a wall.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 12:53 AM IST", "pub_date_relative": "30m ago"}, {"title": "Paul Tudor Jones says 2027 could be a really challenging year for the stock market", "full_content": "Legendary hedge fund manager Paul Tudor Jones told CNBC that next year could be a tough one for the stock market because of increased equity supply from big tech initial public offerings coming down the pipe as well as a potential reckoning from the ballooning U.S. fiscal deficit.\n\n\"2027 is going to be really, really challenging for the stock market,\" Jones told \" Squawk Box \" on Tuesday. \"You've probably got the most negative flow picture for the U.S. stock market that we've had, say, since 2002.\"\n\nThe founder and chief investment officer of Tudor Investment said that corporate buybacks, along with mergers and acquisitions, have been a tail wind for the stock market for most of this four-year bull market as they decreased the equity supply.\n\nThat tide is now turning against the market with major offerings ahead in the AI space from Anthropic and OpenAI, along with one just finished for SpaceX . There will also likely be more secondary offerings from companies in order to raise money for the AI build-out, said Jones. It all adds up to an increased equity supply picture that could weigh on prices.\n\nThe billionaire hedge fund manager's comments come as investors worry that a bull market now in its fourth year could start to dwindle and run out of steam as concerns grow around mounting inflation, higher bond yields and a more hawkish Federal Reserve.\n\nJones repeated that the current period in the market is akin to 1999 , just about a year before the dot-com bubble burst in 2000. He noted the bifurcation in the current market between those companies benefiting from the AI boom and those that aren't.\n\nHe also added that a ballooning fiscal deficit is among the dangers for the current stock market, for which he thinks there could be a reckoning.\n\n\"We're never going to fix these deficits until the market makes us to. It's going to be just  targets in Yemen capital", "full_content": "Donald Trump accuses Iran-backed militants of deliberately trying to drive up oil prices ahead of the US midterm elections", "source": "FT Markets", "pub_date_str": "14 Oct 2026, 12:43 AM IST", "pub_date_relative": "40m ago"}, {"title": "Bank earnings takeaways: Here's how JPMorgan, Goldman, Wells Fargo and Citi performed in Q3", "full_content": "Four of the largest U.S. banks reported third-quarter results on Tuesday: JPMorgan Chase , Wells Fargo , Goldman Sachs and Citigroup .\n\nBank of America and Morgan Stanley will post earnings on Wednesday.\n\nThe quarter was dominated by headlines around artificial intelligence, IPO uncertainty, high fuel prices and rising borrowing costs.\n\nThe banks that reported Tuesday put up mixed results . JPMorgan, the biggest U.S. bank by assets and the largest in the world by market capitalization, posted a rare miss. Goldman Sachs, meanwhile, blew past estimates for revenue and earnings per share, led by strong equities trading.\n\nAnalyst calls for all four banks touched on the opportunities and risks associated with AI, citing robust financing demand and operational advantages, but also the threat of rogue agents.\n\nGoldman Sachs CEO David Solomon also addressed recent reports of a CEO transition plan, and Wells Fargo CFO Mike Santomassimo joined CNBC to discuss the firm's growth and the state of the consumer.\n\nCiti's analyst call is over, which means bank earnings reports for Tuesday are wrapped. Bank of America and Morgan Stanley report on Wednesday to round out third-quarter results for the major U.S. firms.\n\nWells Fargo's Santomassimo told CNBC that both consumers and businesses are doing \"really well.\"", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:42 AM IST", "pub_date_relative": "42m ago"}, {"title": "MSMEs need to focus on quality, cost to gain from new FTAs: Secy", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a MSMEs need to focus on quality, cost to gain from new FTAs: Secy The Economic Times daily newspaper is available online now. Read Today's Paper MSMEs need to focus on quality, cost to gain from new FTAs: Secy SECTIONS MSMEs need to focus on quality, cost to gain from new FTAs: Secy By Last Updated: Oct 14, 2026, 12:39:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's expanding network of free trade agreements is creating new opportunities for MSMEs to grow. The MSME ministry emphasizes the need for improved quality and cost competitiveness to access these opportunities. Moreover, government support for first-time exporters through practical assistance is crucial for success. It is essential to enhance certification participation and upgrade testing infrastructure to meet international standards.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 12:39 AM IST", "pub_date_relative": "45m ago"}, {"title": "Michael Dell says AI needs safeguards and controls, and government has a role to play", "full_content": "Dell Technologies CEO Michael Dell said that artificial intelligence models \"have to have safeguards and controls\" as the debate rages on over the threats the rapidly evolving technology could pose to humans.\n\n\"I think we've always had technology that can do great things and maybe do some not-so-great things. You know, fire can heat your home. It can also burn down your whole village. So that's not good. So we have to have safeguards and controls,\" Dell told CNBC's David Faber in an interview Tuesday.\n\nDell said \"there's a role for government to play\" and that the companies building AI tools need to also set \"bounded permissions.\"\n\nHe declined to give specifics about what that government role could look like, only saying he's \"not a policymaker.\"\n\nIn recent weeks, researchers and industry experts have debated the catastrophic possibilities that could come from self-improving AI models. The outcry was sparked by former Anthropic researcher Jacob Coxon, who quit his job and warned in a Sept. 8 post that frontier labs were \" gambling with our lives \" in the race towards superintelligence.\n\nSince then, tech CEOs, including Anthropic's Dario Amodei and OpenAI's Sam Altman, have endorsed calls for more regulation and an industry-wide slowdown in frontier model development. But the Trump administration has remained staunchly against a coordinated slowdown or other regulations.\n\nPresident Donald Trump hosted a lunch on Sept. 29 with AI leaders that ended with executives signing a \"morally binding\" document to self-regulate their products' safety with the help of outside evaluators.\n\nThe White House document has made any further federal-level regulation unlikely ahead of November's midterm election, which is only weeks away. The backlash against AI and the data center build-out has reached a fever pitch and is a key issue that could help decide which party controls Congress in the final two years of Trump's term.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 12:38 AM IST", "pub_date_relative": "46m ago"}, {"title": "US Swaps Bets Backfire, Wiping Out Billions From Funds in Chile", "full_content": "(Bloomberg) -- The pension funds used by millions of Chileans are racing to close out bets on US interest rates that backfired after the Iran war unleashed a global inflation shock, exposing them to billions of dollars of losses.\n\nThe seven so-called AFPs, private pension funds that control assets worth about $229 billion and are the sole source of retirement savings for most Chileans, piled into derivatives over the past two years that would pay off if US rates continued to fall.\n\nBut they are now contending with a costly double blow: new regulations set to come into effect early next month are forcing the funds to unwind the positions just after a months-long US bond selloff pushed up yields and drove the market values of the contracts deeply into the red.\n\nThat\u2019s forcing them to pay Bank of America Corp., Citigroup Inc. and other Wall Street banks on the opposite sides of the trades in order to break the contracts.\n\nJust a year ago, the market value of foreign interest-rate derivative positions held by the AFPs stood at a $1.4 billion gain. By September, that had swung to a $7.7 billion loss, according to figures released on Tuesday by the nation\u2019s pension regulator.\n\n\u201cThey\u2019re going to have to realize the loss at some point, and that\u2019s going to hurt,\u201d said Felipe Alarc\u00f3n, chief economist at Santiago-based insurer Euroamerica.\n\nExactly how much the AFPs have already unwound, and how many more contracts they need to close to comply with the rules is unclear. The funds must meet a series of interim thresholds as they move toward full compliance.\n\nThe pension industry\u2019s association and the AFPs Capital, Cuprum, Habitat, Modelo, PlanVital, ProVida and UNO all declined to comment.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 12:33 AM IST", "pub_date_relative": "50m ago"}, {"title": "NY Fed President Williams sees no need for a rate hike in 2027", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a NY Fed President Williams sees no need for a rate hike in 2027 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper NY Fed President Williams sees no need for a rate hike in 2027 SECTIONS NY Fed President Williams sees no need for a rate hike in 2027 By Maria Eloisa Capurro , Bloomberg Last Updated: Oct 14, 2026, 12:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis At a recent conference, John Williams from the Federal Reserve Bank of New York expressed optimism about a potential interest-rate increase this year, suggesting inflation could hit the 2% goal by next year. He cited the role of artificial intelligence in affecting inflation rates while also addressing the sector's supply-demand imbalance.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 12:28 AM IST", "pub_date_relative": "56m ago"}, {"title": "Meta shares rise for a second straight day as new AI model family impresses", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:25 AM IST", "pub_date_relative": "59m ago"}, {"title": "Social Security cost-of-living adjustment for 2027 may be above average. Some say it's not enough", "full_content": "Millions of Social Security beneficiaries may see a larger-than-average cost-of-living adjustment in 2027, according to experts' estimates.\n\nThe Social Security Administration is expected to announce the COLA for 2027 on Wednesday with the release of new government inflation data. Social Security experts estimate that the COLA may raise benefits by 3.5% to 3.6% next year, which would be the largest increase in three years.\n\nYet, even with an above-average increase, beneficiaries may still struggle to cover everyday costs .\n\nMore than three-quarters of adults 50 years and older \u2014 76% \u2014 said they do not think a projected 3.5% Social Security cost-of-living adjustment for 2027 would be enough, according to an AARP survey published Monday. The poll of 1,023 adults ages 50-plus was fielded between Sept. 17 and 21. The survey had a 4.25% margin of error.\n\n\"I would love it if the cost-of-living increase was more generous,\" said Donna Dalrymple, a 70-year-old retiree in Manchester, New Hampshire.\n\nDalrymple retired at age 65 following a cancer diagnosis, she said, which prompted her to claim Social Security benefits and start 401(k) withdrawals five years earlier than she had planned. Today, she worries that other rising costs, particularly those for Medicare, may outpace the annual Social Security benefit increase, she said.\n\nCost-of-living adjustments have averaged about 3.1% over the past decade, according to the Social Security Administration.\n\nIn September, estimates showed the Social Security COLA may be the highest in three years.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:21 AM IST", "pub_date_relative": "1h ago"}, {"title": "Walmart to cover some GLP-1s, inhalers and insulin for employees at no cost as it expands benefits", "full_content": "Walmart plans to cover more than 250 prescriptions, including some insulin, inhalers and GLP-1s for diabetes, at no cost to its employees in 2027, the company confirmed to CNBC on Tuesday.\n\nThe retailer is also expanding existing benefits and adding new ones to attract and retain workers at a time when many other employers are offsetting rising healthcare costs with higher prices and scaled-back plan benefits. The announcement comes weeks before open enrollment for Walmart employees closes on Nov. 6.\n\nWalmart, the biggest private employer in the U.S., will offer Novo's diabetes injection Ozempic and Eli Lilly's rival shot Mounjaro without charge for people with Type 2 diabetes after a new prior authorization.\n\nBut the company still does not cover GLP-1s from Novo and Lilly for the purpose of weight loss. Other large employers similarly don't cover those treatments for obesity or have recently dropped coverage to tamp down on their healthcare costs.\n\nThe latest benefit changes build on Walmart's years-long effort to boost employee compensation after previously receiving criticism for the healthcare benefits and wages it offers. Walmart employs roughly 2.1 million associates worldwide, with about 1.6 million of those workers based in the U.S., as of the end of fiscal year 2026.\n\nIn a statement, the company said it's minimizing premium increases for its employees, raising rates for its starting plan by $1.50 per pay period to $39.80. Walmart told CNBC that's a smaller increase than the company made last year.\n\nThe company is also expanding an existing benefit that pays for employees to see cancer specialists at the Mayo Clinic or the Cleveland Clinic, according to a Tuesday letter to workers from Donna Morris, Walmart's chief people officer.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "JPMorgan Chase blocks outside AI agents like Muse, Instinct from directly accessing accounts", "full_content": "JPMorgan Chase won't allow outside artificial intelligence agents to access customer accounts and operate on their behalf, CEO Jamie Dimon said Tuesday, citing risks to the company and its customers as tech firms including Meta release autonomous assistants.\n\n\"We're not going to allow just any \u2026 outside agent to come in inside the company, because it's just too risky for clients and for JPMorgan,\" Dimon told analysts on the bank's third-quarter earnings call.\n\n\"You don't want rogue agents, and it could be thousands of them,\" he added, describing the potential threat to customers. In July, an OpenAI model hacked into AI company Hugging Face's servers.\n\nThe stance from Dimon, the longtime CEO of the biggest U.S. bank by assets and a de facto spokesman for the U.S. financial sector, is reminiscent of an earlier fight with fintech firms over access to customer data. JPMorgan moved to charge data middlemen including Plaid for access, a dispute that similarly pitted the bank's security concerns against tech firms' demands for access.\n\nA JPMorgan spokeswoman confirmed to CNBC that the bank currently blocks external AI agents from operating on behalf of retail customers.\n\n\"Protecting our customers is our top priority. Because it is not safe, we do not permit third parties to access accounts by obtaining customers' banking credentials and logging in on their behalf,\" the spokeswoman said.\n\n\"We support secure, customer-authorized data sharing through open banking providers and are committed to enabling agentic connections securely,\" she added.\n\nThat means that AI agents can access some customer data from Chase accounts in a read-only fashion, like customer balances, if Plaid or another connector has the user's credentials. But they can't send money or pay a bill \u2014 actions that make an agent useful.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 12:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Fake shopping sprees and \u2018happiness insurance\u2019: The latest fintech apps reveal our financial anxieties", "full_content": "Fintech companies are catching on to how Americans are altering their financial habits, and they\u2019ve created new products to try to meet the moment.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 12:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "Delaware jury awards Qualcomm $2 in damages, finds Arm breached license agreement", "full_content": "Chip technology supplier Arm Holdings breached a licensing agreement with Qualcomm and intentionally interfered with the chipmaker's business relationship with Meta Platforms , a Delaware jury found on Tuesday.\n\nThe federal jury awarded Qualcomm nominal damages of just $2 from Arm, according to court records.\n\nShares of Arm were down 1% following the verdict, while shares of Qualcomm rose 1%.\n\nThe verdict followed a five-day trial last week, the second in two years between the companies that highlighted the deterioration of their business relationship after SoftBank Group acquired control of Arm in 2016 and Arm shifted from licensing the technology needed to make chips to selling chips of its own.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:09 AM IST", "pub_date_relative": "1h ago"}, {"title": "What SpaceX Still Needs to Build a Cell Network and Challenge AT&T - Barron's", "full_content": "What SpaceX Still Needs to Build a Cell Network and Challenge AT&T Barron's SPCX Stock Slips Overnight: Analysts See T-Mobile and Verizon Holding The Edge In Starlink\u2019s Wireless Push Yahoo Finance SpaceX says Starlink is set to become a \"major mobile carrier\" after spectrum deal CBS News SpaceX Unlikely To Make Even A Dent In Verizon's Armour (NASDAQ:SPCX) Seeking Alpha T-Mobile\u2019s John Saw questions SpaceX\u2019s wireless ambitions\u2014and makes the case for towers Wireless Estimator", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 12:09 AM IST", "pub_date_relative": "1h ago"}, {"title": "I was one of the biggest shareholders in this tech stock in the 1990s. I'm bullish again because of AI", "full_content": "Flex plans to spin off Axiom, its AI infrastructure business, in 2027. Paul Meeks sees upside as data center power demand grows.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:08 AM IST", "pub_date_relative": "1h ago"}, {"title": "Airport attacks put aviation in crosshairs of geopolitical conflicts", "full_content": "Deadly attacks on Saudi Arabia's second-busiest airport over the past week are highlighting how conflicts in the Middle East are upending air travel on a larger scale.\n\nAviation is increasingly in the middle of these sprawling clashes as threats and outright attacks have forced airlines to quickly cancel flights throughout the Middle East for days, weeks and, in some cases, months. Some carriers might redeploy planes that would be going to some Middle East destinations like Dubai, United Arab Emirates, and Doha, Qatar, to other locations altogether.\n\n\"It's a new paradigm. Civil aviation is being directly targeted and it has not been the case in the last couple of decades,\" said Mark Zee, founder of OpsGroup, an independent aviation safety group whose members include pilots, dispatchers, airline employees and others.\n\nThe Saudi airport attacks , claimed by Yemen's Iran-backed Houthis, were the deadliest in the country in more than a decade. Over the weekend, at least 13 people were killed and more than 300 injured when a projectile hit terminals at King Khalid International Airport in the Saudi capital Riyadh, officials said. Other attacks have included drones.\n\n\"Historically, airport security is focused on preventing unauthorized access to aircraft and the airport, not defending airspace,\" said Jeff Price, a professor at the Metropolitan State University of Denver's Department of Aviation and Aerospace Science and an airport management consultant.\n\nThe threats to aviation are forcing officials to rethink how to protect blind spots in these major public spaces.\n\n\"There is this established way to deal with kind of more conventional weapons such as missiles. It's very expensive, but there is a way,\" said Gulnaz Ukassova, UAE-based security director of information and analysis at risk management firm International SOS. \"There is still no sort of foolproof way to deal with the threat posed by drones.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dividend, rights issue record date: Last chance to buy today - Shivam Autotech, Shraddha Prime, Anand Rathi Wealth", "full_content": "Shivam Autotech, Shraddha Prime Projects and Anand Rathi Wealth are likely to attract investors\u2019 interest in Wednesday\u2019s trade on October 14, as shareholders looking to benefit from dividends and participate in rights issues will keep an eye on these counters.\n\nShivam Autotech has announced a rights issue and fixed October 15 as the record date, while Shraddha Prime Projects has also fixed the same date for its rights issue. Anand Rathi Wealth has fixed Thursday, October 15, as the record date to determine shareholder eligibility for its \u20b9 4 interim dividend.\n\nInvestors looking to benefit from this payout must ensure they own the stock before the record date. Under India\u2019s T+1 settlement cycle, shares purchased on or after the record date will not qualify for the dividend.\n\nShivam Autotech Limited has approved a rights issue of up to 10,000,000 fully paid-up equity shares, with a face value of \u20b9 2 each, to raise up to \u20b9 12,000 lakh ( \u20b9 120 crore).\n\nThe shares are priced at \u20b9 12 per equity share, including a premium of \u20b9 10 per share, with the full amount payable upon application. Eligible shareholders as of the record date, Thursday, October 15, 2026, will be offered 19 rights equity shares for every 25 fully paid-up equity shares held.\n\nThe company said in its regulatory filing said, \u201cThe designated date for determining the equity shareholders who would be eligible to apply for the rights equity shares in the issue, subject to the terms and conditions set out in the issue materials, to be decided prior to the filing of this Letter of Offer, is Thursday, October 15, 2026.\u201d\n\nShraddha Prime Projects has also approved a rights issue worth \u20b9 96.96 crore, through which the company will issue 60.60 lakh equity shares at \u20b9 160 apiece, including a premium of \u20b9 150 per share.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 12:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold subdued ahead of US inflation data, Warsh remarks", "full_content": "Oct 13 (Reuters) - Gold prices edged lower on Tuesday, while investors awaited key US inflation data and remarks from the Federal Reserve chair due later this week to gauge the outlook on monetary policy.\n\nSpot gold fell 0.3% to $4,157.90 per ounce by 02:15 p.m. EDT (1815 GMT). US gold futures for December settled down 0.3% at $4,177.30 per ounce.\n\n\"We have some inflation data that's coming out later this week. So market is kind of waiting to see how that plays out,\" said Bob Haberkorn, senior market strategist at StoneX.\n\nHe noted the Fed chairman will deliver his last speech before the upcoming rate meeting on Thursday, and anticipates a quieter session ahead of Wednesday's and Thursday's events.\n\nInvestors are looking ahead to the Consumer Price Index data on Wednesday, while Thursday's Producer Price Index figures and remarks from Fed Chair Kevin Warsh will be closely parsed.\n\nFed Governor Christopher Waller on Tuesday said the recent rise in US bond yields reflects stronger economic growth rather than higher inflation expectations, which remain \"well anchored.\"\n\nGold loses its appeal in a high-interest-rate environment as it does not yield interest.\n\nCurrently, traders see only a 19% chance of a Fed rate hike this month but are pricing in an 88% chance of a December increase, according to CME's FedWatch tool.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 12:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "Philip R. Lane: The AI opportunity for Europe", "full_content": "AI is a general purpose technology that can improve global living standards and the global knowledge frontier by expanding access to information and raising productivity.\n\nThat said, delivering the benefits from AI depends on a host of different actors playing their part in supporting the transformation of the economy. The list is long and includes: the developers of AI frontier models (whether proprietary or open-weight); the builders of the various layers of the AI infrastructure stack; the entrepreneurs designing the customised AI products that can best unlock productivity gains in individual sectors or in relation to specialised tasks; the research and development community that can accelerate scientific discovery and compress the time lag between invention and commercial application; the operators of the energy systems that must respond to this new source of energy demand; the financial system that is required to appropriately value AI-related assets and finance AI production and AI adoption, while also incorporating AI into its own processes; the education and training sectors that must re-design instruction, learning and evaluation methods; and, finally, the managers and workers that must implement revised business processes at the sector and firm levels to maximise the benefits of AI.\n\nThis transformation also poses many challenges for political systems, civic society, policymakers and regulators at national, European and global levels in relation to the ethical, fiscal, governance and legal issues posed by AI. How these political economy issues are resolved will have a major bearing on the AI transition path, including the appropriate speed of adjustment that balances the societal benefits, costs and risks posed by AI.\n\nGiven the scale and breadth of the AI challenge, a wide range of possible timelines and outcomes can be envisaged, depending on the rate of progress along each individual dimension.", "source": "ECB Press", "pub_date_str": "14 Oct 2026, 12:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why Micron Stock (MU) Is Falling Today: Musk Flags China Chip Threat - Barron's", "full_content": "Why Micron Stock (MU) Is Falling Today: Musk Flags China Chip Threat Barron's Micron, SK Hynix stocks fall as Chinese memory maker announces progress in new design Yahoo Finance Micron, Seagate, Western Digital sink as chip sell-off deepens CNBC China\u2019s CXMT makes progress in chip design pursued by Samsung, SK Hynix South China Morning Post China\u2019s CXMT Claims Memory Advances Ahead of Samsung, Hynix Bloomberg.com", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 11:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "More Republicans come out against Trump's diesel deal with Putin", "full_content": "More Republicans are speaking out against President Donald Trump 's decision to let Vladimir Putin 's Russia temporarily export diesel fuel on the global market, expanding the bipartisan blowback over the deal.\n\nSix GOP senators joined six of their Democratic colleagues in a letter Tuesday urging Trump to cancel the arrangement allowing Russia to supply 4.8 million metric tons, or nearly 36 million barrels, of diesel through mid-April.\n\n\"This deal is a gift to our adversary and a betrayal of our Allies; it should be rescinded,\" the lawmakers wrote.\n\nRepublican Sens. Thom Tillis of North Carolina, Susan Collins of Maine, Oklahoma's Alan Armstrong, Lisa Murkowski of Alaska, Kentucky's Mitch McConnell and John Cornyn of Texas signed on, adding to the list of of GOP Congress members who had earlier questioned the deal Trump announced Friday. Armstrong has roots in the energy industry, having been CEO of Williams Companies , the largest natural gas-focused company in the U.S.\n\nThey joined Democratic Sens. Richard Blumenthal of Connecticut, New Hampshire's Jeanne Shaheen , Richard Durbin of Illinois, Delaware's Chris Coons and Rhode Island's Sheldon Whitehouse and Jack Reed .\n\nThe White House did not immediately respond to CNBC's request for comment on the letter.\n\nCollins, Murkowski and Tillis had already spoken out, joining a statement with Democrats on Sunday that urged Trump not to \"provide Putin with a financial lifeline while Russia continues to kill Ukrainian civilians.\"\n\nRepublican Sen. John Curtis of Utah had also joined that statement.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "This ugly shoe brand won over Gen Z. Its stock's low valuation could earn investors' attention", "full_content": "Crocs sales have been growing as it embraces its iconic look even as it expands to new styles, winning fans among Gen Z consumers, even in China.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 11:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gen Z renters are the only group more likely to feel successful by investing than buying a house", "full_content": "\u201cInstead of focusing on homeownership, many are prioritizing financial freedom and debt-free living.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 11:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kimberly Guilfoyle resigns as ambassador to Greece at White House's request", "full_content": "U.S. Ambassador to Greece Kimberly Guilfoyle said Tuesday she would resign, shortly after new White House press secretary Katie Zacharia said Guilfoyle was being asked to leave her post.\n\n\"While my time as Ambassador may be coming to an end, my commitment to President Trump, the America First movement, and the country I love will never end,\" Guilfoyle said in an X post.\n\nGuilfoyle also broadly denied \"recent allegations\" against her, apparently referring to multiple critical articles in The Wall Street Journal about her conduct before and after becoming an ambassador, which had prompted questions about her job security.\n\n\"These allegations are false, and I intend to vigorously defend my name, my reputation, and my integrity,\" Guilfoyle said in the post. \"I will not allow false accusations to define my decades of public service.\"\n\nAsked for comment on Guilfoyle's post, a Wall Street Journal spokesperson told CNBC, \"We stand by our reporting.\"\n\nPresident Donald Trump suggested later Tuesday morning that the reporting on Guilfoyle's conduct prompted the call for her resignation.\n\n\"She was doing a good job, but we didn't like what we were reading,\" Trump told reporters outside the White House before boarding Marine One.\n\nThe president also pushed back when a reporter noted that Guilfoyle, who was previously engaged to Trump's eldest son, Donald Trump Jr. , was almost a member of his family.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 11:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "LIC to launch three insurance plans on 19 October: Benefits, features and eligibility explained", "full_content": "The payout is based on the applicable sum assured rather than the actual cost of treatment. The plan also includes a monthly income benefit following a major-stage cancer diagnosis and a premium-waiver benefit, subject to policy conditions.\n\nLIC said the three plans will be available for purchase from 19 October 2026, both online through its website and offline through licensed insurance agents, corporate agents, brokers and insurance marketing firms.\n\nProspective policyholders should refer to LIC\u2019s official sales brochures for the detailed eligibility criteria, premium structure, benefits, exclusions and policy conditions before purchasing any of the plans.\n\nLife Insurance Corporation of India (LIC) will make three new insurance plans available for sale in the domestic market from 19 October 2026. The products cover deferred annuity, health insurance and cancer protection, according to the insurer\u2019s official announcement and regulatory disclosure.\n\nThe three products are LIC\u2019s New Jeevan Dhara-II (Plan 892), LIC\u2019s Health Shield (Plan 907) and LIC\u2019s New Cancer Cover (Plan 908). All three are non-participating and non-linked plans, LIC said.\n\nThe products serve different purposes. New Jeevan Dhara-II is a savings-oriented deferred annuity plan, while Health Shield and New Cancer Cover are individual health plans classified as pure-risk products.\n\nThe three plans cater to different financial needs, from securing a regular income after retirement to managing hospitalisation expenses and protecting against the financial impact of a cancer diagnosis.\n\nNew Jeevan Dhara-II is a non-participating, non-linked individual savings plan that provides annuity payments for life after the deferment period. LIC says annuity rates are guaranteed at policy inception.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 11:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "The latest inflation data is expected to show price increases are accelerating", "full_content": "Wednesday's closely watched reading on consumer prices could show intensifying inflationary pressures as energy costs keep climbing.\n\nEconomists polled by Dow Jones expect the headline consumer price index for September to rise 0.6% for the month and to increase 3.6% compared with a year ago. That 12-month number would signal that the rate of price growth is accelerating and moving further from the Federal Reserve 's goal of 2%.\n\nSo-called core inflation, which strips out volatile food and energy prices, is expected to increase 0.2% from August and 2.5% on a 12-month basis. While that would mark a slight slowdown from the prior month, it would be an uptick in year-over-year inflation.\n\nOil-related prices could drive the headline figure even higher, said Joe Brusuelas, chief economist at RSM, a tax firm.\n\nEnergy costs have been among the biggest drivers of inflation since the U.S. war with Iran began earlier this year. President Donald Trump last week announced loosened diesel restrictions on Russia in a bid to juice the global oil trade, though analysts don't believe it will meaningfully bring down prices.\n\nPrices for Brent crude, the global oil benchmark, climbed more than 14% in September, bringing its third-quarter advance to about 42%. Brent prices on Tuesday traded around $105 per barrel.\n\n\"We've got real upside risk on the September CPI,\" Brusuelas said. \"Typically, when we have these moves in inflation, everyone's models undershoot the actual outcome.\"\n\nSticky oil prices could also push up costs for items in other, non-energy categories, according to Robert Sockin, chief U.S. economist at asset manager PGIM. In this scenario, it would become harder for the Fed to write off the energy prices surge as a short-term shock that won't necessitate interest rate increases.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 11:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ram Kapoor Shares New Selfie After Dramatic Weight Loss; Fans Say He Has Lost Too Much Weight", "full_content": "Ram Kapoor recently shared a new selfie on Instagram, prompting fans to praise his changed appearance while some expressed concern over his dramatic weight loss.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Brutal session for chip stocks shows AI trade is turning - Reuters", "full_content": "Brutal session for chip stocks shows AI trade is turning Reuters The AI trade is cracking. Here's how to profit CNBC World stocks slip as AI spending worries hit chipmakers Reuters Entegris, Intel, KLA Corporation, Lam Research, and Microchip Technology Shares Are Falling, What You Need To Know Yahoo Finance Tech Stocks: Cracks Are Starting to Appear in the AI Trade Bloomberg.com", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 11:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Suriya's Scene Gets Diwali Release Date: Plot, What We Know About Tamil Action Comedy", "full_content": "Scene stars Suriya, Nazriya Nazim and Naslen in a Tamil action comedy directed by Jithu Madhavan. The film is scheduled to release in theatres on November 6, 2026, coinciding with Diwali.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Minutes of the Board's discount rate meetings on August 17, September 9, and September 16, 2026", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 2:00 p.m. EDT Share --> --> --> --> --> --> The Federal Reserve Board on Tuesday released the minutes from its recent meetings to review and determine the discount rates provided to depository institutions through the discount window. Today's minutes cover the Board meetings that occurred on August 17, September 9, and September 16, 2026.\n\nThe Board's process for setting the discount rate is distinct from the process the Federal Open Market Committee follows in setting the target range for the federal funds rate.\n\nFor media inquiries, please email [email protected] or call 202-452-2955.", "source": "Federal Reserve", "pub_date_str": "13 Oct 2026, 11:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "The Vvaan- Force of the Forrest Box Office Day 19: Sidharth Malhotra Film Maintains Its Grip At Theatres", "full_content": "The Vvaan - Force of the Forrest has collected Rs 47.96 lakh on Day 19 so far, taking its India gross to Rs 77.78 crore", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 Results Highlights: Hero Motors Profit Doubles, Tata Elxsi Revenue Up 3%", "full_content": "Q2 Results Highlights: Tata Elxsi, ICICI Prudential Life Insurance, Anand Rathi Share and Stock Brokers and 19 other companies will announce their Q2 FY27 earnings today, October 13. Track every earnings update live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Can RBI Hike Rates To Save The Rupee? Governor Malhotra Explains The Trade-Off", "full_content": "RBI Governor Sanjay Malhotra says price stability hinges on a stable financial system as the central bank tightens forex rules to curb speculative bets, ensure orderly currency movement and ease pressure on the rupee.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "Capital goods stocks fall after multibagger rally. Is this a buying opportunity for long-term investors?", "full_content": "2026 has been a strong year for high-voltage transmission and distribution (T&D) equipment stocks, with Hitachi Energy India , GE Vernova T&D India , Siemens Energy India , and CG Power and Industrial Solutions rising 66%, 34%, 23%, and 35%, respectively, year-to-date (YTD). In comparison, the BSE Capital Goods Index has gained 10% over the same period.\n\nThe rally has come at a time when broader markets have been impacted by escalating geopolitical tensions. However, the sector has attracted investor interest amid a widening global supply-demand gap for high-voltage power equipment, including transformers, switchgear, and circuit breakers, as well as strong multi-year order pipelines for companies in both domestic and international markets.\n\nHowever, the rally in these stocks has recently paused as investors appear to be booking profits amid concerns over elevated valuations.\n\nNevertheless, domestic brokerage firm 360 ONE Capital Markets said the recent price correction in these stocks has eased concerns over rich valuations, as much of the potential upside had already been priced in, leaving little room for error.\n\nIn its latest report, the brokerage has initiated coverage on three companies exposed to the high-voltage power equipment theme: Hitachi Energy India, GE Vernova T&D India, and CG Power and Industrial Solutions.\n\nThe brokerage sees a structural, multi-year growth opportunity in T&D, driven by high-voltage direct current (HVDC) technology, transformers, and grid expansion.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "New SEC rules would fleece everyday investors to enrich Wall Street", "full_content": "New proposals from the Securities and Exchange Commission will tilt the scales in favor of Wall Street and against a huge group of retail investors.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 11:24 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Copper Slips as AI Selloff Saps Appetite for Risk Across Markets", "full_content": "(Bloomberg) -- Copper wavered as traders weighed investor angst around overheated spending on metal-intensive AI infrastructure against continued supply risks.\n\nAI and technology stocks dropped across global markets following a slew of warnings that the rapid buildout of data centers will become more difficult to finance. South Korea\u2019s equity benchmark \u2014 which has been correlated with copper prices at times this year \u2014 slumped as much as 7%.\n\nCopper bulls argue that AI infrastructure will be a key source of demand in the coming decade, and any doubts about the pace of spending can hit sentiment. Still, the major driver for the red metal\u2019s 18% rally this year has been the threat of US import tariffs, which has pulled huge volumes into the country and cut availability elsewhere.\n\n\u201cWhile not acting as the sole rationale behind the copper price performance in 2026 thus far, AI-driven sentiment is expected to continue to shape, if not dominate, the narrative in the coming years,\u201d BMI, a Fitch Solutions company, said in a note.\n\nThe pull of metal into the US has helped tighten the copper market, as have a series of disruptions at key mines. The cash price for copper was at a premium of about $132 a ton to benchmark three-month futures on Tuesday, a condition called backwardation that indicates there\u2019s not enough immediate supply.\n\nIn China, meanwhile, the Yangshan import premium \u2014 a gauge of demand \u2014 last week hit its highest level since 2022.\n\nCopper was 0.2% lower at $14,596 a ton on the London Metal Exchange as of 1:31 p.m. local time. Aluminum dropped 0.6% and zinc steadied.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 01:19 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Williams says Fed may not have to hike rates in 2027, at odds with traders", "full_content": "New York Federal Reserve President John Williams said Tuesday that he doesn't see additional rate hikes in 2027 after one more increase this year.\n\n\"I haven't changed my view that it may be appropriate to have one more rate hike,\" Williams said in an interview with Bloomberg News. \"I don't think at this time I have any reason to believe that we would need to do more.\"\n\nWilliams' comments place him at odds with the market and some other members of the central bank.\n\nFed funds futures traders are largely betting that the central bank will raise rates at least once in 2027, according to CME's FedWatch data as of Tuesday. Latest trading gave about 90% odds that the Fed overnight rate would end 2027 at least a half percentage point higher than where it is today.\n\nThe New York Fed head is also at odds with many Federal Open Market Committee members, though he is still in-line with the majority. Eight of the 18 who gave a rate forecast for 2027 see one more increase after an additional hike this year. Williams is a permanent voting member of FOMC, the body that decides where interest rates should be set at each Fed policy gathering.\n\nThe Fed in September issued its first rate increase since 2023 . Fed officials indicated plans for another hike in meeting minutes, but did not clarify when. The central bank meets at the end of this month and then one more time in December.\n\nTo be sure, Williams told Bloomberg that \"we'll have to see\" when it comes to forecasting into the new year.\n\n\"This economy is being affected by lots of different influences, and we just have to keep watching the data,\" Williams said.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 01:16 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500 is little changed as traders mull over bank earnings; chip stocks slide: Live updates", "full_content": "The S&P 500 traded near the flatline on Tuesday, with traders digesting a slew of corporate earnings reports from major banks along with a steep overnight decline in South Korea that put pressure on memory chip names.\n\nThe S&P 500 was little changed on the day, while the Nasdaq Composite dropped 0.1%. The Dow Jones Industrial Average slipped 135 points, or 0.3%, lower, giving back an earlier gain. At its high of the day, the 30-stock index was up more than 460 points.\n\nJPMorgan Chase reported third-quarter earnings and revenue that missed analyst expectations, but the bank raised its net interest income guidance for 2026. Shares were last little changed on the day. Wells Fargo shed 2% on mixed Q3 numbers, while Goldman Sachs rose slightly after its revenue for the third quarter surpassed expectations.\n\n\"These banks still reported strong numbers, it's just that expectations were high, and higher expectations is a risk for companies across the board during this current earnings season,\" said Rebecca Walser, chief investment officer at Walser Wealth Management.\n\nUnitedHealth , meanwhile, was marginally higher after the insurance giant's results exceeded analyst expectations.\n\nThe early reports could set the tone for an earnings season with lofty expectations. Analysts on average expect S&P 500 profits grew by nearly 30% from the year-earlier period, according to FactSet.\n\nMemory stocks were under pressure after South Korea's Kospi benchmark dropped 5.5% \u2014 reaching its lowest level since July 31 \u2014 on valuation concerns in the space along with growing competition out of China. This week, China's CXMT said it plans to release a new, more powerful chip by year-end.\n\nSK hynix slipped nearly 4%. Seagate Technology and Western Digital lost 2%. Micron Technology and Sandisk fell almost 5% and more than 2%, respectively.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 01:08 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed\u2019s Williams sees no need for rate hike in 2027, Bloomberg News reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 12:54 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Paul Tudor Jones says 2027 could be a really challenging year for the stock market", "full_content": "Legendary hedge fund manager Paul Tudor Jones told CNBC that next year could be a tough one for the stock market because of increased equity supply from big tech initial public offerings coming down the pipe as well as a potential reckoning from the ballooning U.S. fiscal deficit.\n\n\"2027 is going to be really, really challenging for the stock market,\" Jones told \" Squawk Box \" on Tuesday. \"You've probably got the most negative flow picture for the U.S. stock market that we've had, say, since 2002.\"\n\nThe founder and chief investment officer of Tudor Investment said that corporate buybacks, along with mergers and acquisitions, have been a tail wind for the stock market for most of this four-year bull market as they decreased the equity supply.\n\nThat tide is now turning against the market with major offerings ahead in the AI space from Anthropic and OpenAI, along with one just finished for SpaceX . There will also likely be more secondary offerings from companies in order to raise money for the AI build-out, said Jones. It all adds up to an increased equity supply picture that could weigh on prices.\n\nThe billionaire hedge fund manager's comments come as investors worry that a bull market now in its fourth year could start to dwindle and run out of steam as concerns grow around mounting inflation, higher bond yields and a more hawkish Federal Reserve.\n\nJones repeated that the current period in the market is akin to 1999 , just about a year before the dot-com bubble burst in 2000. He noted the bifurcation in the current market between those companies benefiting from the AI boom and those that aren't.\n\nHe also added that a ballooning fiscal deficit is among the dangers for the current stock market, for which he thinks there could be a reckoning.\n\n\"We're never going to fix these deficits until the market makes us to. It's going to be just like 2008 and TARP [Troubled Asset Relief Program]. So that's the reality.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:51 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Natural Gas tests double top at $3.317: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 12:48 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Silver compresses at $59.50 with key support at $58.70: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 12:48 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nasdaq 100 bounces off 30,600 support: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 12:48 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bihar joins Maharashtra, UP in curbing sale of non-subsidised fertiliser", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Bihar joins Maharashtra, UP in curbing sale of non-subsidised fertiliser The Economic Times daily newspaper is available online now. Read Today's Paper Bihar joins Maharashtra, UP in curbing sale of non-subsidised fertiliser SECTIONS Bihar joins Maharashtra, UP in curbing sale of non-subsidised fertiliser By Shambhavi Anand , ET Bureau Last Updated: Oct 14, 2026, 12:45:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bihar has imposed restrictions on the sale of non-subsidised fertilisers to control access for farmers. These restrictions could limit the availability of advanced crop nutrition products through existing distribution networks. Industry executives warn that this move may lead to significant losses and hinder investment in new technologies. Concerns have been raised about potential impacts on soil health and crop productivity.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 12:45 AM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bank earnings takeaways: Here's how JPMorgan, Goldman, Wells Fargo and Citi performed in Q3", "full_content": "Four of the largest U.S. banks reported third-quarter results on Tuesday: JPMorgan Chase , Wells Fargo , Goldman Sachs and Citigroup .\n\nBank of America and Morgan Stanley will post earnings on Wednesday.\n\nThe quarter was dominated by headlines around artificial intelligence, IPO uncertainty, high fuel prices and rising borrowing costs.\n\nThe banks that reported Tuesday put up mixed results . JPMorgan, the biggest U.S. bank by assets and the largest in the world by market capitalization, posted a rare miss. Goldman Sachs, meanwhile, blew past estimates for revenue and earnings per share, led by strong equities trading.\n\nAnalyst calls for all four banks touched on the opportunities and risks associated with AI, citing robust financing demand and operational advantages, but also the threat of rogue agents.\n\nGoldman Sachs CEO David Solomon also addressed recent reports of a CEO transition plan, and Wells Fargo CFO Mike Santomassimo joined CNBC to discuss the firm's growth and the state of the consumer.\n\nCiti's analyst call is over, which means bank earnings reports for Tuesday are wrapped. Bank of America and Morgan Stanley report on Wednesday to round out third-quarter results for the major U.S. firms.\n\nWells Fargo's Santomassimo told CNBC that both consumers and businesses are doing \"really well.\"", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:42 AM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MSMEs need to focus on quality, cost to gain from new FTAs: Secy", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a MSMEs need to focus on quality, cost to gain from new FTAs: Secy The Economic Times daily newspaper is available online now. Read Today's Paper MSMEs need to focus on quality, cost to gain from new FTAs: Secy SECTIONS MSMEs need to focus on quality, cost to gain from new FTAs: Secy By Last Updated: Oct 14, 2026, 12:39:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's expanding network of free trade agreements is creating new opportunities for MSMEs to grow. The MSME ministry emphasizes the need for improved quality and cost competitiveness to access these opportunities. Moreover, government support for first-time exporters through practical assistance is crucial for success. It is essential to enhance certification participation and upgrade testing infrastructure to meet international standards.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 12:39 AM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Swaps Bets Backfire, Wiping Out Billions From Funds in Chile", "full_content": "(Bloomberg) -- The pension funds used by millions of Chileans are racing to close out bets on US interest rates that backfired after the Iran war unleashed a global inflation shock, exposing them to billions of dollars of losses.\n\nThe seven so-called AFPs, private pension funds that control assets worth about $229 billion and are the sole source of retirement savings for most Chileans, piled into derivatives over the past two years that would pay off if US rates continued to fall.\n\nBut they are now contending with a costly double blow: new regulations set to come into effect early next month are forcing the funds to unwind the positions just after a months-long US bond selloff pushed up yields and drove the market values of the contracts deeply into the red.\n\nThat\u2019s forcing them to pay Bank of America Corp., Citigroup Inc. and other Wall Street banks on the opposite sides of the trades in order to break the contracts.\n\nJust a year ago, the market value of foreign interest-rate derivative positions held by the AFPs stood at a $1.4 billion gain. By September, that had swung to a $7.7 billion loss, according to figures released on Tuesday by the nation\u2019s pension regulator.\n\n\u201cThey\u2019re going to have to realize the loss at some point, and that\u2019s going to hurt,\u201d said Felipe Alarc\u00f3n, chief economist at Santiago-based insurer Euroamerica.\n\nExactly how much the AFPs have already unwound, and how many more contracts they need to close to comply with the rules is unclear. The funds must meet a series of interim thresholds as they move toward full compliance.\n\nThe pension industry\u2019s association and the AFPs Capital, Cuprum, Habitat, Modelo, PlanVital, ProVida and UNO all declined to comment.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 12:33 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Derivatives", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NY Fed President Williams sees no need for a rate hike in 2027", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a NY Fed President Williams sees no need for a rate hike in 2027 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper NY Fed President Williams sees no need for a rate hike in 2027 SECTIONS NY Fed President Williams sees no need for a rate hike in 2027 By Maria Eloisa Capurro , Bloomberg Last Updated: Oct 14, 2026, 12:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis At a recent conference, John Williams from the Federal Reserve Bank of New York expressed optimism about a potential interest-rate increase this year, suggesting inflation could hit the 2% goal by next year. He cited the role of artificial intelligence in affecting inflation rates while also addressing the sector's supply-demand imbalance.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 12:28 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Social Security cost-of-living adjustment for 2027 may be above average. Some say it's not enough", "full_content": "Millions of Social Security beneficiaries may see a larger-than-average cost-of-living adjustment in 2027, according to experts' estimates.\n\nThe Social Security Administration is expected to announce the COLA for 2027 on Wednesday with the release of new government inflation data. Social Security experts estimate that the COLA may raise benefits by 3.5% to 3.6% next year, which would be the largest increase in three years.\n\nYet, even with an above-average increase, beneficiaries may still struggle to cover everyday costs .\n\nMore than three-quarters of adults 50 years and older \u2014 76% \u2014 said they do not think a projected 3.5% Social Security cost-of-living adjustment for 2027 would be enough, according to an AARP survey published Monday. The poll of 1,023 adults ages 50-plus was fielded between Sept. 17 and 21. The survey had a 4.25% margin of error.\n\n\"I would love it if the cost-of-living increase was more generous,\" said Donna Dalrymple, a 70-year-old retiree in Manchester, New Hampshire.\n\nDalrymple retired at age 65 following a cancer diagnosis, she said, which prompted her to claim Social Security benefits and start 401(k) withdrawals five years earlier than she had planned. Today, she worries that other rising costs, particularly those for Medicare, may outpace the annual Social Security benefit increase, she said.\n\nCost-of-living adjustments have averaged about 3.1% over the past decade, according to the Social Security Administration.\n\nIn September, estimates showed the Social Security COLA may be the highest in three years.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:21 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Walmart to cover some GLP-1s, inhalers and insulin for employees at no cost as it expands benefits", "full_content": "Walmart plans to cover more than 250 prescriptions, including some insulin, inhalers and GLP-1s for diabetes, at no cost to its employees in 2027, the company confirmed to CNBC on Tuesday.\n\nThe retailer is also expanding existing benefits and adding new ones to attract and retain workers at a time when many other employers are offsetting rising healthcare costs with higher prices and scaled-back plan benefits. The announcement comes weeks before open enrollment for Walmart employees closes on Nov. 6.\n\nWalmart, the biggest private employer in the U.S., will offer Novo's diabetes injection Ozempic and Eli Lilly's rival shot Mounjaro without charge for people with Type 2 diabetes after a new prior authorization.\n\nBut the company still does not cover GLP-1s from Novo and Lilly for the purpose of weight loss. Other large employers similarly don't cover those treatments for obesity or have recently dropped coverage to tamp down on their healthcare costs.\n\nThe latest benefit changes build on Walmart's years-long effort to boost employee compensation after previously receiving criticism for the healthcare benefits and wages it offers. Walmart employs roughly 2.1 million associates worldwide, with about 1.6 million of those workers based in the U.S., as of the end of fiscal year 2026.\n\nIn a statement, the company said it's minimizing premium increases for its employees, raising rates for its starting plan by $1.50 per pay period to $39.80. Walmart told CNBC that's a smaller increase than the company made last year.\n\nThe company is also expanding an existing benefit that pays for employees to see cancer specialists at the Mayo Clinic or the Cleveland Clinic, according to a Tuesday letter to workers from Donna Morris, Walmart's chief people officer.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:18 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "JPMorgan Chase blocks outside AI agents like Muse, Instinct from directly accessing accounts", "full_content": "JPMorgan Chase won't allow outside artificial intelligence agents to access customer accounts and operate on their behalf, CEO Jamie Dimon said Tuesday, citing risks to the company and its customers as tech firms including Meta release autonomous assistants.\n\n\"We're not going to allow just any \u2026 outside agent to come in inside the company, because it's just too risky for clients and for JPMorgan,\" Dimon told analysts on the bank's third-quarter earnings call.\n\n\"You don't want rogue agents, and it could be thousands of them,\" he added, describing the potential threat to customers. In July, an OpenAI model hacked into AI company Hugging Face's servers.\n\nThe stance from Dimon, the longtime CEO of the biggest U.S. bank by assets and a de facto spokesman for the U.S. financial sector, is reminiscent of an earlier fight with fintech firms over access to customer data. JPMorgan moved to charge data middlemen including Plaid for access, a dispute that similarly pitted the bank's security concerns against tech firms' demands for access.\n\nA JPMorgan spokeswoman confirmed to CNBC that the bank currently blocks external AI agents from operating on behalf of retail customers.\n\n\"Protecting our customers is our top priority. Because it is not safe, we do not permit third parties to access accounts by obtaining customers' banking credentials and logging in on their behalf,\" the spokeswoman said.\n\n\"We support secure, customer-authorized data sharing through open banking providers and are committed to enabling agentic connections securely,\" she added.\n\nThat means that AI agents can access some customer data from Chase accounts in a read-only fashion, like customer balances, if Plaid or another connector has the user's credentials. But they can't send money or pay a bill \u2014 actions that make an agent useful.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 12:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Finan
