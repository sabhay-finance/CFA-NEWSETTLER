 consensus estimate of $1.05 billion. The outlook raised concerns about whether its advertising business can maintain its growth momentum amid changes in online search.\n\nChief Executive Steve Huffman said daily active unique visitors could decline by a low double-digit percentage in the current quarter from approximately 130 million if referral traffic continues to weaken.\n\nReddit has increasingly blamed changes to Google\u2019s search experience for reducing the number of users directed to its platform.\n\nThe company\u2019s warning highlights how Google\u2019s shift towards AI-powered search, which can answer queries directly, is disrupting the flow of traffic to websites that have traditionally relied on the search engine to attract users.\n\nAI-powered search features can provide answers directly, potentially reducing the need for users to click through to websites and online communities. Huffman said search engine referrals to Reddit had declined by more than one million on average each week during October.\n\nHe also argued that Google\u2019s AI search experience was failing to direct users to the platform despite continuing to crawl its content.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 10:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "15 Million Jobs At Risk From AI? Goldman Sachs Has A Timeline Involving The Recession", "full_content": "Goldman Sachs estimates AI could displace 15 million US workers, but history suggests the biggest job losses may emerge during a recession, with older workers facing a tougher recovery.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 10:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Binance rushes to recover customer money after $6.3bn heist", "full_content": "World\u2019s largest crypto exchange says an engineer\u2019s laptop was compromised in major security breach", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 10:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "RIL, JPL Q2 results 2026 impact: Reliance Industries, Jio Platforms shares in focus on Monday 2 Nov - What to expect?", "full_content": "RELIANCE A Ksheerasagar Published 30 Oct 2026, 10:27 PM IST Prefer Livemint on Google Reliance Industries and Jio Platforms are set to be in the spotlight on Monday after announcing their Q2 FY27 results, with investors assessing the earnings impact on both stocks.\n\nThe results mark an important milestone for recently listed Jio Platforms, which has become the second-largest listed entity in the Reliance Group by market capitalisation, after Reliance Industries\n\nThe market reaction on Monday will offer the first indication of how investors are evaluating the two companies\u2019 latest quarterly performance.\n\nReliance Industries Ltd reported a record consolidated profit after tax (PAT) of \u20b9 29,550 crore for the July-September quarter (Q2 FY27), marking a 33.8% increase from \u20b9 22,092 crore in the year-ago period. Revenue rose 27.8% year-on-year (YoY) to \u20b9 3,62,268 crore, while EBITDA increased 23.9% to a record \u20b9 62,409 crore.\n\nThe strong performance was primarily driven by a recovery in the oil-to-chemicals (O2C) business, where EBITDA surged 67.9% to \u20b9 25,203 crore, supported by higher global fuel margins and improved petrochemical spreads. O2C revenue increased 44.2% to \u20b9 2,31,601 crore, with supply disruptions in West Asia and other regions pushing transportation fuel cracks higher.\n\nDigital services also supported earnings, while the retail business remained a relative weak spot. Reliance Retail Ventures reported a 24.3% decline in PAT to \u20b9 2,611 crore, despite a 6.4% rise in revenue to \u20b9 91,716 crore. Its EBITDA, before a one-time impairment charge, fell 8.6% to \u20b9 6,228 crore.\n\nCommenting on the results, Chairman Mukesh Ambani said the company's businesses delivered a strong performance despite volatile commodity markets and geopolitical tensions.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 10:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Halloween gets pricier as chocolate costs climb \u2014 Hershey may feel the pinch", "full_content": "Higher cocoa and sugar prices are fueling above-average cost inflation for candy", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 10:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sun Pharma Q2 profit falls 36% as litigation costs hit earnings", "full_content": "Sun Pharma reported a 36% decline in Q2FY27 net profit to Rs 1,989 crore due to exceptional litigation and acquisition-related costs. Revenue grew 11.8%, supported by strong domestic and emerging market sales, while US formulations weakened.", "source": "Economic Times Markets", "pub_date_str": "30 Oct 2026, 10:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq hits near three-month low as Amazon, Intel rattle AI trade - Reuters", "full_content": "Nasdaq hits near three-month low as Amazon, Intel rattle AI trade Reuters Stocks slump, bonds leap     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
