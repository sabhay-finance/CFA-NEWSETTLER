<script>

    const allData = {"general": [{"title": "MDR on UPI transactions: NPCI announces 0.4% on payments above \u20b92,000 \u2014 Check details", "full_content": "The National Payments Council of India (NPCI) today announced merchant discount rate (MDR) on select UPI (person to merchant) transactions.\n\nIn a statement released on 15 September, the NPCI said a revised UPI Merchant Discount Rate (MDR) framework has been introduced on select merchant transactions.\n\nIt keeps UPI free for consumers. The framework keeps 95% of low value UPI transactions below Rs. 2,000 and small merchant transactions (P2PM) completely free and proposes a new fund to support the expansion of UPI acceptance among small merchants.\n\nThe initiative will expand UPI acceptance, encourage sustained usage, and accelerate the inclusion of small businesses in India's digital payments ecosystem.\n\nThe reasonable MDR charge on high value transactions shall be distributed amongst the UPI ecosystem players which will ensure UPI expansion to new users and merchants, investments into resiliency, cyber security and innovation.\n\nJocelyn Fernandes is a journalist and editor with nearly 13 years of experience covering the business, corporate, economy and markets beats in news.<br> As chief content producer for around three years at Livemint (Hindustan Times), Jocelyn publishes breaking stories, explainers, features and live blogs on a range of business and economy topics, including the Budget, corporate developments, stock markets, income tax, money and personal finance, cryptocurrency, government policy, impact of US tariffs, international developments and more.<br> Jocelyn's writing philosophy is focused on delivering news in an accurate and accessible format for readers.", "source": "LiveMint Money", "pub_date_str": "15 Sep 2026, 06:59 PM IST", "pub_date_relative": "6m ago"}, {"title": "Will AI really destroy humanity? Pioneers who created the tech weigh in", "full_content": "As researchers warn that AI could pose catastrophic risks, some of the pioneers who helped develop the technology are weighing in with additional warnings on the dangers of unfettered advances in capability.\n\nA series of stark AI safety warnings has emerged over the past week, with researchers from major AI labs like Anthropic, OpenAI and Google DeepMind all sounding the alarm about potentially catastrophic risks from developing the technology.\n\nAI bosses including Sam Altman, Dario Amodei, Demis Hassabis and Elon Musk have shown rare agreement in calling for a slowdown and regulatory oversight.\n\nMeanwhile, concerns have also intensified debate in Washington. While some members of Congress from both Democratic and Republican parties have advocated for bills to check the progress of AI, U.S. President Donald Trump on Monday raged against growing calls for AI regulation.\n\nBut what do the people who helped create AI think of the existential risks many are currently building the technology today?\n\nYoshua Bengio is a Canadian computer scientist, considered to be a central pioneer of modern deep learning.\n\n\"Scientists at frontier AI labs have unique insight into the most advanced models,\" Bengio said on Sept. 9, in response to Anthropic researcher Jacob Coxon announcing his resignation. Coxon had warned that AI could \"kill us all by the end of the decade.\"\n\nScientists often see \"the associated risks months before models are released to the public,\" he added. \"Their perspective is vital for keeping society informed and should be taken very seriously.\"", "source": "CNBC World Economy", "pub_date_str": "15 Sep 2026, 06:54 PM IST", "pub_date_relative": "11m ago"}, {"title": "10-year Treasury yield rises to highest since 2007 as Fed rate-hike expectations rise", "full_content": "The benchmark 10-year Treasury yield climbed to its highest levels in 19 years on Tuesday as oil prices surge from the Iran conflict and expectations grow that the Federal Reserve will raise interest rates on Wednesday. The rate milestone could ripple through the economy as the 10-year yield is a benchmark for consumers loans and corporate funding.\n\nThe 10-year yield was last up more than 3 basis points to around 5%. Earlier in the session, it scaled to 5.041%, the highest since July 2007. One basis point equals 0.01 percentage point, and yields and prices move in opposite directions.\n\nYields on the U.S. 10-year Treasury The yield on the longer-dated 30-year Treasury bond , more sensitive to geopolitical risks, rose 4 basis points to 5.368%. The yield had hit a high of 5.401% \u2014 also its highest level since June 2007.\n\nThe 2-year Treasury note yield climbed more than 1 basis point to 4.648%. It had earlier reached its highest level since July 2024 at 4.688%.\n\nThe move comes at the start of the Fed's two-day policy meeting, with markets pricing in higher chances of a quarter-point rate hike when the meeting concludes Wednesday after August inflation remained well above the central bank's 2% target. Traders are pricing in a more than 92% chance that the Fed will raise rates by 25 basis points in its latest meeting, according to the CME FedWatch tool .\n\n\"U.S.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:52 PM IST", "pub_date_relative": "13m ago"}, {"title": "US Senate to vote on Clarity Act, decide fate of landmark crypto bill \u2014 All we know", "full_content": "Sept 15 (Reuters) \u2014 TheU.S. Senate is set to vote on Tuesday on whether to advance once-in-a-generation cryptocurrency legislation, potentially determining the fate of the bill as Republican Senate leaders grapple with a limited calendar in a busy election year.\n\nThe bill, dubbed the Clarity Act, would create a regulatory framework for digital \u200cassets, which crypto companies say would put them on more solid legal footing. The deep-pocketed industry has spent hundreds of millions of dollars campaigning to advance the bill.\n\nBut it remained unclear if the legislation could garner the 60 votes it needs to advance, even after Senate Republicans on Sunday released a new text in an effort to address concerns from the banking industry and some Democrats. The Senate is set to hold its vote shortly after 2 p.m. EDT (1800 GMT).\n\nAlthough passage of the Clarity Act would be positive for the crypto ecosystem \u2014 and has been broadly supported by the crypto industry \u2014 investors and analysts have said that the crypto market had mostly priced in that the bill would not be passed into law in the foreseeable future, Reuters reported on Monday.\n\n\"Another delay would be negative but probably not a new regime shock, whereas passage would reduce legal uncertainty and could unlock additional institutional activity,\" said Can-Luca K\u00f6ymen, investment strategist at digital asset bank Sygnum.\n\nWhile the vote is procedural, it is seen as a key test and little time on the calendar remains for Senate Republicans to try to revive the bill if the vote fails, according to analysts.\n\nDemocrats have been pushing for the bill to include stricter limits on public officeholders profiting off their own crypto ventures, a push in part aimed at U.S. President Donald Trump's meme coin and World Liberty Financial, a crypto company that is run by his sons.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago"}, {"title": "The Biggest Social Security Mistakes Retirees Make in Their First Year", "full_content": "Skip to navigation Skip to main content Skip to right column The Biggest Social Security Mistakes Retirees Make in Their First Year Christy Bieber, The Motley Fool Tue, September 15, 2026 at 8:20 AM CDT 4 min read Social Security benefits are often a critical source of income for seniors, many of whom depend on these benefits to supplement income from retirement plans . Unfortunately, there are many confusing rules related to Social Security benefits that far too many retirees don't really understand.\n\nSometimes, seniors find out about these complicated rules and regulations only after they've actually retired and begun claiming their benefits. This could lead to costly errors or decisions they later regret. To make sure this doesn't happen to you, be aware of these common Social Security mistakes seniors often make in their first year.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nOne huge mistake many retirees make in their first year relates to not understanding the tax rules that apply to their Social Security benefits.\n\nSee, Social Security benefits may be partially taxable once provisional income exceeds a certain threshold. Provisional income is half of your Social Security benefit, all of your taxable income, and certain types of non-taxable income. As soon as your provisional income exceeds $25,000, you'll start to be taxed on part of your benefits if you're a single tax filer. If you're a married tax filer, taxes kick in once your income exceeds $32,000.\n\nIf you aren't aware of this, you may be surprised to find that you owe tax on Social Security and don't get to use the entire amount of your benefits.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:50 PM IST", "pub_date_relative": "16m ago"}, {"title": "Children's clothing retailer Carter's is rebranding to appeal to a new generation of parents", "full_content": "Children's clothing brand Carter's is undergoing a revamp to better align with the new generation of parents as its namesake company tries to recover from sluggish performance in recent years.\n\nThe rebrand, announced Tuesday, includes a new logo and marketing campaign that Chief Marketing Officer Sarah Crockett told CNBC aims to keep the 161-year-old company relevant with its core customer.\n\n\"We recognize that the market difference of our parents in the communities that we're serving is significant,\" Crockett said. \"We had an opportunity to really tap into the values that parents are bringing into the household.\"\n\nCarter's largest brands include its namesake banner and OshKosh B'gosh, which are sold in standalone stores around the U.S. and in retailers including Walmart , Target and Amazon . The rebrand comes as the overall company has shrunk its store footprint and laid off some employees over the past year to try to reposition itself for growth, especially as the market for baby and kids clothing has grown more competitive.\n\nWall Street has taken note of the company's issues. Over the past three years, Carter's stock has plunged more than 50%, bringing its market cap to around $1 billion.\n\nFor the full 2025 fiscal year, Carter's reported adjusted net income of $126.1 million, down sharply from $210.7 million the year before. Last year, then-CEO Douglas Palladini said elevated product costs, higher tariffs and additional investments \"weighed meaningfully\" on the company's profitability.\n\nLast October, Palladini said Carter's was eliminating 15% of its corporate workforce and shuttering 150 North American stores as leases expired in an effort to \"rightsize\" the company.\n\nSince then, Carter's has started to show more bright spots. And the rebrand aims in part to capitalize on the momentum.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago"}, {"title": "Executive at Iconic Energy Company Sells Nearly 4,000 Shares", "full_content": "Skip to navigation Skip to main content Skip to right column Executive at Iconic Energy Company Sells Nearly 4,000 Shares Jake Lerch, The Motley Fool Tue, September 15, 2026 at 8:19 AM CDT 5 min read BKR Amerino Gatti, EVP of Oilfield Services & Equip at Baker Hughes Company (NASDAQ:BKR), reported a disposition of 3,860 shares of Class A Common Stock on Sept. 3, 2026, as disclosed in a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($63.64); post-transaction value based on Sept. 03, 2026, market close ($63.64).\n\nWhat was the specific nature of this equity disposition? The transaction was a non-discretionary event intended to cover tax liabilities. These shares were withheld by Baker Hughes as part of a structured vesting schedule for restricted stock units, a routine process that is separate from discretionary market sales or purchases.\n\nHow has the executive's total ownership changed following this filing? Despite the tax-related disposition of 3,860 shares, the underlying vesting event and an exercise of 9,807 options resulted in a net increase in the insider's total direct position. The direct holding rose from 14,804 shares to 20,751 shares of Class A Common Stock.\n\nWhat is the current status of the insider's total equity exposure? Amerino Gatti maintains direct ownership of 20,751 shares, which were valued at $1.32 million based on the market close on the transaction date. The insider also holds 9,807 derivative securities, including unvested options and awards scheduled for future vesting installments.\n\nWhat is the broader market context for this transaction? As of the Sept. 8, 2026, market close of $63.92, the remaining direct stake is valued at approximately $1.3 million.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago"}, {"title": "When people with student debt try to save for retirement, they fall behind early and never catch up", "full_content": "If all employers matched debt payments, workers would save more than $10 billion.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Sep 2026, 06:48 PM IST", "pub_date_relative": "18m ago"}, {"title": "An AI bubble is no longer Wall Street\u2019s biggest fear. This stock-market risk just took its place.", "full_content" click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "15 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago"}, {"title": "A sharp stock market decline could lie around the corner, Wells Fargo warns", "full_content": "Wells Fargo is skeptical that equities can keep marching higher from current levels.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago"}, {"title": "Oil prices edge higher as attacks, pipeline outage deepen Saudi supply concerns", "full_content": "Skip to navigation Skip to main content Skip to right column Oil prices edge higher as attacks, pipeline outage deepen Saudi supply concerns By Anushree Mukherjee Tue, September 15, 2026 at 8:15 AM CDT 3 min read CL=F By Anushree Mukherjee\n\nSept 15 (Reuters) - Oil prices edged higher on Tuesday after attacks on Saudi Arabian energy infrastructure left the kingdom's East-West Pipeline offline, raising fears that damage to energy infrastructure and transport routes could take longer \u200cto repair.\n\nBrent crude futures were up 6 cents at $105.74 a barrel at 1301 GMT after hitting a session high \u200cof $108.43. U.S. West Texas Intermediate futures were up 27 cents at $101.66 a barrel after rising as far as $104.21 earlier.\n\nConcerns over oil supplies intensified after Iran-backed Houthi forces \u200bin Yemen launched fresh attacks on Saudi Arabia on Monday, while Gulf Arab states postponed planned discussions with Iran.\n\n\"Fresh attacks by the Houthis targeting Saudi Arabia may be influencing oil market investors' expectations about the severity and duration of the conflict,\" said Hamad Hussain, senior climate and commodities economist at Capital Economics.\n\nThe Houthis said on Monday they fired dozens of missiles and drones at a military air base in \u200cKhamis Mushait in southern Saudi Arabia, targeting aircraft \u2060hangars, radar systems, runways and ammunition depots in retaliation for Saudi airstrikes in Yemen.\n\nThis followed attacks on Friday on Saudi Arabia, which Riyadh blamed on Iranian-backed fighters in Iraq, that disrupted the country's East-West \u2060Pipeline, which allows oil exports to bypass the blockaded Strait of Hormuz, through which about a fifth of global oil supplies passed before the U.S.-Iran war.\n\nSaudi Arabia could exhaust crude available for export within days unless the East-West Pipeline resumes operations, according to buyers and traders. The pipeline \u200bstrike \u200bthreatened up to 4% of global oil supply.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "Here\u2019s Why Sotera Health Company (SHC) Surges 25% in Q2", "full_content": "Skip to navigation Skip to main content Skip to right column Here\u2019s Why Sotera Health Company (SHC) Surges 25% in Q2 Soumya Eswaran Tue, September 15, 2026 at 8:13 AM CDT 3 min read SHC Broyhill Asset Management, a Charlotte-based firm, issued its second-quarter 2026 investor letter, which is available for download here . The Broyhill Equity Composite gained 8.8% in Q2, trailing the MSCI All Country World Index's 15.1% and the MSCI ACWI Value Index's 10.8%. For the first half, the Composite returned 2.3%, versus 11.5% for the Index. The letter highlights that a significant portion of the shortfall occurred in April due to market dynamics and geopolitical events, with tech, particularly semiconductors, driving recent gains. Broyhill notes its lack of direct semiconductor exposure but acknowledges potential interest in the sector if opportunities arise, maintaining its investment philosophy focused on capital protection in fragile market conditions. Also, check the fund's top five holdings to see its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Broyhill Asset Management highlighted Sotera Health Company (NASDAQ: SHC ). Sotera Health Company (NASDAQ:SHC), a US-based company that provides sterilization solutions, lab testing, and advisory services for the healthcare industry, contributed positively to the portfolio's performance this quarter. On September 14, 2026, Sotera Health Company (NASDAQ:SHC) closed at $18.52 per share, reflecting a market capitalization of $5.29 billion. Sotera Health Company (NASDAQ:SHC) posted a one-month return of 0.05%, while its shares gained 13.62% over the past 52 weeks.\n\nBroyhill Asset Management stated the following regarding Sotera Health Company (NASDAQ:SHC) in its Q2 2026 investor letter:\n\n\"Sotera Health Company (NASDAQ:SHC) was our largest contributor, with shares gaining 25%.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:43 PM IST", "pub_date_relative": "22m ago"}, {"title": "How CRE Leasing Pros Can Take AI to the Next Level", "full_content": "Skip to navigation Skip to main content Skip to right column How CRE Leasing Pros Can Take AI to the Next Level Holly Dutton Tue, September 15, 2026 at 8:13 AM CDT 6 min read This story was originally published on CRE Daily . Join 70,000+ commercial real estate professionals getting daily news, market insights, and industry analysis delivered straight to their inbox with the free CRE Daily newsletter .\n\nAI tools in commercial real estate are moving past routine task automation and into continuous, portfolio-wide monitoring of leases, contracts, and compliance documents.\n\nCentralizing data that once lived in one person's inbox or filing system lets entire teams surface answers, spot risks, and act on information faster.\n\nThe strongest AI workflows keep humans in the loop for final decisions, with AI handling extraction and monitoring while professionals apply judgement.\n\nHistorically, commercial property businesses have had to contend with the paperwork and data that sit at the heart of property management. Teams manage large volumes of leases, tenant correspondence, invoices, maintenance records, compliance documents, insurance certificates and other property records, often spread across different systems and formats.\n\nMuch of that information needs to be entered, checked, and kept up to date manually. With so much data to manage, property teams have historically had to prioritize what gets reviewed and accept that some information will inevitably go unchecked.\n\nAI is beginning to change that equation. The opportunity isn't simply to make existing processes faster. It is to make it practical to extract, compare and monitor information across an entire portfolio, including work that would previously have been too time-consuming or expensive to do at scale.\n\nMany CRE firms use AI tools to speed up routine, everyday tasks that often end up taking large chunks of time.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:43 PM IST", "pub_date_relative": "22m ago"}, {"title": "U.S. confirms for first time it has weapons deployed in space", "full_content": "The U.S. said for the first time Monday that the Space Force has deployed weapons in orbit.\n\nU.S. Air Force Secretary Troy Meink told the Air and Space Cyber Conference that the U.S. has \"on-orbit space control weapons,\" as he outlined a broader push to modernize the Air Force and Space Force in response to advances by U.S. adversaries, AI, and the growing use of autonomous weapons.\n\nHe did not specify what kind of weapons in space had been deployed, or when, according to the official Air Force account .\n\n\"It's a strategic consideration to not disclose what exactly this is,\" Juliana Suess at the German Institute of International and Security Affairs and an expert in space security told CNBC.\n\nThe capability of the weaponry could range from reversible interference, such as jamming, to kinetic, permanently destructive effects, she said.\n\n\"This could be anything. The only thing that we know is that it is based in space, so this is not a sort of missile based on Earth that could hit a satellite in orbit.\"\n\nEven so, Meink's acknowledgement matters because it marks the official disclosure of a U.S. orbital weapon capability, Suess said, adding that it comes after years of counterspace development and testing by the U.S., China and Russia.\n\nRussia and China could respond by demonstrating their own space capabilities, as they have done previously, though Suess said that she expects their immediate response will be diplomatic, accusing the U.S. of militarizing space and preparing for conflict.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago"}, {"title": "Mattel at Goldman Sachs conference: bets on brands, growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:42 PM IST", "pub_date_relative": "23m ago"}, {"title": "KKR at barclays conference: private credit push gains scale", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago"}, {"title": "Advance Auto Parts vs. NIO: Which Consumer Stock Is a Better Buy in 2026?", "full_content": "Skip to navigation Skip to main content Skip to right column Advance Auto Parts vs. NIO: Which Consumer Stock Is a Better Buy in 2026? Sara Appino, The Motley Fool Tue, September 15, 2026 at 8:11 AM CDT 5 min read AAP NIO Deciding between established retail and high-growth technology often reveals a tension in many portfolios. Investors must weigh the recovery potential of Advance Auto Parts (NYSE:AAP) against the rapid expansion of NIO (NYSE:NIO).\n\nAdvance Auto Parts serves the mature automotive aftermarket, focusing on a turnaround strategy to improve profitability. Meanwhile, NIO leads in the premium electric vehicle space with its unique battery-swapping technology. This comparison looks at how a legacy retailer and a modern innovator stack up for your 2026 investment strategy.\n\nIn its latest annual report, Advance Auto Parts noted that it serves both professional installers and DIY retail customers through its network of stores. The company distributes products through more than 4,300 stores and roughly 800 independently owned Carquest locations. It competes in the broader market for retail stocks by providing essential parts to garages and service stations that account for nearly 50% of total sales.\n\nIn FY 2025, revenue reached nearly $8.6 billion, representing a decline of approximately 5.4% compared to the prior year. Despite the lower top-line results, the company reported a net income of about $44.0 million. This resulted in a net margin of nearly 0.5%, which shows a return to profitability compared to the net loss seen in the previous fiscal year.\n\nNIO focuses on the premium segment of the electric vehicle market, offering smart cars equipped with advanced software and connectivity features. A core part of its business strategy is the development of charging infrastructure, specifically its battery-swapping stations.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago"}, {"title": "Bernstein resumes coverage on National Grid on regulated growth outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:40 PM IST", "pub_date_relative": "25m ago"}, {"title": "European equities slide to multi-month lows as Fed hike odds batters sentiment", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago"}], "cfa": [{"title": "MDR on UPI transactions: NPCI announces 0.4% on payments above \u20b92,000 \u2014 Check details", "full_content": "The National Payments Council of India (NPCI) today announced merchant discount rate (MDR) on select UPI (person to merchant) transactions.\n\nIn a statement released on 15 September, the NPCI said a revised UPI Merchant Discount Rate (MDR) framework has been introduced on select merchant transactions.\n\nIt keeps UPI free for consumers. The framework keeps 95% of low value UPI transactions below Rs. 2,000 and small merchant transactions (P2PM) completely free and proposes a new fund to support the expansion of UPI acceptance among small merchants.\n\nThe initiative will expand UPI acceptance, encourage sustained usage, and accelerate the inclusion of small businesses in India's digital payments ecosystem.\n\nThe reasonable MDR charge on high value transactions shall be distributed amongst the UPI ecosystem players which will ensure UPI expansion to new users and merchants, investments into resiliency, cyber security and innovation.\n\nJocelyn Fernandes is a journalist and editor with nearly 13 years of experience covering the business, corporate, economy and markets beats in news.<br> As chief content producer for around three years at Livemint (Hindustan Times), Jocelyn publishes breaking stories, explainers, features and live blogs on a range of business and economy topics, including the Budget, corporate developments, stock markets, income tax, money and personal finance, cryptocurrency, government policy, impact of US tariffs, international developments and more.<br> Jocelyn's writing philosophy is focused on delivering news in an accurate and accessible format for readers.", "source": "LiveMint Money", "pub_date_str": "15 Sep 2026, 06:59 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Quantitative Methods", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Will AI really destroy humanity? Pioneers who created the tech weigh in", "full_content": "As researchers warn that AI could pose catastrophic risks, some of the pioneers who helped develop the technology are weighing in with additional warnings on the dangers of unfettered advances in capability.\n\nA series of stark AI safety warnings has emerged over the past week, with researchers from major AI labs like Anthropic, OpenAI and Google DeepMind all sounding the alarm about potentially catastrophic risks from developing the technology.\n\nAI bosses including Sam Altman, Dario Amodei, Demis Hassabis and Elon Musk have shown rare agreement in calling for a slowdown and regulatory oversight.\n\nMeanwhile, concerns have also intensified debate in Washington. While some members of Congress from both Democratic and Republican parties have advocated for bills to check the progress of AI, U.S. President Donald Trump on Monday raged against growing calls for AI regulation.\n\nBut what do the people who helped create AI think of the existential risks many are currently building the technology today?\n\nYoshua Bengio is a Canadian computer scientist, considered to be a central pioneer of modern deep learning.\n\n\"Scientists at frontier AI labs have unique insight into the most advanced models,\" Bengio said on Sept. 9, in response to Anthropic researcher Jacob Coxon announcing his resignation. Coxon had warned that AI could \"kill us all by the end of the decade.\"\n\nScientists often see \"the associated risks months before models are released to the public,\" he added. \"Their perspective is vital for keeping society informed and should be taken very seriously.\"", "source": "CNBC World Economy", "pub_date_str": "15 Sep 2026, 06:54 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "10-year Treasury yield rises to highest since 2007 as Fed rate-hike expectations rise", "full_content": "The benchmark 10-year Treasury yield climbed to its highest levels in 19 years on Tuesday as oil prices surge from the Iran conflict and expectations grow that the Federal Reserve will raise interest rates on Wednesday. The rate milestone could ripple through the economy as the 10-year yield is a benchmark for consumers loans and corporate funding.\n\nThe 10-year yield was last up more than 3 basis points to around 5%. Earlier in the session, it scaled to 5.041%, the highest since July 2007. One basis point equals 0.01 percentage point, and yields and prices move in opposite directions.\n\nYields on the U.S. 10-year Treasury The yield on the longer-dated 30-year Treasury bond , more sensitive to geopolitical risks, rose 4 basis points to 5.368%. The yield had hit a high of 5.401% \u2014 also its highest level since June 2007.\n\nThe 2-year Treasury note yield climbed more than 1 basis point to 4.648%. It had earlier reached its highest level since July 2024 at 4.688%.\n\nThe move comes at the start of the Fed's two-day policy meeting, with markets pricing in higher chances of a quarter-point rate hike when the meeting concludes Wednesday after August inflation remained well above the central bank's 2% target. Traders are pricing in a more than 92% chance that the Fed will raise rates by 25 basis points in its latest meeting, according to the CME FedWatch tool .\n\n\"U.S.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:52 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Senate to vote on Clarity Act, decide fate of landmark crypto bill \u2014 All we know", "full_content": "Sept 15 (Reuters) \u2014 TheU.S. Senate is set to vote on Tuesday on whether to advance once-in-a-generation cryptocurrency legislation, potentially determining the fate of the bill as Republican Senate leaders grapple with a limited calendar in a busy election year.\n\nThe bill, dubbed the Clarity Act, would create a regulatory framework for digital \u200cassets, which crypto companies say would put them on more solid legal footing. The deep-pocketed industry has spent hundreds of millions of dollars campaigning to advance the bill.\n\nBut it remained unclear if the legislation could garner the 60 votes it needs to advance, even after Senate Republicans on Sunday released a new text in an effort to address concerns from the banking industry and some Democrats. The Senate is set to hold its vote shortly after 2 p.m. EDT (1800 GMT).\n\nAlthough passage of the Clarity Act would be positive for the crypto ecosystem \u2014 and has been broadly supported by the crypto industry \u2014 investors and analysts have said that the crypto market had mostly priced in that the bill would not be passed into law in the foreseeable future, Reuters reported on Monday.\n\n\"Another delay would be negative but probably not a new regime shock, whereas passage would reduce legal uncertainty and could unlock additional institutional activity,\" said Can-Luca K\u00f6ymen, investment strategist at digital asset bank Sygnum.\n\nWhile the vote is procedural, it is seen as a key test and little time on the calendar remains for Senate Republicans to try to revive the bill if the vote fails, according to analysts.\n\nDemocrats have been pushing for the bill to include stricter limits on public officeholders profiting off their own crypto ventures, a push in part aimed at U.S. President Donald Trump's meme coin and World Liberty Financial, a crypto company that is run by his sons.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:50 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Children's clothing retailer Carter's is rebranding to appeal to a new generation of parents", "full_content": "Children's clothing brand Carter's is undergoing a revamp to better align with the new generation of parents as its namesake company tries to recover from sluggish performance in recent years.\n\nThe rebrand, announced Tuesday, includes a new logo and marketing campaign that Chief Marketing Officer Sarah Crockett told CNBC aims to keep the 161-year-old company relevant with its core customer.\n\n\"We recognize that the market difference of our parents in the communities that we're serving is significant,\" Crockett said. \"We had an opportunity to really tap into the values that parents are bringing into the household.\"\n\nCarter's largest brands include its namesake banner and OshKosh B'gosh, which are sold in standalone stores around the U.S. and in retailers including Walmart , Target and Amazon . The rebrand comes as the overall company has shrunk its store footprint and laid off some employees over the past year to try to reposition itself for growth, especially as the market for baby and kids clothing has grown more competitive.\n\nWall Street has taken note of the company's issues. Over the past three years, Carter's stock has plunged more than 50%, bringing its market cap to around $1 billion.\n\nFor the full 2025 fiscal year, Carter's reported adjusted net income of $126.1 million, down sharply from $210.7 million the year before. Last year, then-CEO Douglas Palladini said elevated product costs, higher tariffs and additional investments \"weighed meaningfully\" on the company's profitability.\n\nLast October, Palladini said Carter's was eliminating 15% of its corporate workforce and shuttering 150 North American stores as leases expired in an effort to \"rightsize\" the company.\n\nSince then, Carter's has started to show more bright spots. And the rebrand aims in part to capitalize on the momentum.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Executive at Iconic Energy Company Sells Nearly 4,000 Shares", "full_content": "Skip to navigation Skip to main content Skip to right column Executive at Iconic Energy Company Sells Nearly 4,000 Shares Jake Lerch, The Motley Fool Tue, September 15, 2026 at 8:19 AM CDT 5 min read BKR Amerino Gatti, EVP of Oilfield Services & Equip at Baker Hughes Company (NASDAQ:BKR), reported a disposition of 3,860 shares of Class A Common Stock on Sept. 3, 2026, as disclosed in a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($63.64); post-transaction value based on Sept. 03, 2026, market close ($63.64).\n\nWhat was the specific nature of this equity disposition? The transaction was a non-discretionary event intended to cover tax liabilities. These shares were withheld by Baker Hughes as part of a structured vesting schedule for restricted stock units, a routine process that is separate from discretionary market sales or purchases.\n\nHow has the executive's total ownership changed following this filing? Despite the tax-related disposition of 3,860 shares, the underlying vesting event and an exercise of 9,807 options resulted in a net increase in the insider's total direct position. The direct holding rose from 14,804 shares to 20,751 shares of Class A Common Stock.\n\nWhat is the current status of the insider's total equity exposure? Amerino Gatti maintains direct ownership of 20,751 shares, which were valued at $1.32 million based on the market close on the transaction date. The insider also holds 9,807 derivative securities, including unvested options and awards scheduled for future vesting installments.\n\nWhat is the broader market context for this transaction? As of the Sept. 8, 2026, market close of $63.92, the remaining direct stake is valued at approximately $1.3 million.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:49 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "An AI bubble is no longer Wall St  other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "15 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "A sharp stock market decline could lie around the corner, Wells Fargo warns", "full_content": "Wells Fargo is skeptical that equities can keep marching higher from current levels.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oil prices edge higher as attacks, pipeline outage deepen Saudi supply concerns", "full_content": "Skip to navigation Skip to main content Skip to right column Oil prices edge higher as attacks, pipeline outage deepen Saudi supply concerns By Anushree Mukherjee Tue, September 15, 2026 at 8:15 AM CDT 3 min read CL=F By Anushree Mukherjee\n\nSept 15 (Reuters) - Oil prices edged higher on Tuesday after attacks on Saudi Arabian energy infrastructure left the kingdom's East-West Pipeline offline, raising fears that damage to energy infrastructure and transport routes could take longer \u200cto repair.\n\nBrent crude futures were up 6 cents at $105.74 a barrel at 1301 GMT after hitting a session high \u200cof $108.43. U.S. West Texas Intermediate futures were up 27 cents at $101.66 a barrel after rising as far as $104.21 earlier.\n\nConcerns over oil supplies intensified after Iran-backed Houthi forces \u200bin Yemen launched fresh attacks on Saudi Arabia on Monday, while Gulf Arab states postponed planned discussions with Iran.\n\n\"Fresh attacks by the Houthis targeting Saudi Arabia may be influencing oil market investors' expectations about the severity and duration of the conflict,\" said Hamad Hussain, senior climate and commodities economist at Capital Economics.\n\nThe Houthis said on Monday they fired dozens of missiles and drones at a military air base in \u200cKhamis Mushait in southern Saudi Arabia, targeting aircraft \u2060hangars, radar systems, runways and ammunition depots in retaliation for Saudi airstrikes in Yemen.\n\nThis followed attacks on Friday on Saudi Arabia, which Riyadh blamed on Iranian-backed fighters in Iraq, that disrupted the country's East-West \u2060Pipeline, which allows oil exports to bypass the blockaded Strait of Hormuz, through which about a fifth of global oil supplies passed before the U.S.-Iran war.\n\nSaudi Arabia could exhaust crude available for export within days unless the East-West Pipeline resumes operations, according to buyers and traders. The pipeline \u200bstrike \u200bthreatened up to 4% of global oil supply.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Here\u2019s Why Sotera Health Company (SHC) Surges 25% in Q2", "full_content": "Skip to navigation Skip to main content Skip to right column Here\u2019s Why Sotera Health Company (SHC) Surges 25% in Q2 Soumya Eswaran Tue, September 15, 2026 at 8:13 AM CDT 3 min read SHC Broyhill Asset Management, a Charlotte-based firm, issued its second-quarter 2026 investor letter, which is available for download here . The Broyhill Equity Composite gained 8.8% in Q2, trailing the MSCI All Country World Index's 15.1% and the MSCI ACWI Value Index's 10.8%. For the first half, the Composite returned 2.3%, versus 11.5% for the Index. The letter highlights that a significant portion of the shortfall occurred in April due to market dynamics and geopolitical events, with tech, particularly semiconductors, driving recent gains. Broyhill notes its lack of direct semiconductor exposure but acknowledges potential interest in the sector if opportunities arise, maintaining its investment philosophy focused on capital protection in fragile market conditions. Also, check the fund's top five holdings to see its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Broyhill Asset Management highlighted Sotera Health Company (NASDAQ: SHC ). Sotera Health Company (NASDAQ:SHC), a US-based company that provides sterilization solutions, lab testing, and advisory services for the healthcare industry, contributed positively to the portfolio's performance this quarter. On September 14, 2026, Sotera Health Company (NASDAQ:SHC) closed at $18.52 per share, reflecting a market capitalization of $5.29 billion. Sotera Health Company (NASDAQ:SHC) posted a one-month return of 0.05%, while its shares gained 13.62% over the past 52 weeks.\n\nBroyhill Asset Management stated the following regarding Sotera Health Company (NASDAQ:SHC) in its Q2 2026 investor letter:\n\n\"Sotera Health Company (NASDAQ:SHC) was our largest contributor, with shares gaining 25%.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:43 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How CRE Leasing Pros Can Take AI to the Next Level", "full_content": "Skip to navigation Skip to main content Skip to right column How CRE Leasing Pros Can Take AI to the Next Level Holly Dutton Tue, September 15, 2026 at 8:13 AM CDT 6 min read This story was originally published on CRE Daily . Join 70,000+ commercial real estate professionals getting daily news, market insights, and industry analysis delivered straight to their inbox with the free CRE Daily newsletter .\n\nAI tools in commercial real estate are moving past routine task automation and into continuous, portfolio-wide monitoring of leases, contracts, and compliance documents.\n\nCentralizing data that once lived in one person's inbox or filing system lets entire teams surface answers, spot risks, and act on information faster.\n\nThe strongest AI workflows keep humans in the loop for final decisions, with AI handling extraction and monitoring while professionals apply judgement.\n\nHistorically, commercial property businesses have had to contend with the paperwork and data that sit at the heart of property management. Teams manage large volumes of leases, tenant correspondence, invoices, maintenance records, compliance documents, insurance certificates and other property records, often spread across different systems and formats.\n\nMuch of that information needs to be entered, checked, and kept up to date manually. With so much data to manage, property teams have historically had to prioritize what gets reviewed and accept that some information will inevitably go unchecked.\n\nAI is beginning to change that equation. The opportunity isn't simply to make existing processes faster. It is to make it practical to extract, compare and monitor information across an entire portfolio, including work that would previously have been too time-consuming or expensive to do at scale.\n\nMany CRE firms use AI tools to speed up routine, everyday tasks that often end up taking large chunks of time.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:43 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "U.S. confirms for first time it has weapons deployed in space", "full_content": "The U.S. said for the first time Monday that the Space Force has deployed weapons in orbit.\n\nU.S. Air Force Secretary Troy Meink told the Air and Space Cyber Conference that the U.S. has \"on-orbit space control weapons,\" as he outlined a broader push to modernize the Air Force and Space Force in response to advances by U.S. adversaries, AI, and the growing use of autonomous weapons.\n\nHe did not specify what kind of weapons in space had been deployed, or when, according to the official Air Force account .\n\n\"It's a strategic consideration to not disclose what exactly this is,\" Juliana Suess at the German Institute of International and Security Affairs and an expert in space security told CNBC.\n\nThe capability of the weaponry could range from reversible interference, such as jamming, to kinetic, permanently destructive effects, she said.\n\n\"This could be anything. The only thing that we know is that it is based in space, so this is not a sort of missile based on Earth that could hit a satellite in orbit.\"\n\nEven so, Meink's acknowledgement matters because it marks the official disclosure of a U.S. orbital weapon capability, Suess said, adding that it comes after years of counterspace development and testing by the U.S., China and Russia.\n\nRussia and China could respond by demonstrating their own space capabilities, as they have done previously, though Suess said that she expects their immediate response will be diplomatic, accusing the U.S. of militarizing space and preparing for conflict.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Advance Auto Parts vs. NIO: Which Consumer Stock Is a Better Buy in 2026?", "full_content": "Skip to navigation Skip to main content Skip to right column Advance Auto Parts vs. NIO: Which Consumer Stock Is a Better Buy in 2026? Sara Appino, The Motley Fool Tue, September 15, 2026 at 8:11 AM CDT 5 min read AAP NIO Deciding between established retail and high-growth technology often reveals a tension in many portfolios. Investors must weigh the recovery potential of Advance Auto Parts (NYSE:AAP) against the rapid expansion of NIO (NYSE:NIO).\n\nAdvance Auto Parts serves the mature automotive aftermarket, focusing on a turnaround strategy to improve profitability. Meanwhile, NIO leads in the premium electric vehicle space with its unique battery-swapping technology. This comparison looks at how a legacy retailer and a modern innovator stack up for your 2026 investment strategy.\n\nIn its latest annual report, Advance Auto Parts noted that it serves both professional installers and DIY retail customers through its network of stores. The company distributes products through more than 4,300 stores and roughly 800 independently owned Carquest locations. It competes in the broader market for retail stocks by providing essential parts to garages and service stations that account for nearly 50% of total sales.\n\nIn FY 2025, revenue reached nearly $8.6 billion, representing a decline of approximately 5.4% compared to the prior year. Despite the lower top-line results, the company reported a net income of about $44.0 million. This resulted in a net margin of nearly 0.5%, which shows a return to profitability compared to the net loss seen in the previous fiscal year.\n\nNIO focuses on the premium segment of the electric vehicle market, offering smart cars equipped with advanced software and connectivity features. A core part of its business strategy is the development of charging infrastructure, specifically its battery-swapping stations.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:41 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bioceres Q4 FY26 slides: profitability improves despite revenue miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Novo Nordisk vs. Regeneron Pharmaceuticals: Which Healthcare Stock Is a Better Buy in 2026?", "full_content": "Skip to navigation Skip to main content Skip to right column Novo Nordisk vs. Regeneron Pharmaceuticals: Which Healthcare Stock Is a Better Buy in 2026? Sara Appino, The Motley Fool Tue, September 15, 2026 at 8:09 AM CDT 6 min read NVO REGN The race for pharmaceutical dominance often centers on chronic disease management. For investors, deciding between Novo Nordisk (NYSE:NVO) and Regeneron Pharmaceuticals (NASDAQ:REGN) requires a close look at their unique market strengths.\n\nNovo Nordisk focuses heavily on metabolic disorders, particularly diabetes and weight loss, where it holds a massive global share. Regeneron leverages its proprietary technologies to develop treatments for eye diseases, cancer, and inflammatory conditions. Comparing these two giants reveals different approaches to growth and risk.\n\nNovo Nordisk operates as a specialized leader among pharmaceutical stocks focusing on chronic disease care. Its primary focus remains on diabetes and obesity, where it provides essential medicines like insulin and GLP-1 treatments to patients in roughly 170 countries. Its latest annual report, filed for 2025, noted a workforce of approximately 68,800 people dedicated to these therapeutic areas. While major customers are not specifically disclosed in SEC filings, the company relies on a diverse base of healthcare providers and distributors globally.\n\nIn FY 2025, revenue reached nearly $47.7 billion, representing a 6.4% increase over the previous year. This growth follows a significant expansion in its obesity care portfolio during prior fiscal periods. The firm reported net income of close to $15.8 billion for the year. This resulted in a net margin of approximately 33.1%. A net margin measures how much profit a company keeps for every dollar of sales generated after all expenses are paid.\n\nAs of its December 2025 balance sheet, the debt-to-equity ratio is roughly 0.7x. This metric compares total liabilities to shareholder equity to assess financial leverage.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:39 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India\u2019s balance of payments surplus jumps to $20.8 billion", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:38 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ballooning US debt is a ticking time bomb, billionaire investor David Rubenstein says", "full_content": "Skip to navigation Skip to main content Skip to right column Ballooning US debt is a ticking time bomb, billionaire investor David Rubenstein says Brian Sozzi \u00b7 Executive Editor Tue, September 15, 2026 at 8:07 AM CDT 2 min read CG Listen and subscribe to Power Players with Brian Sozzi on Apple Podcasts , Amazon Music , Spotify , YouTube , or wherever you find your favorite podcasts.\n\nThe ballooning US debt pile is akin to a ticking time bomb for the country, in part because it weakens national security, billionaire Carlyle Group ( CG ) co-founder David Rubenstein warned.\n\n\"We have, as everybody now knows, $40 trillion of debt. Now, historically, if you go back over the last, let's say, 300 or 400 years, whenever a country paid more interest on its debt than it did for its national security, that's a sign of weakness in the country. Right now, we've crossed that threshold,\" Rubenstein said in a new episode of the Power Players with Brian Sozzi podcast (see video above or listen below).\n\n\"We're now paying more in interest every year than we are paying on our national defense, and we're paying a trillion dollars in interest, a little bit more than that now, but we pay about a trillion dollars in national defense,\" he added. \"And as that continues, the interest goes up, and the money available for defense goes down. That tends to weaken your national security.\"\n\nThe numbers surrounding the debt situation are ever more staggering.\n\nUS annual interest expense is up to a record 18.5% of federal government revenue, according to new analysis from bond investment firm DoubleLine. This is now officially above the previous record of 18.4% set in 1991.\n\nThe percentage has more than quadrupled over the past four years. The US annual interest expense currently stands at a record $1.25 trillion, more than four times the level seen in 1991.\n\nTo be sure, the surge in interest expense fundamentally threatens long-term fiscal stability.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:37 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India\u2019s Allied Blenders readies move into single-malt whisky", "full_content": "Skip to navigation Skip to main content Skip to right column India\u2019s Allied Blenders readies move into single-malt whisky Kuldeep Jha Tue, September 15, 2026 at 8:07 AM CDT 2 min read Allied Blenders and Distillers (ABD) is expanding into single-malt whisky manufacturing with an investment of up to Rs1.15bn ($11.9m).\n\nIn a regulatory filing, the India-based spirits maker said its management committee had approved the deployment of additional funds into its subsidiary, Minakshi Agro Industries (MAILLP).\n\nThe investment will fund the construction of an integrated distilling and maturation complex in Aurangabad, Maharashtra.\n\nABD said the site is projected to produce approximately three million bulk litres annually and is scheduled to commence operations during the third quarter of the company's 2028 financial year.\n\n\"The proposed investment is aligned with the company's long-term strategic vision of expanding and strengthening its premium spirits portfolio through entry into the provenance-led single malt whisky segment,\" ABD said in its filing.\n\nIn tandem with the headline expenditure, the company's board cleared up to Rs100m in supplementary funding for previously approved initiatives under MAILLP.\n\nThe additional capital injection is intended to absorb \"cost overruns\" associated with those existing ventures.\n\nIn a separate stock exchange filing, ABD announced the launch of a new \"premium\" whisky, The Indian Edit.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:37 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tabby secures $233m in equity round, valuation climbs to $6.5bn", "full_content": "Skip to navigation Skip to main content Skip to right column Tabby secures $233m in equity round, valuation climbs to $6.5bn Aninda Chakraborty Tue, September 15, 2026 at 8:07 AM CDT 2 min read Saudi Arabian fintech Tabby has raised $233m in an equity financing round led by existing investor Blue Pool Capital, valuing the company at $6.5bn.\n\nCurrent shareholders HSG, Wellington Management and Arbor Ventures also participated in the round, Tabby said in a statement. The deal includes a liquidity option for employees.\n\nThe company said the funding will support its \"next stage of growth\" as it expands beyond buy now, pay later (BNPL) into broader credit and money management services across Saudi Arabia and the UAE.\n\nTabby co-founder and CEO Hosam Arab said: \"We began with a button at an online checkout to help people spread costs over time. Everything since, every product and every licence, has come back to the same idea: people deserve more from their money.\n\n\"This round means we can build further on that, without changing how we think about growth or discipline.\"\n\nTabby has already secured regulatory approvals to broaden its financial services offering.\n\nIn Saudi Arabia, the company received consumer and SME finance licences from the Saudi Central Bank, which allow it to provide larger and longer-term financing to consumers and working capital to businesses.\n\nTabby also acquired Tweeq, a SAMA-licenced digital wallet, extending its capabilities into accounts, cards and transfers.", "source": "Yahoo Finance", "pub_date_str": "15 Sep 2026, 06:37 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "15 Sep 2026, 07:06 PM IST", "total_stories": 389};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
