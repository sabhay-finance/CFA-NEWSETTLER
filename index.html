 marking the country's worst outbreak in more than three decades. States have confirmed 10 deaths associated with the disease so far in 2026: seven in Pennsylvania , one in New York and two in Wisconsin .\n\nBut he said countries are already taking action to control outbreaks, such as strengthening vaccination, surveillance and outbreak response efforts. The U.S. in particular has ramped up vaccination efforts to close immunity gaps, particularly in areas with low immunization coverage experiencing outbreaks, said Dr.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:23 PM IST", "pub_date_relative": "5m ago"}, {"title": "OCSL Q4 2026 slides: credit quality improves as earnings decline", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:23 PM IST", "pub_date_relative": "6m ago"}, {"title": "Versigent at RBC Global Industrials Conference 2026: export growth offsets headwinds", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:21 PM IST", "pub_date_relative": "7m ago"}, {"title": "Maravai LifeSciences at Jefferies conference: growth broadens beyond cleancap", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:21 PM IST", "pub_date_relative": "8m ago"}, {"title": "Nvidia stock falls ahead of earnings as company reels from Huang resignation", "full_content": "Nvidia shares slipped on Tuesday as former CEO Jensen Huang released his first public statement since his resignation and the company prepares to report earnings after the bell.\n\nHuang said he is open to returning as Nvidia's CEO and that he is committed to cooperating with the board's investigation into his behavior.\n\n\"I created problems for the Board that I deeply regret,\" Huang said in a statement obtained by CNBC's David Faber . \"I own my mistakes completely, and I am committed to cooperating with the Board's independent investigation.\"\n\n\"If the Board of Directors decides that my return or Alzheimer\u2019s yields tepid results Endpoints News ED pill may have a new use - slowing Alzheimer\u2019s progression The Independent", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 10:18 PM IST", "pub_date_relative": "11m ago"}, {"title": "J.B. Hunt at Stephens conference: margins, capacity and growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:18 PM IST", "pub_date_relative": "11m ago"}, {"title": "Trump on Iran's reported DC dirty bomb plan: 'We take it very seriously'", "full_content": "President Donald Trump said Tuesday that if a report about Iran developing plans to target top administration officials with a \"dirty bomb\" in Washington is true, Iran would face consequences.\n\n\"Well, if there is, they will pay a price the likes of which no country has ever paid before,\" Trump said when asked if there is any imminent threat to Washington, D.C., home to close to 700,000 people in addition to the seat of government.\n\n\"I hope it's not, but we take it very seriously, because they happen to be crazy,\" Trump said during a photo-op with world leaders at the summit of the Association of Southeast Asian Nations in Manila, Philippines.\n\n\"This is why they can't have a nuclear weapon, by the way, in case people had any questions,\" Trump added, reiterating his main defense for launching a war with Iran in late February.\n\nLate Monday, CNN cited two U.S. officials in reporting that new U.S. intelligence has intercepted \"very specific\" plans, including \"locations and targets,\" related to a potential Iranian plot to set off a dirty bomb , which combines conventional explosives with radioactive material.\n\nOfficials have debated whether Iran would actually attempt to detonate such a device in the U.S., or even if it could, CNN reported, citing seven U.S. officials in total.\n\nCNBC has not verified the report. Trump administration spokeswoman Lauren Bis told CNN in a statement that the U.S. is \"monitoring any and all potential threats, but at this time there are no credible threats to the homeland.\"\n\nTrump was asked about imminent Iranian threats during the first leg of his tour through Asia, which begins at ASEAN and is set to include high-stakes meetings with Chinese President Xi Jinping and Russian President Vladimir Putin .", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:17 PM IST", "pub_date_relative": "11m ago"}, {"title": "US tech stocks slide ahead of Nvidia results", "full_content": "Nasdaq 100 down 1.4% after volatile run of trading", "source": "FT Markets", "pub_date_str": "17 Nov 2026, 10:17 PM IST", "pub_date_relative": "12m ago"}, {"title": "Boot Barn at Stephens conference: growth plan lifts margin outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:17 PM IST", "pub_date_relative": "12m ago"}, {"title": "Measles cases in the U.S. are at a 35-year high. Here\u2019s the staggering cost of falling vaccination rates for Americans.", "full_content": "The U.S. officially lost its measles elimination status on Tuesday as it grapples with multiple outbreaks of the virus.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 10:17 PM IST", "pub_date_relative": "12m ago"}, {"title": "Bill Holdings shares surge on reports of looming TPG take-private deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:16 PM IST", "pub_date_relative": "13m ago"}, {"title": "Alkami at Stephens annual conference: growth plan leans on ai and banks", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:14 PM IST", "pub_date_relative": "15m ago"}, {"title": "Jensen Huang breaks his silence ahead of Nvidia earnings \u2014 plus, 1 stock to buy on weakness", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:12 PM IST", "pub_date_relative": "17m ago"}, {"title": "Nvidia earnings live updates: Wall Street braces for first report since Huang's ouster", "full_content": "Nvidia is set to report quarterly results after the close on Tuesday in what may be the most anticipated earnings announcement in the chipmaker's 33-year history, landing less than a week after co-founder Jensen Huang's abrupt resignation as CEO.\n\nFinance chief Colette Kress is used to addressing Wall Street, but never like this . She's now functioning as interim CEO, meaning her responsibilities go well beyond the key numbers. Employees, investors, analysts and customers are eager to hear her first public remarks since last week's dramatic shake-up.\n\nGrowth remains explosive, with revenue expansion expected to reach 91% in the latest quarter from $59 billion in the same period a year ago. Nvidia said in August that sales next fiscal year would grow roughly 70% in what Kress, on the prior earnings call, described as a \"supply constrained outlook.\"\n\nBut Nvidia's stock is down 24% this month and on Friday wrapped up its sixth straight weekly drop, the longest losing streak since 2012. On Monday, the stock closed at its lowest since July 2025. In addition to the Huang saga, the company is dealing with broader concerns about an AI slowdown and a political shift in Washington, D.C., following this month's midterm elections.\n\nThe biggest cloud for Nvidia is around its China business after Huang's reported affair with a businesswoman who's allegedly a Chinese spy. The Commerce Department on Monday announced a change that would prevent Nvidia's chips from being rented to Chinese companies entirely, putting revenue at risk.\n\nMany Huang allies in Silicon Valley have called for Huang to be reinstated as CEO, citing fears that the company and the country will lose out on innovation without him.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 10:11 PM IST", "pub_date_relative": "17m ago"}, {"title": "Disney beats fourth-quarter estimates, targets $3 billion in savings through cost-cutting efforts", "full_content": "Disney on Tuesday reported quarterly earnings and revenue that exceeded analysts' expectations and announced it's targeting $3 billion in cost savings by fiscal 2029.\n\nThose cost-cutting efforts include several rounds of layoffs announced in recent months, Disney's chief financial officer, Hugh Johnston, told CNBC. The most recent round, which seeks to reduce costs by up to 20%, was reported earlier this month .\n\nFuture cost-saving measures will include reductions in administrative and other general expenses, Johnston said, while adding, \"We do expect more layoffs.\"\n\nDisney CEO Josh D'Amaro told investors on the company's earnings call that the job cuts are \"not easy.\"\n\n\"They affect people who care deeply about Disney and have contributed so much to this company,\" he said. \"At the same time, these steps are important if we want to be a company that moves faster, adapts to a rapidly changing environment, and keeps investing in the content and technology that will drive our growth.\"\n\nThe cuts will help Disney fund its $26 billion in projected content spend for fiscal 2027, a 9% increase from fiscal 2026.\n\nThe entertainment giant is also forecasting double-digit growth in earnings per share in the next fiscal year, as well as segment operating income growth of around 8%.\n\nDisney noted that the majority of that growth will be concentrated in the first half of the year due to the theatrical debut of \"Avengers: Doomsday\" and a boost from the Super Bowl, which will air on Disney's ESPN and ABC networks.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:10 PM IST", "pub_date_relative": "19m ago"}, {"title": "India Beat Pakistan 2-1 To Win SAFF Championship 2026, Secure Historic Three-Peat", "full_content": "India became the first team to win three consecutive SAFF Championship titles after defeating Pakistan 2-1 in the final in Dhaka.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 10:09 PM IST", "pub_date_relative": "19m ago"}, {"title": "Trump has arrived in Asia. Here\u2019s what he said about Iran and Deutsche Bank", "full_content": "U.S. President Donald Trump has arrived for his high-stakes trip to Asia, and took a range of questions on subjects from Iran to Deutsche Bank leaking details about his tax.\n\nThe president landed in Manila, Philippines, for the initial leg of his trip on Tuesday and answered rapid-fire questions from the press while meeting with other leaders.\n\nAsked about a possible Iranian threat to Washington, D.C., he said that, if there were an attack, Iran would \"pay a price the likes of which no country has ever paid before.\"\n\nThe question was about CNN reporting that U.S. intelligence suggested the country was planning to target senior members of Trump's administration with a dirty bomb or chemical weapon in the U.S. capital.\n\n\"We take it very seriously because they happen to be crazy,\" Trump said. CNBC has not independently verified CNN's report.\n\nBut the president also said he believed his administration was \"very close to getting it done\" when it came to the Iran war.\n\nWhile Trump was airborne, the Financial Times reported Deutsche Bank had mistakenly leaked details of his taxes in March 2017, during his first presidential term. The mistake was kept from the White House at the time, according to the FT.\n\nAsked about this in Manila, the president said, \"I paid a lot of tax.\"", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:09 PM IST", "pub_date_relative": "19m ago"}, {"title": "Dow slides weighed by Home Depot; Nasdaq is flat ahead of Nvidia earnings: Live updates - CNBC", "full_content": "Dow slides weighed by Home Depot; Nasdaq is flat ahead of Nvidia earnings: Live updates CNBC Stock Market Today: Dow falls 700 points, S&P 500 and Nasdaq are back under pressure ahead of Nvidia results \u2014 live updates MarketWatch Dow's 450-Point Drop Led By Losses For Shares Of Caterpillar, NVIDIA Corp. Moomoo Stocks Pressured by Weakness in Software and Health Insurance Stocks Barchart.com Dow Falls Over 200 Points; US Retail Sales Rise 0.2% In October Benzinga", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 10:09 PM IST", "pub_date_relative": "19m ago"}, {"title": "Mahindra Last Mile Mobility Wins Earthshot Prize 2026 In 'Clean Our Air' Category", "full_content": "Mahindra's 4 lakh electric commercial vehicles have covered over 9 billion km, helping avert 1.85 lakh tonnes of CO\u2082 emissions.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 10:09 PM IST", "pub_date_relative": "20m ago"}, {"title": "Property Play: Chase Home Lending CEO says he plans to 'go on offense' against non-bank lenders", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nMortgage rates shot higher again last week, after four straight weeks of declines. A hotter-than-expected monthly inflation report, coupled with new headlines from the Iran war, had the average rate on the 30-year fixed mortgage up 33 basis points to 7.5%, according to Mortgage News Daily.\n\nTotal mortgage demand, including both refinancing and new purchase loans, is now down just over 39% from a year ago, according to the Mortgage Bankers Association. Despite all that, Sean Grzebin, the CEO of Chase Home Lending, the nation's largest bank mortgage lender, said he's hiring and bent on increasing market share.\n\n\"For the last several years, we haven't really added a lot of salespeople,\" said Grzebin, who admits plainly that this is the worst market in decades. \"We're going to hire a bunch of home lending advisors across the United States. We're going to focus on areas where we haven't had a lot of coverage, but there's a lot of mortgage activity and transactions taking place, and it really matches the expansion that we're having within the branch network on the consumer bank side.\"\n\nGrzebin said he is looking to take back market share from non-bank lenders, who flourished after the financial crisis, when banks were cleaning up from thousands of failed home loans. In August, JPMorganChase announced a 40% increase in home lending capital through 2035 to $750 billion. It will also hire 850 new lending agents.\n\n\"I think the non-banks are all very formidable competitors. I think they've had an advantage while the banks were distracted through several decades,\" he said.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:08 PM IST", "pub_date_relative": "20m ago"}, {"title": "Jensen Huang now wants to return as Nvidia\u2019s CEO. This is why that could be difficult.", "full_content": "Corporate-governance experts point to issues that would make a triumphant return difficult.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 10:08 PM IST", "pub_date_relative": "21m ago"}, {"title": "Can\u2019t pay premiums after a critical illness? Generali Central Life Insurance's new rider keeps the policy alive", "full_content": "Generali Central Life Insurance (GCLI) has introduced a waiver of premium rider on eligible base insurance plans, allowing policyholders to continue receiving policy benefits without paying future premiums in specified circumstances, reported Insurance Asia.\n\nUnder the new rider, future premium payments can be waived in the event of accidental total and permanent disability, diagnosis of a covered critical illness or the death of the policyholder, subject to the applicable terms and conditions.\n\nThe insurer said policy benefits would continue as originally planned even after the waiver of future premiums is triggered.\n\nThe initiative is aimed at strengthening financial protection for policyholders and ensuring that long-term financial goals remain on track despite unforeseen life events.\n\nCommenting on the launch, Alok Rungta, managing director and chief executive officer of Generali Central Life Insurance , said children's future planning and retirement preparedness continued to be among the most important financial priorities for Indian households.\n\n\"Children's future planning and retirement preparedness remain two of the most significant financial priorities for Indian families and together account for nearly 70% of the life insurance category,\" Rungta said.\n\n\u201cAs aspirations continue to evolve, individuals are increasingly looking for solutions that not only help them build towards these goals but also safeguard them against life\u2019s uncertainties,\u201d he added.\n\nThe company said the new rider was intended to provide additional financial security to customers while helping them protect their long-term financial commitments.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 10:00 PM IST", "pub_date_relative": "29m ago"}, {"title": "Thane Water Shutdown: Supply To Remain Affected On These Days; Check Details", "full_content": "The shutdown is part of a 10% water cut ordered after weak post-monsoon rainfall and El Nio. Supply may stay at low pressure for a day or two after it resumes.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 10:00 PM IST", "pub_date_relative": "29m ago"}, {"title": "Former Nvidia CEO Jensen Huang says he\u2019s open to returning in first statement since resignation", "full_content": "In his first public statement since resigning as Nvidia CEO last week, Jensen Huang struck a contrite tone, saying that he is committed to cooperating with the board's investigation into his relationship with an alleged Chinese intelligence contact.\n\n\"I created problems for the Board that I deeply regret,\" Huang said in the written statement obtained by CNBC's David Faber. \"I own my mistakes completely, and I am committed to cooperating with the Board's independent investigation.\"\n\nHuang said he had seen support from investors and employees and was willing to come back as CEO to help the company navigate \"complex technology, market, competitive, and geopolitical dynamics.\"\n\n\"If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO,\" Huang said in the statement.\n\nMany in the tech world have called for Huang to return as Nvidia CEO, putting together an online petition with over 180,000 signatures.\n\nPresident Donald Trump said on Monday that he is open to Jensen Huang returning as CEO of Nvidia.\n\nThe board is not considering bringing Huang back as CEO, CNBC reported on Monday .\n\nLast week, Huang resigned from Nvidia after 33 years as CEO. The resignation came days after Huang, Nvidia's founder, admitted to an affair, and news stories alleged he had an affair with Alice Huang, who worked for a customer and is alleged to have contact with Chinese intelligence, as well as affairs with employees at Nvidia.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 10:00 PM IST", "pub_date_relative": "29m ago"}, {"title": "Jensen Huang Breaks Silence, Says He's Open To Returning As Nvidia CEO, 'Owns' His Mistakes", "full_content": "Nvidia said on November 12 that Huang had resigned as president, chief executive officer and a member of its board, effective immediately.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:55 PM IST", "pub_date_relative": "33m ago"}, {"title": "OM Advance Bookings: Dhanush-Mammootty Starrer Makes Early Mark With Strong Ticket Sales", "full_content": "Directed by Rajkumar Periasamy, O.M - Operation Mole also stars Sai Pallavi and Sreeleela in key roles.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:46 PM IST", "pub_date_relative": "43m ago"}, {"title": "Anthropic IPO: Planning to invest from India? Check why IPO allotment may be difficult and what you can do instead", "full_content": "Indian retail investors hoping to participate in Anthropic's proposed US initial public offering (IPO) may not find it as straightforward as applying for a domestic share sale. While Indian residents are permitted to invest in overseas equities, accessing shares at the IPO stage could be a challenge, as most investment platforms available to Indian investors offer access to US stocks only after they begin trading on an exchange.\n\nThis means investors interested in the artificial intelligence company's public listing may have to wait until its shares debut on a US exchange, rather than participate in the initial allotment. However, investing after listing remains an option through platforms that provide access to US stocks, subject to the applicable foreign investment and remittance rules.\n\nCA Chandni Anandan, Tax Expert at ClearTax, said Indian resident retail investors generally do not have direct access to US IPO allotments through Indian brokers. Most Indian platforms offering US investing allow investors to buy shares only after they are listed on a US exchange.\n\nIndian residents can invest in overseas equities through the Liberalised Remittance Scheme (LRS) of the Reserve Bank of India (RBI). The scheme allows resident individuals to remit up to $250,000 per financial year for permitted transactions, including investments in foreign equity.\n\nFor investors who cannot participate in the initial IPO allotment, this provides a route to purchase Anthropic shares after they begin trading on Nasdaq.\n\n\"Investment in foreign equity, whether in an IPO or after listing, is a permitted capital-account transaction under the LRS,\" said Anandan.\n\nShe explained that investors must route the remittance through an authorised dealer bank, which processes the outward transfer.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 09:46 PM IST", "pub_date_relative": "43m ago"}, {"title": "Stock Market Today: Dow, Nasdaq Slip Ahead of Nvidia Earnings \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Dow, Nasdaq Slip Ahead of Nvidia Earnings \u2014 Live Updates WSJ Stock market today: Dow, S&P 500, Nasdaq slip in countdown to Nvidia earnings Yahoo Finance Stocks fall again as AI companies keep swinging Anchorage Daily News Investors look to Nvidia's earnings and Anthropic's IPO to refresh the tech rally CNBC Nasdaq opens higher in choppy trading; Nvidia earnings in focus Reuters", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 09:45 PM IST", "pub_date_relative": "44m ago"}, {"title": "Delhi Capitals Part Ways With Mitchell Starc, 5 Others Ahead Of IPL 2027 Auction", "full_content": "The December 16 mini-auction will give Delhi Capitals an opportunity to fill the vacant spots in their squad and strengthen their options ahead of the new season.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:42 PM IST", "pub_date_relative": "47m ago"}, {"title": "Stocks making the biggest moves Tuesday: Disney, Home Depot, Nvidia & more", "full_content": "Disney shares ticked higher in early trading after the media giant reported quarterly results that beat analyst expectations.\n\nNvidia rose as well, as the chipmaker tried to recoup some of its losses from Monday. Traders also awaited the company's latest earnings report, due out after the market closes Tuesday.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nShares of Coca-Cola are down a fraction after TD Cowen named the soft drink maker its best idea for 2027, citing pricing power, global reach and Coke's franchise bottling system.\n\nTD Cowen reiterated Coke's buy rating and raised its 12-month price target to $112 from $104, implying roughly 13% upside from Monday's close.\n\nCoca-Cola is ahead 42% so far in 2026 \"The company's international footprint and advantaged franchise bottling system position KO for on-algorithm 5% organic sales growth, well above [consumer packaged goods] peers,\" said the bank's analyst Robert Moskow.\n\n\"Despite the stock's rise this year, we think it will move higher as KO proves they can overcome rising inflation and tough comparisons,\" the analyst wrote Tuesday.\n\nShare of PepsiCo were down nearly 2% after Bernstein downgraded the Gatorade and Frito-Lay snack maker to underperform from market-perform. The brokerage and researcher also cut its price target to $128, implying roughly 13% downside from Monday's close, from an earlier $131.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 09:41 PM IST", "pub_date_relative": "48m ago"}, {"title": "Jensen Huang Breaks Silence, Signals Willingness to Return as Nvidia CEO - WSJ", "full_content": "Jensen Huang Breaks Silence, Signals Willingness to Return as Nvidia CEO WSJ Alice Huang\u2019s Husband Built a Data-Center Empire Backed by the Chinese State WSJ Why tech bros are desperate to bring Jensen Huang back \u2014 and why that would be a mistake CNN \u2018It\u2019s a horrible idea\u2019: Republicans shut down talk of Jensen Huang\u2019s return Politico Nvidia is being pulled in opposite directions by 2 powerful forces Yahoo Finance", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 09:41 PM IST", "pub_date_relative": "48m ago"}, {"title": "Lisa Cook lawyer signals Fed governor won't attend Trump committee's hearing", "full_content": "Federal Reserve Governor Lisa Cook 's attorney on Tuesday gave the strongest signal yet that his client will not attend a hearing at the White House with a \"committee of inquiry\" investigating mortgage fraud allegations against Cook.\n\nThe committee established last month by President Donald Trump , who has previously tried to remove Cook from the central bank's board, is pretextual and poses a threat to the Fed, attorney Abbe Lowell wrote in a letter to presidential counsel Will Scharf.\n\n\"Governor Cook has no legal obligation to participate in an unfair hearing \u2014 and indeed, has a duty to the Federal Reserve to decline to participate in any proceeding that would undermine the institution's unique status and independence,\" Lowell wrote in the letter, which is dated Monday and was made public Tuesday.\n\nThe latest correspondence came nearly two weeks after the White House committee delayed its proposed hearing with Cook to Dec. 14 from Nov. 5. Lowell said that any hearing with Cook could not take place until at least December because of conflicts with her Fed duties.\n\nWhile Lowell had raised strong concerns from the outset about the legitimacy of the committee, he initially said Cook \"welcomes the opportunity to present the facts so she can clear her name.\"\n\nBut he has continued to cast doubts on both the committee's purpose and its composition of three executive branch officials, including National Economic Council Director Kevin Hassett .\n\nLowell's tone sounded more hostile than ever in this week's letter, the first known to be sent by either party in the matter since the Republican Party's devastating losses in the midterm elections on Nov. 3.\n\nHe accused Scharf and the committee of seeking \"only to manufacture 'cause' for a predetermined removal outcome.\"", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 09:33 PM IST", "pub_date_relative": "56m ago"}, {"title": "Duffy wants $50 billion to avert another ground stop. Experts say money isn\u2019t the issue. - The Washington Post", "full_content": "Duffy wants $50 billion to avert another ground stop. Experts say money isn\u2019t the issue. The Washington Post \u2018Working on floppy disks\u2019: FAA has fielded years of warnings about old systems CNN Trump's $50B air traffic control overhaul faces GOP pushback after nationwide ground stop Fox News Opinion | The FAA failed. Naturally, it wants another $50 billion. The Washington Post Trump administration's $50B air traffic demand hits GOP turbulence in the Senate Politico", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 09:33 PM IST", "pub_date_relative": "56m ago"}, {"title": "Kalshi takes down controversial Trump 'mention' markets at CFTC's request", "full_content": "Prediction market platform Kalshi quietly paused trading in a handful of \"mention\" contracts tied to President Donald Trump at the end of last week at the request of the CFTC.\n\nMention markets are made up of contracts that ask traders what specific words will be used in a speech, a corporate earnings call or during a television broadcast. Earlier this year, a White House teleprompter operator used inside information to place trades in mention markets related to the president's comments.\n\nMarkets paused include those asking traders what nicknames Trump will say before 2027, what the president will say in November and what countries and companies Trump will say before the end of the month.\n\nThe move comes after the Commodity Futures Trading Commission , the federal agency overseeing prediction markets, said in a letter to exchanges in September that mentions contracts have a greater manipulation risk.\n\nA spokesperson for the agency told CNBC that the commission has placed holds on the certification of some of Kalshi's proposed mention markets. The spokesperson cited a Kalshi contract on hold that asked what key words would Trump say before a certain date. The contract was originally self-certified by Kalshi in February 2025.\n\n\"The CFTC stayed the certification of these contracts because they may be susceptible to manipulation, which is consistent with the staff advisory the CFTC put out two months ago,\" said Brooke Nethercott, the agency's spokesperson.\n\nKalshi and the White House did not respond to requests for comment.\n\nIn August, reports emerged that the CFTC was conducting an internal review into mention markets. The agency also requested that Kalshi, which is the only U.S.-regulated exchange that features the contract type, take down its sports-related mention markets in response to the inquiry. Kalshi complied.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 09:30 PM IST", "pub_date_relative": "58m ago"}, {"title": "Nifty reclaims pre-war levels intraday as Indian stocks lead Asia with 10% monthly gain", "full_content": "Indian stocks rose above their pre-war high intraday on Tuesday, extending a month of gains that has made local equities Asia\u2019s best performers and recouped the losses caused by the US-Iran war, with analysts seeing further room for gains. The Nifty 50 moved past its pre-conflict level, with Tuesday\u2019s intraday high of 25,501.35 surpassing the 27 February high of 25,476. The Sensex also crossed its intraday high of 82,246.17, closing at 82,532.19 on Tuesday. The Nifty rose 0.4% to end at 25,387.40, while the Sensex gained 0.5%.\n\nSeveral factors have turned in India\u2019s favour. Oil prices have eased sharply on expectations of de-escalation in the Middle East after the Republicans\u2019 sweeping defeat in the US midterm elections. The improved sentiment has also supported the rupee. Foreign investors have put about $10 billion into Indian stocks this month. Better corporate earnings, a global unwinding of AI trades and expectations that the government may cut taxes on stock market income have added to the optimism.\n\nThat said, the recovery still faces macroeconomic headwinds. Brent crude remains nearly 29% above its 27 February closing level, while the rupee is still about 2.59% weaker against the dollar.\n\nSunny Agrawal, head of fundamental research at SBI Securities, believes the global unwinding of AI trades is beginning to work in India's favour, with capital already rotating out of AI-focused markets into Indian equities .\n\nHowever, the recovery in Indian markets from the lows seen during the US-Iran tensions has largely been driven by heavyweight stocks. \"Banking and IT have done well, which is why we have seen this recovery,\" he said.\n\nThe Nifty Bank closed 1.1% higher, hitting an all-time high on Tuesday, while the Nifty IT ended 0.9% lower.\n\nBroadly, Agrawal expects Indian markets to sustain their recovery unless geopolitical tensions flare up again or crude oil prices rise.\n\nGoing ahead, largecaps are likely to drive market movements.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 09:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Thane Police Commissioner's Phone Hacked, Obscene Videos Posted On WhatsApp Status", "full_content": "The WhatsApp account of Thane Police Commissioner Ashutosh Dumbare has allegedly been hacked.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "'No Disturbance During Missions': Couple's GTA 6 Contract Goes Viral Ahead Of Game's Launch", "full_content": "The five-point agreement gives the husband 10 days of uninterrupted gaming. Some users told the wife she \"deserves better,\" but the couple say they are enjoying the reactions.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Can AI Solve All Disease? DeepMind Co-Founder Demis Hassabis Just Raised $5 Billion To Find Out", "full_content": "At the centre of this strategy is IsoDDE, Isomorphic's AI platform that uses simulation models to study biological systems and design potential drug molecules.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Stop Yelling At Me': When Nvidia's Indian-Born Top Exec Took On Jensen Huang's Daughter", "full_content": "Puri joined Nvidia in 2005 after 22 years at Sun Microsystems and oversaw its worldwide business operations, sales and strategic partnerships.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Big Short\u2019 Michael Burry Buys The Stock AI Was Feared To Kill, And Keeps Betting Against Nvidia", "full_content": "Michael Burry has increased his holdings in Adobe, MercadoLibre, QXO and Lululemon while closing put positions in Oracle and Caterpillar. He continues to maintain bearish bets against Nvidia and semiconductor stocks.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Coherent and Lumentum stocks climb as potential U.S. import ban threatens Chinese rivals", "full_content": "The Trump administration is reportedly planning to move forward on banning imports of Chinese optical transceivers.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 09:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Zelensky Hails 'Unprecedented' Ukraine Attack As Section Of Putin's Crimea Bridge Collapses", "full_content": "Ukraine's multi-stage strike cripples a key Russian supply route to Crimea, while Moscow vows to rebuild the damaged bridge.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Homebuilder sentiment plunges to 14-year low, leading more builders to drop prices", "full_content": "Sentiment among U.S. homebuilders dropped to the lowest level in 14 years, as higher mortgage rates, higher costs for energy, materials and labor, as well as weaker consumer confidence, led to more builders cutting prices.\n\nBuilder confidence in the single-family housing market fell four points to 25, according to the National Association of Home Builders/Wells Fargo Housing Market Index, or HMI. That is the lowest since April 2012, when the market was just recovering from the housing crash and foreclosure crisis. Last November, the index stood at 38.\n\nMortgage rates pulled back slightly in October, but surged higher again last week. The average rate on the 30-year fixed hit 7.51% on Monday, according to Mortgage News Daily. Last year at this time it was 6.38%.\n\nOf the HMI's three components, the index measuring current sales conditions fell six points to 28, and future sales expectations dropped two points to 30. Buyer traffic declined two points to 16 \u2014 its lowest level in 15 years, excluding the start of the pandemic in 2020.\n\n\"Builders are confronting multiple challenges in today's economy,\" Bill Owens, NAHB chairman and a home builder and remodeler from Worthington, Ohio, said in a release. \"Stepped-up immigration enforcement is keeping legal workers off job sites, deepening labor shortages and driving up costs. Higher fuel prices are prompting subcontractors to raise their rates sharply, and with fewer buyers in the market, more builders are scaling back construction.\"\n\nMore builders are now cutting prices as they try to get buyers in the door. In November, 46% of them reduced prices, the highest share in the post-Covid period, according to the report. The share of builders using sales incentives also hit a post-Covid high of 68%.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 09:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Spending growth slowed at retail stores in October as high prices give shoppers pause - AP News", "full_content": "Spending growth slowed at retail stores in October as high prices give shoppers pause AP News Shoppers slowed spending in October as high prices lead to caution ahead of holidays ABC News - Breaking News, Latest News and Videos US Retail Sales Rise 0.2% Amid Mixed Demand for Merchandise Bloomberg.com American shoppers are taking a breather ahead of the holiday season Channel 3000 US retail sales increase moderately; import prices rise above expectations Reuters", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 09:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Scene Box Office Collection Day 12: Suriya's Action Comedy Continues To Hold Attention At Theatres", "full_content": "Suriya leads Scene, a Tamil action comedy that blends crime, conflict and chaos. The film also features Pooja Hegde and Jyothika in key roles.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:04 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Dow falls 800 points as tech shares decline, traders eye reported NSA network outage: Live updates", "full_content": "Stocks dropped on Tuesday, pressured by renewed selling in semiconductor names, as traders braced for Nvidia's much-anticipated earnings report.\n\nA CNN story about a National Security Agency network outage added to recent jitters about the country's technology infrastructure and helped weigh on the market, traders said.\n\nThe Dow Jones Industrial Average fell 845 points, or 1.6%. The Nasdaq Composite lost 1.4%, while the S&P 500 slipped 1.3%. The Dow was down more than 920 points at its session low.\n\nMajor averages fell to their lows of the day following the report from CNN that said a classified network used by the spy agency had gone down, citing six people familiar with the matter. CNN's sources said there was no evidence that it was a cyberattack. The New York Times confirmed the report, noting that the network is used to transmit top secret information.\n\nTraders said the report helped take equities lower, though the losses were contained. This reported outage is latest in a string of incidents that have left people on edge including the FAA ground stop over the weekend, Microsoft's Outlook outage last week and some recent issues with banking apps.\n\nDow, intraday Nvidia shares trades off their lows of the session after former CEO Jensen Huang said he would be open to returning as CEO if the company's board thought that was in the best interest of shareholders. Traders are on edge ahead of the chipmaker's earnings after the bell.\n\n\"Nvidia should report strong results and guidance, but [it] is unlikely to be able to give investors solid answers to the questions heavily weighing on the stock [regarding] leadership and investigations around export controls,\" Ross Mayfield, investment strategist at Baird, told CNBC. \"Strong demand might stabilize things, but the next leg higher will need some clarification around the 2028 and beyond outlook.\"\n\nDespite Nvidia's share comeback, the rest of technology was lower with Micron Technology sliding roughly 6%.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:25 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "OCSL Q4 2026 slides: credit quality improves as earnings decline", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:23 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Versigent at RBC Global Industrials Conference 2026: export growth offsets headwinds", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:21 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia stock falls ahead of earnings as company reels from Huang resignation", "full_content": "Nvidia shares slipped on Tuesday as former CEO Jensen Huang released his first public statement since his resignation and the company prepares to report earnings after the bell.\n\nHuang said he is open to returning as Nvidia's CEO and that he is committed to cooperating with the board's investigation into his behavior.\n\n\"I created problems for the Board that I deeply regret,\" Huang said in a statement obtained by CNBC's David Faber . \"I own my mistakes completely, and I am committed to cooperating with the Board's independent investigation.\"\n\n\"If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO,\" Huang continued.\n\nHuang resigned from Nvidia, the company's board announced on Thursday, following reports that he had a relationship with a woman U.S. intelligence reportedly believes to be a Chinese spy. Huang told employees he had an affair in an email on Nov. 8. Outlets also reported that Huang also had an affair with a vice president at the company and an \"intimate relationship\" with an unnamed second employee.\n\nNvidia stock chart Nvidia's stock slid 4% on Monday, bringing shares to their lowest close since July 1, 2025.\n\nLawmakers also announced Tuesday that Huang will appear before the House Foreign Affairs, Intelligence, and China Select Committees on Dec. 1. Nvidia general counsel Tim Teter will appear before the same committees on Dec. 2.\n\nNvidia's stock slid 4% on Monday, bringing shares to their lowest close since July 1, 2025.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 10:19 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Palatin Technologies Q1 2026 misses as stock falls 14%", "full_content": "", "source": "Investing.com News", "pub_date_str": "17 Nov 2026, 10:18 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US tech stocks slide ahead of Nvidia results", "full_content": "Nasdaq 100 down 1.4% after volatile run of trading", "source": "FT Markets", "pub_date_str": "17 Nov 2026, 10:17 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jensen Huang breaks his silence ahead of Nvidia earnings \u2014 plus, 1 stock to buy on weakness", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:12 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia earnings live updates: Wall Street braces for first report since Huang's ouster", "full_content": "Nvidia is set to report quarterly results after the close on Tuesday in what may be the most anticipated earnings announcement in the chipmaker's 33-year history, landing less than a week after co-founder Jensen Huang's abrupt resignation as CEO.\n\nFinance chief Colette Kress is used to addressing Wall Street, but never like this . She's now functioning as interim CEO, meaning her responsibilities go well beyond the key numbers. Employees, investors, analysts and customers are eager to hear her first public remarks since last week's dramatic shake-up.\n\nGrowth remains explosive, with revenue expansion expected to reach 91% in the latest quarter from $59 billion in the same period a year ago. Nvidia said in August that sales next fiscal year would grow roughly 70% in what Kress, on the prior earnings call, described as a \"supply constrained outlook.\"\n\nBut Nvidia's stock is down 24% this month and on Friday wrapped up its sixth straight weekly drop, the longest losing streak since 2012. On Monday, the stock closed at its lowest since July 2025. In addition to the Huang saga, the company is dealing with broader concerns about an AI slowdown and a political shift in Washington, D.C., following this month's midterm elections.\n\nThe biggest cloud for Nvidia is around its China business after Huang's reported affair with a businesswoman who's allegedly a Chinese spy. The Commerce Department on Monday announced a change that would prevent Nvidia's chips from being rented to Chinese companies entirely, putting revenue at risk.\n\nMany Huang allies in Silicon Valley have called for Huang to be reinstated as CEO, citing fears that the company and the country will lose out on innovation without him.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 10:11 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Disney beats fourth-quarter estimates, targets $3 billion in savings through cost-cutting efforts", "full_content": "Disney on Tuesday reported quarterly earnings and revenue that exceeded analysts' expectations and announced it's targeting $3 billion in cost savings by fiscal 2029.\n\nThose cost-cutting efforts include several rounds of layoffs announced in recent months, Disney's chief financial officer, Hugh Johnston, told CNBC. The most recent round, which seeks to reduce costs by up to 20%, was reported earlier this month .\n\nFuture cost-saving measures will include reductions in administrative and other general expenses, Johnston said, while adding, \"We do expect more layoffs.\"\n\nDisney CEO Josh D'Amaro told investors on the company's earnings call that the job cuts are \"not easy.\"\n\n\"They affect people who care deeply about Disney and have contributed so much to this company,\" he said. \"At the same time, these steps are important if we want to be a company that moves faster, adapts to a rapidly changing environment, and keeps investing in the content and technology that will drive our growth.\"\n\nThe cuts will help Disney fund its $26 billion in projected content spend for fiscal 2027, a 9% increase from fiscal 2026.\n\nThe entertainment giant is also forecasting double-digit growth in earnings per share in the next fiscal year, as well as segment operating income growth of around 8%.\n\nDisney noted that the majority of that growth will be concentrated in the first half of the year due to the theatrical debut of \"Avengers: Doomsday\" and a boost from the Super Bowl, which will air on Disney's ESPN and ABC networks.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:10 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dow slides weighed by Home Depot; Nasdaq is flat ahead of Nvidia earnings: Live updates - CNBC", "full_content": "Dow slides weighed by Home Depot; Nasdaq is flat ahead of Nvidia earnings: Live updates CNBC Stock Market Today: Dow falls 700 points, S&P 500 and Nasdaq are back under pressure ahead of Nvidia results \u2014 live updates MarketWatch Dow's 450-Point Drop Led By Losses For Shares Of Caterpillar, NVIDIA Corp. Moomoo Stocks Pressured by Weakness in Software and Health Insurance Stocks Barchart.com Dow Falls Over 200 Points; US Retail Sales Rise 0.2% In October Benzinga", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 10:09 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Property Play: Chase Home Lending CEO says he plans to 'go on offense' against non-bank lenders", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nMortgage rates shot higher again last week, after four straight weeks of declines. A hotter-than-expected monthly inflation report, coupled with new headlines from the Iran war, had the average rate on the 30-year fixed mortgage up 33 basis points to 7.5%, according to Mortgage News Daily.\n\nTotal mortgage demand, including both refinancing and new purchase loans, is now down just over 39% from a year ago, according to the Mortgage Bankers Association. Despite all that, Sean Grzebin, the CEO of Chase Home Lending, the nation's largest bank mortgage lender, said he's hiring and bent on increasing market share.\n\n\"For the last several years, we haven't really added a lot of salespeople,\" said Grzebin, who admits plainly that this is the worst market in decades. \"We're going to hire a bunch of home lending advisors across the United States. We're going to focus on areas where we haven't had a lot of coverage, but there's a lot of mortgage activity and transactions taking place, and it really matches the expansion that we're having within the branch network on the consumer bank side.\"\n\nGrzebin said he is looking to take back market share from non-bank lenders, who flourished after the financial crisis, when banks were cleaning up from thousands of failed home loans. In August, JPMorganChase announced a 40% increase in home lending capital through 2035 to $750 billion. It will also hire 850 new lending agents.\n\n\"I think the non-banks are all very formidable competitors. I think they've had an advantage while the banks were distracted through several decades,\" he said.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 10:08 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Former Nvidia CEO Jensen Huang says he\u2019s open to returning in first statement since resignation", "full_content": "In his first public statement since resigning as Nvidia CEO last week, Jensen Huang struck a contrite tone, saying that he is committed to cooperating with the board's investigation into his relationship with an alleged Chinese intelligence contact.\n\n\"I created problems for the Board that I deeply regret,\" Huang said in the written statement obtained by CNBC's David Faber. \"I own my mistakes completely, and I am committed to cooperating with the Board's independent investigation.\"\n\nHuang said he had seen support from investors and employees and was willing to come back as CEO to help the company navigate \"complex technology, market, competitive, and geopolitical dynamics.\"\n\n\"If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO,\" Huang said in the statement.\n\nMany in the tech world have called for Huang to return as Nvidia CEO, putting together an online petition with over 180,000 signatures.\n\nPresident Donald Trump said on Monday that he is open to Jensen Huang returning as CEO of Nvidia.\n\nThe board is not considering bringing Huang back as CEO, CNBC reported on Monday .\n\nLast week, Huang resigned from Nvidia after 33 years as CEO. The resignation came days after Huang, Nvidia's founder, admitted to an affair, and news stories alleged he had an affair with Alice Huang, who worked for a customer and is alleged to have contact with Chinese intelligence, as well as affairs with employees at Nvidia.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 10:00 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic IPO: Planning to invest from India? Check why IPO allotment may be difficult and what you can do instead", "full_content": "Indian retail investors hoping to participate in Anthropic's proposed US initial public offering (IPO) may not find it as straightforward as applying for a domestic share sale. While Indian residents are permitted to invest in overseas equities, accessing shares at the IPO stage could be a challenge, as most investment platforms available to Indian investors offer access to US stocks only after they begin trading on an exchange.\n\nThis means investors interested in the artificial intelligence company's public listing may have to wait until its shares debut on a US exchange, rather than participate in the initial allotment. However, investing after listing remains an option through platforms that provide access to US stocks, subject to the applicable foreign investment and remittance rules.\n\nCA Chandni Anandan, Tax Expert at ClearTax, said Indian resident retail investors generally do not have direct access to US IPO allotments through Indian brokers. Most Indian platforms offering US investing allow investors to buy shares only after they are listed on a US exchange.\n\nIndian residents can invest in overseas equities through the Liberalised Remittance Scheme (LRS) of the Reserve Bank of India (RBI). The scheme allows resident individuals to remit up to $250,000 per financial year for permitted transactions, including investments in foreign equity.\n\nFor investors who cannot participate in the initial IPO allotment, this provides a route to purchase Anthropic shares after they begin trading on Nasdaq.\n\n\"Investment in foreign equity, whether in an IPO or after listing, is a permitted capital-account transaction under the LRS,\" said Anandan.\n\nShe explained that investors must route the remittance through an authorised dealer bank, which processes the outward transfer.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 09:46 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Dow, Nasdaq Slip Ahead of Nvidia Earnings \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Dow, Nasdaq Slip Ahead of Nvidia Earnings \u2014 Live Updates WSJ Stock market today: Dow, S&P 500, Nasdaq slip in countdown to Nvidia earnings Yahoo Finance Stocks fall again as AI companies keep swinging Anchorage Daily News Investors look to Nvidia's earnings and Anthropic's IPO to refresh the tech rally CNBC Nasdaq opens higher in choppy trading; Nvidia earnings in focus Reuters", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 09:45 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Delhi Capitals Part Ways With Mitchell Starc, 5 Others Ahead Of IPL 2027 Auction", "full_content": "The December 16 mini-auction will give Delhi Capitals an opportunity to fill the vacant spots in their squad and strengthen their options ahead of the new season.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 09:42 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stocks making the biggest moves Tuesday: Disney, Home Depot, Nvidia & more", "full_content": "Disney shares ticked higher in early trading after the media giant reported quarterly results that beat analyst expectations.\n\nNvidia rose as well, as the chipmaker tried to recoup some of its losses from Monday. Traders also awaited the company's latest earnings report, due out after the market closes Tuesday.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nShares of Coca-Cola are down a fraction after TD Cowen named the soft drink maker its best idea for 2027, citing pricing power, global reach and Coke's franchise bottling system.\n\nTD Cowen reiterated Coke's buy rating and raised its 12-month price target to $112 from $104, implying roughly 13% upside from Monday's close.\n\nCoca-Cola is ahead 42% so far in 2026 \"The company's international footprint and advantaged franchise bottling system position KO for on-algorithm 5% organic sales growth, well above [consumer packaged goods] peers,\" said the bank's analyst Robert Moskow.\n\n\"Despite the stock's rise this year, we think it will move higher as KO proves they can overcome rising inflation and tough comparisons,\" the analyst wrote Tuesday.\n\nShare of PepsiCo were down nearly 2% after Bernstein downgraded the Gatorade and Frito-Lay snack maker to underperform from market-perform. The brokerage and researcher also cut its price target to $128, implying roughly 13% downside from Monday's close, from an earlier $131.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 09:41 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Lisa Cook lawyer signals Fed governor won't attend Trump committee's hearing", "full_content": "Federal Reserve Governor Lisa Cook 's attorney on Tuesday gave the strongest signal yet that his client will not attend a hearing at the White House with a \"committee of inquiry\" investigating mortgage fraud allegations against Cook.\n\nThe committee established last month by President Donald Trump , who has previously tried to remove Cook from the central bank's board, is pretextual and poses a threat to the Fed, attorney Abbe Lowell wrote in a letter to presidential counsel Will Scharf.\n\n\"Governor Cook has no legal obligation to participate in an unfair hearing \u2014 and indeed, has a duty to the Federal Reserve to decline to participate in any proceeding that would undermine the institution's unique status and independence,\" Lowell wrote in the letter, which is dated Monday and was made public Tuesday.\n\nThe latest correspondence came nearly two weeks after the White House committee delayed its proposed hearing with Cook to Dec. 14 from Nov. 5. Lowell said that any hearing with Cook could not take place until at least December because of conflicts with her Fed duties.\n\nWhile Lowell had raised strong concerns from the outset about the legitimacy of the committee, he initially said Cook \"welcomes the opportunity to present the facts so she can clear her name.\"\n\nBut he has continued to cast doubts on both the committee's purpose and its composition of three executive branch officials, including National Economic Council Director Kevin Hassett .\n\nLowell's tone sounded more hostile than ever in this week's letter, the first known to be sent by either party in the matter since the Republican Party's devastating losses in the midterm elections on Nov. 3.\n\nHe accused Scharf and the committee of seeking \"only to manufacture 'cause' for a predetermined removal outcome.\"", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 09:33 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Kalshi takes down controversial Trump 'mention' markets at CFTC's request", "full_content": "Prediction market platform Kalshi quietly paused trading in a handful of \"mention\" contracts tied to President Donald Trump at the end of last week at the request of the CFTC.\n\nMention markets are made up of contracts that ask traders what specific words will be used in a speech, a corporate earnings call or during a television broadcast. Earlier this year, a White House teleprompter operator used inside information to place trades in mention markets related to the president's comments.\n\nMarkets paused include those asking traders what nicknames Trump will say before 2027, what the president will say in November and what countries and companies Trump will say before the end of the month.\n\nThe move comes after the Commodity Futures Trading Commission , the federal agency overseeing prediction markets, said in a letter to exchanges in September that mentions contracts have a greater manipulation risk.\n\nA spokesperson for the agency told CNBC that the commission has placed holds on the certification of some of Kalshi's proposed mention markets. The spokesperson cited a Kalshi contract on hold that asked what key words would Trump say before a certain date. The contract was originally self-certified by Kalshi in February 2025.\n\n\"The CFTC stayed the certification of these contracts because they may be susceptible to manipulation, which is consistent with the staff advisory the CFTC put out two months ago,\" said Brooke Nethercott, the agency's spokesperson.\n\nKalshi and the White House did not respond to requests for comment.\n\nIn August, reports emerged that the CFTC was conducting an internal review into mention markets. The agency also requested that Kalshi, which is the only U.S.-regulated exchange that features the contract type, take down its sports-related mention markets in response to the inquiry. Kalshi complied.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 09:30 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty reclaims pre-war levels intraday as Indian stocks lead Asia with 10% monthly gain", "full_content": "Indian stocks rose above their pre-war high intraday on Tuesday, extending a month of gains that has made local equities Asia\u2019s best performers and recouped the losses caused by the US-Iran war, with analysts seeing further room for gains. The Nifty 50 moved past its pre-conflict level, with Tuesday\u2019s intraday high of 25,501.35 surpassing the 27 February high of 25,476. The Sensex also crossed its intraday high of 82,246.17, closing at 82,532.19 on Tuesday. The Nifty rose 0.4% to end at 25,387.40, while the Sensex gained 0.5%.\n\nSeveral factors have turned in India\u2019s favour. Oil prices have eased sharply on expectations of de-escalation in the Middle East after the Republicans\u2019 sweeping defeat in the US midterm elections. The improved sentiment has also supported the rupee. Foreign investors have put about $10 billion into Indian stocks this month. Better corporate earnings, a global unwinding of AI trades and expectations that the government may cut taxes on stock market income have added to the optimism.\n\nThat said, the recovery still faces macroeconomic headwinds. Brent crude remains nearly 29% above its 27 February closing level, while the rupee is still about 2.59% weaker against the dollar.\n\nSunny Agrawal, head of fundamental research at SBI Securities, believes the global unwinding of AI trades is beginning to work in India's favour, with capital already rotating out of AI-focused markets into Indian equities .\n\nHowever, the recovery in Indian markets from the lows seen during the US-Iran tensions has largely been driven by heavyweight stocks. \"Banking and IT have done well, which is why we have seen this recovery,\" he said.\n\nThe Nifty Bank closed 1.1% higher, hitting an all-time high on Tuesday, while the Nifty IT ended 0.9% lower.\n\nBroadly, Agrawal expects Indian markets to sustain their recovery unless geopolitical tensions flare up again or crude oil prices rise.\n\nGoing ahead, largecaps are likely to drive market movements.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 09:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Coherent and Lumentum stocks climb as potential U.S. import ban threatens Chinese rivals", "full_content": "The Trump administration is reportedly planning to move forward on banning imports of Chinese optical transceivers.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Nov 2026, 09:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Home Depot names Richard McPhail as new CEO, beats earnings expectations", "full_content": "Home Depot on Tuesday announced its Chief Financial Officer Richard McPhail will become CEO of the company, replacing Ted Decker, effective next week.\n\nAlongside McPhail's appointment, Home Depot said Ann-Marie Campbell, currently senior executive vice president of U.S. stores and operations, will become president and chief operating officer. Jordan Broggi has been chosen as CFO to replace McPhail.\n\nDecker, CEO since 2022, had been on temporary medical leave since August. The company said on Tuesday that Decker has returned from leave but is now stepping down from his role. He will continue to serve as chair of the board of directors, the company said.\n\n\"I'm glad to be back and grateful for the support I received,\" Decker told analysts on Tuesday. \"The board and I have agreed that now is the right time to move to the next phase of our succession plan.\"\n\nMcPhail has been with the company since 2005, holding multiple executive roles.\n\n\"We're not going to change course,\" McPhail told CNBC's Becky Quick.\n\nHe said the company will continue to lean into winning professional shoppers like contractors and using AI tools to encourage sales. McPhail added that while the company faces more challenges now than it did at the start of the year, it is still winning share of the home improvement market.\n\nHome Depot has been pressured by a sluggish housing market, higher mortgage rates and a more cautious consumer. Still, the company has previously said it's seen resilience among its pro shoppers who are still shopping for their home improvement projects.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 08:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This AI infrastructure stock has fallen 25%. Why I'm buying the dip", "full_content": "Quanta Services shares have fallen sharply, but strong earnings and a record backlog could create a buying opportunity, says investor Stephanie Link.", "source": "CNBC Top News", "pub_date_str": "17 Nov 2026, 08:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Investor Steve Eisman says the AI neocloud stocks are in 'big trouble' from Nvidia fallout", "full_content": "Investor Steve Eisman said the so-called AI neocloud stocks will be the biggest losers from the unfolding Nvidia scandal.\n\nNvidia was essentially a \"virtual vertical holding company and it's unwinding,\" said Eisman of \"Big Short\" fame on CNBC's \"Squawk Box .\" \"I think neoclouds are all in big trouble though because they are part of that vertical holding company and I think they're about to get ejected.\"\n\nNeoclouds, which used borrowed funds to build data centers, have been among the hardest-hit stocks during the recent pullback in the artificial     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
