on February 12, 2027.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Benchmark To Hong Kong, Singapore, Dubai': Ajay Bagga Makes The Case For LTCG, STT Relief", "full_content": "Market experts Ajay Bagga and Gurmeet Chadha say tax relief is one lever India can pull to stem foreign outflows, as the Finance Minister signals she is open to hearing views.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "India tightens Mauritius tax treaty rules to prevent misuse of tax benefits, effective August 10", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India tightens Mauritius tax treaty rules to prevent misuse of tax benefits, effective August 10 The Economic Times daily newspaper is available online now. Read Today's Paper India tightens Mauritius tax treaty rules to prevent misuse of tax benefits, effective August 10 SECTIONS India tightens Mauritius tax treaty rules to prevent misuse of tax benefits, effective August 10 ET Bureau Last Updated: Oct 14, 2026, 10:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Finance Ministry has unveiled an important amendment to the India-Mauritius Double Taxation Avoidance Agreement. Effective August 10, the new Principal Purpose Test seeks to curb potential abuses of tax treaty benefits. This allows tax authorities to examine claims more thoroughly, specifically targeting investment vehicles based in Mauritius, such as foreign portfolio investors and private equity funds, to maintain fair taxation practices.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 10:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "14 Years, One BMW, Rs 70 Lakh: The Insurance Battle That Finally Ended In Victory", "full_content": "The incident occurred on March 8, 2012, and the ruling was reported in October 2026, making this an approximately 14-year dispute.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "China\u2019s Exports Soar, Putting Its Trade Surplus on Track for a Record - The New York Times", "full_content": "China\u2019s Exports Soar, Putting Its Trade Surplus on Track for a Record The New York Times China\u2019s Trade Surplus Nears $940 Billion as Export Growth Surges Bloomberg.com China's exports and imports surge past expectations in September CNBC China\u2019s exports surge 36% as AI-related shipments boom Financial Times China's September exports soar, putting $1 trillion trade surplus in sight Reuters", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 10:20 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jubilant Foodworks Shares May Rally Up To 47%, Says Motilal Oswal On Attractive Valuation; Check Target Price", "full_content": "Jubilant FoodWorks will lead to better capital efficiency and operating leverage, which should support margin in an inflationary scenario, believes the brokerage.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold Fields mounts charm offensive to woo Northern Star investors", "full_content": "South African miner\u2019s chief meets Australian shareholders to promote merits of creating $27bn gold \u2018powerhouse\u2019", "source": "FT Markets", "pub_date_str": "14 Oct 2026, 10:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "Diwali shopping 2026: CPI inflation crosses 5% in September, may hit 6.8% in November \u2014 what item-wise data reveals", "full_content": "With Diwali 2026 approaching, households tend to spend more on groceries, festive clothing, home decor, gifts and other seasonal purchases. How have prices of these items changed over the past year, and which expenses could put additional pressure on festive budgets?\n\nAccording to the latest data from the Ministry of Statistics and Programme Implementation (MoSPI), CPI retail inflation rose to 5.54% in September 2026, from 4.83% in August 2026.\n\nWhile prices in several household and festive-shopping categories have risen year on year, some items have recorded a decline in inflation or negative inflation . Here is what consumers should know before planning their 2026 Diwali shopping budget.\n\nThe Consumer Price Index (CPI) measures changes in the prices of goods and services that households regularly buy, including food, beverages, clothing, transport and household products.\n\nFor example, if a basket of goods cost \u20b9 1,000 in September 2025 and the same basket cost \u20b9 1,055.40 in September 2026, the prices would have increased by 5.54% over the year.\n\nHowever, overall CPI inflation does not mean every product has become more expensive at the same rate. The inflation rate for an individual category can be higher or lower than the headline figure.\n\nThe following table compares year-on-year inflation across selected categories relevant to festive shopping.\n\nSource: MoSPI. Note: YoY CPI inflation; selected Diwali shopping items. Consumer item descriptions may differ from official CPI category names.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 10:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Don't worry': Piyush Goyal sends a message to the world on India-US ties", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 'Don't worry': Piyush Goyal sends a message to the world on India-US ties The Economic Times daily newspaper is available online now. Read Today's Paper 'Don't worry': Piyush Goyal sends a message to the world on India-US ties SECTIONS 'Don't worry': Piyush Goyal sends a message to the world on India-US ties ET Online Last Updated: Oct 14, 2026, 10:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis At the Bloomberg New Economy Forum, Union Commerce and Industry Minister Piyush Goyal shed light on the promising future of India and the US's partnership. He expressed his belief in the strong bond that is expected to grow, while addressing fears regarding its effects on other nations. Goyal confirmed that this alliance is stable and poses no threats, fostering a hopeful view for the future of their relations.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 10:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: China\u2019s yuan firms as investors await US CPI data, assess inflation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China\u2019s yuan firms as investors await US CPI data, assess inflation Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China\u2019s yuan firms as investors await US CPI data, assess inflation SECTIONS Global Market: China\u2019s yuan firms as investors await US CPI data, assess inflation By Anupam Nagar , ETMarkets.com Last Updated: Oct 14, 2026, 10:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s yuan edged higher against the dollar as investors assessed mixed inflation data and awaited US consumer price figures. Rising producer prices contrasted with subdued consumer inflation amid weak domestic demand. Analysts expect gradual yuan appreciation through 2026, supported by trade surpluses and capital flows, while Federal Reserve policy remains a key driver.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Crypto bosses, CEOs and F1: Singapore's business events boom gathers pace", "full_content": "Billionaires, global CEOs and crypto executives descended on Singapore last week as a growing number of high-profile conferences coincided with the country's Formula 1 Grand Prix.\n\nMore than 40 business events were held around this year's Grand Prix period, up from over 25 in 2025 and over 30 in 2024, according to the Singapore Tourism Board. The events included the Milken Institute Asia Summit, TOKEN2049, the Forbes Global CEO Conference, Solana Summit APAC and the Global-Asia Family Office Summit.\n\nFormula 1 has generated more than 2.2 billion Singapore dollars ($1.72 billion) in incremental tourism receipts between its debut in 2008 and 2024, according to Singapore's Ministry of Energy, Trade and Industry , which equates to an average of S$150 million each. The race itself costs approximately S$140 million a year to organize, METI said, though noted it isn't directly comparable with the revenue generated.\n\nSingapore GP said the 2026 race drew 301,294 spectators, the second-highest attendance in the event's history.\n\nBusiness events themselves are becoming a larger source of tourism revenue. Receipts from meetings, incentives, conventions and exhibitions (MICE) rose 35% to S$2.3 billion in 2025, outpacing the 10% growth in Singapore's overall tourism receipts to a record S$32.8 billion, data from STB showed.\n\nSingapore's Tourism Board noted that MICE visitors typically spend significantly more than leisure travelers.\n\nOrganizers are increasingly capitalizing on the excitement surrounding Formula 1 to extend delegates' stays, according to Poh Chi Chuan, executive director of exhibitions and conferences at STB.\n\n\"This creates a natural gravitational pull, when the city is buzzing and the right target audience is already flying in, savvy planners build on that momentum,\" Poh said.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Live Updates: Sensex Volatile, Nifty 50 Slips In Red; Tata Elxsi Rallies 8% After Q2 Results", "full_content": "Stock Market Live Updates: Sectorally, Nifty IT extended rally, with over 1% gains, followed by Nifty Oil and Gas and Nifty FMCG. Losses were seen in Nifty Pharma, Nifty Metals, Nifty Auto and Nifty PSU Bank.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 LIVE: Quarterly results today 2026 updates on Reliance Industrial Infra, MRPL, Tata Tech, BHEL, Groww, Canara Bank", "full_content": "Q2 quarterly results today LIVE updates: 26 listed companies are scheduled to announce their second-quarter results for the financial year 2026-27 on Wednesday, 14 October 2026, according to the BSE\u2019s forthcoming results calendar.\n\nThe list includes Bharat Heavy Electricals Ltd (BSE code: 500103), Canara Bank (532483), CEAT Ltd (500878), Elecon Engineering Company Ltd (505700), Aditya Birla Money Ltd (532974), and Mangalore Refinery and Petrochemicals Ltd (500109). Other companies slated to declare their results include Bajaj Consumer Care Ltd (533229), ICICI Lombard General Insurance Company Ltd (540716), Hathway Cable & Datacom Ltd (533162), Tata Technologies Ltd (544028), HDB Financial Services Ltd (544429), Billionbrains Garage Ventures Ltd, which operates under the Groww brand (544603), and Sona BLW Precision Forgings Ltd (544938). The list also features Aurique (517230), Bacil Pharma Ltd (524516), Emmvee Photovoltaic Power Ltd (544608), Indus Finance Ltd (531841), Naturo Indiabull Ltd (543579), Polycon International Ltd (531397), Rajratan Global Wire Ltd (530253), Reliance Industrial Infrastructure Ltd (523445), Schloss Bangalore Ltd (544408), Sulabh Engineers & Services Ltd (508969), TTL Enterprises Ltd (514236), Viji Finance Ltd (537820), and Ardi Alliances (504370).\n\nInvestors can track this space for updates on revenue, profitability, margins and management commentary, which could influence movements in the respective stocks. The schedule is based on the BSE forthcoming results calendar. Here are all the LIVE UPDATES:-\n\nReliance Industrial Infrastructure Ltd (RIIL) is trading at \u20b9 705.00 on the National Stock Exchange (NSE) as of 10:55 AM IST on October 14, 2026.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Bharat Coking Coal share price jumps 7% today despite 19% fall in 2026 | Check target, stop loss", "full_content": "Bharat Coking Coal share price zoomed 7.23% in Wednesday's trading session after the company announced a price hike for raw coking coal on Tuesday.\n\nBharat Coking Coal shares opened at \u20b9 31.64 per share today on NSE, as compared to previous close of \u20b9 31.11 on Tuesday. The stock touched an intraday high of \u20b9 33.48 on 14 October.\n\nIn an exchange filing on Tuesday, Bharat Coking Coal said that the board has approved a price hike in the select grades of raw coking coal supplied to the non-regulated sector.\n\n\u201cWe wish to inform you that the Board of Directors of Bharat Coking Coal Limited, at its meeting held on 13th Oct, 2026, approved the Rationalisation of Basic Prices of certain grades of Raw Coking Coal for Non-Regulated Sector,\u201d the company said in the filing.\n\nIt further said that the price revision aims to correct price differences between various coal grades. It applies only to the non-regulated sector and covers Steel Grades I and II, Direct Feed, PCC Washery Grades W-II to W-VI, and HVMC Washery Grades W-I to W-VI. Basic prices have been increased by around 0.1% to 14%, depending on the grade.\n\nBharat Coking Coal shares have gained 2.43% over the past week, indicating a modest recovery in the near term. However, the stock has remained largely flat over the past month, declining 0.42%.\n\nThe broader trend remains weak, with the shares down 19% year-to-date, reflecting significant losses in 2026.\n\nAccording to Mahesh M Ojha, VP Research & Business Development at Kantilal Chhaganlal Securities, Bharat Coking Coal shares can be considered for a near-term upside, with a target price of \u20b9 35.50, followed by \u20b9 37 and \u20b9 38.50.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:42 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Vedanta Power shares jump 13% today after a 5-day loss - Can a rebound in the stock sustain? Tech experts decode", "full_content": "Vedanta Power shares surged as much as 13% in intraday trade on the BSE on Wednesday, 14 October, looking set to snap their five-day losing streak. Vedanta Power share price opened at \u20b9 30.54 against its previous close of \u20b9 30.24 and jumped 13.3% to an intraday high of \u20b9 34.25. The sharp jump in the stock price followed a spurt of more than threefold in volume.\n\nOn a monthly scale, the stock is flat so far in October after a nearly 7% fall in the previous month. Over the last three months, the stock has declined 18%, compared to a 5% drop in the equity benchmark Sensex.\n\nVedanta Power shares hit their 52-week high of \u20b9 52.49 on 3 July and a 52-week low of \u20b9 29.92 on 13 October this year.\n\nMetals and mining major Vedanta demerged into Vedanta Aluminium, Vedanta Oil & Gas, Vedanta Power, Vedanta Iron & Steel, and Vedanta Limited this year, with a demerger record date of 1 May 2026.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, Vedanta Power has been in a downtrend with the formation of lower highs and lower lows. The stock has been falling in a corrective structure and looks incomplete as of now.\n\nThukral believes that there is a high possibility that the stock will experience resistance in the range of \u20b9 34 and \u20b9 36, and a fresh round of selling could be observed.\n\nHowever, Thukral added that based on the current formations, the stock has potential long-term bullish implications, and it could be bought on dips near the \u20b9 26 to \u20b9 28 range, which could be the range where the stock bottoms out.\n\n\"The stock is in a downtrend and moving in a corrective structure which looks incomplete. So, any bounce towards the resistance zone is an exit opportunity for now. Any sustained move above \u20b9 36 invalidates the view of an immediate fresh bottom in the stock,\" said Thukral.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:40 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India's inflation hits 5.54%: Onion prices up 108%, food inflation 7.74% | 10 numbers explained", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 11:26 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ASML says it's getting order interest through 2030 as profit smashes expectations", "full_content": "ASML said Wednesday that some of its customers are expressing interest in placing orders for its critical semiconductor tools for 2029 and 2030 as the company reported third-quarter profit that beat expectations.\n\nThe comments will likely comfort investors who have been looking to assess the longer-term demand outlook for ASML's lithography machines.\n\n\"Our customers continue to increase their short- and medium-term equipment demand forecasts with us, driven primarily by their views on the size and duration of AI-related investments,\" CEO Christophe Fouquet said in a press release.\n\n\"In light of their demand visibility, some customers are expressing an interest in placing orders with us for 2029 and even 2030.\"\n\nASML is the only company in the world that produces extreme ultraviolet lithography machines, a key tool used by the likes of TSMC to make the world's most advanced semiconductors.\n\nInvestors closely watch the Dutch company's earnings for signs of AI-related chip demand.\n\nFouquet said current supply planned for 2027 and 2028 will not fully meet the demand of its customers. The company is \"investigating ways\" to increase capacity for 2028 beyond the 30% increase it had previously forecast.\n\nDuring the quarter, Samsung and TSMC, the world's two biggest chipmakers, committed to using ASML's High NA extreme ultraviolet (EUV) lithography machines. High NA EUV is ASML's next-generation tool, which analysts see as key to the Dutch firm's future growth.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 11:26 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures are mixed as traders await consumer inflation report: Live updates", "full_content": "U.S. stock futures were up early Wednesday as the release of September's consumer inflation report loomed.\n\nS&P 500 futures were up 0.14%, while Nasdaq-100 futures were flat, and Dow Jones Industrial Average futures fell 0.35% higher.\n\nBank of America shares declined over 2% in extended trading after the firm was hit with more than $1.2 billion in federal penalties , with regulators saying the bank failed to report more than $5 billion in \"suspicious\" transactions.\n\nIn Asia, Australia's S&P/ASX 200 was down 0.62%. Japan's Nikkei 225 added 0.32%, while South Korea's Kospi rose 0.82%.\n\nA drift downward in chip stocks weighed on the major averages Tuesday, with the VanEck Semiconductor ETF (SMH) falling for a sixth straight session over growing fears of an AI spending bubble and rising anxieties around competition out of China.\n\nA swath of big banks posted strong quarterly results, but shares ended the day lower, with Goldman Sachs and Citigroup falling. The market's reaction suggested businesses have a higher bar to clear during the third-quarter earnings season \u2014 especially in tech where semiconductors are expected to be the largest contributor to year-over-year earnings growth.\n\nS&P 500 companies are expected to post a blended earnings growth rate of roughly 30%, while semiconductors and semiconductor equipment are set for growth of 130%, according to FactSet data.\n\n\"The business fundamentals are very strong. It's very hard to argue with the demand side of the story for chips,\" Marta Norton, chief investment strategist at Empower, told CNBC's \"Closing Bell: Overtime.\" \"I don't know if we necessarily question how good those business fundamentals are as much as we question how much valuation is left in the space.\"", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 11:24 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Neogen Chemicals share price jumps nearly 15% in 3 sessions | What's driving the rally, is more upside ahead?", "full_content": "Neogen Chemicals share price jumped over 8% on Wednesday, 14 October, extending its rally for a third consecutive session. The specialty chemicals stock has gained nearly 15% over the past three trading sessions, scaling fresh record highs amid strong buying interest and improving earnings momentum.\n\nAccording to market experts, the stock is witnessing a multi-session breakout, with momentum-driven buying pushing it to fresh all-time highs in the \u20b9 2,748\u2013 \u20b9 2,778 range. Trading volumes have also remained significantly above average, although experts have not identified any specific company announcement to explain the latest surge.\n\nThe rally gathered pace on Monday, 12 October, as the stock rose by around 6\u20137% on heavy volume. It continued on Tuesday, 13 October, when Neogen Chemicals touched a fresh intraday all-time and 52-week high of \u20b9 2,613, extending its upward momentum even as the broader market remained under pressure.\n\nAccording to experts, the stock's rally follows the company's report of record results for the June quarter. Neogen Chemicals posted net sales of \u20b9 250.29 crore, while net profit surged 138.4% year-on-year to \u20b9 17.11 crore. Its operating margin stood at 19.27%.\n\nThe stock is also trading above all its key moving averages, signalling a strong technical trend. The rebound in Indian specialty chemical stocks, coupled with improving earnings momentum following the strong quarterly performance, has further supported investor interest, according to experts.\n\nHowever, with the stock scaling record highs amid elevated volumes and no clearly identified company-specific trigger, investors will be watching whether the buying momentum sustains in the coming sessions.\n\nNeogen Chemicals shares have gained 15.08% over the past month and 26.74% in the last three months. The stock has risen 12.14% over the past week and 11.16% over the past two weeks, reflecting strong recent momentum.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:18 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Reliance Jio IPO RHP filing likely today; latest GMP jumps to \u20b9219 - check expected share price band, size, valuation", "full_content": "Jio Platforms IPO latest update: The Reliance Industries-backed Jio Platforms IPO RHP filing is likely today. The Reliance Jio is likely to file its Red Herring Prospectus (RHP) at the capital market regulator SEBI any time today, multiple media reports. The most awaited Reliance-backed Jio platforms IPO is touted to be the biggest-ever Indian IPO with size of around \u20b9 30,000 crore. Jio Platforms IPO price band has already declared at \u20b9 1,065 to \u20b9 1,119 per equity share.\n\nAfter the outbreak of RHP filing by the Reliance-backed company at SEBI, the grey market has gone highly bullish on the upcoming IPO. According to the market observers, shares of the company are available in the grey market a premium of \u20b9 219. This means Jio Platforms IPO GMP today is \u20b9 219, which is \u20b9 10 higher from yesterday's GMP of \u20b9 210, say market observers.\n\nHowever, InvestorGain website is showing Jio Platforms IPO GMP today at \u20b9 224.\n\nSo, the grey market is hinting at a listing gain of nearly 20%.\n\nThe Reliance-backed company has already declared the Jio Platforms IPO price band at \u20b9 1,065 to \u20b9 1,119 per equity share.\n\nThe company aims to sell out 27 crore company shares, which means the exat Jio platforms IPO size is \u20b9 3,02,13,00,00,000 or \u20b9 30,213 crore ( \u20b9 1,119 x 27,00,00,000). The upcoming IPO is completely fresh in nature, which means the entire net proceeds will go into the balance sheet of Jio Platforms.\n\n(This is a developing story. Please refresh for more details)\n\nAsit Manohar has nearly two decades of experience in the mainstream media. In this period, he has served esteemed media organisations like NDTV Profit, The Economic Times, and Zee Business. He has been working at LiveMint Digital since April 2021. During these two decades of journey in mainstream media, Asit has mainly covered external affairs, markets and personal finance. However, his earliest beats include railways, SME, MSME, and politics (Congress beat).", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:16 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Zetwerk IPO: one-of-a-kind manufacturing platform with a profitability problem", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nZetwerk, a manufacturing and procurement platform, is raising \u20b9 5,012 crore through its market debut. The initial public offering (IPO), priced \u20b9 143\u2013151 per share, will open for subscription on 15 October and close on 19 October. Comprising a fresh issue of \u20b9 2,830 crore with the balance being an offer for sale, the company is seeking a valuation of about \u20b9 25,500 crore.\n\nCustomer metrics offer some evidence to this effect. Revenue from repeat customers accounted for over 80% of manufacturing business revenue in FY26, against an average of 84% since FY22. Median net revenue retention between FY23 and FY26 stood at 129%, indicating that spending by retained customers generally expanded. But for this moat to sustain, Zetwerk must continue to deliver reliable execution.\n\nZetwerk takes accountability for delivery and quality by third-party manufacturers. So, manufacturers\u2019 execution issues can affect Zetwerk\u2019s profitability. While fixed-price supplier contracts, customer price-adjustment clauses, commodity hedging, diversified supplier base, and selective in-house manufacturing can manage execution risks to an extent, they cannot eliminate counterparty risk or cost overruns.\n\nIn May 2026, analytics firm Crisil revised its outlook on Zetwerk's long-term ratings to negative from stable, while reaffirming the rating at Crisil A-. The outlook revision reflects high debt amid risks from the group\u2019s muted operating profitability (2.65% Ebitda margin), working-capital-intensive operations, limited operating track record across segments, and exposure to operational and counterparty risks.\n\nRevenue from continuing operations rose from \u20b9 12,364 crore in FY24 to \u20b9 15,913 crore in FY26. The trajectory, however, has been uneven, with revenue declining by 8.4% in FY25 before rebounding by 40.4% in FY26. Adjusted Ebitda has improved from \u20b9 97 crore in FY24 to \u20b9 421 crore in FY26.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 11:14 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: China stocks slip as AI selloff deepens, mixed inflation data weighs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China stocks slip as AI selloff deepens, mixed inflation data weighs Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China stocks slip as AI selloff deepens, mixed inflation data weighs SECTIONS Global Market: China stocks slip as AI selloff deepens, mixed inflation data weighs By Anupam Nagar , ETMarkets.com Last Updated: Oct 14, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chinese stocks edged lower as AI-related shares weakened and mixed inflation data heightened concerns over domestic demand. The CSI300 declined, while energy and consumer staples stocks advanced amid rising oil prices. Technology shares remained under pressure, and HSBC cut year-end targets for major Chinese indexes, reflecting persistent market uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 11:11 AM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Can AST SpaceMobile stock rebound after sharp sell-off?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Can AST SpaceMobile stock rebound after sharp sell-off? Written by Anupam Nagar , ETMarkets.com | Oct 14, 2026, 11:15:59 AM IST 1 / 6 AST SpaceMobile Stock Slides AST SpaceMobile shares came under heavy selling pressure on October 13, falling about 8.5% by the close, according to MarketBeat. Earlier in the session, the decline reached 9.07%, taking shares to $46.80. The sell-off reflected mounting concerns over the satellite communications company's technical outlook and competitive position. (Sources KuCoin | MarketBeat)\n\nASTS fell to $46.80 during the October 13 session, compared with the previous close of $51.46. The stock opened at $48.40 and traded between $46.24 and $48.72, highlighting the pressure on the shares. TradingKey also reported a steep decline in AST SpaceMobile stock, underscoring the weakness across the session.\n\nASTS traded below its 20-day, 50-day and 200-day exponential moving averages, signalling a weak technical trend. The daily relative strength index stood at 31.76, close to the commonly watched oversold threshold of 30, while the MACD remained below its signal line. These indicators suggested persistent selling pressure, although they did not rule out a short-term rebound.\n\nCompetition from SpaceX in direct-to-device satellite connectivity has emerged as a key concern for AST SpaceMobile investors. Reports cited a Piper Sandler downgrade, citing competitive pressure and potential constraints on satellite launch availability. The concerns have raised questions about AST SpaceMobile's ability to maintain its competitive advantage as rival satellite networks expand.\n\nBeyond chart weakness, investors are weighing whether AST SpaceMobile's valuation adequately reflects its assets, growth prospects and capital requirements.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 11:08 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sensex, Nifty muted a day after sharp rally, IT stocks extend gains. What lies ahead for Dalal Street?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sensex, Nifty muted a day after sharp rally, IT stocks extend gains. What lies ahead for Dalal Street? Hindustan Unilever Share Price Marico Share Price Godrej Consumer Products Share Price Dabur India Share Price Colgate-Palmolive (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Sensex, Nifty muted a day after sharp rally, IT stocks extend gains. What lies ahead for Dalal Street? SECTIONS Sensex, Nifty muted a day after sharp rally, IT stocks extend gains. What lies ahead for Dalal Street? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 14, 2026, 11:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities traded nearly flat after a sharp rally in the previous session, with IT stocks extending gains while pharma shares declined. Analysts flagged elevated US bond yields and crude oil prices as headwinds, even as short-covering and hopes of tax relief supported sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 11:06 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "TCS, HCL Tech, Infosys shares surge up to 11% in 2 days; Nifty IT soars 2,000 points. More steam left for rally?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a TCS, HCL Tech, Infosys shares surge up to 11% in 2 days; Nifty IT soars 2,000 points. More steam left for rally? Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TCS, HCL Tech, Infosys shares surge up to 11% in 2 days; Nifty IT soars 2,000 points. More steam left for rally? SECTIONS TCS, HCL Tech, Infosys shares surge up to 11% in 2 days; Nifty IT soars 2,000 points. More steam left for rally? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 14, 2026, 11:03:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian IT stocks rallied as concerns over AI-driven disruption eased, triggering an \u201canti-AI\u201d trade. The Nifty IT index surged over 2,000 points in two sessions to cross 30,000, its first move above the mark in nearly a month. HCL Tech gained nearly 11% in two days following its Q2 results, while TCS and Infosys rose 6\u201310%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 11:03 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How to invest when your income doesn\u2019t arrive every month", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe first piece of advice almost every new investor receives is the same: start a systematic investment plan (SIP), pick a date and let it run. It is sound advice. But it also quietly assumes something many people do not have: a paycheque that arrives on the same day every month.\n\nFreelancers, consultants, traders and small business owners all deal with income that does not follow a fixed schedule. Some months are busy, others are lean, and a single large invoice can arrive a quarter late. For them, the standard monthly-SIP playbook is not just difficult to follow; it is built on a foundation they do not have.\n\nSo what should investing look like when income itself is irregular?\n\nThe mistake is to treat the SIP as the goal rather than a tool. For someone on a fixed salary, a missed SIP may be a lapse in discipline. For someone with uneven income, missing an SIP in a lean month is often unavoidable. The guilt of missing it is what can break the habit altogether.\n\nThe fix is to change the unit of planning. Instead of committing a fixed sum on a fixed date, decide how much you intend to invest over a full year and deploy it whenever money actually arrives. A strong month funds more; a weak month funds less or nothing, without any sense of failure.\n\nThe discipline shifts from \u201cinvest every month\u201d to \u201cinvest every rupee that is surplus, as it comes in\u201d. That is a target an irregular earner can realistically meet.\n\nThe harder problem with lumpy income is not how much to invest but where to put it each time a payment clears. Answering that question afresh every time invites second-guessing and, worse, the temptation to chase whatever has recently performed well.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 11:01 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Barclays plans India equity advisory return after a decade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Barclays plans India equity advisory return after a decade The Economic Times daily newspaper is available online now. Read Today's Paper Barclays plans India equity advisory return after a decade SECTIONS Barclays plans India equity advisory return after a decade By Saikat Das & Rajesh Mascarenhas , Bloomberg Last Updated: Oct 14, 2026, 11:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Barclays plans to restart its equity capital markets business in India after nearly a decade, targeting the country\u2019s booming IPO market. Strong fundraising demand, robust retail investment flows and startup growth offer opportunities. With hundreds of companies awaiting IPO approvals, the bank aims to expand its equity advisory and underwriting services.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC r 30. The move follows an insolvency petition admitted by NCLT over alleged dues of Rs 2.79 crore, which has since been stayed by NCLAT pending an October 26 hearing.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:51 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Judge extends block on Trump White House ban of MS NOW, CNN and Politico", "full_content": "A federal judge late Tuesday night indefinitely extended his block on the White House from enforcing a ban on three media outlets that President Donald Trump announced in mid-September.\n\nThe preliminary injunction by Judge Timothy Kelly replaces his temporary restraining order against Trump's ban of MS NOW , CNN and Politico from the White House complex as a lawsuit challenging the ban plays out.\n\n\"President Trump's own comments suggest that he intended the revocation of Plaintiffs' hard passes to alter their reporting on him,\" wrote Kelly, who was nominated by Trump for his seat in U.S. District Court in Washington.\n\nIn his written opinion, Kelly said the three outlets were likely to succeed on their claim in their pending lawsuit, which argues they were denied due process when Trump summarily barred them without giving them a chance to argue against it.\n\nThe judge cited two existing opinions by the U.S. Court of Appeals for the District of Columbia Circuit, which establish a due process right to journalists whose White House passes are targeted for revocation. Those appellate opinions are binding on federal District Court judges in D.C.\n\nThe judge also said, for the first time in this case, the outlets were likely to succeed on two First Amendment claims in their civil suit, which allege retaliation and viewpoint discrimination.\n\nKelly's order Tuesday is not a final ruling on the merits of the suit. And it does not compel the White House to restore access to the Oval Office and Air Force One to the outlets.\n\nKelly brushed aside the Department of Justice's claim that in addition to concerns about inaccurate news stories, Trump decided to revoke the outlets' access to the White House on national security grounds.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:49 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "SS Retail shares: Up 95% from IPO price, newly listed stock soars over 19% today on strong results: Check Q1 highlights", "full_content": "SS Retail Q1 Results : Newly listed SS Retail shares surged over 19% on Wednesday, October 14, after the recently listed mobile retailer reported strong financial performance for the quarter ended June 2026 (Q1FY27).\n\nThe company's performance was supported by healthy same-store sales, higher average selling prices of mobile phones and continued expansion of its retail network.\n\nThe earnings announcement comes shortly after its stock market debut during which the shares listed at a substantial premium to their issue price. The stock has now climbed nearly 95% above its IPO price of \u20b9 424, reflecting the strong gains since listing.\n\nSS Retail shares jumped 19.5% to \u20b9 828.30 on Wednesday, October 14, following the company's earnings announcement. The stock has gained 11% over the past week. SS Retail shares touched a 52-week high of \u20b9 888 on September 24, 2026, after hitting a low of \u20b9 603 on September 23, the listing day.\n\nThe stock made a strong debut on September 23, 2026, listing at \u20b9 639.10 on the BSE, a premium of 50.73% over its issue price. On the NSE, the shares listed at \u20b9 624, representing a premium of 47.17%.\n\nThe company reported that its profit after tax (PAT) increased 61% to \u20b9 23.8 crore. Meanwhile, its consolidated revenue came in at \u20b9 789.7 crore for Q1FY27, marking a 59% year-on-year (YoY) increase. Earnings before interest, tax, depreciation and amortisation (EBITDA) also rose 51% YoY to \u20b9 45.4 crore.\n\nGross margin improved by 53 basis points YoY to 12.8%. However, the EBITDA margin declined by 31 basis points to 5.8%, despite growth in revenue and operating profit.\n\nCommenting on the company's first results announcement since its listing, Siddharth Shah, founder, chairman and managing director of SS Retail, said, \u201cOur first results announcement since listing marks an exciting new chapter for SS Retail, with record-high revenue, EBITDA and PAT, growing 59%, 51% and 61% YoY, respectively.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 10:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PL Capital picks 8 largecap stocks with upside potential of up to 41%. See full list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News PL Capital picks 8 largecap stocks with upside potential of up to 41%. See full list Written by Veer Sharma , ETMarkets.com | Oct 14, 2026, 10:41:16 AM IST 1 / 9 Solid Bets Following an eight-week losing streak in the Nifty, its first such run since 2001, domestic brokerage PL Capital remains cautious on the near-term market outlook. The brokerage does not expect a V-shaped recovery and does not rule out a further decline before the market enters a consolidation phase. However, the brokerage has picked 8 stocks as its top picks in its latest strategy note.\n\nBharat Electronics currently trades at a current market price of Rs 368 with a target price of Rs 452, representing an implied upside of 22.7%. The brokerage projects revenue growth of 16.8% in 2027E, and 15.1% in 2028E.\n\nBharti Airtel is priced at a current market price of Rs 1,805 with a target price of Rs 2,367, offering a potential upside of 31.1%. Revenue growth is expected to reach 15.8% in 2027E and 11% in 2028E.\n\nBritannia Industries trades at a current market price of Rs 4,825 against a target price of Rs 6,579, indicating an estimated upside of 36.4%. Its forecasted revenue growth steps up from 6.7% in 2026 to 10.7% in 2027E and 11.4% in 2028E.\n\nGE Vernova T&D India holds a current market price of Rs 4,194 with a target price of Rs 5,928, unlocking the highest upside in the group at 41.3%. Projected revenue growth is at 32.8% in 2027E, and 30.4% in 2028E.\n\nWith a target price of Rs 1,850, the private lender is yielding a 36.5% potential upside. Revenue expansion accelerates sequentially from 7.6% in 2026 to 17.7% in 2027E and 19.9% in 2028E, the brokerage said.\n\nKotak Mahindra Bank has target price of Rs 500, implying a 13.4% upside potential.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HD Fire Protect IPO Booked 5.88x On Day 2; NII Demand Remains Strong", "full_content": "Fire protection equipment manufacturer HD Fire Protect Ltd. IPO opened on Tuesday, October 13 and will close on October 15. The company has fixed a price band of Rs 258-271 per share.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "A Jigsaw Puzzle: Why Reliance Jio's IPO buzz isn\u2019t saving RIL stock from a painful year?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a A Jigsaw Puzzle: Why Reliance Jio's IPO buzz isn\u2019t saving RIL stock from a painful year? Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper A Jigsaw Puzzle: Why Reliance Jio's IPO buzz isn\u2019t saving RIL stock from a painful year? SECTIONS A Jigsaw Puzzle: Why Reliance Jio's IPO buzz isn\u2019t saving RIL stock from a painful year? By Akash Podishetti , ETMarkets.com Last Updated: Oct 14, 2026, 10:33:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reliance Industries is gearing up for the highly anticipated Jio Platforms IPO, which is expected to generate significant capital. Despite this, recent declines in RIL shares reveal a cautious mood among investors about potential future gains. Analysts note that although the IPO could establish Jio's market valuation, immediate advantages for RIL shareholders remain unclear, given concerns about refining margins, capital needs, and core business performance affecting sen nts"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Diwali shopping 2026: CPI inflation crosses 5% in September, may hit 6.8% in November \u2014 what item-wise data reveals", "full_content": "With Diwali 2026 approaching, households tend to spend more on groceries, festive clothing, home decor, gifts and other seasonal purchases. How have prices of these items changed over the past year, and which expenses could put additional pressure on festive budgets?\n\nAccording to the latest data from the Ministry of Statistics and Programme Implementation (MoSPI), CPI retail inflation rose to 5.54% in September 2026, from 4.83% in August 2026.\n\nWhile prices in several household and festive-shopping categories have risen year on year, some items have recorded a decline in inflation or negative inflation . Here is what consumers should know before planning their 2026 Diwali shopping budget.\n\nThe Consumer Price Index (CPI) measures changes in the prices of goods and services that households regularly buy, including food, beverages, clothing, transport and household products.\n\nFor example, if a basket of goods cost \u20b9 1,000 in September 2025 and the same basket cost \u20b9 1,055.40 in September 2026, the prices would have increased by 5.54% over the year.\n\nHowever, overall CPI inflation does not mean every product has become more expensive at the same rate. The inflation rate for an individual category can be higher or lower than the headline figure.\n\nThe following table compares year-on-year inflation across selected categories relevant to festive shopping.\n\nSource: MoSPI. Note: YoY CPI inflation; selected Diwali shopping items. Consumer item descriptions may differ from official CPI category names.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 10:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'Don't worry': Piyush Goyal sends a message to the world on India-US ties", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 'Don't worry': Piyush Goyal sends a message to the world on India-US ties The Economic Times daily newspaper is available online now. Read Today's Paper 'Don't worry': Piyush Goyal sends a message to the world on India-US ties SECTIONS 'Don't worry': Piyush Goyal sends a message to the world on India-US ties ET Online Last Updated: Oct 14, 2026, 10:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis At the Bloomberg New Economy Forum, Union Commerce and Industry Minister Piyush Goyal shed light on the promising future of India and the US's partnership. He expressed his belief in the strong bond that is expected to grow, while addressing fears regarding its effects on other nations. Goyal confirmed that this alliance is stable and poses no threats, fostering a hopeful view for the future of their relations.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?", "source": "Economic Times Economy", "pub_date_str": "14 Oct 2026, 10:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: China\u2019s yuan firms as investors await US CPI data, assess inflation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China\u2019s yuan firms as investors await US CPI data, assess inflation Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China\u2019s yuan firms as investors await US CPI data, assess inflation SECTIONS Global Market: China\u2019s yuan firms as investors await US CPI data, assess inflation By Anupam Nagar , ETMarkets.com Last Updated: Oct 14, 2026, 10:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s yuan edged higher against the dollar as investors assessed mixed inflation data and awaited US consumer price figures. Rising producer prices contrasted with subdued consumer inflation amid weak domestic demand. Analysts expect gradual yuan appreciation through 2026, supported by trade surpluses and capital flows, while Federal Reserve policy remains a key driver.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Crypto bosses, CEOs and F1: Singapore's business events boom gathers pace", "full_content": "Billionaires, global CEOs and crypto executives descended on Singapore last week as a growing number of high-profile conferences coincided with the country's Formula 1 Grand Prix.\n\nMore than 40 business events were held around this year's Grand Prix period, up from over 25 in 2025 and over 30 in 2024, according to the Singapore Tourism Board. The events included the Milken Institute Asia Summit, TOKEN2049, the Forbes Global CEO Conference, Solana Summit APAC and the Global-Asia Family Office Summit.\n\nFormula 1 has generated more than 2.2 billion Singapore dollars ($1.72 billion) in incremental tourism receipts between its debut in 2008 and 2024, according to Singapore's Ministry of Energy, Trade and Industry , which equates to an average of S$150 million each. The race itself costs approximately S$140 million a year to organize, METI said, though noted it isn't directly comparable with the revenue generated.\n\nSingapore GP said the 2026 race drew 301,294 spectators, the second-highest attendance in the event's history.\n\nBusiness events themselves are becoming a larger source of tourism revenue. Receipts from meetings, incentives, conventions and exhibitions (MICE) rose 35% to S$2.3 billion in 2025, outpacing the 10% growth in Singapore's overall tourism receipts to a record S$32.8 billion, data from STB showed.\n\nSingapore's Tourism Board noted that MICE visitors typically spend significantly more than leisure travelers.\n\nOrganizers are increasingly capitalizing on the excitement surrounding Formula 1 to extend delegates' stays, according to Poh Chi Chuan, executive director of exhibitions and conferences at STB.\n\n\"This creates a natural gravitational pull, when the city is buzzing and the right target audience is already flying in, savvy planners build on that momentum,\" Poh said.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Live Updates: Sensex Volatile, Nifty 50 Slips In Red; Tata Elxsi Rallies 8% After Q2 Results", "full_content": "Stock Market Live Updates: Sectorally, Nifty IT extended rally, with over 1% gains, followed by Nifty Oil and Gas and Nifty FMCG. Losses were seen in Nifty Pharma, Nifty Metals, Nifty Auto and Nifty PSU Bank.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Q2 LIVE: Quarterly results today 2026 updates on Reliance Industrial Infra, MRPL, Tata Tech, BHEL, Groww, Canara Bank", "full_content": "Q2 quarterly results today LIVE updates: 26 listed companies are scheduled to announce their second-quarter results for the financial year 2026-27 on Wednesday, 14 October 2026, according to the BSE\u2019s forthcoming results calendar.\n\nThe list includes Bharat Heavy Electricals Ltd (BSE code: 500103), Canara Bank (532483), CEAT Ltd (500878), Elecon Engineering Company Ltd (505700), Aditya Birla Money Ltd (532974), and Mangalore Refinery and Petrochemicals Ltd (500109). Other companies slated to declare their results include Bajaj Consumer Care Ltd (533229), ICICI Lombard General Insurance Company Ltd (540716), Hathway Cable & Datacom Ltd (533162), Tata Technologies Ltd (544028), HDB Financial Services Ltd (544429), Billionbrains Garage Ventures Ltd, which operates under the Groww brand (544603), and Sona BLW Precision Forgings Ltd (544938). The list also features Aurique (517230), Bacil Pharma Ltd (524516), Emmvee Photovoltaic Power Ltd (544608), Indus Finance Ltd (531841), Naturo Indiabull Ltd (543579), Polycon International Ltd (531397), Rajratan Global Wire Ltd (530253), Reliance Industrial Infrastructure Ltd (523445), Schloss Bangalore Ltd (544408), Sulabh Engineers & Services Ltd (508969), TTL Enterprises Ltd (514236), Viji Finance Ltd (537820), and Ardi Alliances (504370).\n\nInvestors can track this space for updates on revenue, profitability, margins and management commentary, which could influence movements in the respective stocks. The schedule is based on the BSE forthcoming results calendar. Here are all the LIVE UPDATES:-\n\nReliance Industrial Infrastructure Ltd (RIIL) is trading at \u20b9 705.00 on the National Stock Exchange (NSE) as of 10:55 AM IST on October 14, 2026.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: IMF urges governments to cut spending, reduce debt as borrowing costs rise", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: IMF urges governments to cut spending, reduce debt as borrowing costs rise Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: IMF urges governments to cut spending, reduce debt as borrowing costs rise SECTIONS Global Market: IMF urges governments to cut spendin "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anand Rathi Share and Stock Brokers shares drop 6% after Q2 results. What\u2019s spooking investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Anand Rathi Share and Stock Brokers shares drop 6% after Q2 results. What\u2019s spooking investors? The Economic Times daily newspaper is available online now. Read Today's Paper Anand Rathi Share and Stock Brokers shares drop 6% after Q2 results. What\u2019s spooking investors? SECTIONS Anand Rathi Share and Stock Brokers shares drop 6% after Q2 results. What\u2019s spooking investors? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 14, 2026, 10:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anand Rathi Share and Stock Brokers shares fell 6% on Wednesday despite a 50% YoY jump in Q2FY27 net profit to Rs 41.94 crore. Investor sentiment was dented by margin compression as operating expenses rose 14% YoY, primarily driven by a 31% increase in employee benefit costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Transformers and Rectifiers share price jumps 14% after Q2 profit surges 135% | What should investors do next?", "full_content": "TARIL share price today: Transformers and Rectifiers (India) share price jumped 14% on Wednesday, 14 October, after the company reported a sharp rise in its September-quarter earnings, supported by strong revenue growth, improved operating margins and an exceptional gain.\n\nThe transformer manufacturer posted a 135% year-on-year (YoY) increase in consolidated net profit to \u20b9 79.8 crore in Q2FY27, compared with \u20b9 33.9 crore in the corresponding quarter of the previous financial year. The reported profit included an exceptional gain of \u20b9 131.5 crore.\n\nRevenue from operations rose 60.7% YoY to \u20b9 739.4 crore in the July\u2013September quarter, against \u20b9 460 crore a year earlier, reflecting strong business momentum.\n\nOperating performance also improved significantly. Earnings before interest, tax, depreciation and amortisation (EBITDA) more than doubled to \u20b9 128.8 crore from \u20b9 58.9 crore in the year-ago quarter. EBITDA margin expanded to 17.4% from 12.8%, indicating better operating efficiency.\n\nThe company reported an order inflow of \u20b9 1,169 crore in Q2FY27, registering 97% YoY growth. Its unexecuted order book stood at \u20b9 7,237 crore as of 30 September 2026, up 32% from a year earlier. The existing order book is expected to be executed over the next 18\u201324 months, providing revenue visibility.\n\nThe company also has an inquiry pipeline of approximately \u20b9 21,000 crore under negotiation. Its historical order win ratio remains between 10% and 15%. Around 80% of the current bidding pipeline comprises domestic opportunities, while the remaining 20% relates to export markets, with opportunities spread across government and private-sector customers in utility and industrial segments.\n\nDuring the quarter, Transformers and Rectifiers successfully completed dynamic short-circuit testing on three transformer units.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nuclear Weapons Race: Russia Leads US; How Many Warheads Do India, Pakistan And Israel Have?", "full_content": "Russia has an estimated 1,796 deployed nuclear warheads, the highest number in the world as of January 2026, SIPRI reported. The country continues to modernise its nuclear arsenal, although sanctions and the ongoing war in Ukraine have created challenges for some of its weapons programmes.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Hero Motors share price jumps 6.5% on strong Q2 results | Check share price performance, earnings details | Buy or sell?", "full_content": "Hero Motors share price jumped over 6.5% in Wednesday's trading session after the company reported a strong financial results for the September quarter on Tuesday.\n\nHero Motors shares opened at \u20b9 161 per share on NSE today, as compared to previous close of \u20b9 155.19 on Tuesday and touched an intraday high of \u20b9 167.39 on 14 October.\n\nThe stock has, which made its stock market debut on 23 September, has fallen 3.5% in a week, however, has gained 67.47% on year-to-date (YTD) basis.\n\nAuto components manufacturer Hero Motors, on Tuesday, reported a net profit of \u20b9 10.2 crore for the second quarter, more than doubling from \u20b9 4.73 crore in the same period last year. Revenue rose 24.9% year-on-year to \u20b9 319.3 crore, compared with \u20b9 255.7 crore in the year-ago quarter.\n\nThe company\u2019s earnings before interest, tax, depreciation and amortisation (EBITDA) jumped 92% year-on-year to \u20b9 35.9 crore from \u20b9 18.7 crore. Its EBITDA margin also improved to 11.3% in the quarter from 7.3% a year earlier.\n\nSeparately, Hero Motors has proposed acquiring an additional 39% stake in its subsidiary, Hewland Engineering Ltd (HEL), from existing shareholders William Hewland and Siobhan Hewland for approximately \u00a30.60 million in cash. The transaction covers 8,039 equity shares with a face value of \u00a31 each and will increase Hero Motors\u2019 stake in HEL from 51% to 90%. The acquisition is expected to be completed within around six months and does not require any governmental or regulatory approvals.\n\nHero Motors is an automotive technology company engaged in designing, developing, manufacturing and supplying powertrain solutions to automotive original equipment manufacturers across the US, Europe, India and the ASEAN region. Its product portfolio caters to two-wheelers, electric bicycles, off-road vehicles, electric and hybrid cars, and heavy-duty vehicles.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 09:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Durga's many arms: Why diversification is not dilution for investors this Navratri", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Durga's many arms: Why diversification is not dilution for investors this Navratri The Economic Times daily newspaper is available online now. Read Today's Paper Durga's many arms: Why diversification is not dilution for investors this Navratri SECTIONS Durga's many arms: Why diversification is not dilution for investors this Navratri By Suranjana Borthakur , ET CONTRIBUTORS Last Updated: Oct 14, 2026, 09:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Drawing inspiration from Goddess Durga\u2019s ten arms this Navratri, Suranjana Borthakur of Mirae Asset explains why diversification is not dilution for investors. A thoughtfully allocated portfolio spread across equities, debt, and market caps provides the resilience needed to ride out volatility, prevent emotional exits, and achieve compounding growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 09:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "'Godzilla El Ni\u00f1o' is wreaking havoc with Philippine central bank's inflation forecasts", "full_content": "BANGKOK \u2014 The Philippine central bank is planning for a \"Godzilla\" El Ni\u00f1o on top of a prolonged oil shock, as the Southeast Asian nation tries to rein in inflation from three-year highs.\n\nGovernor Eli Remolona said Bangko Sentral ng Pilipinas now sets policy using scenarios that factor in oil prices and the severity of the weather event. \"We have the regular, ordinary El Ni\u00f1o, which is bad, and then we have the Godzilla El Ni\u00f1o, which is really, really bad,\" he said Wednesday on a panel at the IMF and World Bank annual meetings in Bangkok.\n\nThe worst of El Ni\u00f1o's impact on prices is still to come, with the effects expected from November through February, he said, adding that maintaining price stability remains the central bank's priority.\n\n\"We're holding our breath,\" he said, \"but we have to be prepared for the worst.\"\n\nThe looming weather risk is adding fresh pressure on one of Southeast Asia's most vulnerable economies. Philippine inflation accelerated to 7.2% in September from 6.1% in August, with rice prices up 18%, according to the Philippine Statistics Authority.\n\nThe world's biggest rice importer is also exposed to food supply risk. Agriculture Secretary Francisco Tiu Laurel has warned that a fresh drought could squeeze domestic supply . Larger Philippine purchases could add demand to a global market already jolted by El Ni\u00f1o and export curbs. The UN Food and Agriculture Organization has raised its rice price index for six consecutive months to a 20-month high.\n\nThe central bank lifted its benchmark rate by 25 basis points to 5% in August to keep a lid on the runaway inflation.\n\nThe BSP should deliver another quarter-percentage hike next week to 5.25%, followed by another same-sized hike in December, according to Aris Dacanay, senior ASEAN economist at HSBC Bank, in a note Wednesday.", "source":
