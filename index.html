 the Supreme Court to temporarily block California from counting mail-in ballots of about 20,000 voters whom the Department of Justice suggests may not be U.S. citizens.\n\nThe DOJ's petition to the Supreme Court came three days after the 9th Circuit U.S. Court of Appeals rejected the department's bid to overturn a federal District Court judge's ruling that allowed the ballots to be counted.\n\nThe petition comes a day before Election Day. The Supreme Court could act on the petition at any time, but there is no deadline.\n\nThe midterm elections will determine which parties hold majorities in both chambers of Congress.\n\nThe DOJ sued California on Oct. 15 in U.S. District Court in Los Angeles. The complaint sought to prevent state election officials from tabulating mail-in ballots \"from likely non-citizens in the upcoming federal election until the voter's citizenship status can be determined.\"\n\nThe DOJ previously gave Los Angeles County officials a thumb drive containing names of voters the department suggested could be non-citizens, who by law are barred from voting in federal elections.\n\nLast Wednesday, Judge David Carter denied the DOJ's request that he order California officials to set aside mail ballots from alleged non-citizens named on a list prepared by the Department of Homeland Security, and not count their votes until their citizenship is confirmed.\n\n\"This case is about the right of every American citizen to vote in a free and fair election,\" Carter said in his ruling.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:43 PM IST", "pub_date_relative": "5m ago"}, {"title": "Centre's FY27 fiscal deficit may exceed Budget target by Rs 1.2 lakh crore: SBI Research", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Centre's FY27 fiscal deficit may exceed Budget target by Rs 1.2 lakh crore: SBI Research The Economic Times daily newspaper is available online now. Read Today's Paper Centre's FY27 fiscal deficit may exceed Budget target by Rs 1.2 lakh crore: SBI Research SECTIONS Centre's FY27 fiscal deficit may exceed Budget target by Rs 1.2 lakh crore: SBI Research PTI Last Updated: Nov 02, 2026, 10:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's central government anticipates a fiscal deficit exceeding budget estimates by Rs 1.2 lakh crore in 2026-27. This increase is primarily attributed to rising fertiliser, LPG, and petroleum subsidy expenses. Strong GST growth and disinvestment receipts may not offset the expected higher deficit. In addition, SBI Research recommends a revised long-term capital gains structure to generate additional revenue.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "02 Nov 2026, 10:39 PM IST", "pub_date_relative": "9m ago"}, {"title": "Inside Musk\u2019s plan to upend the wireless phone industry - The Washington Post", "full_content": "Inside Musk\u2019s plan to upend the wireless phone industry The Washington Post SpaceX weighs Boost Mobile deal in push for Starlink phone service: Report Yahoo Finance SpaceX in talks to buy Boost Mobile or use its network, Washington Post reports Reuters SpaceX Looks to Disrupt Telecom the Old-Fashioned Way. EchoStar Stock Jumps. Barron's SpaceX reportedly wants to buy Boost Mobile to compete with AT&T, T-Mobile, and Verizon TechCrunch", "source": "Google News Business", "pub_date_str": "02 Nov 2026, 10:38 PM IST", "pub_date_relative": "10m ago"}, {"title": "Major automakers urge US Congress to pass permanent ban on Chinese vehicles", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:36 PM IST", "pub_date_relative": "12m ago"}, {"title": "Life Cycle Funds explained: How these mutual funds work, change asset allocation with age and help plan for retirement", "full_content": "Life Cycle Funds are mutual fund schemes designed to adjust their asset allocation as investors move closer to a financial goal such as retirement. These funds start with a higher allocation to equity to pursue long-term capital appreciation and gradually shift towards relatively conservative investments such as debt as the target maturity date approaches.\n\nThe idea is to help investors manage the transition from wealth creation to capital preservation without having to rebalance their portfolios themselves. Vaibhav Shah , Head - Products, Business Strategy and International Business, Mirae Asset Mutual Fund, says these funds are designed for investors who have a clear financial goal and a defined investment horizon but prefer to leave asset allocation decisions to the fund manager.\n\nUnlike traditional mutual funds, where investors have to decide when to move money between equity and debt, Life Cycle Funds follow a pre-defined asset allocation strategy. The allocation changes gradually as the scheme approaches its maturity date.\n\nThe key feature of a Life Cycle Fund is its glide path, which determines how the asset allocation changes over the investment period. When the target date is far away, the fund maintains a higher exposure to equity. As the maturity date approaches, it gradually reduces equity exposure and increases allocation to relatively conservative assets such as debt and arbitrage.\n\n\" A Life Cycle Fund is built around a goal period. It follows a pre-defined asset allocation glide path. In the early years, when the goal is far away, the fund holds a high allocation to growth assets (equity) and as the maturity date comes closer, the allocation moves step by step towards conservative assets,\" says Shah.\n\nUnder the framework, investors can choose funds with maturities of five, 10, 15, 20, 25 and 30 years.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 10:35 PM IST", "pub_date_relative": "13m ago"}, {"title": "Belgium stocks higher at close of trade; BEL 20 up 0.61%", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:35 PM IST", "pub_date_relative": "14m ago"}, {"title": "Oppenheimer reiterates Lexeo Therapeutics stock rating on trial data", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:34 PM IST", "pub_date_relative": "14m ago"}, {"title": "CrowdStrike lands an upgrade, and Jim Cramer's advice on Apple ahead of earnings", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:34 PM IST", "pub_date_relative": "14m ago"}, {"title": "AT&T achieves first satellite-to-ground network handoff", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:34 PM IST", "pub_date_relative": "14m ago"}, {"title": "American Express expands NBA, WNBA global partnership", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:34 PM IST", "pub_date_relative": "14m ago"}, {"title": "L3Harris wins $121M Army radio system orders", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:34 PM IST", "pub_date_relative": "14m ago"}, {"title": "Earnings call transcript: Acadia Realty Trust posts Q3 2026 EPS miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:33 PM IST", "pub_date_relative": "15m ago"}, {"title": "Earnings call transcript: NAPCO Security misses Q1 2026 estimates as shares fall 17%", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:33 PM IST", "pub_date_relative": "15m ago"}, {"title": "Fed will vote on rates less often. What that could mean for borrowers", "full_content": "After the Federal Reserve held its benchmark interest rate steady last week, Fed Chairman Kevin Warsh announced plans to reduce the number of rate-setting votes over the next two years. That move could potentially extend the timeline for everyday Americans to see borrowing costs adjust, some experts say.\n\n\"Fewer Fed meetings in 2027 could mean consumers wait longer to see relief when borrowing costs are elevated,\" said James Vrachas, executive director at advisory firm Post Oak Group.\n\nAmericans may feel somewhat removed from the Fed, but the central bank's moves have a ripple effect on many types of consumer products, including the borrowing rates for credit cards , home loans and auto financing.\n\nFor example, most credit cards have variable rates tied to the prime rate, which moves with the Fed's benchmark. However, even with the central bank holding rates unchanged, credit card rates are edging higher as issuers protect themselves from risk, according to LendingTree.\n\nCard issuers are mitigating their exposure from borrowers who may fall behind on payments or default in the face of stubborn inflation in everyday expenses, said Matt Schulz, LendingTree's chief credit analyst.\n\nGenerally, card issuers are slow to bring rates down, unless prompted by the Fed's actions, said Schulz: \"Issuers will tinker with rates a bit at the margins at other times, but the big moves tend to only come when issuers are pushed.\"\n\nOn Oct. 28, the central bank voted to keep the benchmark borrowing rate at the current target range of 3.75% to 4% as policymakers deliberated next steps with inflation remaining well above the Fed's 2% goal.\n\nThe Fed will keep meeting eight times a year, Warsh said at the news conference following the October meeting, but next year, one of the eight meetings will not entail a vote on interest rates or include a post-meeting statement.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:33 PM IST", "pub_date_relative": "15m ago"}, {"title": "This cybersecurity stock just had a huge pullback. How to buy the dip like a pro", "full_content": "A sharp post-earnings sell-off in Fortinet could create an attractive swing-trading opportunity, with key support levels offering a defined entry point and potential upside of 15% to 20%.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:32 PM IST", "pub_date_relative": "16m ago"}, {"title": "Sweden stocks higher at close of trade; OMX Stockholm 30 up 0.48%", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:30 PM IST", "pub_date_relative": "18m ago"}, {"title": "\u2018It seems bizarre\u2019: We\u2019re in our 80s with $950,000 in traditional IRAs. Why is our adviser pushing us to do Roth conversions?", "full_content": "\u201cOur basic living expenses are covered by $110,000 in annual pensions and Social Security.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 10:30 PM IST", "pub_date_relative": "19m ago"}, {"title": "Lumentum CEO touts 'enormous' opportunity in massive AI connectivity deal with Marvell", "full_content": "Marvell Technology 's deal for optical components maker Lumentum will create an \"enormous\" opportunity to address growing connectivity demands from the artificial intelligence infrastructure buildout, Lumentum CEO Michael Hurlston told CNBC on Monday.\n\n\"You need scale-up technology that needs semiconductors and optical working seamlessly together,\" he told CNBC's \"Squawk on the Street.\" \"We are going to create a new category of company here.\"\n\nSince the tie-up is a fixed-ratio deal with no cash, the value will depend on the price of Marvell shares. The company said the transaction has an implied enterprise value of $115 billion for Lumentum, in a release.\n\nMarvell shares slumped 8% in trading Monday, while Lumentum's stock sank 13%.\n\nThrough the acquisition, Marvell said it can combine electrical and optical technologies to meet accelerating and shifting AI connectivity demands across regions and systems. Companies are increasingly relying on optical connections to piece together chips used to run and train large language models.\n\n\"We're actually going to create solutions around those that are highly sticky, and the reason that they're sold out is because the demand is exploding, and we don't see that changing anytime soon,\" Marvell CEO Matt Murphy said.\n\nLumentum shareholders will receive 4.5 Marvell shares for each Lumentum share under the agreement. The deal is expected to close during the first half of 2028.\n\nMarvell's takeover marks one of the most significant bets on AI in 2026 and comes despite recent concerns over the long-term sustainability of infrastructure spending.", "source": "CNBC World Economy", "pub_date_str": "02 Nov 2026, 10:29 PM IST", "pub_date_relative": "19m ago"}, {"title": "Apple earnings live updates: New CEO John Ternus faces first Wall Street test", "full_content": "Apple reports fiscal fourth-quarter earnings after the bell on Monday, with new CEO John Ternus expected to address Wall Street in a meaningful way for the first time.\n\nRevenue is expected to increase 11% from $102.5 billion a year earlier. Analysts project $56.59 billion in iPhone sales for the quarter.\n\nWall Street is closely watching iPhone revenue because the report will include eight days of new iPhone 18 Pro sales. But Apple's new flagship device, the iPhone Duo, didn't hit store shelves until the quarter was over, and Apple didn't announce a new entry-level iPhone 18.\n\nApple also raised prices on iPhones by $100, which may have hurt demand in the quarter.\n\nMonday's earnings call, set to start at 5 p.m. ET, will be the first with Ternus at the helm. Investors want to hear from him about the company's plans in China after its AI software got approved, as well as the slew of recent product launches and how the company continues to grapple with global shortages of memory and flash storage.\n\nApple is competing in a smartphone and PC market that has \"never been worse,\" IDC's Ryan Reith told CNBC.\n\nConsumer electronics companies everywhere are grappling with surging prices for computer parts, including memory and flash storage that's used in every smartphone and laptop.\n\nIntel on Friday had its worst day on the stock market since the 1970s, dropping 29%, after the company cited PC softness for a disappointing forecast .", "source": "CNBC World Economy", "pub_date_str": "02 Nov 2026, 10:27 PM IST", "pub_date_relative": "21m ago"}, {"title": "6 dividend stocks for investors who want to cut their exposure to the S&P 500", "full_content": "Novartis, Mitsubishi and Canadian Natural are examples of companies in developed markets outside the U.S. that pass screens for high dividend yields and low volatility for prices and earnings.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 10:26 PM IST", "pub_date_relative": "23m ago"}, {"title": "Alstom shares tumble 26% after train maker cuts profit forecast", "full_content": "French group also sets out plan to cut \u20ac2bn in debt in second major profit warning under new chief Martin Sion", "source": "FT Markets", "pub_date_str": "02 Nov 2026, 10:25 PM IST", "pub_date_relative": "23m ago"}, {"title": "Stocks jump as oil prices tumble before midterms, tech shares rebound: Live updates", "full_content": "Stocks moved higher on Monday as oil prices fell sharply and some tech names rebounded, while investors braced for a packed week of earnings results and the upcoming midterm elections.\n\nThe S&P 500 traded 0.6% higher, while the Nasdaq Composite gained 0.7%. The Dow Jones Industrial Average added 568 points, or 1.1%.\n\nBrent crude tumbled more than 7% to around $104 per barrel. U.S. West Texas Intermediate futures also pulled back more than 7% to roughly $96.\n\nOil prices extended earlier gains amid hopes that the U.S. and Iran may resume peace talks, with Secretary of State Marco Rubio saying over the weekend that President Donald Trump \"hasn't made a decision\" to attack Iran and that Washington would prefer to resolve the conflict \"peacefully.\" Iranian state media also reported that the country's foreign minister said an agreement with is possible if the U.S. \"demonstrates goodwill.\"\n\nSentiment also improved around tech a bit after the announcement that Marvell Technology is buying Lumentum in a $115 billion deal , as the latest corporate bet signified continued bullishness in artificial intelligence. Nvidia climbed 1%, while Amazon gained more than 4%. Alphabet rose 1%.\n\nEnthusiasm was kept in check, however, after Oracle said it plans to sell $10 billion in common stock as well as $10 billion in bonds to finance its AI buildout. Shares were down more than 5% during the session.\n\nInvestors moved into key cyclical sectors, while defensive areas such as healthcare and utilities came under some pressure. Consumer discretionary stocks led the way, with the group gaining nearly 4%, while financials and industrials popped almost 2%. Materials advanced more than 2%.\n\nThe moves come after the major U.S. stock benchmarks suffered a losing week, bogged down by selling pressure in tech as investors continued to scrutinize names related to the AI buildout.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:25 PM IST", "pub_date_relative": "23m ago"}, {"title": "Why only one group of Americans is increasingly likely to have a third child - The Washington Post", "full_content": "Why only one group of Americans is increasingly likely to have a third child The Washington Post", "source": "Google News Business", "pub_date_str": "02 Nov 2026, 10:25 PM IST", "pub_date_relative": "23m ago"}, {"title": "These tech stocks got unfairly swept up in last week\u2019s selloff, analysts say", "full_content": "One analyst notes \u201ca meaningful gap between price and fundamentals\u201d in some corners of the chip sector.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 10:20 PM IST", "pub_date_relative": "29m ago"}, {"title": "Stock market after midterm elections: What S&P 500 history shows", "full_content": "Markets are sweating it out ahead of the midterm elections, but the event historically heralds strong performance for stocks \u2014 regardless of whether it's a red or blue wave, split decision, or status quo in Washington.\n\nThe S&P 500 tends to perform well after both midterm and presidential elections. According to a CNBC analysis of S&P 500 returns after elections from 1980 through 2024, the index rose an average of 0.2% after one day and one week, and 1.1% after one month across both presidential and midterm elections.\n\nA year later, the index gained an average of 13.7% after midterms and 13.8% after presidential elections. Returns were positive in 91% of cases. And the S&P 500 was up after all 11 midterms from 1982 through 2022.\n\nShort-term returns were less reliable, particularly after presidential contests, which produced slightly negative average returns after one day and one week.\n\n\"There's some anxiousness before these elections,\" Ryan Detrick, CNBC contributor and chief market strategist at Carson Group, told CNBC. \"Once you are through it, it's a big relief and markets tend to do pretty well.\"\n\nStill, the market usually prefers divided government: one party in charge of the White House and the other holding at least one house of Congress.\n\nAcross 10 midterm and five presidential elections that left no single party in charge, the S&P 500 rose an average 15% after one year. One-year returns were positive in 14 out of 15 cases. By comparison, the index gained an average of 11.5% over the year after elections that resulted in single-party control.\n\n\"If you have a huge red wave or a big blue wave, markets actually kind of don't like that as much because you have too much spending one way and too much power,\" Detrick said.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:18 PM IST", "pub_date_relative": "30m ago"}, {"title": "Oil tumbles on hopes for US-Iran talks", "full_content": "Prices extend decline after Iran\u2019s president said the country\u2019s supreme leader had given officials certain authority over talks", "source": "FT Markets", "pub_date_str": "02 Nov 2026, 10:18 PM IST", "pub_date_relative": "30m ago"}, {"title": "Why you should forget the old rules for emergency funds - The Washington Post", "full_content": "Why you should forget the old rules for emergency funds The Washington Post Just 46% of Americans Have Three Months of Emergency Savings. For a Retiree, Three Months Is the Wrong Number Yahoo Finance", "source": "Google News Business", "pub_date_str": "02 Nov 2026, 10:13 PM IST", "pub_date_relative": "35m ago"}, {"title": "Judge tosses DOJ case against ex-FBI officials accused of lying about Hunter Biden probe: Reports", "full_content": "A federal judge on Monday blasted the Department of Justice for \"weaponization\" as he dismissed its case accusing two former FBI officials of lying to Congress about investigations into Hunter Biden, multiple news outlets reported.\n\nMagistrate Judge Zia Faruqui, in a hearing in U.S. District Court in Washington, reportedly tore into the DOJ over its \"slapdash job\" prosecuting ex-officials Nikki Floris and Bradley Benavides, saying he was \"deeply troubled by what has happened here.\"\n\nFaruqui said the government lacked probable cause and failed to present evidence that the officials' statements before the House Judiciary Committee in 2023 were knowingly false, MS NOW reported.\n\nHe also accused the DOJ of wrongly rushing the case ahead of the midterm election . The situation \"cannot be described as anything other than weaponization,\" he said, according to MS NOW.\n\nThe judge even apologized to the government's lawyers, calling it \"incredibly unfair\" that they were assigned to defend the flawed case.\n\n\"This does not feel like an investigation,\" Faruqui reportedly added. \"It feels like a broken one-wish willow obsession.\"\n\nThe DOJ did not immediately respond to CNBC's request for comment.\n\nAttorneys for Floris and Benavides praised the judge's decision outside the courthouse later Monday morning.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:12 PM IST", "pub_date_relative": "36m ago"}, {"title": "NALCO Q2 Results: Rs 4.5 Dividend Declared, But Profit Slip, 660-Bps Margin Shrink May Alarm Investors", "full_content": "NALCO's Q2 consolidated net profit fell 8.4% sequentially, while EBITDA dropped 11% and margins contracted 660 basis points. The company announced an interim dividend of Rs 4.5 per share.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 10:10 PM IST", "pub_date_relative": "38m ago"}, {"title": "Buy, Sell Or Hold: Mazagon Dock, Kaynes Technology, Mahindra And Mahindra, Dixon Tech | Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 10:10 PM IST", "pub_date_relative": "38m ago"}, {"title": "Gold, silver prices rebound from multi-month lows as crude oil retreats; what is driving the recovery?", "full_content": "A Ksheerasagar Published 2 Nov 2026, 10:08 PM IST Prefer Livemint on Google Gold and silver prices recovered in Monday\u2019s trade after hitting multi-month lows, as easing inflationary pressures amid a sharp retreat in crude oil prices supported sentiment. A drop in the US dollar also lent support to the rebound in precious metals.\n\nThe December gold futures contract on the MCX gained \u20b9 2,039 per 10 grams to touch the day\u2019s high of \u20b9 1,40,524. In the previous session, the yellow metal had fallen to its lowest level since March.\n\nSilver prices also attempted a recovery, with the futures contract rising \u20b9 5,543 per kg to \u20b9 1,84,675.\n\nThe rebound came after silver logged back-to-back monthly losses, with October marking its steepest monthly decline, at 20%, or \u20b9 44,574 per kg and during the period, it touched the lowest level in 10 months.\n\nCrude oil prices extended the decline on Monday, with Brent crude futures dropping 7% to below $105 a barrel, as hopes for a diplomatic resolution to the US-Iran conflict eased concerns over further supply disruptions.\n\nIran reportedly said on Monday that it had a two-day plan to reopen the Strait of Hormuz and resume nuclear talks with the United States. This came shortly after the country's Supreme Leader approved the government's pursuit of talks aimed at ending the months-long conflict, which has disrupted energy supplies in the Middle East, according to Iran's state-run IRNA news agency.\n\nEarlier, US President Donald Trump had also indicated that he wanted to give diplomacy more time before considering renewed military action. He reportedly told Israeli Prime Minister Benjamin Netanyahu that he preferred negotiations.\n\nIran had previously said the plan could be implemented within a week if the US met seven conditions, including lifting its blockade of Iranian ports. Tehran has now said that ships passing through the reopened strait would have to follow a route agreed upon by Iran and Oman and travel under Iranian supervision.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 10:08 PM IST", "pub_date_relative": "40m ago"}, {"title": "Sitharaman 'recognises the voice' of investors: Will FM slash equity taxes in next Budget amid heavy FPI outflows?", "full_content": "Union Finance Minister Nirmala Sitharaman on Monday acknowledged concerns raised by foreign portfolio investors (FPIs) and equity market participants about India's investment environment, saying the government is aware of changing global circumstances and will consider their feedback to sustain economic growth above 7%.\n\nSitharaman said attracting foreign investment required more than just changes in taxation. She pointed out that India's tax structure was broadly similar in 2023-24, when the country witnessed substantial foreign capital inflows.\n\n\"Nothing differently was done for drawing investments. But of course, the situation is very different now. Circumstances have changed. Challenges have grown,\" she said.\n\nThe Finance Minister emphasised that India needed adequate capital, particularly equity investments, to maintain its growth momentum. She also indicated that the government was open to engaging with market participants to understand their concerns and address challenges affecting investment flows.\n\n\"I wouldn't want to say more at this stage, but I recognise the voice,\" she said, referring to investor concerns.\n\nSitharaman said the government had focused on deepening and widening the country's bond market over the past few years. However, concerns were now emerging over the need to provide greater support to equity markets to attract investments.\n\nShe acknowledged the importance of foreign capital in financing India's growth ambitions and said the government would take feedback from investors into consideration while assessing the changing global investment environment.\n\nOn domestic economic conditions, the Finance Minister expressed confidence that India's consumption growth would remain strong.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 10:05 PM IST", "pub_date_relative": "43m ago"}, {"title": "Three energy stocks on Josh Brown's list are outperforming as M&A activity ramps up", "full_content": "Josh Brown and Sean Russo break down these three energy names on their Best Stocks list.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:02 PM IST", "pub_date_relative": "46m ago"}, {"title": "Market Trading Guide: Tata Steel among 5 stocks to buy on Tuesday for healthy returns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market Trading Guide: Tata Steel among 5 stocks to buy on Tuesday for healthy returns Tata Communications Share Price Jio Platforms Share Price Bharti Airtel Share Price Vodafone Idea Share Price Bharti Hexacom Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market Trading Guide: Tata Steel among 5 stocks to buy on Tuesday for healthy returns SECTIONS Market Trading Guide: Tata Steel among 5 stocks to buy on Tuesday for healthy returns By Akash Podishetti , ETMarkets.com Last Updated: Nov 02, 2026, 09:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities experienced a strong start to the week, bolstered by better than expected Q2 earnings. Improved domestic macro indicators contributed to the positive sentiment among investors and traders. Increased passenger vehicle sales and gross GST collections reflected resilience in domestic economic activity. Several stock recommendations were highlighted for Tuesday, suggesting potential upward movements. Analysts shared technical insights indicating opportunities for buying various stocks in the current market.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 09:57 PM IST", "pub_date_relative": "51m ago"}, {"title": "Trade Setup For Nov 3: Nifty Bulls Eye 23,600 Breakout As Oil Reprieve Supports Case For Sustained Rebound", "full_content": "Gift Nifty was trading 0.76% higher at 23,579.50, indicating a positive start for domestic equities.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:57 PM IST", "pub_date_relative": "51m ago"}, {"title": "Supermarket Freezers Set To 50\u00b0C In Cyber-Attack Across Europe, Millions In Food Losses Feared", "full_content": "The incident has drawn attention to the cybersecurity risks associated with internet-connected refrigeration infrastructure.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:56 PM IST", "pub_date_relative": "52m ago"}, {"title": "Behind Anthropic\u2019s 1,127% revenue surge \u2014 and the computing bill that erased its profit", "full_content": "Anthropic just filed updated financial paperwork ahead of an IPO that could come by the end of this month.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 09:52 PM IST", "pub_date_relative": "57m ago"}, {"title": "Mapping AI Profits: How One Global Bank Turned Automation Into A $216 Million Bottom-Line Win", "full_content": "Santander reported 194 million euros ($216 million) in business value from AI initiatives during the first nine months of 2026. Meta, Google and other global companies are also reporting financial benefits from AI adoption.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic reports $17 billion in Q3 revenue, purchase commitments of $895.4 billion in revised S-1", "full_content": "Anthropic reported updated financials as part of an amended Form S-1 filing with the Securities and Exchange Commission on Monday, giving investors a more comprehensive look into the state of its business.\n\nThe artificial intelligence company said it generated $33.24 billion in revenue for the nine months ended Sept. 30, up roughly 1,200% from the same period last year. It reported a $104 billion net loss during the period, though most of that was due to the change in fair value of convertible notes and derivative liabilities. Anthropic lost $25.1 billion over the same stretch in 2025.\n\nAnthropic unveiled its highly anticipated prospectus last week, bringing the company one step closer to a potentially historic IPO . The initial filing only included the Claude-maker's financials through the first half of the year.\n\nDuring its third quarter, Anthropic generated roughly $17 billion in revenue, up about 1,127% from the same period last year. Revenue growth slowed on a quarter-to-quarter basis, however. Third-quarter revenue increased around 47%, a steep drop from 144% growth in Q2 and 132% in Q1.\n\nThe company reported a net loss of $23.29 billion during its third quarter.\n\nAs the five-year-old company prepares to kick off its road show, it will have to reckon with growing market jitters around the AI buildout. Wall Street has been worried that rising interest rates will make debt unaffordable for many data center developers and neoclouds , and quarterly reports from Microsoft , Google and Amazon last week added fuel to those concerns.\n\nThe hyperscalers' aggressive AI spending is eating into their cash flows , causing some investors to worry that compute capacity may not come online quickly enough to meet Anthropic's demands.", "source": "CNBC World Economy", "pub_date_str": "02 Nov 2026, 09:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cyclone Murasu Live Tracker: Severe Cyclonic Storm To Cross Andhra Coast Tonight, Check Rain Forecast", "full_content": "Severe cyclonic storm Murasu expected to hit Andhra Pradesh coast between Nellore and Narasapur on November 2 night with winds up to 110 kmph.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 Results Live: NALCO Profit Dips 8%, Announces Dividend; ITC Profit Falls 20%, Margins Contract", "full_content": "A packed earnings day sees companies across FMCG, agri-inputs, logistics, metals, hospitality, healthcare and consumer sectors unveil their September quarter scorecards.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Grand Theft Callout: \u2018GTA 6\u2019 fans are missing work on the game\u2019s release day because they \u2018don\u2019t want to wait\u2019 anymore", "full_content": "After waiting 13 years for this videogame, almost one-fifth of workers plan to take the day off to play \u2018Grand Theft Auto VI\u2019 when it drops on Nov. 19", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 09:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "When you turn this age, it\u2019s your best chance to get crucial tax and healthcare plans in place for retirement", "full_content": "Ages 60 through 63 involve key healthcare, financial and tax decisions.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 09:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Income Tax Returns: 'How India filed in 2026' - 5 trends that reveal how young investors, salaried earners manage money", "full_content": "India's income tax returns are increasingly reflecting a financial life that goes beyond monthly salaries. From young investors reporting stock market losses to salaried taxpayers earning through freelancing and retirees continuing to invest, the latest filing data points to changing money habits across age groups.\n\nAccording to ClearTax's annual report, How India Filed in 2026, 47.3% of self-filers reported income from at least one source outside their jobs in assessment year (AY) 2026-27. This compares with just 9.5% in AY 2022-23. The share of taxpayers reporting income from two or more non-salary sources also increased from 3.5% to 24.4% during this period.\n\nThe report, based on ClearTax's filing data, highlights five trends that offer a glimpse into how Indians are earning, investing and managing their money.\n\nA growing number of taxpayers are earning money beyond their regular jobs. In AY 2026-27, 47.3% of self-filers reported income from at least one non-salary source, including investments, business, freelancing or cryptocurrency.\n\nThe proportion has increased steadily from 9.5% in AY 2022-23 and 17.3% in AY 2023-24. More significantly, 24.4% of self-filers reported income from two or more such sources in AY 2026-27, compared with 3.5% four years earlier.\n\nThe trend suggests that multiple income streams are becoming increasingly visible in taxpayers' financial lives. For salaried individuals, earnings from investments, freelance assignments and independent business activities are adding to their regular paychecks.\n\nYoung taxpayers are increasingly reporting income and financial activity beyond their salaries. Among self-filers below 25, 75% filed complex returns (ITR-2, ITR-3 or ITR-4) in AY 2026-27, compared with 60% in the previous assessment year.\n\nThe shift was particularly visible in ITR-3 filings, which increased from 28% to 44% among this age group. Meanwhile, the share filing ITR-1 declined from 41% to 25%.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 09:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Big Tech Bounces, But AI Infrastructure Stocks Keep Sinking; Oracle Down 5%", "full_content": "Gains in Amazon, Alphabet and Nvidia lift Wall Street, but mounting concerns over AI infrastructure spending keep Oracle, CoreWeave and other sector stocks under pressure.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Marvell's $115-Billion Lumentum Deal Has Lost Nearly A Third Of Its Value On Paper", "full_content": "Marvell's falling share price has sharply eroded the implied value of its all-stock Lumentum offer, leaving shareholders with a significantly smaller payout than initially promised.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fanatics takes bigger NHL design role with all-32 team Hometown Remix jerseys", "full_content": "In most professional sports arenas, rinks and stadiums across the globe, the gear that fans are now wearing to games is made and designed by sports merchandise giant Fanatics. But that isn't always the case for the jersey that the players are wearing on the field, ice or court.\n\nOn Monday, Fanatics and the NHL debuted the Hometown Remix program, a collection of uniforms and apparel for all 32 NHL teams. The new designs and look of each jersey is focused on each team's city and fan base. It marks the first time that Fanatics has designed and developed a league-wide jersey program for one of its leagues partners, which include the NFL, NBA, and MLB.\n\nFor some leagues, such as the NFL, while Fanatics may manufacture jerseys that fans buy in stores, other consumer-focused products and even what coaches wear on the sidelines, what players wear on the field may be manufactured and designed by a different company. In the case of the NFL, that is Nike. In MLB, while Fanatics manufactures player jerseys, Nike designs them.\n\nFanatics has been a partner of the NHL since 2005, mainly focused on retail and e-commerce. But in 2023, as the league's jersey deal with Adidas lapsed, Fanatics expanded its partnership to include on-ice uniforms and authentic jerseys.\n\nWhen that deal began alongside the 2024-25 season, it marked the first time that Fanatics branding appeared directly on an official player jersey in a professional game, a massive evolution for the company.\n\nThe new collection takes that a \"giant step forward in our partnership with the NHL,\" according to Andrew Low Ah Kee, CEO of Fanatics Commerce, the company's merchandise business arm.\n\n\"What's exciting to me about it is that not only is it all 32 teams, it's actually that Fanatics is singularly responsible and accountable for the design and execution of the program in partnership with the [NHL] and the clubs,\" Low Ah Kee said.", "source": "CNBC World Economy", "pub_date_str": "02 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Booming U.S. manufacturers can\u2019t keep up with demand \u2014 and high inflation isn\u2019t helping", "full_content": "U.S. manufacturers in October pumped out the most goods \u2014 plastics, computers, electrical equipment and so forth \u2014 in five years as a growing economy and a revolution in artificial intelligence stoked demand.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 09:29 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Crude oil prices plunge more than 7% on Iran peace talk hopes ahead of U.S. midterms", "full_content": "Crude oil prices fell sharply Monday as senior U.S. and Iranian officials signal they are open to a diplomatic solution to the conflict that has disrupted energy markets for eight months.\n\nBrent crude futures, the international benchmark, fell 7.7% to $104.66 a barrel as of 12:11 p.m. ET. U.S. West Texas Intermediate declined 7.3% to $96.50 per barrel.\n\nU.S. Secretary of State Marco Rubio said President Donald Trump prefers not to use military force against Iran and would like to resolve the conflict diplomatically.\n\nTrump has previously said that he will not attack Iran before the U.S. midterms. But the oil market had priced in the risk of a major military escalation after the elections.\n\nBrent The president \"hasn't made a decision,\" Rubio told reporters over the weekend.\n\n\"What the president expresses to you is incredible confidence that if we needed to do something militarily, we would have the ability to do it,\" the secretary of State said. \"But we would prefer to do it peacefully.\"\n\nIran's President Masoud Pezeshkian said Tehran is seeking to resolve problems through dialogue, according to state-owned Islamic Republic News Agency . Iran's Supreme Leader Ayatollah Mojtaba Khamenei has granted the government certain authorities to do this, Pezeshkian said.\n\nIran's foreign minister, Abbas Araghchi, said an agreement with the U.S. is possible if Washington \"demonstrates goodwill\" and is \"truly seeking a peaceful solution,\" according to IRNA.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:44 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Centre's FY27 fiscal deficit may exceed Budget target by Rs 1.2 lakh crore: SBI Research", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Centre's FY27 fiscal deficit may exceed Budget target by Rs 1.2 lakh crore: SBI Research The Economic Times daily newspaper is available online now. Read Today's Paper Centre's FY27 fiscal deficit may exceed Budget target by Rs 1.2 lakh crore: SBI Research SECTIONS Centre's FY27 fiscal deficit may exceed Budget target by Rs 1.2 lakh crore: SBI Research PTI Last Updated: Nov 02, 2026, 10:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's central government anticipates a fiscal deficit exceeding budget estimates by Rs 1.2 lakh crore in 2026-27. This increase is primarily attributed to rising fertiliser, LPG, and petroleum subsidy expenses. Strong GST growth and disinvestment receipts may not offset the expected higher deficit. In addition, SBI Research recommends a revised long-term capital gains structure to generate additional revenue.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "02 Nov 2026, 10:39 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Major automakers urge US Congress to pass permanent ban on Chinese vehicles", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:36 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Life Cycle Funds explained: How these mutual funds work, change asset allocation with age and help plan for retirement", "full_content": "Life Cycle Funds are mutual fund schemes designed to adjust their asset allocation as investors move closer to a financial goal such as retirement. These funds start with a higher allocation to equity to pursue long-term capital appreciation and gradually shift towards relatively conservative investments such as debt as the target maturity date approaches.\n\nThe idea is to help investors manage the transition from wealth creation to capital preservation without having to rebalance their portfolios themselves. Vaibhav Shah , Head - Products, Business Strategy and International Business, Mirae Asset Mutual Fund, says these funds are designed for investors who have a clear financial goal and a defined investment horizon but prefer to leave asset allocation decisions to the fund manager.\n\nUnlike traditional mutual funds, where investors have to decide when to move money between equity and debt, Life Cycle Funds follow a pre-defined asset allocation strategy. The allocation changes gradually as the scheme approaches its maturity date.\n\nThe key feature of a Life Cycle Fund is its glide path, which determines how the asset allocation changes over the investment period. When the target date is far away, the fund maintains a higher exposure to equity. As the maturity date approaches, it gradually reduces equity exposure and increases allocation to relatively conservative assets such as debt and arbitrage.\n\n\" A Life Cycle Fund is built around a goal period. It follows a pre-defined asset allocation glide path. In the early years, when the goal is far away, the fund holds a high allocation to growth assets (equity) and as the maturity date comes closer, the allocation moves step by step towards conservative assets,\" says Shah.\n\nUnder the framework, investors can choose funds with maturities of five, 10, 15, 20, 25 and 30 years.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 10:35 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "CrowdStrike lands an upgrade, and Jim Cramer's advice on Apple ahead of earnings", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:34 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Acadia Realty Trust posts Q3 2026 EPS miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:33 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: NAPCO Security misses Q1 2026 estimates as shares fall 17%", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Nov 2026, 10:33 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed will vote on rates less often. What that could mean for borrowers", "full_content": "After the Federal Reserve held its benchmark interest rate steady last week, Fed Chairman Kevin Warsh announced plans to reduce the number of rate-setting votes over the next two years. That move could potentially extend the timeline for everyday Americans to see borrowing costs adjust, some experts say.\n\n\"Fewer Fed meetings in 2027 could mean consumers wait longer to see relief when borrowing costs are elevated,\" said James Vrachas, executive director at advisory firm Post Oak Group.\n\nAmericans may feel somewhat removed from the Fed, but the central bank's moves have a ripple effect on many types of consumer products, including the borrowing rates for credit cards , home loans and auto financing.\n\nFor example, most credit cards have variable rates tied to the prime rate, which moves with the Fed's benchmark. However, even with the central bank holding rates unchanged, credit card rates are edging higher as issuers protect themselves from risk, according to LendingTree.\n\nCard issuers are mitigating their exposure from borrowers who may fall behind on payments or default in the face of stubborn inflation in everyday expenses, said Matt Schulz, LendingTree's chief credit analyst.\n\nGenerally, card issuers are slow to bring rates down, unless prompted by the Fed's actions, said Schulz: \"Issuers will tinker with rates a bit at the margins at other times, but the big moves tend to only come when issuers are pushed.\"\n\nOn Oct. 28, the central bank voted to keep the benchmark borrowing rate at the current target range of 3.75% to 4% as policymakers deliberated next steps with inflation remaining well above the Fed's 2% goal.\n\nThe Fed will keep meeting eight times a year, Warsh said at the news conference following the October meeting, but next year, one of the eight meetings will not entail a vote on interest rates or include a post-meeting statement.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:33 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This cybersecurity stock just had a huge pullback. How to buy the dip like a pro", "full_content": "A sharp post-earnings sell-off in Fortinet could create an attractive swing-trading opportunity, with key support levels offering a defined entry point and potential upside of 15% to 20%.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:32 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lumentum CEO touts 'enormous' opportunity in massive AI connectivity deal with Marvell", "full_content": "Marvell Technology 's deal for optical components maker Lumentum will create an \"enormous\" opportunity to address growing connectivity demands from the artificial intelligence infrastructure buildout, Lumentum CEO Michael Hurlston told CNBC on Monday.\n\n\"You need scale-up technology that needs semiconductors and optical working seamlessly together,\" he told CNBC's \"Squawk on the Street.\" \"We are going to create a new category of company here.\"\n\nSince the tie-up is a fixed-ratio deal with no cash, the value will depend on the price of Marvell shares. The company said the transaction has an implied enterprise value of $115 billion for Lumentum, in a release.\n\nMarvell shares slumped 8% in trading Monday, while Lumentum's stock sank 13%.\n\nThrough the acquisition, Marvell said it can combine electrical and optical technologies to meet accelerating and shifting AI connectivity demands across regions and systems. Companies are increasingly relying on optical connections to piece together chips used to run and train large language models.\n\n\"We're actually going to create solutions around those that are highly sticky, and the reason that they're sold out is because the demand is exploding, and we don't see that changing anytime soon,\" Marvell CEO Matt Murphy said.\n\nLumentum shareholders will receive 4.5 Marvell shares for each Lumentum share under the agreement. The deal is expected to close during the first half of 2028.\n\nMarvell's takeover marks one of the most significant bets on AI in 2026 and comes despite recent concerns over the long-term sustainability of infrastructure spending.", "source": "CNBC World Economy", "pub_date_str": "02 Nov 2026, 10:29 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Apple earnings live updates: New CEO John Ternus faces first Wall Street test", "full_content": "Apple reports fiscal fourth-quarter earnings after the bell on Monday, with new CEO John Ternus expected to address Wall Street in a meaningful way for the first time.\n\nRevenue is expected to increase 11% from $102.5 billion a year earlier. Analysts project $56.59 billion in iPhone sales for the quarter.\n\nWall Street is closely watching iPhone revenue because the report will include eight days of new iPhone 18 Pro sales. But Apple's new flagship device, the iPhone Duo, didn't hit store shelves until the quarter was over, and Apple didn't announce a new entry-level iPhone 18.\n\nApple also raised prices on iPhones by $100, which may have hurt demand in the quarter.\n\nMonday's earnings call, set to start at 5 p.m. ET, will be the first with Ternus at the helm. Investors want to hear from him about the company's plans in China after its AI software got approved, as well as the slew of recent product launches and how the company continues to grapple with global shortages of memory and flash storage.\n\nApple is competing in a smartphone and PC market that has \"never been worse,\" IDC's Ryan Reith told CNBC.\n\nConsumer electronics companies everywhere are grappling with surging prices for computer parts, including memory and flash storage that's used in every smartphone and laptop.\n\nIntel on Friday had its worst day on the stock market since the 1970s, dropping 29%, after the company cited PC softness for a disappointing forecast .", "source": "CNBC World Economy", "pub_date_str": "02 Nov 2026, 10:27 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "6 dividend stocks for investors who want to cut their exposure to the S&P 500", "full_content": "Novartis, Mitsubishi and Canadian Natural are examples of companies in developed markets outside the U.S. that pass screens for high dividend yields and low volatility for prices and earnings.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 10:26 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Alstom shares tumble 26% after train maker cuts profit forecast", "full_content": "French group also sets out plan to cut \u20ac2bn in debt in second major profit warning under new chief Martin Sion", "source": "FT Markets", "pub_date_str": "02 Nov 2026, 10:25 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks jump as oil prices tumble before midterms, tech shares rebound: Live updates", "full_content": "Stocks moved higher on Monday as oil prices fell sharply and some tech names rebounded, while investors braced for a packed week of earnings results and the upcoming midterm elections.\n\nThe S&P 500 traded 0.6% higher, while the Nasdaq Composite gained 0.7%. The Dow Jones Industrial Average added 568 points, or 1.1%.\n\nBrent crude tumbled more than 7% to around $104 per barrel. U.S. West Texas Intermediate futures also pulled back more than 7% to roughly $96.\n\nOil prices extended earlier gains amid hopes that the U.S. and Iran may resume peace talks, with Secretary of State Marco Rubio saying over the weekend that President Donald Trump \"hasn't made a decision\" to attack Iran and that Washington would prefer to resolve the conflict \"peacefully.\" Iranian state media also reported that the country's foreign minister said an agreement with is possible if the U.S. \"demonstrates goodwill.\"\n\nSentiment also improved around tech a bit after the announcement that Marvell Technology is buying Lumentum in a $115 billion deal , as the latest corporate bet signified continued bullishness in artificial intelligence. Nvidia climbed 1%, while Amazon gained more than 4%. Alphabet rose 1%.\n\nEnthusiasm was kept in check, however, after Oracle said it plans to sell $10 billion in common stock as well as $10 billion in bonds to finance its AI buildout. Shares were down more than 5% during the session.\n\nInvestors moved into key cyclical sectors, while defensive areas such as healthcare and utilities came under some pressure. Consumer discretionary stocks led the way, with the group gaining nearly 4%, while financials and industrials popped almost 2%. Materials advanced more than 2%.\n\nThe moves come after the major U.S. stock benchmarks suffered a losing week, bogged down by selling pressure in tech as investors continued to scrutinize names related to the AI buildout.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:25 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock market after midterm elections: What S&P 500 history shows", "full_content": "Markets are sweating it out ahead of the midterm elections, but the event historically heralds strong performance for stocks \u2014 regardless of whether it's a red or blue wave, split decision, or status quo in Washington.\n\nThe S&P 500 tends to perform well after both midterm and presidential elections. According to a CNBC analysis of S&P 500 returns after elections from 1980 through 2024, the index rose an average of 0.2% after one day and one week, and 1.1% after one month across both presidential and midterm elections.\n\nA year later, the index gained an average of 13.7% after midterms and 13.8% after presidential elections. Returns were positive in 91% of cases. And the S&P 500 was up after all 11 midterms from 1982 through 2022.\n\nShort-term returns were less reliable, particularly after presidential contests, which produced slightly negative average returns after one day and one week.\n\n\"There's some anxiousness before these elections,\" Ryan Detrick, CNBC contributor and chief market strategist at Carson Group, told CNBC. \"Once you are through it, it's a big relief and markets tend to do pretty well.\"\n\nStill, the market usually prefers divided government: one party in charge of the White House and the other holding at least one house of Congress.\n\nAcross 10 midterm and five presidential elections that left no single party in charge, the S&P 500 rose an average 15% after one year. One-year returns were positive in 14 out of 15 cases. By comparison, the index gained an average of 11.5% over the year after elections that resulted in single-party control.\n\n\"If you have a huge red wave or a big blue wave, markets actually kind of don't like that as much because you have too much spending one way and too much power,\" Detrick said.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:18 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Judge tosses DOJ case against ex-FBI officials accused of lying about Hunter Biden probe: Reports", "full_content": "A federal judge on Monday blasted the Department of Justice for \"weaponization\" as he dismissed its case accusing two former FBI officials of lying to Congress about investigations into Hunter Biden, multiple news outlets reported.\n\nMagistrate Judge Zia Faruqui, in a hearing in U.S. District Court in Washington, reportedly tore into the DOJ over its \"slapdash job\" prosecuting ex-officials Nikki Floris and Bradley Benavides, saying he was \"deeply troubled by what has happened here.\"\n\nFaruqui said the government lacked probable cause and failed to present evidence that the officials' statements before the House Judiciary Committee in 2023 were knowingly false, MS NOW reported.\n\nHe also accused the DOJ of wrongly rushing the case ahead of the midterm election . The situation \"cannot be described as anything other than weaponization,\" he said, according to MS NOW.\n\nThe judge even apologized to the government's lawyers, calling it \"incredibly unfair\" that they were assigned to defend the flawed case.\n\n\"This does not feel like an investigation,\" Faruqui reportedly added. \"It feels like a broken one-wish willow obsession.\"\n\nThe DOJ did not immediately respond to CNBC's request for comment.\n\nAttorneys for Floris and Benavides praised the judge's decision outside the courthouse later Monday morning.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:12 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "NALCO Q2 Results: Rs 4.5 Dividend Declared, But Profit Slip, 660-Bps Margin Shrink May Alarm Investors", "full_content": "NALCO's Q2 consolidated net profit fell 8.4% sequentially, while EBITDA dropped 11% and margins contracted 660 basis points. The company announced an interim dividend of Rs 4.5 per share.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 10:10 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buy, Sell Or Hold: Mazagon Dock, Kaynes Technology, Mahindra And Mahindra, Dixon Tech | Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 10:10 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, silver prices rebound from multi-month lows as crude oil retreats; what is driving the recovery?", "full_content": "A Ksheerasagar Published 2 Nov 2026, 10:08 PM IST Prefer Livemint on Google Gold and silver prices recovered in Monday\u2019s trade after hitting multi-month lows, as easing inflationary pressures amid a sharp retreat in crude oil prices supported sentiment. A drop in the US dollar also lent support to the rebound in precious metals.\n\nThe December gold futures contract on the MCX gained \u20b9 2,039 per 10 grams to touch the day\u2019s high of \u20b9 1,40,524. In the previous session, the yellow metal had fallen to its lowest level since March.\n\nSilver prices also attempted a recovery, with the futures contract rising \u20b9 5,543 per kg to \u20b9 1,84,675.\n\nThe rebound came after silver logged back-to-back monthly losses, with October marking its steepest monthly decline, at 20%, or \u20b9 44,574 per kg and during the period, it touched the lowest level in 10 months.\n\nCrude oil prices extended the decline on Monday, with Brent crude futures dropping 7% to below $105 a barrel, as hopes for a diplomatic resolution to the US-Iran conflict eased concerns over further supply disruptions.\n\nIran reportedly said on Monday that it had a two-day plan to reopen the Strait of Hormuz and resume nuclear talks with the United States. This came shortly after the country's Supreme Leader approved the government's pursuit of talks aimed at ending the months-long conflict, which has disrupted energy supplies in the Middle East, according to Iran's state-run IRNA news agency.\n\nEarlier, US President Donald Trump had also indicated that he wanted to give diplomacy more time before considering renewed military action. He reportedly told Israeli Prime Minister Benjamin Netanyahu that he preferred negotiations.\n\nIran had previously said the plan could be implemented within a week if the US met seven conditions, including lifting its blockade of Iranian ports. Tehran has now said that ships passing through the reopened strait would have to follow a route agreed upon by Iran and Oman and travel under Iranian supervision.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 10:08 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sitharaman 'recognises the voice' of investors: Will FM slash equity taxes in next Budget amid heavy FPI outflows?", "full_content": "Union Finance Minister Nirmala Sitharaman on Monday acknowledged concerns raised by foreign portfolio investors (FPIs) and equity market participants about India's investment environment, saying the government is aware of changing global circumstances and will consider their feedback to sustain economic growth above 7%.\n\nSitharaman said attracting foreign investment required more than just changes in taxation. She pointed out that India's tax structure was broadly similar in 2023-24, when the country witnessed substantial foreign capital inflows.\n\n\"Nothing differently was done for drawing investments. But of course, the situation is very different now. Circumstances have changed. Challenges have grown,\" she said.\n\nThe Finance Minister emphasised that India needed adequate capital, particularly equity investments, to maintain its growth momentum. She also indicated that the government was open to engaging with market participants to understand their concerns and address challenges affecting investment flows.\n\n\"I wouldn't want to say more at this stage, but I recognise the voice,\" she said, referring to investor concerns.\n\nSitharaman said the government had focused on deepening and widening the country's bond market over the past few years. However, concerns were now emerging over the need to provide greater support to equity markets to attract investments.\n\nShe acknowledged the importance of foreign capital in financing India's growth ambitions and said the government would take feedback from investors into consideration while assessing the changing global investment environment.\n\nOn domestic economic conditions, the Finance Minister expressed confidence that India's consumption growth would remain strong.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 10:05 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Three energy stocks on Josh Brown's list are outperforming as M&A activity ramps up", "full_content": "Josh Brown and Sean Russo break down these three energy names on their Best Stocks list.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 10:02 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Market Trading Guide: Tata Steel among 5 stocks to buy on Tuesday for healthy returns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market Trading Guide: Tata Steel among 5 stocks to buy on Tuesday for healthy returns Tata Communications Share Price Jio Platforms Share Price Bharti Airtel Share Price Vodafone Idea Share Price Bharti Hexacom Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market Trading Guide: Tata Steel among 5 stocks to buy on Tuesday for healthy returns SECTIONS Market Trading Guide: Tata Steel among 5 stocks to buy on Tuesday for healthy returns By Akash Podishetti , ETMarkets.com Last Updated: Nov 02, 2026, 09:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities experienced a strong start to the week, bolstered by better than expected Q2 earnings. Improved domestic macro indicators contributed to the positive sentiment among investors and traders. Increased passenger vehicle sales and gross GST collections reflected resilience in domestic economic activity. Several stock recommendations were highlighted for Tuesday, suggesting potential upward movements. Analysts shared technical insights indicating opportunities for buying various stocks in the current market.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 09:57 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trade Setup For Nov 3: Nifty Bulls Eye 23,600 Breakout As Oil Reprieve Supports Case For Sustained Rebound", "full_content": "Gift Nifty was trading 0.76% higher at 23,579.50, indicating a positive start for domestic equities.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:57 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Supermarket Freezers Set To 50\u00b0C In Cyber-Attack Across Europe, Millions In Food Losses Feared", "full_content": "The incident has drawn attention to the cybersecurity risks associated with internet-connected refrigeration infrastructure.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:56 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Behind Anthropic\u2019s 1,127% revenue surge \u2014 and the computing bill that erased its profit", "full_content": "Anthropic just filed updated financial paperwork ahead of an IPO that could come by the end of this month.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Nov 2026, 09:52 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic reports $17 billion in Q3 revenue, purchase commitments of $895.4 billion in revised S-1", "full_content": "Anthropic reported updated financials as part of an amended Form S-1 filing with the Securities and Exchange Commission on Monday, giving investors a more comprehensive look into the state of its business.\n\nThe artificial intelligence company said it generated $33.24 billion in revenue for the nine months ended Sept. 30, up roughly 1,200% from the same period last year. It reported a $104 billion net loss during the period, though most of that was due to the change in fair value of convertible notes and derivative liabilities. Anthropic lost $25.1 billion over the same stretch in 2025.\n\nAnthropic unveiled its highly anticipated prospectus last week, bringing the company one step closer to a potentially historic IPO . The initial filing only included the Claude-maker's financials through the first half of the year.\n\nDuring its third quarter, Anthropic generated roughly $17 billion in revenue, up about 1,127% from the same period last year. Revenue growth slowed on a quarter-to-quarter basis, however. Third-quarter revenue increased around 47%, a steep drop from 144% growth in Q2 and 132% in Q1.\n\nThe company reported a net loss of $23.29 billion during its third quarter.\n\nAs the five-year-old company prepares to kick off its road show, it will have to reckon with growing market jitters around the AI buildout. Wall Street has been worried that rising interest rates will make debt unaffordable for many data center developers and neoclouds , and quarterly reports from Microsoft , Google and Amazon last week added fuel to those concerns.\n\nThe hyperscalers' aggressive AI spending is eating into their cash flows , causing some investors to worry that compute capacity may not come online quickly enough to meet Anthropic's demands.", "source": "CNBC World Economy", "pub_date_str": "02 Nov 2026, 09:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live: NALCO Profit Dips 8%, Announces Dividend; ITC Profit Falls 20%, Margins Contract", "full_content": "A packed earnings day sees companies across FMCG, agri-inputs, logistics, metals, hospitality, healthcare and consumer sectors unveil their September quarter scorecards.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Income Tax Returns: 'How India filed in 2026' - 5 trends that reveal how young investors, salaried earners manage money", "full_content": "India's income tax returns are increasingly reflecting a financial life that goes beyond monthly salaries. From young investors reporting stock market losses to salaried taxpayers earning through freelancing and retirees continuing to invest, the latest filing data points to changing money habits across age groups.\n\nAccording to ClearTax's annual report, How India Filed in 2026, 47.3% of self-filers reported income from at least one source outside their jobs in assessment year (AY) 2026-27. This compares with just 9.5% in AY 2022-23. The share of taxpayers reporting income from two or more non-salary sources also increased from 3.5% to 24.4% during this period.\n\nThe report, based on ClearTax's filing data, highlights five trends that offer a glimpse into how Indians are earning, investing and managing their money.\n\nA growing number of taxpayers are earning money beyond their regular jobs. In AY 2026-27, 47.3% of self-filers reported income from at least one non-salary source, including investments, business, freelancing or cryptocurrency.\n\nThe proportion has increased steadily from 9.5% in AY 2022-23 and 17.3% in AY 2023-24. More significantly, 24.4% of self-filers reported income from two or more such sources in AY 2026-27, compared with 3.5% four years earlier.\n\nThe trend suggests that multiple income streams are becoming increasingly visible in taxpayers' financial lives. For salaried individuals, earnings from investments, freelance assignments and independent business activities are adding to their regular paychecks.\n\nYoung taxpayers are increasingly reporting income and financial activity beyond their salaries. Among self-filers below 25, 75% filed complex returns (ITR-2, ITR-3 or ITR-4) in AY 2026-27, compared with 60% in the previous assessment year.\n\nThe shift was particularly visible in ITR-3 filings, which increased from 28% to 44% among this age group. Meanwhile, the share filing ITR-1 declined from 41% to 25%.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 09:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Big Tech Bounces, But AI Infrastructure Stocks Keep Sinking; Oracle Down 5%", "full_content": "Gains in Amazon, Alphabet and Nvidia lift Wall Street, but mounting concerns over AI infrastructure spending keep Oracle, CoreWeave and other sector stocks under pressure.", "source": "NDTV Profit", "pub_date_str": "02 Nov 2026, 09:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly t ll_content": "Oracle filed plans on Monday to issue new stock and more debt to finance its artificial intelligence buildout.\n\nThe hyperscaler will sell $10 billion in common stock and $10 billion in senior notes, according to filings with the Securities and Exchange Commission. While the fundraising was already outlined at an investor day last week , shares tumbled more than 5% Monday.\n\nOracle said it plans to use the proceeds for general corporate purposes, which may include capital expenditures, repayments of debt and future investments.\n\nOracle's one-day performance The hyperscaler's stock initially bounced after last Wednesday's investor day, when Oracle also issued a revenue forecast of at least $225 billion for fiscal 2030. At the time Oracle also said it was limiting its additional capital market funding for the fiscal 2027 to 2030 investment cycle to that $20 billion.\n\n\"This is a major relief given concerns about the state of debt markets and the cost of capital (although UBS has argued that these debt market concerns have been over-stated),\" UBS analyst Karl Keirstead said in a note on Thursday.\n\nOracle plans to turn to vendor financing, customer-provided hardware and customer prepayments to help it transition to positive free cash flow, which it expects to reach in the second half of 2028.\n\nStock and bonds in Oracle, co-founded by former CEO Larry Ellison, have been under pressure amid growing investor concerns about the massive amount of debt being taken on to fund AI infrastructure.\n\nOracle shares are down 33% in 2026 and 50% over the past 12 months. The yield on its investment-grade 4.95% bond due in 2031 is currently 7.267%.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 09:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"
