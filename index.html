<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO", "full_content": "An Estonian tech billionaire famous for his stance that AI could end humanity is expected to be one of the biggest winners in Anthropic's upcoming IPO .\n\nJaan Tallinn co-founded Skype and later sold it to eBay . He led Anthropic's first funding round, a $124 million Series A, five years ago \u2014 well before the company's Claude chatbot was on the market and took Wall Street and Silicon Valley by storm.\n\nAnthropic is set to list on the Nasdaq Thursday under the ticker symbol ANT in what could be the largest IPO of all time, and the first public debut for an AI lab.\n\nTallinn's exact holdings haven't been disclosed. But given Anthropic's expected debut valuation of roughly $1.4 trillion, the return on his initial investment could be well into the tens of billions. His exact return would depend on the level of dilution in subsequent funding rounds and whether he sold any shares along the way.\n\nAnthropic's earliest backers connected with the company through philanthropic circles worried about AI's existential risk. They're sometimes described as \"doomers.\"\n\nIn 2020, Tallinn told CNBC that there's a 1-in-6 chance that humans won't survive this century, referencing a book from Oxford professor Toby Ord. Tallinn also described a runaway AI scenario where a model is left working overnight and \"the world is no longer there in the morning.\"\n\nWhile he continued to work in tech, Tallinn co-founded the Cambridge Centre for the Study of Existential Risk and the Future of Life Institute , known for one of the first public calls to pause AI. Despite high-profile signatories , including Elon Musk and Apple co-founder Steve Wozniak, the institute's \"Pause Giant AI Experiments\" letter in 2023 had little effect on the industry.\n\nTallinn's view on AI was influenced by researcher Eliezer Yudkowsky, who co-authored the 2025 book \"If Anyone Builds It, Everyone Dies,\" about the catastrophic risk of AI without proper checks, according to a person familiar with the matter.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 02:58 AM IST", "pub_date_relative": "just now"}, {"title": "Palo Alto to buy Applied Compute for $4.5 billion, while Q1 results beat estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:54 AM IST", "pub_date_relative": "4m ago"}, {"title": "LPL Financial Holdings completes $750 million senior notes offering due 2029", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:54 AM IST", "pub_date_relative": "4m ago"}, {"title": "UAE court orders freeze on crypto tokens stolen from Binance wallets", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:54 AM IST", "pub_date_relative": "4m ago"}, {"title": "Universal Technical Institute falls on weak guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:54 AM IST", "pub_date_relative": "4m ago"}, {"title": "EZCORP at Stephens conference: core pawn growth drives outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:54 AM IST", "pub_date_relative": "4m ago"}, {"title": "Dealbook Summit 2026 live updates: Altman says 'hard to imagine the AI industry without Jensen'", "full_content": "Artificial intelligence, trade tensions, and the need to create trust have been recurring themes at the New York Times DealBook Summit on Wednesday.\n\nAndrew Ross Sorkin , founder and editor of DealBook and co-anchor of CNBC's \"Squawk Box,\" has been sitting down in New York with prominent business, economic and political leaders to discuss a wide range of newsmaking issues.\n\nThe conference comes as OpenAI rival Anthropic is about to make its public debut on Thursday, and it follows a series of widespread tech outages that have grounded airplanes, snarled email, and stymied banking transactions, among other disruptions \u2014 a dramatic reminder of society's dependency on these services.\n\nIn discussing the balancing act that tech leaders are confronting trying to push ahead with AI innovation while attempting to guarantee public safety, OpenAI CEO Sam Altman said, \"The race dynamic in the fog of war, I think, is a bad thing. I think this is a time where more caution, not less caution, is warranted.\"\n\nSkydance co-CEO David Ellison emphasized the need to rebuild trust in media organizations.\n\n\"In a world, you know, where very quickly you're not going to be able to believe your eyes, we think having institutions that earn trust every single day is incredibly important,\" he said.\n\nMeanwhile, Canada Prime Minister Mark Carney expressed some frustration over trade relations with the U.S. He said a new deal \"should have been done six months ago, but we're not going to sign something that doesn't make sense for Canada.\"\n\nHe said he's pressing on in forging other trade partnerships. \"We got a lot to do, so we would like to do the deal. But if the U.S. doesn't want to do the deal, we're busy,\" he said.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 02:53 AM IST", "pub_date_relative": "5m ago"}, {"title": "Dow drops more than 500 points; S&P 500 falls for fifth day as Nvidia sells off: Live updates", "full_content": "The Dow Jones Industrial Average fell on Wednesday as Nvidia shares lost momentum following the chipmaker's better-than-expected earnings report.\n\nThe 30-stock index shed 561.25 points, or 1.11%, to end at 50,198.17. The S&P 500 lost 0.23% and closed at 7,323.63. It was the fifth consecutive losing session for the broad market index and its longest slide since June. The Nasdaq Composite outperformed and rose 0.42% to 24,429.88.\n\nShares of Nvidia were 2.9% lower, reversing course from earlier gains after the company's profit and revenue in the third quarter beat analysts' estimates. The company also lifted its revenue guidance for the fiscal year ending January 2028, calling for 75% growth year over year.\n\nThe report marked the chipmaker's first since Jensen Huang resigned last week as CEO, a move that came days after he admitted to an affair with a businesswoman alleged to be a Chinese spy. The company's board chair, Harvey Jones, said at the start of the earnings call that the board doesn't intend to bring Huang back as chief executive.\n\n\"It's going to be an adjustment, but it's one that the market will work its way through, just as it always has in the past,\" said Eric Parnell, chief market strategist at Great Valley Advisor Group.\n\nWhen it comes to the broader artificial intelligence trade, however, Parnell noted that the underlying fundamental challenges, including those related to capital expenditures and debt financing, haven't changed \u2014 and might not anytime soon.\n\n\"It doesn't take much of a slowdown in earnings growth in the environment that we're in with the AI buildout and the AI spend to take these types of stocks down pretty quickly,\" he said. \"It's this type of volatility that I suspect we're not only going to continue to see but it's likely to increase as we go through 2027 and into 2028.\"\n\nThe Dow was also weighed down by losses in healthcare stocks like UnitedHealth as well as energy name Chevron and industrial giant Caterpillar .", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 02:52 AM IST", "pub_date_relative": "6m ago"}, {"title": "Unisys at southwest ideas conference: ai push meets balance-sheet repair", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:52 AM IST", "pub_date_relative": "6m ago"}, {"title": "Anthropic prices IPO at $83 per share, above expected range, source tells CNBC", "full_content": "Anthropic priced its IPO at $83 per share on Wednesday, a person familiar told CNBC, above the expected range, setting the stage for the Claude creator's eagerly awaited Nasdaq listing and a historic moment for the artificial intelligence industry.\n\nAnthropic, founded in 2021, is expected to begin trading on the Nasdaq under the ticker symbol \"ANT\" on Thursday. After publicly unveiling its prospectus in October, Anthropic updated the document last week with an expected price range between $70 and $78 per share.\n\nThe company's listing is a major test for the AI industry, which has experienced a set of recent shocks, including a dramatic backlash that was felt at the polls in the midterm elections and last week's ouster of Nvidia CEO Jensen Huang . The market was already jittery on concerns that rising interest rates will make debt unaffordable for many data center developers and neoclouds.\n\nTech's biggest companies have significant exposure to Anthropic, as an investor, partner or customer. Amazon and Google both own stakes valued at over $100 billion, and a group of tech companies, including Google, Microsoft , Nvidia and Advanced Micro Devices agreed to collectively invest $26 billion in the IPO. Anthropic, meanwhile, is a buyer of costly systems from Nvidia, Google, Amazon and AMD.\n\n\"I think if we do this right, we can create an age of miracles where humanity is able to solve problems that have eluded us for millennia,\" Anthropic CEO Dario Amodei said in Anthropic's roadshow video . \"We have to make sure that all the risks, all the ways that things can go wrong with this technology, we very carefully address those risks as we bring the benefits and as we have a viable business at the same time.\"\n\nAmodei co-founded Anthropic alongside a handful of other researchers less than six years ago, after the group collectively defected from OpenAI.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 02:52 AM IST", "pub_date_relative": "6m ago"}, {"title": "Red Robin Gourmet Burgers earnings missed by $0.15, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:51 AM IST", "pub_date_relative": "7m ago"}, {"title": "CBOT corn futures drop to 4-1/2-month low on dollar strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:50 AM IST", "pub_date_relative": "8m ago"}, {"title": "Hamilton Beach adds Scott Seelbach to expanded board", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:50 AM IST", "pub_date_relative": "8m ago"}, {"title": "Agilent declares quarterly dividend of 26.25 cents per share", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:50 AM IST", "pub_date_relative": "8m ago"}, {"title": "What\u2019s next for the AI trade after Nvidia\u2019s blowout results are met with a shrug", "full_content": "Nvidia delivered a strong performance, but questions remain amid growing scrutiny of the company and macroeconomic factors", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 02:49 AM IST", "pub_date_relative": "9m ago"}, {"title": "Dow slumps over 500 pts as Fed minutes revive rate-hike fears", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Dow slumps over 500 pts as Fed minutes revive rate-hike fears Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Dow slumps over 500 pts as Fed minutes revive rate-hike fears SECTIONS Dow slumps over 500 pts as Fed minutes revive rate-hike fears Reuters Last Updated: Nov 19, 2026, 02:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Investors reacted to mixed performance in US stock markets, particularly after Nvidia's quarterly results. The Nasdaq closed higher while the Dow declined significantly, reflecting market volatility. Fed minutes indicated a hawkish stance toward inflation and potential interest rate hikes. Meanwhile, companies like TJX and Target reported positive forecasts ahead of the holiday season. Overall market sentiment remains cautious as future economic indicators emerge.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Nov 2026, 02:42 AM IST", "pub_date_relative": "16m ago"}, {"title": "Gold Slumps 3% to Lowest in Over a Year on Hawkish Fed Signals", "full_content": "(Bloomberg) -- Gold tumbled over 3% to the lowest in over a year after Federal Reserve officials made the case for more interest-rate hikes to tackle stubborn inflation.\n\nBullion fell as much as 3.1% on a third day of declines after Federal Reserve governor Christopher Waller said inflation remains headed in the wrong direction, urging the central bank to consider a larger, half-percentage-point rate hike at its December meeting.\n\n\u201cWe have to be a little more aggressive in our rate hikes to try to get inflation down,\u201d Waller said Wednesday on CNBC.\n\nSince the Fed\u2019s November meeting where interest rates were left unchanged, officials have signaled broad agreement over additional hikes, but offered differing views on the appropriate pace.\n\nStill, higher rates are typically a headwind for non-yielding bullion. A gauge of the US dollar also rose, making bullion priced in the US currency more expensive for most buyers.\n\nThe precious metal has fallen around 30% since the US-Iran war began in late February, as higher energy costs fueled inflation and pushed central banks to tighten monetary policy. The market is pricing in three quarter-point increases by June.\n\n\u201cIt is a tough environment for gold, particularly with buying interest still subdued,\u201d said Christopher Wong, a strategist at Oversea-Chinese Banking Corp. He said the market would stay cautious in the absence of any catalyst for a reversal.\n\nFor the next clues on the Fed\u2019s rate path, investors will be focused on minutes from the central bank\u2019s October meeting due for release later Wednesday. In remarks earlier this week, Fed Chair Kevin Warsh steered clear of offering any direct comment on monetary policy, in line with his stated preference not to provide near-term guidance on rates.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 02:40 AM IST", "pub_date_relative": "18m ago"}, {"title": "Nvidia sinks after earnings, dragging down neoclouds CoreWeave, Iren", "full_content": "Nvidia shares declined another 2.89% Wednesday after the company issued its first earnings report since the departure of former CEO Jensen Huang . The stock is down more than 13% over the past week.\n\nTrading in the neocloud companies was volatile throughout the day, as CoreWeave closed down 4.13%, Iren sank 3.61% and Nebius whipsawed, ending the trading day up 0.87%.\n\nNvidia's third-quarter revenue came in at $115.84 billion, more than $6 billion above analysts' expectations of $109.10 billion, while fourth-quarter guidance of $130 billion topped the $125.1 billion consensus, according to LSEG.\n\nThe semiconductor giant continues to navigate the fallout from Huang's resignation last week. Shortly before the results, Huang made his first public statement since resigning last week, saying that he was open to returning to the company, after an outpouring of support from prominent tech figures .\n\nNeocloud stocks today But Harvey Jones, the new and first-ever chair of Nvidia's board, said on the earnings call that the board does not intend to reinstate him as CEO.\n\n\u2033[Hyperscalers] are the ones that are right now feverishly looking for more focus in terms of the compute that we have available,\" interim CEO Colette Kress told Jim Cramer on CNBC's \"Mad Money.\"\n\n\"This concept that anything is changing in terms of any of our types of customers \u2014 that is just not true. They are all continuing to be with us, and we have a very deep breath of different customers.\"\n\nThe U.S. Commerce Department announced a legal change on Monday to try and stem China's access to the most advanced Nvidia chips \u2014 which are already under export controls effectively preventing their import into the country \u2014 by restricting Chinese companies' ability to access compute remotely in overseas data centers.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 02:36 AM IST", "pub_date_relative": "22m ago"}, {"title": "Australian Wheat Hits Two-Year High as Buyers Flee Black Sea", "full_content": "(Bloomberg) -- Australian wheat prices climbed to a two-year high as strong export demand overshadows the start of the harvest, with buyers racing to replace stalled Black Sea supplies.\n\nAn average of wheat prices at five of the country\u2019s largest grain ports reached the highest since June 2024 on Wednesday. Importers have been seeking alternative supplies as weeks of ship and port attacks stall vessel traffic from the Black Sea, a major exporting region. That has pushed more interest toward wheat from Australia, another of the world\u2019s largest suppliers.\n\nBuying has been strong from Southeast Asia, in particular, according to Dennis Voznesenski, agricultural economist at the Commonwealth Bank of Australia. Black Sea wheat typically dominates global markets just after the Northern Hemisphere harvest, but fresh supplies from the Southern Hemisphere are now coming online.\n\n\u201cThey have to get their wheat from somewhere and they can\u2019t get it from Ukraine and Russia,\u201d he said. \u201cIt\u2019s strong on the international front for those trying to substitute out Ukrainian and Russian wheat.\u201d\n\nIn October and November, shipping lineups have shown about 1.1 million tons of wheat destined for Indonesia and the Philippines, the most for that period in five years, according to a Bendigo Bank report.\n\nThe run-up in Australian prices, which track a premium white grade, stands in contrast to a slump in some other markets. Chicago futures have fallen in 10 of the past 11 weeks as American wheat struggles to attract foreign buyers.\n\nFor Australia, domestic demand from cattle feedlots is also supporting prices, according to Voznesenski. That is coinciding with recent rains that are delaying the start of the harvest, raising worries over crop quality and slowing new supplies from reaching the market.\n\nMore rain is expected this week, hampering wheat collection, although precipitation may be more limited next week, according to weather forecaster Vaisala.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 02:33 AM IST", "pub_date_relative": "25m ago"}, {"title": "Google turns to a volcano and rock-melting technology in a wild new bid to power AI", "full_content": "Google\u2019s agreement with Quaise is \u201ca bet on a first-of-a-kind technology,\u201d according to a Bernstein analyst.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 02:31 AM IST", "pub_date_relative": "27m ago"}, {"title": "Nvidia's shift in financing tone may spell trouble for Coreweave, other neoclouds", "full_content": "Neocloud stocks face new scrutiny as investors anticipate tighter financing from Nvidia.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 02:30 AM IST", "pub_date_relative": "28m ago"}, {"title": "\u2018Nvidia\u2019s turmoil has me spooked\u2019: Should I sell my stocks and buy real estate \u2014 or ride out the storm?", "full_content": "Tempted to ditch stocks for property or CDs? Take a deep breath before making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 02:30 AM IST", "pub_date_relative": "28m ago"}, {"title": "Fed minutes show growing unease about the outlook for inflation", "full_content": "WASHINGTON, DC - SEPTEMBER 16: Federal Reserve Chair Kevin Warsh speaks during a news conference following Federal Open Market Committee meetings at Federal Reserve Headquarters on September 16, 2026 in Washington, DC. The Federal Reserve raised interest rates by a quarter of a percentage point in the first increase since 2023. (Photo by Andrew Harnik/Getty Images) *** BESTPIX ***", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 02:21 AM IST", "pub_date_relative": "37m ago"}, {"title": "Grand Theft Callout: \u2018GTA 6\u2019 fans are missing work to play \u2014 and some companies are making the game\u2019s release a holiday", "full_content": "After waiting 13 years for this videogame, almost one-fifth of workers are said to be taking Thursday off to play \u2018Grand Theft Auto VI\u2019 when it drops", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 01:59 AM IST", "pub_date_relative": "59m ago"}, {"title": "Nvidia\u2019s interim CEO Colette Kress has taken over one of the most consequential company on the planet; those who know her say she\u2019s up to the task - Yahoo Finance", "full_content": "Nvidia\u2019s interim CEO Colette Kress has taken over one of the most consequential company on the planet; those who know her say she\u2019s up to the task Yahoo Finance Nvidia interim CEO Kress tells employees \u2018let\u2019s move forward\u2019 at first all-hands meeting since Jensen Huang exit CNBC Nvidia Tells Employees That Company Is Moving on From Huang Era Bloomberg.com What Nvidia\u2019s Interim CEO, Colette Kress, Said to Employees After Jensen Huang\u2019s Resignation The New York Times Nvidia interim CEO says 'we\u2019ve got this' as company looks to future without Jensen Huang Fox Business", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 01:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Dow Falls as Nvidia Earnings Fail to Soothe Investors' Nerves - WSJ", "full_content": "Stock Market Today: Dow Falls as Nvidia Earnings Fail to Soothe Investors' Nerves WSJ Nvidia delivered a monster quarter, then its new leaders stumbled on the earnings call Yahoo Finance Dow drops more than 500 points; S&P 500 falls for fifth day as Nvidia sells off: Live updates CNBC Wall Street mixed after Nvidia earnings, Fed minutes Reuters Four takeaways from Nvidia\u2019s first earnings report after Jensen Huang scandal CNN", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 01:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic Leveraged ETF Race Heats Up Even Before Stock\u2019s Debut", "full_content": "(Bloomberg) -- A slew of leveraged ETFs tied to SpaceX launched soon after its public debut, but only one managed to attract meaningful assets. That experience has raised the stakes for Anthropic: Issuers are racing to get out front in hopes that their fund becomes the one that captures the bulk of investor dollars.\n\nProviders have filed for more than 20 exchange-traded products to amplify daily moves on the Claude chatbot maker once it goes public, both on the upside and the downside, as firms including Direxion, ProShares and GraniteShares jostle for a first-mover advantage, according to a Bloomberg Intelligence tally. And it\u2019s all happening before the IPO.\n\nFor the issuers, it\u2019s a simple calculation: whoever can be first to market \u2014 at a time when enthusiasm is at its peak \u2014 is more likely to attract a disproportionate set of retail dollars. Few public debuts promise as much hype as Anthropic\u2019s, which is on the cusp of potentially pricing the biggest IPO on record, Bloomberg News has reported.\n\nThe SpaceX experience showed issuers just how lopsided the payoff can be.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:49 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Dow Drops As Nvidia Probe Deepens; Fed Minutes Loom (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Drops As Nvidia Probe Deepens; Fed Minutes Loom (Live Coverage) Investor's Business Daily Stock market today: Dow slides, S&P 500 and Nasdaq seesaw as Nvidia clears earnings hurdle, Anthropic prepares to price its IPO Yahoo Finance U.S. Markets Closed Mixed Wednesday As Okta Led, Humana Lagged Barron's Stock Market Today: Dow Jones, S&P 500, Nasdaq 100 Futures Trade Mixed Ahead of FOMC Minutes\u2014 NVDA, AAOI, PANW in Focus (UPDATED) TradingView Stock Market Today: Dow off 500 points, S&P 500 and Nasdaq mixed; Anthropic expected to price IPO \u2014 live updates MarketWatch", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 01:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia reverses, metals crash ahead of Anthropic IPO", "full_content": "Is this what it takes to clear room for $1.5 trillion of new supply?\n\nSlumping crypto prices, a big Nvidia reversal despite good earnings, and now a sharp drop-off in metals prices from gold to copper \u2014 cross-asset selling has traders wondering if Anthropic's incoming IPO is spurring a rotation trade with the aim of freeing up cash to buy stock in the AI giant when it goes public on Thursday.\n\nShares of Nvidia swung from $164 overnight to below $152 during Wednesday's trading session despite smashing analysts' expectations on revenue and guidance. Options volume on the stock was almost three times the average and showed a bullish bias despite the reversal, with almost twice as many calls trading versus puts, Cboe LiveVol data show.\n\nMeanwhile, metals prices fell across the board, led by a 5% sell-off in copper futures to the lowest since April. Gold futures lost more than 3% to $3,744, the lowest since September 2025, despite Treasury yields slipping on the session.\n\nAlmost 300,000 options traded on the SPDR GLD Shares ETF (GLD) , with a slight bias towards calls. The catch for gold bugs is that more calls looked like they were initiated by sellers, according to Cboe LiveVol data, which show 52,000 calls sold on the bid versus 45,000 calls bought on the ask.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold drops to 14-month low as dollar, yields rise on hawkish Fed rhetoric", "full_content": "Nov 18 (Reuters) - Gold sank over 3% to a more-than-one-year low on Wednesday as hawkish Federal Reserve signals raised expectations of higher interest rates, boosting the dollar and Treasury yields.\n\nSpot gold fell 3.2% to $3,726.19 per ounce by 2:30 p.m. ET (1530 GMT). It had hit its lowest level since September 2025 earlier in the session at $3,719.55 an ounce.\n\nMinutes of the Fed's October meeting showed officials saw a growing risk that they might need to intensify efforts to control inflation, even as they agreed to keep interest rates steady for the moment.\n\n\"Gold won't find much relief from the Fed minutes as the overwhelming majority sees further hikes, with a couple broaching a 50bps move if inflation disappoints. Fed will hike until inflation turns, but it's not an emergency. Barring a quick reversal, today's damage suggests a probe of 3350-3450 in the coming weeks,\" independent analyst Tai Wong said.\n\nThe minutes echoed hawkish comments from US Federal Reserve Governor Christopher Waller, who said the Fed needs to get more aggressive in its response to inflation, and either approve a half-point hike in December or communicate a faster pace of rate increases in 2027.\n\nOn Tuesday, Fed officials John Williams and Alberto Musalem also signalled further rate hikes may be needed to curb inflation.\n\n\"We believe the selloff reflects mounting pressure from a strengthening US dollar, rising Treasury yields and expectations of further monetary tightening,\" said Naeem Aslam, CIO, Zaye Capital Markets. [US/]\n\nThe dollar strengthened to a fresh 19-month high on Wednesday as hawkish commentary and recent economic data cemented expectations for an interest rate hike next month. [USD/]", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dollar firmer as hawkish Waller backs aggressive Fed action", "full_content": "* Waller says Fed needs more aggressive response to inflation\n\nNEW YORK, Nov 18 (Reuters) - The dollar touched a fresh 19-month high on Wednesday as hawkish commentary from influential US Federal Reserve Governor Christopher Waller and recent economic data cemented expectations for an interest rate hike next month.\n\nFed Chairman Kevin Warsh's refusal to offer forward guidance has made investors more reliant on economic data and commentary from other policymakers to gauge the Fed's next move.\n\nWaller said on CNBC that if the central bank wants to get inflation down it needs to take more \"aggressive action\" either through a half-point increase at the December meeting, or using the post-meeting statement to set market expectations for further hikes.\n\nHotter-than-expected inflation data last week have left markets fully pricing a 25-basis-point rate hike in December, and seeing a small chance of a 50-bp rise, the CME Group's FedWatch Tool showed. Data on Tuesday showed US retail sales increased moderately in October, reinforcing expectations for a rate hike next month.\n\n\"The Federal Reserve seems at the moment to be very determined to hike interest rates and maybe even aggressively do so,\" said Juan Perez, senior director of trading at Monex USA in Washington.\n\n\"That's the belief right now that's carrying the US dollar,\" Perez said.\n\nFed officials saw a growing risk last month that they might need to intensify their efforts to control inflation, even as they agreed to keep interest rates steady for the moment, the minutes of their October 27-28 meeting showed on Wednesday.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "I watched Trump, Xi and Putin gather in China. Here are my top takeaways", "full_content": "SHENZHEN, China \u2014 It took a trip to China for me, an American, to see U.S. President Donald Trump in person for the first time.\n\nTrump emerged from a group of black-clad photographers and other personnel surrounding him at a welcome banquet in Shenzhen for the Asia-Pacific Economic Leaders' Meeting held Nov. 17 to 19.\n\nSeated just a few spots to his left was Russian President Vladimir Putin who picked up a glass of red wine to join a toast led by Chinese President Xi Jinping .\n\n\"At tomorrow's Leaders' Meeting, we will discuss measures to expand mutual opening up, explore pathways to innovation-driven growth, and identify opportunities to expand practical cooperation across various fields, so as to translate more initiatives into tangible results,\" Xi said in Mandarin, according to a CNBC translation.\n\nXi was speaking broadly, but Thursday's agenda includes a bilateral meeting with Trump, and their highly anticipated trilateral meeting with Putin.\n\nBut looking at the mood in the room, it seemed that their trilateral conversation had already started Wednesday night at their long banquet table. Much of what happens at APEC, including bilateral meetings and other exchanges between leaders, takes place away from the media.\n\nBut what struck me was how little sign there was of the tension surrounding Nvidia 's CEO Jensen Huang resignation, a controversy that has gripped markets for the past 10 days.\n\nAhead of Trump's entrance into the banquet hall, Chinese Commerce Minister Wang Wentao shared a friendly moment with U.S. Treasury Secretary Scott Bessent and other members of the American delegation.", "source": "CNBC Finance", "pub_date_str": "19 Nov 2026, 01:17 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why Anthropic's hot IPO is bringing out sellers \u2014 plus, a silver lining of the down market", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "US tech stocks oscillate after Nvidia results", "full_content": "Chip group raises forecast and new chief says \u2018it\u2019s business as usual\u2019 after news of Huang\u2019s affairs triggered sell-off", "source": "FT Markets", "pub_date_str": "19 Nov 2026, 01:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "Fed officials expect more rate hikes, worry about AI impact on inflation, minutes show", "full_content": "Federal Reserve officials expressed confidence in October that further interest rate increases will be needed to stem inflation, though they decided to hold off while gathering more information, according to meeting minutes released Wednesday.\n\nPolicymakers put artificial intelligence at the core of their discussions, indicating that demand associated with the technology would be \"a material source of inflation risk.\"\n\nMore broadly, officials said \"inflation pressures in the economy were broad based\" and would warrant action, with \"some\" policymakers advocating for a quarter percentage point hike at the meeting. A couple of participants even noted the possibility that a larger increase might be needed at the next policy meeting in December.\n\nThe meeting summary said \"almost all participants judged that, under their baseline outlooks for inflation and the labor market, further action to raise the target range for the federal funds rate \u2026 would likely be appropriate, in order to ensure a timely return of inflation to the 2 percent objective.\"\n\nIn a CNBC interview Wednesday, Fed Governor Christopher Waller reiterated his belief that the Federal Open Market Committee should consider a half-point hike in December.\n\nOfficials at the meeting expressed a high level of concern over AI, both as a source of inflation and financial instability.\n\nFed staff members who briefed participants noted \"that off-balance-sheet leasing commitments and circular financing arrangements among AI-related firms could amplify losses if returns on AI investment were to disappoint.\"\n\n\"Most participants observed that AI-related debt had grown rapidly and that much of this growth had taken place through complex and opaque financing structures,\" the minutes said. \"A few participants remarked that AI-related exposures were becoming increasingly concentrated among a small number of firms.\"", "source": "CNBC Finance", "pub_date_str": "19 Nov 2026, 01:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Washington is scrambling to get to the bottom of the growing number of tech outages across America", "full_content": "The Trump administration and Congress have been rushing to address the series of technology failures that have hit the U.S. over the past week, with Vice President J.D. Vance withdrawing from an event Wednesday in order to take part in meetings on the issue.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 01:09 AM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m in my 40s. Should I accept a lower pension in exchange for naming my husband or child as a beneficiary?", "full_content": "\u201cIf I die before my husband, he will receive a lifetime pension equal to 50%\u201366% of my monthly benefit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 01:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Fed policymakers focused on inflation risks in October, with some seeing need for bigger rate hike", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Fed policymakers focused on inflation risks in October, with some seeing need for bigger rate hike Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Fed policymakers focused on inflation risks in October, with some seeing need for bigger rate hike SECTIONS Fed policymakers focused on inflation risks in October, with some seeing need for bigger rate hike Reuters Last Updated: Nov 19, 2026, 12:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Federal Reserve officials noted a greater risk of inflation requiring more action during their October meeting. Although they decided to keep interest rates steady, discussions indicated a potential need for a half-percentage-point increase. Policymakers expressed concerns over persistent inflation that might not ease quickly enough. The forthcoming December meeting could see intense debates on potential rate hikes and policy adjustments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Nov 2026, 12:55 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia interim CEO Kress tells employees \u2018let\u2019s move forward\u2019 at first all-hands meeting since Jensen Huang exit", "full_content": "Interim Nvidia CEO Colette Kress told employees \"let's move forward\" on Wednesday during the company's first all-hands meeting since founder Jensen Huang resigned, according to an attendee who spoke to CNBC on the condition of anonymity.\n\nKress was joined by newly appointed board chair Harvey Jones and hyperscale and high-performance computing head Ian Buck. Several other senior members of Nvidia's executive team spoke, including long-time company veteran Jeff Fisher, senior vice president of GPU engineering Jonah Alben, executive vice president in charge of Operations Debora Shoquist and co-founder Chris Malachowsky, according to a person familiar with the matter.\n\nKress opened with the message about moving forward, and also brought up pay raises for employees, according to the attendee. Jones then pivoted to a discussion about the search for the next CEO, the attendee added. The meeting lasted about an hour and was in person as well as streamed on Microsoft Teams.\n\nThe general sentiment swirling in the room, according to the attendee, is that employees want Huang to come back . Employees have spoken up on X in recent days to call for the return of Huang as CEO, and one senior employee reportedly sent a letter to the board warning Nvidia would lose \"irreplaceable talent\" if it doesn't consider reinstating Huang.\n\nBut another person familiar with the matter disagreed, saying that employees welcomed the remarks from leadership as well as the visibility into company leadership.\n\n\"The Nvidia board unanimously accepted his resignation and does not intend to reinstate Jensen as CEO,\" Jones said during the earnings call on Tuesday.\n\nDespite recent turmoil, Wednesday's meeting was not out of the ordinary. Nvidia typically holds all-hands the morning after quarterly earnings reports, according to a former employee who spoke to CNBC on the condition of anonymity.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 12:51 AM IST", "pub_date_relative": "2h ago"}, {"title": "Fed Minutes Show Almost All Officials Expect More Rate Hikes - Bloomberg.com", "full_content": "Fed Minutes Show Almost All Officials Expect More Rate Hikes Bloomberg.com Fed officials expect more rate hikes, worry about AI impact on inflation, minutes show CNBC Fed's Waller doubles down on a jumbo rate hike in December, sees more hikes to come Yahoo Finance The Fed's next moves come into focus Axios Fed Saw Need to Keep Raising Interest Rates Despite Holding Steady in October The New York Times", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 12:48 AM IST", "pub_date_relative": "2h ago"}, {"title": "Vance scraps schedule to address tech outages as Trump admin insists incidents aren't linked", "full_content": "Vice President JD Vance on Wednesday abruptly canceled his scheduled appearance at The New York Times DealBook Summit to instead attend meetings on a recent wave of high-profile technology outages .\n\nThe cancellation was announced shortly after a senior Trump administration official insisted that the outages, which have affected a wide range of industries and have been felt across the country and around the world, are not the result of a cyberattack or any form of coordinated action.\n\n\"We have a great deal of confidence in our assessment that these incidents are the result of upgrades of the systems, systems being patched, hardware being applied\" or other \"disparate\" events, the official said on condition of anonymity to discuss the government's intelligence assessments.\n\nThe official briefed news outlets by phone in the wake of numerous major disruptions at large corporations and federal agencies in recent days, including a nationwide aviation ground stop, a protracted Microsoft Outlook outage and a reported blackout of the National Security Agency's classified communications network.\n\nOther incidents include software issues at JPMorgan Chase , an outage at United Airlines that caused some flight delays and product issues at Apple .\n\nOn Tuesday, Director of National Intelligence Jay Clayton told CNBC that the outages are not a cyberattack and \"not a coordinated effort by a nation-state.\"\n\nHe gave a similar assurance on Wednesday to the House Homeland Security Committee.\n\n\"We have no indication that these incidents are related, that they're coordinated,\" Clayton said. \"We also have no indication that they're result of a state-sponsored malign actor.\"", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 12:47 AM IST", "pub_date_relative": "2h ago"}, {"title": "Stocks Fall as Nvidia\u2019s Earnings Rally Sputters: Markets Wrap - Bloomberg.com", "full_content": "Stocks Fall as Nvidia\u2019s Earnings Rally Sputters: Markets Wrap Bloomberg.com Nvidia stock erases earnings pop as investors face life after Jensen Huang Yahoo Finance Nvidia Stock Faces the Icarus Test After Huang's Exit - NVIDIA (NASDAQ:NVDA) Benzinga Nvidia Stock Is One of the Best Deals on Offer With 1 Big Catch Barron's It\u2019s Hard to Protect Your Nest Egg from Nvidia WSJ", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 12:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "Buy, Sell Or Hold: Tata Motors, Infosys, LIC, Yes Bank, Tanla Platforms, UltraTech Cement, And More | Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:31 AM IST", "pub_date_relative": "2h ago"}, {"title": "Stocks to watch as U.S. tech outages put \"digital resilience\" in focus", "full_content": "Cybersecurity stocks like CrowdStrike aren't the only way to play digital resilience. Here are other stocks to consider.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 12:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Minutes of the Federal Open Market Committee, October 27-28, 2026", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 2:00 p.m. EST Share --> --> --> --> --> --> The Federal Reserve on Wednesday released the minutes of the Federal Open Market Committee meeting that was held on October 27\u00e2\u0080\u009328, 2026.\n\nThe minutes for each regularly scheduled meeting of the Committee are generally published three weeks after the day of the policy decision. The descriptions of economic and financial conditions contained in these minutes are based solely on the information that was available to the Committee at the time of the meeting.\n\nFor media inquiries, e-mail [email protected] or call 202-452-2955.\n\nMinutes of Federal Open Market Committee October 27\u00e2\u0080\u009328, 2026: HTML | PDF", "source": "Federal Reserve", "pub_date_str": "19 Nov 2026, 12:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "DOT Secretary Sean Duffy keeps blaming L3Harris after FAA ground stop, even as cause remains unknown - AP News", "full_content": "DOT Secretary Sean Duffy keeps blaming L3Harris after FAA ground stop, even as cause remains unknown AP News See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 12:19 AM IST", "pub_date_relative": "2h ago"}, {"title": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO - CNBC", "full_content": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO CNBC Why the Anthropic IPO could be a trap for investors Yahoo Finance Anthropic promises to pursue humanity\u2019s benefit. Its IPO filing gives it wiggle room AP News Anthropic and the Monetization of Paradise The New Yorker Anthropic Said to Be Weighing IPO Price as High as $85 Per Share Bloomberg.com", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 12:13 AM IST", "pub_date_relative": "2h ago"}, {"title": "Retail investor enthusiasm for Anthropic IPO to rival SpaceX debut", "full_content": "Retail investor Dan Shetty is so eager to get in on the Anthropic initial public offering that he \"drained\" his Roth IRA and moved roughly $12,000 from Fidelity to Robinhood for a chance to participate.\n\n\"I don't want to tell my grandkids that I didn't invest in Anthropic and I didn't invest in OpenAI during the AI bubble,\" he said.\n\nShetty's enthusiasm is shared by many, with excitement among small investors for the blockbuster IPO expected to be off the charts. Vanda Research estimates that Anthropic could see approximately $250 million of retail net buying when it starts trading Thursday, double the size of SpaceX's IPO.\n\n\"That would be far and away the largest amount of net retail buying of any stock that we've seen in our data on the first day of its listing,\" Jai Malhi, senior strategist at Vanda, said in an interview with CNBC.\n\nThe artificial intelligence laboratory \u2014 which will trade on the Nasdaq under ticker symbol ANT \u2014 is selling 825 million shares at an expected price range of $70 to $78 per share in the IPO, though sources told CNBC the stock is likely to price above that range . Individual investors are expected to be allocated as much as 20% in that initial offering. And if Vanda's figures prove correct, the buying enthusiasm will be big as regular trading begins.\n\nFounded less than six years ago, Anthropic aims to raise as much as $64.4 billion, giving it a valuation of $1.405 trillion. If demand is especially strong, Anthropic could even raise more than the record $85.7 billion that SpaceX sold in its record IPO in June.\n\nThe tech trade has been in turmoil since Jensen Huang's departure last week as Nvidia CEO raised questions about the future of AI financing.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 12:12 AM IST", "pub_date_relative": "2h ago"}, {"title": "Wall Street Sees More Mega Debt Deals Using Paramount Blueprint", "full_content": "(Bloomberg) -- Skydance Corp.\u2019s $52 billion bond and loan sale is set to serve as a model for future jumbo credit financing, with Morgan Stanley predicting Wall Street will pull off even bigger deals using the unusual combination of investment-grade and junk-rated debt.\n\nJoe Bishay, Morgan Stanley\u2019s head of leveraged finance capital markets for Europe, Middle East and Africa said that the September deal backing the acquisition of Warner Bros. Discovery Inc. by the media company \u2014 then known as Paramount Skydance \u2014 is an indication of what\u2019s to come in the credit markets next year.\n\n\u201cParamount showed that $50 billion-plus was doable, especially when you have a mixture of investment-grade and sub-investment grade,\u201d Bishay said Wednesday at Bloomberg\u2019s Global Credit Forum in London. \u201cI think we will continue to see that structure or similar structures going forward. And I think the sizes are going to go up.\u201d\n\nSkydance took the unconventional step of issuing investment-grade debt, including $30 billion of bonds, alongside the riskier speculative-grade paper that often backs big buyouts. The safer debt carried stronger ratings because its first-lien claim on Paramount\u2019s assets put them first in line for repayment in a default. But the junk piece lacked covenants widely used in the high-yield market. Skydance offered yields as high as about 9% to entice investors.\n\nIts offering was part of a record $1.9 trillion of investment-grade debt sold by US companies this year. Meanwhile, bankers in Europe wrapped up their best year for high-fee leveraged-loan M&A financing in five years, with dealmakers remaining bullish on issuance next year.\n\nHowever, they are sounding caution on rising rates, particularly for junk-rated companies.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 12:11 AM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic IPO set to raise $90.4 billion, could become biggest stock market debut ever", "full_content": "Anthropic PBC is poised to make history with what could become the biggest initial public offering (IPO) ever, as the artificial intelligence company moves closer to pricing its shares above the proposed range despite recent volatility in technology stocks.\n\nThe maker of the Claude AI chatbot has indicated to prospective investors that it expects to price its shares above the initial range of $70 to $78, according to a Bloomberg report citing a person familiar with the matter.\n\nAnthropic and its seven co-founders are offering a combined 825 million shares in the IPO. At the upper end of the proposed price range, the offering, including a $26 billion private placement, could raise approximately $90.4 billion.\n\nThis would surpass the previous record set by SpaceX, whose base offering raised $75 billion. The transaction would also give Anthropic a fully diluted valuation of approximately $1.4 trillion.\n\nInvestor interest in the offering has reportedly been strong, with bankers informing investors that the IPO is close to seven times oversubscribed, Bloomberg reported.\n\nThe strong demand comes despite a difficult environment for technology stocks. The Nasdaq 100 Index is heading towards a five-day losing streak, having declined 5.3% during the period.\n\nShares of Nvidia, which is purchasing approximately $10 billion worth of Anthropic stock through the private placement, also came under pressure. The chipmaker's stock fell as much as 1.4% on Wednesday, a day after reporting earnings that exceeded market expectations.\n\nAnthropic's strong revenue growth prospects could support substantial demand from institutional and retail investors, according to Bloomberg Intelligence analysts.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 12:10 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO", "full_content": "An Estonian tech billionaire famous for his stance that AI could end humanity is expected to be one of the biggest winners in Anthropic's upcoming IPO .\n\nJaan Tallinn co-founded Skype and later sold it to eBay . He led Anthropic's first funding round, a $124 million Series A, five years ago \u2014 well before the company's Claude chatbot was on the market and took Wall Street and Silicon Valley by storm.\n\nAnthropic is set to list on the Nasdaq Thursday under the ticker symbol ANT in what could be the largest IPO of all time, and the first public debut for an AI lab.\n\nTallinn's exact holdings haven't been disclosed. But given Anthropic's expected debut valuation of roughly $1.4 trillion, the return on his initial investment could be well into the tens of billions. His exact return would depend on the level of dilution in subsequent funding rounds and whether he sold any shares along the way.\n\nAnthropic's earliest backers connected with the company through philanthropic circles worried about AI's existential risk. They're sometimes described as \"doomers.\"\n\nIn 2020, Tallinn told CNBC that there's a 1-in-6 chance that humans won't survive this century, referencing a book from Oxford professor Toby Ord. Tallinn also described a runaway AI scenario where a model is left working overnight and \"the world is no longer there in the morning.\"\n\nWhile he continued to work in tech, Tallinn co-founded the Cambridge Centre for the Study of Existential Risk and the Future of Life Institute , known for one of the first public calls to pause AI. Despite high-profile signatories , including Elon Musk and Apple co-founder Steve Wozniak, the institute's \"Pause Giant AI Experiments\" letter in 2023 had little effect on the industry.\n\nTallinn's view on AI was influenced by researcher Eliezer Yudkowsky, who co-authored the 2025 book \"If Anyone Builds It, Everyone Dies,\" about the catastrophic risk of AI without proper checks, according to a person familiar with the matter.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 02:58 AM IST", "pub_date_relative": "just now", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "UAE court orders freeze on crypto tokens stolen from Binance wallets", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:54 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dow drops more than 500 points; S&P 500 falls for fifth day as Nvidia sells off: Live updates", "full_content": "The Dow Jones Industrial Average fell on Wednesday as Nvidia shares lost momentum following the chipmaker's better-than-expected earnings report.\n\nThe 30-stock index shed 561.25 points, or 1.11%, to end at 50,198.17. The S&P 500 lost 0.23% and closed at 7,323.63. It was the fifth consecutive losing session for the broad market index and its longest slide since June. The Nasdaq Composite outperformed and rose 0.42% to 24,429.88.\n\nShares of Nvidia were 2.9% lower, reversing course from earlier gains after the company's profit and revenue in the third quarter beat analysts' estimates. The company also lifted its revenue guidance for the fiscal year ending January 2028, calling for 75% growth year over year.\n\nThe report marked the chipmaker's first since Jensen Huang resigned last week as CEO, a move that came days after he admitted to an affair with a businesswoman alleged to be a Chinese spy. The company's board chair, Harvey Jones, said at the start of the earnings call that the board doesn't intend to bring Huang back as chief executive.\n\n\"It's going to be an adjustment, but it's one that the market will work its way through, just as it always has in the past,\" said Eric Parnell, chief market strategist at Great Valley Advisor Group.\n\nWhen it comes to the broader artificial intelligence trade, however, Parnell noted that the underlying fundamental challenges, including those related to capital expenditures and debt financing, haven't changed \u2014 and might not anytime soon.\n\n\"It doesn't take much of a slowdown in earnings growth in the environment that we're in with the AI buildout and the AI spend to take these types of stocks down pretty quickly,\" he said. \"It's this type of volatility that I suspect we're not only going to continue to see but it's likely to increase as we go through 2027 and into 2028.\"\n\nThe Dow was also weighed down by losses in healthcare stocks like UnitedHealth as well as energy name Chevron and industrial giant Caterpillar .", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 02:52 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic prices IPO at $83 per share, above expected range, source tells CNBC", "full_content": "Anthropic priced its IPO at $83 per share on Wednesday, a person familiar told CNBC, above the expected range, setting the stage for the Claude creator's eagerly awaited Nasdaq listing and a historic moment for the artificial intelligence industry.\n\nAnthropic, founded in 2021, is expected to begin trading on the Nasdaq under the ticker symbol \"ANT\" on Thursday. After publicly unveiling its prospectus in October, Anthropic updated the document last week with an expected price range between $70 and $78 per share.\n\nThe company's listing is a major test for the AI industry, which has experienced a set of recent shocks, including a dramatic backlash that was felt at the polls in the midterm elections and last week's ouster of Nvidia CEO Jensen Huang . The market was already jittery on concerns that rising interest rates will make debt unaffordable for many data center developers and neoclouds.\n\nTech's biggest companies have significant exposure to Anthropic, as an investor, partner or customer. Amazon and Google both own stakes valued at over $100 billion, and a group of tech companies, including Google, Microsoft , Nvidia and Advanced Micro Devices agreed to collectively invest $26 billion in the IPO. Anthropic, meanwhile, is a buyer of costly systems from Nvidia, Google, Amazon and AMD.\n\n\"I think if we do this right, we can create an age of miracles where humanity is able to solve problems that have eluded us for millennia,\" Anthropic CEO Dario Amodei said in Anthropic's roadshow video . \"We have to make sure that all the risks, all the ways that things can go wrong with this technology, we very carefully address those risks as we bring the benefits and as we have a viable business at the same time.\"\n\nAmodei co-founded Anthropic alongside a handful of other researchers less than six years ago, after the group collectively defected from OpenAI.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 02:52 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Red Robin Gourmet Burgers earnings missed by $0.15, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:51 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CBOT corn futures drop to 4-1/2-month low on dollar strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:50 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Agilent declares quarterly dividend of 26.25 cents per share", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:50 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dow slumps over 500 pts as Fed minutes revive rate-hike fears", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Dow slumps over 500 pts as Fed minutes revive rate-hike fears Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Dow slumps over 500 pts as Fed minutes revive rate-hike fears SECTIONS Dow slumps over 500 pts as Fed minutes revive rate-hike fears Reuters Last Updated: Nov 19, 2026, 02:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Investors reacted to mixed performance in US stock markets, particularly after Nvidia's quarterly results. The Nasdaq closed higher while the Dow declined significantly, reflecting market volatility. Fed minutes indicated a hawkish stance toward inflation and potential interest rate hikes. Meanwhile, companies like TJX and Target reported positive forecasts ahead of the holiday season. Overall market sentiment remains cautious as future economic indicators emerge.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Nov 2026, 02:42 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold Slumps 3% to Lowest in Over a Year on Hawkish Fed Signals", "full_content": "(Bloomberg) -- Gold tumbled over 3% to the lowest in over a year after Federal Reserve officials made the case for more interest-rate hikes to tackle stubborn inflation.\n\nBullion fell as much as 3.1% on a third day of declines after Federal Reserve governor Christopher Waller said inflation remains headed in the wrong direction, urging the central bank to consider a larger, half-percentage-point rate hike at its December meeting.\n\n\u201cWe have to be a little more aggressive in our rate hikes to try to get inflation down,\u201d Waller said Wednesday on CNBC.\n\nSince the Fed\u2019s November meeting where interest rates were left unchanged, officials have signaled broad agreement over additional hikes, but offered differing views on the appropriate pace.\n\nStill, higher rates are typically a headwind for non-yielding bullion. A gauge of the US dollar also rose, making bullion priced in the US currency more expensive for most buyers.\n\nThe precious metal has fallen around 30% since the US-Iran war began in late February, as higher energy costs fueled inflation and pushed central banks to tighten monetary policy. The market is pricing in three quarter-point increases by June.\n\n\u201cIt is a tough environment for gold, particularly with buying interest still subdued,\u201d said Christopher Wong, a strategist at Oversea-Chinese Banking Corp. He said the market would stay cautious in the absence of any catalyst for a reversal.\n\nFor the next clues on the Fed\u2019s rate path, investors will be focused on minutes from the central bank\u2019s October meeting due for release later Wednesday. In remarks earlier this week, Fed Chair Kevin Warsh steered clear of offering any direct comment on monetary policy, in line with his stated preference not to provide near-term guidance on rates.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 02:40 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia sinks after earnings, dragging down neoclouds CoreWeave, Iren", "full_content": "Nvidia shares declined another 2.89% Wednesday after the company issued its first earnings report since the departure of former CEO Jensen Huang . The stock is down more than 13% over the past week.\n\nTrading in the neocloud companies was volatile throughout the day, as CoreWeave closed down 4.13%, Iren sank 3.61% and Nebius whipsawed, ending the trading day up 0.87%.\n\nNvidia's third-quarter revenue came in at $115.84 billion, more than $6 billion above analysts' expectations of $109.10 billion, while fourth-quarter guidance of $130 billion topped the $125.1 billion consensus, according to LSEG.\n\nThe semiconductor giant continues to navigate the fallout from Huang's resignation last week. Shortly before the results, Huang made his first public statement since resigning last week, saying that he was open to returning to the company, after an outpouring of support from prominent tech figures .\n\nNeocloud stocks today But Harvey Jones, the new and first-ever chair of Nvidia's board, said on the earnings call that the board does not intend to reinstate him as CEO.\n\n\u2033[Hyperscalers] are the ones that are right now feverishly looking for more focus in terms of the compute that we have available,\" interim CEO Colette Kress told Jim Cramer on CNBC's \"Mad Money.\"\n\n\"This concept that anything is changing in terms of any of our types of customers \u2014 that is just not true. They are all continuing to be with us, and we have a very deep breath of different customers.\"\n\nThe U.S. Commerce Department announced a legal change on Monday to try and stem China's access to the most advanced Nvidia chips \u2014 which are already under export controls effectively preventing their import into the country \u2014 by restricting Chinese companies' ability to access compute remotely in overseas data centers.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 02:36 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Australian Wheat Hits Two-Year High as Buyers Flee Black Sea", "full_content": "(Bloomberg) -- Australian wheat prices climbed to a two-year high as strong export demand overshadows the start of the harvest, with buyers racing to replace stalled Black Sea supplies.\n\nAn average of wheat prices at five of the country\u2019s largest grain ports reached the highest since June 2024 on Wednesday. Importers have been seeking alternative supplies as weeks of ship and port attacks stall vessel traffic from the Black Sea, a major exporting region. That has pushed more interest toward wheat from Australia, another of the world\u2019s largest suppliers.\n\nBuying has been strong from Southeast Asia, in particular, according to Dennis Voznesenski, agricultural economist at the Commonwealth Bank of Australia. Black Sea wheat typically dominates global markets just after the Northern Hemisphere harvest, but fresh supplies from the Southern Hemisphere are now coming online.\n\n\u201cThey have to get their wheat from somewhere and they can\u2019t get it from Ukraine and Russia,\u201d he said. \u201cIt\u2019s strong on the international front for those trying to substitute out Ukrainian and Russian wheat.\u201d\n\nIn October and November, shipping lineups have shown about 1.1 million tons of wheat destined for Indonesia and the Philippines, the most for that period in five years, according to a Bendigo Bank report.\n\nThe run-up in Australian prices, which track a premium white grade, stands in contrast to a slump in some other markets. Chicago futures have fallen in 10 of the past 11 weeks as American wheat struggles to attract foreign buyers.\n\nFor Australia, domestic demand from cattle feedlots is also supporting prices, according to Voznesenski. That is coinciding with recent rains that are delaying the start of the harvest, raising worries over crop quality and slowing new supplies from reaching the market.\n\nMore rain is expected this week, hampering wheat collection, although precipitation may be more limited next week, according to weather forecaster Vaisala.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 02:33 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018Nvidia\u2019s turmoil has me spooked\u2019: Should I sell my stocks and buy real estate \u2014 or ride out the storm?", "full_content": "Tempted to ditch stocks for property or CDs? Take a deep breath before making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 02:30 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Fed minutes show growing unease about the outlook for inflation", "full_content": "WASHINGTON, DC - SEPTEMBER 16: Federal Reserve Chair Kevin Warsh speaks during a news conference following Federal Open Market Committee meetings at Federal Reserve Headquarters on September 16, 2026 in Washington, DC. The Federal Reserve raised interest rates by a quarter of a percentage point in the first increase since 2023. (Photo by Andrew Harnik/Getty Images) *** BESTPIX ***", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 02:21 AM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Dow Falls as Nvidia Earnings Fail to Soothe Investors' Nerves - WSJ", "full_content": "Stock Market Today: Dow Falls as Nvidia Earnings Fail to Soothe Investors' Nerves WSJ Nvidia delivered a monster quarter, then its new leaders stumbled on the earnings call Yahoo Finance Dow drops more than 500 points; S&P 500 falls for fifth day as Nvidia sells off: Live updates CNBC Wall Street mixed after Nvidia earnings, Fed minutes Reuters Four takeaways from Nvidia\u2019s first earnings report after Jensen Huang scandal CNN", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 01:51 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic Leveraged ETF Race Heats Up Even Before Stock\u2019s Debut", "full_content": "(Bloomberg) -- A slew of leveraged ETFs tied to SpaceX launched soon after its public debut, but only one managed to attract meaningful assets. That experience has raised the stakes for Anthropic: Issuers are racing to get out front in hopes that their fund becomes the one that captures the bulk of investor dollars.\n\nProviders have filed for more than 20 exchange-traded products to amplify daily moves on the Claude chatbot maker once it goes public, both on the upside and the downside, as firms including Direxion, ProShares and GraniteShares jostle for a first-mover advantage, according to a Bloomberg Intelligence tally. And it\u2019s all happening before the IPO.\n\nFor the issuers, it\u2019s a simple calculation: whoever can be first to market \u2014 at a time when enthusiasm is at its peak \u2014 is more likely to attract a disproportionate set of retail dollars. Few public debuts promise as much hype as Anthropic\u2019s, which is on the cusp of potentially pricing the biggest IPO on record, Bloomberg News has reported.\n\nThe SpaceX experience showed issuers just how lopsided the payoff can be.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Dow Drops As Nvidia Probe Deepens; Fed Minutes Loom (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Dow Drops As Nvidia Probe Deepens; Fed Minutes Loom (Live Coverage) Investor's Business Daily Stock market today: Dow slides, S&P 500 and Nasdaq seesaw as Nvidia clears earnings hurdle, Anthropic prepares to price its IPO Yahoo Finance U.S. Markets Closed Mixed Wednesday As Okta Led, Humana Lagged Barron's Stock Market Today: Dow Jones, S&P 500, Nasdaq 100 Futures Trade Mixed Ahead of FOMC Minutes\u2014 NVDA, AAOI, PANW in Focus (UPDATED) TradingView Stock Market Today: Dow off 500 points, S&P 500 and Nasdaq mixed; Anthropic expected to price IPO \u2014 live updates MarketWatch", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 01:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia reverses, metals crash ahead of Anthropic IPO", "full_content": "Is this what it takes to clear room for $1.5 trillion of new supply?\n\nSlumping crypto prices, a big Nvidia reversal despite good earnings, and now a sharp drop-off in metals prices from gold to copper \u2014 cross-asset selling has traders wondering if Anthropic's incoming IPO is spurring a rotation trade with the aim of freeing up cash to buy stock in the AI giant when it goes public on Thursday.\n\nShares of Nvidia swung from $164 overnight to below $152 during Wednesday's trading session despite smashing analysts' expectations on revenue and guidance. Options volume on the stock was almost three times the average and showed a bullish bias despite the reversal, with almost twice as many calls trading versus puts, Cboe LiveVol data show.\n\nMeanwhile, metals prices fell across the board, led by a 5% sell-off in copper futures to the lowest since April. Gold futures lost more than 3% to $3,744, the lowest since September 2025, despite Treasury yields slipping on the session.\n\nAlmost 300,000 options traded on the SPDR GLD Shares ETF (GLD) , with a slight bias towards calls. The catch for gold bugs is that more calls looked like they were initiated by sellers, according to Cboe LiveVol data, which show 52,000 calls sold on the bid versus 45,000 calls bought on the ask.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold drops to 14-month low as dollar, yields rise on hawkish Fed rhetoric", "full_content": "Nov 18 (Reuters) - Gold sank over 3% to a more-than-one-year low on Wednesday as hawkish Federal Reserve signals raised expectations of higher interest rates, boosting the dollar and Treasury yields.\n\nSpot gold fell 3.2% to $3,726.19 per ounce by 2:30 p.m. ET (1530 GMT). It had hit its lowest level since September 2025 earlier in the session at $3,719.55 an ounce.\n\nMinutes of the Fed's October meeting showed officials saw a growing risk that they might need to intensify efforts to control inflation, even as they agreed to keep interest rates steady for the moment.\n\n\"Gold won't find much relief from the Fed minutes as the overwhelming majority sees further hikes, with a couple broaching a 50bps move if inflation disappoints. Fed will hike until inflation turns, but it's not an emergency. Barring a quick reversal, today's damage suggests a probe of 3350-3450 in the coming weeks,\" independent analyst Tai Wong said.\n\nThe minutes echoed hawkish comments from US Federal Reserve Governor Christopher Waller, who said the Fed needs to get more aggressive in its response to inflation, and either approve a half-point hike in December or communicate a faster pace of rate increases in 2027.\n\nOn Tuesday, Fed officials John Williams and Alberto Musalem also signalled further rate hikes may be needed to curb inflation.\n\n\"We believe the selloff reflects mounting pressure from a strengthening US dollar, rising Treasury yields and expectations of further monetary tightening,\" said Naeem Aslam, CIO, Zaye Capital Markets. [US/]\n\nThe dollar strengthened to a fresh 19-month high on Wednes
