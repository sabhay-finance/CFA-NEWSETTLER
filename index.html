<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Rising sulphur prices put fertiliser sector under pressure, threaten higher subsidy burden", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Rising sulphur prices put fertiliser sector under pressure, threaten higher subsidy burden The Economic Times daily newspaper is available online now. Read Today's Paper Rising sulphur prices put fertiliser sector under pressure, threaten higher subsidy burden SECTIONS Rising sulphur prices put fertiliser sector under pressure, threaten higher subsidy burden By Ashish Pandey , ET Online Last Updated: Sep 24, 2026, 12:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Landed sulphur prices in India have doubled since January to around $1,050-1,100 a tonne, according to industry estimates.\n\nThe industry has been seeking further revision or pass-through support as input costs have risen.\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "24 Sep 2026, 12:58 PM IST", "pub_date_relative": "10m ago"}, {"title": "\u20b985,000 crore gone! PB Fintech to HDFC Bank \u2014 these 5 financial stocks witness highest wealth erosion on IRDAI's move", "full_content": "Financial stocks came under heavy selling pressure on Thursday after the Insurance Regulatory and Development Authority of India (IRDAI) proposed changes to insurance distribution and commission structures. The selloff erased around \u20b9 1.12 lakh crore in market capitalisation across 12 financial stocks, with Bajaj Finance , PB Fintech , HDFC Bank and Axis Bank accounting for a large portion of the decline.\n\nBajaj Finance recorded the biggest decline in market value among the stocks tracked, with around \u20b9 29,000 crore wiped out. PB Fintech followed with an erosion of nearly \u20b9 20,000 crore, while HDFC Bank and Axis Bank lost around \u20b9 15,000 crore and \u20b9 14,000 crore, respectively. Meanwhile, HDFC Life lost over \u20b9 7,000 crore.\n\nThe immediate concern was IRDAI's consultation paper proposing a revamp of the way insurers and distributors are compensated. The regulator has proposed linking commissions more closely to the nature and complexity of insurance products, the effort involved in selling them and the distribution channel used.\n\nThe proposed framework would put tighter limits on commissions across health, motor and life insurance, while also seeking changes to the economics of insurance sold through banks and other distribution platforms. IRDAI has proposed a 15%-20% commission cap for new health insurance policies, with renewals and porting subject to a 5%-10% limit.\n\nFor life insurance, the proposed first-year commission ceiling would range from 5% to 20%, depending on the policy's premium payment term. The regulator has also proposed a 5%-10% commission cap on personal accident cover in motor insurance.\n\nAnother key proposal is to prevent banks and other lenders from making insurance purchases compulsory alongside loans.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 12:58 PM IST", "pub_date_relative": "10m ago"}, {"title": "Nifty 50 crossed 26K for first time 2 yrs ago, now down 3000 points from record high but one factor may trigger bull run", "full_content": "Stock market latest news: Exactly two years ago, on 24 September 2024, the Nifty 50 index crossed the landmark 26,000 level for the first time ever. The bull trend continued in the Indian stock market , with the index climbing to new peaks. The existing record high of the Nifty index is 26,340, which it touched on 2nd January 2026. In fact, the Nifty 50 index touched successive highs of 26,328.55 and 26,340 on this date. After today's stock market crash, the Nifty 50 index is currently oscillating around 23,160, which is over 3,000 points below the existing record high of 23,340.\n\nAccording to stock market experts, the key benchmark indices of the Indian stock market are reeling under pressure due to the over-stretched US-Iran war. They said that the US-Iran war has given birth to an energy crisis after the closure of the Strait of Hormuz. Crude oil prices have remained elevated, with Brent Crude oscillating around $100 per barrel or higher for an extended period, putting pressure on the global economy, including India. As soaring fuel prices squeeze industrial margins amid rising input costs, inflation is a major concern for India and other countries.\n\nThey said that FIIs outflow, inflation concern, and pressure on the company earnings are interlinked, and in the wake of the resolution of the Strait of Hormuz looking far flung, the Indian market is looking for a fresh trigger, as the market has already discounted the US-Iran war, as we saw in the case of the Russia-Ukraine war.\n\nSpeaking on the fresh trigger, which can ignite a fresh bull trend in the Indian stock market, Sandeep Pandey, Co-founder of Basav Capital, said, \u201cThe Indian stock market has already discounted the US-Iran war, as we saw earlier during the Russia-Ukraine war.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 12:50 PM IST", "pub_date_relative": "18m ago"}, {"title": "Why is H&M stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:47 PM IST", "pub_date_relative": "21m ago"}, {"title": "Why is Raspberry Pi stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago"}, {"title": "Treasury yields continue to rise after 10-year hit 19-year high as investors ramp-up rate hike bets", "full_content": "Treasury yields maintained their upward momentum early Thursday after hitting a 19-year high in the previous session, following a U.S. business activity print that amplified expectations for Federal Reserve interest rate hikes.\n\nThe benchmark 10-year Treasury yield was up one basis point to 5.124%, after reaching a 19-year high on Wednesday, jumping more than 13 basis points to 5.104%. Meanwhile, the 30-year Treasury bond was up over one basis point to 5.42%. The 2-year Treasury note yield was little changed at 4.895%.\n\nIt comes amid a global government bond selloff , with Japan's 10-year JGB yield rising 8 basis points to 3.055%, the highest since August 1996. U.K. Gilts and German Bunds also moved higher.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nSeveral factors drove the Treasury selloff, including stronger-than-expected U.S. economic activity, hawkish commentary from a Federal Reserve official, and high oil prices.\n\nS&P Global's purchasing managers' index, released on Wednesday, showed that services PMI rose to 58.7 in September, the highest level in almost five years. Its manufacturing counterpart was up to 56.7, a level not seen in over four years.\n\nThe data drove expectations of more rate hikes, with traders last pricing in a 70% chance that the Federal Open Market Committee will increase rates again in its October meeting, per the CME Group's FedWatch tool .\n\nFed Governor Michael Barr said on Wednesday that \"further policy adjustments\" are likely to come to bring inflation down to target.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago"}, {"title": "IPO GMPs: Runwal Enterprises IPO, German Green Steel IPO to Acevector IPO | What grey market hints ahead of opening?", "full_content": "The primary market is set for a busy stretch, with four IPOs scheduled to open for public subscription on 25 September, including companies from real estate, steel, networking, and digital commerce looking to raise a combined \u20b9 1,776 crore. The issues will remain open until 29 September, giving investors a packed week of IPO activity across diverse sectors.\n\nLet's take a look at grey market premium (GMP) trends ahead of opening:\n\nRunwal Enterprises IPO GMP today, or grey market premium, is +17. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Runwal Enterprises share price was indicated at \u20b9 322 apiece, which is 5.57% higher than the IPO price of \u20b9 305.\n\nIn the past three sessions, the IPO GMP has shown considerable stability, with fluctuations confined to Re -1 and a GMP range of Re 1. The present IPO GMP is at \u20b9 17, reflecting a fairly consistent sentiment in the grey market, as noted by analysts.\n\nReal estate developer Runwal Enterprises Ltd is set to launch its \u20b9 500-crore IPO on 25 September, marking its entry into the primary market.\n\nThe company has fixed a price band of \u20b9 290\u2013 \u20b9 305 per equity share, according to a public announcement.\n\nThe issue comprises an entirely fresh issue of equity shares worth up to \u20b9 500 crore. The Mumbai-based developer has reduced the size of the IPO from its earlier plan of a \u20b9 1,000-crore fresh issue.\n\nGerman Green Steel IPO GMP today, or grey market premium, is +24. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of German Green Steel share price was indicated at \u20b9 163 apiece, which is 17.27% higher than the IPO price of \u20b9 139.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 12:45 PM IST", "pub_date_relative": "23m ago"}, {"title": "NSE IPO: India's biggest exchange lists at \u20b91,800 per share; gains 5% after flat debut", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 12:44 PM IST", "pub_date_relative": "24m ago"}, {"title": "Oil extends gains on little sign of progress in US-Iran talks", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:43 PM IST", "pub_date_relative": "25m ago"}, {"title": "US packaged food makers could help cut diet-related deaths, study shows", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "Natural Gas breaks $3.02: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "Gold tests $4,310 support as RSI nears oversold: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "London Gas Oil coiled in $1,435-$1,517 range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "Copper stuck between $6.710 support and $6.830 resistance: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:41 PM IST", "pub_date_relative": "28m ago"}, {"title": "Hang Seng tests 24,600 support in bearish triangle: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:40 PM IST", "pub_date_relative": "28m ago"}, {"title": "Bitcoin slips below 20 SMA at $84,076: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:40 PM IST", "pub_date_relative": "28m ago"}, {"title": "Solar Stock In Focus: Suzlon Energy Share Price Falls Over 3%. Here's Why", "full_content": "Suzlon Energy shares fell over 3% in Thursday\u2019s trade as around 3.2 crore shares changed hands on stock exchanges. Details of the reported block deal are yet to emerge.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 12:34 PM IST", "pub_date_relative": "34m ago"}, {"title": "Did your agent mis-sell insurance? IRDAI proposes clawing back their commission under new reforms", "full_content": "Buying an insurance policy often involves relying on an agent, bank employee or other salesperson to explain what the policy covers, how much it costs and whether it actually suits your needs. If that advice is misleading, the financial consequences can extend well beyond the premium paid by the customer.\n\nThe Insurance Regulatory and Development Authority of India (IRDAI) has proposed a measure that could directly affect the person selling the policy. Under its consultation paper on insurance distribution reforms, insurers would be expected to claw back commission when an instance of mis-selling is established. The proposal is aimed at making the person selling the policy financially accountable for such conduct.\n\nAt present, a consumer may not know much about the incentives earned by the person selling an insurance policy. IRDAI's proposal seeks to make the sales process more accountable by linking the identity of the salesperson to the policy sold.\n\nThe regulator has proposed tagging the functional identity of specified persons, salespersons and PoSPs of insurance distribution entities, as well as agents or associates of insurers, to the policies they sell. It has also proposed making information about instances of mis-selling available in the public domain through the Public Insurance Registry.\n\nFor a consumer, the significance is that a salesperson's record of mis-selling could potentially become part of the information available about that person.\n\nIRDAI's consultation paper proposes a detailed suitability framework for insurers and insurance distribution entities. For life insurance sales above a defined ticket size, insurers would be required to document the customer's needs and suitability and maintain an audit trail. A customer's signature or consent alone would not absolve the insurer or intermediary if the product sold was unsuitable.\n\nThe paper lists several examples of practices that could attract disincentives or regulatory action.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 12:28 PM IST", "pub_date_relative": "40m ago"}, {"title": "PB Fintech loses Rs 22,700 cr from market value as stock crashes 26% after IRDAI\u2019s reform plans. What Citi and Jefferies are warning", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PB Fintech loses Rs 22,700 cr from market value as stock crashes 26% after IRDAI\u2019s reform plans. What Citi and Jefferies are warning PB Fintech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PB Fintech loses Rs 22,700 cr from market value as stock crashes 26% after IRDAI\u2019s reform plans. What Citi and Jefferies are warning SECTIONS PB Fintech loses Rs 22,700 cr from market value as stock crashes 26% after IRDAI\u2019s reform plans. What Citi and Jefferies are warning By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 24, 2026, 12:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PB Fintech shares plunged 26%, wiping out nearly Rs 22,703 crore from its market capitalisation after IRDAI proposed changes to insurance commission structures. Jefferies flagged risks to distributor earnings, while Citi warned of a potential sharp compression in distribution economics across several high-margin insurance categories.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 12:21 PM IST", "pub_date_relative": "47m ago"}, {"title": "NSE Listing To Provide More Depth, Breadth To Market, Says Nilesh Shah Of Envision Capital", "full_content": "NSE shares were listed at Rs 1,800 apiece on the BSE, a premium of 0.84% to the issue price of Rs 1,785 per share. The stock gained as much as 5.21% from its issue price to a high of Rs 1,878.00 apiece.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 12:21 PM IST", "pub_date_relative": "47m ago"}], "cfa": [{"title": "Rising sulphur prices put fertiliser sector under pressure, threaten higher subsidy burden", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Rising sulphur prices put fertiliser sector under pressure, threaten higher subsidy burden The Economic Times daily newspaper is available online now. Read Today's Paper Rising sulphur prices put fertiliser sector under pressure, threaten higher subsidy burden SECTIONS Rising sulphur prices put fertiliser sector under pressure, threaten higher subsidy burden By Ashish Pandey , ET Online Last Updated: Sep 24, 2026, 12:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Landed sulphur prices in India have doubled since January to around $1,050-1,100 a tonne, according to industry estimates.\n\nThe industry has been seeking further revision or pass-through support as input costs have risen.\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "24 Sep 2026, 12:58 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u20b985,000 crore gone! PB Fintech to HDFC Bank \u2014 these 5 financial stocks witness highest wealth erosion on IRDAI's move", "full_content": "Financial stocks came under heavy selling pressure on Thursday after the Insurance Regulatory and Development Authority of India (IRDAI) proposed changes to insurance distribution and commission structures. The selloff erased around \u20b9 1.12 lakh crore in market capitalisation across 12 financial stocks, with Bajaj Finance , PB Fintech , HDFC Bank and Axis Bank accounting for a large portion of the decline.\n\nBajaj Finance recorded the biggest decline in market value among the stocks tracked, with around \u20b9 29,000 crore wiped out. PB Fintech followed with an erosion of nearly \u20b9 20,000 crore, while HDFC Bank and Axis Bank lost around \u20b9 15,000 crore and \u20b9 14,000 crore, respectively. Meanwhile, HDFC Life lost over \u20b9 7,000 crore.\n\nThe immediate concern was IRDAI's consultation paper proposing a revamp of the way insurers and distributors are compensated. The regulator has proposed linking commissions more closely to the nature and complexity of insurance products, the effort involved in selling them and the distribution channel used.\n\nThe proposed framework would put tighter limits on commissions across health, motor and life insurance, while also seeking changes to the economics of insurance sold through banks and other distribution platforms. IRDAI has proposed a 15%-20% commission cap for new health insurance policies, with renewals and porting subject to a 5%-10% limit.\n\nFor life insurance, the proposed first-year commission ceiling would range from 5% to 20%, depending on the policy's premium payment term. The regulator has also proposed a 5%-10% commission cap on personal accident cover in motor insurance.\n\nAnother key proposal is to prevent banks and other lenders from making insurance purchases compulsory alongside loans.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 12:58 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty 50 crossed 26K for first time 2 yrs ago, now down 3000 points from record high but one factor may trigger bull run", "full_content": "Stock market latest news: Exactly two years ago, on 24 September 2024, the Nifty 50 index crossed the landmark 26,000 level for the first time ever. The bull trend continued in the Indian stock market , with the index climbing to new peaks. The existing record high of the Nifty index is 26,340, which it touched on 2nd January 2026. In fact, the Nifty 50 index touched successive highs of 26,328.55 and 26,340 on this date. After today's stock market crash, the Nifty 50 index is currently oscillating around 23,160, which is over 3,000 points below the existing record high of 23,340.\n\nAccording to stock market experts, the key benchmark indices of the Indian stock market are reeling under pressure due to the over-stretched US-Iran war. They said that the US-Iran war has given birth to an energy crisis after the closure of the Strait of Hormuz. Crude oil prices have remained elevated, with Brent Crude oscillating around $100 per barrel or higher for an extended period, putting pressure on the global economy, including India. As soaring fuel prices squeeze industrial margins amid rising input costs, inflation is a major concern for India and other countries.\n\nThey said that FIIs outflow, inflation concern, and pressure on the company earnings are interlinked, and in the wake of the resolution of the Strait of Hormuz looking far flung, the Indian market is looking for a fresh trigger, as the market has already discounted the US-Iran war, as we saw in the case of the Russia-Ukraine war.\n\nSpeaking on the fresh trigger, which can ignite a fresh bull trend in the Indian stock market, Sandeep Pandey, Co-founder of Basav Capital, said, \u201cThe Indian stock market has already discounted the US-Iran war, as we saw earlier during the Russia-Ukraine war.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 12:50 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Treasury yields continue to rise after 10-year hit 19-year high as investors ramp-up rate hike bets", "full_content": "Treasury yields maintained their upward momentum early Thursday after hitting a 19-year high in the previous session, following a U.S. business activity print that amplified expectations for Federal Reserve interest rate hikes.\n\nThe benchmark 10-year Treasury yield was up one basis point to 5.124%, after reaching a 19-year high on Wednesday, jumping more than 13 basis points to 5.104%. Meanwhile, the 30-year Treasury bond was up over one basis point to 5.42%. The 2-year Treasury note yield was little changed at 4.895%.\n\nIt comes amid a global government bond selloff , with Japan's 10-year JGB yield rising 8 basis points to 3.055%, the highest since August 1996. U.K. Gilts and German Bunds also moved higher.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nSeveral factors drove the Treasury selloff, including stronger-than-expected U.S. economic activity, hawkish commentary from a Federal Reserve official, and high oil prices.\n\nS&P Global's purchasing managers' index, released on Wednesday, showed that services PMI rose to 58.7 in September, the highest level in almost five years. Its manufacturing counterpart was up to 56.7, a level not seen in over four years.\n\nThe data drove expectations of more rate hikes, with traders last pricing in a 70% chance that the Federal Open Market Committee will increase rates again in its October meeting, per the CME Group's FedWatch tool .\n\nFed Governor Michael Barr said on Wednesday that \"further policy adjustments\" are likely to come to bring inflation down to target.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IPO GMPs: Runwal Enterprises IPO, German Green Steel IPO to Acevector IPO | What grey market hints ahead of opening?", "full_content": "The primary market is set for a busy stretch, with four IPOs scheduled to open for public subscription on 25 September, including companies from real estate, steel, networking, and digital commerce looking to raise a combined \u20b9 1,776 crore. The issues will remain open until 29 September, giving investors a packed week of IPO activity across diverse sectors.\n\nLet's take a look at grey market premium (GMP) trends ahead of opening:\n\nRunwal Enterprises IPO GMP today, or grey market premium, is +17. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Runwal Enterprises share price was indicated at \u20b9 322 apiece, which is 5.57% higher than the IPO price of \u20b9 305.\n\nIn the past three sessions, the IPO GMP has shown considerable stability, with fluctuations confined to Re -1 and a GMP range of Re 1. The present IPO GMP is at \u20b9 17, reflecting a fairly consistent sentiment in the grey market, as noted by analysts.\n\nReal estate developer Runwal Enterprises Ltd is set to launch its \u20b9 500-crore IPO on 25 September, marking its entry into the primary market.\n\nThe company has fixed a price band of \u20b9 290\u2013 \u20b9 305 per equity share, according to a public announcement.\n\nThe issue comprises an entirely fresh issue of equity shares worth up to \u20b9 500 crore. The Mumbai-based developer has reduced the size of the IPO from its earlier plan of a \u20b9 1,000-crore fresh issue.\n\nGerman Green Steel IPO GMP today, or grey market premium, is +24. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of German Green Steel share price was indicated at \u20b9 163 apiece, which is 17.27% higher than the IPO price of \u20b9 139.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 12:45 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NSE IPO: India's biggest exchange lists at \u20b91,800 per share; gains 5% after flat debut", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 12:44 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Natural Gas breaks $3.02: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold tests $4,310 support as RSI nears oversold: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Hang Seng tests 24,600 support in bearish triangle: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:40 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bitcoin slips below 20 SMA at $84,076: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 12:40 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Solar Stock In Focus: Suzlon Energy Share Price Falls Over 3%. Here's Why", "full_content": "Suzlon Energy shares fell over 3% in Thursday\u2019s trade as around 3.2 crore shares changed hands on stock exchanges. Details of th ion entities. For life insurance sales above a defined ticket size, insurers would be required to document the customer's needs and suitability and maintain an audit trail. A customer's signature or consent alone would not absolve the insurer or intermediary if the product sold was unsuitable.\n\nThe paper lists several examples of practices that could attract disincentives or regulatory action.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 12:28 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PB Fintech loses Rs 22,700 cr from market value as stock crashes 26% after IRDAI\u2019s reform plans. What Citi and Jefferies are warning", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PB Fintech loses Rs 22,700 cr from market value as stock crashes 26% after IRDAI\u2019s reform plans. What Citi and Jefferies are warning PB Fintech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PB Fintech loses Rs 22,700 cr from market value as stock crashes 26% after IRDAI\u2019s reform plans. What Citi and Jefferies are warning SECTIONS PB Fintech loses Rs 22,700 cr from market value as stock crashes 26% after IRDAI\u2019s reform plans. What Citi and Jefferies are warning By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 24, 2026, 12:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PB Fintech shares plunged 26%, wiping out nearly Rs 22,703 crore from its market capitalisation after IRDAI proposed changes to insurance commission structures. Jefferies flagged risks to distributor earnings, while Citi warned of a potential sharp compression in distribution economics across several high-margin insurance categories.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 12:21 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NSE Listing To Provide More Depth, Breadth To Market, Says Nilesh Shah Of Envision Capital", "full_content": "NSE shares were listed at Rs 1,800 apiece on the BSE, a premium of 0.84% to the issue price of Rs 1,785 per share. The stock gained as much as 5.21% from its issue price to a high of Rs 1,878.00 apiece.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 12:21 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Oil India is beating ONGC. Can its production edge last?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nShares of Oil & Natural Gas Corp.\u2019s (ONGC) have fallen by 2% over the past three months, while those of smaller peer Oil India have gained 13%. Since the West Asia war began, Oil India\u2019s shares are down 2%, while ONGC\u2019s have fallen faster at 16\u2014a striking contrast with crude oil prices, which are about 35% above their pre-war levels.\n\nWhile the state-owned oil exploration and production companies have faced pressure amid weak equity market sentiment, the diverging trend is notable, as both have broadly similar gross price realizations, which are linked to crude import prices, and near identical royalty structures.\n\nIndia\u2019s average price of imported crude oil in the September quarter (Q2FY27) so far stands at about $96 per barrel, as per data from Petroleum Planning & Analysis Cell. While this is below $101 per barrel in Q1FY27, it is 37% higher year-on-year and should support near-term earnings of both. In Q1, ONGC\u2019s and Oil India\u2019s standalone Ebitda, excluding exploratory wells cost write-off, had increased 67% and 110% year-on-year to \u20b9 29,250 crore and \u20b9 4,300 crore, respectively, aided by higher crude oil prices.\n\nThe key difference, however, is the expectation of higher sales volume, adding to Oil India\u2019s earnings visibility. According to Kotak Institutional Equities, Oil India\u2019s total oil and gas sales volume is projected to grow by 13.8% in FY27 to 6.5 million tonnes of oil equivalent (mtoe), vis-a-vis a 2.4% rise for ONGC to 42 mtoe. In the first two months of Q2FY27, Oil India\u2019s crude oil production grew by 18%, while ONGC\u2019s dropped by 3%, notes JM Financial Institutional Securities. This follows a 12% growth for Oil India and a 3 fall for ONGC in Q1.\n\nOil India\u2019s shares also seem to have benefitted from higher investor interest across midcaps, amid a lack of triggers for large caps. However, ONGC has a longer-term advantage thanks to its higher reserves.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 12:20 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NYSE, Blockchain.com explore tokenised versions of US-listed stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a NYSE, Blockchain.com explore tokenised versions of US-listed stocks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper NYSE, Blockchain.com explore tokenised versions of US-listed stocks SECTIONS NYSE, Blockchain.com explore tokenised versions of US-listed stocks By Anupam Nagar , ETMarkets.com Last Updated: Sep 24, 2026, 12:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NYSE and Blockchain.com are exploring blockchain-based versions of US-listed stocks and ETFs, as financial institutions accelerate tokenisation efforts while regulators address questions around ownership, trading and investor protection.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 12:20 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Penny stock under 10 rupees hits 5% upper circuit despite stock market crash; here's why", "full_content": "Penny stock under 10 rupees: Elitecon International share price hit 5% upper circuit in Thursday's trading session despite downward rally in the Indian stock market. The stock opened at \u20b9 9.35 apiece today, as compared to previous close of \u20b9 9.14 on Wednesday and touched an intraday high of \u20b9 9.59 on 24 September.\n\nElitecon International shares extended their upward momentum for the fifth consecutive session on Thursday. The stock hit the upper circuit for the second straight day.\n\nMeanwhile, Indian benchmark indices opened sharply lower as investors reacted to the US 10-year Treasury yield climbing above 5.10%. Both Sensex and Nifty began the session with a gap-down opening, with the Sensex dropping more than 500 points and the Nifty slipping below the 23,300 level.\n\nAccording to Anuj Gupta, SEBI Registeted Research Analyst, the stock rally came in amid ITC\u2019s latest cigarette price increases which has sharpen the bullish case for Elitecon International.\n\n\u201cA higher retail pricing benchmark could give an alternative manufacturer greater scope to compete for customers, improve product positioning and build a more profitable domestic business. The opportunity is not simply to follow prices higher. It is to turn a changing competitive landscape into incremental sales and stronger unit economics,\u201d Gupta said.\n\nHe further noted that dealer checked reported on September 23 indicate that ITC\u2019s Gold Flake Premium has moved from \u20b9 125 to \u20b9 135 for a 10-cigarette pack, an 8% increase.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 12:14 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bank strike from Sept 28-30: Why are employees demanding 5-day work week and pension tweak?", "full_content": "Banks across India could face disruption to in-branch operations from September 28 to 30, 2026, as the United Forum of Bank Unions (UFBU) has proposed a three-day nationwide strike to press for its key demands, including the implementation of a five-day banking week and pension reforms.\n\nThe proposed strike comes immediately after the weekend holidays on September 26 and 27, raising concerns of an effective five-day disruption to customer services. In response, the Finance Ministry held a meeting with the chief executives of public sector banks and regional rural banks on Monday.\n\nFollowing the meeting, it was decided that all PSBs and RRBs will remain open and operate normally on Sunday, September 27, the Finance Ministry said in a statement. The move is aimed at minimising disruption to banking services.\n\nThe main demand of the bank unions is the implementation of a five-day banking week, under which all Saturdays would be holidays. Banks currently remain closed on the second and fourth Saturdays of each month.\n\nTo justify the demand, the unions have pointed out that the Reserve Bank of India ( RBI ), the central government, and even the insurance sector already follow a five-day workweek. On top of that, the proposal has been pending since the 2024 wage settlement.\n\nHighlighting the workload faced by bank employees, All India Bank Officers' Confederation (AIBOC) Delhi President and All India Senior Vice President Kushal Gupta said that bankers work hard day and night and that the existing system is affecting their work-life balance.\n\n\u201cOur colleagues work hard day and night. This is impacting their work-life balance,\u201d he told news agency ANI .\n\nGupta also said t     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
