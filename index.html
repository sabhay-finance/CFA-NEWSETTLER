<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "ILT20 2026-27 Full Schedule And Live Streaming: Check All Fixtures, Dates, Timings, Venues", "full_content": "The fifth edition of the UAE-based T20 tournament will feature six teams and 34 matches, with defending champions Desert Vipers taking on MI Emirates in the opening fixture on November 21.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 11:00 AM IST", "pub_date_relative": "just now"}, {"title": "Zscaler stock jumps 20% on report that CrowdStrike in talks to buy security vendor", "full_content": "Zscaler shares surged 20% in extended trading on Friday after Bloomberg reported that CrowdStrike is in talks to buy the cybersecurity vendor.\n\nCrowdStrike declined to comment on the report. Zscaler didn't immediately respond to CNBC's request for comment.\n\nThe talks between the two cyber vendors are ongoing, Bloomberg reported, citing sources familiar in the matter.\n\nThe potential deal would create one of the largest cybersecurity companies to date.\n\nCrowdStrike has been one of the big cybersecurity winners in the AI boom, with its stock about doubling in value this year, lifting its market cap to $235 billion. Zscaler, meanwhile, is down 13% this year, pushing its market cap down to about $32 billion.\n\nThe company has made a slew of acquisitions in recent months to beef up security offerings in the new age of artificial intelligence.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 02:50 AM IST", "pub_date_relative": "just now"}, {"title": "Federal Reserve announces College Fed Challenge winners", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 4:15 p.m. EST Share --> --> --> --> --> --> The University of California, Los Angeles won the 23rd Annual National College Fed Challenge.\n\nThe University of California, Los Angeles (UCLA) won the 23rd annual national College Fed Challenge on Friday, a team competition that encourages undergraduate students to learn about the U.S. economy, monetary policymaking, and the role of the Federal Reserve System. Teams analyze economic and financial conditions and formulate a monetary policy recommendation, modeling the Federal Open Market Committee. The team, from Los Angeles, California, represented the San Francisco District and included Aarushi Maheshwari, Annika Chan, Atul Prasanth, Caitlyn Cox, Finn Karish, Eli Brooks (alternate), Kennedy Yang (alternate), Manasi Vartak (alternate), Ronojoy Borpujari (alternate), and Sahil Sudani (alternate). The team's advisers were Chris Surro and Ali Haider Ismail.\n\n\"I am very happy to congratulate the students who competed in this year's College Fed Challenge, especially the winners and finalists,\" said Federal Reserve Chairman Kevin Warsh. \"They took on the same big questions we policymakers face. I'm impressed by their talent, their rigor, and their eagerness to think hard about monetary policy and the economy.\"\n\nThis year's College Fed Challenge included 141 schools from 34 states across the nation, the most in the competition's history. Teams submitted video presentations or participated in local competitions last month. Twenty-one semi-finalist teams then participated in question-and-answer sessions held earlier this month, and seven finalists were invited to the Federal Reserve Board for the national finals.", "source": "Federal Reserve", "pub_date_str": "21 Nov 2026, 02:45 AM IST", "pub_date_relative": "6m ago"}, {"title": "Warsh wants Fed officials to talk less. Instead, they\u2019re talking more", "full_content": "In his first six months as Federal Reserve chairman, Kevin Warsh has diligently avoided signaling where he sees monetary policy and interest rates headed. His colleagues have been only too happy to fill the void.\n\nFed officials have been rushing to the microphones lately, voicing sometimes conflicting opinions on how the central bank should be handling an inflation bug that the economy can't seem to shake.\n\nMost agree that rates should be raised \u2014 and soon. Some are willing to hike at a measured pace as conditions play out, while others, such as Governor Christopher Waller and St. Louis Fed President Alberto Musalem , entertain the thought of more aggressive hikes in a shorter period of time.\n\nLargely on the sidelines in the debate is Warsh, who has expressed disdain for that sort of forward guidance and argued that it handcuffs policymakers long before they actually have to make a decision. But that hasn't stopped most of the other 18 officials who sit in on Federal Open Market Committee meetings.\n\nIn fact, according to a Bank of America analysis, there has been more so-called Fedspeak in the past two weeks than in any similar period since the start of 2025.\n\n\"Warsh's refusal to guide markets might be encouraging the rest of the FOMC to speak more, not less,\" Bank of America economist Aditya Bhave said in a note Thursday.\n\n\"There is always a range of views across the 19 FOMC participants. Typically, the Chair would weigh in, indicating to markets whether the hawks or doves are in ascendence,\" he added. \"Absent this leadership, however, both sides might feel incentivized to speak more often and more forcefully.\"\n\nThe increasingly vocal debate comes at a critical time for the Fed and has myriad policy implications.", "source": "CNBC Finance", "pub_date_str": "21 Nov 2026, 02:40 AM IST", "pub_date_relative": "10m ago"}, {"title": "S&P 500 and Dow close in correction; Nasdaq erases 2026 gain as AI rout picks up steam: Live updates", "full_content": "Stocks were slammed on Friday, closing out a brutal week for markets as the much-hyped Anthropic IPO caused investors to take profits on the artificial intelligence-led rally rather than revive it. The Nasdaq Composite turned negative for the year, and the S&P 500 entered correction territory alongside the Dow Jones Industrial Average .\n\nThe tech-heavy Nasdaq shed 5.28% and was down 2.7% year to date. The broad market S&P 500 dropped 3.7%, while the blue-chip Dow fell 949.73 points, or 1.93%. Both the S&P 500 and Dow moved 10% below their closing records. The Nasdaq-100 plummeted 5.6% and entered a bear market on an intraday basis, down 20% from its recent high.\n\nNasdaq Composite, year-to-date Anthropic lost 9%, giving back most of its 17% jump in its Nasdaq debut Thursday and pressuring the broader AI trade. Chipmakers Advanced Micro Devices and Nvidia slid 13% each. Nvidia saw selling pressure increase after Reuters reported that the U.S. Securities and Exchange Commission is exploring possible accounting issues at the company. Micron Technology dropped almost 14%.\n\nThose declines in tech built on the losses seen in Thursday's horrid session, where the major averages each losing more than 2%, and the Dow closing below the key 50,000 level for the first time since June.\n\n\"This is not just a valuation-driven correction. It's becoming broader,\" said Massimo Santicchia, head of U.S. equities at Procyon. \"Right now, it's definitely risk-off.\"\n\nThe losses are alarming investors who were hopeful that Nvidia's earnings and Anthropic's IPO would revive enthusiasm for the AI trade. Now, the market looks to be on the cusp of a true capitulation after getting roiled in recent weeks with a series of negative headlines.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 02:37 AM IST", "pub_date_relative": "13m ago"}, {"title": "Anthropic falls 9% in first full day of trading as tech stocks get shellacked", "full_content": "Anthropic shares fell 9% on Friday to close their first full day of trading, as concerns about the artificial intelligence trade continued to drag tech stocks lower.\n\nThe stock opened at $111.50 on the Nasdaq Thursday after Anthropic raised $81.3 billion in the largest IPO of all time, but shares slid throughout the day and closed at $97.17.\n\nInvestors had been eagerly awaiting Anthropic's debut in the hopes that it could revitalize the AI trade, which has come under pressure following Jensen Huang's shocking ouster as Nvidia CEO, souring public sentiment around data centers and concerns that rising interest rates could affect plans for a multi-trillion-dollar AI infrastructure buildout .\n\nShares of chipmakers Nvidia and Advanced Micro Devices both plummeted more than 13%, and hyperscalers, including Amazon , Google and Microsoft , also closed lower on Friday.\n\nAnthropic stock Treasury Secretary Scott Bessent touted Anthropic as an \"only in America story\" in an interview with CNBC on Friday, adding that the company has been \"very cooperative\" in its work to pre-test models with the Trump administration.\n\n\"Anthropic in 2021 was seven people sitting around during Covid in a park in San Francisco, with laptops and a dream, and then yesterday we saw the most valuable IPO in history,\" Bessent said.\n\nAnthropic's relationship with the government has been strained this year after two high-profile disputes spilled into the public. But the tensions between the two camps began to thaw in September, when Anthropic CEO Dario Amodei joined President Donald Trump for a private dinner at the White House.\n\nBessent said Friday that one of Anthropic's seven co-founders is going to make a large gift to Trump Accounts, the investment accounts that the administration set up for U.S. children, over the next few weeks. Tom Brown, Anthropic's chief compute officer, is that co-founder, according to a source briefed on his plans, who asked not to be named because the details are confidential.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 02:37 AM IST", "pub_date_relative": "14m ago"}, {"title": "Anthropic defied the odds in its record IPO. Now it has to reckon with AI market turbulence", "full_content": "The moment felt impossible. Between Jensen Huang's shocking exit from chip giant Nvidia , voters' rebuke of artificial intelligence in this month's midterm elections, and rising interest rates that threatened to stymie plans for a multitrillion-dollar infrastructure buildout, there seemed to be no way Anthropic could carry out an initial public offering. Anthropic's response? Let's go! \"Very few companies would've attempted it in this environment,\" said Byron Deeter , a partner at Bessemer Venture Partners, which counts Anthropic as its biggest investment ever, in an interview. \"These things collectively have been massively disruptive, yet the team stuck to its true north and got the largest financing in IPO history done, and it's just remarkable.\"\n\nAnthropic's stock jumped 17% in its Nasdaq debut on Thursday, closing at $97.17 per share and giving the Claude creator a market cap of roughly $1.8 trillion. That makes it the seventh-most valuable U.S. company, despite being less than six years old.\n\nThe shares sold off on Friday, closing at $88.30, just a few dollars above the IPO price. It's a reminder of the uncertainty richly valued companies face in their early days on the public market. Facebook had a tough first year after its IPO in 2012 due to concerns surrounding its mobile prospects. And after Uber's IPO in May 2019, shares of the ride-hailing company trended lower the rest of that year.\n\nEarlier on Thursday, the second floor of the Nasdaq was decorated in orange, Anthropic's signature color. Founders and backers were given Claude lapel pins that served as their ticket to the bell ringing, which was followed by a champagne toast ahead of the opening. With the first trade, the stock shot up to $111.50.\n\nAnthropic's stock The previous afternoon Anthropic raised $81.3 billion , topping Elon Musk's SpaceX for the largest IPO on record.\n\nIt was a wild feat, and Anthropic backers breathed a sigh of relief.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 02:36 AM IST", "pub_date_relative": "14m ago"}, {"title": "Gap names new Athleta CEO, says Old Navy turnaround is seeing signs of progress", "full_content": "Gap Inc. on Thursday announced Ashley Kechter will be the next president and CEO of its Athleta brand, effective Dec. 14.\n\nThe retailer also said Old Navy's turnaround is showing signs of progress, sending shares up more than 11% Friday.\n\nKechter comes to Gap from activewear retailer Vuori, where she was global president and oversaw the brand's global business strategy, marketing and financials. She was previously global brand president of Fabletics and began her career at Gap before that.\n\n\"I'm excited to return to Gap Inc. and partner with [Gap CEO Richard Dickson] and the team to strengthen our connection with customers and shape the brand's next chapter,\" Kechter said in a statement.\n\nThe announcement comes after Lululemon poached former Athleta CEO Maggie Gauger to be its chief product officer last month.\n\n\"Clearly, we're disappointed with Athleta's performance, and we recognize there's a lot of work ahead,\" Dickson told CNBC. \"We had been in rebuild mode, but now we're really in turnaround mode.\"\n\nDickson said the company is focused on getting back to its fundamentals: fabrications, feature, form, function and fit. Dickson added that Kechter will be conducting a \"comprehensive review\" of the brand to reposition Athleta for future success.\n\nWhile the execution of its strategy has thus far \"fallen short,\" Dickson said this new approach will allow Athleta to fully realize its potential.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 02:34 AM IST", "pub_date_relative": "16m ago"}, {"title": "Nvidia stock plunges 14%, wraps up longest weekly losing streak since 2008 financial crisis", "full_content": "The last time Wall Street was this down on Nvidia the chipmaker's flagship product was the GeForce graphics processor for high-end PC video games, and markets were reeling from the global financial crisis.\n\nNvidia shares tumbled 14% on Friday, sliding for a seventh straight day as investors grew increasingly concerned about life after co-founder Jensen Huang . The stock closed lower for a seventh consecutive week, the longest such stretch since 2008.\n\nShares of Nvidia are down 46% over the period, pushing the company's market cap down by about $2.6 trillion. The stock is now trading at roughly 8.4 times forward earnings, while Advanced Micro Devices is valued at 29 times profit for the next 12 months.\n\nOn Friday, Reuters reported that the Securities and Exchange Commission is exploring potential accounting issues at Nvidia, pushing the stock down further.\n\nOnce the most valuable company in the world, Nvidia now has a market cap of $3 trillion, putting it fourth behind Apple , Microsoft and Alphabet .\n\nNvidia is reeling from the removal of Huang, who resigned on Nov. 12, after multiple reported affairs , including one with a Chinese businesswoman who was allegedly a spy.\n\nHarvey Jones, Nvidia's newly appointed board chair, said earlier this week that Huang had resigned after \"disclosure of personal behavior inconsistent with the company's code of conduct, standards and cultural norms.\"\n\nBut the chipmaker's losing streak started before Nvidia was thrown into crisis as investors worried over the sustainability of the AI buildout, particularly after the midterm elections, and emerging competition in AI chips from Google and AMD.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 02:33 AM IST", "pub_date_relative": "17m ago"}, {"title": "Flowers Foods stock hits 52-week low at 4.91 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:31 AM IST", "pub_date_relative": "20m ago"}, {"title": "Here\u2019s what\u2019s been proven to help GLP-1 users from losing too much muscle from the drug", "full_content": "People taking Zepbound who engage in consistent resistance training can still get stronger even if they lose some of their muscle, according to a new study.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:31 AM IST", "pub_date_relative": "20m ago"}, {"title": "Mexican cell carriers facing widespread outages, users report", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:30 AM IST", "pub_date_relative": "20m ago"}, {"title": "US court ruling jeopardizes Sentinel Midstream\u2019s license for deepwater oil export project", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:30 AM IST", "pub_date_relative": "21m ago"}, {"title": "Strategic Education Inc stock hits 52-week low at 50.7 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:27 AM IST", "pub_date_relative": "23m ago"}, {"title": "Ionis Pharmaceuticals stock hits 52-week low at 26.54 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:27 AM IST", "pub_date_relative": "23m ago"}, {"title": "Liberty All Star Equity closed fund stock hits 52-week low at 5.4 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:27 AM IST", "pub_date_relative": "23m ago"}, {"title": "Amkor Technology stock hits 52-week low at $30.01", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:26 AM IST", "pub_date_relative": "25m ago"}, {"title": "Lineage Inc stock hits 52-week low at 31.23 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:26 AM IST", "pub_date_relative": "25m ago"}, {"title": "SkyWest stock hits 52-week low at $77.66", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:26 AM IST", "pub_date_relative": "25m ago"}, {"title": "Trump says he still has confidence in Lutnick", "full_content": "President Donald Trump on Friday said he has not lost confidence in Commerce Secretary Howard Lutnick , pushing back on growing pressure from bipartisan lawmakers and even members of his own administration.\n\nTrump, at a wide-ranging White House press conference, was asked about Sen. Tom Cotton , R-Ark., telling The Wall Street Journal that, if Lutnick is to be ousted, it should happen soon enough for the Republican-led Senate to confirm his replacement before Democrats take over the chamber.\n\n\"Well, Tom's right,\" Trump replied, saying he would agree with taking swift action if he had indeed lost confidence in Lutnick. \"But I have not lost confidence,\" Trump said in response to a question from CNBC's Eamon Javers .\n\n\"He's a different kind of a guy, very good businessman. He's not traditional,\" Trump said, praising Lutnick's involvement in the U.S. taking an equity stake in Intel .", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 02:22 AM IST", "pub_date_relative": "29m ago"}, {"title": "The tech wreck is one stock trade Trump can\u2019t \u2018TACO\u2019 away", "full_content": "The president threatened to penalize companies that build data centers outside U.S. \u2014 but the stock market kept falling.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:22 AM IST", "pub_date_relative": "29m ago"}, {"title": "Trump vows to stop U.S. companies from building data centers abroad, threatens 'tremendous tax'", "full_content": "President Donald Trump on Friday said U.S. companies will be banned from building data centers in other countries and will face a \"tremendous tax\" penalty if they do so.\n\n\"We're going to fight very hard for the data centers,\" Trump said at a White House press conference before announcing the new policy \u2014 which apparently came as news to his own staff.\n\n\"I don't know if that's a breaking story,\" Trump said. \"I haven't even said that to my people. But I'm telling them now they're here.\"\n\nTrump's latest push for more data-center construction in the U.S. came despite Americans repeatedly stating \u2014 and showing with their votes \u2014 that they dislike the structures.\n\nCNBC's All-America Economic Survey found that 64% of registered voters opposed an AI data center within 10 miles of their home, while just 13% of respondents said they would support one.\n\nIf Trump follows through on his threat to clamp down on overseas data center construction, he will have to contend with the fact that numerous U.S. tech giants \u2014 including Alphabet , Amazon , Microsoft , Meta and Oracle \u2014 have already built them in other countries.\n\nInternational expansion represents a growth opportunity for the top cloud infrastructure providers, which want to serve clients from data centers that are nearby, sometimes to meet regulatory requirements.\n\nTrump said Friday, however, that if companies want to continue building the centers outside the U.S., \"they can, but we're going to put a tremendous tax on them.\"", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 02:17 AM IST", "pub_date_relative": "33m ago"}, {"title": "\u2018GTA 6\u2019 has taken over. Is it too late to buy the developer\u2019s stock?", "full_content": "Also in Weekend Reads: Full coverage of the Anthropic IPO, the \u201cdeath cross\u201d for small-cap stocks and advice from The Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:02 AM IST", "pub_date_relative": "49m ago"}, {"title": "Amazon Urges NYC Customers to Oppose Mamdani-Backed Delivery Bill - WSJ", "full_content": "Amazon Urges NYC Customers to Oppose Mamdani-Backed Delivery Bill WSJ Amazon threatens NYC orders could be $5 more if Council bill passes New York Daily News Here's what our readers are saying about Amazon's threat to raise NYC delivery costs Business Insider Amazon warns of higher costs in NYC if new bill passes ABC7 New York Amazon fights the Delivery Protection Act with homepage banner, in-app pop-up Ars Technica", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 02:02 AM IST", "pub_date_relative": "49m ago"}, {"title": "My husband spent $80,000 on a boat, yet says my plans for a $100,000 pottery studio are irresponsible. Who\u2019s right?", "full_content": "\u201cWe have $2.9 million in retirement accounts. That includes some money that we inherited about 10 years ago.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:01 AM IST", "pub_date_relative": "50m ago"}, {"title": "I\u2019m in my 40s. Should I accept a lower pension in exchange for naming my husband or child as a beneficiary?", "full_content": "\u201cIf I die before my husband, he will receive a lifetime pension equal to 50%\u201366% of my monthly benefit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:00 AM IST", "pub_date_relative": "51m ago"}, {"title": "I\u2019m terrified of a market crash. Should I put $400,000 of my $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:00 AM IST", "pub_date_relative": "51m ago"}, {"title": "Is the bull market cracking? What to watch for next week after the AI washout", "full_content": "The stock market may be nearer to a bottom after this week's sell-off, but investors are still bracing for further volatility.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:56 AM IST", "pub_date_relative": "55m ago"}, {"title": "Take-Two shatters sales record as 'GTA VI' launches to massive fanfare", "full_content": "Criminal duo Lucia and Jason's blitz through Vice City in \"GTA VI\" helped Take-Two Interactive , the publisher of the blockbuster game that is now a global cultural phenomenon, rake in nearly $4 billion in first-day sales.\n\nTake-Two Interactive, the parent company of GTA developer Rockstar Games, is not a household name despite its portfolio of massive hits, including the \"Red Dead Redemption\" franchise and the \"NBA 2K\" basketball series.\n\nThe game also sold 32.5 million units in pre-release and garnered $3.79 billion in day-one retail sales, Rockstar Games said on Friday. That is nearly five times the roughly $800 million GTA V made on its first day in 2013. It was widely regarded as the best-selling videogame in the first 24 hours.\n\nAnalytics firm Sensor Tower estimated that the company sold 24.5 million copies of GTA VI and $2.36 billion in pre-order revenue.\n\nTake-Two had stayed tight-lipped about GTA VI demand since it opened for pre-orders in June, limiting commentary to saying demand has been \"unprecedented\" or \"far exceeding expectations.\"\n\n\"The title is so widely anticipated, consumers appear very, very excited, and all the press so far has been universally positive, but we still aren't ready to declare victory,\" CEO Strauss Zelnick said on Take-Two's earnings call earlier this month.\n\n\"We tend to avoid claiming success before it occurs,\" he had said.\n\nTake-Two has shelled out an estimated $1 billion or more in production costs for GTA VI, making it one of the most expensive entertainment projects.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:56 AM IST", "pub_date_relative": "55m ago"}, {"title": "Nasdaq Slide Deepens After Report of Nvidia SEC Accounting Probe - Barron's", "full_content": "Nasdaq Slide Deepens After Report of Nvidia SEC Accounting Probe Barron's EXCLUSIVE: Nvidia's accounting is a focus of US SEC investigation, sources say Reuters Nvidia stock extends $2.5 trillion rout as SEC probe reportedly investigates its accounting Yahoo Finance Jensen Huang's \u2014 and Nvidia's \u2014 legal exposure balloons CNBC California investigates Nvidia over whether chip exports ended up in China The Guardian", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 01:54 AM IST", "pub_date_relative": "57m ago"}, {"title": "Asset-Backed Debt Sales Top Post-GFC Record on AI Strength", "full_content": "(Bloomberg) -- Sales of asset-backed securities have surpassed their highest level since the Great Financial Crisis for a third straight year, as builders of artificial intelligence infrastructure continue to tap markets for financing and cash-rich insurance firms hunt for high-yielding debt.\n\nThis week the sales of bonds \u2014 backed by assets including data center leases, auto loans and gym memberships \u2014 have surpassed $380 billion so far this year, topping issuance of more than $367 billion for all of 2025, Bloomberg-compiled data show. Sales exceeded $337 billion in 2024. At least five more deals are expected to price later on Friday, including a data center and a fiber offering.\n\nSecuritizations tied to AI infrastructure helped to push overall issuance above the 2025 level despite a slight dip in automobile-linked transactions, which make up almost half of sales. Moreover, demand remained robust as investors such as insurers \u2014 riding high on record annuity sales \u2014 flock to asset-backed debt as it normally offers higher yields than investment-grade corporate bonds.\n\n\u201cData centers, fiber and other digital infrastructure have become the fastest-growing part of ABS,\u201d said Ben Hunsaker, a portfolio manager at Beach Point Capital Management. \u201cThe same could be said for aviation finance, which saw aircraft ABS take a much bigger share of the debt financing pie in 2026.\u201d\n\nData center and fiber infrastructure sales total $28.6 billion this year, compared with $27.7 billion for the whole of 2025 and more than double the 2024 sum. Sales of aircraft-linked debt rose to $13.7 billion from $10.3 billion.\n\nAsset-backed bonds are considered relative safe havens during market turbulence, partly because they often have a shorter duration than other fixed-income assets, making them less sensitive to rising interest rates.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dollar weaker as Fed-fueled rally stalls; lower US yields help yen", "full_content": "NEW YORK, - The US dollar eased across the board on Friday as a weeks-long rally fueled by bets on a hawkish Federal Reserve lost momentum, but waning appetite for riskier currencies kept the dollar's losses in check.\n\nThe dollar index fell 0.1% to 103.86, just short of the 103.9 level it touched in the previous session, its highest since April 2025. The index was on track to snap an eight-session winning streak and is up 1.9% so far this month.\n\nThe dollar's rally accelerated on November 10, when hotter-than-expected US inflation data reinforced bets that the Fed would tighten policy and Fed Governor Christopher Waller said a 50-basis-point hike in December should be considered.\n\n\"I think the momentum has stalled for the dollar ... but I think it's a little bit early to pick a top for the dollar,\" said Marc Chandler, chief market strategist at Bannockburn Capital Markets.\n\nUS Treasury yields dropped on Friday as a multitude of AI-related concerns weighed on global stocks and Anthropic's record market debut on Thursday did little to revive investor confidence. On Friday, investors sought out safe-haven assets. Lower Treasury yields also boosted the relative appeal of the Swiss franc. The dollar slipped 0.5% against the franc.\n\n\"When US rates are falling, low-yielding currencies look better,\" Chandler said.\n\nStill, strategists see the dollar continuing to draw some support from the outlook for a hawkish Fed.\n\nChris Turner, global head of markets at ING, said that while there is only a weak case for another steep correction in equities, \"there is no reason for the Fed to drop its hawkish rhetoric anytime soon.\"", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI tech rout prompts US investors to rush into value stocks", "full_content": "* Nasdaq now down almost 2% year to date, was up 19% YTD in October\n\n* More Fed rate hikes seen pressuring growth stocks near term\n\n* Median S&P 500 stock up 7% in 2026, index up only 2% so far\n\nWall Street fled headlong on Friday from the AI boom to the relative safety of bonds and lower-priced shares outside the tech sector.\n\nTechnology carnage was extensive. Anthropic\u2019s sharp decline took it within a whisker of its IPO price before recovering to trade down 10%, just a day after a record debut that briefly valued the AI lab above $2 trillion. The Nasdaq composite was down over 4% for its third decline of 2% or more this week, its biggest weekly decline since last year\u2019s Liberation Day rout. The pullback put it lower for the year for the first time since April.\n\nThe Nasdaq is now down almost 2% in 2026, relinquishing an annual gain of almost 19% through early October.\n\nThe retreat partly reflects expectations that high inflation readings will force the Federal Reserve to raise interest rates in coming months, likely further increasing borrowing costs and compressing valuations \u2013 and making Treasuries and so-called value stocks look like a better bet.\n\n\u201cYesterday\u2019s AI IPO is a valuation test, and with the 10-year around 5% and the Fed still hiking, investors are asking how much of the AI story is already priced in,\u201d said Gene Goldman, chief investment officer at Cetera, El Segundo, California.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s stock heads for a stretch of weekly losses not seen since 2008", "full_content": "One fund manager says the continued uncertainty makes Nvidia \u2018vulnerable\u2019 to more selling, even as the stock has erased over $900 billion in market value in the past seven trading sessions", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 01:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Intensifying AI rout wipes out Nasdaq's 2026 gains. Alphabet is a tech bright spot", "full_content": "Every weekday, the Investing Club releases the Homestretch, an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stefanik family\u2019s D.C. home sells to mystery buyer for $900K over list price - The Washington Post", "full_content": "Stefanik family\u2019s D.C. home sells to mystery buyer for $900K over list price The Washington Post WaPo Reveals Stefanik Sold Her DC Home to \u2018Mystery Buyer\u2019 For $900K Above Its Last Asking Price Yahoo 'Fiercest' Trump ally mystifies experts with 'highly unusual' windfall Raw Story", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 01:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Everyone\u2019s making money off \u2018GTA 6\u2019 this week \u2014 except investors in Take-Two\u2019s stock", "full_content": "\u2018Grand Theft Auto VI\u2019 might be a blockbuster game, but investors are shrugging it off.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 01:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic shares fall a day after blockbuster IPO - BBC", "full_content": "Anthropic shares fall a day after blockbuster IPO BBC Anthropic IPO live: Anthropic stock drops after first day of trading Yahoo Finance Why Anthropic's day-one valuation wasn't built to last in this market CNBC Almost all of Anthropic\u2019s employees are now millionaires CNN Wall St ends sharply lower on AI selloff, S&P 500, Dow in correction Reuters", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 01:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Prediction markets outlook for stocks in 2026 dims amid AI sell-off", "full_content": "As stocks continue their tech-driven sell-off , prediction markets traders are seeing a bleaker outlook for the remainder of the year.\n\nOn platform Kalshi , speculators place just 6% odds that the S&P 500 will cross 8,000 in 2026. On Oct. 13, those odds were as high as 72%.\n\nContracts ask traders if the S&P 500 will go above various levels in 2026, and they're resolved using data from S&P Dow Jones Indices.\n\nOn Friday, the Nasdaq Composite turned negative for the year as investors continued to dump tech stocks, primarily those with exposure to the artificial intelligence build-out. The Dow Jones Industrial Average and the S&P 500 fell into correction territory, too.\n\nThe S&P 500 has slashed its year-to-date gain to just over 2%.\n\nThe Stock Trader's Almanac in a Thursday note broadly agreed that the hopes for a December rally are fading, with the caveat that a \"Santa rally\" could still appear at the end of the year.\n\n\"The market is under pressure and more downside can't be ruled out,\" the note said.\n\nThe Stock Trader's Almanac sees 2026 following the year-end pattern of 2018, when the Federal Reserve was in a tightening cycle in a midterm year. The Fed is widely expected to hike rates at its December meeting.", "source": "CNBC Finance", "pub_date_str": "21 Nov 2026, 01:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Spooked by Nvidia\u2019s turmoil? Play Grand Theft Auto VI instead of peeking at your 401(k).", "full_content": "If you are tempted to ditch stocks for property or CDs, take a deep breath before making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 01:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "The Fed is too busy fighting inflation to rescue the stock market", "full_content": "Federal Reserve officials will continue to raise interest rates, despite the recent selloff in the stock market, as equity-market gains over the past four years dwarf the recent declines, economists said Friday.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 01:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang to testify publicly before Senate banking panel, Chairman Scott says", "full_content": "Former Nvidia CEO Jensen Huang will testify publicly when he appears before the Senate banking panel, a spokesperson for Committee Chair Tim Scott said Friday.\n\nThe South Carolina Republican confirmed earlier this week that Huang had agreed to appear, but the details of that appearance remained unclear. Huang, who resigned from the company he co-founded earlier this month over a series of extramarital affairs, including one with a suspected Chinese spy, also reached an agreement with three House committees to appear for a closed-door, transcribed interview on Dec. 1.\n\nThe date of Huang's public testimony in the Senate has not yet been announced, though Scott initially requested he appear on Dec. 3.\n\nHis office did not respond when asked when Huang would appear. Scott told CNBC on Wednesday he hopes to hear testimony from Huang and Commerce Secretary Howard Lutnick \"before Christmas.\" The new Congress, when Sen. Elizabeth Warren , D-Mass., is expected to take over as Senate banking chair, convenes Jan. 3.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 01:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "A massive bearish trade just happened in the chip stocks", "full_content": "So much for buying the dip. As the S&P 500 entered correction territory and the Nasdaq-100 flirted with bear-market territory, down 19% from highs as of midday Friday, the single biggest options trade of the day was a near $100-million bet that the VanEck Semiconductor ETF (SMH) has a long way more to fall. Around 12:30 E.T., someone spent $93 million buying 20,000 380-strike puts expiring Sep. 17, 2027, according to trading data reviewed by SpotGamma and Volland, options-analytics platforms that both show the trade as a likely opening position, with volume exceeding existing open interest in the contract. The trade bets that the index will fall below $380, a nearly 8% decline from its current level. The SMH is off 40% from its recent all-time highs.\n\nVanEck Semiconductors ETF (SMH), YTD \"That trade stands out big-time,\" wrote Jason DeLorenzo, founder and owner of Volland. \"It is either a hedge or speculative, but either way it isn't a vote of confidence.\" The puts were bought for $46.50 a piece, an arguably expensive choice for a downside bet with volatility in the ETF trading at 70.\n\n\"You're paying a metric ton of Vega for that thing,\" added SpotGamma's Brent Kochuba, referring to the contract's sensitivity to changes in volatility of the underlying chip ETF. \"Maybe they were a forced buyer, or maybe they're actually selling this, which can still be the case even though the price shows it happening closer to the ask.\"\n\nThe semiconductor index headed for a 9% drop this week alone.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang to testify publicly before Senate banking panel, Chairman Scott says - CNBC", "full_content": "Jensen Huang to testify publicly before Senate banking panel, Chairman Scott says CNBC House Democrats probe whether Nvidia helped halt Commerce chip-smuggling inquiry Politico Democrats press Lutnick for Megaspeed investigation findings The Hill Former Nvidia CEO Huang agreed to testify at public US Senate hearing, senator's aide says Reuters Jensen Huang and Howard Lutnick will appear publicly before a powerful Senate panel Yahoo Finance", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 12:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves Friday: Nvidia, Anthropic, Micron, General Mills, UnitedHealth, Strategy & more", "full_content": "Anthropic shares pulled back on Friday, a day after the company behind Claude AI made its historic debut on public markets.\n\nA slate of companies tied to the artificial intelligence trade tanked as well, with Micron, Sandisk and CoreWeave down by double-digits in the session.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nShares of Nvidia sold off harder on the day after Reuters reported , citing people familiar, that the U.S. Securities and Exchange Commission is investigating the company's accounting practices.\n\nNvidia was last down almost 10% on the day and heading for its worst session since Jan. 27, 2025 when the release of DeepSeek's low-cost artificial intelligence model sparked a sell-off of AI-linked names.\n\nThe slide in Anthropic shares intensified midday Friday, with the stock plummeting close to 14% on the day.\n\nAnthropic on Friday At its session low, the stock touched $83.05 per share.\n\nAnthropic, which just made its public markets debut on Thursday, dragged down the Nasdaq Composite. The tech-heavy index turned negative on the year in Friday's sell-off.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 12:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump says he discussed Jensen Huang with Xi, apparently contradicting Bessent", "full_content": "President Donald Trump on Friday said he and Chinese leader Xi Jinping discussed their shared affinity for former Nvidia CEO Jensen Huang this week, appearing to contradict Treasury Secretary Scott Bessent who earlier in the day said the ousted leader was not mentioned in the Trump administration's latest talks with China in Shenzhen.\n\n\"I did discuss that with President Xi, and he said, 'Oh, brilliant, brilliant! He's a brilliant man.' He is,\" Trump said at a White House press conference.\n\nAsked earlier Friday on CNBC's \"Squawk on the Street\" if Huang, a close ally of Trump 's, had come up in those talks, Bessent said \"no,\" without elaborating.\n\nThe Treasury Department did not immediately respond to CNBC's request for comment on the apparent discrepancy between Trump and Bessent.\n\nTrump also reiterated that he would like to see Huang \u2014 who was replaced by interim CEO Colette Kress after resigning amid allegations of an extramarital affair with a Chinese spy \u2014 be restored as Nvidia's CEO.\n\n\"I would love to see Jensen be given a second chance,\" Trump said. \"You know, we're a country of second chances, and I'd love to be able to see him. That's a very important company to us, and he put us in a position where we are literally 10 years advanced over other companies.\"\n\nNvidia's board is not considering bringing Huang back , a person familiar with the matter told CNBC earlier this week.\n\nThe president's comments came amid growing scrutiny of advanced U.S. chips, including those made by Nvidia, ending up in China either legally or by being diverted via third countries.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 12:45 AM IST", "pub_date_relative": "2h ago"}, {"title": "Chase adds Qantas and Cathay Pacific as transfer partners. These two credit cards can help you access them", "full_content": "The Chase Ultimate Rewards\u00ae program unveiled two new airline transfer partners on Nov. 18, adding to its previous list of 14 airline and hotel programs.\n\nNow, eligible Chase cardholders can transfer Ultimate Rewards\u00ae points to Qantas Frequent Flyer and Cathay Pacific at a 1:1 rate \u2014 meaning the number of points transferred stays the same. The last time Chase added an airline transfer partner was in 2021, with the addition of Air Canada Aeroplan .\n\nCNBC Select dives into what Chase credit card holders should know about the recent transfer partner additions and how to take advantage of them.\n\nQantas Airways predominantly serves Australia and the South Pacific, while Cathay Pacific Airways is focused on Hong Kong and Asia.\n\nA nice perk these two airlines share is that they're both part of the oneworld airline alliance , which also includes popular options like American Airlines and Alaska Airlines. You can search flights via oneworld's flight search tool and compare the cash price between all the member airlines. Since each loyalty program sets its own prices, you can view the award price on each carrier's website.\n\nPlus, sometimes airlines reserve more or higher-quality seats for their frequent flyer programs.\n\nAnyone with an eligible Chase card can take advantage of these new partners. Two popular options include the Chase Sapphire Preferred\u00ae Card (see rates and fees ) and the Chase Sapphire Reserve\u00ae (see rates and fees ).\n\nThe Reserve's $795 annual fee may be startling at first, but it offers over $5,000 in value in the first year. The card features a 100,000-point welcome bonus after spending $6,000 on purchases in the first three months and is loaded with perks, including an incredibly flexible $300 annual travel credit . You'll also get access to Chase Sapphire Lounges by The Club , a premium collection of airport lounges.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 12:43 AM IST", "pub_date_relative": "2h ago"}, {"title": "Wall Street banks set for banner year as Anthropic, SpaceX IPOs generate $1 billion in fees", "full_content": "* Some banks learned of their fee the night before IPO, source says\n\n* Mega-deals pay a fraction of the up to 7% underwriting fee for smaller deals\n\nNEW YORK, Nov 20 (Reuters) - Wall Street banks are on track for one of their most lucrative years in the IPO business, with blockbuster listings by Anthropic and SpaceX generating more than $1 billion in underwriting fees alone.\n\nA syndicate of 22 banks is set to collect about $550 million for underwriting Anthropic's $81.3 billion IPO, eclipsing the roughly $500 million they earned on SpaceX's record-setting offering in June, according to Anthropic's final offering prospectus published on Thursday.\n\nThe fees represent a relatively small share of the $81 billion Anthropic raised at its debut, or as much as $93.5 billion with overallotment options exercised. The banks will receive about 0.68% of the money raised in Anthropic's IPO, broadly in line with the roughly 0.67% they collected on SpaceX's offering.\n\nUnderwriting fees on IPOs typically run as high as 7% of proceeds, though the percentage drops sharply for bigger deals, with companies raising tens of billions of dollars able to negotiate significantly lower rates than smaller issuers.\n\nAnthropic's fee arrangements also highlight the bargaining power that blockbuster issuers hold over Wall Street.\n\nSome banks working on the deal did not learn how much they would earn until Wednesday night, according to a person close to the transaction - suggesting an unusual degree of uncertainty until the final stages of the offering, even as banks compete fiercely over the most coveted deals.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 12:28 AM IST", "pub_date_relative": "2h ago"}, {"title": "It\u2019s tough out there", "full_content": "And even \u201cdiversification benefits\u201d are under pressure", "source": "FT Markets", "pub_date_str": "21 Nov 2026, 12:27 AM IST", "pub_date_relative": "2h ago"}, {"title": "A wave of 'pent-up quits' could boost turnover in the job market, expert says: 'The labor market is a bit like a coiled spring'", "full_content": "Frustrated workers could trigger a wave of turnover, creating a shift in the sluggish job market, according to experts at the job boards Indeed and Glassdoor.\n\nThat sluggishness, or what labor economists call a low-hire, low-fire economy , means that fewer people are getting hired, and fewer workers are leaving their jobs \u2014 even as a growing share of job holders report frustration with their career opportunities. In 2026, 21% of workers report feeling dissatisfied with their career prospects, according to Glassdoor reviewer data. Dissatisfied workers rated their jobs at a one or two out of five stars.\n\nA stagnant job market can discourage even the unhappiest of workers from quitting, but hiring could soon ramp up. Indeed's Job Posting Index, or JPI, which tracks the level of job postings on Indeed relative to a pre-pandemic baseline, saw year-over-year growth for the first time in September 2026 since 2022. The upward trend suggests that the job market is \"heating up,\" Glassdoor chief economist Daniel Zhao tells CNBC Make It.\n\nAs more opportunities open up, job holders might regain the confidence to exit, turning into \"a wave of quits and turnover,\" Zhao says. Turnover could also help those who are out of a job secure employment as roles that were once filled become vacant.\n\n\"The labor market is a bit like a coiled spring right now,\" Zhao said at a press event Tuesday in New York City. \"There's a lot of pent-up potential energy, and it's unclear exactly which way that that spring is going to release that energy.\"\n\nIn a healthy job market, employee dissatisfaction can forecast turnover rates. When employee dissatisfaction reached 17% in April 2022, per Glassdoor reviews, quit rates also reached their highest levels at 3%, seasonally adjusted, according to data from Bureau of Labor Statistics Job Openings and Labor Turnover Survey data published by the St. Louis Federal Reserve.\n\nHowever, when workers feel anxious about their future job prospects, turnover can stall.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 12:25 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Zscaler stock jumps 20% on report that CrowdStrike in talks to buy security vendor", "full_content": "Zscaler shares surged 20% in extended trading on Friday after Bloomberg reported that CrowdStrike is in talks to buy the cybersecurity vendor.\n\nCrowdStrike declined to comment on the report. Zscaler didn't immediately respond to CNBC's request for comment.\n\nThe talks between the two cyber vendors are ongoing, Bloomberg reported, citing sources familiar in the matter.\n\nThe potential deal would create one of the largest cybersecurity companies to date.\n\nCrowdStrike has been one of the big cybersecurity winners in the AI boom, with its stock about doubling in value this year, lifting its market cap to $235 billion. Zscaler, meanwhile, is down 13% this year, pushing its market cap down to about $32 billion.\n\nThe company has made a slew of acquisitions in recent months to beef up security offerings in the new age of artificial intelligence.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 02:50 AM IST", "pub_date_relative": "just now", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Federal Reserve announces College Fed Challenge winners", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 4:15 p.m. EST Share --> --> --> --> --> --> The University of California, Los Angeles won the 23rd Annual National College Fed Challenge.\n\nThe University of California, Los Angeles (UCLA) won the 23rd annual national College Fed Challenge on Friday, a team competition that encourages undergraduate students to learn about the U.S. economy, monetary policymaking, and the role of the Federal Reserve System. Teams analyze economic and financial conditions and formulate a monetary policy recommendation, modeling the Federal Open Market Committee. The team, from Los Angeles, California, represented the San Francisco District and included Aarushi Maheshwari, Annika Chan, Atul Prasanth, Caitlyn Cox, Finn Karish, Eli Brooks (alternate), Kennedy Yang (alternate), Manasi Vartak (alternate), Ronojoy Borpujari (alternate), and Sahil Sudani (alternate). The team's advisers were Chris Surro and Ali Haider Ismail.\n\n\"I am very happy to congratulate the students who competed in this year's College Fed Challenge, especially the winners and finalists,\" said Federal Reserve Chairman Kevin Warsh. \"They took on the same big questions we policymakers face. I'm impressed by their talent, their rigor, and their eagerness to think hard about monetary policy and the economy.\"\n\nThis year's College Fed Challenge included 141 schools from 34 states across the nation, the most in the competition's history. Teams submitted video presentations or participated in local competitions last month. Twenty-one semi-finalist teams then participated in question-and-answer sessions held earlier this month, and seven finalists were invited to the Federal Reserve Board for the national finals.", "source": "Federal Reserve", "pub_date_str": "21 Nov 2026, 02:45 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Warsh wants Fed officials to talk less. Instead, they\u2019re talking more", "full_content": "In his first six months as Federal Reserve chairman, Kevin Warsh has diligently avoided signaling where he sees monetary policy and interest rates headed. His colleagues have been only too happy to fill the void.\n\nFed officials have been rushing to the microphones lately, voicing sometimes conflicting opinions on how the central bank should be handling an inflation bug that the economy can't seem to shake.\n\nMost agree that rates should be raised \u2014 and soon. Some are willing to hike at a measured pace as conditions play out, while others, such as Governor Christopher Waller and St. Louis Fed President Alberto Musalem , entertain the thought of more aggressive hikes in a shorter period of time.\n\nLargely on the sidelines in the debate is Warsh, who has expressed disdain for that sort of forward guidance and argued that it handcuffs policymakers long before they actually have to make a decision. But that hasn't stopped most of the other 18 officials who sit in on Federal Open Market Committee meetings.\n\nIn fact, according to a Bank of America analysis, there has been more so-called Fedspeak in the past two weeks than in any similar period since the start of 2025.\n\n\"Warsh's refusal to guide markets might be encouraging the rest of the FOMC to speak more, not less,\" Bank of America economist Aditya Bhave said in a note Thursday.\n\n\"There is always a range of views across the 19 FOMC participants. Typically, the Chair would weigh in, indicating to markets whether the hawks or doves are in ascendence,\" he added. \"Absent this leadership, however, both sides might feel incentivized to speak more often and more forcefully.\"\n\nThe increasingly vocal debate comes at a critical time for the Fed and has myriad policy implications.", "source": "CNBC Finance", "pub_date_str": "21 Nov 2026, 02:40 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500 and Dow close in correction; Nasdaq erases 2026 gain as AI rout picks up steam: Live updates", "full_content": "Stocks were slammed on Friday, closing out a brutal week for markets as the much-hyped Anthropic IPO caused investors to take profits on the artificial intelligence-led rally rather than revive it. The Nasdaq Composite turned negative for the year, and the S&P 500 entered correction territory alongside the Dow Jones Industrial Average .\n\nThe tech-heavy Nasdaq shed 5.28% and was down 2.7% year to date. The broad market S&P 500 dropped 3.7%, while the blue-chip Dow fell 949.73 points, or 1.93%. Both the S&P 500 and Dow moved 10% below their closing records. The Nasdaq-100 plummeted 5.6% and entered a bear market on an intraday basis, down 20% from its recent high.\n\nNasdaq Composite, year-to-date Anthropic lost 9%, giving back most of its 17% jump in its Nasdaq debut Thursday and pressuring the broader AI trade. Chipmakers Advanced Micro Devices and Nvidia slid 13% each. Nvidia saw selling pressure increase after Reuters reported that the U.S. Securities and Exchange Commission is exploring possible accounting issues at the company. Micron Technology dropped almost 14%.\n\nThose declines in tech built on the losses seen in Thursday's horrid session, where the major averages each losing more than 2%, and the Dow closing below the key 50,000 level for the first time since June.\n\n\"This is not just a valuation-driven correction. It's becoming broader,\" said Massimo Santicchia, head of U.S. equities at Procyon. \"Right now, it's definitely risk-off.\"\n\nThe losses are alarming investors who were hopeful that Nvidia's earnings and Anthropic's IPO would revive enthusiasm for the AI trade. Now, the market looks to be on the cusp of a true capitulation after getting roiled in recent weeks with a series of negative headlines.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 02:37 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic falls 9% in first full day of trading as tech stocks get shellacked", "full_content": "Anthropic shares fell 9% on Friday to close their first full day of trading, as concerns about the artificial intelligence trade continued to drag tech stocks lower.\n\nThe stock opened at $111.50 on the Nasdaq Thursday after Anthropic raised $81.3 billion in the largest IPO of all time, but shares slid throughout the day and closed at $97.17.\n\nInvestors had been eagerly awaiting Anthropic's debut in the hopes that it could revitalize the AI trade, which has come under pressure following Jensen Huang's shocking ouster as Nvidia CEO, souring public sentiment around data centers and concerns that rising interest rates could affect plans for a multi-trillion-dollar AI infrastructure buildout .\n\nShares of chipmakers Nvidia and Advanced Micro Devices both plummeted more than 13%, and hyperscalers, including Amazon , Google and Microsoft , also closed lower on Friday.\n\nAnthropic stock Treasury Secretary Scott Bessent touted Anthropic as an \"only in America story\" in an interview with CNBC on Friday, adding that the company has been \"very cooperative\" in its work to pre-test models with the Trump administration.\n\n\"Anthropic in 2021 was seven people sitting around during Covid in a park in San Francisco, with laptops and a dream, and then yesterday we saw the most valuable IPO in history,\" Bessent said.\n\nAnthropic's relationship with the government has been strained this year after two high-profile disputes spilled into the public. But the tensions between the two camps began to thaw in September, when Anthropic CEO Dario Amodei joined President Donald Trump for a private dinner at the White House.\n\nBessent said Friday that one of Anthropic's seven co-founders is going to make a large gift to Trump Accounts, the investment accounts that the administration set up for U.S. children, over the next few weeks. Tom Brown, Anthropic's chief compute officer, is that co-founder, according to a source briefed on his plans, who asked not to be named because the details are confidential.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 02:37 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic defied the odds in its record IPO. Now it has to reckon with AI market turbulence", "full_content": "The moment felt impossible. Between Jensen Huang's shocking exit from chip giant Nvidia , voters' rebuke of artificial intelligence in this month's midterm elections, and rising interest rates that threatened to stymie plans for a multitrillion-dollar infrastructure buildout, there seemed to be no way Anthropic could carry out an initial public offering. Anthropic's response? Let's go! \"Very few companies would've attempted it in this environment,\" said Byron Deeter , a partner at Bessemer Venture Partners, which counts Anthropic as its biggest investment ever, in an interview. \"These things collectively have been massively disruptive, yet the team stuck to its true north and got the largest financing in IPO history done, and it's just remarkable.\"\n\nAnthropic's stock jumped 17% in its Nasdaq debut on Thursday, closing at $97.17 per share and giving the Claude creator a market cap of roughly $1.8 trillion. That makes it the seventh-most valuable U.S. company, despite being less than six years old.\n\nThe shares sold off on Friday, closing at $88.30, just a few dollars above the IPO price. It's a reminder of the uncertainty richly valued companies face in their early days on the public market. Facebook had a tough first year after its IPO in 2012 due to concerns surrounding its mobile prospects. And after Uber's IPO in May 2019, shares of the ride-hailing company trended lower the rest of that year.\n\nEarlier on Thursday, the second floor of the Nasdaq was decorated in orange, Anthropic's signature color. Founders and backers were given Claude lapel pins that served as their ticket to the bell ringing, which was followed by a champagne toast ahead of the opening. With the first trade, the stock shot up to $111.50.\n\nAnthropic's stock The previous afternoon Anthropic raised $81.3 billion , topping Elon Musk's SpaceX for the largest IPO on record.\n\nIt was a wild feat, and Anthropic backers breathed a sigh of relief.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 02:36 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gap names new Athleta CEO, says Old Navy turnaround is seeing signs of progress", "full_content": "Gap Inc. on Thursday announced Ashley Kechter will be the next president and CEO of its Athleta brand, effective Dec. 14.\n\nThe retailer also said Old Navy's turnaround is showing signs of progress, sending shares up more than 11% Friday.\n\nKechter comes to Gap from activewear retailer Vuori, where she was global president and oversaw the brand's global business strategy, marketing and financials. She was previously global brand president of Fabletics and began her career at Gap before that.\n\n\"I'm excited to return to Gap Inc. and partner with [Gap CEO Richard Dickson] and the team to strengthen our connection with customers and shape the brand's next chapter,\" Kechter said in a statement.\n\nThe announcement comes after Lululemon poached former Athleta CEO Maggie Gauger to be its chief product officer last month.\n\n\"Clearly, we're disappointed with Athleta's performance, and we recognize there's a lot of work ahead,\" Dickson told CNBC. \"We had been in rebuild mode, but now we're really in turnaround mode.\"\n\nDickson said the company is focused on getting back to its fundamentals: fabrications, feature, form, function and fit. Dickson added that Kechter will be conducting a \"comprehensive review\" of the brand to reposition Athleta for future success.\n\nWhile the execution of its strategy has thus far \"fallen short,\" Dickson said this new approach will allow Athleta to fully realize its potential.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 02:34 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia stock plunges 14%, wraps up longest weekly losing streak since 2008 financial crisis", "full_content": "The last time Wall Street was this down on Nvidia the chipmaker's flagship product was the GeForce graphics processor for high-end PC video games, and markets were reeling from the global financial crisis.\n\nNvidia shares tumbled 14% on Friday, sliding for a seventh straight day as investors grew increasingly concerned about life after co-founder Jensen Huang . The stock closed lower for a seventh consecutive week, the longest such stretch since 2008.\n\nShares of Nvidia are down 46% over the period, pushing the company's market cap down by about $2.6 trillion. The stock is now trading at roughly 8.4 times forward earnings, while Advanced Micro Devices is valued at 29 times profit for the next 12 months.\n\nOn Friday, Reuters reported that the Securities and Exchange Commission is exploring potential accounting issues at Nvidia, pushing the stock down further.\n\nOnce the most valuable company in the world, Nvidia now has a market cap of $3 trillion, putting it fourth behind Apple , Microsoft and Alphabet .\n\nNvidia is reeling from the removal of Huang, who resigned on Nov. 12, after multiple reported affairs , including one with a Chinese businesswoman who was allegedly a spy.\n\nHarvey Jones, Nvidia's newly appointed board chair, said earlier this week that Huang had resigned after \"disclosure of personal behavior inconsistent with the company's code of conduct, standards and cultural norms.\"\n\nBut the chipmaker's losing streak started before Nvidia was thrown into crisis as investors worried over the sustainability of the AI buildout, particularly after the midterm elections, and emerging competition in AI chips from Google and AMD.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 02:33 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US court ruling jeopardizes Sentinel Midstream\u2019s license for deepwater oil export project", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 02:30 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The tech wreck is one stock trade Trump can\u2019t \u2018TACO\u2019 away", "full_content": "The president threatened to penalize companies that build data centers outside U.S. \u2014 but the stock market kept falling.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:22 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump vows to stop U.S. companies from building data centers abroad, threatens 'tremendous tax'", "full_content": "President Donald Trump on Friday said U.S. companies will be banned from building data centers in other countries and will face a \"tremendous tax\" penalty if they do so.\n\n\"We're going to fight very hard for the data centers,\" Trump said at a White House press conference before announcing the new policy \u2014 which apparently came as news to his own staff.\n\n\"I don't know if that's a breaking story,\" Trump said. \"I haven't even said that to my people. But I'm telling them now they're here.\"\n\nTrump's latest push for more data-center construction in the U.S. came despite Americans repeatedly stating \u2014 and showing with their votes \u2014 that they dislike the structures.\n\nCNBC's All-America Economic Survey found that 64% of registered voters opposed an AI data center within 10 miles of their home, while just 13% of respondents said they would support one.\n\nIf Trump follows through on his threat to clamp down on overseas data center construction, he will have to contend with the fact that numerous U.S. tech giants \u2014 including Alphabet , Amazon , Microsoft , Meta and Oracle \u2014 have already built them in other countries.\n\nInternational expansion represents a growth opportunity for the top cloud infrastructure providers, which want to serve clients from data centers that are nearby, sometimes to meet regulatory requirements.\n\nTrump said Friday, however, that if companies want to continue building the centers outside the U.S., \"they can, but we're going to put a tremendous tax on them.\"", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 02:17 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u2018GTA 6\u2019 has taken over. Is it too late to buy the developer\u2019s stock?", "full_content": "Also in Weekend Reads: Full coverage of the Anthropic IPO, the \u201cdeath cross\u201d for small-cap stocks and advice from The Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:02 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "I\u2019m in my 40s. Should I accept a lower pension in exchange for naming my husband or child as a beneficiary?", "full_content": "\u201cIf I die before my husband, he will receive a lifetime pension equal to 50%\u201366% of my monthly benefit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:00 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "I\u2019m terrified of a market crash. Should I put $400,000 of my $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 02:00 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Is the bull market cracking? What to watch for next week after the AI washout", "full_content": "The stock market may be nearer to a bottom after this week's sell-off, but investors are still bracing for further volatility.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:56 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Take-Two shatters sales record as 'GTA VI' launches to massive fanfare", "full_content": "Criminal duo Lucia and Jason's blitz through Vice City in \"GTA VI\" helped Take-Two Interactive , the publisher of the blockbuster game that is now a global cultural phenomenon, rake in nearly $4 billion in first-day sales.\n\nTake-Two Interactive, the parent company of GTA developer Rockstar Games, is not a household name despite its portfolio of massive hits, including the \"Red Dead Redemption\" franchise and the \"NBA 2K\" basketball series.\n\nThe game also sold 32.5 million units in pre-release and garnered $3.79 billion in day-one retail sales, Rockstar Games said on Friday. That is nearly five times the roughly $800 million GTA V made on its first day in 2013. It was widely regarded as the best-selling videogame in the first 24 hours.\n\nAnalytics firm Sensor Tower estimated that the company sold 24.5 million copies of GTA VI and $2.36 billion in pre-order revenue.\n\nTake-Two had stayed tight-lipped about GTA VI demand since it opened for pre-orders in June, limiting commentary to saying demand has been \"unprecedented\" or \"far exceeding expectations.\"\n\n\"The title is so widely anticipated, consumers appear very, very excited, and all the press so far has been universally positive, but we still aren't ready to declare victory,\" CEO Strauss Zelnick said on Take-Two's earnings call earlier this month.\n\n\"We tend to avoid claiming success before it occurs,\" he had said.\n\nTake-Two has shelled out an estimated $1 billion or more in production costs for GTA VI, making it one of the most expensive entertainment projects.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 01:56 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq Slide Deepens After Report of Nvidia SEC Accounting Probe - Barron's", "full_content": "Nasdaq Slide Deepens After Report of Nvidia SEC Accounting Probe Barron's EXCLUSIVE: Nvidia's accounting is a focus of US SEC investigation, sources say Reuters Nvidia stock extends $2.5 trillion rout as SEC probe reportedly investigates its accounting Yahoo Finance Jensen Huang's \u2014 and Nvidia's \u2014 legal exposure balloons CNBC California investigates Nvidia over whether chip exports ended up in China The Guardian", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 01:54 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Asset-Backed Debt Sales Top Post-GFC Record on AI Strength", "full_content": "(Bloomberg) -- Sales of asset-backed securities have surpassed their highest level since the Great Financial Crisis for a third straight year, as builders of artificial intelligence infrastructure continue to tap markets for financing and cash-rich insurance firms hunt for high-yielding debt.\n\nThis week the sales of bonds \u2014 backed by assets including data center leases, auto loans and gym memberships \u2014 have surpassed $380 billion so far this year, topping issuance of more than $367 billion for all of 2025, Bloomberg-compiled data show. Sales exceeded $337 billion in 2024. At least five more deals are expected to price later on Friday, including a data center and a fiber offering.\n\nSecuritizations tied to AI infrastructure helped to push overall issuance above the 2025 level despite a slight dip in automobile-linked transactions, which make up almost half of sales. Moreover, demand remained robust as investors such as insurers \u2014 riding high on record annuity sales \u2014 flock to asset-backed debt as it normally offers higher yields than investment-grade corporate bonds.\n\n\u201cData centers, fiber and other digital infrastructure have become the fastest-growing part of ABS,\u201d said Ben Hunsaker, a portfolio manager at Beach Point Capital Management. \u201cThe same could be said for aviation finance, which saw aircraft ABS take a much bigger share of the debt financing pie in 2026.\u201d\n\nData center and fiber infrastructure sales total $28.6 billion this year, compared with $27.7 billion for the whole of 2025 and more than double the 2024 sum. Sales of aircraft-linked debt rose to $13.7 billion from $10.3 billion.\n\nAsset-backed bonds are considered relative safe havens during market turbulence, partly because they often have a shorter duration than other fixed-income assets, making them less sensitive to rising interest rates.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Dollar weaker as Fed-fueled rally stalls; lower US yields help yen", "full_content": "NEW YORK, - The US dollar eased across the board on Friday as a weeks-long rally fueled by bets on a hawkish Federal Reserve lost momentum, but waning appetite for riskier currencies kept the dollar's losses in check.\n\nThe dollar index fell 0.1% to 103.86, just short of the 103.9 level it touched in the previous session, its highest since April 2025. The index was on track to snap an eight-session winning streak and is up 1.9% so far this month.\n\nThe dollar's rally accelerated on November 10, when hotter-than-expected US inflation data reinforced bets that the Fed would tighten policy and Fed Governor Christopher Waller said a 50-basis-point hike in December should be considered.\n\n\"I think the momentum has stalled for the dollar ... but I think it's a little bit early to pick a top for the dollar,\" said Marc Chandler, chief market strategist at Bannockburn Capital Markets.\n\nUS Treasury yields dropped on Friday as a multitude of AI-related concerns weighed on global stocks and Anthropic's record market debut on Thursday did little to revive investor confidence. On Friday, investors sought out safe-haven assets. Lower Treasury yields also boosted the relative appeal of the Swiss franc. The dollar slipped 0.5% against the franc.\n\n\"When US rates are falling, low-yielding currencies look better,\" Chandler said.\n\nStill, strategists see the dollar continuing to draw some support from the outlook for a hawkish Fed.\n\nChris Turner, global head of markets at ING, said that while there is only a weak case for another steep correction in equities, \"there is no reason for the Fed to drop its hawkish rhetoric anytime soon.\"", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 01:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI tech rout prompts US inv
