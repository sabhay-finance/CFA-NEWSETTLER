    const allData = {"general": [{"title": "Dow jumps 300 points as oil and yields ease to start week: Live updates", "full_content": "U.S. stocks rallied on Monday as oil prices and Treasury yields slipped, with Wall Street looking to recover from a mostly lower week.\n\nThe Dow Jones Industrial Average popped 307 points, or 0.6%. The S&P 500 climbed 0.6%, while the Nasdaq Composite rose 0.8%.\n\nLast week, the Dow slid 1.7% for its worst performance since March. The S&P 500 was off about 0.1%. Only the tech-heavy Nasdaq posted a gain, up 0.7%.\n\nMonday's advance was aided by a 3% drop in U.S. crude to above $96 per barrel. International benchmark Brent slid 3% as well to above $100 a barrel.\n\nThose moves come after the latest escalation in hostilities in the Middle East over the weekend. Iran-backed Houthis said they attacked Saudi Arabia with missiles and drones on Saturday. Later in the day, the U.S. State Department warned Americans to reconsider traveling to the Middle East as the U.S. and Iran traded threats to resume attacks.\n\nHowever, diplomacy between the U.S. and Iran could still be on the table in the near term, as President Donald Trump told Fox News he would probably be open to meeting with Iranian President Masoud Pezeshkian during this week's UN General Assembly. JPMorgan analysts also noted recently that oil flows \" remain surprisingly strong \" despite the recent disruptions.\n\nTreasury yields declined alongside the fall in oil. The 10-year Treasury note yield shed more than 3 basis points to 4.963%, while the yield on the 30-year Treasury bond dropped more than 2 basis points to 5.298%.\n\nAs the U.S. struggles with taming sticky inflation and elevated bond yields, the Federal Reserve hiked interest rates last week for the first time in three years.", "source": "CNBC Top News", "pub_date_str": "21 Sep 2026, 07:03 PM IST", "pub_date_relative": "1m ago"}, {"title": "White House TV press pool won't cover Trump after CNN ban", "full_content": " tocks and sectors, focusing on the underlying factors driving market movements. <br><br> His work combines quantitative insights with clear storytelling, presenting financial developments in a clear and structured manner. Moreover, he enjoys writing multibagger and listicle-style copies. Outside of work, Ksheera enjoys playing the piano and exploring new places. He has a keen interest in travel, music, and continuously learning about global markets and economic trends.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago"}, {"title": "Why one Warren Buffett\u2013inspired fund manager is betting big on Chinese stocks", "full_content": "Low valuations and founder management are attractive to RV Capital\u2019s Rob Vinall.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago"}, {"title": "German voters turn to left and far-right as 'disaster' for ruling CDU threatens pro-growth reforms", "full_content": "Left-wing and far-right parties stormed to success in two German state elections over the weekend, delivering another hammer blow to the ruling Christian Democratic Union (CDU) and complicating the path for its increasingly unpopular pro-growth agenda.\n\nChancellor Friedrich Merz accepted a \"disaster\" for the CDU following the vote in the north-eastern state of Mecklenburg-Vorpommern, where the far-right Alternative for Germany (AfD) came first. The CDU also faced heavy losses in Berlin, where Die Linke (The Left) topped the result. The center-right CDU has led a national coalition government under Merz since 2025 and REIT markets during 2025-26.\n\nAccording to the report, India\u2019s REIT market value surpassed Hong Kong for the first time, making it Asia\u2019s fourth-largest REIT market by valuation. As of 31 March 2026, India's REIT market combined market value is $17.7 billion, behind Japan, Singapore and China.\n\nOver the 12 months to June 2026, the four listed Indian REITs with a full year of trading history delivered positive total returns, while the Nifty 50 declined, according to the report.\n\nMindspace Business Parks REIT delivered total returns of 24.3%, comprising a 6% distribution return and 18.3% capital appreciation. Distribution return is the income investors receive from their REIT units, while capital appreciation refers to the gain or loss from changes in the unit price.\n\nNexus Select Trust followed with total returns of 23.2%, while Embassy Office Parks REIT and Brookfield India REIT delivered 19% and 11.9%, respectively. In comparison, the Nifty 50 recorded a net decline of 5.2% over the same period.\n\nAccording to the report, this resulted in a positive spread of 17 to 30 percentage points between the REITs\u2019 total returns and the Nifty 50.", "source": "LiveMint Money", "pub_date_str": "21 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago"}, {"title": "US Fed, Bank of Japan and others impact on Indian stock markets: Global rate hike cycle begins - Sensex, Nifty outlook", "full_content": "The year 2026 has so far been a challenging one for Dalal Street bulls, with markets navigating multiple headwinds, including elevated crude oil prices, persistent selling by overseas investors, a record-low rupee, limited exposure to AI, and subdued domestic market drivers.\n\nThese headwinds have dragged the headline indices into double-digit losses, putting them on track for their first annual decline in a decade. Hopes of a recovery in the final quarter of the year have now weakened as the global interest-rate cycle has turned tighter, a development that could influence local equities through multiple channels.\n\nThe latest rate hikes by global central banks have put the Reserve Bank of India (RBI) in the spotlight, with expectations strengthening that the central bank could consider raising interest rates in its upcoming policy meeting as domestic inflation also moves above the target.\n\nRising inflationary pressures, driven by the ongoing war in the Middle East, have prompted major central banks to raise interest rates in September and signal further monetary tightening if price pressures do not ease.\n\nThe ECB was the first major central bank to take action against rising inflation, raising rates by 25 basis points in September and taking its deposit rate to 2.50%, as inflation risks remained elevated. The US Federal Reserve followed with a 25-basis-point rate hike, taking the federal funds target range to 3.75\u20134.00% in a unanimous 12\u20130 decision.\n\nThis was the first-rate hike since July 2023, while another hike before the end of 2026 remains under consideration. The Bank of England held Bank Rate at 3.75% on September 17, but the 6\u20133 vote was notably hawkish, with three MPC members preferring a 25-basis-point hike to 4.0%.\n\nThe BoE also continues to reduce its government-bond holdings through quantitative tightening.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:51 PM IST", "pub_date_relative": "13m ago"}, {"title": "Aggressive Store Additions Challenge Black Rock Coffee Bar\u2019s (BRCB) Long-Term Expansion Thesis", "full_content": "Skip to navigation Skip to main content Skip to right column Aggressive Store Additions Challenge Black Rock Coffee Bar\u2019s (BRCB) Long-Term Expansion Thesis Soumya Eswaran Mon, September 21, 2026 at 8:21 AM CDT 3 min read BRCB ^RUT Carillon Tower Advisers , an investment management company, released its second-quarter 2026 investor letter for the \"Carillon Eagle Small Cap Growth Fund\". The letter can be downloaded here . Small-cap stock r and defensive sectors lagged, while Energy (-2.40%) was the sole sector in the red. Following a strong quarter, the outlook for equity markets remains positive, supported by robust corporate profits and economic growth. However, midterm election uncertainties could introduce volatility, especially around data center development, a key economic driver. The $1 trillion data center spending boosts corporate earnings and supports ongoing AI infrastructure investments. Additionally, reviewing the Fund's top five holdings could help identify its best picks for 2026.\n\nIn its second-quarter 2026 investor letter, Carillon Eagle Small Cap Growth Fund highlighted Fastly, Inc. (NASDAQ: FSLY ). Fastly, Inc. (NASDAQ:FSLY) operates an edge cloud platform that enables customers to process, serve, and secure applications. On September 18, 2026, Fastly, Inc. (NASDAQ:FSLY) closed at $23.86 per share. Over the past month, Fastly, Inc. (NASDAQ:FSLY) returned 4.01%, but its shares are up 172.37% over the past year. Fastly, Inc. (NASDAQ:FSLY) has a market capitalization of $3.80 billion, and its stock has traded within a 52-week range of $7.74 to $34.82.\n\nCarillon Eagle Mid Cap Growth Fund stated the following regarding Fastly, Inc. (NASDAQ:FSLY) in its Q2 2026 investor letter:\n\n\"Fastly, Inc.", "source": "Yahoo Finance", "pub_date_str": "21 Sep 2026, 06:47 PM IST", "pub_date_relative": "16m ago"}, {"title": "Diana Shipping secures charter for Ultramax vessel at $18,000/day", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "Nordnet shares jump 6% after launch of SEK 250 mln share buyback", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "BillionToOne SVP Sells 1,416 Shares", "full_content": "Skip to navigation Skip to main content Skip to right column BillionToOne SVP Sells 1,416 Shares John Ballard, The Motley Fool Mon, September 21, 2026 at 8:16 AM CDT 4 min read BLLN John Roderick Ten Bosch, SVP of Laboratory Operations at BillionToOne, Inc. (NASDAQ:BLLN), sold 1,416 shares of Class A Common Stock on Sept. 9, 2026, according to an SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($97.54); post-transaction value based on September 09, 2026, market close ($99.16).\n\nHow does this sale align with the insider's total direct position? Following the sale of 1,416 shares, John Roderick Ten Bosch maintains a direct position of 25,051 shares, which represented a market value of $2.4 million as of the Sept. 9, 2026, market close.\n\nWhat regulatory framework governed this transaction? The trade was conducted under a Rule 10b5-1 plan adopted on June 2, 2026, which establishes a systematic trading cadence to manage equity holdings for company executives.\n\nWhat is the broader context of insider equity at BillionToOne? Total insider ownership across the company is 0.0545%, according to the latest available data, as the firm continues to develop specialized diagnostics and its molecular counting platform.\n\nDoes this transaction indicate a shift in management sentiment? The transaction was executed via a pre-established trading plan and represents a single-digit percentage of the insider's total holdings, suggesting routine portfolio management.\n\nBillionToOne develops and commercializes advanced molecular diagnostic solutions, including the UNITY Complete non-invasive prenatal screening platform, which leverages proprietary DNA molecule-counting technology to enhance the precision of disease detection.\n\nThe company generates revenue through the sale of diagnostic testing services and products that utilize its cutting-edge molecular counting platform to quantify biological data with exceptional accuracy.", "source": "Yahoo Finance", "pub_date_str": "21 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}], "cfa": [{"title": "Dow jumps 300 points as oil and yields ease to start week: Live updates", "full_content": "U.S. stocks rallied on Monday as oil prices and Treasury yields slipped, with Wall Street looking to recover from a mostly lower week.\n\nThe Dow Jones Industrial Average popped 307 points, or 0.6%. The S&P 500 climbed 0.6%, while the Nasdaq Composite rose 0.8%.\n\nLast week, the Dow slid 1.7% for its worst performance since March. The S&P 500 was off about 0.1%. Only the tech-heavy Nasdaq posted a gain, up 0.7%.\n\nMonday's advance was aided by a 3% drop in U.S. crude to above $96 per barrel. International benchmark Brent slid 3% as well to above $100 a barrel.\n\nThose moves come after the latest escalation in hostilities in the Middle East over the weekend. Iran-backed Houthis said they attacked Saudi Arabia with missiles and drones on Saturday. Later in the day, the U.S. State Department warned Americans to reconsider traveling to the Middle East as the U.S. and Iran traded threats to resume attacks.\n\nHowever, diplomacy between the U.S. and Iran could still be on the table in the near term, as President Donald Trump told Fox News he would probably be open to meeting with Iranian President Masoud Pezeshkian during this week's UN General Assembly. JPMorgan analysts also noted recently that oil flows \" remain surprisingly strong \" despite the recent disruptions.\n\nTreasury yields declined alongside the fall in oil. The 10-year Treasury note yield shed more than 3 basis points to 4.963%, while the yield on the 30-year Treasury bond dropped more than 2 basis points to 5.298%.\n\nAs the U.S. struggles with taming sticky inflation and elevated bond yields, the Federal Reserve hiked interest rates last week for the first time in three years.", "source": "CNBC Top News", "pub_date_str": "21 Sep 2026, 07:03 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "White House TV press pool won't cover Trump after CNN ban", "full_content": "The White House television pool that covers events by President Donald Trump on a rotating basis will stop covering those events because of the White House's ban of CNN from acting as a member of that pool.\n\nCNN was barred from covering Trump as the designated TV pooler on Monday, when the president is visiting New York for the United Nations General Assembly.\n\nThe decision by other members of the TV pool to no longer cover Trump comes as CNN, along with MS NOW and Politico, said they are suing Trump to overturn a ban of those three media outlets from the White House.", "source": "CNBC Top News", "pub_date_str": "21 Sep 2026, 07:01 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Pine Labs block deal: Mastercard Asia-Pacific to sell entire stake worth nearly \u20b9890 crore: Report", "full_content": "Mastercard Asia/Pacific Pte. Ltd. is likely to exit its investment in Pine Labs through a block deal of nearly \u20b9 890 crore, with the transaction slated for Tuesday, 22 September, NDT V reported.\n\nKsheera Sagar has been working as a Market Research Analyst at LiveMint for the past four years, covering stocks, commodities, and broader financial markets. In this role, he closely tracks daily market movements, corporate earnings, sector trends, and macroeconomic developments. <br><br> He has over a decade of experience in the financial services industry and has previously worked with multiple organisations, including global investment bank J.P. Morgan, bringing strong research experience into the newsroom. <br><br> During his career, he has gained extensive exposure to equity research, market analysis, and financial data interpretation, strengthening his expertise across asset classes and market cycles. <br><br> He is known for his data-driven analysis and crisp, listicle-style market stories that break down complex financial developments across key markets for a wide audience. His strong research skills enable him to write detailed and insightful stories on stocks and sectors, focusing on the underlying factors driving market movements. <br><br> His work combines quantitative insights with clear storytelling, presenting financial developments in a clear and structured manner. Moreover, he enjoys writing multibagger and listicle-style copies. Outside of work, Ksheera enjoys playing the piano and exploring new places. He has a keen interest in travel, music, and continuously learning about global markets and economic trends.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "German voters turn to left and far-right as 'disaster' for ruling CDU threatens pro-growth reforms", "full_content": "Left-wing and far-right parties stormed to success in two German state elections over the weekend, delivering another hammer blow to the ruling Christian Democratic Union (CDU) and complicating the path for its increasingly unpopular pro-growth agenda.\n\nChancellor Friedrich Merz accepted a \"disaster\" for the CDU following the vote in the north-eastern state of Mecklenburg-Vorpommern, where the far-right Alternative for Germany (AfD) came first. The CDU also faced heavy losses in Berlin, where Die Linke (The Left) topped the result. The center-right CDU has led a national coalition government under Merz since 2025 and has been Germany's dominant political force in the postwar era, formerly helmed by longstanding Chancellor Angela Merkel.\n\nThe AfD is unlikely to be able to govern in Mecklenburg-Vorpommern due to a boycott by other parties of any collaboration with the far-right. But its success will provide further momentum to a political force that came first in another state election result earlier this month and is pulling ahead in national voting intention, according to a Politico poll of polls .\n\nThe rise of far-right populism in Europe's biggest economy, which has for decades been viewed as a bastion of stability, centrist policymaking and EU leadership, is being closely watched across the continent.\n\nMerz on Sunday said he would stay in power despite the results, vowing to push ahead with various measures aimed at boosting the flagging German economy \u2014 including tax, healthcare and pension reforms , a highly anticipated program of defense and infrastructure spending , and easing bureaucracy to boost SMEs.\n\nDuring a press conference on Monday, he added that he was \"grateful\" to Germany's center-left Social Democrats for committing to their position as junior partner in Merz' governing coalition.\n\n\"That applies to us too, and it applies to me as well.", "source": "CNBC Top News", "pub_date_str": "21 Sep 2026, 06:52 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Invested in Nifty 50 index mutual funds? Here's why you should consider REITs to diversify your portfolio", "full_content": "If your investments are concentrated in Nifty 50 index funds or other equity mutual funds , a new report highlights why Real Estate Investment Trusts (REITs) could be worth considering as a separate asset class.\n\nIndia\u2019s listed REIT market has expanded rapidly, while REITs have outperformed the Nifty 50 over the past year.\n\nThe findings come from the 10th edition of Cushman & Wakefield\u2019s Asia REIT Market Insight series, which tracks developments across Asian REIT markets during 2025-26.\n\nAccording to the report, India\u2019s REIT market value surpassed Hong Kong for the first time, making it Asia\u2019s fourth-largest REIT market by valuation. As of 31 March 2026, India's REIT market combined market value is $17.7 billion, behind Japan, Singapore and China.\n\nOver the 12 months to June 2026, the four listed Indian REITs with a full year of trading history delivered positive total returns, while the Nifty 50 declined, according to the report.\n\nMindspace Business Parks REIT delivered total returns of 24.3%, comprising a 6% distribution return and 18.3% capital appreciation. Distribution return is the income investors receive from their REIT units, while capital appreciation refers to the gain or loss from changes in the unit price.\n\nNexus Select Trust followed with total returns of 23.2%, while Embassy Office Parks REIT and Brookfield India REIT delivered 19% and 11.9%, respectively. In comparison, the Nifty 50 recorded a net decline of 5.2% over the same period.\n\nAccording to the report, this resulted in a positive spread of 17 to 30 percentage points between the REITs\u2019 total returns and the Nifty 50.", "source": "LiveMint Money", "pub_date_str": "21 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Fed, Bank of Japan and others impact on Indian stock markets: Global rate hike cycle begins - Sensex, Nifty outlook", "full_content": "The year 2026 has so far been a challenging one for Dalal Street bulls, with markets navigating multiple headwinds, including elevated crude oil prices, persistent selling by overseas investors, a record-low rupee, limited exposure to AI, and subdued domestic market drivers.\n\nThese headwinds have dragged the headline indices into double-digit losses, putting them on track for their first annual decline in a decade. Hopes of a recovery in the final quarter of the year have now weakened as the global interest-rate cycle has turned tighter, a development that could influence local equities through multiple channels.\n\nThe latest rate hikes by global central banks have put the Reserve Bank of India (RBI) in the spotlight, with expectations strengthening that the central bank could consider raising interest rates in its upcoming policy meeting as domestic inflation also moves above the target.\n\nRising inflationary pressures, driven by the ongoing war in the Middle East, have prompted major central banks to raise interest rates in September and signal further monetary tightening if price pressures do not ease.\n\nThe ECB was the first major central bank to take action against rising inflation, raising rates by 25 basis points in September and taking its deposit rate to 2.50%, as inflation risks remained elevated. The US Federal Reserve followed with a 25-basis-point rate hike, taking the federal funds target range to 3.75\u20134.00% in a unanimous 12\u20130 decision.\n\nThis was the first-rate hike since July 2023, while another hike before the end of 2026 remains under consideration. The Bank of England held Bank Rate at 3.75% on September 17, but the 6\u20133 vote was notably hawkish, with three MPC members preferring a 25-basis-point hike to 4.0%.\n\nThe BoE also continues to reduce its government-bond holdings through quantitative tightening.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:51 PM IST", "pub_date_relative": "13m ago", "cfa_topi ffect markets \u2014 a core CFA economics topic."}, {"title": "Nordnet shares jump 6% after launch of SEK 250 mln share buyback", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "BillionToOne SVP Sells 1,416 Shares", "full_content": "Skip to navigation Skip to main content Skip to right column BillionToOne SVP Sells 1,416 Shares John Ballard, The Motley Fool Mon, September 21, 2026 at 8:16 AM CDT 4 min read BLLN John Roderick Ten Bosch, SVP of Laboratory Operations at BillionToOne, Inc. (NASDAQ:BLLN), sold 1,416 shares of Class A Common Stock on Sept. 9, 2026, according to an SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($97.54); post-transaction value based on September 09, 2026, market close ($99.16).\n\nHow does this sale align with the insider's total direct position? Following the sale of 1,416 shares, John Roderick Ten Bosch maintains a direct position of 25,051 shares, which represented a market value of $2.4 million as of the Sept. 9, 2026, market close.\n\nWhat regulatory framework governed this transaction? The trade was conducted under a Rule 10b5-1 plan adopted on June 2, 2026, which establishes a systematic trading cadence to manage equity holdings for company executives.\n\nWhat is the broader context of insider equity at BillionToOne? Total insider ownership across the company is 0.0545%, according to the latest available data, as the firm continues to develop specialized diagnostics and its molecular counting platform.\n\nDoes this transaction indicate a shift in management sentiment? The transaction was executed via a pre-established trading plan and represents a single-digit percentage of the insider's total holdings, suggesting routine portfolio management.\n\nBillionToOne develops and commercializes advanced molecular diagnostic solutions, including the UNITY Complete non-invasive prenatal screening platform, which leverages proprietary DNA molecule-counting technology to enhance the precision of disease detection.\n\nThe company generates revenue through the sale of diagnostic testing services and products that utilize its cutting-edge molecular counting platform to quantify biological data with exceptional accuracy.", "source": "Yahoo Finance", "pub_date_str": "21 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Below-Expected Earnings Pressured Shake Shack (SHAK) in Q2", "full_content": "Skip to navigation Skip to main content Skip to right column Below-Expected Earnings Pressured Shake Shack (SHAK) in Q2 Soumya Eswaran Mon, September 21, 2026 at 8:15 AM CDT 3 min read SHAK ^RUT Carillon Tower Advisers , an investment management company, released its second-quarter 2026 investor letter for the \"Carillon Eagle Small Cap Growth Fund\". The letter can be downloaded here . Small-cap stocks rallied broadly in the second quarter, with the Russell 2000 Growth Index (+25.71%) outpacing Value +17.24%). Information Technology (+46.79%) led all sectors, supported by solid gains in Real Estate (+25.91%), Industrials (+25.80%), and Health Care (+25.54%). Consumer and defensive sectors lagged, while Energy (-2.40%) was the sole sector in the red. Following a strong quarter, the outlook for equity markets remains positive, supported by robust corporate profits and economic growth. However, midterm election uncertainties could introduce volatility, especially around data center development, a key economic driver. The $1 trillion data center spending boosts corporate earnings and supports ongoing AI infrastructure investments. Additionally, reviewing the Fund's top five holdings could help identify its best picks for 2026.\n\nIn its second-quarter 2026 investor letter, Carillon Eagle Small Cap Growth Fund highlighted Shake Shack Inc. (NYSE: SHAK ). Shake Shack Inc. (NYSE:SHAK), a US-based Shake Shack restaurant chain operator that offers burgers, chicken, hot dogs, crinkle-cut fries, shakes, frozen custard, beer, wine, and other products, detracted from the Fund's performance this quarter. On September 18, 2026, Shake Shack Inc. (NYSE:SHAK) closed at $54.88 per share, reflecting a market capitalization of $2.35 billion. Shake Shack Inc. (NYSE:SHAK) posted a one-month return of -27.25%, while its shares lost 45.34% over the past 52 weeks.\n\nCarillon Eagle Small Cap Growth Fund stated the following regarding Shake Shack Inc.", "source": "Yahoo Finance", "pub_date_str": "21 Sep 2026, 06:45 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Is Archer Aviation Stock a No-Brainer Buy While It's Trading Near $5?", "full_content": "Skip to navigation Skip to main content Skip to right column Is Archer Aviation Stock a No-Brainer Buy While It's Trading Near $5? David Jagielski, CPA, The Motley Fool Mon, September 21, 2026 at 8:12 AM CDT 3 min read NVDA ACHR ARCH.OL It wasn't all that long ago that Archer Aviation (NYSE:ACHR) 's stock was trading significantly higher than it is now. Last year, it hit highs of nearly $15, as there was ample excitement around electric vertical take-off and landing aircraft (eVTOL) companies.\n\nToday, investors are a bit more cautious, as Archer is still working to obtain certification for its Midnight aircraft to begin transporting passengers. But the growth opportunities remain, and with the stock trading at around $5, its market cap is roughly $4 billion. Is the eVTOL stock worth buying right now?\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nThere's a lot of excitement around air taxis and how they might alleviate traffic in busy cities. But at the same time, there will inevitably be lots of red tape and regulations along the way, to ensure the skies don't become overly crowded, either, as planes alone can create enough challenges for air traffic controllers, let alone eVTOLs and drones.\n\nThe market is expected to grow at a fast pace, but even by the end of the decade, it won't be massive. According to data from Mordor Intelligence, the air taxi market is projected to be worth roughly $10.6 billion by 2031. And that's a significant increase from the $4.5 billion it's expected to be worth in 2026.\n\nThe big question is how large a market opportunity it will truly turn out to be.", "source": "Yahoo Finance", "pub_date_str": "21 Sep 2026, 06:42 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "S&P Global downgrades Telus outlook on higher leverage", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 06:41 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Azure, AI Capex, and What to Expect Out of Microsoft Through The End of 2026", "full_content": "Skip to navigation Skip to main content Skip to right column Azure, AI Capex, and What to Expect Out of Microsoft Through The End of 2026 Alex Sirois Mon, September 21, 2026 at 8:10 AM CDT 6 min read MSFT SPY Quick Read Azure's $678 billion contracted backlog, up 84%, and guided 45% constant-currency growth give MSFT multi-year revenue visibility few software companies can match.\n\nMSFT has trailed SPY by 900 basis points year to date despite five straight EPS beats, with a consensus analyst target implying 16% upside.\n\nCalendar 2026 capex of roughly $175 billion pushed Q4 free cash flow down 23%, giving bears a credible case if AI returns disappoint.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Microsoft didn't make the cut. Enter your email to see the names that beat MSFT. The report is free. Enter your email and see if any of your stocks made the cut.\n\nAt $493.78, Microsoft ( NASDAQ:MSFT ) sits at a pivotal setup for investors. Azure growth, an unprecedented contracted backlog, and a capex cycle that has become the entire debate around this stock make a clear view worth having right now.\n\nMicrosoft is the world's second-largest company by market value at roughly $3.67 trillion. Azure crossed $100 billion in annual revenue for the first time while full-year capex ballooned to $115.95 billion, up 79.62% year over year.\n\nShares have drifted lower through the fiscal year even as results beat estimates, leaving MSFT trailing the broad market and setting up a sharper debate about what investors are actually paying for.\n\nAzure grew 43% year over year in the fourth quarter, and management guided to roughly 45% in constant currency for the first quarter of fiscal 2027. Commercial remaining performance obligations reached $678 billion, up 84%, with the portion recognizable beyond the next 12 months up 112%. That is multi-year revenue visibility few software companies can match.", "source": "Yahoo Finance", "pub_date_str": "21 Sep 2026, 06:40 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "DA news: Finance Ministry calls for meetings with PSB, RRB chiefs \u2014 Check top updates on 3-day banking sector strike", "full_content": "DA news: The United Forum of Bank Unions (UFBU), which claims to represent 90% of the banking workforce, made a number of demands from the Centre, including a uniform dearness allowance (DA) formula for all pensioners, PTI reported.\n\nThe union called for a three-day nationwide strike beginning 28 September, which may end up impacting banking services for five-days due to the preceding weekend offs on 26 and 27 September (fourth Saturday and Sunday holidays).\n\nBank workers under the UFBU are demanding five-day banking, uniform DA formula for all pensioners, updation and improvement of pension, and option for employees covered under the National Pension System ( NPS ) to switch to the old pension scheme (OPS), the report added.\n\nThe main demand is for five-day workweek, with declaration of all Saturdays as holidays, as agreed upon during the 12th Bipartite Settlement signed with the Indian Banks' Association ( IBA ) in March 2024. This is still awaiting government notification. Currently, banks remain open on the first, third, and fifth Saturdays of a month, as per another PTI report.\n\nEarlier, bank unions under UFBU had gone on nationwide strike on September 11 over their demands. Notably, it was a Friday, followed by 12-14 September being holidays in parts of the country due to Sunday and Ganesh Chaturthi .", "source": "LiveMint Money", "pub_date_str": "21 Sep 2026, 06:40 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Anthropic\u2019s IPO Could Be the Biggest in History. Here\u2019s What SpaceX Taught Us About Buying It.", "full_content": "", "source": "Yahoo Finance", "pub_date_str": "21 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Westinghouse Could IPO at a $50 Billion Valuation. Cameco's Stake Alone Would Be Worth $24.5 Billion.", "full_content": "", "source": "Yahoo Finance", "pub_date_str": "21 Sep 2026, 06:35 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "21 Sep 2026, 07:04 PM IST", "total_stories": 357};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
