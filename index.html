\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:27 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Molbio Diagnostics shares rally 9% as Jefferies initiates 'high conviction top pick' call for recently listed stock. Why is it bullish?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Molbio Diagnostics shares rally 9% as Jefferies initiates 'high conviction top pick' call for recently listed stock. Why is it bullish? Molbio Diagnostics Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Molbio Diagnostics shares rally 9% as Jefferies initiates 'high conviction top pick' call for recently listed stock. Why is it bullish? SECTIONS Molbio Diagnostics shares rally 9% as Jefferies initiates 'high conviction top pick' call for recently listed stock. Why is it bullish? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 30, 2026, 11:24:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Molbio Diagnostics shares jumped after Jefferies initiated coverage with a Buy rating and named it a high-conviction top pick. The brokerage set a Rs 1,600 target price, implying 27% upside from Tuesday\u2019s close and nearly 98% above its Rs 807 IPO price. The stock had listed at a 21% premium at Rs 980.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:24 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mahindra Manulife Mutual Fund debuts in SIF segment with an equity long-short fund", "full_content": "Mahindra Manulife Mutual Fund has announced the launch of the MSIF Equity Long-Short Fund, an open-ended equity investment strategy under its specialised investment fund (SIF) platform. The launch marks Mahindra Manulife Mutual Fund's entry into the rapidly evolving SIF segment.\n\nThe fund will invest primarily in listed equities and equity-related instruments while selectively employing short positions through derivatives, said the fund house. It aims to generate long-term capital appreciation by identifying opportunities across different market environments and seeking risk-adjusted returns across market cycles.\n\nAccording to the fund house's media statement, the new fund offer (NFO) opens on 30 September and closes on 14 October. The fund will reopen for continuous sale and repurchase from 26 October 2026.\n\nAbhishek Jaiswal and Aalap Shah will manage the fund, according to Mahindra Manulife. Jaiswal has more than 18 years of investment management experience, while Shah has over 20 years of experience in the Indian equity and derivatives markets.\n\nSIFs are designed to bridge the gap between traditional mutual funds and portfolio management services (PMS), providing sophisticated investors access to differentiated investment strategies within a regulated mutual fund framework.\n\n\"The launch of the MSIF Equity Long-Short Fund marks our entry into the specialised investment fund space and reflects our commitment to offering differentiated investment solutions aligned with evolving investor needs. As markets become increasingly dynamic, investors are looking for strategies that can navigate opportunities across market cycles.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:20 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "8th Pay Commission: Shamli pensioners' 12 demands include coverage for retirees before 1 Jan 2026", "full_content": "Retired employees and pensioners staged a protest at the Collectorate in Shamli, Uttar Pradesh, on Tuesday, seeking the inclusion of government employees who retired before 1 January 2026 within the scope of the 8th Pay Commission.\n\nThe retired employees and pensioners' association raised a 12-point set of demands and submitted a memorandum to Prime Minister Narendra Modi and Uttar Pradesh Chief Minister Yogi Adityanath through the District Magistrate.\n\nAccording to a report by Dainik Bhaskar , the protesters highlighted a lack of clarity over the treatment of older pensioners following the constitution of the 8th Pay Commission. The association also argued that previous pay commissions did not create such a distinction between employees and pensioners based on their date of retirement.\n\nAccording to the report, the association demanded that no distinction be made by date of retirement and that the pensions of older retirees be revised as well. It also sought the restoration of the old pension system and the exemption of pension income from tax.\n\nOther key demands included a 5% increase in the pension every 5 years after age 65 and an end to deductions related to pension commutation after 10 years. The pensioners also sought payment of 18 months of dearness allowance/dearness relief (DA/DR) arrears withheld during the Covid-19 pandemic.\n\nThe memorandum further called for dearness allowance above 50% to be merged with basic pension. The association also sought interim relief for employees, teachers and pensioners, citing delays in the Pay Commission process.\n\nFor senior citizens, the pensioners demanded a 50% concession on railway fares, along with an increase in the cashless treatment limit under Ayushman Bharat to \u20b9 10 lakh. They also called for the creation of a \u2018Senior Citizens Commission\u2019.\n\nAssociation officials said signature petitions outlining their demands had previously been sent to the Prime Minister\u2019s Office .", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "New IPO listings today: Price gains - Adroit Industries, Elevate Campuses, Swastika Infra, Armee Infotech shares debut", "full_content": "New listings today : Around four new mainboard initial public offerings (IPOs) - Adroit Industries (India) IPO, Elevate Campuses IPO, Swastika Infra, and ArMee Infotech IPO - made their stock market debut on Wednesday, 30 September.\n\nAdroit Industries share price made a strong debut on Dalal Street on Wednesday, September 30. The stock opened at \u20b9 250 on the BSE, marking an 86.57% premium over its IPO price of \u20b9 134. On the NSE, the shares began trading at \u20b9 235, representing a 75.37% premium to the issue price.\n\nAdroit Industries shares hit 5% upper circuit at \u20b9 248.39 per share, after blockbuster debut.\n\nThe \u20b9 150.71-crore initial public offering (IPO) had received a strong response from investors during its three-day subscription window. By the close of bidding on September 25, the issue had been subscribed 176.85 times, with investors bidding for 139.23 crore shares compared with the 78.73 lakh shares available for subscription.\n\nElevate Campuses share price made a subdued debut on the stock exchanges on Wednesday. The stock opened at \u20b9 355.10 on the NSE, marking a 1.91% discount to its IPO price of \u20b9 362 per share. On the BSE, the shares listed at \u20b9 356.50, representing a 1.52% discount to the issue price.\n\nElevate Campuses shares fell over 3% after the listing, touching an intraday low of \u20b9 321 per share on NSE.\n\nThe \u20b9 2,100-crore initial public offering (IPO) received a subscription of 1.79 times during its three-day bidding window from September 23 to September 25.\n\nSwastika Infra share price made a positive debut on the stock exchanges on Wednesday. The stock listed at \u20b9 200 apiece on both the NSE and BSE, against its issue price of \u20b9 185, marking an 8.11% premium on its listing.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:17 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bond markets steady after sell-off", "full_content": "US long-term borrowing costs hit their highest level in almost 25 years on Tuesday", "source": "FT Markets", "pub_date_str": "30 Sep 2026, 11:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Solar Industries shares up over 6%! What's driving defence stock that has surged 60% in YTD | Check target, stop loss", "full_content": "Defence stock Solar Industries share price jumped over 6% in intra-day deals on Wednesday, September 30, after the company announced the incorporation of a new subsidiary in the Republic of Botswana.\n\n\"...this is to inform that Solar Overseas Mauritius Limited a Wholly Owned Subsidiary Company, of the Company, has incorporated \u201cSolar Explochem Proprietary Limited\u201c a Subsidiary in Republic of Botswana, on September 29, 2026,\" it said in an exchange filing.\n\nSolar Industries shares rose as much as 6.2% to its day's high of \u20b9 19,820. The stock has opened at \u20b9 19,030 after previously closing at \u20b9 18,650 (on September 29).\n\nThe company's shares had jumped over 60% in 2026 YTD and more than 47% in the past year. The defence stock was at a 15.3% decline from its 52-week high of \u20b9 22,700. Meanwhile, it has hit its 52-week low of \u20b9 11,646 in December 2025.\n\nIn near term, it fell over 4% in 1 month but rose 4.5% in 3 months and around 62% in 6 months.In 5 eyars, the stock has given multibagger returns, soaring around 820%.\n\nSolar Industries India has incorporated Solar Explochem Proprietary Limited in Botswana through its wholly owned subsidiary, Solar Overseas Mauritius Limited. The new entity was incorporated on September 29, 2026, and will operate in the explosives industry as part of the company's expansion of business operations. It is a step-down subsidiary of Solar Industries India, with Solar Overseas Mauritius Limited as its holding company.\n\nThe Botswana entity has been set up through an initial cash capital subscription of US$325,000, with Solar Industries India and/or its subsidiaries holding 65% shareholding or control. The company said no government or regulatory approvals were applicable for the incorporation.\n\nThe Botswana subsidiary's incorporation comes as Solar Industries continues to expand its international footprint.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tega Industries shares jump 6% | What\u2019s driving the stock\u2019s 30% monthly rally?", "full_content": "Tega Industries shares jumped over 6% on Wednesday, 30 September, even as the broader market remained muted. The Indian stock market rebounded across most sectors after a two-day sell-off, although persistent foreign selling and elevated oil prices amid the absence of a US-Iran peace deal continued to weigh on sentiment.\n\nTega Industries share price today opened at an intraday low of \u20b9 2,052.35 apiece on the BSE ; the stock touched an intraday high of \u20b9 2,197.50 per share.\n\nThe stock has risen 3.67% in the past week, 25.42% over two weeks, and 29.94% in one month. Over a longer horizon, Tega Industries shares have gained 27.09% in three months and 30.08% in six months.\n\nSudeep Shah, Vice President \u2013 Technical and Derivatives Research at SBI Securities, said Tega Industries broke out of a downward-sloping trendline three weeks ago, followed by a strong follow-through move. The breakout was supported by a healthy increase in volumes, lending further strength to the price action.\n\nHe noted that the rising ADX signals strengthening bullish momentum, while the widening DI lines, with DI+ comfortably above DI\u2212, indicate that bulls remain firmly in control. Shah identified the \u20b9 2,060\u2013 \u20b9 2,050 zone as the immediate support, adding that the uptrend is likely to remain intact as long as the stock sustains above this level.\n\nTega Industries declared a final dividend of \u20b9 2 per equity share for FY26 at its 50th Annual General Meeting (AGM) held on 24 September 2026. The payout represents a 20% return on the face value of \u20b9 10 per share.\n\nShareholders also approved the adoption of the company\u2019s audited standalone and consolidated financial statements for the year ended 31 March 2026. They also approved the reappointment of Madan Mohan Mohanka as a director retiring by rotation.\n\nA special resolution was further passed approving the remuneration payable to Mohanka in his capacity as Chairman and Non-Executive Director.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:04 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Inox Clean Energy files DRHP for Rs 10,000 crore IPO. Check details", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Inox Clean Energy files DRHP for Rs 10,000 crore IPO. Check details JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Inox Clean Energy files DRHP for Rs 10,000 crore IPO. Check details SECTIONS Inox Clean Energy files DRHP for Rs 10,000 crore IPO. Check details By Mohit Bhalla , ET Bureau Last Updated: Sep 30, 2026, 11:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Inox Clean Energy has filed its DRHP for a Rs 10,000 crore IPO with Sebi. The issue includes a Rs 8,000 crore fresh share sale and Rs 2,000 crore OFS. The company has a 9.29 GW renewable power portfolio and 6 GW solar module manufacturing capacity across India and the US.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "RBI may raise repo rate by 100 bps through H1 2027: BofA Securities", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a RBI may raise repo rate by 100 bps through H1 2027: BofA Securities The Economic Times daily newspaper is available online now. Read Today's Paper RBI may raise repo rate by 100 bps through H1 2027: BofA Securities SECTIONS RBI may raise repo rate by 100 bps through H1 2027: BofA Securities ANI Last Updated: Sep 30, 2026, 10:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bank of America Securities has revised its forecast for the Reserve Bank of India\u2019s interest rate hikes. It now anticipates a total increase of 100 basis points by mid-2027. The first hike is expected during the monetary policy meeting in October. Economic growth remains strong, while inflation risks are increasing, prompting the RBI to adjust its monetary policy.\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nCan Fly91\u2019s flightpath for India\u2019s smallest airline defy the doomy past?\n\nSmugglonomics: Geckos, dry dates, human hair \u2013 what makes something worth smuggling?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "30 Sep 2026, 10:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures inch higher as traders weather latest rise in Treasury yields: Live updates", "full_content": "Stock futures inched higher early Wednesday, following another session in which equities succumbed to pressure from rising bond yields.\n\nContracts tied to the Dow Jones Industrial Average rose 0.36%. S&P 500 futures gained 0.23%. Nasdaq-100 futures inched up 0.10%.\n\nIn Asia, Japan's Nikkei 225 gained 1.81% and the broader Topix was up 1.58%. South Korea's benchmark Kospi slipped 0.38% and the small-cap Kosdaq added 0.84%. Hong Kong's Hang Seng index was flat, while mainland China's CSI 300 was 0.15% higher.\n\nThe 30-year Treasury bond yield hit crossed 5.6% on Tuesday, reaching levels not seen since June 2002. The 10-year yield, meanwhile, scaled to a fresh 2007 high near 5.3%. Those moves led the Dow to decline more than 100 points, while the S&P 500 and Nasdaq slid 0.2% and 0.1%, respectively.\n\nJose Torres, senior economist at Interactive Brokers, noted that equities are \"trying to hang in there, but tighter financial conditions are emboldening the bears and lifting interest in downside hedges.\"\n\nTo be sure, new comments from New York Federal Reserve President John Williams appeared to have eased fears of higher central bank rates, at least for the moment. Williams said late Tuesday, \"there is no need for urgency, and we have time to gather more information\" before the Fed's October meeting.\n\nThe CME Group's FedWatch tool shows traders are pricing in a 49% chance of a quarter-point rate hike next month. That's down from 71% on Monday.\n\nHeading into Wednesday, traders will have their sights set on the August reading of the Personal Consumption Expenditures price index, the Federal Reserve's preferred inflation gauge. Economists polled by Dow Jones see the metric rising 0.3% for the month, leading to an annual pace of 3.7%.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Cupid, Sterlite Tech among 10 smallcap stocks set for sharp fund flows after Nifty rejig. See full list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Cupid, Sterlite Tech among 10 smallcap stocks set for sharp fund flows after Nifty rejig. See full list Written by Veer Sharma , ETMarkets.com | Sep 30, 2026, 11:14:51 AM IST 1 / 11 Reshuffle Impact The National Stock Exchange\u2019s (NSE) semi-annual rejig of Nifty indices takes effect from September 30, with Nuvama Alternative & Quantitative Research highlighting the stocks likely to see the highest inflows and outflows question: Between S&P 500 bulls and bears, who would likely win?", "full_content": "The bulls are convinced that the SPX is poised for a \"massive upside reversion,\" while the bears argue that the SPX \"can't hold up much longer.\"", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today Live: Sensex Jumps 200 Points, Nifty Pares Early Losses To Trade Above 22,700 As Crude Oil Price Drops", "full_content": "Stock Market Today Live Updates: Analysts believe the market bias is cautiously positive, but the undertone stays subdued while the Nifty 50 trades below 22,800. The immediate support for the index sits at 22,500, while a break would expose the 22,200 level.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Up 254% in 5 years! KSB share price jumps 10% after \u20b9118 crore international order - Check details, share performance", "full_content": "Shares of KSB jumped almost 10% on Wednesday, September 30, after the company announced a significant order win. The firm had received an international export order from Dangote Projects Free Zone Enterprise for the supply of boiler feed pump packages.\n\nThe order, valued at approximately \u20b9 118 crore, strengthens KSB's presence in the international fertiliser and energy sectors. The company said the order reinforces its capabilities in delivering high-efficiency, engineered pumping solutions for critical process applications.\n\nThe project is scheduled to be executed over a period extending from September 2027 to March 2028. According to the terms disclosed by KSB, delivery of the equipment is also scheduled between September 2027 and March 2028, while payment will be made after installation.\n\nThe order is classified as an international contract, with the nature of the assignment involving the supply of boiler feed pump packages.\n\nThe order involves approximately 18 boiler feed pump packages, with the overall consideration estimated at US$12,400,051. At the conversion disclosed by the company, this works out to approximately \u20b9 1180 million, or around \u20b9 118 crore.\n\nThe latest contract strengthens KSB's international presence in the fertiliser and energy sectors while expanding its portfolio of engineered pumping solutions for critical industrial applications. The company said the significant export order highlights its technology and engineering capabilities in serving international customers.\n\nKSB Ltd. is listed on both the BSE and NSE, with BSE scrip code 500249 and NSE symbol KSB. The company was formerly known as KSB Pumps Ltd. Its registered office is in Mumbai, while its head office is located on Mumbai-Pune Road in Pimpri, Pune.\n\nThe stock surged as much as 9.8% during the session, touching an intraday high of \u20b9 902. The rally added to its recent one-month gains, with the stock up 9% over the period.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Power Mech Projects shares rise 4% after company secures Rs 549 crore order from Adani Group firm", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Power Mech Projects shares rise 4% after company secures Rs 549 crore order from Adani Group firm Pow s Enterprise (down 6%), Yatharth Hospital (down 5%), Fortis Healthcare (down 6%), Artemis Medicare Services (down 5%), and Aster DM Quality Care (down 5%), crashed 5-7%.\n\nOther players from the segment, such as HealthCare Global Enterprises (down 4%), Krishna Institute of Medical Sciences (KIMS) (down 4%), Medanta (down 4%), and Rainbow Children's Medicare (down 3%), also lost significantly.\n\nMost hospital stocks are falling today due to profit-booking after the US announced that certain speciality medicines and their ingredients will be exempt from a new 100% tariff on patented drugs.\n\nThe exemption covers medicines used to treat rare diseases and several specialised therapies, including infertility treatments, cell and gene therapies and antibody-drug conjugates. The same zero-tariff treatment will apply to qualifying ingredients used in these products.\n\nThe US Commerce Department listed India among 20 countries eligible for the exemption in a notice published in the Federal Register.\n\nExperts say the pharma and hospital segments are witnessing profit-booking after their outperformance. Year-to-date, the BSE Healthcare index is up 15% compared to a 15% fall in the benchmark Sensex.\n\n\"Healthcare stocks are witnessing profit booking as they have outperformed this year. Market participants are using the positive news on US tariff exemption to take some money off the table,\" said Ajit Mishra, SVP \u2013 Research, Religare Broking.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sensex rises 130 points, Nifty falls below 22,700 amid cooling oil, rising bond yields. What lies ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Indus advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cabinet To Weigh Rabi Crop MSP Hike; Rs 54,000-Crore Green Corridor On Agenda: Sources", "full_content": "Ahead of the winter sowing season, higher floor prices are intended to assure remunerative returns to growers, incentivise domestic production, and encourage crop diversification away from water-intensive staples. While an upward revision will offer immediate financial relief to farm households and stimulate rural demand, economists note that the move could also create tailwinds for headline food inflation", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:24 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PSU banks face a bigger risk from bond yields than potential loan waivers", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMaharashtra and Karnataka have declared drought in about three-fourths of their respective talukas (tehsils) for the 2026 kharif crop season. More states could follow suit. This could prompt the central or state governments to announce farm loan waiver schemes, weighing on investor sentiment.\n\nAs PSU (public sector undertaking) banks have greater exposure to agricultural loans than their private-sector counterparts, they are likely to be more affected by loan waivers. For instance, in FY26, the agriculture sector accounted for 10% of State Bank of India's (SBI) domestic loan book, compared to around 4% for the country's largest private-sector lender HDFC Bank (excluding agriculture-related trading activities). A similar trend is seen at the second-largest PSU and private-sector banks, Punjab National Bank and ICICI Bank, respectively.\n\nShould investors in PSU banks , then, be more worried about likely loan waivers? Not necessarily. While loan waivers could weaken credit discipline, they may not have a significant impact on banks\u2019 earnings.\n\nLoan waivers have a precedent. In 2008, the central government announced a \u20b9 52,500 crore farm loan waiver amid severe rural distress, ahead of the 2009 general elections. The government had compensated all banks (public and private) back then, regardless of the quantum of exposure. So, it is not that only PSU banks are asked to bear the burden. Almost 50% of the waived amount in 2008 was released to the affected banks in the same calendar year, with the remainder paid over the next four years. Therefore, banks may incur some loss in the net present value of the loans, but not on the outstanding loan amount.\n\nUnder state-specific loan waiver schemes, the respective state governments compensate the banks.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:23 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Nifty nears longest losing streak in 25 years. Can bulls stop the 8th consecutive weekly selloff?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nifty nears longest losing streak in 25 years. Can bulls stop the 8th consecutive weekly selloff? Motilal Oswal Financial Services Share Price Aditya Birla Capital Share Price L&T Finance Share Price HDB Financial Services Share Price Piramal Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Nifty nears longest losing streak in 25 years. Can bulls stop the 8th consecutive weekly selloff? SECTIONS Nifty nears longest losing streak in 25 years. Can bulls stop the 8th consecutive weekly selloff? By Nikhil Agarwal , ETMarkets.com Last Updated: Sep 30, 2026, 10:22:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities face continued pressure from global uncertainty, crude prices and foreign investor outflows, but analysts see domestic resilience and moderating valuations providing support. The Nifty has become relatively cheaper after its recent correction, with earnings still growing. However, the near-term outlook hinges on the index holding 22,600 and attracting sustained buying to prevent an eighth consecutive weekly decline.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:22 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hero Motors share price jumps over 7%, newly listed stock up 78% from IPO price | What\u2019s driving the rally?", "full_content": "Hero Motors share price jumped more than 7% on Wednesday, 30 September, extending gains in the newly listed stock. The shares were trading around 78% above their IPO price of \u20b9 84. The company's market capitalisation stood at \u20b9 6,675.61 crore so far today. Hero Motors share price today opened at \u20b9 140.30 apiece on the BSE, the stock touched an intraday high of \u20b9 149.35, and an intraday low of \u20b9 140.10 apiece.\n\nHero Motors share price also attracted attention following a bulk deal on Monday, 28 September. Data from the BSE showed Irage Broking Services LLP bought 34,01,332 shares at \u20b9 135.70 apiece and sold 12,12,381 shares at \u20b9 134.93 apiece.\n\nHero Motors made a muted debut on 23 September, with the stock opening at \u20b9 82.10 on the BSE, a 2.26% discount to its issue price of \u20b9 84. It later recovered sharply and ended the session 17.27% higher at \u20b9 98.51.\n\nOn the NSE, the stock opened at \u20b9 82, down 2.38% from the issue price, before ending at \u20b9 98.40, up 17.14%.\n\nThe company's \u20b9 1,000-crore initial public offering (IPO) was subscribed 6.66 times on the final day of bidding. The issue had a price band of \u20b9 79\u201384 per equity share.\n\nThe mainboard IPO comprised a fresh issue of shares worth up to \u20b9 600 crore and an offer for sale ( OFS ) of up to \u20b9 400 crore.\n\nOf the fresh issue proceeds, \u20b9 190 crore is proposed to be used for repayment or pre-payment of certain outstanding borrowings, while \u20b9 200 crore will be used to purchase equipment for capacity expansion at the company's facility in Gautam Buddha Nagar, Uttar Pradesh.\n\nThe remaining funds are earmarked for inorganic growth through unidentified acquisitions and other strategic initiatives, along with general corporate purposes.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:21 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold prices rise Rs 1,100/10 gram; silver up Rs 1,050/kg ahead of inflation data. Key levels to track", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Gold prices rise Rs 1,100/10 gram; silver up Rs 1,050/kg ahead of inflation data. Key levels to track The Economic Times daily newspaper is available online now. Read Today's Paper Gold prices rise Rs 1,100/10 gram; silver up Rs 1,050/kg ahead of inflation data. Key levels to track SECTIONS Gold prices rise Rs 1,100/10 gram; silver up Rs 1,050/kg ahead of inflation data. Key levels to track By Veer Sharma , ETMarkets.com Last Updated: Sep 30, 2026, 10:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold and silver prices rebounded on the MCX on Wednesday, snapping a three-day losing streak as investors awaited US inflation data and the Federal Reserve\u2019s policy cues. Expectations of higher interest rates continued to weigh on bullion demand. Traders are also tracking the US nonfarm payrolls report, while analysts advise caution amid market volatility and outline key support and resistance levels for gold and silver.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 10:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IT Stocks Rally: Coforge, Mphasis, Persistent Systems Share Price Rallies In Green Ahead Of Accenture Q4", "full_content": "Infosys was the only stock in the list trading lower, at Rs 1,009.80, down 0.55%. Its intraday high remained marginally below the previous close, at a 0.06% decline.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Up 609% in 1 year! Small-cap stock Cupid shares jump 7% to record high on Nifty Smallcap 250 inclusion: Should you buy?", "full_content": "Shares of small-cap company Cupid surged more than 7% on Wednesday, September 30, touching a fresh record high of \u20b9 309.15 on the BSE. The sharp move came as the company entered the Nifty Smallcap 250 index as part of the latest semi-annual rejig by the National Stock Exchange (NSE), with the change becoming effective from September 30.\n\nThe index inclusion comes at a time when Cupid has already delivered a massive rally in the stock market. The shares have gained around 60% over the past three months and surged 267% in six months. Since the beginning of the year, the small-cap stock has risen around 200%, while its one-year gain stood at a staggering 609%.\n\nIt has now soared 639% from its 52-week low of \u20b9 41.80, touched in October 2025.\n\nThe latest index change could provide another potential catalyst for the stock. According to estimates from domestic brokerage Nuvama Alternative and Quantitative Research, Cupid could see inflows of around $10 million following its inclusion in the Nifty Smallcap 250 index.\n\nThe index addition also comes shortly after the company raised its financial guidance for FY27, citing strong quarterly performance, a healthy order pipeline and continued momentum across its two major business segments.\n\nAccording to Jigar S Patel, Senior Manager - Technical Research, Anand Rathi Share and Stock Brokers Limited, CUPID continues to remain in a strong uptrend, with the overall price structure indicating sustained bullish momentum. However, the stock has become overextended after the recent sharp upmove, making it vulnerable to intermittent profit booking or a short-term pullback. Hence, chasing the stock at current levels should be avoided, he suggested.\n\n\"The key support zone is placed near \u20b9 285, which now becomes an important level to monitor. We advise investors to continue holding the stock while trailing the stop-loss to \u20b9 285.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 10:10 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Japan\u2019s Nikkei rises as AI stocks track US chip gains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan\u2019s Nikkei rises as AI stocks track US chip gains Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan\u2019s Nikkei rises as AI stocks track US chip gains SECTIONS Global Market: Japan\u2019s Nikkei rises as AI stocks track US chip gains By Anupam Nagar , ETMarkets.com Last Updated: Sep 30, 2026, 10:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan\u2019s Nikkei rose 1.3% on Wednesday, led by AI and semiconductor stocks, while banking and shipping shares also advanced. SoftBank, Tokyo Electron and Advantest gained, though overall market breadth remained weak.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
