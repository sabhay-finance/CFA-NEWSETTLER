    const allData = {"general": [{"title": "Can a daughter inherit father\u2019s ancestral property after mother remarries? Madras High Court gives key ruling", "full_content": "A daughter can inherit her deceased father\u2019s share in joint family property even if her mother remarried, the Madras High Court has held. The court clarified that a disqualification applicable to a remarried widow cannot automatically be extended to the deceased man\u2019s other Class I legal heirs.\n\nThe ruling came in a dispute over the property of Venkatesan, a deceased coparcener in a Hindu joint family. His wife remarried after his death and did not claim any share in his estate. His daughter, who was his only Class I legal heir in the case, inherited his entire coparcenary interest and subsequently dealt with the property.\n\nThe dispute arose when another coparcener challenged the daughter\u2019s entitlement. The argument was that because Venkatesan\u2019s widow had remarried, her disqualification should mean that his share returned to the surviving coparceners rather than passing to his daughter.\n\nJustice P.B. Balaji rejected this argument and dismissed the revision petition on 25 August.\n\nThe case turned on Section 24 of the Hindu Succession Act, 1956, as it stood before the provision was omitted by the Hindu Succession (Amendment) Act, 2005.\n\nThe provision dealt with certain widows who remarried. It stated that a widow of a predeceased son or brother, among others covered by the provision, would not be entitled to succeed to an intestate's property as such widow if she had remarried when succession opened.\n\nIn this case, there was no dispute that Venkatesan\u2019s widow had remarried. The court also noted that she had never claimed any entitlement in his estate.\n\nThe question was whether her disqualification meant that Venkatesan\u2019s entire interest in the joint family property would revert to the other coparceners.", "source": "LiveMint Money", "pub_date_str": "15 Sep 2026, 07:04 AM IST", "pub_date_relative": "2m ago"}, {"title": "Warren to rip Clarity Act on Senate floor ahead of key preliminary vote", "full_content": "Senate Banking Committee ranking member Elizabeth Warren will rip the cryptocurrency market structure bill known as the Clarity Act in a Monday night speech, as the Senate prepares for an all-important preliminary vote on the legislation Tuesday afternoon.\n\nWarren, D-Mass., whose prepared remarks were shared first with CNBC, will call a new ethics provision in the measure that's been blessed by President Donald Trump a \"weak fig leaf that will do nothing to stop him from making his next $1.4 billion in crypto profits.\"\n\nRepublicans leading the Clarity Act effort hope some Democrats will join them in supporting the bill, which would lay out rules of the road for the crypto industry. At least 60 affirmative votes are needed for the bill to advance past Tuesday's vote.\n\nGOP leaders of the crypto bill released updated legislative language late Sunday that they said includes new ethics provisions Democrats sought. The new provision would allow state attorneys general to enforce the ethics provision, which would bar the U.S. president and other senior government officials from issuing digital assets. The bill's ethics language has remained one of the primary hurdles in the Clarity Act debate.\n\nWarren, however, will argue the proposed new ethics rules are a smoke screen.\n\n\"First, it makes sure the law could never be enforced against Donald Trump because it gives his political appointees the power to turn off enforcement of these ethics provisions,\" Warren will say, according to the prepared remarks. \"Second, it contains major loopholes designed to allow President Trump to keep earning billions of dollars from his crypto businesses, including World Liberty Financial \u2026 and his new bank.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 07:02 AM IST", "pub_date_relative": "4m ago"}, {"title": "Stocks To Watch Today: HDFC Bank, Indiabulls, Raymond Realty, Pranav Construction & More", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Tuesday.", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 07:00 AM IST", "pub_date_relative": "6m ago"}, {"title": "Trump Says Oil Prices Will 'Drop Like A Rock' When Iran Conflict Ends", "full_content": "Trump says oil prices are currently an exception to broader price declines in the US and predicts crude will plunge once the Iran conflict ends", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 06:55 AM IST", "pub_date_relative": "11m ago"}, {"title": "Stock futures are little changed as traders eye rising oil prices and rates: Live updates", "full_content": "Stock futures were near flat on Monday evening as traders looked ahead to the Federal Reserve 's policy decision due later this week and weighed a recent climb in oil prices and Treasury yields.\n\nS&P 500 futures were up 0.05%, while futures tied to the Dow Jones Industrial Average gained 21 points, or 0.04%. Nasdaq 100 futures advanced 0.03%.\n\nIn the regular trading day, the Dow declined 152 points, or 0.3%. The S&P 500 lost 0.5%, while the Nasdaq Composite slipped about 0.6%.\n\nAsia-Pacific markets fell in early trade Tuesday. Japan's Nikkei 225 declined 0.25%, while the Topix lost 0.24%. South Korea's Kospi fell 0.43%, and the small-cap Kosdaq declined 0.33%. Australia's S&P/ASX 200 was down 0.46%.\n\nA sell-off in artificial intelligence-related names has weighed down the stock market after Anthropic CEO Dario Amodei called for a slower pace on AI development . Over the weekend, OpenAI CEO Sam Altman also ruled out an initial public offering this year, pointing to growing worries around AI safety.\n\nA slate of AI-connected stocks slid, with Nvidia dropping 3% and specialty glass and fiber optic play Corning tumbled 13%. The iShares AI Innovation and Tech Active ETF (BAI) dropped nearly 4%.\n\nHigher Treasury yields also spooked investors. The 10-year Treasury yield briefly topped 5% on Monday for its highest level since October 2023. Oil prices also edged higher after Saudi Arabia shuttered a key pipeline that bypasses the Strait of Hormuz , leading Brent futures to close above $105 a barrel and West Texas Intermediate crude to settle over $101.\n\nThe Fed's policy rate decision expected Wednesday is also weighing on traders' minds. Fed funds futures trading suggest a roughly 92% likelihood that the central bank will lift rates by a quarter point from the current target rate range of 3.5% to 3.75%.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:54 AM IST", "pub_date_relative": "11m ago"}, {"title": "'No Talks Until...': Iran Draws A Red Line For Trump", "full_content": "Iran has rejected renewed US talks until its conditions are met, after Donald Trump said Tehran urgently wants a deal. The dispute centers on sanctions relief and commitments under a June MoU.", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 06:52 AM IST", "pub_date_relative": "13m ago"}, {"title": "Bourses and Brokers May Win From India\u2019s Proposed Auction Revamp", "full_content": "(Bloomberg) -- Stock exchanges and brokers could be among the biggest beneficiaries of the Securities and Exchange Board of India\u2019s proposed changes to the newly launched closing auction system that\u2019s caused chaos, while market makers may face tighter constraints.\n\nThat\u2019s the takeaway from market players after the regulator suggested a sweeping revamp of the mechanism that\u2019s spurred wild swings at the end of trading sessions. In a discussion paper released on Saturday, SEBI made several proposals, including to determine the settlement price based on a blend of the 30-minute volume-weighted average price and a 10-minute auction window \u2014 or retain the old VWAP methodology for a year before shifting to the blended system.\n\nIn either scenario, the eventual price would lean more heavily on the continuous trading session, where the bulk of market activity takes place. That shift could make the closing process more predictable and help restore confidence.\n\nMeanwhile, market makers could face a less friendly regime as the regulator suggested restrictions to cancellation orders.\n\n\u201cThe proposals are broadly positive for the market infrastructure ecosystem,\u201d said Kruti Shah, a quantitative analyst at Equirus Securities. The changes should make the closing process more orderly and reduce some of the uncertainty that has emerged around price discovery and expiry-day trading, benefiting exchanges and intermediaries other than market makers, she said.\n\nAlso read: India\u2019s SEBI Seeks Major Changes to Unpopular Auction System\n\nThe closing auction system introduced on Aug. 3 was meant to improve end-of-day prices and align India with other major global bourses. Instead, it led to unexpected wild moves at the end of the trading day, both in the equities and derivatives markets, as well as during last month\u2019s MSCI Inc. index rebalancing.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:51 AM IST", "pub_date_relative": "15m ago"}, {"title": "Waymo plans Tokyo robotaxi service in 2027 with GO, Nihon Kotsu", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:49 AM IST", "pub_date_relative": "16m ago"}, {"title": "CPI Card Group chairman Riley Sanford buys $299,989 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:45 AM IST", "pub_date_relative": "20m ago"}, {"title": "CPI Card Group director Mallela Ravi buys $21,500 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:45 AM IST", "pub_date_relative": "20m ago"}, {"title": "Pranav Constructions IPO listing today: GMP at \u20b952; Share price prediction ahead of NSE, BSE debut", "full_content": "Pranav Constructions IPO listing date has been scheduled for today (Tuesday, 15 September) on the bourses at 10:00 IST. Pranav Constructions IPO allotment was finalised on Thursday, 10 September. According to details on the BSE website, Pranav Constructions share price will list in a special pre-open session on both the BSE and NSE during Tuesday's trades. Pranav Constructions share price today will be available for trade from 10:00 IST.\n\nMembers of the Exchange are notified that starting Tuesday, 15 September 2026, the equity shares of Pranav Constructions will be listed and made available for trading on the Exchange under the 'B' Group of Securities, as stated in the BSE notice.\n\nPranav Constructions IPO GMP today is +52. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of the Pranav Constructions share was \u20b9 176 apiece, which is 41.94% higher than the IPO price of \u20b9 124.\n\nConsidering the grey market performance over the past 14 days, the IPO's GMP is rising today, suggesting anticipation of a robust listing. Throughout this period, the GMP fluctuated between \u20b9 23 and \u20b9 52, according to analysts.\n\nThe Pranav Constructions IPO subscription status was 121 times on the final day of bidding on Friday. According to NSE data, the Pranav Constructions IPO received bids for 2,71,80,43,800 equity shares against 2,24,63,137 shares offered.\n\nThe Qualified Institutional Buyers (QIBs) portion was subscribed 258.71 times, while the Non-Institutional Investors (NIIs) category was subscribed 208.21 times. The Retail Individual Investors (RIIs) segment was subscribed 43.33 times.\n\nThe Pranav Constructions IPO price band was set at \u20b9 118- \u20b9 124 per share, valuing the company at \u20b9 351 crore at the upper end.\n\nPranav Constructions IPO has reserved not more than 40% of the shares in the public issue for QIBs, not less than 15% for NIIs, and not more than 45%for retail investors.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:43 AM IST", "pub_date_relative": "22m ago"}, {"title": "Five Stocks To Buy: Paytm, FirstCry, Concord Biotech And More | September 15", "full_content": "The suggested trading strategies encompass entry levels, price targets for upside potential and stop-loss limits to manage downside risk.", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 06:42 AM IST", "pub_date_relative": "23m ago"}, {"title": "Breakout stocks to buy: Sumeet Bagadia recommends five shares to buy today \u201415 September 2026", "full_content": "Stocks to buy : The Indian stock market ended last week on a weak note, extending its losing streak to five consecutive weeks\u2014the first time in a year that the benchmarks have recorded such a run of weekly declines. The markets opened the week on a subdued note and remained under pressure for most of the trading sessions. The Sensex dropped 2.27% to end at 74,781.76, while the Nifty declined 2.09% to close at 23,398.10.\n\nBroader market indices also witnessed selling pressure, with the midcap index falling 1.40% and the smallcap index declining 0.88%. The continued weakness in the Nifty 50 has taken its year-to-date decline in 2026 to 10.50%, while the Sensex has slipped 12.24% so far this year.\n\nNifty 50 witnessed a sharp gap-down opening at 23,270.30, falling 207 points initially, before finding a strong base around the 23,250 zone. The index touched a low of 23,231.40 and later recovered towards 23,448.10, finally closing at 23,398.10, down 79.70 points (-0.34%). Strong buying emerged from the day's lower levels, with short covering visible after the recent decline. Nifty formed a strong bullish candle, although it remained below the previous day's close. RSI stands at 27.22, indicating an oversold zone, while PCR was at 1.02. India VIX rose 4.15% to 12.28, reflecting higher volatility.\n\n\u201cFrom a technical perspective, Nifty is likely to maintain a Sideways bias, with the 23,250\u201323,300 zone acting as the immediate support area. Resistance is placed at 23,500\u201323,600, and a sustained move above 23,600 could support further recovery, particularly if short covering continues. On the downside, a decisive break below 23,250 may resume the broader selling pressure. The expected trading range for the next session is 23,250\u201323,600. Sector-wise, Nifty IT Services, Private Bank and Media were among the key gainers, while Realty, Metal and Chemical remained the major laggards.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:40 AM IST", "pub_date_relative": "26m ago"}, {"title": "Accenture to pay $25 million to settle US government allegations over DEI", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:36 AM IST", "pub_date_relative": "30m ago"}, {"title": "SK Hynix squeezed inside Ichimoku cloud: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:36 AM IST", "pub_date_relative": "30m ago"}, {"title": "Nikkei 225 flashes doji at 63,500 in bear downtrend: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:36 AM IST", "pub_date_relative": "30m ago"}, {"title": "Nikkei Bucks Asian Weakness; ASX 200, Kospi Slip As Oil Stays Elevated", "full_content": "Global technology and AI-linked stocks came under pressure after Anthropic CEO Dario Amodei called for a slowdown in the development of increasingly capable AI models, citing safety concerns.", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 06:35 AM IST", "pub_date_relative": "31m ago"}, {"title": "Global Market Today: Asian stocks edge lower on AI concerns, oil gains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian stocks edge lower on AI concerns, oil gains Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian stocks edge lower on AI concerns, oil gains SECTIONS Global Market Today: Asian stocks edge lower on AI concerns, oil gains Bloomberg Last Updated: Sep 15, 2026, 06:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis MSCI\u2019s Asia Pacific equities gauge slipped 0.1%, with benchmarks in Japan and South Korea edging lower. The move followed a retreat on Wall Street on Monday, where the Philadelphia Semiconductor Index tumbled 5.9% \u2014 its biggest drop in more than two months \u2014 with Nvidia Corp. and Intel Corp. among the decliners.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Sep 2026, 06:31 AM IST", "pub_date_relative": "34m ago"}, {"title": "Devon Energy CEO Clay Gaspar buys $199,876 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:30 AM IST", "pub_date_relative": "35m ago"}, {"title": "Rhythm Pharmaceuticals president & CEO Meeker sells $5.13m stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:30 AM IST", "pub_date_relative": "35m ago"}], "cfa": [{"title": "Warren to rip Clarity Act on Senate floor ahead of key preliminary vote", "full_content": "Senate Banking Committee ranking member Elizabeth Warren will rip the cryptocurrency market structure bill known as the Clarity Act in a Monday night speech, as the Senate prepares for an all-important preliminary vote on the legislation Tuesday afternoon.\n\nWarren, D-Mass., whose prepared remarks were shared first with CNBC, will call a new ethics provision in the measure that's been blessed by President Donald Trump a \"weak fig leaf that will do nothing to stop him from making his next $1.4 billion in crypto profits.\"\n\nRepublicans leading the Clarity Act effort hope some Democrats will join them in supporting the bill, which would lay out rules of the road for the crypto industry. At least 60 affirmative votes are needed for the bill to advance past Tuesday's vote.\n\nGOP leaders of the crypto bill released updated legislative language late Sunday that they said includes new ethics provisions Democrats sought. The new provision would allow state attorneys general to enforce the ethics provision, which would bar the U.S. president and other senior government officials from issuing digital assets. The bill's ethics language has remained one of the primary hurdles in the Clarity Act debate.\n\nWarren, however, will argue the proposed new ethics rules are a smoke screen.\n\n\"First, it makes sure the law could never be enforced against Donald Trump because it gives his political appointees the power to turn off enforcement of these ethics provisions,\" Warren will say, according to the prepared remarks. \"Second, it contains major loopholes designed to allow President Trump to keep earning billions of dollars from his crypto businesses, including World Liberty Financial \u2026 and his new bank.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 07:02 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures are little changed as traders eye rising oil prices and rates: Live updates", "full_content": "Stock futures were near flat on Monday evening as traders looked ahead to the Federal Reserve 's policy decision due later this week and weighed a recent climb in oil prices and Treasury yields.\n\nS&P 500 futures were up 0.05%, while futures tied to the Dow Jones Industrial Average gained 21 points, or 0.04%. Nasdaq 100 futures advanced 0.03%.\n\nIn the regular trading day, the Dow declined 152 points, or 0.3%. The S&P 500 lost 0.5%, while the Nasdaq Composite slipped about 0.6%.\n\nAsia-Pacific markets fell in early trade Tuesday. Japan's Nikkei 225 declined 0.25%, while the Topix lost 0.24%. South Korea's Kospi fell 0.43%, and the small-cap Kosdaq declined 0.33%. Australia's S&P/ASX 200 was down 0.46%.\n\nA sell-off in artificial intelligence-related names has weighed down the stock market after Anthropic CEO Dario Amodei called for a slower pace on AI development . Over the weekend, OpenAI CEO Sam Altman also ruled out an initial public offering this year, pointing to growing worries around AI safety.\n\nA slate of AI-connected stocks slid, with Nvidia dropping 3% and specialty glass and fiber optic play Corning tumbled 13%. The iShares AI Innovation and Tech Active ETF (BAI) dropped nearly 4%.\n\nHigher Treasury yields also spooked investors. The 10-year Treasury yield briefly topped 5% on Monday for its highest level since October 2023. Oil prices also edged higher after Saudi Arabia shuttered a key pipeline that bypasses the Strait of Hormuz , leading Brent futures to close above $105 a barrel and West Texas Intermediate crude to settle over $101.\n\nThe Fed's policy rate decision expected Wednesday is also weighing on traders' minds. Fed funds futures trading suggest a roughly 92% likelihood that the central bank will lift rates by a quarter point from the current target rate range of 3.5% to 3.75%.", "source": "CNBC Top News", "pub_date_str": "15 Sep 2026, 06:54 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'No Talks Until...': Iran Draws A Red Line For Trump", "full_content": "Iran has rejected renewed US talks until its conditions are met, after Donald Trump said Tehran urgently wants a deal. The dispute centers on sanctions relief and commitments under a June MoU.", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 06:52 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Bourses and Brokers May Win From India\u2019s Proposed Auction Revamp", "full_content": "(Bloomberg) -- Stock exchanges and brokers could be among the biggest beneficiaries of the Securities and Exchange Board of India\u2019s proposed changes to the newly launched closing auction system that\u2019s caused chaos, while market makers may face tighter constraints.\n\nThat\u2019s the takeaway from market players after the regulator suggested a sweeping revamp of the mechanism that\u2019s spurred wild swings at the end of trading sessions. In a discussion paper released on Saturday, SEBI made several proposals, including to determine the settlement price based on a blend of the 30-minute volume-weighted average price and a 10-minute auction window \u2014 or retain the old VWAP methodology for a year before shifting to the blended system.\n\nIn either scenario, the eventual price would lean more heavily on the continuous trading session, where the bulk of market activity takes place. That shift could make the closing process more predictable and help restore confidence.\n\nMeanwhile, market makers could face a less friendly regime as the regulator suggested restrictions to cancellation orders.\n\n\u201cThe proposals are broadly positive for the market infrastructure ecosystem,\u201d said Kruti Shah, a quantitative analyst at Equirus Securities. The changes should make the closing process more orderly and reduce some of the uncertainty that has emerged around price discovery and expiry-day trading, benefiting exchanges and intermediaries other than market makers, she said.\n\nAlso read: India\u2019s SEBI Seeks Major Changes to Unpopular Auction System\n\nThe closing auction system introduced on Aug. 3 was meant to improve end-of-day prices and align India with other major global bourses. Instead, it led to unexpected wild moves at the end of the trading day, both in the equities and derivatives markets, as well as during last month\u2019s MSCI Inc. index rebalancing.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:51 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "CPI Card Group chairman Riley Sanford buys $299,989 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:45 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CPI Card Group director Mallela Ravi buys $21,500 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Sep 2026, 06:45 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Pranav Constructions IPO listing today: GMP at \u20b952; Share price prediction ahead of NSE, BSE debut", "full_content": "Pranav Constructions IPO listing date has been scheduled for today (Tuesday, 15 September) on the bourses at 10:00 IST. Pranav Constructions IPO allotment was finalised on Thursday, 10 September. According to details on the BSE website, Pranav Constructions share price will list in a special pre-open session on both the BSE and NSE during Tuesday's trades. Pranav Constructions share price today will be available for trade from 10:00 IST.\n\nMembers of the Exchange are notified that starting Tuesday, 15 September 2026, the equity shares of Pranav Constructions will be listed and made available for trading on the Exchange under the 'B' Group of Securities, as stated in the BSE notice.\n\nPranav Constructions IPO GMP today is +52. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of the Pranav Constructions share was \u20b9 176 apiece, which is 41.94% higher than the IPO price of \u20b9 124.\n\nConsidering the grey market performance over the past 14 days, the IPO's GMP is rising today, suggesting anticipation of a robust listing. Throughout this period, the GMP fluctuated between \u20b9 23 and \u20b9 52, according to analysts.\n\nThe Pranav Constructions IPO subscription status was 121 times on the final day of bidding on Friday. According to NSE data, the Pranav Constructions IPO received bids for 2,71,80,43,800 equity shares against 2,24,63,137 shares offered.\n\nThe Qualified Institutional Buyers (QIBs) portion was subscribed 258.71 times, while the Non-Institutional Investors (NIIs) category was subscribed 208.21 times. The Retail Individual Investors (RIIs) segment was subscribed 43.33 times.\n\nThe Pranav Constructions IPO price band was set at \u20b9 118- \u20b9 124 per share, valuing the company at \u20b9 351 crore at the upper end.\n\nPranav Constructions IPO has reserved not more than 40% of the shares in the public issue for QIBs, not less than 15% for NIIs, and not more than 45%for retail investors.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:43 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Five Stocks To Buy: Paytm, FirstCry, Concord Biotech And More | September 15", "full_content": "The suggested trading strategies encompass entry levels, price targets for upside potential and stop-loss limits to manage downside risk.", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 06:42 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Breakout stocks to buy: Sumeet Bagadia recommends five shares to buy today \u201415 September 2026", "full_content": "Stocks to buy : The Indian stock market ended last week on a weak note, extending its losing streak to five consecutive weeks\u2014the first time in a year that the benchmarks have recorded such a run of weekly declines. The markets opened the week on a subdued note and remained under pressure for most of the trading sessions. The Sensex dropped 2.27% to end at 74,781.76, while the Nifty declined 2.09% to close at 23,398.10.\n\nBroader market indices also witnessed selling pressure, with the midcap index falling 1.40% and the smallcap index declining 0.88%. The continued weakness in the Nifty 50 has taken its year-to-date decline in 2026 to 10.50%, while the Sensex has slipped 12.24% so far this year.\n\nNifty 50 witnessed a sharp gap-down opening at 23,270.30, falling 207 points initially, before finding a strong base around the 23,250 zone. The index touched a low of 23,231.40 and later recovered towards 23,448.10, finally closing at 23,398.10, down 79 Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Federal Reserve's potential rate hike looms over global markets. US 10-year sovereign yields nearing five percent pose a significant challenge. This rise makes emerging markets like India less attractive for foreign investors. High risk-free rates globally affect all asset valuations and investment strategies. Indian retail investors may face increased pressure from institutional selling.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Sep 2026, 06:29 AM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures are little changed as traders eye rising oil prices and rates: Live updates - CNBC", "full_content": "Stock futures are little changed as traders eye rising oil prices and rates: Live updates CNBC S&P 500 Seen Dropping 10% on Fed Hikes, MRA Strategist Says Bloomberg.com VIDEO: How We\u2019re Positioning the Portfolio for the Fed, AI and Rising Yields TheStreet Pro Stock Futures Slide, Oil Rises Ahead of Fed Rate Decision Barron's Daily: Stock outlook remains constructive UBS", "source": "Google News Business", "pub_date_str": "15 Sep 2026, 06:29 AM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US 10-year yields reach 5%, highest since October 2023", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US 10-year yields reach 5%, highest since October 2023 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US 10-year yields reach 5%, highest since October 2023 SECTIONS US 10-year yields reach 5%, highest since October 2023 Reuters Last Updated: Sep 15, 2026, 06:20:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The rise of U.S. Treasury yields over five percent indicates expectations for a longer period of elevated interest rates. This trend comes amid increasing oil prices and inflation worries, compounded by significant debt issuance and fiscal issues. As a result, higher borrowing costs are set to impact mortgages, personal loans, and corporate financing practices across the board.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Sep 2026, 06:20 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty stretched on the downside: Key reasons why a bounce back may be due", "full_content": "The Nifty ended another difficult week on a weak note, falling 499.60 points, or 2.09%, and extending its decline to five consecutive weeks.\n\nThe current run now equals the index\u2019s longest weekly losing streak of CY2026. The Nifty had earlier registered a similar five week decline between February and March.\n\nAlthough the index recovered from lower levels in each of the last two sessions, the price structure remained weak. The rebounds were not strong enough to produce a higher low or take the index above the previous session\u2019s high.\n\nFriday\u2019s recovery came after the Nifty tested the lower boundary of a declining channel. This has brought the session low of 23,231 into focus as an important near term support.\n\nThe overall structure, however, continues to favour the bears. The index has slipped below a cluster of Fibonacci support levels from the previous upswing and has also broken below the earlier swing low. With that, the trend setup has moved into a confirmed downtrend.\n\nThere are, however, signs that the recent fall may be overextended in the near term.\n\nThe Nifty has finished below the lower Bollinger Band for three consecutive sessions, a reading that often appears after a sharp directional move. If the index manages to defend Friday\u2019s low, some recovery or short covering could emerge over the next few sessions.\n\nMomentum indicators are also reflecting the intensity of the recent selling. The daily 14 period RSI has moved into oversold territory, while the weekly RSI is now testing the 40 mark, an important zone from a medium term perspective.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:18 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IPO Bonanza: NSE, Hero Motors Among 11 Issues To Open For Subscription This Week", "full_content": "Five of the 11 issues are mainboard, namely: NSE IPO, Hero Motors IPO, and offerings from SS Retail, Sonaselection India and Jindal Supreme which are cumulatively eyeing a Rs 24,328.02 crore fundraise.", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 06:13 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NSE IPO's steep valuation discount to BSE based on FY26 earnings is misleading", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nNational Stock Exchange of India Ltd (NSE) offer-for-sale issue pricing comes as a rude shock to investors buying the shares in the unlisted market. The price band of \u20b9 1,700-1,785 is nearly 10% lower than the price before the announcement.\n\nGiven the bearish tone in leading equity benchmarks and a large issue of \u20b9 22,560 crore, NSE\u2019s management may have thought of making pricing attractive. The stock\u2019s price-to-earnings multiple, based on FY26 earnings is 43\u2014a steep 23% discount to BSE\u2019s 56. This may seem tempting for investors, but looking at valuation based on FY26 earnings may not give a true picture, given NSE\u2019s far slower year-on-year net profit growth of 11% for the June quarter (Q1FY27), versus 65% for BSE. The trend is likely to continue in FY27, based on trading volume data in Q2FY27 so far.\n\nThough NSE remains the leader across cash and derivatives trading volumes, the bigger size alone may not justify valuation premium. Moreover, unlike NSE, BSE has several levers to boost its financial performance.\n\nBSE\u2019s option transaction charges are lower at \u20b9 3,250 per crore versus \u20b9 3,550 per crore for NSE. So, if BSE decides to hike charges, its revenue could rise. Moreover, falling futures volumes hurt NSE\u2019s income from futures transaction charges, whereas BSE is immune.\n\nThis is because NSE charges \u20b9 183 per crore of index futures and stock futures transaction, but BSE has kept it free to attract volumes. So, if BSE decides to levy transaction charges on futures, it will add to its net profit.\n\nThere is ample room for BSE to gain share in the cash market, where NSE still commands a dominant 93% share as per Q1FY27 data.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock recommendations for 15 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Domestic stocks staged a strong recovery from intraday lows on 11 September, recouping much of their opening losses as crude oil prices retreated after their recent surge, triggering buying in oil-sensitive stocks. The latest sell-off had also pushed frontline indices into oversold territory, prompting value buying at lower levels.\n\nThe Nifty 50 rebounded 0.72% from its intraday low but still ended the session 0.34% lower at 23,398. The Sensex also recovered sharply from its lows but closed 0.16% lower at 74,780.\n\nIndian equities ended lower on 11 September after a volatile session, with Nifty 50 closing at 23,398.10, down 79.70 points or 0.34%, after recovering sharply from an intraday low of 23,231.40. The index touched a high of 23,448.10. Sentiment remained cautious amid elevated crude oil prices, rising U.S. bond yields and persistent geopolitical tensions in West Asia. On the sectoral front, Nifty Realty (-2.70%) and Metals (-2.30%) led the decline, followed by Auto (-0.86%), Oil & Gas (-0.84%) and PSU Banks (-0.62%). On the same time, Private Banks (+0.48%), Media (+0.16%), and IT (+0.11%) provided some support. Market breadth remained distinctly weak, with 1,476 stocks advancing, 2,042 declining, and 120 remaining unchanged, translating into an advance-decline ratio of roughly 0.72:1, signalling broader selling pressure despite Nifty's recovery from the day's lows\n\nPrice action has deteriorated following a decisive break below this rising trendline that had guided the recovery since the April lows. The index is also trading below its key short- and medium-term moving averages. At the same time, the sequence of lower highs and lower lows indicates that sellers continue to dominate the near-term trend. Momentum indicators reinforce the bearish setup.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Raja Venkatraman recommends three stocks for 15 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBetween 7 September and 11 September 2026, Indian equities remained under pressure, marking the fifth consecutive week of weakness. The Nifty slipped 1.15% to close at 23,897.70, while the Sensex lost nearly 0.97% to end at 76,515.43. Elevated crude oil prices, persistent global uncertainties, and foreign fund outflows weighed on investor sentiment throughout the week.\n\nBetween 7 September and 11 September 2026, Indian equities remained under pressure, marking the fifth consecutive week of weakness. The Nifty slipped 1.15% to close at 23,897.70, while the Sensex lost nearly 0.97% to end at 76,515.43. Elevated crude oil prices, persistent global uncertainties, and foreign fund outflows weighed on investor sentiment throughout the week. The Nifty Bank showed relative resilience, easing only 0.22% to 57,369.65, supported by selective buying in banking stocks.\n\nSectoral performance was mixed, with Pharma and Healthcare offering some stability, while IT, FMCG, Realty , and Metals faced selling pressure. Broader markets outperformed, with midcaps and smallcaps managing modest gains, and over 180 stocks hitting fresh 52-week highs, reflecting strength in select pockets. Technically, the Nifty slipped below the 24,000 mark, forming lower highs on weekly charts, signalling short-term weakness. Analysts expect consolidation to continue, with key support around 23,700\u201323,800 and resistance near 24,000.\n\nGlobal cues continue to test the patience of financial markets, keeping traders on edge with a mix of uncertainty and volatility. Elevated crude oil prices remain a persistent concern, adding pressure to inflationary expectations and weighing on sentiment across emerging economies. At the same time, geopolitical tensions in the Middle East and shifting signals from the U.S. Federal Reserve on interest rate policy have amplified caution.", "source": "LiveMint Markets", "pub_date_str": "15 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: All You Need To Know Going Into Trade On Sept 15", "full_content": "Stocks in the news, big brokerage calls of the day, complete trade setup and much more!", "source": "NDTV Profit", "pub_date_str": "15 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Indian benchmark indices witnessed a turbulent trading day on Friday, suffering significant losses in the initial hours. Analysts imply that crossing the 23,500 mark could hint at a recovery toward 23,650 levels. The India VIX surged by 4.1%, settling at 12.28, reflecting increased market anxiety. Foreign portfolio investors netted sales of shares worth Rs 931 crore, contrasting with domestic investors who bought Rs 1,968 crore.", "source": "Economic Times Markets", "pub_date_str": "15 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}], "updated_at": "15 Sep 2026, 07:06 AM IST", "total_stories": 361};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
