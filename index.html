agement"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Is a US Fed rate hike confirmed in Dec meet? How will it impact Sensex, Nifty, Gold as US PCE inflation rises in October", "full_content": "Stock market today : Indian equity benchmarks Sensex and Nifty snapped their two-session winning streak on Friday as rising crude oil prices amid escalating geopolitical tensions in the Middle East weighed on investor sentiment. Sustained institutional buying, however, offered some support to the market. Meanwhile, hotter-than-expected core US inflation has added to concerns about the Federal Reserve's December policy decision, with investors assessing whether interest rates could rise further instead of coming down.\n\nUS Personal Consumption Expenditures (PCE) inflation, the Fed's preferred inflation gauge, rose to 3.8% in October from 3.6% in September, in line with expectations. However, core PCE inflation, which excludes food and energy prices, increased to 3.3%, against forecasts of 3.2%. Core prices also rose 0.3% for the third consecutive month.\n\nWhile headline inflation could ease in the coming months following the sharp decline in oil prices since late October, persistent core inflation indicates that underlying price pressures remain elevated. This is particularly important because the Fed closely monitors core inflation when assessing the sustainability of price pressures.\n\nThe Nifty 50 opened lower at 25,839 and touched an intraday low of 25,666.75. The 30-stock BSE Sensex also opened lower at 84,093 before slipping to an intraday low of 83,547. Sensex fell 781.5 points to the day's low, while Nifty 50 shed 218 points to its intraday low.\n\nThe latest inflation reading has weakened the case for near-term monetary easing, with core inflation remaining sticky despite softer consumer spending.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 01:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Sensex Drops 700 Points, Nifty Below 25,700; Infosys, TCS, HCLTech Tumble", "full_content": "The BSE Sensex opened at 84,093.24, against its previous close of 84,328.59. Meanwhile, the NSE Nifty 50 opened at 25,839.25, compared with its previous close of 25,884.50.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 01:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nifty To See Limited Upside? CLSA's Vikash Jain Sees Low-Teens Even As FPI Investment Continues | Here's Why", "full_content": "Jain told NDTV Profit that India's recent outperformance against other markets was partly a reminder that global investors had become excessively concentrated in artificial intelligence-linked trades, leaving other markets under-owned.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 01:15 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Asahi India Glass may keep sparkling, irrespective of ICE or EV growth", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Asahi India Glass stock hit an all-time high of \u20b9 1,206 on Thursday, having risen almost 30% since the company announced strong September-quarter (Q2FY27) results on 3 November.\n\nICICI Securities expects revenue and Ebitda to grow at a CAGR of 15% and 24%, respectively, over FY26-FY29. The stock is currently trading at an EV/Ebitda multiple of 19x, based on the brokerage\u2019s FY29 estimates. While this valuation may look rich, some leading auto ancillary companies trade at even higher multiples. For instance, Uno Minda and Sona BLW Precision Forgings trade at EV/Ebitda multiples of 21x and 27x, respectively, based on Bloomberg consensus FY29 estimates.\n\nSceptics would argue that Asahi derives about 70% of its sales from the automobile industry and therefore does not deserve a valuation comparable to auto ancillary companies. Asahi makes automotive glass used in all types of vehicles, whether powered by internal combustion engines (ICE) or electricity. It derives the remaining 30% of sales from architectural glass used in construction and other segments. Both are manufactured from float glass, but processing automotive glass is generally more complex than architectural glass, requiring intricate 3D bending and tight safety norms for use in vehicles.\n\nThe point to note is that the profitability of architectural glass, used in construction and white goods, is even higher. Asahi\u2019s architectural glass Ebit margin in Q2FY27 was 22.6%, compared with 12.3% for automotive glass. Even when the more relevant metric of return on capital employed (ROCE) is considered, the difference is not significant: architectural glass had a ROCE of 8%, against 9.7% for automotive glass.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 01:05 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "From selling business stake to donating \u20b9207 crore in gold at Tirupati: The story of Chennai entrepreneur Vardhaman Jain", "full_content": "A remarkable act of devotion has brought Chennai-based entrepreneur Vardhaman Jain and his wife, Radhika Jain, into the spotlight after they donated 121 kg of gold worth \u20b9 207 crore, according to a report by The Times of India.\n\nThe donation was made to Lord Venkateswara at Tirumala in Andhra Pradesh and is described as the largest of its kind to a temple in independent India.\n\nThe couple presented 46 intricately made gold ornaments to the deity at the temple on 26 November. They were accompanied by Andhra Pradesh Chief Minister N Chandrababu Naidu and senior officials from Tirumala Tirupati Devasthanams (TTD)\n\nAccording to the TTD, the ornaments weigh about 106 kg and are made of 24-carat gold . They include crowns, armlets, necklaces, anklets, waistbands and other traditional jewellery. The donation also includes precious stones , such as diamonds, blue and yellow sapphires, rubies and emeralds.\n\nThe remaining 15 kg of gold will be used to create a golden saree for Goddess Padmavathi, the consort of Lord Venkateswara, at the Tiruchanoor temple.\n\nVardhaman Jain co-founded a US-based healthcare business process outsourcing (BPO) company with his brother, Anurag Jain. He said the decision to donate followed the sale of his equity stake to a New York-based private equity firm last year.\n\nAccording to reports, he approached TTD officials in August 2025 with a proposal to donate 121 kg of gold. During a meeting with CM Naidu, he learned that the deity\u2019s daily jewellery weighs approximately 120 kg. The information further boosted the family's resolve to make the donation in the form of ornaments.\n\nNaidu praised the couple's gesture, saying their generosity stood out even among India\u2019s most prominent and wealthy individuals.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 12:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold, Silver Rates Live Updates, Nov 27: Gold Rebounds From 15-Month Low, Silver Surges Nearly 6%; Check City-Wise Prices", "full_content": "Gold and silver rebound as a weaker US dollar and a recovery in technology stocks lift bullion, even as expectations of Federal Reserve rate hikes persist. Track 22K and 24K gold prices across Mumbai, Delhi, Chennai, Bengaluru and Hyderabad.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Tech German software major SAP is reportedly weighing cutting at least 10,000 jobs in AI push", "full_content": "SAP is preparing a plan to eliminate at least 10,000 positions as the German firm reshapes its software business for the artificial intelligence era, Bloomberg reported on Thursday , citing people familiar with the matter.\n\nThe report came as the company flagged a cybersecurity attack, but said it had found \"no evidence of unauthorized access to customer business data.\"\n\n\"SAP has identified suspicious activity and promptly implemented the necessary measures to protect its customers and preserve the security of its services,\" a company spokesperson said.\n\n\"Our customers trust us to protect their data, and that remains our highest priority. In a highly dynamic threat environment, we will continue to strengthen our security to provide the secure and resilient environment our customers depend on.\"\n\nThe company did not respond to a request for comment on the reported job cuts. The number could change after labor negotiations.\n\nOther software companies have also tied workforce reductions to AI initiatives, though for different reasons. WiseTech Global said in February it planned to cut about 2,000 jobs over two years as it integrated AI into its products and operations.\n\nAtlassian said in March it would cut about 1,600 jobs partly to fund further AI investment, while Cloudflare said in May it would eliminate more than 1,100 roles as it moved toward an AI-first operating model.\n\nIn the U.S., employers cited AI in 121,401 job-cut announcements through October 2026, accounting for about 20% of the total, according to a Nov. 5 report from outplacement and executive coaching firm Challenger, Gray & Christmas.", "source": "CNBC World Economy", "pub_date_str": "27 Nov 2026, 12:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpaceX shares jump on alternative trading platform after Musk says he will expand on Trump Account share donations", "full_content": "Shares of SpaceX jumped 7.47% in overnight trading on Blue Ocean ATS after CEO Elon Musk expanded his SpaceX share-donation plan for U.S. children.\n\n\"I will be donating another share of SpaceX to all kids in America every year,\" Musk said in a post on X .\n\nBlue Ocean ATS is an alternative trading system for U.S. equities that operates from 8 p.m. to 4 a.m. ET, outside regular U.S. stock market hours. According to the platform's holiday schedule , overnight trading resumed at 8 p.m. ET on Thanksgiving Day. U.S. stock exchanges were closed Thursday and are scheduled to close early Friday.\n\nSpaceX shares closed 1.30% higher on Wednesday ahead of Thanksgiving.\n\nThe latest pledge follows SpaceX's announcement Wednesday that it would donate one share of its Class A stock to every active Trump Account, tax-advantaged investment accounts for American children, with Musk personally matching the gift.\n\nIn a separate post on X, Musk said SpaceX's contribution would be transferred next month, while his personal donation would follow when his lockup period expires in June next year.\n\nNearly 70 million Trump Accounts had been created as of October, according to the White House.\n\nSince the program's launch in July, families and friends have contributed more than $1 billion to the accounts, bringing total deposits from all sources to more than $9 billion, CNBC reported earlier this week.", "source": "CNBC World Economy", "pub_date_str": "27 Nov 2026, 12:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "MCX Shares Hit Record High, Surge Nearly 90% In One Year: What's Driving The Rally?", "full_content": "MCX reported a 130% year-on-year (YoY) rise in its consolidated net profit to Rs 454.57 crore in the September quarter of financial year 2027 (Q2FY27).", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:42 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold prices hover around \u20b91.25 lakh: 2027 outlook, key drivers and what investors should do; experts weigh in", "full_content": "Gold prices have corrected sharply by 32% from their January 2026 peak of around \u20b9 1.8 lakh per 10 grams to approximately \u20b9 1.22 lakh per 10 grams.\n\nHowever, domestic gold prices have recovered slightly over the past two days. On 27 November, MCX gold prices were trading at \u20b9 1,24,816 per 10 grams, up 2.08%, while the retail price of 24-karat gold stood at \u20b9 1,25,440 per 10 grams.\n\nOn 26 November, December gold futures settled at \u20b9 1,22,349 per 10 grams, gaining 1% from the previous session.\n\nWith gold prices witnessing a recent recovery, what is the outlook for the precious metal by the end of 2027, and what should Indian investors do amid the ongoing volatility?\n\nDespite the correction, the medium-term outlook remains positive, according to Yuxuan Tang of JP Morgan Private Bank.\n\nIn an interview with CNBC , Tang said she expects gold to remain under pressure as monetary tightening continues, but remains bullish on the metal over the medium term.\n\nShe believes central bank purchases and demand for gold as a hedge against currency debasement will support prices, with gold reaching about $4,600 by the end of 2027.\n\nWith the current international gold price at around $3,648 per ounce, this implies an upside of approximately 26% by the end of 2027. Even from the $3,500 mark, gold would need to rise around 31% to reach the projected target.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 12:39 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SEBI Plans To Curb Duplicate Disclosures, Replace Multiple Fines Under LODR Review: Chairman Tuhin Kanta Pandey", "full_content": "SEBI is reviewing listing rules to remove disclosures that duplicate filings with the Ministry of Corporate Affairs and replace multiple exchange penalties for the same lapse with a single fine.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 12:34 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why is Indian stock market falling today? Nifty down to near 25,600, Sensex crashes 900 points | Top 3 reasons explained", "full_content": "Stock market crash today: After rising for the last two sessions, the key benchmark indices of the Indian stock market came under selling pressure on Friday. The Nifty 50 today opened lower at 25,839 and touched an intraday low of 25,620, whereas the 30-stock index BSE Sensex today opened lower at 84,093 and touched an intraday low of 83,400. The Bank Nifty index also witnessed selling pressure, touching an intraday low of 63,097.\n\nBy 3:00 PM, the Sensex is down over 900 points, the Nifty 50 index is down nearly 250 points to 25,626, and the Bank Nifty index is down over 400 points to 63,121.\n\nAccording to stock market experts, the Indian stock market is under selling pressure due to three major reasons: weakness in the Indian Rupee, renewed inflation fear, and US Fed rate hike buzz. However, the long weekend due to the Thanksgiving celebrations in the US stock market is also a reason for people squaring off their positions before the long weekend. Trump's tariffs and delay in the India-US trade deal is also a reason for the Indian indices retracing from the higher levels.\n\nHighlighting the reasons for sharp selling in the Indian stock market, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cThe Indian Rupee has descended on Friday to the tune of 92.65 levels, which might have paused the FIIs' buying, as INR-USD convertibility may weigh on their returns. Apart from this renewed fear of inflation after the US CPI data and soaring crude oil price to around $85 per barrel on Friday, and buzz for the US Fed rate hike are some other reasons.\u201d\n\n\u201cInvestors remain focused on the lack of clarity surrounding the India-US trade agreement, with concerns over US tariffs continuing to weigh on sentiment.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 12:34 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Can SpaceX's AI ambitions drive further upside in its stock?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Can SpaceX's AI ambitions drive further upside in its stock? Written by Anupam Nagar , ETMarkets.com | Nov 27, 2026, 12:41:15 PM IST 1 / 5 SpaceX Shares Jump 9% After Bullish Trading Signal SpaceX shares surge as much as 9.23% intraday after a bullish Power Inflow signal points to increased buying interest from institutional and retail investors. The signal is triggered at $117.36 on November 25, with the stock subsequently climbing to $128.18, according to Benzinga. (Sources: Benzinga, Yahoo Finance, Al Jazeera, TradingView)\n\nElon Musk announces plans to give every child in the United States two SpaceX shares, with one share coming from the company and another from him personally. The giveaway is valued at nearly $18 billion based on SpaceX's November 25 closing price of $127.44. The initiative could also expand public participation in the company's growth story.\n\nThe US Federal Communications Commission grants conditional approval for SpaceX to deploy up to one million satellites for its proposed orbital data centre network, called Starmind. The project aims to support growing demand for artificial intelligence computing infrastructure, marking a major expansion of the company's ambitions beyond conventional satellite internet services.\n\nSpaceX reports a sharp improvement in its financial performance, with third-quarter revenue rising 161% year-on-year to $14.6 billion and net income reaching $4.4 billion, compared with a loss a year earlier. Its Super Intelligence business generates $7.6 billion in revenue, while satellite connectivity contributes $5.2 billion.\n\nDespite its leadership in rocket launches, satellite connectivity and artificial intelligence, SpaceX faces questions over its expensive valuation.", "source": "Economic Times Markets", "pub_date_str": "27 Nov 2026, 12:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Markets Are Falling Today? Sensex Tanks Nearly 800 Points, Nifty 50 Below 25,700; 4 Key Reasons Explained", "full_content": "The BSE Sensex fell as much as 781.5 points, or 0.92%,     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
