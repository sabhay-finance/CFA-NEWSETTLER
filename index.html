d buy, sell and hold recommendations for an array of stocks.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 01:08 PM IST", "pub_date_relative": "13m ago"}, {"title": "BP to set out new strategy after windfall year", "full_content": "UK oil major will announce plans in December after hitting current debt targets", "source": "FT Markets", "pub_date_str": "13 Oct 2026, 01:08 PM IST", "pub_date_relative": "13m ago"}, {"title": "Q2 Results Live: Tata Elxsi Rises 4% Ahead Of Earnings; ICICI Prudential Life Insurance, Anand Rathi Among Stocks In Focus", "full_content": "Q2 Results Live: Tata Elxsi, ICICI Prudential Life Insurance, Anand Rathi Share and Stock Brokers and 19 other companies will announce their Q2 FY27 earnings today, October 13. Track every earnings update live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 01:06 PM IST", "pub_date_relative": "15m ago"}, {"title": "Exclusive-Banking watchdogs ramp up AI scrutiny as stability fears mount, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 01:06 PM IST", "pub_date_relative": "15m ago"}, {"title": "Marston\u2019s soars on trading update, sees FY profit above expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 01:05 PM IST", "pub_date_relative": "16m ago"}, {"title": "'IT Companies Can Become Growth Stocks For Next Decade', Says Renaissance's Pankaj Murarka", "full_content": "Murarka said IT companies are prioritising investments and growth, while AI revenues and margins are consistently accelerating.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 01:03 PM IST", "pub_date_relative": "18m ago"}, {"title": "IRFC Interim Dividend 2026: Record date out; check amount announcement date, history, yield, returns of Railways stock", "full_content": "Indian Railway Finance Corporation ( IRFC ) is set to consider an interim dividend for the financial year 2026-27 alongside its second-quarter results. The railway PSU has scheduled a board meeting for Thursday, 15 October, to approve its unaudited financial results for the quarter and half-year ended 30 September 2026, and decide on the proposed interim dividend.\n\nIn an exchange filing, IRFC said its board would consider and approve the unaudited financial results and \u201cconsider and declare Interim Dividend to the shareholders of the company for the financial year 2026-27\u201d.\n\nThe company has fixed Friday, 23 October 2026, as the record date for determining shareholders eligible to receive the interim dividend, subject to the board approving the payout.\n\nThe dividend amount, however, is yet to be announced. Investors will need to wait for the board's decision on 15 October for details of the proposed payout.\n\nIRFC is a Navratna public sector enterprise under the administrative control of the Ministry of Railways. The company mobilises funds from domestic and international markets to finance the infrastructure development and asset-acquisition requirements of Indian Railways.\n\nIRFC has declared 12 dividends since 17 February 2021, according to the dividend data provided. Over the past 12 months, the company has paid a total equity dividend of \u20b9 2.10 per share, according to data on trendlyne.\n\nAt the share price of \u20b9 79, IRFC's dividend yield stands at approximately 2.66%. Dividend yield is calculated by dividing the annual dividend per share by the current market price. The yield may change as the share price moves and will depend on the dividend declared in the future.\n\nIRFC share price today jumped nearly 3%, the stock touched an intraday high of \u20b9 79.47 per share, and an intraday low of \u20b9 77.70 apiece on the BSE.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 01:02 PM IST", "pub_date_relative": "19m ago"}, {"title": "Warby Parker director Jeffrey Raider sells $415,500 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str" n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:58 PM IST", "pub_date_relative": "23m ago"}, {"title": "Setting aside \u20b92,000 per month in PPF can put your child on path to \u2018crorepati\u2019 status in long run. We calculate how", "full_content": "Parent looking to gift their child a secure future, can consider the public provident fund ( PPF ) \u2014 among the preferred options for guaranteed returns when it comes to long-term financial planning. The reliable, low-risk government backed savings scheme can be used to meet financial goals such as funding of wedding, children's education abroad, buying a house, retirement fund or even building wealth.\n\nA PPF account can be easily opened at any post office or bank branch across India by submitting an application form, photo and mandated KYC documents . For minors, the parent / legal guardian can open an account, which must be converted to major status once the primary account holder turns 18 years of age.\n\nToday, we calculate how setting aside \u20b9 2000 per month for your child can help secure their financial future. Here's how you can use the government backed PPF facility to set them up for \u201c crorepati \u201d status in the long run.\n\nNotably, the age at which you begin investing at has a large impact on the total PPF corpus accumulated at time of withdrawal (usually between 50-60 years of age). When investing for your children, beginning early has dual advantage \u2014 it gives the corpus a longer time to accumulate interest, thus making maximum benefit of compounding interest; and it allows you to significantly reduce the minimum monthly investment required to reach your target.\n\nFor example, if you begin investment from the year your child is born, with long-term view of staying invested for the next 50 years, you and later they themselves can steadily invest a minimum \u20b9 2,000 per month in the scheme.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 12:58 PM IST", "pub_date_relative": "23m ago"}, {"title": "Why is Greencore stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 12:57 PM IST", "pub_date_relative": "24m ago"}, {"title": "Evercore ISI cuts Foghorn Therapeutics stock rating on trial failure", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 12:54 PM IST", "pub_date_relative": "27m ago"}, {"title": "Piper Sandler cuts AST Spacemobile stock rating on launch concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 12:54 PM IST", "pub_date_relative": "27m ago"}, {"title": "CNBC Daily Open: 'Boring' trumps disorder and volatility", "full_content": "Hello, this is Hui Jie writing to you from Singapore. Welcome to another edition of CNBC's Daily Open.\n\nMany modern investors lack enthusiasm for \"boring\" \u2014 but \"boring\" is perhaps preferable to a disorderly market environment.\n\nThe International Monetary Fund warned Tuesday that mounting debt and inflation could trigger a \"disorderly\" spike in sovereign bond yields.\n\nThe global economy, meanwhile, is proving more resilient than expected as the AI investment boom offsets some of the energy shock from the Middle East conflict. The IMF, however, says this resilience is approaching its limits.\n\nIn this context, DBS Bank CEO Tan Su Shan's assessment of Singapore as a predictable market where \u2014 \"boring is not bad\" \u2014 sounds rather timely.\n\nSome warning lights are flashing on the global economy dashboard.\n\nThe IMF warned Tuesday that government bond yields could rise in a disorderly fashion, as rising inflation, mounting debt and AI-related borrowings pressure sovereign bond markets.\n\nGovernment bond yields in several advanced economies have climbed to multidecade highs, driven by higher energy costs due to the Middle East conflict and expectations for tighter monetary conditions as central banks look to curb resurgent inflation.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:54 PM IST", "pub_date_relative": "27m ago"}, {"title": "Global Market: BoE's Megan Greene says UK interest rates may not be restrictive enough", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: BoE's Megan Greene says UK interest rates may not be restrictive enough Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: BoE's Megan Greene says UK interest rates may not be restrictive enough SECTIONS Global Market: BoE's Megan Greene says UK interest rates may not be restrictive enough By Anupam Nagar , ETMarkets.com Last Updated: Oct 13, 2026, 12:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bank of England policymaker Megan Greene said the IMF\u2019s upward revision to the UK\u2019s economic growth forecast supports her view that monetary policy remains insufficiently restrictive. She warned that delaying interest rate hikes could prolong inflationary pressures, highlighting divisions among policymakers over balancing inflation control against economic growth and borrowing costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:53 PM IST", "pub_date_relative": "28m ago"}, {"title": "Mumbai Heatwave: Mercury Hits 38.2 Degree Celsius As October Heat Intensifies; Will Residents Get Relief In Coming Days?", "full_content": "The IMD has issued an official yellow heat alert for Mumbai, Thane, Palghar, Raigad, and Ratnagiri districts, warning residents of rising temperatures and oppressive, heatwave-like conditions across coastal Maharashtra.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:52 PM IST", "pub_date_relative": "29m ago"}, {"title": "Tech stocks slide as Wall Street chip rout spreads. SK Hynix, SoftBank and ASML slump", "full_content": "Technology stocks fell Tuesday after a sell-off in U.S. semiconductor shares sparked worries over artificial intelligence financing and intensifying competition.\n\nEuropean chip stocks sank in early morning trade, with semiconductor equipment maker ASML down 3.3%, and STMicroelectronics and German chip maker Infineon both down 5%. Dutch firms BE Semiconductor and ASM International were both around 4% lower at the open.\n\nShares of South Korean chip giant SK Hynix, a leading supplier of high-bandwidth memory chips used in artificial intelligence applications, plunged more than 10%, while rival Samsung Electronics shed 7.4% \u2014 both hitting their lowest levels since August.\n\nIn Japan, shares of tech-focused investment giant SoftBank Group sank 8.5%. The group, which has significant exposure to the global AI industry, led a broader retreat in Japanese semiconductor and electronics shares.\n\nTokyo Electron , a major supplier of chipmaking equipment, dropped 7.2%, while Advantest , which makes semiconductor testing equipment, declined 2.9%. Other Japanese technology stocks also came under pressure. Lasertec fell over 5%, Disco lost 4.7% and Renesas Electronics shed 5.9%.\n\nThe declines followed a weak session for technology stocks on Wall Street, where the Nasdaq Composite dropped 0.44% on Monday. U.S. memory chipmaker Micron Technology slid 3.9% as investors assessed intensifying competition from China's ChangXin Memory Technologies, or CXMT , which reported progress on a new chip structure.\n\nOver the weekend , CXMT announced significant progress in developing a new chip architecture, designed to increase memory density by packing more data into a smaller space.\n\n\"Investors are jittery and looking for excuses to take profit on AI-related stocks that have outperformed this year, especially memory stocks,\" said UBP's senior equity advisor Vey-Sern Ling.", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 12:52 PM IST", "pub_date_relative": "29m ago"}, {"title": "The Real Brain Behind Balaji Didn't Want Ekta Kapoor To Do ALT: Here's Why", "full_content": "Ekta Kapoor opens up about her mother Shobha Kapoor's business lessons and her initial reaction to launching ALTBalaji and why.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:51 PM IST", "pub_date_relative": "30m ago"}, {"title": "As 'Cockroach' protests grow over alleged voter fraud, Modi defends India as \u2018mother of democracy\u2019", "full_content": "Prime Minister Narendra Modi on Tuesday defended India as a \" mother of democracy ,\" as protests demanding the resignation of Chief Election Commissioner Gyanesh Kumar over alleged voter fraud are intensifying.\n\n\"A wide range of issues are debated openly, and diverse perspectives are discussed by the people,\" Modi said, speaking at a Bloomberg New Economy event. His comments coincide with a severe crackdown by authorities against protestors demanding electoral reforms.\n\nEarlier today, key members of the viral pseudo-political movement, Cockroach Janta Party, were detained for protesting without permission .\n\nCJP, whose leaders were detained by authorities over the weekend as well, had sought permission from Delhi Police on Monday to launch fresh protests at the Jantar Mantar grounds in the capital. However, the government then barred the use of the site for protests.\n\nOn Monday, thousands of people reportedly joined leaders of Indian opposition parties in their march to the Supreme Court in Delhi to file a petition against revisions made to the voter list by the Election Commission.\n\nNames of 130 million people have been struck off from the voter list after the commission began conducting \"special intensive revisions\" (SIR) to update voter lists across the country last year, as per several local media reports.\n\nRahul Gandhi, the leader of the opposition in India, said the huge crowds were a sign that people were not going to be \"intimidated\" by the government .\n\n\"There are no parallel protests. It's one protest, and it's a protest where everybody is standing together,\" Gandhi said, dismissing concerns over the absence of members of the Cockroach Janta Party who had called for protests over the weekend.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:47 PM IST", "pub_date_relative": "34m ago"}, {"title": "Russia Beats US In Nuclear Warhead Race: How Many Does Israel, Pakistan Have?", "full_content": "Russia has an estimated 1,796 deployed nuclear warheads, the highest number in the world as of January 2026, SIPRI reported. The country continues to modernise its nuclear arsenal, although sanctions and the ongoing war in Ukraine have created challenges for some of its weapons programmes.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:47 PM IST", "pub_date_relative": "34m ago"}, {"title": "IndiGo Secures $328 Million Financing For Eight Airbus Aircraft From Citi, Credendo", "full_content": "Under the structure, Citi acted as Sole Mandated Arranger, ECA Coordinator and Sole Lender, with the financing backed by Credendo's credit insurance.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:46 PM IST", "pub_date_relative": "35m ago"}, {"title": "Rupee makes stunning comeback: What is RBI\u2019s 4-step plan?", "full_content": "Choose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:42 PM IST", "pub_date_relative": "39m ago"}, {"title": "Mukul Agarwal adds 470% multibagger to Rs 8,000 crore portfolio, trims KRN Heat exposure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Mukul Agarwal adds 470% multibagger to Rs 8,000 crore portfolio, trims KRN Heat exposure Apsis Aerocom Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Mukul Agarwal adds 470% multibagger to Rs 8,000 crore portfolio, trims KRN Heat exposure SECTIONS Mukul Agarwal adds 470% multibagger to Rs 8,000 crore portfolio, trims KRN Heat exposure By Veer Sharma , ETMarkets.com Last Updated: Oct 13, 2026, 12:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ace investor Mukul Agarwal added a 1.2% stake in precision engineering firm Apsis Aerocom, which has surged 470% since its March 2026 debut, to his Rs 8,000 crore portfolio. Meanwhile, he trimmed his stake in KRN Heat Exchanger following a 61% rally over the past year.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:39 PM IST", "pub_date_relative": "42m ago"}, {"title": "How to build wealth in your 20s and 30s without giving up your lifestyle", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFor young earners in their early 30s, building wealth can sometimes feel like a choice between enjoying life today and securing the future. Social media often reinforces the idea that financial success means aggressive saving, cutting back on everything from dining out to holidays, or finding the next big investment opportunity. It does not have to be that way.\n\nWealth creation is less about extreme frugality and more about building the right financial habits early. The biggest advantage is not necessarily a high salary, but the number of years available for money to grow.\n\nConsider two investors who invest \u20b9 5,000 every month and earn an assumed annualised return of 12%. If one starts at 25 and the other at 35, the difference in their eventual corpus can be substantial, even though their monthly investment remains the same.\n\nThis is why postponing investing until one earns more can be expensive. A higher salary later can increase the amount invested, but it cannot recreate the years of compounding already lost.\n\nOne of the most common mistakes among young professionals is believing that investing should begin only after they reach a particular income level. The first objective should be to develop the habit, even if the amount is modest.\n\nA \u20b9 3,000 or \u20b9 5,000 monthly investment may look insignificant against long-term financial goals. But starting with a manageable amount and increasing contributions as income rises can help establish a sustainable investing habit.\n\nAs salaries increase, expenses tend to follow. A larger house, a better car, more frequent travel, upgraded gadgets and higher discretionary spending can gradually absorb much of the additional income. This is commonly referred to as lifestyle inflation.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 12:38 PM IST", "pub_date_relative": "43m ago"}, {"title": "FMCG Stocks Face Earnings Test As Valuations Fall 25% Below Five-Year Average", "full_content": "The Nifty FMCG Index trades at 31.1 times earnings, below its post-2021 average of 41.5, but weak consumption, rising input costs and earnings downgrades continue to cloud the sector's outlook.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:36 PM IST", "pub_date_relative": "45m ago"}, {"title": "Jio IPO may trigger Reliance\u2019s next big re-rating. Why Religare sees 47% upside", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Jio IPO may trigger Reliance\u2019s next big re-rating. Why Religare sees 47% upside The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO may trigger Reliance\u2019s next big re-rating. Why Religare sees 47% upside SECTIONS Jio IPO may trigger Reliance\u2019s next big re-rating. Why Religare sees 47% upside By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 13, 2026, 12:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reliance Industries could see a valuation re-rating as Jio Platforms\u2019 proposed Rs 30,000 crore IPO brings greater transparency to its digital business. Religare has a target price of Rs 1,696 on the stock, implying 46.7% upside from its current market price.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:30 PM IST", "pub_date_relative": "51m ago"}, {"title": "ICICI AMC delivers on growth, but market volatility curtails profit", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nICICI Prudential Asset Management Co. (AMC) clocked a healthy 16.3% year-on-year growth in operating revenue in the September quarter (Q2FY27) to \u20b9 1,674 crore, supported by industry-beating growth in assets under management (AUM) and a high-yielding asset mix. However, net profit growth was limited to 6.1%, weighed down by lower other income.\n\nQuarterly average AUM surged 13.7% to \u20b9 12.4 trillion, led by its mainstay mutual funds which expanded 14.4% to \u20b9 11.6 trillion. Equity hybrid and equity schemes registered 19.7% and 16.3% growth, respectively, helping the AMC retain its leadership in actively managed funds with 13.3% market share, and 26.4% in equity-oriented hybrid funds.\n\nPMS and AIF schemes, while still small compared with mutual fund AUM, also posted robust growth. AIF AUM rose to \u20b9 0.24 trillion in September 2026 from \u20b9 0.19 trillion a year earlier, with the base adjusted for assets transferred from ICICI Venture. Meanwhile, PMS AUM grew to \u20b9 0.31 trillion from \u20b9 0.25 trillion.\n\nThe alternatives business could see further growth following the acquisition of ICICI Securities\u2019 PMS and the launch of the AMC\u2019s fifth specialised investment fund ( SIF ). Faster growth in higher-yielding products also helped revenue growth outpace overall AUM growth.\n\nFee and commission expenses rose 30% year-on-year, contributing to faster expense growth and slightly tempering operating profit growth. Operating profit nevertheless increased 15.7% to \u20b9 1,181 crore. But the ball and chain on net profit was other income. Mark-to-market losses on treasury holdings led to a 76.5% year-on-year plunge in other income to \u20b9 17 crore.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 12:29 PM IST", "pub_date_relative": "52m ago"}, {"title": "Vijay Kedia portfolio: Up 270% against IPO price in 17-month! Ace investor raises stake in SME stock; should you buy?", "full_content": "Vijay Kedia portfolio | Stock to buy today: Ace investor Vijay Kedia's portfolio is one of the most-followed by retail investors on Dalal Street. This is because of the reputation governed by Vijay Kedia among stock investors through the value picks and the amount of returns generated over the years. For those who follow Vijay Kedia's portfolio for a value pick and have decoded the strategy maintained by the ace Indian investor, there is some news for them. Vijay Kedia has raised a stake in an NSE SME stock, Iware Supplychain Services, which was listed last year in May.\n\nThe NSE SME IPO was available in the Indian primary market in May 2026 at a price band of \u20b9 95, whereas the Vijay Kedia portfolio stock is currently available at around \u20b9 350 apiece on the NSE. This means Vijay Kedia's latest buy has risen around 270% against the IPO price of \u20b9 95 per equity share. The ace Indian investor has investments in this SME stock through his company Kedia Securities and in his individual capacity. His company Kedia Securities' stake has risen from 3% to 7.35%, buying 5,00,400 company shares during Q2FY27.\n\nIn the September 2026 quarter's shareholding pattern of the NSE-listed SME stock, Vijay Kedia appears to be an investor both in an individual capacity and through his company, Kedia Securities. The shareholding pattern reveals that Vijay Kedia holds 3,45,600 company shares in his individual capacity, representing 3% of the company's total paid-up capital.\n\nVijay Kedia's Kedia Securities also holds 8,46,000 company shares, representing 7.35% of the NSE-listed SME's total paid-up capital. Comparing the shareholding pattern of the company for the June 2026 quarter, Kedia Securities' shareholding was 3,45,600, which was 3% of the company's total paid-up capital. So, Kedia Securities bought 5,00,400 fresh shares during the July to September 2026 quarter.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 12:27 PM IST", "pub_date_relative": "54m ago"}, {"title": "Global Market: Hong Kong dollar nears weak side of trading band, raising prospect of HKMA intervention", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: Hong Kong dollar nears weak side of trading band, raising prospect of HKMA intervention Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Hong Kong dollar nears weak side of trading band, raising prospect of HKMA intervention SECTIONS Global Market: Hong Kong dollar nears weak side of trading band, raising prospect of HKMA intervention By Anupam Nagar , ETMarkets.com Last Updated: Oct 13, 2026, 12:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Hong Kong dollar neared the weak end of its trading band against the US dollar, raising the possibility of Hong Kong Monetary Authority intervention to defend its peg. Weak equity performance, subdued investment flows, and rising US interest rates have pressured the currency, though analysts expect the linked exchange rate system to remain stable.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:26 PM IST", "pub_date_relative": "55m ago"}, {"title": "Pune Water Cut: Who Will Be Affected, PMC's Direction To Citizens And How To Report Supply Problems", "full_content": "Pavneet Kaur, additional municipal commissioner of the PMC, said that the decision was taken to manage available water stocks and safeguard drinking water supplies over the coming months.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:26 PM IST", "pub_date_relative": "55m ago"}, {"title": "RJ Mitte On Life, Future Plans And Giving Back: Inside 'Breaking Bad' Star's Final Interview Before Death", "full_content": "'Breaking Bad' star RJ Mitte spoke about living life to the fullest, drawing from real-life experiences and helping others in his final interview, saying, 'I have a very finite amount of time.'", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:24 PM IST", "pub_date_relative": "57m ago"}, {"title": "Mortgage hedging adds selling pressure to US Treasury market as yields surge", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Mortgage hedging adds selling pressure to US Treasury market as yields surge Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Mortgage hedging adds selling pressure to US Treasury market as yields surge SECTIONS Mortgage hedging adds selling pressure to US Treasury market as yields surge By Anupam Nagar , ETMarkets.com Last Updated: Oct 13, 2026, 12:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Rising US Treasury yields and mortgage rates have triggered increased mortgage-related hedging, adding selling pressure to the bond market. However, analysts expect the impact to remain limited compared with previous selloffs, as refinancing incentives decline and the mortgage market shrinks. Oil prices, inflation expectations, and Federal Reserve policy remain key drivers of yields.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "The Andaman Islands could be India's next big trade trump card", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a The Andaman Islands could be India's next big trade trump card The Economic Times daily newspaper is available online now. Read Today's Paper The Andaman Islands could be India's next big trade trump card SECTIONS The Andaman Islands could be India's next big trade trump card ET Online Last Updated: Oct 13, 2026, 12:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is focusing on strengthening the Andaman and Nicobar Islands' strategic maritime role for regional trade. The upcoming Andaman Dialogue 2027 will emphasize maritime infrastructure and economic cooperation among countries in the Indo-Pacific region. Commerce Minister Piyush Goyal highlighted the islands as an economic bridge, particularly for trade and logistics efforts. Enhanced cooperation between regional ports and industries is also proposed to bolster maritime security.\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 12:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Who Is Nitish Mittersain? Nazara Founder Steps Down After Nearly 27 Years", "full_content": "After nearly 27 years leading the company, Mittersain believes Nazara has reached a stage where its priorities have changed.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cyber attack hits hundreds of French supermarkets, heating fridges to 122\u00b0F and sparking fires", "full_content": "Hackers targeted hundreds of French supermarkets in a cyberattack that reportedly caused refrigerators and freezers to overheat, spoiling food and sparking fires.\n\nFridges at French supermarket chains Carrefour, Monoprix, the Les Mousquetaires-owned Intermarch\u00e9, and Coop\u00e9rative U, among others, all saw fridges heat up to as much as 50 degrees Celsius (122 degrees Fahrenheit) overnight, Reuters reported on Monday.\n\nCoop\u00e9rative U's CEO Dominique Schelcher confirmed that cyberattacks had affected \"refrigeration production facilities of several stores.\"\n\n\"Attacking equipment that is essential to the preservation of fresh products and the food supply of the French people is extremely serious and unprecedented. It is unacceptable,\" Schelcher said in a LinkedIn post .\n\nCNBC has reached out to Carrefour, Monoprix, Intermarch\u00e9, Coop\u00e9rative U, and E Leclerc for comment but did not immediately hear back.\n\nFelix Aime, a senior cyber threat intelligence analyst \u200bat Sekoia Threat Detection and Research, said the attack affected several European countries including Spain, Portugal, Poland, Germany and Belgium, per the Reuters article.\n\n\"I strongly condemn the cyberattack targeting food products at @intermarche @CooperativeU @Leclerc,\" European Commissioner for Agriculture and Food Christophe Hansen said in a post on X on Monday.\n\n\"Food security requires more attention at all levels. Because the weaponization of food has become a reality.\"", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 12:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, silver prices today, 13 October: Rates flat as investors await US inflation data for Fed rate clues", "full_content": "Gold and silver prices: The price of the yellow metal in India's retail market was flat on Tuesday, 13 October, after the International Monetary Fund (IMF) warned that bond yields could see a \u2018disorderly\u2019 spike as debt and inflation risks worsen.\n\nThe IMF warned Tuesday that government bond yields could rise in a disorderly fashion as inflation rises, debt mounts, geopolitical uncertainty intensifies and AI-related borrowing pressures weigh on sovereign bond markets, according to a CNBC report .\n\nSubsequently, in the international markets, gold \u200bprices eased after touching \u200ba one-week high on \u200bMonday, pressured by a firmer dollar and higher oil prices, while investors awaited US inflation data for clues on the Federal Reserve\u2019s interest-rate trajectory.\n\nSpot \u2060gold \u200cslipped 0.6% to $4,170.62 per ounce, having hit its highest level since 2 October earlier in the session. US gold futures for December delivery dropped 0.5% to $4,195.10 per ounce.\n\nInvestors will look for remarks from Fed Chair Kevin Warsh , along with key inflation data, later this week to gauge future monetary policy. The decisions of the US Federal Reserve, along with how the ongoing war in the Middle East evolves, will play a critical role in deciding the future of commodity prices.\n\nDue to these developments, both 24-karat and 22-karat gold rates are trading flat across major cities in India. Silver prices were also trading sideways in the domestic bullion market.\n\nMCX gold rate on 13 October was trading 0.11% higher at \u20b9 1,49,930 per 10 grams. MCX silver futures were trading about 0.16% higher at \u20b9 2,23,640 per kg at around 11:13 am.\n\nDue to the ongoing geopolitical uncertainty stemming from the Middle East dispute and the Russia-Ukraine war, prices for 10g of 24K gold in Delhi have rallied by 20.78% over the last year, from \u20b9 1,27,460 on 13 October 2025 to \u20b9 1,51,640 on 12 October 12 2026.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 12:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "AI\u2019s Giant Money Loop Is Drawing Foreign Cash Like 2008 - Bloomberg.com", "full_content": "AI\u2019s Giant Money Loop Is Drawing Foreign Cash Like 2008 Bloomberg.com The huge lurking leverage of AI hyperscalers Financial Times AI Boom Is Triggering \u2018Dutch Disease\u2019 In The US Economy, Warns Apollo\u2019s Torsten Slok \u2014 \u2018The Only Durable Fix Is\u2026\u2019 Yahoo Finance Das: AI\u2019s Cash Is Missing, and the Credit Risk Is Not Priced In Financial Sense Tech companies\u2019 AI debt issuance drops sharply in September Investing.com", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 12:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kawasaki Ninja Z300 Launch: First Look, Expected Price, Specifications, Bookings And More", "full_content": "Kawasaki has revealed the Z300 in India, featuring a 296cc twin-cylinder engine, TFT display and aggressive streetfighter styling. Bookings open October 19, 2026, with prices expected on October 20. It could cost below Rs 3 lakh.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Power To Empower': Innovation Essential, But Benefits Must Reach More People, Says PM Modi At New Economy Forum", "full_content": "PM Modi emphasised technology and innovation as sources of power that should create opportunities for millions at the Bloomberg New Economy Forum.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ola Electric Shares Adjust After Trading Ex-Rights Issue", "full_content": "Ola Electric Mobility's stock adjusts around 3% on the rights issue ex-date after rising over the previous two sessions as investors are concerned about the effect of the rights issue", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Today, Technology Is Power, Data Is Power': PM Modi At New Economy Forum", "full_content": "Prime Minister Narendra Modi will attend and address the Bloomberg New Economy Forum in New Delhi starting at 10:00 am on Tuesday.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Rupee jumps 177 paise in 2 days against dollar after RBI's strong defence before Rs 97 goal post. What lies ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Rupee jumps 177 paise in 2 days against dollar after RBI's strong defence before Rs 97 goal post. What lies ahead? JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Rupee jumps 177 paise in 2 days against dollar after RBI's strong defence before Rs 97 goal post. What lies ahead? SECTIONS Rupee jumps 177 paise in 2 days against dollar after RBI's strong defence before Rs 97 goal post. What lies ahead? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 13, 2026, 11:59:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian rupee strengthened 177 paise against the US dollar in two days to 94.06 following aggressive RBI market interventions. Key steps include a special dollar window for oil firms and tighter forex derivative rules to defend the Rs 97 level, though macro risks and FII outflows remain.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 11:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bandhan Bank share price jumps 8% today after 4% fall in a month | What's fuelling surge in banking stock", "full_content": "Bandhan Bank share price jumped over 8%, hitting an intraday high of \u20b9 171.68 per share on NSE, in Tuesday's trading session following reports that Abu Dhabi-based International Holding Company (IHC) was among the investors holding preliminary discussions to acquire a stake in the lender\u2019s promoter, Bandhan Financial Services (BFSL).\n\nIHC is the investment firm of Sheikh Tahnoon bin Zayed Al Nahyan, Abu Dhabi\u2019s deputy ruler and national security adviser. According to an Economic Times (ET) report, BFSL holds slightly more than one-third of Bandhan Bank\u2019s equity.\n\nThe proposed stake sale could also provide an exit route for Singapore\u2019s sovereign wealth fund GIC and the International Finance Corporation (IFC), which have backed the business for over a decade, the report said.\n\nAs of March 31, BFSL held 59.98% in Bandhan Asset Management Company and 97.16% in Bandhan Life Insurance Company. GIC and ChrysCapital are among the other investors in the asset management business.\n\nBandhan Financial Holdings Ltd held a 37.5% stake in Bandhan Bank at the end of June. Under the Reserve Bank of India\u2019s licensing requirements, the promoter is required to bring its shareholding down to 26% by 2030.\n\nThe report further noted that several Gulf-based banks and sovereign wealth funds have been approached regarding a potential investment in BFSL. These reportedly include First Abu Dhabi Bank and the Qatar Investment Authority, along with private equity firms such as Carlyle and EQT.\n\nBandhan Bank shares have gained 3.23% over the past week, indicating a recent recovery in the stock. However, the stock has declined 4.01% over the past month.\n\nOver a longer period, Bandhan Bank shares have delivered positive returns of 17.53% year to date, while gaining a modest 0.58% over the past year.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Hyundai Bayon Launch: Expected Price, Features, Variants, Colours And More", "full_content": "Hyundai\u2019s 2026 Bayon is expected to launch in India on October 26, featuring dual 12.3-inch displays, advanced connectivity, a 1.5-litre petrol engine and manual or IVT options. Prices may range from Rs 10 lakh to Rs 17.5 lakh.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Up 50% in 6 months, Netweb Technologies shares fall 5% today: Should you buy, sell, or hold? Experts suggest this", "full_content": "Netweb Technologies shares fell 5% on Tuesday, October 13, to \u20b9 4,752 per share on the BSE, as investors booked profits following a sharp rally over the previous three trading sessions. The decline comes after the stock gained more than 14% during that period, raising questions about whether today's correction offers a buying opportunity or signals weakness.\n\nDespite Tuesday's fall, the stock has delivered positive returns over several periods. It gained 5% in one week and 13% in three months. It advanced 50% over six months and 29% over the past year, although it declined 1% in the last month.\n\nNetweb Technologies is currently 18% below its 52-week high of \u20b9 5,810, recorded in August 2026. However, it has risen 61% from its 52-week low of \u20b9 2,942.45, touched in December 2025.\n\nThe latest decline follows a strong short-term rally, making the stock's technical levels important for investors assessing its next move.\n\nNetweb Technologies' technical indicators suggest a possible recovery, but the stock faces key resistance levels after its recent rally.\n\nHitesh Tailor, Technical Research Analyst at Choice Broking, said the stock's long-term uptrend remained intact, supported by higher highs and higher lows. He noted that the stock had established a base near its 100-day exponential moving average (EMA) at \u20b9 4,604 and reclaimed its 50-day EMA at \u20b9 4,783.\n\n\u201cThe daily RSI has rebounded strongly from oversold levels to 54.94, signaling expanding bullish strength,\u201d Tailor said, pointing to improving momentum after the stock's retracement from its all-time high.\n\nAccording to Choice Broking, immediate support lies at \u20b9 4,780, followed by stronger structural support at \u20b9 4,600. On the upside, the stock faces resistance between \u20b9 5,100 and \u20b9 5,200. A sustained breakout above \u20b9 5,200 could open the way for a retest of its all-time high of \u20b9 5,813.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "New India Assurance Share Price Erases Gains, Falls Over 3% In Trade", "full_content": "Harshal DasaniBusiness Head, INVAsset PMS explained the decline and advised traders to look at Monday's movement to understand why the shares slipped today.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:54 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "After 500% jump in 1 year, this defence stock hits 4 back-to-back lower circuits - Do you own? What should investors do?", "full_content": "Shares of an Indian aerospace and defence engineering company have delivered stellar returns to investors in the past. However, the stock appears to have hit a roadblock, with profit booking potentially weighing on sentiment as it has hit lower circuits for four consecutive sessions.\n\nWe are talking about Sigma Advanced Systems , a company with an international presence that designs, develops and manufactures mission-critical systems across aerospace, avionics, naval systems, radars and communication systems.\n\nOn Tuesday, 13 October, the stock dropped 5% to hit the lower circuit of \u20b9 914.85. Notably, it hit lower circuits last Thursday, Friday, and Monday as well. At the current juncture, the defence stock looks set to extend its losing streak for the sixth consecutive session.\n\nAt the current market price of \u20b9 914.85, the stock has lost nearly 19% over the last six consecutive sessions. But despite this correction, the stock's return this year is astonishing.\n\nBSE data shows that the stock has soared 497% over the last one year, hitting a 52-week high of \u20b9 1,165 on 6 October and a 52-week low of \u20b9 139.30 on 16 March this year.\n\nOn a longer timeframes of two years (up 1,286%), five years (up 4,665%), and 10 years (up 4,315%), the returns are stellar.\n\nSimple arithmetic calculations reveal that an investment of just \u20b9 2.30 lakh in this stock a decade ago would be worth over \u20b9 1 crore today.\n\nExperts find the company's growth potential attractive but appear wary of the stock's stretched valuations.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 01:15 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buy, Sell Or Hold: BEL, ONGC, Deccan Gold Mines, Garden Reach, SS Retail \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 01:08 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live: Tata Elxsi Rises 4% Ahead Of Earnings; ICICI Prudential Life Insurance, Anand Rathi Among Stocks In Focus", "full_content": "Q2 Results Live: Tata Elxsi, ICICI Prudential Life Insurance, Anand Rathi Share and Stock Brokers and 19 other companies will announce their Q2 FY27 earnings today, October 13. Track every earnings update live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 01:06 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Marston\u2019s soars on trading update, sees FY profit above expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 01:05 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IRFC Interim Dividend 2026: Record date out; check amount announcement date, history, yield, returns of Railways stock", "full_content": "Indian Railway Finance Corporation ( IRFC ) is set to consider an interim dividend for the financial year 2026-27 alongside its second-quarter results. The railway PSU has scheduled a board meeting for Thursday, 15 October, to approve its unaudited financial results for the quarter and half-year ended 30 September 2026, and decide on the proposed interim dividend.\n\nIn an exchange filing, IRFC said its board would consider and approve the unaudited financial results and \u201cconsider and declare Interim Dividend to the shareholders of the company for the financial year 2026-27\u201d.\n\nThe company has fixed Friday, 23 October 2026, as the record date for determining shareholders eligible to receive the interim dividend, subject to the board approving the payout.\n\nThe dividend amount, however, is yet to be announced. Investors will need to wait for the board's decision on 15 October for details of the proposed payout.\n\nIRFC is a Navratna public sector enterprise under the administrative control of the Ministry of Railways. The company mobilises funds from domestic and international markets to finance the infrastructure development and asset-acquisition requirements of Indian Railways.\n\nIRFC has declared 12 dividends since 17 February 2021, according to the dividend data provided. Over the past 12 months, the company has paid a total equity dividend of \u20b9 2.10 per share, according to data on trendlyne.\n\nAt the share price of \u20b9 79, IRFC's dividend yield stands at approximately 2.66%. Dividend yield is calculated by dividing the annual dividend per share by the current market price. The yield may change as the share price moves and will depend on the dividend declared in the future.\n\nIRFC share price today jumped nearly 3%, the stock touched an intraday high of \u20b9 79.47 per share, and an intraday low of \u20b9 77.70 apiece on the BSE.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 01:02 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mizuho upgrades Rexford Industrial stock rating on valuation discount", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Oct 2026, 01:00 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI investors or casino gamblers? What Broadcom CEO Hock Tan said that sparked sharp global AI selloff", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a AI investors or casino gamblers? What Broadcom CEO Hock Tan said that sparked sharp global AI selloff The Economic Times daily newspaper is available online now. Read Today's Paper AI investors or casino gamblers? What Broadcom CEO Hock Tan said that sparked sharp global AI selloff SECTIONS AI investors or casino gamblers? What Broadcom CEO Hock Tan said that sparked sharp global AI selloff By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 13, 2026, 12:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Global AI stocks plunged after Broadcom CEO Hock Tan warned that investors are treating artificial intelligence like gambling, raising concerns about excessive valuations and unsustainable spending. He questioned OpenAI\u2019s long-term profitability despite strong revenue growth. South Korea\u2019s Kospi and Japan\u2019s Nikkei declined, while Indian IT stocks rallied amid the global technology selloff.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:58 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Setting aside \u20b92,000 per month in PPF can put your child on path to \u2018crorepati\u2019 status in long run. We calculate how", "full_content": "Parent looking to gift their child a secure future, can consider the public provident fund ( PPF ) \u2014 among the preferred options for guaranteed returns when it comes to long-term financial planning. The reliable, low-risk government backed savings scheme can be used to meet financial goals such as funding of wedding, children's education abroad, buying a house, retirement fund or even building wealth.\n\nA PPF account can be easily opened at any post office or bank branch across India by submitting an application form, photo and mandated KYC documents . For minors, the parent / legal guardian can open an account, which must be converted to major status once the primary account holder turns 18 years of age.\n\nToday, we calculate how setting aside \u20b9 2000 per month for your child can help secure their financial future. Here's how you can use the government backed PPF facility to set them up for \u201c crorepati \u201d status in the long run.\n\nNotably, the age at which you begin investing at has a large impact on the total PPF corpus accumulated at time of withdrawal (usually between 50-60 years of age). When investing for your children, beginning early has dual advantage \u2014 it gives the corpus a longer time to accumulate interest, thus making maximum benefit of compounding interest; and it allows you to significantly reduce the minimum monthly investment required to reach your target.\n\nFor example, if you begin investment from the year your child is born, with long-term view of staying invested for the next 50 years, you and later they themselves can steadily invest a minimum \u20b9 2,000 per month in the scheme.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 12:58 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Quantitative Methods", "Derivatives", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "CNBC Daily Open: 'Boring' trumps disorder and volatility", "full_content": "Hello, this is Hui Jie writing to you from Singapore. Welcome to another edition of CNBC's Daily Open.\n\nMany modern investors lack enthusiasm for \"boring\" \u2014 but \"boring\" is perhaps preferable to a disorderly market environment.\n\nThe International Monetary Fund warned Tuesday that mounting debt and inflation could trigger a \"disorderly\" spike in sovereign bond yields.\n\nThe global economy, meanwhile, is proving more resilient than expected as the AI investment boom offsets some of the energy shock from the Middle East conflict. The IMF, however, says this resilience is approaching its limits.\n\nIn this context, DBS Bank CEO Tan Su Shan's assessment of Singapore as a predictable market where \u2014 \"boring is not bad\" \u2014 sounds rather timely.\n\nSome warning lights are flashing on the global economy dashboard.\n\nThe IMF warned Tuesday that government bond yields could rise in a disorderly fashion, as rising inflation, mounting debt and AI-related borrowings pressure sovereign bond markets.\n\nGovernment bond yields in several advanced economies have climbed to multidecade highs, driven by higher energy costs due to the Middle East conflict and expectations for tighter monetary conditions as central banks look to curb resurgent inflation.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:54 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: BoE's Megan Greene says UK interest rates may not be restrictive enough", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: BoE's Megan Greene says UK interest rates may not be restrictive enough Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: BoE's Megan Greene says UK interest rates may not be restrictive enough SECTIONS Global Market: BoE's Megan Greene says UK interest rates may not be restrictive enough By Anupam Nagar , ETMarkets.com Last Updated: Oct 13, 2026, 12:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bank of England policymaker Megan Greene said the IMF\u2019s upward revision to the UK\u2019s economic growth forecast supports her view that monetary policy remains insufficiently restrictive. She warned that delaying interest rate hikes could prolong inflationary pressures, highlighting divisions among policymakers over balancing inflation control against economic growth and borrowing costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:53 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tech stocks slide as Wall Street chip rout spreads. SK Hynix, SoftBank and ASML slump", "full_content": "Technology stocks fell Tuesday after a sell-off in U.S. semiconductor shares sparked worries over artificial intelligence financing and intensifying competition.\n\nEuropean chip stocks sank in early morning trade, with semiconductor equipment maker ASML down 3.3%, and STMicroelectronics and German chip maker Infineon both down 5%. Dutch firms BE Semiconductor and ASM International were both around 4% lower at the open.\n\nShares of South Korean chip giant SK Hynix, a leading supplier of high-bandwidth memory chips used in artificial intelligence applications, plunged more than 10%, while rival Samsung Electronics shed 7.4% \u2014 both hitting their lowest levels since August.\n\nIn Japan, shares of tech-focused investment giant SoftBank Group sank 8.5%. The group, which has significant exposure to the global AI industry, led a broader retreat in Japanese semiconductor and electronics shares.\n\nTokyo Electron , a major supplier of chipmaking equipment, dropped 7.2%, while Advantest , which makes semiconductor testing equipment, declined 2.9%. Other Japanese technology stocks also came under pressure. Lasertec fell over 5%, Disco lost 4.7% and Renesas Electronics shed 5.9%.\n\nThe declines followed a weak session for technology stocks on Wall Street, where the Nasdaq Composite dropped 0.44% on Monday. U.S. memory chipmaker Micron Technology slid 3.9% as investors assessed intensifying competition from China's ChangXin Memory Technologies, or CXMT , which reported progress on a new chip structure.\n\nOver the weekend , CXMT announced significant progress in developing a new chip architecture, designed to increase memory density by packing more data into a smaller space.\n\n\"Investors are jittery and looking for excuses to take profit on AI-related stocks that have outperformed this year, especially memory stocks,\" said UBP's senior equity advisor Vey-Sern Ling.", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 12:52 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "As 'Cockroach' protests grow over alleged voter fraud, Modi defends India as \u2018mother of democracy\u2019", "full_content": "Prime Minister Narendra Modi on Tuesday defended India as a \" mother of democracy ,\" as protests demanding the resignation of Chief Election Commissioner Gyanesh Kumar over alleged voter fraud are intensifying.\n\n\"A wide range of issues are debated openly, and diverse perspectives are discussed by the people,\" Modi said, speaking at a Bloomberg New Economy event. His comments coincide with a severe crackdown by authorities against protestors demanding electoral reforms.\n\nEarlier today, key members of the viral pseudo-political movement, Cockroach Janta Party, were detained for protesting without permission .\n\nCJP, whose leaders were detained by authorities over the weekend as well, had sought permission from Delhi Police on Monday to launch fresh protests at the Jantar Mantar grounds in the capital. However, the government then barred the use of the site for protests.\n\nOn Monday, thousands of people reportedly joined leaders of Indian opposition parties in their march to the Supreme Court in Delhi to file a petition against revisions made to the voter list by the Election Commission.\n\nNames of 130 million people have been struck off from the voter list after the commission began conducting \"special intensive revisions\" (SIR) to update voter lists across the country last year, as per several local media reports.\n\nRahul Gandhi, the leader of the opposition in India, said the huge crowds were a sign that people were not going to be \"intimidated\" by the government .\n\n\"There are no parallel protests. It's one protest, and it's a protest where everybody is standing together,\" Gandhi said, dismissing concerns over the absence of members of the Cockroach Janta Party who had called for protests over the weekend.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 12:47 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Russia Beats US In Nuclear Warhead Race: How Many Does Israel, Pakistan Have?", "full_content": "Russia has an estimated 1,796 deployed nuclear warheads, the highest number in the world as of January 2026, SIPRI reported. The country continues to modernise its nuclear arsenal, although sanctions and the ongoing war in Ukraine have created challenges for some of its weapons programmes.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:47 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Mukul Agarwal adds 470% multibagger to Rs 8,000 crore portfolio, trims KRN Heat exposure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Mukul Agarwal adds 470% multibagger to Rs 8,000 crore portfolio, trims KRN Heat exposure Apsis Aerocom Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Mukul Agarwal adds 470% multibagger to Rs 8,000 crore portfolio, trims KRN Heat exposure SECTIONS Mukul Agarwal adds 470% multibagger to Rs 8,000 crore portfolio, trims KRN Heat exposure By Veer Sharma , ETMarkets.com Last Updated: Oct 13, 2026, 12:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ace investor Mukul Agarwal added a 1.2% stake in precision engineering firm Apsis Aerocom, which has surged 470% since its March 2026 debut, to his Rs 8,000 crore portfolio. Meanwhile, he trimmed his stake in KRN Heat Exchanger following a 61% rally over the past year.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 12:39 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How to build wealth in your 20s and 30s without giving up your lifestyle", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFor young earners in their early 30s, building wealth can sometimes feel like a choice between enjoying life today and securing the future. Social media often reinforces the idea that financial success means aggressive saving, cutting back on everything from dining out to holidays, or finding the next big investment opportunity. It does not have to be that way.\n\nWealth creation is less about extreme frugality and more about building the right financial habits early. The biggest advantage is not necessarily a high salary, but the number of years available for money to grow.\n\nConsider two investors who invest \u20b9 5,000 every month and earn an assumed annualised return of 12%. If one starts at 25 and the other at 35, the difference in their eventual corpus can be substantial, even though their monthly investment remains the same.\n\nThis is why postponing investing until one earns more can be expensive. A higher salary later can increase the amount invested, but it cannot recreate the years of compounding already lost.\n\nOne of the most common mistakes among young professionals is believing that investing should begin only after they reach a particular income level. The first objective should be to develop the habit, even if the amount is modest.\n\nA \u20b9 3,000 or \u20b9 5,000 monthly investment may look insignificant against long-term financial goals. But starting with a manageable amount and increasing contributions as income rises can help establish a sustainable investing habit.\n\nAs salaries increase, expenses tend to follow. A larger house, a better car, more frequent travel, upgraded gadgets and higher discretionary spending can gradually absorb much of the additional income. This is commonly referred to as lifestyle inflation.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 12:38 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Quantitative Methods", "Economics"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "FMCG Stocks Face Earnings Test As Valuations Fall 25% Below Five-Year Average", "full_content": "The Nifty FMCG Index trades at 31.1 times earnings, below its post-2021 average of 41.5, but weak consumption, rising input costs and earnings downgrades continue to cloud the sector's outlook.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 12:36 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio IPO may trigger Reliance\u2019s next big re-rating. Why Religare sees 47% upside", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Jio IPO may trigger Reliance\u2019s next big re-rating. Why Religare sees 47% upside The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO may trigger Reliance\u2019s next big re-rating. Why Religare sees 47% upside SECTIONS Jio IPO may trigger Reliance\u2019s next big re-rating. Why Religare sees 47% upside By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 13, 2026, 12:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reliance Industries could see a valuation re-rating as Jio Platforms\u2019 proposed Rs 30,000 crore IPO bring ership in actively managed funds with 13.3% market share, and 26.4% in equity-oriented hybrid funds.\n\nPMS and AIF schemes, while still small compared with mutual fund AUM, also posted robust growth. AIF AUM rose to \u20b9 0.24 trillion in September 2026 from \u20b9 0.19 trillion a year earlier, with the base adjusted for assets transferred from ICICI Venture. Meanwhile, PMS AUM grew to \u20b9 0.31 trillion from \u20b9 0.25 trillion.\n\nThe alternatives business could see further growth following the acquisition of ICICI Securities\u2019 PMS and the launch of the AMC\u2019s fifth specialised investment fund ( SIF ). Faster growth in higher-yielding products also helped revenue growth outpace overall AUM growth.\n\nFee and commission expenses rose 30% year-on-year, contributing to faster expense growth and slightly tempering operating profit growth. Operating profit nevertheless increased 15.7% to \u20b9 1,181 crore. But the ball and chain on net profit was other income. Mark-to-market losses on treasury holdings led to a 76.5% year-on-year plunge in other income to \u20b9 17 crore.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 12:29 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Vijay Kedia portfolio: Up 270% against IPO price in 17-month! Ace investor raises stake in SME stock; should you buy?", "full_content": "Vijay Kedia portfolio | Stock to buy today: Ace investor Vijay Kedia's portfolio is one of the most-followed by retail investors on Dalal Street. This is because of the reputation governed by Vijay Kedia among stock investors through the value picks and the amount of returns generated over the years. For those who follow Vijay Kedia's portfolio for a value pick and have decoded the strategy maintained by the ace Indian investor, there is some news for them. Vijay Kedia has raised a stake in an NSE SME stock, Iware Supplychain Services, which was listed last year in May.\n\nThe NSE SME IPO was available in the Indian primary market in May 2026 at a price band of \u20b9 95, whereas the Vijay Kedia portfolio stock is currently available at around \u20b9 350 apiece on the NSE. This means Vijay Kedia's latest buy has risen around 270% against the IPO price of \u20b9 95 per equity share. The ace Indian investor has investments in this SME stock through his company Kedia Securities and in his individual capacity. His company Kedia Securities' stake has risen from 3% to 7.35%, buying 5,00,400 company shares during Q2FY27.\n\nIn the September 2026 quarter's shareholding pattern of the NSE-listed SME stock, Vijay Kedia appears to be an investor both in an individual capacity and through his company, Kedia Securities. The shareholding pattern reveals that Vijay Kedia holds 3,45,600 company shares in his individual capacity, representing 3% of the company's total paid-up capital.\n\nVijay Kedia's Kedia Securities also holds 8,46,000 company shares, representing 7.35% of the NSE-listed SME's total paid-up capital. Comparing the shareholding pattern of the company for the June 2026 quarter, Kedia Securities' shareholding was 3,45,600, which was 3% of the company's total paid-up capital. So, Kedia Securities bought 5,00,400 fresh shares during the July to September 2026 quarter.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 12:27 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Global Market: Hong Kong dollar nears weak side of trading band, raising prospect of HKMA intervention", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI P
