.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 05:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Investing Rs 50,000 In Gold This Diwali? Compare Jewellery, Coins And Digital Gold Before Buying", "full_content": "For buyers focused on accumulating physical gold, coins can be an alternative to jewellery. They avoid the high making charges often associated with intricate ornaments and come in different weights, giving customers greater flexibility when spending a fixed amount.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 05:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Global AI sell-off turns into India's gain as FPIs pump \u20b946,000 crore in 5 sessions; will the buying spree sustain?", "full_content": "It appears that foreign portfolio investors (FPIs) have changed their bearish stance towards the Indian stock market, buying domestic equities aggressively last week and pouring in a massive \u20b9 45,970 crore in just five trading sessions. This marks a strong turnaround after foreign investors remained net sellers for two consecutive months.\n\nThe shift in sentiment boosted the Nifty 50 by 8.6% during the week, marking its strongest weekly performance since February 2021. The rally also helped the index pare its year-to-date losses to 4.21%. At its lowest point this year, the index had fallen nearly 15% but has since recovered close to 13% from its yearly low.\n\nIn addition to equities, the inflows have also strengthened the Indian rupee, which had suffered multiple record lows this year. The currency climbed 0.6% to 93.91 against the US dollar, its strongest level since April.\n\nThe shift in sentiment towards Asia's third-largest economy comes amid a correction in global AI-linked stocks. Concerns over a potential move by the US Congress, led by Democrats, to impose restrictions on the massive expansion of data centres in the US triggered a sell-off in previously favoured chip and memory stocks across Asia.\n\nIn addition, the sharp retreat in crude oil prices has eased inflation concerns, particularly as India remains heavily dependent on oil imports. An improving earnings outlook has further enhanced the appeal of Indian equities among foreign investors.\n\nIndia's relatively low exposure to the AI trade had previously left its stocks among Asia's worst performers.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 05:01 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gogo stock surges 79% in one month after Fair Value signal", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 04:39 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rare Diwali Dip: Sensex, Nifty Close Lower In Muhurat Trading For First Time In Nine Years", "full_content": "The Sensex slipped 28.62 points, or 0.04%, to 80,999.40, while the Nifty declined 43.95 points, or 0.18%, to 24,986.40.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 04:38 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Yogi govt weighs \u20b950,000 aid for women ahead of UP assembly elections in 2027, says report | What we know so far", "full_content": "The Uttar Pradesh government, led by Chief Minister Yogi Adityanath, is considering providing financial aid of \u20b9 50,000 to eligible women ahead of the state's assembly elections next year, News18 reported.\n\nIf implemented, the proposal could exceed the \u20b9 40,000 assistance promised by Samajwadi Party leader Akhilesh Yadav under the party's \u2018Stree Samman-Samriddhi Yojana\u2019, should it come to power.\n\nHowever, CM Adityanath has so far spoken only about extending financial assistance to women , without specifying the amount or explaining how the benefit would be rolled out. On November 3, 2026, while speaking in Lucknow, he said the \u201cdouble-engine government\u201d was preparing to introduce an attractive package to support women's economic self-reliance.\n\nWomen's welfare and direct cash transfers have emerged as important components of electoral strategies across several states. Therefore, the chief minister is seized of the matter, suggesting that the proposal is under consideration at the highest level, sources told the news organisation.\n\nThe Uttar Pradesh government is yet to finalise the implementation mechanism for the proposed financial assistance. Citing a senior BJP functionary, News18 reported that two broad options are currently being examined.\n\nThe BJP source also said that a final decision on the structure of the assistance, the eligibility criteria and the mode of disbursement is yet to be taken, so not further information is immediately available.\n\nUttar Pradesh has a a little over 6 crore women voters on the latest electoral rolls, making them a significant electoral constituency. In the 2022 assembly election, women's voter turnout stood at 62.24%, higher than men\u2019s 59.56%.\n\nAgainst this backdrop, the proposed financial assistance could become an important women-centric welfare measure for the BJP government ahead of the 2027 elections. Whether the proposal materialises, and the amount and mode of disbursement eventually announced, will be closely watched.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 04:33 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "AI stocks like Nvidia, Micron, and Sandisk have been blown up, but keep this in mind - Yahoo Finance", "full_content": "AI stocks like Nvidia, Micron, and Sandisk have been blown up, but keep this in mind Yahoo Finance What sparked the stock market\u2019s $2.5 trillion sell-off? CNN Opinion | Tech Stocks Had a Terrible Day. What\u2019s Coming Could Be Worse. The New York Times Why investors are dumping AI company stocks after Democrats\u2019 election sweep The Washington Post Wall Street Strategists Call Stock Rout a Fresh Reason to Buy Bloomberg", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 04:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why did RR Kabel share rally 8% during Muhurat Trading despite weak market sentiment \u2014 what triggered the surge?", "full_content": "RR Kabel shares rose 8% to \u20b92,073 during Sunday\u2019s Muhurat Trading session, helped by unusually high volumes despite broader market losses. The stock had recently weakened after subdued FY27 growth guidance, although September-quarter profit increased 55.7% and revenue rose 51.8% year on year.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 04:19 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Emami vs Dabur Q2 results: Which FMCG giant wins on profit, revenue and dividend? Check target, upcoming record dates", "full_content": "Emami and Dabur shares rose nearl ity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "On Muhurat Trading 2026 Diwali, Zee Entertainment shares in rocket mode; 11% jump on buyback, interim dividend news", "full_content": "Zee Entertainment shares rose as much as 11.1% during Muhurat trading after the company announced its board would meet on November 12 to discuss investor concerns and consider a share buyback, interim dividend or other measures. No decision has been made.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 02:59 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why Safe Enterprises shares bleeding on Diwali Muhurat trading 2026 session despite Nifty, Sensex in green? Key reasons", "full_content": "Safe Enterprises Retail Fixtures shares fell nearly 9% during Diwali Muhurat trading after the company reported a 34.57% year-on-year decline in H1 FY27 net profit to \u20b921.75 crore. Revenue also dropped to \u20b977.87 crore from \u20b9112.37 crore a year earlier.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 02:54 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Finolex Cables shares jump 14% in Muhurat Trading 2026 Diwali session day - here's why | Stock up 59% YTD | Key levels", "full_content": "Finolex Cables shares rose 14% during Muhurat Trading after Q2 FY27 net profit climbed 67.5% to \u20b9273 crore, revenue increased 65% to \u20b92,269 crore, and EBITDA more than doubled. Growth was driven by higher cable volumes and improved communication-segment realisations.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 02:52 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analy     });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
