uation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Top 3 stocks to buy: Axis Bank, Bajaj Finance, HDFC Life by Sumeet Bagadia | Targets, stop-loss, stock market prediction", "full_content": "Asit Manohar Published 21 Nov 2026, 10:45 AM IST Prefer Livemint on Google Stocks to buy | Sumeet Bagadia's stock recommendations: The key benchmark indices of the Indian stock market continued their positive momentum last week. The Nifty 50 index ascended 2.61%, while the BSE Sensex appreciated 2,300 points. Among sectors, the PSU Bank index gained the most, rallying 6.72%, whereas the Metal index was the top loser, shedding 2.94%. During the week, the key benchmark indices Nifty 50 and Sensex successfully cleared the 25,500 and 83,000 resistance marks.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes the bias in the Indian stock market has improved following the sharp rally in Indian indices. The Choice Broking expert said the Nifty 50 daily chart displays a strong bullish candlestick formation, signalling a decisive breakout above its recent consolidation range.\n\nSpeaking on the outlook for the Nifty 50 index, Sumeet Bagadia of Choice Broking said, \u201c Immediate support for the Nifty 50 index is at 25,500\u201325,600, while resistance stands at 25,920\u201326,000.\u201d\n\nThe Choice Broking expert said the RSI stands at 78.13, above its average of 75.61, reflecting strong upward momentum in overbought territory. PCR at 1.69 points to aggressive put writing and a bullish derivatives setup, while India VIX rose 7.50% to 17.32, indicating heightened volatility alongside the sharp upward move.\n\n\u201cHolding above the 25,500\u201325,600 breakout zone will be key for the index to sustain its bullish trajectory toward the 26,000 mark,\u201d Bagadia added.\n\nOn the outlook for the Bank Nifty index, the Choice Broking expert said, \u201cImmediate support for the Bank Nifty index is at 63,500\u201364,000, while resistance is placed at 64,800\u201365,000.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 10:45 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold's slide deepens as AI rout, rate-hike bets hurt bullion", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Gold's slide deepens as AI rout, rate-hike bets hurt bullion The Economic Times daily newspaper is available online now. Read Today's Paper Gold's slide deepens as AI rout, rate-hike bets hurt bullion SECTIONS Gold's slide deepens as AI rout, rate-hike bets hurt bullion Reuters Last Updated: Nov 21, 2026, 10:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold prices plummeted by 3% on Friday, settling at a 14-month low of $3,502.49 per ounce. This sharp decline is largely due to a hawkish interest rate forecast and a significant selloff within AI stocks. Analysts point to forced liquidations of gold holdings as a factor, alongside increasing expectations of US borrowing costs, contributing to the commodity's bearish trend this week.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Nov 2026, 10:44 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Credit card fraud: Software engineer loses \u20b95.47 lakh despite not sharing OTP or PIN; here's how to protect your money", "full_content": "What if you lose lakhs of rupees to credit card fraud despite never sharing your OTP, PIN or card details with anyone? A Bengaluru-based software engineer reportedly found himself in this situation after fraudsters made multiple unauthorised transactions using his American Express (Amex) and RBL Bank credit cards, causing a loss of \u20b9 5.47 lakh.\n\nThe incident, reported by The Times of India, highlights how cardholders can fall victim to digital scams even when they believe they have followed basic security precautions. Here's what you need to know.\n\nAccording to the complaint cited in the TOI report, the 31-year-old Indiranagar resident noticed suspicious transactions on 11 November. Between 12.56 pm and 2 pm, transactions worth \u20b9 4.02 lakh were made on his Amex card, while another \u20b9 1.44 lakh was charged to his RBL Bank card.\n\nThe complainant reportedly told the police that neither he nor his family members had shared card details, OTPs or PINs with anyone. He also denied installing any APK files or approving the payments.\n\nAfter receiving transaction alerts, he contacted both banks and got his cards blocked. He also called the national cybercrime helpline before approaching the police. A case was registered at Bengaluru's East Cyber Crime Police Station under the Information Technology Act and Section 318 of  day. You cannot demand a 1,000% raise.\n\nCompound interest also needs many years. A 15% yearly return, he notes, is unrealistic. The 2008 market fall showed how savings can shrink fast. DeMarco calls this plan one of hope. Hope, he says, is not a plan.\n\nThe Fastlane wealth equation is net profit plus asset value. DeMarco wants you to be a producer, not only a consumer. Build a business system that works even when you rest. He calls it a money tree.\n\nHe lists 5 types of systems. These are rental, computer, content, distribution and human resource systems. The aim is passive income. If your business needs you every day, it is just a job.\n\nDeMarco says most businesses fail because owners think about themselves. They start businesses for money or because they love something. He says nobody cares about your dreams. People care about what your business does for them.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 10:32 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US watchdogs pick a bad time to cut disclosure on executive pay", "full_content": "The Securities and Exchange Commission has decided a more \u2018principles-based\u2019 regime is needed", "source": "FT Markets", "pub_date_str": "21 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "CVC claims accounting manipulation in \u20ac3bn Advent pastry ingredients deal", "full_content": "US firm denies allegations that Irca\u2019s financial performance was overstated before it agreed to sell Italian business", "source": "FT Markets", "pub_date_str": "21 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
