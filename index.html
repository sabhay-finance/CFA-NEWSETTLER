he series of malfunctions. Despite those assurances, consumers like Sabrina Cepeda are readying for a larger-scale technology blackout or other emergency event.\n\nIn recent days, the Houston resident has purchased propane and lighter fluid for cooking and heating equipment that can be used without electricity. The mother of three also replenished her backup stockpiles of non-perishable foods, hygiene products and allergy medicine in the event that her family is homebound for several days.\n\n\"I have a way to keep my family fed, clean, hydrated, warm and safe,\" said Cepeda, 39. \"You want to have these things and not need them, rather than need them and not have them.\"\n\nThe doomsday economy is catching a bid. Wall Street and retailers are taking note.\n\nAt least half a dozen major technology outages took place in the U.S. between Nov. 12 and Nov. 17. In that time frame, spending at brands specializing in emergency products spiked about 400% compared with the same period a year prior, according to card data analyzed exclusively for CNBC by Consumer Edge.\n\nAt Ready America, which sells products like emergency survival kits, prepackaged water and high-calorie food bars, sales through e-commerce platforms have seen a roughly five-fold increase in recent days. In addition, corporate customers who keep the Vista, California-based company's supplies in their offices in case of emergency have called in to order more.\n\nThe company has rarely seen this much demand since the Covid pandemic sent Americans into lockdown more than six years ago, said Ready America President Trevyn Reese.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 08:34 PM IST", "pub_date_relative": "24m ago"}, {"title": "Here\u2019s what\u2019s been proven to help GLP-1 users from losing too much muscle from the drug", "full_content": "People taking Zepbound who engage in consistent resistance training can still get stronger even if they lose some of their muscle, according to a new study.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 08:33 PM IST", "pub_date_relative": "26m ago"}, {"title": "Burke & Herbert director Diane Poillon buys $106,131 in BHRB stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 08:31 PM IST", "pub_date_relative": "28m ago"}, {"title": "One thing Thanksgiving travelers can be thankful for: Gas prices are down 75 cents from this year\u2019s peak", "full_content": "Travelers preparing for Thanksgiving trips will find cheaper gasoline prices at the pump after months of elevated fuel prices.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 08:31 PM IST", "pub_date_relative": "28m ago"}, {"title": "I never wanted the American Dream and I felt like something was wrong with me\u2014until I moved abroad", "full_content": "I got my first job at 17, working the register at an Eckerd's drugstore in Texas. My manager was only a few years older than me, and while my coworkers seemed motivated by the idea of working their way up to his position, I felt no desire to follow that path.\n\nIt all felt suffocating: the added responsibility, the longer hours, the idea that this was the ladder I was supposed to want to climb. I wanted to work, but I couldn't wrap my head around building my whole identity around a job.\n\nI never wanted the American Dream I saw so many people around me striving to achieve. For a long time, I wondered if something was wrong with me. It wasn't until I finally made a long-term move abroad about a decade ago that I realized it was okay to want something different.\n\nAfter college, I got a job in travel sales. I was good at it. Talking about travel all day suited the wanderlust I'd carried since my first trip abroad in my teens.\n\nI continued working in sales, marketing and the odd temp role for years. But they were always just jobs. I didn't feel like they defined me or feel a calling to an industry or title the way people around me seemed to.\n\nOf course, I wanted financial stability, but I was unwilling to sacrifice my time and well-being to get it. I just didn't connect with the version of ambition that meant grinding toward a corner office. What I wanted the most wasn't status; it was freedom, growth and new experiences.\n\nThe wanderlust eventually caught up to me, and at 26 I moved to Spain to teach English. Even though I was working, people saw it as taking a year off from my career and warned me it could damage my resume. I simply didn't care. Living for my resume had never made sense to me.\n\nLooking back, I think being abroad offered an escape from the pressure to chase the traditional path of the American Dream. There, I felt free to enjoy life and figure out who I was without worrying about what box I needed to tick next.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 08:30 PM IST", "pub_date_relative": "29m ago"}, {"title": "\u2018Never too late to start\u2019: Practical investing advice from some of the top women in finance", "full_content": "There are plenty of rich and influential women in the U.S. Their time may be coming.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 08:30 PM IST", "pub_date_relative": "29m ago"}, {"title": "Max Healthcare, Fortis, Apollo, Aster: Hospital stocks steal show on D-Street with up to 14% rally - Buy now or wait?", "full_content": "FORTIS Sharmila Bhadoria Published 21 Nov 2026, 08:26 PM IST Prefer Livemint on Google Shares of hospital stocks like Max Healthcare, Fortis Hospital, Aster DM Quality Care and Apollo Hospitals Enterprise rallied as much as 14% over the past five trading sessions. The sharp rally in the segment has come amid optimism around corporate earnings and strong growth visibility.\n\nShares of Apollo Hospitals, Fortis Healthcare , Max, and Aster DM closed with 5%, 2%, 3.98%, and 5.44% respectively.\n\nApollo Hospitals stock closed 5.09% higher at \u20b9 9190.05 per share on BSE with an Mcap of \u20b9 1,32,138.82 crore on Friday. The hospital stock has delivered 8.82% return in two weeks, 19.30% return in one month, and around 29% return in 2026 so far. Motilal Oswal maintained a \u2018Buy\u2019 rating for Apollo Hospitals with a target price of \u20b9 10,400 per share.\n\nShares of Fortis closed 2% higher at \u20b9 825 per share with an Mcap of \u20b9 62,284.05 crore on Friday. Its share price value has surged 7.84% in one week, 12.12% in one month. But the stock value has declined 8.18% in 2026 so far. MOFSL gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 940 per share.\n\nThe company scrip closed 5.44% higher at \u20b9 779.65 per share on BSE with a market capitalisation of \u20b9 67,959.94 crore on Friday. The stock has delivered 7.95% return in one week, 16.85% return in one month, and 28.63% return in 2026 so far. MOFSL maintained a \u2018Buy\u2019 rating with a target price of \u20b9 870.\n\nShares of Max Healthcare closed with 3.98% gain at \u20b9 1079.60 per share on BSE with an Mcap of \u20b9 1,05,080.39 crore on Friday. The stock has delivered 14% return in one week, 15.59% return in two weeks, 30.18% return in one month, and around 8% return in three months. In its latest report, MOFSL maintained a \u2018Buy\u2019 rating, with a target price of \u20b9 1085 per share.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 08:26 PM IST", "pub_date_relative": "33m ago"}, {"title": "Bitcoin hits $55,326, lowest since Sept 2024, before rebounding above $60,000", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 08:21 PM IST", "pub_date_relative": "38m ago"}, {"title": "Lewd Remarks, Sticks, A Chase: Minors Thrash Couple Near Mumbai's Phoenix Mall; 8 Detained After Viral Video", "full_content": "The accused, aged between 12 and 15, were sent to a correctional facility until December 4 after a video of the alleged assault on a couple at Kurla Maidan went viral.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 08:18 PM IST", "pub_date_relative": "41m ago"}, {"title": "Blinded By Decree: Why Suspending BARC Ratings Paralyses Indian Television", "full_content": "The ultimate casualty of this manufactured blackout, however, is not the balance sheet of the network executive or the media agency, but the Indian consumer.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 08:17 PM IST", "pub_date_relative": "42m ago"}, {"title": "Bitcoin price crash: \u200bFalls to lowest level in two years - What\u2019s behind plunge of world\u2019s largest cryptocurrency", "full_content": "Bitcoin, the world's largest cryptocurrency by market capitalisation, plunged to its lowest level in more than two years on Friday as growing concerns over stretched valuations of artificial intelligence (AI) stocks triggered a broader sell-off in financial markets.\n\nBitcoin fell 5.10% to $55,830 at 11:13 p.m. ET on Friday (0413 GMT on Saturday), marking its lowest level since September 2024. The cryptocurrency had earlier declined 3.57% to $56,813.68.\n\nThe latest decline came after Bitcoin slipped below the psychologically important $60,000 threshold earlier on Friday for the first time since July. The cryptocurrency has come under sustained selling pressure as investors increasingly reduce exposure to risky assets amid growing economic and market uncertainties.\n\nAnalysts said the cryptocurrency market is experiencing a sharp deterioration in investor confidence, with market participants increasingly moving away from riskier investments.\n\nConcerns over the profitability of massive investments in AI infrastructure have weighed on technology stocks and spilled over into cryptocurrency markets. Other factors contributing to the downturn include rising borrowing costs, regulatory uncertainties following the Democrats' victory in the US midterm elections and Nvidia CEO Jensen Huang's departure.\n\nThe latest phase of Bitcoin's decline has also been driven by investors withdrawing money from Bitcoin exchange-traded funds (ETFs), reflecting weakening institutional demand.\n\nBitcoin ETFs have recorded year-to-date net outflows of more than $3 billion, adding to the pressure on the cryptocurrency.\n\nThe broader economic environment has also turned increasingly unfavourable for cryptocurrencies.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 08:16 PM IST", "pub_date_relative": "42m ago"}, {"title": "COP31 climate summit risks failure as talks go deep into overtime", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 08:12 PM IST", "pub_date_relative": "47m ago"}, {"title": "My husband spent $80,000 on a boat, yet says my plans for a $100,000 pottery studio are irresponsible. Who\u2019s right?", "full_content": "\u201cWe have $2.9 million in retirement accounts. That includes some money that we inherited about 10 years ago.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 08:12 PM IST", "pub_date_relative": "47m ago"}, {"title": "Welcome to the age of endless digital breakdowns - The Washington Post", "full_content": "Welcome to the age of endless digital breakdowns The Washington Post Tech Outages May Become Routine. Experts Say Don\u2019t Panic, but Prepare. The New York Times The AI race to fix security flaws could be making tech outages more common NBC News Everything Is Falling Apart, and AI\u2019s Fingerprints Are All Over It CNET The Outages Are Just Getting Started WIRED", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 08:02 PM IST", "pub_date_relative": "56m ago"}, {"title": "5e advanced materials CEO Paul Weibel purchases $745 of stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 08:01 PM IST", "pub_date_relative": "58m ago"}, {"title": "Retirees face a looming deadline for required withdrawals \u2014 missing it could trigger a tax penalty", "full_content": "Every year, millions of Americans must take required withdrawals from retirement accounts by Dec. 31.\n\nAmid the busy holiday season, it's easy to miss the year-end deadline for required minimum distributions \u2014 a mistake that can trigger a hefty IRS penalty , experts said.\n\n\"One of the most common RMD mistakes is waiting until the last minute,\" said certified financial planner Alex Canellopoulos, director of wealth at Vista Capital Partners in Portland, Oregon.\n\nMost retirees must start RMDs from pretax accounts at age 73. The withdrawal is based on the previous year's account balances on Dec. 31, your age and an IRS \" life expectancy factor .\"\n\nThe first annual RMD deadline is April 1 of the year after you turn 73, and future withdrawals are due by Dec. 31. If you wait until April 1 for the first one, you'll need two RMDs that year.\n\nRMDs also apply to certain inherited IRAs if the original IRA owner reached RMD age before their death.\n\nIn 2023, more than 14.8 million taxpayers age 70 or older had a traditional individual retirement account, according to the latest IRS data. The average year-end market value of the accounts was about $330,000.\n\nDeferring RMDs until the last minute raises the likelihood of mistakes, such as overlooking certain retirement accounts or making withdrawal calculation errors, Canellopoulos said.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 08:00 PM IST", "pub_date_relative": "59m ago"}, {"title": "Inter Miami vs Columbus Crew Live Streaming: When And Where To Watch Messi's MLS Playoff Match In India", "full_content": "Messi scored 26 goals and provided 17 assists during the regular season as Inter Miami finished among the favourites for the MLS Cup.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 08:00 PM IST", "pub_date_relative": "59m ago"}, {"title": "Newcastle United vs Arsenal Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online In India?", "full_content": "Arsenal will look to extend their five-match winning streak when they travel to St James' Park to take on Newcastle United.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 08:00 PM IST", "pub_date_relative": "59m ago"}, {"title": "During Wall Street's worst week in over a year, we put money to work. What we're buying", "full_content": "The brutal sell-off is creating opportunities for us to put cash to work.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 07:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "ENE Repeat Box Office Collection Day 3: Vishwak Sen Starrer Turns Strong Opening Into Steady Weekend Run", "full_content": "Directed by Tharun Bhascker Dhaassyam, ENE Repeat follows Vivek and his friends as their reunion leads to another fun-filled adventure, starring Vishwak Sen in the lead.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 07:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "How a brutal week for stocks almost wiped out their gains for the entire year", "full_content": "Investors are now more focused on protecting their portfolios than looking for bargains", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 07:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why Anthropic's blockbuster IPO couldn't escape the stock market correction", "full_content": "No one can say the Anthropic initial public offering wasn't a success for the company. Deal size and pricing were signs of what IPO experts say was insatiable demand for \" ANT \" shares. But what came within a day is something that investors better get used to: anxiety in the stock market about valuations being assigned to artificial intelligence revenue and business models that should keep Anthropic shares volatile in the period ahead.\n\nThe Anthropic IPO reinforces those fears rather than running counter to them, says Avery Marquez, director of investment strategies at Renaissance Capital, which researches IPOs and manages the Renaissance IPO ETF ( IPO ).\n\n\"The volatility in the AI trade we've been seeing for the past few months stems from valuations and whether we are in a bubble, and that's been heightened and highlighted by the Anthropic IPO,\" Marquez said on \"ETF Edge\" on Friday.\n\nAnd in the case of Anthropic, which finished trading Friday down 9%, the valuation anxiety becomes \"so much more prevalent,\" she added, because it is a new stock.\n\nIt is not just any new stock, but one that has Wall Street adding downside risks to research notes likely never seen before, and which may be the greatest understatement (or most subtle equities research joke) in the history of earnings analysis. \"Anthropic could develop AI systems which become fully autonomous and wipe out humanity which may lead to a serious decline in earnings,\" Seaport Research Partners analyst wrote Jay Goldberg wrote on Nov. 18.\n\n\"It was challenging company to value ... and it's very richly valued,\" Marquez said. \"We're seeing something more reasonable and investors grappling now with where should this company actually be valued,\" she added.\n\nAnthropic performance this week.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 07:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "An \u2018illusion of glitz and glamour\u2019: Inside California\u2019s modern-day gold rush, where miners can bring in millions", "full_content": "The price of gold has sparked a modern-day gold rush in California. Small-scale miners are investing time, physical labor and money to unearth the yellow metal.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 07:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Modi Ji, Our Money Was Saved': PM Links His May Appeal To Fall In Gold Prices", "full_content": "\"Just as Lal Bahadur Shastri ji had asked the countrymen to skip one meal, and this country obeyed his call; my country still holds that same character,\" PM Modi said.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 07:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "EU budget chief proposes \u20ac40 bln cut and digital tax plan", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 07:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "First National Corp director Boyce Brannock buys $8,691 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 07:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Grocery stores have \u2018staggering deals\u2019 for Thanksgiving \u2014 but don\u2019t get used to these lower prices just yet", "full_content": "Walmart, Target and Amazon are some of the retailers offering meal-basket deals this year.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 07:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Have Foreign Assets? Income Tax Department Clarifies When The Rs 1 Lakh Fee Applies", "full_content": "The amount payable under FAST-DS depends on the circumstances surrounding the undisclosed foreign holdings.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 07:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Iran claims U.S. F-16 damaged, drones downed as tankers hit off Oman", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 07:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Does Deepinder Goyal's Own Paper Undercut 'Temple'? Liver Doc Thinks So", "full_content": "Dr Cyriac Abby Philips argued that the paper's own anatomy section shows a sensor on the temple tracks arteries that supply the face and scalp, not the brain. He also pointed to the paper's timing, days after Temple opened pre-orders.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 07:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kavya Maran-Anirudh Greece Wedding: Aegean Sea Views, Floral Installations And Mirrored Aisle", "full_content": "Kavya Maran and Anirudh Ravichander\u2019s wedding featured ivory blooms, transparent chairs and a stunning mirrored aisle overlooking the Aegean Sea.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 07:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Skip the junk: What retail experts say is actually worth buying on Black Friday - Yahoo", "full_content": "Skip the junk: What retail experts say is actually worth buying on Black Friday Yahoo We shopped 147 early Black Friday sales to find the 98 best deals worth shopping now CNN I scoured dozens of Black Friday sales, and these are the best style deals from Hoka, Kate Spade, Hanes and more Yahoo Black Friday Holiday Deals, Approved by Executive Editor Adrianna Brach TODAY.com The 10 best Black Friday sales to shop this weekend USA Today", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 07:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "OM Box Office Collection Day 2: Dhanush-Mammootty Starrer Continues Impressive Run \u2014 Check Earnings", "full_content": "Written and directed by Rajkumar Periasamy, OM follows multiple characters whose lives intersect amid a larger conflict.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 07:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank of America sells $2,623 of Neuberger Municipal Fund stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 07:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s nonstop drama is keeping buyers away from a historically cheap stock", "full_content": "Uncertainties over how the Jensen Huang drama plays out should keep investors from trying to pick a bottom in Nvidia\u2019s stock, no matter how cheap it gets.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 07:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock split reset: SanDisk stock crashes 87.5% overnight? Here's what investors need to know about its 8-for-1 split", "full_content": "Shares of SanDisk (SNDK) underwent a strong stock-split reset on Friday, November 20. The memory and storage maker stock closed at $ 755.16 per share on Thursday, only to start trading below $ 100 apiece next day.\n\nThe major price adjustment is due to the SanDisk stock split. With the corporate action coming into effect, investors holding a single stock of SanDisk will now become owners of eight stocks of the company. The stock split adjustment has reduced the price per share of the company.\n\nLast month, SanDisk announced a stock split for eligible shareholders in eight-for-one stock split . The memory and storage maker had fixed November 9 as the record date to determine the eligibility of shareholders for the corporate action.\n\nEvery eligible SanDisk stockholder received seven additional shares for each share held, which were issued after market close on Thursday, November 19, 2026. While the stock split has increased the overall number of shares in SanDisk, its overall market capitalisation and stockholder ownership percentage remained unchanged.\n\nSanDisk stock closed at $755.16 on Thursday, the stock's split-adjusted reference price stood at approximately $94.40. However, shares opened at $89.91 on Friday, November 20, and declined further. While the stock has crashed nearly 87% in absolute terms, its face value remained unchanged.\n\nThe 87% reduction was just a mathematical adjustment rather than an actual crash in the stock's value.\n\nUnder the split arrangement, every exiting share was divided into eight shares. Hence, it reduce the per-share price proportionately, but the overall investors' holding remained unchanged. Which means, an investor holding a single SanDisk stock of $755.16 before the stock split would own eight shares worth approximately $94.40 each after the corporate action.\n\nSanDisk shares fell nearly 16% on Friday following the stock split. The stock closed 16.05% lower at $ 79.24 per share on Friday.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 06:57 PM IST", "pub_date_relative": "2h ago"}, {"title": "FDA Raids Vidhan Bhavan, Air India Building Eateries; Zepto, Blinkit Units Among 38 Licences Suspended", "full_content": "The regulator suspended 38 licences and seized stock worth Rs 3.52 crore across Maharashtra.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 06:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gujarat trader with 2 PANs gets another chance in \u20b97.60 lakh tax dispute after ITAT directs I-T Dept to reassess case", "full_content": "A Gujarat-based firecracker trader has been given a fresh opportunity to challenge a \u20b9 7.60 lakh income tax addition after the ITAT Ahmedabad Bench overturned the appellate order and sent the case back to the Assessing Officer for reconsideration.\n\nThe dispute arose after the taxpayer, VG Agrawal, was allegedly allotted two Permanent Account Numbers (PANs) due to a clerical error. While Agrawal maintained that he had already disclosed his entire firecracker business income in his income tax return filed under one PAN, the Income Tax Department initiated reassessment proceedings using the other PAN and treated \u20b9 7.60 lakh as undisclosed income.\n\nThe taxpayer challenged the addition, arguing that the same business income could not be taxed again simply because it had been reported under a different PAN.\n\nAccording to the case details, Agrawal had been allotted two PANs, allegedly because of an inadvertent clerical mistake.\n\nFor Assessment Year 2020-21, he filed his income tax return under one of the PANs, declaring his income from the firecracker business. He also submitted an audit report along with the return.\n\nHowever, the Income Tax Department initiated reassessment proceedings under Section 147 of the Income-tax Act, 1961, using his other PAN.\n\nThe Assessing Officer (AO) completed the reassessment on March 24, 2025, under Section 147 read with Section 144 of the Act. The officer assessed the taxpayer's income at \u20b9 7.60 lakh by making an addition of the entire amount.\n\nAgrawal argued that the department had failed to consider the income tax return already filed under his other PAN.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 06:54 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin At Two-Year Low: If You\u2019d Invested Rs 1 lakh At The Peak, Here\u2019s What You\u2019d Have Now", "full_content": "Bitcoin's slide from $126,200 to $55,830 has eroded over half the value of a Rs 1 lakh investment, even as rupee depreciation offered a marginal cushion.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 06:54 PM IST", "pub_date_relative": "2h ago"}, {"title": "Ramayana Box Office Collection Day 17: Magnum Opus Continues Strong Run; Nears Rs 900-Crore Net In India", "full_content": "Nitesh Tiwari\u2019s Ramayana Part 1 brings Lord Rama\u2019s story to life, featuring Ranbir Kapoor as Rama, Sai Pallavi as Sita and Yash as Ravana in the much-awaited epic.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 06:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Vivos (OTCQB:RDGL) CEO Michael Korenko acquires $9,820 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 06:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "PSG vs Nice Live Streaming: When And Where To Watch Ligue 1 Match Live In India?", "full_content": "PSG are aiming to strengthen their position at the top of the Ligue 1 table as they travel to face Nice.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 06:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "'Proves Nothing': Liver Doc Tears Into Deepinder Goyal's Gravity-Ageing Paper", "full_content": "Hepatologist Dr Cyriac Abby Philips claimed that a co-author of the paper is a paid consultant to Goyal's company Temple, a link he said the journal paper does not disclose. Goyal had earlier said the paper is only a hypothesis that needs to be tested.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 06:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "State and federal battle over prediction markets regulation heats up after midterms", "full_content": "The turf war between states and the federal government is intensifying after Democrats secured control of Congress and key governorships on midterm elections night.\n\nWhile it was widely expected Democrats would step up oversight of the emerging, multibillion-dollar industry if they won control of Congress, the actions after the elections have come from primarily Republican-led states.\n\nAt the same time, the Commodity Futures Trading Commission \u2014 the federal regulator for prediction markets \u2014 has ramped up its oversight of \"mention\" markets , where traders speculate on what individuals will say during a speech or broadcast. It's a type of event contract the agency has said is susceptible to manipulation.\n\nCNBC first reported on Tuesday that the CFTC placed a hold on the certification of markets related to President Donald Trump's words in mid-November. Kalshi said it was complying with the order, but CEO Tarek Mansour said at an Axios event on Tuesday that the company disagreed with the regulatory decision.\n\nOn Thursday, the Senate passed a bipartisan bill that would ban CFTC-registered entities from listing contracts involving terrorism, assassination, war or military operations. The measure also bars contracts that are \"reasonably expected\" to resolve based on an individual's death.\n\nUtah Attorney General Derek Brown filed 14 criminal charges against Kalshi and its founders, Mansour and Luana Lopes Lara, on Oct. 28, asserting the company violated a state law that prohibits gambling.\n\nKalshi's founders are expected to appear in person at Utah's Third District Court on Dec. 4, according to court documents.\n\n\"This is a crazy overreach; Utah is clearly playing politics. We look forward to putting a stop to this in court, just like we did in Arizona,\" said Kalshi's spokesperson Dani Lever.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 06:42 PM IST", "pub_date_relative": "2h ago"}, {"title": "From trash to treasure: Most hated stocks are winning as AI bull market rolls over", "full_content": "Several stocks that are unpopular on Wall Street, including Clorox, Boston Beer and Campbell's, are poised to be winners as the AI trade loses steam.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 06:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "The five best stocks to buy before year-end, according to Bank of America", "full_content": "Bank of America said there are several stocks that all investors should own by the end of 2026.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 06:34 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "The sudden reversal in the stock market, and what comes next - The Washington Post", "full_content": "The sudden reversal in the stock market, and what comes next The Washington Post Prediction markets outlook for stocks in 2026 dims amid AI sell-off CNBC If I Could Tell All S&P 500 Investors Just 1 Thing Right Now, It's This The Motley Fool A 10% drop for the stock market is unnerving, but it\u2019s not that unusual AP News The Stock Market Is Declining And The Worst May Be Yet To Come (NYSEARCA:SPY) Seeking Alpha", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 08:47 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "\u2018Nvidia\u2019s turmoil has me spooked\u2019: Is it time to sell my stocks?", "full_content": "If you are tempted to ditch stocks for property or CDs, take a deep breath before making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 08:45 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "I\u2019m terrified of a market crash. Should I put $400,000 of my $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 08:45 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tech outages are fueling a new doomsday economy", "full_content": "A spate of high-profile technology outages that grounded planes , halted email access and slowed bank transactions have left many people worried about artificial intelligence -driven cyberattacks and the state of the U.S. energy grid.\n\nGovernment officials have dismissed rumors and speculation circulating online that there could be a nefarious culprit for the series of malfunctions. Despite those assurances, consumers like Sabrina Cepeda are readying for a larger-scale technology blackout or other emergency event.\n\nIn recent days, the Houston resident has purchased propane and lighter fluid for cooking and heating equipment that can be used without electricity. The mother of three also replenished her backup stockpiles of non-perishable foods, hygiene products and allergy medicine in the event that her family is homebound for several days.\n\n\"I have a way to keep my family fed, clean, hydrated, warm and safe,\" said Cepeda, 39. \"You want to have these things and not need them, rather than need them and not have them.\"\n\nThe doomsday economy is catching a bid. Wall Street and retailers are taking note.\n\nAt least half a dozen major technology outages took place in the U.S. between Nov. 12 and Nov. 17. In that time frame, spending at brands specializing in emergency products spiked about 400% compared with the same period a year prior, according to card data analyzed exclusively for CNBC by Consumer Edge.\n\nAt Ready America, which sells products like emergency survival kits, prepackaged water and high-calorie food bars, sales through e-commerce platforms have seen a roughly five-fold increase in recent days. In addition, corporate customers who keep the Vista, California-based company's supplies in their offices in case of emergency have called in to order more.\n\nThe company has rarely seen this much demand since the Covid pandemic sent Americans into lockdown more than six years ago, said Ready America President Trevyn Reese.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 08:34 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Max Healthcare, Fortis, Apollo, Aster: Hospital stocks steal show on D-Street with up to 14% rally - Buy now or wait?", "full_content": "FORTIS Sharmila Bhadoria Published 21 Nov 2026, 08:26 PM IST Prefer Livemint on Google Shares of hospital stocks like Max Healthcare, Fortis Hospital, Aster DM Quality Care and Apollo Hospitals Enterprise rallied as much as 14% over the past five trading sessions. The sharp rally in the segment has come amid optimism around corporate earnings and strong growth visibility.\n\nShares of Apollo Hospitals, Fortis Healthcare , Max, and Aster DM closed with 5%, 2%, 3.98%, and 5.44% respectively.\n\nApollo Hospitals stock closed 5.09% higher at \u20b9 9190.05 per share on BSE with an Mcap of \u20b9 1,32,138.82 crore on Friday. The hospital stock has delivered 8.82% return in two weeks, 19.30% return in one month, and around 29% return in 2026 so far. Motilal Oswal maintained a \u2018Buy\u2019 rating for Apollo Hospitals with a target price of \u20b9 10,400 per share.\n\nShares of Fortis closed 2% higher at \u20b9 825 per share with an Mcap of \u20b9 62,284.05 crore on Friday. Its share price value has surged 7.84% in one week, 12.12% in one month. But the stock value has declined 8.18% in 2026 so far. MOFSL gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 940 per share.\n\nThe company scrip closed 5.44% higher at \u20b9 779.65 per share on BSE with a market capitalisation of \u20b9 67,959.94 crore on Friday. The stock has delivered 7.95% return in one week, 16.85% return in one month, and 28.63% return in 2026 so far. MOFSL maintained a \u2018Buy\u2019 rating with a target price of \u20b9 870.\n\nShares of Max Healthcare closed with 3.98% gain at \u20b9 1079.60 per share on BSE with an Mcap of \u20b9 1,05,080.39 crore on Friday. The stock has delivered 14% return in one week, 15.59% return in two weeks, 30.18% return in one month, and around 8% return in three months. In its latest report, MOFSL maintained a \u2018Buy\u2019 rating, with a target price of \u20b9 1085 per share.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 08:26 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin hits $55,326, lowest since Sept 2024, before rebounding above $60,000", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Nov 2026, 08:21 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Blinded By Decree: Why Suspending BARC Ratings Paralyses Indian Television", "full_content": "The ultimate casualty of this manufactured blackout, however, is not the balance sheet of the network executive or the media agency, but the Indian consumer.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 08:17 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin price crash: \u200bFalls to lowest level in two years - What\u2019s behind plunge of world\u2019s largest cryptocurrency", "full_content": "Bitcoin, the world's largest cryptocurrency by market capitalisation, plunged to its lowest level in more than two years on Friday as growing concerns over stretched valuations of artificial intelligence (AI) stocks triggered a broader sell-off in financial markets.\n\nBitcoin fell 5.10% to $55,830 at 11:13 p.m. ET on Friday (0413 GMT on Saturday), marking its lowest level since September 2024. The cryptocurrency had earlier declined 3.57% to $56,813.68.\n\nThe latest decline came after Bitcoin slipped below the psychologically important $60,000 threshold earlier on Friday for the first time since July. The cryptocurrency has come under sustained selling pressure as investors increasingly reduce exposure to risky assets amid growing economic and market uncertainties.\n\nAnalysts said the cryptocurrency market is experiencing a sharp deterioration in investor confidence, with market participants increasingly moving away from riskier investments.\n\nConcerns over the profitability of massive investments in AI infrastructure have weighed on technology stocks and spilled over into cryptocurrency markets. Other factors contributing to the downturn include rising borrowing costs, regulatory uncertainties following the Democrats' victory in the US midterm elections and Nvidia CEO Jensen Huang's departure.\n\nThe latest phase of Bitcoin's decline has also been driven by investors withdrawing money from Bitcoin exchange-traded funds (ETFs), reflecting weakening institutional demand.\n\nBitcoin ETFs have recorded year-to-date net outflows of more than $3 billion, adding to the pressure on the cryptocurrency.\n\nThe broader economic environment has also turned increasingly unfavourable for cryptocurrencies.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 08:16 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Retirees face a looming deadline for required withdrawals \u2014 missing it could trigger a tax penalty", "full_content": "Every year, millions of Americans must take required withdrawals from retirement accounts by Dec. 31.\n\nAmid the busy holiday season, it's easy to miss the year-end deadline for required minimum distributions \u2014 a mistake that can trigger a hefty IRS penalty , experts said.\n\n\"One of the most common RMD mistakes is waiting until the last minute,\" said certified financial planner Alex Canellopoulos, director of wealth at Vista Capital Partners in Portland, Oregon.\n\nMost retirees must start RMDs from pretax accounts at age 73. The withdrawal is based on the previous year's account balances on Dec. 31, your age and an IRS \" life expectancy factor .\"\n\nThe first annual RMD deadline is April 1 of the year after you turn 73, and future withdrawals are due by Dec. 31. If you wait until April 1 for the first one, you'll need two RMDs that year.\n\nRMDs also apply to certain inherited IRAs if the original IRA owner reached RMD age before their death.\n\nIn 2023, more than 14.8 million taxpayers age 70 or older had a traditional individual retirement account, according to the latest IRS data. The average year-end market value of the accounts was about $330,000.\n\nDeferring RMDs until the last minute raises the likelihood of mistakes, such as overlooking certain retirement accounts or making withdrawal calculation errors, Canellopoulos said.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 08:00 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why Anthropic's blockbuster IPO couldn't escape the stock market correction", "full_content": "No one can say the Anthropic initial public offering wasn't a success for the company. Deal size and pricing were signs of what IPO experts say was insatiable demand for \" ANT \" shares. But what came within a day is something that investors better get used to: anxiety in the stock market about valuations being assigned to artificial intelligence revenue and business models that should keep Anthropic shares volatile in the period ahead.\n\nThe Anthropic IPO reinforces those fears rather than running counter to them, says Avery Marquez, director of investment strategies at Renaissance Capital, which researches IPOs and manages the Renaissance IPO ETF ( IPO ).\n\n\"The volatility in the AI trade we've been seeing for the past few months stems from valuations and whether we are in a bubble, and that's been heightened and highlighted by the Anthropic IPO,\" Marquez said on \"ETF Edge\" on Friday.\n\nAnd in the case of Anthropic, which finished trading Friday down 9%, the valuation anxiety becomes \"so much more prevalent,\" she added, because it is a new stock.\n\nIt is not just any new stock, but one that has Wall Street adding downside risks to research notes likely never seen before, and which may be the greatest understatement (or most subtle equities research joke) in the history of earnings analysis. \"Anthropic could develop AI systems which become fully autonomous and wipe out humanity which may lead to a serious decline in earnings,\" Seaport Research Partners analyst wrote Jay Goldberg wrote on Nov. 18.\n\n\"It was challenging company to value ... and it's very richly valued,\" Marquez said. \"We're seeing something more reasonable and investors grappling now with where should this company actually be valued,\" she added.\n\nAnthropic performance this week.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 07:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "An \u2018illusion of glitz and glamour\u2019: Inside California\u2019s modern-day gold rush, where miners can bring in millions", "full_content": "The price of gold has sparked a modern-day gold rush in California. Small-scale miners are investing time, physical labor and money to unearth the yellow metal.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 07:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "'Modi Ji, Our Money Was Saved': PM Links His May Appeal To Fall In Gold Prices", "full_content": "\"Just as Lal Bahadur Shastri ji had asked the countrymen to skip one meal, and this country obeyed his call; my country still holds that same character,\" PM Modi said.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 07:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "OM Box Office Collection Day 2: Dhanush-Mammootty Starrer Continues Impressive Run \u2014 Check Earnings", "full_content": "Written and directed by Rajkumar Periasamy, OM follows multiple characters whose lives intersect amid a larger conflict.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 07:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock split reset: SanDisk stock crashes 87.5% overnight? Here's what investors need to know about its 8-for-1 split", "full_content": "Shares of SanDisk (SNDK) underwent a strong stock-split reset on Friday, November 20. The memory and storage maker stock closed at $ 755.16 per share on Thursday, only to start trading below $ 100 apiece next day.\n\nThe major price adjustment is due to the SanDisk stock split. With the corporate action coming into effect, investors holding a single stock of SanDisk will now become owners of eight stocks of the company. The stock split adjustment has reduced the price per share of the company.\n\nLast month, SanDisk announced a stock split for eligible shareholders in eight-for-one stock split . The memory and storage maker had fixed November 9 as the record date to determine the eligibility of shareholders for the corporate action.\n\nEvery eligible SanDisk stockholder received seven additional shares for each share held, which were issued after market close on Thursday, November 19, 2026. While the stock split has increased the overall number of shares in SanDisk, its overall market capitalisation and stockholder ownership percentage remained unchanged.\n\nSanDisk stock closed at $755.16 on Thursday, the stock's split-adjusted reference price stood at approximately $94.40. However, shares opened at $89.91 on Friday, November 20, and declined further. While the stock has crashed nearly 87% in absolute terms, its face value remained unchanged.\n\nThe 87% reduction was just a mathematical adjustment rather than an actual crash in the stock's value.\n\nUnder the split arrangement, every exiting share was divided into eight shares. Hence, it reduce the per-share price proportionately, but the overall investors' holding remained unchanged. Which means, an investor holding a single SanDisk stock of $755.16 before the stock split would own eight shares worth approximately $94.40 each after the corporate action.\n\nSanDisk shares fell nearly 16% on Friday following the stock split. The stock closed 16.05% lower at $ 79.24 per share on Friday.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 06:57 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gujarat trader with 2 PANs gets another chance in \u20b97.60 lakh tax dispute after ITAT directs I-T Dept to reassess case", "full_content": "A Gujarat-based firecracker trader has been given a fresh opportunity to challenge a \u20b9 7.60 lakh income tax addition after the ITAT Ahmedabad Bench overturned the appellate order and sent the case back to the Assessing Officer for reconsideration.\n\nThe dispute arose after the taxpayer, VG Agrawal, was allegedly allotted two Permanent Account Numbers (PANs) due to a clerical error. While Agrawal maintained that he had already disclosed his entire firecracker business income in his income tax return filed under one PAN, the Income Tax Department initiated reassessment proceedings using the other PAN and treated \u20b9 7.60 lakh as undisclosed income.\n\nThe taxpayer challenged the addition, arguing that the same business income could not be taxed again simply because it had been reported under a different PAN.\n\nAccording to the case details, Agrawal had been allotted two PANs, allegedly because of an inadvertent clerical mistake.\n\nFor Assessment Year 2020-21, he filed his income tax return under one of the PANs, declaring his income from the firecracker business. He also submitted an audit report along with the return.\n\nHowever, the Income Tax Department initiated reassessment proceedings under Section 147 of the Income-tax Act, 1961, using his other PAN.\n\nThe Assessing Officer (AO) completed the reassessment on March 24, 2025, under Section 147 read with Section 144 of the Act. The officer assessed the taxpayer's income at \u20b9 7.60 lakh by making an addition of the entire amount.\n\nAgrawal argued that the department had failed to consider the income tax return already filed under his other PAN.", "source": "LiveMint Money", "pub_date_str": "21 Nov 2026, 06:54 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin At Two-Year Low: If You\u2019d Invested Rs 1 lakh At The Peak, Here\u2019s What You\u2019d Have Now", "full_content": "Bitcoin's slide from $126,200 to $55,830 has eroded over half the value of a Rs 1 lakh investment, even as rupee depreciation offered a marginal cushion.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 06:54 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "State and federal battle over prediction markets regulation heats up after midterms", "full_content": "The turf war between states and the federal government is intensifying after Democrats secured control of Congress and key governorships on midterm elections night.\n\nWhile it was widely expected Democrats would step up oversight of the emerging, multibillion-dollar industry if they won control of Congress, the actions after the elections have come from primarily Republican-led states.\n\nAt the same time, the Commodity Futures Trading Commission \u2014 the federal regulator for prediction markets \u2014 has ramped up its oversight of \"mention\" markets , where traders speculate on what individuals will say during a speech or broadcast. It's a type of event contract the agency has said is susceptible to manipulation.\n\nCNBC first reported on Tuesday that the CFTC placed a hold on the certification of markets related to President Donald Trump's words in mid-November. Kalshi said it was complying with the order, but CEO Tarek Mansour said at an Axios event on Tuesday that the company disagreed with the regulatory decision.\n\nOn Thursday, the Senate passed a bipartisan bill that would ban CFTC-registered entities from listing contracts involving terrorism, assassination, war or military operations. The measure also bars contracts that are \"reasonably expected\" to resolve based on an individual's death.\n\nUtah Attorney General Derek Brown filed 14 criminal charges against Kalshi and its founders, Mansour and Luana Lopes Lara, on Oct. 28, asserting the company violated a state law that prohibits gambling.\n\nKalshi's founders are expected to appear in person at Utah's Third District Court on Dec. 4, according to court documents.\n\n\"This is a crazy overreach; Utah is clearly playing politics. We look forward to putting a stop to this in court, just like we did in Arizona,\" said Kalshi's spokesperson Dani Lever.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 06:42 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "From trash to treasure: Most hated stocks are winning as AI bull market rolls over", "full_content": "Several stocks that are unpopular on Wall Street, including Clorox, Boston Beer and Campbell's, are poised to be winners as the AI trade loses steam.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 06:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic\u2019s record IPO collides with tech\u2019s worst week on Wall Street since 2020", "full_content": "Startup investor Ben Narasin is so jazzed about Anthropic's blockbuster IPO that he's planning a party later this month at his home in Silicon Valley. Sake, vodka and Krug Champagne will be served. Each attendee will be given two jars of caviar.\n\n\"This is a celebration of the most material, significant, and mind-blowingly awesome event that has ever happened in venture capital,\" Narasin, founding partner of Tenacity Venture Capital, told CNBC in an interview, adding that he didn't even invest in the company.\n\nAnthropic raised a record $93.5 billion in its IPO and an additional $26 billion from tech giants that bought at the offer price. The stock gained 17% in its debut on Thursday, lifting Anthropic's market cap to $1.8 trillion and providing a much-needed windfall for Silicon Valley's startup ecosystem.\n\nIt was quite the split-screen moment on Wall Street, which spent the week in an AI-driven tailspin. Led by Nvidia's 23% plunge , which marked the stock's sharpest weekly pullback in 18 years, the Nasdaq slid 10% over the past five trading days in its worst week since the early days of Covid in 2020.\n\nAnthropic's stock chart Investors and analysts spent the week debating whether Anthropic will trade alongside AI hardware, as it's reliant on advanced chips, memory and data centers, or whether it will stand alone as the first public pure-play AI developer and a company that's achieved unrivaled growth in less than six years of existence.\n\nThat question will likely persist for some time, but Friday's market action showed that Wall Street is skeptical of Anthropic's ability to grow into its lofty valuation. At week's end, the Claude creator's $1.6 trillion fully diluted market cap put it behind just six U.S.", "source": "CNBC World Economy", "pub_date_str": "21 Nov 2026, 06:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "An early breakdown in the polar vortex is threatening already depleted gas stocks", "full_content": "An unprecedented early breakdown of the stratospheric polar vortex and a record-breaking El Ni\u00f1o event has put energy traders on alert this winter, with analysts warning the weather and climate phenomena could have an outsized impact on Europe.\n\nMeteorologists are currently observing a record early breakdown of the polar vortex, a large-scale circulation of strong winds that typically keeps extremely cold air over the North Pole.\n\nChanges in the strength and shape of the polar vortex can influence weather patterns much lower down in the atmosphere, potentially bringing in colder weather to parts of Europe and North America.\n\nThis year, however, the collapse of the stratospheric polar vortex, or SPV, is taking place at the same time as an unusually powerful El Ni\u00f1o, a climate event that can boost global temperatures and disrupt rainfall.\n\nThe collision of these two events raises the risk of a prolonged cold spell that could lift heating demand and force European countries to draw down already-low reserves faster. That would leave the continent more reliant on imported liquefied natural gas (LNG) at a time when supplies from the Middle East are disrupted.\n\nTo be sure, Europe's natural gas storage levels started the winter at their lowest level in more than a decade.\n\nThe International Energy Agency warned earlier this month that low European storage levels and limited storage options in several LNG-importing countries in Asia and South America could intensify the competition for cargoes and put upward pressure on prices during periods of high demand.\n\nSimon Lee, a lecturer in atmospheric science at the U.K.'s University of St Andrews, said the combination of a sudden stratospheric warming (SSW) with an El Ni\u00f1o event is not necessarily unusual, but meteorologists had been expecting a polar vortex breakdown in February \u2014 not as early as November.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 06:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Trump orders federal contractors to notify White House before giving Congress information", "full_content": "President Donald Trump on Friday ordered companies with federal contracts to alert the White House before sharing information with Congress and to withhold material the administration deems confidential, expanding his efforts to limit congressional oversight ahead of Democrats taking control of Congress in January.\n\nTrump's executive order, issued late on Friday, applies to federal contractors and their subcontractors. Companies that fail to comply could face cancellation of existing contracts or suspension from future federal business, it said.\n\nThe order is part of a broader effort by the Republican president to control what information reaches Congress and limit Democratic investigations into his administration, setting up a potentially significant battle over presidential power and lawmakers' authority to scrutinize the White House.\n\nDemocrats, who won control of both chambers of Congress in this month's midterm elections, have vowed to investigate Trump's administration, his family's business dealings and its relationships with private companies.\n\nFriday's order follows a directive issued this week by White House Counsel Will Scharf requiring federal agencies to obtain White House approval before employees agree to testify before Congress. Scharf said certain Democratic investigations could amount to criminal conduct, a claim that has raised questions about the administration's attempts to limit congressional oversight.\n\nThe restrictions could face legal challenges, particularly if contractors are told to withhold information sought through congressional subpoenas. Executive privilege allows presidents to protect certain confidential communications, but courts can intervene in disputes over Congress' authority to obtain information.\n\nDemocrats are preparing to investigate potential conflicts of interest, federal contracts, immigration enforcement and the administration's handling of the Jeffrey Epstein investigation.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 05:57 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold Is Slumping, But 'Canada's Warren Buffett' Has 44% Of His US Portfolio In Gold Miners", "full_content": "Fairfax Financial, the firm led by Prem Watsa, holds over $1.17 billion across Equinox Gold and Eldorado Gold. It made Equinox a fresh buy last quarter while selling out of Orla Mining.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 05:56 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Traders start to move US copper to China as Trump tariff fears ease", "full_content": "Acute Chinese shortage and high local premium create lucrative arbitrage", "source": "FT Markets", "pub_date_str": "21 Nov 2026, 05:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PSU vs Private banks: Who is powering Nifty Bank's record-high rally after 5% surge? SBI, HDFC, AU, Canara target price", "full_content": "Banking stocks led the November market rally, with Nifty Bank rising around 16% month-to-date to a record intraday high of 64,485 on November 20. PSU and private bank indexes also advanced sharply, while brokerages cited healthy credit demand and robust lending pipelines.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 05:00 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "S&P 500 correction: Five forces behind the market sell-off", "full_content": "The S&P 500 and Dow Jones Industrial Average closed in correction territory, off 10% from their records. The Nasdaq Composite lost its gain for the year.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 04:59 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold, silver price crash: DSP Mutual Fund turns bullish on bullion, reveals new buying strategy; check price levels", "full_content": "Gold prices plunged to a 14-month low, recording their steepest weekly decline in eight months amid interest-rate concerns and an AI-stock selloff. DSP Mutual Fund is gradually buying gold and silver as prices fall, using predefined price levels rather than trying to predict a market bottom.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 04:50 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Mahanadi CoalFields IPO GMP Check: Down 92% from \u20b99.25 to \u20b90.7, issue struggles to attract bids- Subscribe or avoid?", "full_content": "Mahanadi Coalfields\u2019 \u20b98,981 crore IPO remained undersubscribed after two days, while its grey-market premium plunged 92% to \u20b90.70, implying just 0.51% potential listing gains. Brokerages remain positive on its production scale, cash flows and dividends, b     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
