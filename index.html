Street's trading session presented a mixed scenario as the S&P 500 and Nasdaq climbed, contrasting with a modest dip in the Dow. Investor apprehensions regarding impending regulations for the AI sector, especially after recent Democratic electoral successes, led to increased market volatility. Meanwhile, key global markets witnessed declines, particularly in Europe and Asia, overshadowing advancements in certain tech stocks amid a generally bearish sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Nov 2026, 09:34 AM IST", "pub_date_relative": "3h ago"}, {"title": "Nasdaq rebounds but posts fourth straight weekly decline", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Nasdaq rebounds but posts fourth straight weekly decline Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Nasdaq rebounds but posts fourth straight weekly decline SECTIONS Nasdaq rebounds but posts fourth straight weekly decline Reuters Last Updated: Nov 07, 2026, 09:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Friday, technology stocks saw a significant rebound, boosting investor optimism about growth in artificial intelligence amidst recent market fluctuations. The semiconductor sector soared, primarily driven by impressive gains from Nvidia and Advanced Micro Devices. Although this recovery was strong, the Nasdaq recorded its fourth consecutive weekly fall, hinting at a mixed market outlook. Job indicators remain strong, influencing Federal Reserve interest rate hike expectations.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Nov 2026, 09:32 AM IST", "pub_date_relative": "3h ago"}, {"title": "CR7: 7 personal finance lessons from Portugal\u2019s iconic No. 7 as Cristiano Ronaldo retires from international football", "full_content": "Cristiano Ronaldo has brought an exemplary 23-year international career to an end, after recently releasing a video announcing his decision to walk away from international football. As he closes out his international career, he leaves behind a legacy that extends well beyond just football.\n\nPortugal\u2019s iconic number 7 announced his retirement from international football on Thursday, 5 November 2026, closing out a remarkable chapter that saw him become the top international goal scorer of all time and turn into one of the greatest players in the history of the game. He will, however, continue his stint in club football, playing for the Saudi Arabian side Al-Nassr.\n\nAs per official data from FIFA and UEFA, Cristiano Ronaldo retires from international football with 234 appearances and 146 goals for Portugal; both are exceptional and world records by a mile in men\u2019s international football. He scored his last international goal against Croatia in the World Cup knockout game that Portugal clinched 2-1. Argentina\u2019s icon Lionel Messi, who has scored 126 goals, is second to the Portuguese icon in the all-time standings.\n\nRonaldo also accomplished the Herculean task of becoming the first player to score in six different FIFA World Cup tournaments. His accomplishments include captaining Portugal to the UEFA Euro 2016 title and two UEFA Nations League titles in 2019 and 2025, respectively.\n\nKeeping these massive achievements and world-beating stats in mind, here are 7 personal finance lessons aspiring investors and finance enthusiasts can learn from Cristiano Ronaldo and try to apply to improve not only their financial planning and investments but even their overall lives.\n\nCristiano Ronaldo retires from international football as arguably the greatest goalscorer of all time. His longevity clearly reflects the significance of devotion, sacrifice, and consistency.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 09:13 AM IST", "pub_date_relative": "3h ago"}, {"title": "Secret Memo, an Alleged Romance and China: The Questions Surrounding Nvidia CEO Jensen Huang", "full_content": "The report follows an account in The New York Times that US intelligence had identified Jensen Huang as the target of a Chinese spying operation.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 09:08 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Rates Blow-Up Triggers Rush for Cash at Austrian Property Funds", "full_content": "(Bloomberg) -- The surge in global interest rates may be a tipping point for a handful of Austrian open-ended real estate funds that for years have defied one of Europe\u2019s most troubled property markets.\n\nThe two largest retail real estate funds in Austria, run by units of UniCredit SpA\u2019s Bank Austria and Erste Group Bank AG, limited redemptions last month after investor payout requests strained liquidity reserves. Both have pledged to accelerate asset sales.\n\nThe gatekeeping measures come remarkably late for funds with lax payout structures long banned in countries such as Germany, operating in a market that\u2019s faced major real estate headwinds for years.\n\nAustria is home to one of Europe\u2019s largest ongoing insolvencies: the 2023 meltdown of Rene Benko\u2019s \u20ac23 billion ($25.7 billion) property empire. Non-performing loan ratios for some types of Austrian commercial real estate have topped 14%.\n\n\u201cThe run on the real estate funds will add to valuation pressure in an already strained market,\u201d said Florian Beckermann, the head of Austria\u2019s IVA investor association. The funds have sold most of their good assets in recent years and it\u2019s questionable whether buyers will emerge for the rest, he said.\n\nReal estate funds across Europe have faced liquidity troubles, exacerbated most recently by the European Central Bank\u2019s rate increases. DWS Group, Deutsche Bank AG\u2019s asset management arm, capped redemptions at its Grundbesitz Europe fund last month.\n\nAt the heart of the recent developments is a liquidity mismatch between investors\u2019 right to withdraw money on a daily basis at net asset value, and the long-term nature of the underlying property investments that makes quickly raising cash difficult.\n\nSafeguards long called for by regulators and adopted by Austria in a 2021 law are set to come into force at the beginning of next year after a lengthy transition period.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 12:42 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Microsoft Data Centre Protest: Over 100 Activists Occupy Amsterdam Construction Site As Anti-AI Demonstrations Spread Across Europe", "full_content": "Activists occupied a Microsoft data centre construction site in Amsterdam, protesting AI infrastructure expansion. Demonstrations across Europe demand stricter environmental regulations and safeguards.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 12:41 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Muhurat trading 2026: Ganesh Dongre of Anand Rathi sees Sensex at 1,00,000 next Diwali? Shares 3 Samvat 2083 stock picks", "full_content": "Muhurat Trading 2026 | Sensex, Nifty 50 target in Samvat 2083: Following weakness in the US dollar, triggering profit-booking in the US bond market and cooling crude oil prices after the US Midterm Election Results 2026, the Indian stock market outperformed global markets. The Nifty 50 index finished at 25,030, logging a weekly gain of 8.60%, whereas the Bank Nifty index ended at 59,086, registering a weekly gain of over 8%. The BSE Sensex finished at 81,028, 6,569 points or 8.82% higher from the previous week's close.\n\nAs Dalal Street is ready for the special Muhurat Trading session 2026 on Sunday, 8 November 2026, from 2:20 PM to 3:30 PM, marking the beginning of Samvat 2083, market participants are expecting the Indian stock market's positive performance to repeat for the ninth straight session on Diwali 2026 date, i.e. 8 November 2026.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi, believes the Indian stock market bias has improved after the humiliating defeat of Donald Trump's Republican Party in the US Midterm Elections. The Anand Rathi expert said that the Democrats' sweeping victory has eased Middle East tensions, leading to a slump in crude oil prices. Dongre said that the US Midterm Election Results have put the US dollar under pressure, which triggered profit-booking in the US bond market.\n\nHighlighting the top 3 triggers, which are expected to dictate the movement of post-US Midterm Election Results 2026, Ganesh Dongre of Anand Rathi said, \u201cMovement in the US bond yields, anti-AI trade and inflation are expected to dominate the movement of global equities, including Dalal Street.\u201d\n\nThe Anand Rathi expert said that a correction in US bond yields would trigger movement of smart money from the US bond market to equities and other assets.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 12:28 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Buying gold or silver Lakshmi-Ganesha idols for Diwali puja 2026? BIS hallmark rules; key checks to make before paying", "full_content": "Gold and silver purchases are considered auspicious during Dhanteras and Diwali. While jewellery, coins, and utensils are popular choices, many households also buy Lakshmi-Ganesha idols made of precious metals for Diwali puja.\n\nBuyers can choose from 925 sterling silver or solid 22K gold idols, depending on their budget and preference. Silver idols are generally more popular and cost-effective than gold idols.\n\nBut are these idols also covered under BIS hallmarking rules, just like gold and silver jewellery? Here is what buyers should know about hallmarking rules and the key checks to make before paying the jeweller.\n\nAccording to BIS's latest hallmarking scheme brief released on 1 October, \u201cmandatory hallmarking of gold jewellery/artefacts was introduced on 23 June 2021 in 256 districts. Through successive amendments, the coverage has since expanded to 392 districts.\u201d\n\nThe mandatory gold hallmarking framework covers seven gold caratages (fineness in parts per thousand) under IS 1417: 9K (375), 14K (585), 18K (750), 20K (833), 22K (916), 23K (958) and 24KS (995). Certain categories are exempt, subject to applicable conditions. These include gold articles below two grams, specified Kundan, Polki and Jadau articles.\n\nSilver hallmarking, however, is voluntary. As per the revised IS 2112:2025 standard, silver articles hallmarked under the BIS scheme must carry a 6-digit HUID (Hallmark Unique Identification) from 1 September 2025. The eight permitted fineness grades are 800, 835, 900, 925, 958, 970, 990 and 999.\n\nThere are three important components to look for in hallmarked articles:\n\nYou can verify a hallmarked article using the free BIS Care app.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 12:10 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Delhi Pollution: Schools Go Hybrid Up To Class 5 As AQI Worsens Ahead Of Diwali", "full_content": "Authorities have asked schools to inform parents about the arrangement and officials will conduct inspections to check compliance with the order.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 12:08 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Diwali Fireworks! Nifty surges over 8% in Nov 2-6 week, best in 6 yrs after US Midterm Election results; RIL soars 13%", "full_content": "Pranati Deva Published 7 Nov 2026, 12:07 PM IST Prefer Livemint on Google Stock Markets This Week : The Diwali festival arrived early on Dalal Street as Indian equities extended their winning streak to seven consecutive sessions, supported by US midterm election results, strong foreign institutional investor (FII) inflows, easing crude oil prices and robust Q2FY27 corporate earnings.\n\nThe rally helped the BSE Sensex and NSE Nifty50 clock one of their sharpest weekly gains in recent years. A global sell-off in AI-linked stocks and softening US bond yields further lifted investor sentiment ahead of Diwali 2026.\n\nThe Nifty50 surged 8.58% during the week, gaining nearly 1,978 points to reclaim the 25,000 mark. This was its biggest weekly percentage gain in about six years, since January 2021, and its largest-ever weekly advance in absolute terms. The Sensex rallied nearly 9% to close above 81,000.\n\nThe rally added nearly \u20b9 28 lakh crore to investors' wealth, with the combined market capitalisation of BSE-listed companies rising from \u20b9 475.34 lakh crore to around \u20b9 503 lakh crore.\n\nAmong the top gainers, Shriram Finance led with a nearly 17% rise, followed by Bajaj Finance and M&M, which gained over 15% each. HDFC Bank jumped around 14%, while Reliance Industries (RIL) added over 13%.\n\nMeanwhile, on Friday, the Sensex surged 1,718 points, or 2.17%, to 81,028, while the Nifty gained 493.75 points, or 2.01%, to settle at 25,030. The rally came despite a sharp sell-off across global markets.\n\nAll eyes will now be on Diwali Muhurat trading on Sunday, November 8, 2026, marking the beginning of Samvat 2083. The special session will be held from 2:20 pm to 3:30 pm, with investors looking to make auspicious investments on Diwali.\n\nThe sharp recovery came after months of selling pressure through much of August, September and October, amid escalating tensions in West Asia and concerns over their impact on global energy prices.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 12:07 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold loan rules 2026: What RBI changed on loan eligibility, valuation, repayment, and auction of pledged gold jewellery", "full_content": "Are you looking to apply for a fresh gold-backed loan this Diwali? Have you planned how you will utilise the funds? If not, then before planning for any such applications, it is prudent to seek professional advice and plan your borrowing strategically.\n\nAs of today, securing a loan against gold jewellery has turned into a more regulated and deeply scrutinised affair. This has happened as the Reserve Bank of India (RBI) introduced a clearly defined, elaborate and uniform framework to bring transparency and standardise gold valuations. The overall aim is to boost borrower confidence and protect their rights.\n\nFurthermore, it is vital to keep in mind that the new rules that were notified initially on 6 June 2025 had to be implemented by the lending institutions no later than 1 April 2026. Having a clear understanding of the new rules on gold-backed loans and their long-term implications can go a long way to help aspiring borrowers make meaningful borrowing decisions.\n\nAs of today, i.e., 7 November 2026, the framework covers commercial banking institutions, small finance banks, regional rural banks, cooperative banks and non-banking financial companies (NBFCs) . Keeping these basics in mind, here are the key changes borrowers should understand.\n\nThe RBI has introduced a tiered loan-to-value (LTV) structure for consumption loans, replacing the earlier uniform 75% ceiling. This is expected to provide much-needed respite for regular borrowers.\n\nThis means small borrowers can potentially access a higher loan against the same gold collateral. However, lenders must assess repayment capacity for loans exceeding \u20b9 2.5 lakh.\n\nLenders must value gold based on its actual purity, using the lower of its average closing price over the preceding 30 days or the previous day's closing price. It is critical to note that only the real intrinsic value of the yellow metal will be counted.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 11:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mizoram Launches Gen-AI Mission to Train Over 5,500 School Students in 80 schools", "full_content": "Titled Lunglei Gen-AI Mission: Lunglei's Gen-Alpha, Empowered by AI, the programme will help students enhance their artificial intelligence knowledge", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 11:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wall Street grapples with $5.7 trillion rout as AI bets unwind", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Wall Street grapples with $5.7 trillion rout as AI bets unwind Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Wall Street grapples with $5.7 trillion rout as AI bets unwind SECTIONS Wall Street grapples with $5.7 trillion rout as AI bets unwind By Justina Lee & Lu Wang , Bloomberg Last Updated: Nov 07, 2026, 11:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Wall Street is undergoing notable shifts as worries about the AI investment frenzy and political developments arise. This sharp sell-off brings forth doubts about the viability of AI infrastructure investments, scrutinizing valuations and corporate expenditures. The Democratic majority in Congress poses regulatory challenges, amplifying economic tensions. Investors are leaning towards more conservative sectors, yearning for assurance that AI investments will deliver anticipated results amidst these turbulent times.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Nov 2026, 11:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hindalco shares jump 22% in a year: Should you buy or sell after Q2 results 2026? What brokerages say, price targets", "full_content": "Hindalco Industries shares are in focus after the company reported a strong set of results for the September quarter of FY27, with consolidated net profit rising nearly 59% year-on-year. The stock closed 1.88% higher at \u20b9 957.70 apiece on the BSE on Friday.\n\nThe stock has gained 7.25% over the past week and 11.30% in the last two weeks. It has risen 1.89% over the past month and 21.53% over the past year. However, Hindalco shares remain down 6.71% over three months and 8.47% over six months. The stock has gained 7.01% year-to-date.\n\nHindalco Industries reported a 58.8% year-on-year jump in consolidated net profit to \u20b9 7,533 crore in the September quarter of FY27, compared with \u20b9 4,741 crore in the corresponding quarter last year.\n\nConsolidated income rose to \u20b9 92,651 crore from \u20b9 66,771 crore in the year-ago period, the Aditya Birla Group company said in a regulatory filing.\n\nThe company's EBITDA for the quarter increased 42% year-on-year to \u20b9 13,757 crore, reflecting strong contributions across its business segments.\n\nIn a statement, Hindalco said the record performance was underpinned by the strength of its integrated business model, led by a solid primary upstream business and complemented by strong contributions from its downstream operations.\n\nThe company's copper business recorded its highest-ever quarterly EBITDA, while subsidiary Novelis sustained its improved performance, supported by the normalisation of operations at its Oswego facility.\n\nHindalco's India aluminium production costs are expected to remain elevated in the December quarter, with coal costs likely to keep input expenses under pressure.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 11:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Patakha stock picks! ICICI Bank, BEL, 6 other stocks with 62% to buy this Samvat 2083. See full list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Patakha stock picks! ICICI Bank, BEL, 6 other stocks with 62% to buy this Samvat 2083. See full list Written by Veer Sharma , ETMarkets.com | Nov 07, 2026, 11:19:13 AM IST 1 / 7 \u200bDiwali Delights As investors enter Samvat 2083, the landscape calls for selectivity rather than indiscriminate optimism. Global uncertainties, fluctuating capital flows and evolving market expectations continue to influence equity performance. In this environment, sustainable wealth creation is likely to depend less on broad-based market movements and more on identifying businesses capable of delivering consistent earnings growth. Here are 8 stocks PL Capital is bullish on.\n\nPL Capital has set a target price of Rs 490 for Bharat Electronics (BEL), implying an upside of 24% from current levels. The company has a strong order book of Rs 68,720 crore, equivalent to 2.3x its trailing 12-month sales, providing healthy execution visibility. Key programmes, including Electronic Fuses, LCA MK1A, LR-SAM, BMP-2 upgrades, Ashwini Radar and EW Suites for Mi-17, account for around Rs 17,600 crore. The Rs 20,000 crore NGC opportunity is expected to translate into staggered orders from GSL and GRSE, largely by the end of FY27. Orders worth Rs 30,000 crore for QRSAM are also expected shortly, with BEL well positioned to retain its role given its decade-long development experience.\n\nPL Capital has set a target price of Rs 6,579 for Britannia Industries, implying an upside of 37.5% from current levels. The brokerage maintains a high-conviction view on the company, supported by its leadership in the biscuits and bakery segments, sustained growth in signature brands and improving scalability and profitability across adjacencies. Its signature brands grew 3x faster than the rest of the portfolio in FY26.", "source": "Economic Times Markets", "pub_date_str": "07 Nov 2026, 11:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Muhurat Trading Strategy Diwali Day 2026: What to do, what to buy, what to avoid? Trading guide for Nov 8 - Key levels", "full_content": "Muhurat Trading 2026 : The Indian stock market will open for its annual Muhurat trading session on Sunday, November 8, marking the beginning of Samvat 2083. The special Diwali session is considered an auspicious occasion to start investing and review financial goals. However, investors should not let the festive sentiment drive impulsive decisions.\n\nWith limited liquidity during the session and benchmark indices nearing important resistance levels, analysts recommend a cautious, stock-specific approach. While long-term investors can use the occasion to review their portfolios and make selective investments, short-term traders should watch key technical levels, track global cues and avoid aggressive positions.\n\nAnalysts believe Muhurat trading offers investors an opportunity to review their asset allocation, assess whether their portfolios are aligned with their financial goals and rebalance where necessary. They favour a stock-specific approach to long-term investing, while advising caution during the short trading window.\n\nLiquidity is typically limited during the special session, making it inadvisable to place large orders or undertake aggressive buying and selling. New investors can consider token investments in fundamentally strong companies they are interested in holding for the long term. Investors should avoid buying stocks merely because it is an auspicious occasion and instead focus on valuations, business fundamentals and their investment objectives.\n\nMotilal Oswal Financial Services (MOSL) said Nifty valuations were attractive at 17.5 times forward earnings, 16% below the long-term average. However, it noted that small-cap stocks continued to trade at a 25% premium to their long-term average, warranting selectivity.\n\n\"We perceive FY27 to mark a return to double-digit earnings growth, with Nifty EPS expected to grow 16%/14% YoY in FY27/FY28 vs 5% in FY26.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 10:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Muhurat trading 2026: Top 3 Samvat 2083 stock picks by Sumeet Bagadia \u2014 Adani Ports, Sun Pharma, Kotak Bank; targets, SL", "full_content": "Asit Manohar Updated 7 Nov 2026, 10:37 AM IST Prefer Livemint on Google Muhurat trading 2026 | Samvat 2083 stock picks | Stocks to buy: The key benchmark indices of the Indian stock market recorded a sharp recovery last week, with the Nifty 50 index gaining 8.6% to close at 25,030.35 and Bank Nifty advancing to 59,086. The rally reflected a broader improvement in global risk sentiment, as hopes of a negotiated geopolitical settlement following the US midterm elections helped trigger a sharp correction in crude oil prices and encouraged a renewed flow of foreign capital into Indian equities. FIIs purchased a net \u20b9 45,960 crore during the week, while DIIs sold \u20b9 24,197 crore, shifting market leadership from domestic support to foreign-led accumulation.\n\nAfter the solid gains of last week, stock investors must be busy finalising their stock shopping lists during the special Muhurat Trading session on Sunday, 8 November 2026. Marking the beginning of Samvat 2083, the special Muhurat Trading 2026 session will run from 2:20 PM to 3:30 PM.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes that the Nifty 50 index closing above the crucial 25,000 signals a significant improvement in the short-term trend. The Choice Broking expert said that RSI jumped to 78.55, indicating strong bullish momentum but also an overbought market condition.\n\nSpeaking on the outlook of the Nifty 50 index at the beginning of Samvat 2083, Sumeet Bagadia said the 50-stock index has immediate support at 24,800\u201324,850, while resistance is seen around 25,130\u201325,200.\n\n\u201cCall OI is concentrated around 25,000\u201325,200 and Put OI around 24,800\u201325,000.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 10:36 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How Wall Street\u2019s all-in bet on AI blew up", "full_content": "US midterm elections sparked a hedge fund and retail investor exodus from a trade that had taken over equity markets", "source": "FT Markets", "pub_date_str": "07 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Diwali shagun ke shares! Angel One selects 8 stocks with up to 50% upside to Buy this Diwali. How many do you own?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Diwali shagun ke shares! Angel One selects 8 stocks with up to 50% upside to Buy this Diwali. How many do you own? Written by Veer Sharma , ETMarkets.com | Nov 07, 2026, 10:18:54 AM IST 1 / 8 Festive Picks As investors enter Samvat 2083, the landscape calls for selectivity rather than indiscriminate optimism. Global uncertainties, fluctuating capital flows and evolving market expectations continue to influence equity performance. In this environment, sustainable wealth creation is likely to depend less on broad-based market movements and more on identifying businesses capable of delivering consistent earnings growth. Here are 8 stocks Angel One is bullish on:\n\nAngel One has set the target price at Rs 1,800, an upside of 14.5% from current market levels. The private lender is India's second-largest private-sector bank, with a market capitalisation of about Rs 10 lakh crore and a pan-India retail, SME and corporate franchise.\n\nThe brokerage has pegged the target price at Rs 330 per share, an upside of 16% from current levels. Analysts are optimistic based on 6.1x FY29E EPS of Rs 54 (about 1.0x FY29E book value; the stock trades at 4.5x). Angel One sees a score for sustained earnings compounding as lending AUM grows 20% a year to Rs 28,600 crore by FY29E and direct-to-customer lending lifts NIM towards 10%.\n\nWith a target price of Rs 1,160, the brokerage forecasts an upside of 25%. Aarti Pharmalabs is India\u2019s largest manufacturer of xanthine derivatives (caffeine and allied products), with a 15\u201320% global market share. It has complete backward integration across its manufacturing value chain, with minimal reliance on Chinese imports.\n\nWith a target price of Rs 410, the brokerage predicts an upside of 50% from current levels.", "source": "Economic Times Markets", "pub_date_str": "07 Nov 2026, 10:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Gold ETF folios surge 164% in 3 years, outpacing equity mutual funds: Study warns against FOMO-driven gold investments", "full_content": "Gold ETFs are emerging as a major investment choice among Indian investors, with their folio count growing significantly faster than that of equity mutual funds over the past three years.\n\nThis raises questions about whether investors are increasingly chasing gold returns rather than following a disciplined asset allocation strategy.\n\nAccording to an analysis by OmniScience Capital, gold ETFs witnessed a 164% growth in folios between September 2023 and September 2026, compared with just 30% growth in large-cap mutual fund folios. Their assets under management (AUM) also surged to nearly half the AUM of large-cap funds.\n\nA folio is an investment account number assigned to an investor by a mutual fund house for a particular scheme. It indicates the number of investment accounts, rather than the number of unique investors, as one investor can hold multiple folios.\n\nOmniScience Capital's analysis shows that gold ETFs recorded a 2.6-fold increase in folios over three years, significantly outpacing the 1.3-fold growth in large-cap mutual fund folios.\n\nThe numbers suggest that gold ETFs have attracted significant investor interest. Their folio growth has also exceeded that of mid-cap and small-cap funds, which recorded increases of 124% and 107%, respectively.\n\nThe rise is also visible in the assets managed by gold ETFs. Their AUM increased from \u20b9 5,667 crore in September 2019 to \u20b9 1.89 lakh crore in September 2026. In comparison, the AUM of all equity mutual funds increased to \u20b9 38.51 lakh crore from \u20b9 7.02 lakh crore during the same period.\n\nThe total gold ETF AUM of \u20b9 1.9 lakh crore equals nearly half of the \u20b9 4 lakh crore AUM in large-cap funds. This gold allocation, which is 47% of the large-cap funds' AUM, appears overstretched, the report noted.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 10:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "India Should Scrap Equity Tax on Foreigners, Says Edelweiss Head", "full_content": "India should consider removing the capital gains tax imposed on foreigners to help revive the country\u2019s stock market, Edelweiss Financial Services Ltd. Chairman and Managing Director Rashesh Shah said, adding to a growing clamor for the exemption to boost inflows and support the local currency.\n\n\u201cWe need to showcase to the foreigners we want them,\u201d Shah said in an interview with Bloomberg Television\u2019s Menaka Doshi and Haslinda Amin in Mumbai on Friday. \u201cIf India wants foreign investors to come back, we want India to be a good permanent allocation for foreigners, we should do something and removing capital gains tax for foreigners might be an easier answer.\u201d\n\nShah joins dozens who are pushing the government to exempt foreign portfolio investors from paying long-term capital gains tax on listed equities. Finance Minister Nirmala Sitharaman said earlier this week that she will consider tax changes on stocks, but stopped short of confirming whether the government was looking at revisions to capital gains or transaction taxes.\n\nLong-term gains on listed equities held for more than a year are taxed at 12.5%, while short-term gains are levied 20%.\n\nForeign investors have been relentless sellers of Indian stocks, with net outflows exceeding $28 billion so far this year, according to data compiled by Bloomberg. But a sharp selloff in global artificial-intelligence stocks and a decline in oil prices have prompted some overseas funds to return to the market.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 10:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Muhurat Trading 2026 Diwali stocks to buy for upto 109% upside: BSE, Adani Power, HFCL, TechM - SAMCO's 10 shares | List", "full_content": "SANSERA AZAD TECHM ADANIPOWER Pranati Deva Published 7 Nov 2026, 09:59 AM IST Prefer Livemint on Google Muhurat Trading : Diwali is approaching, and with Muhurat Trading scheduled for tomorrow, investors are preparing to begin Samvat 2083 on an auspicious note.\n\nAfter a very volatile and tough Samvat 2082, the lesson of the year is simple: concentration hurts, diversification protects. That is the theme of this Muhurat, said brokerage firm Samco Wealth.\n\nIt has identified 10 Indian stocks to buy this Diwali, tomorrow, November 7, during Muhurat Trading across sectors, including power, capital-market infrastructure, information technology, aerospace and defence, telecom, automobiles and music, for investors looking to build their portfolios in the new Samvat.\n\nSamco has recommended buying Azad Engineering in the range of \u20b9 2,405\u20132,485, with a one-year target of \u20b9 5,108. The company's order book stood at around \u20b9 6,500 crore, with deliveries spread over five to six years. Management expects revenue to grow by more than 25% annually over the coming years. Demand for gas turbines to power data centres is another growth driver. The stock has corrected around 22% from its recent high and is testing its earlier breakout zone. The recommended stop loss is \u20b9 2,222.\n\nSamco has set a one-year target of \u20b9 318.85 for Adani Power , recommending buying in the \u20b9 186\u2013192 range. India's largest private-sector thermal power producer reported a 141.5% year-on-year rise in Q2 FY27 consolidated net profit to \u20b9 7,019 crore, while revenue increased 44.5% to \u20b9 19,439 crore. Power sales rose to 26.4 billion units, and plant load factor improved to 70.1%. The stock is consolidating around its 200-day moving average, with support around \u20b9 175\u2013180. The recommended stop loss is \u20b9 162.70.\n\nSamco has recommended HFCL for a one-year investment horizon, with a buying range of \u20b9 227\u2013235 and a target of \u20b9 381.10.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 09:59 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Muhurat Trading 2026 Stocks to buy on Diwali Day Nov 8: From Eternal to MCX - Chandan Taparia of MOFSL shares 4 picks", "full_content": "Dhanya Nagasundaram Published 7 Nov 2026, 09:47 AM IST Prefer Livemint on Google The Nifty 50 and Sensex extended their winning streak to a seventh consecutive session on Friday, defying a selloff in global markets as improving domestic cues fuelled a strong rally on Dalal Street. The Sensex surged over 1,700 points, while the Nifty reclaimed the crucial 25,000 mark, supported by sustained foreign fund inflows and a decline in crude oil prices.\n\nInvestor sentiment also drew support from healthy second-quarter corporate earnings and a strengthening rupee, adding to the festive cheer in the domestic market.\n\nThe 30-share BSE Sensex climbed 1,718.01 points, or 2.17%, to close at the day's high of 81,028.02.\n\nThe NSE Nifty 50 rose 493.75 points, or 2.01%, to settle at 25,030.35, also its highest level of the session. The index touched a nine-month high, with buying seen across sectors. It had last closed at a higher level of 25,088.40 on 2 February 2026.\n\nFor this year\u2019s Diwali Muhurat trading session, Chandan Taparia, Head of Derivatives and Technicals, Wealth Management, Motilal Oswal Financial Services, has recommended four stocks across diverse sectors.\n\nHis picks include Meesho , Eternal , Multi Commodity Exchange of India (MCX), and Adani Ports and Special Economic Zone .\n\nMeesho share price is in an overall uptrend and continues to respect its upward-sloping trendline on the monthly chart, indicating that support levels are shifting higher and the stock is forming higher highs. It is trading near its all-time high zone, with momentum indicators positively placed, highlighting sustained bullish momentum. Buying interest is emerging on every dip, reflecting strong demand at lower levels.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 09:47 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dollar jumps after strong US payrolls report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Dollar jumps after strong US payrolls report The Economic Times daily newspaper is available online now. Read Today's Paper Dollar jumps after strong US payrolls report SECTIONS Dollar jumps after strong US payrolls report Reuters Last Updated: Nov 07, 2026, 09:41:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US dollar index jumped significantly following the Labor Department's report indicating an increase of 165,000 jobs last month, which far exceeded economists' forecasts. As a result, the probability of a rate hike from the Federal Reserve climbed to nearly 80% for next month. Moreover, Federal Reserve officials voiced concerns about ongoing inflation, leading to declines for other currencies such as the euro and sterling against the dollar.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Nov on Lionel Messi, who has scored 126 goals, is second to the Portuguese icon in the all-time standings.\n\nRonaldo also accomplished the Herculean task of becoming the first player to score in six different FIFA World Cup tournaments. His accomplishments include captaining Portugal to the UEFA Euro 2016 title and two UEFA Nations League titles in 2019 and 2025, respectively.\n\nKeeping these massive achievements and world-beating stats in mind, here are 7 personal finance lessons aspiring investors and finance enthusiasts can learn from Cristiano Ronaldo and try to apply to improve not only their financial planning and investments but even their overall lives.\n\nCristiano Ronaldo retires from international football as arguably the greatest goalscorer of all time. His longevity clearly reflects the significance of devotion, sacrifice, and consistency.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 09:13 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "DA hike: Karnataka increases dearness allowance by 2.5%, and Arunachal Pradesh by 3% ahead of Diwali \u2014 Check details", "full_content": "DA hike news: The Karnataka and Arunachal Pradesh state governments have become the latest to increase dearness allowance for employees and pensioners after the Union Cabinet hiked DA by 3% for central government counterparts to 63% of basic pay.\n\nKarnataka on 5 November hiked DA and dearness relief ( DR ) for state government employees and pensioners drawing salaries under the 2024 Revised Pay Scales by 2.5%, from 15.75% to 18%, with effect from 1 July 2026, PTI reported.\n\n\u201cGovernment employees are the backbone of our administration. Their dedication, professionalism and commitment are instrumental in translating our policies and programmes into meaningful outcomes for the people of Karnataka ,\u201d Deputy Chief Minister G Parameshwara said in a post on social media platform X (formerly known as Twitter).\n\n\u201cEqually invaluable is the contribution of our retired employees , who have devoted decades of their lives to public service and the progress of our state,\u201d the statement added. It further said, \u201cAt a time when the cost of living continues to rise, it is our responsibility to safeguard the financial well-being and dignity of those who serve and have served our state.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 08:54 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "What Your Insurance Agent May Not Tell You About Switching To A Cheaper Policy", "full_content": "After five years, the insurer can no longer contest a policy or claim over an omission or incorrect answer in the application unless it establishes fraud.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 08:50 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Not all fund managers follow the crowd: Here's a list of stocks that are present in only one mutual fund scheme", "full_content": "Not every stock in a mutual fund portfolio is a popular pick among fund managers . While popular stocks such as HDFC Bank feature in the portfolios of over 700 mutual fund schemes, some companies find a place in just one scheme.\n\nThese relatively uncommon stock picks reflect the distinct investment strategies, market views and stock-selection approaches of individual fund managers.\n\nAccording to data shared by Value Research on X, 13 stocks feature in the portfolios of just one mutual fund scheme each. These include stocks such as Simplex Infrastructures , Ambika Cotton Mills , Tourism Finance Corporation of India and Brooks Laboratories .\n\nThe data highlights how fund managers sometimes take relatively uncommon stock bets, allocating a portion of their scheme's assets to equity options that may not be widely held across the mutual fund industry.\n\nThe table lists the 13 stocks, their respective mutual fund schemes, and the percentage of each scheme's net assets allocated to the stock.\n\nSource: Value Research; Data as of 30 September 2026. Only stocks with a portfolio weight of at least 1% have been considered.\n\nSimplex Infrastructures has the highest allocation among the listed stocks, accounting for 2.80% of Quant Infrastructure Fund's net assets. Tourism Finance Corporation of India follows with a 2.69% allocation in Union Active Momentum Fund. At the other end, Q-Line Biotech accounts for 1.08% of Abakkus Small Cap Fund's net assets.\n\nInterestingly, Taurus Flexi Cap Fund features two stocks on the list \u2013 Ambika Cotton Mills and Regaal Resources. Taurus Ethical Fund also has two such holdings: SRIT India and Univastu India.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 08:47 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jailer 2 Box Office Collection Day 23: Rajinikanth's Film's Earnings Fall 62% Amid Ramayana Buzz", "full_content": "The latest figures indicate that the film's box office momentum has slowed considerably following the arrival of Ramayana.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 08:36 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Elon Musk Staked His Empire on Texas.     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
