    const allData = {"general": [{"title": "A 'weird' IPO pull, a tainted reputation and the stalled breakout moment for AI wearables", "full_content": "Apple, Google and Meta are pushing new AI devices and assistants amid growing privacy concerns around wearables.", "source": "CNBC World Economy", "pub_date_str": "04 Oct 2026, 06:51 PM IST", "pub_date_relative": "just now"}, {"title": "JPMorgan\u2019s best stock ideas heading into October", "full_content": "JPMorgan has pointed to several investment ideas its analyst like for October. They include American Express, Thermo Fisher Scientific and Liberty Energy.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 06:47 PM IST", "pub_date_relative": "4m ago"}, {"title": "GST Council May Allow Input Tax Credit On Group Insurance, Vehicles Taken On Lease", "full_content": "The proposal, if approved, could allow employers to claim ITC on GST paid on group insurance premiums.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 06:37 PM IST", "pub_date_relative": "14m ago"}, {"title": "Spiking bond yields, midterms, earnings to test US stocks\u2019 typical fourth-quarter strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 06:30 PM IST", "pub_date_relative": "21m ago"}, {"title": "October can be a scary month for stocks. Here\u2019s what investors need to watch this year.", "full_content": "If stocks see another big swoon this year, investors already know why.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Oct 2026, 06:30 PM IST", "pub_date_relative": "22m ago"}, {"title": "Sports betting is increasingly the norm for Gen Z. Here\u2019s why some financial and mental health experts are worried", "full_content": "Wagering on sports outcomes has exploded in the 2020s , but recent surveys show just how widespread gambling has become for Generation Z .\n\nA survey of retail investors released in August by Betterment, an investment advisory platform, found that 66% of Gen Z investors participate in sports betting. The Bank of America Institute found in a September report that Gen Z made up almost 50% of all online betting activity in July , during the height of the 2026 FIFA World Cup , outnumbering millennials for the first time.\n\n\"It is more unusual for someone not to have, for example, a Kalshi account, DraftKings \u2026 than it is\" to have such an account, said Cynthia Grant, vice president of clinical at Birches Health, which provides online therapy for online gambling addiction recovery. \"It's part of the experience of watching sports now.\"\n\nSports betting surged after a 2018 U.S. Supreme Court allowing state-authorized sportsbooks, which have since spread to 30 states. The introduction of sports-related event contracts on prediction markets \u2014 which claim they are financial trades, not wagers \u2014 in early 2025 further expanded access to additional states without legalized sportsbooks, and to those under 21.\n\nNow, the proliferation of sports betting has many financial and mental health advisors on edge. The average user on both a sportsbook and prediction market loses money, and trying to claw back losses puts users in even deeper financial holes, experts warn. Unsurprisingly, those who lose the most are at the greatest risk of harmful mental health outcomes.\n\nThe Bank of America Institute survey found that Gen Z was twice as likely to see sports betting as a type of investment, versus 20% of respondents overall.", "source": "CNBC Finance", "pub_date_str": "04 Oct 2026, 06:27 PM IST", "pub_date_relative": "24m ago"}, {"title": "RBI May Hike Repo Rate By 25 Bps In October As Inflation Pressures Mount: Poll", "full_content": "The last repo rate hike was in February 2023, when the RBI raised the rate by 0.25% to 6.50%.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 06:27 PM IST", "pub_date_relative": "24m ago"}, {"title": "Yemen leader announces major military operations against Iran-backed Houthis", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 06:24 PM IST", "pub_date_relative": "27m ago"}, {"title": "OPEC+ agrees to keep November oil output targets steady", "full_content": "OPEC+ agreed to keep oil production targets steady for November at a meeting on Sunday, the producer group said, in line with expectations that further output policy adjustments are unlikely until next year.\n\nSeven core members of the group comprising the Organization of the Petroleum Exporting Countries and allies including Russia made the decision for November in a brief online meeting on Sunday. The core members are Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman.\n\nGulf OPEC+ producers have been pumping well below output targets in the face of continuing export disruptions from the U.S.-Israeli war on Iran , with exports fluctuating at 60% to 80% of normal levels in recent months.\n\n\"The OPEC+ group of seven kept their production ceilings unchanged, in line with market expectations. That said, despite rising flows through the Strait of Hormuz, their output levels remain well below quota,\" said UBS analyst Giovanni Staunovo.\n\nOil prices had dropped on Friday after European leaders agreed to US President Donald Trump's request to release diesel reserves. Even so, Brent crude LCOc1 remains above $100 a barrel, up from about $73 before the Iran war started in late February.\n\nThe Iran war has also delayed the group's output capacity review \u2014 crucial to determine members' 2027 output quotas \u2014 because it has thrown estimates of future production potential into uncertainty, industry sources told Reuters last week.\n\nOPEC+ has been raising output targets for much of 2026 after years of production cuts, but most of the increases stayed on paper because of the Middle East conflict.\n\nThe seven core OPEC+ members pumped 25 million barrels per day in August, up 630,000 bpd from July, yet still roughly 5 million bpd below prewar levels in February, OPEC data shows.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 06:24 PM IST", "pub_date_relative": "27m ago"}, {"title": "Trump taps Director of National Intelligence Jay Clayton as AI czar", "full_content": "Director of National Intelligence Jay Clayton was chosen as the Trump administration's new AI czar, leading its response to artificial intelligence amid growing concerns about the risks of this rapidly evolving technology.\n\nClayton will lead a new White House task force, which will have 120 days to research and report on AI's risks and opportunities, and offer recommendations on the federal government's responsibilities regarding the new technology.\n\nThe group will be called the \"Super Intelligence Force,\" or SI \u2014 the term President Donald Trump prefers over AI.\n\n\"The Super Intelligence Force will coordinate the Federal Government's engagement with Consumers, Public Interest Groups, Religious Organizations, Critical Infrastructure Providers, and Super Intelligence Companies,\" Trump said in a Truth Social post Sunday.\n\nIn addition to Clayton, the task force will include: Federal Trade Commission Chairman Andrew Ferguson; the Defense Department's Under Secretary of War for Research and Engineering and Chief Technology Officer, Emil Michael; and Scott Kupor, director of the Office of Personnel Management. The task force will report to Trump and his chief of staff, Susie Wiles, the president said.\n\nThe Wall Street Journal first reported on Clayton's new role Saturday.\n\nIn September, Trump said in a Truth Social post that he would create a new \"AI Force\" to help facilitate the industry and root out bad actors.\n\n\"We will not in any way hinder or stifle the Growth of this incredible Industry. Rather, we will cherish it, help it, and watch over it, as it grows!\" Trump said the post, which also announced plans to hire an AI czar.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 06:23 PM IST", "pub_date_relative": "28m ago"}, {"title": "Sigma Box Office Collection Day 2: Jason Sanjay's Action-Comedy Thriller Sees Weekend Drop After Opening Day", "full_content": "Sigma follows a young man caught in a dangerous situation that changes his life. The action-comedy thriller marks the directorial debut of Jason Sanjay and features a mix of action, drama and humour.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 06:20 PM IST", "pub_date_relative": "31m ago"}, {"title": "Saudi Arabia stocks higher at close of trade; Tadawul All Share up 1.09%", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 06:15 PM IST", "pub_date_relative": "37m ago"}, {"title": "OPEC+ holds output targets steady as Middle East conflict tightens supply", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 06:08 PM IST", "pub_date_relative": "43m ago"}, {"title": "Top stocks to watch tomorrow: HDFC Bank, Yes Bank, RVNL, Bajaj Finance shares in focus on Monday, 5 Oct | Full list", "full_content": "Top stocks to watch on Monday, 5 October, 2026 : Indian equity markets ended sharply lower for the eighth consecutive week, extending the ongoing corrective phase as persistent selling pressure and weak global cues continued to weigh on investor sentiment.\n\nThe negative trend was visible from the beginning of the week, with the Sensex falling 1.52% on Monday. The benchmark then recorded relatively smaller declines over the next two sessions before slipping another 0.79% on Thursday. Overall, the Sensex declined 1,670.84 points to end at 71,909.70, while the Nifty dropped more than 3% to close at 22,421.95.\n\nIndian stock market investors are likely to track several companies on Monday, 5 October, as a series of key announcements and developments\u2014including business updates, fundraising plans, new orders, project progress, regulatory actions and strategic moves\u2014could influence their shares.\n\nHDFC Bank, Yes Bank, Bajaj Finance, DLF, IDBI Bank are among the shares that will remain in focus on Monday.\n\nThe bank has appointed Anup Bagchi as its new Managing Director and CEO after receiving approval from the Reserve Bank of India for a three-year term. His appointment brings an external candidate to the helm of India\u2019s largest private sector bank, ending months of uncertainty surrounding its leadership transition.\n\nYes Bank Ltd. reported strong business growth as of September 30, 2026, according to an exchange filing on Sunday. The bank\u2019s loans and advances rose nearly 24% year-on-year to \u20b9 3.1 lakh crore from \u20b9 2.5 lakh crore.\n\nThe company\u2019s mined metal production increased 5% year-on-year to 271 kilotonnes. Saleable metal production also rose 7% YoY to 264 kilotonnes.\n\nBharat Coking Coal reported a 20.7% YoY rise in total raw coal production to 2.57 million tonnes (mt) in September, compared with 2.13 mt in the corresponding month last year.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 06:06 PM IST", "pub_date_relative": "45m ago"}, {"title": "More tankers struck in the Middle East as Iran reiterates conditions for reopening the Strait of Hormuz", "full_content": "At least two vessels were struck over the weekend in waters near Oman and Iran , the United Kingdom Maritime Trade Operations Centre reported, as Tehran reiterated its position on Sunday that the Strait of Hormuz would not reopen unless its conditions for ending the war with the U.S. are met.\n\nOn Saturday, the UKMTO, a British maritime security alert service, said it received a report of a crude oil tanker being hit by an unknown projectile four nautical miles east of Oman. It said another tanker was reported as being similarly struck Sunday in the Strait of Hormuz, causing damage to its engine room.\n\nAttacks on shipping in the strait, through which about a fifth of the world's oil supplies moved before the start of the U.S. and Israel-led war on Feb. 28, have been happening on a regular basis for weeks.\n\n\"The Strait of Hormuz will not open until Iran's seven conditions based on the Islamabad Memorandum are met, and Iran will not regulate its national security with tweets from American officials,\" Iranian state media agency Nour News quoted Parliament Speaker Mohammad Bagher Ghalibaf as saying Sunday.\n\nPresident Donald Trump and Iranian President Masoud Pezeshkian signed an interim deal in June, known as the Islamabad Memorandum of Understanding, that resulted in a brief hiatus in fighting.\n\nTehran's conditions for allowing ships to proceed freely through the Strait of Hormuz include a halt to U.S. \"acts of aggression,\" an end to the U.S. naval blockade of its ports and economic warfare, and the release of Iranian assets.\n\nA key demand of the U.S. has been that Iran dismantle its nuclear weapons program.\n\nMeanwhile, Saudi Arabia's energy infrastructure reportedly came under renewed attacks.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 06:05 PM IST", "pub_date_relative": "46m ago"}, {"title": "Uddhav, Raj Thackeray Protest Against CEC: State SIR Cancellation, Paper Ballots Top Demands", "full_content": "The march began from the Metro Cinema and traversed the short distance to the Brihanmumbai Municipal Corporation headquarters in south Mumbai.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 06:00 PM IST", "pub_date_relative": "51m ago"}, {"title": "Startups, OTT, real estate and more: Bollywood stars diversify their investments, build wealth beyond film salaries", "full_content": "Bollywood stars are building wealth beyond film salaries and brand endorsements. Many now invest in startups, property, sports teams and companies they own. These investments create income even when actors are away from film sets.\n\nStartups have become a popular choice. Stars increasingly want ownership in businesses rather than only promoting their products.\n\nKatrina Kaif launched Kay Beauty in partnership with Nykaa. Priyanka Chopra was an early investor in Bumble. Shraddha Kapoor has also backed brands and startups with hopes of future growth.\n\nAlia Bhatt built Ed-a-Mamma, a children\u2019s clothing brand. Reliance later acquired a major stake in the company. She has also invested in Nykaa and Phool.co. Hrithik Roshan created HRX, which grew into a recognised activewear brand.\n\nDeepika Padukone invests through her company, Ka Enterprises. Her investments include Epigamia, BluSmart and Supertails. She has also launched the skincare brand 82\u00b0E.\n\nProperty remains another favourite investment. Actors buy apartments, offices and land across different cities. These real estate assets can provide rent and an increase in value over time. In Mumbai, celebrities rent commercial properties to companies in Bandra, Andheri and Juhu.\n\nKriti Sanon and her family reportedly earned significant profits by selling apartments in Andheri West. The Bachchan family has invested beyond Mumbai, including land in Pune and Ayodhya. Some actors have also invested in projects by Sri Lotus Developers.\n\nSports ownership offers another route to building wealth. Shah Rukh Khan and Preity Zinta\u2019s involvement with the IPL is a major example. Celebrities increasingly view these teams as assets that can grow over many years.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 05:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Missed Messi In Kolkata? 22,000 Fans To Get Free India-Uruguay Tickets", "full_content": "Suvendu Adhikari says West Bengal government is considering greater support for Indian football, with Odisha's hockey model offering inspiration.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "IT Q2 Preview: Strong Deal Wins, AI Pressure, Slow Conversion - Key Things To Watch", "full_content": "IT companies face subdued client spending, longer deal cycles and rising AI disruption as they enter the September quarter.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Chick-fil-A wants to stay a family business even as it expands in the U.S. and abroad", "full_content": "With restaurants as far-flung as Singapore, Chick-fil-A has expanded far beyond its Southeastern stronghold in recent years, but CEO Andrew Cathy still wants the family-owned business to stay true to its roots.\n\nNearly five years ago, Cathy succeeded his father, Dan, as chief executive of the chicken chain his grandfather, S. Truett, founded. He took the reins as elevated inflation rocked the restaurant industry and a bevy of new chicken rivals looked to challenge Chick-fil-A's dominance. Since then, not much has changed \u2014 except for sluggish traffic across the industry as consumers have become more selective about their dining choices.\n\nThe challenging conditions have led to disappointing results for McDonald's , Popeyes, KFC and other restaurant competitors. While Chick-fil-A is not immune to these headaches, Cathy told CNBC that the chain's restaurants have not seen the same downturn.\n\n\"This has been a good year,\" the Atlanta-based Cathy said in downtown Manhattan before a planned activation to raise awareness for the chain's Shared Table hunger relief program.\n\n\"Our operators have done such a good job executing on the fundamentals and adding the hospitality to it,\" he added.\n\nAs a privately held business, Chick-fil-A does not report quarterly results. However, franchise disclosures reveal that the company's revenue in 2025 rose 14% to $10.3 billion, while its net income ticked up 1% to $1.05 billion. Its roughly 3,000 locations generated $23.92 billion in system sales last year, making it the third-largest U.S. restaurant by sales, trailing only McDonald's and Starbucks .\n\nChick-fil-A has no plans for an initial public offering or any other opportunities for outside investment. Cathy said the company plans to stick with its \"calculated\" and \"conservative\" growth.\n\nBut he may be underselling Chick-fil-A's recent expansion. It opened 179 restaurants last year and has launched in international markets like Canada, Singapore and the United Kingdom in recent years.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 05:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Verity Box Office Collection Day 2: Anne Hathaway-Dakota Johnson Starrer Sees Dip In India Earnings", "full_content": "Directed by Michael Showalter and starring Anne Hathaway and Dakota Johnson, Verity collected Rs 1.49 crore on Day 2, witnessing a 9.2% drop in India.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "DMart Q2 Business Update: Revenue From Operations Exceeds Rs 16,000 Crore; Established Up To 518 Stores", "full_content": "The parent company of the D-Mart brand saw its revenue from operations at Rs 14,050 crore in the September 2024 quarter.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Is your SBI, HDFC Bank, other bank branch closing or shifting? Will IFSC, cheque book details change? Know here", "full_content": "If your bank tells you that the branch where you hold an account is closing, shifting, or merging with another branch, there is generally no need to withdraw your money or open a fresh account.\n\nThe Reserve Bank of India (RBI) requires banks to inform customers in advance about such changes and make arrangements to ensure that banking services continue. If an account is transferred to another branch of the same bank, it can continue as an existing account rather than being treated as a new one, provided the required KYC formalities are already complete.\n\nA branch shutting down does not mean that your account or deposit will disappear. The bank will generally transfer the account to another branch or banking outlet and inform customers about the new arrangement.\n\nRBI rules require banks to give customers sufficient notice when a branch is being closed, shifted, or merged, allowing them to make arrangements and avoid disruption to their banking services.\n\nIf the account is moved to another branch of the same bank, customers should not ordinarily be asked to open a completely new account merely because of the transfer. RBI has clarified that KYC completed at one branch remains valid when an account is transferred within the same bank, subject to applicable requirements.\n\nCustomers should check the details of the branch to which their account has been moved. This includes the new branch address, IFSC, cheque book and passbook requirements, as well as any standing instructions linked to the account.\n\nIt is also important to check payments that depend on the account. Salary credits, pension payments, EMIs and investment-related transactions should be monitored to ensure they continue without any disruption.\n\nNo. The closure or shifting of an individual branch is different from the merger of one bank with another.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 05:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why brands like E.l.f., Wendy's and Gap are branching out into original music", "full_content": "Watch out Sony, a new music producer is in town. And this time it's the same brand that makes your favorite lip gloss.\n\nE.l.f. Beauty announced late last month the release of \"Mirror Mix,\" an original album featuring music from seven rising artists. The album comes as the makeup company ramps up its marketing spend, fueled in part by tariff refunds .\n\nE.l.f.'s pursuit of music is part of a growing wave of retailers blending shopping with entertainment.\n\nThe album features artists including a WNBA player and a Grammy award-winning singer-songwriter. It's available to stream on Spotify , Apple Music, Amazon and Roblox , according to a press release.\n\nIn addition to elevating the voices of independent artists, the new music is intended to help E.l.f. better connect with its customers, Chief Integrated Marketing Officer Patrick O'Keefe told CNBC in an interview.\n\n\"When you put community at the center of everything \u2026 programs and campaigns and building music, which evokes emotion \u2026 when you do that, it changes the conversation. And we want to be top of mind with our community,\" O'Keefe said.\n\n\"Mirror Mix\" is E.l.f.'s second album, following the company's 2024 release of \"Get Ready With Music, The Album.\" Its first venture into music, the song \"eyes.lips.face.,\" debuted in 2019.\n\n\"We were one of the first movers on TikTok, and we created an original song around eyes, lips, face, and it went viral. It propelled the brand into new dimensions,\" O'Keefe said. \"People didn't know what eyes, lips, face \u2014 what E.l.f. \u2014 stood for, and we created the song to embrace what it stands for and what it means for us as a brand.\"", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "How to get a car loan, from prequalification to approval", "full_content": "If you're in the market for a car and need a loan to finance your purchase , it's important to understand the steps involved before you apply. From checking your credit and comparing lenders, to choosing a car and reviewing your loan terms, here's what you need to know to get a car loan .\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nCarShield offers seven warranties, including bumper-to-bumper, powertrain, electrical systems, motorcycles and EVs. Contracts are administered by American Auto Shield.\n\nSix tiers of coverage with no mileage restrictions. Benefits include coverage for tire and windshield (from road hazards), key fob replacement, roadside assistance and 30-day cancellation policy. Advantage plan covers maintenance, which is typically excluded.\n\nBefore applying for a car loan, check your credit score and make sure it's in good standing. Lenders consider your credit score when assessing your creditworthiness and determining the interest rate and terms you may qualify for. Generally, a higher credit score can help you qualify for more favorable loan terms, while a lower score can make borrowing more expensive.\n\nIf you don't need a car loan right away and aren't happy with your credit score, consider spending some time improving it before applying. Continuing to make your debt payments on time is one of the best ways to build a positive payment history. Payment history is the largest factor in calculating a FICO\u00ae Score , accounting for 35% of the score.\n\nAccording to Experian , a VantageScore\u00ae of 661 or higher is considered prime and can generally improve your chances of qualifying for an auto loan with favorable terms. There isn't a universal minimum credit score for an auto loan , however, and some lenders and marketplaces like CarMax and myAutoloan work with borrowers who have lower scores.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fed minutes coming this week could give markets important clues about future rate hikes", "full_content": "Minutes from the September meeting may provide extra context, as the real fed-funds rate is now surprisingly low.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Week Ahead On D-Street: RBI Policy, Q2 Results, FPI Flows Among Key Triggers To Dictate Sensex, Nifty", "full_content": "RBI rate decision, Q2 earnings and foreign fund flows are set to keep investors on edge as global market risks persist.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "India Champions vs England Champions Live Streaming: When And Where To Watch WCL 2026 Match", "full_content": "India Champions vs England Champions WCL 2026: Check match date, time, venue, live streaming, telecast, head-to-head record and squads.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Buying An EV In Delhi? 382 Charging Sites Get Govt Nod As Network Expands", "full_content": "The latest move comes as Delhi prepares for a larger adoption of electric vehicles, with the government seeking to expand charging infrastructure ahead of the mandatory electric-registration targets for different vehicle segments.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "India\u2019s growth is making the world rewrite its forecast: MoSPI Secretary Saurabh Garg", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India\u2019s growth is making the world rewrite its forecast: MoSPI Secretary Saurabh Garg The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s growth is making the world rewrite its forecast: MoSPI Secretary Saurabh Garg SECTIONS India\u2019s growth is making the world rewrite its forecast: MoSPI Secretary Saurabh Garg ET Online Last Updated: Oct 04, 2026, 05:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's continued economic resilience, supported by strong corporate performance and sustained investment activity, is now being reflected in upward revisions to the country's growth estimates by various international agencies, Saurabh Garg, Secretary, Ministry of Statistics and Programme Implementation (MoSPI), said.\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 05:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Akali Dal Leader Shot Dead In Punjab; Family Accuses Brother Of Land-Dispute Attack", "full_content": "Former Akali Dal leader Navtej Singh was allegedly shot dead in Ludhiana by motorcycle-borne assailants. His family linked the killing to a long-running land dispute, while police investigate the motive and search for the attackers.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Everest Cumin Powder Recalled By FSSAI Over Excess Pesticide Residues \u2014 Check Batch Details", "full_content": "The FSSAI recalled the 'Everest' brand of cumin powder of excessive presence of pesticide residues up to levels where it was declared 'Unsafe'.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bosnia votes Sunday in election that could affect EU bid", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 05:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "LTM, Cyient, Zen, Birlasoft share price target, stop-loss - IT stocks to buy for over 32% returns ahead of Q2 results", "full_content": "IT stocks to buy : Brokerage firm HDFC Securities has listed Indian IT stocks to buy ahead of upcoming second quarter earnings season (Q2 results FY27), which included\n\nThe brokerage has retained a positive stance on most of the IT stocks, with Larsen & Toubro Technology Services (LTTS), Mphasis and Coforge among the picks offering meaningful upside from current levels.\n\nTCS has a new target price of \u20b9 2,470, implying 20% upside, with an \u2018ADD\u2019 rating, while Infosys has a target of \u20b9 1,250, offering 26% upside, and retains a \u2018BUY\u2019 rating, according to the firm.\n\nHCL Technologies has a revised target of \u20b9 1,370, implying 11% upside, with an \u2018ADD\u2019 rating, while Wipro has a \u20b9 185 target, indicating 17% upside. Tech Mahindra has a target of \u20b9 1,660, offering 9% upside, with an \u2018ADD\u2019 rating. Among the larger opportunities, L&T Technology Services has a revised target of \u20b9 5,270, implying 30% upside, and retains a 'BUY' rating.\n\nMphasis has a target of \u20b9 2,840, offering 32% upside, while Persistent Systems has a target of \u20b9 6,070, implying 15% upside; both has been assigned \u2018ADD\u2019 rating by the brokerage firm.\n\nAccording to HDFC Securities Indian IT sector is expected to report weak growth in the second quarter of FY27, even though this period is usually considered a strong quarter for the industry.\n\nGrowth for large IT companies is estimated to range from a 0.4% decline to 2% growth sequentially, while mid-sized IT firms could see growth of 0.6% to 6.3%, partly helped by acquisitions, the firm said.\n\nThe firm further said that new business deals remain weak, while clients are taking longer to make decisions and continue to cut discretionary technology spending because of economic uncertainty. IT companies are also facing pricing pressure as clients increasingly expect them to pass on the cost savings from higher productivity through AI.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 05:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Iran keeps Hormuz closed as talks with Washington remain deadlocked", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 05:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sensex, Nifty, Bank Nifty prediction: What will happen in the Indian stock market on Monday? 3 reasons tell the scene", "full_content": "Sensex, Nifty, Bank Nifty prediction: Amid continuous selling by the FIIs and weak micro and macro indicators, the key benchmark indices of the Indian stock market are trading lower for the last eight straight sessions. If the Nifty 50 index remains under the bears' grip next week as well, it would end lower for the ninth successive week, after a gap of 25 years. So, all eyes are focused on the Opening Bell when trading resumes on Monday.\n\nAccording to stock market experts, the Indian stock market is expected to see strong buying in IT stocks following Accenture's better-than-expected results. The market also estimates strong buying in HDFC Bank and Kotak Mahindra Bank shares after the appointment of new MD and CEO at these two private lenders.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 04:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "AIBE 22 Registration 2026: Check Last Date To Apply, Fees, Eligibility-Key Details", "full_content": "The AIBE XXII exam is scheduled for November 29, while admit cards are expected to be released on November 14.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 04:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "Max Verstappen Wins Rain-Hit Bahrain GP; Hamilton Recovers From P18 To Finish Third", "full_content": "Lewis Hamilton recovered from 18th after a tyre gamble to secure a dramatic podium finish.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 04:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "InvestingPro Fair Value models spotted 62% gain in TaskUs stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 04:39 PM IST", "pub_date_relative": "2h ago"}, {"title": "Why has e-Commerce accelerated and who is gaining?", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 04:37 PM IST", "pub_date_relative": "2h ago"}, {"title": "Iran Warns Strait of Hormuz Will Stay Shut Until US Meets Islamabad Pact Demands", "full_content": "Qalibaf stated that Iran's position was \"completely clear and firm\" and that the strait would remain closed until the seven conditions based on the Islamabad Memorandum of Understanding are met.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 04:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "From Himesh Reshammiya, Hariharan To Anu Malik: Check Bollywood Music Project 2026's Line-Up", "full_content": "Himesh Reshammiya, Shilpa Rao, Anu Malik, Hariharan, Euphoria Band and several other artists will perform at the 10th anniversary edition of Bollywood Music Project in Mumbai on October 24.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 04:33 PM IST", "pub_date_relative": "2h ago"}, {"title": "InvestingPro Fair Value flagged HawkEye 360 overvaluation before 56% drop", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 04:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Tata Comms, Siemens, Aadhar Housing, Styrenix, Sudarshan \u2014 Top 5 stocks to buy on Monday | Target, SL by Sumeet Bagadia", "full_content": "Breakout stocks to buy | Sumeet Bagadia's stock recommendations today: The key benchmark indices of the Indian stock market continued to bear the brunt of sharp foreign fund outflows and rising US bond yields amid the raging conflict in the Middle East. Investors are also perturbed by elevated crude oil prices and the resultant decline in the rupee against the dollar, leading to a broad market sell-off in domestic equities, although IT shares bucked the downward trend after the recent correction.\n\nThe Nifty 50 index finished at 22,421, logging a weekly loss for the eighth straight session, whereas the BSE Sensex fell nearly 2000 points. The Bank Nifty index finished at 54,450. All three key benchmark indices witnessed strong selling throughout the truncated week.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes the Indian stock market bias has further weakened as the Nifty 50 index approaches its near-term support at 22,200. Going down memory lane, Sumeet Bagadia said that, in 2008, the Nifty 50 declined for seven consecutive weeks before witnessing a five-week positive move.\n\nSpeaking on the outlook for the Nifty 50 index, Sumeet Bagadia said, \u201cThe short-term structure continues to show weakness, with sustained selling pressure over the last eight weeks keeping the broader market under pressure. The index is currently holding around the 22,400 zone, but a sustained move above 22,600 would be important for a stronger recovery.\u201d\n\nBagadia said that PCR at 0.99 indicates a relatively balanced options setup, while the highest Call OI concentration is seen around 22,400\u201322,500 and the highest Put OI concentration around 22,400\u201322,300, making this zone important for the near-term price action.\n\nThe Choice Broking expert said that if the 50-stock index closes above 22,600 for two consecutive sessions, a stronger pullback could be expected. Historically, in 2008, Nifty declined for seven consecutive weeks before witnessing a five-week positive move.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 04:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "What can revive the battered government bond market?", "full_content": "Market Questions is the FT\u2019s guide to the week ahead", "source": "FT Markets", "pub_date_str": "04 Oct 2026, 04:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "The \u201990s Are Back in Style. Levi\u2019s Is Cashing In. - WSJ", "full_content": "The \u201990s Are Back in Style. Levi\u2019s Is Cashing In. WSJ", "source": "Google News Business", "pub_date_str": "04 Oct 2026, 04:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "UPI MDR Charges: Will small-value transactions be impacted? What's Person-to-Merchant (P2M) fees? Details inside", "full_content": "The Unified Payments Interface ( UPI ) is set to see a change in the way certain merchant transactions are charged from 15 October 2026.\n\nAn MDR (Merchant Discount Rate) of 0.4% will apply to eligible P2M UPI payments above \u20b9 2,000. However, this is a charge on the merchant side and not a fee that customers will have to pay for making a UPI payment.\n\nAccording to the FAQs issued by the National Payments Corporation of India ( NPCI ) on 15 September 2026, the revised framework has different provisions for regular commercial merchants, small vendors, and certain sectors. Here's what you need to know.\n\nNo. UPI P2M transactions of up to \u20b9 2,000 will continue to remain outside the MDR framework.\n\nAccording to the Ministry of Finance, \u201capproximately 96% of merchant transactions will remain unaffected, as they are either below the \u20b9 2,000 threshold or covered by the zero-MDR framework for small merchants.\u201d\n\nFor P2M transactions above \u20b9 2,000, an MDR of 0.4% will apply. The charge is borne on the merchant side rather than being collected from the customer making the payment.\n\nThere is also a ceiling for larger transactions. For a UPI payment of \u20b9 75,000 or more, the MDR will be limited to \u20b9 300 per transaction.\n\nFor example, 0.4% of a \u20b9 1 lakh payment would come to \u20b9 400. However, because of the cap, the applicable MDR would be \u20b9 300.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 04:27 PM IST", "pub_date_relative": "2h ago"}, {"title": "Digger Box Office Collection Day 2: Tom Cruise Starrer Witnesses Drop In Earnings In India", "full_content": "Digger earned Rs 43.48 lakh on Day 2, witnessing a 22.4% drop in collection and taking its total India gross to Rs 1.25 crore.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 04:19 PM IST", "pub_date_relative": "2h ago"}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide stock market action on Monday BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide stock market action on Monday SECTIONS Ahead of Market: 10 things that will decide stock market action on Monday By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 04, 2026, 04:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sensex and Nifty extended losses for a fourth session as heavy FII selling, surging bond yields and elevated crude prices rattled investors. The selloff erased Rs 5 lakh crore in market value, while analysts advised long-term investors to accumulate gradually.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 04:17 PM IST", "pub_date_relative": "2h ago"}, {"title": "TCS, Tech Mahindra, Coforge, Mphasis: IT stocks picks and investment ideas after Accenture results ahead of Q2 earnings", "full_content": "IT stock picks : Brokerage firm Choice Broking has identified Indian IT stocks as potential investment picks for traders following Accenture\u2019s fourth-quarter results and ahead of the upcoming second-quarter earnings season.\n\nIn a recent note, the brokerage firm preferred Tata Consultancy Services (TCS) and Tech Mahindra among Tier-1 IT stocks, meanwhile, recommended Coforge and Mphasis as top investment ideas among mid-cap stocks.\n\n\u201cWe, therefore, forecast FY27 to remain another subdued growth year for Indian IT, with AIled productivity pass-throughs, pricing pressure and continued softness in discretionary spending projected to constrain reported growth. Within Tier1, we prefer TCS, TECHM and, among mid-caps, we have COFORGE and MPHASIS as our preferred investment ideas,\u201d the brokerage firm said.\n\nTCS share price have gained 0.44% over the past five trading sessions, however, the stock remained under pressure over longer periods, declining 9.90% in one month and 16% over the past six months.\n\nTCS shares have fallen 35.68% year-to-date and 30.53% over the past year, reflecting sustained weakness in the stock. The decline extends to the longer term, with shares losing 47.25% over five years. Despite the recent downturn, TCS has delivered a cumulative return of 1,625% since its listing, highlighting its long-term wealth creation history.\n\nTech Mahindra shares have delivered a mixed performance across different time frames. The stock gained 0.90% in Thursday\u2019s session, while it has declined 3.69% over the past month.\n\nOver the last six months, however, the stock has gained 6.11%, indicating some recovery over the medium term. On a year-to-date basis, Tech Mahindra remains down 4.34%, reflecting the pressure seen in the stock during the year.\n\nCoforge share price has delivered a mixed performance in the near term, gaining 2.35% over the past week but declining 7.11% over the last month.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 04:07 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "A 'weird' IPO pull, a tainted reputation and the stalled breakout moment for AI wearables", "full_content": "Apple, Google and Meta are pushing new AI devices and assistants amid growing privacy concerns around wearables.", "source": "CNBC World Economy", "pub_date_str": "04 Oct 2026, 06:51 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Spiking bond yields, midterms, earnings to test US stocks\u2019 typical fourth-quarter strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 06:30 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI May Hike Repo Rate By 25 Bps In October As Inflation Pressures Mount: Poll", "full_content": "The last repo rate hike was in February 2023, when the RBI raised the rate by 0.25% to 6.50%.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 06:27 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "OPEC+ agrees to keep November oil output targets steady", "full_content": "OPEC+ agreed to keep oil production targets steady for November at a meeting on Sunday, the producer group said, in line with expectations that further output policy adjustments are unlikely until next year.\n\nSeven core members of the group comprising the Organization of the Petroleum Exporting Countries and allies including Russia made the decision for November in a brief online meeting on Sunday. The core members are Saudi Arabia, Russia, Iraq, Kuwait, Algeria, Kazakhstan and Oman.\n\nGulf OPEC+ producers have been pumping well below output targets in the face of continuing export disruptions from the U.S.-Israeli war on Iran , with exports fluctuating at 60% to 80% of normal levels in recent months.\n\n\"The OPEC+ group of seven kept their production ceilings unchanged, in line with market expectations. That said, despite rising flows through the Strait of Hormuz, their output levels remain well below quota,\" said UBS analyst Giovanni Staunovo.\n\nOil prices had dropped on Friday after European leaders agreed to US President Donald Trump's request to release diesel reserves. Even so, Brent crude LCOc1 remains above $100 a barrel, up from about $73 before the Iran war started in late February.\n\nThe Iran war has also delayed the group's output capacity review \u2014 crucial to determine members' 2027 output quotas \u2014 because it has thrown estimates of future production potential into uncertainty, industry sources told Reuters last week.\n\nOPEC+ has been raising output targets for much of 2026 after years of production cuts, but most of the increases stayed on paper because of the Middle East conflict.\n\nThe seven core OPEC+ members pumped 25 million barrels per day in August, up 630,000 bpd from July, yet still roughly 5 million bpd below prewar levels in February, OPEC data shows.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 06:24 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump taps Director of National Intelligence Jay Clayton as AI czar", "full_content": "Director of National Intelligence Jay Clayton was chosen as the Trump administration's new AI czar, leading its response to artificial intelligence amid growing concerns about the risks of this rapidly evolving technology.\n\nClayton will lead a new White House task force, which will have 120 days to research and report on AI's risks and opportunities, and offer recommendations on the federal government's responsibilities regarding the new technology.\n\nThe group will be called the \"Super Intelligence Force,\" or SI \u2014 the term President Donald Trump prefers over AI.\n\n\"The Super Intelligence Force will coordinate the Federal Government's engagement with Consumers, Public Interest Groups, Religious Organizations, Critical Infrastructure Providers, and Super Intelligence Companies,\" Trump said in a Truth Social post Sunday.\n\nIn addition to Clayton, the task force will include: Federal Trade Commission Chairman Andrew Ferguson; the Defense Department's Under Secretary of War for Research and Engineering and Chief Technology Officer, Emil Michael; and Scott Kupor, director of the Office of Personnel Management. The task force will report to Trump and his chief of staff, Susie Wiles, the president said.\n\nThe Wall Street Journal first reported on Clayton's new role Saturday.\n\nIn September, Trump said in a Truth Social post that he would create a new \"AI Force\" to help facilitate the industry and root out bad actors.\n\n\"We will not in any way hinder or stifle the Growth of this incredible Industry. Rather, we will cherish it, help it, and watch over it, as it grows!\" Trump said the post, which also announced plans to hire an AI czar.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 06:23 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Top stocks to watch tomorrow: HDFC Bank, Yes Bank, RVNL, Bajaj Finance shares in focus on Monday, 5 Oct | Full list", "full_content": "Top stocks to watch on Monday, 5 October, 2026 : Indian equity markets ended sharply lower for the eighth consecutive week, extending the ongoing corrective phase as persistent selling pressure and weak global cues continued to weigh on investor sentiment.\n\nThe negative trend was visible from the beginning of the week, with the Sensex falling 1.52% on Monday. The benchmark then recorded relatively smaller declines over the next two sessions before slipping another 0.79% on Thursday. Overall, the Sensex declined 1,670.84 points to end at 71,909.70, while the Nifty dropped more than 3% to close at 22,421.95.\n\nIndian stock market investors are likely to track several companies on Monday, 5 October, as a series of key announcements and developments\u2014including business updates, fundraising plans, new orders, project progress, regulatory actions and strategic moves\u2014could influence their shares.\n\nHDFC Bank, Yes Bank, Bajaj Finance, DLF, IDBI Bank are among the shares that will remain in focus on Monday.\n\nThe bank has appointed Anup Bagchi as its new Managing Director and CEO after receiving approval from the Reserve Bank of India for a three-year term. His appointment brings an external candidate to the helm of India\u2019s largest private sector bank, ending months of uncertainty surrounding its leadership transition.\n\nYes Bank Ltd. reported strong business growth as of September 30, 2026, according to an exchange filing on Sunday. The bank\u2019s loans and advances rose nearly 24% year-on-year to \u20b9 3.1 lakh crore from \u20b9 2.5 lakh crore.\n\nThe company\u2019s mined metal production increased 5% year-on-year to 271 kilotonnes. Saleable metal production also rose 7% YoY to 264 kilotonnes.\n\nBharat Coking Coal reported a 20.7% YoY rise in total raw coal production to 2.57 million tonnes (mt) in September, compared with 2.13 mt in the corresponding month last year.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 06:06 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "More tankers struck in the Middle East as Iran reiterates conditions for reopening the Strait of Hormuz", "full_content": "At least two vessels were struck over the weekend in waters near Oman and Iran , the United Kingdom Maritime Trade Operations Centre reported, as Tehran reiterated its position on Sunday that the Strait of Hormuz would not reopen unless its conditions for ending the war with the U.S. are met.\n\nOn Saturday, the UKMTO, a British maritime security alert service, said it received a report of a crude oil tanker being hit by an unknown projectile four nautical miles east of Oman. It said another tanker was reported as being similarly struck Sunday in the Strait of Hormuz, causing damage to its engine room.\n\nAttacks on shipping in the strait, through which about a fifth of the world's oil supplies moved before the start of the U.S. and Israel-led war on Feb. 28, have been happening on a regular basis for weeks.\n\n\"The Strait of Hormuz will not open until Iran's seven conditions based on the Islamabad Memorandum are met, and Iran will not regulate its national security with tweets from American officials,\" Iranian state media agency Nour News quoted Parliament Speaker Mohammad Bagher Ghalibaf as saying Sunday.\n\nPresident Donald Trump and Iranian President Masoud Pezeshkian signed an interim deal in June, known as the Islamabad Memorandum of Understanding, that resulted in a brief hiatus in fighting.\n\nTehran's conditions for allowing ships to proceed freely through the Strait of Hormuz include a halt to U.S. \"acts of aggression,\" an end to the U.S. naval blockade of its ports and economic warfare, and the release of Iranian assets.\n\nA key demand of the U.S. has been that Iran dismantle its nuclear weapons program.\n\nMeanwhile, Saudi Arabia's energy infrastructure reportedly came under renewed attacks.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 06:05 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Chick-fil-A wants to stay a family business even as it expands in the U.S. and abroad", "full_content": "With restaurants as far-flung as Singapore, Chick-fil-A has expanded far beyond its Southeastern stronghold in recent years, but CEO Andrew Cathy still wants the family-owned business to stay true to its roots.\n\nNearly five years ago, Cathy succeeded his father, Dan, as chief executive of the chicken chain his grandfather, S. Truett, founded. He took the reins as elevated inflation rocked the restaurant industry and a bevy of new chicken rivals looked to challenge Chick-fil-A's dominance. Since then, not much has changed \u2014 except for sluggish traffic across the industry as consumers have become more selective about their dining choices.\n\nThe challenging conditions have led to disappointing results for McDonald's , Popeyes, KFC and other restaurant competitors. While Chick-fil-A is not immune to these headaches, Cathy told CNBC that the chain's restaurants have not seen the same downturn.\n\n\"This has been a good year,\" the Atlanta-based Cathy said in downtown Manhattan before a planned activation to raise awareness for the chain's Shared Table hunger relief program.\n\n\"Our operators have done such a good job executing on the fundamentals and adding the hospitality to it,\" he added.\n\nAs a privately held business, Chick-fil-A does not report quarterly results. However, franchise disclosures reveal that the company's revenue in 2025 rose 14% to $10.3 billion, while its net income ticked up 1% to $1.05 billion. Its roughly 3,000 locations generated $23.92 billion in system sales last year, making it the third-largest U.S. restaurant by sales, trailing only McDonald's and Starbucks .\n\nChick-fil-A has no plans for an initial public offering or any other opportunities for outside investment. Cathy said the company plans to stick with its \"calculated\" and \"conservative\" growth.\n\nBut he may be underselling Chick-fil-A's recent expansion. It opened 179 restaurants last year and has launched in international markets like Canada, Singapore and the United Kingdom in recent years.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 05:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Verity Box Office Collection Day 2: Anne Hathaway-Dakota Johnson Starrer Sees Dip In India Earnings", "full_content": "Directed by Michael Showalter and starring Anne Hathaway and Dakota Johnson, Verity collected Rs 1.49 crore on Day 2, witnessing a 9.2% drop in India.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "DMart Q2 Business Update: Revenue From Operations Exceeds Rs 16,000 Crore; Established Up To 518 Stores", "full_content": "The parent company of the D-Mart brand saw its revenue from operations at Rs 14,050 crore in the September 2024 quarter.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Is your SBI, HDFC Bank, other bank branch closing or shifting? Will IFSC, cheque book details change? Know here", "full_content": "If your bank tells you that the branch where you hold an account is closing, shifting, or merging with another branch, there is generally no need to withdraw your money or open a fresh account.\n\nThe Reserve Bank of India (RBI) requires banks to inform customers in advance about such changes and make arrangements to ensure that banking services continue. If an account is transferred to another branch of the same bank, it can continue as an existing account rather than being treated as a new one, provided the required KYC formalities are already complete.\n\nA branch shutting down does not mean that your account or deposit will disappear. The bank will generally transfer the account to another branch or banking outlet and inform customers about the new arrangement.\n\nRBI rules require banks to give customers sufficient notice when a branch is being closed, shifted, or merged, allowing them to make arrangements and avoid disruption to their banking services.\n\nIf the account is moved to another branch of the same bank, customers should not ordinarily be asked to open a completely new account merely because of the transfer. RBI has clarified that KYC completed at one branch remains valid when an account is transferred within the same bank, subject to applicable requirements.\n\nCustomers should check the details of the branch to which their account has been moved. This includes the new branch address, IFSC, cheque book and passbook requirements, as well as any standing instructions linked to the account.\n\nIt is also important to check payments that depend on the account. Salary credits, pension payments, EMIs and investment-related transactions should be monitored to ensure they continue without any disruption.\n\nNo. The closure or shifting of an individual branch is different from the merger of one bank with another.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 05:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why brands like E.l.f., Wendy's and Gap are branching out into original music", "full_content": "Watch out Sony, a new music producer is in town. And this time it's the same brand that makes your favorite lip gloss.\n\nE.l.f. Beauty announced late last month the release of \"Mirror Mix,\" an original album featuring music from seven rising artists. The album comes as the makeup company ramps up its marketing spend, fueled in part by tariff refunds .\n\nE.l.f.'s pursuit of music is part of a growing wave of retailers blending shopping with entertainment.\n\nThe album features artists including a WNBA player and a Grammy award-winning singer-songwriter. It's available to stream on Spotify , Apple Music, Amazon and Roblox , according to a press release.\n\nIn addition to elevating the voices of independent artists, the new music is intended to help E.l.f. better connect with its customers, Chief Integrated Marketing Officer Patrick O'Keefe told CNBC in an interview.\n\n\"When you put community at the center of everything \u2026 programs and campaigns and building music, which evokes emotion \u2026 when you do that, it changes the conversation. And we want to be top of mind with our community,\" O'Keefe said.\n\n\"Mirror Mix\" is E.l.f.'s second album, following the company's 2024 release of \"Get Ready With Music, The Album.\" Its first venture into music, the song \"eyes.lips.face.,\" debuted in 2019.\n\n\"We were one of the first movers on TikTok, and we created an original song around eyes, lips, face, and it went viral. It propelled the brand into new dimensions,\" O'Keefe said. \"People didn't know what eyes, lips, face \u2014 what E.l.f. \u2014 stood for, and we created the song to embrace what it stands for and what it means for us as a brand.\"", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How to get a car loan, from prequalification to approval", "full_content": "If you're in the market for a car and need a loan to finance your purchase , it's important to understand the steps involved before you apply. From checking your credit and comparing lenders, to choosing a car and reviewing your loan terms, here's what you need to know to get a car loan .\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nCarShield offers seven warranties, including bumper-to-bumper, powertrain, electrical systems, motorcycles and EVs. Contracts are administered by American Auto Shield.\n\nSix tiers of coverage with no mileage restrictions. Benefits include coverage for tire and windshield (from road hazards), key fob replacement, roadside assistance and 30-day cancellation policy. Advantage plan covers maintenance, which is typically excluded.\n\nBefore applying for a car loan, check your credit score and make sure it's in good standing. Lenders consider your credit score when assessing your creditworthiness and determining the interest rate and terms you may qualify for. Generally, a higher credit score can help you qualify for more favorable loan terms, while a lower score can make borrowing more expensive.\n\nIf you don't need a car loan right away and aren't happy with your credit score, consider spending some time improving it before applying. Continuing to make your debt payments on time is one of the best ways to build a positive payment history. Payment history is the largest factor in calculating a FICO\u00ae Score , accounting for 35% of the score.\n\nAccording to Experian , a VantageScore\u00ae of 661 or higher is considered prime and can generally improve your chances of qualifying for an auto loan with favorable terms. There isn't a universal minimum credit score for an auto loan , however, and some lenders and marketplaces like CarMax and myAutoloan work with borrowers who have lower scores.", "source": "CNBC Top News", "pub_date_str": "04 Oct 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Week Ahead On D-Street: RBI Policy, Q2 Results, FPI Flows Among Key Triggers To Dictate Sensex, Nifty", "full_content": "RBI rate decision, Q2 earnings and foreign fund flows are set to keep investors on edge as global market risks persist.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Buying An EV In Delhi? 382 Charging Sites Get Govt Nod As Network Expands", "full_content": "The latest move comes as Delhi prepares for a larger adoption of electric vehicles, with the government seeking to expand charging infrastructure ahead of the mandatory electric-registration targets for different vehicle segments.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 05:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "India\u2019s growth is making the world rewrite its forecast: MoSPI Secretary Saurabh Garg", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India\u2019s growth is making the world rewrite its forecast: MoSPI Secretary Saurabh Garg The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s growth is making the world rewrite its forecast: MoSPI Secretary Saurabh Garg SECTIONS India\u2019s growth is making the world rewrite its forecast: MoSPI Secretary Saurabh Garg ET Online Last Updated: Oct 04, 2026, 05:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's continued economic resilience, supported by strong corporate performance and sustained investment activity, is now being reflected in upward revisions to the country's growth estimates by various international agencies, Saurabh Garg, Secretary, Ministry of Statistics and Programme Implementation (MoSPI), said.\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nA for apple, Y for yak and, for the first time, a price next to it. Will this change the non-agri part of the rural economy?\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 05:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "LTM, Cyient, Zen, Birlasoft share price target, stop-loss - IT stocks to buy for over 32% returns ahead of Q2 results", "full_content": "IT stocks to buy : Brokerage firm HDFC Securities has listed Indian IT stocks to buy ahead of upcoming second quarter earnings season (Q2 results FY27), which included\n\nThe brokerage has retained a positive stance on most of the IT stocks, with Larsen & Toubro Technology Services (LTTS), Mphasis and Coforge among the picks offering meaningful upside from current levels.\n\nTCS has a new target price of \u20b9 2,470, implying 20% upside, with an \u2018ADD\u2019 rating, while Infosys has a target of \u20b9 1,250, offering 26% upside, and retains a \u2018BUY\u2019 rating, according to the firm.\n\nHCL Technologies has a revised target of \u20b9 1,370, implying 11% upside, with an \u2018ADD\u2019 rating, while Wipro has a \u20b9 185 target, indicating 17% upside. Tech Mahindra has a target of \u20b9 1,660, offering 9% upside, with an \u2018ADD\u2019 rating. Among the larger opportunities, L&T Technology Services has a revised target of \u20b9 5,270, implying 30% upside, and retains a 'BUY' rating.\n\nMphasis has a target of \u20b9 2,840, offering 32% upside, while Persistent Systems has a target of \u20b9 6,070, implying 15% upside; both has been assigned \u2018ADD\u2019 rating by the brokerage firm.\n\nAccording to HDFC Securities Indian IT sector is expected to report weak growth in the second quarter of FY27, even though this period is usually considered a strong quarter for the industry.\n\nGrowth for large IT companies is estimated to range from a 0.4% decline to 2% growth sequentially, while mid-sized IT firms could see growth of 0.6% to 6.3%, partly helped by acquisitions, the firm said.\n\nThe firm further said that new business deals remain weak, while clients are taking longer to make decisions and continue to cut discretionary technology spending because of economic uncertainty. IT companies are also facing pricing pressure as clients increasingly expect them to pass on the cost savings from higher productivity through AI.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 05:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sensex, Nifty, Bank Nifty prediction: What will happen in the Indian stock market on Monday? 3 reasons tell the scene", "full_content": "Sensex, Nifty, Bank Nifty prediction: Amid continuous selling by the FIIs and weak micro and macro indicators, the key benchmark indices of the Indian stock market are trading lower for the last eight straight sessions. If the Nifty 50 index remains under the bears' grip next week as well, it would end lower for the ninth successive week, after a gap of 25 years. So, all eyes are focused on the Opening Bell when trading resumes on Monday.\n\nAccording to stock market experts, the Indian stock market is expected to see strong buying in IT stocks following Accenture's better-than-expected results. The market also estimates strong buying in HDFC Bank and Kotak Mahindra Bank shares after the appointment of new MD and CEO at these two private lenders.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 04:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "InvestingPro Fair Value models spotted 62% gain in TaskUs stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 04:39 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "InvestingPro Fair Value flagged HawkEye 360 overvaluation before 56% drop", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Oct 2026, 04:31 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tata Comms, Siemens, Aadhar Housing, Styrenix, Sudarshan \u2014 Top 5 stocks to buy on Monday | Target, SL by Sumeet Bagadia", "full_content": "Breakout stocks to buy | Sumeet Bagadia's stock recommendations today: The key benchmark indices of the Indian stock market continued to bear the brunt of sharp foreign fund outflows and rising US bond yields amid the raging conflict in the Middle East. Investors are also perturbed by elevated crude oil prices and the resultant decline in the rupee against the dollar, leading to a broad market sell-off in domestic equities, although IT shares bucked the downward trend after the recent correction.\n\nThe Nifty 50 index finished at 22,421, logging a weekly loss for the eighth straight session, whereas the BSE Sensex fell nearly 2000 points. The Bank Nifty index finished at 54,450. All three key benchmark indices witnessed strong selling throughout the truncated week.\n\nSumeet Bagadia, Executive Director at Choice Broking, believes the Indian stock market bias has further weakened as the Nifty 50 index approaches its near-term support at 22,200. Going down memory lane, Sumeet Bagadia said that, in 2008, the Nifty 50 declined for seven consecutive weeks before witnessing a five-week positive move.\n\nSpeaking on the outlook for the Nifty 50 index, Sumeet Bagadia said, \u201cThe short-term structure continues to show weakness, with sustained selling pressure over the last eight weeks keeping the broader market under pressure. The index is currently holding around the 22,400 zone, but a sustained move above 22,600 would be important for a stronger recovery.\u201d\n\nBagadia said that PCR at 0.99 indicates a relatively balanced options setup, while the highest Call OI concentration is seen around 22,400\u201322,500 and the highest Put OI concentration around 22,400\u201322,300, making this zone important for the near-term price action.\n\nThe Choice Broking expert said that if the 50-stock index closes above 22,600 for two consecutive sessions, a stronger pullback could be expected. Historically, in 2008, Nifty declined for seven consecutive weeks before witnessing a five-week positive move.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 04:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What can revive the battered government bond market?", "full_content": "Market Questions is the FT\u2019s guide to the week ahead", "source": "FT Markets", "pub_date_str": "04 Oct 2026, 04:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "UPI MDR Charges: Will small-value transactions be impacted? What's Person-to-Merchant (P2M) fees? Details inside", "full_content": "The Unified Payments Interface ( UPI ) is set to see a change in the way certain merchant transactions are charged from 15 October 2026.\n\nAn MDR (Merchant Discount Rate) of 0.4% will apply to eligible P2M UPI payments above \u20b9 2,000. However, this is a charge on the merchant side and not a fee that customers will have to pay for making a UPI payment.\n\nAccording to the FAQs issued by the National Payments Corporation of India ( NPCI ) on 15 September 2026, the revised framework has different provisions for regular commercial merchants, small vendors, and certain sectors. Here's what you need to know.\n\nNo. UPI P2M transactions of up to \u20b9 2,000 will continue to remain outside the MDR framework.\n\nAccording to the Ministry of Finance, \u201capproximately 96% of merchant transactions will remain unaffected, as they are either below the \u20b9 2,000 threshold or covered by the zero-MDR framework for small merchants.\u201d\n\nFor P2M transactions above \u20b9 2,000, an MDR of 0.4% will apply. The charge is borne on the merchant side rather than being collected from the customer making the payment.\n\nThere is also a ceiling for larger transactions. For a UPI payment of \u20b9 75,000 or more, the MDR will be limited to \u20b9 300 per transaction.\n\nFor example, 0.4% of a \u20b9 1 lakh payment would come to \u20b9 400. However, because of the cap, the applicable MDR would be \u20b9 300.", "source": "LiveMint Money", "pub_date_str": "04 Oct 2026, 04:27 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Digger Box Office Collection Day 2: Tom Cruise Starrer Witnesses Drop In Earnings In India", "full_content": "Digger earned Rs 43.48 lakh on Day 2, witnessing a 22.4% drop in collection and taking its total India gross to Rs 1.25 crore.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 04:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide stock market action on Monday BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide stock market action on Monday SECTIONS Ahead of Market: 10 things that will decide stock market action on Monday By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 04, 2026, 04:17:00 PM IST Rate Story Follow us Share
