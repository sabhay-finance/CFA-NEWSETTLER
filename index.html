08:15 PM IST", "pub_date_relative": "just now"}, {"title": "PepsiCo cuts earnings forecast as North American turnaround takes longer than expected", "full_content": "PepsiCo on Thursday reported quarterly earnings and revenue that topped analysts' expectations, fueled by international growth as its North American business continues to lag.\n\nWith one quarter left in 2026, the company also lowered its forecast for its full-year earnings, as its struggles in its home market weigh on profits. Pepsi expects core earnings per share to increase 2.5% to 3.5%, down from its previous projection of the low end of a range from 5% to 7%. It also now expects net revenue growth of about 6%, on the high end of its prior outlook of a range of 4% to 6%.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nPepsi reported fiscal third-quarter net income attributable to the company of $3.05 billion, or $2.23 per share, up from $2.6 billion, or $1.90 per share, a year earlier.\n\nNet sales rose 5.6% to $25.27 billion. Organic revenue, which excludes acquisitions, divestitures and foreign exchange, increased 3.1% during the quarter.\n\nThe company reported volume growth of 3% for its beverages and 1% for its food for the quarter. Volume excludes pricing and currency fluctuations to reflect demand more accurately.\n\nPepsi's international markets were once again the bright spot. The company's international business has accounted for 41% of its net revenue so far this year, CEO Ramon Laguarta said in prepared remarks.\n\nPepsi saw volume growth in all but one of its international business units during the quarter. Only its convenient foods division in Europe, the Middle East and Africa reported declining volume, of 1%.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 08:13 PM IST", "pub_date_relative": "2m ago"}, {"title": "SAT to pass order in Jane Street \u2018manipulation\u2019 case on 21 October", "full_content": "The Securities Appellate Tribunal (SAT) has reserved its order until 21 October on an appeal by US-based market maker Jane Street, bringing an end to verbal arguments in its ongoing legal battle with the Securities and Exchange Board of India (Sebi) over access to key evidence.\n\nThe dispute stems from Sebi\u2019s July 2025 ex-parte interim order, which barred Jane Street from the Indian securities market and directed it to disgorge \u20b9 4,843 crore in alleged unlawful gains.\n\nThe regulator accused the hedge fund of manipulating the Bank Nifty index by using trades in cash and futures markets to artificially support the index while building large short positions in index options.\n\nArguing before a SAT bench comprising presiding officer Justice (Retd.) P. S. Dinesh Kumar and Technical Members Dr. Dheeraj Bhatnagar and Meera Swarup, the hedge fund contended that Sebi has withheld crucial documents and data used to build its case.\n\nJane Street's demands include trade and order logs with counterparty details such as trade quantity, price, and execution time, along with correspondence between Sebi and NSE, among other things.\n\nJane Street argued that these documents are essential to its defence against market manipulation charges, as they could clarify why Sebi launched a fresh investigation after two previous reviews cleared the firm.\n\nThe appeal highlights a November 2024 probe by the NSE and a December 2024 review by Sebi\u2019s Integrated Surveillance Department (ISD), both of which reportedly found no proof that Jane Street's trades influenced index prices to profit its options positions, recommending against further action.\n\nHowever, lawyers representing the market regulator have argued that counterparty trades and order data are not relevant to the allegations against Jane Street, and that at this stage of the investigation, Sebi is legally bound to only share information it relied upon to pass the interim order.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 08:11 PM IST", "pub_date_relative": "4m ago"}, {"title": "PNC Financial may see 3.1% move on Oct. 15 earnings release", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:08 PM IST", "pub_date_relative": "7m ago"}, {"title": "Earnings call transcript: Richelieu Hardware tops Q3 2026 estimates as stock jumps 12%", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:07 PM IST", "pub_date_relative": "8m ago"}, {"title": "US Bancorp stock may move 3% on Oct. 15 earnings release", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:06 PM IST", "pub_date_relative": "8m ago"}, {"title": "US August wholesale inventories revised lower", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:06 PM IST", "pub_date_relative": "9m ago"}, {"title": "Why is DPM Metals stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:06 PM IST", "pub_date_relative": "9m ago"}, {"title": "Starbucks has explored Chipotle takeover, FT reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:06 PM IST", "pub_date_relative": "9m ago"}, {"title": "Eli Lilly, Glaukos among market cap stock movers on Thursday", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:05 PM IST", "pub_date_relative": "9m ago"}, {"title": "French bond sell-off prompts \u2018bottom fishing\u2019 across Europe", "full_content": "Fears of a blow-up similar to the Eurozone debt crisis have been overdone, asset managers say", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 08:05 PM IST", "pub_date_relative": "10m ago"}, {"title": "Layoffs haven\u2019t been this low since the 1960s. It\u2019s great if you have a job \u2014 but not if you don\u2019t.", "full_content": "It isn\u2019t easy for anyone looking for work now to find a job. Yet people who already have jobs probably don\u2019t have to worry much about losing them.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 08:05 PM IST", "pub_date_relative": "10m ago"}, {"title": "The 15+ best Prime Day tech deals still live: Last chance deals on MacBooks, TVs, headphones, and more - Mashable", "full_content": "The 15+ best Prime Day tech deals still live: Last chance deals on MacBooks, TVs, headphones, and more Mashable October Prime Day is over, but these deals are still live: Score last-chance savings from Hanes, Carhartt, Apple and more Yahoo Amazon ended its sale, but these competing deals still live are flying under the radar CNN It\u2019s Prime Day (Again). Here Are the Best Deals From Amazon\u2019s Prime Big Deal Days. The New York Times 217+ best October Prime Day 2 deals we found, live \u2014 shop before they\u2019re gone NBC News", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 08:03 PM IST", "pub_date_relative": "12m ago"}, {"title": "Piper Sandler, KeyBanc bullish on Generac\u2019s expanding data center pipeline", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:03 PM IST", "pub_date_relative": "12m ago"}, {"title": "Top stocks in focus tomorrow: Investors must watch TCS, NCC, RentoMojo shares on Fri, 9 Oct | Triggers", "full_content": "Indian stock market investors are likely to keep an eye on several companies on Friday, October 9, after a series of key earnings updates, order wins, business developments and strategic partnerships.\n\nP N Gadgil Jewellers, S&S Power Switchgear, RentoMojo, NCC, PACE Digitek and Hexaware Technologies are among the stocks likely to remain in focus. SML Mahindra, IRB Infrastructure Developers and TCS may also attract attention following their latest sales, business and financial updates.\n\nTCS : The country's largest IT services company posted a net profit of \u20b9 13,884 crore in Q2, up 15% YoY from \u20b9 12,075 crore in the year-ago quarter.\n\nIts revenue from operations increased 11.2% YoY to \u20b9 73,188 crore from \u20b9 65,799 crore. The IT major kicked off the Q2 earnings season for India Inc. with its September-quarter results.\n\nNCC : The company received a major order worth \u20b9 1,286 crore from Hyderabad Growth Corridor Limited. The order is for the construction of Radial Road-2, strengthening the company\u2019s order book and infrastructure portfolio.\n\nS&S Power Switchgear : The company announced that its wholly owned subsidiary received an LOA from Sterling & Wilson for supplying 765 kV isolators for an Adani project in Maharashtra. The order is worth over \u20b9 1 crore, with delivery planned for the next financial year.\n\nHexaware Technologies : The company said that it had entered into a multi-year partnership with Anthropic and became a preferred partner in its Claude Partner Network. Claude will be integrated into Hexaware\u2019s Zerovity AI-native engineering platform and AgentVerse platform. The partnership will support outcome-based services across IT operations and software engineering.\n\nP N Gadgil Jewellers : It announced its September-quarter results, with revenue rising 22.4% YoY. Retail revenue increased 31.1%, while the franchise business grew 34.7%. Rakhi sales jumped 114%, while e-commerce revenue declined 83.6%. The company aims to open around 23 new stores in FY27.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 08:03 PM IST", "pub_date_relative": "12m ago"}, {"title": "Fast Food\u2019s Takeover Season: Pizza, Burgers, and Now Burritos", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:03 PM IST", "pub_date_relative": "12m ago"}, {"title": "StoneX raises Third Coast Bancshares stock price target on acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:02 PM IST", "pub_date_relative": "13m ago"}, {"title": "Repeated US Treasury interventions risk an erosion of credibility", "full_content": "A key policy tool to stabilise stress in markets could turn into a source of moral hazard and deeper volatility", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 08:00 PM IST", "pub_date_relative": "15m ago"}, {"title": "I\u2019m a 68-year-old widow and give money to my two adult children. Am I putting my retirement at risk?", "full_content": "\u201cI also have $310,000 in an IRA and $46,000 in savings. My house is paid off.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 08:00 PM IST", "pub_date_relative": "15m ago"}, {"title": "Skydance's David Ellison tells CNBC combined company is 'positioned to win in every single vertical'", "full_content": "Skydance co-CEO David Ellison told CNBC on Thursday \u2014 days after Paramount's acquisition of Warner Bros. Discovery officially closed \u2014 that the combined company is \"positioned to win in every single vertical that we operate in.\"\n\nSkydance includes film studios Paramount and Warner Bros.; the CBS broadcast network; a sprawling pay TV portfolio that includes CNN, TNT, MTV and BET; and streaming services Paramount+ and HBO Max.\n\n\"By combining Paramount and Warner Bros, we have the greatest content engine,\" Ellison said, noting blockbuster intellectual property and a strong sports portfolio. \"You're immediately getting to scale in streaming between HBO Max and Paramount+, over 200 million global streaming subscribers. ... Not to mention the Olympics internationally and an incredibly profitable linear portfolio, anchored by CBS.\"\n\nEllison and co-CEO Ynon Kreiz plan to split executive duties, with Ellison focusing on the company's creative vision, technological innovations and long-term strategy while Kreiz leads the integration of the two companies and handles day-to-day management and operations.\n\n\"We have a unique opportunity to build the next generation media and entertainment global company that is powered by creativity and technology,\" Kreiz said. \"We have the assets that David mentioned. We have the capability. We have the people. And all of this is happening at the point in time when the industry is at an inflection point, where it's getting harder and harder to reach the consumer and aggregate fans.\"\n\nKreiz is a 30-year veteran of the media space with a reputation as a turnaround man .", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:54 PM IST", "pub_date_relative": "21m ago"}, {"title": "Stock Market Today: Oil Rises, Nasdaq Slips After Fresh Tanker Attack \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Oil Rises, Nasdaq Slips After Fresh Tanker Attack \u2014 Live Updates WSJ Stock Market Today: Dow, S&P 500 and Nasdaq decline as tech stocks struggle and oil prices jump on threat of war resuming in Iran MarketWatch As Trump eyes a new round of major combat operations in Iran, sparking global stock selloff Fortune Oil jumps 4% as Trump rules out Iran deal, stocks slip Quartz Stock market slips as oil prices rise after Iran deal prospects fade (COMP:IND:) Seeking Alpha", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 07:52 PM IST", "pub_date_relative": "23m ago"}, {"title": "Hundreds of new pro sports team ETFs lead world of retail investing to the edge of gambling", "full_content": "In 1989, all-time hits leader Pete Rose was banned from Major League Baseball for life because of his gambling activities. He wasn't reinstated until last year, months after his death in 2024.\n\nFast-forward to today, and Pete Rose's gambling might seem like just another day on Wall Street as financial firms expand the ways fans can put money behind their teams, beyond a beer and a $15 hot dog.\n\nYou may soon be able to buy a ticker for your favorite hockey team, and it isn't a stake in the franchise. Multiple asset managers have filed to launch dozens of ETFs, one for every NHL team, with MLB baseball team funds filed as well, all built on new futures contracts that track a team's season statistics. None has begun trading but in all, hundreds of ETFs that track the single-season performance of one professional team across a mix of statistical categories have been filed at the SEC for approval.\n\nSome finance experts see the development as lacking any nuance whatsoever.\n\n\"The line between gambling and investing has not simply been blurred, it has been erased,\" said Robert Johnson, a professor of finance at Creighton University.\n\nAmong fund companies getting in on the novel trend are VolatilityShares , LeagueShares, Roundhill Investments , and Rex Financial .\n\nNone of the four companies responded to requests for comment. Asset managers typically cannot publicly comment during the period between when funds are filed with the Securities and Exchange Commission for approval and when they become effective, if approved.\n\nRex, a Miami-based ETF issuer, announced Sept. 21 that it was launching Alpha Sports Holdings, a new subsidiary built to turn team performance into exchange-traded funds. REX has filed with the SEC for BaseballShares and HockeyShares, suites of ETFs that would track Major League Baseball and National Hockey League teams through futures contracts that CME Group, the derivatives exchange, lists on indexes built by FutureSports, an index company.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:50 PM IST", "pub_date_relative": "25m ago"}, {"title": "US stocks: US markets fall as higher yields and oil prices flag inflation risk", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US markets fall as higher yields and oil prices flag inflation risk Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US markets fall as higher yields and oil prices flag inflation risk SECTIONS US stocks: US markets fall as higher yields and oil prices flag inflation risk ETMarkets.com Last Updated: Oct 08, 2026, 07:51:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks fell as crude oil prices surged and Treasury yields remained high, raising inflation concerns. Major companies like Amazon, Tesla, and Nvidia experienced losses, contributing to a broader decline in the technology sector. Investors are now focused on upcoming third-quarter earnings reports, particularly from financial institutions. The Federal Reserve is expected to keep interest rates unchanged in October, while considering future hikes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 07:49 PM IST", "pub_date_relative": "25m ago"}, {"title": "US jobless claims hover near 57-year low for fourth consecutive week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US jobless claims hover near 57-year low for fourth consecutive week Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US jobless claims hover near 57-year low for fourth consecutive week SECTIONS US jobless claims hover near 57-year low for fourth consecutive week Reuters Last Updated: Oct 08, 2026, 07:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a recent report, weekly unemployment claims saw a slight drop of 2,000, totaling 197,000, which suggests some stability within the job market. Nonetheless, nonfarm payroll growth remained disappointing, with just 29,000 jobs created in September. Additionally, there was an increase of 17,000 in ongoing unemployment benefits, highlighting challenges faced by new job seekers amid geopolitical uncertainties and a tightening labor pool.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 07:46 PM IST", "pub_date_relative": "29m ago"}, {"title": "S&P 500 slides as traders monitor Treasury yields; oil gains 4%: Live updates", "full_content": "The S&P 500 moved lower on Thursday as investors watched the moves in Treasury yields and faced pressure from elevated oil prices.\n\nThe broad market index dipped 0.3%, while the Nasdaq Composite was down 0.5%. The Dow Jones Industrial Average traded just below the flatline.\n\nThe benchmark 10-year Treasury note yield was roughly little changed at 5.277%, as was the 30-year yield at 5.646%. The 2-year Treasury yield gained more than 3 basis points to 4.802%. Those moves came after Federal Reserve Governor Christopher Waller said more hikes may be needed to curb inflation.\n\nOil prices spiked also after President Donald Trump said he doesn't want to make a deal with Iran to end the war, while the U.S. is reportedly preparing for \" massive bombing \" in the Middle East. Brent crude jumped 4% to around $104 per barrel. West Texas Intermediate futures , meanwhile, advanced 4% to around $92.\n\nKey areas of the market sensitive to higher borrowing costs such as banks and technology were under pressure yet again. Intel and Marvell Technology shares were each down more than 2%, while Bank of America and Citigroup shed around 1%.\n\nYields and oil have stoked volatility in equities of late, as concern grows that higher energy prices will keep inflation elevated and force the Federal Reserve to further raise rates.\n\nMany investors are maintaining an optimistic view of the stock market, however. They expect that the start of earnings season could give the market the fuel it needs for the next leg higher.\n\nIn the third quarter, the S&P 500 is expected post a blended earnings growth rate of roughly 30%, which would be a third straight quarter of above-25% earnings growth, according to FactSet.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:45 PM IST", "pub_date_relative": "30m ago"}, {"title": "Hurricane Isaias is expected to get stronger on its way to Florida, Alabama and Mississippi coasts", "full_content": "Isaias surged toward the U.S. Gulf Coast on Thursday as the first hurricane of the Atlantic season, prompting mandatory evacuations, school closures and local government shutdowns in parts of Florida.\n\nIsaias was forecast to intensify rapidly and bring strong winds and a life-threatening storm surge to the Florida Panhandle, southern Alabama and southern Mississippi when it makes landfall on the northern Gulf Coast late Friday or early Saturday. Heavy rain with the risk of flooding was possible into the weekend as far inland as the Tennessee Valley.\n\nThe hurricane had maximum sustained winds around 80 mph (129 kph) and was moving east-northeast at 9 mph (15 kph) early Thursday morning, the National Hurricane Center in Miami said. It was centered about 420 miles (676 kilometers) south-southwest of the mouth of the Mississippi River.\n\n\"Preparations to protect life and property from storm surge and damaging winds along the warning area of the Gulf Coast should be rushed to completion today,\" the center said Thursday.\n\nCoastal communities moved quickly to prepare. Some Gulf oil wells paused production, and at least four Florida school districts canceled classes for later in the week. Okaloosa County announced mandatory evacuations for some coastal areas and communities were closing government offices as of Thursday afternoon. Governors in Florida and Alabama declared a state of emergency for dozens of counties.\n\nWater from the storm surge and high tide could reach heights of 5 to 7 feet (1.5 to 2 meters) in parts of Alabama and Mississippi, the center said. Isaias also could dump up to 10 inches (25 centimeters) of rain along parts of the Gulf Coast and spawn tornadoes Friday night into Saturday from Alabama to the Florida Panhandle to southwestern Georgia.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:45 PM IST", "pub_date_relative": "30m ago"}, {"title": "Absence of AI in equities will become India's strength in a year, mkts to start attracting flows: CEA", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Absence of AI in equities will become India's strength in a year, mkts to start attracting flows: CEA The Economic Times daily newspaper is available online now. Read Today's Paper Absence of AI in equities will become India's strength in a year, mkts to start attracting flows: CEA SECTIONS Absence of AI in equities will become India's strength in a year, mkts to start attracting flows: CEA PTI Last Updated: Oct 08, 2026, 07:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chief Economic Advisor V Anantha Nageswaran indicated that India's absence of AI focus might become an advantage. He believes that if the AI boom falters, foreign investors will seek alternative growth opportunities in India. Despite currency depreciation and external challenges, India maintains strong economic fundamentals and growth. Nageswaran highlighted the manageable current account deficit and well-capitalized banking system as positive factors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 07:44 PM IST", "pub_date_relative": "31m ago"}, {"title": "Trump's former defense secretary sees no end in sight for Iran war \u2014 to the benefit of America's 'greatest adversary'", "full_content": "The U.S.-Iran war could drag on for years, putting America at risk of overlooking China's rise to power, according to President Donald Trump's former defense secretary.\n\nDuring a panel discussion at LSEG and Eurasia Group's GZERO Summit in London, Mark Esper said on Thursday he saw the conflict continuing \"well into 2027,\" with a possibility that it could be handed to the next U.S. administration in three years' time.\n\n\"At some point, we will reach a point where maybe both sides are willing to come to the table and find a negotiated settlement, but the challenge for president Trump will be he's going to have to get a deal that returns the Strait of Hormuz to the status quo, which is going to be really hard, and is a deal that's better than what [former President Barack Obama] got out of the JCPOA , and I think that's going to be very difficult too,\" he said.\n\n\"So the question is, will he be willing to make that deal and live with the consequences or how the critics judge that deal? And so you can see another path where it gets handed off to the next administration in 2029.\"\n\nSpeaking to CNBC on the sidelines of the event, Esper said he does not see an end to the war \"in the foreseeable future.\"\n\n\"I think it continues at this type of pace where we see the American blockade continue, we see occasional outbursts from either side, and it drags along,\" he said.\n\nThe war, now in its eighth month, has reached an impasse, with Trump saying Wednesday that making a deal with Tehran \"isn't really something that I want to do.\" According to reports , U.S. officials are considering a resumption of large-scale military operations in the coming weeks.\n\nEsper, who served as U.S. Secretary of Defense during Trump's first presidential term from July 2019 to November 2020, said he had long been an advocate for \"the economic strangulation\" of Iran. But he said such a policy was vulnerable to impatience in Washington.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:42 PM IST", "pub_date_relative": "33m ago"}, {"title": "Palantir Stock Has a Secret Weapon in the AI Boom, Goldman Sachs Says - Barron's", "full_content": "Palantir Stock Has a Secret Weapon in the AI Boom, Goldman Sachs Says Barron's Palantir Advances 3% as Goldman Sachs Upgrades to Buy With $230 Target; Salesforce and ServiceNow Hold Steady Yahoo Finance Palantir in focus as Goldman Sachs upgrades on recent underperformance (PLTR:NASDAQ) Seeking Alpha Here's What a $1,000 Investment in Palantir Stock Could Be Worth in 5 Years (Hint: It's a Lot) The Motley Fool What Are Palantir Stock Bulls Not Worried About? Trefis", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 07:40 PM IST", "pub_date_relative": "35m ago"}, {"title": "UK investors face three-month wait to recoup money from property funds", "full_content": "FCA seeks to avoid repeat of fund suspensions during market turmoil by restricting immediate access to investments in illiquid assets", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 07:33 PM IST", "pub_date_relative": "42m ago"}, {"title": "Oil prices jump on tanker attacks and slowing flows through Strait of Hormuz", "full_content": "Transit through vital waterway rose close to 90% of prewar levels last month but has since fallen sharply", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 07:31 PM IST", "pub_date_relative": "44m ago"}, {"title": "Avocado giant Mission Produce banks on orchards outside Mexico to help meet US demand", "full_content": "Farms in Peru and Guatemala help offset import troubles from violence-stricken growing regions", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 07:30 PM IST", "pub_date_relative": "45m ago"}, {"title": "This chart shows the No. 1 reason why the cost of raising kids jumped 60% in eight years", "full_content": "\u201cThe birth-rate crisis is really an affordability crisis.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 07:30 PM IST", "pub_date_relative": "45m ago"}, {"title": "Small caps are suffering from higher rates, preference for AI stocks. There may soon be a buying opportunity", "full_content": "Large-cap stocks have been holding up OK despite the volatility brought on by higher Treasury yields.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:29 PM IST", "pub_date_relative": "45m ago"}, {"title": "French bonds are suffering through their worst decade since 1803 \u2014 and investors are bracing for more pain", "full_content": "The spread between France\u2019s 10-year government bond and Germany\u2019s equivalent reached its widest last week in available Bloomberg data, dating back to 1990.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 07:22 PM IST", "pub_date_relative": "53m ago"}, {"title": "Parag Parikh Flexi Cap Fund: 1 stock exit, DLF sees major buying in September 2026 \u2014 key takeaways for investors", "full_content": "India\u2019s largest active mutual fund scheme by assets under management, Parag Parikh Flexi Cap Fund, has disclosed its portfolio for September 2026, showing increased exposure to select existing holdings along with one complete exit.\n\nThe fund\u2019s AUM stood at \u20b9 1,47,405 crore in August 2026, which declined to \u20b9 1,45,070 crore in September 2026.\n\nSince its inception on 24 May 2013, the fund has delivered a 17.76% return, outperforming the 13.56% return generated by its benchmark index, Nifty 500 TRI. However, its performance over the last 1 year has been weaker, with the fund declining 3.54% as of 30 September 2026, compared with a fall of 2.03% for the Nifty 500 TRI.\n\nOver a 3-year period, the fund delivered a 12.21% return compared with 9.50% for the Nifty 500 TRI. Over 5 years, the fund generated 11.15%, while the benchmark returned 9.04%.\n\nHere\u2019s a look at the key portfolio changes in this flexi-cap fund during September 2026.\n\nParikh Flexi Cap Fund completely exited Great Eastern Shipping Company from its portfolio in September.\n\nThe fund\u2019s holding in The Great Eastern Shipping Company stood at 12.74 lakh shares in August 2026, accounting for only 0.11% of AUM. This was the fund\u2019s only complete exit during the month.\n\nHowever, the fund did not add any new stock during the month.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 07:21 PM IST", "pub_date_relative": "54m ago"}, {"title": "TCS share price expectations for tomorrow: How Q2 results 2026 will impact Tata stock on Friday 9th Oct? Expert decodes", "full_content": "TCS share price prediction post Q2: Tata Consultancy Services marginally beat the Street estimates after reporting its second quarter result for the financial year 2026-27 on Thursday, October 8. The Tata Group\u2019s flagship IT software services provider reported a slightly higher-than-expected September-quarter revenue. With TCS Q2 result out today, all eyes are on how the IT stock will perform in the next trading session, i.e. on Friday, October 9.\n\nTCS share price stock can see a slightly positive opening on Friday followed by range-bound movement throughout the day, according to Tushar Badjate, Director, Badjate Wealth1 Pvt. Ltd.\n\nFor Friday, Tushar Badjate is \u201cnot expecting fireworks\u201d. He believes that the stock may see flat to slightly positive opening.\n\n\u201cTechnically, \u20b9 2,000 is the level I'm watching. The stock found support there after the August fall. If it holds, \u20b9 2,250 to 2,300 is possible over the next few months. For Friday, I'd expect it to trade somewhere between \u20b9 2,080 and \u20b9 2,200,\u201d he explained.\n\nTCS Q2 profit came in better than what the Street was expecting, Badjate noted, highlighting the company\u2019s order book as one of the key positives. The IT heavyweight has signed $9.6 billion of deals in a quarter where the West Asia situation had clients holding back.\n\nThe Mumbai-headquartered firm's AI momentum remained strong, with annualised AI revenues now exceeding $3 billion, and it has crossed 10% of total revenue. But AI is not adding to the business yet, rather it is eating into the older business, Badjate pointed out.\n\n\u201cTCS does roughly $7.6 billion of revenue a quarter. A 0.5% growth adds only about $38 million. In the same quarter, annualised AI revenue went up by $500 million, which works out to about $125 million for the quarter. So AI added around $125 million, while total revenue grew by only $38 million.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 07:20 PM IST", "pub_date_relative": "55m ago"}, {"title": "What Nana Patekar Do Beyond Acting? Work For Farmers, Water Conservation, Serving In Army During Kargil War", "full_content": "Here's a look at Nana Patekar's life beyond acting and movies.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 07:18 PM IST", "pub_date_relative": "57m ago"}, {"title": "FPI selling accelerates in October; \u20b931,000 crore withdrawn in 4 sessions: What\u2019s next for Indian stock market?", "full_content": "FPIs extended their selling spree in the Indian stock market in October, withdrawing another \u20b9 31,282 crore in just five trading sessions. This came on top of the \u20b9 35,857 crore worth of selling in September, according to NSDL data.\n\nThe severe selling by overseas investors came amid rising inflationary pressures, driven by escalating tensions in the Middle East, while the bond market sell-off showed no signs of slowing, with US Treasuries hovering near multi-decade highs.\n\nDomestic factors also turned unfavourable, with poor monsoon rains linked to El Ni\u00f1o compounding price pressures in Asia\u2019s third-largest economy. The RBI was the latest central bank to raise interest rates, joining the US Federal Reserve, Bank of Japan, and European Central Bank in the fight against rising price pressures.\n\nHigher crude oil prices were among the major reasons behind the increased pressure on Indian equities. For India, higher oil prices are particularly uncomfortable because they simultaneously raise the import bill, inflation risks, and pressure on the currency.\n\nBrent continued to remain above $100 per barrel, while recent media reports showed that the White House had asked the Pentagon to draw up strike options against Iran that could be executed before the midterm elections. US President Donald Trump also said on Wednesday that he no longer wanted a deal with Iran.\n\nMeanwhile, higher Treasury yields, along with a rising US dollar, are also influencing FPI sentiment. The yield on the 10-year US Treasury hit a 24-year high of 5.36% on Wednesday and remained close to that level today, hovering around 5.35%. The 30-year Treasury bond yield also remained around a 24-year high.\n\nInvestors are demanding greater compensation to hold bonds amid concerns about inflation, government spending, and surging corporate borrowing to finance the artificial-intelligence buildout.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 07:16 PM IST", "pub_date_relative": "58m ago"}, {"title": "Reliance Digital Festival Of Electronics 2026: Top Offers On iPhone 17 Pro, Dell XPS 13, LG Mini LED TV & More", "full_content": "Reliance Digital's Festival of Electronics sale is back, with the iPhone 17 Pro 256GB listed at Rs 56,990 and deals on laptops, TVs, ACs and more. Here are the top offers.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 07:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "TCS Q2 Concall Live: AI Revenue Crosses $3.1 Billion, 10% Of Overall Revenue", "full_content": "TCS Q2 Results Live: Track the earnings announcement, dividend decision, management commentary, key financial metrics and TCS share price reaction here.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 07:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "College students have to use credit cards just to cover basic living expenses. Here\u2019s what it\u2019s costing them.", "full_content": "Nearly 9 out of every 10 students who use credit cards report doing so to pay for basic living expenses such as food, housing and gas.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 07:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Republican megadonors dominate 2026 midterm election as crypto and AI money surges, CNBC analysis finds", "full_content": "The biggest donors in the 2026 midterm election are breaking decisively toward Republican candidates and causes, a CNBC analysis of Federal Election Commission records found.\n\nFourteen of the 20 largest donors and donor groups this election cycle have exclusively or nearly exclusively backed GOP candidates or aligned groups, according to a CNBC analysis of federal campaign-finance records. Together, the 20 account for $1.2 billion, or about an eighth of the roughly $9.8 billion raised this election cycle through Sept. 25 across the campaigns and super PACs CNBC examined.\n\nCNBC analyzed FEC records for contributions reported during the 2026 election cycle, covering Jan. 1, 2025, through the latest filings available, combining spouses and closely affiliated donor entities where appropriate and removing duplicate or superseded transactions. The analysis of disclosed federal political committee contributions provides the most up-to-date snapshot of who is financing the 2026 midterms and shows a stark divide in where the biggest donors are putting their money.\n\nDemocratic megadonors, meanwhile, are increasingly bypassing the national party, though in some cases they're giving directly to candidates instead.\n\nWith less than four weeks until Election Day , some of the biggest six-figure checks that once routinely flowed to the Democratic National Committee haven't materialized. Fundraisers told CNBC the hesitation reflects lingering 2024 election \"trauma\" from Kamala Harris' defeat, fears of democratic socialism and disillusionment with the DNC's leadership in Washington.\n\n\"We don't have the kind of donors they've got,\" said Matt Bennett of the centrist Democratic think tank Third Way.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Stock Market Today: Dow, S&P 500, Nasdaq In Red As Oil, Treasury Yields Jump", "full_content": "Nasdaq Composite fell 0.47% to 27,410.59, S&P 500 slid 0.38% to 7,772.41, while Dow Jones Industrial Average traded 0.33% lower at 51,009.78.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 07:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Amazon overhauls aging devices lineup with higher priced Alexa tablet, dumping the budget Fire", "full_content": "Amazon on Thursday debuted a set of new, pricier Alexa tablets and said it's ditching its budget-friendly Fire lineup, marking a significant shift in the e-commerce juggernaut's devices strategy.\n\nThe company unveiled 8-inch, 11-inch and 12-inch models, which start at $230 and run up to $550. All devices are available for preorder on Thursday and will begin shipping Oct. 14.\n\nAmazon has historically sold its devices at or near the cost of manufacturing them, partly to undercut competitors with extremely cheap prices, but also with the goal of promoting its other products and services. It's hoped that for every $80 Echo smart speaker it sells, users will purchase movies, audiobook subscriptions or items from its sprawling webstore, which tend to have higher margins.\n\nThe company has recently taken steps to make more money from its devices business under CEO Andy Jassy , who succeeded founder Jeff Bezos in 2021. Last year, it introduced pricier versions of its Echo smart speakers and began charging non-Prime members a subscription for Alexa+ , the souped-up version of its digital assistant.\n\nThe $550 Alexa Tablet 12 Pro costs more than double the price of the $155 Fire HD 10, Amazon's base model, and puts it more in line with Apple 's iPad, which runs from $449 to $1199.\n\nThe launch comes as Amazon and other devicemakers are grappling with a historic surge in memory prices . Amazon in August boosted prices on Echos, Kindles, Fire TVs and other hardware, citing the memory crunch. And earlier this year, Apple raised its prices on MacBooks and iPads, while Nintendo hiked the price of its Switch 2 console.\n\nAmazon denied that rising memory costs played a role in its decision to charge more for the Alexa tablet.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Thinking About Micro-Borrowing? Here Are Five Risks To Consider", "full_content": "Micro-borrowing can provide quick access to small amounts of money, but borrowers should understand the risks before taking a loan.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 07:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "After a 33% gain in the first half, this fund manager grew tired of the AI trade. Here\u2019s where he\u2019s looking now.", "full_content": "Bill Hench, of First Eagle, stepped away from the artificial-intelligence trade with small-capitalization bets on a recovery of the U.S. housing construction market.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 07:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "RBI bid to drain surplus liquidity and improve rate transmission sees muted response", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI bid to drain surplus liquidity and improve rate transmission sees muted response The Economic Times daily newspaper is available online now. Read Today's Paper RBI bid to drain surplus liquidity and improve rate transmission sees muted response SECTIONS RBI bid to drain surplus liquidity and improve rate transmission sees muted response By Atmadip Ray , ET Bureau Last Updated: Oct 08, 2026, 07:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Banks parked just Rs 79,655 crore in the central bank\u2019s 29-day variable rate reverse repo (VRRR) auction, less than half the Rs 2 lakh crore absorption planned in the offer. Draining liquidity is considered crucial for quicker and effective transmission of increases in policy rates.\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 07:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "PepsiCo to cut costs as weak North America business hurts annual core profit forecast", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a PepsiCo to cut costs as weak North America business hurts annual core profit forecast Powered By The Economic Times daily newspaper is available online now. Read Today's Paper PepsiCo to cut costs as weak North America business hurts annual core profit forecast SECTIONS PepsiCo to cut costs as weak North America business hurts annual core profit forecast Reuters Last Updated: Oct 08, 2026, 07:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PepsiCo is gearing up to implement further cost-cutting measures in response to rising input costs and a slowdown in consumer demand. CEO Ramon Laguarta indicated that actionable strategies would be rolled out shortly to bolster investments. The company has revised its fiscal 2026 core earnings per share growth estimate to a modest 1% to 2%, down from previous figures, while annual organic revenue growth is now anticipated at approximately 3%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 07:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Options traders start calling bottom on bond rout after 'bullet bid' 10-year auction", "full_content": "Calling a bottom in the nonstop U.S. Treasury bond sell-off might seem crazy, but a handful of options traders look increasingly willing to do it.\n\nTrading in the iShares 20+ Year Treasury Bond ETF (TLT) Wednesday was very call-heavy on volume that was 50% above the 30-day average, according to data compiled from Cboe LiveVol and SpotGamma. Traders bought almost 370,000 calls versus under 100,000 puts in TLT, and sold more puts than they bought.\n\nNine of the top 10 traded contracts in the ETF were calls, and while there was some call-selling, volume and premium was on the side of bulls, suggesting traders think the risk-reward of betting on higher yields isn't great. A rally in the TLT would mean a decline in rates.\n\nWhat's more is the most popular trade in the monthly Oct. 30 expiry for TLT was buying the 82-strike call. That's a 10-cent contract that traded about 16,000 times today, and needs long bonds to recover all their lost ground since Sep. 22 \u2013 the particularly nasty stretch of this year's sell-off that saw TLT drop 6% and the 30-year yield passing 5.6%.\n\nMost of the buying came from one aggressive buyer at 10:01 ET, who spent at least $250,000 buying 25,00 of the 82-strike calls expiring Oct. 16 and 30th, and 5,000 of the 80-strike calls expiring Oct. 30. The trades weren't massive by dollar amount, but they marked the biggest purchase of any contracts for month-end expiry, and came shortly before an auction of 10-year notes that sparked a strong rally in bonds.\n\niShares 20+ Year Treasury Bond ETF, (TLT) \"Tens had a bullet bid today \u2013 auction demand has been very strong,\" Jim Perry, founder and chief investment officer of Perry International Capital Partners, said in a text. \"Demand is strong. It was `fill my market order at market prices because I want them.'\"\n\nAnother key test arrives today with the auction of 30-year bonds at 1 p.m.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 06:59 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Trump bought up to $25 million in Meta and millions in SpaceX debt in August", "full_content": "President Donald Trump disclosed more than 500 securities transactions in August, including a purchase of up to $25 million in Meta stock and an investment of as much as $5 million in SpaceX debt two days before he signed a sweeping policy aimed at expanding U.S. commercial space transportation, according to a newly released financial disclosure .\n\nThe 517 purchases and sales totaled roughly $74.3 million to $273.3 million, according to a CNBC analysis of Trump's August financial disclosure, which reports each item in a range of value. Purchases accounted for at least $44.2 million and sales at least $30.1 million, CNBC calculated.\n\nThe 18-page filing shows Trump's portfolio remained highly active, even as trading slowed from June and July, when he disclosed more than 1,000 transactions in each month.\n\nThe largest transaction was an Aug. 21 purchase of between $5 million and $25 million in Meta shares, amid a broader portfolio reshuffling that day. Trump also reported buying between $1 million and $5 million each of AT&T , ConocoPhillips , Abbott Laboratories , Netflix and Chevron the same day.\n\nOn the sell side, on Aug. 21, he unloaded between $1 million and $5 million each of Advanced Micro Devices and Church & Dwight , along with stakes worth between $500,001 and $1 million in companies including Boeing , Home Depot , T-Mobile , Datadog , Dell Technologies , Palo Alto Networks and Nvidia .\n\nOn Aug. 18, Trump's accounts purchased between $1 million and $5 million in senior unsecured notes issued by Elon Musk's rocket and satellite company, carrying a 5.35% interest rate and maturing in July 2031.\n\nTwo days later, Trump signed a national space transportation policy calling for the U.S. to support more than 1,000 launches and reentries annually by 2030.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 08:15 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Economics", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PepsiCo cuts earnings forecast as North American turnaround takes longer than expected", "full_content": "PepsiCo on Thursday reported quarterly earnings and revenue that topped analysts' expectations, fueled by international growth as its North American business continues to lag.\n\nWith one quarter left in 2026, the company also lowered its forecast for its full-year earnings, as its struggles in its home market weigh on profits. Pepsi expects core earnings per share to increase 2.5% to 3.5%, down from its previous projection of the low end of a range from 5% to 7%. It also now expects net revenue growth of about 6%, on the high end of its prior outlook of a range of 4% to 6%.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nPepsi reported fiscal third-quarter net income attributable to the company of $3.05 billion, or $2.23 per share, up from $2.6 billion, or $1.90 per share, a year earlier.\n\nNet sales rose 5.6% to $25.27 billion. Organic revenue, which excludes acquisitions, divestitures and foreign exchange, increased 3.1% during the quarter.\n\nThe company reported volume growth of 3% for its beverages and 1% for its food for the quarter. Volume excludes pricing and currency fluctuations to reflect demand more accurately.\n\nPepsi's international markets were once again the bright spot. The company's international business has accounted for 41% of its net revenue so far this year, CEO Ramon Laguarta said in prepared remarks.\n\nPepsi saw volume growth in all but one of its international business units during the quarter. Only its convenient foods division in Europe, the Middle East and Africa reported declining volume, of 1%.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 08:13 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SAT to pass order in Jane Street \u2018manipulation\u2019 case on 21 October", "full_content": "The Securities Appellate Tribunal (SAT) has reserved its order until 21 October on an appeal by US-based market maker Jane Street, bringing an end to verbal arguments in its ongoing legal battle with the Securities and Exchange Board of India (Sebi) over access to key evidence.\n\nThe dispute stems from Sebi\u2019s July 2025 ex-parte interim order, which barred Jane Street from the Indian securities market and directed it to disgorge \u20b9 4,843 crore in alleged unlawful gains.\n\nThe regulator accused the hedge fund of manipulating the Bank Nifty index by using trades in cash and futures markets to artificially support the index while building large short positions in index options.\n\nArguing before a SAT bench comprising presiding officer Justice (Retd.) P. S. Dinesh Kumar and Technical Members Dr. Dheeraj Bhatnagar and Meera Swarup, the hedge fund contended that Sebi has withheld crucial documents and data used to build its case.\n\nJane Street's demands include trade and order logs with counterparty details such as trade quantity, price, and execution time, along with correspondence between Sebi and NSE, among other things.\n\nJane Street argued that these documents are essential to its defence against market manipulation charges, as they could clarify why Sebi launched a fresh investigation after two previous reviews cleared the firm.\n\nThe appeal highlights a November 2024 probe by the NSE and a December 2024 review by Sebi\u2019s Integrated Surveillance Department (ISD), both of which reportedly found no proof that Jane Street's trades influenced index prices to profit its options positions, recommending against further action.\n\nHowever, lawyers representing the market regulator have argued that counterparty trades and order data are not relevant to the allegations against Jane Street, and that at this stage of the investigation, Sebi is legally bound to only share information it relied upon to pass the interim order.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 08:11 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PNC Financial may see 3.1% move on Oct. 15 earnings release", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:08 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Richelieu Hardware tops Q3 2026 estimates as stock jumps 12%", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:07 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Bancorp stock may move 3% on Oct. 15 earnings release", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:06 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Starbucks has explored Chipotle takeover, FT reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:06 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Eli Lilly, Glaukos among market cap stock movers on Thursday", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:05 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "French bond sell-off prompts \u2018bottom fishing\u2019 across Europe", "full_content": "Fears of a blow-up similar to the Eurozone debt crisis have been overdone, asset managers say", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 08:05 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Top stocks in focus tomorrow: Investors must watch TCS, NCC, RentoMojo shares on Fri, 9 Oct | Triggers", "full_content": "Indian stock market investors are likely to keep an eye on several companies on Friday, October 9, after a series of key earnings updates, order wins, business developments and strategic partnerships.\n\nP N Gadgil Jewellers, S&S Power Switchgear, RentoMojo, NCC, PACE Digitek and Hexaware Technologies are among the stocks likely to remain in focus. SML Mahindra, IRB Infrastructure Developers and TCS may also attract attention following their latest sales, business and financial updates.\n\nTCS : The country's largest IT services company posted a net profit of \u20b9 13,884 crore in Q2, up 15% YoY from \u20b9 12,075 crore in the year-ago quarter.\n\nIts revenue from operations increased 11.2% YoY to \u20b9 73,188 crore from \u20b9 65,799 crore. The IT major kicked off the Q2 earnings season for India Inc. with its September-quarter results.\n\nNCC : The company received a major order worth \u20b9 1,286 crore from Hyderabad Growth Corridor Limited. The order is for the construction of Radial Road-2, strengthening the company\u2019s order book and infrastructure portfolio.\n\nS&S Power Switchgear : The company announced that its wholly owned subsidiary received an LOA from Sterling & Wilson for supplying 765 kV isolators for an Adani project in Maharashtra. The order is worth over \u20b9 1 crore, with delivery planned for the next financial year.\n\nHexaware Technologies : The company said that it had entered into a multi-year partnership with Anthropic and became a preferred partner in its Claude Partner Network. Claude will be integrated into Hexaware\u2019s Zerovity AI-native engineering platform and AgentVerse platform. The partnership will support outcome-based services across IT operations and software engineering.\n\nP N Gadgil Jewellers : It announced its September-quarter results, with revenue rising 22.4% YoY. Retail revenue increased 31.1%, while the franchise business grew 34.7%. Rakhi sales jumped 114%, while e-commerce revenue declined 83.6%. The company aims to open around 23 new stores in FY27.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 08:03 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fast Food\u2019s Takeover Season: Pizza, Burgers, and Now Burritos", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:03 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "StoneX raises Third Coast Bancshares stock price target on acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 08:02 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Repeated US Treasury interventions risk an erosion of credibility", "full_content": "A key policy tool to stabilise stress in markets could turn into a source of moral hazard and deeper volatility", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 08:00 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Skydance's David Ellison tells CNBC combined company is 'positioned to win in every single vertical'", "full_content": "Skydance co-CEO David Ellison told CNBC on Thursday \u2014 days after Paramount's acquisition of Warner Bros. Discovery officially closed \u2014 that the combined company is \"positioned to win in every single vertical that we operate in.\"\n\nSkydance includes film studios Paramount and Warner Bros.; the CBS broadcast network; a sprawling pay TV portfolio that includes CNN, TNT, MTV and BET; and streaming services Paramount+ and HBO Max.\n\n\"By combining Paramount and Warner Bros, we have the greatest content engine,\" Ellison said, noting blockbuster intellectual property and a strong sports portfolio. \"You're immediately getting to scale in streaming between HBO Max and Paramount+, over 200 million global streaming subscribers. ... Not to mention the Olympics internationally and an incredibly profitable linear portfolio, anchored by CBS.\"\n\nEllison and co-CEO Ynon Kreiz plan to split executive duties, with Ellison focusing on the company's creative vision, technological innovations and long-term strategy while Kreiz leads the integration of the two companies and handles day-to-day management and operations.\n\n\"We have a unique opportunity to build the next generation media and entertainment global company that is powered by creativity and technology,\" Kreiz said. \"We have the assets that David mentioned. We have the capability. We have the people. And all of this is happening at the point in time when the industry is at an inflection point, where it's getting harder and harder to reach the consumer and aggregate fans.\"\n\nKreiz is a 30-year veteran of the media space with a reputation as a turnaround man .", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:54 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Oil Rises, Nasdaq Slips After Fresh Tanker Attack \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Oil Rises, Nasdaq Slips After Fresh Tanker Attack \u2014 Live Updates WSJ Stock Market Today: Dow, S&P 500 and Nasdaq decline as tech stocks struggle and oil prices jump on threat of war resuming in Iran MarketWatch As Trump eyes a new round of major combat operations in Iran, sparking global stock selloff Fortune Oil jumps 4% as Trump rules out Iran deal, stocks slip Quartz Stock market slips as oil prices rise after Iran deal prospects fade (COMP:IND:) Seeking Alpha", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 07:52 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hundreds of new pro sports team ETFs lead world of retail investing to the edge of gambling", "full_content": "In 1989, all-time hits leader Pete Rose was banned from Major League Baseball for life because of his gambling activities. He wasn't reinstated until last year, months after his death in 2024.\n\nFast-forward to today, and Pete Rose's gambling might seem like just another day on Wall Street as financial firms expand the ways fans can put money behind their teams, beyond a beer and a $15 hot dog.\n\nYou may soon be able to buy a ticker for your favorite hockey team, and it isn't a stake in the franchise. Multiple asset managers have filed to launch dozens of ETFs, one for every NHL team, with MLB baseball team funds filed as well, all built on new futures contracts that track a team's season statistics. None has begun trading but in all, hundreds of ETFs that track the single-season performance of one professional team across a mix of statistical categories have been filed at the SEC for approval.\n\nSome finance experts see the development as lacking any nuance whatsoever.\n\n\"The line between gambling and investing has not simply been blurred, it has been erased,\" said Robert Johnson, a professor of finance at Creighton University.\n\nAmong fund companies getting in on the novel trend are VolatilityShares , LeagueShares, Roundhill Investments , and Rex Financial .\n\nNone of the four companies responded to requests for comment. Asset managers typically cannot publicly comment during the period between when funds are filed with the Securities and Exchange Commission for approval and when they become effective, if approved.\n\nRex, a Miami-based ETF issuer, announced Sept. 21 that it was launching Alpha Sports Holdings, a new subsidiary built to turn team performance into exchange-traded funds. REX has filed with the SEC for BaseballShares and HockeyShares, suites of ETFs that would track Major League Baseball and National Hockey League teams through futures contracts that CME Group, the derivatives exchange, lists on indexes built by FutureSports, an index company.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:50 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "US stocks: US markets fall as higher yields and oil prices flag inflation risk", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US markets fall as higher yields and oil prices flag inflation risk Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US markets fall as higher yields and oil prices flag inflation risk SECTIONS US stocks: US markets fall as higher yields and oil prices flag inflation risk ETMarkets.com Last Updated: Oct 08, 2026, 07:51:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks fell as crude oil prices surged and Treasury yields remained high, raising inflation concerns. Major companies like Amazon, Tesla, and Nvidia experienced losses, contributing to a broader decline in the technology sector. Investors are now focused on upcoming third-quarter earnings reports, particularly from financial institutions. The Federal Reserve is expected to keep interest rates unchanged in October, while considering future hikes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 07:49 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US jobless claims hover near 57-year low for fourth consecutive week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US jobless claims hover near 57-year low for fourth consecutive week Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US jobless claims hover near 57-year low for fourth consecutive week SECTIONS US jobless claims hover near 57-year low for fourth consecutive week Reuters Last Updated: Oct 08, 2026, 07:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a recent report, weekly unemployment claims saw a slight drop of 2,000, totaling 197,000, which suggests some stability within the job market. Nonetheless, nonfarm payroll growth remained disappointing, with just 29,000 jobs created in September. Additionally, there was an increase of 17,000 in ongoing unemployment benefits, highlighting challenges faced by new job seekers amid geopolitical uncertainties and a tightening labor pool.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 07:46 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500 slides as traders monitor Treasury yields; oil gains 4%: Live updates", "full_content": "The S&P 500 moved lower on Thursday as investors watched the moves in Treasury yields and faced pressure from elevated oil prices.\n\nThe broad market index dipped 0.3%, while the Nasdaq Composite was down 0.5%. The Dow Jones Industrial Average traded just below the flatline.\n\nThe benchmark 10-year Treasury note yield was roughly little changed at 5.277%, as was the 30-year yield at 5.646%. The 2-year Treasury yield gained more than 3 basis points to 4.802%. Those moves came after Federal Reserve Governor Christopher Waller said more hikes may be needed to curb inflation.\n\nOil prices spiked also after President Donald Trump said he doesn't want to make a deal with Iran to end the war, while the U.S. is reportedly preparing for \" massive bombing \" in the Middle East. Brent crude jumped 4% to around $104 per barrel. West Texas Intermediate futures , meanwhile, advanced 4% to around $92.\n\nKey areas of the market sensitive to higher borrowing costs such as banks and technology were under pressure yet again. Intel and Marvell Technology shares were each down more than 2%, while Bank of America and Citigroup shed around 1%.\n\nYields and oil have stoked volatility in equities of late, as concern grows that higher energy prices will keep inflation elevated and force the Federal Reserve to further raise rates.\n\nMany investors are maintaining an optimistic view of the stock market, however. They expect that the start of earnings season could give the market the fuel it needs for the next leg higher.\n\nIn the third quarter, the S&P 500 is expected post a blended earnings growth rate of roughly 30%, which would be a third straight quarter of above-25% earnings growth, according to FactSet.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:45 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Absence of AI in equities will become India's strength in a year, mkts to start attracting flows: CEA", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Absence of AI in equities will become India's strength in a year, mkts to start attracting flows: CEA The Economic Times daily newspaper is available online now. Read Today's Paper Absence of AI in equities will become India's strength in a year, mkts to start attracting flows: CEA SECTIONS Absence of AI in equities will become India's strength in a year, mkts to start attracting flows: CEA PTI Last Updated: Oct 08, 2026, 07:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chief Economic Advisor V Anantha Nageswaran indicated that India's absence of AI focus might become an advantage. He believes that if the AI boom falters, foreign investors will seek alternative growth opportunities in India. Despite currency depreciation and external challenges, India maintains strong economic fundamentals and growth. Nageswaran highlighted the manageable current account deficit and well-capitalized banking system as positive factors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 07:44 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Palantir Stock Has a Secret Weapon in the AI Boom, Goldman Sachs Says - Barron's", "full_content": "Palantir Stock Has a Secret Weapon in the AI Boom, Goldman Sachs Says Barron's Palantir Advances 3% as Goldman Sachs Upgrades to Buy With $230 Target; Salesforce and ServiceNow Hold Steady Yahoo Finance Palantir in focus as Goldman Sachs upgrades on recent underperformance (PLTR:NASDAQ) Seeking Alpha Here's What a $1,000 Investment in Palantir Stock Could Be Worth in 5 Years (Hint: It's a Lot) The Motley Fool What Are Palantir Stock Bulls Not Worried About? Trefis", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 07:40 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Small caps are suffering from higher rates, preference for AI stocks. There may soon be a buying opportunity", "full_content": "Large-cap stocks have been holding up OK despite the volatility brought on by higher Treasury yields.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 07:29 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "French bonds are suffering through their worst decade since 1803 \u2014 and investors are bracing for more pain", "full_content": "The spread between France\u2019s 10-year government bond and Germany\u2019s equivalent reached its widest last week in available Bloomberg data, dating back to 1990.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 07:22 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Parag Parikh Flexi Cap Fund: 1 stock exit, DLF sees major buying in September 2026 \u2014 key takeaways for investors", "full_content": "India\u2019s largest active mutual fund scheme by assets under management, Parag Parikh Flexi Cap Fund, has disclosed its portfolio for September 2026, showing increased exposure to select existing holdings along with one complete exit.\n\nThe fund\u2019s AUM stood at \u20b9 1,47,405 crore in August 2026, which declined to \u20b9 1,45,070 crore in September 2026.\n\nSince its inception on 24 May 2013, the fund has delivered a 17.76% return, outperforming the 13.56% return generated by its benchmark index, Nifty 500 TRI. However, its performance over the last 1 year has been weaker, with the fund declining 3.54% as of 30 September 2026, compared with a fall of 2.03% for the Nifty 500 TRI.\n\nOver a 3-year period, the fund delivered a 12.21% return compared with 9.50% for the Nifty 500 TRI. Over 5 years, the fund generated 11.15%, while the benchmark returned 9.04%.\n\nHere\u2019s a look at the key portfolio changes in this flexi-cap fund during September 2026.\n\nParikh Flexi Cap Fund completely exited Great Eastern Shipping Company from its portfolio in September.\n\nThe fund\u2019s holding in The Great Eastern Shipping Company stood at 12.74 lakh shares in August 2026, accounting for only 0.11% of AUM. This was the fund\u2019s only complete exit during the month.\n\nHowever, the fund did not add any new stock during the month.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 07:21 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TCS share price expectations for tomorrow: How Q2 results 2026 will impact Tata stock on Frid
