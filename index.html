s Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a TCS, Infosys, HCL Tech, other IT stocks jump up to 3% despite weak market sentiment. What to expect as Q2 earnings season begins? Mphasis Share Price Coforge Share Price L&T Technology Services Share Price Hexaware Technologies Share Price Tata Technologies Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TCS, Infosys, HCL Tech, other IT stocks jump up to 3% despite weak market sentiment. What to expect as Q2 earnings season begins? SECTIONS TCS, Infosys, HCL Tech, other IT stocks jump up to 3% despite weak market sentiment. What to expect as Q2 earnings season begins? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 08, 2026, 11:26:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IT stocks rose on Thursday as investors turned their attention to TCS, which is set to kick off the Q2 earnings season. Analysts expect modest sequential revenue growth, while a favourable base and margin support could aid year-on-year growth. Currency tailwinds may also support margins across Indian IT services companies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "Earnings Playbook: JPMorgan Bets On Mid- And Small-Caps To Beat Large Caps In Q2", "full_content": "Domestic demand and early festive inventory will drive growth, with small- and mid-caps expected to outpace large caps, the brokerage says.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ola Electric Mobility Shares Fall 3% After Company Approves Rs 1,000 Crore Rights Issue", "full_content": "Investors are tracking the issue of 37.03 crore Rights Equity Shares at an issue price of Rs 27 per share, expected to raise Rs 999.74 crore.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Hard To See Double-Digit Earnings Growth For H2 FY27,' Says JPMorgan's Rajiv Batra", "full_content": "Batra told NDTV Profit that Indian markets have already \"de-rated significantly\", with both the MSCI and Nifty trading below their respective price-to-earnings multiples.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "UPI MDR: October 15 Rollout May Be Deferred; Traders Bodies Seek Post-Festive Season Implementation", "full_content": "Traders' associations want the rollout to be delayed until after the festive season or early next year.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty Earnings Growth Seen At 18% In Q2FY27; BofA Favors Private Banks, Autos, Cement", "full_content": "BofA expects Nifty earnings to grow 18% year-on-year in Q2FY27, with Financials, Energy and Telecom likely to lead earnings growth. However, Healthcare and Staples could lag, with both sectors expected to report a decline in profits during the quarter.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "Can Applied Digital's AI data-centre growth drive further gains?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Can Applied Digital's AI data-centre growth drive further gains? Written by Anupam Nagar , ETMarkets.com | Oct 08, 2026, 11:21:04 AM IST 1 / 6 \u200bApplied Digital: AI data-centre bet gains momentum Applied Digital delivered a strong fiscal Q1 2027 performance, with revenue surging 322% year-on-year to $341.9 million. The company benefited from continued growth in demand for AI-focused data-centre infrastructure, while its adjusted loss narrowed sharply from the year prior. (Sources: Applied Digital, Investing.com, Simply Wall St)\n\nApplied Digital's revenue jumped to $341.9 million from $80.9 million a year earlier. Tenant fit-out services contributed $183.5 million, while base rent revenue reached $65.8 million. Adjusted EBITDA also rose sharply to $64.4 million from just $0.5 million in the year-ago quarter.\n\nApplied Digital continues to expand its AI infrastructure footprint. Polaris Forge 1 has reached 250 MW of live capacity, while the company has leases covering around 1.41 GW of critical IT load. These agreements represent approximately $36 billion in contracted revenue over their initial terms.\n\nApplied Digital has secured access to up to approximately 1 GW of potential power capacity in Finland, marking an important step in its international expansion. The first 100 MW is expected to become available in 2028, with the site being positioned as a potential large-scale European AI campus.\n\nDespite strong revenue growth, Applied Digital remains loss-making as it invests heavily in expanding its data-centre infrastructure.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:16 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Senco Gold share price surges 12% after Q2 business update - Details here", "full_content": "Senco Gold shares surged almost 12% in intraday trade on the BSE on Thursday, 8 October, a day after the jewellery company announced the business updates for the quarter ended 30 September 2026 (Q2FY27). Senco Gold share price opened at \u20b9 343.10 against its previous close of \u20b9 321.55 and jumped 11.6% to an intraday high of \u20b9 359, looking set to extend gains for the third consecutive session.\n\nIn an exchange filing on 7 October, Senco Gold said Q2 retail revenue grew by 29% year-on-year (YoY) for Q2FY27, supported by 19% growth from existing stores (SSSG growth), indicating the core strength and loyalty of the existing customer base.\n\nTotal revenue growth for the quarter was even stronger at 31% YoY.\n\nThe company said it also achieved the highest-ever topline of over \u20b9 5,000 crore in the first half of the year (H1FY27) and a landmark of \u20b9 10,000 crore sales on a trailing-twelve-month (TTM) basis.\n\nThe company launched 6 new showrooms during the quarter, taking its total network to 215 showrooms.\n\nThe company expects Q3FY27 to witness strong seasonal demand, supported by underlying affinity for gold fuelled by wedding demand, as well as a festive calendar, including Dhanteras, Diwali, Durga Puja, Karwa Chauth, Chhath Puja, and Christmas.\n\n\"With the monsoon season now behind us, improving rural sentiment, the festive season and the upcoming wedding calendar are expected to provide a more supportive demand environment in the second half of the year (H2FY27). The underlying, with wedding and festive demand providing resilience,\" said the company.\n\nThe company underscored that the underlying jewellery consumption opportunity remains strong despite elevated gold prices.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 01:02 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TCS Q2 Results 2026 Today: What to expect and what street expects from revenue, profit, margins and AI deal wins", "full_content": "TCS Q2 Results 2026 Today : IT major Tata Consultancy Services (TCS) is set to announce its second-quarter results for FY27 on Thursday, 8 October, with investors closely watching revenue growth, profitability, margins and the pace of artificial intelligence-led deal wins.\n\nMarket analysts expect TCS to report a relatively muted quarter, with constant-currency revenue growth likely to remain subdued. While large deal wins and seasonal tailwinds could support performance, softer discretionary spending, geopolitical uncertainty and pricing pressure remain key concerns.\n\nKunal Bajaj, Research Analyst at Choice Institutional Equities, expects TCS to report flat quarter-on-quarter (QoQ) organic constant-currency revenue growth in Q2FY27.\n\nAccording to Bajaj, growth is likely to be supported by the international business, along with steady execution in the banking, financial services and insurance (BFSI) and Technology and Services segments. However, this could be offset by continued softness in the Consumer vertical.\n\nAI-led productivity gains are also emerging as a key challenge for the sector. Bajaj said productivity improvements are increasingly translating into deflation in the existing business book, putting pressure on traditional revenue growth.\n\nSeema Srivastava, Senior Research Analyst at SMC Global Securities, expects TCS to deliver steady Q2FY27 numbers, supported by seasonal tailwinds, operational efficiencies and healthy deal intake. She highlighted large contracts such as BSNL, MHP and Metro as potential growth drivers.\n\nHowever, Srivastava anticipates geopolitical uncertainty and softer demand during parts of the quarter to limit constant-currency growth.\n\nWhile analysts expect muted revenue growth, TCS\u2019s profitability is likely to remain supported by operational efficiencies and its strong balance sheet.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 01:00 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures move lower after S&P 500 retreats from record: Live updates", "full_content": "U.S. stock futures were lower early Thursday, after the S&P 500 retreated from its record as yields spiked to multidecade highs.\n\nDow Jones Industrial Average futures fell 132 basis points, or 0.26%. S&P 500 futures dipped 0.15%, and Nasdaq-100 futures were 0.21% lower.\n\nLevi Strauss shares dipped almost 2% in extended trading after the denim retailer lowered its revenue growth guidance for the full year, though it also raised its profit outlook.\n\nWall Street is coming off a losing session. The S&P 500 dipped 0.2%, pulling back from an all-time high it reached just one day prior. The Dow fell more than 340 points, or 0.7%. The Nasdaq Composite slid 0.2%.\n\nThe Treasury on Wednesday sold $39 billion of 10-year notes, drawing solid demand with indirect bidders \u2014 including global central banks \u2014 taking more than 80% of the auction, above a 10-auction average of 72.4%. The sale helped the 10-year Treasury note yield ease off its 24-year high during Wednesday's session. The Treasury is set to sell $22 billion of 30-year bonds later Thursday.\n\nThe 10-year Treasury note yield was last seen 4 basis points higher at 5.3178%, with the 30-year Treasury note yield up 4 basis points at 5.7064%.\n\nIn Asia, Japan's Nikkei 225 was down 1.12% while South Korea's Kospi lost 2.04%. Australia's S&P/ASX 200 was 0.64% lower. Mainland China's CSI 300 declined 0.43%, while Hong Kong's Hang Seng Index dropped 0.69%.\n\nHigher yields have curbed investor appetite for equities in recent weeks, especially those parts of the market most hurt by higher borrowing costs. Industrials, for example, is the worst performing sector week to date.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:57 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "New IPO listings today: Discount or premium and gains? Vishal Nirmiti vs Nityas Gems - Check worst and best", "full_content": "Nityas Gems & Jewellery shares made a positive debut on the stock exchanges on October 8, listing at a premium of around 9% over the IPO price on the BSE. The stock was later locked in a 5% upper circuit and traded more than 14% above its issue price.\n\nThe stock listed at \u20b9 82 per share on the BSE, marking a 9.33% premium over the IPO price of \u20b9 75. On the NSE, the shares debuted at \u20b9 80, representing a 6.67% premium over the issue price.\n\nNityas Gems & Jewellery is engaged in the design, manufacturing and sale of lab-grown diamond-studded gold jewellery in India. The company raised \u20b9 108.42 crore through its IPO, which comprised 1.4456 crore equity shares with a face value of \u20b9 5 each. The price band was fixed at \u20b9 70\u201375 per share, with a lot size of 200 shares.\n\nThe IPO opened for subscription on 30 September and closed on 5 October, with anchor bidding taking place on 29 September. The issue proceeds will be used to meet working capital requirements and for general corporate purposes.\n\nThe IPO had a reservation of not more than 50% for qualified institutional buyers (QIBs), not less than 15% for non-institutional investors (NIIs) and not less than 35% for retail investors.\n\nVishal Nirmiti shares, meanwhile, made a weak debut on 8 October and were later locked in a 5% lower circuit. The stock was down 7.16% from its IPO price at \u20b9 204.25 on the BSE.\n\nThe shares listed at \u20b9 215 on both the BSE and NSE, a discount of 2.27% to the issue price of \u20b9 220. The stock later fell to \u20b9 204.25 on the BSE, translating into a 7.15% discount to the IPO price.\n\nThe \u20b9 178 crore IPO of Vishal Nirmiti comprised a fresh issue of up to 69.71 lakh equity shares worth \u20b9 145 crore and an offer for sale (OFS) of 15 lakh shares worth \u20b9 33 crore at the upper end of the price band. The IPO price band was \u20b9 208\u2013220 per share.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:54 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Thai central bank in no rush to raise rates, governor says", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:48 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Multibagger stock! Cupid shares jump 4%, soar 238% in 2026. What's driving the rally?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Multibagger stock! Cupid shares jump 4%, soar 238% in 2026. What's driving the rally? National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Multibagger stock! Cupid shares jump 4%, soar 238% in 2026. What's driving the rally? SECTIONS Multibagger stock! Cupid shares jump 4%, soar 238% in 2026. What's driving the rally? By Kumar Gaurav , ETMarkets.com Last Updated: Oct 08, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Cupid shares rose 3.76% to hit a high of Rs 356.90 on Thursday, extending their rally since the September 30 business update to around 16%. The stock has gained 238.78% in 2026 so far, sharply outperforming the Nifty 50, which is down 14% over the same period.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 12:44 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Paytm shares crash 10%, wipe off Rs 10,970 crore m-cap. More pain ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Paytm shares crash 10%, wipe off Rs 10,970 crore m-cap. More pain ahead? One97 Communications Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Paytm shares crash 10%, wipe off Rs 10,970 crore m-cap. More pain ahead? SECTIONS Paytm shares crash 10%, wipe off Rs 10,970 crore m-cap. More pain ahead? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 08, 2026, 12:43:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Paytm shares crashed on Wednesday after reports suggested a possible delay in the rollout of UPI MDR. Analysts said the stock faces immediate support at Rs 1,560-1,550, while a decisive break below could trigger further selling.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 12:43 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bitcoin clings to $83K below key averages: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:42 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Silver breaks $60 support, targets $58.46: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:42 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Hang Seng tests 23,734 support as bears dominate: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:41 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "\u20b950 lakh income-tax case: ITAT quashes reassessment after tax department issued notice beyond the legal deadline", "full_content": "A taxpayer who had declared \u20b9 50 lakh under the Income Declaration Scheme (IDS), 2016, but could not complete the process after a bank-related payment issue, has received relief from the Income Tax Appellate Tribunal (ITAT). In Harshali Lavishkumar Jain v. ITO, Ward-1(2)(1), Surat (ITA No. 1463/SRT/2025), the Surat bench quashed the reassessment after finding that the tax department's fresh notice under section 148 was issued beyond the permissible time limit.\n\nThe case relates to the assessment year 2017-18. Jain had filed her return declaring income of \u20b9 6.88 lakh. The tax department later received information that she had declared \u20b9 50 lakh under IDS 2016 for assessment year 2012-13 but had not completed the declaration process by submitting Form-4, the certificate of final acceptance. The department subsequently reopened her assessment and eventually added the entire \u20b9 50 lakh as unexplained income.\n\nUnder IDS 2016, Jain had declared \u20b9 50 lakh and claimed that she had paid the required tax of \u20b9 22.50 lakh. However, she said a payment of \u20b9 5.625 lakh could not be credited to the government's account before the deadline because of a technical error at the bank's end.\n\nAccording to her submissions before the tribunal, the bank issued a certificate acknowledging the error. She argued that the assessing officer had also accepted that the full \u20b9 22.50 lakh tax had ultimately been paid, but Form-4 could not be submitted because of the payment issue.\n\nThe assessing officer nevertheless treated the \u20b9 50 lakh as unexplained income and added it under \"income from other sources\". The assessment was completed under section 147 read with sections 144 and 144B in May 2023. The taxpayer challenged the addition, but the Commissioner of Income Tax (Appeals) dismissed her appeal.\n\nBefore the ITAT, Jain also challenged the validity of the reassessment notice itself.\n\nThe original notice under section 148 had been issued on 30 June 2021, under the old reassessment regime.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 12:39 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "AI startup Manus raises $500 million in first funding round since Meta breakup", "full_content": "AI agent startup Manus has raised more than $500 million in its first funding round since Meta was forced to abandon its acquisition of the company.\n\nButterfly Effect, Manus' parent company, said Thursday that the round was led by private equity firm Boyu Capital and venture investor IDG Capital, with follow-on investment from existing shareholders Tencent , HSG and ZhenFund.\n\nThe company did not disclose its post-funding valuation. Bloomberg reported last month that Manus was set to double its valuation to $4 billion in this financing round, making it the country's most valuable AI agent maker.\n\nThe raise suggests investors aren't deterred by Beijing's unprecedented order to block Meta's short-lived $2 billion acquisition. Meta was working to integrate Manus' team and technology into its system when authorities blocked the deal. It also shows that appetite for AI-agent startups has held up, even as the underlying foundation models improve quickly and price competition intensifies.\n\n\"The fundraising shows that the short-term fallout of the Meta case has been contained and investors are willing to back Manus as an independent company,\" said Dan Wang, China director at Eurasia Group, also noting the renewed confidence in the commercial potential of AI agents.\n\nManus could ultimately aim for a public listing but the more imminent task would be revamping its business and ownership structure to prove profitability and align with Beijing's regulatory requirement, analysts say.\n\n\"The immediate task for Manus now is proving scale, profitability and regulatory alignment,\" said Han Lin, China country director at The Asia Group.\n\nEarlier this month, Manus said it had resumed independent operations after its split from Meta and that its founding team would continue to push forward generative AI agents for users globally.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 12:29 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Indian firms seen posting faster profit growth despite global headwinds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Indian firms seen posting faster profit growth despite global headwinds State Bank of India Share Price Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Indian firms seen posting faster profit growth despite global headwinds SECTIONS Indian firms seen posting faster profit growth despite global headwinds Reuters Last Updated: Oct 08, 2026, 12:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian companies are projected to achieve profit growth during the September quarter despite various challenges affecting different sectors. Foreign investors are retreating from Indian stocks, impacting the benchmark Nifty 50 index's performance this year. Strong domestic demand and favorable conditions in certain sectors are expected to sustain earnings growth for many firms. Analysts believe that financials will be a significant driver of earnings, supported by healthy loan growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 12:28 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Shyam Metalics Q2 volumes shine; capex, value addition central to medium-term growth", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nShyam Metalics and Energy\u2019s shares gained over 5% after reporting that its September quarter (Q2FY27) consolidated sales volume rose 26% year-on-year (y-o-y) to 1.5 million tonnes. September was a strong month, with volumes rising 32% y-o-y and revenue growing almost 40% to over \u20b9 2,000 crore.\n\nThe integrated metal producer also announced a memorandum of understanding with the Maharashtra government on Monday to set up a 9 million tonne per annum (mtpa) integrated steel plant in Chandrapur, entailing an investment of \u20b9 50,000 crore.\n\nThe Q2 volume growth marks a significant improvement versus 8% y-o-y growth in Q1. Blended realization increased by about 7% in Q2, although some of the benefit is likely to be offset by higher coking coal prices.\n\nThus, revenue growth for H1FY27 now stands at 29% compared with the management\u2019s guidance of 20% growth for FY27. The Q1 Ebitda had risen by 32% to \u20b9 765 crore, as against the company\u2019s 20% growth guidance for FY27.\n\nSeveral levers support medium-term profit growth. The company is undertaking projects entailing capital expenditure of about \u20b9 14,000 crore and has already spent \u20b9 3,300 crore. This will increase its capacity to 14.6 mtpa across various categories of steel, intermediates and aluminium products by FY31, from the current 9 mtpa.\n\nCaptive renewable power generation is expected to help lower energy costs . The company targets a 600-700 basis point increase in return-on-equity under its Vision 2031 from about 10% in FY26.\n\nHowever, the bigger gains could come from prudent capital deployment and faster project execution.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:24 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock market crash: Terrible Thursday for Sensex, Nifty as over \u20b97 lakh cr investors wealth eroded - what went wrong?", "full_content": "Stock market crash: Bears took charge on Dalal street as Nifty fell nearly 1.11%, and Sensex was down close to 700 points during Thursday\u2019s intraday trading session. Crude oil price volatility, elevated US treasury yields, FII selling, Rupee weakness, and the Reserve Bank of India (RBI) repo rate decision were among the key factors that dragged the Indian stock market lower on October 8.\n\nMeanwhile, stock market investors eagerly await the Tata Consultancy Services (TCS) result for the second quarter. The IT heavyweight is scheduled to announce Q2FY27 result post market trading session on Thursday. Nifty 50 was trading 1.08% lower at 22,359 points at 12:16 pm on October 8. Whereas, BSE Sensex was down 755 points at 71,883.\n\nThe weakness in the Indian stock market today was largely driven by the hawkish stance by the RBI. The Central Bank raised the repo rate by 25 basis points on Wednesday, for the first time since February 2023.\n\n\u201cThe recent rise in the repo rate by 25 basis points has made investors more apprehensive about liquidity and cost of borrowing. With the global markets also coming under pressure, investors have turned defensive. In the short run, volatility will stay high, and the course of the market will depend on quarterly results, crude prices, and the RBI,\u201d explained Siddharth Maurya, Founder & Managing Director, Vibhavangal Anukulakara Pvt. Ltd.\n\nContinued foreign selling, high bond yields, concerns around sticky inflation further contributed. \u201cThe weakness seen today in the market is largely attributed to the hawkish stance of the RBI, increasing crude prices, and continued foreign selling. Increasing crude prices are fueling worries about inflation, and high bond yields and weakening rupee are other reasons why investors are remaining cautious,\u201d explained Maurya.\n\nThe 10-year US Treasury yield is hovering around 5.3%, which makes it an attractive investment option for foreign institutional investors (FIIs).", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:23 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "TCS Q2 Results 2026 Today: 5 triggers could decide share price's next move post earnings announcement | Experts' view", "full_content": "TCS Q2 Results 2026 Today: The IT major Tata Consultancy Services (TCS) is going to declare its Q2 results 2026 today. The market is expecting stable second-quarter numbers from the Tata Group company. As TCS share has remained under selling pressure throughout the year, losing around 35% YTD, TCS shareholders would be keen to find a trigger that may attract Dalal Street bulls post the announcement of TCS Q2 results 2026 .\n\nAccording to stock market experts, TCS results are expected post-market close today, and it will have an impact on TCS's share price movement when the market reopens on Friday. They highlighted that AI-led revenue and guidance, deal wins and net revenue generated during the July to September 2026 quarter is expected to remain under the observations of Indian market observers. However, margins and dividends would be additional triggers expected to dictate TCS's share price movement post- TCS Q2 results today .\n\nSpeaking on the major triggers, which are expected to dictate TCS share price movement post-TCS Q2 results today, Mahesh M Ojha, VP \u2014 Research at KC Securities, said, \"The top 5 triggers, which are expected to dictate TCS share price movement post-earnings, are: revenue growth, margins, deal wins, AI-led revenue and guidance, and dividend .\n\nSpeaking on the first trigger post-TCS Q2 results for the TCS shares, Mahesh M Ojha said, \u201cThe market estimates growth in the company's revenue in terms of YoY and QoQ; however, it is not very bullish on the revenue growth. So, the exact revenue growth will be in focus of both bulls and bears, when the TCS Q2 results 2026 is announced today.\u201d\n\nHighlighting the importance of margins in TCS Q2 results today, Anuj Gupta, a SEBI-registered market expert, said, \u201cAmid a weak Indian Rupee against the US Dollar, the company's report on the margins will be an important takeaway for the market investors.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:21 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TSMC\u2019s September sales surge year-over-year as AI drives chip demand", "full_content": "The world's largest contract chipmaker Taiwan Semiconductor Manufacturing Co posted revenue of $511.86 billion New Taiwan dollars ($16.03 billion) for September, up 54.6% on the year prior, but down 0.6% on August .\n\nThe company closed 1.35% lower ahead of releasing monthly figures.\n\nShares of TSMC TSMC, which counts Nvidia and Apple among its customers, has been a major beneficiary of surging demand for advanced AI chips.\n\nIn September, TSMC committed to using ASML's High NA extreme ultraviolet lithography machines, a key technology for producing more advanced chips, joining Samsung Electronics among customers adopting the technology.\n\nIt is scheduled to report its third-quarter earnings next week.\n\nCorrection: The story has been updated to reflect that sales did not hit a record high in September.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 12:20 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GST Council meet: Scrapping tax officers' arrest powers, decriminalisation among reforms on agenda", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST Council meet: Scrapping tax officers' arrest powers, decriminalisation among reforms on agenda The Economic Times daily newspaper is available online now. Read Today's Paper GST Council meet: Scrapping tax officers' arrest powers, decriminalisation among reforms on agenda SECTIONS GST Council meet: Scrapping tax officers' arrest powers, decriminalisation among reforms on agenda PTI Last Updated: Oct 08, 2026, 12:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The GST Council is poised to address significant reforms that could transform GST compliance for businesses. Among the proposed measures are the removal of arrest powers held by GST officers and higher thresholds for criminal prosecution. Small e-commerce sellers might find it easier to register through platform warehouses without needing tax officer intervention.\n\nIndia's GST Revolution: How India\u2019s biggest indirect tax reform changed its economy and its way of doing business\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail", "source": "Economic Times Economy", "pub_date_str": "08 Oct 2026, 12:16 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Is Stock Market Crashing Today? Crude Jitters, RBI Tone Among 3 Reasons Behind D-Street Selloff", "full_content": "Nifty 50 cracked below 22,400 in the first half of trade, whereas Sensex slumped over 700 points. Here's a look at what led to the markets tumbling in early trade.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 12:13 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "UPI MDR rollout delayed? 0.4% fee on payments above \u20b92,000 may start in January 2027", "full_content": "India is considering delaying the implementation of a proposed fee on large-value transactions through the Unified Payments Interface (UPI) by a few months, Reuters reported on Thursday, citing a regulatory official and an industry executive familiar with the discussions.\n\nThe proposed 0.4% fee on merchant transactions above \u20b9 2,000 was scheduled to take effect from 15 October. A final decision has not yet been taken by the National Payments Corporation of India (NPCI), the sources told Reuters.\n\nThe delay, if approved, could push the implementation to January, giving payment companies more time to upgrade their systems and allowing merchants to navigate the upcoming festive shopping season without an immediate change to UPI payment costs.\n\nThe development comes after India moved last month to introduce a charge on large UPI merchant transactions, ending more than six years of zero-cost UPI payments. The proposed fee is an interchange or merchant-side charge and does not mean consumers will directly pay 0.4% every time they make a UPI payment.\n\nUPI has become a major part of India's payments ecosystem, with more than 500 million users. NPCI data shows that UPI processed 24.51 billion transactions worth \u20b9 29.82 lakh crore in August 2026.\n\nThe proposed 15 October implementation would have coincided with India's festive season, when consumer spending typically rises sharply. According to the sources cited by Reuters, postponing the rollout could prevent disruptions to retail payments during this period while giving payment companies additional time to prepare.\n\nThe industry is also expected to use the additional time to upgrade systems and work out how the new fee will be handled without passing the cost on to consumers.\n\nThe proposed charge has already faced opposition from retailers and a large broker. Its introduction was expected to create a new monetisation opportunity for digital payments companies, which could receive a share of the fee.", "source": "LiveMint Money", "pub_date_str": "08 Oct 2026, 12:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "PC Jeweller share price jumps over 7% on Q2 update | Stock up 54% YTD \u2014 What lies ahead?", "full_content": "PC Jeweller shares jumped over 7% on Thursday, 8 October, after the jewellery retailer reported a strong second-quarter business update, with consolidated revenue rising 28% year-on-year in Q2 FY27 amid healthy consumer demand.\n\nThe company also highlighted its improved financial position after becoming debt-free during the September quarter. PC Jeweller said it had repaid the outstanding debt of all 14 consortium banks, with repayments completed ahead of their scheduled due dates.\n\nThe company had opted for a one-time settlement (OTS) with its consortium of banks in September 2024 to resolve its outstanding dues. Its total debt at the time was around \u20b9 3,000 crore.\n\nAccording to a regulatory filing, consolidated revenue grew around 28% year-on-year during July-September 2026.\n\nPC Jeweller also received \u20b9 142 crore in remittances from outstanding export debtors during the quarter, it said.\n\nThe company said achieving debt-free status will help reduce its interest costs going forward, which is expected to support profitability and strengthen its balance sheet.\n\n\u201cDuring the September quarter, the company achieved debt-free status after successful repayment of outstanding debt of all the banks, with all repayments completed ahead of the scheduled due dates,\u201d PC Jeweller said.\n\n\u201cWith no bank debts outstanding, the company will be saving on the interest cost in the future, which will positively impact its bottom line and strengthen its balance sheet,\u201d it added.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ET Alpha Wealth Summit 2.0: Bear markets can breed best investment ideas, says Nilesh Shah", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a ET Alpha Wealth Summit 2.0: Bear markets can breed best investment ideas, says Nilesh Shah The Economic Times daily newspaper is available online now. Read Today's Paper ET Alpha Wealth Summit 2.0: Bear markets can breed best investment ideas, says Nilesh Shah SECTIONS ET Alpha Wealth Summit 2.0: Bear markets can breed best investment ideas, says Nilesh Shah By Surbhi Khanna , ET Online Last Updated: Oct 08, 2026, 11:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nilesh Shah from Kotak Mutual Fund highlights the advantage of bear markets in uncovering robust investment opportunities. He points out that India's growth potential surpasses that of South Korea due to its remarkable talent pool and infrastructure. Shah advises diversifying portfolios ober.\n\nTCS may announce a muted quarter-on-quarter (QoQ) constant currency (CC) revenue growth for Q2FY27, according to experts. Steady execution in BFSI and 'technology and services' is likely to be offset by softness in the consumer vertical.\n\nInvestors' focus is likely to be on the demand environment, the pace of revenue growth, and further clarity on the partnership with Porsche.\n\nAlong with its Q2FY27 financial results, the IT major is also expected to announce a second interim dividend today.\n\nThe IT stock climbed almost 3% in the morning session on Thursday, rising to an intraday high of \u20b9 2,142, looking set to snap its two-day losing run.\n\nShare performance before and after Q2FY26 results: TCS reported its Q2FY26 results after market hours on 9 October 2025. The stock rose 1.16% on the day of the results and declined 1.10% the next day on the BSE after the results announcement. The company's revenue at \u20b9 65,799 crore increased 3.7% QoQ and 0.8% in constant currency.\n\nShare performance before and after Q3FY26 results: The IT major reported its Q3FY26 results after market hours on 12 January 2026. The stock rose 0.86% on the result day. It extended gains for the second consecutive session on the next day, rising 1%, on the BSE. The company reported a 2% QoQ increase in revenue to \u20b9 67,087 crore, while in CC terms, revenue grew by 0.8% QoQ.\n\nShare performance before and after Q4FY26 results: TCS reported its Q4FY26 results after market hours on 9 April 2026. The stock jumped 1.09% on the result day, but after the result announcement, it dropped 2.45% on the next day on 10 April. TCS revenue in the quarter increased by 1.2% QoQ in CC.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 11:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title lyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty Earnings Growth Seen At 18% In Q2FY27; BofA Favors Private Banks, Autos, Cement", "full_content": "BofA expects Nifty earnings to grow 18% year-on-year in Q2FY27, with Financials, Energy and Telecom likely to lead earnings growth. However, Healthcare and Staples could lag, with both sectors expected to report a decline in profits during the quarter.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Can Applied Digital's AI data-centre growth drive further gains?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Can Applied Digital's AI data-centre growth drive further gains? Written by Anupam Nagar , ETMarkets.com | Oct 08, 2026, 11:21:04 AM IST 1 / 6 \u200bApplied Digital: AI data-centre bet gains momentum Applied Digital delivered a strong fiscal Q1 2027 performance, with revenue surging 322% year-on-year to $341.9 million. The company benefited from continued growth in demand for AI-focused data-centre infrastructure, while its adjusted loss narrowed sharply from the year prior. (Sources: Applied Digital, Investing.com, Simply Wall St)\n\nApplied Digital's revenue jumped to $341.9 million from $80.9 million a year earlier. Tenant fit-out services contributed $183.5 million, while base rent revenue reached $65.8 million. Adjusted EBITDA also rose sharply to $64.4 million from just $0.5 million in the year-ago quarter.\n\nApplied Digital continues to expand its AI infrastructure footprint. Polaris Forge 1 has reached 250 MW of live capacity, while the company has leases covering around 1.41 GW of critical IT load. These agreements represent approximately $36 billion in contracted revenue over their initial terms.\n\nApplied Digital has secured access to up to approximately 1 GW of potential power capacity in Finland, marking an important step in its international expansion. The first 100 MW is expected to become available in 2028, with the site being positioned as a potential large-scale European AI campus.\n\nDespite strong revenue growth, Applied Digital remains loss-making as it invests heavily in expanding its data-centre infrastructure.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jefferies cuts target prices for BSE, Turtlemint & other stocks ahead of Q2 results. Check list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Jefferies cuts target prices for BSE, Turtlemint & other stocks ahead of Q2 results. Check list Written by Debaroti Adhikary , ETMarkets.com | Oct 08, 2026, 11:13:32 AM IST 1 / 7 \u200bTarget Reset As the Q2 earnings season approaches, Jefferies has cut target prices for BSE, Turtlemint and several other non-lending financial stocks. The brokerage prefers Groww, Star Health, MCX, ICICI General Insurance, Max Financial, Nuvama and KFin Tech. Here\u2019s a list of the non-lending financial stocks on which Jefferies has slashed its target prices.\n\nJefferies cut its target price for the shares of BSE to Rs 2,840 apiece from Rs 2,940 apiece, while maintaining its \u2018Underperform\u2019 rating on the stock. Lower VIX and CAS-related issues resulted in BSE's September 2026 option ADTO falling 15%, translating to 16% sequentially lower profit, the international brokerage said.\n\nAlso read | RBI hikes rate, but analysts see shift to \u2018calibrated tightening\u2019 as bigger takeaway. How can this impact markets?\n\nJefferies cut its target price for CAMS to Rs 910 from Rs 960, while maintaining a 'Buy' rating. The brokerage noted CAMS is the leader in the Rs 20 billion RTA market, accounting for 4 out of the 5 largest mutual funds partners. This is a function of its tech, long-term relationships, and compliance focus, it added. \u201cWe expect revenue growth over FY26-29 to be led by MF AUM growing at 13% CAGR and non-MF businesses growing at 21%,\u201d it said. While EBITDA margin has contracted in FY26, the brokerage expects a 140 bps recovery in FY27, led by recovery in MF RTA growth and improvement in non-MF business margin.\n\nJefferies cut its target price for Go Digit to Rs 350 from Rs 380, while maintaining a 'Buy' rating. Multi-line insurers continue to face intense competition in the fire and motor categories, limiting overall growth.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:06 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: EMs see first foreign outflow since June as Fed turns hawkish", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: EMs see first foreign outflow since June as Fed turns hawkish Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: EMs see first foreign outflow since June as Fed turns hawkish SECTIONS Global Market: EMs see first foreign outflow since J a Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper ITC shares slide 3% on block deal buzz; FMCG giant down 29% in 2026 SECTIONS ITC shares slide 3% on block deal buzz; FMCG giant down 29% in 2026 By Kumar Gaurav , ETMarkets.com Last Updated: Oct 08, 2026, 11:02:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ITC shares witnessed a drop on Thursday amid reports of likely block deals, with nearly 39 crore shares changing hands across the NSE and BSE. The identities of the buyers and sellers involved in the reported transactions were not immediately known.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 11:02 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "America shut out Chinese EVs. Britain welcomed them \u2014 and now faces a difficult choice", "full_content": "The U.K. broke with the U.S. by opening its doors to China's electric vehicle juggernaut .\n\nChinese EVs face only a 10% standard import duty in Britain, one of the largest major overseas markets without additional China-specific tariffs. Japan and Norway also lack them.\n\nIt's in contrast to the U.S., where a 100% tariff effectively shut Chinese EVs out. The European Union , the U.K.'s biggest trading partner, has manufacturer-specific duties on Chinese EVs of up to 35.3%, in addition to a standard 10% import duty on all foreign cars.\n\nNow, the U.K. faces a difficult choice, as EU proposals may force it to impose tariffs to match the bloc's.\n\nAt the weekend, The Sunday Times reported that U.K. Business Minister Jonathan Reynolds is considering matching the EU's levy on Chinese EVs to avoid the pain of so-called \" Made in Europe \" proposals, which could hurt domestic companies selling into the EU.\n\nA U.K. government spokesperson reiterated to CNBC that it had not imposed tariffs on Chinese EVs but added: \"We continue to engage closely with industry so that our approach reflects the sector's and UK's national interests.\"\n\nThe Made in Europe legislation, part of the EU's Industrial Accelerator Act , is designed to protect the bloc's industries from unfair international competition by prioritizing European-made goods.\n\nAn EU official told the Financial Times in September that London would need to raise tariffs on Chinese EVs and align more closely with EU trade policy to avoid \"Made in Europe\" barriers.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 11:00 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Q2 Results Live Updates: TCS Gains Ahead Of Earnings; GM Breweries, Grand Oak Among 7 Companies' In Focus", "full_content": "Q2 Earnings Live Updates: TCS will be the key earnings event to watch, with the country's largest IT services company expected to post modest sequential growth amid a mixed demand environment.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 11:00 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Elon Musk blames Indian 'oligarchs' for stalling Starlink launch", "full_content": "SpaceX founder Elon Musk has accused vested interests of blocking the launch of his company's satellite internet service, Starlink, to protect their hold over consumers, calling it \"a crime against the people of India\"\n\nThe country's telecom and internet service market is dominated by Reliance Chairman Mukesh Ambani's Jio and Sunil Mittal's Airtel , with both companies together holding over 80% market share .\n\n\"We are being blocked by certain oligarchs in order to maintain their monopolistic chokehold on the Indian people,\" Musk said Wednesday stateside in a post on X, without naming his rivals. \"You can guess who they are,\" he said.\n\nOn Thursday, the Indian government said suggestions that its regulatory framework was unfair or discriminatory were \" baseless and misconceived .\"\n\nLicenses have been granted to three global satellite communication services providers, the government said, without naming the companies, adding that every licensee was \"required to demonstrate compliance with security conditions.\" Starlink received the government license last year.\n\nIn a second post, Musk said Starlink in India would \"enable high-speed, affordable internet connectivity for those who cannot afford current prices.\" At present, Reliance Industries-owned Jio is the country's largest telecom operator and has been widely credited for slashing high-speed mobile data costs in the country since the company's launch a decade ago.\n\nIn June, Jio Platforms announced plans to roll out low-orbit satellite communications in the country. Akash Ambani, the son of Mukesh, told shareholders that the company is partnering with leading global constellation providers to lease satellite capacity as it looks for a quick rollout of satellite connectivity.\n\nSpaceX last year had announced deals with Jio and India's second-largest telecom service provider, Bharti Airtel , to roll out Starlink internet services across India.", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 10:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why is the stock market down today? 3 factors behind Sensex, Nifty 50 fall", "full_content": "The domestic benchmark indices extended their losses on Thursday, October 8, after the Reserve Bank of India\u2019s hawkish rate hike raised concerns over tighter financial conditions, while rising crude oil prices added to inflation worries.\n\nThe Nifty 50 fell 0.76% to 22,424.70, while the BSE Sensex declined 0.63% to 72,187.97, as of 10:39 IST.\n\nThe sell-off was broad-based, with 14 of the 16 major sectoral indices trading lower. The broader market also came under pressure, with both the Nifty Midcap and Smallcap indices falling around 0.8% each.\n\nHowever, the IT sector bucked the broader trend, gaining 1.8%, led by a 2.5% rise in Tata Consultancy Services (TCS) ahead of its September-quarter earnings announcement later in the day.\n\nGaurav Arora, Head of Research at SAHI, said the market decline is more than a knee-jerk reaction to the RBI policy, with the broader macro backdrop turning increasingly risk-off.\n\nHe pointed to a combination of rising domestic interest rates, crude oil prices above $100 a barrel, a weaker rupee and elevated US Treasury yields as key pressures on equities. Arora said rallies are likely to face selling pressure until either oil prices or US yields cool, while rate-sensitive and high-valuation segments could remain under pressure.\n\nThe decline comes a day after the Nifty 50 and Sensex snapped a two-session winning streak on Wednesday, following the RBI\u2019s decision to raise the benchmark repo rate by 25 basis points to 5.5%. The hike marked the central bank\u2019s first rate increase in nearly four years, as it sought to address mounting inflationary pressures amid strong economic growth.\n\nOn the institutional front, foreign institutional investors (FIIs) remained heavy sellers on Wednesday, offloading equities worth over \u20b9 6,121 crore. Meanwhile, domestic institutional investors (DIIs) provided some support, making net purchases of around \u20b9 4,596 crore.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 10:53 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This Adani Group share is among Jefferies India's top 3 picks despite the RBI's 25 bps Repo Rate hike", "full_content": "The Jefferies India report says power companies have some protection against hikes between regulated equity, fixed rate loans and lower rate hike pass through", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 10:50 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ET Alpha Wealth Summit 2.0: Will the AI bet pay off? Nilesh Shah weighs in", "full_content": "At ET Alpha Wealth Summit 2.0, Kotak Mutual Fund\u2019s Nilesh Shah highlighted the uncertain payoff from massive investments in artificial intelligence. Shah said the global economy has faced repeated disruptions over the past six years, while shifting capital flows, AI and emerging economic powerhouses are reshaping investment opportunities and the next phase of wealth creation.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 10:48 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why is market crashing today? Sensex slumps 900 points, Nifty below 22,300. 7 key factors behind Rs 8 lakh crore wipeout", "full_content": "Sensex Nifty Down: On Thursday, there was a notable decline in the Indian stock market, marked by a drop of over 1% in both Sensex and Nifty. This downturn was attributed to the RBI's tightening policies and ongoing selling by foreign institutional investors. Sensex plunged over 700 points while Nifty fell by more than 200 points, greatly impacting major companies like ITC and Reliance Industries.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 10:46 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tata Consumer Shares In Focus: Motilal Oswal Sees 27% Upside As Growth Portfolio Scales Up; Check Target Price", "full_content": "The brokerage highlights that the FMCG major's growth portfolio has scaled up significantly, increasing its contribution to India business from 8% in FY21 to 31% in FY26, driven by the rapid expansion of Tata Sampann, Tata Soulfull, Capital Foods, Organic India and RTD beverages.", "source": "NDTV Profit", "pub_date_str": "08 Oct 2026, 10:38 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Reliance shares may be a cheaper way to buy Jio Platforms after its listing", "full_content": "Reliance Industries' share price is seen implying anywhere between 25% and 36% discount on its two-thirds stake in Jio Platforms, which is set to IPO this month.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 10:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "RBI rate hike done. Now what\u2019s ahead for bank stocks? Jefferies, other analysts weigh in", "full_content": "RBI\u2019s first rate hike in nearly four years has put the spotlight on banking stocks, with analysts divided on the near-term impact on margins. Jefferies sees large private banks such as ICICI Bank and Kotak Mahindra Bank as key beneficiaries, while Q2 earnings could offer clues on the sector\u2019s outlook.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 10:28 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "08 Oct 2026, 01:06 PM IST", "total_stories": 356};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
