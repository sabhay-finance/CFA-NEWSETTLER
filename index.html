    const allData = {"general": [{"title": "Reid Hoffman gives millions to Dems in late spending spree as Epstein fight spills into election", "full_content": "Billionaire venture capitalist Reid Hoffman has put $8 million into the Democratic Party of Wisconsin over the past five weeks to help the party's gubernatorial nominee David Crowley in his race against Republican Tom Tiffany.\n\nThe LinkedIn co-founder gave $2 million on Sept. 24, $1 million on Oct. 2 and another $5 million in two installments on Oct. 5 and Oct. 20, according to Wisconsin campaign finance records . The rapid-fire checks are part of a last-minute spending spree by some of America's richest donors before Election Day .\n\nIn just the past week and a half, former New York City Mayor Michael Bloomberg gave Democratic Texas gubernatorial nominee Gina Hinojosa $750,000, while Y Combinator co-founder Jessica Livingston chipped in another $150,000 , state records show.\n\nBloomberg had already committed roughly $80 million to help Democrats this fall, much of it aimed at winning control of the House.\n\nMeanwhile, PayPal co-founder Luke Nosek gave $500,000 on Tuesday to Judicial Fairness PAC, which supports conservative judicial candidates in Texas, according to Texas campaign finance records . The group had already received $2 million from Tesla and SpaceX CEO Elon Musk , according to state records. Musk's roughly $475 million in disclosed political giving through late October makes him the cycle's biggest known individual donor .\n\nThe checks are landing in the middle of a final-week ad frenzy, with more than $1 billion now booked to air before Election Day, according to AdImpact. The 2026 cycle has already broken the record for political ad spending, with more than $11.2 billion spent or reserved, according to AdImpact. That's more than any previous presidential election cycle as well.\n\nHoffman has framed his own spending as a reluctant necessity.\n\n\"We should get money out of politics,\" Hoffman wrote Friday on X. \"And while others spend outrageous amounts to keep authoritarian clowns in power, those of us who believe in the ideals of America cannot yield.\"", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 12:02 AM IST", "pub_date_relative": "9m ago"}, {"title": "Wall Street slides as AI cash burn worries spark tech selloff", "full_content": "* Crypto firms slide after reports that hackers stole $6.3 billion from Binance\n\nNEW YORK, Oct 30 (Reuters) - US stocks tumbled on Friday, with the Nasdaq plunging to a three-month low following disappointing quarterly results from Intel and Amazon, which amplified growing fears surrounding AI-related companies' massive spending on the nascent technology, and concerns about when or whether the cash burn will start to pay off.\n\nAll three major US stock indexes slumped, with the Nasdaq sliding 3.4%. The tech-heavy index has dropped more than 8% from its all-time closing high reached on October 6.\n\nThe tech rout was sparked by disappointing quarterly results from Intel and Amazon released late on Thursday. The companies' shares slumped 2.1% and 30.9%, respectively.\n\nChip stocks veered sharply lower, with Nvidia down 5.3% and AMD sliding 12.1%. The broader chips index shed 8.7% and was headed for a monthly loss. Server makers Dell and HP lost 12.5% and 10.8%, respectively.\n\nAmazon and Intel were set to wipe out nearly $200 billion in combined market value if losses hold, setting up the Nasdaq-100 to erase over $1 trillion on Friday.\n\n\"It's fair to say that this week, not just today, has been very much about the future of AI and what that's going to look like, whether there will be a positive return on investment and if so, how quickly,\" said Oliver Pursche, senior vice president at Wealthspire Advisors in New York.\n\n\"Companies that are performing and meeting the very lofty expectations that have been set are doing well,\" Pursche added. \"Those that are falling short and seem to be missing the mark or not executing as expected are getting punished.\"", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 12:01 AM IST", "pub_date_relative": "10m ago"}, {"title": "Stock Market Today: Nasdaq Slumps On Weak Intel Report; These Two Biopharmas Break Out (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Nasdaq Slumps On Weak Intel Report; These Two Biopharmas Break Out (Live Coverage) Investor's Business Daily Crypto assets lose value after major global attack \u2014 as it happened ABC News & Headlines \u2013 Australian Broadcasting Corporation World in Brief: the tech stock slump continues; hackers attempt a crypto heist The Economist Stock Market Today: Nasdaq Slumps Over 2% at Open; Tech Selloff Continues; Binance Hack in Focus \u2014 Live Updates WSJ Bitcoin risks worst October in 12 years as tech sell-off spreads to gold TradingView", "source": "Google News Business", "pub_date_str": "31 Oct 2026, 12:00 AM IST", "pub_date_relative": "11m ago"}, {"title": "My father has Alzheimer\u2019s and his caregiver is using his debit card for DoorDash. Do I intervene?", "full_content": "\u201cI suspect the live-in caregiver is benefiting from my parent\u2019s generosity.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "31 Oct 2026, 12:00 AM IST", "pub_date_relative": "11m ago"}, {"title": "Tankers defy sharp escalation of Iranian attacks to keep crude oil flowing through Strait of Hormuz", "full_content": "Within 24 hours of the U.S. and Israel going to war with Iran, Tehran responded with a wave of attacks on commercial ships in the Strait of Hormuz to cut off one of the world's main sources of crude oil.\n\nIran's campaign was initially successful, with crude exports plunging nearly 90% to 1.8 million barrels a day in March compared with 16 million bpd in February, according to data provided by Kpler.\n\nBut crude flows have rebounded over the past eight months as the U.S. military provides protection to tankers transiting Hormuz. Tehran has responded by escalating its attacks in recent weeks .\n\nMore commercial ships have come under attack in October than at any other point in the war. Yet in contrast to March when exports cratered, tankers have continued to ferry substantial volumes of crude oil through Hormuz in a sign that the shipping industry has adapted to wartime in the Persian Gulf.\n\nAs of Oct. 27, at least 30 vessels, mostly oil tankers, were hit this month leaving at minimum 16 seafarers injured, according to data from the International Maritime Organization , a United Nations agency. Ship attacks doubled in October compared with 15 confirmed incidents in September.\n\n\"It's a difficult situation. Ships are attacked really on a daily basis,\" said Jakob Larsen, chief safety and security officer at Denmark-headquartered BIMCO, one of the big international shipping trade associations.\n\nShip attacks in the Strait of Hormuz surged in October Kpler Oil prices rise, but flows are resilient Crude prices have surged more than 13% this month as security conditions have deteriorated in the Persian Gulf. The international Brent contract traded above $117 a barrel on Friday. That's just shy of its wartime closing high of $118.35 during Iran's big wave of ship attacks in March.\n\nYet actual crude exports through Hormuz stood at nearly 11.1 million bpd on average in October, only about 2% lower from September despite the sharp escalation of violence, Kpler's data shows.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:58 PM IST", "pub_date_relative": "13m ago"}, {"title": "CD&R explores deal to take payments processor Global Payments private, source says", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:54 PM IST", "pub_date_relative": "17m ago"}, {"title": "Aaon stock hits 52-week low at 66.29 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:52 PM IST", "pub_date_relative": "18m ago"}, {"title": "Watch ISRO's NVS-03 Satellite Launch Live: GSLV-F18 Mission Set For Liftoff", "full_content": "ISRO's GSLV-F18 rocket is scheduled to carry the NVS-03 navigation satellite into Geosynchronous Transfer Orbit from Sriharikota on Friday night.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:52 PM IST", "pub_date_relative": "18m ago"}, {"title": "Diwali fire safety: How home insurance works, what it covers and how to protect your home from accidental fire damage", "full_content": "Diwali is around the corner and homes across the country are getting ready to light up diyas (small oil lamps) and fairy light, while celebrations will be accompanied by firecrackers. However, the festive season also brings the risk of accidental fires caused by electrical short circuits, firecrackers or unattended diyas and candles, particularly when residents step out of their homes.\n\nIn such circumstances, having a home insurance policy can offer financial protection against unexpected damage to your property and belongings. While it cannot prevent such incidents, the right policy can help you manage the financial burden of repairs and replacement if an unfortunate event occurs.\n\nA home insurance policy, with premiums starting as low as \u20b9 18 per month, can cover both structural damage and loss or damage to household contents caused by fire, subject to the policy's terms and conditions.\n\nSome policies also cover additional expenses like temporary accommodation or loss of rent, subject to policy terms, if the house becomes uninhabitable, said Ashwini Dubey, Business Head of Home Insurance at Policybazaar.\n\nDubey further warned that homeowners must check the coverage limits, exclusions and claim settlement conditions as that vary from insurer to insurer. \u201cIf someone lives in a housing society , its building insurance may not cover your personal belongings, making separate contents insurance important,\u201d he added.\n\nSome other exclusions include careless placement of diyas, candles or firecrackers during Diwali, deliberate acts and wilful misconduct.\n\nThe expert advised people against bursting firecrackers in enclosed spaces, including balconies and inside homes, and cautioned them against leaving diyas or candles unattended when stepping out of the house.\n\nFor example, fire damage is generally covered under standard home fire insurance, while damage limited to an electrical appliance due to a short circuit may be treated differently under the policy wording.", "source": "LiveMint Money", "pub_date_str": "30 Oct 2026, 11:51 PM IST", "pub_date_relative": "20m ago"}, {"title": "Top oil & gas exploration stocks, according to Mizuho", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:50 PM IST", "pub_date_relative": "20m ago"}, {"title": "Alaska Senate: Judge fast tracks new bids to dismiss DOJ lawsuit over 2nd Sullivan candidacy", "full_content": "A federal judge in Alaska on Friday kept on a fast track efforts to dismiss a Department of Justice lawsuit that seeks to delay certification of the state's U.S. Senate election because of possible voter confusion from having two Dan Sullivans \u2014 one of whom is the incumbent Republican \u2014 on the ballot.\n\nJudge Sharon Gleason ordered the DOJ to respond by 1 p.m. Alaska Time on Friday to the new dismissal motions, which were filed hours after the department amended its suit in U.S. District Court in Anchorage on Thursday to add a new legal claim.\n\nThe DOJ's updating of the civil complaint forced Gleason to rule the prior dismissal motions were moot.\n\nGleason gave state election officials, the campaign of Democratic nominee Mary Peltola , and other groups until noon Saturday to reply to the DOJ's response.\n\nThe judge's order leaves open the possibility that she will rule on the dismissal motions before Tuesday, which is Election Day, as both the state and Peltola's campaign have requested.\n\nThe state, the campaign, and other intervenors in the suit argue the DOJ has no legal authority to block certification of an election because two candidates on a four-candidate ballot happen to share the same name.\n\nThe winner of Alaska's race could determine which party holds a majority in the Senate starting in January. Republicans currently have 53 seats in the 100-member chamber.\n\nAlaska's election uses ranked choice voting. If no candidate obtains more than 50% of the vote in the first count, then the fourth-place finisher will be eliminated, and the second choice on that candidate's ballots will be allocated to the remaining candidates.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:50 PM IST", "pub_date_relative": "21m ago"}, {"title": "Anthropic may not secure investment-grade rating after IPO, Blackstone says", "full_content": "Private capital giant says AI group is expected to receive \u2018high\u2019 junk rating in shift from previous guidance", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 11:49 PM IST", "pub_date_relative": "22m ago"}, {"title": "US judge orders ethics investigation into DOJ lawyers in golf course dispute", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:48 PM IST", "pub_date_relative": "23m ago"}, {"title": "Fed officials are already saying they\u2019ll need to get back to hiking rates", "full_content": "Two Federal Reserve presidents on Friday said interest rates will need to move higher to rein in inflation.\n\nThe St. Louis Fed's Alberto Musalem said another rate hike will need to happen soon. And Lorie Logan of the Dallas Fed predicted that the central bank will need to raise rates by quarter-point increments at least two more times.\n\nThe comments from the two officials offer the first morsels of insight into what leaders at the Fed see next after the central bank on Wednesday elected to leave rates unchanged for now . The remarks are likely to bolster the view among investors that the Federal Open Market Committee will return to hiking rates at its next meeting in December.\n\nFed funds futures traders are pricing in a roughly 76% likelihood of the Fed lifting rates by a quarter percentage point at that gathering, according to CME's FedWatch tool.\n\n\"I judge that additional firming of monetary policy will be necessary, and soon,\" Musalem said in prepared remarks for the Shadow Open Market Committee, a gathering of economists in New York focused on the central bank.\n\n\"Incremental adjustments made earlier are usually less disruptive than larger and abrupt actions taken later,\" Musalem said. \"Moving sooner in smaller steps while inflation expectations are anchored has a better chance of succeeding without adverse impact on the labor market or economic growth.\"\n\nIn remarks roughly an hour later, Logan said: \"It remains clear to me, given the current outlook, that the FOMC needs to implement at least two more 25-basis-point rate increases.\"\n\nStill, she said, that doesn't mean the Fed has to raise rates at every meeting.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:48 PM IST", "pub_date_relative": "23m ago"}, {"title": "North Korean hackers likelinked to record-breaking $6.3 billion Binance crypto heist - Yahoo Finance", "full_content": "North Korean hackers likelinked to record-breaking $6.3 billion Binance crypto heist Yahoo Finance Binance\u2019s $6.3 Billion Hack Is Just the Start of a Risky New Era The New York Times The Binance hack is way bigger than any other known heist in the crypto world Yahoo Finance Massive crypto hack probably the largest theft of digital currencies in history The Washington Post Blockchain intelligence firms link North Korea to $6.3B hack on Binance NPR", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 11:46 PM IST", "pub_date_relative": "24m ago"}, {"title": "Fiscal deficit in H1 rises to 42.1% of FY27 target on higher capex, subsidies", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Fiscal deficit in H1 rises to 42.1% of FY27 target on higher capex, subsidies The Economic Times daily newspaper is available online now. Read Today's Paper Fiscal deficit in H1 rises to 42.1% of FY27 target on higher capex, subsidies SECTIONS Fiscal deficit in H1 rises to 42.1% of FY27 target on higher capex, subsidies ET Bureau Last Updated: Oct 30, 2026, 11:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis By September 2026, the Centre's fiscal deficit had escalated to \u20b97.14 lakh crore, exceeding last year's figures. This increase is fueled by a 10.7% rise in total expenditure, largely a result of heightened capital spending and food subsidies, while petroleum subsidies sharply declined. Gross tax revenue, however, saw a modest growth of 6.1%, even with lower excise duty collections attributed to tax reforms.\n\nCan new data protection law guard against SBI-like data breaches?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "30 Oct 2026, 11:46 PM IST", "pub_date_relative": "25m ago"}, {"title": "Jefferies raises Veralto stock price target on strong quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:44 PM IST", "pub_date_relative": "26m ago"}, {"title": "Jefferies lowers Boot Barn stock price target on sales outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:44 PM IST", "pub_date_relative": "26m ago"}, {"title": "Wall Street braces for Democratic gains as 2026 midterm election nears", "full_content": "Investors expect a blue wave in next week's midterm election , as Democrats surge in polls and President Donald Trump 's approval rating remains low.\n\nPublic polling suggests Democrats are likely to take control of the House of Representatives, and analysts who parse what politics means for investors are in overdrive to tell their clients how to prepare for what Congress will look like after the Tuesday election.\n\nConcern about the spending plans and priorities of a Democratic-controlled Congress permeates analyst reports reviewed by CNBC. But because Trump has another two years of his presidency, a divided government would likely create gridlock that would prevent congressional leadership in opposition to the president from getting much done, analysts are advising their clients.\n\nMost analysts believe Democrats are also within striking distance of a Senate majority, though that outcome is significantly less likely than a House flip according to the polls. Next Tuesday's elections will determine which party controls both chambers of Congress for the remainder of Trump's presidency, after two years of full Republican control.\n\nDivided government typically makes must-pass legislation, like government funding and raising the debt ceiling , harder to enact. A debt ceiling standoff \u2014 or first-ever default on federal debt \u2014 could be particularly damaging.\n\nWall Street watchers are also expecting Democrats to try to advance an ambitious and expensive agenda should they gain control of Congress. An Oct. 29 report from Piper Sandler analyzing Congressional Budget Office data projected that policy proposals from Democrats \"would add $5 trillion to the deficit over the coming decade.\" The analysis assumes repeals of Trump's tariffs and reversing cuts to Medicaid, nutrition programs and Affordable Care Act subsidies.\n\nMajor policy swings \u2014 and big spending packages \u2014 become less likely as a divided government is unlikely to agree on issues.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:43 PM IST", "pub_date_relative": "27m ago"}, {"title": "Vadilal Industries Q2 Results: Net Profit Jumps 64%, Margin Expands", "full_content": "Vadilal Industries' Q2 net profit rose 64.1% year-on-year to Rs 54.8 crore, while revenue increased 35.4% to Rs 463 crore and EBITDA margin expanded to 18.2% from 15.5%.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:43 PM IST", "pub_date_relative": "28m ago"}, {"title": "Shehbaz Sharif Gets Trolled After He Praises Pakistan For Beating India In Hong Kong Sixes", "full_content": "Pakistan chased down India's 88-run total in just 3.5 overs, but their Prime Minister's congratulatory post became a talking point online.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:42 PM IST", "pub_date_relative": "29m ago"}, {"title": "Mobileye stock hits 52-week low at $5.76", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:42 PM IST", "pub_date_relative": "29m ago"}, {"title": "American Express issues $3 billion in new notes with varying maturities", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:40 PM IST", "pub_date_relative": "30m ago"}, {"title": "Microsoft is winning the cloud wars and becoming Wall Street\u2019s new golden child", "full_content": "Various factors indicate that Microsoft is in a better financial position than its cloud rivals, analysts say.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 11:39 PM IST", "pub_date_relative": "32m ago"}, {"title": "Raymond James raises Encompass Health stock price target on strong results", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:38 PM IST", "pub_date_relative": "32m ago"}, {"title": "Binance hack: Investigators in a 'cat and mouse game' to recover $6.3 billion in stolen funds", "full_content": "Crypto firms and law enforcement are racing to recover more than $6 billion worth of cryptocurrency stolen from Binance before hackers manage to hide the funds.\n\nThe firms say they're in a \"cat and mouse game\" against alleged North Korean hackers who are using a combination of crypto obfuscation techniques and professional global money laundering networks to turn their digital coins into fiat currency, according to experts who spoke to CNBC.\n\nThese moves underscore how hard it can be to recover the stolen funds after a crypto hack.\n\n\"Ultimately, they're [hackers] trying to off-ramp it [crypto] to fiat. And that becomes the challenge, that's sort of this race against time,\" Ari Redbord, global head of policy at TRM Labs, one of the companies investigating the Binance hack, told CNBC on Friday.\n\nBinance pledged to cover losses using its Secure Asset Fund for Users.\n\nBoth TRM Labs and Chainalysis have attributed the Binance hack to a North Korean state-backed hacking group called TraderTraitor, which has a history of crypto cyberattacks.\n\nAfter the hack, several stablecoin issuers, including Circle , which issues USDC, and Tether, which issues USDT, moved to freeze the funds . Stablecoins are digital coins that represent a currency, such as the dollar, 1-to-1 and are backed by assets such as government bonds or fiat.\n\nBinance estimates that around $3 billion worth of cryptocurrency has been frozen so far.", "source": "CNBC World Economy", "pub_date_str": "30 Oct 2026, 11:38 PM IST", "pub_date_relative": "33m ago"}, {"title": "Why bitcoin held up better after the record Binance hack", "full_content": "Binance has suffered the biggest hack in crypto history , but that's done little to shake confidence in bitcoin , according to market analysts and researchers.\n\nOn Thursday, the world's largest exchange by daily trading volume said that roughly $6.3 billion were affected in an exploit. Security firm TRM Labs linked the security incident to North Korea.\n\nThe hack sparked a slight sell-off in bitcoin . On Friday, the cryptocurrency traded at $77,065 around 1:34 p.m. ET, down about 4% on the day.\n\nBitcoin in the past day By comparison, the token has fallen 8.3% on average in the first 24 hours following past crypto exchange exploits, according to data from institutional crypto platform Anchorage Digital.\n\nThe digital asset has remained relatively resilient because the hack on Binance had nothing to do with the security of the bitcoin network itself, according to Sam Callahan, director of bitcoin strategy and research at crypto treasury firm OranjeBTC.\n\n\"Investors recognize an important distinction: Bitcoin itself was not hacked,\" Callahan told CNBC. \"This was a security breach at a centralized exchange, not a failure of the Bitcoin network.\"\n\nAlthough Binance has suffered the largest hack in crypto history, it's far from the only digital asset exchange to fall victim to bad actors and lead bitcoin to tumble.\n\nIn the early 2010s, bitcoin exchange Mt. Gox was hacked a handful of times, wreaking havoc on the price of bitcoin. The token fell as much as 23.7% in the first 24 hours after an attack on Mt. Gox in February 2014, per Anchorage Digital data.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:37 PM IST", "pub_date_relative": "34m ago"}, {"title": "Jio Platforms Q2 Results: Net Profit Rises 8% To Rs 8,389 Crore; Margin Expands", "full_content": "Jio Platforms reports an 8% sequential rise in Q2 net profit to Rs 8,389 crore, while revenue grows 3.3% and EBITDA climbs 5.3%, lifting the operating margin to 51.6%.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:33 PM IST", "pub_date_relative": "37m ago"}, {"title": "Chip stocks crash: Intel plunges 30%, AMD drops 12%, Nvidia and Broadcom also slide \u2014 what's driving the selloff?", "full_content": "A multi-fold jump in profits at China\u2019s ChangXin Memory Technologies has triggered another round of selloffs in chip stocks in Friday\u2019s trade on October 30, while disappointing earnings from Amazon and Intel have added to growth concerns on Wall Street.\n\nThe losses were led by Intel, which plunged 30%, followed by Advanced Micro Devices (AMD) (12%), Qualcomm (12%), SanDisk (9.7%), Broadcom (5%), Nvidia (4.86%), Micron Technology (4%), and Amazon (2%).\n\nChina\u2019s ChangXin Memory Technologies (CXMT) reported a more than sevenfold year-on-year increase in third-quarter revenue to 118.71 billion yuan ($16.7 billion), up 19.3% from the previous quarter, driven by strong demand for memory chips and tight global supplies.\n\nNet profit attributable to shareholders stood at 54.4 billion yuan ($8.17 billion) for the three months ended September 30, compared with a loss in the year-ago period. However, sequential profit growth was more modest at around 3%.\n\nFor the first nine months of 2026, revenue reached 269.02 billion yuan, while net profit attributable to shareholders stood at 132.04 billion yuan, reversing a loss of approximately 5.3 billion yuan in the corresponding period last year.\n\nCXMT attributed the improvement to higher memory-chip prices amid tight supply, capacity expansion, and a more favorable product mix.\n\nE-commerce and cloud giant Amazon reported higher-than-expected capital expenditure in the third quarter, alongside slower growth in its online retail business. The company said it spent more than $77 billion on property and equipment in the third quarter, well above analyst expectations, as it continues to expand data centre capacity and meet growing demand for AI services.\n\nLike its competitors, Amazon has also made a massive spending commitment to developing AI software and infrastructure, forecasting capital expenditure of $220 billion this year.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 11:32 PM IST", "pub_date_relative": "39m ago"}, {"title": "How AI might be deployed for better bank supervision", "full_content": "The technology could help tackle some of the cultural issues that contributed to the collapse of SVB", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 11:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "\u2018He was heartbroken\u2019: My husband\u2019s kids abandoned him when he was dying. Was he right to leave everything to me?", "full_content": "\u201cIn the end, he left them a few sentimental mementos, some collectibles and old photographs.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 11:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "Q2 Results Highlights: Reliance Industries Profit Up 22%; Jio Platforms Profit Jumps 8%; PB Fintech Profit Rises 43%", "full_content": "Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:29 PM IST", "pub_date_relative": "42m ago"}, {"title": "In Major Public Health Triumph, WHO Says Barbados Has Eliminated Mother-To-Child HIV Transmission", "full_content": "Barbados reported no new mother-to-child HIV infections among infants between 2022 and 2024, with 98% coverage across key maternal health services.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:29 PM IST", "pub_date_relative": "42m ago"}, {"title": "Profit Exclusive | E100 Fuel Adoption In India Hinges On Coordination Between Automakers, Oil Companies: AIDA, GEMA", "full_content": "Ethanol manufacturers say fuel production and distribution planning must keep pace with demand for E100-compatible vehicles.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:27 PM IST", "pub_date_relative": "43m ago"}, {"title": "What Is La Nina? Could It Follow A Strong El Nino And Change Global Weather In 2027?", "full_content": "Scientists are watching whether the strong El Nino will give way to La Nina in 2027, a possible shift that could reshape global rainfall, temperatures and extreme weather patterns.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:17 PM IST", "pub_date_relative": "54m ago"}, {"title": "Yuvraj Singh's New Innings: Former Cricketer Launches Daily Health Supplement Protocol32", "full_content": "Announcing the launch, Yuvraj reflected on playing the 2011 World Cup while battling cancer and said he now takes his daily health seriously.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:17 PM IST", "pub_date_relative": "54m ago"}, {"title": "US tech stocks see sharp falls as AI spending nears $1tn - BBC", "full_content": "US tech stocks see sharp falls as AI spending nears $1tn BBC Tech Stocks Tumble, Putting Pressure on Broader Market The New York Times Tech sell-off drives US markets down by nearly $1tn after subpar earnings reports The Guardian Intel stock heads for worst day in more than 50 years, wiping $12 billion off government's stake CNBC Stock market today: Nasdaq dives over 3%, S&P 500 and Dow tank as AI reckoning grips Wall Street Yahoo Finance", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 11:17 PM IST", "pub_date_relative": "54m ago"}, {"title": "American workers are finding their take-home pay isn\u2019t keeping up with inflation, with their wallets \u2018stretched thinner and thinner\u2019", "full_content": "Worker compensation grows slower than inflation for second straight quarter", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 11:14 PM IST", "pub_date_relative": "57m ago"}, {"title": "Nasdaq plunges 3%, heads for worst day since June as tech stocks lead sell-off: Live updates", "full_content": "The Nasdaq Composite tumbled on Friday, while the Dow Jones Industrial Average outperformed as traders moved out of key stocks related to artificial intelligence and into more defensive areas of the market.\n\nThe tech-heavy Nasdaq lost 3% and was on track for its worst single-day performance since June. The blue-chip Dow was down 483 points, or 0.9%, while the S&P 500 slid 1.9%.\n\nNasdaq Composite, 1-month Amazon shares lost 2% after the company reported earnings and revenue for the third quarter that fell short of Wall Street's expectations . The company also posted negative free cash flow of $42.4 billion and maintained its 2026 capital expenditures forecast for $220 billion.\n\nIntel , meanwhile, slide 29% after issuing a weak outlook for the current quarter, pointing to a slowdown in PCs. Revenue in the company's client computing and physical artificial intelligence group declined 5% from the year-ago quarter to $8.1 billion.\n\nSandisk was also down 12%, even as its fiscal first quarter results beat estimates. The data storage company announced an eight-for-one forward stock split.\n\nChipmakers more broadly were under pressure as well. Advanced Micro Devices dropped 11%, while others such as Nvidia and Broadcom fell 4% and 5%, respectively.\n\nAs investors rotated out of tech, defensive areas such as consumer staples and healthcare saw gains. Walmart and Coca-Cola each rose nearly 2%, while Procter & Gamble climbed more than 1%, supporting the Dow. Fellow Dow members Merck and Amgen added around 2%.\n\n\"The tone has changed a bit, and whether that changes the sustainability of the rotation is still yet to be determined,\" said Globalt's Keith Buchanan, who noted that this is a \"scrutinizing\" and \"discerning\" market. \"Last year was hope. This year is: At the end of day, how does this all work in real world terms, like how to finance [it] and who gets the economics. Those questions are much more difficult to answer.\"", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:13 PM IST", "pub_date_relative": "57m ago"}, {"title": "Class action lawsuit blames Trump officials for student loan forgiveness delays", "full_content": "The American Federation of Teachers sued the Trump administration Friday, alleging it unlawfully blocked student loan forgiveness for tens of thousands of borrowers who qualify.\n\nThe plaintiffs argue in their lawsuit, Weingarten v. McMahon , filed in the U.S. District Court for the District of Columbia, that U.S. Department of Education Secretary Linda McMahon has mismanaged the popular Public Service Loan Forgiveness program by incorrectly counting borrowers' payment timelines and not awarding people credit for time served.\n\nPSLF, which President George W. Bush signed into law in 2007, allows certain not-for-profit and government employees to have their federal student loans canceled after 120 payments, generally paid over 10 years. The Biden administration later adapted the program, making it easier to qualify for it and clearing the way for more than 1 million borrowers to have their loans forgiven under the program.\n\n\"Secretary McMahon has flagrantly ignored her responsibility to help teachers, nurses and first responders,\" said AFT President Randi Weingarten, the lead plaintiff, in a statement. The other plaintiffs include AFT members and public service workers. The AFT is a teacher's union representing some 1.8 million members. \"This lawsuit demands that McMahon stop stalling and do her job,\" Weingarten said.\n\nThe lawsuit accuses Trump officials of denying borrowers relief under the Biden administration-era PSLF Buyback program. That opportunity allows borrowers who've hit 120 months of qualifying employment to submit a request to the Education Department to retroactively pay for any months they missed because of a forbearance or deferment.\n\nBuyback applications have piled up under the Trump administration, with 88,000 borrowers still waiting for a decision as of the spring, according to a court filing.\n\nThe borrowers bringing the lawsuit also say the U.S.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "SEBI Eases KYC Norms For Foreign Investors, Extends Review Period To Eight Years", "full_content": "Under the revised framework, Category I FPIs registered under Regulation 5(a)(i) will undergo KYC reviews once every eight years, irrespective of whether they operate in high-risk or non-high-risk jurisdictions. Other Category I investors will move to a two-year review cycle.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Intel Shares Head For Worst Day Since 1974, US Government Loses $12 Billion In Value", "full_content": "Intel expects the PC market to remain under pressure through at least the first half of 2027.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "You can expect the stock market to rally no matter who wins on Election Day", "full_content": "Also in Weekend Reads: Dividend stocks, a way to jump on the Anthropic bandwagon ahead of its IPO, and advice from The Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 11:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "US tech stocks tumble as earnings stoke AI spending fears", "full_content": "Intel\u2019s shares on track to plunge by the most since 1974 after chipmaker\u2019s results spook investors", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Is it finally time to buy Lululemon? Here's what the charts tell me", "full_content": "Frank Cappelleri of CappThesis breaks down the technicals on LULU.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Apollo and Thrive capitalise on private equity\u2019s generational shift", "full_content": "By leaning into their new role as debt financiers, the old guard still have a lucrative place in the new financial order", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Social Security\u2019s fate \u2014 and your benefits \u2014 are in the hands of the candidates elected this year", "full_content": "The program is expected to run out of money in the next six years, which is the same amount of time as a senator\u2019s term.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 10:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Treasury Department announces new Series I bond rate of 5.51% for the next six months", "full_content": "The U.S. Department of the Treasury has announced new rates for Series I bonds.\n\nNewly purchased I bonds will pay 5.51% annual interest from Nov. 1 through April 30, which is up from the 4.26% yield offered on purchases made through Oct. 31.\n\nThe new rate includes a variable portion of 4.08% based on inflation data , and a fixed portion of 1.40%. The fixed rate is up from 0.90% announced in April, and the highest since 2006.\n\nCombined, the composite I bond rate is 5.51% after rounding, according to the Treasury.\n\nAmid the post-pandemic inflation peak , the I bond rate hit a record high of 9.62% in May 2022, and investors poured millions into the government-backed, nearly risk-free asset.\n\nAs inflation cooled and I bond rates fell, many short-term investors redeemed I bonds . But investors could return as inflation pushes I bond rates back up, experts say.\n\n\"I bonds are a lot more attractive at this point,\" said David Enna, founder of Tipswatch.com, a website that tracks Treasury inflation-protected securities, or TIPS, and I bond rates .\n\nThe consumer price index rose 3.7% in September 2026 from one year earlier, up from an annual pace of 3.4% in August, the Bureau of Labor Statistics reported in October.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 10:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Uttarakhand Helicopter Crash: Which Firm Operated Chopper, Who Are The Victims And What Caused Accident?", "full_content": "Six people, including the pilot, killed after helicopter crashes near Joshimath; DGCA launches preliminary assessment as weather conditions come under scrutiny", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 10:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "The big winners of the tech wreck are biopharma stocks", "full_content": "The shares of large drugmakers like Lilly, Gilead and J&J keep hitting record highs.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 10:43 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Reid Hoffman gives millions to Dems in late spending spree as Epstein fight spills into election", "full_content": "Billionaire venture capitalist Reid Hoffman has put $8 million into the Democratic Party of Wisconsin over the past five weeks to help the party's gubernatorial nominee David Crowley in his race against Republican Tom Tiffany.\n\nThe LinkedIn co-founder gave $2 million on Sept. 24, $1 million on Oct. 2 and another $5 million in two installments on Oct. 5 and Oct. 20, according to Wisconsin campaign finance records . The rapid-fire checks are part of a last-minute spending spree by some of America's richest donors before Election Day .\n\nIn just the past week and a half, former New York City Mayor Michael Bloomberg gave Democratic Texas gubernatorial nominee Gina Hinojosa $750,000, while Y Combinator co-founder Jessica Livingston chipped in another $150,000 , state records show.\n\nBloomberg had already committed roughly $80 million to help Democrats this fall, much of it aimed at winning control of the House.\n\nMeanwhile, PayPal co-founder Luke Nosek gave $500,000 on Tuesday to Judicial Fairness PAC, which supports conservative judicial candidates in Texas, according to Texas campaign finance records . The group had already received $2 million from Tesla and SpaceX CEO Elon Musk , according to state records. Musk's roughly $475 million in disclosed political giving through late October makes him the cycle's biggest known individual donor .\n\nThe checks are landing in the middle of a final-week ad frenzy, with more than $1 billion now booked to air before Election Day, according to AdImpact. The 2026 cycle has already broken the record for political ad spending, with more than $11.2 billion spent or reserved, according to AdImpact. That's more than any previous presidential election cycle as well.\n\nHoffman has framed his own spending as a reluctant necessity.\n\n\"We should get money out of politics,\" Hoffman wrote Friday on X. \"And while others spend outrageous amounts to keep authoritarian clowns in power, those of us who believe in the ideals of America cannot yield.\"", "source": "CNBC World Economy", "pub_date_str": "31 Oct 2026, 12:02 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Wall Street slides as AI cash burn worries spark tech selloff", "full_content": "* Crypto firms slide after reports that hackers stole $6.3 billion from Binance\n\nNEW YORK, Oct 30 (Reuters) - US stocks tumbled on Friday, with the Nasdaq plunging to a three-month low following disappointing quarterly results from Intel and Amazon, which amplified growing fears surrounding AI-related companies' massive spending on the nascent technology, and concerns about when or whether the cash burn will start to pay off.\n\nAll three major US stock indexes slumped, with the Nasdaq sliding 3.4%. The tech-heavy index has dropped more than 8% from its all-time closing high reached on October 6.\n\nThe tech rout was sparked by disappointing quarterly results from Intel and Amazon released late on Thursday. The companies' shares slumped 2.1% and 30.9%, respectively.\n\nChip stocks veered sharply lower, with Nvidia down 5.3% and AMD sliding 12.1%. The broader chips index shed 8.7% and was headed for a monthly loss. Server makers Dell and HP lost 12.5% and 10.8%, respectively.\n\nAmazon and Intel were set to wipe out nearly $200 billion in combined market value if losses hold, setting up the Nasdaq-100 to erase over $1 trillion on Friday.\n\n\"It's fair to say that this week, not just today, has been very much about the future of AI and what that's going to look like, whether there will be a positive return on investment and if so, how quickly,\" said Oliver Pursche, senior vice president at Wealthspire Advisors in New York.\n\n\"Companies that are performing and meeting the very lofty expectations that have been set are doing well,\" Pursche added. \"Those that are falling short and seem to be missing the mark or not executing as expected are getting punished.\"", "source": "LiveMint Markets", "pub_date_str": "31 Oct 2026, 12:01 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Nasdaq Slumps On Weak Intel Report; These Two Biopharmas Break Out (Live Coverage) - Investor's Business Daily", "full_content": "Stock Market Today: Nasdaq Slumps On Weak Intel Report; These Two Biopharmas Break Out (Live Coverage) Investor's Business Daily Crypto assets lose value after major global attack \u2014 as it happened ABC News & Headlines \u2013 Australian Broadcasting Corporation World in Brief: the tech stock slump continues; hackers attempt a crypto heist The Economist Stock Market Today: Nasdaq Slumps Over 2% at Open; Tech Selloff Continues; Binance Hack in Focus \u2014 Live Updates WSJ Bitcoin risks worst October in 12 years as tech sell-off spreads to gold TradingView", "source": "Google News Business", "pub_date_str": "31 Oct 2026, 12:00 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tankers defy sharp escalation of Iranian attacks to keep crude oil flowing through Strait of Hormuz", "full_content": "Within 24 hours of the U.S. and Israel going to war with Iran, Tehran responded with a wave of attacks on commercial ships in the Strait of Hormuz to cut off one of the world's main sources of crude oil.\n\nIran's campaign was initially successful, with crude exports plunging nearly 90% to 1.8 million barrels a day in March compared with 16 million bpd in February, according to data provided by Kpler.\n\nBut crude flows have rebounded over the past eight months as the U.S. military provides protection to tankers transiting Hormuz. Tehran has responded by escalating its attacks in recent weeks .\n\nMore commercial ships have come under attack in October than at any other point in the war. Yet in contrast to March when exports cratered, tankers have continued to ferry substantial volumes of crude oil through Hormuz in a sign that the shipping industry has adapted to wartime in the Persian Gulf.\n\nAs of Oct. 27, at least 30 vessels, mostly oil tankers, were hit this month leaving at minimum 16 seafarers injured, according to data from the International Maritime Organization , a United Nations agency. Ship attacks doubled in October compared with 15 confirmed incidents in September.\n\n\"It's a difficult situation. Ships are attacked really on a daily basis,\" said Jakob Larsen, chief safety and security officer at Denmark-headquartered BIMCO, one of the big international shipping trade associations.\n\nShip attacks in the Strait of Hormuz surged in October Kpler Oil prices rise, but flows are resilient Crude prices have surged more than 13% this month as security conditions have deteriorated in the Persian Gulf. The international Brent contract traded above $117 a barrel on Friday. That's just shy of its wartime closing high of $118.35 during Iran's big wave of ship attacks in March.\n\nYet actual crude exports through Hormuz stood at nearly 11.1 million bpd on average in October, only about 2% lower from September despite the sharp escalation of violence, Kpler's data shows.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:58 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Diwali fire safety: How home insurance works, what it covers and how to protect your home from accidental fire damage", "full_content": "Diwali is around the corner and homes across the country are getting ready to light up diyas (small oil lamps) and fairy light, while celebrations will be accompanied by firecrackers. However, the festive season also brings the risk of accidental fires caused by electrical short circuits, firecrackers or unattended diyas and candles, particularly when residents step out of their homes.\n\nIn such circumstances, having a home insurance policy can offer financial protection against unexpected damage to your property and belongings. While it cannot prevent such incidents, the right policy can help you manage the financial burden of repairs and replacement if an unfortunate event occurs.\n\nA home insurance policy, with premiums starting as low as \u20b9 18 per month, can cover both structural damage and loss or damage to household contents caused by fire, subject to the policy's terms and conditions.\n\nSome policies also cover additional expenses like temporary accommodation or loss of rent, subject to policy terms, if the house becomes uninhabitable, said Ashwini Dubey, Business Head of Home Insurance at Policybazaar.\n\nDubey further warned that homeowners must check the coverage limits, exclusions and claim settlement conditions as that vary from insurer to insurer. \u201cIf someone lives in a housing society , its building insurance may not cover your personal belongings, making separate contents insurance important,\u201d he added.\n\nSome other exclusions include careless placement of diyas, candles or firecrackers during Diwali, deliberate acts and wilful misconduct.\n\nThe expert advised people against bursting firecrackers in enclosed spaces, including balconies and inside homes, and cautioned them against leaving diyas or candles unattended when stepping out of the house.\n\nFor example, fire damage is generally covered under standard home fire insurance, while damage limited to an electrical appliance due to a short circuit may be treated differently under the policy wording.", "source": "LiveMint Money", "pub_date_str": "30 Oct 2026, 11:51 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic may not secure investment-grade rating after IPO, Blackstone says", "full_content": "Private capital giant says AI group is expected to receive \u2018high\u2019 junk rating in shift from previous guidance", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 11:49 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US judge orders ethics investigation into DOJ lawyers in golf course dispute", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Oct 2026, 11:48 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Fed officials are already saying they\u2019ll need to get back to hiking rates", "full_content": "Two Federal Reserve presidents on Friday said interest rates will need to move higher to rein in inflation.\n\nThe St. Louis Fed's Alberto Musalem said another rate hike will need to happen soon. And Lorie Logan of the Dallas Fed predicted that the central bank will need to raise rates by quarter-point increments at least two more times.\n\nThe comments from the two officials offer the first morsels of insight into what leaders at the Fed see next after the central bank on Wednesday elected to leave rates unchanged for now . The remarks are likely to bolster the view among investors that the Federal Open Market Committee will return to hiking rates at its next meeting in December.\n\nFed funds futures traders are pricing in a roughly 76% likelihood of the Fed lifting rates by a quarter percentage point at that gathering, according to CME's FedWatch tool.\n\n\"I judge that additional firming of monetary policy will be necessary, and soon,\" Musalem said in prepared remarks for the Shadow Open Market Committee, a gathering of economists in New York focused on the central bank.\n\n\"Incremental adjustments made earlier are usually less disruptive than larger and abrupt actions taken later,\" Musalem said. \"Moving sooner in smaller steps while inflation expectations are anchored has a better chance of succeeding without adverse impact on the labor market or economic growth.\"\n\nIn remarks roughly an hour later, Logan said: \"It remains clear to me, given the current outlook, that the FOMC needs to implement at least two more 25-basis-point rate increases.\"\n\nStill, she said, that doesn't mean the Fed has to raise rates at every meeting.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:48 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "North Korean hackers likelinked to record-breaking $6.3 billion Binance crypto heist - Yahoo Finance", "full_content": "North Korean hackers likelinked to record-breaking $6.3 billion Binance crypto heist Yahoo Finance Binance\u2019s $6.3 Billion Hack Is Just the Start of a Risky New Era The New York Times The Binance hack is way bigger than any other known heist in the crypto world Yahoo Finance Massive crypto hack probably the largest theft of digital currencies in history The Washington Post Blockchain intelligence firms link North Korea to $6.3B hack on Binance NPR", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 11:46 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Fiscal deficit in H1 rises to 42.1% of FY27 target on higher capex, subsidies", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Fiscal deficit in H1 rises to 42.1% of FY27 target on higher capex, subsidies The Economic Times daily newspaper is available online now. Read Today's Paper Fiscal deficit in H1 rises to 42.1% of FY27 target on higher capex, subsidies SECTIONS Fiscal deficit in H1 rises to 42.1% of FY27 target on higher capex, subsidies ET Bureau Last Updated: Oct 30, 2026, 11:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis By September 2026, the Centre's fiscal deficit had escalated to \u20b97.14 lakh crore, exceeding last year's figures. This increase is fueled by a 10.7% rise in total expenditure, largely a result of heightened capital spending and food subsidies, while petroleum subsidies sharply declined. Gross tax revenue, however, saw a modest growth of 6.1%, even with lower excise duty collections attributed to tax reforms.\n\nCan new data protection law guard against SBI-like data breaches?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "30 Oct 2026, 11:46 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street braces for Democratic gains as 2026 midterm election nears", "full_content": "Investors expect a blue wave in next week's midterm election , as Democrats surge in polls and President Donald Trump 's approval rating remains low.\n\nPublic polling suggests Democrats are likely to take control of the House of Representatives, and analysts who parse what politics means for investors are in overdrive to tell their clients how to prepare for what Congress will look like after the Tuesday election.\n\nConcern about the spending plans and priorities of a Democratic-controlled Congress permeates analyst reports reviewed by CNBC. But because Trump has another two years of his presidency, a divided government would likely create gridlock that would prevent congressional leadership in opposition to the president from getting much done, analysts are advising their clients.\n\nMost analysts believe Democrats are also within striking distance of a Senate majority, though that outcome is significantly less likely than a House flip according to the polls. Next Tuesday's elections will determine which party controls both chambers of Congress for the remainder of Trump's presidency, after two years of full Republican control.\n\nDivided government typically makes must-pass legislation, like government funding and raising the debt ceiling , harder to enact. A debt ceiling standoff \u2014 or first-ever default on federal debt \u2014 could be particularly damaging.\n\nWall Street watchers are also expecting Democrats to try to advance an ambitious and expensive agenda should they gain control of Congress. An Oct. 29 report from Piper Sandler analyzing Congressional Budget Office data projected that policy proposals from Democrats \"would add $5 trillion to the deficit over the coming decade.\" The analysis assumes repeals of Trump's tariffs and reversing cuts to Medicaid, nutrition programs and Affordable Care Act subsidies.\n\nMajor policy swings \u2014 and big spending packages \u2014 become less likely as a divided government is unlikely to agree on issues.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:43 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Vadilal Industries Q2 Results: Net Profit Jumps 64%, Margin Expands", "full_content": "Vadilal Industries' Q2 net profit rose 64.1% year-on-year to Rs 54.8 crore, while revenue increased 35.4% to Rs 463 crore and EBITDA margin expanded to 18.2% from 15.5%.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:43 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Binance hack: Investigators in a 'cat and mouse game' to recover $6.3 billion in stolen funds", "full_content": "Crypto firms and law enforcement are racing to recover more than $6 billion worth of cryptocurrency stolen from Binance before hackers manage to hide the funds.\n\nThe firms say they're in a \"cat and mouse game\" against alleged North Korean hackers who are using a combination of crypto obfuscation techniques and professional global money laundering networks to turn their digital coins into fiat currency, according to experts who spoke to CNBC.\n\nThese moves underscore how hard it can be to recover the stolen funds after a crypto hack.\n\n\"Ultimately, they're [hackers] trying to off-ramp it [crypto] to fiat. And that becomes the challenge, that's sort of this race against time,\" Ari Redbord, global head of policy at TRM Labs, one of the companies investigating the Binance hack, told CNBC on Friday.\n\nBinance pledged to cover losses using its Secure Asset Fund for Users.\n\nBoth TRM Labs and Chainalysis have attributed the Binance hack to a North Korean state-backed hacking group called TraderTraitor, which has a history of crypto cyberattacks.\n\nAfter the hack, several stablecoin issuers, including Circle , which issues USDC, and Tether, which issues USDT, moved to freeze the funds . Stablecoins are digital coins that represent a currency, such as the dollar, 1-to-1 and are backed by assets such as government bonds or fiat.\n\nBinance estimates that around $3 billion worth of cryptocurrency has been frozen so far.", "source": "CNBC World Economy", "pub_date_str": "30 Oct 2026, 11:38 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why bitcoin held up better after the record Binance hack", "full_content": "Binance has suffered the biggest hack in crypto history , but that's done little to shake confidence in bitcoin , according to market analysts and researchers.\n\nOn Thursday, the world's largest exchange by daily trading volume said that roughly $6.3 billion were affected in an exploit. Security firm TRM Labs linked the security incident to North Korea.\n\nThe hack sparked a slight sell-off in bitcoin . On Friday, the cryptocurrency traded at $77,065 around 1:34 p.m. ET, down about 4% on the day.\n\nBitcoin in the past day By comparison, the token has fallen 8.3% on average in the first 24 hours following past crypto exchange exploits, according to data from institutional crypto platform Anchorage Digital.\n\nThe digital asset has remained relatively resilient because the hack on Binance had nothing to do with the security of the bitcoin network itself, according to Sam Callahan, director of bitcoin strategy and research at crypto treasury firm OranjeBTC.\n\n\"Investors recognize an important distinction: Bitcoin itself was not hacked,\" Callahan told CNBC. \"This was a security breach at a centralized exchange, not a failure of the Bitcoin network.\"\n\nAlthough Binance has suffered the largest hack in crypto history, it's far from the only digital asset exchange to fall victim to bad actors and lead bitcoin to tumble.\n\nIn the early 2010s, bitcoin exchange Mt. Gox was hacked a handful of times, wreaking havoc on the price of bitcoin. The token fell as much as 23.7% in the first 24 hours after an attack on Mt. Gox in February 2014, per Anchorage Digital data.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:37 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Jio Platforms Q2 Results: Net Profit Rises 8% To Rs 8,389 Crore; Margin Expands", "full_content": "Jio Platforms reports an 8% sequential rise in Q2 net profit to Rs 8,389 crore, while revenue grows 3.3% and EBITDA climbs 5.3%, lifting the operating margin to 51.6%.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:33 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chip stocks crash: Intel plunges 30%, AMD drops 12%, Nvidia and Broadcom also slide \u2014 what's driving the selloff?", "full_content": "A multi-fold jump in profits at China\u2019s ChangXin Memory Technologies has triggered another round of selloffs in chip stocks in Friday\u2019s trade on October 30, while disappointing earnings from Amazon and Intel have added to growth concerns on Wall Street.\n\nThe losses were led by Intel, which plunged 30%, followed by Advanced Micro Devices (AMD) (12%), Qualcomm (12%), SanDisk (9.7%), Broadcom (5%), Nvidia (4.86%), Micron Technology (4%), and Amazon (2%).\n\nChina\u2019s ChangXin Memory Technologies (CXMT) reported a more than sevenfold year-on-year increase in third-quarter revenue to 118.71 billion yuan ($16.7 billion), up 19.3% from the previous quarter, driven by strong demand for memory chips and tight global supplies.\n\nNet profit attributable to shareholders stood at 54.4 billion yuan ($8.17 billion) for the three months ended September 30, compared with a loss in the year-ago period. However, sequential profit growth was more modest at around 3%.\n\nFor the first nine months of 2026, revenue reached 269.02 billion yuan, while net profit attributable to shareholders stood at 132.04 billion yuan, reversing a loss of approximately 5.3 billion yuan in the corresponding period last year.\n\nCXMT attributed the improvement to higher memory-chip prices amid tight supply, capacity expansion, and a more favorable product mix.\n\nE-commerce and cloud giant Amazon reported higher-than-expected capital expenditure in the third quarter, alongside slower growth in its online retail business. The company said it spent more than $77 billion on property and equipment in the third quarter, well above analyst expectations, as it continues to expand data centre capacity and meet growing demand for AI services.\n\nLike its competitors, Amazon has also made a massive spending commitment to developing AI software and infrastructure, forecasting capital expenditure of $220 billion this year.", "source": "LiveMint Markets", "pub_date_str": "30 Oct 2026, 11:32 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Highlights: Reliance Industries Profit Up 22%; Jio Platforms Profit Jumps 8%; PB Fintech Profit Rises 43%", "full_content": "Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:29 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Profit Exclusive | E100 Fuel Adoption In India Hinges On Coordination Between Automakers, Oil Companies: AIDA, GEMA", "full_content": "Ethanol manufacturers say fuel production and distribution planning must keep pace with demand for E100-compatible vehicles.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:27 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US tech stocks see sharp falls as AI spending nears $1tn - BBC", "full_content": "US tech stocks see sharp falls as AI spending nears $1tn BBC Tech Stocks Tumble, Putting Pressure on Broader Market The New York Times Tech sell-off drives US markets down by nearly $1tn after subpar earnings reports The Guardian Intel stock heads for worst day in more than 50 years, wiping $12 billion off government's stake CNBC Stock market today: Nasdaq dives over 3%, S&P 500 and Dow tank as AI reckoning grips Wall Street Yahoo Finance", "source": "Google News Business", "pub_date_str": "30 Oct 2026, 11:17 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "American workers are finding their take-home pay isn\u2019t keeping up with inflation, with their wallets \u2018stretched thinner and thinner\u2019", "full_content": "Worker compensation grows slower than inflation for second straight quarter", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 11:14 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nasdaq plunges 3%, heads for worst day since June as tech stocks lead sell-off: Live updates", "full_content": "The Nasdaq Composite tumbled on Friday, while the Dow Jones Industrial Average outperformed as traders moved out of key stocks related to artificial intelligence and into more defensive areas of the market.\n\nThe tech-heavy Nasdaq lost 3% and was on track for its worst single-day performance since June. The blue-chip Dow was down 483 points, or 0.9%, while the S&P 500 slid 1.9%.\n\nNasdaq Composite, 1-month Amazon shares lost 2% after the company reported earnings and revenue for the third quarter that fell short of Wall Street's expectations . The company also posted negative free cash flow of $42.4 billion and maintained its 2026 capital expenditures forecast for $220 billion.\n\nIntel , meanwhile, slide 29% after issuing a weak outlook for the current quarter, pointing to a slowdown in PCs. Revenue in the company's client computing and physical artificial intelligence group declined 5% from the year-ago quarter to $8.1 billion.\n\nSandisk was also down 12%, even as its fiscal first quarter results beat estimates. The data storage company announced an eight-for-one forward stock split.\n\nChipmakers more broadly were under pressure as well. Advanced Micro Devices dropped 11%, while others such as Nvidia and Broadcom fell 4% and 5%, respectively.\n\nAs investors rotated out of tech, defensive areas such as consumer staples and healthcare saw gains. Walmart and Coca-Cola each rose nearly 2%, while Procter & Gamble climbed more than 1%, supporting the Dow. Fellow Dow members Merck and Amgen added around 2%.\n\n\"The tone has changed a bit, and whether that changes the sustainability of the rotation is still yet to be determined,\" said Globalt's Keith Buchanan, who noted that this is a \"scrutinizing\" and \"discerning\" market. \"Last year was hope. This year is: At the end of day, how does this all work in real world terms, like how to finance [it] and who gets the economics. Those questions are much more difficult to answer.\"", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:13 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Class action lawsuit blames Trump officials for student loan forgiveness delays", "full_content": "The American Federation of Teachers sued the Trump administration Friday, alleging it unlawfully blocked student loan forgiveness for tens of thousands of borrowers who qualify.\n\nThe plaintiffs argue in their lawsuit, Weingarten v. McMahon , filed in the U.S. District Court for the District of Columbia, that U.S. Department of Education Secretary Linda McMahon has mismanaged the popular Public Service Loan Forgiveness program by incorrectly counting borrowers' payment timelines and not awarding people credit for time served.\n\nPSLF, which President George W. Bush signed into law in 2007, allows certain not-for-profit and government employees to have their federal student loans canceled after 120 payments, generally paid over 10 years. The Biden administration later adapted the program, making it easier to qualify for it and clearing the way for more than 1 million borrowers to have their loans forgiven under the program.\n\n\"Secretary McMahon has flagrantly ignored her responsibility to help teachers, nurses and first responders,\" said AFT President Randi Weingarten, the lead plaintiff, in a statement. The other plaintiffs include AFT members and public service workers. The AFT is a teacher's union representing some 1.8 million members. \"This lawsuit demands that McMahon stop stalling and do her job,\" Weingarten said.\n\nThe lawsuit accuses Trump officials of denying borrowers relief under the Biden administration-era PSLF Buyback program. That opportunity allows borrowers who've hit 120 months of qualifying employment to submit a request to the Education Department to retroactively pay for any months they missed because of a forbearance or deferment.\n\nBuyback applications have piled up under the Trump administration, with 88,000 borrowers still waiting for a decision as of the spring, according to a court filing.\n\nThe borrowers bringing the lawsuit also say the U.S.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SEBI Eases KYC Norms For Foreign Investors, Extends Review Period To Eight Years", "full_content": "Under the revised framework, Category I FPIs registered under Regulation 5(a)(i) will undergo KYC reviews once every eight years, irrespective of whether they operate in high-risk or non-high-risk jurisdictions. Other Category I investors will move to a two-year review cycle.", "source": "NDTV Profit", "pub_date_str": "30 Oct 2026, 11:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "You can expect the stock market to rally no matter who wins on Election Day", "full_content": "Also in Weekend Reads: Dividend stocks, a way to jump on the Anthropic bandwagon ahead of its IPO, and advice from The Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Oct 2026, 11:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US tech stocks tumble as earnings stoke AI spending fears", "full_content": "Intel\u2019s shares on track to plunge by the most since 1974 after chipmaker\u2019s results spook investors", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 11:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Apollo and Thrive capitalise on private equity\u2019s generational shift", "full_content": "By leaning into their new role as debt financiers, the old guard still have a lucrative place in the new financial order", "source": "FT Markets", "pub_date_str": "30 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Treasury Department announces new Series I bond rate of 5.51% for the next six months", "full_content": "The U.S. Department of the Treasury has announced new rates for Series I bonds.\n\nNewly purchased I bonds will pay 5.51% annual interest from Nov. 1 through April 30, which is up from the 4.26% yield offered on purchases made through Oct. 31.\n\nThe new rate includes a variable portion of 4.08% based on inflation data , and a fixed portion of 1.40%. The fixed rate is up from 0.90% announced in April, and the highest since 2006.\n\nCombined, the composite I bond rate is 5.51% after rounding, according to the Treasury.\n\nAmid the post-pandemic inflation peak , the I bond rate hit a record high of 9.62% in May 2022, and investors poured millions into the government-backed, nearly risk-free asset.\n\nAs inflation cooled and I bond rates fell, many short-term investors redeemed I bonds . But investors could return as inflation pushes I bond rates back up, experts say.\n\n\"I bonds are a lot more attractive at this point,\" said David Enna, founder of Tipswatch.com, a website that tracks Treasury inflation-protected securities, or TIPS, and I bond rates .\n\nThe consumer price index rose 3.7% in September 2026 from one year earlier, up from an annual pace of 3.4% in August, the Bureau of Labor Statistics reported in October.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 10:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'Bad time to troll': Binance cofounder Changpeng Zhao asks Elon Musk for 'respect' after post about bitcoin hack", "full_content": "The cofounder and former CEO of Binance asked Elon Musk not to \"troll\" the company on Friday and instead \"show some support\" after the SpaceX CEO appeared to mock the embattled cryptocurrency exchange in a series of social media posts.\n\nAfter learning the world's largest crypto exchange had been hit by a $6.3 billion hack late Thursday, Musk posted several emojis, ranging from laughing to grimacing, on X.\n\nIn response, Changpeng Zhao reminded the SpaceX and Tesla CEO of Binance's equity stake in Musk's businesses.\n\nBinance\u2019s SpaceX stake, which stems from an earlier investment in what was then-Twitter, is worth more than $1 billion, Zhao said.\n\nThat's a tiny fraction of SpaceX's roughly $2 trillion valuation.\n\n\"Elon, have a lot of respect for you, but bad time to troll. Please stop,\" Zhao wrote. \"Our SPCX shares (from our $500m investment in your Twitter takeover) are worth more than a billion. Would appreciate if you show a little support. Thanks!\"\n\nIn Nov. 2021, Binance suspended Dogecoin withdrawals because of a wallet glitch, a measure Musk called \"shady\". In reply, Zhao highlighted a major Tesla recall of almost 12,000 U.S. vehicles due to software glitches and hardware issues.\n\nBinance froze all withdrawals and deposits after the hack, which investigators suspect to be the work of North Korean state-sponsored hacking unit TraderTraitor. It has since restored deposits.", "source": "CNBC Top News", "pub_date_str": "30 Oct 2026, 10:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Intel stock plunges 30% as weak PC demand and AI costs trigger global chip selloff", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Intel stock plunges 30% as weak PC demand and AI costs trigger global chip selloff Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Intel stock plunges 30% as weak PC demand and AI costs trigger global chip selloff SECTIONS Intel stock plunges 30% as weak PC demand and AI costs trigger global chip selloff ETMarkets.com Last Updated: Oct 30, 2026, 11:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Intel shares plunged 30% after the chipmaker issued a weak fourth-quarter revenue forecast and
