    const allData = {"general": [{"title": "Oil prices fall as IEA members agree to prioritize release of diesel stocks", "full_content": "Crude oil prices fell Wednesday after the International Energy Agency's member states agreed to prioritize the release of diesel stocks in an effort to address surging fuel prices.\n\nBrent crude futures, the international benchmark, lost 38 cents to close at $100.20 a barrel. U.S. West Texas Intermediate futures fell $1.16 to settle at $88.28 per barrel.\n\nIEA members agreed to support \"the prioritisation of the release of diesel stocks, to the extent possible, given the current tightness in diesel markets,\" the organization's director Fatih Birol said in a statement.\n\nIEA members have deployed about 325 million barrels of oil under the March emergency action plan to address the supply disruption triggered by the Iran war, Birol said. This leaves about 100 million barrels that have not been released under the March plan, Birol said.\n\nThe member states still have emergency stocks equivalent to 1.1 billion barrels including more than 200 million barrels of diesel, Birol said. The IEA is \"ready to release more of these stocks to the market if and when required,\" he said.\n\nThe IEA meeting and statement comes after the G7 nations agreed Friday to release diesel stocks under pressure from the Trump administration. It is still unclear, however, how much diesel will be deployed.\n\nBrent Oil prices were higher earlier in the session after Iran-backed Houthi militants in Yemen launched fresh strikes on Saudi Arabia, raising concerns that the rebound of oil exports from the Middle East is vulnerable.\n\nOil pumped through the East-West pipeline had reached 5.8 million barrels as of Tuesday morning, according to Saudi Energy Minister Prince Abdulaziz bin Salman. It was closed in early September after sustaining damage in a drone attack.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:47 AM IST", "pub_date_relative": "8m ago"}, {"title": "Modelo owner Constellation is getting creative to bring back beer drinkers as overall demand weakens", "full_content": "Constellation Brands beat quarterly earnings and revenue expectations as its beer brands gained market share, but continued consumer caution tempered results.\n\nAs it navigates high food and fuel prices and choosy shoppers, Constellation is turning to special occasions and diversification to help drive sales.\n\nThe maker of Modelo Especial, Corona and Pacifico on Tuesday reported fiscal second-quarter adjusted earnings of $3.74 per share on $2.63 billion in revenue, ahead of Wall Street estimates of $3.56 and $2.54 billion, respectively.\n\nBeer revenue rose 5% to roughly $2.47 billion, while beer shipments increased 5.5%. However, the company said beer depletions, a measure of sales from distributors to retailers and other customers, declined slightly during the quarter, indicating consumer demand was softer than shipment growth suggests.\n\n\"We have spent much of the first half rebuilding distributor inventory levels,\" said Constellation Brands CEO Nicholas Fink on the company's earnings call on Wednesday. \"While there is always going to be month-to-month variability, September depletions are trending in the right direction.\"\n\nThe broader backdrop remains challenging for beer sellers. U.S. beer sales fell 1.8% year over year in the two weeks ended Sept. 19, according to Nielsen's latest data.\n\nStill, Fink said September beer depletions improved even beyond the benefit of a later Labor Day, and that the recovery was broad-based across channels. He said consumers were \"across the board\" engaging in the category.\n\nSome analysts said the results indicated elevated gas prices have dampened Constellation's performance.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:44 AM IST", "pub_date_relative": "11m ago"}, {"title": "Microsoft and Nvidia are teaming up on a supercharged AI laptop", "full_content": "Powered by Nvidia\u2019s RTX Spark chip, the latest Windows laptop is designed to run AI models and workloads directly on the device.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 12:42 AM IST", "pub_date_relative": "13m ago"}, {"title": "Trump\u2019s diesel order exposes White House limits to counter surging fuel prices", "full_content": "Truckers likely won't see much in the way of relief from President Donald Trump's executive order that allows them to use off-road diesel fuel on America's highways without federal penalties, analysts say.\n\nOff-road diesel is exempt from federal and state excise taxes because it is used for construction and farm equipment, railways and to heat homes. It is dyed red to differentiate it from taxed on-road diesel, but is otherwise the same fuel.\n\nThe federal government charges an excise tax of 24.4 cents per gallon for on-road diesel. In theory, Trump's order spares truckers the tax by allowing them to use red-dyed fuel on the highway, without worrying that the federal government will impose penalties.\n\nBut the president's action only defers the actual tax payment itself until the end of the year, while calling on the Treasury secretary to look for ways to eliminate the deferred obligation altogether.\n\n\"While it might be deferred, it may not disappear entirely,\" said Andy Lipow, president of Lipow Oil Associates. \"Maybe you save a little bit of money up front, but you might have to pay it to the government later.\"\n\nTreasury is preparing guidance to provide \"clarity on the obligations for users and sellers of dyed diesel,\" a White House official told CNBC on condition of anonymity.\n\nTreasury has enforcement discretion, the official said. The Internal Revenue Service will only enforce the deferred tax liability if it is directed to do so by the Treasury secretary and the president, the official said.\n\nThe IRS will soon make a determination on \"whether dedicating its limited resources to fuel tank inspections and fuel sampling investigations represents the best use\" of its resources, the official said.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:41 AM IST", "pub_date_relative": "13m ago"}, {"title": "Former star US bond manager Leech fined by SEC, following guilty plea in \u2019cherry-picking\u2019 case", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:38 AM IST", "pub_date_relative": "17m ago"}, {"title": "New data strengthens our faith in a TJX comeback. Plus, the Nvidia-Microsoft PC is here", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:37 AM IST", "pub_date_relative": "17m ago"}, {"title": "Trump says Federal Reserve Board would like to see the country do badly", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:37 AM IST", "pub_date_relative": "18m ago"}, {"title": "US FCC to vote to ban Chinese labs from testing US electronics", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:36 AM IST", "pub_date_relative": "18m ago"}, {"title": "Microsoft brings more AI to PCs as it challenges Apple", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:36 AM IST", "pub_date_relative": "18m ago"}, {"title": "The 101 best October Prime Day deals: We found 53% discounts on TVs and headphones - Mashable", "full_content": "The 101 best October Prime Day deals: We found 53% discounts on TVs and headphones Mashable October Prime Day ends tonight: The best Amazon deals on Hanes, Carhartt, Apple and more Yahoo Dyson, Breville, Apple: the 59 best Amazon Prime Day deals actually worth it, obsessively vetted by us The Guardian It\u2019s Prime Day (Again). Here Are the Best Deals From Amazon\u2019s Prime Big Deal Days. The New York Times LIVE: Shop today's best Amazon Prime Big Deals before they're gone USA Today", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 12:34 AM IST", "pub_date_relative": "20m ago"}, {"title": "SEC warns asset managers against collaborating on activist campaigns", "full_content": "US regulator says fund groups risk stricter rules after a probe into the ousting of ExxonMobil board members", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 12:34 AM IST", "pub_date_relative": "20m ago"}, {"title": "Oil prices settle down as IEA agrees to accelerate oil stock release", "full_content": "HOUSTON, - Oil prices settled lower on Wednesday following a choppy session after the International Energy Agency agreed to speed up a release of oil stocks and prioritize diesel in a bid to curb record-high fuel prices as the Iran war squeezes global supplies.\n\nBrent crude futures settled down 38 cents, or 0.38%, at $100.20 a barrel. US West Texas Intermediate crude futures settled down $1.16, or 1.3%, to $88.28.\n\nThe IEA said completing previously announced releases as quickly as possible could bring around 100 million barrels to market, although analysts and some governments said the figure did not necessarily represent a fresh intervention of that size.\n\nFrance will release 10 million barrels of diesel from its strategic stocks, Franceinfo radio reported on Wednesday, citing unnamed sources.\n\n\"Europe is ground zero for this whole supply crunch ... and the releases address that and some of the heat off the need for WTI to a degree. This should reduce some of the pressure on US supplies,\" said John Kilduff, partner at Again Capital.\n\nMeanwhile, US crude stocks and distillate inventories fell while gasoline stocks rose last week, the Energy Information Administration said. [EIA/S]\n\nCrude inventories fell by 3.2 million barrels to 424.1 million barrels in the week ended October 2, the EIA said, compared with analysts' expectations in a Reuters poll for a 1.7 million-barrel rise.\n\nInvestors are not convinced that recent rises in supply and exports from the Middle East are sustainable, PVM analyst Tamas Varga said, adding prices also drew support from the approaching US storm and the continuing conflicts in the Middle East and Ukraine.", "source": "LiveMint Markets", "pub_date_str": "08 Oct 2026, 12:34 AM IST", "pub_date_relative": "20m ago"}, {"title": "Diesel price jumps after IEA says no additional fuel will be released", "full_content": "Agency members say 100mn barrels promised by G7 will come from 400mn stock release agreed in March", "source": "FT Markets", "pub_date_str": "08 Oct 2026, 12:32 AM IST", "pub_date_relative": "22m ago"}, {"title": "Consumer credit growth falls short of expectations, signaling caution", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:32 AM IST", "pub_date_relative": "23m ago"}, {"title": "Trump administration plans to charge international students $70,000 for work authorization", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:31 AM IST", "pub_date_relative": "23m ago"}, {"title": "AbbVie options flow shows 4:1 call-to-put ratio as stock rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:29 AM IST", "pub_date_relative": "25m ago"}, {"title": "Arrive AI hosts investor showcase at Indiana headquarters", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:26 AM IST", "pub_date_relative": "28m ago"}, {"title": "Microsoft to sell $2,599 Surface Laptop Ultra containing Nvidia AI chip", "full_content": "Microsoft said its new laptop containing an Nvidia AI chip will start at $2,599, as the software maker tries to bring more artificial intelligence capabilities to its consumer devices.\n\nThe Surface Laptop Ultra is now available on preorder and will begin shipping on Oct. 16, Pavan Davuluri, Microsoft's executive vice president of Windows and devices, said at a company event in San Francisco on Wednesday. The computer has the world's first magnetic USB-C port, similar to Apple's MagSafe charging connector, along with two other standard USB-C ports, Microsoft said in a blog post .\n\nWhile Microsoft Windows is the most popular operating system for PCs, the company isn't among the top six PC vendors in terms of unit shipments, according to an estimate from researcher Gartner. As the AI boom matures and chip technology advances, tech giants including Microsoft, Apple and Google are aiming to allow users to run more AI workloads from their devices rather than relying on the cloud.\n\nUsers can install and run a variety of models on the new laptop without having to worry about racking up high monthly bills. Microsoft first talked about the Surface Laptop Ultra in May, but is just now providing specifics.\n\n\"Microsoft might get me back to Windows,\" Max Weinbach, an analyst at Creative Strategies, wrote on X after the announcement.\n\nDavuluri also said that Meta will introduce a version of its popular Muse AI agent for Windows, capitalizing on the surging popularity of the personal agent, which has jumped to the top of Apple's App store, surpassing ChatGPT.\n\nMicrosoft is still trying to solidify its role as a key player in AI. The company offers its own AI models, but they're less popular than leading models from OpenAI and Anthropic and aren't at the forefront in terms of performance, according to one benchmark .", "source": "CNBC World Economy", "pub_date_str": "08 Oct 2026, 12:25 AM IST", "pub_date_relative": "30m ago"}, {"title": "US Fed minutes show members backing another rate hike before year-end", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Fed minutes signal another rate hike by year-end as inflation stays high Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Fed minutes signal another rate hike by year-end as inflation stays high SECTIONS US Fed minutes signal another rate hike by year-end as inflation stays high ETMarkets.com Last Updated: Oct 08, 2026, 12:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis According to the latest minutes from the US Federal Reserve, officials hint at a possible interest rate rise by year's end in response to ongoing inflation challenges. With inflation reaching a high of 7.2% in June 2022, fluctuations have continued amid worries over geopolitical events and escalating energy costs. The Fed faces the complex task of controlling inflation while ensuring stable employment within the economy.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "08 Oct 2026, 12:23 AM IST", "pub_date_relative": "31m ago"}, {"title": "Glaukos options flow shows bearish hedge as GKOS rallies 6.6%", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:23 AM IST", "pub_date_relative": "31m ago"}, {"title": "Sunrun options activity dominated by a single two-leg structure", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Oct 2026, 12:20 AM IST", "pub_date_relative": "34m ago"}, {"title": "Supertanker chartered from Gulf Coast to China for $76 million, 10 times higher than pre-war level", "full_content": "(Subscribe to Brian Sullivan's \"Power Insider\" newsletter here .)\n\nA supertanker was recently chartered to sail from the U.S. Gulf Coast to China for $76 million, a source familiar told CNBC, as shipping costs soar globally due to the crisis in the Middle East.\n\nThe Alexandros was chartered by the trading firm Trafigura and is expected to load around Nov. 19, the source said. A normal rate for the route based on pre-war levels would be $7 million to $10 million.\n\nThe cost of the journey comes to $38 per barrel of oil assuming the tanker holds 2 million barrels. Shipping costs have exploded as the war in the Persian Gulf has led to a shortage of available tankers.\n\nBrent crude oil, YTD The Middle East producers are using a shuttle system to export oil through the Strait of Hormuz. A loaded tanker crosses the strait and then loads the oil onto another ship in the Gulf of Oman that takes the cargo to Asia. This system reduces the exposure to Iranian attack and has led to a rebound of crude exports through Hormuz. But it also requires a lot more ships to get the oil out of the Gulf.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:20 AM IST", "pub_date_relative": "34m ago"}, {"title": "10-year Treasury yield backs off from 24-year high after solid bond auction eases demand fears", "full_content": "U.S. Treasury yields came off their highs after a solid sale of 10-year notes. Earlier, the 10-year yield rose to its highest level in more than two decades.\n\nThe 10-year Treasury last traded around 3 basis points higher at 5.288%. Earlier in the session, it reached 5.35%, its highest level since 2002. The 30-year Treasury bond yield also traded below a 24-year high, at 5.67%.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nThe Treasury sold $39 billion of 10-year notes in an auction on Wednesday. According to BMO, the sale was \"strong\", with higher than average bidding from non-dealers.\n\nIndirect bidders, which include global central banks, took 80.3% of the auction \u2014 above a 10-auction average of 72.4%. Direct bidders, scooped up 17.1% of the sale, just below an average of 18.3%. Dealers, meanwhile, bought just 2.5% of the notes offered, well below a 9.4% mean.\n\n\"The 24-year highs in rates brought out the buyers and resulted in a great auction,\" said Peter Boockvar, market strategist and author of The Boock Report.\n\nNonetheless, it still was the highest auction yield since 2000 at 5.3%.\n\nThis was the second of three Treasury Department sales this week. The government sold $58 billion in 3-year notes on Tuesday and is scheduled to sell $22 billion 30-year bonds on Thursday.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:17 AM IST", "pub_date_relative": "37m ago"}, {"title": "Strange market anomaly is creating a buying opportunity in the Nasdaq 100", "full_content": "The Nasdaq-100 Index continues its historic run. Total returns (appreciation plus dividends) topped 24% year-to-date, and the index has nearly tripled, up 193.37% since the end of 2022 (again with dividends reinvested). If you're suffering from a mix of FOMO and vertigo from the steep price appreciation, read on.\n\nOne notable feature of this rally has been \"low breadth\". It's the same group of mega-cap tech titans doing the vast majority of the heavy lifting in the index overall. The top 10 largest companies in the NDX Index comprise half its weight by market capitalization.\n\nNarrow leadership means the market's strength relies on a small, undiversified group of companies. For investors looking to play continued strength while reducing the risk of that same narrow group suddenly reversing, the options market may offer an answer. A way to go long tech with strictly defined risk.\n\nThe secret to this is a little wonky; it's called \"implied correlation\", but bear with me, it's worth it. Implied correlation is an adjunct to implied volatility - how options traders think of options prices. When implied correlation of an index is low, the prices of options on that index, at least relative ot the price of options on the individual stocks, are low. Think about that for a second: a handful of stocks are driving index returns, yet options on the index behave as if the index is well diversified, suggesting little risk that the same narrow path forward might suddenly double back on itself.\n\nRight now, the 1-month forward-looking implied correlation for the NDX sits at just 0.177. To put that in perspective, we are hovering in the 25th percentile\u2014far closer to the three-year low of 0.128 than the three-year high of 0.567. Meanwhile, 1-month trailing realized correlation is currently 0.158. One more consideration.", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:14 AM IST", "pub_date_relative": "40m ago"}, {"title": "Airfare is 23% higher than last year. Is now a good time to use points for flights?", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nIf you're planning to fly home for the holidays, you'll pay more this year compared to last year.\n\nRising fuel prices and strong demand have contributed to airfare soaring 23.4% above last year's prices, according to consumer price index data released in September.\n\nThis begs the question: Is now the best time to use credit card rewards for flights?\n\nAirlines may have fixed or dynamic prices for award flights, so you could get more value for your miles \u2014 or you could end up paying more miles than before.\n\nRegardless of what's happening with ticket prices, it's always a good idea to use your miles and points regularly. Rewards are subject to inflation through consistent devaluations, so in that sense, now is always the best time to use your credit card and loyalty rewards.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .\n\nMany international airline loyalty programs feature fixed award prices based on zones or the distance traveled. Even if you're not planning to visit a European Christmas market this holiday season, these programs can be valuable for booking domestic travel .", "source": "CNBC Top News", "pub_date_str": "08 Oct 2026, 12:12 AM IST", "pub_date_relative": "42m ago"}, {"title": "Fed officials see another hike coming, but no sign as to when, minutes show", "full_content": "Federal Reserve officials expect they will raise interest rates again before the end of the year to head off inflation that has run above target for more than five years, according to meeting minutes released Wednesday. But the meeting summary provided no indication of when specifically policymakers expected to raise benchmark rates \u2013 only that persistently higher prices and a stable labor market likely would lead to a second hike this year. The Fed next decides on rates on Oct. 28 and then again on Dec. 9. \"With regard to the outlook for monetary policy beyond the current meeting, most participants assessed that another increase in the target range for the federal funds rate would likely be appropriate by year end,\" the document stated. That position came with a note of caution. \"Participants emphasized, however, that they approached each meeting with an open mind and decisions at future meetings would depend on incoming information and its implications for the outlook and the balance of risks,\" the minutes said. Coming off the meeting, which featured tough inflation talk from Chairman Kevin Warsh during his subsequent news conference, markets started betting the Fed would follow the Sept. 16 hike with another move at the late October meeting. However, recent inflation data and comments from leading Fed officials indicate that at least for October, another increase is unlikely. The Fed's preferred gauge \u2013 the personal consumption expenditures price index \u2013 showed core inflation at 3% for August and headline at 3.4%. While both readings were still well north of the central bank's 2% target, they were considerably lower than expectations, benefiting in part from changes in the way some of the inputs are calculated. Discussion at the September meeting showed officials see risks that inflation will prove sticky, while the labor market is \"close to maximum employment\" and economic growth overall has picked up.", "source": "CNBC Finance", "pub_date_str": "08 Oct 2026, 12:12 AM IST", "pub_date_relative": "42m ago"}, {"title": "Micron Stock Rebounds Despite Memory Plant Threat - Barron's", "full_content": "Micron Stock Rebounds Despite Memory Plant Threat Barron's MU Stock Adds 3% As D.A. Davidson Forecasts Stock Value To Triple On Valuation Play Yahoo Finance Micron: The Memory Cycle Is Approaching Its Peak (NASDAQ:MU) Seeking Alpha Micron\u2019s ridiculously cheap stock could triple from here, according to this analyst\u2019s math MarketWatch Micron Stock Is Waiting On One Answer Trefis", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 12:07 AM IST", "pub_date_relative": "48m ago"}, {"title": "Supertanker chartered from Gulf Coast to China for $76 million, 10 times higher than pre-war level - CNBC", "full_content": "Supertanker chartered from Gulf Coast to China for $76 million, 10 times higher than pre-war level CNBC Supertanker chartered for $76M from US Gulf to China amid soaring shipping costs Pluang Supertanker to China chartered for $76 million \u2014 CNBC UA.NEWS", "source": "Google News Business", "pub_date_str": "08 Oct 2026, 12:02 AM IST", "pub_date_relative": "52m ago"}, {"title": "Stocks are increasingly their own best hedge. This chart shows why.", "full_content": "For decades, investors concerned about stocks sought succor in the bond market. But these days, the best shield against an outbreak of volatility might just be owning other stocks.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Oct 2026, 12:01 AM IST", "pub_date_relative": "54m ago"}, {"title": "Gold prices drop over 2%, slide to 2-month low as Treasury yields, US dollar climb", "full_content": "Gold prices came under renewed selling pressure in Wednesday\u2019s trade, with spot prices falling to a two-month low, pressured by rising Treasury yields, which continued to hover at multi-decade highs, while a strengthening US dollar also weighed on the bullion.\n\nSpot gold fell 2.3% to reach an intraday low of $4,066 per ounce , its lowest level since August 5. The US dollar index climbed 0.5%, making greenback-denominated gold more expensive for holders of other currencies, while 10-year US Treasury yields were at an over two-decade high.\n\nThe 10-year Treasury yield last traded around 1 basis point higher at 5.282%. Earlier in the session, it reached 5.35%, its highest level since 2002 . The 30-year Treasury bond yield also traded just below a 24-year high, at 5.655%.\n\nInvestors are demanding greater compensation to hold global bonds as concerns about persistent inflation, government spending, and surging corporate borrowing to finance the artificial intelligence buildout intensify.\n\nThat sense of unease is being compounded by France\u2019s fiscal woes, which are threatening to drag the European Central Bank into the kind of face-off with markets it hasn\u2019t seen since the euro area\u2019s debt crisis more than a decade ago.\n\nAmericans\u2019 short-term inflation expectations jumped last month, while sentiment toward the labor market improved, according to a Federal Reserve Bank of New York survey.\n\nMarkets are largely expecting the Fed to keep interest rates on hold later this month but are still pricing in an 84% chance of a December increase, according to CME\u2019s FedWatch tool.\n\nKansas City Fed President Jeff Schmid said curbing inflation may require further rate hikes. San Francisco Fed President Mary Daly also said the policy path would depend on whether inflationary pressures continue.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 11:59 PM IST", "pub_date_relative": "55m ago"}, {"title": "US government bonds steady after strong 10-year Treasury auction", "full_content": "French, Italian and UK government bonds under pressure in volatile trading", "source": "FT Markets", "pub_date_str": "07 Oct 2026, 11:58 PM IST", "pub_date_relative": "57m ago"}, {"title": "Fed\u2019s minutes show no appetite for a series of interest-rate hikes", "full_content": "September\u2019s rate hike was viewed by many officials as needed just in case inflation remains sticky.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 11:58 PM IST", "pub_date_relative": "57m ago"}, {"title": "Foreign investors pull out $26.3 billion from emerging markets in September as hawkish Fed pushes US Treasury yields higher", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Foreign investors pull out $26.3 billion from emerging markets in September as hawkish Fed pushes US Treasury yields higher Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Foreign investors pull out $26.3 billion from emerging markets in September as hawkish Fed pushes US Treasury yields higher SECTIONS Foreign investors pull out $26.3 billion from emerging markets in September as hawkish Fed pushes US Treasury yields higher ETMarkets.com Last Updated: Oct 07, 2026, 11:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign investors pulled $26.3 billion from emerging-market stocks and bonds in September due to rising US yields. The hawkish Federal Reserve's interest rate hike influenced this first outflow since June. Additionally, heavy foreign selling in South Korea resulted in a significant decrease in emerging-market equities. While fixed-income assets attracted $246 billion this year, equities saw year-to-date outflows of $113.9 billion.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 11:56 PM IST", "pub_date_relative": "58m ago"}, {"title": "\u20b9159.59 crore salary shortfall: Mizoram's autonomous councils say DA, pay revisions, increments straining finances", "full_content": "The three Autonomous District Councils (ADCs) in Mizoram are struggling with combined salary shortfall of \u20b9 159.59 crore, their leaders informed the state government on Wednesday, 7 October, PTI reported.\n\nChief Executive Members (CEMs) of the Mara, Lai and Chakma ADCs have appealed seeking intervention from the state to ensure adequate funding for the councils, the report added.\n\nThe three CEMs said the financial strain had increased with successive pay revisions, dearness allowance ( DA ), annual increments, promotions and regularisation of employees, while non-salary allocations had remained largely stagnant.\n\nThey said the state government provided funds under separate salary and non-salary heads until 2023-24, while from 2024-25 onwards the funding has been provided under the \u201cGrant-in- Aid (General)\u201d head.\n\nThe leaders alleged that unlike during the first State Finance Commission period, when additional salary requirements were generally met through Revised Estimates (RE), the ADCs received such additional funding only in 2022-23 during the second commission period from 2021-22 to 2025-26.\n\nThis has created difficulties for employees , churches and the general public in the ADC areas, they said.\n\nLaikaw claimed that the three ADC areas account for around 16% of Mizoram 's population, according to the 2011 Census, but receive only around 4% of the state's funds, the report added.\n\nThe leaders said 20 departments were entrusted to the three ADCs in 1993, but the corresponding development works and schemes had not been fully transferred to them.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 11:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Americans grow more pessimistic about their finances, New York Fed finds \u2014 expert warns of \u2018tough choices\u2019 ahead", "full_content": "Americans are increasingly worried about their financial outlook amid expectations that inflation could worsen in the year ahead, according to a New York Federal Reserve survey released Wednesday.\n\nThe central bank's monthly Survey of Consumer Expectations found that consumers expect inflation to be even higher a year from now, while perceptions about their own financial standing deteriorated.\n\nMore households surveyed reported they were in a worse financial situation than a year ago and expected to be in a weaker financial state in the coming year, the New York Fed found. The New York Fed's Survey of Consumer Expectations polls a rotating panel of approximately 1,300 households.\n\n\"This data is just further proof that Americans are worried about inflation getting worse before it gets better,\" said Matt Schulz, chief credit analyst at LendingTree.\n\n\"Many Americans are already living on tight budgets and looking for ways to stretch their dollars further,\" he said. \"Their glum outlook on inflation likely means that many families expect to make some sacrifices and tough choices in the months to come.\"\n\nConsumers are feeling the pinch of higher prices for necessities like gasoline, other reports also show.\n\nGas prices were up nearly 4% in the month of August and more than 27% from August 2025, according to the latest consumer price index . Consumers paid a national average of $4.37 per gallon as of Wednesday, according to AAA \u2014 up from about $3.12 a year ago.\n\nElevated fuel costs threaten to push up costs for other consumer goods as well, at a time when Americans remain concerned about affordability and are widely dissatisfied with high prices, economists say.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 11:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "At Least 24 Dead As Russian Barrage Pounds Ukraine; Zelenskyy Denounces 'Vile' Strikes", "full_content": "Russia launched a massive overnight barrage of missiles and drones across Ukraine, killing at least 24 people, including four children, and damaging homes and critical infrastructure.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 11:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX may chase \u2018stunning\u2019 AI returns by taking on a lot of debt to buy Nvidia chips", "full_content": "A report says SpaceX is considering raising $40 billion to finance the purchase of advanced graphic processing units and related systems.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 11:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Government to review fixed costs for urea plants, subsidy payouts may change",
