he honour of a lifetime,\" Pattinson said in a statement . \"I couldn't be more excited about this partnership and the work ahead with this fantastic team.\"\n\nPattinson has appeared in several big-ticket films this year, including Christopher Nolan's \"The Odyssey\" and psychological thriller \"Primetime ,\" and he'll soon appear in \"Dune: Part Three,\" also directed by Villeneuve. Pattinson, who rose to fame with the Twilight movie series, is also in production for Matt Reeves' \"The Batman Part II,\" a follow-up to the 2022 film based on the DC comic.\n\nThe upcoming Bond film will have a script by Steven Knight and will be produced by Amy Pascal, known for her work on the Spider-Man franchise, and David Heyman, who produced all eight Harry Potter films.\n\n\"We were surrounded by extraordinary talent, but there can only be one 007,\" Villeneuve said. \"I am overjoyed to welcome Robert Pattinson as our new James Bond. He has the timeless soul of 007 and brings a spirit that is completely new. I cannot wait to begin.\"\n\nIn 2022, Amazon bought MGM Studios , which had long produced the Bond movies, for roughly $8.45 billion . Amazon MGM then acquired creative control of the James Bond intellectual property rights in 2025, when it closed a deal with longtime producers Barbara Broccoli and Michael G. Wilson.\n\nThe film is still untitled, and Amazon MGM hasn't announced a projected release date.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 02:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Goldman Forecasts Gold to Take Two Years to Recapture All-Time Highs", "full_content": "(Bloomberg) -- It took gold just one month to climb more than 30% to a record, but its likely to take another two years before the precious metal takes out a new peak, according to Goldman Sachs.\n\nThe bank expects further weakness and heightened volatility in the near term as continued Federal Reserve tightening weighs on non-yielding bullion.\n\n\u201cOnce the Fed starts cutting, we expect Western ETF demand to recover, supporting a stronger gold rally to $5,600/ounce by end-2028,\u201d strategists led by Lina Thomas wrote in a note Monday, adding gold prices could rally if macro-policy hedge demand were to return.\n\nGold has had a bruising year since hitting an all-time high of nearly $5,600 an ounce in late January. The yellow metal is on track for its worst annual loss in more than a decade, down nearly 11% as the artificial intelligence investment boom, soaring bond yields and expectations for higher interest rates have sapped demand for bullion.\n\nIf history is any guide, 2027 will look increasingly like 2022: a rising Fed policy rate weighs on private investor demand, but structural central bank buying keeps a firm bid under gold, according to the strategists.\n\nThose bank purchases may help push gold higher to $4,650 an ounce by the end of next year, they said.\n\nThe metal traded at around $3,860 on Monday. Gold has been trending lower since late August, when Fed Chair Kevin Warsh warned that the central bank had \u201cwork to do\u201d to rein in inflation. Policymakers are widely expected to hike rates at the upcoming policy meeting in December.\n\nFirm inflation data last week prompted traders to bet on a more prolonged tightening cycle stretching into 2027. The Fed began raising rates in September for the first time in three years, lifting the benchmark to a range of 3.75% to 4%.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 02:26 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The Fed Is Worried AI Agents Could Trigger a Bank Run - Gizmodo", "full_content": "The Fed Is Worried AI Agents Could Trigger a Bank Run Gizmodo Fed's Barr warns on AI risks to financial system Reuters Fed\u2019s Barr Says AI Agents Could Fuel Future Bank Runs Bloomberg.com Fed warns of growing financial risks from AI boom Axios Fed Eyes Hedge Fund Leverage and AI Valuations as Risks WSJ", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:20 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Several companies are using Trump tariff refunds for corporate bonuses - The Guardian", "full_content": "Several companies are using Trump tariff refunds for corporate bonuses The Guardian These Companies Are Using Trump\u2019s Tariff Refunds for Executive Bonuses ProPublica These Corporations Are Using Trump Tariff Refunds to Reward Executives\u2014Not Help Consumers Common Dreams Surprise! You\u2019re Never Seeing a Dollar From Trump\u2019s Tariff Refunds The New Republic Tariff Refunds Are Going To Executive Bonuses At These Companies, Report Says Forbes", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:19 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic\u2019s Wall Street whisperer: Meet CFO Krishna Rao", "full_content": "After closing a $65 billion funding round in May, he's been readying the artificial intelligence company for what's widely expected to be a blockbuster initial public offering . The listing could value Anthropic at roughly $1.4 trillion , instantly making it one of the largest tech companies in the world.\n\nRao joined Anthropic in 2024, when the company was still considered an underdog to OpenAI , now its chief rival. He's known as a straight shooter and a deft operator with a relentless work ethic, according to Anthropic investors and former colleagues, and he's played a crucial role in fueling the company's historic rise.\n\nThe 43-year-old finance chief has largely stayed out of the public eye, opting to yield the spotlight to Anthropic's seven co-founders , including CEO Dario Amodei and President Daniela Amodei . But Anthropic's upcoming Nasdaq debut, which is expected to take place on Thursday, will likely push him to center stage, as public market investors and analysts hang on his every word for insight into the AI trade.\n\nRao has nearly two decades of experience in finance across a range of companies, including Fanatics Commerce, a sports merchandise retailer, Cedar, a healthcare payments and billing platform, Airbnb and Blackstone . But he's never taken a company public as a CFO, and the stakes are high.\n\nInvestors are still reeling after Jensen Huang resigned as CEO of Nvidia following shocking reports of three extramarital affairs . The market was already jittery on concerns that rising interest rates would make debt unaffordable for companies that need it for costly infrastructure purchases.\n\n\"He's a committed professional. He's integrity-based, and he's had this meteoric rise in a very, very complex set of companies,\" Jonathan Mildenhall, Airbnb's former marketing chief and a Fanatics board member, told CNBC in an interview. \"There was nothing easy about Airbnb. There was nothing easy about Fanatics.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 02:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Shareholders sue Intel, its CEO and CFO after stock drops 28.6 percent in one day - Ars Technica", "full_content": "Shareholders sue Intel, its CEO and CFO after stock drops 28.6 percent in one day Ars Technica Intel sued by shareholders following 29% stock plunge Reuters Intel sued by investors after PC sales slump hits share price BBC INTW 2X Intel ETF Tumbles 13% as Intel Drops Amid Shareholder Lawsuit and AI Chip Selloff; Taiwan Semiconductor Falls 5% Yahoo Finance Intel Sued by Investors After 29% Stock Plunge WSJ", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 02:07 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Three Reasons Why US Stock Markets Are Crashing: Nasdaq Plunges 2.2%, Dow Sheds 700 Points", "full_content": "The heavier selling was in the wider AI supply chain, with Micron felling 6.29% and Intel 6.22%, while AMD slipped 4.54%.", "source": "NDTV Profit", "pub_date_str": "17 Nov 2026, 01:55 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI and 24-Hour Trading Test Rules Governing Currency Markets", "full_content": "(Bloomberg) -- The rapid growth of artificial intelligence and round-the-clock trading is raising questions about whether rules governing the $9.5 trillion foreign-exchange market can keep pace with technological change.\n\nThe FX Global Code, a set of voluntary standards for conduct in currency markets, may need more frequent reviews to keep pace with advances in AI, according to Manuel Mondedeu, co-head of global foreign exchange at CIBC Capital Markets and co-vice chair of the Global Foreign Exchange Committee. The goal is to make implementation \u201ca bit more dynamic\u201d without changing the underlying principles, he said Monday at a Federal Reserve Bank of New York conference.\n\nThe committee\u2019s 30-member technology working group is examining whether some of the Code\u2019s principles need to be updated to reflect advances in technology, Mondedeu said. Some market participants, however, argue the existing standards are broad enough to apply to new technologies without changes.\n\nAI offers the potential to improve trading by analyzing vast amounts of data more quickly and giving more market participants access to sophisticated tools, said Anna Nordstrom, head of the markets group at the Federal Reserve Bank of New York.\n\nBut the technology also carries risks, including reduced transparency and the possibility that traders relying on similar data and models could increasingly make the same decisions, she said.\n\nThe move toward 24-hour trading and instant settlement using blockchain and tokenization could create additional challenges, Nordstrom said.", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 01:37 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nvidia board is not considering bringing Jensen Huang back as CEO, source tells CNBC", "full_content": "Nvidia's board of directors is not considering bringing back Jensen Huang as CEO, a person familiar with the matter told CNBC.\n\nThe board is focused on an investigation into Huang, and is not in discussions to bring him back, said the person, who spoke on condition of anonymity in order to discuss internal matters. Nvidia has hired law firm Wachtell Lipton to lead a probe into Huang's conduct and whether it compromised national security or company secrets.\n\nLast week, Huang resigned from Nvidia, the company he founded, after 33 years as CEO. The resignation came days after Huang admitted to an affair, and news stories alleged he had an affair with Alice Huang, who worked for a customer and is alleged to have contact with Chinese intelligence, as well as affairs with employees at Nvidia.\n\nOver the weekend, the Financial Times reported that Huang had discussed coming back with allies. Altimeter Capital's Brad Gerstner told CNBC on Monday that Huang had not discussed a comeback with him.\n\nA representative for Huang declined to comment on speculation on Sunday.\n\nMany in the tech world have called for Huang to return as Nvidia CEO.\n\nAn online petition calling for his reinstatement has drawn 180,000 signatures as well as support from major figures including Elon Musk , Y Combinator CEO Garry Tan and Epic Games CEO Tim Sweeney.\n\nPresident Donald Trump said on Monday that he is open to Jensen Huang returning as CEO of Nvidia.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 01:16 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "California sues ChatGPT maker OpenAI over rogue hacking incidents - NBC News", "full_content": "California sues ChatGPT maker OpenAI over rogue hacking incidents NBC News California sues OpenAI over Hugging Face, other AI model loss of control CNBC OpenAI sued by California over 80 \u2018loss of control\u2019 incidents Financial Times California sues OpenAI over hacking risks NPR California AG Accuses OpenAI of Misleading and Endangering the Public WSJ", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 01:04 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Prediction market odds for Tesla-SpaceX merger by April 2027 top 60%", "full_content": "The odds have climbed to 62% from 27% since Thursday, amid growing speculation that Musk's two companies will integrate.", "source": "CNBC Top News", "pu         document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
