    const allData = {"general": [{"title": "Bernstein initiates Forgent Power Solutions stock with outperform", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:31 PM IST", "pub_date_relative": "5m ago"}, {"title": "RBC Capital initiates Uranium Energy stock with sector perform rating", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:30 PM IST", "pub_date_relative": "6m ago"}, {"title": "Airbus deliveries top 70 aircraft in September, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:30 PM IST", "pub_date_relative": "6m ago"}, {"title": "UBS resumes Patterson-UTI Energy stock coverage with neutral rating", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:30 PM IST", "pub_date_relative": "6m ago"}, {"title": "UBS resumes Helmerich & Payne stock coverage with buy rating", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:30 PM IST", "pub_date_relative": "6m ago"}, {"title": "S&P 500 futures edge higher as September jobs report looms: Live updates", "full_content": "Stock futures inched higher early Friday as traders awaited the release of September's jobs report.\n\nS&P 500 futures were up 0.26%, while futures tied to Dow Jones Industrial Average were up 125 points, or 0.24%. Nasdaq-100 futures advanced 0.42%.\n\nIn the regular trading day, the Dow and the Nasdaq Composite ended the session marginally higher. The S&P 500 posted a 0.2% advance to conclude the first trading day in October. All three indices are on pace for weekly losses, with the Dow off 1.7% in the period.\n\nAsia-Pacific stocks were mostly lower Friday. Japan's Nikkei 225 declined 0.95%, after gaining sharply on Thursday. South Korea's Kospi lost 1%. Hong Kong's Hang Seng Index lost 2.48% after resuming trade from a holiday. Australia's S&P/ASX 200 was up 0.35%.\n\nTreasury yields climbed to multiyear highs before retreating. The benchmark 10-year Treasury note yield soared to 5.344%, its highest level since 2002. The yield on the 30-year Treasury bond also reached its highest in 24 years.\n\nOil prices also climbed after The Wall Street Journal reported the U.S. is sending a third aircraft carrier strike group to the Middle East. Brent crude futures gained more than 4% to close at $102.31 per barrel, while U.S. West Texas Intermediate futures advanced 2.7% to settle at $92.87 a barrel.\n\nSeptember's nonfarm payrolls report will be in the spotlight Friday, with the Dow Jones consensus calling for job growth of 84,000 and for the unemployment to hold steady at 4.1%.\n\nThe report comes as traders reassess the next move for the Federal Reserve. Fed funds futures trading suggests a 72% likelihood the central bank will stand pat in October.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:30 PM IST", "pub_date_relative": "6m ago"}, {"title": "JPMorgan cuts Sigma Lithium stock rating on mining suspension", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:26 PM IST", "pub_date_relative": "10m ago"}, {"title": "Volvo Cars warns of weaker sales, cash flow", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:24 PM IST", "pub_date_relative": "12m ago"}, {"title": "Gold steadies as stronger dollar, higher yields weigh; U.S. jobs data awaited", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:23 PM IST", "pub_date_relative": "13m ago"}, {"title": "Capita to face UK audit review over Civil Service pension contract", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:23 PM IST", "pub_date_relative": "13m ago"}, {"title": "Wizz Air sees September passengers jump 24% on higher capacity", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:21 PM IST", "pub_date_relative": "15m ago"}, {"title": "Coal India, NTPC among 360 ONE Capital Research\u2019s 8 stock picks for October. Check full list with target prices", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Coal India, NTPC among 360 ONE Capital Research\u2019s 8 stock picks for October. Check full list with target prices Written by Kumar Gaurav , ETMarkets.com | Oct 02, 2026, 12:16:02 PM IST 1 / 9 Bullish Bets 360 ONE Capital Research has identified eight stocks as its top picks in its October 2026 portfolio update. The list includes Coal India, NTPC, ITC and five other stocks, with the brokerage outlining its target prices and key factors supporting each Buy recommendation.\n\nCoal offtake is expected to rise as plants rebuild inventories and thermal generation remains robust. Higher e-auction premiums and a tight demand-supply backdrop could support better coal realisations and margins, 360 ONE Capital Research said.\n\nStrong credit growth and a healthy liability franchise are expected to support loan and deposit growth through FY26-28E. The brokerage expects asset quality and credit costs to remain under control, while the higher EBLR book should help contain NIM pressure.\n\n60 ONE Capital Research expects pricing power to carry greater weight than cigarette volume declines following recent tax hikes. Staggered and phased price increases in well-known brands are expected to offset the impact of lower volumes.\n\nStrong power demand and improving coal-based PLF are expected to increase power generation and sales. The expanded renewable portfolio and long-term diversification into nuclear power support the outlook.\n\nEugia, PenG, Lannett and Theranym provide several growth triggers, alongside EBITDA guidance of 23-24%+. The brokerage expects US revenue to reach US$2 billion over the next few years.\n\nMargins are expected to normalise as the product mix streamlines and the GST ITC impact neutralises from 3Q.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 12:09 PM IST", "pub_date_relative": "27m ago"}, {"title": "HDFC Bank shares: How stock fared since Atanu Chakraborty's exit till Anup Bagchi appointment- Performance data details", "full_content": "HDFC Bank shares have endured a turbulent 2026, with the stock coming under sustained pressure amid a series of leadership changes, governance concerns and continuing post-merger challenges.\n\nThe turbulence began in March following the sudden resignation of former chairman Atanu Chakraborty and was followed months later by CEO Sashidhar Jagdishan\u2019s planned exit, leaving investors focused on the bank\u2019s leadership stability.\n\nAs of October 2026, HDFC Bank shares were trading at \u20b9 721.20, down around 15% from Chakraborty\u2019s resignation date on March 18 and nearly 30% below their 52-week high. The stock\u2019s performance in 2026 marked its worst calendar-year showing since 2008, according to the data provided.\n\nChakraborty\u2019s abrupt departure on March 18 triggered an immediate sell-off in HDFC Bank shares. In the four trading days following his resignation, the stock plunged 12%, wiping out roughly $16 billion in investor wealth as markets reacted to concerns around the bank\u2019s governance and leadership.\n\nIn his resignation letter, Chakraborty said that \u201ccertain happenings and practices within the bank\u201d observed over the preceding two years were \u201cnot in congruence\u201d with his personal values and ethics.\n\nThe Reserve Bank of India subsequently stepped in to calm market concerns, stating that it had found no material issues relating to HDFC Bank\u2019s governance, conduct or financial soundness.\n\nHDFC Bank also appointed independent external law firms Trilegal and Wadia Ghandy & Co to review the allegations. In June 2026, the reviews concluded that Chakraborty\u2019s operational allegations were not supported by internal records or witness interviews.\n\nThe stock briefly recovered around 5% following the conclusion of the legal reviews. However, the recovery did not last as other fundamental concerns continued to weigh on the shares.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 12:07 PM IST", "pub_date_relative": "29m ago"}, {"title": "South Korean President Lee warns of 'measures' against Ukraine over prisoner row, demands apology", "full_content": "South Korean President Lee Jae Myung on Friday slammed Ukraine over its disclosure of handing North Korean prisoners of war to Seoul, demanding a public apology and threatening \"additional measures\" against Kyiv.\n\nIn a post on X , Lee said that Kyiv had unilaterally revealed that some captured North Korean soldiers had been sent to South Korea, despite having demanded confidentiality and later claiming there was no secrecy agreement, making the Korean leader look like a \"liar.\"\n\n\"As this is a matter concerning the honor of the Republic of Korea's people and nation, we cannot overlook it,\" he said in Korean, translated by Google.\n\nUkrainian Foreign Minister Andrii Sybiha reportedly described the row on Thursday as a \"diplomatic misunderstanding,\" which his country expects to resolve. Seoul remains an important partner for Kyiv, Sybiha added.\n\nAt the United Nations General Assembly last week, Ukrainian President Volodymyr Zelenskyy said that Kyiv had sent two captured North Korean soldiers to South Korea.\n\nThat prompted South Korea to accuse Ukraine of breaching a nondisclosure agreement about the transfer and summoning Ukraine's charg\u00e9 d'affaires for an explanation. Seoul also said after the speech that Ukraine had asked for the transfer to be kept a secret, as it could negatively impact prisoner exchanges with Russia.\n\n\"When we demanded acknowledgement of the agreement and an apology, they instead spoke of an imminent military clash between North and South, praying for the outbreak of war on the Korean Peninsula\u2014we express grave regret toward Ukraine,\" Lee said on Friday.\n\nThe comments follow Ukrainian presidential chief of staff Kyrylo Budanov interview last week, where he said that North Korea's participation in the Ukraine-Russia conflict was to prepare for combat on the Korean Peninsula.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:06 PM IST", "pub_date_relative": "30m ago"}, {"title": "ETMarkets Smart Talk| \u2018Desi to Videsi\u2019: How GIFT City is changing the way Indians invest globally \u2014 Mustafa Pardiwala", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a ETMarkets Smart Talk| \u2018Desi to Videsi\u2019: How GIFT City is changing the way Indians invest globally \u2014 Mustafa Pardiwala Powered By The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk| \u2018Desi to Videsi\u2019: How GIFT City is changing the way Indians invest globally \u2014 Mustafa Pardiwala SECTIONS ETMarkets Smart Talk| \u2018Desi to Videsi\u2019: How GIFT City is changing the way Indians invest globally \u2014 Mustafa Pardiwala By Kshitij Anand , ETMarkets.com Last Updated: Oct 02, 2026, 12:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis GIFT City is emerging as a gateway for Indian investors seeking global diversification, offering access to US stocks, ETFs and sectors such as AI and semiconductors. Mustafa Pardiwala of Mirae Asset Capital Markets (IFSC) explains how investors can start with smaller amounts, the role of ETFs, currency risk and fractional investing.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 12:06 PM IST", "pub_date_relative": "30m ago"}, {"title": "Jewelry giant Pandora is getting in on lab-grown diamonds and hoping a new Vietnam plant helps growth in Asia", "full_content": "Danish jewelry giant Pandora has opened its $150 million manufacturing facility in Vietnam, betting on further growth in Asia as the company diversifies production beyond its longtime base in Thailand.\n\nThe move underscores Pandora's growing ambitions in Asia, where the company sees significant room for further expansion.\n\n\"We are clearly building the capacity today for the growth of tomorrow that we expect,\" President and CEO Berta de Pablos-Barbier told CNBC's \" Squawk Box Asia \" on Friday, adding that Asia remains a \"very positive region\" for Pandora after growing at 10% in the second quarter.\n\nIts facility in Ho Chi Minh City is Pandora's first production site outside Thailand and is expected to increase the company's manufacturing capacity by around 50%. The factory can produce up to 60 million pieces of jewelry annually and will employ about 7,000 people when fully operational.\n\nPandora shares The jewelry giant also sees growth opportunities elsewhere in Asia, particularly in Japan.\n\nPandora's Japan business has \"pretty much doubled\" in size over the only three years and continues to grow at \"very high double digits,\" she added.\n\nChina, however, presents a different picture, with the company having seen three years of declines. However, Pandora expects to return to growth there this year.\n\n\"For the first time, we're starting to see growth coming back, and we are actually delivering better growth than we had in the previous year,\" Pablos-Barbier said, adding that she remains positive about the company's ability to continue growing in China.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:57 AM IST", "pub_date_relative": "39m ago"}, {"title": "Hospital stocks: can strong demand offset regulatory risks?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStocks of hospital companies have come under pressure after the Supreme Court raised concerns over high mark-ups on cancer medicines while hearing a petition on drug pricing on 22 September. The Supreme Court has asked the central government why the 16% trade margin applicable to scheduled drugs could not be extended to non-scheduled drugs. The next hearing is scheduled for 12 October, and that\u2019s what investors would be tracking closely.\n\nEarlier, Maharashtra Food & Drugs Administration (FDA) had written to the Department of Pharmaceuticals after finding large mark-ups in medicines and other consumables sold through hospital pharmacies in its survey, and sought monitoring of prices. The Maharashtra FDA found mark-ups of more than 28 times on intravenous infusion sets, around ten times for catheters, and similar mark-ups for various other medicines.\n\nJM Financial Institutional Securities estimates a 2-4% hit on profit margins if the government caps trade margin at 16%. Medicines contribute 20-25% of hospital revenue, according to the brokerage. Hospitals with higher exposure to oncology, such as Max Healthcare Institute and Artemis Medicare Services, may see a larger impact given their higher revenue contribution from pharmacy and consumables.\n\nHowever, it may not be easy for the government to implement the price cap given the complexity of the issue. \u201cWe do not expect a blanket cap on drug margins as such, given the executional/ operational challenges in covering non-scheduled drugs across ecosystems ( pharma , distributor, supply-chain companies),\u201d noted Emkay Global Financial Services.\n\nHospitals have faced regulatory scrutiny over pricing for several years. In 2017, the government sharply reduced the prices for cardiac stents and orthopaedic knee implants by 70-85%.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 11:51 AM IST", "pub_date_relative": "45m ago"}, {"title": "Why Is Accenture Betting On Palantir's Forward-Deployed Engineer Model?", "full_content": "Sweet said the AI ecosystem has become increasingly interconnected over the past year, with hyperscalers and software-as-a-service companies introducing new AI features and functionality rapidly.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 11:50 AM IST", "pub_date_relative": "46m ago"}, {"title": "DA news: Telangana Cabinet approves release of two pending instalments \u2014 when will remaining arrears be cleared?", "full_content": "The Telangana Cabinet has approved the release of two pending instalments of Dearness Allowance (DAs) to state government employees and pensioners, Minister for Revenue, Housing and Information and Public Relations Ponguleti Srinivasa Reddy said, according to The Hindu .\n\nThe minister also noted that the release of the two DA instalments will add around \u20b9 2,500 crore annually to the Telangana government\u2019s financial burden. Despite this, it was approved in line with assurance given to employee unions during recent discussions held in the state.\n\n\u201cThe release of DAs will impose an additional annual financial burden of about \u20b9 2,500 crore on the State government. Chief Minister A. Revanth Reddy has decided to release the DA despite the financial burden, in line with the assurance given during recent discussions with employee unions,\u201d Srinivasa Reddy was quoted as saying in the news report.\n\nBriefing the media after the Cabinet meeting chaired by Chief Minister A. Revanth Reddy at the Secretariat on Thursday, the minister said the two DAs would be released immediately from the arrears pending since 2024.\n\nMeanwhile, the remaining arrears will be cleared in instalments, although no specific timeline for their payment was announced.\n\nThe Cabinet also reportedly discussed the impact of El Nino conditions and deficient monsoon in the state. It decided to form a sub-committee to recommend immediate measures for affected areas, hold consultations with political parties, farmers\u2019 groups and experts from different sectors.\n\n\"The state government would also seek the Centre\u2019s assistance and request the declaration of drought-affected areas,\u201d Srinivasa Reddy told reporters on Thursday, according to The Hindu .\n\nHe further mentioned that Telangana had recorded a rainfall deficit of about 17% during the monsoon, which ended on Wednesday. The Cabinet also decided to make arrangements for procurement of paddy during the kharif season.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 11:47 AM IST", "pub_date_relative": "49m ago"}, {"title": "Washington\u2019s big crypto bill is stuck. The SEC is pushing ahead anyway", "full_content": "The U.S. Securities and Exchange Commission has proposed new rules that would make it easier for investment advisers and regulated funds to hold cryptocurrencies on behalf of clients, as U.S. regulators push ahead with writing crypto rules after a sweeping legislation stalled in Congress.\n\nThe proposal, announced Thursday stateside, would establish a tailored framework governing how registered investment advisers, investment companies and business development companies hold custody of crypto assets.\n\nThe changes are aimed at modernizing decades-old custody requirements and removing regulatory barriers that the SEC says have limited advisers' ability to offer crypto-related investments.\n\nUnder the proposed rules , crypto assets could be held in self-custody under \"certain circumstances,\" while state trust companies could also serve as custodians for crypto assets belonging to clients and regulated funds.\n\nThe changes could also give regulated funds greater scope to offer investors crypto-related investment strategies, according to the SEC.\n\nBitcoin price year-to-date SEC Chairman Paul Atkins said existing regulations had failed to keep pace with the rapid expansion of digital assets, which have grown into a multi-trillion-dollar market.\n\n\"Today\u2019s proposal would provide a clear regulatory framework for the custody of crypto assets, giving investment advisers and funds a compliant pathway where none existed before,\" Atkins said.\n\nThe proposal comes as U.S. regulators push ahead with building out a crypto rulebook under their existing authority after the Clarity Act, a sweeping crypto market structure bill, stalled in the Senate in September .", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:45 AM IST", "pub_date_relative": "51m ago"}, {"title": "Global Markets | Japan's Nikkei retreats from 6-week high as investors lock in gains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Markets | Japan's Nikkei retreats from 6-week high as investors lock in gains Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Markets | Japan's Nikkei retreats from 6-week high as investors lock in gains SECTIONS Global Markets | Japan's Nikkei retreats from 6-week high as investors lock in gains Reuters Last Updated: Oct 02, 2026, 11:43:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese rubber futures saw a minor decline amid a slight pullback in Tokyo equities, yet they continue to show prospects for growth. The Osaka Exchange's rubber contract dropped due to concerns over interest rates and geopolitical instability. With natural rubber production declining alongside consumption, the market faces ongoing supply challenges.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 11:43 AM IST", "pub_date_relative": "53m ago"}, {"title": "Malayalam, Tamil, Telugu OTT Releases This Weekend: Bethlehem Kudumba Unit, #Love", "full_content": "Films like Sardar 2, Toxic and Irumudi are also streaming now, giving viewers plenty of South titles to catch up on.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 11:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bajaj Finance to raise Rs 17,500 cr via QIP, pref issue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bajaj Finance to raise Rs 17,500 cr via QIP, pref issue Bajaj Finserv Share Price Shriram Finance Share Price Jio Financial Services Share Price Tata Capital Share Price Cholamandalam Investment & Finance Company Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bajaj Finance to raise Rs 17,500 cr via QIP, pref issue SECTIONS Bajaj Finance to raise Rs 17,500 cr via QIP, pref issue By Joel Rebello , ET Bureau Last Updated: Oct 02, 2026, 11:35:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bajaj Finance plans to raise up to Rs 17,500 crore through a Rs 11,700-crore QIP and Rs 5,800 crore warrant issue to promoter Bajaj Finserv. The fundraising requires shareholder approval; institutional investors will receive QIP shares while promoter warrants could help maintain Bajaj Finserv\u2019s stake and limit dilution.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 11:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bitget 'not expecting to recover a lot' from $388 million hack, CEO tells CNBC", "full_content": "Approximately $1.1 million of the nearly $388 million stolen from crypto exchange Bitget in last week\u2019s cyberattack has been frozen, as the platform continues efforts to trace and recover the assets.\n\nFrozen assets had not necessarily been returned to the exchange, CEO Gracy Chen told CNBC in an email interview. She did not disclose how much had been recovered.\n\nSpeaking on CNBC\u2019s \u201cSquawk Box Europe\u201d on Wednesday, Chen said she was \u201cnot expecting to recover a lot of funds,\u201d citing the limited recovery from previous cryptocurrency exchange hacks. However, \u201cexchanges have a responsibility to demonstrate how they protect users, particularly when something goes wrong,\u201d she said.\n\nThe exchange valued its protection fund at more than $464 million before the theft. It was drawn down to below $200 million following the hack, according to Bloomberg's calculation of the fund's disclosed wallet addresses, before being restored to more than $300 million. Chen said the replenished fund remained publicly verifiable on-chain and was separate from the reserves backing customer balances.\n\nBitget\u2019s latest Proof of Reserves , based on a Sept. 29 snapshot, showed a self-reported overall reserve ratio of 131%, with all 19 covered assets backed above 100%.\n\n\u201cWe restored the Fund using Bitget\u2019s own capital,\u201d Chen said. \u201cThe financial impact is being absorbed by Bitget rather than passed on to our users.\u201d\n\nInvestigation reports released Sept. 30 by Mandiant , part of Google Cloud, and blockchain security firm SlowMist found that the attackers compromised two third-party security products before gaining access to Bitget\u2019s production wallet systems.\n\nSlowMist traced the earliest malicious activity in available logs to Aug. 31, when a previously unknown, or zero-day, vulnerability was exploited in one of the products.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "FCNR inflows cushion rupee, BoP; FII flows crucial for sustained external stability: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a FCNR inflows cushion rupee, BoP; FII flows crucial for sustained external stability: Report The Economic Times daily newspaper is available online now. Read Today's Paper FCNR inflows cushion rupee, BoP; FII flows crucial for sustained external stability: Report SECTIONS FCNR inflows cushion rupee, BoP; FII flows crucial for sustained external stability: Report ANI Last Updated: Oct 02, 2026, 11:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign currency non-resident inflows have significantly bolstered rupee stability and India's balance of payments. However, the current support from these inflows may not suffice for long-term external stability. Foreign institutional investor flows are crucial for maintaining economic balance as the support from FCNR is absorbed. India's goods deficit has reached a decade-high despite continuous support from services exports and remittances.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "02 Oct 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "India goes FTA shopping at G20 as Piyush Goyal works the room with a cart full of trade deals", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India goes FTA shopping at G20 as Piyush Goyal works the room with a cart full of trade deals The Economic Times daily newspaper is available online now. Read Today's Paper India goes FTA shopping at G20 as Piyush Goyal works the room with a cart full of trade deals SECTIONS India goes FTA shopping at G20 as Piyush Goyal works the room with a cart full of trade deals ET Online Last Updated: Oct 02, 2026, 11:24:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's Commerce Minister Piyush Goyal is actively engaged in negotiations for several trade agreements at the G20 meeting. Talks with the US include an interim pact and finalizing issues for a broader agreement. Discussions with Canada aim to conclude a Comprehensive Economic Partnership Agreement by the end of 2026. Existing trade agreements with the UK and Australia are also under review for their implementation and effectiveness.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "02 Oct 2026, 11:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Coal India shares | Nuvama upgrades to Buy, hikes target price on higher e-auction premium", "full_content": "Coal India continued to see strong growth in both volumes and e-auction premiums, supported by higher thermal power generation, lower coal inventories at power plants and elevated imported coal prices, Nuvama Institutional Equities said. The brokerage noted that Coal India\u2019s offtake rose 12.5% year-on-year to 61.2 million tonnes in September 2026, marking the fifth consecutive month of volume growth. Q2 FY27 and H1 FY27 volumes increased 12% and 7.6%, respectively.\n\nFactoring in higher volumes and e-auction prices, Nuvama raised its FY27/FY28 EBITDA estimates by 6%/4%. The brokerage upgraded Coal India to \u2018Buy\u2019 from \u2018Hold\u2019 and raised its target price to \u20b9 501 from \u20b9 454, including DPS of \u20b9 26.5. Nuvama noted that the stock trades at around 4.1x FY28E EV/EBITDA and offers an estimated 6% dividend yield.\n\nNuvama said strong power demand and critically low coal inventories at power plants position Coal India favourably for continued volume growth in the second half of FY27. The brokerage now factors in 7% YoY volume growth to 796 million tonnes in FY27, followed by 4.5% growth to 832 million tonnes in FY28.\n\nCoal India\u2019s average e-auction premium over the notified price rose sharply to 94% in September from 59% in August and 34% a year earlier, Nuvama noted. The increase was driven by coal shortages in India and higher imported coal prices.\n\nThe proportion of offered coal allocated through e-auctions also increased to 72% in September from 40% in H1 FY27, signalling stronger customer demand. Nuvama expects e-auction prices to remain relatively firm in Q3 FY27 amid elevated global coal prices and robust domestic demand.\n\nThe brokerage has raised its FY27 average e-auction premium assumption to 60% from 51%, while estimating premiums of 60% and 49% for FY27 and FY28, respectively, compared with 42% in FY26.\n\nNuvama also highlighted the proposed listing of Coal India\u2019s subsidiary Mahanadi Coalfields Ltd (MCL) as a potential value-unlocking trigger.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 11:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI Is Great At Science But Not At Being A Scientist. This Professor Explains Why", "full_content": "In a guest post published on Anthropic's research site on Thursday, physicist Matthew Schwartz argues that researchers get the most from AI by giving it problems suited to its strengths.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 11:20 AM IST", "pub_date_relative": "1h ago"}, {"title": "Brazil votes in high-stakes election as U.S.-China rivalry and debt loom large", "full_content": "Brazil will hold a knife-edge vote on Sunday as its presidential race kicks off \u2014 but the election's outcome is likely to be felt far beyond the country's borders. Voters will head to the polls to decide whether incumbent Luiz In\u00e1cio Lula da Silva \u2014 known colloquially as Lula \u2014 should remain in office or be replaced by one of 12 alternative candidates. If no \u200bcandidate wins more than 50% of votes \u200bin Sunday's first round, the two candidates with the most support \u2060will progress to a final runoff vote on Oct. 25. Polls point to a tight race, with frontrunners Lula and Fl\u00e1vio Bolsonaro effectively tied for support among voters. A win for left-leaning Lula would mark his fourth presidential term, while victory for Bolsonaro is expected to mark a shift back to his father's right-wing movement.\n\nLula's center-left Workers Party (PT) has been a pioneer of social programs aimed at lifting millions of people out of poverty \u2014 but it has been stained by corruption scandals. Lula himself spent 18 months in prison after receiving a coastal property from an engineering firm involved in the so-called Car Wash corruption investigation. Former president Dilma Rousseff, who succeeded Lula in 2010, was impeached in 2016, having been accused of budget manipulation. Fl\u00e1vio Bolsonaro is a senator and son of former president Jair Bolsonaro, who is currently under house arrest. Jair Bolsonaro was sentenced to 27 years in prison for plotting a coup after losing the 2022 presidential election to Lula.\n\nBolsonaro is widely viewed as the political heir to his father, with his policy mix favoring privatization, spending cuts and close alignment with the U.S. \u2014 policies that have had recent successes across Latin America, with Bolivia, Chile, Colombia and Peru all inaugurating conservative leaders in the last 12 months.\n\nLula, meanwhile, has put Brazilian sovereignty at the center of his campaign.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "Asian Games 2026: Indian Boxer Lovlina Borgohain Wins Women's 75kg Gold", "full_content": "Indian boxer Lovlina Borgohain won the women's 75kg gold at Asian Games with win over Ziyi Bao of China on Friday.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 11:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "US bond yields: Trump may disappoint stocks, gold investors with these 2 steps to resolve debt crisis | Experts' view", "full_content": "Amid soaring US bond yields , a section of stocks and gold investors across the world is convinced that the Trump administration can't afford this for long, as it is heightening the American debt crisis . They get an extra booster dose when Chris Wood , Head of Equity Research at Jefferies, started to predict at various news platforms that the evidence of the US bond yields suppression, as it has crossed $40 trillion in August 2026, is available and sooner or later the US Treasury Department would either suppress the US Treasury yields or in an extreme condition, the Donald Trump administration may fix the US bond yields, as the Japanese did in the year 2016.\n\nThose stocks and gold investors who believe in this school of thought may face a major disappointment, as the Trump administration has two more options. According to experts, the US President Donald Trump is facing a debt crisis due to the soaring US bond yields. The US is facing this crisis because it hasn't found a new buyer for its debt. They said that those who believe in US bond-yield suppression may be disappointed, as the Trump administration has other options available. The Trump administration just needs to find a new buyer for its debt, experts said.\n\n\u201cI completely agree with this school of thought that rising bond yields, especially the US 10-year bond yield , are throwing tantrums at the Trump administration. However, one must remember that other options are available. On exercising those options, the Trump administration may surprise and disappoint stocks and gold investors, because it would further put these assets under pressure,\u201d said Avinash Gorakshkar, Founder of Avinash Mentor Research.\n\nGorakshkar said that the Trump administration has various other options.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 11:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Donald Quintin: \u2018We\u2019re entering a different market now\u2019", "full_content": "The Lone Star Funds CEO on value investing, higher rates and the credit cycle", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 11:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Down 10% in a month; Bajaj Finance approves \u20b911,700 cr QIP, \u20b95,800 cr warrants to Bajaj Finserv - Share value impact", "full_content": "Bajaj Finance is gearing up for one of its biggest capital-raising exercises, with the company\u2019s board approving a QIP of up to \u20b9 11,700 crore alongside a \u20b9 5,800 crore preferential issue of warrants to promoter and holding company Bajaj Finserv . The move comes as the NBFC looks to strengthen its capital base, with the proposed transactions together amounting to as much as \u20b9 17,500 crore.\n\nThe announcements came after the boards of both companies met on October 1, with the proposed fundraise subject to applicable regulatory and statutory approvals, including shareholder approval. Bajaj Finance said it would seek shareholder approval for both the QIP and preferential issue through an Extra Ordinary General Meeting.\n\nThe Bajaj Finance board approved raising up to \u20b9 11,700 crore through a Qualified Institutions Placement of equity shares with a face value of Re. 1 each. The issue will be made to Qualified Institutional Buyers under Chapter VI of the SEBI ICDR Regulations.\n\n\u201cRaising of capital through a Qualified Institutions Placement (\"QIP\") for an aggregate amount not exceeding Rs. 11,700 Crore (Rupees Eleven Thousand Seven Hundred Crore only) by the issue of equity shares of face value of Re. 1 each,\u201d Bajaj Finance said in its exchange filing.\n\nAlongside the QIP, the company approved a preferential issue of warrants convertible into an equivalent number of equity shares for an aggregate amount of up to \u20b9 5,800 crore. The warrants will be allotted to Bajaj Finserv, which is the promoter and holding company of Bajaj Finance.\n\nThe issue price for the warrants will be determined at a later stage in accordance with applicable law. Bajaj Finance said the price would be determined by its board or a duly constituted committee and would not be below the applicable floor price under the SEBI ICDR Regulations, subject to required pricing adjustments.\n\nThe warrant issue will involve one investor \u2014 Bajaj Finserv.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Up 45% in 1 year, down 7% YTD: Is this multibagger NBFC stock a buying opportunity now?", "full_content": "Even as Nifty 50 is down almost 10% over the last one year, some of its components have surged up to 45% in this period- one of them is a multibagger NBGC stock that has seen profit booking this year, raising questions if it is a stock to buy now at the current juncture.\n\nThe stock we are discussing is Shriram Finance - the heavyweight non-banking financial company (NBFC) stock, with a market capitalisation of \u20b9 2,22,363 crore on the NSE as of 2 October.\n\nWhile year-to-date, Shriram Finance share price is down 7.33% compared to a 14.25% decline in the Nifty 50, the stock has delivered a strong return of 45.68% in the last 1 year.\n\nOn a monthly scale, the stock shed 11.5% in September, snapping its five-month winning streak.\n\nOn longer timeframes of three and five years, the stock has surged 146% and 265%, respectively, delivering multibagger returns on the NSE.\n\nShriram Finance shares hit a 52-week high of 6 August this year and a 52-week low of \u20b9 611.15 on 30 September last year.\n\nLooking at the fundamentals, experts and brokerage firms find the stock a buying opportunity for the long term, citing the company's diversified franchise, resilient asset quality, and strong underlying demand as key positives for it.\n\nDomestic brokerage firm Motilal Oswal Financial Services has a buy call on the stock with a target price of \u20b9 1,220, which implies a 29% upside from the stock's 1 October close of \u20b9 945 on the NSE.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 10:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jefferies is bullish on 6 healthcare stocks with upside potential of up to 46%. Own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Jefferies is bullish on 6 healthcare stocks with upside potential of up to 46%. Own any? Written by Veer Sharma , ETMarkets.com | Oct 02, 2026, 10:48:54 AM IST 1 / 7 Hospital stocks in focus Hospital stocks including Fortis Healthcare, Dr Agarwal\u2019s, Manipal, Apollo Hospitals and Medanta extended their losses for a second straight session on Thursday, after falling as much as 10% in the previous session, as the Supreme Court questioned steep markups on cancer drugs and asked the government to examine allegations that hospitals require patients to purchase medicines from their own or designated pharmacies. However, Jefferies sees this as an excellent entry point to buy these 6 stocks.\n\nJefferies has a Buy rating on Apollo Hospitals with a target price of Rs 10,350, implying 27% upside, while its FY26E-29E EBITDA CAGR is estimated at 20%.\n\nJefferies has a Buy rating on Dr Agarwal\u2019s Healthcare with a target price of Rs 600, implying 25% upside, while its FY26E-29E EBITDA CAGR is estimated at 23%.\n\nJefferies has a Buy rating on Fortis Healthcare with a target price of Rs 1,125, implying 46% upside, while its FY26E-29E EBITDA CAGR is estimated at 17%.\n\nJefferies has a Buy rating on Max Healthcare with a target price of Rs 1,260, implying 36% upside, while its FY26E-29E EBITDA CAGR is estimated at 18%.\n\nJefferies has a Buy rating on Manipal Health Enterprises with a target price of Rs 870, implying 23% upside, while its FY26E-29E EBITDA CAGR is estimated at 19%.\n\nJefferies has a Buy rating on Medanta with a target price of Rs 1,660, implying 22% upside, while its FY26E-29E EBITDA CAGR is estimated at 22%.\n\nDisclaimer: This article has been written by Veer Sharma, who is not a SEBI-registered Research Analyst or an Investment Adviser.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 10:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Chinese Hackers Posed As US AI Experts To Target Policy Researchers, Steal Emails", "full_content": "Chinese hackers allegedly impersonated US AI experts to target policymakers and researchers with phishing emails, Proofpoint said. The group targeted fewer than 10 people, seeking login credentials and information on AI policy and strategy.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "EPFO enrolment campaign for workers left out of PF coverage: Will they lose interest on past contributions?", "full_content": "Salaried workers who were eligible for provident fund (PF) coverage but remained outside the formal system between April 1, 2009 and March 31, 2026, can now be enrolled under a one-time special EPFO campaign.\n\nThe Employees\u2019 Enrolment Campaign ( EEC ) 2026, open until October 31, 2026, allows employers to voluntarily bring eligible employees under the coverage of benefits such as PF, pension and insurance.\n\nHowever, to avail of the relief, the employee must be alive and still employed with the establishment when the employer makes the declaration.\n\nThe campaign provides employers a simplified route to regularise past PF coverage by paying a nominal fee of and meeting other prescribed requirements, instead of facing potential higher costs and consequences later.\n\nA key relief under the campaign is that the employee\u2019s share of EPF contributions will be waived if it was not deducted from wages at the time. This means employees who received their full salary without PF deductions in earlier years will not have to pay those contributions now.\n\nThe employer, however, will have to deposit its PF share from the employee\u2019s declared date of joining, along with applicable interest for the past period, administrative charges, and a lump-sum damage of \u20b9 100.\n\nSo, employees who were not covered by the Employees Provident Fund Organisation (EPFO) during the prescribed 17-year window will neither lose the contributions, nor the interest that would have accrued otherwise.\n\nEmployees who had already exited the establishment before the date of declaration cannot be declared under the campaign.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 10:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global bond market steadies after sharp sell-off", "full_content": "Heavy selling this week pushed 10-year US Treasury yields to their highest level since 2002", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 10:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ahead Of Jantar Mantar Protest, Delhi Metro Shuts Entry And Exit At 11 Stations - Check Full List", "full_content": "The protesters are demanding accountability from the CEC and objecting to the ongoing Special Intensive Revision (SIR) of electoral rolls.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "A Brexit reversal is on the table 10 years on from the vote that changed Britain. Here\u2019s what\u2019s at stake", "full_content": "U.K. Prime Minister Andy Burnham suggested this week that British voters could be given the chance to reverse Brexit, the country's highly contentious departure from the European Union a decade ago.\n\nBurnham, who became prime minister over the summer, told the BBC on Wednesday it was \"possible\" a referendum on rejoining the EU could be included in a future election manifesto.\n\nA U.K. general election is not currently expected before 2029. Prime ministers are able to trigger an early snap election with the backing of parliament, but Burnham \u2014 who replaced predecessor Keir Starmer without a public vote \u2014 has ruled out such a move.\n\nIn his interview with the BBC, the prime minister said a referendum \"wouldn't be the right thing to do right now,\" but added that the U.K. must \"consider the options\" for its relationship with the EU, arguing that \"where we are isn't good enough.\"\n\nAsked whether an in-out referendum in a future election manifesto was a possibility, Burnham said: \"yes, things are possible.\"\n\nDuring the previous general election \u2014 which saw Starmer lead the governing Labour party to a landslide victory and end 14 years of Conservative rule \u2014 Burnham was serving as Mayor of Manchester. As he prepared to challenge Starmer's leadership, Burnham pledged not to \"re-run\" arguments over Brexit.\n\nIn a separate interview with the BBC's Today program, Burnham said he wanted to \"look at the options\" for resetting U.K.-EU relations.\n\n\"We could stay as we are. That's definitely an option, if people think this is the right place to stay,\" he said, when asked if he wanted Britain to rejoin the union. \"We could look at what [former finance minister] George Osborne has said about a customs union, we could look at\u2026 the single market or we could go all the way.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Accenture Hiring To Slow In FY27 As AI Boosts Revenue Per Employee", "full_content": "Speaking during Accenture's fourth-quarter fiscal 2026 earnings call, CEO Julie Sweet said the company expects to hire in every market next year, while the pace of hiring will be lower than in fiscal 2026.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:29 AM IST", "pub_date_relative": "2h ago"}, {"title": "Cricket World Cup 2027 Schedule: Full Fixture List, Opponents, Dates And Venues Revealed", "full_content": "The ICC announced the 2027 Mens Cricket World Cup schedule starting October 2 in Windhoek with a Super Series to finalise qualification for the group stage.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:28 AM IST", "pub_date_relative": "2h ago"}, {"title": "AI is making cyberattacks faster and harder to detect, Interpol warns. Here\u2019s what companies should watch", "full_content": "Artificial intelligence enables cyber threats by enhancing existing criminal tactics such as scams and fraud, according to Interpol.\n\nAI is enhancing existing criminal techniques rather than revolutionizing them, Bjorn R. Watne, global chief information security officer at Interpol, told CNBC on the sidelines of Tech Week Singapore on Thursday. Scam operators can use AI to target multiple victims simultaneously, while improved translation and digital identities are making it increasingly difficult to distinguish fraudulent interactions from real ones.\n\n\"It's an evolution and not a revolution,\" Watne said, adding that AI is primarily increasing the \"speed and scale\" of existing techniques.\n\nAs cyber threats evolve, companies should prioritize protective actions, according to Watne.\n\nInstead, businesses should first identify their \"crown jewels,\" the assets most critical to keeping their operations running, and determine who would be most interested in stealing or disrupting them.\n\nThey can then use threat intelligence to understand the tactics and technologies used by those adversaries and tailor their defenses accordingly.\n\n\"There is no need for everyone to try and protect against everything all at once when they're not being targeted by it,\" he said. The defenses needed can vary depending on whether a company faces opportunistic criminals or advanced persistent threat actors, he added.\n\nCompanies are also often hampered by a disconnect between senior management and their cybersecurity strategy, he said.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 10:27 AM IST", "pub_date_relative": "2h ago"}, {"title": "OTT Releases This Weekend: Pooja Meri Jaan, Kill Jackie & More - Here\u2019s What To Watch", "full_content": "'Doing Life', 'Schumacher '94 \u2013 The Birth of a Legend', 'Tracker Season 4' and 'Ip Man: Kung Fu Legend' are some more titles releasing on OTT platforms this weekend. Check out!", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:23 AM IST", "pub_date_relative": "2h ago"}, {"title": "Market crash wipes out Rs 26 lakh cr in 8 weeks! Why soaring bond yields may hurt Sensex, Nifty more than elevated oil prices", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market crash wipes out Rs 26 lakh cr in 8 weeks! Why soaring bond yields may hurt Sensex, Nifty more than elevated oil prices Angel One Share Price Choice International Share Price JM Financial Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market crash wipes out Rs 26 lakh cr in 8 weeks! Why soaring bond yields may hurt Sensex, Nifty more than elevated oil prices SECTIONS Market crash wipes out Rs 26 lakh cr in 8 weeks! Why soaring bond yields may hurt Sensex, Nifty more than elevated oil prices By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 02, 2026, 10:22:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Sensex and Nifty have fallen for eight straight weeks, wiping out more than Rs 26 lakh crore in market capitalisation. While elevated oil prices have pressured equities, soaring bond yields, foreign outflows, a stronger dollar and tighter liquidity are adding to the selling pressure and weighing on investor sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 10:22 AM IST", "pub_date_relative": "2h ago"}, {"title": "OpenAI fires 3 safety researchers accused of sharing confidential company information: report - Fox Business", "full_content": "OpenAI fires 3 safety researchers accused of sharing confidential company information: report Fox Business OpenAI fires workers for mishandling 'sensitive information' BBC Exclusive | OpenAI Fires Researchers for Allegedly Sharing Information with AI Safety Group wsj.com OpenAI Parts Ways With 3 Workers Over Mishandling Information Bloomberg.com OpenAI parts ways with 3 researchers it says mishandled sensitive information CBS News", "source": "Google News Business", "pub_date_str": "02 Oct 2026, 10:21 AM IST", "pub_date_relative": "2h ago"}, {"title": "Accenture Is Planning To Go Shopping Again \u2014 With $5 Billion Behind Its AI Bet", "full_content": "Accenture said acquisitions remain a key part of its growth strategy, particularly when the company identifies opportunities to scale businesses in high-growth areas or expand into new markets.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:14 AM IST", "pub_date_relative": "2h ago"}, {"title": "Buy ONGC, Sell Oil India| Kotak raises FY27 oil price assumption to $90", "full_content": "Kotak Institutional Equities maintains a BUY on ONGC with a fair value of \u20b9 355 and a SELL on Oil India with a fair value of \u20b9 360. The brokerage raised its FY27 crude oil price assumption to $90 per barrel from $85, while retaining its FY28 and long-term assumptions at $75 per barrel. Kotak prefers ONGC over Oil India, citing a stronger medium-term production outlook, better realisations, rising contribution from new fields and relatively inexpensive valuations.\n\nKotak Institutional Equities said the West Asia conflict has resulted in one of the largest oil supply disruptions in recent history, with the disruption persisting for seven months and limited visibility on a return to normalcy. However, the brokerage noted that global oil markets have remained resilient and largely well managed.\n\nThe brokerage said crude flows through the Strait of Hormuz have improved, reaching around 13 million barrels per day in September 2026, the highest level since the conflict began. While Brent crude averaged nearly $100 a barrel in the first half of FY27, Kotak expects prices to ease in the second half, assuming hostilities do not intensify and supply flows continue to normalise.\n\nAgainst this backdrop, Kotak raised its FY27 Brent crude assumption to $90 a barrel from $85, while retaining its FY28 and long-term assumption at $75 a barrel.\n\nKotak said ONGC remains its preferred upstream play, despite recent production weakness and challenges at KG-98/2. The brokerage expects the company's outlook to improve, supported by rising gas production from new fields and higher gas realisations from NWG.\n\nMore importantly, Kotak highlighted ONGC's technical service provider (TSP) agreement with BP for its Western Offshore assets, which account for around 70% of production. The agreement is expected to strengthen ONGC's medium-term production outlook.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 10:12 AM IST", "pub_date_relative": "2h ago"}, {"title": "ESDS, Lumino, Purple Style Labs: 18 IPO stocks facing anchor lock-in expiry in October - Check full list", "full_content": "The October IPO calendar is set to bring another important event for investors tracking recently listed stocks, with shares allotted to anchor investors in 18 companies becoming eligible for trading during the month.\n\nAccording to a fortnightly review by PL Research, these lock-in expiries cover 14 companies under the 30-day period and four companies under the 90-day period between October 5 and October 16, 2026.\n\nAnchor investors typically receive shares before an IPO opens to the broader public, but those shares remain locked for a specified period. Once the lock-in expires, the shares become eligible for trading. This does not necessarily mean that investors will sell the shares, but the additional tradable supply can become an important factor for market participants, particularly when a stock has delivered strong gains since listing.\n\nAs per the report, among the 14 companies approaching their 30-day lock-in expiry, Purple Style Labs and Manipal Payment & Identity Solutions have the highest proportion of shares becoming eligible for trading, at around 22% of their respective total shares. Rays of Belief follows with around 20%.\n\nLumino Industries, ESDS Software Solution , Priority Jewels, Deepa Jewellers, Glass Wall Systems, Prasol Chemicals, Kanohar Electricals, Rentomojo, Asset Reconstruction Co. (India) and Steamhouse India each have approximately 15% of their total shares becoming eligible for trading. Pranav Constructions has the lowest proportion among this group at around 12%.\n\nThe individual lock-in data shows that Purple Style Labs has 26,60,869 shares, or 22%, becoming eligible on the 30-day expiry, while Manipal Payment & Identity Solutions has 53,42,916 shares, also representing 22%. Rays of Belief has 10,46,095 shares, or 20%, becoming eligible.\n\nFor investors, the scale of the potential supply is particularly relevant when compared with the company's total outstanding shares and recent price performance.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 09:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "Akash Missile Exported To Armenia, Tajikistan And Turkmenistan: Defence Secretary", "full_content": "The Defence Secretary called the Akash Surface-to-Air Missile (SAM) system a key milestone in India's push for self-reliance in military technology.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 09:51 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "S&P 500 futures edge higher as September jobs report looms: Live updates", "full_content": "Stock futures inched higher early Friday as traders awaited the release of September's jobs report.\n\nS&P 500 futures were up 0.26%, while futures tied to Dow Jones Industrial Average were up 125 points, or 0.24%. Nasdaq-100 futures advanced 0.42%.\n\nIn the regular trading day, the Dow and the Nasdaq Composite ended the session marginally higher. The S&P 500 posted a 0.2% advance to conclude the first trading day in October. All three indices are on pace for weekly losses, with the Dow off 1.7% in the period.\n\nAsia-Pacific stocks were mostly lower Friday. Japan's Nikkei 225 declined 0.95%, after gaining sharply on Thursday. South Korea's Kospi lost 1%. Hong Kong's Hang Seng Index lost 2.48% after resuming trade from a holiday. Australia's S&P/ASX 200 was up 0.35%.\n\nTreasury yields climbed to multiyear highs before retreating. The benchmark 10-year Treasury note yield soared to 5.344%, its highest level since 2002. The yield on the 30-year Treasury bond also reached its highest in 24 years.\n\nOil prices also climbed after The Wall Street Journal reported the U.S. is sending a third aircraft carrier strike group to the Middle East. Brent crude futures gained more than 4% to close at $102.31 per barrel, while U.S. West Texas Intermediate futures advanced 2.7% to settle at $92.87 a barrel.\n\nSeptember's nonfarm payrolls report will be in the spotlight Friday, with the Dow Jones consensus calling for job growth of 84,000 and for the unemployment to hold steady at 4.1%.\n\nThe report comes as traders reassess the next move for the Federal Reserve. Fed funds futures trading suggests a 72% likelihood the central bank will stand pat in October.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:30 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold steadies as stronger dollar, higher yields weigh; U.S. jobs data awaited", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:23 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Capita to face UK audit review over Civil Service pension contract", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:23 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Coal India, NTPC among 360 ONE Capital Research\u2019s 8 stock picks for October. Check full list with target prices", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Coal India, NTPC among 360 ONE Capital Research\u2019s 8 stock picks for October. Check full list with target prices Written by Kumar Gaurav , ETMarkets.com | Oct 02, 2026, 12:16:02 PM IST 1 / 9 Bullish Bets 360 ONE Capital Research has identified eight stocks as its top picks in its October 2026 portfolio update. The list includes Coal India, NTPC, ITC and five other stocks, with the brokerage outlining its target prices and key factors supporting each Buy recommendation.\n\nCoal offtake is expected to rise as plants rebuild inventories and thermal generation remains robust. Higher e-auction premiums and a tight demand-supply backdrop could support better coal realisations and margins, 360 ONE Capital Research said.\n\nStrong credit growth and a healthy liability franchise are expected to support loan and deposit growth through FY26-28E. The brokerage expects asset quality and credit costs to remain under control, while the higher EBLR book should help contain NIM pressure.\n\n60 ONE Capital Research expects pricing power to carry greater weight than cigarette volume declines following recent tax hikes. Staggered and phased price increases in well-known brands are expected to offset the impact of lower volumes.\n\nStrong power demand and improving coal-based PLF are expected to increase power generation and sales. The expanded renewable portfolio and long-term diversification into nuclear power support the outlook.\n\nEugia, PenG, Lannett and Theranym provide several growth triggers, alongside EBITDA guidance of 23-24%+. The brokerage expects US revenue to reach US$2 billion over the next few years.\n\nMargins are expected to normalise as the product mix streamlines and the GST ITC impact neutralises from 3Q.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 12:09 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HDFC Bank shares: How stock fared since Atanu Chakraborty's exit till Anup Bagchi appointment- Performance data details", "full_content": "HDFC Bank shares have endured a turbulent 2026, with the stock coming under sustained pressure amid a series of leadership changes, governance concerns and continuing post-merger challenges.\n\nThe turbulence began in March following the sudden resignation of former chairman Atanu Chakraborty and was followed months later by CEO Sashidhar Jagdishan\u2019s planned exit, leaving investors focused on the bank\u2019s leadership stability.\n\nAs of October 2026, HDFC Bank shares were trading at \u20b9 721.20, down around 15% from Chakraborty\u2019s resignation date on March 18 and nearly 30% below their 52-week high. The stock\u2019s performance in 2026 marked its worst calendar-year showing since 2008, according to the data provided.\n\nChakraborty\u2019s abrupt departure on March 18 triggered an immediate sell-off in HDFC Bank shares. In the four trading days following his resignation, the stock plunged 12%, wiping out roughly $16 billion in investor wealth as markets reacted to concerns around the bank\u2019s governance and leadership.\n\nIn his resignation letter, Chakraborty said that \u201ccertain happenings and practices within the bank\u201d observed over the preceding two years were \u201cnot in congruence\u201d with his personal values and ethics.\n\nThe Reserve Bank of India subsequently stepped in to calm market concerns, stating that it had found no material issues relating to HDFC Bank\u2019s governance, conduct or financial soundness.\n\nHDFC Bank also appointed independent external law firms Trilegal and Wadia Ghandy & Co to review the allegations. In June 2026, the reviews concluded that Chakraborty\u2019s operational allegations were not supported by internal records or witness interviews.\n\nThe stock briefly recovered around 5% following the conclusion of the legal reviews. However, the recovery did not last as other fundamental concerns continued to weigh on the shares.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 12:07 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "South Korean President Lee warns of 'measures' against Ukraine over prisoner row, demands apology", "full_content": "South Korean President Lee Jae Myung on Friday slammed Ukraine over its disclosure of handing North Korean prisoners of war to Seoul, demanding a public apology and threatening \"additional measures\" against Kyiv.\n\nIn a post on X , Lee said that Kyiv had unilaterally revealed that some captured North Korean soldiers had been sent to South Korea, despite having demanded confidentiality and later claiming there was no secrecy agreement, making the Korean leader look like a \"liar.\"\n\n\"As this is a matter concerning the honor of the Republic of Korea's people and nation, we cannot overlook it,\" he said in Korean, translated by Google.\n\nUkrainian Foreign Minister Andrii Sybiha reportedly described the row on Thursday as a \"diplomatic misunderstanding,\" which his country expects to resolve. Seoul remains an important partner for Kyiv, Sybiha added.\n\nAt the United Nations General Assembly last week, Ukrainian President Volodymyr Zelenskyy said that Kyiv had sent two captured North Korean soldiers to South Korea.\n\nThat prompted South Korea to accuse Ukraine of breaching a nondisclosure agreement about the transfer and summoning Ukraine's charg\u00e9 d'affaires for an explanation. Seoul also said after the speech that Ukraine had asked for the transfer to be kept a secret, as it could negatively impact prisoner exchanges with Russia.\n\n\"When we demanded acknowledgement of the agreement and an apology, they instead spoke of an imminent military clash between North and South, praying for the outbreak of war on the Korean Peninsula\u2014we express grave regret toward Ukraine,\" Lee said on Friday.\n\nThe comments follow Ukrainian presidential chief of staff Kyrylo Budanov interview last week, where he said that North Korea's participation in the Ukraine-Russia conflict was to prepare for combat on the Korean Peninsula.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:06 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "ETMarkets Smart Talk| \u2018Desi to Videsi\u2019: How GIFT City is changing the way Indians invest globally \u2014 Mustafa Pardiwala", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a ETMarkets Smart Talk| \u2018Desi to Videsi\u2019: How GIFT City is changing the way Indians invest globally \u2014 Mustafa Pardiwala Powered By The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk| \u2018Desi to Videsi\u2019: How GIFT City is changing the way Indians invest globally \u2014 Mustafa Pardiwala SECTIONS ETMarkets Smart Talk| \u2018Desi to Videsi\u2019: How GIFT City is changing the way Indians invest globally \u2014 Mustafa Pardiwala By Kshitij Anand , ETMarkets.com Last Updated: Oct 02, 2026, 12:06:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis GIFT City is emerging as a gateway for Indian investors seeking global diversification, offering access to US stocks, ETFs and sectors such as AI and semiconductors. Mustafa Pardiwala of Mirae Asset Capital Markets (IFSC) explains how investors can start with smaller amounts, the role of ETFs, currency risk and fractional investing.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 12:06 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hospital stocks: can strong demand offset regulatory risks?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStocks of hospital companies have come under pressure after the Supreme Court raised concerns over high mark-ups on cancer medicines while hearing a petition on drug pricing on 22 September. The Supreme Court has asked the central government why the 16% trade margin applicable to scheduled drugs could not be extended to non-scheduled drugs. The next hearing is scheduled for 12 October, and that\u2019s what investors would be tracking closely.\n\nEarlier, Maharashtra Food & Drugs Administration (FDA) had written to the Department of Pharmaceuticals after finding large mark-ups in medicines and other consumables sold through hospital pharmacies in its survey, and sought monitoring of prices. The Maharashtra FDA found mark-ups of more than 28 times on intravenous infusion sets, around ten times for catheters, and similar mark-ups for various other medicines.\n\nJM Financial Institutional Securities estimates a 2-4% hit on profit margins if the government caps trade margin at 16%. Medicines contribute 20-25% of hospital revenue, according to the brokerage. Hospitals with higher exposure to oncology, such as Max Healthcare Institute and Artemis Medicare Services, may see a larger impact given their higher revenue contribution from pharmacy and consumables.\n\nHowever, it may not be easy for the government to implement the price cap given the complexity of the issue. \u201cWe do not expect a blanket cap on drug margins as such, given the executional/ operational challenges in covering non-scheduled drugs across ecosystems ( pharma , distributor, supply-chain companies),\u201d noted Emkay Global Financial Services.\n\nHospitals have faced regulatory scrutiny over pricing for several years. In 2017, the government sharply reduced the prices for cardiac stents and orthopaedic knee implants by 70-85%.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 11:51 AM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "DA news: Telangana Cabinet approves release of two pending instalments \u2014 when will remaining arrears be cleared?", "full_content": "The Telangana Cabinet has approved the release of two pending instalments of Dearness Allowance (DAs) to state government employees and pensioners, Minister for Revenue, Housing and Information and Public Relations Ponguleti Srinivasa Reddy said, according to The Hindu .\n\nThe minister also noted that the release of the two DA instalments will add around \u20b9 2,500 crore annually to the Telangana government\u2019s financial burden. Despite this, it was approved in line with assurance given to employee unions during recent discussions held in the state.\n\n\u201cThe release of DAs will impose an additional annual financial burden of about \u20b9 2,500 crore on the State government. Chief Minister A. Revanth Reddy has decided to release the DA despite the financial burden, in line with the assurance given during recent discussions with employee unions,\u201d Srinivasa Reddy was quoted as saying in the news report.\n\nBriefing the media after the Cabinet meeting chaired by Chief Minister A. Revanth Reddy at the Secretariat on Thursday, the minister said the two DAs would be released immediately from the arrears pending since 2024.\n\nMeanwhile, the remaining arrears will be cleared in instalments, although no specific timeline for their payment was announced.\n\nThe Cabinet also reportedly discussed the impact of El Nino conditions and deficient monsoon in the state. It decided to form a sub-committee to recommend immediate measures for affected areas, hold consultations with political parties, farmers\u2019 groups and experts from different sectors.\n\n\"The state government would also seek the Centre\u2019s assistance and request the declaration of drought-affected areas,\u201d Srinivasa Reddy told reporters on Thursday, according to The Hindu .\n\nHe further mentioned that Telangana had recorded a rainfall deficit of about 17% during the monsoon, which ended on Wednesday. The Cabinet also decided to make arrangements for procurement of paddy during the kharif season.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 11:47 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Washington\u2019s big crypto bill is stuck. The SEC is pushing ahead anyway", "full_content": "The U.S. Securities and Exchange Commission has proposed new rules that would make it easier for investment advisers and regulated funds to hold cryptocurrencies on behalf of clients, as U.S. regulators push ahead with writing crypto rules after a sweeping legislation stalled in Congress.\n\nThe proposal, announced Thursday stateside, would establish a tailored framework governing how registered investment advisers, investment companies and business development companies hold custody of crypto assets.\n\nThe changes are aimed at modernizing decades-old custody requirements and removing regulatory barriers that the SEC says have limited advisers' ability to offer crypto-related investments.\n\nUnder the proposed rules , crypto assets could be held in self-custody under \"certain circumstances,\" while state trust companies could also serve as custodians for crypto assets belonging to clients and regulated funds.\n\nThe changes could also give regulated funds greater scope to offer investors crypto-related investment strategies, according to the SEC.\n\nBitcoin price year-to-date SEC Chairman Paul Atkins said existing regulations had failed to keep pace with the rapid expansion of digital assets, which have grown into a multi-trillion-dollar market.\n\n\"Today\u2019s proposal would provide a clear regulatory framework for the custody of crypto assets, giving investment advisers and funds a compliant pathway where none existed before,\" Atkins said.\n\nThe proposal comes as U.S. regulators push ahead with building out a crypto rulebook under their existing authority after the Clarity Act, a sweeping crypto market structure bill, stalled in the Senate in September .", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:45 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Alternative Investments",
