["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India, EU discuss FTA implementation ahead of December signing", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, EU discuss FTA implementation ahead of December signing The Economic Times daily newspaper is available online now. Read Today's Paper India, EU discuss FTA implementation ahead of December signing SECTIONS India, EU discuss FTA implementation ahead of December signing PTI Last Updated: Nov 02, 2026, 12:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In an effort to advance their free trade agreement, India and the European Union held pivotal discussions led by Commerce Secretary Rajesh Agarwal, who visited Brussels for dialogues with prominent EU officials. Central to the talks were customs cooperation and trade facilitation, deemed critical for the agreement's efficacy. Additionally, industry stakeholders from the diamond sector were engaged to harness opportunities within India's expanding market.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "02 Nov 2026, 12:45 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold rate today 2 Nov: Chennai vs Bangalore prices compared \u2014 City wise details for yellow metal buyers, investors", "full_content": "Gold, silver prices today, 2 November: Gold prices in Bangalore and Chennai rose today on Monday, 2 November, as they jumped globally, bouncing from the previous selloff amid lower oil prices and tempering of inflation concerns, as per reports.\n\nBullion gained as much as 1.1% to near $3,915 an ounce, clawing back some losses after a 3.7% slump in the previous session that rounded off the worst October for the metal since 2008, Bloomberg reported.\n\nSpot gold climbed 0.7% to $3,903.15 an ounce at 11:34 am and spot silver climbed 1.8% to $49.97, according to a Reuters report.\n\nMCX gold futures were trading 0.40% higher at \u20b9 1,39,400 per 10 grams at around 9:13 am in the domestic futures market, while MCX silver futures rose by around 1.15% to \u20b9 1,82,250 per kg.\n\nAt time of writing, gold bullion was trading at \u20b9 1,39,310 per 10 grams on Monday, 2 November 2026, while Silver was at \u20b9 1,81,840 per kg, data on the official bullion website showed.\n\nToday, we compare prices between Chennai vs Bangalore for yellow metal buyers and investors in 18K, 22K and 24K gold and 999 Fine Silver. Also, check gold and silver rates in other key Indian cities including Ahmedabad, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nGold prices in both Chennai and Bangalore were up, similar to other major cities in India, as per bullion data for 2 November. The 24-karat gold price in Chennai was \u20b9 1,39,420 per 10 grams, \u20b9 250 more compared to \u20b9 1,39,170 per 10 grams in the Garden City.\n\nFurther, the 22-karat gold price in Chennai was \u20b9 1,27,802 per 10 grams, \u20b9 229 more compared to \u20b9 1,27,573 per 10 grams in Bengaluru; and the 18-karat gold rate was \u20b9 1,04,565 per 10 grams in Chennai \u20b9 187 more than \u20b9 1,04,378 per 10 grams in Bengaluru.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 12:41 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ramkrishna Forgings shares jump 10% after Q2 results, surge 35% in 2026: Is more upside ahead? | Key levels to watch", "full_content": "Dhanya Nagasundaram Published 2 Nov 2026, 12:28 PM IST Prefer Livemint on Google Ramkrishna Forgings shares surged 10% on Monday, 2 November, after the company reported a strong turnaround in its September quarter performance, posting a consolidated net profit of \u20b9 70.59 crore in Q2 FY27 against a loss of \u20b9 9.5 crore in the corresponding quarter last year.\n\nThe Kolkata-headquartered forged metal products manufacturer reported a sharp increase in revenue from operations, which rose to \u20b9 1,405.42 crore in the July-September quarter from \u20b9 907.53 crore a year earlier.\n\nEarnings before interest, tax, depreciation and amortisation (EBITDA) more than doubled to \u20b9 256.23 crore in Q2 FY27, compared with \u20b9 122.54 crore in the year-ago period.\n\nFor the first half of FY27, consolidated net profit climbed to \u20b9 117.47 crore from \u20b9 2.29 crore in the corresponding period of the previous financial year. Revenue during the six-month period increased to \u20b9 2,622.09 crore from \u20b9 1,922.79 crore.\n\nCommenting on the performance, Managing Director Naresh Jalan said domestic demand remained healthy during the September quarter, supported by firm commercial vehicle production schedules. Customer activity across key export markets also remained resilient, he added.\n\nLooking ahead, the company is expanding its presence in non-ferrous forgings, including aluminium, titanium, inconel and nimonic grades, targeting high-technology applications in aerospace, robotics and semiconductors, Jalan said.\n\nThe company also said its forged wheels facility near Chennai, established through a joint venture with Titagarh Rail Systems, is nearing the start of commercial production. The facility will enable Ramkrishna Forgings to enter a strategically important product category for Indian Railways and provide an additional long-term growth driver.\n\nRamkrishna Forgings is an integrated manufacturer of rolled, forged, machined and cast products.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 12:28 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How to enjoy Diwali without giving your savings a hangover", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe festive season traditionally brings the highest consumer spending among Indian households. A recent report by YouGov and Rukam Capital found that 60% of Gen Z shoppers increase their spending during major festivals, with 25% spending significantly more and 35% somewhat more.\n\nBut the world around us is changing. News of layoffs in the IT sector, muted salary hikes and inflation inching up again warrant a closer look at how households spend and splurge. We spoke to individuals to gauge the mood and to experts on how households should respond.\n\nDiwali is usually when families want to celebrate, buy something new and gift friends and relatives. The festive spirit makes spending part of the occasion. Preeti Zende, a Sebi-registered investment adviser and founder of Apanadhan Financial Services, said people also tend to spend impulsively because of the fear of missing out ( FOMO ) fuelled by social media influencers.\n\nMany people also have extra money in hand through bonuses or variable pay, which can tempt them to treat it as \u201cfree money\u201d for celebrations, said Arindam Banerjee, professor and programme director of the Masters of Applied Finance & Wealth Management at SP Jain School of Global Management.\n\nThe market is designed to reinforce this mood. Retailers, banks and digital platforms all target consumers with offers during this period, lowering their resistance to spending. \u201cCashback, no-cost EMIs, limited-time deals and social pressure all arrive together,\u201d Banerjee said. In a normal year, he added, this may be manageable for a household with a stable income. But this year, households may need to tread more carefully.\n\nIn fact, many households have already begun exercising financial prudence. According to Sachin Taparia, founder and CEO of LocalCircles, urban households are likely to spend an average of \u20b9 20,000 this festive season, down from around \u20b9 45,000 last year.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 12:25 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI is coming to construction sites. But does it make workers safer?", "full_content": "When Shelley Copsey was appointed by the Ontario Teachers' Pension Plan, one of the world's biggest infrastructure investors, her job was to find ways to use technology to solve problems across its portfolio.\n\nShe quickly learned that there were persistent problems facing front-line workers.\n\nFour years later, Copsey is CEO of FYLD, a London-headquartered software company that uses artificial intelligence to support workers in construction, utilities and infrastructure.\n\nIt comes as AI plays an increasingly important role in some of the most physically demanding jobs, from maintaining roads and railways to working on construction sites.\n\nAccording to Copsey, when fieldwork goes wrong, attention usually turns to budgets or cash flow.\n\n\"We always go to the back office and we're like: oh, if we could help them forecast the job better, maybe this wouldn't be a problem,\" she told CNBC. \"I think that what nobody ever did was just sit and say: well, what goes on in those field workers' lives and how do we make the life of the front line easier?\"\n\nFYLD uses AI to predict which permits a project will need, helping workers avoid delays. Previously, workers often arrived at a site without all of the information they needed, Copsey said. The system can also help crews plan around the weather, for example, rescheduling heavy lifting from a day when strong winds are forecast.\n\nWorkers record short videos describing their day's tasks and safety concerns. AI analyzes the information to help workers and managers anticipate potential problems.", "source": "CNBC Top News", "pub_date_str": "02 Nov 2026, 12:25 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sebi backs removal of LTCG for foreign investors: Report", "full_content": "India's markets regulator has recommended the government remove the long-term capital gains (LTCG) tax imposed on foreign investors, two sources with direct knowledge of the matter said, as India looks to galvanise its underachieving equity markets.\n\nThe Securities and Exchange Board of India (SEBI) has also proposed tax relief for domestic mutual fund investors, suggesting they be exempt from LTCG if they are selling existing holdings to invest in new ones, the sources said.\n\nThe recommendations, which come months before the annual federal budget in February, are not binding and a final call rests with the government.\n\nIndia's equity market has lagged emerging market peers over the past two years. Foreign investors have sold a record $31 billion in Indian stocks this year and overseas investments by retail investors have surged as returns have stagnated.\n\nSEBI's recommendations follow scores of meetings held by the regulator with foreign investors over the last two years as selling persisted, putting pressure on the Indian currency.\n\nOne consistent piece of feedback from investors has been the need to change how India taxes them, the sources said.\n\n\"The proposals are aimed at reducing the upfront tax burden on foreign investors,\" one of the two sources said.\n\nThe sources declined to be named as the recommendations, which have not been reported previously, are part of its pre-budget representations and are private.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 12:22 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tokyo, Chubu Power Price Hit Multi-Year High as Fuel Costs Climb", "full_content": "(Bloomberg) -- Japan\u2019s spot power prices surged at the weekend, with elevated fuel costs driving rates in major electricity-consuming regions Tokyo and Chubu to multi-year highs.\n\nThe next-day spot power price for the Tokyo and Chubu areas, climbed 1.1% and 7.2% on a weekly basis to \u00a536.11 ($0.2)/kWh and \u00a536.29/kWh respectively on Sunday, the highest since September 2022, according to data from Japan Electric Power Exchange. Meanwhile, the nationwide average price was down 8.7% to \u00a530.09/kWh on the same day.\n\nSpot liquefied natural gas prices extended gains to about $34 per million British thermal units on Friday, according to traders, more than triple pre-war levels. LNG flows through the Strait of Hormuz \u2014 a key waterway for global exports \u2014 remain at less than a third of the rate before the conflict began.\n\nAverage household electricity bills in the Tokyo area are projected to reach a record \u00a59,738 in November, driven by rising fuel costs stemming from the conflict in the Middle East. The bill could soon top \u00a510,000 if the current surge in power prices continues, said Hiroyuki Yamaguchi, Executive Vice President of Tokyo Electric Power Co. during an earnings briefing on Friday.\n\nJapan\u2019s fuel-cost adjustment system automatically reflects changes in LNG, crude oil and coal import prices in electricity rates, based on a three-month average.\n\nTensions in the Middle East have escalated since a Pakistani LNG carrier was attacked near the Strait of Hormuz on Friday. This could signal a further prolonging of the waterway\u2019s effective closure, potentially driving fuel costs even higher and adding to pressure on Japanese utilities.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 12:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Apple Q4 earnings: 5 key things investors will watch", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide Powered By Apple Q4 earnings: 5 key things investors will watch Written by Anupam Nagar , ETMarkets.com | Nov 02, 2026, 12:54:13 PM IST 1 / 8 Apple Q4 earnings: iPhone 18 sales in spotlight Apple will announce its fiscal fourth-quarter 2026 results on Monday, November 2, after the US market closes. Investors will assess early demand for the iPhone 18 Pro lineup, the performance of its Services business and the company's outlook for the holiday quarter. The earnings announcement will also mark the first results presentation under new CEO John Ternus, who succeeded Tim Cook on September 1. (Sources: Yahoo Finance, BigGo Finance)\n\nAnalysts expect Apple to report revenue of around $113.4 billion, compared with $102.46 billion in the year-ago quarter. Earnings per share (EPS) are projected at approximately $2, up from $1.85 a year earlier. The estimates imply revenue growth of around 10.7% and EPS growth of about 8%.\n\niPhone revenue is expected to reach approximately $56.48 billion, representing growth of around 15% year on year. The iPhone 18 Pro and Pro Max went on sale in September, leaving roughly two weeks of sales in the September quarter. Investors will look for evidence that new-device demand can sustain Apple's smartphone growth momentum.\n\nApple's Services division is expected to generate more than $31.58 billion in revenue. The Mac business is forecast to contribute $9.69 billion, while wearables and iPad revenue are estimated at $8.99 billion and $6.83 billion, respectively. Investors will monitor Services growth and profitability for signs of the resilience of Apple's recurring revenue streams.\n\nApple's first foldable smartphone, the iPhone Duo, went up for preorder on October 16 and reached stores on October 23.", "source": "Economic Times Markets", "pub_date_str": "02 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India, EU discuss FTA implementatio buying a new car more affordable and enjoyable. When taking a car loan, focus on the repayment tenure, the monthly EMI and the total outlay, since each affects the overall cost of borrowing.\n\nWithout proper planning, however, a car loan can become hard to manage later. Responsible borrowing and careful management of the loan are essential.\n\nIf you are planning a \u20b9 10 lakh car loan , compare repayment tenures, actual loan offers (not just headline interest rates), and the lender's credibility.\n\nThese factors, when kept in check, can go a long way toward striking the right balance between monthly affordability and the overall cost of the loan and its management.\n\nAccording to Paisabazaar data, car loan interest rates at major banks and lenders ranged from 7.55% to 14.30% per annum as of 27 October 2026.\n\nHere is what a \u20b9 10 lakh car loan could cost over different repayment periods at these rates. The actual tenure and rate depend on the applicant\u2019s repayment capacity, credit score and existing debt. The calculations consider only the interest rate range and exclude processing fees and other charges, which vary by lender.\n\nNote: These are illustrative calculations based on a \u20b9 10 lakh loan at annual interest rates of 7.55% and 14.30%, using the monthly reducing balance method. In each range, the first figure represents the EMI, interest outgo or repayment amount at 7.55%, while the second represents the corresponding amount at 14.30%. Processing fees and other charges are excluded.\n\nThe calculations show how rates and tenure shape the final cost, and the clear trade-off between a lower EMI and higher interest.", "source": "LiveMint Money", "pub_date_str": "02 Nov 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Welspun Living shares: Up 80% in 6 months, rise 10% today post Q2 results; buy, sell or hold? What brokerages suggest", "full_content": "BSE ALPHA Dhanya Nagasundaram Published 2 Nov 2026, 11:45 AM IST Prefer Livemint on Google Welspun Living shares jumped over 10% on Monday, 2 November, after the home textiles major reported a multi-fold increase in its consolidated net profit for the September quarter of FY27.\n\nThe company posted a consolidated net profit of \u20b9 169.66 crore in the July-September quarter, compared with \u20b9 14.86 crore in the corresponding period last year, according to a regulatory filing.\n\nRevenue from operations rose 12.3% year-on-year to \u20b9 2,838.12 crore in Q2 FY27, from \u20b9 2,440.91 crore a year earlier. Total expenses increased 8.42% to \u20b9 2,636.77 crore.\n\nSegment-wise, revenue from the Home Textiles business grew 15.82% year-on-year to \u20b9 2,689.02 crore, while the Flooring segment reported a 19.3% increase to \u20b9 216.23 crore.\n\nThe company's total income rose 16.86% to \u20b9 2,869.90 crore during the quarter.\n\nFor the first half of FY27, Welspun Living's consolidated income from operations stood at \u20b9 5,698 crore, marking a 20.21% year-on-year increase.\n\nCommenting on the performance, Managing Director and CEO Dipali Goenka said the company delivered another quarter of robust growth, with revenue increasing 16.9% year-on-year and EBITDA margin expanding to 12.9%.\n\nShe attributed the broad-based growth to the resilience of the company's business model and its ability to deliver profitable growth through disciplined execution amid an evolving global operating environment.", "source": "LiveMint Markets", "pub_date_str": "02 Nov 2026, 11:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rs 5,000 SIP At 25 Vs Rs 15,000 At 35: Who Could Have More Money At     document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
