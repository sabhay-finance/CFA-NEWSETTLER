 million bond sale, bankers say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Torrent Power plans around $500 million bond sale, bankers say Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Torrent Power plans around $500 million bond sale, bankers say SECTIONS Torrent Power plans around $500 million bond sale, bankers say Reuters Last Updated: Oct 15, 2026, 05:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Torrent Power is set to launch a substantial bond sale of rupee-denominated bonds, aiming to raise around $500 million. This comes after their earlier issuance of 38 billion rupees. The company's initiative to diversify funding sources includes discussions with potential investors. The funds will be directed towards the acquisition of Nabha Power for approximately 69 billion rupees, reflecting a growing trend of companies exploring funding avenues beyond traditional banks.\n\nIn a pivotal decision, India's Supreme Court declared that the write-off of Yes Bank's 84 billion rupee AT-1 bonds is unlawful, causing a steep decline in Yes Bank shares. The ruling offers solace to bondholders, who successfully argued that their investments were misrepresented. This landmark decision raises critical questions about regulatory practices and bondholder rights, potentially reshaping market attitudes toward similar financial instruments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 05:32 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cboe to expand options trading hours for major stocks and ETFs", "full_content": "The options market is about to get even bigger on Monday when Cboe Global Markets extends trading hours for options on two-dozen stocks and a handful of ETFs. After first receiving approval by the SEC in May, regulators have now given the green light to the exchange and the Options Clearing Corp. to offer trading on 24 of the most actively traded companies and five exchange-traded funds between 7:30 a.m. and 9:25 a.m. ET and 4:00 p.m. to 4:15 p.m. ET. It's another step towards around-the-clock trading. Cboe already offers pre- and post-market periods for index options. Trading during those hours has grown in popularity, with a record 228,097 average options traded in the pre-market session daily last quarter, according to exchange data shared with CNBC. The list, which will be updated twice a year, starts with the so-called Magnificent Seven stocks, several big-tech giants, including Oracle and Micron, as well as popular retail-trading names like Robinhood, Nokia, and Palantir. Pfizer and Alibaba also make the cut. The ETF options include the State Street SPDR S&P 500 ETF Trust (SPY), Invesco QQQ Trust (QQQ), iShares Russell 2000 ETF (IWM), SPDR Gold Shares (GLD), and the State Street Financial Select Sector SPDR ETF (XLF). \"More investors than ever appreciate the power of optionality and what it can do for their portfolios, and the pace of adoption and growth of the market really reflect that,\" Rob Hocking, global head of derivatives at Cboe, said in an email. \"We continue to push the next frontier of innovation, expanding access and introducing new ways for investors to trade and manage risk.\" To meet the criteria for the extended hours, underlying securities must have an average daily volume for the preceding six months of 150,000 contracts or higher, a market value of $50 billion, and an average daily volume of at least 10 million shares. As a result, SpaceX does not yet qualify.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 05:31 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Why are credit default swaps unnerving AI investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Why are credit default swaps unnerving AI investors? Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Why are credit default swaps unnerving AI investors? SECTIONS Why are credit default swaps unnerving AI investors? Reuters Last Updated: Oct 15, 2026, 05:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The cost of insuring against the risk of potential US tech defaults has hit record levels in the latest sign of credit stress building in the so-called AI trade, especially for data centres dependent on future revenue.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 202 prediction still turns heads for its sheer audacity: the forecast that the Nifty 50 would hit a staggering 1,25,000 by the year 2030.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:18 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tecno Spark 50S 5G Could Be Cheaper Than Spark 50 5G: What We Know So Far", "full_content": "Tecno has revealed the Spark 50S 5G's design and two colour options ahead of its India launch, while the price, battery capacity and full specifications remain undisclosed.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Tech Mahindra Q2 Results: Net profit jumps 33% YoY to Rs 1,586 crore; co declares Rs 15/share dividend, 1:1 bonus issue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Tech Mahindra Q2 Results: Net profit jumps 33% YoY to Rs 1,586 crore; co declares Rs 15/share dividend, 1:1 bonus issue National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Tech Mahindra Q2 Results: Net profit jumps 33% YoY to Rs 1,586 crore; co declares Rs 15/share dividend, 1:1 bonus issue SECTIONS Tech Mahindra Q2 Results: Net profit jumps 33% YoY to Rs 1,586 crore; co declares Rs 15/share dividend, 1:1 bonus issue By Kumar Gaurav , ETMarkets.com Last Updated: Oct 15, 2026, 05:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tech Mahindra Q2 Results: Along with the earnings, Tech Mahindra's board declared an interim dividend of Rs 15 per equity share of face value Rs 5 each, equivalent to 300%, for the financial year 2026-27. It also approved a 1:1 bonus issue, under which shareholders will receive one bonus equity share for every existing equity share held, subject to the applicable terms and conditions.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 05:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Second activist pushes for sale of UK self-storage company Big Yellow", "full_content": "Irenic Capital takes 4% stake in FTSE 250 real estate group and joins Ancora in lobbying for a sale", "source": "FT Markets", "pub_date_str": "15 Oct 2026, 05:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Private capex losing steam in India: Can it delay the stock market revival? Experts decode", "full_content": "While the Government of India has implemented a multi-pronged strategy, including aggressive public capital expenditure (capex) outlays in infrastructure, targeted production-linked incentive (PLI) schemes, and FDI liberalisation with new free trade agreements (FTAs), over the last few years to catalyse private sector investments, private capex in India has been languid after capex per enterprise peaked at \u20b9 260 crore in FY23.\n\nBrokerage firm Systematix Shares and Stocks (India), in its report on 15 October, highlighted the findings of capex surveys of the National Statistics Office (NSO), which showed capex per enterprise peaked at \u20b9 260 crore in FY23 before falling to \u20b9 160 crore in FY26, with intended FY27 spending showing no improvement.\n\nMoreover, the conversion of intended capex into actual spending has weakened significantly, with the realisation ratio (RR) declining from 112% in FY23 to 96% in FY25, suggesting FY26-FY27 investments may undershoot current plans.\n\nThe provisional capex for FY26 and the intended capex for FY27 stand at \u20b9 160 crore each, significantly lower than the actuals in FY23-FY24.\n\nAs per Systematix report, the survey showed capex in the manufacturing sector declined from \u20b9 220 crore in FY22 and FY23 to \u20b9 210 crore in FY24 and \u20b9 170 crore in FY25, before recovering to \u20b9 210 crore in FY26. The intended capex per enterprise for manufacturing in FY27 stands at \u20b9 190 crore.\n\nAgriculture, forestry and fishing, construction, wholesale and retail trade and repair of motor vehicles and motorcycles, information and communication, professional, scientific and technical activities, education, human health and social work activities, arts, entertainment and recreation are among the segments which have recorded lower or stagnant capex per enterprise in recent years.\n\nHowever, non-conventional energy is exhibiting a positive trend, led by strong momentum in solar investments, as per the survey.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Newly listed stock has 30% upside potential! JM Financial issues buy call; Check target price and key triggers", "full_content": "E-commerce enablement platform Shiprocket , which debuted on Indian stock exchanges in August, has received a bullish outlook from domestic brokerage firm JM Financial.\n\nIn its latest report, the brokerage highlighted the company's diversified approach to capitalizing on India's expanding commerce enablement opportunity, its growing merchant base, and opportunities in its emerging businesses. JM Financial expects these factors to push revenue to \u20b9 43.4 billion by FY29E.\n\nJM Financial said Shiprocket\u2019s core shipping business serves as an entry point for merchant relationships, allowing the company to benefit from rising online sales and higher transaction volumes without owning logistics infrastructure.\n\nIt expects the core business to grow at a compound annual growth rate (CAGR) of around 18% between FY26 and FY29, with its adjusted EBITDA margin expanding from 12.6% to around 15.3%.\n\nThe brokerage also highlighted the growth potential of Shiprocket\u2019s emerging businesses, which include fulfillment, omnichannel solutions, checkout, marketing, and cross-border services. It estimates that revenue from these businesses will rise from \u20b9 5.4 billion in FY26 to \u20b9 18.8 billion by FY29, increasing their contribution to total revenue from around 27% to 43%.\n\nHowever, it expects the segment to remain loss-making through FY28 before turning profitable in FY29, with adjusted EBITDA of around \u20b9 0.7 billion.\n\nShiprocket operates across two segments\u2014Core Business and Emerging Business.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street To Open Lower? AI Stock Selloff Among Key Reasons Weighing On US Stock Futures", "full_content": "US stock futures were mixed on Thursday, with Nasdaq-100 futures down over 1% as an AI stock selloff and renewed inflation concerns weighed on sentiment, while investors awaited fresh economic data and corporate earnings.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ICICI Life Insurance shares: Despite 34% slump in 2026, Religare sees 42% upside post Q2 results | Here's why", "full_content": "Shares of ICICI Life Insurance Ltd have declined 34% so far in 2026, but Religare Broking sees significant recovery potential following the insurer\u2019s September-quarter results. The brokerage has reiterated its \u2018Buy\u2019 rating with a target price of \u20b9 650, implying a 42.6% upside from the closing price of \u20b9 456 on 14 October.\n\nIn its assessment, Religare highlighted the company\u2019s leadership transition, distribution strategy and operating efficiency as key factors supporting its growth outlook. The appointment of Siddharth Mishra as Managing Director and CEO, alongside the company\u2019s rebranding as ICICI Life Insurance Ltd, is expected to ensure strategic continuity, with a continued focus on customer-centricity, deeper penetration of micro-markets and proprietary distribution channels.\n\nThe brokerage also views the Insurance Regulatory and Development Authority of India\u2019s (IRDAI) consultation paper on distribution economics constructively. It believes enhanced renewal commission allowances could better align the interests of distributors, policyholders and insurers, while encouraging better underwriting quality and policy persistency. Religare expects the company\u2019s lean cost structure to help cushion the impact of potential changes in industry-wide distribution economics.\n\nHowever, the brokerage anticipates near-term softness in market-linked savings products and a normalisation in retail protection growth following four quarters of strong expansion after the goods and services tax (GST) changes.\n\nReligare estimates ICICI Life Insurance\u2019s annualised premium equivalent (APE), value of new business (VNB) and embedded value (EV) to grow at compound annual growth rates of 15.3%, 19.2% and 11.9%, respectively, between FY26 and FY28.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 05:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "IT Stocks Bounce After A Brutal Year: Is It Bottom-Fishing Or The Start Of A Rally?", "full_content": "Nifty IT has risen more than 8% in three sessions after HCLTech's results, but a weak Wipro quarter and divided brokerages suggest the recovery is still selective.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 05:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Haryana's paddy procurement crosses 15.52 LT, Rs 1,221 crore disbursed to farmers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Haryana's paddy procurement crosses 15.52 LT, Rs 1,2     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
