 and FY26, while its EBITDA margin expanded to 49.6%. The company reported a PAT of \u20b9 120.8 crore in FY26, reflecting strong operating leverage and an improving profitability profile.\n\nOjha highlighted the \u20b9 11,831 crore, five-year AI infrastructure agreement with Sharon AI, involving around 8,208 NVIDIA B300 GPUs, as a key growth driver.", "source": "LiveMint Markets", "pub_date_str": "04 Sep 2026, 06:29 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "South Korea's AI rally is reshaping romance, reality shows and academic preferences", "full_content": "South Korea's AI stock rally is rapidly transforming different corners of the country's society ranging all the way from romance to academics.\n\nIn Korea's dating scene, professionals such as physicians, lawyers and judges, have traditionally been the most sought-after. Now the preferences are changing, as the AI boom makes those working in the chip sector \u2014 flush with hefty bonuses \u2014 the new gems of the dating pool.\n\n\"Recently, we've seen increased preference for people working in semiconductor companies such as SK Hynix and Samsung Electronics, as well as AI-related occupations,\" said a spokesperson for Korean matchmaking company Gayeon.\n\nSamsung and SK Hynix both joined the trillion-dollar club earlier this year, and their share prices have each surged around 95% and around 135% so far this year.\n\nBig bonus payouts have given employees at the chip giants an edge.\n\nLast year, SK Hynix agreed to share 10% of its operating profit, which comes to roughly 700 million won per employee, or a little over half a million dollars, according to Reuters calculations. That is more than 15 times the average annual salary Koreans took home last year.\n\nUnder Samsung's wage deal, employees in the memory chip division will take home a little less than their peers at SK Hynix.\n\nThe newfound stardom of workers at chip giants comes against the backdrop of Korean singles increasingly seeing marriage as a financial advantage.", "source": "CNBC World Economy", "pub_date_str": "04 Sep 2026, 06:25 AM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sebi set to review derivative settlement prices amid concerns over CAS", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi set to review derivative settlement prices amid concerns over CAS The Economic Times daily newspaper is available online now. Read Today's Paper Sebi set to review derivative settlement prices amid concerns over CAS SECTIONS Sebi set to review derivative settlement prices amid concerns over CAS ET Bureau Last Updated: Sep 04, 2026, 06:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi will review derivative settlement price methods. This follows market participant feedback after the new closing auction session. The regulator introduced the closing auction session in the equity cash segment. This session determines the closing price of securities for derivatives. A consultation paper on proposed changes will be issued soon.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nS l markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Sep 2026, 06:19 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "FPIs pump Rs 13,010 crore into Indian equities in second half of August", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FPIs pump Rs 13,010 crore into Indian equities in second half of August IIFL Capital Services Share Price Choice International Share Price JM Financial Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper FPIs pump Rs 13,010 crore into Indian equities in second half of August SECTIONS FPIs pump Rs 13,010 crore into Indian equities in second half of August ET Bureau Last Updated: Sep 04, 2026, 06:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Overseas investors continued buying Indian equities for five straight fortnights. They invested over thirteen thousand crore rupees in the latter half of August. Consumer services, financials, and healthcare sectors received significant foreign portfolio inflows. Capital goods also saw renewed investor interest after previous outflows. Oil, gas, and consumable fuels experienced the largest foreign investment outflows.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "04 Sep 2026, 06:17 AM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "A 'shakeout' in early-stage AI may be coming as VC money gets pickier on valuations", "full_content": "Investors should focus on productivity growth in artificial-intelligence companies as valuations in some areas start to look excessive, experts said.\n\n\"We are likely to see a shakeout as investors become much more demanding about where the technology creates genuine value and where it is simply a feature dressed up as a business,\" said Jakub Nytra, founding partner at venture capital firm Purple Ventures. He expects capital to become much more selective over the next six to 12 months.\n\nThe AI boom continues to reshape markets. Investors have poured money into semiconductor companies beyond Nvidia, betting that the buildout of AI data centers will benefit a broader universe of chipmakers and infrastructure companies. That said, worries of a bubble persist, as firms ramp up on capex spending with no end in sight, and sky-high growth figures create questions about sustainability of the expansion.\n\n\"The next question is whether applications and end users generate enough productivity, revenues and cash flow to justify that investment,\" said David Ng, co-founder and chief executive officer at wealth management firm Arki Finance.\n\nWhile AI can transform the economy, not every company with AI in its pitch deck \"deserves an extraordinary valuation,\" Nytra said. \"The winners will be companies using AI to solve expensive and highly complicated problems.\"\n\nFor instance, Nytra cited TASS Vision \u2014 one of his portfolio companies \u2014 which deploys edge AI and cameras to analyze how customers move around physical stores, and in turn gives retailers data they can use to improve.\n\nEven if there is a bubble, some good should come of it in the end, according to Shane Chesson, founding partner at asset manager Openspace Capital.\n\n\"If a bubble does pop it will mostly damage those that invested in the FOMO-led froth,\" he said. \"But the infrastructure that has been created will still be used and prove game-changing for many companies.\"", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 06:14 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Snowflake has a secret weapon that\u2019s powering its stock toward a huge gain", "full_content": "The company\u2019s AI-powered coding assistant is driving major sales momentum.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Sep 2026, 06:05 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Priority Jewels IPO listing today: Will the jewellery maker deliver gains? Here's what GMP, experts signal", "full_content": "Shares of Priority Jewels are set to make their stock market debut today, September 4, after the IPO received a bumper response from investors during its three-day bidding period. Ahead of the listing, the grey market premium (GMP) for the Priority Jewels IPO is currently around \u20b9 30.\n\nConsidering the IPO's upper price band of \u20b9 200, the stock could potentially list at around \u20b9 230, implying a premium of 15%. The strong GMP is also supported by the company's reasonable valuation and favourable position in the jewellery industry.\n\nMahesh M. Ojha, Vice President of Research & Business Development at Kantilal Chhaganlal Securities Pvt. Ltd., said that at the upper price band, the issue is valued at approximately 20.5x FY26 PE, which appears reasonable considering the company\u2019s growth profile and favourable industry outlook, although execution remains an important monitorable.\n\nOjha added that existing IPO allottees may consider booking profits, particularly if the stock delivers a strong listing performance. For fresh investors, he recommends waiting for one to two quarters to assess post-listing execution, margin trajectory, capacity utilisation and the impact of new growth initiatives. Investors can then review the stock based on its operating performance and prevailing valuation before taking a fresh position.\n\n\u201cKey growth drivers include debt repayment through IPO proceeds, expansion into lab-grown diamonds, new product categories, and strategic partnerships targeting emerging markets. These initiatives could support revenue growth and margin improvement over the medium to long term,\u201d Ojha added.\n\nThe IPO, which opened for subscription on August 28 and closed on 1 September, received an overwhelming response, with the issue subscribed 100.45 times overall. Retail investors placed bids for 106.76 times the shares on offer, while the Non-Institutional Investors (NIIs) quota was subscribed 166.49 times.", "source": "LiveMint Markets", "pub_date_str": "04 Sep 2026, 06:03 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "full_content": "Jio is likely to finalise the exact dates within a couple of weeks after which it would initiate roadshows overseas before holding them at home, said a source close to the development.", "source": "Economic Times Markets", "pub_date_str": "04 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Domestic equities closed mixed as the Nifty saw a slight decline. Elevated crude oil prices are keeping investor sentiment cautious in the market. Foreign portfolio investors were net sellers, while domestic investors bought shares. The Indian Rupee continued its gaining momentum against the US dollar. Several stocks are currently under the F&O ban period.", "source": "Economic Times Markets", "pub_date_str": "04 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks in news: HDFC Bank, M&M, Gland Pharma, CreditAccess Grameen and Bharat Forge", "full_content": "Indian benchmark indices extended their losing streak for a fourth consecutive session on Thursday. Nifty 50 fell 0.17% and Sensex declined 0.55% amid market pressures. HDFC Bank raised nearly $12 billion through Foreign Currency Non-Resident deposits. Mahindra & Mahindra expects truck business integration by January and electric bus launch by April. Fosun Pharma is likely to divest a 5% stake in Gland Pharma through a block deal.", "source": "Economic Times Markets", "pub_date_str": "04 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "04 Sep 2026, 07:02 AM IST", "total_stories": 371};

                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
