ace.\n\nNvidia shares jumped nearly 37% to the day's high of $171.50 apiece. If the rally holds through the session, it will erase most of the losses suffered since the reports of extramarital affairs, including one involving an alleged Chinese spy, surfaced.\n\nThe company's sharp rebound has also lifted several AI-linked stocks, including Micron Technology, which surged 22%. It was followed by Intel, Advanced Micro Devices (AMD), Qualcomm, Sandisk, Marvell Technology and Oracle, all of which traded higher, with gains of up to 23% at their respective intraday highs.\n\nThe rally also powered the Nasdaq to surge 6.6%, putting it on track for its biggest one-day percentage gain since April 2025, after the index suffered its worst weekly performance since 2020. The broader market was on track to add more than $2 trillion in market value, with Nvidia alone accounting for nearly half of the increase.\n\nAI-linked stocks had faced heavy selling pressure recently amid concerns over elevated valuations. Meanwhile, Democratic gains in Congress had raised fears that data centre expansion in key states could face regulatory setbacks.\n\nHowever, Jensen Huang's reinstatement as Nvidia CEO has boosted sentiment across AI infrastructure stocks, while a decline in crude oil prices has also emerged as another key catalyst for the market recovery.\n\nHuang's return to Nvidia marked a dramatic turn of events, with media reports alleging that he had been involved in an extramarital affair with Alisa Huan, who was alleged to be a Chinese spy.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 11:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Consumer stocks, seen as safe bet amid cracks in AI trade, are among the S&P 500\u2019s biggest losers Monday", "full_content": "Shares of Kroger and Tyson Foods are down, as Nvidia storms higher", "source": "MarketWatch Top Stories", "pub_date_str": "23 Nov 2026, 11:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold, Silver Rates Highlights: Check Latest Gold Rates In Mumbai, Delhi, Chennai, Hyderabad, Bengaluru And Kolkata", "full_content": "Gold and silver prices rebounded in early Asian trade after steep losses last week amid reduced expectations of a US rate hike.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 11:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CrowdStrike to buy Zscaler in $44 billion deal as AI supercharges cyberattacks", "full_content": "CrowdStrike plans to buy Zscaler for $43.9 billion in an all-stock deal that combines two significant security businesses at a time when artificial intelligence is supercharging attacks.\n\nShares of CrowdStrike dropped 10% on Monday, while Zscaler surged more than 15%.\n\nThe deal is expected to close in the second half of CrowdStrike's fiscal year 2028. Under the agreement, Zscaler shareholders will receive 1.135 CrowdStrike shares for each share.\n\nCrowdStrike's acquisition pushes the Austin, Texas-based cyber vendor into the network security market and comes amid a massive year for cybersecurity deal-making in the wake of high-profile hacks like Hugging Face.\n\n\"With Zscaler, we're building cybersecurity's operating system: a single control plane to deploy AI, control AI, and enable any agentic application to run safely,\" CrowdStrike CEO George Kurtz said in a statement. \"We see a path to become the largest AI safety and security company the world has ever seen.\"\n\nRecent outages affecting Microsoft, the Federal Aviation Administration and JPMorgan Chase have sparked anxiety as businesses accelerate software patching and upgrades to aging systems in an effort to prevent bad actors from exploiting software vulnerabilities with AI.\n\nCrowdStrike has been a major beneficiary of skyrocketing demand for AI security, with shares soaring about 80% this year as of Monday's open. Zscaler shares are up about 5% year to date after Monday's surge. Their combined market value exceeded $265 billion as of Friday's close, behind market leader Palo Alto Networks at $282 billion.\n\nThe deal marks CrowdStrike's biggest acquisition to date and is among the largest in the sector as businesses consolidate and ramp up defenses to fend off AI-powered attacks.", "source": "CNBC World Economy", "pub_date_str": "23 Nov 2026, 11:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Average 401(k), IRA balances fall as more workers raid their accounts, Fidelity says", "full_content": "Retirement account balances fell slightly in the third quarter amid market volatility , according to data released Monday from Fidelity Investments , the nation's largest provider of 401(k) savings plans.\n\nSome workers also tapped their retirement accounts for cash, signaling that persistent affordability pressures continue to strain household finances, said Mike Shamrell, Fidelity's vice president of thought leadership.\n\nThe average 401(k) balance slipped 2% from the previous quarter to $152,500, while the average individual retirement account balance was down 1% to $142,261, Fidelity found. Both figures hit record highs during the second quarter.\n\nDespite the third-quarter decline, average balances in IRAs, 401(k)s and 403(b) plans \u2014 which are 401(k)-type plans offered by entities like public schools, churches and nonprofits \u2014 are higher year-over-year and continue to trend up over the long run.\n\nWall Street's major averages finished the third quarter on mixed footing , driven in part by war with Iran, which blocked passage through the Strait of Hormuz, a key transit artery for global energy supplies, and caused oil prices to spike. The stock market's slowdown in the third quarter marked a cooling after the double-digit gains posted in the previous quarter.\n\nThe S&P 500 index added 2.03% over the three-month period, while the Dow Jones Industrial Average fell 1.9% and the tech-heavy Nasdaq Composite ended the quarter 2.2% higher.\n\nAt the same time, financial pressures pushed more savers to reduce their contributions to retirement plans.\n\nThe average 401(k) contribution rate, including employee and employer contributions, edged down to 14.3% from 14.4% in the second quarter, Fidelity found. Fidelity's recommended combined annual savings benchmark is 15%.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 11:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Checked IPO GMP Before Applying? SEBI Wants Intermediaries To Stop Publishing It", "full_content": "SEBI has asked registered intermediaries to stop publishing IPO grey market premiums, warning that the unofficial figures can mislead investors and lack regulatory protection.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 11:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nasdaq jumps 7% as Nvidia shares soar", "full_content": "Chip giant up 33% after Huang reinstated while S&P gains 4.3%", "source": "FT Markets", "pub_date_str": "23 Nov 2026, 10:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jensen Huang reinstated as Nvidia CEO. Stock skyrockets 33%", "full_content": "Nvidia on Monday announced Jensen Huang has been reinstated as CEO , effective immediately, a dramatic twist in a scandal that hammered the chipmaker's stock price and rocked the tech and artificial intelligence industries.\n\nThe board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him. The board added that it \"received input from senior levels of the United States government\" and that it is confident Huang's reinstatement \"poses no national security risk.\"\n\nPresident Donald Trump told CNBC on Monday that he had been speaking to Nvidia's board \"directly and indirectly,\" and that Huang \"did nothing wrong.\" Trump said he talked to Huang on Sunday and asked him to promise to \"work hard.\"\n\nHuang resigned from his role as chief executive earlier this month after a series of shocking reports about multiple extramarital affairs, including one with an alleged Chinese spy. The New York Times reported on Sunday that the woman, Alice Huang, was in contact with an officer of China's Ministry of State Security during at least part of the time that she was engaging in a relationship with Huang.\n\nShares of Nvidia surged 33% following Huang's reinstatement. The stock had shed nearly 33% from the time Huang admitted to an extramarital affair on Nov. 8. The stock closed at $186.64 on Nov.6.\n\n\"I am honored to return to NVIDIA and lead one of the most consequential technology companies in the world at the beginning of a new industrial revolution,\" Huang said in a statement. \"I take this responsibility with the greatest humility and renewed commitment. I want to thank the NVIDIA Board for its confidence and deliberation through this process.\"\n\nNvidia stock chart. Senior government officials briefed Nvidia's board late last week and communicated that no national security laws were violated, according to sources familiar with the discussion who asked to remain anonymous because they were not authorized to speak publicly.", "source": "CNBC World Economy", "pub_date_str": "23 Nov 2026, 10:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India, UK working to resolve technical glitch over Scotch whisky duty concessions under trade pact", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, UK working to resolve technical glitch over Scotch whisky duty concessions under trade pact The Economic Times daily newspaper is available online now. Read Today's Paper India, UK working to resolve technical glitch over Scotch whisky duty concessions under trade pact SECTIONS India, UK working to resolve technical glitch over Scotch whisky duty concessions under trade pact PTI Last Updated: Nov 23, 2026, 10:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Commerce Ministry is working with the Finance Ministry, importers and UK authorities to resolve a customs classification issue affecting duty concessions on Scotch whisky imports under the India-UK trade pact. Commerce Secretary Rajesh Agarwal said India remains committed to its tariff obligations and has urged the DRI to release pending consignments.\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Nov 2026, 10:26 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "REIT, InvIT dividend income tax-free? ITAT Ahmedabad rules in favour of taxpayer in \u20b949.64 lakh tax dispute", "full_content": "An Ahmedabad-based taxpayer has won a significant tax dispute concerning dividend income from Real Estate Investment Trusts (REITs) and Infrastructure Investment Trusts (InvITs), with the Income Tax Appellate Tribunal ( ITAT ), Ahmedabad, ruling in her favour over the tax exemption claimed on \u20b9 49.64 lakh in distributions.\n\nIn its October 26, 2026, order, the tribunal examined the tax treatment of income distributed by business trusts and the applicability of exemptions under the Income Tax Act. The case centred on whether dividend income received by REIT and InvIT unitholders could be treated as tax-exempt when the underlying Special Purpose Vehicles (SPVs) had not opted for the concessional tax regime under Section 115BAA.\n\nThe ruling provides clarity on the pass-through taxation mechanism applicable to business trusts and the circumstances in which dividend distributions remain exempt in the hands of investors.\n\nThe taxpayer, referred to as Patel, had invested in several SEBI-registered business trusts, including Embassy Office Parks REIT , Mindspace Business Parks REIT and Powergrid Infrastructure Investment Trust .\n\nDuring the relevant financial year, she received \u20b9 49.64 lakh as dividend income from her investments. Believing that the distributions were exempt from income tax, she reported the amount as tax-free income in her income tax return (ITR).\n\nHowever, the Income Tax Assessing Officer (AO) questioned the exemption and initiated assessment proceedings.\n\nThe AO held that the exemption under Section 10(23FD) was not available and added the \u20b9 49.64 lakh to her taxable income under the head 'Income from Other Sources'.\n\nThe Commissioner of Income Tax (Appeals), or CIT(A), upheld the AO's decision, prompting Patel to approach ITAT Ahmedabad .", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 10:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "RBI Governor asks NBFCs, housing finance firms to bolster cyber defences", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI Governor asks NBFCs, housing finance firms to bolster cyber defences The Economic Times daily newspaper is available online now. Read Today's Paper RBI Governor asks NBFCs, housing finance firms to bolster cyber defences SECTIONS RBI Governor asks NBFCs, housing finance firms to bolster cyber defences PTI Last Updated: Nov 23, 2026, 10:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis RBI Governor Sanjay Malhotra called on non-banking finance companies and housing finance companies to bolster cybersecurity measures. He emphasized the importance of a comprehensive, risk-based approach to managing cyber threats. Malhotra also highlighted the necessity for responsible credit growth and customer prioritization within these financial institutions. Participants exchanged feedback on policy and operational aspects affecting the NBFC sector during the meeting.\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Nov 2026, 10:22 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jensen Huang is NVIDIA CEO again! What does it mean for Indian IT and tech shares? Experts explain, pick 5 stocks to buy", "full_content": "E2E Asit Manohar Published 23 Nov 2026, 10:21 PM IST Prefer Livemint on Google NVIDIA's share price saw strong upside on Monday after the AI giant announced the reinstatement of Jensen Huang as CEO with immediate effect. By 11:55 AM GMT, NVIDIA Corp share price was up by around 33% at $166.88 per share, recording its biggest intraday jump since 2000, adding more than $1 trillion to its market capitalisation in just a few hours and leading the S&P 500 and Nasdaq 100 indexes higher. The momentum extended to chipmakers, with the Philadelphia Stock Exchange Semiconductor Index soaring 13%, as well as other stocks tied to the AI infrastructure trade, including energy providers and industrial companies. As the Indian stock market was closed when Jensen Huang's announcement was made, experts predict a strong reaction when trading activity resumes on the BSE and the NSE on Wednesday.\n\nAccording to stock market experts, the rebound in NVIDIA share price helps calm fears of an immediate shock to the global AI supply chain, supporting broader equity sentiment rather than acting as a direct earnings driver for Indian indices. They said that Indian IT firms earn most of their revenue from US enterprises and Cloud/AI spending rather than selling GPUs. Stability at NVIDIA reduces near-term disruption in AI infrastructure rollouts, though large enterprise IT budgets still depend on broader US economic conditions and client spending cycles.\n\nSpeaking on the impact of Jensen Huang's reinstatement as NVIDIA CEO, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cData centre stocks in India are expected to react on Wednesday, when trading on the BSE and the NSE will resume.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 10:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The return of Jensen Huang has saved the U.S. stock market \u2014 for now. Why the rebound may not last.", "full_content": "Investors still have plenty of other problems to worry about.", "source": "MarketWatch Top Stories", "pub_date_str": "23 Nov 2026, 10:14 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SpaceX\u2019s big bad Black Friday bond hangover", "full_content": "\ud83e\ude90 \ud83d\ude80", "source": "FT Markets", "pub_date_str": "23 Nov 2026, 10:11 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Inco     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
