    const allData = {"general": [{"title": "How ITC shares are performing after Q2 results? Should you buy, sell or hold? Brokerages give targets, key levels", "full_content": "ITC shares rose over 1% on Tuesday, 3 November, after the diversified conglomerate reported its Q2 FY27 results, with consolidated profit declining 18.45% year-on-year amid a sharp increase in expenses.\n\nThe company's consolidated net profit stood at \u20b9 4,229.33 crore in the September quarter, compared with \u20b9 5,186.55 crore in the corresponding period last year, according to its regulatory filing.\n\nHowever, revenue from operations increased 43.85% year-on-year to \u20b9 30,578.4 crore in Q2 FY27, against \u20b9 21,255.86 crore in the year-ago quarter.\n\nITC's total expenses surged 69.6% to \u20b9 25,462.44 crore during the quarter. Total consolidated income, including other income, rose 42.33% to \u20b9 31,085.76 crore.\n\nIn its earnings statement, ITC said it recorded robust growth across all non-cigarette business segments.\n\nThe FMCG business delivered its fourth consecutive quarter of double-digit revenue growth, while its EBITDA margin expanded by 50 basis points year-on-year despite inflationary pressures.\n\nThe company also reported a strong recovery in its paper segment, while the agriculture business recorded healthy growth despite trade disruptions arising from tensions in West Asia.\n\nRevenue from ITC's total FMCG business, which includes cigarettes, increased 51.58% to \u20b9 23,455.47 crore during the September quarter.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 01:30 PM IST", "pub_date_relative": "3m ago"}, {"title": "Diwali 2026 Muhurat Trading Samvat 2083 stocks with up to 35% gain: HDFC AMC, SBI, Tech Mahindra, 3 more by Anand Rathi", "full_content": "HDFCAMC SBIN CEMPRO SHILPAMED Pranati Deva Published 3 Nov 2026, 01:28 PM IST Prefer Livemint on Google Diwali 2026 stock picks : With Diwali approaching, investors looking to add stocks to t vestors do?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIf last year's silver rally tempted you to join in, this year's slide offers a sobering lesson. Silver ETFs have corrected more than 50% from their highs earlier this year, leaving investors who entered near the peak nursing steep losses.\n\nThe reversal underscores why silver should remain a small part of a diversified portfolio. Driven by both industrial and investment demand, the metal can be highly volatile. Experts attribute the recent correction to the unwinding of speculative positions and rising US bond yields, which have dulled the appeal of non-yielding assets such as silver.\n\nSilver prices are driven by two factors: industrial demand and investment demand. \u201cRight now both drivers are seeing some pullback. Industrial demand is slowing due to easing demand from the renewable space and investment demand is easing as several silver ETFs globally have seen redemptions,\u201d said a fund manager, requesting anonymity.\n\nInvestor redemptions can partly be attributed to rising bond yields. Typically, when yields rise, commodities such as gold and silver lose their appeal because they do not offer any income.\n\n\u201cAs long as we are talking about higher interest rates and higher inflation, the fall could be capped,\u201d said Manav Modi, analyst, precious metal research at Motilal Oswal Financial Services.\n\nWith US inflation expected to remain elevated, markets expect the Federal Reserve to keep interest rates higher for longer, with further hikes possible. \u201cHigh inflation, a hawkish Fed and high bond yields are drawing investors away from gold and silver towards US Treasuries. In this situation, silver prices could stay in the current range.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 01:25 PM IST", "pub_date_relative": "8m ago"}, {"title": "War widens in the Black Sea in a test of NATO red lines", "full_content": " re down 2% in extended trading after the consumer tech giant rolled out a disappointing margin forecast and iPad sales in the fiscal fourth quarter missed the Street's estimates.\n\nOver in Asia, markets were mostly down on Tuesday, led by tech losses in South Korea and Taiwan.\n\nThe Kospi ended 3.59% down at 5,648.79, while the Taiwan Weighted Index fell 3.59% as well, closing at 43,307.54.\n\nThe only exception were Australia's S&P/ASX 200 , which gained 0.34% to end at 8,886.8, as well as Hong Kong's Hang Seng Index , which was 0.37% up in its final hour of trade.\n\nIn the regular U.S . session, the tech-heavy Nasdaq Composite dipped 1.07%, while the S&P 500 fell 0.51% as investors continued their rotation out of tech stocks. The Dow rose about 214 points, or 0.41%.\n\nMarvell Technology shares fell about 12%, while Lumentum dropped 18% after Marvell announced it would acquire Lumentum in a $115 billion deal. Oracle shares also fell 8% after the company said i t plans to sell $10 billion in common stock and $10 billion in bonds to help finance its artificial intelligence build-out.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 01:15 PM IST", "pub_date_relative": "18m ago"}, {"title": "GRSE shares jump 9% after signing Rs 32,000 crore Indian Navy contract for five next-generation corvettes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a GRSE shares jump 9% after signing Rs 32,000 crore Indian Navy contract for five next-generation corvettes The Economic Times daily newspaper is available online now. Read Today's Paper GRSE shares jump 9% after signing Rs 32,000 crore Indian Navy contract for five next-generation corvettes SECTIONS GRSE shares jump 9% after signing Rs 32,000 crore Indian Navy contract for five next-generation corvettes By Surbhi Khanna , ET Online Last Updated: Nov 03, 2026, 01 lumes reaching 146.96 lakh shares worth \u20b9 1,051.91 crore by mid-session, compared with \u20b9 718.40 crore on Monday.\n\nThe stock remained significantly below its 52-week high of \u20b9 1,017.90, recorded in December 2025. It had touched a 52-week low of \u20b9 668.90 on October 28, 2026. Despite Tuesday's gains, HDFC Bank shares remained under pressure, having fallen around 4.5% in three months, 7% in six months and 27% over the past year.\n\nHDFC Bank Q2 results: Profit rises 4.7%, asset quality improves\n\nHDFC Bank reported a 4.7% year-on-year (YoY) increase in profit after tax (PAT) to \u20b9 19,510 crore in Q2FY27, including treasury trading gains. Excluding these gains, net profit grew 12.6% compared with the corresponding quarter last year.\n\nNet interest income (NII), which represents the difference between interest earned on loans and investments and interest paid on deposits and borrowings, increased 9.7% YoY to \u20b9 34,620 crore from \u20b9 31,550 crore.\n\nThe bank's net interest margin (NIM) stood at 3.16% on total assets, down from 3.26% in the previous quarter. NIM on interest-earning assets was 3.32% during the July-September quarter.\n\nProvisions and contingencies increased 18.7% sequentially to \u20b9 3,574 crore from \u20b9 3,010 crore in the June quarter. However, they were up just 2.1% from \u20b9 3,501 crore in the year-ago period.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 01:06 PM IST", "pub_date_relative": "27m ago"}, {"title": "Nasdaq Slide Clouds Asian Open, Oil Falls on Iran: Markets Wrap - Bloomberg.com", "full_content": "Nasdaq Slide Clouds Asian Open, Oil Falls on Iran: Markets Wrap Bloomberg.com See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 01:04 PM IST", "pub_date_relative": "29m ago"}, {"title": "India bonds wipe out early gains as oil rebounds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics W  Silver rates today, 3 Nov: Gold prices in Coimbatore fell today on Tuesday, 3 November, as they slipped globally, as the market went into consolidation mode while investors seek safe haven cover and protection against inflation, Reuters reported.\n\nSpot gold fell 0.5% to $3,926.52 per ounce by 0353 GMT and US gold futures for December delivery dropped 0.8% to $3,936.30. Among other metals, spot silver slipped 1.8% to $49.71 per ounce, platinum dropped 0.2% to $1,446.80 and palladium dipped 1.4% to $953.64, it added.\n\nGold and silver prices also declined in the domestic futures market on Tuesday, tracking weakness in precious metals. On the Multi Commodity Exchange (MCX), gold futures fell by 0.92% to \u20b9 1,38,900 per 10 grams. Silver futures declined by 3.03% to \u20b9 1,78,207 per kg.\n\nGold prices surged over 2% in the previous session as a drop in oil prices eased inflation concerns, even as investors await the US midterm election outcome today.\n\n\u201cGold is still in consolidation mode after the price pummelling it took last week. Gold continues to be sold as a high-liquidity asset to cover losses and margin calls elsewhere rather than being bought as a traditional safe haven. That characteristic is working against it in the current environment,\u201d Tim Waterer, chief market analyst at KCM Trade told the agency.\n\nAt time of writing, gold bullion was trading at \u20b9 1,39,260 per 10 grams, while Silver was at \u20b9 1,79,270 per kg, data on the bullion website showed.\n\nCheck the latest prices and up-down movement for precious metal investors in Coimbatore; and gold and silver rates in key Indian cities on Tuesday, 3 November 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bangalore, Chennai, Delhi , Hyderabad, Kolkata and Mumbai today as follows:\n\nThe 24-karat gold price was at \u20b9 1,39,340 per 10 grams, on 3 November.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 12:51 PM IST", "pub_date_relative": "42m ago"}, {"title": "Why Is Stock Market Rising Today? Sensex Jumps Over 3,400 Points In Four Sessions, Nifty 50 Above 23,700; 3 Key Reasons", "full_content": "Sectorally, Nifty FMCG, Nifty Realty, Nifty Auto and Nifty Private Bank indices were in the green, while Nifty Metals, Nifty IT and Nifty Pharma were led the losses.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:51 PM IST", "pub_date_relative": "43m ago"}, {"title": "Marico\u2019s profits roar back. Can it sustain gains beyond copra windfall?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMarico\u2019s investors have reason to change their mind after the September quarter (Q2FY27) earnings announced post-market hours on Monday. The stock gained about 8% on Tuesday. Recall that the stock had slumped 9% after its Q1 results.\n\nThe turnaround in sentiment has come on the back of market-share gains and a sharp recovery in profitability, with consolidated Ebitda growing 27% year-on-year, the fastest growth in 50 quarters, as per Marico. The Ebitda margin expanded 200 basis points (bps) to 18.2%, benefiting from softening of copra prices year-on-year.\n\nBut with revenue missing estimates and commodity prices remaining a wild card, the question is whether this optimism can last. Consolidated revenue grew 13% year-on-year in Q2, while net profit rose faster at 31% to \u20b9 550 crore. India underlying volume growth stood at 10% and revenue growth was 9%, reflecting healthy demand and improving distribution.\n\nMore than 95% of the portfolio gained or sustained market share and penetration on a moving annual total basis. Traditional and organized trade grew in double-digits, while quick commerce gained momentum, making up for the uneven growth reported in mainstay Parachute coconut oil and Saffola edible oil products.\n\nParachute delivered 13% volume growth\u2014the strongest in 22 quarters\u2014taking its volume market share beyond 60%. However, value growth was barely 1%, as price cuts to pass on lower copra costs supported volumes but constrained realizations.\n\nSaffola saw high single-digit volume decline despite 6% revenue growth. Rationalization of lower-margin variants and pricing interventions may improve profitability, but reviving volumes remains important. Parachute and Saffola together accounted for half of Marico\u2019s India revenue.\n\nValue-added hair oils continued to impress with 21% value growth, and the foods business grew 45%, crossing an annualized revenue run-rate of \u20b9 1,500 crore.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 12:49 PM IST", "pub_date_relative": "44m ago"}, {"title": "Angel One, CDSL, BSE, other capital market stocks jump up to 8%. 3 reasons behind the rally", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Angel One, CDSL, BSE, other capital market stocks jump up to 8%. 3 reasons behind the rally BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Angel One, CDSL, BSE, other capital market stocks jump up to 8%. 3 reasons behind the rally SECTIONS Angel One, CDSL, BSE, other capital market stocks jump up to 8%. 3 reasons behind the rally By Debaroti Adhikary , ETMarkets.com Last Updated: Nov 03, 2026, 12:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Capital market stocks rallied up to 8% as hopes of LTCG tax relief, renewed FII buying and a broader market recovery lifted investor sentiment. The Nifty Capital Markets index climbed over 3% to a seven-week high.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETM  What's Next After Crude Oil Premium Collapses? D-Street Expert Weighs In", "full_content": "After tumbling nearly 8% in the previous session, crude oil prices extended their decline their in the initial half of Tuesday, November 3, as hopes of progress in US-Iran diplomatic negotiations eased concerns over further disruptions to global energy supplies.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:43 PM IST", "pub_date_relative": "51m ago"}, {"title": "India to make tunnel boring machines at home if China curbs exports: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India to make tunnel boring machines at home if China curbs exports: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India to make tunnel boring machines at home if China curbs exports: Piyush Goyal SECTIONS India to make tunnel boring machines at home if China curbs exports: Piyush Goyal Reuters Last Updated: Nov 03, 2026, 12:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is gearing up to start producing its own tunnel boring machines if China decides to limit its exports. This statement came from Piyush Goyal, India's trade minister, after Beijing made its recent announcement. It highlights India\u2019s plan to not rely on foreign supplies and enhance its domestic manufacturing capabilities in this crucial area.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock fo Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 12:34 PM IST", "pub_date_relative": "59m ago"}, {"title": "Two Years Of Little Market Gains: Is Dalal Street Entering A Longer Pause? Advait Arora Weighs In", "full_content": "To put the underperformance in numbers, the NSE Nifty 50 has declined around 3.5% over the past two years, while the BSE Sensex has shed a little over 4% during the same period.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "UPSC CDS I 2026 Final Results announced: 243 Candidates Qualify; Direct Link Here", "full_content": "Union Public Service Commission announced final results of the Combined Defence Services Examination I 2026, with 243 candidates the merit list", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "A Rs 452 Crore Blockbuster, Four Producers and A Dispute: What's Wrong With 'Hanuman Ansh'?", "full_content": "The 'Hanuman Ansh' producers shared a public notice on Instagram on Monday, stating that all four must approve decisions on the film's rights and promotions.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Blackstone president calls for more equity to fund AI buildout as debt risks mount", "full_content": "The artificial intelligence infrastructure buildout will need more equity financing as lenders become increasingly exposed to the companies driving the buildout, Blackstone President Jon Gray said Tuesday.\n\nSpeaking at the Hong Kong Monetary Authority\u2019s Global Financial Leaders\u2019 Investment Summit, Gray said the scale of capital required for AI is creating concentration risks for debt investors, both across the sector and at individual companies.\n\nUnlike shareholders, who can benefit from a company's growth, lenders have limited upside as their returns are largely confined to interest and principal repayments, he said.\n\nSpeaking at the same panel, Pimco CEO Emmanuel Roman warned investors that the scale of AI financing could prove to be \"too much\" for markets to absorb.\n\nRoman said AI-related capital spending could reach around $10 trillion over the next five years, citing General Atlantic CEO Bill Ford's estimate. He added that about $550 billion in AI debt had been issued in various forms so far this year.\n\nEven with a mix of equity and debt financing, the amount required would be \u201cgigantic,\u201d Roman said, comparing it with a global corporate bond market of roughly $20 trillion.\n\nGlobal data center demand will require about $8.5 trillion in capital spending over the next five years, Goldman Sachs wrote in a report Monday.\n\nGray said financing the buildout would require a combination of public markets, banks and private capital, with companies increasingly turning to structured transactions to limit the amount of debt they take on. Cash generated by hyperscalers would also fund part of the spending, he said.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Australia raises rates to highest level since 2008 financial crisis", "full_content": "Central bank\u2019s fifth increase this year comes as inflation remains above target", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "No water to sow, no respite at the grocery store: India's prolonged food inflation worry", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business Ne x could result in a revenue shortfall of around Rs 40,000-50,000 crore in FY28, equivalent to approximately 0.1-0.2% of GDP. It believes the government could accommodate this within its fiscal framework.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Reliance shares: After massive 12% surge, Mukesh Ambani's RIL stock slips from biggest single-day rally since 2020; buy?", "full_content": "ARSSBL CURRENT Pranati Deva Published 3 Nov 2026, 12:04 PM IST Prefer Livemint on Google Reliance Industries share price : Reliance Industries share price declined over 1% in intraday trade on Tuesday, November 3, on profit booking after rallying nearly 12% in the previous session. The stock fell as much as 1.3% to an intraday low of \u20b9 1,281.55 on the NSE, giving back some of Monday's sharp gains.\n\nReliance Industries shares had surged 11.6% on Monday to close at \u20b9 1,300, their highest level since early September. The rally marked the stock's biggest single-day gain since April 2020 and helped lift the Nifty 50 by 1.7%, given the company's heavyweight presence in the index.\n\nThe sharp rebound also added \u20b9 1.84 lakh crore to Reliance Industries' market capitalisation, taking it to \u20b9 17.6 lakh crore and helping it retain its position as India's most valuable listed company. At its peak of \u20b9 1,611, the company had commanded a market capitalisation of \u20b9 21.8 lakh crore. It had crossed the \u20b9 21 lakh crore milestone in June 2024, becoming the first Indian company to achieve the feat.\n\nDespite Monday's rally, Reliance shares remain down 17.22% so far in 2026. The stock had been under pressure for much of the year, closing lower in eight of the previous 10 months. The latest gains followed the company's record quarterly profit, which renewed investor interest in the stock.\n\nReliance Industries reported a record consolidated profit after tax (PAT) of \u20b9 29,550 crore for Q2FY27, marking a 33.8% increase from \u20b9 22,092 crore in the year-ago quarter. Revenue rose 27.8% year-on-year (YoY) to \u20b9 3,62,268 crore, while EBITDA increased 23.9% to a record \u20b9 62,409 crore.\n\nThe oil-to-chemicals (O2C) business was the biggest contributor to the strong performance. Its EBITDA surged 67.9% to \u20b9 25,203 crore, supported by higher global fuel margins and improved petrochemical spreads.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "JNU Forms 5-Member Committee To Probe 'Discrepancies' In Seat Allocation For ST Students In PhD Admission", "full_content": "The Students' Federation of India had alleged discrepancies in how JNU implemented reservation norms for PhD admissions in 2026-27", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "North Korea denies links to Binance hack as researchers trace stolen billions", "full_content": "North Korea rejected allegations linking Pyongyang to the estimated $6.3 billion Binance hack, calling the accusation a \u201cgrave political provocation,\u201d according to state media.\n\nKim Yo Jong, sister of North Korean leader Kim Jong Un, denounced the FBI's attribution of the attack to North Korea-linked hacking group TraderTraitor, Yohnap reported Tuesday, citing the state-run Korean Central News Agency.\n\nBlockchain analytics firms including Elliptic and Chainalysis have also linked the attack and subsequent movement of the stolen funds to North Korea-linked actors.\n\n\"The FBI is trying to brand the DPRK as a 'cyber criminal state', claiming that it obtained information that a hacking organization 'supported' by the DPRK was involved in the incident,\" Kim said, according to KCNA.\n\nShe accused Washington of misleading international public opinion by portraying cybercrimes around the world as the work of North Korea.\n\nSeparately, Binance said Tuesday it would begin progressively reopening withdrawals for additional crypto assets across more networks, expanding its phased restoration of services following last week's hack.\n\nThe denial comes as blockchain analytics firms trace billions of dollars in cryptocurrency stolen from Binance through thousands of wallets across multiple blockchains.\n\nElliptic and Chainalysis said hackers linked to North Korea have used increasingly complex techniques to obscure the trail of the funds.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 12:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "November Car Launch Calendar: Four New Models To Watch And What To Expect", "full_content": "India's November 2026 car launches will include the Mercedes-Benz GLC Electric, Denza D9 and Z9 GT, Toyota Innova Hycross facelift and MINI Cooper SE, bringing new luxury EVs, hybrid technology and premium features to the market.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "How ITC shares are performing after Q2 results? Should you buy, sell or hold? Brokerages give targets, key levels", "full_content": "ITC shares rose over 1% on Tuesday, 3 November, after the diversified conglomerate reported its Q2 FY27 results, with consolidated profit declining 18.45% year-on-year amid a sharp increase in expenses.\n\nThe company's consolidated net profit stood at \u20b9 4,229.33 crore in the September quarter, compared with \u20b9 5,186.55 crore in the corresponding period last year, according to its regulatory filing.\n\nHowever, revenue from operations increased 43.85% year-on-year to \u20b9 30,578.4 crore in Q2 FY27, against \u20b9 21,255.86 crore in the year-ago quarter.\n\nITC's total expenses surged 69.6% to \u20b9 25,462.44 crore during the quarter. Total consolidated income, including other income, rose 42.33% to \u20b9 31,085.76 crore.\n\nIn its earnings statement, ITC said it recorded robust growth across all non-cigarette business segments.\n\nThe FMCG business delivered its fourth consecutive quarter of double-digit revenue growth, while its EBITDA margin expanded by 50 basis points year-on-year despite inflationary pressures.\n\nThe company also reported a strong recovery in its paper segment, while the agriculture business recorded healthy growth despite trade disruptions arising from tensions in West Asia.\n\nRevenue from ITC's total FMCG business, which includes cigarettes, increased 51.58% to \u20b9 23,455.47 crore during the September quarter.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 01:30 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Diwali 2026 Muhurat Trading Samvat 2083 stocks with up to 35% gain: HDFC AMC, SBI, Tech Mahindra, 3 more by Anand Rathi", "full_content": "HDFCAMC SBIN CEMPRO SHILPAMED Pranati Deva Published 3 Nov 2026, 01:28 PM IST Prefer Livemint on Google Diwali 2026 stock picks : With Diwali approaching, investors looking to add stocks to their portfolios may be weighing opportunities across banking, technology, infrastructure, pharmaceuticals and financial services. Anand Rathi Share and Stock Brokers has identified six stocks for its Diwali 2026 portfolio, assigning Buy ratings and setting 12-month target prices that indicate potential upside of 16% to 35% from their November 2 closing prices.\n\nThe list includes large-cap names such as State Bank of India (SBI) and Tech Mahindra, alongside companies such as Cemindia Projects , Shilpa Medicare and Indo-MIM. The recommendations are based on individual business prospects, earnings visibility and sector-specific growth opportunities.\n\nSBI is Anand Rathi\u2019s top pick in terms of potential upside, with a target price of \u20b9 1,337 against the current market price of \u20b9 987, indicating a potential gain of 35% over 12 months.\n\nThe brokerage expects the lender to benefit from healthy deposit and credit growth, a diversified loan book and improving asset quality. SBI\u2019s deposits grew at a 10.3% CAGR between FY24 and FY26, while gross advances increased at a faster 14.4% CAGR. Its focus on mobilising low-cost retail deposits could also help lower its cost of funds and support net interest margins.\n\nThe bank\u2019s gross NPA ratio declined to 1.47% in Q1FY27 from 1.83% a year earlier, while its net NPA ratio fell to 0.38% from 0.47%.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 01:28 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Krsnaa Diagnostics posts record Q2 2026 revenue, shares fall", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 01:26 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Itau BBA downgrades Coca Cola Femsa stock rating on valuation", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 01:26 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Silver fall: what drove the crash, what's next and what should investors do?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIf last year's silver rally tempted you to join in, this year's slide offers a sobering lesson. Silver ETFs have corrected more than 50% from their highs earlier this year, leaving investors who entered near the peak nursing steep losses.\n\nThe reversal underscores why silver should remain a small part of a diversified portfolio. Driven by both industrial and investment demand, the metal can be highly volatile. Experts attribute the recent correction to the unwinding of speculative positions and rising US bond yields, which have dulled the appeal of non-yielding assets such as silver.\n\nSilver prices are driven by two factors: industrial demand and investment demand. \u201cRight now both drivers are seeing some pullback. Industrial demand is slowing due to easing demand from the renewable space and investment demand is easing as several silver ETFs globally have seen redemptions,\u201d said a fund manager, requesting anonymity.\n\nInvestor redemptions can partly be attributed to rising bond yields. Typically, when yields rise, commodities such as gold and silver lose their appeal because they do not offer any income.\n\n\u201cAs long as we are talking about higher interest rates and higher inflation, the fall could be capped,\u201d said Manav Modi, analyst, precious metal research at Motilal Oswal Financial Services.\n\nWith US inflation expected to remain elevated, markets expect the Federal Reserve to keep interest rates higher for longer, with further hikes possible. \u201cHigh inflation, a hawkish Fed and high bond yields are drawing investors away from gold and silver towards US Treasuries. In this situation, silver prices could stay in the current range.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 01:25 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "KRBL Q2 FY27 slides: domestic surge offsets export decline", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 01:22 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Paradeep Phosphates Q2 FY27 slides: revenue rises 7% as margins compress", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 01:17 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500 futures are flat as investors weigh Apple earnings; U.S. midterm elections loom: Live updates", "full_content": "S&P 500 futures were little changed on Tuesday as investors mulled over Apple's quarterly earnings report and awaited U.S. midterm elections.\n\nDow Jones Industrial Average futures lost 161 points. S&P 500 futures inched down less than 0.1%, while Nasdaq-100 futures added 0.12%.\n\nApple shares were down 2% in extended trading after the consumer tech giant rolled out a disappointing margin forecast and iPad sales in the fiscal fourth quarter missed the Street's estimates.\n\nOver in Asia, markets were mostly down on Tuesday, led by tech losses in South Korea and Taiwan.\n\nThe Kospi ended 3.59% down at 5,648.79, while the Taiwan Weighted Index fell 3.59% as well, closing at 43,307.54.\n\nThe only exception were Australia's S&P/ASX 200 , which gained 0.34% to end at 8,886.8, as well as Hong Kong's Hang Seng Index , which was 0.37% up in its final hour of trade.\n\nIn the regular U.S . session, the tech-heavy Nasdaq Composite dipped 1.07%, while the S&P 500 fell 0.51% as investors continued their rotation out of tech stocks. The Dow rose about 214 points, or 0.41%.\n\nMarvell Technology shares fell about 12%, while Lumentum dropped 18% after Marvell announced it would acquire Lumentum in a $115 billion deal. Oracle shares also fell 8% after the company said i t plans to sell $10 billion in common stock and $10 billion in bonds to help finance its artificial intelligence build-out.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 01:15 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GRSE shares jump 9% after signing Rs 32,000 crore Indian Navy contract for five next-generation corvettes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a GRSE shares jump 9% after signing Rs 32,000 crore Indian Navy contract for five next-generation corvettes The Economic Times daily newspaper is available online now. Read Today's Paper GRSE shares jump 9% after signing Rs 32,000 crore Indian Navy contract for five next-generation corvettes SECTIONS GRSE shares jump 9% after signing Rs 32,000 crore Indian Navy contract for five next-generation corvettes By Surbhi Khanna , ET Online Last Updated: Nov 03, 2026, 01:13:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis GRSE shares surged nearly 9% after securing a Rs 32,000-crore Indian Navy contract to build five Next Generation Corvettes. The nine-year project will strengthen indigenous defence manufacturing, enhance maritime capabilities and reinforce GRSE's warship-building position, adding significantly to its order book and long-term business prospects.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\n e past year.\n\nHDFC Bank Q2 results: Profit rises 4.7%, asset quality improves\n\nHDFC Bank reported a 4.7% year-on-year (YoY) increase in profit after tax (PAT) to \u20b9 19,510 crore in Q2FY27, including treasury trading gains. Excluding these gains, net profit grew 12.6% compared with the corresponding quarter last year.\n\nNet interest income (NII), which represents the difference between interest earned on loans and investments and interest paid on deposits and borrowings, increased 9.7% YoY to \u20b9 34,620 crore from \u20b9 31,550 crore.\n\nThe bank's net interest margin (NIM) stood at 3.16% on total assets, down from 3.26% in the previous quarter. NIM on interest-earning assets was 3.32% during the July-September quarter.\n\nProvisions and contingencies increased 18.7% sequentially to \u20b9 3,574 crore from \u20b9 3,010 crore in the June quarter. However, they were up just 2.1% from \u20b9 3,501 crore in the year-ago period.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 01:06 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq Slide Clouds Asian Open, Oil Falls on Iran: Markets Wrap - Bloomberg.com", "full_content": "Nasdaq Slide Clouds Asian Open, Oil Falls on Iran: Markets Wrap Bloomberg.com See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 01:04 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India bonds wipe out early gains as oil rebounds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds wipe out  took last week. Gold continues to be sold as a high-liquidity asset to cover losses and margin calls elsewhere rather than being bought as a traditional safe haven. That characteristic is working against it in the current environment,\u201d Tim Waterer, chief market analyst at KCM Trade told the agency.\n\nAt time of writing, gold bullion was trading at \u20b9 1,39,260 per 10 grams, while Silver was at \u20b9 1,79,270 per kg, data on the bullion website showed.\n\nCheck the latest prices and up-down movement for precious metal investors in Coimbatore; and gold and silver rates in key Indian cities on Tuesday, 3 November 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bangalore, Chennai, Delhi , Hyderabad, Kolkata and Mumbai today as follows:\n\nThe 24-karat gold price was at \u20b9 1,39,340 per 10 grams, on 3 November.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 12:51 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why Is Stock Market Rising Today? Sensex Jumps Over 3,400 Points In Four Sessions, Nifty 50 Above 23,700; 3 Key Reasons", "full_content": "Sectorally, Nifty FMCG, Nifty Realty, Nifty Auto and Nifty Private Bank indices were in the green, while Nifty Metals, Nifty IT and Nifty Pharma were led the losses.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:51 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Marico\u2019s profits roar back. Can it sustain gains beyond copra windfall?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMarico\u2019s investors have reason to change their mind after the September quarter (Q2FY27) earnings announced post-market hours on Monday. The stock gained about 8% on Tuesday. Recall that the stock had slumped 9% after its Q1 results.\n\nThe turnaround in sentiment has come on the back of market-share gains and a sharp recovery in profitability, with consolidated Ebitda growing 27% year-on-year, the fastest growth in 50 quarters, as per Marico. The Ebitda margin expanded 200 basis points (bps) to 18.2%, benefiting from softening of copra prices year-on-year.\n\nBut with revenue missing estimates and commodity prices remaining a wild card, the question is whether this optimism can last. Consolidated revenue grew 13% year-on-year in Q2, while net profit rose faster at 31% to \u20b9 550 crore. India underlying volume growth stood at 10% and revenue growth was 9%, reflecting healthy demand and improving distribution.\n\nMore than 95% of the portfolio gained or sustained market share and penetration on a moving annual total basis. Traditional and organized trade grew in double-digits, while quick commerce gained momentum, making up for the uneven growth reported in mainstay Parachute coconut oil and Saffola edible oil products.\n\nParachute delivered 13% volume growth\u2014the strongest in 22 quarters\u2014taking its volume market share beyond 60%. However, value growth was barely 1%, as price cuts to pass on lower copra costs supported volumes but constrained realizations.\n\nSaffola saw high single-digit volume decline despite 6% revenue growth. Rationalization of lower-margin variants and pricing interventions may improve profitability, but reviving volumes remains important. Parachute and Saffola together accounted for half of Marico\u2019s India revenue.\n\nValue-added hair oils continued to impress with 21% value growth, and the foods business grew 45%, crossing an annualized revenue run-rate of \u20b9 1,500 crore.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 12:49 PM IST", "pub_date_relativ ice\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 12:34 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Two Years Of Little Market Gains: Is Dalal Street Entering A Longer Pause? Advait Arora Weighs In", "full_content": "To put the underperformance in numbers, the NSE Nifty 50 has declined around 3.5% over the past two years, while the BSE Sensex has shed a little over 4% during the same period.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "UPSC CDS I 2026 Final Results announced: 243 Candidates Qualify; Direct Link Here", "full_content": "Union Public Service Commission announced final results of the Combined Defence Services Examination I 2026, with 243 candidates the merit list", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Blackstone president calls for more equity to fund AI buildout as debt risks mount", "full_content": "The artificial intelligence infrastructure buildout will need more equity financing as lenders become increasingly exposed to the companies driving the buildout, Blackstone President Jon Gray said Tuesday.\n\nSpeaking at the Hong Kong Monetary Authority\u2019s Global Financial Leaders\u2019 Investment Summit, Gray said the scale of capital required for AI is creating concentration risks for debt investors, both across the sector and at individual companies.\n\nUnlike shareholders, who can benefit from a company's growth, lenders have limited upside as their returns are largely confined to interest and principal repayments, he said.\n\nSpeaking at the same panel, Pimco CEO Emmanuel Roman warned investors that the scale of AI financing could prove to be \"too much\" for markets to absorb.\n\nRoman said AI-related capital spending could reach around $10 trillion over the next five years, citing General Atlantic CEO Bill Ford's estimate. He added that about $550 billion in AI debt had been issued in various forms so far this year.\n\nEven with a mix of equity and debt financing, the amount required would be \u201cgigantic,\u201d Roman said, comparing it with a global corporate bond market of roughly $20 trillion.\n\nGlobal data center demand will require about $8.5 trillion in capital spending over the next five years, Goldman Sachs wrote in a report Monday.\n\nGray said financing the buildout would require a combination of public markets, banks and private capital, with companies increasingly turning to structured transactions to limit the amount of debt they take on. Cash generated by hyperscalers would also fund part of the spending, he said.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Australia raises rates to highest level since 2008 financial crisis", "full_content": "Central bank\u2019s fifth increase this year comes as inflation remains above target", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "No water to sow, no respite at the grocery store: India's prolonged food inflation worry", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a No water to sow, no respite at the grocery store: India's prolonged food inflation worry The Economic Times daily newspaper is available online now. Read Today's Paper No water to sow, no respite at the grocery store: India's prolonged food inflation worry SECTIONS No water to sow, no respite at the grocery store: India's prolonged food inflation worry Reuters Last Updated: Nov 03, 2026, 12:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian farmers face challenges in sowing winter crops amid dwindling water supplies from a weak monsoon. Amarsingh Gushinge's village experiences a significant rainfall deficit, impacting crop planting decisions. Food inflation could worsen as key staples see rising prices, aggravating the economic strain on households. The Reserve Bank of India may respond with interest rate hikes to combat rising inflationary pressures.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Nov 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "LTCG Tax Reforms: Zero Tax After 3 Years, Higher Exemption Limit, Among 5 Key Suggestions By SBI Research", "full_content": "SBI Research estimates that abolishing LTCG tax could result in a revenue shortfall of around Rs 40,000-50,000 crore in FY28, equivalent to approximately 0.1-0.2% of GDP. It believes the government could accommodate this within its fiscal framework.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 12:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Reliance shares: After massive 12% surge, Mukesh Ambani's RIL stock slips from biggest single-day rally since 2020; buy?", "full_content": "ARSSBL CURRENT Pranati Deva Published 3 Nov 2026, 12:04 PM IST Prefer Livemint on Google Reliance Industries share price : Reliance Industries share price declined over 1% in intraday trade on Tuesday, November 3, on profit booking after rallying nearly 12% in the previous session. The stock fell as much as 1.3% to an intraday low of \u20b9 1,281.55 on the NSE, giving back some of Monday's sharp gains.\n\nReliance Industries shares had surged 11.6% on Monday to close at \u20b9 1,300, their highest level since early September. The rally marked the stock's biggest single-day gain since April 2020 and helped lift the Nifty 50 by 1.7%, given the company's heavyweight presence in the index.\n\nThe sharp rebound also added \u20b9 1.84 lakh crore to Reliance Industries' market capitalisation, taking it to \u20b9 17.6 lakh crore and helping it retain its position as India's most valuable listed company. At its peak of \u20b9 1,611, the company had commanded a market capitalisation of \u20b9 21.8 lakh crore. It had crossed the \u20b9 21 lakh crore milestone in June 2024, becoming the first Indian company to achieve the feat.\n\nDespite Monday's rally, Reliance shares remain down 17.22% so far in 2026. The stock had been under pressure for much of the year, closing lower in eight of the previous 10 months. The latest gains followed the company's record quarterly profit, which renewed investor interest in the stock.\n\nReliance Industries reported a record consolidated profit after tax (PAT) of \u20b9 29,550 crore for Q2FY27, marking a 33.8% increase from \u20b9 22,092 crore in the year-ago quarter. Revenue rose 27.8% year-on-year (YoY) to \u20b9 3,62,268 crore, while EBITDA increased 23.9% to a record \u20b9 62,409 crore.\n\nThe oil-to-chemicals (O2C) business was the biggest contributor to the strong performance. Its EBITDA surged 67.9% to \u20b9 25,203 crore, supported by higher global fuel margins and improved petrochemical spreads.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 12:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "North Korea denies links to Binance hack as researchers trace stolen billions", "full_content": "North Korea rejected allegations linking Pyongyang to the estimated $6.3 billion Binance hack, calling the accusation a \u201cgrave political provocation,\u201d according to state media.\n\nKim Yo Jong, sister of North Korean leader Kim Jong Un, denounced the FBI's attribution of the attack to North Korea-linked hacking group TraderTraitor, Yohnap reported Tuesday, citing the state-run Korean Central News Agency.\n\nBlockchain analytics firms including Elliptic and Chainalysis have also linked the attack and subsequent movement of the stolen funds to North Korea-linked actors.\n\n\"The FBI is trying to brand the DPRK as a 'cyber criminal state', claiming that it obtained information that a hacking organization 'supported' by the DPRK was involved in the incident,\" Kim said, according to KCNA.\n\nShe accused Washington of misleading international public opinion by portraying cybercrimes around the world as the work of North Korea.\n\nSeparately, Binance said Tuesday it would begin progressively reopening withdrawals for additional crypto assets across more networks, expanding its phased restoration of services following last week's hack.\n\nThe denial comes as blockchain analytics firms trace billions of dollars in cryptocurrency stolen from Binance through thousands of wallets across multiple blockchains.\n\nElliptic and Chainalysis said hackers linked to North Korea have used increasingly complex techniques to obscure the trail of the funds.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 12:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "A new threat to the New York-based stock exchanges", "full_content": "Texas Stock Exchange tries to join the big leagues", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kanohar Electricals shares surge 17% after Q2 results; revenue more than doubles in H1 FY27 | Check key levels", "full_content": "Kanohar Electricals shares surged over 17% on Tuesday, 3 November, after the company reported a strong set of Q2 FY27 results, with revenue and profitability registering robust year-on-year growth.\n\nThe company\u2019s revenue from operations more than doubled, rising 112.4% year-on-year to \u20b9 208.6 crore in Q2 FY27, compared with \u20b9 98.2 crore in the corresponding quarter last year.\n\nEBITDA jumped 167.2% to \u20b9 73.1 crore from \u20b9 27.4 crore, while the EBITDA margin expanded to 35% from 27.8% a year ago. Profit before tax (PBT) increased 178.7% to \u20b9 72.3 crore, compared with \u20b9 25.9 crore in Q2 FY26. Profit after tax (PAT) surged 179.7% to \u20b9 53.9 crore from \u20b9 19.3 crore, with the PAT margin improving to 25.8% from 19.6%.\n\nFor the first half of FY27, revenue from operations grew 108.8% year-on-year to \u20b9 345.7 crore, compared with \u20b9 165.6 crore in H1 FY26.\n\nEBITDA increased 161.7% to \u20b9 111.8 crore from \u20b9 42.7 crore, while the EBITDA margin improved to 32.3% from 25.8%. PBT rose 162% to \u20b9 109.1 crore, against \u20b9 41.6 crore in the year-ago period. PAT more than doubled, increasing 164.8% to \u20b9 81.2 crore from \u20b9 30.7 crore.\n\nCommenting on the performance, Abhishek Singhal, Whole-time Director of Kanohar Electricals, said the company maintained the growth momentum seen in FY26 and Q1 FY27, supported by higher volumes and a broader product mix.\n\nPower transformer business grew 88% in H1 FY27, while shunt reactors, which are used for renewable energy grid integration, accounted for around 22% of revenue, compared with a negligible contribution in the corresponding period last year.\n\nThe company also recorded a higher contribution from high-voltage products. Equipment in the 220 kV and 400 kV categories accounted for nearly 78% of revenue in H1 FY27, compared with approximately 53% in H1 FY26. According to Singhal, this shift helped improve the company's margin profile.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, silver rate Bangalore 3 Nov: Latest update on price movement for investors in Silicon Valley of India today", "full_content": "Gold and silver prices declined in Bangalore, India's Silicon Valley, on Tuesday, 3 November, amid weakness in the domestic bullion market.\n\nGold prices fell by \u20b9 1,320, or 0.94%, to \u20b9 1,39,200 per 10 grams, while silver rates dropped by \u20b9 5,360, or 2.91%, to \u20b9 1,78,590 per kg, as of 11:20 am, according to Bullion.com.\n\nGold and silver prices also declined in the domestic futures market on Tuesday, tracking weakness in precious metals. On the Multi Commodity Exchange ( MCX ), gold futures fell by 0.92% to \u20b9 1,38,900 per 10 grams. Silver futures declined by 3.03% to \u20b9 1,78,207 per kg.\n\nGold is available in different purities in the retail market. While 24-karat gold is considered the purest form, 22-karat gold is commonly used to make jewellery because of its greater durability. Lower-purity options such as 20-karat and 18-karat gold are also available.\n\nHere is a look at the latest gold and silver prices in Bangalore on 3 November 2026.\n\nDespite the recent correction, gold and silver prices in Bangalore remain significantly different from their levels a month ago.\n\nThe 24-karat gold rate, which stood at \u20b9 1,50,420 per 10 grams a month ago, has declined by 7.46% to \u20b9 1,39,200 per 10 grams. This represents a fall of \u20b9 11,220 per 10 grams over the period.\n\nSilver has witnessed a sharper correction. Its price has fallen by 21.11% over the past month, from \u20b9 2,26,390 per kg to \u20b9 1,78,590 per kg. This translates into a decline of \u20b9 47,800 per kg.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "North Korea denies being behind record $6.3bn Binance hack - BBC", "full_content": "No ing 595.87 points or 0.79%.\n\nNSE share price listed on the stock market with an opening listing price of \u20b9 1,840 per share (delivering a 0.84% premium over its IPO price range of \u20b9 1,700 to \u20b9 1,785).\n\nBrokerage firm Kantilal Chhaganlal Securities has given a \u2018buy\u2019 rating to the NSE stock with a target price of \u20b9 2205, seeing an upside potential up to 25% in the long-term.\n\n\u201cNSE\u2019s capital-light, technology-led model provides strong operating leverage, supporting high margins, cash generation and return ratios as volumes and ancillary businesses scale. While index-options market-share erosion and regulatory changes remain key monitorable, NSE\u2019s entrenched leadership and diversified ecosystem provide resilience against volatility in any single segment also NSE adopted Cost saving method .", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 11:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US tech giants' AI borrowing could push up Europe's bond yields", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US tech giants' AI borrowing could push up Europe's bond yields Geojit Financial Services Share Price SBFC Finance Share Price Religare Enterprises Share Price Fedbank Financial Services Share Price Mas Financial Services Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US tech giants' AI borrowing could push up Europe's bond yields SECTIONS US tech giants' AI borrowing could push up Europe's bond yields By Anupam Nagar , ETMa rofit jumps 51% YoY", "full_content": "KRBL shares jumped nearly 9% after the company reported a 51% rise in second-quarter profit, supported by strong domestic sales and improved operating performance. Revenue increased 14%, while EBITDA climbed sharply, reinforcing positive momentum in the stock.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 11:29 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Only 3.2% of working Indians trade stocks. Why Morgan Stanley likes NSE", "full_content": "Morgan Stanley has initiated coverage of NSE with an overweight rating and a price target of Rs 2,315, citing its dominant market share, strong liquidity and India\u2019s underpenetrated capital markets. The brokerage expects revenue and normalised profit to grow at 15% annually between FY27 and FY29. It sees long-term growth opportunities but flags regulatory changes and market-share losses as key risks.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 11:24 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MCX gold prices fall Rs 1,400/10 gram, silver tanks Rs 4,300/kg ahead of Diwali while rate hike bets linger. What should you do?", "full_content": "Gold and silver prices declined on MCX as rising oil prices and renewed inflation concerns weighed on bullion sentiment. Investors tracked US midterm elections and Fed rate expectations, while experts flagged key trading levels amid continued volatility in precious metals.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 11:17 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Record-breaking FII selling may have peaked, says Nomura. Why the Nifty target could rise", "full_content": "FIIs may be nearing the end of their record selling spree in Indian equities as outflows ease, earnings beat expectations and valuations fall below post-pandemic averages, according to Nomura. Foreign investors sold around $8.8 billion since September 15, although the pace has moderated. Meanwhile, companies in Nomura\u2019s BSE 200+ universe reported 34% year-on-year profit growth, beating consensus estimates by 18%.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 11:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Blockbuster IPO debut of BLS Polymers; 3 times premium as compared to Jio Platforms - All details for investors here", "full_content": "BLS Polymers shares debuted on the NSE at \u20b9248, up 65.33% from the \u20b9150 IPO price, after the issue was subscribed 241.22 times. The company plans to use proceeds from its fresh issue to expand its Goa manufacturing facility and meet working capital needs.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 11:05 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trident shares jump 13% after Q2 results; profit jumps 93%, board clears \u20b94,650 crore expansion plan | What lies ahead", "full_content": "Trident shares jumped 13.42% after the company reported a 93.1% year-on-year rise in September-quarter profit to \u20b9175.5 crore. Revenue slipped 3.8%, but EBITDA rose 46.5%. The board also gave in-principle approval for a \u20b94,650 crore expansion and modernisation programme.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 10:55 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "03 Nov 2026, 01:34 PM IST", "total_stories": 319};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
