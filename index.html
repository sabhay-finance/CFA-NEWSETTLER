cial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What SpaceX Still Needs to Build a Cell Network and Challenge AT&T - Barron's", "full_content": "What SpaceX Still Needs to Build a Cell Network and Challenge AT&T Barron's SPCX Stock Slips Overnight: Analysts See T-Mobile and Verizon Holding The Edge In Starlink\u2019s Wireless Push Yahoo Finance SpaceX says Starlink is set to become a \"major mobile carrier\" after spectrum deal CBS News SpaceX Unlikely To Make Even A Dent In Verizon's Armour (NASDAQ:SPCX) Seeking Alpha T-Mobile\u2019s John Saw questions SpaceX\u2019s wireless ambitions\u2014and makes the case for towers Wireless Estimator", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 12:09 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "I was one of the biggest shareholders in this tech stock in the 1990s. I'm bullish again because of AI", "full_content": "Flex plans to spin off Axiom, its AI infrastructure business, in 2027. Paul Meeks sees upside as data center power demand grows.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:08 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Airport attacks put aviation in crosshairs of geopolitical conflicts", "full_content": "Deadly attacks on Saudi Arabia's second-busiest airport over the past week are highlighting how conflicts in the Middle East are upending air travel on a larger scale.\n\nAviation is increasingly in the middle of these sprawling clashes as threats and outright attacks have forced airlines to quickly cancel flights throughout the Middle East for days, weeks and, in some cases, months. Some carriers might redeploy planes that would be going to some Middle East destinations like Dubai, United Arab Emirates, and Doha, Qatar, to other locations altogether.\n\n\"It's a new paradigm. Civil aviation is being directly targeted and it has not been the case in the last couple of decades,\" said Mark Zee, founder of OpsGroup, an independent aviation safety group whose members include pilots, dispatchers, airline employees and others.\n\nThe Saudi airport attacks , claimed by Yemen's Iran-backed Houthis, were the deadliest in the country in more than a decade. Over the weekend, at least 13 people were killed and more than 300 injured when a projectile hit terminals at King Khalid International Airport in the Saudi capital Riyadh, officials said. Other attacks have included drones.\n\n\"Historically, airport security is focused on preventing unauthorized access to aircraft and the airport, not defending airspace,\" said Jeff Price, a professor at the Metropolitan State University of Denver's Department of Aviation and Aerospace Science and an airport management consultant.\n\nThe threats to aviation are forcing officials to rethink how to protect blind spots in these major public spaces.\n\n\"There is this established way to deal with kind of more conventional weapons such as missiles. It's very expensive, but there is a way,\" said Gulnaz Ukassova, UAE-based security director of information and analysis at risk management firm International SOS. \"There is still no sort of foolproof way to deal with the threat posed by drones.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 12:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Dividend, rights issue record date: Last chance to buy today - Shivam Autotech, Shraddha Prime, Anand Rathi Wealth", "full_content": "Shivam Autotech, Shraddha Prime Projects and Anand Rathi Wealth are likely to attract investors\u2019 interest in Wednesday\u2019s trade on October 14, as shareholders looking to benefit from dividends and participate in rights issues will keep an eye on these counters.\n\nShivam Autotech has announced a rights issue and fixed October 15 as the record date, while Shraddha Prime Projects has also fixed the same date for its rights issue. Anand Rathi Wealth has fixed Thursday, October 15, as the record date to determine shareholder eligibility for its \u20b9 4 interim dividend.\n\nInvestors looking to benefit from this payout must ensure they own the stock before the record date. Under India\u2019s T+1 settlement cycle, shares purchased on or after the record date will not qualify for the dividend.\n\nShivam Autotech Limited has approved a rights issue of up to 10,000,000 fully paid-up equity shares, with a face value of \u20b9 2 each, to raise up to \u20b9 12,000 lakh ( \u20b9 120 crore).\n\nThe shares are priced at \u20b9 12 per equity share, including a premium of \u20b9 10 per share, with the full amount payable upon application. Eligible shareholders as of the record date, Thursday, October 15, 2026, will be offered 19 rights equity shares for every 25 fully paid-up equity shares held.\n\nThe company said in its regulatory filing said, \u201cThe designated date for determining the equity shareholders who would be eligible to apply for the rights equity shares in the issue, subject to the terms and conditions set out in the issue materials, to be decided prior to the filing of this Letter of Offer, is Thursday, October 15, 2026.\u201d\n\nShraddha Prime Projects has also approved a rights issue worth \u20b9 96.96 crore, through which the company will issue 60.60 lakh equity shares at \u20b9 160 apiece, including a premium of \u20b9 150 per share.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 12:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold subdued ahead of US inflation data, Warsh remarks", "full_content": "Oct 13 (Reuters) - Gold prices edged lower on Tuesday, while investors awaited key US inflation data and remarks from the Federal Reserve chair due later this week to gauge the outlook on monetary policy.\n\nSpot gold fell 0.3% to $4,157.90 per ounce by 02:15 p.m. EDT (1815 GMT). US gold futures for December settled down 0.3% at $4,177.30 per ounce.\n\n\"We have some inflation data that's coming out later this week. So market is kind of waiting to see how that plays out,\" said Bob Haberkorn, senior market strategist at StoneX.\n\nHe noted the Fed chairman will deliver his last speech before the upcoming rate meeting on Thursday, and anticipates a quieter session ahead of Wednesday's and Thursday's events.\n\nInvestors are looking ahead to the Consumer Price Index data on Wednesday, while Thursday's Producer Price Index figures and remarks from Fed Chair Kevin Warsh will be closely parsed.\n\nFed Governor Christopher Waller on Tuesday said the recent rise in US bond yields reflects stronger economic growth rather than higher inflation expectations, which remain \"well anchored.\"\n\nGold loses its appeal in a high-interest-rate environment as it does not yield interest.\n\nCurrently, traders see only a 19% chance of a Fed rate hike this month but are pricing in an 88% chance of a December increase, according to CME's FedWatch tool.", "source": "LiveMint Markets", "pub_date_str": "14 Oct 2026, 12:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Philip R. Lane: The AI opportunity for Europe", "full_content": "AI is a general purpose technology that can improve global living standards and the global knowledge frontier by expanding access to information and raising productivity.\n\nThat said, delivering the benefits from AI depends on a host of different actors playing their part in supporting the transformation of the economy. The list is long and includes: the developers of AI frontier models (whether proprietary or open-weight); the builders of the various layers of the AI infrastructure stack; the entrepreneurs designing the customised AI products that can best unlock productivity gains in individual sectors or in relation to specialised tasks; the research and development community that can accelerate scientific discovery and compress the time lag between invention and commercial application; the operators of the energy systems that must respond to this new source of energy demand; the financial system that is required to appropriately value AI-related assets and finance AI production and AI adoption, while also incorporating AI into its own processes; the education and training sectors that must re-design instruction, learning and evaluation methods; and, finally, the managers and workers that must implement revised business processes at the sector and firm levels to maximise the benefits of AI.\n\nThis transformation also poses many challenges for political systems, civic society, policymakers and regulators at national, European and global levels in relation to the ethical, fiscal, governance and legal issues posed by AI. How these political economy issues are resolved will have a major bearing on the AI transition path, including the appropriate speed of adjustment that balances the societal benefits, costs and risks posed by AI.\n\nGiven the scale and breadth of the AI challenge, a wide range of possible timelines and outcomes can be envisaged, depending on the rate of progress along each individual dimension.", "source": "ECB Press", "pub_date_str": "14 Oct 2026, 12:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "More Republicans come out against Trump's diesel deal with Putin", "full_content": "More Republicans are speaking out against President Donald Trump 's decision to let Vladimir Putin 's Russia temporarily export diesel fuel on the global market, expanding the bipartisan blowback over the deal.\n\nSix GOP senators joined six of their Democratic colleagues in a letter Tuesday urging Trump to cancel the arrangement allowing Russia to supply 4.8 million metric tons, or nearly 36 million barrels, of diesel through mid-April.\n\n\"This deal is a gift to our adversary and a betrayal of our Allies; it should be rescinded,\" the lawmakers wrote.\n\nRepublican Sens. Thom Tillis of North Carolina, Susan Collins of Maine, Oklahoma's Alan Armstrong, Lisa Murkowski of Alaska, Kentucky's Mitch McConnell and John Cornyn of Texas signed on, adding to the list of of GOP Congress members who had earlier questioned the deal Trump announced Friday. Armstrong has roots in the energy industry, having been CEO of Williams Companies , the largest natural gas-focused company in the U.S.\n\nThey joined Democratic Sens. Richard Blumenthal of Connecticut, New Hampshire's Jeanne Shaheen , Richard Durbin of Illinois, Delaware's Chris Coons and Rhode Island's Sheldon Whitehouse and Jack Reed .\n\nThe White House did not immediately respond to CNBC's request for comment on the letter.\n\nCollins, Murkowski and Tillis had already spoken out, joining a statement with Democrats on Sunday that urged Trump not to \"provide Putin with a financial lifeline while Russia continues to kill Ukrainian civilians.\"\n\nRepublican Sen. John Curtis of Utah had also joined that statement.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This ugly shoe brand won over Gen Z. Its stock's low valuation could earn investors' attention", "full_content": "Crocs sales have been growing as it embraces its iconic look even as it expands to new styles, winning fans among Gen Z consumers, even in China.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 11:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "LIC to launch three insurance plans on 19 October: Benefits, features and eligibility explained", "full_content": "The payout is based on the applicable sum assured rather than the actual cost of treatment. The plan also includes a monthly income benefit following a major-stage cancer diagnosis and a premium-waiver benefit, subject to policy conditions.\n\nLIC said the three plans will be available for purchase from 19 October 2026, both online through its website and offline through licensed insurance agents, corporate agents, brokers and insurance marketing firms.\n\nProspective policyholders should refer to LIC\u2019s official sales brochures for the detailed eligibility criteria, premium structure, benefits, exclusions and policy conditions before purchasing any of the plans.\n\nLife Insurance Corporation of India (LIC) will make three new insurance plans available for sale in the domestic market from 19 October 2026. The products cover deferred annuity, health insurance and cancer protection, according to the insurer\u2019s official announcement and regulatory disclosure.\n\nThe three products are LIC\u2019s New Jeevan Dhara-II (Plan 892), LIC\u2019s Health Shield (Plan 907) and LIC\u2019s New Cancer Cover (Plan 908). All three are non-participating and non-linked plans, LIC said.\n\nThe products serve different purposes. New Jeevan Dhara-II is a savings-oriented deferred annuity plan, while Health Shield and New Cancer Cover are individual health plans classified as pure-risk products.\n\nThe three plans cater to different financial needs, from securing a regular income after retirement to managing hospitalisation expenses and protecting against the financial impact of a cancer diagnosis.\n\nNew Jeevan Dhara-II is a non-participating, non-linked individual savings plan that provides annuity payments for life after the deferment period. LIC says annuity rates are guaranteed at policy inception.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 11:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "The latest inflation data is expected to show price increases are accelerating", "full_content": "Wednesday's closely watched reading on consumer prices could show intensifying inflationary pressures as energy costs keep climbing.\n\nEconomists polled by Dow Jones expect the headline consumer price index for September to rise 0.6% for the month and to increase 3.6% compared with a year ago. That 12-month number would signal that the rate of price growth is accelerating and moving further from the Federal Reserve 's goal of 2%.\n\nSo-called core inflation, which strips out volatile food and energy prices, is expected to increase 0.2% from August and 2.5% on a 12-month basis. While that would mark a slight slowdown from the prior month, it would be an uptick in year-over-year inflation.\n\nOil-related prices could drive the headline figure even higher, said Joe Brusuelas, chief economist at RSM, a tax firm.\n\nEnergy costs have been among the biggest drivers of inflation since the U.S. war with Iran began earlier this year. President Donald Trump last week announced loosened diesel restrictions on Russia in a bid to juice the global oil trade, though analysts don't believe it will meaningfully bring down prices.\n\nPrices for Brent crude, the global oil benchmark, climbed more than 14% in September, bringing its third-quarter advance to about 42%. Brent prices on Tuesday traded around $105 per barrel.\n\n\"We've got real upside risk on the September CPI,\" Brusuelas said. \"Typically, when we have these moves in inflation, everyone's models undershoot the actual outcome.\"\n\nSticky oil prices could also push up costs for items in other, non-energy categories, according to Robert Sockin, chief U.S. economist at asset manager PGIM. In this scenario, it would become harder for the Fed to write off the energy prices surge as a short-term shock that won't necessitate interest rate increases.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 11:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ram Kapoor Shares New Selfie After Dramatic Weight Loss; Fans Say He Has Lost Too Much Weight", "full_content": "Ram Kapoor recently shared a new selfie on Instagram, prompting fans to praise his changed appearance while some expressed concern over his dramatic weight loss.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brutal session for chip stocks shows AI trade is turning - Reuters", "full_content": "Brutal session for chip stocks shows AI trade is turning Reuters The AI trade is cracking. Here's how to profit CNBC World stocks slip as AI spending worries hit chipmakers Reuters Entegris, Intel, KLA Corporation, Lam Research, and Microchip Technology Shares Are Falling, What You Need To Know Yahoo Finance Tech Stocks: Cracks Are Starting to Appear in the AI Trade Bloomberg.com", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 11:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Minutes of the Board's discount rate meetings on August 17, September 9, and September 16, 2026", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 2:00 p.m. EDT Share --> --> --> --> --> --> The Federal Reserve Board on Tuesday released the minutes from its recent meetings to review and determine the discount rates provided to depository institutions through the discount window. Today's minutes cover the Board meetings that occurred on August 17, September 9, and September 16, 2026.\n\nThe Board's process for setting the discount rate is distinct from the process the Federal Open Market Committee follows in setting the target range for the federal funds rate.\n\nFor media inquiries, please email [email protected] or call 202-452-2955.", "source": "Federal Reserve", "pub_date_str": "13 Oct 2026, 11:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Q2 Results Highlights: Hero Motors Profit Doubles, Tata Elxsi Revenue Up 3%", "full_content": "Q2 Results Highlights: Tata Elxsi, ICICI Prudential Life Insurance, Anand Rathi Share and Stock Brokers and 19 other companies will announce their Q2 FY27 earnings today, October 13. Track every earnings update live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Can RBI Hike Rates To Save The Rupee? Governor Malhotra Explains The Trade-Off", "full_content": "RBI Governor Sanjay Malhotra says price stability hinges on a stable financial system as the central bank tightens forex rules to curb speculative bets, ensure orderly currency movement and ease pressure on the rupee.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Capital goods stocks fall after multibagger rally. Is this a buying opportunity for long-term investors?", "full_content": "2026 has been a strong year for high-voltage transmission and distribution (T&D) equipment stocks, with Hitachi Energy India , GE Vernova T&D India , Siemens Energy India , and CG Power and Industrial Solutions rising 66%, 34%, 23%, and 35%, respectively, year-to-date (YTD). In comparison, the BSE Capital Goods Index has gained 10% over the same period.\n\nThe rally has come at a time when broader markets have been impacted by escalating geopolitical tensions. However, the sector has attracted investor interest amid a widening global supply-demand gap for high-voltage power equipment, including transformers, switchgear, and circuit breakers, as well as strong multi-year order pipelines for companies in both domestic and international markets.\n\nHowever, the rally in these stocks has recently paused as investors appear to be booking profits amid concerns over elevated valuations.\n\nNevertheless, domestic brokerage firm 360 ONE Capital Markets said the recent price correction in these stocks has eased concerns over rich valuations, as much of the potential upside had already been priced in, leaving little room for error.\n\nIn its latest report, the brokerage has initiated coverage on three companies exposed to the high-voltage power equipment theme: Hitachi Energy India, GE Vernova T&D India, and CG Power and Industrial Solutions.\n\nThe brokerage sees a structural, multi-year growth opportunity in T&D, driven by high-voltage direct current (HVDC) technology, transformers, and grid expansion.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 11:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Was Rohit In Line To Replace Hardik As Mumbai Indians Skipper? IPL Team Makes Stance Clear", "full_content": "Even if Hardik leaves the franchise, MI have several captaincy options to consider, with Suryakumar Yadav and Tilak Varma among the front-runners.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 11:06 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Bond Traders Eclipsed by Equities in a Wall Street Reversal - Bloomberg.com", "full_content": "Bond Traders Eclipsed by Equities in a Wall Street Reversal Bloomberg.com Fixed income fortunes vary across four of the biggest U.S. banks in Q3 (JPM:NYSE) Seeking Alpha How Trading Performed for Wall Street WSJ Are Wall Street\u2019s fixed-income trading desks losing steam? Business Post How Trading Performed for Wall Street -- WSJ Moomoo", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 11:04 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "My wife says we can\u2019t aff     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
