ching a drone delivery service in partnership with DoorDash and Alphabet 's Wing.\n\nStock futures are falling this morning after a down day on Wall Street.\n\nHere are five key things investors need to know to start the trading day:\n\nFears that the Federal Reserve will deliver another interest rate hike this year pushed Treasury yields to multiyear highs yesterday, in turn causing the three major averages to close the session lower. The S&P 500 saw its worst day in more than a month, and the Nasdaq Composite dropped more than 1%.\n\nChinese President Xi Jinping arrived at Maryland's Joint Base Andrews last night, where he was greeted on the tarmac by President Donald Trump ahead of today's high-stakes summit . As CNBC's Kevin Breuninger writes, the two leaders are expected to discuss trade, artificial intelligence and the Iran war before a state dinner this evening.\n\nTreasury Secretary Scott Bessent told Fox News yesterday that the U.S. and China agreed to extend their trade truce to Jan. 10. Chinese state media did not immediately note Bessent's comments, but a spokesperson for China's Commerce Ministry told reporters this morning that the two sides had discussed plans for lowering tariffs.\n\nTrump and Xi's meeting comes as AI concerns take hold globally, though neither party appears interested in slowing down the pace of innovation. Trump wrote in a Truth Social post this morning that \"Super Intelligence (SI) will be a big topic of discussion, but I want to leave it exactly where it is. That is China's position also.\"", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:30 PM IST", "pub_date_relative": "14m ago"}, {"title": "Three reasons to stick with stocks despite rising yields, according to Barclays", "full_content": "Strategists at the bank recommend exposure to U.S. technology, media, telecommunications and industrial stocks.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 06:28 PM IST", "pub_date_relative": "16m ag  key rate once more in October, according to the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nIn a note Thursday, strategists at UBS Global Wealth Management said their base case was for energy disruption to remain relatively limited and an inflation shock insufficiently broad or persistent to derail economic growth.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:25 PM IST", "pub_date_relative": "19m ago"}], "cfa": [{"title": "Oracle shares drop on report it sent 'force majeure' notice about data center project", "full_content": "Oracle shares fell 4% on Thursday following a report that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\nBloomberg reported the news, citing sources familiar with the matter.\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it doesn't come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital, which also saw its shares fall.\n\nOracle's New Mexico project, which is part of the broader Stargate artificial intelligence infrastructure buildout with President Donald Trump, has been riddled with setbacks and regulatory hurdles. That includes local opposition to data centers ahead of the upcoming midterm elections.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:42 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "31 of 46 flexi-cap mutual funds delivered positive 1-year returns despite market fall: Check the schemes in red", "full_content": "Flexi-cap mutual funds give fund managers the flexibility to invest across large-, mid-, and small-cap stocks, with at least 65% of the portfolio required to be invested in equities. According to the latest Association of Mutual Funds in India (AMFI) data, there are 46 flexi-cap schemes as of August 2026.\n\nTo assess a flexi-cap fund\u2019s performance, its returns can be compared with those of its benchmark. The Nifty 500 is a key broad-market benchmark used to evaluate the performance of this category.\n\nOver the last 1 year, the Nifty 500 fell by 1.67%. Despite the broader market benchmark falling during this period, 31 of the 46 flexi-cap schemes delivered positive returns, while 15 schemes recorded negative returns.\n\nHere\u2019s what the one-year performance data shows and how these schemes compare with the benchmark.\n\nThe following 15 flexi-cap schemes posted negative one-year returns:\n\n*Source: Value Research, Direct plans, Returns as on 23 September 2026\n\nSamco Flexi Cap Fund recorded the steepest decline at 7.14%, followed by Tata Flexi Cap Fund at 4.75% and NJ Flexi Cap Fund at 4.53%. These declines were higher than the 1.67% fall in the Nifty 500 over the same period.\n\nHowever, a negative return did not necessarily mean the scheme underperformed the benchmark. Bandhan Flexi Cap, DSP Flexi Cap, Canara Robeco Flexi Cap, Kotak Flexi Cap, SBI Flexicap and Nippon India Flexi Cap all declined less than the Nifty 500.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 06:39 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: Pasqal posts H1 2026 revenue growth as losses widen", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 06:39 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China confirms first AI talks with U.S. have taken place, hints at trade truce extension", "full_content": "BEIJING\u2014China's Commerce Ministry confirmed Thursday that its senior trade negotiators had held their first talks with the U.S. on artificial intelligence.\n\nSpokesperson He Yadong told reporters the two sides also discussed plans for reducing tariffs, and extending trade arrangements agreed in Kuala Lumpur last October.\n\nHe was referring to China's Vice Premier He Lifeng meeting with his counterpart, Treasury Secretary Scott Bessent, in New York in the runup to the summit this week between U.S. President Donald Trump and Chinese President Xi Jinping.\n\nAs Xi landed in the U.S., Bessent told Fox News on Wednesday the two countries agreed to extend a trade truce to January. The truce, reached in October 2025, kept tariffs lower and limited China's export controls on rare earths, which are critical components of semiconductors and many household goods, as well as defense products.\n\nEarlier in the week, Bessent said the two sides discussed establishing an AI dialogue and a mechanism to alert each other about AI risks.\n\nThe Chinese confirmation of the AI talks came just hours before Xi and Trump were scheduled to begin talks in Washington, D.C., as part of a state visit.\n\nTrump said in a Truth Social post early Thursday that the leaders would discuss AI.\n\n\"A big day with President Xi of China. Super Intelligence (SI) will be a big topic of discussion, but I want to leave it exactly where it is. That is China's position also. Our guardrail is the DOJ!\" he wrote.", "source": "CNBC Finance", "pub_date_str": "24 Sep 2026, 06:30 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Xi arrives in D.C., Treasury yields hit multiyear highs, McDonald's growth plan and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Thursday. Planning a home project? You may soon be able to get the tools by drone. Lowe's told CNBC that it is launching a drone delivery service in partnership with DoorDash and Alphabet 's Wing.\n\nStock futures are falling this morning after a down day on Wall Street.\n\nHere are five key things investors need to know to start the trading day:\n\nFears that the Federal Reserve will deliver another interest rate hike this year pushed Treasury yields to multiyear highs yesterday, in turn causing the three major averages to close the session lower. The S&P 500 saw its worst day in more than a month, and the Nasdaq Composite dropped more than 1%.\n\nChinese President Xi Jinping arrived at Maryland's Joint Base Andrews last night, where he was greeted on the tarmac by President Donald Trump ahead of today's high-stakes summit . As CNBC's Kevin Breuninger writes, the two leaders are expected to discuss trade, artificial intelligence and the Iran war before a state dinner this evening.\n\nTreasury Secretary Scott Bessent told Fox News yesterday that the U.S. and China agreed to extend their trade truce to Jan. 10. Chinese state media did not immediately note Bessent's comments, but a spokesperson for China's Commerce Ministry told reporters this morning that the two sides had discussed plans for lowering tariffs.\n\nTrump and Xi's meeting comes as AI concerns take hold globally, though neither party appears interested in slowing down the pace of innovation. Trump wrote in a Truth Social post this morning that \"Super Intelligence (SI) will be a big topic of discussion, but I want to leave it exactly where it is. That is China's position also.\"", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:30 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Bond Selloff Continues, Stock Futures Drop - WSJ", "full_content": "Global Bond Selloff Continues, Stock Futures Drop WSJ 30-year Treasury yield hits highest level since 2004 \u2014what it means for stocks: Chart of the Day Yahoo Finance Xi arrives in D.C., Treasury yields hit multiyear highs, McDonald's growth plan and more in Morning Squawk CNBC US 30-Year Yield Hits Highest Since 2004 as Bond Selloff Deepens Bloomberg Global bond sell-off deepens, sending borrowing costs higher around the world CNN", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 06:26 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Stock futures slide again as Treasury yields push higher, Oracle leads Nasdaq names lower: Live updates", "full_content": "Stock futures fell on Thursday as Treasury yields kept marching higher, with traders anticipating further rate hikes from the Federal Reserve. A pullback in Oracle weighed on tech.\n\nNasdaq-100 futures sank 1%. Dow Jones Industrial futures fell 159 points, or 0.3%. S&P 500 futures were down 0.6%.\n\nOracle shares sank more than 5% after Bloomberg News reported , citing sources, that the company was citing force majeure in order to shield itself from a data center being build in New Mexico.\n\nThe 30-year Treasury bond yield touched 5.446%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.15%, near levels not reached since July 2007. The 2-year note yield was flat on the day, but scaled to a 2023 high earlier in the week.\n\nThose moves came as oil prices rose sharply. International Brent crude futures rose 1% to around $105 a barrel, while West Texas Intermediate crude gained 1% to around $93.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a greater than 70% likelihood that the policy-setting Federal Open Market Committee lifts its key rate once more in October, according to the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nIn a note Thursday, strategists at UBS Global Wealth Management said their base case was for energy disruption to remain relatively limited and an inflation shock insufficiently broad or persistent to derail economic growth.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:25 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "With the stock market \u2018priced for perfection,\u2019 the S&P 500 is in danger of a 20% slump next year", "full_content": "Clocktower\u2019s Eric Wallerstein believes stocks are headed for trouble next year, and safety-seeking investors could drive gold to $6,000 an ounce.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 06:18 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Starbucks to shutter about 250 stores in latest round of cafe closures", "full_content": "Starbucks on Thursday announced it will close about 1% of its North American cafes as part of its turnaround.\n\nUnder CEO Brian Niccol, Starbucks has staged a revamp of its U.S. business that has focused on improving the customer experience, including in-person interactions at its cafes. The announcement marks the second round of closures in North America during Niccol's two-year tenure.\n\nStarbucks expects to shutter about 250 underperforming cafes out of its more than 18,000 locations in North America. It was not immediately clear where the closing locations are.\n\n\"We have carefully reviewed our North America coffeehouse portfolio and identified locations where we do not believe we can consistently deliver the experience we want for customers and partners or where we don't see a path to acceptable financial performance,\" Mike Grams, Starbucks chief operating officer, wrote in a letter addressed to employees.\n\nFor fiscal 2026, Starbucks is now projecting net new openings of 440 cafes, down from its prior outlook of 600 to 650 locations. Those new cafes will come from its international markets.\n\n\"The Company continues to see significant longer-term growth opportunity ahead in North America and is actively developing a strong pipeline of new coffeehouses,\" Starbucks said in a regulatory filing .\n\nMost of the closures will occur before the end of fiscal 2026, according to the filing. Starbucks' fiscal year ends later this month.\n\nThe company expects to incur about $300 million in restructuring charges related to the closures. About $200 million of that charge will be related to the costs of exiting leases early and paying employees separation benefits. The remaining $100 million will be noncash charges from the disposal and impairment of its company-owned restaurant assets.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:10 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Market wrap: Cipla, ONGC, HDFC Life, Bajaj Finance top gainers and losers on Nifty and Sensex on Thursday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Cipla, ONGC, HDFC Life, Bajaj Finance top gainers and losers on Nifty and Sensex on Thursday National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Cipla, ONGC, HDFC Life, Bajaj Finance top gainers and losers on Nifty and Sensex on Thursday SECTIONS Market wrap: Cipla, ONGC, HDFC Life, Bajaj Finance top gainers and losers on Nifty and Sensex on Thursday By Kumar Gaurav , ETMarkets.com Last Updated: Sep 24, 2026, 06:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities ended sharply lower, with the Nifty falling 1.64% and Sensex 1.67%, as rising bond yields and crude prices pressured sentiment. Broader indices declined, India VIX surged 22%, financial stocks led losses, and market breadth remained firmly negative.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 06:07 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock market prediction for tomorrow: Sensex, Nifty outlook for Friday | Kospi, Taiwan cues to watch | 25 Sept 2026", "full_content": "The Indian stock market suffered heavy losses in Thursday\u2019s trade, September 24, with the headline indices closing more than 1.5% lower, erasing their recent gains and falling below key psychological levels. Investor sentiment was hit by surging global bond yields and volatility in crude oil prices.\n\nWith Thursday\u2019s decline, both the Nifty 50 and Sensex logged their worst single-session losses in 10 weeks, while their year-to-date losses widened to nearly 12%, putting them on track for their first annual decline in more than a decade.\n\nApart from weak global cues, the Insurance Regulatory and Development Authority of India (IRDAI) proposed sweeping changes to insurance commission rules, triggering a wave of selling across financial and NBFC stocks.\n\nThe Nifty 50 plunged 1.64% to settle at 25,169.50 , while the Sensex finished at 73,580, down 1.67% from the previous session. The pain was more pronounced in the broader market, with the Nifty Midcap 100 falling 2.57% and the Nifty Smallcap 100 tumbling 2.25%.\n\nAll major sectoral indices closed sharply lower, with banks and insurers bearing the brunt of the selling after the country\u2019s insurance regulator proposed an overhaul of commission rules to cap payouts, link them to product complexity and allow life insurers to spread commissions beyond the first year of a policy.\n\nBanking and financial stocks fell 2% and 2.4%, respectively. Among individual stocks, PB Fintech was the worst hit, plunging 36%, while Turtlemint Fintech sank 20%.\n\nThe sell-off in Indian equities came amid continued pressure from global bond markets. The US 10-year Treasury yield steadied at 5.12% in Thursday\u2019s session after surging 15 basis points on Wednesday, marking its biggest one-day increase since the turmoil triggered by President Donald Trump\u2019s April 2025 tariff announcement.\n\nThe rise in bond yields coincided with a sharp rebound in oil prices, adding another layer of pressure on global markets.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:06 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Judge lifts Trump ban on CNN, MS NOW, Politico from White House", "full_content": "A federal judge on Thursday ordered White House access to journalists from CNN, MS NOW and Politico to be temporarily restored, saying U.S. President Donald Trump 's media ban was likely unconstitutional.\n\nThe ruling represents a victory for the three media outlets, who had argued the ban violated their First Amendment rights, and comes as Trump hosts Chinese President Xi Jinping for a high-stakes meeting .\n\nBut a Politico reporter on Thursday morning \"was denied access to the White House .... and his press credentials confiscated\" by the Secret Service, that news outlet reported .\n\nIn his ruling, District Judge Tim Kelly said the three outlets should have their access immediately restored from the ban that the president had announced on Sept. 18 , rejecting a request by the Justice Department to delay it for at least two days. The judge was nominated by Trump to the federal bench in 2017.\n\nKelly said the Trump administration must return, reinstate and restore the White House \"hard pass\" press credentials held by employees of the three outlets that had been revoked. The temporary restraining order remains in effect for 14 days, with Kelly noting that such orders are \"generally unappealable.\"\n\n\"Simply put\u2014the record lacks factual support for Defendants' contention that the revocation of Plaintiffs' hard passes will in fact protect national security or that national security will be endangered if the Court orders their passes reinstated while this litigation proceeds,\" Kelly said.\n\nIn a Truth Social post last week, Trump said he was banning the outlets from the White House effective immediately, warning that other \"Fake News Media Outlets\" could follow. The president cited what he called \"cumulative stories\" by the three news organizations, adding, \"You get sick of it.\"\n\nIn his ruling, Kelly said the court declined \"to stay\" the temporary restraining order's entry or effective date, as the defendants had requested.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:05 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Rupee falls 22 paise as crude, dollar demand rise", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee falls 22 paise as crude, dollar demand rise The Economic Times daily newspaper is available online now. Read Today's Paper Rupee falls 22 paise as crude, dollar demand rise SECTIONS Rupee falls 22 paise as crude, dollar demand rise By Atmadip Ray , ET Bureau Last Updated: Sep 24, 2026, 06:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The rupee weakened 22 paise to 95.96 per dollar as strong importer demand, rising crude prices and global bond yields pressured the currency. Traders said RBI intervened through state-owned banks, while US-Iran tensions rais o simmer between the U.S. and Iran after Iranian President Masoud Pezeshkian blamed the U.S. and Israel for stoking global instability.\n\n\"The United States president described us as terrorists. We have been the victims of terrorism,\" Pezeshkian said, according to a live translation of his speech at the United Nations General Assembly. Pezeshkian also asserted that his country will continue to fight back \"until our last breath.\"\n\nTraders are also assessing a report that Asia is on track to import its highest volume of crude oil since the start of the war.\n\nAsia's imports of crude oil rose in September to the highest level since the start of the Iran war, Reuters reported. The region is on track to import 23.96 million barrels per day \u200bin September, up from 23.38 million bpd in August and the most since February, Reuters said, citing data compiled by commodity analysts Kpler.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 05:59 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Aldi is cutting prices on a third of its products. Here's when - USA Today", "full_content": "Aldi is cutting prices on a third of its products. Here's when USA Today Aldi cuts U.S. grocery prices for fall season amid inflation, competition pressure Reuters ALDI announces price cuts to products, hoping to bring relief to customers amid high prices WSVN ALDI Invests in Even Lower Prices this Fall, Offering U.S. Shoppers $86 Million in Savings PR Newswire Aldi slashing prices on many products. How to get the deals in Arizona azcentral.com and The Arizona Republic", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 05:58 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dow Jones| Nasdaq | US Stock Market Today | Live: US futures retreat as oil gains on Mideast uncertainty; eyes on Trump-Xi talks", "full_content": "", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 05:55 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global bond sell-off spreads as oil climbs back to $105", "full_content": "Rising yields strain public finances after brutal sell-off in US Treasuries market", "source": "FT Markets", "pub_date_str": "24 Sep 2026, 05:48 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "30-year Treasury yield hits highest level since 2004 as bond market rout continues", "full_content": "U.S. Treasury yields continued their upward momentum after hitting a 19-year high on Wednesday.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 05:47 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "New FTAs provide comfort to invest in global supply chains in India: Commerce Secretary Rajesh Agarwal", "full_content": "India's latest free trade agreements are designed to foster long-term investments within global supply chains, also ensuring tariff stability, Commerce Secretary Rajesh Agarwal said. By tapping into a massive $60 trillion market, these agreements bolster investor confidence, he noted.", "source": "Economic Times Economy", "pub_date_str": "24 Sep 2026, 05:47 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Starbucks to close 250 stores: 'Difficult decision' - Fox Business", "full_content": "Starbucks to close 250 stores: 'Difficult decision' Fox Business Starbucks to shutter about 250 stores in latest round of cafe closures CNBC Starbucks closing 250 stores, cutting 900 jobs in restructuring qz.com Starbucks to close 250 stores in North America this week wral.com Starbucks to Close 250 Underperforming Stores WSJ", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 05:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "24 Sep 2026, 06:44 PM IST", "total_stories": 397};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
