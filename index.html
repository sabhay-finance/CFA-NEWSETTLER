<script>

    const allData = {"general": [{"title": "OpenAI launches ChatGPT Wallet, allowing its 'dots' AI agents to make purchases for users", "full_content": "OpenAI on Friday announced ChatGPT Wallet, a new payment feature that enables its \"dots\" artificial intelligence agents to make purchases on behalf of users.\n\nThe company built ChatGPT Wallet in partnership with American Express , Mastercard and Visa , and it allows cardholders to maintain their existing credit card rewards and protections. Eligible users enter their card information once, prompt their dot to find items to buy and approve each purchase with a security check.\n\nOpenAI said its dots agents will never actually access a user's card details. Instead, their payment networks will provide the dot with a \"payment token,\" which contains a scoped card number, security code and expiration date that is specific to a given transaction.\n\n\"Our goal here is to really focus on merchants and our network partners and start building out a really great foundation that's safe and easy to use,\" Chaya Nayak, who leads product for monetization and payments at OpenAI, told CNBC in an interview.\n\nChatGPT Wallet comes as a growing number of consumers are exploring how to use personal AI agents to manage their calendars, book travel and complete other day-to-day tasks. OpenAI introduced the dots agents during its annual developer conference in late September, shortly after Meta's Muse offering topped the App Store charts .\n\nPurchases made through ChatGPT Wallet could eventually kickstart a new revenue stream for OpenAI, but the company said it is not taking a cut of transactions to start. With the initial launch, OpenAI is working to build relationships with merchants and position itself as a serious platform for shoppers, especially as vendors are beginning to experiment with personal agents.\n\nOpenAI has pushed deeper into AI-enabled commerce over the last year, but some of its early attempts failed to take off. The company introduced an \" Instant Checkout \" feature last fall, which it quickly pivoted away from.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 09:01 PM IST", "pub_date_relative": "2m ago"}, {"title": "Bessent blames Commerce Dept over lack of export controls for Nvidia partner Megaspeed", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 09:00 PM IST", "pub_date_relative": "3m ago"}, {"title": "Northland Power Nov 2026 slides: 4 for 4 delivery, 2030 targets on track", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 09:00 PM IST", "pub_date_relative": "3m ago"}, {"title": "\u2018He calls my plans a fantasy\u2019: My husband says we can\u2019t afford a $200,000-a-year retirement. Is he being cheap?", "full_content": "\u201cWe have $2 million saved in our retirement accounts and a house worth $1.3 million.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 09:00 PM IST", "pub_date_relative": "4m ago"}, {"title": "SKHY support and resistance levels to watch", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:59 PM IST", "pub_date_relative": "4m ago"}, {"title": "IRB(Re) 3Q26 slides: tax reform drives loss, solvency hits 333%", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:59 PM IST", "pub_date_relative": "4m ago"}, {"title": "Earnings call transcript: Exchange Income tops EPS estimates in Q3 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:59 PM IST", "pub_date_relative": "4m ago"}, {"title": "Earnings call transcript: Rede D\u2019Or misses Q3 2026 estimates but stock rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:58 PM IST", "pub_date_relative": "5m ago"}, {"title": "Flowers Foods stock hits 52-week low at 5.39 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:58 PM IST", "pub_date_relative": "5m ago"}, {"title": "Mach Natural Resources stock hits 52-week low at $8.93", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:58 PM IST", "pub_date_relative": "5m ago"}, {"title": "Why is Coherent stock tumbling today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:58 PM IST", "pub_date_relative": "5m ago"}, {"title": "Amazon stands out as the best consumer stock pick", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:58 PM IST", "pub_date_relative": "5m ago"}, {"title": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates", "full_content": "The Nasdaq Composite fell on Friday as Nvidia shares added to their recent losses, though the index still headed for a winning week alongside the other two major averages.\n\nThe tech-heavy Nasdaq dropped 0.9%, while the S&P 500 slid 0.6%. The Dow Jones Industrial Average traded around the flatline.\n\nEquities initially popped before paring gains after October's producer price index reading \u2014 a measure of wholesale inflation \u2014 showed an increase of 0.3% on the month. Economists polled by Dow Jones had seen headline PPI rising 0.4%.\n\nHowever, the report also showed producer prices gaining 6.5% from 12 months earlier \u2014 the biggest annual advance since November 2022.\n\n\"Today's PPI data \u2014 which shows some signs of improving, albeit still too-high \u2014 is unlikely to change the Fed's approach in December because the CPI data was already outside their comfort zone,\" said Chris Zaccarelli, chief investment officer at Northlight Asset Management.\n\n\"We believe the Fed will raise rates 25 bps in December,\" he also said, adding that he considers January a \"live meeting.\"\n\nNvidia shares weighed on the broader market for another day. The stock fell more than 2% Friday, extending the more than 4% drop it saw in the previous session. The pressure came after the exit of the scandal-hit chipmaker's founder and CEO Jensen Huang.\n\nThe Dow, S&P 500 and Nasdaq all pulled back on Thursday after Huang stepped down from his post following reported extramarital affairs , including a relationship with a woman U.S. intelligence officials believe is a Chinese spy. Analysts told CNBC that Huang's exit could trigger a 20% correction in the stock.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:54 PM IST", "pub_date_relative": "9m ago"}, {"title": "Stocks making the biggest moves Friday: Nvidia, Microsoft, Cerebras & more", "full_content": "Microsoft shares were under pressure early Friday after an outage interrupted Outlook and other services. Nvidia, meanwhile, extended its recent slump as the chipmaker tried to rebound from another losing session after the exit of former CEO Jensen Huang.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nNvidia is down almost 14% this week Embattled Nvidia fell as much as 3.5% in early trading Friday, brining the weekly decline to almost 14% in the wake of Thursday's resignation of former CEO Jensen Huang.\n\nNvidia has now fallen for six straight weeks, and hasn't posted a weekly advance since the week ending Oct. 2. Nvidia is down 31% duriing this six-week slump.\n\nShares of the home improvement slid more than 1% after Stifel downgraded Lowe's Companies to sell from hold, ahead of next week's earnings report.\n\n\"We believe HD/LOW shares do not currently offer this required certainty with underappreciated challenges on three fronts: weaker F2H26 backdrop; FY27-FY28 operating margin pressure; structural issues including known DIY weakness, housing category uncertainty, and increased competition requiring investments to sustain long-term growth prospects,\" analyst Andrew Carter wrote on Thursday. \"Our HD/LOW FY28E adjusted EPS are -7%/-8% below consensus respectively.\"\n\nThe analyst trimmed his price target to $190.00 from $195.00, representing a more than 16% fall from Thursday's close of $227.46. The stock is already down more than 5% this year.\n\nShares for Broadcom fell 5% after Rothschild & Co. Redburn downgraded the global technology company to neutral from buy on Friday.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:54 PM IST", "pub_date_relative": "9m ago"}, {"title": "\u2018She has a history of financial mismanagement\u2019: My brother cut our sister out of his will. I\u2019ll get everything. Do I tell her?", "full_content": "\u201cI\u2019m torn between respecting my brother\u2019s wishes and being fair to my sister.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 08:45 PM IST", "pub_date_relative": "19m ago"}, {"title": "Am I overpaying for health insurance? How to answer the key question this open-enrollment season.", "full_content": "More people want to understand the fine print on plans this year, financial planners say.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 08:41 PM IST", "pub_date_relative": "23m ago"}, {"title": "Microsoft says email queues 'approaching normal levels' as Outlook issues persist", "full_content": "Microsoft users began to regain email access on Friday amid one of the company's biggest-ever server issues that lasted more than 20 hours, causing disruption to millions of its customers.\n\nEngineers scrambled to solve connectivity problems that began shortly before 1 p.m. ET on Thursday.\n\nEmail and calendar service Outlook, along with multiple Microsoft 365 services such as Sharepoint and Copilot, were largely down during the Asian business day on Friday, throughout the European morning and into the early U.S. hours. Numerous external services that connect with Microsoft products were also hit.\n\nIn an update at around 9 a.m. ET, Microsoft continued to warn that users may be unable to connect to multiple Microsoft 365 products, including Outlook on either web or desktop and many services that interact with email.\n\nHowever, it said it was \"continuing to see improvements in service availability, with email queues significantly reduced and approaching normal levels.\" It had previously given updates by region, with Asia Pacific services among the first to start normalizing.\n\nIntermittent issues are expected as recovery efforts continue.\n\nEngineering teams have been taking affected systems offline for fixes and bringing them back online in stages. They are prioritizing efforts to preserve emails delayed during the recovery process and reduce email queues and backlogs, extending the timeout window, whereby delayed emails continue to attempt delivery, to 48 hours to help protect messages.\n\nMicrosoft says it has not detected any malicious activity causing the outage, which it initially blamed on a traffic surge in part of its infrastructure and issues with a component responsible for processing server health.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 08:40 PM IST", "pub_date_relative": "23m ago"}, {"title": "Home sales plummet to lowest level since \u2018Great Recession\u2019 as prices hit all-time high", "full_content": "Home sales fell in October to a 16-year low as buyers bolted from the housing market in the face of 7% mortgage rates.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 08:38 PM IST", "pub_date_relative": "26m ago"}, {"title": "Xiaomi 18 Pro, Redmi Note 17 Aura India Launch Timeline Leaked: Check Expected Price", "full_content": "The Xiaomi 18 Pro features a Snapdragon 8 Elite Gen 6 chipset, a 7,000mAh battery and two 200-megapixel rear camera sensors in its Chinese variant.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 08:36 PM IST", "pub_date_relative": "27m ago"}, {"title": "Jensen Huang\u2019s Bad Week Leading To His Resignation, Explained - Forbes", "full_content": "Jensen Huang\u2019s Bad Week Leading To His Resignation, Explained Forbes EXCLUSIVE: Former Nvidia CEO Huang had a relationship with a second employee, sources say Reuters The Nvidia scandal has hidden upside potential for the AI trade Yahoo Finance What's ahead for AI financing after Nvidia CEO Jensen Huang departs CNBC Trump Had Urged Nvidia\u2019s Jensen Huang to Fight for His Job The New York Times", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 08:36 PM IST", "pub_date_relative": "28m ago"}, {"title": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates - CNBC", "full_content": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates CNBC See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 08:36 PM IST", "pub_date_relative": "28m ago"}, {"title": "US Stock Market Today: Dow Jumps 200 Points As Wall St Cheers Soft Producer Prices, Nvidia Rebounds", "full_content": "The Dow Jones Industrial Average was up 4%. The S&P 500 gained 0.3%, and the Nasdaq Composite increased 0.1%.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 08:34 PM IST", "pub_date_relative": "29m ago"}, {"title": "What Nvidia dip buyers need to worry about", "full_content": "An opportunity to buy Nvidia at these levels would have been a dream for many investors not long ago. Now, they may want to proceed with more caution.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:34 PM IST", "pub_date_relative": "29m ago"}, {"title": "NHL\u2019s next TV deal will test the league\u2019s strength while media companies prepare for NFL rights increase", "full_content": "One of the biggest developing stories in entertainment and sports is how the world's biggest media companies judge the value of non-NFL rights. The NHL will be the first public test into this new era of media valuation.\n\nThe NHL can begin formally negotiating a new media rights deal with its incumbent partners \u2014 Disney/ESPN and Skydance, the new owner of TNT Sports \u2014 on Jan. 1. The league wants an increase in overall rights fees between 50% and 100% over its current deal, according to sources familiar with the matter. The NHL inked a 7-year, $4.5 billion deal with ESPN and TNT Sports in 2021.\n\nWhether the league actually gets that type of increase is still unclear \u2014 and that will be one of the most watched data points in the world of sports business next year.\n\nNational media rights for the NHL currently make up about 13% of its annual revenue, which is around $8 billion, according to CNBC estimates.\n\nDisney/ESPN and Skydance want to renew a deal with the league, according to people familiar with the matter that asked not to be named because the discussions are private. Both companies have engaged in preliminary conversations with the league in the past few weeks, and while there's still work to do in terms of price, there's mutual interest in getting something done.\n\nIn its current deal, ESPN has access to 100 exclusive games for the 2026-27 season. Fifty-three of them air on ESPN or ABC, and the other 47 exclusive stream on ESPN. Under current terms, the league's playoffs are split between Disney and TNT Sports.\n\nDisney is particularly interested in acquiring the rights to more playoff games, one of the people said. The NHL had its most-watched playoffs on record last season, averaging 1.8 million viewers per game. The Stanley Cup averaged 5.2 million viewers \u2014 the largest audience since 2019.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:34 PM IST", "pub_date_relative": "29m ago"}, {"title": "Apple, Alphabet and Uber survived major founder transitions. Nvidia will be a harder test", "full_content": "Jensen Huang is not the first CEO to leave a company he helped build.\n\nBut experts told CNBC that his sudden resignation f rom Nvidia at a critical juncture is unique and leaves his eventual successor with challenges in leading the company that's powering the artificial intelligence boom.\n\nIn 33 years, Huang, who resigned on Thursday amid reports of extramarital affairs, including with a woman U.S. intelligence believes is a spy for China , made the company he co-founded the world's most valuable.\n\nFormer Goldman Sachs CEO Lloyd Blankfein wrote on X that he was \"indispensable\" but \"the graveyards are filled with indispensable men,\" referencing a quote attributed to French leader Charles de Gaulle.\n\nWhile the board looks for a new CEO and CFO Colette Kress does the job temporarily; analysts say Huang's charisma and bullish drive will be hard to replicate.\n\n\"I'm not sure we've seen a situation quite like this, where the founder and CEO of one of the world's largest companies faces such a sudden departure amid scandal,\" Michael Withers, professor of management at the University of Notre Dame's Mendoza College of Business, told CNBC.\n\nWhoever follows will \"face challenges that go well beyond those of a typical CEO replacing a founder,\" he added.\n\nApple 's image was inseparable from Steve Jobs when he resigned in 2011. But unlike Nvidia, the company had had other CEOs \u2014 and an internal successor.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 08:33 PM IST", "pub_date_relative": "30m ago"}, {"title": "The 2027 401(k) limits are here. See how much more you can save next year.", "full_content": "Defined-contribution plans are getting a bump. IRA savers are not.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 08:33 PM IST", "pub_date_relative": "31m ago"}, {"title": "We're making 3 trades to adjust our consumer exposure after an analyst downgrade", "full_content": "We want to take protect gains heading into earnings results next week.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:29 PM IST", "pub_date_relative": "34m ago"}, {"title": "Nvidia stock sinks 2% in fallout from Jensen Huang resignation", "full_content": "Nvidia stock sank 2% on Friday as investors navigated the fallout from CEO Jensen Huang 's resignation .\n\nColette Kress , Nvidia's CFO, will take over as interim CEO, the company announced Thursday.\n\nFollowing the announcement of Huang's departure, shares of Nvidia declined sharply Thursday morning before recovering to close just 4% lower.\n\nHuang was under increasing scrutiny after a series of reports that the CEO was in a relationship with a Chinese woman believed to be a spy for Beijing. Huang disclosed that he had an affair on Sunday in a note to employees. The board also announced an investigation into the matter on Sunday.\n\nNvidia stock chart The New York Times reported on Wednesday that Huang had another extramarital romantic relationship, this one with Kimberly Powell, vice president of health care at Nvidia .\n\nReuters reported on Thursday the existence of yet another affair with an Nvidia employee, which the news agency did not name. Nvidia did not immediately respond to CNBC's request for comment.\n\nBefore Huang resigned, several Wall Street analysts told CNBC that his departure could cost Nvidia as much as 20% of its market value, given how critical he has been to the company's success. Nvidia's stock was already down more than 20% over the last month.\n\nStephane Houri, head of equity research at ODDO BHF, said much of the company's success has been built around Huang, and his influence extended into the broader industry.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 08:26 PM IST", "pub_date_relative": "37m ago"}, {"title": "Mookuthi Amman 2 Box Office Day 8: Nayanthara Film Keeps Its Theatrical Run Going, Check Latest Earnings", "full_content": "Directed by Sundar C, Mookuthi Amman 2 is a Tamil fantasy comedy-thriller starring Nayanthara. The film blends humour, drama and fantasy as it brings a fresh story to the popular franchise.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 08:25 PM IST", "pub_date_relative": "38m ago"}, {"title": "Bessent points to Lutnick\u2019s Commerce as he slams Nvidia chip \u2018leakage\u2019 to China", "full_content": "Treasury Secretary Scott Bessent on Friday said his department and others in the Trump administration have long supported slapping restrictions on Megaspeed, the company at the center of former Nvidia CEO Jensen Huang 's spy-sex scandal .\n\nBut the Commerce Department is in charge, \"and you will have to ask them about their internal processes,\" Bessent told CNBC's \" Squawk Box .\"\n\nThe Cabinet secretary's comments hinting at disunity within the administration followed an Axios report that Bessent, in the White House Situation Room last week, had asked Commerce Secretary Howard Lutnick why he has resisted implementing export controls, especially on Megaspeed.\n\nLutnick has \"repeatedly stood in the way\" of cracking down on companies suspected of diverting Nvidia's advanced AI chips to China, Axios reported.\n\nCommerce Department spokeswoman Kristen Eichamer on Wednesday told CNBC that Bessent and Lutnick had \"no such conversation\" in the Situation Room.\n\nAsked on CNBC about the reported incident, Bessent said, \"We don't repeat conversations in the Situation Room.\"\n\nBut he said that the departments of Treasury, Defense and State and the Office of the U.S. Trade Representative all \"were in favor of putting Megaspeed on the entity list for months.\"\n\nAsked if he was frustrated with the potential export control delays, Bessent said, \"I am frustrated when President Trump made it very clear that China should not receive any Nvidia chips above H100s.\"", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:23 PM IST", "pub_date_relative": "40m ago"}, {"title": "US Stocks Drift Before Inflation Test of Fed Bets: Markets Wrap - Bloomberg.com", "full_content": "US Stocks Drift Before Inflation Test of Fed Bets: Markets Wrap Bloomberg.com Stock Market Today: Nasdaq Slides Amid Surprise Economic Data; Microsoft Outage Trips Up Stock (Live Coverage) Investor's Business Daily US Futures Gain With Microsoft Outage, Producer Prices in Focus Bloomberg.com An inflation scare, workers get their fair share, and Nvidia\u2019s billion-dollar affairs : The Indicator from Planet Money NPR 10-Year Treasury yield spikes on hot inflation read, Nvidia leads chip stocks lower: AlphaCheck Yahoo Finance", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 08:22 PM IST", "pub_date_relative": "41m ago"}, {"title": "Investors Warn Bond Rout Isn\u2019t Over After Week of Soaring Yields - Bloomberg.com", "full_content": "Investors Warn Bond Rout Isn\u2019t Over After Week of Soaring Yields Bloomberg.com The bond market now has an even bigger fear than AI fallout MarketWatch Inflation Is Sending Bond Yields Higher Again. Here\u2019s Why We\u2019re Not Worried Morningstar How the AI Trade Hijacked the Treasury Market for a Month WSJ US bond market cracks resurface as higher for longer fears return to haunt Wall Street investingLive", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 08:17 PM IST", "pub_date_relative": "46m ago"}, {"title": "Buying property in your wife\u2019s or parents\u2019 name? Know income tax rules, benami property risks and penalties in India", "full_content": "Buying a house in the name of a spouse, child, parent or sibling may seem like a convenient way to manage family assets. However, when the person whose name appears on the property documents does not have sufficient independent income to finance the purchase, the transaction can attract scrutiny from income tax authorities. The key questions are where the money came from, who actually owns the property and whether the financial arrangement can be legally established.\n\nA family relationship does not automatically make such a purchase illegal. However, buyers need to distinguish between a genuine gift, a loan, joint ownership and a benami transaction. If the source of funds cannot be explained or the registered ownership does not reflect the actual arrangement, the transaction can lead to tax demands, penalties and even confiscation of the property.\n\nWhen one person provides the money to purchase a property but the sale deed is registered in another person's name, authorities may examine the source of funds and the actual ownership arrangement.\n\nFor instance, if someone purchases a \u20b9 1 crore property in their parent's name but the parent has no independent income or financial resources to explain the investment, the Income Tax Department may seek details of the transaction.\n\nAuthorities may examine bank statements, income records, the buyer's financial capacity and the circumstances in which the property was acquired. They may also investigate who exercises control over the property , receives rental income and enjoys its economic benefits.\n\n\"The Benami Transactions (Prohibition) Act, 1988 prohibits transactions where property is held in one person's name but the consideration is provided by another. Scrutiny is more likely where funds are unexplained, paid in cash, routed through third parties, or where the real purchaser retains possession, control or rental income.", "source": "LiveMint Money", "pub_date_str": "13 Nov 2026, 08:17 PM IST", "pub_date_relative": "46m ago"}, {"title": "US stocks: US market opens higher after soft producer prices data", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US market opens higher after soft producer prices data Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US market opens higher after soft producer prices data SECTIONS US stocks: US market opens higher after soft producer prices data Reuters Last Updated: Nov 13, 2026, 08:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large t demand overheating SECTIONS Chicago Fed's Goolsbee says on CNBC the Fed needs to guard against demand overheating By Reuters Last Updated: Nov 13, 2026, 08:14:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chicago Fed president Austan Goolsbee stated that inflation has moved beyond temporary energy and tariff-related price shocks. He highlighted that increased demand from the AI buildout is pushing prices higher across many sectors including health care and services. Goolsbee emphasized the importance of upcoming inflation data for determining the Fed's rate increase pace. He noted that currently, there is no clear path back to the 2% inflation target.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 08:14 PM IST", "pub_date_relative": "49m ago"}, {"title": "'Quite Arrogant': Jensen Huang's Biographer Says The Humility Was An Act", "full_content": "A former employee later told him that Huang's alleged affair with Kimberly Powell, the company's vice-president of healthcare and one of his direct reports, was common knowledge.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 08:11 PM IST", "pub_date_relative": "52m ago"}, {"title": "Microsoft Outage: Services Partly Restored As Microsoft Restarts Affected Infrastructure", "full_content": "Microsoft says some users may still face intermittent access issues and delayed email delivery as it works to clear backlogs.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 08:10 PM IST", "pub_date_relative": "53m ago"}, {"title": "SpaceX Starship Flight 15 live updates: Giant Starship stacked for launch and 1st-ever double catch landing - Space", "full_content": "SpaceX Starship Flight 15 live updates: Giant Starship stacked for launch and 1st-ever double catch landing Space SpaceX\u2019s next move is chasing the unprecedented \u2018holy grail\u2019 of rocketry. Here\u2019s what\u2019s at stake CNN SpaceX to attempt first Starship spacecraft recovery on land in 15th flight Reuters SpaceX Starship Flight 15 could be a major step toward full rocket reusability and cheaper missions ABC News - Breaking News, Latest News and Videos SpaceX Aims for Starship Launch on Friday. Here\u2019s What to Know. The New York Times", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 08:05 PM IST", "pub_date_relative": "58m ago"}, {"title": "Scene Box Office Day 8: Suriya-Starrer Holds Strong In Second Week, Continues Its Run In Theatres", "full_content": "Suriya stars in Scene, a Tamil action comedy packed with crime, conflict and chaos. Pooja Hegde and Jyothika also play key roles in the film, which continues to draw audiences to theatres.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 08:04 PM IST", "pub_date_relative": "59m ago"}, {"title": "US Treasury chief says Fed should not hike rates over energy shock tied to Iran war", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US Treasury chief says Fed should not hike rates over energy shock tied to Iran war Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Treasury chief says Fed should not hike rates over energy shock tied to Iran war SECTIONS US Treasury chief says Fed should not hike rates over energy shock tied to Iran war Reuters Last Updated: Nov 13, 2026, 08:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During his speech, US Treasury Secretary Scott Bessent advocated for the Federal Reserve to keep an open mind about interest rate adjustments. He pointed out that the current economic indicators could be skewed due to a supply shock from the ongoing conflict in Iran. Despite recent market volatility, Bessent stressed that the US economy remains robust.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 08:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin Extends Two-Day Slump By 9% To Slip Below $70,000 On Rate Hike Worries", "full_content": "Bitcoin fell 5.4% to $67,628 on Friday, extending its two-day decline to nearly 9%. Around $1.5 billion in bullish crypto positions were liquidated over 24 hours.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump administration is hiring debt collectors to go after defaulted student-loan borrowers for first time in 6 years", "full_content": "The Treasury Department proposes to pay debt collectors much less than in the past to help borrowers get out of default.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cyclone Akvan: IMD Forecasts New Cyclonic Storm Over Bay Of Bengal By Monday", "full_content": "IMD forecasts winds of 40-50 kmph, gusting to 60 kmph, over the Andaman Sea and southeast Bay of Bengal in the coming days.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 07:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cisco beats on earnings, says AI infrastructure revenue will double this fiscal year", "full_content": "Cisco shares rose in extended trading on Thursday after the maker of networking gear reported better-than-expected fiscal first-quarter results.\n\nHere's how the company did compared to LSEG consensus estimates:\n\nRevenue increased 24% from $14.88 billion a year earlier, Cisco said in a statement. Net income rose to $4.6 billion, or $1.14 per share, from $2.9 billion, or 72 center per share, a year ago.\n\nCisco is trying to gain a foothold in the artificial intelligence buildout after missing out on the early years of the generative AI boom. The company's stock price is up about 35% this year as of Thursday's close, trouncing the Nasdaq, which has gained 9% over that stretch.\n\nCisco raised its expectation for AI infrastructure revenue from hyperscalers to $9 billion this fiscal year, more than double the figure in fiscal 2026.\n\n\"Organizations are turning to Cisco for our trusted, market-defining technology and our expertise to help them scale, secure and optimize their environments for the agentic AI era,\" CEO Chuck Robbins said in the statement .\n\nFor the fiscal second quarter, Cisco said it expects revenue of between $18 billion and $18.2 billion, topping the average analyst estimate of $17.88 billion, according to LSEG. The company is projecting adjusted earnings per share of $1.34 to $1.36, beating the $1.23 average estimate.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 07:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018We will sue them\u2019: Canada threatens Stellantis as Trump trade war reshapes Jeep production plans", "full_content": "Canada has threatened to sue auto giant Stellantis over the planned sale of an idled assembly plant in Brampton, Ontario, alleging breaches of a federal funding agreement after the carmaker announced plans to shift production to the U.S. amid President Donald Trump 's trade war.\n\nSpeaking at a news conference on Thursday, Industry Minister M\u00e9lanie Joly said the government had served Stellantis with a formal notice of default, giving the company 30 days to address its concerns or face legal action.\n\n\"We sent a notice of default and, basically, they have 30 days \u2014 or else, of course, we will sue them,\" Joly told reporters in Toronto.\n\nJoly said Stellantis had violated its contractual commitments to the Canadian government and the workers at Brampton by announcing an agreement to sell the plant to armored vehicle manufacturer Roshel earlier in the week. She added that the company was now \"on the hook\" for hundreds of millions of dollars over the move.\n\nCanadian Prime Minister Mark Carney has described the situation at the Brampton plant as \"unacceptable\" and a \"betrayal\" of its workers.\n\nThe standoff comes as the U.S. and Canada remain locked in a bitter trade dispute , with Trump repeatedly putting pressure on automakers to move vehicle production south of the border.\n\nStellantis, which owns auto brands including Dodge, Fiat, Chrysler and Peugeot, had scrapped plans to build its Jeep Compass at the Brampton plant and shifted future production to a factory in Illinois amid U.S. auto tariffs and other market pressures.\n\nStellantis Canada CEO Trevor Longley said in a statement shared with CNBC that the company would return $24 million it received in government support for the Brampton Assembly's original retooling plan. This amount, however, falls significantly short of the Canadian government's own estimate of what the company owes.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 07:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "China Internet Stock Gains Face Reality Check In Nvidia Fallout", "full_content": "The Hang Seng Tech gauge remains about 65% below its 2021 all-time high.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 07:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft Lone Loser In Magnificent Seven As Shares Fall 2% In Pre-Market Trade On Ops Outage", "full_content": "Microsoft shares fell 2.1% in pre-market trade, making it the only Magnificent Seven stock in the red as a global outage disrupted Outlook, Teams and Copilot for over 12 hours.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 07:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Chicago Fed's Goolsbee says central bank 'has definitely got work to do' on inflation", "full_content": "Chicago Federal Reserve President Austan Goolsbee expressed concern about the latest inflation data, telling CNBC on Friday that the central bank likely will need to take action.\n\n\"I believe that the the central bank has definitely got work to do to continue to reestablish its credibility,\" the policymaker said during an interview on \"Squawk Box.\"\n\nHis remarks came shortly after the Bureau of Labor Statistics reported that the producer price index , considered a proxy for wholesale prices, posted a 0.3% increase in October, which was slightly less than expected, but also indicated a 6.5% annual gain, the highest since November 2022.\n\nWith data in hand earlier in the week showing that the consumer price index rose a bit more than expected during the month, Goolsbee said the Fed is slipping further away from its 2% inflation target.\n\n\"We've been above 2% for almost six years, and while it sometimes we were making progress, lately we're not making any progress, and if anything, it's going the wrong way,\" he said.\n\n\"Inflation is rising. It's proved far more persistent than we predicted at the beginning from the supply shocks, and now we're adding this old-fashioned demand overheating coming from the AI data center buildout, that looks like it's starting to spread out of its lane,\" Goolsbee added.\n\nMarkets are fully pricing in a quarter percentage point increase when the rate-setting Federal Open Market Committee meets next on Dec. 8-9. There also is a better than 10% probability of a half-point hike, according to the CME Group's FedWatch gauge of futures markets. Goolsbee is not currently an FOMC voter but will be in 2027.\n\nEarlier in the week, Fed Governor Christopher Waller indicated he would entertain a 50 basis point move depending on this week's inflation data.", "source": "CNBC Finance", "pub_date_str": "13 Nov 2026, 07:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft Outlook outage stretches into a second day: What to know", "full_content": "Microsoft said there is \u201cno evidence of malicious activity\u201d as it works to restore access to email and other services.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 07:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Apple, Alphabet Had Succession Playbooks; Nvidia\u2019s Post-Huang Transition Won\u2019t Be As Smooth", "full_content": "Apple, Alphabet and Uber navigated founder exits with planned transitions, but Nvidia faces a tougher test as it seeks to replace Jensen Huang and sustain its AI dominance.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 07:46 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "OpenAI launches ChatGPT Wallet, allowing its 'dots' AI agents to make purchases for users", "full_content": "OpenAI on Friday announced ChatGPT Wallet, a new payment feature that enables its \"dots\" artificial intelligence agents to make purchases on behalf of users.\n\nThe company built ChatGPT Wallet in partnership with American Express , Mastercard and Visa , and it allows cardholders to maintain their existing credit card rewards and protections. Eligible users enter their card information once, prompt their dot to find items to buy and approve each purchase with a security check.\n\nOpenAI said its dots agents will never actually access a user's card details. Instead, their payment networks will provide the dot with a \"payment token,\" which contains a scoped card number, security code and expiration date that is specific to a given transaction.\n\n\"Our goal here is to really focus on merchants and our network partners and start building out a really great foundation that's safe and easy to use,\" Chaya Nayak, who leads product for monetization and payments at OpenAI, told CNBC in an interview.\n\nChatGPT Wallet comes as a growing number of consumers are exploring how to use personal AI agents to manage their calendars, book travel and complete other day-to-day tasks. OpenAI introduced the dots agents during its annual developer conference in late September, shortly after Meta's Muse offering topped the App Store charts .\n\nPurchases made through ChatGPT Wallet could eventually kickstart a new revenue stream for OpenAI, but the company said it is not taking a cut of transactions to start. With the initial launch, OpenAI is working to build relationships with merchants and position itself as a serious platform for shoppers, especially as vendors are beginning to experiment with personal agents.\n\nOpenAI has pushed deeper into AI-enabled commerce over the last year, but some of its early attempts failed to take off. The company introduced an \" Instant Checkout \" feature last fall, which it quickly pivoted away from.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 09:01 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bessent blames Commerce Dept over lack of export controls for Nvidia partner Megaspeed", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 09:00 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IRB(Re) 3Q26 slides: tax reform drives loss, solvency hits 333%", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:59 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Exchange Income tops EPS estimates in Q3 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:59 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Rede D\u2019Or misses Q3 2026 estimates but stock rises", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 08:58 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates", "full_content": "The Nasdaq Composite fell on Friday as Nvidia shares added to their recent losses, though the index still headed for a winning week alongside the other two major averages.\n\nThe tech-heavy Nasdaq dropped 0.9%, while the S&P 500 slid 0.6%. The Dow Jones Industrial Average traded around the flatline.\n\nEquities initially popped before paring gains after October's producer price index reading \u2014 a measure of wholesale inflation \u2014 showed an increase of 0.3% on the month. Economists polled by Dow Jones had seen headline PPI rising 0.4%.\n\nHowever, the report also showed producer prices gaining 6.5% from 12 months earlier \u2014 the biggest annual advance since November 2022.\n\n\"Today's PPI data \u2014 which shows some signs of improving, albeit still too-high \u2014 is unlikely to change the Fed's approach in December because the CPI data was already outside their comfort zone,\" said Chris Zaccarelli, chief investment officer at Northlight Asset Management.\n\n\"We believe the Fed will raise rates 25 bps in December,\" he also said, adding that he considers January a \"live meeting.\"\n\nNvidia shares weighed on the broader market for another day. The stock fell more than 2% Friday, extending the more than 4% drop it saw in the previous session. The pressure came after the exit of the scandal-hit chipmaker's founder and CEO Jensen Huang.\n\nThe Dow, S&P 500 and Nasdaq all pulled back on Thursday after Huang stepped down from his post following reported extramarital affairs , including a relationship with a woman U.S. intelligence officials believe is a Chinese spy. Analysts told CNBC that Huang's exit could trigger a 20% correction in the stock.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:54 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks making the biggest moves Friday: Nvidia, Microsoft, Cerebras & more", "full_content": "Microsoft shares were under pressure early Friday after an outage interrupted Outlook and other services. Nvidia, meanwhile, extended its recent slump as the chipmaker tried to rebound from another losing session after the exit of former CEO Jensen Huang.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nNvidia is down almost 14% this week Embattled Nvidia fell as much as 3.5% in early trading Friday, brining the weekly decline to almost 14% in the wake of Thursday's resignation of former CEO Jensen Huang.\n\nNvidia has now fallen for six straight weeks, and hasn't posted a weekly advance since the week ending Oct. 2. Nvidia is down 31% duriing this six-week slump.\n\nShares of the home improvement slid more than 1% after Stifel downgraded Lowe's Companies to sell from hold, ahead of next week's earnings report.\n\n\"We believe HD/LOW shares do not currently offer this required certainty with underappreciated challenges on three fronts: weaker F2H26 backdrop; FY27-FY28 operating margin pressure; structural issues including known DIY weakness, housing category uncertainty, and increased competition requiring investments to sustain long-term growth prospects,\" analyst Andrew Carter wrote on Thursday. \"Our HD/LOW FY28E adjusted EPS are -7%/-8% below consensus respectively.\"\n\nThe analyst trimmed his price target to $190.00 from $195.00, representing a more than 16% fall from Thursday's close of $227.46. The stock is already down more than 5% this year.\n\nShares for Broadcom fell 5% after Rothschild & Co. Redburn downgraded the global technology company to neutral from buy on Friday.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:54 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Am I overpaying for health insurance? How to answer the key question this open-enrollment season.", "full_content": "More people want to understand the fine print on plans this year, financial planners say.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 08:41 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Microsoft says email queues 'approaching normal levels' as Outlook issues persist", "full_content": "Microsoft users began to regain email access on Friday amid one of the company's biggest-ever server issues that lasted more than 20 hours, causing disruption to millions of its customers.\n\nEngineers scrambled to solve connectivity problems that began shortly before 1 p.m. ET on Thursday.\n\nEmail and calendar service Outlook, along with multiple Microsoft 365 services such as Sharepoint and Copilot, were largely down during the Asian business day on Friday, throughout the European morning and into the early U.S. hours. Numerous external services that connect with Microsoft products were also hit.\n\nIn an update at around 9 a.m. ET, Microsoft continued to warn that users may be unable to connect to multiple Microsoft 365 products, including Outlook on either web or desktop and many services that interact with email.\n\nHowever, it said it was \"continuing to see improvements in service availability, with email queues significantly reduced and approaching normal levels.\" It had previously given updates by region, with Asia Pacific services among the first to start normalizing.\n\nIntermittent issues are expected as recovery efforts continue.\n\nEngineering teams have been taking affected systems offline for fixes and bringing them back online in stages. They are prioritizing efforts to preserve emails delayed during the recovery process and reduce email queues and backlogs, extending the timeout window, whereby delayed emails continue to attempt delivery, to 48 hours to help protect messages.\n\nMicrosoft says it has not detected any malicious activity causing the outage, which it initially blamed on a traffic surge in part of its infrastructure and issues with a component responsible for processing server health.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 08:40 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Home sales plummet to lowest level since \u2018Great Recession\u2019 as prices hit all-time high", "full_content": "Home sales fell in October to a 16-year low as buyers bolted from the housing market in the face of 7% mortgage rates.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 08:38 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates - CNBC", "full_content": "Nasdaq falls on Friday as Nvidia keeps sliding, but major averages are up for week: Live updates CNBC See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 08:36 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US Stock Market Today: Dow Jumps 200 Points As Wall St Cheers Soft Producer Prices, Nvidia Rebounds", "full_content": "The Dow Jones Industrial Average was up 4%. The S&P 500 gained 0.3%, and the Nasdaq Composite increased 0.1%.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 08:34 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NHL\u2019s next TV deal will test the league\u2019s strength while media companies prepare for NFL rights increase", "full_content": "One of the biggest developing stories in entertainment and sports is how the world's biggest media companies judge the value of non-NFL rights. The NHL will be the first public test into this new era of media valuation.\n\nThe NHL can begin formally negotiating a new media rights deal with its incumbent partners \u2014 Disney/ESPN and Skydance, the new owner of TNT Sports \u2014 on Jan. 1. The league wants an increase in overall rights fees between 50% and 100% over its current deal, according to sources familiar with the matter. The NHL inked a 7-year, $4.5 billion deal with ESPN and TNT Sports in 2021.\n\nWhether the league actually gets that type of increase is still unclear \u2014 and that will be one of the most watched data points in the world of sports business next year.\n\nNational media rights for the NHL currently make up about 13% of its annual revenue, which is around $8 billion, according to CNBC estimates.\n\nDisney/ESPN and Skydance want to renew a deal with the league, according to people familiar with the matter that asked not to be named because the discussions are private. Both companies have engaged in preliminary conversations with the league in the past few weeks, and while there's still work to do in terms of price, there's mutual interest in getting something done.\n\nIn its current deal, ESPN has access to 100 exclusive games for the 2026-27 season. Fifty-three of them air on ESPN or ABC, and the other 47 exclusive stream on ESPN. Under current terms, the league's playoffs are split between Disney and TNT Sports.\n\nDisney is particularly interested in acquiring the rights to more playoff games, one of the people said. The NHL had its most-watched playoffs on record last season, averaging 1.8 million viewers per game. The Stanley Cup averaged 5.2 million viewers \u2014 the largest audience since 2019.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:34 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "We're making 3 trades to adjust our consumer exposure after an analyst downgrade", "full_content": "We want to take protect gains heading into earnings results next week.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:29 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia stock sinks 2% in fallout from Jensen Huang resignation", "full_content": "Nvidia stock sank 2% on Friday as investors navigated the fallout from CEO Jensen Huang 's resignation .\n\nColette Kress , Nvidia's CFO, will take over as interim CEO, the company announced Thursday.\n\nFollowing the announcement of Huang's departure, shares of Nvidia declined sharply Thursday morning before recovering to close just 4% lower.\n\nHuang was under increasing scrutiny after a series of reports that the CEO was in a relationship with a Chinese woman believed to be a spy for Beijing. Huang disclosed that he had an affair on Sunday in a note to employees. The board also announced an investigation into the matter on Sunday.\n\nNvidia stock chart The New York Times reported on Wednesday that Huang had another extramarital romantic relationship, this one with Kimberly Powell, vice president of health care at Nvidia .\n\nReuters reported on Thursday the existence of yet another affair with an Nvidia employee, which the news agency did not name. Nvidia did not immediately respond to CNBC's request for comment.\n\nBefore Huang resigned, several Wall Street analysts told CNBC that his departure could cost Nvidia as much as 20% of its market value, given how critical he has been to the company's success. Nvidia's stock was already down more than 20% over the last month.\n\nStephane Houri, head of equity research at ODDO BHF, said much of the company's success has been built around Huang, and his influence extended into the broader industry.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 08:26 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Mookuthi Amman 2 Box Office Day 8: Nayanthara Film Keeps Its Theatrical Run Going, Check Latest Earnings", "full_content": "Directed by Sundar C, Mookuthi Amman 2 is a Tamil fantasy comedy-thriller starring Nayanthara. The film blends humour, drama and fantasy as it brings a fresh story to the popular franchise.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 08:25 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bessent points to Lutnick\u2019s Commerce as he slams Nvidia chip \u2018leakage\u2019 to China", "full_content": "Treasury Secretary Scott Bessent on Friday said his department and others in the Trump administration have long supported slapping restrictions on Megaspeed, the company at the center of former Nvidia CEO Jensen Huang 's spy-sex scandal .\n\nBut the Commerce Department is in charge, \"and you will have to ask them about their internal processes,\" Bessent told CNBC's \" Squawk Box .\"\n\nThe Cabinet secretary's comments hinting at disunity within the administration followed an Axios report that Bessent, in the White House Situation Room last week, had asked Commerce Secretary Howard Lutnick why he has resisted implementing export controls, especially on Megaspeed.\n\nLutnick has \"repeatedly stood in the way\" of cracking down on companies suspected of diverting Nvidia's advanced AI chips to China, Axios reported.\n\nCommerce Department spokeswoman Kristen Eichamer on Wednesday told CNBC that Bessent and Lutnick had \"no such conversation\" in the Situation Room.\n\nAsked on CNBC about the reported incident, Bessent said, \"We don't repeat conversations in the Situation Room.\"\n\nBut he said that the departments of Treasury, Defense and State and the Office of the U.S. Trade Representative all \"were in favor of putting Megaspeed on the entity list for months.\"\n\nAsked if he was frustrated with the potential export control delays, Bessent said, \"I am frustrated when President Trump made it very clear that China should not receive any Nvidia chips above H100s.\"", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 08:23 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Stocks Drift Before Inflation Test of Fed Bets: Markets Wrap - Bloomberg.com", "full_content": "US Stocks Drift Before Inflation Test of Fed Bets: Markets Wrap Bloomberg.com Stock Market Today: Nasdaq Slides Amid Surprise Economic Data; Microsoft Outage Trips Up Stock (Live Coverage) Investor's Business Daily US Futures Gain With Microsoft Outage, Producer Prices in Focus Bloomberg.com An inflation scare, workers get their fair share, and Nvidia\u2019s billion-dollar affairs : The Indicator from Planet Money NPR 10-Year Treasury yield spikes on hot inflation read, Nvidia leads chip stocks lower: AlphaCheck Yahoo Finance", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 08:22 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Investors Warn Bond Rout Isn\u2019t Over After Week of Soaring Yields - Bloomberg.co s News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US Treasury chief says Fed should not hike rates over energy shock tied to Iran war Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Treasury chief says Fed should not hike rates over energy shock tied to Iran war SECTIONS US Treasury chief says Fed should not hike rates over energy shock tied to Iran war Reuters Last Updated: Nov 13, 2026, 08:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During his speech, US Treasury Secretary Scott Bessent advocated for the Federal Reserve to keep an open mind about interest rate adjustments. He pointed out that the current economic indicators could be skewed due to a supply shock from the ongoing conflict in Iran. Despite recent market volatility, Bessent stressed that the US economy remains robust.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 08:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin Extends Two-Day Slump By 9% To Slip Below $70,000 On Rate Hike Worries", "full_content": "Bitcoin fell 5.4% to $67,628 on Friday, extending its two-day decline to nearly 9%. Around $1.5 billion in bullish crypto positions were liquidated over 24 hours.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump administration is hiring debt collectors to go after defaulted student-loan borrowers for first time in 6 years", "full_content": "The Treasury Department proposes to pay debt collectors much less than in the past to help borrowers get out of default.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Cisco beats on earnings, says AI infrastructure revenue will double this fiscal year", "full_content": "Cisco shares rose in extended trading on Thursday after the maker of networking gear reported better-than-expected fiscal first-quarter results.\n\nHere's how the company did compared to LSEG consensus estimates:\n\nRevenue increased 24% from $14.88 billion a year earlier, Cisco said in a statement. Net income rose to $4.6 billion, or $1.14 per share, from $2.9 billion, or 72 center per share, a year ago.\n\nCisco is trying to gain a foothold in the artificial intelligence buildout after missing out on the early years of the generative AI boom. The company's stock price is up about 35% this year as of Thursday's close, trouncing the Nasdaq, which has gained 9% over that stretch.\n\nCisco raised its expectation for AI infrastructure revenue from hyperscalers to $9 billion this fiscal year, more than double the figure in fiscal 2026.\n\n\"Organizations are turning to Cisco for our trusted, market-defining technology and our expertise to help them scale, secure and optimize their environments for the agentic AI era,\" CEO Chuck Robbins said in the statement .\n\nFor the fiscal second quarter, Cisco said it expects revenue of between $18 billion and $18.2 billion, topping the average analyst estimate of $17.88 billion, according to LSEG. The company is projecting adjusted earnings per share of $1.34 to $1.36, beating the $1.23 average estimate.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 07:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China Internet Stock Gains Face Reality Check In Nvidia Fallout", "full_content": "The Hang Seng Tech gauge remains about 65% below its 2021 all-time high.", "source": "NDTV Profit", "pub_date_str": "13 Nov 2026, 07:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Chicago Fed's Goolsbee says central bank 'has definitely got work to do' on inflation", "full_content": "Chicago Federal Reserve President Austan Goolsbee expressed concern about the latest inflation data, telling CNBC on Friday that the central bank likely will need to take action.\n\n\"I believe that the the central bank has definitely got work to do to continue to reestablish its credibility,\" the policymaker said during an interview on \"Squawk Box.\"\n\nHis remarks came shortly after the Bureau of Labor Statistics reported that the producer price index , considered a proxy for wholesale prices, posted a 0.3% increase in October, which was slightly less than expected, but also indicated a 6.5% annual gain, the highest since November 2022.\n\nWith data in hand earlier in the week showing that the consumer price index rose a bit more than expected during the month, Goolsbee said the Fed is slipping further away from its 2% inflation target.\n\n\"We've been above 2% for almost six years, and while it sometimes we were making progress, lately we're not making any progress, and if anything, it's going the wrong way,\" he said.\n\n\"Inflation is rising. It's proved far more persistent than we predicted at the beginning from the supply shocks, and now we're adding this old-fashioned demand overheating coming from the AI data center buildout, that looks like it's starting to spread out of its lane,\" Goolsbee added.\n\nMarkets are fully pricing in a quarter percentage point increase when the rate-setting Federal Open Market Committee meets next on Dec. 8-9. There also is a better than 10% probability of a half-point hike, according to the CME Group's FedWatch gauge of futures markets. Goolsbee is not currently an FOMC voter but will be in 2027.\n\nEarlier in the week, Fed Governor Christopher Waller indicated he would entertain a 50 basis point move depending on this week's inflation data.", "source": "CNBC Finance", "pub_date_str": "13 Nov 2026, 07:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Fixed Income", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "10-year Treasury yield moves to 5.15% as traders weigh producer price report", "full_content": "The 10-year Treasury yield stayed over 5% on Friday after October's producer price index , a measure of wholesale prices, came in slightly less than expected.\n\nThe yield \u2014 the key benchmark for mortgages, auto loans and credit card debt \u2014 rose 5 basis points to more than 5.15%.\n\nThe 2-year Treasury note yield, typically more sensitive to short-term Federal Reserve interest rate decisions, was higher by less than 1 basis point, at 4.872%. The longer-dated 30-year Treasury bond yield, sensitive to geopolitical risks, was more than 5 basis points higher, at 5.481%.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nOctober's producer price index rose 0.3% versus September, less than the 0.4% expected by economists polled by Dow Jones. But on an annual basis, PPI rose 6.5% over the past 12 months, the biggest annual increase since November 2022.\n\nThere was \"no silver lining\" in the inflation report, said Chris Rupkey, chief economist at FWDBONDS, adding that core PPI \u2014 which excludes food, energy and trade services \u2014 increased 0.5% in October.\n\n\"It is economics 101 that producer prices lead consumer prices and right now it looks like consumers will be on the hook for a fresh burst of factory inflation,\" he said.\n\nThe moves come after 10-year Treasury yields jumped more than 13 basis points to more than 5% in Thursday's session , with the 2-year yield soaring more than 15 basis points.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 07:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Warships, aircraft or missiles? GRSE vs HAL vs BDL: Which defence PSU wins the post-Q2 results race? Technical outlook", "full_content": "HAL BDL Sharmila Bhadoria Published 13 Nov 2026, 07:35 PM IST Prefer Livemint on Google GRSE vs HAL vs BDL: As the corporate earnings season nears its conclusion, recent earnings have put spotlight on three major defence Public Sector Undertakings (PSUs). Garden Reach Shipbuilders & Engineers (GRSE) reported a 12% year-on-year (YoY) increase in consolidated net profit for the second quarter of the financial year 2026-27.\n\nHindustan Aeronautics Limited (HAL) posted a 16% annual surge in net profit, while Bharat Dynamics Limited (BDL) reported a 15% decline in net profit.\n\nWith all three stocks ending lower on Friday, November 13, 2026, here's a comparison of their Q2 results and technical outlook for GRSE, BDL and HAL.\n\nThe warship-building PSU, GRSE, reported a 12% annual increase in its net profit to \u20b9 172 crore for the second quarter of financial year 2026-27. Its net profit was driven by higher revenue from operations. Its net profit stood at \u20b9 154 crore in the year ago period.\n\nThe state run aerospace and defence company, HAL, reported a net profit of \u20b9 1,936 crore for the second quarter of FY27, against \u20b9 1,669 crore in the corresponding quarter of FY26. The Bengaluru-based aerospace major witnessed higher revenue and project deliveries during the quarter under review.\n\nHAL\u2019s revenue from operations surged by 14.9% on an annual basis to \u20b9 7,613.25 crore from \u20b9 6,628 crore. However, the defence PSU\u2019s operating profitability remained relatively subdued.\n\nBharat Dynamics reported a 15% decline in net profit after tax to \u20b9 180 crore during the quarter under review. The Hyderabad-based missile systems maker witnessed 46% decline in its absolute EBITDA. But its net revenue increased 45% on an annual basis to \u20b9 1,660 crore.\n\nGRSE stock price action has staged a base reversal off \u20b9 1,850 lows, according to Virat Jagad Sr. Technical Research Analyst at Bonanza, who recommends fresh entry for investors with \u2018buy on dips\u2019 investment strategy.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 07:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wholesale prices rose 0.3% in October, putting annual rate at 6.5%, the highest in nearly four years", "full_content": "Wholesale prices increased less than expected in October, but inflation pressures persisted and the Federal Reserve is likely still on target for an interest rate increase soon.\n\nThe producer price index , which measures the prices domestic producers get for their products before they reach the consumer, rose a seasonally adjusted 0.3% for the month, against the Dow Jones consensus for a 0.4% increase, the Bureau of Labor Statistics reported Friday.\n\nStripping out food and energy, core PPI posted a 0.3% gain, meeting expectations.\n\nOn an annual basis, headline PPI accelerated 6.5%, up 0.2 percentage point for the highest annual rate since November 2022.\n\nThe report comes just a few weeks ahead of the Federal Reserve's next policy meeting Dec. 8-9. Markets are fully pricing in a quarter percentage point increase in the central bank's key overnight borrowing rate, with slight odds that the Federal Open Market Committee might opt for a half-point hike.\n\nStock market futures added to gains following the release while Treasury yields were mixed.\n\nEarlier this week, the BLS reported that inflation at the cash register was hotter than expected.\n\nThe headline consumer price index saw a 0.4% increase in October while core was up 0.3%, both 0.1 percentage point higher than expected. Because of the government shutdown in October 2025, the BLS couldn't collect some data and refrained from putting out a 12-month inflation figure for CPI.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 07:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jensen Huang scandal casts doubt on Nvidia\u2019s AI dominance \u2014 how we got here", "full_content": "Nvidia is facing one the biggest crises in its 33 year history, with founder Jensen Huang resigning as CEO Thursday after multiple reported affairs, including one with a woman alleged to be a Chinese spy. Now CFO Colette Kress has taken the helm as Nvidia's interim CEO.\n\nThe implications of Huang's affair with Alice Huang run far deeper than infidelity. That's because her ties to Nvidia customer Megaspeed put her in the middle of a sprawling effort to accumulate AI chips across Southeast Asia. And Megaspeed is under investigation for possibly diverting restricted Nvidia chips into the hands of Chinese companies.\n\nThe relationship between Jensen Huang and Alice Huang dates back to 2023, according to The New York Times . That was a \"turbulent\" period for Nvidia, Jensen Huang told CNBC during an interview at the time. Nvidia was in the midst of redesigning some chips to comply with the first in a series of strict export controls imposed by the U.S. government that restricted sales to China.\n\n\"The regulation is going to be just fine. We're going to be able to work through it,\" Huang told CNBC from Nvidia's headquarters in February 2023. The interview was for a documentary about how Huang created Nvidia and built it into the backbone of the AI boom.\n\nThat same day, CNBC also interviewed Kimberly Powell, Nvidia's vice president of healthcare, with whom Jensen Huang reportedly had an affair.\n\nIt's not the first time Nvidia has faced an uncertain future. The company nearly went bankrupt in the early years after it was founded in 1993.\n\n\"Every company makes mistakes and I make a lot of them,\" Huang said in the 2023 interview. \"And some of them put the company in peril.\"\n\nIn the early months of the AI boom, after OpenAI launched ChatGPT in November 2022, Nvidia was on the precipice of historic growth. Jensen Huang told CNBC he'd like to keep running the company for \"three or four decades,\" as long as \"I feel that I'm making a real contribution to the company.\"", "source": "CNBC World Economy", "pub_date_
