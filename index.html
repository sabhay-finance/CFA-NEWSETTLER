ion and fiscal pressures on India. The Reserve Bank of India anticipates inflation will peak this quarter, supporting future bond market performance.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nIndian government bonds experienced a significant rally influenced by falling oil prices after the US midterm elections. The benchmark bond yield dropped notably, reflecting a three-day decline in yields. Brent crude oil prices decreased, easing inflation and fiscal pressures on India. The Reserve Bank of India anticipates inflation will peak this quarter, supporting future bond market performance.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:45 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Aptus Value Housing Finance Q2 profit rises 18% to Rs 267 cr", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Aptus Value Housing Finance Q2 profit rises 18% to Rs 267 cr The Economic Times daily newspaper is available online now. Read Today's Paper Aptus Value Housing Finance Q2 profit rises 18% to Rs 267 cr SECTIONS Aptus Value Housing Finance Q2 profit rises 18% to Rs 267 cr PTI Last Updated: Nov 04, 2026, 08:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Aptus Value Housing Finance India achieved a remarkable net profit of Rs 267 crore in the second quarter, signifying strong financial growth. The total income surged to Rs 634 crore, up from Rs 554 crore the year prior. Additionally, interest income climbed to Rs 551 crore from Rs 472 crore.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:43 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Keystone Realtors Q2 profit jumps 10-fold to Rs 101 cr", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Keystone Realtors Q2 profit jumps 10-fold to Rs 101 cr Keystone Realtors Share Price Nirlon Share Price Ganesh Housing Share Price Kalpataru Share Price Puravankara Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Keystone Realtors Q2 profit jumps 10-fold to Rs 101 cr SECTIONS Keystone Realtors Q2 profit jumps 10-fold to Rs 101 cr PTI Last Updated: Nov 04, 2026, 08:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Keystone Realtors has announced a ten-fold increase in consolidated net profit for the quarter ended September. The net profit rose to Rs 100.75 crore, attributed to significant profit share from joint ventures. Total income for the quarter, however, saw a decline from the previous year. The company's pre-sales reached record levels, reflecting strong demand for luxury housing projects.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:42 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Markets: Why Qualcomm shares are in top focus today with quarterly earnings, growth outlook amid AI costs concerns", "full_content": "Qualcomm shares are in focus on Wall Street on Wednesday, November 4, as the semiconductor manufacturer prepares to announce its fourth-quarter fiscal 2026 financial results after the US stock market closes. Investors will closely monitor the company's revenue, earnings and management commentary amid weakening smartphone demand, rising component costs, concerns over artificial intelligence spending, and increasing competition in the semiconductor industry.\n\nThe company's dependence on the smartphone market is emerging as a key concern. While handset chips remain Qualcomm's biggest revenue contributor, Apple's efforts to develop its own cellular modem technology and softer demand for Android smartphones are creating additional challenges for its growth prospects.\n\nThese concerns have also weighed on the company's stock performance. On Friday, October 30, Qualcomm shares plunged 11.2% following Intel's earnings announcement, which triggered broader concerns about memory shortages and weakening consumer spending in the personal computer market.\n\nOn Wednesday, Qualcomm shares were trading at $172.05, up 4.63%, or $7.62. However, the stock remained down 0.76% year to date.\n\nWall Street analysts expect Qualcomm to report revenue of approximately $10.15 billion for the fourth quarter, while adjusted earnings are projected at $2.16 per share.\n\nThese estimates indicate year-over-year declines of nearly 10% in revenue and 28% in adjusted earnings, reflecting weaker smartphone demand, reduced orders from Apple and higher semiconductor manufacturing costs.\n\nQualcomm has previously provided revenue guidance of $9.7 billion to $10.5 billion and non-GAAP diluted earnings per share of $2.05 to $2.25 for the quarter.\n\nThe company expects handset revenue to reach approximately $5.2 billion in the December quarter, representing a decline of around 25% from the corresponding period last year.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 08:41 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Property giant Vonovia 'concerned' over Berlin left's housing plans", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Property giant Vonovia 'concerned' over Berlin left's housing plans The Economic Times daily newspaper is available online now. Read Today's Paper Property giant Vonovia 'concerned' over Berlin left's housing plans SECTIONS Property giant Vonovia 'concerned' over Berlin left's housing plans By AFP Last Updated: Nov 04, 2026, 08:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Europe's leading corporate landlord Vonovia said Wednesday it was \"concerned\" at plans by Berlin's possible incoming far-left led city administration to expropriate apartments to tackle the city's housing crisis. \"Of course, we are concerned about plans to nationalise housing owned by private companies,\" Vonovia CEO Luka Mucic told reporters Wednesday during a conference call on the company's third-quarter results.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:40 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "McDonald's stock rises as earnings beat, U.S. restaurants show improvement", "full_content": "McDonald's on Wednesday reported mixed quarterly results as traffic to its U.S. restaurants fell, leading to a slight decline in domestic same-store sales.\n\nThe fast-food giant reported a 0.2% decrease in sales at its U.S. restaurants that have been open at least 13 months. Even so, the segment performed better than the 0.5% decline that Wall Street anticipated, according to a survey of analysts by StreetAccount.\n\n\"In the U.S., we're encouraged by improvement as the quarter progressed following our intervention on value,\" McDonald's CEO Chris Kempczinski said in a statement.\n\nMcDonald's same-store sales returned to growth in September after falling in July and August, CFO Ian Borden said on the company's earnings conference call. However, in response to an analyst question, he clarified that he did not say that U.S. same-store sales would be better in the fourth quarter.\n\nKempczinski said in August that the company's U.S. business was falling short on execution, particularly on the implementation of its value offerings. Like many restaurants, McDonald's has leaned into discounts to attract budget-conscious diners over the last two years.\n\nTo reverse same-store sales declines, McDonald's focused its marketing on its Extra Value Meals and restarted regional and national promotions on its mobile app, which are important to its most frequent diners.\n\nAs McDonald's tries to regain its footing in the U.S., the chain is also testing two new value menus, one with mix and match bundles and the other with set combinations of menu items, executives said on the earnings call. The offering that resonates the most with customers and franchisees will be rolled out across the U.S. in early 2027.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:35 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Analysis: The Democrats have one chance to extract concessions from Trump. Markets will hate it", "full_content": "The electoral sweep by Democrats on Tuesday night injects a new, unstable dynamic into the single biggest political risk to financial markets in the coming year: the debt limit . Unless a defeated Republican Party makes a swift and unlikely show of unity to take the issue off the table in its last few weeks in power, the protracted fight that will unfold is set to be nastier than ever, adding volatility to an already shaky bond market.\n\nPast episodes of brinkmanship around the need to raise the government's borrowing limit have involved Republicans in Congress demanding budget cuts from a Democratic president as the price of their vote. This time it will almost certainly be the left seeking concessions from the right.\n\nThe debt limit is the definition of a must-pass bill, even more than issues like funding the government and the defense budget. That makes it potentially the one real chance the new Democratic majority in Congress has to extract concessions from a president who is already pledging to veto their agenda. Markets will hate the entire process, even if \u2014 as many expect \u2014 it ends in compromise.\n\nBecause it is Democrats who hold the leverage, unlike past episodes, the ultimate agreement is more likely to increase government spending than lower it. With high bond yields weighing on the economy, and Americans expecting action from a newly empowered Democratic opposition, the fight could be particularly damaging.\n\nMany in the markets are stuck on the outdated idea that Democrats are less assertive than Republicans, said Aniket Shah, head of the Washington policy team at the investment bank Jefferies.\n\n\"They have this sort of mental image of Biden-Harris 2024,\" said Shah. \"I don't think they realize how aggressively Democrats plan to take 2027.\"\n\nThe debt ceiling is a quirk of the congressional budgeting process. It stops the government from borrowing funds that Congress has already ordered federal agencies to spend.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:35 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city The Economic Times daily newspaper is available online now. Read Today's Paper Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city SECTIONS Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city PTI Last Updated: Nov 04, 2026, 08:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sunday PropTech Ltd marks a significant milestone with its inaugural acquisition of an 89-room hotel in Rajarhat. This venue will be included in its emerging mid-premium Clubhouse brand, bolstering its footprint in eastern India. Given its advantageous proximity to Netaji Subhas Chandra Bose International Airport, it appeals to business travelers. The company plans to revamp and reposition the hotel, while also identifying additional investment prospects in West Bengal.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:33 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nasdaq jumps 2%, Dow soars over 1,000 points after US midterm election results", "full_content": "NEW YORK (AP): Most of the U.S. stock market is rallying Wednesday as Wall Street tries to sort the winners from the losers following stunning losses for President Donald Trump\u2019s party in the midterm elections.\n\nThe early winners appear to include solar-power companies, for example. Investors meanwhile see risks ahead for Trump\u2019s social-media company, the artificial-intelligence industry and businesses owned by Elon Musk, who donated heavily to Republicans. But the moves may not last, and uncertainty about what the election will mean had futures for U.S. stocks swinging from losses to gains before the U.S. market even opened.\n\nFor now, at least, the S&P 500 jumped 1.2% in early trading and was potentially on track for its best day in six weeks. The Dow Jones Industrial Average was up 1,178 points, or 2.3%, as of 9:35 a.m. Eastern time, and the Nasdaq composite was 1.1% higher.\n\nStrategists along Wall Street had been urging investors not to get swept up in the election because it may not matter much in the long term. Historically, U.S. stocks tend to do well in the six months following any midterm election, regardless of who wins. Prices for stocks depend more on where profits for companies and interest rates are heading than anything else.\n\n\u201cEarnings trump elections,\u201d according to Brian Jacobsen, chief economic strategist at Annex Wealth Management.\n\nWall Street also may have gotten a preferred political scenario with Democrats set to take control of both the Senate and the House of Representatives.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 08:32 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Caitlin Clark signs as first-ever brand partner with Dick's and Foot Locker", "full_content": "Caitlin Clark has signed a multiyear deal with Dick's Sporting Goods and Foot Locker. The deal marks the first time either brand has signed an individual athlete, man or woman, as a partner.\n\nAs part of the partnership with the sports retailers, Clark will work with both brands on custom promotions to support her signature footwear, apparel and product lines. She will also be involved in activations and community events.\n\nThe new deal follows the Oct. 1 global release of Nike and Clark's first signature shoe, which was the largest women's signature shoe launch in the company's history. The release also included an 18-piece apparel assortment.\n\nThe shoe has received widespread acclaim and drawn strong consumer demand, with inventory selling out within hours on Nike.com and other sneaker retail sites.\n\nClark pointed to the brands' deep roots in sport and basketball and their ability to connect with fans all over the world.\n\n\"Dick's Sporting Goods was always a stop before the start of any sports season when I was growing up,\" Clark said in a statement. \"Being the first ever brand partner for both them and Foot Locker is a really special full-circle moment. \"\n\nThe Clark partnership also marks the first joint athlete partnership between Dick's and Foot Locker under Dick's Inc. Both Dick's Sporting Goods and Foot Locker have previously worked with athletes on marketing campaigns, in-store events, and other ventures but never at the brand level.\n\nDick's CEO Ed Stack said he looks forward to building on the energy that Clark has brought to playing basketball and winning new fans.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:30 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Midterm elections deliver a \u2018blue wave.\u2019 The stock market sees green.", "full_content": "Wall Street finds reasons to cheer the Democrats\u2019 sweep. Plus: Microsoft\u2019s AI-era buyouts and a retiree\u2019s appetite for a \u201cfree lunch.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 08:29 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NPS retirement planning: Can investments in AIFs, REITs and InvITs help improve returns and diversify your portfolio?", "full_content": "The National Pension System (NPS) could offer subscribers greater exposure to alternative investments as pension fund managers look to diversify retirement portfolios beyond traditional equities, government securities and corporate bonds.\n\nInvestments in alternative investment funds (AIFs), real estate investment trusts (REITs) and infrastructure investment trusts (InvITs) could provide additional sources of income and long-term growth. However, these investments also carry risks, including lower liquidity, valuation uncertainty and the possibility of losses.\n\nPranay Ranjan Dwivedi, MD & CEO of SBI Pension Funds (SBIPF), believes a measured allocation to alternative assets could help strengthen retirement portfolios over the long term. He suggests an initial allocation of around 2-3% of a retirement portfolio to alternative investments, which could gradually increase to 5%, subject to regulatory limits and the availability of suitable investment opportunities.\n\nThe discussion comes as the Pension Fund Regulatory and Development Authority (PFRDA) reviews the NPS investment framework. The expansion of investment options could allow pension funds to tap opportunities in infrastructure, real estate and private businesses, while giving subscribers greater diversification over their long investment horizons.\n\nAlternative investments have the potential to improve risk-adjusted returns over a 10-20-year investment horizon, but the benefits are not automatic, Dwivedi said.\n\nDifferent categories serve different purposes. Private equity investments provide exposure to business growth, while private credit, real estate and infrastructure investments can generate income. Certain long-duration investments may also offer additional returns in exchange for accepting longer holding periods.\n\nReal estate and infrastructure investments can also provide some protection against inflation.", "source": "LiveMint Money", "pub_date_str": "04 Nov 2026, 08:19 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI data center stocks and Musk's SpaceX decline as Texas governor result raises risks of a slowdown", "full_content": "AI data center stocks came under pressure as Democrats \u2014 seen as proponents of moratoriums on the buildout \u2014 won big in midterm elections and in key technology hubs like Texas.\n\nMarkets were already anticipating the Democrats to win the House of Representatives and possibly take Senate control. But the Texas governor mansion going to Democrats was a big blow, analysts said. Democrat Gina Hinojosa, who wants to enact an immediate moratorium on data centers in the state, won over incumbent Republican Gov. Greg Abbott. According to Wells Fargo, 27% of planned data center gigawatts is in the Lone Star State.\n\nThe midterm elections will slow the pace of data center buildouts across the U.S., Dan Ives, partner at Yorkville Ives & Co., said in a note on Wednesday morning.\n\n\"There is no way to sugarcoat that Democrats taking control especially over the Senate will create some major hurdles for AI and tech legislation in the Beltway over the next 2 years,\" he said.\n\nHe added that the election in Texas was the \"biggest worry\" of the night for tech investors and the AI trade because that's where around 25%-30% of data center gigawatts and capacity will come from.\n\nShares of Elon Musk 's SpaceX were down 4% after the open, and Tesla shares were down 5%. The Democrats' victory in Texas is a big setback for Musk , where he heavily backed Republican candidates, and where his companies Tesla and SpaceX are based. Musk spent a record of at least $474 million on the midterms and funneled $224 million into Texas alone, where Republican Senate nominee Ken Paxton and Gov. Greg Abbott lost to Democrats.\n\nSpaceX is currently building out multiple gigawatts of data center capacity, including projects in Texas.\n\n\"Data centers in space looking pretty appealing right now,\" Musk said in a post on X in the early hours on Wednesday, referring to his speculative plans to build AI infrastructure off-planet.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:13 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "539% return in 5 years: GMDC share price rallies 10% - What\u2019s fuelling the PSU stock rally? Decoded", "full_content": "GMDC share price today: Shares of Gujarat Mineral Development Corporation (GMDC) rallied nearly 10.15% during Wednesday\u2019s trading session, as the PSU stock extended its two-day winning streak. With the rally, GMDC shares have delivered a 7.51% return over the past one week.\n\nThe recent uptick in GMDC share price has come after it dipped to its 52-week low levels post the announcement of the company's second quarter results for the financial year 2026-27.\n\nThe sharp rally during Wednesday\u2019s trading session came as the stock saw trading volume surge more than 17.28 times. GMDC shares saw 31,700 trades at 11:18 AM on Wednesday, according to BSE data. The PSU stock's slide to a 52-week low also coincided with a sharp 2.07-fold surge in trading volumes.\n\nGMDC share price dipped to its 52-week low levels of \u20b9 394.95 per share on November 2, 2026 after the PSU reported a decline in its net profit to \u20b9 170.79 crore in Q2FY27, 63% down from \u20b9 465.75 crore profit reported in the year-ago period.\n\nThe company\u2019s total income during the quarter under review increased to \u20b9 986.78 crore from \u20b9 635.76 crore in the year-ago period, as per its BSE filing.\n\nThe stock closed 10.15% higher at \u20b9 468.80 per share on BSE with a market capitalisation of \u20b9 14,907.84 crore on Wednesday, November 4. The stock has surged 7.5% over the past one week, and around 5.88% in two weeks. Its share price has declined 15.67% in three months, around 35.77% in six months, and 21.78% in 2026 so far. Despite its poor performance in the current calendar year, the PSU stock has delivered 31.13% over two years, 43.28% over three years, and 539% over five years.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 08:12 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks today: Dow Jones soars 1,000 points at open as Democrats win Congress; data center stocks slide", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: Dow Jones soars 1,000 points at open as Democrats win Congress; data center stocks slide Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks today: Dow Jones soars 1,000 points at open as Democrats win Congress; data center stocks slide SECTIONS US stocks today: Dow Jones soars 1,000 points at open as Democrats win Congress; data center stocks slide Reuters Last Updated: Nov 04, 2026, 08:11:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks opened higher on Wednesday as investors bet a divided Washington after the Democrats' midterm sweep could limit sharp policy shifts, though data center-related stocks were\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:11 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The New York Times Adds 420,000 Digital Subscribers - The New York Times", "full_content": "The New York Times Adds 420,000 Digital Subscribers The New York Times NYT stock rises on Q3 earnings as subscriber additions accelerate Quartz New York Times Revenue Rises on Digital Subscriber Gains WSJ New York Times Co. (NYT) Q3 Earnings and Revenues Surpass Estimates Yahoo Finance The New York Times stays on track to reach 15 million subscribers by the end of 2027 Nieman Journalism Lab", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 08:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Piyush Goyal sets March 2027 deadline for digitisation of DGFT services, aims to end physical visits", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Piyush Goyal sets March 2027 deadline for digitisation of DGFT services, aims to end physical visits The Economic Times daily newspaper is available online now. Read Today's Paper Piyush Goyal sets March 2027 deadline for digitisation of DGFT services, aims to end physical visits SECTIONS Piyush Goyal sets March 2027 deadline for digitisation of DGFT services, aims to end physical visits ANI Last Updated: Nov 04, 2026, 08:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Commerce Minister Piyush Goyal has set March 31, 2027, as the deadline for complete digitisation of DGFT services, including licence, permit and SCOMET approvals. From April 1, businesses will no longer need physical visits to government offices for these services. The move also includes digitising historical records and simplifying procedures.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 08:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "AMD's data center revenue nearly doubles in Q3 and CEO Su expects growth to accelerate", "full_content": "Advanced Micro Devices reported third-quarter earnings on Tuesday that beat Wall Street's expectations, with revenue jumping 45% and data center sales nearly doubling from a year earlier. The stock was up 8% in extended trading, but later pared those gains as election results came in.\n\nHere's how the chipmaker did versus LSEG consensus estimates for the quarter:\n\nRevenue increased from $9.25 billion a year earlier, AMD said in a statement . Neoclouds like CoreWeave and Nebius rallied earlier Tuesday and remained higher after AMD reported results.\n\nCEO Lisa Su said on the earnings call that she expects server revenue to double year over year in 2027 and data center AI growth to accelerate even faster than the company had projected 90 days ago. The company expects data center to drive the majority of its revenue and earnings growth.\n\n\"We have worked across our supply chain to secure the wafers, substrates, advanced packaging, memory, and other key components needed to support much higher growth next year,\" Su said on the earnings call.\n\nAMD's report comes days after Intel disclosed similar data center growth, with revenue in that segment up 78% in the third quarter. But Intel's stock plummeted 29% on Friday over concerns about weak guidance and Intel's ability to meet demand .\n\nThe data center unit makes up the majority of AMD's business, accounting for 64% of overall revenue, up from 47% a year ago.\n\nAfter years spent chasing Nvidia in the market for artificial intelligence graphics processing units, or GPUs, AMD's central processing units, or CPUs, are experiencing a major resurgence with the rise of agentic AI apps like Meta 's Muse. AMD's server CPUs are key for agentic apps because they power virtual machines and can run for hours on their own. Demand from agentic AI boosted AMD shares to a record in October.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 07:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How Saregama India shares turned music to the ears for investors after 13% price jump - How stock rallied in 2026?", "full_content": "A Ksheerasagar Published 4 Nov 2026, 07:46 PM IST Prefer Livemint on Google Music record company Saregama India saw its shares jump 13.3% in Wednesday's trade on November 4 to settle at \u20b9 637 apiece, as investors cheered the company's September-quarter performance, which came in ahead of Street estimates.\n\nThe company reported a 46.4% year-on-year (YoY) increase in its consolidated net profit to \u20b9 64.17 crore, led by its Music business and the expansion of its Live Events segment. The company's Music business, which includes licensing, artiste management and retail, reported revenue of \u20b9 251.3 crore in Q2 FY27, registering 35% YoY growth.\n\nThe Live Events business, which comprises concerts, devotional events, stand-up comedy and experiential offerings, reported revenue of \u20b9 44.7 crore, registering 101% YoY growth, supported by a higher number of events.\n\nThe company said it continued to strengthen its multi-format live entertainment portfolio, leveraging its artiste relationships and music intellectual property (IP) to engage audiences across geographies and create monetisation opportunities.\n\nMeanwhile, the Video business, which includes films, television, digital series and short-format content, reported revenue of \u20b9 18.3 crore, reflecting a moderation of 16% YoY.\n\nIts revenue from operations increased 36.63% to \u20b9 314.30 crore in the September quarter of FY27, compared with \u20b9 230 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 07:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live Updates: NHPC Profit Rises 52%, Kansai Nerolac Profit Up 9%, BSE Profit Down 7%,", "full_content": "BSE, Cummins India, Zydus Life and Apollo Tyres are among the 327 companies scheduled to announce their Q2FY27 results today. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 07:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed Wins Protection With Democrats Taking Control of the Senate - Bloomberg.com", "full_content": "Fed Wins Protection With Democrats Taking Control of the Senate Bloomberg.com Election stiffens the Fed's guardrails, but independence risks remain Reuters Kevin Warsh faces heavy lifting in preserving Fed independence Washington Times The Federal Reserve\u2019s Independence Is Assured for Now Bloomberg.com What the Democratic takeover of the Senate means for Trump Yahoo", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 07:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Wednesday", "full_content": "Were the midterms a clearing event on Wall Street?", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 07:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Uber beats on revenue even as mobility and delivery units miss estimates", "full_content": "Uber reported better-than-expected revenue but its mobility unit faced higher fuel costs overseas and tighter driver supply.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 07:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BSE Q2 Results: Profit Dips Sequentially. A 24% Fall In Derivatives Premium Turnover To Be Blamed?", "full_content": "BSE's consolidated net profit declined 7.4% sequentially to Rs 809 crore in Q2 FY27, as equity derivatives premium turnover dropped nearly 24%, according to its investor presentation.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 07:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Americans have said 'NO TO WAR,' Iran speaker says as Democrats take Congress", "full_content": "Ghalibaf said that \"Conscience or the cost of living, Americans said NO TO WAR, and we endorse this message.\"", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 07:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ather Energy among 15 stocks that hit 52-week highs and rallied up to 30% in a month", "full_content": "The Sensex gained 384 points to close at 77,301, while 15 BSE 500 stocks touched fresh 52-week highs. Ather Energy, PVR Inox, Marico and Indian Hotels featured among notable gainers, reflecting broad market momentum.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 07:07 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Balrampur Chini Q2 Results: Shareholders To Get Rs 4 Dividend After 90% Profit Jump; Check Key Numbers", "full_content": "Balrampur Chini Mills declared a dividend of Rs 4 per share.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 07:07 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sebi cancels registrations of 8 investment advisers for non-payment of renewal fees", "full_content": "Sebi has announced relaxed KYC requirements for Non-Resident Indians, Overseas Citizens of India, and foreign nationals. These changes will allow them to complete digital onboarding from FATF-compliant countries effectively. Intermediaries can accept KYC submissions without requiring physical presence in India. Video In-Person Verification is now permitted where in-person verification isn't feasible, enhancing compliance capabilities. The revised framework, effective from December 3, is aimed at simplifying the entire onboarding process.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 07:06 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Diwali 2026 Muhurat Trading stock picks: Eternal, ICICI, Titan, Radico, 7 more Samvat 2083 stocks by Shriram Research", "full_content": "Shriram Research named 11 Diwali stock picks for Samvat 2083, citing improved earnings and policy support as potential market tailwinds.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 06:57 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Uber beats on revenue even as mobility and delivery units miss estimates - CNBC", "full_content": "Uber beats on revenue even as mobility and delivery units miss estimates CNBC Uber Q3 earnings preview: Gross bookings, user growth key for investors as robotaxi spending ramps up Yahoo Finance Uber's profit forecast disappoints s and market mechanics are fundamental CFA exam areas."}, {"title": "Gold Extends US Midterms Rally Past $4,040, But Palladium Is the Quiet Outperformer. Here's Why", "full_content": "Palladium surged after Democrats secured control of both chambers of the US Congress, an outcome that had largely been anticipated.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 06:37 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "04 Nov 2026, 09:08 PM IST", "total_stories": 330};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
