    const allData = {"general": [{"title": "Iran asserts control over Hormuz as strikes on Bahrain, Saudi Arabia escalate", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 01:40 PM IST", "pub_date_relative": "6m ago"}, {"title": "WeWork India share price jumps 40% in 6 months; ICICI Direct sees 37% more gains ahead - Buy? Check Target", "full_content": "Sharmila Bhadoria Published 22 Nov 2026, 01:36 PM IST Prefer Livemint on Google WeWork India share price: Shares of WeWork India Limited ended marginally lower on Friday, Nov 20, 2026 , extending their weak trend throughout the week. Despite the decline the diversified commercial services stock has delivered 40% return in six months.\n\nThe commercial workspace provider will likely be able to self-fund annual capex of \u20b9 5-6 billion over financial year 2027-29E through its internal accruals, according to ICICI Securities report, which sees nearly 37% upside potential in the stock.\n\nWith sustained demand momentum for premium flex spaces, We Work India Management aims to take the total operational area to 13 msf in the medium term. The company\u2019s plans for a phased ramp-up, ICICI Securities model 22% revenue and EBITDA CAGR over FY26-29E.\n\n\u201cWe estimate a 22% revenue and IGAAP EBITDA CAGR (post all lease rental payments and brokerage) over FY26\u201329E, with the IGAAP EBITDA margin expanding 210bps to 21.8% in FY28E vs. 19.7% in FY26, as corporate overheads drop as a percentage of operating revenue,\u201d read the ICICI Securities report.\n\nThe brokerage maintained a \u2018Buy\u2019 rating for stock with a target price of \u20b9 933 per share. \u201cWe reiterate BUY with an unchanged TP of INR 933, based on 15x Mar\u201928E EV/EBITDA. Key risks: Office leasing slowdown and weak flex demand.\u201d\n\nThe company shares closed 1.60% lower at \u20b9 683.30 per share on BSE with a market capitalisation of \u20b9 9,497.10 crore on Friday. Its share price value declined 1.52% in one week, 2.86% in one month. The stock has surged around 40.16% in the last six months.\n\nWeWork India share price closed at a 52-week high level of \u20b9 794.20 per share on August 6, 2026. The stock dipped to its 52-week low of \u20b9 419.60 per share on March 30, 2026.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 01:36 PM IST", "pub_date_relative": "10m ago"}, {"title": "Clean Streets, Zero Gridlock: The North-Indian City That Won Over A Visiting British Vlogger", "full_content": "Designed by Le Corbusier in the 1950s, Chandigarh is India's first planned city. Its layout mirrors a human body: the Capitol Complex is the head, Sector 17 the heart, parks are the lungs, and roads form the circulatory system.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 01:34 PM IST", "pub_date_relative": "12m ago"}, {"title": "8th Pay Commission: FNPO seeks maximum four-year promotion wait for postal staff, flags vacancies and career stagnation", "full_content": "Serving central government employees might witness meaningful changes in promotion rules if the 8th Pay Commission panel accepts the proposal and ideas put forward by the Federation of National Postal Organisations (FNPO).\n\nThis is because the prominent employee union has urged the commission to cap the qualifying service required for promotions at four years, citing prolonged career stagnation and vacancies across the Department of Posts.\n\nAs per a letter dated 20 November to the 8th Pay Commission chairperson, Justice Ranjana Prakash Desai, FNPO Secretary General, Sivaji Vasireddy has sought a detailed and comprehensive review of the Department of Personnel and Training (DoPT) office memorandum issued on September 20, 2022, that specifies the qualifying service requirements for promotions.\n\nThe federation has put forward the fact that there are significant differences in the prescribed promotion timelines. As detailed in its letter, some employees are required to wait for as long as 12 years for certain promotions, whereas other movements require relatively fewer years in comparison.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 01:29 PM IST", "pub_date_relative": "17m ago"}, {"title": "Kartik Aaryan Launches Production House Dopamine Studios On 36th Birthday, Announces Film Kaaliya' With Karan Johar", "full_content": "Kaaliya marks another collaboration between Kartik Aaryan and Karan Johar following Tu Meri Main Tera Main Tera Tu Meri.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 01:28 PM IST", "pub_date_relative": "18m ago"}, {"title": "Rhenium mixed in hallmarked gold? 5 things to know about hallmarks and purity testing of yellow metal", "full_content": "A unique case in Jodhpur has raised concerns about the purity of gold ornaments, as rhenium powder mixed with gold was found carrying a 22-carat hallmark. Here we look at 5 key questions around the case \u2013 how such metals can be mixed into jewellery, whether routine testing can detect them and what buyers should check before purchasing gold.\n\nRhenium is a rare, dense metal used in industry. It is denser than gold. Hence, it can be used to increase an ornament's weight without adding the required amount of gold.\n\nThe probe in the Jodhpur case found that about one gram of rhenium powder was mixed with 7.83 grams of 24-carat gold.\n\nSo, after the ornament was made from that gold, it carried a 22-carat hallmark, but its gold content was estimated at around 20 carats.\n\nThe investigation said X-ray fluorescence (XRF) machines, which is commonly used for such detection, failed to identify the rhenium. But that does not conclude that all XRF machines will miss rhenium or that all gold jewellery is suspect.\n\nXRF testing analyses an object's surface composition and may not detect materials hidden inside.\n\nA single example is not enough of a proof to eshtablish that hallmarked gold is unreliable. BIS says purity is determined by prescribed assay methods, including fire assay, rather than by a jeweller's routine XRF scan. The reported incident raises questions about the testing and certification process.\n\nWhen buying gold, look for the BIS logo, a purity mark such as 22K916, and the six-character Hallmark Unique Identification (HUID) code. Then you can verify the HUID through the BIS Care app.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 01:23 PM IST", "pub_date_relative": "23m ago"}, {"title": "5 big analyst AI moves: Nvidia downgrade, Anthropic seen as \u2019generational company\u2019", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 01:14 PM IST", "pub_date_relative": "32m ago"}, {"title": "Agniveers Could Be Allowed To Marry After Four Years Under Proposed Rule Changes", "full_content": "Women Agniveers serving under the Agnipath recruitment scheme could receive flexibility to marry and start families during service", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 01:13 PM IST", "pub_date_relative": "33m ago"}, {"title": "$16 Billion In One Month: How The US-Iran-Led Crude Oil Spike Inflated India's Energy Bill", "full_content": "Brent crude averaged $124.77 a barrel in October, compared with $64.75 a year earlier and $116.77 in September.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 01:01 PM IST", "pub_date_relative": "44m ago"}, {"title": "Ellington Financial CEO Penn buys $106,540 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 01:01 PM IST", "pub_date_relative": "45m ago"}, {"title": "BRC Group Holdings chairman Riley buys $116,767 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 01:01 PM IST", "pub_date_relative": "45m ago"}, {"title": "Bitcoin struggles below $60,000 as mining profits plunge, security risks grow", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 12:59 PM IST", "pub_date_relative": "46m ago"}, {"title": "Beyond Oil Prices: British Swimmer Risks Life In Strait of Hormuz To Expose US-Iran War's Toll On Marine Life", "full_content": "Sharing a video of his journey, Pugh revealed that an oil tanker was struck just a few kilometres away, barely 30 minutes after he began swimming.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:47 PM IST", "pub_date_relative": "59m ago"}, {"title": "Anirudh-Kavya Wedding Reception: Tamil Nadu CM Vijay And Sangeetha Attend Ceremony Separately", "full_content": "Sangeetha arrived earlier in the evening, while Vijay reached the venue after attending another function. The two were not seen together.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mahindra Last Mile Mobility Eyes IPO In 18 Months; Plans Expansion Into New Products: Chairman", "full_content": "In an interview to PTI, Jejurikar, also the Executive Director and CEO of Mahindra & Mahindra's Auto and Farm Sectors, said Mahindra Last Mile Mobility, which already has a valuation of around USD 1 billion, has two investors on board, with a third expected to come in shortly.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Watch: Pakistani Actress Veena Malik Breaks Down On TV Over Body-Shaming, Removes Makeup On Camera", "full_content": "The 42-year-old actress was visible distressed while discussing negative comments she had received about her weight, height and appearance", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "India A vs Pakistan A Live Streaming: When And Where To Watch Asia Cup Rising Stars Match?", "full_content": "Tilak Varma-led India A will take on defending ng respondents, 21% name FDs their first choice, against 6% each for PPF and government bonds and 2% for corporate bonds.\n\nWhen asked what they would do with an unexpected lump sum , 32% said they would invest it in higher-growth options such as equities or MFs and 25% in a fixed-income product, so 57% would invest it.\n\nAnother 11% would reduce debt, so 87% would invest, save, or pay down debt with it. Only 13% would spend it: 8% on travel or an experience and 5% on a luxury purchase. Putting windfalls to work may reflect a response to the times.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 12:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Will economics continue to outweigh geopolitics?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 12:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi Records 'Poor\u2019 AQI, Despite Marginal Dip: Check Most-Polluted Locations", "full_content": "Out of 68,137 complaints, 61,507 were resolved. Inspections at 8,874 construction sites found violations at 554 locations, leading to 112 closures, 462 show-cause notices, and over Rs 2.65 crore in environmental penalties.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "What is future of gold rates? Price crash continues as AI selloff, Fed rate-hike concerns weigh on investors' sentiment", "full_content": "Gold prices continue to decline for the fifth day as the bullion witnessed its biggest weekly decline since March to multi-month low levels. US Federal Reserve\u2019s interest rate hike, route in AI stocks spurred selling across metal markets, crude oil price volatility weighed on the investors sentiment.\n\nOn Multi Commodity Exchange (MCX), Gold futures with December expiry closed 4.32% lower at \u20b9 1,21,949 per 10 gram on Friday, November 20.\n\nExpectations of US Federal Reserve rate hike in December, geopolitical uncertainty, stronger US Dollar, hawkish signals from US Fed, and global AI-linked stock market selloff have impacted investors sentiment. Concerns around sticky inflation have also weighed on the yellow metal\u2019s prices.\n\n\u201cGold and silver are witnessing heavy selling pressure, with gold heading towards its steepest weekly decline in eight months and silver extending its correction amid rising US interest-rate expectations. The US dollar is holding near a 19-month high, while elevated Treasury yields are reducing the attractiveness of non-yielding precious metals,\u201d stated Gaurav Garg, Head Research Lemonn.\n\nBullion tumbled on Friday as it traded near $ 3,500 per ounce. The precious metal lost nearly 9% this week, after hitting its lowest level since September 2025. Meanwhile, s ilver has fallen over 15% in the past five sessions.\n\nThe sharp decline in gold prices has taken the yellow metal below $ 4,100 per ounce, a level some investors believed would provide a floor for bullion, with support from central-bank purchases and other dip-buyers.\n\nThe precious metals are likely to remain volatile in the coming week, with US dollar movements any update by US Fed officials would set the direction for gold, according to Rajeev Sharan, Head of Research, Brickwork Ratings.\n\n\u201cWith Federal Reserve commentary and US dollar movements setting the direction. While further near-term pressure cannot be ruled out, steep recent declines could spark brief rebounds.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 12:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "China's $1.7 Trillion AI Rout Turns Hot Trade Into Losing Bet", "full_content": "The unraveling of the global AI boom has hit China particularly hard, as frothy valuations and reliance on policy support left stocks vulnerable once cracks emerged.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Distressing Scenes At Seattle Airport, Woman Screams As ICE Agents Detain Passengers: Watch Video", "full_content": "US ICE officials claimed that the situation escalated when another passenger allegedly threw hot coffee at officers attempting to arrest an immigrant.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "InvIT IPO rush gathers pace; 4-5 private trusts likely to go public by Mar 2027", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a InvIT IPO rush gathers pace; 4-5 private trusts likely to go public by Mar 2027 Pioneer Investcorp Share Price Inventure Growth & Securities Share Price Motor & General Finance Share Price Mukesh Babu Financial Services Share Price BLB Share Price The Economic Times daily newspaper is available online now. Read Today's Paper InvIT IPO rush gathers pace; 4-5 private trusts likely to go public by Mar 2027 SECTIONS InvIT IPO rush gathers pace; 4-5 private trusts likely to go public by Mar 2027 PTI Last Updated: Nov 22, 2026, 12:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Four to five Infrastructure Investment Trusts are expected to launch public offerings to raise Rs 17,000 crore by 2027. These offerings aim to mobilise long-term capital for infrastructure development while appealing to a broader pool of investors. Notable companies like Brookfield and Investcorp are preparing to shift to public InvITs. In the past, InvITs raised around Rs 88,000 crore, demonstrating investor appetite.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Australia rejects U.S. budget office concerns over AUKUS submarine deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 12:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold and silver have crashed. Should investors buy the dip or wait?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAfter a sharp rally in 2024 and 2025, gold and silver prices have corrected steeply this year. Gold exchange-traded funds (ETFs) have fallen about 30% from their January peaks, while silver ETFs have crashed around 58%. Investors who entered at the top are sitting on deep losses.\n\nSo, is this the time to cut losses or an opportunity to build a position? Experts say the answer lies less in the metals themselves and more in the macroeconomic backdrop: interest rates, inflation, the dollar and central-bank buying.\n\nThe pressure on both metals starts with the cost of money. \"In the short term, what is pressuring prices is the Fed's interest rate expectations. The market is still expecting further interest rate hikes beyond 2026,\" said Tapan Patel, fund manager\u2013commodities, Tata Mutual Fund.\n\n\"December rate hike is already factored in, but the market is now speculating rate hikes in 2027, and the bond market is reacting to that as well,\" he added.\n\nWhen bond yields rise, income-generating assets such as bonds become more attractive, reducing the relative appeal of gold and silver, which do not generate any income.\n\nInflation is one reason the US Federal Reserve (Fed) is likely to stay hawkish. \"The Fed's target is 2%, and they are still away from it. The Iran situation is still hot, so until the war is resolved, we may expect inflation to remain up and the US Fed to continue its hawkish stance,\" Patel pointed out.\n\nNimesh Chandan, chief investment officer at Bajaj AMC, traces the correction to the same chain of events. A higher inflation print has made central banks, mainly the Fed, extremely hawkish, he explained. That pushes up the cost of money and strengthens the dollar, while asset prices come down.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "5 penny stocks plunge up to 68% in six months. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 5 penny stocks plunge up to 68% in six months. Do you own any? Written by Rounak Khare , ETMarkets.com | Nov 22, 2026, 12:11:13 PM IST 1 / 6 Deep Corrections Over the past six months, five penny stocks from the BSE Smallcap index have corrected sharply, falling between 21% and 68%. These stocks were identified through a screen of companies with a market capitalisation of less than Rs 1,000 crore, a share price below Rs 20 and a minimum recent trading volume of 5 lakh shares. The screen captures low-priced, relatively liquid penny stocks that have witnessed significant price declines during the period. (Data Source: ACE Equity).", "source": "Economic Times Markets", "pub_date_str": "22 Nov 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "EPFO: How SWP will ensure regular income for you even after retirement, PM Modi\u2019s minister explains; \u2018Gift for workers\u2019", "full_content": "The planning for retirement does not end with simply accumulating a sizeable corpus. This is because making sure that you receive a regular flow of income after your retirement is equally important, particularly when salaried employees no longer receive a monthly salary, and with advancing age, the possibility of generating higher income also fades.\n\nTo equip Employees\u2019 Provident Fund Organisation (EPFO) members to address such situations, the EPFO is focusing on the Systematic Withdrawal Plan (SWP) as a meaningful way to meet this requirement.\n\nUnion Labour and Employment Minister Mansukh Mandaviya highlighted the potential benefit of SWP and the value it adds for EPFO subscribers in a post on X on 21 November, describing it as an important and meaningful change for EPFO members under the leadership of the Prime Minister.\n\n\u092a\u0940\u090f\u092e \u092e\u094b\u0926\u0940 \u091c\u0940 \u0915\u0947 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u092e\u0947\u0902 EPFO \u0915\u0940 \u0915\u0930\u094b\u0921\u093c\u094b\u0902 \u0936\u094d\u0930\u092e\u093f\u0915\u094b\u0902 \u0915\u094b \u0938\u094c\u0917\u093e\u0924! \u091c\u093e\u0928\u093f\u090f \u0915\u0948\u0938\u0947 SWP \u0930\u093f\u091f\u093e\u092f\u0930\u092e\u0947\u0902\u091f \u0915\u0947 \u092c\u093e\u0926 \u092d\u0940 \u0906\u092a\u0915\u0940 \u0928\u093f\u092f\u092e\u093f\u0924 \u0906\u092f \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0947\u0917\u093e\u0964\n\n\"Under the leadership of PM Modi, EPFO brings a gift for crores of workers! Find out how SWP will ensure a regular income for you even after retirement.\"\n\nIt is vital to keep in mind that the proposal was approved at the 240th meeting of the EPFO\u2019s Central Board of Trustees (CBT), which was chaired by Mandaviya, on 19 November, 2026, as detailed in a press release by the Press Information Bureau (PIB).\n\nAs per the proposed arrangement, retiring employees will be able to receive their accumulated Employees\u2019 Provident Fund (EPF) savings in monthly, quarterly or half-yearly instalments instead of withdrawing the entire amount at once.\n\nThe most important advantage of this set-up is that the funds remaining in an individual\u2019s EPF account will continue to generate interest at the applicable EPF rate. This highlights that retirees can access a portion of their savings periodically while allowing the unwithdrawn corpus to continue growing.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 12:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "COP31 climate talks close to final deal, says summit president", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "India May Be The 'Anti-AI' Trade. UBS' Gautam Chhaocharia Names The Sectors That Could Benefit | Profit Exclusive", "full_content": "In an exclusive interview with NDTV Profit, Gautam Chhaocharia, Head of Global Markets at UBS India, discusses why the bank sees India as a potential \"anti-AI\" diversifier, which sectors could benefit over the next 12-18 months, and what investors should watch as global market dynamics shift.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ramayana Outruns Dhurandhar 2, Becomes First Non-Kannada Film To Cross Rs 150 Crore In Karnataka", "full_content": "The next two targets for Ramayana are separated by just Rs 64 lakh. Yash's KGF Chapter 2 grossed Rs 182.96 crore in Karnataka, putting it roughly Rs 28 crore ahead of Ramayana.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 11:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "China urges U.S. to withdraw telecom restrictions on phone number access", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 11:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Government, corporate spending to sustain global growth in 2027 as inflation eases: JPMorgan", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Government, corporate spending to sustain global growth in 2027 as inflation eases: JPMorgan The Economic Times daily newspaper is available online now. Read Today's Paper Government, corporate spending to sustain global growth in 2027 as inflation eases: JPMorgan SECTIONS Government, corporate spending to sustain global growth in 2027 as inflation eases: JPMorgan ANI Last Updated: Nov 22, 2026, 11:41:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Global economic growth is projected to be resilient in 2027 due to continued government investment and corporate spending. Investment in technology and recovery in consumer demand are expected to drive this growth forward. Corporate investment, especially in artificial intelligence, is noteworthy, with major firms planning significant expenditure. Inflation pressures are anticipated to ease, strengthening household spending. However, rising government borrowing and competition for capital may pose challenges for financial markets.\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "22 Nov 2026, 11:41 AM IST", "pub_date_relative": "2h ago"}, {"title": "Is the AI boom losing its grip on emerging markets? Jefferies flags risks", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 11:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "Anirudh Ravichander-Kavya Maran Wedding Reception: Couple Bring Royal Elegance In First Appearance As Newlyweds", "full_content": "Kavya wore a scarlet-red ensemble with floral embroidery and beadwork, paired with understated jewellery. Anirudh complemented her in a burgundy-and-black embroidered bandhgala and trousers, blending contemporary style with a regal aesthetic.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Quantum computing\u2019s first real-world payoff may come in energy, not drug discovery", "full_content": "For years, the case for quantum computing has rested on ambitious promises, from discovering new drugs by simulating how molecules behave to optimizing supply chains and airline schedules. Many of the biggest aims are still likely to be years, if not decades, away.\n\nBut quantum software, which uses algorithms designed to solve complex problems faster than conventional computers, is already being tested on a more immediate challenge: the energy transition, from keeping power grids stable to finding better materials for solar cells and hydrogen production.\n\nPhasecraft, a quantum software company founded in Bristol, England, in 2019, is one of the firms putting the technology to work in energy. It raised $34 million in Series B funding in 2025, and in September this year announced plans to set up U.S. headquarters in Arlington, Virginia .\n\nThere are enormous opportunities to solve problems that are both important for energy security and commercially valuable, Ashley Montanaro, co-founder and CEO of Phasecraft, told CNBC.\n\nPhasecraft isn't alone in applying quantum software to the energy industry.\n\nQuantinuum, which was formed by the merger of Cambridge Quantum and Honeywell Quantum Solutions and listed on Nasdaq in June, is using the technology to model materials for hydrogen fuel cells for transportation. It is also working with partners on materials for carbon capture.\n\nAnother U.K. player, ORCA Computing, a spinout from the University of Oxford, has partnered with BP to better understand how a molecule's physical, chemical and biological properties are governed. That could help explain how biofuels burn and how to make them burn more efficiently\n\nIn a separate project, ORCA worked with Japanese software company JIJ on a challenge power companies face : deciding which generators to switch on or off, and when, to meet demand at the lowest cost.", "source": "CNBC World Economy", "pub_date_str": "22 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Was Trump\u2019s news conference with Vance and Rubio an audition for 2028? - The Washington Post", "full_content": "Was Trump\u2019s news conference with Vance and Rubio an audition for 2028? The Washington Post", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Gold crashes 31%, silver plunges 64%: How much your \u20b910 lakh investment shrunk since January peak, what lies ahead?", "full_content": "The gold and silver rally has turned from a fine dream to a nightmare in just a matter of 1 year, between 2025 and 2026. After scaling unprecedented highs in January, both precious metals have suffered a sharp correction, wiping out a major chunk of money from investors portfolio.\n\nGold has fallen 31.5%, meanwhile silver has plunged 64.2% from its January peak. The correction also anguished investors (including those who invested in exchange-traded funds or ETFs), who bought the precious metal at a high price.\n\nIf you had invested \u20b9 10 lakh in gold at its January peak, it would be worth around \u20b9 6.85 lakh at November 20 prices, a similar investment in silver would have shrunk to approximately \u20b9 3.58 lakh in just 10 months.\n\nGold had surged to nearly $5,600 an ounce in January before retreating below $4,000 and subsequently recovering. Silver, which had crossed $100 an ounce, suffered an even more punishing reversal. Since India imports much of its bullion, domestic prices closely track international markets, with movements in the rupee adding another layer of volatility.\n\nUnlike the largely one-way rally of 2025, 2026 has been marked by sharp swings. Changing expectations around US interest rates, persistent inflation, elevated bond yields, a stronger dollar and geopolitical uncertainty have repeatedly unsettled precious metal markets.\n\nNavneet Damani, Head of Research \u2013 Commodities at Motilal Oswal Financial Services, told Indian Express, that gold continues to retain its importance as a defensive asset amid global economic and geopolitical uncertainty. However, its near-term trajectory will remain sensitive to US Federal Reserve policy, inflation, the dollar and real bond yields.\n\nThe September 25-basis-point Fed rate hike, taking the policy rate to 3.75-4%, has reinforced concerns over tighter monetary conditions, Damani said.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago"}, {"title": "Reliance Brands FY26 revenue up 3.8% to Rs 3,390.9 crore; loss narrows to Rs 137 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Reliance Brands FY26 revenue up 3.8% to Rs 3,390.9 crore; loss narrows to Rs 137 crore The Economic Times daily newspaper is available online now. Read Today's Paper Reliance Brands FY26 revenue up 3.8% to Rs 3,390.9 crore; loss narrows to Rs 137 crore SECTIONS Reliance Brands FY26 revenue up 3.8% to Rs 3,390.9 crore; loss narrows to Rs 137 crore PTI Last Updated: Nov 22, 2026, 11:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reliance Brands has marked a significant financial milestone, achieving a revenue of Rs 3,390.89 crore for FY26 and reducing losses. Operating more than 1,085 Points of Sale nationwide, the brand continues to collaborate with over 90 partner names. Recent acquisitions, including Hamleys and new entries like Stella McCartney and Fabletics, demonstrate the company\u2019s drive to lead in the competitive fashion and lifestyle industry.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Nov 2026, 11:14 AM IST", "pub_date_relative": "2h ago"}, {"title": "Amitabh Bachchan's Jalsa Row Could Happen To You Too. A CA Explains 3 Mistakes To Avoid", "full_content": "Originally called Mansa, the bungalow reportedly belonged to producer N.C. Sippy before being given to Amitabh as payment for Satte Pe Satta (1982). He later sold it, bought it back and renamed it Jalsa, according to published accounts.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 11:04 AM IST", "pub_date_relative": "2h ago"}, {"title": "Maruti Suzuki Declares Fourth Price Hike In 2026: Cars To Get Costlier From Nov. 22", "full_content": "Maruti Suzuki has implemented multiple price hikes across its vehicle lineup in 2026 to offset rising input and production costs.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 11:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "Rishabh Pant Achieves Rare SENA Milestone As India Ends Historic 93-year Test Wait In New Zealand", "full_content": "Rishabh Pant scored his ninth Test century, placing him third among wicketkeepers behind Adam Gilchrist (17) and Andy Flower (12). Surpassing Brendon McCullum's 107 sixes, Pant is now second all-time behind Ben Stokes with 108.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 10:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018Don\u2019t treat employees like children\u2019: Spotify continues Work-From-Anywhere policy; how it helps the company, money-wise", "full_content": "While most big companies have moved back to the office, Spotify is sticking with its Work From Anywhere policy, introduced in February 2021. Employees can work from home, use an office or agree on a mix with managers. Spotify\u2019s HR chief, Katarina Berg, said in an October 2024 interview with Raconteur that companies should trust the adults they hire. She warned against hiring \u201cgrown-ups\u201d and then treating them \u201clike children\u201d.\n\nThat trust has a financial side. Fewer people using offices every day gives Spotify room to cut property costs. Lower staff turnover can also reduce the need to find and train replacements. Spotify has yet to disclose how much the policy saves after expenses. But here are some estimates.\n\nIn 2023, Spotify started reviewing how much office space it needed worldwide. It sought to rent out unused space at New York\u2019s 4 World Trade Center. Giving up space can reduce future rent payments, utility bills and maintenance costs. Subletting can also bring in income while a lease is still running.\n\nThe change came with upfront accounting charges. Spotify\u2019s filings show a \u20ac90 million property write-down in the second quarter of 2023. It recorded \u20ac43 million in property write-downs in 2024 and \u20ac8 million in 2025.\n\nThese charges lowered the value of office assets in Spotify\u2019s accounts. They weighed on reported earnings without requiring an equivalent cash payment when Spotify recorded them.\n\nKeeping staff for longer offers another financial benefit. Spotify\u2019s employee departure rate was 15% lower in the second quarter of 2022. The company compared that quarter with the same period in 2019, before the pandemic.\n\nSpotify also reported that its average hiring time fell by six days. A shorter hiring process can reduce the time recruiters and managers spend filling vacancies.\n\nThe policy also gives Spotify a wider pool of candidates. Its hiring can reach people who live far from an office. Employees have flexibility to move within markets where Spotify operates.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 10:57 AM IST", "pub_date_relative": "2h ago"}, {"title": "Top 3 stocks to buy: Swiggy, Tata Chemicals, Amber Enterprises by Ganesh Dongre of Anand Rathi | Targets, stop-loss", "full_content": "SWIGGY AMBER Asit Manohar Published 22 Nov 2026, 10:44 AM IST Prefer Livemint on Google Stocks to buy | Ganesh Dongre's stock recommendations: The key benchmark indices of the Indian stock market ended the week on a strong positive note, with the Nifty gaining nearly 2.50% to close at 25,800, while the Bank Nifty witnessed a sharp rally of approximately 6%, settling at 64,635. Meanwhile, Brent crude oil prices declined towards $92 per barrel, providing significant relief to global markets.\n\nSectoral performance remained broadly positive, with most major sectors gaining between 1% and 5%. Banking and cement emerged as the top-performing sectors, rallying nearly 4% during the week. Meanwhile, India VIX continues to trade around the 16 mark, suggesting that volatility remains relatively elevated despite the sharp recovery in the equity markets. Global developments, particularly developments in the Middle East and US\u2013Iran relations, along with movements in crude oil prices, will remain important factors influencing market sentiment.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi, believes the Indian stock market bias has improved, as the Nifty 50 index has witnessed a remarkable recovery of more than 15%, supported by strong buying interest at lower levels. The 50-stock index rebounded from the 22,200\u201322,500 support zone, recovered above its 200-day moving average and subsequently crossed the crucial psychological mark of 25,000. The recovery gained further momentum as the Nifty moved above its previous monthly high of 24,700 and approached its February 2026 high, indicating a significant improvement in overall market sentiment.\n\nSpeaking on the outlook for the Nifty 50 index, Ganesh Dongre of Anand Rathi said the Nifty has maintained a strong bullish structure, consistently forming higher highs and higher lows on the weekly chart. Having surpassed its earlier resistance levels of 23,200, 24,700 and 25,500\u201325,600, the index has now closed at 25,800.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 10:44 AM IST", "pub_date_relative": "3h ago"}, {"title": "Equity LTCG tax abolition: Will scrapping capital gains tax boost FPI inflows, mutual fund investments? CA explains", "full_content": "Scrapping the long-term capital gains (LTCG) tax on equity investments could improve post-tax returns for investors, along with the current market sentiment. Such a step, if introduced, could make Indian equities more attractive to foreign investors and domestic households.\n\nStill, the critical question remains: Will abolishing the tax be enough to reverse foreign portfolio (FPI) outflows and boost mutual fund investments?\n\nCA Suresh Surana touched upon these aspects and explained how removing the tax could support investment activity, but the government would also have to consider the revenue implications.\n\nOn this, Surana stated, \u201cRemoving LTCG tax could improve investors\u2019 post-tax returns and make Indian equities more attractive to some foreign investors. SBI Research has suggested that this could help encourage longer-term investment, but it does not establish that removing the tax would, by itself, reverse FPI outflows or reduce market volatility .\u201d\n\nNot only this, he further added, \"FPI decisions also reflect company valuations and earnings prospects, global interest rates, currency movements and broader risk sentiment. These factors can outweigh a tax change, particularly during periods of global uncertainty.\"\n\nThese observations underline the significance of balancing LTCG taxation in a way that keeps Indian equities lucrative for both FPIs and domestic investors, and also ensures that India's taxation model further facilitates long-term investments.\n\nSurana believes scrapping the tax could encourage greater household participation in equities and broaden the investment base. Therefore, the government should consider adequately incentivising equity investments.\n\nExplaining this, he said, \"Scrapping LTCG tax on equities may improve investors\u2019 post-tax returns and make equity investments, including equity mutual funds, more attractive. It may encourage some households to allocate more savings to equities and could support mutual fund inflows.\"", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 10:35 AM IST", "pub_date_relative": "3h ago"}, {"title": "Nasdaq Wipes Out 2026 Gains As S&P, Dow Sink Into Correction: Top Five Drags Behind The Selloff", "full_content": "On Friday, all three indices settled in the red, with Nasdaq down over 5%, S&P 500 down nearly 4%, and Dow Jones down 2%.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 10:33 AM IST", "pub_date_relative": "3h ago"}, {"title": "Argentina\u2019s borrowing costs jump as Milei\u2019s falling popularity rattles investors", "full_content": "Libertarian\u2019s financing plans and declining approval ratings damp spirits ahead of re-election bid", "source": "FT Markets", "pub_date_str": "22 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "Tech suppliers raise AI server prices up to 45% months after deals are signed", "full_content": "Dell, HPE, Lenovo and Supermicro demand more for equipment, with the increased costs hitting trading firms", "source": "FT Markets", "pub_date_str": "22 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "Private equity backers flag fresh concerns about sell-to-yourself deals", "full_content": "Co-investors in buyout funds frustrated at being forced out when assets are sold into continuation vehicles", "source": "FT Markets", "pub_date_str": "22 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "WeWork India share price jumps 40% in 6 months; ICICI Direct sees 37% more gains ahead - Buy? Check Target", "full_content": "Sharmila Bhadoria Published 22 Nov 2026, 01:36 PM IST Prefer Livemint on Google WeWork India share price: Shares of WeWork India Limited ended marginally lower on Friday, Nov 20, 2026 , extending their weak trend throughout the week. Despite the decline the diversified commercial services stock has delivered 40% return in six months.\n\nThe commercial workspace provider will likely be able to self-fund annual capex of \u20b9 5-6 billion over financial year 2027-29E through its internal accruals, according to ICICI Securities report, which sees nearly 37% upside potential in the stock.\n\nWith sustained demand momentum for premium flex spaces, We Work India Management aims to take the total operational area to 13 msf in the medium term. The company\u2019s plans for a phased ramp-up, ICICI Securities model 22% revenue and EBITDA CAGR over FY26-29E.\n\n\u201cWe estimate a 22% revenue and IGAAP EBITDA CAGR (post all lease rental payments and brokerage) over FY26\u201329E, with the IGAAP EBITDA margin expanding 210bps to 21.8% in FY28E vs. 19.7% in FY26, as corporate overheads drop as a percentage of operating revenue,\u201d read the ICICI Securities report.\n\nThe brokerage maintained a \u2018Buy\u2019 rating for stock with a target price of \u20b9 933 per share. \u201cWe reiterate BUY with an unchanged TP of INR 933, based on 15x Mar\u201928E EV/EBITDA. Key risks: Office leasing slowdown and weak flex demand.\u201d\n\nThe company shares closed 1.60% lower at \u20b9 683.30 per share on BSE with a market capitalisation of \u20b9 9,497.10 crore on Friday. Its share price value declined 1.52% in one week, 2.86% in one month. The stock has surged around 40.16% in the last six months.\n\nWeWork India share price closed at a 52-week high level of \u20b9 794.20 per share on August 6, 2026. The stock dipped to its 52-week low of \u20b9 419.60 per share on March 30, 2026.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 01:36 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rhenium mixed in hallmarked gold? 5 things to know about hallmarks and purity testing of yellow metal", "full_content": "A unique case in Jodhpur has raised concerns about the purity of gold ornaments, as rhenium powder mixed with gold was found carrying a 22-carat hallmark. Here we look at 5 key questions around the case \u2013 how such metals can be mixed into jewellery, whether routine testing can detect them and what buyers should check before purchasing gold.\n\nRhenium is a rare, dense metal used in industry. It is denser than gold. Hence, it can be used to increase an ornament's weight without adding the required amount of gold.\n\nThe probe in the Jodhpur case found that about one gram of rhenium powder was mixed with 7.83 grams of 24-carat gold.\n\nSo, after the ornament was made from that gold, it carried a 22-carat hallmark, but its gold content was estimated at around 20 carats.\n\nThe investigation said X-ray fluorescence (XRF) machines, which is commonly used for such detection, failed to identify the rhenium. But that does not conclude that all XRF machines will miss rhenium or that all gold jewellery is suspect.\n\nXRF testing analyses an object's surface composition and may not detect materials hidden inside.\n\nA single example is not enough of a proof to eshtablish that hallmarked gold is unreliable. BIS says purity is determined by prescribed assay methods, including fire assay, rather than by a jeweller's routine XRF scan. The reported incident raises questions about the testing and certification process.\n\nWhen buying gold, look for the BIS logo, a purity mark such as 22K916, and the six-character Hallmark Unique Identification (HUID) code. Then you can verify the HUID through the BIS Care app.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 01:23 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "$16 Billion In One Month: How The US-Iran-Led Crude Oil Spike Inflated India's Energy Bill", "full_content": "Brent crude averaged $124.77 a barrel in October, compared with $64.75 a year earlier and $116.77 in September.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 01:01 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bitcoin struggles below $60,000 as mining profits plunge, security risks grow", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 12:59 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Mahindra Last Mile Mobility Eyes IPO In 18 Months; Plans Expansion Into New Products: Chairman", "full_content": "In an interview to PTI, Jejurikar, also the Executive Director and CEO of Mahindra & Mahindra's Auto and Farm Sectors, said Mahindra Last Mile Mobility, which already has a valuation of around USD 1 billion, has two investors on board, with a third expected to come in shortly.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why investors show preference for mutual funds, fixed deposits? Expert explains \u2014 FDs remain king of fixed income", "full_content": "Indians have a strong saving habit with 83% of the adults surveyed currently saving or investing , where 80% use a digital platform and about 65% start the process by age 30, according to the \u2018How India Saves 2026\u2019 report.\n\nThe survey of 1,212 urban Indian adults across over 150 cities and towns by fixed-income investment platform Stable Money and global research data and analytics group YouGov noted that close to half of women savers now call the shots on household money, Gen Z is saving for a home, and Gen X is focused on retirement.\n\nRespondents when asked about their preferred investment product answered as follows:\n\nAs per the report, the near tie between mutual funds and fixed deposits indicates that savers as a group value both predictability and growth. \u201cThe platforms that earn the trust of Indian savers will be the ones that make every choice easy to understand, and honest about its terms,\u201d it added.\n\nThis is also visible when it comes to fixed income options, where FDs remain king and take top place, with a clear margin: 56% place bank FDs and RDs in their top three, nearly three times as often as the public provident fund i.e. PPF (20%), government bonds (19%) and corporate bonds (7%), as per the survey.\n\nAmong respondents, 21% name FDs their first choice, against 6% each for PPF and government bonds and 2% for corporate bonds.\n\nWhen asked what they would do with an unexpected lump sum , 32% said they would invest it in higher-growth options such as equities or MFs and 25% in a fixed-income product, so 57% would invest it.\n\nAnother 11% would reduce debt, so 87% would invest, save, or pay down debt with it. Only 13% would spend it: 8% on travel or an experience and 5% on a luxury purchase. Putting windfalls to work may reflect a response to the times.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 12:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "What is future of gold rates? Price crash continues as AI selloff, Fed rate-hike concerns weigh on investors' sentiment", "full_content": "Gold prices continue to decline for the fifth day as the bullion witnessed its biggest weekly decline since March to multi-month low levels. US Federal Reserve\u2019s interest rate hike, route in AI stocks spurred selling across metal markets, crude oil price volatility weighed on the investors sentiment.\n\nOn Multi Commodity Exchange (MCX), Gold futures with December expiry closed 4.32% lower at \u20b9 1,21,949 per 10 gram on Friday, November 20.\n\nExpectations of US Federal Reserve rate hike in December, geopolitical uncertainty, stronger US Dollar, hawkish signals from US Fed, and global AI-linked stock market selloff have impacted investors sentiment. Concerns around sticky inflation have also weighed on the yellow metal\u2019s prices.\n\n\u201cGold and silver are witnessing heavy selling pressure, with gold heading towards its steepest weekly decline in eight months and silver extending its correction amid rising US interest-rate expectations. The US dollar is holding near a 19-month high, while elevated Treasury yields are reducing the attractiveness of non-yielding precious metals,\u201d stated Gaurav Garg, Head Research Lemonn.\n\nBullion tumbled on Friday as it traded near $ 3,500 per ounce. The precious metal lost nearly 9% this week, after hitting its lowest level since September 2025. Meanwhile, s ilver has fallen over 15% in the past five sessions.\n\nThe sharp decline in gold prices has taken the yellow metal below $ 4,100 per ounce, a level some investors believed would provide a floor for bullion, with support from central-bank purchases and other dip-buyers.\n\nThe precious metals are likely to remain volatile in the coming week, with US dollar movements any update by US Fed officials would set the direction for gold, according to Rajeev Sharan, Head of Research, Brickwork Ratings.\n\n\u201cWith Federal Reserve commentary and US dollar movements setting the direction. While further near-term pressure cannot be ruled out, steep recent declines could spark brief rebounds.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 12:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "InvIT IPO rush gathers pace; 4-5 private trusts likely to go public by Mar 2027", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a InvIT IPO rush gathers pace; 4-5 private trusts likely to go public by Mar 2027 Pioneer Investcorp Share Price Inventure Growth & Securities Share Price Motor & General Finance Share Price Mukesh Babu Financial Services Share Price BLB Share Price The Economic Times daily newspaper is available online now. Read Today's Paper InvIT IPO rush gathers pace; 4-5 private trusts likely to go public by Mar 2027 SECTIONS InvIT IPO rush gathers pace; 4-5 private trusts likely to go public by Mar 2027 PTI Last Updated: Nov 22, 2026, 12:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Four to five Infrastructure Investment Trusts are expected to launch public offerings to raise Rs 17,000 crore by 2027. These offerings aim to mobilise long-term capital for infrastructure development while appealing to a broader pool of investors. Notable companies like Brookfield and Investcorp are preparing to shift to public InvITs. In the past, InvITs raised around Rs 88,000 crore, demonstrating investor appetite.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold and silver have crashed. Should investors buy the dip or wait?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAfter a sharp rally in 2024 and 2025, gold and silver prices have corrected steeply this year. Gold exchange-traded funds (ETFs) have fallen about 30% from their January peaks, while silver ETFs have crashed around 58%. Investors who entered at the top are sitting on deep losses.\n\nSo, is this the time to cut losses or an opportunity to build a position? Experts say the answer lies less in the metals themselves and more in the macroeconomic backdrop: interest rates, inflation, the dollar and central-bank buying.\n\nThe pressure on both metals starts with the cost of money. \"In the short term, what is pressuring prices is the Fed's interest rate expectations. The market is still expecting further interest rate hikes beyond 2026,\" said Tapan Patel, fund manager\u2013commodities, Tata Mutual Fund.\n\n\"December rate hike is already factored in, but the market is now speculating rate hikes in 2027, and the bond market is reacting to that as well,\" he added.\n\nWhen bond yields rise, income-generating assets such as bonds become more attractive, reducing the relative appeal of gold and silver, which do not generate any income.\n\nInflation is one reason the US Federal Reserve (Fed) is likely to stay hawkish. \"The Fed's target is 2%, and they are still away from it. The Iran situation is still hot, so until the war is resolved, we may expect inflation to remain up and the US Fed to continue its hawkish stance,\" Patel pointed out.\n\nNimesh Chandan, chief investment officer at Bajaj AMC, traces the correction to the same chain of events. A higher inflation print has made central banks, mainly the Fed, extremely hawkish, he explained. That pushes up the cost of money and strengthens the dollar, while asset prices come down.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "5 penny stocks plunge up to 68% in six months. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 5 penny stocks plunge up to 68% in six months. Do you own any? Written by Rounak Khare , ETMarkets.com | Nov 22, 2026, 12:11:13 PM IST 1 / 6 Deep Corrections Over the past six months, five penny stocks from the BSE Smallcap index have corrected sharply, falling between 21% and 68%. These stocks were identified through a screen of companies with a market capitalisation of less than Rs 1,000 crore, a share price below Rs 20 and a minimum recent trading volume of 5 lakh shares. The screen captures low-priced, relatively liquid penny stocks that have witnessed significant price declines during the period. (Data Source: ACE Equity).", "source": "Economic Times Markets", "pub_date_str": "22 Nov 2026, 12:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India May Be The 'Anti-AI' Trade. UBS' Gautam Chhaocharia Names The Sectors That Could Benefit | Profit Exclusive", "full_content": "In an exclusive interview with NDTV Profit, Gautam Chhaocharia, Head of Global Markets at UBS India, discusses why the bank sees India as a potential \"anti-AI\" diversifier, which sectors could benefit over the next 12-18 months, and what investors should watch as global market dynamics shift.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Government, corporate spending to sustain global growth in 2027 as inflation eases: JPMorgan", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Government, corporate spending to sustain global growth in 2027 as inflation eases: JPMorgan The Economic Times daily newspaper is available online now. Read Today's Paper Government, corporate spending to sustain global growth in 2027 as inflation eases: JPMorgan SECTIONS Government, corporate spending to sustain global growth in 2027 as inflation eases: JPMorgan ANI Last Updated: Nov 22, 2026, 11:41:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Global economic growth is projected to be resilient in 2027 due to continued government investment and corporate spending. Investment in technology and recovery in consumer demand are expected to drive this growth forward. Corporate investment, especially in artificial intelligence, is noteworthy, with major firms planning significant expenditure. Inflation pressures are anticipated to ease, strengthening household spending. However, rising government borrowing and competition for capital may pose challenges for financial markets.\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "22 Nov 2026, 11:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Quantum computing\u2019s first real-world payoff may come in energy, not drug discovery", "full_content": "For years, the case for quantum computing has rested on ambitious promises, from discovering new drugs by simulating how molecules behave to optimizing supply chains and airline schedules. Many of the biggest aims are still likely to be years, if not decades, away.\n\nBut quantum software, which uses algorithms designed to solve complex problems faster than conventional computers, is already being tested on a more immediate challenge: the energy transition, from keeping power grids stable to finding better materials for solar cells and hydrogen production.\n\nPhasecraft, a quantum software company founded in Bristol, England, in 2019, is one of the firms putting the technology to work in energy. It raised $34 million in Series B funding in 2025, and in September this year announced plans to set up U.S. headquarters in Arlington, Virginia .\n\nThere are enormous opportunities to solve problems that are both important for energy security and commercially valuable, Ashley Montanaro, co-founder and CEO of Phasecraft, told CNBC.\n\nPhasecraft isn't alone in applying quantum software to the energy industry.\n\nQuantinuum, which was formed by the merger of Cambridge Quantum and Honeywell Quantum Solutions and listed on Nasdaq in June, is using the technology to model materials for hydrogen fuel cells for transportation. It is also working with partners on materials for carbon capture.\n\nAnother U.K. player, ORCA Computing, a spinout from the University of Oxford, has partnered with BP to better understand how a molecule's physical, chemical and biological properties are governed. That could help explain how biofuels burn and how to make them burn more efficiently\n\nIn a separate project, ORCA worked with Japanese software company JIJ on a challenge power companies face : deciding which generators to switch on or off, and when, to meet demand at the lowest cost.", "source": "CNBC World Economy", "pub_date_str": "22 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold crashes 31%, silver plunges 64%: How much your \u20b910 lakh investment shrunk since January peak, what lies ahead?", "full_content": "The gold and silver rally has turned from a fine dream to a nightmare in just a matter of 1 year, between 2025 and 2026. After scaling unprecedented highs in January, both precious metals have suffered a sharp correction, wiping out a major chunk of money from investors portfolio.\n\nGold has fallen 31.5%, meanwhile silver has plunged 64.2% from its January peak. The correction also anguished investors (including those who invested in exchange-traded funds or ETFs), who bought the precious metal at a high price.\n\nIf you had invested \u20b9 10 lakh in gold at its January peak, it would be worth around \u20b9 6.85 lakh at November 20 prices, a similar investment in silver would have shrunk to approximately \u20b9 3.58 lakh in just 10 months.\n\nGold had surged to nearly $5,600 an ounce in January before retreating below $4,000 and subsequently recovering. Silver, which had crossed $100 an ounce, suffered an even more punishing reversal. Since India imports much of its bullion, domestic prices closely track international markets, with movements in the rupee adding another layer of volatility.\n\nUnlike the largely one-way rally of 2025, 2026 has been marked by sharp swings. Changing expectations around US interest rates, persistent inflation, elevated bond yields, a stronger dollar and geopolitical uncertainty have repeatedly unsettled precious metal markets.\n\nNavneet Damani, Head of Research \u2013 Commodities at Motilal Oswal Financial Services, told Indian Express, that gold continues to retain its importance as a defensive asset amid global economic and geopolitical uncertainty. However, its near-term trajectory will remain sensitive to US Federal Reserve policy, inflation, the dollar and real bond yields.\n\nThe September 25-basis-point Fed rate hike, taking the policy rate to 3.75-4%, has reinforced concerns over tighter monetary conditions, Damani said.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Reliance Brands FY26 revenue up 3.8% to Rs 3,390.9 crore; loss narrows to Rs 137 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Reliance Brands FY26 revenue up 3.8% to Rs 3,390.9 crore; loss narrows to Rs 137 crore The Economic Times daily newspaper is available online now. Read Today's Paper Reliance Brands FY26 revenue up 3.8% to Rs 3,390.9 crore; loss narrows to Rs 137 crore SECTIONS Reliance Brands FY26 revenue up 3.8% to Rs 3,390.9 crore; loss narrows to Rs 137 crore PTI Last Updated: Nov 22, 2026, 11:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reliance Brands has marked a significant financial milestone, achieving a revenue of Rs 3,390.89 crore for FY26 and reducing losses. Operating more than 1,085 Points of Sale nationwide, the brand continues to collaborate with over 90 partner names. Recent acquisitions, including Hamleys and new entries like Stella McCartney and Fabletics, demonstrate the company\u2019s drive to lead in the competitive fashion and lifestyle industry.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Nov 2026, 11:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018Don\u2019t treat employees like children\u2019: Spotify continues Work-From-Anywhere policy; how it helps the company, money-wise", "full_content": "While most big companies have moved back to the office, Spotify is sticking with its Work From Anywhere policy, introduced in February 2021. Employees can work from home, use an office or agree on a mix with managers. Spotify\u2019s HR chief, Katarina Berg, said in an October 2024 interview with Raconteur that companies should trust the adults they hire. She warned against hiring \u201cgrown-ups\u201d and then treating them \u201clike children\u201d.\n\nThat trust has a financial side. Fewer people using offices every day gives Spotify room to cut property costs. Lower staff turnover can also reduce the need to find and train replacements. Spotify has yet to disclose how much the policy saves after expenses. But here are some estimates.\n\nIn 2023, Spotify started reviewing how much office space it needed worldwide. It sought to rent out unused space at New York\u2019s 4 World Trade Center. Giving up space can reduce future rent payments, utility bills and maintenance costs. Subletting can also bring in income while a lease is still running.\n\nThe change came with upfront accounting charges. Spotify\u2019s filings show a \u20ac90 million property write-down in the second quarter of 2023. It recorded \u20ac43 million in property write-downs in 2024 and \u20ac8 million in 2025.\n\nThese charges lowered the value of office assets in Spotify\u2019s accounts. They weighed on reported earnings without requiring an equivalent cash payment when Spotify recorded them.\n\nKeeping staff for longer offers another financial benefit. Spotify\u2019s employee departure rate was 15% lower in the second quarter of 2022. The company compared that quarter with the same period in 2019, before the pandemic.\n\nSpotify also reported that its average hiring time fell by six days. A shorter hiring process can reduce the time recruiters and managers spend filling vacancies.\n\nThe policy also gives Spotify a wider pool of candidates. Its hiring can reach people who live far from an office. Employees have flexibility to move within markets where Spotify operates.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 10:57 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top 3 stocks to buy: Swiggy, Tata Chemicals, Amber Enterprises by Ganesh Dongre of Anand Rathi | Targets, stop-loss", "full_content": "SWIGGY AMBER Asit Manohar Published 22 Nov 2026, 10:44 AM IST Prefer Livemint on Google Stocks to buy | Ganesh Dongre's stock recommendations: The key benchmark indices of the Indian stock market ended the week on a strong positive note, with the Nifty gaining nearly 2.50% to close at 25,800, while the Bank Nifty witnessed a sharp rally of approximately 6%, settling at 64,635. Meanwhile, Brent crude oil prices declined towards $92 per barrel, providing significant relief to global markets.\n\nSectoral performance remained broadly positive, with most major sectors gaining between 1% and 5%. Banking and cement emerged as the top-performing sectors, rallying nearly 4% during the week. Meanwhile, India VIX continues to trade around the 16 mark, suggesting that volatility remains relatively elevated despite the sharp recovery in the equity markets. Global developments, particularly developments in the Middle East and US\u2013Iran relations, along with movements in crude oil prices, will remain important factors influencing market sentiment.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi, believes the Indian stock market bias has improved, as the Nifty 50 index has witnessed a remarkable recovery of more than 15%, supported by strong buying interest at lower levels. The 50-stock index rebounded from the 22,200\u201322,500 support zone, recovered above its 200-day moving average and subsequently crossed the crucial psychological mark of 25,000. The recovery gained further momentum as the Nifty moved above its previous monthly high of 24,700 and approached its February 2026 high, indicating a significant improvement in overall market sentiment.\n\nSpeaking on the outlook for the Nifty 50 index, Ganesh Dongre of Anand Rathi said the Nifty has maintained a strong bullish structure, consistently forming higher highs and higher lows on the weekly chart. Having surpassed its earlier resistance levels of 23,200, 24,700 and 25,500\u201325,600, the index has now closed at 25,800.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 10:44 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Equity LTCG tax abolition: Will scrapping capital gains tax boost FPI inflows, mutual fund investments? CA explains", "full_content": "Scrapping the long-term capital gains (LTCG) tax on equity investments could improve post-tax returns for investors, along with the current market sentiment. Such a step, if introduced, could make Indian equities more attractive to foreign investors and domestic households.\n\nStill, the critical question remains: Will abolishing the tax be enough to reverse foreign portfolio (FPI) outflows and boost mutual fund investments?\n\nCA Suresh Surana touched upon these aspects and explained how removing the tax could support investment activity, but the government would also have to consider the revenue implications.\n\nOn this, Surana stated, \u201cRemoving LTCG tax could improve investors\u2019 post-tax returns and make Indian equities more attractive to some foreign investors. SBI Research has suggested that this could help encourage longer-term investment, but it does not establish that removing the tax would, by itself, reverse FPI outflows or reduce market volatility .\u201d\n\nNot only this, he further added, \"FPI decisions also reflect company valuations and earnings prospects, global interest rates, currency movements and broader risk sentiment. These factors can outweigh a tax change, particularly during periods of global uncertainty.\"\n\nThese observations underline the significance of balancing LTCG taxation in a way that keeps Indian equities lucrative for both FPIs and domestic investors, and also ensures that India's taxation model further facilitates long-term investments.\n\nSurana believes scrapping the tax could encourage greater household participation in equities and broaden the investment base. Therefore, the government should consider adequately incentivising equity investments.\n\nExplaining this, he said, \"Scrapping LTCG tax on equities may improve investors\u2019 post-tax returns and make equity investments, including equity mutual funds, more attractive. It may encourage some households to allocate more savings to equities and could support mutual fund inflows.\"", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 10:35 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq Wipes Out 2026 Gains As S&P, Dow Sink Into Correction: Top Five Drags Behind The Selloff", "full_content": "On Friday, all three indices settled in the red, with Nasdaq down over 5%, S&P 500 down nearly 4%, and Dow Jones down 2%.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 10:33 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Private equity backers flag fresh concerns about sell-to-yourself deals", "full_content": "Co-investors in buyout funds frustrated at being forced out when assets are sold into continuation vehicles", "source": "FT Markets", "pub_date_str": "22 Nov 2026, 10:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "31% returns in 2026 so far! This stock is giving 4 shares on every share - you too can get it; check record date", "full_content": "Shares of small cap apparel stock, SP Apparels Limited, will remain in focus in the coming days due to its upcoming stock split record date. The smallcap textile stock has delivered 31% return in 2026 so far.\n\nSP Apparels Limited closed marginally lower on Friday, November 20, after rallying nearly 3.81% over the last five trading sessions. For investors who closely track corporate actions, here are all the details to know.\n\nThe company\u2019s board of directors has approved a stock split of every stock (with face value \u20b9 10) to five shares (with face value \u20b9 2). The board \u201capproved the sub-division of face value of Equity Shares of the Company of Rs. 10/- (Rupees Ten only) each fully paid-up into 5 (Five) equity shares of Rs. 2/- (Rupees Two Only) each fully paid-up,\u201d read the BSE filing.\n\nReaders must note that a \u20b9 10-to- \u20b9 2 face value split means every one existing share becomes five shares. However, the overall value of an investors' holding will remain unchanged.\n\nThe company\u2019s board of directors has fixed Thursday, December 10 as the record date to determine the eligibility of shareholders for the split. It means that investors must own the stock before the record date to qualify for the corporate action.\n\nThe stock closed 0.81% lower at \u20b9 927 per share on BSE with a market capitalisation of \u20b9 2,330.37 crore on Friday, November 20. The stock has delivered 3.81% return in one week, 7.91% return in two weeks, 17.54% return in six months and 31.54% in 2026 so far. The stock has delivered 11.67% return in one year, and 58.29% in three years.\n\nSP Apparels stock hit its 52-week high mark of \u20b9 1,220.10 per share on July 9, 2026. The stock dippe dto its 52-week low of \u20b9 585 per share on January 21, 2026.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates o
