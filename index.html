rates SpaceX stock rating after Starship milestone", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 10:26 PM IST", "pub_date_relative": "16m ago"}, {"title": "Earnings call transcript: Rubicon Organics posts q3 2026 growth as stock falls", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 10:24 PM IST", "pub_date_relative": "18m ago"}, {"title": "Silicon Valley leaders back call for Jensen Huang\u2019s return to Nvidia", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 10:24 PM IST", "pub_date_relative": "19m ago"}, {"title": "Eurasian Resources Group to split its Kazakh and African assets", "full_content": "Deal will free up more highly prized African copper and cobalt operations from Kazakh state control", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 10:23 PM IST", "pub_date_relative": "19m ago"}, {"title": "Why is Aclaris Therapeutics stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 10:22 PM IST", "pub_date_relative": "20m ago"}, {"title": "Trump says he's OK with Jensen Huang returning as Nvidia CEO, sees no national security risk", "full_content": "President Donald Trump said he would be open to former Nvidia CEO Jensen Huang returning to the company he resigned from last week amid the fallout from an extramarital relationship he had with an alleged Chinese spy.\n\n\"I think he learned a big lesson,\" Trump said of Huang when asked by reporters on Monday whether he wants to see the company co-founder reinstated as CEO.\n\nTrump, speaking to reporters outside the White House before departing for a trip to Asia, downplayed national security concerns stemming from the affair with a former executive of Megaspeed, a Singapore-based technology company that U.S. officials suspect of having funneled Nvidia's advanced chips to China.\n\n\"It was not put at risk, and our country is now stronger than ever before,\" Trump told reporters when asked about U.S. national security concerns. Trump is due to meet with Chinese President Xi Jinping at the Asia-Pacific Economic Cooperation.\n\nThe president told reporters he is not planning to replace Howard Lutnick as commerce secretary after questions of the Cabinet member's handling of export controls involving Nvidia's advanced chips.\n\nRepublican and Democratic members of Congress have raised concerns about the national security implications of the episode after it was revealed that Huang, who co-founded Nvidia in the 1990s, had an extramarital affair with Chinese businesswoman and alleged spy Alice Huang. Nvidia is the leading global supplier of advanced artificial intelligence chips.\n\nCritics argue the affair could jeopardize the U.S.'s global dominance in AI and that it raises questions about influence exerted by Nvidia's Huang on regulators and lawmakers as he opposed export controls that limited the sale of the company's chips to Chinese firms.\n\nThe New York Times reported on Tuesday that the U.S.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 10:22 PM IST", "pub_date_relative": "21m ago"}, {"title": "Trump\u2019s stake in Nvidia grew to as much as $62 million before scandal broke out - The Washington Post", "full_content": "Trump\u2019s stake in Nvidia grew to as much as $62 million before scandal broke out The Washington Post Trump bought Nvidia stock as he helped chipmaker with change to export rule The Guardian Trump's Nvidia stake grew to as much as $62 million, Washington Post reports Yahoo Finance Trump Reported Selling Up to $1 Million in Nvidia Stock; NVDA Falls 29% Since Filing TradingView Trump's Nvidia Trades Draw Scrutiny as Huang Exit Exposes Washington's Chip Divide BigGo Finance", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 10:22 PM IST", "pub_date_relative": "21m ago"}, {"title": "Why is BILL Holdings stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 10:22 PM IST", "pub_date_relative": "21m ago"}, {"title": "Why is Peabody Energy stock gaining today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 10:22 PM IST", "pub_date_relative": "21m ago"}, {"title": "Nvidia fallout: Commerce targets loophole for China's data center use", "full_content": "The Commerce Department on Monday moved to close a loophole that has let Chinese companies lease Nvidia 's advanced computing power from data centers in third countries, effectively circumventing controls on sensitive chip technology being exported to China .\n\nCommerce's action, an interim final rule issued by its Bureau of Industry and Security, is the first U.S. policy response to the scandal at Nvidia that led CEO Jensen Huang to resign last week.\n\nThe department, in a press release, said that the BIS rule was \"written by and at the direction of\" the Treasury Department and the National Security Council.\n\nThe rule came after rising criticism of Commerce Secretary Howard Lutnick , who has been accused of not doing enough to prevent possible diversion of Nvidia's most advanced chips to China in violation of American export controls.\n\nShare prices of Nvidia and other companies linked to the artificial intelligence trade fell after the interim rule was announced, among them chipmakers Micron Technology, Intel and Advanced Micro Devices.\n\nTreasury Secretary Scott Bessent , in an interview on Friday with CNBC's \"Squawk Box,\" blamed the Commerce Department for not putting Megaspeed, the Singapore-based company at the center of the Nvidia scandal, on its \"entity list,\" which would restrict certain exports to it.\n\nSecretary of State Marco Rubio, who, as national security advisor, leads the National Security Council, warned President Donald Trump last spring that Huang was in a close relationship with Megaspeed executive Alice Huang, whom U.S. intelligence believed to be a Chinese spy, The New York Times reported on Nov. 8. Jensen Huang, who is not related to Alice, resigned last week after other reports said he had affairs with her and a subordinate at Nvidia.\n\nThe Commerce Department, in the notice of the rule on Monday, said that it \"is establishing new rules to prevent certain foreign actors from leveraging advanced computing power based on U.S.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 10:21 PM IST", "pub_date_relative": "22m ago"}, {"title": "Germany vs Netherlands Live Streaming: When And Where To Watch UEFA Nations League Match On TV, Online?", "full_content": "Germany will host Group A2 leaders Netherlands in their final league-phase fixture of the 2026-27 UEFA Nations League campaign.", "source": "NDTV Profit", "pub_date_str": "16 Nov 2026, 10:15 PM IST", "pub_date_relative": "28m ago"}, {"title": "Nvidia is gearing up for one of Wall Street\u2019s most anticipated earnings calls in years", "full_content": "Jensen Huang\u2019s sudden departure has made Tuesday\u2019s earnings call \u201cthe most important in the company\u2019s history.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "16 Nov 2026, 10:07 PM IST", "pub_date_relative": "36m ago"}, {"title": "Trump Administration Moves to Close A.I. Chip Loophole Ahead of China Trip - The New York Times", "full_content": "Trump Administration Moves to Close A.I. Chip Loophole Ahead of China Trip The New York Times Commerce closes China\u2019s backdoor to Nvidia chips after White House steps in Politico How Jensen Huang Built the Backdoor Route That Keeps Beijing in the AI Race WSJ Trump administration orders Commerce to close chip loophole at heart of Nvidia scandal The Washington Post Nvidia fallout: Commerce targets loophole for China's data center use CNBC", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 10:05 PM IST", "pub_date_relative": "38m ago"}, {"title": "International student enrollment drops sharply, putting more U.S. colleges in financial jeopardy", "full_content": "Amid changing visa policies and rising degree costs, significantly fewer new international students enrolled at U.S. colleges this year \u2014 a shift that could have financial repercussions for colleges, students and the broader economy.\n\nIn the fall 2026 semester, the tally of new international students studying in the U.S. fell 15% compared with the prior academic year, according to a fall snapshot released Monday by the nonprofit Institute of International Education.\n\nOver the 2025-26 academic year, the number of new international students in the U.S. fell more than 17%, largely because fewer graduate students came from countries such as India and China, the IIE's report found.\n\nA growing number of U.S. colleges said international student recruitment was a top concern, but the report also cited as significant barriers the high cost of a U.S. degree relative to other countries and uncertainty around new rules ending the traditional \"duration of status\" system and limiting most F-1 and J-1 visas to four years.\n\nEven though the Department of Homeland Security's new visa restrictions are currently on hold under a federal court injunction, experts say questions about the changing policies may have already discouraged some prospective international students.\n\n\"At a time when countries around the world are competing for talent, the United States should be strengthening our ability to attract the best and brightest, not creating new barriers to it,\" Fanta Aw, executive director and CEO of NAFSA: Association of International Educators, said in a Sept. 14 statement after a federal court temporarily blocked the Department of Homeland Security's new visa rules.\n\nForeign students typically pay full tuition, making international enrollment an important revenue source for colleges and universities, according to Robert Franek, editor-in-chief of The Princeton Review.\n\nWith fewer tuition dollars coming in, there are fewer resources for U.S.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:50 PM IST", "pub_date_relative": "52m ago"}, {"title": "I am turning 18 next month and want to start investing. What do I do first?", "full_content": "\u201cI have not tried investing before.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "16 Nov 2026, 09:50 PM IST", "pub_date_relative": "53m ago"}, {"title": "Nvidia gets two more price target cuts from analysts ahead of earnings", "full_content": "Nvidia has received two more price target cuts from shops on the Street following the departure of its long-time CEO, Jensen Huang.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:48 PM IST", "pub_date_relative": "55m ago"}, {"title": "U.S. crude oil declines to $87 a barrel on recovering Middle East exports", "full_content": "Oil prices are falling Monday as shipments through the Strait of Hormuz recover and tensions between Iran and the U.S remain at a stalemate.\n\nBrent crude fell 2% to $93.90 per barrel Monday while West Texas Intermediate crude slipped 1.8% to about $87 per barrel.\n\nThe International Energy Agency said on Friday it expects global supply to exceed 1.7 million barrels a day in the fourth quarter of 2026, reversing its earlier forecast for a deficit as Middle East exports recover faster than global demand and even as shipping attacks continue.\n\nWTI Crude, YTD Meanwhile, Russia's crude oil production rose to 8.73 million barrels a day in October, a 210,000-barrel-a-day surge, according to the International Energy Agency.\n\nGoldman Sachs said in a Sunday note it expects Brent to average $88 a barrel in 2027 and fall to $78 by December 2027 as the market returns to a surplus.\n\nThe bank believes idle East supply to rise above its 2025 average as producers use ship-to-ship transfers and add pipeline capacity.", "source": "CNBC Finance", "pub_date_str": "16 Nov 2026, 09:47 PM IST", "pub_date_relative": "55m ago"}, {"title": "Two \u2018Best Stocks\u2019 are pulling back from highs. Josh Brown on how to trade them from here", "full_content": "Josh Brown and Sean Russo break down what's going on with these stocks.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks Fall Before Nvidia Earnings, Anthropic IPO: Markets Wrap - Bloomberg", "full_content": "Stocks Fall Before Nvidia Earnings, Anthropic IPO: Markets Wrap Bloomberg Stocks slide as Nvidia leads AI names lower: Live updates CNBC Stocks dip ahead of Nvidia earnings, Anthropic IPO Reuters More drops for Nvidia and other AI stocks drag the US market lower AP News Wall Street falls as Nvidia jitters cloud sentiment ahead of results The Detroit News", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 09:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "8th Pay Commission: Unions seek 3.833 fitment factor, \u20b969,000 minimum pay and 50% family pension for pensioners", "full_content": "The 8th Pay Commission could bring significant changes to the salary and pension structure of central government employees, with employee unions seeking a higher fitment factor, improved family pension and better retirement benefits. Among the key proposals is a fitment factor of 3.833, which could raise the minimum basic pay from the existing \u20b9 18,000 to \u20b9 69,000 if accepted. The unions have also proposed increasing family pension to 50% of the last-drawn basic pay and raising regular pension to 67%.\n\nThese proposals form part of the demands submitted by the Staff Side of the National Council-Joint Consultative Machinery (NC-JCM) to the 8th Central Pay Commission. However, these are recommendations made by employee representatives and are not approved government benefits. The final salary and pension structure will depend on the commission's recommendations and the government's decision.\n\nThe NC-JCM Staff Side has proposed a fitment factor of 3.833 for revising the basic pay of existing central government employees. The proposal is based on increasing the minimum basic pay from \u20b9 18,000 under the 7th Pay Commission to \u20b9 69,000 under the next pay structure.\n\nThe fitment factor is a multiplier used to calculate revised basic pay when a new pay commission's recommendations are implemented. Under the 7th Pay Commission, the government had approved a fitment factor of 2.57.\n\nIf the proposed 3.833 factor is accepted, an employee currently drawing a minimum basic pay of \u20b9 18,000 could see it revised to \u20b9 69,000.\n\nHowever, this does not mean that the employee's total monthly salary or take-home pay will increase by the same proportion.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 09:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Greece becomes unlikely haven for European investors", "full_content": "The question is whether the country has gains still to come", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 09:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic\u2019s Wall Street whisperer: Meet CFO Krishna Rao", "full_content": "After closing a $65 billion funding round in May, he's been readying the artificial intelligence company for what's widely expected to be a blockbuster IPO . The listing could value Anthropic at roughly $1.4 trillion , instantly making it one of the largest tech companies in the world.\n\nRao joined Anthropic in 2024, when the company was still considered an underdog to OpenAI , now its chief rival. He's known as a straight shooter and a deft operator with a relentless work ethic, according to Anthropic investors and former colleagues, and he's played a crucial role in fueling the company's historic rise.\n\nThe 43-year-old finance chief has largely stayed out of the public eye, opting to yield the spotlight to Anthropic's seven co-founders , including CEO Dario Amodei and President Daniela Amodei . But Anthropic's upcoming Nasdaq debut, which is expected to take place on Thursday, will likely push him to center stage, as public market investors and analysts hang on his every word for insight into the AI trade.\n\nRao has nearly two decades of experience in finance across a range of companies, including Fanatics Commerce, a sports merchandise retailer, Cedar, a health care payments and billing platform, Airbnb and Blackstone . But he's never taken a company public as a CFO, and the stakes are high.\n\nInvestors are still reeling after Jensen Huang resigned as CEO of Nvidia following shocking reports of three extramarital affairs . The market was already jittery on concerns that rising interest rates would make debt unaffordable for companies that need it for costly infrastructure purchases.\n\n\"He's a committed professional. He's integrity-based, and he's had this meteoric rise in a very, very complex set of companies,\" Jonathan Mildenhall, Airbnb's former marketing chief and a Fanatics board member, told CNBC in an interview. \"There was nothing easy about Airbnb. There was nothing easy about Fanatics.", "source": "CNBC World Economy", "pub_date_str": "16 Nov 2026, 09:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX widens its lead in the space race, even as a tech selloff weighs on its stock", "full_content": "SpaceX had a mostly successful Starship launch, while an Amazon partner hit a setback.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Nov 2026, 09:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "New bond revealed", "full_content": "Who could it be?", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 09:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "'We slept here': Flight delays linger as airlines recover from ground stop, but schedule improves Monday", "full_content": "U.S. flights delays eased on Monday as airlines scrambled to get back on track after the Federal Aviation Administration grounded departures nationwide for more than four hours on Friday.\n\nNearly 300 U.S. flights were canceled and close to 1,000 were delayed Monday, a fraction of Sunday's disruptions, according to FlightAware data.\n\nTransportation Secretary Sean Duffy over the weekend tied the issue that prompted officials to call for the ground stop to a router in southern Arkansas and work to update copper wires to a fiber-optic system overseen by L3Harris Technologies . FAA Administrator Bryan Bedford said the upgrades were part of \"routine\" maintenance to switch over to fiber optic.\n\nOfficials ordered the ground stop before 4 p.m. ET on Friday and it lasted until after 8 p.m. ET, marking the longest halt to U.S. flight departures since 9/11.\n\nHundreds of thousands of travelers were stranded and about 18,000 U.S. flights were canceled from Friday through Monday morning, according to FlightAware.\n\nOver that period, American Airlines had the most cancellations with 5,367 flights, close to 22% of its schedule, followed by Delta Air Lines with 3,434 cancellations, or 17% of its schedule, according to aviation data firm Cirium. Southwest Airlines and United Airlines each canceled more than 16% of their schedules. Bad weather on Thursday and Friday had also contributed to disruptions before the ground stop.\n\nOn Sunday, disruptions lingered but were starting to improve.\n\n\"We slept here,\" said Beth Martin, who was trying to travel home to Birmingham, Alabama, from New York's LaGuardia Airport on Sunday at the end of her daughter's birthday trip. The two were booked for Saturday night, and when delay announcements started rolling in from Delta, they decided to make good use of the extra time: After strolling through Central Park, they went window shopping on Fifth Avenue.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Prediction market odds for Tesla-SpaceX merger by April 2027 top 60%", "full_content": "Odds of a SpaceX and Tesla merger before March 2027 climbed to 62% from 27% since Thursday on Kalshi.\n\nChances that that Elon Musk's two companies, SpaceX, a satellite and rocket maker, and Tesla, an electric vehicle manufacturer, will soon integrate have jumped across multiple Kalshi markets since late last week.\n\nThe contract asks \"When will Tesla and SpaceX merge?\" and would be verified by news outlets and the Securities and Exchange Commission's EDGAR database.\n\nOn Friday, Walter Isaacson , a CNBC contributor and author of a Musk biography, told CNBC's \" Squawk Box \" he's confident a merger is coming. He cited Terafab, the semiconductor project involving Tesla, SpaceX and xAI, as a catalyst.\n\n\"I think you have to have a merger. Makes no sense otherwise,\" Isaacson said.\n\nTesla's 2026 annual shareholder meeting, set for Dec. 3, may provide more insight into a potential linkup, Isaacson said.\n\nWhile speculators are anticipating an announcement of a merger this year, a research note from Jefferies last week said a deal will likely face backlash after the Democrats won control of Congress and several key governorships in the midterm elections earlier this month.\n\n\"We understand there is higher risk of scrutiny post elections, but the vision of a combined SpaceX and Tesla as proxies for longer-term U.S. national strategies of independence and leadership in space, energy, manufacturing or semiconductors, in our view, remain highly relevant regardless of which party controls Congress,\" wrote Jefferies analyst Philippe Houchois.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Barclays lowers 2027 year-end target for S&P 500 index to 8,700", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Barclays lowers 2027 year-end target for S&P 500 index to 8,700 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Barclays lowers 2027 year-end target for S&P 500 index to 8,700 SECTIONS Barclays lowers 2027 year-end target for S&P 500 index to 8,700 Reuters Last Updated: Nov 16, 2026, 09:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Monday, Barclays revised its S&P 500 index target for the 2027 year-end from 8,800 to 8,700. The adjustment reflects concerns regarding higher interest rates impacting financial conditions. Analysts believe that tighter financial conditions may lead to increased valuation dips. Strategies suggested by Barclays indicate limited potential for valuation expansion moving forward. Analysts emphasize careful monitoring of the evolving financial landscape in the coming years.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Nov 2026, 09:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks: Summit shares drop after US FDA declines to approve lung cancer drug", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Summit shares drop after US FDA declines to approve lung cancer drug Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Summit shares drop after US FDA declines to approve lung cancer drug SECTIONS US stocks: Summit shares drop after US FDA declines to approve lung cancer drug Reuters Last Updated: Nov 16, 2026, 09:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Summit Therapeutics faced a notable decline in share value following the FDA's ruling on ivonescimab, which revealed insufficient overall survival benefits during late-stage trials. Despite Summit's emphasis on regional survival differences, analysts worry that this decision could have repercussions for similar treatments in development. Investors now eagerly await new trial results comparing ivonescimab with conventional lung cancer therapies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Nov 2026, 09:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "These 13 S&P 500 stocks can rise up to 70% over the next year, according to analysts", "full_content": "Consensus earnings estimates have continued to increase, especially for semiconductor manufacturers whose share have declined significantly since the end of September, which underscores several calls for investors to load up on stocks.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Nov 2026, 09:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "There's a growing 'property tax revolt' as homeowners face rising costs. How it could impact your bill", "full_content": "Affordable housing was a key midterm election issue , and as Americans wrestle with rising home costs , there's a growing movement to reduce or limit property taxes.\n\nAmid soaring home values , some states want to cap how much local governments can collect from homeowners. Experts have described the trend as a \" property tax revolt .\"\n\nDuring the Nov. 3 midterm election, Florida voters approved Amendment 3 , which increases the portion of primary residences exempt from property tax for non-school levies, and lowers the cap on yearly assessments for certain properties.\n\nNorth Carolina voters approved an amendment to require the state legislature to enact limits on property tax increases, while voters in Oklahoma and Wyoming rejected other property tax measures.\n\nIn Ohio, an amendment to abolish property taxes didn't have enough signatures to make the November ballot, but supporters plan to try again in 2027.\n\nDespite the \"mixed bag\" on midterm ballot initiative results, \"I think we'll continue to see property tax reforms,\" said Matthew Chase, CEO of the National Association of Counties, or NACo, a nonprofit organization that represents county governments.\n\nProperty taxes are levied as a percentage of a home's assessed value, based on its estimated market rate.\n\nSome municipalities use a millage rate \u2014 with one mill equaling $1 of tax per $1,000 of taxable assessed value \u2014 to calculate property tax bills. That rate can adjust up or down based on changes in home values and the local government's budget needs.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rocket from Boeing-Lockheed firm fails mid-flight, destroys payload of Amazon satellites", "full_content": "A Vulcan rocket owned by United Launch Alliance, the \u2060joint venture of Boeing and Lockheed Martin , failed on Sunday shortly after liftoff from Florida, destroying its payload of 40 satellites from Amazon's Leo internet network in the launch company's first mission failure.\n\nThe rocket \u200bfailed roughly 10 minutes after liftoff from the Cape \u200bCanaveral Space Force Station in Florida, and \u200bthe cause was not immediately clear. It represented a major setback for the two-decade-old company's new flagship rocket as ULA sought to begin a regular launch cadence for Amazon's burgeoning satellite internet constellation.\n\n\"Based on data received by our Launch Director, we confirm that the Vulcan vehicle launched from Space Launch Complex 41 suffered an anomaly 10 minutes \u2060into the \u200cflight and failed to deliver the Amazon mission to orbit,\" ULA said in a \u2060statement.\n\n\"Every flight generates data, and every flight teaches us something. Since the anomaly just occurred, we don't have any specific data yet to understand what occurred today,\" ULA said.\n\nThe failure is expected to lead to a lengthy technical investigation that would keep the rocket off the market for months. This could deepen a US launch bottleneck brought on by other rocket mishaps and challenges across \u200cthe industry as well as the looming retirement of SpaceX's Falcon 9, the world's most active rocket. SpaceX is no longer accepting bookings for the Falcon 9.\n\n\"There is risk with any launch, and that's especially true for inaugural missions like LV-01,\" Amazon said in a statement, referring to \u200bSunday's mission.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "$51 billion capex, 23% earnings growth: Adani Ports, Adani Green to Energy; Jefferies sees up to 44% upside in 6 stocks", "full_content": "AMBUJACEM ADANIPOWER ADANIENSOL ADANIGREEN A Ksheerasagar Published 16 Nov 2026, 09:11 PM IST Prefer Livemint on Google Global brokerage firm Jefferies, in its latest outlook, has retained its bullish stance on Adani Group companies, maintaining Buy ratings on six group companies and expecting an average upside potential of nearly 25% from their respective closing prices cited in the report.\n\nThe brokerage's positive outlook stems from the group's emergence as one of India's largest capital spenders over the past five years, with EBITDA and assets growing at compound annual growth rates (CAGRs) of approximately 20% and 22%, respectively, over FY17-FY26. This growth has been driven by execution, strategic mergers and acquisitions (M&A), and exposure to India's structural growth priorities.\n\nJefferies expects the group's capital expenditure (capex) spree to continue for another three years, with Adani Group companies likely to emerge as the largest contributors to private-sector capex. The group is expected to account for approximately 28% of the aggregate private-sector spending of $180-190 billion over FY27-FY29.\n\nThe brokerage said the group's capex programme is likely to remain concentrated in the energy, transportation, building materials, and infrastructure sectors, reflecting its strategy of strengthening core businesses while selectively expanding into adjacent segments.\n\nAmong these, Jefferies expects a $51 billion capex programme across six companies\u2014Adani Ports, Adani Enterprises , Ambuja Cements , Adani Power , Adani Energy Solutions , and Adani Green Energy \u2014all of which it has maintained Buy ratings.\n\nThe brokerage estimates that the execution of the $51 billion capex programme will drive a 23% CAGR in EBITDA and EPS over FY26-FY29E, supported by volume growth and market-share gains.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 09:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia live updates: Interim CEO Kress prepares for Q3 earnings, with Huang reportedly planning comeback - Yahoo Finance", "full_content": "Nvidia live updates: Interim CEO Kress prepares for Q3 earnings, with Huang reportedly planning comeback Yahoo Finance Nvidia's Colette Kress confronts key questions in first earnings report since Jensen Huang\u2019s exit CNBC Buying Nvidia Now? Really? (NASDAQ:NVDA) Seeking Alpha Here\u2019s How Much Traders Expect Nvidia Stock to Move After Earnings Tuesday Investopedia Will Nvidia earnings steady the AI sell-off? Financial Times", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 09:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank Holiday on Friday 20 November: Branches closed in Dehradun, Uttarakhand due to this festival; no cheque clearances", "full_content": "Bank branches in Dehradun, Uttarakhand, will remain closed on Friday, November 20, on account of Igas-Bagwal, a traditional festival celebrated across the hill state.\n\nThe closure is part of the Reserve Bank of India's (RBI) regional holiday calendar. As a result, customers will not be able to access physical banking services at branches of major lenders, including State Bank of India (SBI), HDFC Bank, ICICI Bank and Punjab National Bank (PNB), in Dehradun.\n\nCheque clearances and other branch-based transactions will also be affected during the holiday.\n\nHowever, digital banking services will continue to remain available. Customers can use internet banking, mobile banking applications, ATMs and Unified Payments Interface ( UPI ) services for routine transactions.\n\nBanks in Dehradun are expected to follow the following schedule:\n\nNovember 20, Friday: Branches in Dehradun will remain closed for Igas-Bagwal.\n\nNovember 21, Saturday: Banks will remain open as it is the third Saturday of the month.\n\nNovember 22, Sunday: Banks will remain closed due to the regular weekly holiday.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 09:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mid-cap stocks: AI-led short-cycle deals rise; Anand Rathi identifies mid-cap IT stocks Mphasis, Sonata set to benefit", "full_content": "PERSISTENT KPITTECH A Ksheerasagar Published 16 Nov 2026, 09:05 PM IST Prefer Livemint on Google Domestic brokerage firm Anand Rathi, in its recent report, said Indian mid-cap technology companies delivered better-than-expected revenue growth in the September-ending quarter, despite muted expectations, with median year-on-year constant currency (CC) revenue growth improving to around 3.1% from 2% in Q1FY27.\n\nThe brokerage highlighted that mid-cap companies, including Persistent Systems , Birlasoft, Firstsource, and Sonata Software , benefited from around 1% quarter-on-quarter rupee depreciation, which partly offset the impact of wage hikes across several companies. It also noted that EBIT margins remained largely stable.\n\nThe median EBIT margin stood at 13.4%, compared with 13.5% in Q4FY26. The brokerage noted that the banking, financial services, and insurance (BFSI) segment continues to be a structural growth driver for mid-cap IT companies, with technology spending by US banks increasing at a double-digit pace year-on-year.\n\nAnand Rathi also highlighted an emerging trend across IT companies, first articulated by LTM and subsequently echoed by Mphasis and Sonata Software, with a considerable increase in short-cycle, project-based deals, primarily related to AI.\n\nThis comes as enterprises adopt a wait-and-watch approach towards longer-tenure contracts amid geopolitical uncertainty.\n\nLooking ahead, the brokerage expects revenue growth to remain muted in FY27 due to AI-led deflationary pressures, compounded by geopolitical uncertainty.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 09:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks: Nasdaq slides over 1% as AI selloff deepens ahead of Nvidia earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: Nasdaq falls 1% at open as Nvidia woes weigh on sentiment ahead of earnings Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Nasdaq slides over 1% as AI selloff deepens ahead of Nvidia earnings SECTIONS US stocks: Nasdaq slides over 1% as AI selloff deepens ahead of Nvidia earnings Reuters Last Updated: Nov 16, 2026, 09:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks fell as investors reacted to a selloff in AI firms, with Nvidia taking a hit. The resignation of Jensen Huang, Nvidia's leader, raised concerns, adding to market anxiety. Simultaneously, fresh US regulations limited China's access to advanced AI chips, further affecting sentiment. Major semiconductor companies reported notable losses, weakening overall market confidence. Investors now look to the Fed's insights and upcoming earnings for future guidance.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Nov 2026, 09:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia stock falls as investors price in fallout from Jensen Huang's resignation", "full_content": "Nvidia 's stock continued to slide in the wake of CEO Jensen Huang 's resignation , falling about 2% on Monday after the chip giant lost hundreds of billions in market cap last week.\n\nHuang resigned from Nvidia, the company's board announced on Thursday, after mounting scrutiny following reports that he had a relationship with a woman believed to be a Chinese spy. Huang told employees he had an affair in an email on Nov. 8.\n\nIt was later reported that Huang had romantic relationships with two Nvidia employees. Nvidia did not immediately respond to CNBC's request for comment on Friday.\n\nNvidia stock. An online petition calling for Huang's reinstatement as Nvidia CEO has drawn more than 170,000 signatures , as prominent tech executives, including Elon Musk , rallied behind him.\n\nMeanwhile, U.S. lawmakers are pushing to launch comprehensive investigations into the scandal.\n\nHuang cofounded Nvidia in 1993 and led the company through its meteoric rise to becoming the world's most valuable company, with its AI chips underpinning the technology's boom.\n\nNvidia appointed longtime finance chief Colette Kress as interim CEO and said its board would consider both internal and external candidates in its search for a permanent successor.\n\nTreasury Secretary Scott Bessent on Sunday called for a \"dramatic shakeup\" at Nvidia, adding that the board should look outside the company for its next chief executive.", "source": "CNBC World Economy", "pub_date_str": "16 Nov 2026, 08:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia set to deliver first life-after-Huang briefing - Reuters", "full_content": "Nvidia set to deliver first life-after-Huang briefing Reuters \"No sane person questions whether AI works\" \u2014 but an AI bubble appears ready to pop. Axios COMMENTARY: Tech's telltale week Reuters How Nvidia turmoil and a Democratic Congress could reshape the AI trade, according to ETF experts CNBC AI\u2019s Long List of Problems Just Got a Whole Lot Worse Mother Jones", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 08:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s stock extends declines following harsh words from the U.S. government", "full_content": "The Commerce Department announced a new rule aimed at restricting China\u2019s remote access to advanced chips.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Nov 2026, 08:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Crystal Crop Protection IPO GMP today: How much listing gain is expected? Check profit calculator before bidding starts", "full_content": "Crystal Crop Protection\u2019s initial public offering (IPO) will open for subscription on Wednesday, November 18, 2026. Its latest grey market premium (GMP) indicated 4.78% listing gain, as per media reports tracking GMP. The IPO is a combination of fresh issue and offer for sale (OFS).\n\nFor investors who closely track primary market developments, here\u2019s a calculation of expected listing gain per lot for Crystal Crop Protection IPO .\n\nIts grey market premium was last recorded at \u20b9 13, as per media reports at 7:37 pm on November 16, indicating 4.78% listing gain. Considering the IPO\u2019s upper price band (of \u20b9 272 per share), the issue is likely to be listed at \u20b9 285 per share (which is the sum of the latest GMP and upper price band).\n\nCrystal Crop Protection IPO is a book build issue of \u20b9 455.49 crore and is a combination of 1.31 crore shares aggregating to \u20b9 354.77 crores and offer for sale of 37.03 lakh shares (equivalent to \u20b9 100.71 crore).\n\nThe IPO will open for subscription on November 18 and conclude on November 20. The issue allotment is likely to be finalized on November 23, followed by listing expected on November 26.\n\nThe IPO\u2019s issue price band is fixed at \u20b9 259- \u20b9 272 per share. A single lot of the IPO consists of 55 shares. Retail investors can apply for a minimum of single lot, ie \u20b9 14,960 (for 55 shares). Retail investors can apply for maximum 13 lots, ie 715 shares (equivalent to \u20b9 1,94,480). Small High-Net-Worth Individual (SHNI) are required to invest 14 lots, ie 770 shares (worth \u20b9 2,09,440)\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 08:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Analysts are awed by SpaceX's Starship catch. Here's why", "full_content": "SpaceX caught its spacecraft from orbit Saturday, a major milestone in aerospace engineering and earning praise from several Wall Street investment banks.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 08:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "UK short-term borrowing costs hit three-year high", "full_content": "Two-year gilt yield breaches 5% on strong economic data and hawkish messaging from Bank of England", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 08:45 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Eric Trump-backed robot soldier startup can't pay staff after founder borrowed $4.6 million from company to buy home", "full_content": "Foundation Future Industries , a maker of military humanoid robots advised and backed by Eric Trump, failed to pay employees last month as its cash reserves dwindled, according to people with direct knowledge of the matter.\n\nWorkers have yet to receive paychecks after San Francisco-based Foundation missed payroll on Oct. 30, said the people, who asked for anonymity to speak candidly about a private company.\n\nThe situation has particularly angered some inside the startup because its co-founder and CEO, Sankaet Pathak , borrowed $4.6 million from the company last year to buy a luxury home, money that could have been used to pay workers, the people said.\n\nPublic records show that an LLC that names Pathak as sole principal purchased a $4.6 million Sausalito, California, property with \"sweeping, cinematic views\" of the San Francisco Bay in October 2025.\n\nA spokesman for Pathak acknowledged receiving a detailed list of the major points from this story on Thursday, but didn't respond to requests for comment. Pathak's previous startup, a fintech firm named Synapse, collapsed in 2024, leaving thousands of Americans locked out of their savings accounts .\n\nFoundation's cash crunch comes at a precarious moment for the company, which Pathak has said is close to unveiling a next-generation, weapons-ready robot that will help the U.S. compete against Chinese rivals. At the same time, Pathak is seeking to raise hundreds of millions of dollars in funding at a $3 billion valuation.\n\nThe company has garnered headlines this year for Pathak's claims that his robots could soon take on battlefield tasks in Ukraine or patrol the U.S. border with Mexico. Broadcast interviews and articles about Foundation also include claims that the company has won $24 million in Pentagon contracts.\n\n\"What we're about to unveil in the next couple of months [is] going to be the strongest humanoid robot that exists anywhere in the world, including China,\" Pathak said in an April television interview.", "source": "CNBC World Economy", "pub_date_str": "16 Nov 2026, 10:41 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks slide as Nvidia leads AI names lower: Live updates", "full_content": "U.S. equities fell on Monday, dragged down by key technology stocks, as traders awaited a highly anticipated earnings report from Nvidia and a potentially record-setting public market debut of Anthropic this week.\n\nThe Nasdaq Composite declined 1.7%, while the S&P 500 fell 1.3%. The Dow Jones Industrial Average shed 401 points, or 0.8%.\n\nShares in Nvidia were down more than 2%. On Monday, the Commerce Department moved to close a loophole that has let Chinese firms rent the chipmaker's computing power located in other countries. Meanwhile, Treasury Secretary Scott Bessent over the weekend called for a \" dramatic shakeup \" at Nvidia, urging its board to look outside the company for its next CEO.\n\nThe embattled chipmaker is preparing to report its third-quarter results after the bell on Tuesday. While analysts expect the company to post nearly 100% year-over-year earnings and revenue growth, investors will be more focused on how the company will move forward after Jensen Huang's exit as chief executive.\n\nHuang last week resigned from his post after reports of multiple extramarital affairs, including one with an alleged Chinese spy. Nvidia shares dropped 13%, marking their biggest weekly slide since April 2025.\n\n\"The main task at hand for interim CEO Colette Kress [is to] restore order and give the Street confidence in the Nvidia story going forward,\" wrote Dan Ives, analyst at Yorkville Ives. \"This starts with earnings and the conference call this week on Tuesday after the bell\u2026we still expect guidance and a typical conference call around robust business metrics with demand metrics that have clearly accelerated since last quarter.\"\n\nOther stocks linked to the artificial intelligence trade were under pressure along with Nvidia. Fellow chipmakers Micron Technology , Intel and Advanced Micro Devices lost 6%, nearly 7% and 5%, respectively. Memory chip name Sandisk pulled back about 7%.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 10:35 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The serious complications of GLP-1s that few may know about - The Washington Post", "full_content": "The serious complications of GLP-1s that few may know about The Washington Post FDA adds rare vision-loss warning to popular GLP-1 drugs WRAL FDA requires safety label changes for GLP-1s over risk for eye condition WANE 15 FDA Requires GLP-1 Labels to Add Rare Eye Condition Risk Medscape Taking Ozempic or Wegovy? The FDA says there\u2019s a new warning you shouldn\u2019t ignore Yahoo", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 10:32 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Rubicon Organics posts q3 2026 growth as stock falls", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 10:24 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump says he's OK with Jensen Huang returning as Nvidia CEO, sees no national security risk", "full_content": "President Donald Trump said he would be open to former Nvidia CEO Jensen Huang returning to the company he resigned from last week amid the fallout from an extramarital relationship he had with an alleged Chinese spy.\n\n\"I think he learned a big lesson,\" Trump said of Huang when asked by reporters on Monday whether he wants to see the company co-founder reinstated as CEO.\n\nTrump, speaking to reporters outside the White House before departing for a trip to Asia, downplayed national security concerns stemming from the affair with a former executive of Megaspeed, a Singapore-based technology company that U.S. officials suspect of having funneled Nvidia's advanced chips to China.\n\n\"It was not put at risk, and our country is now stronger than ever before,\" Trump told reporters when asked about U.S. national security concerns. Trump is due to meet with Chinese President Xi Jinping at the Asia-Pacific Economic Cooperation.\n\nThe president told reporters he is not planning to replace Howard Lutnick as commerce secretary after questions of the Cabinet member's handling of export controls involving Nvidia's advanced chips.\n\nRepublican and Democratic members of Congress have raised concerns about the national security implications of the episode after it was revealed that Huang, who co-founded Nvidia in the 1990s, had an extramarital affair with Chinese businesswoman and alleged spy Alice Huang. Nvidia is the leading global supplier of advanced artificial intelligence chips.\n\nCritics argue the affair could jeopardize the U.S.'s global dominance in AI and that it raises questions about influence exerted by Nvidia's Huang on regulators and lawmakers as he opposed export controls that limited the sale of the company's chips to Chinese firms.\n\nThe New York Times reported on Tuesday that the U.S.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 10:22 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump\u2019s stake in Nvidia grew to as much as $62 million before scandal broke out - The Washington Post", "full_content": "Trump\u2019s stake in Nvidia grew to as much as $62 million before scandal broke out The Washington Post Trump bought Nvidia stock as he helped chipmaker with change to export rule The Guardian Trump's Nvidia stake grew to as much as $62 million, Washington Post reports Yahoo Finance Trump Reported Selling Up to $1 Million in Nvidia Stock; NVDA Falls 29% Since Filing TradingView Trump's Nvidia Trades Draw Scrutiny as Huang Exit Exposes Washington's Chip Divide BigGo Finance", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 10:22 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia fallout: Commerce targets loophole for China's data center use", "full_content": "The Commerce Department on Monday moved to close a loophole that has let Chinese companies lease Nvidia 's advanced computing power from data centers in third countries, effectively circumventing controls on sensitive chip technology being exported to China .\n\nCommerce's action, an interim final rule issued by its Bureau of Industry and Security, is the first U.S. policy response to the scandal at Nvidia that led CEO Jensen Huang to resign last week.\n\nThe department, in a press release, said that the BIS rule was \"written by and at the direction of\" the Treasury Department and the National Security Council.\n\nThe rule came after rising criticism of Commerce Secretary Howard Lutnick , who has been accused of not doing enough to prevent possible diversion of Nvidia's most advanced chips to China in violation of American export controls.\n\nShare prices of Nvidia and other companies linked to the artificial intelligence trade fell after the interim rule was announced, among them chipmakers Micron Technology, Intel and Advanced Micro Devices.\n\nTreasury Secretary Scott Bessent , in an interview on Friday with CNBC's \"Squawk Box,\" blamed the Commerce Department for not putting Megaspeed, the Singapore-based company at the center of the Nvidia scandal, on its \"entity list,\" which would restrict certain exports to it.\n\nSecretary of State Marco Rubio, who, as national security advisor, leads the National Security Council, warned President Donald Trump last spring that Huang was in a close relationship with Megaspeed executive Alice Huang, whom U.S. intelligence believed to be a Chinese spy, The New York Times reported on Nov. 8. Jensen Huang, who is not related to Alice, resigned last week after other reports said he had affairs with her and a subordinate at Nvidia.\n\nThe Commerce Department, in the notice of the rule on Monday, said that it \"is establishing new rules to prevent certain foreign actors from leveraging advanced computing power based on U.S.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 10:21 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia is gearing up for one of Wall Street\u2019s most anticipated earnings calls in years", "full_content": "Jensen Huang\u2019s sudden departure has made Tuesday\u2019s earnings call \u201cthe most important in the company\u2019s history.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "16 Nov 2026, 10:07 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "International student enrollment drops sharply, putting more U.S. colleges in financial jeopardy", "full_content": "Amid changing visa policies and rising degree costs, significantly fewer new international students enrolled at U.S. colleges this year \u2014 a shift that could have financial repercussions for colleges, students and the broader economy.\n\nIn the fall 2026 semester, the tally of new international students studying in the U.S. fell 15% compared with the prior academic year, according to a fall snapshot released Monday by the nonprofit Institute of International Education.\n\nOver the 2025-26 academic year, the number of new international students in the U.S. fell more than 17%, largely because fewer graduate students came from countries such as India and China, the IIE's report found.\n\nA growing number of U.S. colleges said international student recruitment was a top concern, but the report also cited as significant barriers the high cost of a U.S. degree relative to other countries and uncertainty around new rules ending the traditional \"duration of status\" system and limiting most F-1 and J-1 visas to four years.\n\nEven though the Department of Homeland Security's new visa restrictions are currently on hold under a federal court injunction, experts say questions about the changing policies may have already discouraged some prospective international students.\n\n\"At a time when countries around the world are competing for talent, the United States should be strengthening our ability to attract the best and brightest, not creating new barriers to it,\" Fanta Aw, executive director and CEO of NAFSA: Association of International Educators, said in a Sept. 14 statement after a federal court temporarily blocked the Department of Homeland Security's new visa rules.\n\nForeign students typically pay full tuition, making international enrollment an important revenue source for colleges and universities, according to Robert Franek, editor-in-chief of The Princeton Review.\n\nWith fewer tuition dollars coming in, there are fewer resources for U.S.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:50 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia gets two more price target cuts from analysts ahead of earnings", "full_content": "Nvidia has received two more price target cuts from shops on the Street following the departure of its long-time CEO, Jensen Huang.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:48 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. crude oil declines to $87 a barrel on recovering Middle East exports", "full_content": "Oil prices are falling Monday as shipments through the Strait of Hormuz recover and tensions between Iran and the U.S remain at a stalemate.\n\nBrent crude fell 2% to $93.90 per barrel Monday while West Texas Intermediate crude slipped 1.8% to about $87 per barrel.\n\nThe International Energy Agency said on Friday it expects global supply to exceed 1.7 million barrels a day in the fourth quarter of 2026, reversing its earlier forecast for a deficit as Middle East exports recover faster than global demand and even as shipping attacks continue.\n\nWTI Crude, YTD Meanwhile, Russia's crude oil production rose to 8.73 million barrels a day in October, a 210,000-barrel-a-day surge, according to the International Energy Agency.\n\nGoldman Sachs said in a Sunday note it expects Brent to average $88 a barrel in 2027 and fall to $78 by December 2027 as the market returns to a surplus.\n\nThe bank believes idle East supply to rise above its 2025 average as producers use ship-to-ship transfers and add pipeline capacity.", "source": "CNBC Finance", "pub_date_str": "16 Nov 2026, 09:47 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Stocks Fall Before Nvidia Earnings, Anthropic IPO: Markets Wrap - Bloomberg", "full_content": "Stocks Fall Before Nvidia Earnings, Anthropic IPO: Markets Wrap Bloomberg Stocks slide as Nvidia leads AI names lower: Live updates CNBC Stocks dip ahead of Nvidia earnings, Anthropic IPO Reuters More drops for Nvidia and other AI stocks drag the US market lower AP News Wall Street falls as Nvidia jitters cloud sentiment ahead of results The Detroit News", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 09:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission: Unions seek 3.833 fitment factor, \u20b969,000 minimum pay and 50% family pension for pensioners", "full_content": "The 8th Pay Commission could bring significant changes to the salary and pension structure of central government employees, with employee unions seeking a higher fitment factor, improved family pension and better retirement benefits. Among the key proposals is a fitment factor of 3.833, which could raise the minimum basic pay from the existing \u20b9 18,000 to \u20b9 69,000 if accepted. The unions have also proposed increasing family pension to 50% of the last-drawn basic pay and raising regular pension to 67%.\n\nThese proposals form part of the demands submitted by the Staff Side of the National Council-Joint Consultative Machinery (NC-JCM) to the 8th Central Pay Commission. However, these are recommendations made by employee representatives and are not approved government benefits. The final salary and pension structure will depend on the commission's recommendations and the government's decision.\n\nThe NC-JCM Staff Side has proposed a fitment factor of 3.833 for revising the basic pay of existing central government employees. The proposal is based on increasing the minimum basic pay from \u20b9 18,000 under the 7th Pay Commission to \u20b9 69,000 under the next pay structure.\n\nThe fitment factor is a multiplier used to calculate revised basic pay when a new pay commission's recommendations are implemented. Under the 7th Pay Commission, the government had approved a fitment factor of 2.57.\n\nIf the proposed 3.833 factor is accepted, an employee currently drawing a minimum basic pay of \u20b9 18,000 could see it revised to \u20b9 69,000.\n\nHowever, this does not mean that the employee's total monthly salary or take-home pay will increase by the same proportion.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 09:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Anthropic\u2019s Wall Street whisperer: Meet CFO Krishna Rao", "full_content": "After closing a $65 billion funding round in May, he's been readying the artificial intelligence company for what's widely expected to be a blockbuster IPO . The listing could value Anthropic at roughly $1.4 trillion , instantly making it one of the largest tech companies in the world.\n\nRao joined Anthropic in 2024, when the company was still considered an underdog to OpenAI , now its chief rival. He's known as a straight shooter and a deft operator with a relentless work ethic, according to Anthropic investors and former colleagues, and he's played a crucial role in fueling the company's historic rise.\n\nThe 43-year-old finance chief has largely stayed out of the public eye, opting to yield the spotlight to Anthropic's seven co-founders , including CEO Dario Amodei and President Daniela Amodei . But Anthropic's upcoming Nasdaq debut, which is expected to take place on Thursday, will likely push him to center stage, as public market investors and analysts hang on his every word for insight into the AI trade.\n\nRao has nearly two decades of experience in finance across a range of companies, including Fanatics Commerce, a sports merchandise retailer, Cedar, a health care payments and billing platform, Airbnb and Blackstone . But he's never taken a company public as a CFO, and the stakes are high.\n\nInvestors are still reeling after Jensen Huang resigned as CEO of Nvidia following shocking reports of three extramarital affairs . The market was already jittery on concerns that rising interest rates would make debt unaffordable for companies that need it for costly infrastructure purchases.\n\n\"He's a committed professional. He's integrity-based, and he's had this meteoric rise in a very, very complex set of companies,\" Jonathan Mildenhall, Airbnb's former marketing chief and a Fanatics board member, told CNBC in an interview. \"There was nothing easy about Airbnb. There was nothing easy about Fanatics.", "source": "CNBC World Economy", "pub_date_str": "16 Nov 2026, 09:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "New bond revealed", "full_content": "Who could it be?", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 09:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "'We slept here': Flight delays linger as airlines recover from ground stop, but schedule improves Monday", "full_content": "U.S. flights delays eased on Monday as airlines scrambled to get back on track after the Federal Aviation Administration grounded departures nationwide for more than four hours on Friday.\n\nNearly 300 U.S. flights were canceled and close to 1,000 were delayed Monday, a fraction of Sunday's disruptions, according to FlightAware data.\n\nTransportation Secretary Sean Duffy over the weekend tied the issue that prompted officials to call for the ground stop to a router in southern Arkansas and work to update copper wires to a fiber-optic system overseen by L3Harris Technologies . FAA Administrator Bryan Bedford said the upgrades were part of \"routine\" maintenance to switch over to fiber optic.\n\nOfficials ordered the ground stop before 4 p.m. ET on Friday and it lasted until after 8 p.m. ET, marking the longest halt to U.S. flight departures since 9/11.\n\nHundreds of thousands of travelers were stranded and about 18,000 U.S. flights were canceled from Friday through Monday morning, according to FlightAware.\n\nOver that period, American Airlines had the most cancellations with 5,367 flights, close to 22% of its schedule, followed by Delta Air Lines with 3,434 cancellations, or 17% of its schedule, according to aviation data firm Cirium. Southwest Airlines and United Airlines each canceled more than 16% of their schedules. Bad weather on Thursday and Friday had also contributed to disruptions before the ground stop.\n\nOn Sunday, disruptions lingered but were starting to improve.\n\n\"We slept here,\" said Beth Martin, who was trying to travel home to Birmingham, Alabama, from New York's LaGuardia Airport on Sunday at the end of her daughter's birthday trip. The two were booked for Saturday night, and when delay announcements started rolling in from Delta, they decided to make good use of the extra time: After strolling through Central Park, they went window shopping on Fifth Avenue.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Prediction market odds for Tesla-SpaceX merger by April 2027 top 60%", "full_content": "Odds of a SpaceX and Tesla merger before March 2027 climbed to 62% from 27% since Thursday on Kalshi.\n\nChances that that Elon Musk's two companies, SpaceX, a satellite and rocket maker, and Tesla, an electric vehicle manufacturer, will soon integrate have jumped across multiple Kalshi markets since late last week.\n\nThe contract asks \"When will Tesla and SpaceX merge?\" and would be verified by news outlets and the Securities and Exchange Commission's EDGAR database.\n\nOn Friday, Walter Isaacson , a CNBC contributor and author of a Musk biography, told CNBC's \" Squawk Box \" he's confident a merger is coming. He cited Terafab, the semiconductor project involving Tesla, SpaceX and xAI, as a catalyst.\n\n\"I think you have to have a merger. Makes no sense otherwise,\" Isaacson said.\n\nTesla's 2026 annual shareholder meeting, set for Dec. 3, may provide more insight into a potential linkup, Isaacson said.\n\nWhile speculators are anticipating an announcement of a merger this year, a research note from Jefferies last week said a deal will likely face backlash after the Democrats won control of Congress and several key governorships in the midterm elections earlier this month.\n\n\"We understand there is higher risk of scrutiny post elections, but the vision of a combined SpaceX and Tesla as proxies for longer-term U.S. national strategies of independence and leadership in space, energy, manufacturing or semiconductors, in our view, remain highly relevant regardless of which party controls Congress,\" wrote Jefferies analyst Philippe Houchois.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Barclays lowers 2027 year-end target for S&P 500 index to 8,700", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Barclays lowers 2027 year-end target for S&P 500 index to 8,700 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Barclays lowers 2027 year-end target for S&P 500 index to 8,700 SECTIONS Barclays lowers 2027 year-end target for S&P 500 index to 8,700 Reuters Last Updated: Nov 16, 2026, 09:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Monday, Barclays
