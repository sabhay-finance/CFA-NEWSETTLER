    const allData = {"general": [{"title": "How PGIM India's Rs 112 crore Healthcare Fund picks CDMO stocks to generate alpha", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a How PGIM India's Rs 112 crore Healthcare Fund picks CDMO stocks to generate alpha Manipal Health Enterprises Share Price The Economic Times daily newspaper is available online now. Read Today's Paper How PGIM India's Rs 112 crore Healthcare Fund picks CDMO stocks to generate alpha SECTIONS How PGIM India's Rs 112 crore Healthcare Fund picks CDMO stocks to generate alpha By Nikhil Agarwal , ETMarkets.com Last Updated: Sep 06, 2026, 01:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PGIM India Healthcare Fund generated a 22% return over the past year by over-allocating to high-growth segments like CDMO, specialty pharma, and hospitals. Anandha Padmanabhan shares insights on navigating hospital capacity expansions, China-plus-one opportunities, GLP-1 dynamics, and key stock-selection strategies across healthcare sub-sectors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Sep 2026, 01:01 PM IST", "pub_date_relative": "4m ago"}, {"title": "Switched careers and stopped EPF contributions? Know what happens to your PF and pension", "full_content": "Employee Provident Fund (EPF) is an important part of building retirement savings for salaried employees. A part of your salary goes into your PF account every month, while your employer also makes a contribution towards it.\n\nIndividuals who switch careers or move to a job where EPFO-managed provident fund is not applicable may stop making regular contributions to their PF account. Similarly, the employer also stops their contribution towards both EPF and EPS.\n\nThe employee generally contributes 12% of their basic wages plus dearness allowance to EPF, while the employer also contributes 12%. Of the employer\u2019s contribution, 8.33% is typically diverted towards the Employees\u2019 Pension Scheme (EPS), and the remaining portion goes towards the worker's EPF account.\n\nWhen you leave your salaried job or become self-employed, you no longer have an employer making provident fund contributions on your behalf. The same thing applies to those who move to a job where EPF is not applicable.\n\nFor example, if you leave your job and start working for a foreign client that does not provide EPF, stop working altogether or start your own business, you may no longer be covered under the Employees Provident Fund Organisation ( EPFO ).\n\nSince EPF contributions are linked to to an employer-employee relationship, you cannot continue making regular mandatory employee and employer contributions to your EPF account on your own.\n\nHowever, your existing EPF balance does not disappear in any of the above mentioned scenarios. The accumulated amount remains in your EPF account and can continue to earn interest until a certain period,\n\nEPFO continues to credit interest in your account even after you stop working or leave your job, until you turn 58 years old, according to the central retirement fund body's FAQ section.", "source": "LiveMint Money", "pub_date_str": "06 Sep 2026, 12:39 PM IST", "pub_date_relative": "27m ago"}, {"title": "How Asian markets, crude will impact Sensex, Nifty tomorrow: What GIFT Nifty, Nikkei, Kospi, Taiwan signal for India", "full_content": "Stock Market prediction for Monday, 7 September 2026 : Indian equity markets ended the week on a cautious note, extending their corrective trend as elevated crude oil prices, renewed geopolitical tensions and uncertainty over the global interest-rate outlook continued to dampen investor sentiment.\n\nWhile benchmark indices recovered on Friday and broke a four-session losing streak, the gains remained limited amid persistent foreign investor selling and concerns over rising energy costs.\n\nFor the week, the Nifty 50 declined around 1.15% to close at 23,897.70, while the Sensex fell nearly 1% to settle at 76,515.43. Both benchmarks recorded their fourth consecutive weekly decline, highlighting continued weakness despite selective buying in individual stocks. The broader market remained relatively resilient, with small-cap indices posting marginal gains, while the mid-cap index ended lower.\n\nOn Friday, the 30-share BSE Sensex gained 362.57 points, or 0.485, to close at 76,515.43, with 20 of its constituents ending in positive territory while 10 declined. The benchmark surged as much as 730.28 points, or 0.95%, during the session to touch an intraday high of 76,883.14.\n\nMeanwhile, the broader NSE Nifty advanced 24.25 points, or 0.10%, to finish at 23,897.70. The index remained above the previous close for most of the trading session and crossed the 24,000 mark to hit an intraday peak of 24,005.75, gaining 132 points at its highest level. However, it surrendered most of its gains during the newly introduced Closing Auction Session and ended with a marginal rise.\n\nAccording to market experts, the week ahead is likely to remain highly influenced by global monetary policy decisions, crude oil price movements and evolving geopolitical developments.\n\nGift Nifty closed at around 10 points down at 23,999.50 on 5 September.\n\nThe Sensex closed the week at 76,515.43, rising 362.57 points, or 0.48%, on Friday. However, the index still ended the week nearly 1% lower.", "source": "LiveMint Markets", "pub_date_str": "06 Sep 2026, 12:35 PM IST", "pub_date_relative": "31m ago"}, {"title": "Bitcoin bull flag 80% done, trapped in range: Hourly", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 12:32 PM IST", "pub_date_relative": "34m ago"}, {"title": "Have Rs 20 Lakh To Invest? SIP, Lumpsum Or STP \u2014 Which Strategy Makes More Sense?", "full_content": "Have Rs 20 lakh ready to invest? Here\u2019s how lumpsum, SIP and STP strategies differ, and which approach may suit investors based on their risk appetite, investment horizon and comfort with market volatility.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 12:30 PM IST", "pub_date_relative": "36m ago"}, {"title": "FPIs resume selling; pull out Rs 7,443 cr from equities in first week of Sep", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FPIs resume selling; pull out Rs 7,443 cr from equities in first week of Sep Central Depository Services (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper FPIs resume selling; pull out Rs 7,443 cr from equities in first week of Sep SECTIONS FPIs resume selling; pull out Rs 7,443 cr from equities in first week of Sep PTI Last Updated: Sep 06, 2026, 12:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis September witnessed a notable outflow of Rs 7,443 crore from Indian equities as foreign investors retracted their investments, a stark contrast to the previous months' inflows. Contributing factors include increasing crude oil prices and robust US bond yields affecting investor confidence. Meanwhile, India's primary market still captivates foreign funds, showing resilience in attracting capital.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Sep 2026, 12:27 PM IST", "pub_date_relative": "39m ago"}, {"title": "Govt mulls FDI liberalisation in plantation sector", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Govt mulls FDI liberalisation in plantation sector The Economic Times daily newspaper is available online now. Read Today's Paper Govt mulls FDI liberalisation in plantation sector SECTIONS Govt mulls FDI liberalisation in plantation sector PTI Last Updated: Sep 06, 2026, 12:25:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is considering liberalizing foreign direct investment norms for plantations. More commercial crops like bananas could be included under this policy. The government aims to boost exports of bananas significantly in coming years. This move seeks to enhance India's global market share in banana production. Stakeholder consultations are currently underway for this proposed policy change.\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nQ1 investment numbers look stellar, but are we celebrating too early?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "06 Sep 2026, 12:25 PM IST", "pub_date_relative": "41m ago"}, {"title": "Singapore vs UAE Live Streaming: When And Where To Watch ACC Men's Premier Cup 2026 In India", "full_content": "Singapore were bowled out for 172 against UAE in ACC Mens Premier Cup 2026. UAE reached 16 for 2 in response, led by bowlers Mohammad Mohsin and Aayan Khan.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 12:22 PM IST", "pub_date_relative": "44m ago"}, {"title": "Atleast 11 Killed, Seven Injured In Western Iran's Fuel Tanker Explosion: Report", "full_content": "Emergency responders transported the injured to a medical facility in Sanandaj, as per media reports.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 12:17 PM IST", "pub_date_relative": "49m ago"}, {"title": "East Zone vs South Zone Live Streaming: Watch Vaibhav Sooryavanshi In Duleep Trophy 2026 Final", "full_content": "East Zone and South Zone will clash in the Duleep Trophy final at Chennai's MA Chidambaram Stadium from September 6 to 10, with East Zone batting first after winning the toss.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 12:17 PM IST", "pub_date_relative": "49m ago"}, {"title": "Citi shares its 3-month uranium outlook. Here are the price targets", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 12:16 PM IST", "pub_date_relative": "50m ago"}, {"title": "Unregistered Will and property transfer: Is a release deed mandatory in India? Know the legal position", "full_content": "When an individual leaves property to specific beneficiaries through a Will, several critical questions naturally arise, including whether the document must be registered before the property can be transferred.\n\nWhat are the other essential elements required (if any) in order to ensure that a legally sound transfer takes place? This issue attains even more significance when registration authorities ask beneficiaries to execute a release deed because the will is unregistered.\n\nThis write-up, hence, is dedicated towards these key legal aspects, sections, and associated factors in order to assist readers in ensuing better estate planning.\n\nTo put it simply, under Indian law, registration of a Will is not mandatory. An unregistered Will can also be legally valid, provided it has been carefully executed and attested. Not only this, but it also fulfils the applicable legal requirements. Furthermore, the registration of the Will may provide additional protection and additional evidentiary value, but the absence of registration by itself does not invalidate a Will.\n\nSection 63 of the Indian Succession Act, 1925 , establishes and lays down the requirements for the execution of an \u2018unprivileged Will\u2019. This is a normal Will that requires basic steps such as: signature or mark, witness attestation, signing in the presence of the testator, along with a host of other critical requirements.\n\nTherefore, the law primarily focuses on the proper execution and attestation of the Will rather than making registration a condition for its validity. The idea is to ensure that the steps are diligently followed.\n\nFurthermore, for an individual citizen, a valid Will can generally be used to bequeath, i.e., pass on self-acquired property in accordance with the testator\u2019s wishes. Hence, a release deed is not automatically required simply because the Will is unregistered.\n\nA released deed serves an entirely different purpose.", "source": "LiveMint Money", "pub_date_str": "06 Sep 2026, 12:16 PM IST", "pub_date_relative": "50m ago"}, {"title": "Aadhaar SIM check: Find and report numbers registered in your name to prevent financial fraud", "full_content": "There is a possibility of your Aadhaar card being linked to more than one mobile number. This is a fact that you might not have realised yet. As per the Department of Telecommunications (DoT) rules, an individual can have up to 9 mobile connections registered in their name.\n\nFurthermore, this rule has been established to efficiently regulate mobile connections; the growing misuse of Aadhaar details has made it critical for individual citizens to periodically check and review which numbers are linked to their own identity.\n\nTelecom operators across the nation accept Aadhaar cards as valid identity and address verification documents for issuing a new SIM card to an individual. This ensures that Aadhaar-based verification is seamless and convenient. Still, it also poses a serious risk if identity details fall into the wrong hands or if the data reaches individuals with illegitimate intentions.\n\nThis is because fraudsters and scamsters can allegedly use another person\u2019s identity documents to obtain SIM cards and then use those numbers for making calls, SMS, social media accounts, or even committing elaborate financial crimes.\n\nNow, in order to assist and help consumers identify such misuse, the government has introduced the \u2018Sanchar Saathi\u2019 platform. This is a platform that includes the Telecom Analytics for Fraud Management and Consumer Protection ( TAFCOP ) facility. The services provided by this platform permit users to check the mobile connections issued in their name and report numbers they do not recognise.\n\nThis is a relatively simple process.", "source": "LiveMint Money", "pub_date_str": "06 Sep 2026, 12:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "We Thought It Was An Ordinary Inspection': Rustomjee Crown Residents Recount The Day BMC Demolished Their Home Foyers", "full_content": "Residents say they were told BMC would conduct an inspection on Aug. 24, but demolition of disputed foyer structures followed; Bombay High Court has since ordered a status quo on further demolition.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Great Time For An Entrepreneur': Motilal Oswal AMC CEO On Where Indians Should Look For Opportunity", "full_content": "Motilal Oswal AMC CEO Prateek Agrawal believes the current times are great for young Indians to pursue entrepreneurship and build their own ventures.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "A \u20b910 mutual fund looks cheap. It isn\u2019t. Why NAV can fool investors", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAbout five or six years ago, a neighbour asked me for some help with his mutual fund investments. I went over his portfolio and saw that one midcap fund looked a bit dubious. Instead of just handing him the name of an alternative, I encouraged him to use Value Research Online and find one himself.\n\nA few days later, he told me that he had decided that the best alternative to that midcap fund was a liquid fund. When I asked him how he had come to this conclusion, he told me that the liquid fund was rated five-star by Value Research and the NAVs of the two were almost identical: one was \u20b9 37 and the other \u20b9 35.\n\nTo all of us who understand mutual funds , this is an absurd idea, but it seemed like a natural thing to him. Note that I am not mocking him. He is a successful businessman who started from scratch and found considerable success in just 15-20 years. He understands money well, in the way that an entrepreneur does.\n\nAnd that is exactly what made the episode stick in my mind. If someone like him could arrive at this, then the mistake is not a matter of intelligence. It is a matter of vocabulary.\n\nIn fact, the blame lies with the way all of us who are familiar with funds talk about NAV. We refer to it as the 'price' of a fund which you pay to 'buy' fund units.\n\nNow, if you wanted to buy a car priced at \u20b9 5 lakh and you were told to find an alternative, you would start looking for other cars which cost around \u20b9 5 lakh. If NAVs are loosely referred to as the price of a fund, then people will bring their existing mental model of what the word means to mutual funds as well. You can't blame them.\n\nThe problem is even greater in the case of new fund offers (NFOs), which are almost always priced at \u20b9 10. There is no accounting or regulatory reason for this. A fund could just as well start at \u20b9 100 or \u20b9 1,000.", "source": "LiveMint Money", "pub_date_str": "06 Sep 2026, 11:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "U.S.-Iran tanker war escalates as Hormuz disruption deepens", "full_content": "", "source": "Investing.com News", "pub_date_str": "06 Sep 2026, 11:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "India Captures 60% Of Europe\u2019s Eastern Diesel Transit As US, Russia Exports Plunge", "full_content": "India is becoming a key diesel supplier to Europe as Russian exports remain constrained and US shipments decline. With low European inventories and refinery maintenance approaching, the region faces greater supply risks.", "source": "NDTV Profit", "pub_date_str": "06 Sep 2026, 11:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "The One-Man Clean-Up Crew: How 'Bittu Tabahi' Transformed An MP River \u2014 And Landed A Dream Job", "full_content": "MP student Surendra Singh Choudhary, known as \u201cBittu Tabahi,\u201d spent months cleaning the polluted Ajnar River. His viral ef  employee generally contributes 12% of their basic wages plus dearness allowance to EPF, while the employer also contributes 12%. Of the employer\u2019s contribution, 8.33% is typically diverted towards the Employees\u2019 Pension Scheme (EPS), and the remaining portion goes towards the worker's EPF account.\n\nWhen you leave your salaried job or become self-employed, you no longer have an employer making provident fund contributions on your behalf. The same thing applies to those who move to a job where EPF is not applicable.\n\nFor example, if you leave your job and start working for a foreign client that does not provide EPF, stop working altogether or start your own business, you may no longer be covered under the Employees Provident Fund Organisation ( EPFO ).\n\nSince EPF contributions are linked to to an employer-employee relationship, you cannot continue making regular mandatory employee and employer contributions to your EPF account on your own.\n\nHowever, your existing EPF balance does not disappear in any of the above mentioned scenarios. The accumulated amount remains in your EPF account and can continue to earn interest until a certain period,\n\nEPFO continues to credit interest in your account even after you stop working or leave your job, until you turn 58 years old, according to the central retirement fund body's FAQ section.", "source": "LiveMint Money", "pub_date_str": "06 Sep 2026, 12:39 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How Asian markets, crude will impact Sensex, Nifty tomorrow: What GIFT Nifty, Nikkei, Kospi, Taiwan signal for India", "full_content": "Stock Market prediction for Monday, 7 September 2026 : Indian equity markets ended the week on a cautious note, extending their corrective trend as elevated crude oil prices, renewed geopolitical tensions and u     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
