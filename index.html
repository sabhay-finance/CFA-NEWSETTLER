SJ See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 07:44 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hedge-fund legend Paul Tudor Jones says the stock market faces a really challenging 2027. Here\u2019s why.", "full_content": "U.S. stocks could face a serious test in 2027 as a tsunami of new equity issuance threatens to upend the artificial-intelligence-driven bull market, according to hedge-fund billionaire Paul Tudor Jones.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 07:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Govt Likely To Meet FY27 Revenue Target As Tax Collections Stay Robust", "full_content": "Robust direct tax and GST collections, along with stronger customs receipts, are expected to help the Centre meet its FY27 net tax revenue target of Rs 28.7 lakh crore, cushioning a potential shortfall in excise duty collections.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tata Elxsi Q2 Results: Margin, Revenue Sees Marginal Rise | Check Key Numbers", "full_content": "Tata Elxsi reported a marginal decline in Q2 net profit to Rs 170.3 crore, while revenue grew 3.4% QoQ to Rs 1,056 crore. EBIT rose 7.3%, and the operating margin expanded to 19.7%. Shares gained 5.21% on October 13.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PTC Industries among 4 stocks hitting 52-week highs; rally up to 15% in a month", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News PTC Industries among 4 stocks hitting 52-week highs; rally up to 15% in a month Written by Ritesh Presswala , ETMarkets.com | Oct 13, 2026, 07:31:55 PM IST 1 / 5 Fresh Peak Sensex surged 1,109 points to close at 73,033 on Tuesday. Amid the market rally, four stocks from the BSE 500 index touched fresh 52-week highs, reaching their highest levels in the past year. A 52-week high represents the highest price at which a stock has traded over the previous 12 months and can indicate increased investor interest and trading activity.\n\nNew 52-week high: Rs 4,444 | CMP: Rs 4,368.15. In the last month, the stock has gained about 14%.\n\nNew 52-week high: Rs 1,420.4 | CMP: Rs 1,404.1. In the last one month stock has gained about 13%.\n\nNew 52-week high: Rs 26,049.95 | CMP: Rs 2,5490.1. In the last one month stock has gained about 8%.\n\nNew 52-week high: Rs 1,224.25| CMP: Rs 1,222. In the last one month stock has gained about 4%.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 07:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Big IPO buzz! Jio Platforms reportedly attracts over $20 billion in bids ahead of India's biggest issue; GMP hits \u20b9200", "full_content": "Jio Platforms Ltd., the digital services arm of Reliance Industries, is said to have attracted more than $20 billion in bids for what could be India\u2019s biggest-ever initial public offering (IPO), Bloomberg reported, citing people familiar with the matter.\n\nDomestic investors, along with global firms Fidelity, Allianz, and Capital Group, have reportedly expressed strong interest in the issue.\n\nA final list of IPO anchor investors will likely be decided in the coming days, the report said, quoting the same people. The process is ongoing, and no final decisions have been made yet.\n\nAfter earlier expectations put its valuation as high as $170 billion, Jio Platforms is now aiming for a valuation of up to \u20b9 10.3 trillion ($108 billion) in the IPO, people familiar with the matter have said.\n\nIn June, domestic brokerage Motilal Oswal Financial Services estimated Jio Platforms\u2019 valuation at between $115 billion and $118 billion, while Dolat Capital valued the company at about $110 billion.\n\nAkash Ambani, the 34-year-old managing director of Jio Platforms and son of billionaire Mukesh Ambani, has been leading the deal, holding meetings in Hong Kong, London and New York in recent weeks.\n\nThe proposed listing would mark the first public offering by the Reliance Group in nearly two decades and the first listing of a consumer-facing business within the conglomerate.\n\nNone of Jio Platforms\u2019 investors, which include Meta Platforms Inc., Alphabet Inc., Mubadala and Saudi Arabia\u2019s Public Investment Fund, are looking to exit through the IPO, as the offering is entirely a primary issue, according to the draft prospectus.", "source": "LiveMint Markets", "pub_date_str": "13 Oct 2026, 07:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Millions of Americans will have fewer options during Medicare open enrollment this year", "full_content": "There will be no Medicare Advantage plans in 181 counties in 2027, up from 67 in 2026.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Oct 2026, 07:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Micron, Seagate, Western Digital sink as chip sell-off deepens", "full_content": "Chip stocks fell on Tuesday, extending a sell-off sparked by worries over artificial intelligence financing and intensifying competition.\n\nMemory chip giant Micron slipped about 5% while other memory-related names such as SanDisk , Seagate and Western Digital also sank. SanDisk fell 5% while Seagate and Western Digital both dropped 6%.\n\nThe slide, which followed declines on Wall Street on Monday, comes as investors assessed intensifying competition from China's ChangXin Memory Technologies, or CXMT .\n\nOver the weekend , CXMT announced significant progress in developing a new chip architecture, designed to increase memory density by packing more data into a smaller space.\n\nCXMT is China's leading rival to the likes of Micron and South Korean heavyweights SK Hynix and Samsung Electronics . Analysts broadly see CXMT as trailing the U.S. and South Korean memory leaders, which means any advancement from the Chinese firm could add more competition to the market leaders.\n\n\"Investors are jittery and looking for excuses to take profit on AI-related stocks that have outperformed this year, especially memory stocks,\" said UBP's senior equity advisor Vey-Sern Ling.\n\n\"In reality, while the Chinese memory makers can potentially become a threat to global demand-supply balance over time, in the short run they continue to face technology hurdles, especially for more advanced memory like HBM,\" Ling told CNBC via email.\n\nMicron, Seagate, SanDisk, Western Digital stock chart. 'Vulnerable' AI sentiment? Phillip Wool, chief market strategist at Rayliant Global Advisors, said CXMT's breakthrough marked a significant milestone for Chinese chipmakers , demonstrating their ability to overcome technology restrictions and potentially challenge established players sooner than expected.", "source": "CNBC World Economy", "pub_date_str": "13 Oct 2026, 07:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Stock Market Today: Dow Jumps 369 Points, Nasdaq Falls As Memory Stocks Slide", "full_content": "Wall Street stocks trade mixed as the Dow gains nearly 369 points, while the Nasdaq and S&P 500 slip amid a memory-stock selloff, concerns over Chinese competition and AI investment expectations.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 07:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "London Stock Exchange owner in talks to buy credit specialist Octus", "full_content": "Deal with private equity group Permira could value data group at $3.5bn", "source": "FT Markets", "pub_date_str": "13 Oct 2026, 07:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "JPMorgan profit misses analyst estimates as Jamie Dimon warns economic forces 'shift under the surface' - Yahoo Finance", "full_content": "JPMorgan profit misses analyst estimates as Jamie Dimon warns economic forces 'shift under the surface' Yahoo Finance JPMorgan's earnings miss, Delta delays Riyadh route, McDonald's chicken plans and more in Morning Squawk CNBC JPMorgan Posts Surprise Drop in Fixed-Income Trading Revenue Bloomberg.com JPMorgan posts rare profit miss as dealmaking, bond trading lose momentum Reuters JPMorgan Q3 2026 earnings miss; memory chip stocks slide qz.com", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 07:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks opens lower after bank earnings; chips weigh", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks opens lower after bank earnings; chips weigh Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks opens lower after bank earnings; chips weigh SECTIONS US stocks opens lower after bank earnings; chips weigh Reuters Last Updated: Oct 13, 2026, 07:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The S&P 500 and the Nasdaq opened lower on Tuesday as chip stocks came under selling pressure again, while investors assessed a mixed set of quarterly results, including reports\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Goldman Equity Traders Top Estimates as Fixed Income Falls Short - Bloomberg.com", "full_content": "Goldman Equity Traders Top Estimates as Fixed Income Falls Short Bloomberg.com Goldman Sachs blows past Wall Street estimates, while JPMorgan earnings miss the mark MarketWatch US bank results live: Equities boost helps Goldman overcome Wall Street\u2019s fixed income woes Financial Times Goldman Sachs profits surge 29% as trading boom holds up better than expected Yahoo Finance Goldman Sachs beats quarterly profit estimates on equities strength Reuters", "source": "Google News Business", "pub_date_str": "13 Oct 2026, 07:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Thousands of homeowners face adjustable-rate mortgage resets \u2014 and much higher payments", "full_content": "Thousands of homeowners with adjustable-rate mortgages may soon face a potential spike in the interest rate that's applied to their loan.\n\nAbout 150,000 borrowers with ARMs are scheduled to see their interest rates adjust for the first time this year, with another 186,000 facing their first adjustment in 2027 and 155,000 doing so in 2028, according to ICE Mortgage Technology, a mortgage data and technology company. Of this year's total, ICE data provided to CNBC shows about 64,000 were scheduled for their first adjustment between August and December.\n\nBecause rates have climbed since many of these borrowers took out their loans, their monthly payments may jump by hundreds of dollars \u2014 and in some cases, more than $1,000, according to ICE data. Meanwhile, a small share could see their rate and monthly payment go down.\n\nUnlike a fixed-rate mortgage, an ARM has an interest rate that can change over time. ARMs often start with an introductory rate that's lower than on fixed-rate loans , but after an initial period \u2014 often five, seven or 10 years \u2014 the rate begins adjusting. Once they begin, those resets typically happen every six months or one year and can raise or lower the homeowner's monthly payment.\n\n\"Basically, when you took out that adjustable-rate mortgage, you got a little bit lower rate in exchange for the possibility that rates could rise and you could be adversely affected,\" said Laurie Goodman, fellow and founder of the Housing Finance Policy Center at the Urban Institute, a nonprofit think tank. \"Well, unfortunately that scenario happened.\"\n\nThere are 3.1 million outstanding ARMs, the largest volume in 5.5 years, according to ICE. Most of them \u2014 2.05 million \u2014 are still in their initial fixed period, and 1.05 million have matured into their adjustable phase, ICE data shows.\n\nARMs make up just 5.6% of the roughly 55.4 million active mortgages in the U.S.\n\nExactly how much borrowers will see their rates adjust depends partly on their introductory rate.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 07:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Paul Tudor Jones says 2027 could be a really challenging year for the stock market", "full_content": "Legendary hedge fund manager Paul Tudor Jones told CNBC that next year could be a tough one for the stock market because of increased equity supply from big tech IPOs coming down the pipe, as well as a potential reckoning from the ballooning U.S. fiscal deficit.\n\n\"2027 is going to be really, really challenging for the stock market,\" Jones told \"Squawk Box\" on Tuesday. \"You've probably got the most negative flow picture for the U.S. stock market that we've had, say, since 2002.\"\n\nThe founder and chief investment officer of Tudor Investment said that corporate buybacks, along with mergers and acquisitions, have been a tailwind for the stock market for most of this four-year bull market as they decreased the equity supply.\n\nThat tide is now turning against the market with major offerings ahead in the AI space from Anthropic and OpenAI, along with one just finished in SpaceX. There will also likely be more secondary offerings from companies in order to raise money for the AI buildout, said Jones. It all adds up to an increased equity supply picture that could weight on prices.\n\nThe billionaire hedge fund manager's comments come as investors worry that a bull market now in its fourth year could start to dwindle and run out of steam as concerns grow around mounting inflation, higher bond yields and a more hawkish Federal Reserve.\n\nJones repeated that the current period in the market is akin to 1999 , just about a year before the dot-com bubble burst in 2000. He noted the bifurcation in the current market between those companies benefitting from the AI boom and those that aren't.\n\nHe also added that a ballooning fiscal deficit are among the dangers for the current stock market, for which he thinks there could be a reckoning.\n\n\"We're never going to fix these deficits until the market makes us to. It's going to be just like 2008 and TARP [Troubled Asset Relief Program]. So that's the reality. No politician is going to voluntarily raise taxes or cut spending.", "source": "CNBC Top News", "pub_date_str": "13 Oct 2026, 07:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Buying a home? 5 RERA rights every homebuyer should know on builder delays, advance payments and construction defects", "full_content": "Buying a home involves more than checking the price, location and amenities. Homebuyers also need to understand the legal protections available if a builder delays possession, changes the promised layout or fails to deliver what was advertised. The Real Estate (Regulation and Development) Act, 2016, commonly known as RERA, lays down several obligations for developers and gives buyers remedies in specified circumstances.\n\nThe law covers issues ranging from advance payments and changes to approved plans to defects after possession and misleading advertisements. However, the availability of a remedy depends on the relevant provision, the facts of the case and applicable state rules.\n\nHere are five RERA rights homebuyers should know before purchasing a property.\n\nUnder Section 13 of RERA, a promoter cannot accept more than 10% of the cost of an apartment, plot or building as an advance payment or application fee without first entering into a written agreement for sale with the buyer and registering that agreement.\n\nThe provision is intended to ensure that buyers have a formal agreement setting out the terms of the transaction before paying a substantial part of the property's cost. The agreement for sale is expected to specify details such as the development work, payment schedule and date of possession.\n\nSection 18 of RERA provides remedies when a promoter fails to complete a project or give possession in accordance with the agreement for sale.\n\nIf a buyer chooses to withdraw because of such a failure, the promoter is liable to return the amount received, along with prescribed interest and applicable compensation under the Act. If the buyer chooses to remain in the project, the promoter must pay interest for every month of delay until possession is handed over.\n\nThe provision gives buyers options when a developer fails to meet the agreed timeline. The remedy available depends on the circumstances covered by the law.", "source": "LiveMint Money", "pub_date_str": "13 Oct 2026, 07:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Gold Near Rs 1.5 Lakh Before Diwali: What You Actually Pay For 10 Grams", "full_content": "Generally, there are three popular ways of investing in gold: Bars or coins, jewellery or ETFs.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 06:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "AI Could Account For Half Of Infosys' Revenue In 2-3 Years; CEO Warns Of Infra Backlash Extending To India", "full_content": "Infosys CEO Salil Parekh sees AI rising to 50% of the company's work in 2-3 years, while warning that data centre costs and infrastructure backlash could pose risks.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 06:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Strong statistical systems key to achieving Viksit Bharat by 2047, says PM's principal secretary", "full_content": "India requires a reliable and technology-enabled statistical system to aid evidence-based policymaking. Principal Secretary to the Prime Minister P K Mishra emphasized the need for stronger state-level statistical institutions. He highlighted the importance of integrating data systems and using advanced technologies for accurate statistics. Mishra urged that more granular data is essential for assessing policy outcomes and addressing regional disparities.", "source": "Economic Times Economy", "pub_date_str": "13 Oct 2026, 06:32 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "India's benchmark bond breaks 4-day falling streak as value investors return", "full_content": "Indian government bonds have rebounded following a significant rise in yields, drawing investors back into the market. The benchmark bond yield has risen due to a central bank policy rate hike and liquidity measures. The rupee has appreciated against the dollar after the central bank implemented new measures to support the currency. Meanwhile, traders are anticipating US inflation data, which could influence Federal Reserve decisions.", "source": "Economic Times Markets", "pub_date_str": "13 Oct 2026, 06:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Adani Enterprises, Jabil Sign MoU For AI, Data Centre Hardware Manufacturing Joint Venture", "full_content": "The venture is expected to build AI racks at a multi-gigawatt scale, catering to computing infrastructure with a combined power capacity of several gigawatts.", "source": "NDTV Profit", "pub_date_str": "13 Oct 2026, 06:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Tuesday", "full_content": "The chip stock rout seems to know no end. But earnings from Club names Goldman Sachs and Wells Farg     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
