ll_content": "Japanese markets reacted in a seemingly counterintuitive fashion on Friday after the country's central bank hiked benchmark interest rates to their highest in 31 years.\n\nInterest-rate increases ordinarily support a country's currency, push up its bond yields, and put pressure on its stock market. Japan's currency, bond yields, and stock market did exactly the opposite.\n\nThe yen weakened past 157 against the dollar, the yield on the 10-year Japanese Government Bond slipped, while the Nikkei 225 gained 1.5% as the BOJ raised its policy rate to 1.25%.\n\nThe hike brought the policy rate to its highest level since 1995, and came just three months after its previous increase.\n\nExperts pointed to the split decision by the BOJ's board, as the reason for the uncharacteristic market reaction, as it indicated that the bank might not take a too hawkish stance.\n\n\"The two dissenting votes in favor of keeping rates unchanged came as a surprise,\" said Hirofumi Suzuki, chief FX strategist at Japanese bank Sumitomo Mitsui Banking Corporation.\n\nThe decision to hike was split 7-2, with board members Toichiro Asada and Ayano Sato dissenting from the verdict.\n\nAsada noted that as the core inflation rate was below 2%, the economic situation might not be strong, and advocated for holding rates steady. Core inflation for August in Japan stood at 1.7%, down from 1.8% in July.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 12:49 PM IST", "pub_date_relative": "18m ago"}, {"title": "Our AI knew it: See why this small-cap travel stock just surged +34%", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "Jefferies hikes Navin Fluorine share price target, forecasts 14% upside. 4 reasons why", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203 "title": "US Market: SEC unveils five-year exemption for tokenized stock trading", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US Market: SEC unveils five-year exemption for tokenized stock trading Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Market: SEC unveils five-year exemption for tokenized stock trading SECTIONS US Market: SEC unveils five-year exemption for tokenized stock trading By Anupam Nagar , ETMarkets.com Last Updated: Sep 18, 2026, 12:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The SEC has introduced a five-year exemption to facilitate trading in tokenized stocks, allowing certain blockchain-based platforms to operate under limited regulatory relief. The framework gives issuers the right to object to tokenized listings and excludes synthetic stock tokens, while seeking to balance innovation with investor protection and market integrity.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 12:33 PM IST", "pub_date_relative": "35m ago"}, {"title": "Grauer & Weil share price jumps 11% after key AGM decisions | Details here", "full_content": "Shares of Grauer & Weil (India) jumped over 11% on Friday, 18 September, after shareholders approved a final dividend of Re 0.50 per equity share for the financial year ended 31 March 2026.\n\nThe dividend, equivalent to 50% of the face value of Re 1 per share, was approved at the company\u2019s 68th Annual General Meeting (AGM) held on 17 September 2026. The AGM was conducted through Video Conferencing (VC) and Other Audio Visual Means (OAVM), in compliance with applicable Ministry of Corporate Affairs and SEBI guidelines.\n\nUmeshkumar More, Chairman of Grauer & Weil, presided over the meeting and confirmed that the required quorum was present in accordance with the Companies Act, 2013.\n\nDuring the AGM, shareholders approved the adoption of the company\u2019s standalone and consolidated financial statements for FY26, along with the Board\u2019s and auditors\u2019 reports. They also approved the reappointment of Yogesh Samat as a director liable to retire by rotation.\n\nIn addition, shareholders approved the reappointment of Rohitkumar More as a Whole-time Director for a term of five years, beginning on 1 April 2027. Yogesh Samat was also reappointed as a Whole-time Director for two years, effective 1 July 2026.\n\nOther resolutions included revisions to the remuneration of Aman More and Yash More, as well as the ratification of remuneration payable to the Cost Auditors for FY27.\n\nThe statutory and secretarial auditors issued unqualified opinions on the company\u2019s FY26 financial statements, with no qualifications or adverse remarks. Accordingly, the auditor reports were taken as read at the AGM.\n\nThe company also facilitated electronic voting through CDSL from 12 September to 16 September 2026, with GMJ & Associates appointed as the scrutinizer. The voting results are expected to be published on the company\u2019s website and the BSE platform.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 12:32 PM IST", "pub_date_relative": "35m ago"}, {"title": "Bitcoin is set to hit a key level by next year as fiscal worries prop up the cryptocurrency: VanEck", "full_content": "Sigel said that conversations with institutional clients, from advisors to sovereign wealth funds indicate that they are all buying bitoin.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 12:29 PM IST", "pub_date_relative": "38m ago"}, {"title": "14 stocks held by 100+ MFs in August surged up to 200%; 5 turned multibaggers in CY26", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 14 stocks held by 100+ MFs in August surged up to 200%; 5 turned multibaggers in CY26 Written by Ritesh Presswala , ETMarkets.com | Sep 18, 2026, 12:47:09 PM IST 1 / 15 Fund Favourites When a large number of mutual fund schemes invest in the same stock, it often indicates strong institutional interest and can boost retail investor confidence. As of August 2026, data show that 289 stocks were held by more than 100 mutual fund schemes, highlighting the extent of mutual fund participation across these companies. An analysis by ETMarkets showed that 95 of these stocks had gained more than 10% since the start of CY26. Among them, 14 stocks delivered gains ranging from 60% to 200% during the first eight-and-a-half months of CY26. The trend suggests that stocks with broad mutual fund participation have shown strong momentum during the period. (Data Source: ACE MF, ACE Equity)\n\nIn CY26, Welspun Corp Ltd. surged 202%, with its share price climbing from Rs 814 to Rs 2,460. As of August 2026, the stock was held across 126 mutual fund schemes, with total equity mutual fund holdings valued at Rs 5,198 crore.\n\nIn CY26, Aditya Infotech Ltd. gained 127%, with its share price rising from Rs 1,490 to Rs 3,378. As of August 2026, the stock was held across 108 mutual fund schemes, with total equity mutual fund holdings worth Rs 4,787 crore.\n\nIn CY26, Apar Industries Ltd. rallied 113%, with its share price increasing from Rs 8,368 to Rs 17,801. As of August 2026, the stock was held across 195 mutual fund schemes, with total equity mutual fund holdings valued at Rs 15,807 crore.\n\nIn CY26, TD Power Systems Ltd. advanced 106%, with its share price rising from Rs 351 to Rs 722.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 12:28 PM IST", "pub_date_relative": "39m ago"}, {"title": "Can Fayuvi FDA approval lift RARE stock further?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Can Fayuvi FDA approval lift RARE stock further? Written by Anupam Nagar , ETMarkets.com | Sep 18, 2026, 12:25:40 PM IST 1 / 6 \u200bRARE stock jumps 13% Ultragenyx Pharmaceutical shares jumped 12.6% to $14.50 on September 17 after the FDA approved Fayuvi, a gene therapy for children with Sanfilippo syndrome Type A. (Source: Yahoo Finance, Barron's, Reuters)\n\nThe FDA granted full approval to Fayuvi (UX111) for pediatric patients with Sanfilippo syndrome Type A, a rare inherited disorder that causes progressive neurological decline. The approval makes Fayuvi the first treatment targeting the underlying cause of the disease.\n\nFayuvi is administered as a single intravenous infusion. It uses a modified AAV9 virus to deliver a working copy of the missing SGSH gene, enabling cells to produce the enzyme needed to break down toxic heparan sulfate buildup in the brain.\n\nUltragenyx reported that treated children maintained or improved cognitive function between ages 2 and 5. The company reported a 23.5-point advantage on a standard cognitive score compared with an external natural-history group.\n\nThe FDA previously declined approval in 2025 because of manufacturing-related issues, rather than concerns over the clinical data. Ultragenyx resubmitted the application this year, eventually securing approval on September 17.\n\nRARE closed at $14.50, up 12.58%, on September 17, with more than 12.4 million shares changing hands. The stock remained about 37% lower year-to-date after a steep decline earlier in September following a failed late-stage Angelman syndrome trial.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 12:19 PM IST", "pub_date_relative": "48m ago"}, {"title": "MCX traders complain of commodity position prices not reflecting on Zerodha, broker blames delay in exchange reports", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a MCX traders complain of commodity position prices not reflecting on Zerodha, broker blames delay in exchange reports BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper MCX traders complain of commodity position prices not reflecting on Zerodha, broker blames delay in exchange reports SECTIONS MCX traders complain of commodity position prices not reflecting on Zerodha, broker blames delay in exchange reports By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 18, 2026, 12:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Zerodha users reported that average prices for MCX commodity positions, including gold, silver and crude oil, were showing as \u201cNA/0\u201d on the Kite app. Zerodha said the issue was caused by a delay in receiving reports from the exchange and added that it was coordinating with the exchange to resolve the problem promptly.\n\n@zerodha what is the meaning of this what is \"N/A\" here? Is @MCXIndialtd responsible for this? pic.twitter.com/H4Vy0j6vSr\n\nHi Arpan, the average price for your MCX commodity positions may show as \u201cNA/0\u201d on Kite due to a delay in receiving reports from the exchange. We\u2019re in touch with the exchange to resolve this at the earliest.\n\nIs it somekind of a Joke.. it 9:50 am... Mcx position not updating, International markets active. why MCX is down for over 50+ minutes and cant be trader in zerodha?? @MCXIndialtd @SEBI_Awareness @zerodha pic.twitter.com/XOTINgPEZS\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 12:16 PM IST", "pub_date_relative": "51m ago"}, {"title": "Bombay Burmah share price jumps 9.5% after \u20b9249 crore block deal - check details", "full_content": "Shares of Bombay Burmah Trading Corporation Ltd. jumped nearly 10% on Friday, September 18, after a large block transaction involving more than 18 lakh shares changed hands on the Bombay Stock Exchange. The sharp move in the Wadia Group flagship stock came after 2.62% of the company\u2019s equity was traded through block deals , drawing investor attention to the counter.\n\nThe transaction involved 18.3 lakh shares and was executed at an average price of \u20b9 1,360 per share. The total value of the block deal stood at \u20b9 249 crore. While the large trade was visible on the exchange, the identities of the official buyers and sellers were not yet known.\n\nFollowing the block deal activity, Bombay Burmah shares surged 9.5% to \u20b9 1,531.60 on the BSE.\n\nDespite Friday\u2019s sharp rise, the stock remains significantly below its previous 52-week peak. Bombay Burmah shares are down 31% from their 52-week high of \u20b9 2,135, which was recorded on October 23, 2025. The stock later touched a 52-week low of \u20b9 1,301 on March 30, 2026.\n\nThe Wadia Group flagship stock has gained 4% in the past one week. However, the broader performance remains mixed, with the shares declining 3% over the last three months, 4% in six months and 24% in the past one year.\n\nAt the end of the June quarter, promoter entities held a 74% stake in Bombay Burmah, while public shareholders accounted for the remaining 26%, according to data available on the BSE.\n\nAmong the public shareholders , Mutual Funds in India held a 0.5% stake, while Acacia Partners owned more than 4% stake in the company. In addition, more than 45,000 small retail shareholders \u2014 defined as those with authorised share capital of up to \u20b9 2 lakh \u2014 collectively held an 11.71% stake in the company.\n\nBombay Burmah Trading reported a consolidated net profit of \u20b9 582.7 crore for the quarter ended June 2026. This represented a 17.1% increase compared with \u20b9 497.7 crore reported in the corresponding quarter of FY25.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 12:06 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Ipsen appoints Mariette Finet to board of directors", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 01:02 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nestle weighing options after Russia takes control of local unit; shares dip", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 12:52 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Why Japanese stocks rose as government bond yields and the yen fell after rate hike", "full_content": "Japanese markets reacted in a seemingly counterintuitive fashion on Friday after the country's central bank hiked benchmark interest rates to their highest in 31 years.\n\nInterest-rate increases ordinarily support a country's currency, push up its bond yields, and put pressure on its stock market. Japan's currency, bond yields, and stock market did exactly the opposite.\n\nThe yen weakened past 157 against the dollar, the yield on the 10-year Japanese Government Bond slipped, while the Nikkei 225 gained 1.5% as the BOJ raised its policy rate to 1.25%.\n\nThe hike brought the policy rate to its highest level since 1995, and came just three months after its previous increase.\n\nExperts pointed to the split decision by the BOJ's board, as the reason for the uncharacteristic market reaction, as it indicated that the bank might not take a too hawkish stance.\n\n\"The two dissenting votes in favor of keeping rates unchanged came as a surprise,\" said Hirofumi Suzuki, chief FX strategist at Japanese bank Sumitomo Mitsui Banking Corporation.\n\nThe decision to hike was split 7-2, with board members Toichiro Asada and Ayano Sato dissenting from the verdict.\n\nAsada noted that as the core inflation rate was below 2%, the economic situation might not be strong, and advocated for holding rates steady. Core inflation for August in Japan stood at 1.7%, down from 1.8% in July.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 12:49 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jefferies hikes Navin Fluorine share price target, forecasts 14% upside. 4 reasons why", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Jefferies hikes Navin Fluorine share price target, forecasts 14% upside. 4 reasons why Navin Fluorine International Share Price Himadri Speciality Chemical Share Price Acutaas Chemicals Share Price Aether Industries Share Price Anupam Rasayan India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jefferies hikes Navin Fluorine share price target, forecasts 14% upside. 4 reasons why SECTIONS Jefferies hikes Navin Fluorine share price target, forecasts 14% upside. 4 reasons why By Veer Sharma , ETMarkets.com Last Updated: Sep 18, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jefferies has retained its Buy rating on Navin Fluorine International and raised its price target to Rs 9,405, citing growth prospects in CDMO, R32 and the Chemours project. The brokerage expects a 23% EPS CAGR through FY29, while the company\u2019s Q1FY27 profit more than doubled year-on-year to Rs 243 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 12:44 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India\u2019s \u2018sugar high\u2019 warrants caution on RBI hikes, JPMorgan Chase & Co.\u2019s Jahangir Aziz says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India\u2019s \u2018sugar high\u2019 warrants caution on RBI hikes, JPMorgan Chase & Co.\u2019s Jahangir Aziz says The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s \u2018sugar high\u2019 warrants caution on RBI hikes, JPMorgan Chase & Co.\u2019s Jahangir Aziz says SECTIONS India\u2019s \u2018sugar high\u2019 warrants caution on RBI hikes, JPMorgan Chase & Co.\u2019s Jahangir Aziz says Bloomberg Last Updated: Sep 18, 2026, 12:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis JPMorgan's Jahangir Aziz suggests India's economy is experiencing a temporary \"sugar high\" from past stimulus. He believes markets are anticipating too many interest rate increases this year. The Reserve Bank is expected to implement an initial quarter-point rate hike soon. However, future rate decisions remain uncertain for policymakers. Higher interest rates could negatively impact both investment and consumption levels.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pu  Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 12:33 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Grauer & Weil share price jumps 11% after key AGM decisions | Details here", "full_content": "Shares of Grauer & Weil (India) jumped over 11% on Friday, 18 September, after shareholders approved a final dividend of Re 0.50 per equity share for the financial year ended 31 March 2026.\n\nThe dividend, equivalent to 50% of the face value of Re 1 per share, was approved at the company\u2019s 68th Annual General Meeting (AGM) held on 17 September 2026. The AGM was conducted through Video Conferencing (VC) and Other Audio Visual Means (OAVM), in compliance with applicable Ministry of Corporate Affairs and SEBI guidelines.\n\nUmeshkumar More, Chairman of Grauer & Weil, presided over the meeting and confirmed that the required quorum was present in accordance with the Companies Act, 2013.\n\nDuring the AGM, shareholders approved the adoption of the company\u2019s standalone and consolidated financial statements for FY26, along with the Board\u2019s and auditors\u2019 reports. They also approved the reappointment of Yogesh Samat as a director liable to retire by rotation.\n\nIn addition, shareholders approved the reappointment of Rohitkumar More as a Whole-time Director for a term of five years, beginning on 1 April 2027. Yogesh Samat was also reappointed as a Whole-time Director for two years, effective 1 July 2026.\n\nOther resolutions included revisions to the remuneration of Aman More and Yash More, as well as the ratification of remuneration payable to the Cost Auditors for FY27.\n\nThe statutory and secretarial auditors issued unqualified opinions on the company\u2019s FY26 financial statements, with no qualifications or adverse remarks. Accordingly, the auditor reports were taken as read at the AGM.\n\nThe company also facilitated electronic voting through CDSL from 12 September to 16 September 2026, with GMJ & Associates appointed as the scrutinizer. The voting results are expected to be published on the company\u2019s website and the BSE platform.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 12:32 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin is set to hit a key level by next year as fiscal worries prop up the cryptocurrency: VanEck", "full_content": "Sigel said that conversations with institutional clients, from advisors to sovereign wealth funds indicate that they are all buying bitoin.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 12:29 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "14 stocks held by 100+ MFs in August surged up to 200%; 5 turned multibaggers in CY26", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 14 stocks held by 100+ MFs in August surged up to 200%; 5 turned multibaggers in CY26 Written by Ritesh Presswala , ETMarkets.com | Sep 18, 2026, 12:47:09 PM IST 1 / 15 Fund Favourites When a large number of mutual fund schemes invest in the same stock, it often indicates strong institutional interest and can boost retail investor confidence. As of August 2026, data show that 28 A exam areas."}, {"title": "Bombay Burmah share price jumps 9.5% after \u20b9249 crore block deal - check details", "full_content": "Shares of Bombay Burmah Trading Corporation Ltd. jumped nearly 10% on Friday, September 18, after a large block transaction involving more than 18 lakh shares changed hands on the Bombay Stock Exchange. The sharp move in the Wadia Group flagship stock came after 2.62% of the company\u2019s equity was traded through block deals , drawing investor attention to the counter.\n\nThe transaction involved 18.3 lakh shares and was executed at an average price of \u20b9 1,360 per share. The total value of the block deal stood at \u20b9 249 crore. While the large trade was visible on the exchange, the identities of the official buyers and sellers were not yet known.\n\nFollowing the block deal activity, Bombay Burmah shares surged 9.5% to \u20b9 1,531.60 on the BSE.\n\nDespite Friday\u2019s sharp rise, the stock remains significantly below its previous 52-week peak. Bombay Burmah shares are down 31% from their 52-week high of \u20b9 2,135, which was recorded on October 23, 2025. The stock later touched a 52-week low of \u20b9 1,301 on March 30, 2026.\n\nThe Wadia Group flagship stock has gained 4% in the past one week. However, the broader performance remains mixed, with the shares declining 3% over the last three months, 4% in six months and 24% in the past one year.\n\nAt the end of the June quarter, promoter entities held a 74% stake in Bombay Burmah, while public shareholders accounted for the remaining 26%, according to data available on the BSE.\n\nAmong the public shareholders , Mutual Funds in India held a 0.5% stake, while Acacia Partners owned more than 4% stake in the company. In addition, more than 45,000 small retail shareholders \u2014 defined as those with authorised share capital of up to \u20b9 2 lakh \u2014 collectively held an 11.71% stake in the company.\n\nBombay Burmah Trading reported a consolidated net profit of \u20b9 582.7 crore for the quarter ended June 2026. This represented a 17.1% increase compared with \u20b9 497.7 crore reported in the corresponding quarter of FY25.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 12:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chart beat: Preference for investing in new residential launches hits multi-year high", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe preference of residential property buyers is skewed towards investing in new project launches. The H1 2026 Homebuyer Sentiment Survey by Anarock Research and Advisory showed that around 34% respondents prefer new launches - the highest reading in recent years.\n\nAmid growing demand for large homes, investing in new projects allows a significantly lower entry price and options to select a desired unit. Plus, it offers staggered payment plans, which are tied to the project achieving a certain construction milestone. Increased buyer confidence in established and organized developers with stronger execution capabilities, augurs well for market share gains of listed developers .\n\nCompanies are unveiling new projects starting September, ahead of the festive season. Launches are expected to pick up in H2FY27.\n\nIn comparison, the preference for ready-to-move-in homes declined. As of H1 2026, the ratio of ready homes to new launches stood at 18:34 versus 30:25 in H1 2022. Developers charge a price premium for completed units because they eliminate construction risks and provide immediate availability. But with increased premiumization, residential realty prices have risen lately, which means a higher upfront cost for buying a ready-to-move-in housing unit.\n\nThe survey also cautions that potential homebuyers have become more price-conscious. Rising housing prices are fuelling significant affordability woes, with 65% of respondents at least moderately concerned.\n\nThis can weigh on pre-sales trajectory of listed realty firms. Moreover, the odds of an interest rate hike by the Reserve Bank of India, which has maintained rates so far this year, are high at its October meeting.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 12:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Lords Mark Industries share price hits upper circuit after this business update | All details here", "full_content": "A small-cap stock - Lords Mark Industries - has been on a healthy uptrend of late, defying cautious market sentiment. On Friday, 18 September, Lords Mark Industries share price hit its 5% upper circuit of \u20b9 89.68 during the session, looking set to extend gains for the third consecutive session. At this price, the stock has surged over 10% in just three consecutive sessions.\n\nIn an exchange filing on 16 September, Lord's Mark Industries informed that it had successfully completed phase 1 of its expansion plan at its Silvassa facility nearly three months ahead of its originally committed December 2026 timeline.\n\nBesides, the company also informed about the portfolio expansion, with the surgical and orthopaedic product portfolio expanding significantly from 36 to 54 SKUs, with the addition of 18 new products.\n\nThe newly expanded production line is scheduled to commence commercial operations from 11 October this year, said the company.\n\nThe company underscored that its existing portfolio of 36 surgical and orthopaedic products already holds US FDA approval. The newly introduced 18 SKUs are currently progressing through the US FDA approval process and are anticipated to receive clearance before December 2026.\n\n\"This strategic expansion reinforces the company's manufacturing capabilities, broadens its market reach across domestic and international healthcare ecosystems, and supports its long-term vision of becoming a recognised global player in the medical devices industry,\" said the company.\n\nRecently, the company held an investor meet on 10 September in which it revealed it has an over \u20b9 3,000 crore renewable energy order pipeline backed by marquee PSU and government relationships.\n\nBesides, it aims to become one of the fastest-growing MedTech companies in India by 2030, expanding its presence in the US, EU, and GCC markets.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market: China stocks rally 1% as Trump-Xi meeting raises trade hopes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China stocks rally 1% as Trump-Xi meeting raises trade hopes Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China stocks rally 1% as Trump-Xi meeting raises trade hopes SECTIONS Global Market: China stocks rally 1% as Trump-Xi meeting raises trade hopes By Anupam Nagar , ETMarkets.com Last Updated: Sep 18, 2026, 11:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China\u2019s stock markets rose strongly as investors anticipated progress in upcoming US-China trade talks between Donald Trump and Xi Jinping. Technology, AI and semiconductor stocks led gains, while Hong Kong equities also advanced. Markets are watching potential tariff relief, agricultural deals and techn e RBI\u2019s October policy meeting, real estate counters saw renewed buying interest, led by Lodha Developers .\n\nLodha Developers jumped more than 4% on the BSE to \u20b9 1,148.50 per share, making it the top gainer in the index. The broader realty pack also traded in the green, indicating that the gains were not limited to a single stock.\n\nOther realty stocks were also firmly higher in Friday\u2019s trade. Prestige Estates , DLF , Mahindra Lifespaces, Godrej Properties , Phoenix Mills and Sobha each gained more than 1%.\n\nThe broader Nifty Realty index rose 2%, outperforming the benchmark Nifty, which gained 0.1%.\n\nThe rally came amid expectations that the Reserve Bank of India could move towards rate hikes in the coming months after the US Fed raised rates on Thursday. While some analysts expect the RBI to remain cautious in the near term, others are now factoring in rate increases in October and December.\n\nDespite Friday\u2019s rise, Lodha Developers remained more than 14% below its 52-week high of \u20b9 1,344, which it touched in July 2026. The stock had hit its 52-week low of \u20b9 650.85 in April 2026.\n\nOn the performance front, Lodha Developers has gained 3% over the past one week but has declined 6% in the last one month. The stock has advanced 24% in three months and 34% in six months, while it has fallen 5% over the past one year.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 11:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SS Retail IPO GMP Today: Check Grey Market Premium On Final Day Of Subscription", "full_content": "SS Retail IPO GMP today is Rs 137, indicating a potential 32.31% listing premium. Check GMP trend, expected listing price and latest subscription status.", "source": "NDTV Profit", "pub_date_str": "18 Sep 2026, 11:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US Grants Visa To Iranian President Pezeshkian For UN Summit", "full_content": "This comes as Iran and the US remain in an active, unresolved conflict that has run for more than six months, with Washington yet to lift its naval blockade of Iranian ports or its sanctions campaign.", "source": "NDTV Profit", "pub_date_str": "18 Sep 2026, 11:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Hero Motors IPO Day 3: 4.29x Subscribed; Check GMP, Allotment, Listing Details", "full_content": "At a GMP of Rs 5.5, the implied listing price would be around Rs 89.5, compared with the upper IPO price band of Rs 84 per share.", "source": "NDTV Profit", "pub_date_str": "18 Sep 2026, 11:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why CoreWeave is raising $3 billion; stock falls over 4%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Why CoreWeave is raising $3 billion; stock falls over 4% Written by Anupam Nagar , ETMarkets.com | Sep 18, 2026, 12:10:10 PM IST 1 / 6 CoreWeave stock falls on $3 billion debt raise CoreWeave shares came under pressure after the AI cloud company announced plans to raise $3 billion through convertible senior notes and launched a programme to sell up to 35 million Class A shares. The fundraising highlights the huge capital requirements involved in CoreWeave\u2019s rapid AI infrastructure expansion. Shares fell more than 4% on September 17, closing at around $79.88, after touching an intraday low of $78.27. (Sources: The Motley Fool, TradingView, SEC)\n\nCoreWeave plans to offer $3 billion of convertible senior notes due in 2033 through a private placement. Initial purchasers will also have the option to buy up to an additional $500 million of notes, potentially taking the offering to $3.5 billion. The notes are expected to carry a coupon of 2.375%-2.875%, with an expected conversion premium of 22.5%-27.5%, according to CoreWeave's offering materials.\n\nAlongside the debt offering, CoreWeave entered into an equity distribution agreement covering up to 35 million Class A shares. The company could potentially raise roughly $2.9 billion through the programme, although actual sales will depend on market conditions. The additional share supply raised concerns among investors about potential dilution, contributing to the stock's decline following the announcement.\n\nThe fundraising comes as CoreWeave continues to spend heavily on data centres and computing infrastructure. The company expects 2026 capital expenditure of $35 billion-$39 billion, underscoring the capital-intensive nature of its AI cloud business.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 11:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "18 Sep 2026, 01:08 PM IST", "total_stories": 401};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
