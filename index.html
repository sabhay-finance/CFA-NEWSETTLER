h. Meanwhile, concerns about the power of advanced AI models has been intensifying for weeks, spilling into the mainstream as more researchers warn of potential threats of human extinction.\n\nWith that backdrop, Amodei wrote an essay over the weekend urging the AI industry to slow the pace of model development, proposing a three-step plan to temper how quickly model capabilities improve without \"sacrificing commercial advantage or the United States' lead in AI.\"\n\nIt's the latest challenge facing public market investors who are trying to determine what they're willing to pay for a piece of a five-year-old company that's already among the most valuable in the world and could seek a $2 trillion valuation in its IPO. Though Anthropic may have to accept a hit to revenue growth, some experts say an intentional slowdown could help Anthropic frame itself as a responsible actor, avoid future liability and address the public backlash towards AI that's been brewing across the country.\n\n\"I don't know that investors are necessarily going to see it as a negative,\" Gil Luria, an equity analyst at D.A. Davidson, said in an interview.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 06:43 PM IST", "pub_date_relative": "24m ago"}, {"title": "Revvity at Morgan Stanley conference: AI, margins and growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 06:42 PM IST", "pub_date_relative": "24m ago"}, {"title": "Infleqtion integrates qLDPC library with NVIDIA CUDA-Q Logical", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 06:42 PM IST", "pub_date_relative": "24m ago"}, {"title": "Sanofi partners with Cheplapharm on mature medicines portfolio", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 06:42 PM IST", "pub_date_relative": "24m ago"}, {"title": "Chatham Lodging Trust appoints Liam Brown to board", "full_content": "", "source": "Investing.com News", "pub_date_str":  disruption extends beyond the five-to-seven-day inventory cushion, that could change quickly,\" said Janiv Shah, an oil market analyst at Rystad Energy, in a Monday note.\n\nA pump station appears to have taken serious damage, said Andy Lipow, president of Lipow Oil Associates. Riyadh may be able to bypass the pump and restart the pipeline with lower output, Lipow said. This is why prices have not surged even higher, he said.\n\n\"The longer the shutdown, the higher the price. Judging from the on-line pictures, it will take months to repair,\" Lipow said in a note Monday.\n\nA diplomatic meeting between Iran and the Gulf Arab states to discuss the situation in Hormuz, originally scheduled to take place Monday in Oman, was abruptly postponed after the pipeline attack.\n\n\"In the interests of consensus the regional meeting set for tomorrow in Salalah has been postponed,\" Oman's Foreign Minister Badr Albusaidi said Sunday in a social media post . \"We remain committed to fostering dialogue that supports stability and lasting cooperation in our region.\"", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 06:59 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Diesel pushes to new all-time high as oil prices jump after key Saudi pipeline is shut - nbcnews.com", "full_content": "Diesel pushes to new all-time high as oil prices jump after key Saudi pipeline is shut nbcnews.com Oil Prices Jump on Energy Supply Worries The New York Times Iran live updates: Oil prices rise after strikes in Saudi Arabia, Strait of Hormuz ABC News - Breaking News, Latest News and Videos Oil prices soar above $108 as Houthis strike Saudi infrastructure The Guardian Oil prices continue surge, rising 3% as attacks halt Saudi pipeline Reuters", "source": "Google News Business", "pub_date_str": "14 Sep 2026, 06:51 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Novo drops \u2018Nordisk\u2019 in corporate refresh to take on Lilly in the weight-loss wars", "full_content": "The Danish drug giant behind Ozempic is competing with Eli Lilly in the market for weight-loss drugs.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Sep 2026, 06:50 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Michael Dell\u2019s family office leads $7.7bn deal to take insurance broker private", "full_content": "DFO Management and Sequence clinch acquisition of Baldwin Group as industry undergoes wave of consolidation", "source": "FT Markets", "pub_date_str": "14 Sep 2026, 06:47 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Here are our top 10 things to watch in the stock market Monday", "full_content": "AI semiconductor and infrastructure stocks are under heavy pressure ahead of Monday's open on Wall Street.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 06:44 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: RF Industries posts record q3 2026 revenue as shares fall", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 06:43 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What Amodei's AI slowdown could mean for Anthropic's imminent IPO", "full_content": "While the Claude creator meets with prospective investors ahead of its potentially historic debut, co-founder and CEO Dario Amodei is pushing a concept that would seem to contradict those ambitious efforts: a slowdown.\n\nAnthropic, valued at $965 billion earlier this year, confidentially filed its IPO prospectus in June, and has been widely expected to list its shares as soon as next month. Meanwhile, concerns about the power of advanced AI models has been intensifying for weeks, spilling into the mainstream as more researchers warn of potential threats of human extinction.\n\nWith that backdrop, Amodei wrote an essay over the weekend urging the AI industry to slow the pace of model development, proposing a three-step plan to temper how quickly model capabilities improve without \"sacrificing commercial advantage or the United States' lead in AI.\"\n\nIt's the latest challenge facing public market investors who are trying to determine what they're willing to pay for a piece of a five-year-old company that's already among the most valuable in the world and could seek a $2 trillion valuation in its IPO. Though Anthropic may have to accept a hit to revenue growth, some experts say an intentional slowdown could help Anthropic frame itself as a responsible actor, avoid future liability and address the public backlash towards AI that's been brewing across the country.\n\n\"I don't know that investors are necessarily going to see it as a negative,\" Gil Luria, an equity analyst at D.A. Davidson, said in an interview.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 06:43 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sanofi partners with Cheplapharm on mature medicines portfolio", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 06:42 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Femsa enters $280 million accelerated share repurchase deal", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 06:42 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "10-year Treasury yield nears 5% ahead of Fed rate decision this week", "full_content": "The 10-year U.S. Treasury note yield was little changed on Monday, trading near 5%, close to multi-year highs ahead of this week's Federal Reserve interest rate decision.\n\nThe yield on the 10-year U.S. Treasury \u2014 which influences mortgages, auto loans and credit card debt \u2014 was up more than 1 basis point at 4.99%. On Friday, the benchmark yield rose to 4.992%, the highest since October 2023.\n\nThe 2-year Treasury note yield, the most sensitive to short-term Federal Reserve interest rate policy, advanced less than 1 basis point to 4.654% after touched the highest since July 2024 last week.\n\nYields on longer-dated 30-year Treasury bonds yield, more sensitive to geopolitical risks, were also ahead less than 1 basis point at 5.361%.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nThe latest moves come after August consumer price index data reported on Friday matched expectations while remaining far above the Fed's goal of 2% inflation, as it has for the past five years.\n\nLast week's CPI report was the final inflation indicator the Fed will see before it holds its policy meeting on Tuesday and Wednesday this week, ending with a vote on whether to keep the benchmark fed funds overnight borrowing rate at its current 3.50% to 3.75%.\n\nOdds that the Federal Reserve will raise interest rates by a quarter percentage point at its policy meeting now stand at 88.5%, according to the CME Group FedWatch tool .", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 06:41 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Who Buys Colgate\u2019s Cast-Off Brands? Why the Obvious Answers Are Unlikely.", "full_content": "Skip to navigation Skip to main content Skip to right column Who Buys Colgate\u2019s Cast-Off Brands? Why the Obvious Answers Are Unlikely. Trey Thoelcke Mon, September 14, 2026 at 6:10 AM PDT 5 min read CL EPC CHD KVUE Quick Read Colgate-Palmolive (CL) hired Goldman Sachs to explore selling Softsoap, Irish Spring, and Speed Stick as North America revenue fell 3% in Q2 2026.\n\nPrivate equity leads as the likeliest buyer, with every named strategic acquirer blocked by scale gaps, leverage limits, or an active acquisition lock-up.\n\nThe real test is whether shedding mature brands resolves Colgate's self-described long-term North America turnaround or simply makes the company smaller.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Colgate-Palmolive didn't make the cut. Enter your email to see the names that beat CL. The report is free. Enter your email and see if any of your stocks made the cut.\n\nColgate-Palmolive ( NYSE:CL ) is reportedly shopping a slice of its portfolio that many investors forgot it still owned. Reuters reported on Friday, September 11, 2026, citing unnamed sources, that Colgate is exploring a sale of Softsoap, Irish Spring, and Speed Stick and has hired Goldman Sachs to run the process.\n\nNo buyer has been identified, and Colgate has not confirmed any sale. Colgate shares changed hands at $87.49 in premarket trading on September 14, 2026. The stock is down 3.7% over one week. Yet it is up 9.9% year to date and 3.3% higher than a year ago. The market cap is near $69.2 billion.\n\nReuters characterizes oral care as almost half of Colgate-Palmolive's net sales. The pruning fits a broader Strategic Growth and Productivity Program (SGPP) that took a $129 million charge in the second quarter of 2026. Cumulative pretax SGPP charges now guided to $350 million to $550 million. North America revenue fell 3.0% in the quarter to $891 million. Colgate's chief executive described the U.S.", "source": "Yahoo Finance", "pub_date_str": "14 Sep 2026, 06:40 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Space startups raise big money in funding blitz as Europe aims to challenge U.S. dominance", "full_content": "Space companies are attracting hundreds of millions in new investment as startups race to scale and governments seek alternatives to dominant U.S. players such as Elon Musk's SpaceX .\n\nA string of new funding rounds, including a 300 million euro ($346 million) raise by satellite manufacturer Open Cosmos announced Monday, is putting fresh capital behind companies seeking to grab a bigger share of the fast-growing commercial space economy.\n\nOpen Cosmos prioritized European investors aligned with its purpose, CEO Rafel Jord\u00e0 Siquier told CNBC in an interview. The company said it would use the oversubscribed funding round to build satellite infrastructure, connectivity and real-time intelligence for Europe.\n\nThe company is raising more capital because of the number of opportunities in space, despite having been profitable for five consecutive years, Jord\u00e0 said.\n\n\"There need to be multiple companies, and they will be emerging from everywhere, from the U.S., from Europe, from China, from all over the place,\" he added. \"It's very unlikely that a single company can serve all of that global growth.\"\n\nOpen Cosmos' raise comes after a flurry of funding announcements in the last two weeks. The Exploration Company announced a $450 million Series C . Spanish rocket company PLD Space added 108 million euros to its Series C, taking the round to 288 million euros. German rocket startup HyImpulse raised more than 50 million euros in new equity through an extension of its Series A.\n\nAlso this month, Marlan Space and Loft Orbital announced a $1 billion program to build a 50-satellite AI-enabled constellation, alongside partners including French AI firm Mistral, and Amazon Leo ordered an additional six launches from Europe's Arianespace.\n\nEurope's space ambitions reached a milestone earlier this month when German startup Isar Aerospace became the first commercial European company to put satellites into orbit.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 06:38 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Satellite images show extent of damage to Saudi Arabia\u2019s oil pipeline that bypasses Strait of Hormuz", "full_content": "Satellite photos show the extent of the damage caused by a drone attack on Saudi Arabia's East-West pipeline , a highly strategic network that transports crude oil from Abqaiq on the kingdom's eastern Gulf coast to the port of Yanbu on the Red Sea.\n\nThe images, released by Vantor and published via Getty Images on Sunday, show a bird's-eye view of fire damage and extensive blackened areas in and around a pumping station on the pipeline.\n\nSaudi Arabia on Friday temporarily closed the roughly 750-mile system, or Petroline, as a precautionary measure following multiple attacks by drones launched from Iraq. Several people were injured in the strikes, the Saudi government said, with drones targeting a key stretch of the pipeline in the Riyadh and Medina regions.\n\nOPEC kingpin Saudi Arabia has relied on the East-West pipeline to shift crude exports away from the strategically vital Strait of Hormuz as fighting continues between the U.S. and Iran. The East-West pipeline is estimated to have a total design capacity of 7 million barrels per day, following recent expansions.\n\nThe pipeline's closure comes as Yemen's Iran-backed Houthis have ramped up attacks on targets in Saudi Arabia and launched a lightning ground offensive to exercise control of another critically important oil choke point on the other side of the Arabian Peninsula: the Bab el-Mandeb Strait.\n\nThere are concerns that the Houthis' advance toward the Bab el-Mandeb Strait could have significant ramifications for energy markets and global trade, particularly if the militant group ratchets up threats or attacks on Red Sea shipping.\n\nOil prices have rallied in recent days amid deepening supply concerns in the Middle East.\n\nInternational benchmark Brent crude futures for November expiry rose 3.3% to $108.02 per barrel on Monday morning, extending gains after jumping more than 20% over the past month.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 06:38 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Skyworks Is Trading 18% Above Its Own Price Target. Overbought or Something Else?", "full_content": "Skip to navigation Skip to main content Skip to right column Skyworks Is Trading 18% Above Its Own Price Target. Overbought or Something Else? Alex Sirois Mon, September 14, 2026 at 6:05 AM PDT 6 min read SWKS QRVO Quick Read SWKS surged 27% in a month to $88.35, now trading above its $68.35 consensus analyst target with most analysts rating it Hold or worse.\n\nThe Qorvo merger could unlock $500M+ in synergies, but a regulatory delay leaves Skyworks holding $2B in new debt against shrinking revenue.\n\nAt 46x trailing P/E with 14 downward EPS revisions and the CFO selling into the rally, momentum is doing all the heavy lifting.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Skyworks Solutions didn't make the cut. Enter your email to see the names that beat SWKS. The report is free. Enter your email and see if any of your stocks made the cut.\n\nAt $88.35, Skyworks Solutions ( NASDAQ:SWKS ) is a Hold. The stock has ripped past its consensus analyst price target of $68.35, and with a pending merger, a fresh capital allocation framework, and a mixed fundamental picture, the case for chasing here is as thin as the case for stepping in front of the momentum.\n\nSkyworks designs RF and mobile chips, with approximately 57% of total revenue tied to its largest customer, Apple. The company is in the middle of transforming itself through a pending combination with Qorvo, a roughly $2B debt raise, a new $2B share buyback authorization, and the elimination of its quarterly dividend.\n\nWhat brought the stock here is a violent re-rating. Shares jumped 19.36% in the last week alone and 26.79% over the past month, catching analyst targets flat-footed.\n\nBulls argue the market is finally repricing Skyworks around a bigger, more diversified combined company.", "source": "Yahoo Finance", "pub_date_str": "14 Sep 2026, 06:35 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What's Wrong With Nike Stock?", "full_content": "Skip to navigation Skip to main content Skip to right column What's Wrong With Nike Stock? Keith Noonan, The Motley Fool Mon, September 14, 2026 at 6:05 AM PDT 2 min read NKE NVDA ^GSPC Times are tough for Nike (NYSE: NKE) shareholders. The company's share price is down roughly 42% year to date as of this writing, and it trades off roughly 79% from its lifetime high. Over the last 10 years, the stock is down 33.5%. Meanwhile, the S&P 500 's level has risen nearly 260%. What's behind the footwear and apparel leader's stock collapse?\n\nThe core growth bets that Nike put in place a decade ago have not panned out. While the company's major investment in the Chinese market initially seemed to be yielding strong results, conditions have since soured. In addition to tariffs and trade-war dynamics creating headwinds and manufacturing repositioning, Chinese shoppers have shown a growing preference for domestic brands.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nMaking matters worse, Nike's big bets on direct-to-consumer (DTC) sales in the U.S. and other key markets also had unintended consequences. While DTC sales offered Nike the opportunity to cut out the middlemen and improve its margins, it turns out that the company wasn't adequately positioned to make the move.\n\nIn response to Nike emphasizing DTC sales, retailers responded by giving more shelf and floor space to other brands. As a result, rivals competing in the company's core categories had an easier path to growing mind share and market share.", "source": "Yahoo Finance", "pub_date_str": "14 Sep 2026, 06:35 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The Hain Celestial Group Q4 Earnings Call Highlights", "full_content": "", "source": "Yahoo Finance", "pub_date_str": "14 Sep 2026, 06:32 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Dow Falls On Surging Oil; Nvidia Sells Off On AI Warning (Live Coverage)", "full_content": "", "source": "Yahoo Finance", "pub_date_str": "14 Sep 2026, 06:29 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wintermute Builds $102M Crypto Short as Ethereum Leads Bearish Bets", "full_content": "", "source": "Yahoo Finance", "pub_date_str": "14 Sep 2026, 06:27 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "14 Sep 2026, 07:07 PM IST", "total_stories": 361};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
