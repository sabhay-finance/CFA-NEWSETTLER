 "FT Markets", "pub_date_str": "29 Oct 2026, 10:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Some investors have midterm election jitters. Here\u2019s what history shows about stocks", "full_content": "With the midterm elections approaching, some investors worry about how the results will impact their portfolios. Whether their anxiety is warranted is another question.\n\nNearly half of surveyed investors \u2014 48% \u2014 said they are concerned about the Nov. 3 midterms' potential impact on the stock market, according to Morgan Stanley Wealth Management's latest quarterly retail investor pulse survey , conducted Oct. 1-23 among 953 U.S. investors.\n\nSeparately, the Nationwide Retirement Institute, a research and education division of insurer Nationwide, found that 56% of surveyed investors said they feel more anxious because of the elections, and 75% believe the results could meaningfully affect their long-term financial plans. That survey was conducted Aug. 24-Sept. 11 among 2,029 investors with investable assets of at least $10,000.\n\n\"This summer and fall, the midterms have been probably the first topic of conversation with almost every [client] meeting that I've had,\" said John Mullen, managing director, president and CEO of Parsons Capital Management in Providence, Rhode Island. The firm ranked No. 25 on CNBC's Financial Advisor 100 list for 2026.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nWhile it's impossible to predict how the markets will behave following the midterms, historical data offers some perspective on how stocks have performed around past midterm elections.\n\nVoters will be heading to the polls amid broad concerns about affordability and dissatisfaction with President Donald Trump's handling of the economy .", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 10:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trade Setup For Oct 30: Nifty Recovery Gathers Pace; Can Bulls Push Index Above 23,000?", "full_content": "Investors are likely to track movements in crude oil prices and global market cues for further direction.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 10:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Aon CEO warns AI data center insurance risks could threaten financing", "full_content": "The race to build artificial intelligence infrastructure is creating enormous new risks that could threaten financing for the data centers powering the artificial intelligence boom, according to Aon CEO Greg Case.\n\nIn an interview with CNBC Wednesday, Case warned that clustering billions of dollars of equipment and computing capacity in a small number of locations could make some projects difficult to insure, with consequences for developers seeking financing.\n\n\"If you create them and you build them on top of each other, you've created concentration risk in a way in which it makes it more difficult to get insurance,\" Case said.\n\n\"If it's more difficult to get insurance, that means the financing structure is going to change completely. You can't access the debt markets,\" he said.\n\nThe potential financial exposure from operational disruptions is staggering, Case said.\n\n\"Data centers are literally going to measure business interruption at millions of dollars per minute,\" he told CNBC.\n\nThe warnings come as technology companies accelerate spending on data centers, electricity generation and other infrastructure needed to support AI. Those investments are creating opportunities for insurers, brokers and business risk consultants. They're also raising questions about whether traditional insurers have sufficient capacity to absorb the risks.\n\nIn its third-quarter earnings , Aon reported a record pipeline of data center projects, helping drive 7% organic revenue growth in its commercial risk business during the quarter. Adjusted earnings per share increased 10% to $3.36, while adjusted operating margin expanded 70 basis points to 27%. One basis point equals 0.01%, or 1/100th of 1%.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 10:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Christine Lagarde to Step Down as President of European Central Bank - The New York Times", "full_content": "Christine Lagarde to Step Down as President of European Central Bank The New York Times Christine Lagarde resigns as ECB President after months of speculation CNN The legacy of Christine Lagarde Financial Times European Central Bank head resigns, allowing EU leaders to choose successor before French election AP News Christine Lagarde: The outsider who led the ECB her way Reuters", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 10:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "We're raising our price target on Eli Lilly as the obesity-drug boom rolls on - CNBC", "full_content": "We're raising our price target on Eli Lilly as the obesity-drug boom rolls on CNBC Eli Lilly hikes sales outlook, as CEO says there's room for 'dramatic' obesity market expansion CNBC Eli Lilly stock jumps as drugmaker raises outlook on booming sales of diabetes and obesity treatments Yahoo Finance Eli Lilly lifts revenue outlook as weight-loss shot demand soars, shares jump Reuters Eli Lilly Revenue Climbs on Demand for Obesity Drugs WSJ", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 10:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings live updates: Eli Lilly stock pops as strong GLP-1 drug demand lifts results, ServiceNow stock plunges - Yahoo Finance", "full_content": "Earnings live updates: Eli Lilly stock pops as strong GLP-1 drug demand lifts results, ServiceNow stock plunges Yahoo Finance ServiceNow shares plunge 25% after earnings revive AI disruption fears CNBC ServiceNow Falls After Quarterly Sales Outlook Revives AI Fears Bloomberg.com ServiceNow Fans AI Fears on Quarterly Subscription Sales Outlook Barron's ServiceNow drops after Q3 results despite Control Tower strategy gaining momentum Seeking Alpha", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 10:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buy, Sell Or Hold: ICICI Bank, Hyundai Motor, Trent, Tata Steel, Schaeffler India And L&T Finance \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including ICICI Bank, Hyundai Motor, Trent, Tata Steel, and L&T Finance.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 10:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Financial planning beyond mutual funds: 6 checks every investor should review annually to secure long-term goals", "full_content": "Investing in mutual funds is only one part of managing personal finances. A portfolio may be performing well while an investor carries expensive debt, has gaps in insurance cover, holds idle cash or lacks a clear plan to fund major expenses. Reviewing investments alone may not reveal these weaknesses.\n\nA 2026 report by 1 Finance, What Personalised Financial Advice Is Actually Worth , identifies six areas that investors should review as part of their financial planning: estate planning, liabilities, investments, income and expenses, insurance, and tax. The report argues that financial advice should address a household\u2019s overall financial position, rather than focus only on investment returns.\n\nAn annual review of these six areas can help investors identify gaps, organise financial priorities and keep long-term goals on track.\n\nInvestors should review whether their will reflects their current wishes and whether nominations across financial accounts and insurance policies are accurate. Marriage, the birth of a child, a death in the family or changes in asset ownership can make an earlier plan outdated.\n\nThe 1 Finance report identifies will drafting, succession planning and nomination reviews as important parts of financial planning . It also highlights the need to revisit arrangements after major life events.\n\nInvestors should check who is named in relevant accounts and policies and whether their estate plan reflects how they want assets to be passed on. A portfolio review focused only on fund selection may overlook these issues.\n\nAn annual review should examine outstanding loan balances, interest rates, EMIs and the burden of repayments on household cash flow.\n\nThe report identifies high-cost debt, unnecessary borrowing and loan structuring as areas where financial planning can make a difference. It also highlights monitoring the relationship between EMIs and systematic investment plan (SIP) contributions.", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 10:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Investors double withdrawal requests at Partners\u2019 flagship US private equity fund", "full_content": "Wealthy individuals sought to pull 15% of the fund\u2019s net assets during the third quarter", "source": "FT Markets", "pub_date_str": "29 Oct 2026, 10:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Reliance Industries Q2 Preview: Will O2C Strength Offset Retail And Oil & Gas Weakness?", "full_content": "Reliance Industries' oil and gas exploration business is expected to report flat Ebitda of Rs 4,973 crore, unchanged from the previous quarter.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 10:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This credit card is the \u2018best weapon\u2019 to fight debt while interest rates keep climbing", "full_content": "After September\u2019s rate hike and another projected increase in December, borrowing costs are expected to keep climbing for Americans carrying a credit-card balance.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 10:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "DoorDash strikes $17 billion deal for US rival Instacart in mega grocery delivery bet - Reuters", "full_content": "DoorDash strikes $17 billion deal for US     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
