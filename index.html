<script>

    const allData = {"general": [{"title": "Hybrid home loans offer rate certainty, but read the fine print", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWith the Reserve Bank of India (RBI) holding the repo rate at 5.25% for a fourth straight time at its August monetary policy review, borrowing costs are at their lowest since around mid-2022.\n\nThat makes the choice between a fully floating-rate home loan and a hybrid loan more consequential. Some banks have begun offering semi-fixed products at competitive rates, partly as they look to deploy excess liquidity following a record wave of foreign currency non-resident (bank) or FCNR( B) deposits.\n\nThese are fixed deposits that non-resident Indians hold with Indian banks in foreign currencies such as US dollars. In June, under a special RBI scheme, banks were allowed to offer higher interest rates on these deposits, attracting more than $127 billion before the scheme ended on 31 August. The resulting liquidity has encouraged some lenders to push products such as hybrid home loans.\n\nA hybrid loan fixes the interest rate\u2014or EMI\u2014for an initial period, typically two to five years, before switching to a floating rate. It can suit borrowers who prioritise near-term EMI certainty. A floating-rate loan, meanwhile, may suit borrowers who can absorb higher EMIs or longer tenures and want to benefit if rates fall further.\n\nSo, with the repo rate already 125 basis points below its post-Covid peak of 6.5%, does it make sense to pay for stability, or is floating still the better bet?\n\nA hybrid home loan has two phases. The rate is fixed for an initial period, usually two to five years, before the loan automatically shifts to a floating rate linked to a benchmark.\n\nThe fixed phase provides EMI certainty when the outstanding principal is at its highest. Once it ends, the borrower takes on interest-rate risk again.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 07:00 AM IST", "pub_date_relative": "4m ago"}, {"title": "Indian investors are overpaying for foreign ETFs. Beware the risks.u", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFrom 4 to 9 September, the Nasdaq Q-50 index \u2014 made up of 50 companies next in line to enter the Nasdaq-100 \u2014 did little. However, an Indian exchange-traded fund (ETF) based on this index \u2014 Motilal Oswal Nasdaq Q50 \u2014 saw its market price shoot up by 50%. On 9 September, each unit of the fund was bought and sold for \u20b9 213, while the NAV, or intrinsic value, was just \u20b9 117. That is an 81% premium.\n\nThis is a rare phenomenon, but nothing new. In fact, this is the reason I have spent my working life studying mutual funds. In 1992, my father sold 5,000 units of SBI Magnum Multiplier, a closed-end equity fund. The NAV was \u20b9 20, but the market price was \u20b9 100. Instead of the \u20b9 1 lakh that he should have got, he received \u20b9 5 lakh, a big bonanza for a middle-class family in those days.\n\nSince he bought and sold these units on the advice of a 22-year-old me, the windfall gave me an unearned reputation as the family's financial genius. My actual bonanza came in the years that followed because this strange experience set me on a lifelong path of understanding mutual funds and explaining them to others.\n\nA word of explanation here. When you buy a normal fund, you buy it from the fund house and pay the NAV. But you buy an ETF from another investor on the stock exchange, like a share, at whatever price the buyer and seller agree on. ETFs have an NAV, which is the intrinsic value of the units, but no one has an obligation to sell you a unit at that.\n\nUsually, the NAV and the market price stay close because of a mechanism in place. If demand is too high and the price drifts up, a dealer pays the AMC, gets new units created, and sells them on the exchange. This pushes the price and the NAV closer. The reverse happens when there's too much selling, and the price drifts down.\n\nSo far so good.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 07:00 AM IST", "pub_date_relative": "4m ago"}, {"title": "Korea Tests Global Investor Appetite With Longer Trading Hours", "full_content": "(Bloomberg) -- South Korea\u2019s main stock exchange is extending into evening sessions, breaking with Asia\u2019s trading-hour norms to tap what it hopes will be sustained demand from global investors.\n\nIn a step toward its goal of 24-hour trading, Korea Exchange will on Monday enable trading through 8 p.m. for nearly all local stocks, following the regular close at 3:30 p.m. Though the first of its kind among major Asian exchanges, the move tracks a global trend toward around-the-clock markets, led by Nasdaq Inc. and New York Stock Exchange.\n\nAfter the stock market\u2019s world-beating run this year on AI enthusiasm, Korea Exchange aims to capture broader international participation, particularly during European business hours. Monday\u2019s rollout will offer a test of the bourse\u2019s ability to sustain sufficient liquidity through a longer day and prove that investors actually want the extra time even as interest in Korean equities cools.\n\n\u201cThe longer trading window generally means more flexibility for investors, and that makes the market more efficient,\u201d said Young Jae Lee, senior investment manager at Pictet Asset Management in London. \u201cInvestors who are more trading-oriented with higher turnover, or hedge fund types may use it more frequently.\u201d\n\nAfter-hours trading isn\u2019t entirely new in Korea. Alternative trading system Nextrade introduced pre-market and evening sessions in March 2025, covering about 600 stocks, and grabbed nearly a third of activity within a few months of its launch.\n\nKorea Exchange\u2019s latest move takes it a step further, opening about 2,400 Kospi and Kosdaq stocks for evening trades, including short-selling. Exchange-traded funds are excluded for now.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 06:35 AM IST", "pub_date_relative": "29m ago"}, {"title": "Anthropic CEO Says It\u2019s Time to Slow AI Model Advances - Bloomberg.com", "full_content": "Anthropic CEO Says It\u2019s Time to Slow AI Model Advances Bloomberg.com We Must Pace the Frontier darioamodei.com AI staff 'genuinely frightened' for humanity's future, ex-Anthropic researcher tells BBC BBC Inside the Discussions at AI Companies Over a Superintelligence Doomsday nytimes.com Top tech executives call for slowing of AI\u2019s development SMH.com.au", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 05:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI rules out IPO this year as Altman, Musk & Amodei warn AI is moving too fast", "full_content": "OpenAI CEO Sam Altman now says his company will not go public this year, citing growing concerns about AI safety. In an interview with Fortune published Saturday , Altman said that an IPO now would be \"ill-advised.\" The decision pushes one of the most anticipated IPOs in history until at least 2027 and gives the clearest sign yet that mounting concerns about increasingly powerful AI are beginning to reshape the industry's business plans.\n\nOpenAI CFO Sara Friar told employees just last month that the company would likely go public in 2027 or even sooner, if \"our business continues to inflect.\" Altman's comments came on the same day that Anthropic CEO Dario Amodei published an essay urging AI companies to slow how quickly they improve their most advanced models. Altman and Elon Musk quickly backed the proposal in social media posts, an unusual show of agreement among three fierce rivals. In his essay, Amodei proposed a three-step plan aimed at tempering the pace of development without \"sacrificing commercial advantage or the United States' lead in AI.\" Anthropic is actively gearing up for what is expected to be a historic IPO , though the company has not officially disclosed when it plans to debut. The sudden alignment among Altman, Amodei and Musk shows how quickly concern over AI has moved from the margins to the center of the industry \u2014 and is now beginning to collide with its enormous commercial ambitions.\n\nThe essay urged artificial intelligence companies to pace how quickly they improve model capabilities.", "source": "CNBC World Economy", "pub_date_str": "13 Sep 2026, 04:50 AM IST", "pub_date_relative": "2h ago"}, {"title": "Altman: IPO unlikely this year - Politico", "full_content": "Altman: IPO unlikely this year Politico See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 03:32 AM IST", "pub_date_relative": "3h ago"}, {"title": "Why OpenAI\u2019s Sam Altman says an IPO isn\u2019t in the cards this year", "full_content": "Concerns about AI safety have ramped up, and OpenAI\u2019s CEO says now would be an \u2018ill-advised\u2019 time for the ChatGPT creator to go public", "source": "MarketWatch Top Stories", "pub_date_str": "13 Sep 2026, 03:20 AM IST", "pub_date_relative": "3h ago"}, {"title": "Jewelry chain closes 53 stores after shutting down 2 brands - thestreet.com", "full_content": "Jewelry chain closes 53 stores after shutting down 2 brands thestreet.com", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 02:50 AM IST", "pub_date_relative": "4h ago"}, {"title": "From Portland to Buffalo, these are 5 of the best chicken wing destinations across America - Fox News", "full_content": "From Portland to Buffalo, these are 5 of the best chicken wing destinations across America Fox News", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 02:07 AM IST", "pub_date_relative": "4h ago"}, {"title": "Christine Lagarde: Interview with Ouest-France", "full_content": "What brings you to the F\u00eate de la pomme organised by Herv\u00e9 Morin this Saturday?\n\nI\u2019m here as a friend, a neighbour and a Norman to offer a European voice, without being a candidate for anything. I\u2019m here simply to help French people understand the role of Europe a little better.\n\nOn Thursday you announced an increase in the ECB\u2019s key interest rates, which should help to contain inflation but will penalise people planning to purchase property or invest. Why did you take this decision, in a very uncertain context?\n\nThe ECB\u2019s task is to maintain price stability. We have an inflation target of 2% over the medium term. Today, inflation is well above 2%, at 3.3% in the euro area, and there has been a major shock that will probably last longer than we had expected. The shock is the result of the conflict in the Middle East, but also the destruction of refining capacity around the world, especially in Russia. It has led to an increase in energy costs, and that drives all prices higher. In this kind of situation, and as we also have a resilient economy, we are obliged to react.\n\nWhat do you say to the economists who argue that raising interest rates is risky for growth when inflation is related to an external shock rather than an overheating domestic economy?\n\nThat\u2019s true when the shock is short-lived. But the current shock is longer-lasting. The conflict is continuing. We expect the volatility and pressure on energy prices to continue, even though the increase in prices also poses a risk of lower growth.\n\nGrowth in France is subdued and inflation is lower than in neighbouring countries. It\u2019s going to be particularly affected by this decision\u2026\n\nThe ECB has to work for the entire euro area. It can\u2019t look at France, Lithuania or Germany in isolation. Besides, France is one of the countries planning structural reforms, and it would be very important that it implements them.", "source": "ECB Press", "pub_date_str": "13 Sep 2026, 01:30 AM IST", "pub_date_relative": "5h ago"}, {"title": "J&J Is in Talks to Sell Its Hips-and-Knees Business to Apollo for $20 Billion - WSJ", "full_content": "J&J Is in Talks to Sell Its Hips-and-Knees Business to Apollo for $20 Billion WSJ Apollo Global Is Said in Talks to Acquire J&J\u2019s Orthopedics Unit Bloomberg.com JNJ Stock Edges Up After-Hours On Apollo\u2019s $20B Orthopedics Talks Yahoo Finance Apollo in talks to acquire J&J\u2019s orthopedics unit - Bloomberg (JNJ:NYSE) Seeking Alpha J&J orthopedics unit draws Apollo interest in potential $20 billion deal, Bloomberg News reports Reuters", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 01:10 AM IST", "pub_date_relative": "5h ago"}, {"title": "US judge rules that Trump plan to halve FEMA workforce violated law", "full_content": "A U.S. judge has ruled that the \u200bTrump administration broke the law by ordering the Federal Emergency Management Agency to cut its workforce in half.\n\nU.S. \u200cDistrict Judge Susan Illston in San Francisco in a decision issued late Friday said the U.S. Department of Homeland Security acted unlawfully by usurping FEMA's authority over its own personnel and steering the agency to cut thousands of disaster-response jobs.\n\nWhile FEMA is part of DHS, a federal law adopted after Hurricane Katrina in \u200b2005 says the department \"may not substantially or significantly reduce (FEMA's) authorities, responsibilities, or functions.\"\n\nAgreeing with unions that sued, Illston said \u200bthe department violated the law when it moved last year to stop FEMA from renewing the temporary \u2060contracts of thousands of on-call reservists who respond to disasters.\n\n\"There is no evidence in the record reflecting reasoned decision-making for this \u200babout-face or for the subsequent conditions DHS placed on FEMA's renewal authority,\" Illston wrote.\n\nFriday's ruling did not include remedies or penalties. Illston, an \u200bappointee of President Bill Clinton, wrote those would be addressed in a separate ruling next month and said the parties may submit briefings on the scope of relief she should provide to the unions.\n\nFEMA and DHS did not immediately respond to requests for comment on Saturday.\n\nDemocracy Forward, a left-leaning group that \u200brepresents the plaintiffs in the case, applauded the ruling in a statement.", "source": "CNBC Top News", "pub_date_str": "13 Sep 2026, 01:05 AM IST", "pub_date_relative": "5h ago"}, {"title": "Gas stations in America are starting to max out their displays with $9.999 prices - The Independent", "full_content": "Gas stations in America are starting to max out their displays with $9.999 prices The Independent California Gas Station With $9.99 Diesel Exemplifies Fuel Crisis Bloomberg.com Texas drivers feel Iran conflict at the pump as gas hits $3.70 in Austin Yahoo Diesel prices in U.S. top $6 a gallon for first time ever CBS News California diesel price hits high of $8.09, setting another record ABC7 Los Angeles", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 01:01 AM IST", "pub_date_relative": "6h ago"}, {"title": "Tesla says it will finally unveil the second generation Roadster on October 1 - TechCrunch", "full_content": "Tesla says it will finally unveil the second generation Roadster on October 1 TechCrunch Tesla signals Oct 1 launch for long-delayed Roadster Reuters Tesla Teases Oct. 1 Event to Showcase Next-Generation Roadster Bloomberg.com 3..2..1... Tesla Roadster 2.0 Set to Launch on October 1 motortrend.com Tesla Roadster officially teased; \"Go for launch\" on October 1 The Supercar Blog", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 12:51 AM IST", "pub_date_relative": "6h ago"}, {"title": "Major companies to cut back on 2027 health benefits in blow to workers - USA Today", "full_content": "Major companies to cut back on 2027 health benefits in blow to workers USA Today Healthcare Costs Have Small Businesses in an Impossible Bind Bloomberg.com The next cost crunch coming for workers Politico Healthcare Costs Are Set to Jump Again and Retirement Savings Could Feel the Squeeze 401ktv.com 8 stories on the healthcare affordability crunch hrdive.com", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 12:25 AM IST", "pub_date_relative": "6h ago"}, {"title": "Khwab Ho Tum': Malaysian PM Anwar Ibrahim Adds Bollywood Touch To BRICS Gala", "full_content": "Malaysian PM Anwar Ibrahim sings Kishore Kumar's Khwab Ho Tum Ya Koi Haqeeqat' at the BRICS gala dinner in New Delhi.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 12:16 AM IST", "pub_date_relative": "6h ago"}, {"title": "Larry Ellison cancels plan to sell Oracle stock - Reuters", "full_content": "Larry Ellison cancels plan to sell Oracle stock Reuters See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 12:08 AM IST", "pub_date_relative": "6h ago"}, {"title": "Dow Jones Futures: Fed Rate Hike Seen As Oil, Yields Pressure Stocks; Apple, Moderna Are New Buys - Investor's Business Daily", "full_content": "Dow Jones Futures: Fed Rate Hike Seen As Oil, Yields Pressure Stocks; Apple, Moderna Are New Buys Investor's Business Daily Dow rises 500 points to snap 4-day slide as oil cools, traders look past inflation report: Live updates CNBC Wall Street Cheers Clarity on Fed Outlook\u2014Even if It Means Higher Rates WSJ Futures Rise With Help From Oracle\u2019s Beat and Cooler Oil Prices Bloomberg.com Update: Wall Street Rises at End of Losing Week Amid Inflation Worries Yahoo Finance", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 12:02 AM IST", "pub_date_relative": "7h ago"}, {"title": "Nagaland govt examining delays in pension, other retirement benefits \u2014 Here's what could change", "full_content": "Nagaland is examining delays in pension and other retirement benefits for state government pensioners and is working on digitising the process, Chief Minister Neiphiu Rio informed the Assembly earlier this month, PTI reported.\n\nResponding to a query raised by MLA Nuklutoshi on recurring delays in pension, gratuity, the General Provident Fund (GPF) / the National Pension Scheme ( NPS ), and other retirement benefits, CM Rio said\n\nAccording to Rio, the committee would examine the above-mentioned issues and work towards digitisation to reduce procedural delays and errors.\n\nMLA Nuklutoshi said pension was a rightful entitlement earned through years of public service and that delays could cause hardship to retirees, particularly in meeting household and medical expenses . He called for pre-retirement verification of service records, preferably beginning about two years before retirement, along with clear timelines and accountability for pending pension cases.\n\nNuklutoshi also urged the government to develop a digital, proactive and time-bound pension system, citing online pension tracking and financial management systems adopted by other northeastern states as possible models for Nagaland.\n\nMeanwhile, the Nagaland government on Friday also announced that it has opened a logistics training centre aimed at equipping 400 economically weaker youth annually, with industry-recognised skills and connecting them with jobs in India and abroad, PTI reported.\n\nFor about a decade, Livemint\u2014News Desk has been a credible source for authentic and timely news, and well-researched analysis on national news, business, personal finance, corporates, politics and geopolitics. We bring the latest updates on all the listed companies on BSE and NSE, startups, mutual funds, Union ministries, geopolitics, and untapped human interest stories from around the world, helping our readers to stay informed on the latest developments around the globe. Our Coverage Areas 1.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 11:54 PM IST", "pub_date_relative": "7h ago"}, {"title": "BRICS Summit 2026 Highlights: India-China Commit To Fair, Mutually Acceptable Boundary Settlement", "full_content": "India is hosting the 18th BRICS Summit in New Delhi on September 12-13.", "source": "NDTV Profit", "pub_date_str": "12 Sep 2026, 11:33 PM IST", "pub_date_relative": "7h ago"}], "cfa": [{"title": "Hybrid home loans offer rate certainty, but read the fine print", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWith the Reserve Bank of India (RBI) holding the repo rate at 5.25% for a fourth straight time at its August monetary policy review, borrowing costs are at their lowest since around mid-2022.\n\nThat makes the choice between a fully floating-rate home loan and a hybrid loan more consequential. Some banks have begun offering semi-fixed products at competitive rates, partly as they look to deploy excess liquidity following a record wave of foreign currency non-resident (bank) or FCNR( B) deposits.\n\nThese are fixed deposits that non-resident Indians hold with Indian banks in foreign currencies such as US dollars. In June, under a special RBI scheme, banks were allowed to offer higher interest rates on these deposits, attracting more than $127 billion before the scheme ended on 31 August. The resulting liquidity has encouraged some lenders to push products such as hybrid home loans.\n\nA hybrid loan fixes the interest rate\u2014or EMI\u2014for an initial period, typically two to five years, before switching to a floating rate. It can suit borrowers who prioritise near-term EMI certainty. A floating-rate loan, meanwhile, may suit borrowers who can absorb higher EMIs or longer tenures and want to benefit if rates fall further.\n\nSo, with the repo rate already 125 basis points below its post-Covid peak of 6.5%, does it make sense to pay for stability, or is floating still the better bet?\n\nA hybrid home loan has two phases. The rate is fixed for an initial period, usually two to five years, before the loan automatically shifts to a floating rate linked to a benchmark.\n\nThe fixed phase provides EMI certainty when the outstanding principal is at its highest. Once it ends, the borrower takes on interest-rate risk again.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 07:00 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Indian investors are overpaying for foreign ETFs. Beware the risks.u", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFrom 4 to 9 September, the Nasdaq Q-50 index \u2014 made up of 50 companies next in line to enter the Nasdaq-100 \u2014 did little. However, an Indian exchange-traded fund (ETF) based on this index \u2014 Motilal Oswal Nasdaq Q50 \u2014 saw its market price shoot up by 50%. On 9 September, each unit of the fund was bought and sold for \u20b9 213, while the NAV, or intrinsic value, was just \u20b9 117. That is an 81% premium.\n\nThis is a rare phenomenon, but nothing new. In fact, this is the reason I have spent my working life studying mutual funds. In 1992, my father sold 5,000 units of SBI Magnum Multiplier, a closed-end equity fund. The NAV was \u20b9 20, but the market price was \u20b9 100. Instead of the \u20b9 1 lakh that he should have got, he received \u20b9 5 lakh, a big bonanza for a middle-class family in those days.\n\nSince he bought and sold these units on the advice of a 22-year-old me, the windfall gave me an unearned reputation as the family's financial genius. My actual bonanza came in the years that followed because this strange experience set me on a lifelong path of understanding mutual funds and explaining them to others.\n\nA word of explanation here. When you buy a normal fund, you buy it from the fund house and pay the NAV. But you buy an ETF from another investor on the stock exchange, like a share, at whatever price the buyer and seller agree on. ETFs have an NAV, which is the intrinsic value of the units, but no one has an obligation to sell you a unit at that.\n\nUsually, the NAV and the market price stay close because of a mechanism in place. If demand is too high and the price drifts up, a dealer pays the AMC, gets new units created, and sells them on the exchange. This pushes the price and the NAV closer. The reverse happens when there's too much selling, and the price drifts down.\n\nSo far so good.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 07:00 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Korea Tests Global Investor Appetite With Longer Trading Hours", "full_content": "(Bloomberg) -- South Korea\u2019s main stock exchange is extending into evening sessions, breaking with Asia\u2019s trading-hour norms to tap what it hopes will be sustained demand from global investors.\n\nIn a step toward its goal of 24-hour trading, Korea Exchange will on Monday enable trading through 8 p.m. for nearly all local stocks, following the regular close at 3:30 p.m. Though the first of its kind among major Asian exchanges, the move tracks a global trend toward around-the-clock markets, led by Nasdaq Inc. and New York Stock Exchange.\n\nAfter the stock market\u2019s world-beating run this year on AI enthusiasm, Korea Exchange aims to capture broader international participation, particularly during European business hours. Monday\u2019s rollout will offer a test of the bourse\u2019s ability to sustain sufficient liquidity through a longer day and prove that investors actually want the extra time even as interest in Korean equities cools.\n\n\u201cThe longer trading window generally means more flexibility for investors, and that makes the market more efficient,\u201d said Young Jae Lee, senior investment manager at Pictet Asset Management in London. \u201cInvestors who are more trading-oriented with higher turnover, or hedge fund types may use it more frequently.\u201d\n\nAfter-hours trading isn\u2019t entirely new in Korea. Alternative trading system Nextrade introduced pre-market and evening sessions in March 2025, covering about 600 stocks, and grabbed nearly a third of activity within a few months of its launch.\n\nKorea Exchange\u2019s latest move takes it a step further, opening about 2,400 Kospi and Kosdaq stocks for evening trades, including short-selling. Exchange-traded funds are excluded for now.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 06:35 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "OpenAI rules out IPO this year as Altman, Musk & Amodei warn AI is moving too fast", "full_content": "OpenAI CEO Sam Altman now says his company will not go public this year, citing growing concerns about AI safety. In an interview with Fortune published Saturday , Altman said that an IPO now would be \"ill-advised.\" The decision pushes one of the most anticipated IPOs in history until at least 2027 and gives the clearest sign yet that mounting concerns about increasingly powerful AI are beginning to reshape the industry's business plans.\n\nOpenAI CFO Sara Friar told employees just last month that the company would likely go public in 2027 or even sooner, if \"our business continues to inflect.\" Altman's comments came on the same day that Anthropic CEO Dario Amodei published an essay urging AI companies to slow how quickly they improve their most advanced models. Altman and Elon Musk quickly backed the proposal in social media posts, an unusual show of agreement among three fierce rivals. In his essay, Amodei proposed a three-step plan aimed at tempering the pace of development without \"sacrificing commercial advantage or the United States' lead in AI.\" Anthropic is actively gearing up for what is expected to be a historic IPO , though the company has not officially disclosed when it plans to debut. The sudden alignment among Altman, Amodei and Musk shows how quickly concern over AI has moved from the margins to the center of the industry \u2014 and is now beginning to collide with its enormous commercial ambitions.\n\nThe essay urged artificial intelligence companies to pace how quickly they improve model capabilities.", "source": "CNBC World Economy", "pub_date_str": "13 Sep 2026, 04:50 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Altman: IPO unlikely this year - Politico", "full_content": "Altman: IPO unlikely this year Politico See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 03:32 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why OpenAI\u2019s Sam Altman says an IPO isn\u2019t in the cards this year", "full_content": "Concerns about AI safety have ramped up, and OpenAI\u2019s CEO says now would be an \u2018ill-advised\u2019 time for the ChatGPT creator to go public", "source": "MarketWatch Top Stories", "pub_date_str": "13 Sep 2026, 03:20 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Christine Lagarde: Interview with Ouest-France", "full_content": "What brings you to the F\u00eate de la pomme organised by Herv\u00e9 Morin this Saturday?\n\nI\u2019m here as a friend, a neighbour and a Norman to offer a European voice, without being a candidate for anything. I\u2019m here simply to help French people understand the role of Europe a little better.\n\nOn Thursday you announced an increase in the ECB\u2019s key interest rates, which should help to contain inflation but will penalise people planning to purchase property or invest. Why did you take this decision, in a very uncertain context?\n\nThe ECB\u2019s task is to maintain price stability. We have an inflation target of 2% over the medium term. Today, inflation is well above 2%, at 3.3% in the euro area, and there has been a major shock that will probably last longer than we had expected. The shock is the result of the conflict in the Middle East, but also the destruction of refining capacity around the world, especially in Russia. It has led to an increase in energy costs, and that drives all prices higher. In this kind of situation, and as we also have a resilient economy, we are obliged to react.\n\nWhat do you say to the economists who argue that raising interest rates is risky for growth when inflation is related to an external shock rather than an overheating domestic economy?\n\nThat\u2019s true when the shock is short-lived. But the current shock is longer-lasting. The conflict is continuing. We expect the volatility and pressure on energy prices to continue, even though the increase in prices also poses a risk of lower growth.\n\nGrowth in France is subdued and inflation is lower than in neighbouring countries. It\u2019s going to be particularly affected by this decision\u2026\n\nThe ECB has to work for the entire euro area. It can\u2019t look at France, Lithuania or Germany in isolation. Besides, France is one of the countries planning structural reforms, and it would be very important that it implements them.", "source": "ECB Press", "pub_date_str": "13 Sep 2026, 01:30 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "J&J Is in Talks to Sell Its Hips-and-Knees Business to Apollo for $20 Billion - WSJ", "full_content": "J&J Is in Talks to Sell Its Hips-and-Knees Business to Apollo for $20 Billion WSJ Apollo Global Is Said in Talks to Acquire J&J\u2019s Orthopedics Unit Bloomberg.com JNJ Stock Edges Up After-Hours On Apollo\u2019s $20B Orthopedics Talks Yahoo Finance Apollo in talks to acquire J&J\u2019s orthopedics unit - Bloomberg (JNJ:NYSE) Seeking Alpha J&J orthopedics unit draws Apollo interest in potential $20 billion deal, Bloomberg News reports Reuters", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 01:10 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dow Jones Futures: Fed Rate Hike Seen As Oil, Yields Pressure Stocks; Apple, Moderna Are New Buys - Investor's Business Daily", "full_content": "Dow Jones Futures: Fed Rate Hike Seen As Oil, Yields Pressure Stocks; Apple, Moderna Are New Buys Investor's Business Daily Dow rises 500 points to snap 4-day slide as oil cools, traders look past inflation report: Live updates CNBC Wall Street Cheers Clarity on Fed Outlook\u2014Even if It Means Higher Rates WSJ Futures Rise With Help From Oracle\u2019s Beat and Cooler Oil Prices Bloomberg.com Update: Wall Street Rises at End of Losing Week Amid Inflation Worries Yahoo Finance", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 12:02 AM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nagaland govt examining delays in pension, other retirement benefits \u2014 Here's what could change", "full_content": "Nagaland is examining delays in pension and other retirement benefits for state government pensioners and is working on digitising the process, Chief Minister Neiphiu Rio informed the Assembly earlier this month, PTI reported.\n\nResponding to a query raised by MLA Nuklutoshi on recurring delays in pension, gratuity, the General Provident Fund (GPF) / the National Pension Scheme ( NPS ), and other retirement benefits, CM Rio said\n\nAccording to Rio, the committee would examine the above-mentioned issues and work towards digitisation to reduce procedural delays and errors.\n\nMLA Nuklutoshi said pension was a rightful entitlement earned through years of public service and that delays could cause hardship to retirees, particularly in meeting household and medical expenses . He called for pre-retirement verification of service records, preferably beginning about two years before retirement, along with clear timelines and accountability for pending pension cases.\n\nNuklutoshi also urged the government to develop a digital, proactive and time-bound pension system, citing online pension tracking and financial management systems adopted by other northeastern states as possible models for Nagaland.\n\nMeanwhile, the Nagaland government on Friday also announced that it has opened a logistics training centre aimed at equipping 400 economically weaker youth annually, with industry-recognised skills and connecting them with jobs in India and abroad, PTI reported.\n\nFor about a decade, Livemint\u2014News Desk has been a credible source for authentic and timely news, and well-researched analysis on national news, business, personal finance, corporates, politics and geopolitics. We bring the latest updates on all the listed companies on BSE and NSE, startups, mutual funds, Union ministries, geopolitics, and untapped human interest stories from around the world, helping our readers to stay informed on the latest developments around the globe. Our Coverage Areas 1.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 11:54 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "PFRDA looking to allow workers registered on e-Shram portal to open pension accounts via mobile phone, says Chairman", "full_content": "The Pension Fund Regulatory and Development Authority is looking at technology solutions in order to allow workers from the informal sector, who are registered on the e-Shram portal to open pension accounts using their mobile phone, PFRDA Chairperson Sivasubramanian Ramann said, PTI reported.\n\nSpeaking at the Global Fintech Fest 2026 this week, Ramann said the move would be aimed at expanding pension coverage among the large informal workforce. A number of these workers do not receive regular monthly salary or pay income tax, the report added.\n\nAccording to Ramann, the PFRDA could put the Labour Ministry's e-Shram database to use and enable option to open pension accounts through simple stepwise process using mobile phones.\n\nHe said, \u201cWe also have a very large database created by the Ministry of Labour on the e-Shram database. It is a well-refined and authentic database containing many of the fields that are already required to open a pension account. We are, therefore, looking at how people, who are already registered on the database, can be enabled to open pension accounts through a simple, few-click process on their mobile phones. Once the account is opened, they can use UPI to make contributions to it.\u201d\n\nAccording to Ramann, the regulator is exploring the use of the e-Shram database to facilitate pension account opening as it already contains many of the fields required to open a pension account, enabling a simplified digital onboarding process.\n\nOnce the account is opened, subscribers will be able to make contributions using UPI . The service is also envisaged to be available in multiple Indian languages to make pension products easier to understand and access, he added.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 11:31 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "BRICS Pushes Sustainable Transport, Aviation Fuel To Cut Carbon Emissions", "full_content": "New Delhi Declaration calls for deeper cooperation on green infrastructure, sustainable aviation fuels and transport decarbonisation.", "source": "NDTV Profit", "pub_date_str": "12 Sep 2026, 11:23 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "PM Modi, UAE Crown Prince discuss new sovereign fund L'Imad, strategic cooperation; Malaysia ties reviewed", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a PM Modi, UAE Crown Prince discuss new sovereign fund L'Imad, strategic cooperation; Malaysia ties reviewed The Economic Times daily newspaper is available online now. Read Today's Paper PM Modi, UAE Crown Prince discuss new sovereign fund L'Imad, strategic cooperation; Malaysia ties reviewed SECTIONS PM Modi, UAE Crown Prince discuss new sovereign fund L'Imad, strategic cooperation; Malaysia ties reviewed By Dipanjan Roy Chaudhury , ET Bureau Last Updated: Sep 12, 2026, 11:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Prime Minister Narendra Modi and UAE Crown Prince Sheikh Khaled bin Mohamed discussed the role of L'Imad, the UAE's newest sovereign investment fund, in expanding bilateral ties, alongside cooperation in defence, space, nuclear energy and technology. Modi separately reviewed India-Malaysia ties with PM Anwar Ibrahim, including semiconductors, trade, defence and investment.\n\nET Prime special: Know Your Company \u2013 Coal India, Part 1: One tonne of coal, two prices\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits", "source": "Economic Times Economy", "pub_date_str": "12 Sep 2026, 11:23 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Small-cap funds can fall harder than large-caps. How should investors size their bets?", "full_content": "Small-cap funds can offer investors high long-term growth, but the process can be extremely volatile as compared with large-cap or diversified equity funds. So, if you are looking to add small-cap exposure, the question is not just which fund to choose, but how much small-cap exposure is enough for your portfolio.\n\n\u201cSmall-cap schemes can play a constructive role as a growth sleeve within an equity portfolio, but they are highly volatile,\u201d said Arijit Sen, SEBI Registered Investment Adviser and Co-Founder, Merry Mind. He cautioned that sharp drawdowns are possible, making a longer investment horizon and careful position sizing important.\n\nSen further advised that one should consider small-cap exposure as a complementary allocation rather than the core part of an equity portfolio\n\nThe reason is that smaller companies tend to be more sensitive to economic cycles, liquidity conditions and company-specific risks. Their stocks can fall sharply during market corrections and may take longer to recover.\n\n\u201cInvestors should expect larger cyclical swings and deeper corrections than in large-cap or diversified equity funds,\u201d Sen said. The aim, he added, is to capture long-term alpha from smaller companies while accepting \u201cepisodic volatility and liquidity or governance risks\u201d that are more common in the segment.\n\nIf you are concerned about market timing, staggering investments may be more suitable than investing a large amount in small-cap funds at once.\n\n\u201cSystematic entry methods such as SIPs or staggered lump sums over 12\u201324 months\u201d can help investors average into the segment and reduce timing risk, Sen said.\n\nHowever, investors should also be prepared to stay invested through multiple market cycles. Sen recommends a minimum investment horizon of seven years, and preferably 10 years or more, for small-cap exposure.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 10:59 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Atal Pension Yojana: Premature withdrawal rules and how to claim maturity payout amount, explained", "full_content": "Administered by the Pension Fund Regulatory and Development Authority, the Atal Pension Yojana (APY) aims to create a universal social security system in India. Today, we check the rules for premature withdrawal and how to claim maturity payouts.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 10:40 PM IST", "pub_date_relative"     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
