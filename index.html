    const allData = {"general": [{"title": "The September jobs report will be released Friday. Here's what to expect", "full_content": "Lingering questions over the state of the U.S. labor market could be answered Friday when the Bureau of Labor Statistics presents its nonfarm payrolls count for September.\n\nWall Street is looking for job growth of 84,000 to close out the summer, with the unemployment rate holding at 4.1%, according to the Dow Jones consensus.\n\nWhile the top-line payrolls number represents a downshift from the pre-2025 trend, the jobless rate, which Federal Reserve officials watch more closely, is around a level indicating full employment.\n\nThe September release follows a surprisingly strong gain of 162,000 in August , which also saw upward revisions to prior months.\n\nFed officials likely will be looking to the number to confirm labor market strength while they simultaneously turn the balance of their attention to the more nettlesome inflation picture.\n\n\"In the labor market, a broad range of data indicates that conditions have stabilized,\" Fed Vice Chairman Philip Jefferson said in a speech Thursday. \"While job creation has been somewhat volatile, payroll gains have broadened to many sectors in recent months, which is encouraging. Layoffs have remained low, and job openings have moved a bit higher on net.\"\n\nEven with a solid jobs picture, Fed commentary this week has shifted market expectations for a rate hike near the end of October.\n\nNew York Fed President John Williams remarked earlier in the week that \"there is no need for urgency\" when policymakers weigh whether to follow up on September's quarter percentage point rate hike with another increase.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:25 AM IST", "pub_date_relative": "2m ago"}, {"title": "Google rolls out Gemini 4 Argon, its most advanced AI model", "full_content": "Alphabet unveiled Gemini 4 Argon on Wednesday, its most advanced artificial intelligence model yet, offering major improvements in coding, cybersecurity, and complex professional work.\n\nThe company said the model sets a new record in real-world software engineering, ties for first in cybersecurity, and leads another benchmark measuring performance across finance, legal, and other professional tasks.\n\nArgon is already being used internally to optimize memory at Google's data centers, freeing up hundreds of terabytes of memory without buying additional hardware, the company said. Quantum computing researchers have also utilized the model.\n\nGoogle plans to launch the new model in phases, starting with trusted cybersecurity partners while working with the U.S. government on pre-release safety evaluations.\n\n\"Starting this rollout in this way gives us more confidence, but also enables us to put a model that is trained and strong in cyber defense in the hands of defenders as soon as possible,\" Tulsee Doshi, Google's Gemini model product lead, told CNBC.\n\nThe model release comes a day after CEO Sundar Pichai signed a voluntary agreement with President Donald Trump and major tech executives at the White House, following a luncheon to address rising AI safety concerns.\n\nGemini 4 also launches nearly a year after Gemini 3 put the tech company back at the forefront of the heated AI model race. The long-awaited model represents a major push at the frontier and follows Google's pivot toward scaling faster, lower-cost flash models.\n\nGoogle on Wednesday said it's looking to scale safeguards in four key cybersecurity areas, including misuse and prompt injection, before launching publicly.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 12:22 AM IST", "pub_date_relative": "5m ago"}, {"title": "Stocks making the biggest moves midday: Accenture, Synopsys, United Therapeutics, Vicor and more", "full_content": "These are some of the stocks posting the largest moves midday.", "source": "CNBC Finance", "pub_date_str": "02 Oct 2026, 12:20 AM IST", "pub_date_relative": "7m ago"}, {"title": "Equities turn higher as Treasury yields drop from highs", "full_content": "* Constellation rises after signing 20-year Amazon power deal\n\nNEW YORK, Oct 1 (Reuters) - US stocks turned higher on Thursday in choppy trade, with the S&P 500 falling early to a two-week low but then rebounding sharply as a global bond selloff reversed course after sending US Treasury yields to multi-decade highs.\n\nStocks were under pressure in early trading as economic data kept pointing to a solid economy with persistent price pressures.\n\nThe Labor Department said weekly initial jobless claims dipped to 197,000, below the 200,000 forecast of economists polled by Reuters. It was the latest in a string of reports this week that indicated the labor market was on solid footing, ahead of the government payrolls report on Friday.\n\nTreasury yields extended gains, and the benchmark 10-year Treasury note hit a 24-year high, after closing out September with its biggest quarterly gain since 1994, and pushed equities lower after the Institute for Supply Management said its manufacturing PMI dipped to 54.5 last month from 54.6 in August and showed a jump in input prices, raising inflation worries.\n\nBut yields reversed course as buyers stepped in, and further declined after Federal Reserve Vice Chair Philip Jefferson suggested the central bank may be patient before hiking rates again, following a 25 basis point hike in September.\n\n\"Even though valuations have come down, the market's still not cheap, so I'm not bearish on the equity market. We can chug along, but I expect higher volatility in both equities and bonds,\" said Scott Welch, chief investment officer at Certuity in Potomac, Maryland.\n\n\"Everybody's adjusting to a new normal. There's nothing particularly scary about what's happening in the markets right now; it's just a little bit different than what people have been used to operating in over the past few years, and it's going to take some adjustment.\"", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 12:20 AM IST", "pub_date_relative": "7m ago"}, {"title": "Eco Wave Power at Small cap showcase Conference: a lean wave-energy bet", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:15 AM IST", "pub_date_relative": "11m ago"}, {"title": "One of our most recent defensive buys cleared a hurdle and its stock jumped", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:15 AM IST", "pub_date_relative": "11m ago"}, {"title": "McCormick\u2019s price hikes spice up quarterly results despite sluggish demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:13 AM IST", "pub_date_relative": "14m ago"}, {"title": "General Motor Q3 sales drop 5.5%, while Toyota buoyed by EVs, hybrids", "full_content": "General Motors on Thursday reported a year-over-year sales decline of 5.5%, with 670,974 new vehicles sold during the third quarter.\n\nGM's sales of all-electric vehicles are down across the board, as enthusiasm for EVs wanes. EV demand spiked last year ahead of the Trump administration ending up to $7,500 in federal incentives for consumers to purchase an electric vehicle. During the same period last year, GM reported record sales of its electric vehicles.\n\nAgainst those comparisons, EVs this year saw dramatic drops, with the Equinox EV down 92.4% during the most recent quarter, at 1,905 vehicles sold. The Blazer EV was down 84.4% and Hummer EV sales fell 72.9%.\n\nThe report comes after Cox Automotive said last week that new vehicle sales have been stronger than expected this year and raised its 2026 forecast by roughly 2%, to 16.1 million units.\n\nHybrid vehicle sales are expected to capture a growing market share of car sales, as inflated gas prices pressure consumers.\n\nDespite offering a broad EV lineup, the Detroit automaker only offers one hybrid vehicle, a Corvette. Experts expect GM's weakness in the sector to impact its overall sales.\n\nHybrids assisted other automakers in outperforming GM in third-quarter sales.\n\nToyota Motor reported that its EV and hybrid vehicles made up over 57% of the Japanese automaker's sales this quarter.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:13 AM IST", "pub_date_relative": "14m ago"}, {"title": "Trump Medicare drug pricing model may apply to only four companies after exemptions", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:12 AM IST", "pub_date_relative": "14m ago"}, {"title": "Mattel stock jumps on takeover interest from Authentic Brands", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:10 AM IST", "pub_date_relative": "16m ago"}, {"title": "Hong Kong Investors Buying US Treasuries Is a No-Brainer", "full_content": "With its currency pegged to the US dollar, Hong Kong flinches when the Federal Reserve starts raising interest rates.\n\nThe scars from the Fed\u2019s aggressive 525-basis-point hiking cycle, which began in March 2022, are still fresh. With borrowing costs adjusting swiftly and sharply, home prices and the Hang Seng Index have tumbled by as much as 16% and 44% from their late-2021 peaks. In 2022, the Hong Kong Mandatory Provident Fund, the city\u2019s employee retirement system that had HK$1.7 trillion assets under management as of June, suffered its worst loss since the Global Financial Crisis.\n\nSo it might be time for residents to take a careful look at their wealth portfolios to protect against downside risks. A typical MPF account would have two-thirds of its allocation in equities, 21% in debt securities and the rest in cash deposits.\n\nWith most tenors now yielding above 5%, US sovereign debt is looking appealing. Hong Kong investors face almost no currency risk. They don\u2019t need to worry much about inflation eroding fixed-income payouts, since the city\u2019s cost of living is anchored to China\u2019s deflationary economy. There\u2019s no capital gains tax either.\n\nThere\u2019s also a substantial cushion against losses. The 10-year Treasury yield would need to rise to about 6% over the next year for an investor to lose money overall, because the interest payments help offset any decline in the bond\u2019s price. Meanwhile, the potential gains are much larger: A one-percentage-point rise in yields would result in a total loss of less than 2%, while an equivalent decline could deliver a return of about 13%, combining interest income with the increase in the bond\u2019s value.\n\nOne reason investors might hesitate is that the classic balanced portfolio, with 60% in equities and 40% in fixed income, failed to offer diversification in 2022, when both stocks and bonds tumbled. But the valuations then were very different.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 12:09 AM IST", "pub_date_relative": "17m ago"}, {"title": "Nike's new Caitlin Clark shoes are already almost sold out", "full_content": "Nike's Caitlin 1s, the first signature sneaker for Indiana Fever basketball star Caitlin Clark, have nearly sold out less than two hours after their highly anticipated U.S. release.\n\nNike released the Caitlin 1 at 10 a.m. ET on Nike.com. About an hour later, only extra-large sizes above size 15 remained. It's unclear how much inventory Nike made available.\n\nThe sneaker is also nearly sold out at retailers such as Foot Locker, Champs Sports , and Hibbett .\n\nOn resale sites like eBay, Caitlin 1s are already being listed for $200 and up.\n\nNike released the shoe with little fanfare but the release comes as Clark and the Indiana Fever prepare for a win-or-go-home Game 3 playoff game Thursday night at 9 p.m. ET in Las Vegas against the Aces.\n\nThe shoe retails for $140 and is available in adult sizes. Kids' sizes are listed as \"coming soon.\"\n\nThe shoe comes in two colors: \"Caitlin Blue\" or a bright yellow.\n\n\"A lot of thought and time has gone into this shoe,\" Clark said in a press release when Nike unveiled the shoe. \"I never thought I would have my own signature shoe, and now that I do, it's pretty special.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:09 AM IST", "pub_date_relative": "17m ago"}, {"title": "Financial stocks are falling below a key chart level to warn the worst is yet to come", "full_content": "Financial stocks have struggled over the past several weeks, and it\u2019s becoming clear the decline may not be over.", "source": "MarketWatch Top Stories", "pub_date_str": "02 Oct 2026, 12:08 AM IST", "pub_date_relative": "19m ago"}, {"title": "European diesel refining margins drop 7% on reserve talks", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:07 AM IST", "pub_date_relative": "19m ago"}, {"title": "US judge restores court-appointed top federal prosecutor Trump fired in Seattle", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:07 AM IST", "pub_date_relative": "19m ago"}, {"title": "BofA\u2019s Merrill Lynch settles cash sweep case for $39 million, must face second lawsuit", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:07 AM IST", "pub_date_relative": "19m ago"}, {"title": "Treasury sanctions operation targets Iran's auto, rail industries in latest economic attack", "full_content": "The Treasury Department on Thursday sanctioned Iran's automotive and rail sectors as part of the Trump administration's wartime effort to hobble Tehran by cutting off its remaining financial lifelines .\n\nSeveral companies connected to Iran's metals industry, including the Chinese subsidiary of Middle East machinery company HEPCO, are also being designated by the Office of Foreign Assets Control, Treasury said in a news release .\n\nIn a separate release , the department announced additional sanctions on the A7 Network, described as a \"shadow banking network with ties to Russia used by the Iranian regime to evade sanctions.\"\n\nThe actions are the latest to come from \"Operation Economic Outcast,\" the beefed-up sanctions effort that President Donald Trump and Treasury Secretary Scott Bessent touted as Iran's \"economic D-Day\" when it was unveiled in late August.\n\nAs with previous sanctions announcements , it was not immediately clear how much of an impact the new penalties would have on Iran, which has faced heavy sanctions for years. Several entities connected to the A7 Network were previously designated in August 2025 .\n\n\"The Iranian regime's ability to fund its war machine and inflict terror on the world has been severely diminished thanks to Operation Economic Outcast,\" Bessent said in Thursday's news release.\n\n\"Today's action directly targets Iran's enablers and lays the groundwork for the United States and our partners to drain the regime's revenue once and for all,\" Bessent said.\n\nTreasury alleges Iran's automotive sector is deeply enmeshed with the country's Revolutionary Guard and serves as a \"lucrative cash cow\" for the regime, despite sustaining annual losses over $1 billion.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:07 AM IST", "pub_date_relative": "19m ago"}, {"title": "Passenger denied boarding over name mismatch; travel firm, airline told to pay \u20b978,920", "full_content": "A Bengaluru consumer commission has directed an online travel company and an airline to jointly pay \u20b9 78,920 to a passenger who was denied boarding at Newark Airport while returning to Delhi. The passenger, an elderly wheelchair user with medical needs, was reportedly stopped from boarding after airline staff detected a mismatch between his reservation details and their internal records.\n\nHis family had to purchase a replacement ticket at the airport counter for \u20b9 71,241 to ensure that he could return home.\n\nThe consumer commission observed that the failure of the opposite parties to provide the promised refund amounted to deficiency in service and an unfair trade practice.\n\n\u201c\u2026while the same ticket, same PNR, same passenger\u2019s, with just a date change cleared immigration and went to the US on 8/6/2024 from Delhi with the same ticket, one of them was denied boarding in the return because of an internal error in the opposite party no 2 (airline) counter\u2019s guest list that clearly a wrong name entry. Thereby, the act of the opposite party amounts to clear deficiency in service,\u201d the order read.\n\nAccording to the complaint, the passenger\u2019s daughter had booked round-trip tickets through an online travel portal for her parents to travel between Delhi and Newark.\n\nHer father, whom the commission noted was a senior citizen with medical conditions and used a wheelchair, was denied boarding at Newark Airport during the return journey. Airline staff reportedly pointed to a discrepancy in his name on the passenger or guest list.\n\nThe family subsequently purchased another ticket at the airline counter for \u20b9 71,241 so that the passenger could travel back to India.\n\nThe complainant later sought reimbursement of the additional ticket cost. She said the airline and the travel company agreed to refund the amount in two components\u2014 \u20b9 65,920 towards the ticket cost and \u20b9 5,321 representing the fare difference.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 12:07 AM IST", "pub_date_relative": "20m ago"}, {"title": "Mattel attracts takeover interest from Authentic Brands Group, WSJ reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:06 AM IST", "pub_date_relative": "20m ago"}, {"title": "Temasek comfortable with current AI spending levels, executive says", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:06 AM IST", "pub_date_relative": "20m ago"}, {"title": "Have 5 mutual funds in your portfolio? Should you invest \u20b910,000 bonus in one scheme or split it \u2014 what experts suggest", "full_content": "Suppose you already have 5 mutual funds in your portfolio across equity, debt, hybrid, gold, etc. You receive a \u20b9 10,000 bonus from your employer and want to invest the money in these mutual fund holdings.\n\nShould you add it to all five funds or put it into just one or two? Here is what experts suggest investors should consider before putting a small lump sum to work.\n\nAditya Agarwal, Co-founder, Wealthy.in said the number of funds matters less than the portfolio\u2019s current asset allocation. \u201cThe right question is not \u2018how should I split this?\u2019 but \u2018which part of my portfolio is short of its target?\u2019\u201d\n\nIf an investor has a target mix\u2014for example, a specific allocation to equity, debt and gold\u2014the bonus can go towards the asset class that is furthest below its target. Splitting \u20b9 2,000 into each of five funds sounds balanced, but it simply repeats the current mix, including whatever imbalance already exists, Agarwal said.\n\nPutting the whole amount into one fund is perfectly fine when one gap is clearly larger than the others. Spreading it over two or three makes sense when a couple of asset classes are underweight, he added.\n\nManish P. Hingar, Founder and chief executive officer of Fintoo, said, \u201cDon\u2019t spread \u20b9 10,000 across all five funds. \u20b9 2,000 each makes very little difference. Look at your overall portfolio mix instead. Say your plan is 60% equity, and you currently sit at 52%; the bonus goes to equity. Put it into the one or two funds that are below their planned share. Let your asset allocation decide where the money goes, not your favourite fund.\u201d\n\nA fund falling in value alone is not a reason to add more money to it. Investors should first understand why it has underperformed.\n\n\u201cIf the whole market is down, adding money does lower your average cost. But if the fund has trailed similar funds for two to three years, the fund itself is the problem, and putting more money into it won\u2019t fix that,\u201d Hingar said.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 12:05 AM IST", "pub_date_relative": "22m ago"}, {"title": "BofA Securities names top mining stocks as copper outlook brightens", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:04 AM IST", "pub_date_relative": "22m ago"}, {"title": "CNBC AI Forum live updates: Enterprise AI in Dallas", "full_content": "The CNBC AI Forum brings business leaders, entrepreneurs and researchers to Dallas on Oct. 1, 2026, for live conversations about how artificial intelligence is reshaping companies, workers and customers.\n\nCNBC's AI Forum will focus on the practical challenge of moving from experimentation to enterprise-scale deployment, along with the risks posed by autonomous agents, cybersecurity threats, the data center buildout and uneven regulation. Follow this live blog for updates, key quotes and takeaways from sessions on AI infrastructure, governance, financial services and the global race for technological leadership.\n\nCNBC is hosting its second annual AI Forum today in Dallas, Texas \u2014 highlighting that Dallas has become a hub for enterprise-minded AI development.\n\nDallas now boasts one of the country's largest tech workforces, driven by local universities' focus on expanding AI and engineering programs and by Texas's lower cost of living, which has been drawing talent away from Silicon Valley. Meanwhile, key industries, from telecom to healthcare to financial services, are embedding AI into existing infrastructure in Dallas or setting down new roots to build AI systems that can solve real-world problems for their customers.\n\nIn addition to OpenAI's Bret Taylor and Wells Fargo's Saul Van Beurden, CNBC has convened several executives, thought leaders, entrepreneurs, and researchers to talk about the wide-ranging impact of AI.\n\nOpenAI Chairman Bret Taylor is one of the most anticipated speakers at the CNBC AI Forum in Dallas.\n\nTaylor, the co-founder of AI startup Sierra , will be joined on stage by Saul Van Beurden, Wells Fargo co-CEO of consumer banking & head of AI, for a conversation with CNBC's Julia Boorstin about how organizations can scale AI to create value.\n\nIt's been a big week for OpenAI: the company held its annual DevDay developer conference Tuesday, where the AI company unveiled a number of new products and developer tools.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 12:03 AM IST", "pub_date_relative": "23m ago"}, {"title": "Google unveils latest AI model, but Wall Street wants a breakout personal agent", "full_content": "Google may be back at the frontier of artificial intelligence, but investors and consumers are increasingly focusing on what people can build with the technology as personal agents surge in popularity.\n\nThe company unveiled its long-awaited Gemini 4 Argon model on Wednesday, promising major advances in coding, cybersecurity, and complex tasks. According to industry benchmarks, Argon ties OpenAI on a key cybersecurity test and posts leading results in software engineering.\n\nArgon's introductory pricing of $2 per million input tokens and $10 per million output tokens also matches OpenAI's newly discounted GPT-6.1 Sol model. A token is equivalent to about three-quarters of one word.\n\nWhile Google is stepping up its game in the model battle, rival Meta is racking up millions of downloads for its Muse app, which launched last month and soared to the top of Apple's App Store, topping ChatGPT. Earlier this week, OpenAI rolled out Dots , its personal agent offering, capitalizing on demand from businesses and consumers for tools that can carry out tasks \u2014 like scouring emails, booking travel and organizing expenses \u2014 on a user's behalf.\n\nMeanwhile, the attention at the frontier model level has turned to safety, with Anthropic CEO Dario Amodei sparking a firestorm three weeks ago by urging the top AI labs to slow the pace of development as concerns intensify about their potential dangers.\n\nOver the past three months, Alphabet's stock is down about 6%, while Meta is up 19% over that stretch, sparked by September's rally, which was the sharpest for any month since 2022.\n\nAnalysts at JPMorgan Chase wrote in a note on Thursday that Google needs a significant advance in its personal agent offerings to generate consumer enthusiasm. Bank of America identified the potential for Gemini 4 to strengthen Google's cloud business and existing products, while providing a foundation for a future personal agent.\n\nIn the consumer market, Google has a massive home-court advantage.", "source": "CNBC World Economy", "pub_date_str": "01 Oct 2026, 11:59 PM IST", "pub_date_relative": "27m ago"}, {"title": "Stock Market Today: Global Bond Selloff Resumes; Yields Remain at Highs \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Global Bond Selloff Resumes; Yields Remain at Highs \u2014 Live Updates WSJ 10-year Treasury yield climbs to a 24-year high amid relentless global bond sell-off CNBC More swings for bond yields rattle financial markets worldwide PBS Stocks Fall After Manufacturing Data as Oil Climbs: Markets Wrap Bloomberg.com Global bond rout deepens, pushes US Treasury yields to 24-year peak Reuters", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 11:59 PM IST", "pub_date_relative": "28m ago"}, {"title": "Brent oil jumps more than 4% as U.S. reportedly sends third aircraft carrier to Middle East", "full_content": "Oil prices rose sharply Thursday, following a report the U.S. is sending a third aircraft-carrier strike group to the Middle East.\n\nBrent crude , the international benchmark, was last seen trading about 4.6% higher at $102.55 per barrel, while U.S. West Texas Intermediate futures rose about 3% to $93.24.\n\nU.S. officials told The Wall Street Journal that Marine Corps ships and up to 10,000 additional troops are also being deployed to the region. The forces are expected to arrive by the end of November, the officials said.\n\nThe USS Theodore Roosevelt left San Diego on a scheduled deployment Sunday, The Journal reported. The USS George H.W. Bush and USS George Washington are currently in the Middle East.\n\nMeanwhile, China's state oil major PetroChina canceled a handful of gasoline and jet fuel shipments that were planned for October, unnamed sources told Reuters, as Beijing looks to safeguard domestic supplies. CNBC could not independently verify the report.\n\nGlobal energy markets have been grappling with supply disruptions from the U.S.-Iran war in the Middle East and Russia's full-scale invasion of Ukraine.\n\nbrent UOB in a note Thursday said that crude flows from Middle East were reportedly nearing pre-war levels, but fuel supplies, particularly gasoline, were lagging behind.\n\nWorries over crude supply disruptions have eased following the resumption of oil tanker \u200bloadings by Saudi Arabia from its Red Sea port of Yanbu after the kingdom restarted operations on its East-West Pipeline.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 11:53 PM IST", "pub_date_relative": "33m ago"}, {"title": "50% of Nifty stocks slip into bear territory, down up to 40% - What should investors do now? Experts view", "full_content": "More than 20 Nifty 50 constituents are now trading over 20% below their recent highs, as multiple challenges on Dalal Street prompt investors to shy away from riskier assets.\n\nCrude oil prices have been a focal point for markets since late February, when the US and Israel launched joint strikes on Iran, triggering a war in the Middle East.\n\nHigher energy prices caused global bond yields to spike to levels not seen in two decades, as investors started demanding higher compensation amid growing inflationary risks and widening government deficits.\n\nBack home, the falling rupee, persistent selling by overseas investors, and challenges in the rural economy have added more pressure, turning domestic equities into one of the worst performers among their Asian peers in 2026.\n\nThe sell-off spared no sector, with tech stocks continuing to bleed heavily, while bellwethers hovered near their Covid-era lows. FMCG, auto, and financial stocks were also severely hit in the sell-off.\n\nNifty 50 plunged 6% in September, taking its 2026 decline to 14.2% and positioning it for its biggest annual decline since 2011, when it crashed 24.62%.\n\nAccording to Trendlyne data, 25 constituents in the index are now trading 20% to 40% below their recent highs. On Dalal Street, corrections are defined as losses of 10%, while bear markets are marked by drawdowns of 20% or more.\n\nInfosys topped the chart as the tech major dropped 40% from its 52-week high of \u20b9 1,728, marking one of the biggest reversals in recent times. ITC is also facing difficulties in attracting bulls, as the stock crashed by a similar 40% from its October 2025 high of \u20b9 426.40.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:47 PM IST", "pub_date_relative": "39m ago"}, {"title": "This silent alarm in the bond market tells you which stocks to buy and which to avoid", "full_content": "Widening credit spreads send an important signal that investors should heed about which stocks to buy and which to avoid", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 11:40 PM IST", "pub_date_relative": "47m ago"}, {"title": "Indian Bank May Consider Waiving 0.28% MDR On UPI Transactions, Says CEO", "full_content": "Indian Bank MD and CEO further mentioned that the introduction of MDR would be incrementally positive for banks, although it is unlikely to have a substantial impact on their income.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:32 PM IST", "pub_date_relative": "54m ago"}, {"title": "Iran May Be Linked To Flydubai Incident 'Based On What I'm Hearing', Says Trump", "full_content": "US president says Tehran may be linked to the cockpit attack as UAE and Saudi Arabia investigate possible terrorist motives.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:32 PM IST", "pub_date_relative": "55m ago"}, {"title": "Former LinkedIn chief Roslansky to leave Microsoft, following other exec departures", "full_content": "Microsoft executive Ryan Roslansky, who led the software company's LinkedIn subsidiary for six years, will leave at the end of 2026. Satya Nadella, Microsoft's CEO, announced the departure in a Thursday memo.\n\n\"Ryan leaves the organization in a strong position,\" Nadella wrote in his message to employees .\n\nAlongside other technology heavyweights, Redmond, Washington-based Microsoft has been trying to evolve and take advantage of the rise of generative artificial intelligence . Gaming head Phil Spencer and Office leader Rajesh Jha both left this year, and Charlie Bell, the company's head of security, became an individual contributor.\n\nRoslansky joined LinkedIn as product chief in 2009, when it was still private. Previously, he had held management roles at Yahoo and Glam Media. Microsoft acquired LinkedIn for $27 billion in 2016. In 2020, Roslansky replaced Jeff Weiner as LinkedIn CEO. During Roslansky's tenure, LinkedIn's membership expanded from 700 million to 1.3 billion.\n\nIn 2025, Roslansky took on additional responsibility in Microsoft's Office productivity software group. Earlier this year, Nadella named Roslansky and two other executives as leaders of the Microsoft 365 applications and the Copilot artificial intelligence platform, and Dan Shapero , LinkedIn's chief operating officer, became the professional social network's CEO.\n\nNadella noted Roslansky's contributions to the unified Copilot app , which Microsoft announced last week.\n\n\"With Copilot, we are executing rapidly against our vision to build a new OS for work that spans every model, every form factor, and every task, with Office fully embedded in Copilot and vice versa! Over the past year, Ryan's team has done critical work bringing together the product, engineering, and design foundations that have made this next phase possible.\"\n\nIn July, Microsoft disclosed that LinkedIn revenue growth for the June fiscal year sped up to 11% from less than 9% a year earlier.", "source": "CNBC World Economy", "pub_date_str": "01 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago"}, {"title": "From Airports To Dharavi Redevelopment: Pranav Adani Highlights Rs 6 Lakh Crore Maharashtra Blueprint", "full_content": "In the power sector, Adani highlighted the group's role in supplying electricity to more than 3 million homes across Mumbai through Adani Electricity.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:28 PM IST", "pub_date_relative": "58m ago"}, {"title": "Gen Z is trading stocks, investing in MFs using AI\u2014but can it replace human judgement? Experts explain", "full_content": "Artificial intelligence is emerging as a powerful research tool for Gen Z investors looking to invest in stocks, mutual funds and systematic investment plans (SIPs). However, experts caution that AI should complement\u2014not replace\u2014investor judgement, discipline and sound financial planning.\n\nOne Gen Z investor, for instance, used an AI tool to analyse his portfolio. Although he already owned a Flexi Cap Fund, the tool recommended another fund in the same category without adequately accounting for portfolio overlap.\n\nThis highlights some of the risks young investors need to consider when using AI for investment decisions.\n\nAmitha A. Jayan, Wealth Manager at Scripbox, said: \u201cAI summarises vast information, but fund NAVs, expense ratios, or financial metrics can occasionally be outdated. Double-check details on official platforms before committing. AI outputs are naturally generic. Every choice must match your specific risk capacity, tax bracket, time horizon, and short-term liquidity needs.\u201d\n\n\u201cAlgorithms tracking online sentiment can lean toward volatile or viral assets. True wealth creation comes from patient, long-term asset allocation,\u201d Jayan added.\n\nAI can process large volumes of information quickly, but investors still need to assess whether the information is relevant to their own financial circumstances.\n\nAshwiinii Deshpande (NFP Member), Director at Hitachintak Investservices, said: \u201cAI can calculate, but experience decides which variables and weights are appropriate. It can also miss information we never provide.\u201d\n\nAn investor may have a stable income today, but an unexpected financial emergency or future family responsibilities could significantly change their investment requirements. Such factors need to be considered when deciding the appropriate asset allocation.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:27 PM IST", "pub_date_relative": "59m ago"}, {"title": "Joint ownership over: Former property holder still uses address on Aadhaar and bank\u2014should you worry? Experts explain", "full_content": "Suppose two brothers jointly own a residential property, with each holding a 50% share. Later, one brother buys the other brother\u2019s 50% share, becoming the sole owner of the property. The former co-owner then moves out of the residence.\n\nHowever, he continues to use the property\u2019s address on his Aadhaar card and maintains bank accounts with the same address. Does this create any legal risk for the sole owner? Can the former co-owner\u2019s Aadhaar or bank records affect the ownership of the property? Here\u2019s what experts have to say.\n\n\u201cOnce a co-owner has validly transferred his share in an immovable property through a duly executed and registered instrument, the fact that he continues to use the property\u2019s address on Aadhaar, bank accounts or other records does not, by itself, establish any continuing ownership interest in the property,\u201d Ketan Mukhija, Partner and Co-Head of PE/VC at Kochhar & Co., said.\n\nAadhaar is an identity document, and its address field is not a title document. Similarly, a bank\u2019s KYC address records a customer's contact or address particulars; it does not establish ownership of the premises. Therefore, retaining the old address does not automatically make the Aadhaar or bank records invalid or void after the sale, Amitraj Kaushal, Advocate at the Supreme Court of India, explained.\n\nAn address appearing in an identity or financial record does not, by itself, trigger a change. However, he said the former co-owner should update his address where required under applicable KYC and, practically, provide his new address to banks and other institutions.\n\n\u201cThe critical distinction is between the former owner's debt and the ownership of the property.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why are world bond markets selling off again?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Why are world bond markets selling off again? Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Why are world bond markets selling off again? SECTIONS Why are world bond markets selling off again? Reuters Last Updated: Oct 01, 2026, 11:24:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis As inflation fears and mounting debt pressure rise, government borrowing costs have soared to unprecedented levels. The US Treasury yield, now the highest since 2002, signifies a shift in global market dynamics. These increasing bond yields adversely affect loans for families and businesses, posing challenges for governmental finances. Intervention by central banks could be on the horizon to maintain fiscal order, especially with future artificial intelligence-related bond issues looming.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Drishyam: The Conclusion Advance Booking \u2014 Ajay Devgn Film Sees Strong Demand Ahead Of Release", "full_content": "Drishyam: The Conclusion continues Vijay Salgaonkar's story as his old secret comes under fresh pressure. The movie is directed by Abhishek Pathak.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "EU countries in crisis talks over release of diesel stocks", "full_content": "Trump administration has pressured European countries to release strategic reserves, warning that it could ban US diesel exports if they do not do so", "source": "FT Markets", "pub_date_str": "01 Oct 2026, 11:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "October 2026 Phone Launches: Vivo V80, Motorola Edge 70 Neo, Oppo F35 Pro On The Way", "full_content": "October may be quieter than September for phone launches, but the Vivo V80, Oppo F35 series, OnePlus 16 and Vivo X Fold 6 are among the devices lined up. Here's what to expect.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "What is Pension Adalat to be held in Gurugram on October 12 and 13? Check timings, documents and more", "full_content": "A Pension Adalat will be organised in Gurugram on October 12 and 13 to address pension-related grievances of retired Haryana government employees and serving employees who are General Provident Fund (GPF) subscribers, according to an official.\n\nThe two-day event is being organised by the Office of the Principal Accountant General (Accounts and Entitlement), Haryana, Chandigarh. Gurugram Treasurer Nancy Yadav has urged eligible pensioners and employees to attend the Pension Adalat to seek resolution of their pension-related concerns.\n\nA Pension Adalat is a grievance-redressal forum where pensioners can raise issues related to their pension payments and seek assistance from the concerned authorities. Such forums provide pensioners an opportunity to present their complaints and have them examined for resolution.\n\nThe Pension Adalat will be held from 10:30 am to 1 pm on both days.\n\nThe event will take place at Ramanujan Hall, Science Block, First Floor, SCERT, Sohna Road, Gurugram.\n\nPensioners have been advised to bring documents related to their pension grievances, including:\n\nThe authorities have urged pensioners and eligible employees to carry the necessary documents so their concerns can be examined during the Pension Adalat.\n\nMeanwhile, the Office of the Controller of Communication Accounts (CCA), Maharashtra & Goa, conducted a Quarterly Pension Adalat in Nashik on September 18, the Ministry of Communications said in a statement.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Another Fed Leader Suggests Next Rate Increase Can Wait - WSJ", "full_content": "Another Fed Leader Suggests Next Rate Increase Can Wait WSJ Top Fed official signals central bank will keep rates on hold in October Financial Times Jefferson Says Fed May Need More Time to Weigh Next Move Bloomberg.com COMMENTARY: Morning Bid: October doubts Reuters FED GOV JEFFERSON/CHARLOTTESVILLE: 'EXPECT INFLATION TO BE ELEVATED IN THE SHORT RUN BEFORE RESUMING ITS DECLINE TOWARD OUR 2% GOAL' TradingView", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 11:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Large-cap mutual fund or Nifty 50 index? Expert weighs in on where to invest \u2014 and if SIP is better", "full_content": "Large-cap mutual funds and Nifty 50 index funds are two ways investors can get exposure to large-cap stocks in their portfolio.\n\nNifty 50 index funds replicate the 50 stocks in the index and follow a passive strategy, while active large-cap funds must invest at least 80% of their assets in large-cap stocks and generally pick stocks from the top 100 companies by market capitalisation.\n\nLarge-cap funds can hold a varying number of stocks, with some holding more than 50 stocks and others fewer, depending on the fund manager\u2019s strategy.\n\nBut should investors choose both or keep only one, given that both offer large-cap exposure? Here\u2019s what an expert has to say.\n\nHarsh Vardhan Dawar, ACA, CFA, FRM, Founder - Wealth Cafe, said investors should tag all investments in their portfolio as either passive or active, and also by market-cap category \u2014 large, mid or small cap.\n\nHe suggested that a typical 30-year-old growth investor may have:\n\nDawar said a new investor can consider both these funds and allocate funds in line with his portfolio allocation. However, a risk-averse investor can prefer Nifty 50 index funds, while a riskier investor can prefer actively managed large-cap funds.\n\nFor both Nifty 50 index funds and large-cap funds, SIP would be the preferred route, Dawar said.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Shatabdi Hospital Canteen, Dadar's Kohinoor Among 12 To Lose Food Licence In Tukaram Mundhe-Led FDA Crackdown", "full_content": "Maharashtra FDA suspended licences of 12 Mumbai food establishments, citing hygiene and food-safety violations during inspections.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Digger X Reviews: Tom Cruise-Starrer Gets Mixed Response, From 'Pure Genius' To 'Agony To Watch'", "full_content": "Tom Cruise leads Digger, a satirical black comedy that follows a powerful man who sets out to save humanity after a disaster triggered by his own actions threatens the world.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ex-HSBC banker banned for dodging \u00a35,900 in train fares", "full_content": "Joseph Molloy was convicted this year of using a \u2018doughnutting\u2019 scam to avoid paying for tickets", "source": "FT Markets", "pub_date_str": "01 Oct 2026, 11:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "As Mortgage Rates Hit Highest Level Since 2023, Buyers Look at ARMs - The New York Times", "full_content": "As Mortgage Rates Hit Highest Level Since 2023, Buyers Look at ARMs The New York Times How 7% Mortgages Are Wrecking the Home-Buyer Playbook WSJ US mortgage rates jump the most in four years as bond sell-off hits Main Street Financial Times Mortgage rates approach their highest level in 3 years: Mortgage and refinance interest rates today, Thursday, October 1, 2026 Yahoo Finance Mortgage rates just hit 7.28%. But there are ways to get a lower rate | CNN Business cnn.com", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 11:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic Said to Target Mega-IPO Before Thanksgiving Holiday - Bloomberg.com", "full_content": "Anthropic Said to Target Mega-IPO Before Thanksgiving Holiday Bloomberg.com Anthropic reportedly looking to IPO as early as mid-November Yahoo Finance NEWSLETTER: Inside Anthropic\u2019s confidential S-1: a Q&A Reuters Google And Amazon Are The Reason For Anthropic\u2019s Eye-Watering $42 Billion Loss Forbes Anthropic plans to go public before Thanksgiving: report Seeking Alpha", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 10:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "New York City's 'click to cancel' subscription rule takes effect, joining states with similar laws", "full_content": "New York City has become the latest jurisdiction to crack down on hard-to-cancel subscriptions.\n\nThe city's new \"click to cancel\" rule, which took effect Thursday, requires businesses to make it easier for customers to end subscriptions that renew automatically. While New York state already requires a cancellation method as easy as sign-up, this gives the city authority to enforce similar protections locally and is providing a website portal for consumers to complain about violations.\n\n\"If a company can take your money with one click, you should be able to get your money back with one click,\" said Mayor Zohran Mamdani in a news release Thursday.\n\nNew York City is the first municipality to adopt a click-to-cancel rule, according to city officials, joining a growing number of states that have enacted or strengthened laws governing automatic subscription renewals and cancellations as the possibility of a nationwide standard remains unsettled.\n\n\"Automatic renewals have been a pain point for consumers , and this is a popular topic with regulators, especially now given the increased focus on affordability, so I expect we'll continue to see more of these laws on the state level,\" said Gonzalo Mon, a partner with the law firm of Kelley Drye & Warren in Washington.\n\nSo-called \"negative option\" subscription contracts \u2014 those that automatically renew unless consumers cancel them \u2014 have generated a growing number of complaints as their prevalence and use have increased, according to experts. While these subscriptions are easy to sign up for, they can be difficult to cancel.\n\nEach year, U.S. adults spend an average of $1,080 on subscriptions, according to a survey by CNET , a media website focused on consumer technology. By generation, millennials spend the most annually, at an average $1,215. The survey was conducted online in April 2025 by YouGov and involved 2,440 adults.\n\nThe survey found that consumers spend an average of $205 annually on subscriptions they no longer use.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 10:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "'I Want That Feeling Back': Rohit Sharma's 2027 World Cup Dream And His Big Take On Shubman Gill's Captaincy", "full_content": "Rohit Sharma praised Shubman Gill's leadership and said he wants to experience the feeling of winning a World Cup again as India targets the 2027 ODI edition.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump\u2019s SEC wants to allow fund managers to charge extra fees for better performance. Here\u2019s why it\u2019s a terrible idea.", "full_content": "Think twice before embracing any new fund with high performance-related fees in your 401(k).", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 10:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "FPIs pull out \u20b936,000 cr from Indian equities in Sept as high oil, bond yields weigh \u2014 should retail investors worry?", "full_content": "It appears that overseas investors are losing confidence in Asia's third-largest economy, as reflected in their resumption of selling in domestic stocks, with investors seemingly finding better opportunities elsewhere.\n\nForeign portfolio investors turned net sellers again in September, selling \u20b9 35,860 crore worth of stocks, according to NSDL data. The latest selling came after FPIs invested \u20b9 20,200 crore in July and \u20b9 29,631 crore in August.\n\nWith the September outflows, total FPI withdrawals from Indian equities in 2026 have reached \u20b9 2.69 lakh crore, surpassing the \u20b9 1.66 lakh crore outflow recorded during the whole of 2025.\n\nThe record outflows have clearly been visible in the Nifty 50's performance, with the index logging double-digit losses in 2026, falling over 14% so far and remaining on track for its first annual decline in 15 years.\n\nThe gauge has remained lower for the last eight straight weeks, with the last similar losing streak occurring 25 years ago, reflecting the deepening pressure on the broader market. If not for the support from the domestic mutual funds, the fall would have been even more severe.\n\nBarring stocks, the heavy selling has added more pressure to the Indian rupee, which has registered multiple record lows and turned into one of Asia's worst-performing currencies. The local currency has also been affected by elevated crude oil prices, global bond yields, and strong dollar demand.\n\nIn addition to equity, FPIs also turned into net sellers in the debt (general limit) at \u20b9 5,247 crore, in debt (VRR or Voluntary Retention Route) at \u20b9 5,049 crore, in debt (FAR or Fully Accessible Route) at \u20b9 10,431 crore, and in hybrid at \u20b9 2,078 crore.\n\nBesides, frontrunners in the AI trade, Taiwan and South Korea, are also seeing outflows after attracting money in August, as per media reports. The reversal in the East Asian markets follows an improvement in foreign demand earlier in the quarter.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 10:45 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "The September jobs report will be released Friday. Here's what to expect", "full_content": "Lingering questions over the state of the U.S. labor market could be answered Friday when the Bureau of Labor Statistics presents its nonfarm payrolls count for September.\n\nWall Street is looking for job growth of 84,000 to close out the summer, with the unemployment rate holding at 4.1%, according to the Dow Jones consensus.\n\nWhile the top-line payrolls number represents a downshift from the pre-2025 trend, the jobless rate, which Federal Reserve officials watch more closely, is around a level indicating full employment.\n\nThe September release follows a surprisingly strong gain of 162,000 in August , which also saw upward revisions to prior months.\n\nFed officials likely will be looking to the number to confirm labor market strength while they simultaneously turn the balance of their attention to the more nettlesome inflation picture.\n\n\"In the labor market, a broad range of data indicates that conditions have stabilized,\" Fed Vice Chairman Philip Jefferson said in a speech Thursday. \"While job creation has been somewhat volatile, payroll gains have broadened to many sectors in recent months, which is encouraging. Layoffs have remained low, and job openings have moved a bit higher on net.\"\n\nEven with a solid jobs picture, Fed commentary this week has shifted market expectations for a rate hike near the end of October.\n\nNew York Fed President John Williams remarked earlier in the week that \"there is no need for urgency\" when policymakers weigh whether to follow up on September's quarter percentage point rate hike with another increase.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:25 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Google rolls out Gemini 4 Argon, its most advanced AI model", "full_content": "Alphabet unveiled Gemini 4 Argon on Wednesday, its most advanced artificial intelligence model yet, offering major improvements in coding, cybersecurity, and complex professional work.\n\nThe company said the model sets a new record in real-world software engineering, ties for first in cybersecurity, and leads another benchmark measuring performance across finance, legal, and other professional tasks.\n\nArgon is already being used internally to optimize memory at Google's data centers, freeing up hundreds of terabytes of memory without buying additional hardware, the company said. Quantum computing researchers have also utilized the model.\n\nGoogle plans to launch the new model in phases, starting with trusted cybersecurity partners while working with the U.S. government on pre-release safety evaluations.\n\n\"Starting this rollout in this way gives us more confidence, but also enables us to put a model that is trained and strong in cyber defense in the hands of defenders as soon as possible,\" Tulsee Doshi, Google's Gemini model product lead, told CNBC.\n\nThe model release comes a day after CEO Sundar Pichai signed a voluntary agreement with President Donald Trump and major tech executives at the White House, following a luncheon to address rising AI safety concerns.\n\nGemini 4 also launches nearly a year after Gemini 3 put the tech company back at the forefront of the heated AI model race. The long-awaited model represents a major push at the frontier and follows Google's pivot toward scaling faster, lower-cost flash models.\n\nGoogle on Wednesday said it's looking to scale safeguards in four key cybersecurity areas, including misuse and prompt injection, before launching publicly.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 12:22 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Equities turn higher as Treasury yields drop from highs", "full_content": "* Constellation rises after signing 20-year Amazon power deal\n\nNEW YORK, Oct 1 (Reuters) - US stocks turned higher on Thursday in choppy trade, with the S&P 500 falling early to a two-week low but then rebounding sharply as a global bond selloff reversed course after sending US Treasury yields to multi-decade highs.\n\nStocks were under pressure in early trading as economic data kept pointing to a solid economy with persistent price pressures.\n\nThe Labor Department said weekly initial jobless claims dipped to 197,000, below the 200,000 forecast of economists polled by Reuters. It was the latest in a string of reports this week that indicated the labor market was on solid footing, ahead of the government payrolls report on Friday.\n\nTreasury yields extended gains, and the benchmark 10-year Treasury note hit a 24-year high, after closing out September with its biggest quarterly gain since 1994, and pushed equities lower after the Institute for Supply Management said its manufacturing PMI dipped to 54.5 last month from 54.6 in August and showed a jump in input prices, raising inflation worries.\n\nBut yields reversed course as buyers stepped in, and further declined after Federal Reserve Vice Chair Philip Jefferson suggested the central bank may be patient before hiking rates again, following a 25 basis point hike in September.\n\n\"Even though valuations have come down, the market's still not cheap, so I'm not bearish on the equity market. We can chug along, but I expect higher volatility in both equities and bonds,\" said Scott Welch, chief investment officer at Certuity in Potomac, Maryland.\n\n\"Everybody's adjusting to a new normal. There's nothing particularly scary about what's happening in the markets right now; it's just a little bit different than what people have been used to operating in over the past few years, and it's going to take some adjustment.\"", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 12:20 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Eco Wave Power at Small cap showcase Conference: a lean wave-energy bet", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:15 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mattel stock jumps on takeover interest from Authentic Brands", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:10 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Hong Kong Investors Buying US Treasuries Is a No-Brainer", "full_content": "With its currency pegged to the US dollar, Hong Kong flinches when the Federal Reserve starts raising interest rates.\n\nThe scars from the Fed\u2019s aggressive 525-basis-point hiking cycle, which began in March 2022, are still fresh. With borrowing costs adjusting swiftly and sharply, home prices and the Hang Seng Index have tumbled by as much as 16% and 44% from their late-2021 peaks. In 2022, the Hong Kong Mandatory Provident Fund, the city\u2019s employee retirement system that had HK$1.7 trillion assets under management as of June, suffered its worst loss since the Global Financial Crisis.\n\nSo it might be time for residents to take a careful look at their wealth portfolios to protect against downside risks. A typical MPF account would have two-thirds of its allocation in equities, 21% in debt securities and the rest in cash deposits.\n\nWith most tenors now yielding above 5%, US sovereign debt is looking appealing. Hong Kong investors face almost no currency risk. They don\u2019t need to worry much about inflation eroding fixed-income payouts, since the city\u2019s cost of living is anchored to China\u2019s deflationary economy. There\u2019s no capital gains tax either.\n\nThere\u2019s also a substantial cushion against losses. The 10-year Treasury yield would need to rise to about 6% over the next year for an investor to lose money overall, because the interest payments help offset any decline in the bond\u2019s price. Meanwhile, the potential gains are much larger: A one-percentage-point rise in yields would result in a total loss of less than 2%, while an equivalent decline could deliver a return of about 13%, combining interest income with the increase in the bond\u2019s value.\n\nOne reason investors might hesitate is that the classic balanced portfolio, with 60% in equities and 40% in fixed income, failed to offer diversification in 2022, when both stocks and bonds tumbled. But the valuations then were very different.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 12:09 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nike's new Caitlin Clark shoes are already almost sold out", "full_content": "Nike's Caitlin 1s, the first signature sneaker for Indiana Fever basketball star Caitlin Clark, have nearly sold out less than two hours after their highly anticipated U.S. release.\n\nNike released the Caitlin 1 at 10 a.m. ET on Nike.com. About an hour later, only extra-large sizes above size 15 remained. It's unclear how much inventory Nike made available.\n\nThe sneaker is also nearly sold out at retailers such as Foot Locker, Champs Sports , and Hibbett .\n\nOn resale sites like eBay, Caitlin 1s are already being listed for $200 and up.\n\nNike released the shoe with little fanfare but the release comes as Clark and the Indiana Fever prepare for a win-or-go-home Game 3 playoff game Thursday night at 9 p.m. ET in Las Vegas against the Aces.\n\nThe shoe retails for $140 and is available in adult sizes. Kids' sizes are listed as \"coming soon.\"\n\nThe shoe comes in two colors: \"Caitlin Blue\" or a bright yellow.\n\n\"A lot of thought and time has gone into this shoe,\" Clark said in a press release when Nike unveiled the shoe. \"I never thought I would have my own signature shoe, and now that I do, it's pretty special.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:09 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Treasury sanctions operation targets Iran's auto, rail industries in latest economic attack", "full_content": "The Treasury Department on Thursday sanctioned Iran's automotive and rail sectors as part of the Trump administration's wartime effort to hobble Tehran by cutting off its remaining financial lifelines .\n\nSeveral companies connected to Iran's metals industry, including the Chinese subsidiary of Middle East machinery company HEPCO, are also being designated by the Office of Foreign Assets Control, Treasury said in a news release .\n\nIn a separate release , the department announced additional sanctions on the A7 Network, described as a \"shadow banking network with ties to Russia used by the Iranian regime to evade sanctions.\"\n\nThe actions are the latest to come from \"Operation Economic Outcast,\" the beefed-up sanctions effort that President Donald Trump and Treasury Secretary Scott Bessent touted as Iran's \"economic D-Day\" when it was unveiled in late August.\n\nAs with previous sanctions announcements , it was not immediately clear how much of an impact the new penalties would have on Iran, which has faced heavy sanctions for years. Several entities connected to the A7 Network were previously designated in August 2025 .\n\n\"The Iranian regime's ability to fund its war machine and inflict terror on the world has been severely diminished thanks to Operation Economic Outcast,\" Bessent said in Thursday's news release.\n\n\"Today's action directly targets Iran's enablers and lays the groundwork for the United States and our partners to drain the regime's revenue once and for all,\" Bessent said.\n\nTreasury alleges Iran's automotive sector is deeply enmeshed with the country's Revolutionary Guard and serves as a \"lucrative cash cow\" for the regime, despite sustaining annual losses over $1 billion.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 12:07 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mattel attracts takeover interest from Authentic Brands Group, WSJ reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "02 Oct 2026, 12:06 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Have 5 mutual funds in your portfolio? Should you invest \u20b910,000 bonus in one scheme or split it \u2014 what experts suggest", "full_content": "Suppose you already have 5 mutual funds in your portfolio across equity, debt, hybrid, gold, etc. You receive a \u20b9 10,000 bonus from your employer and want to invest the money in these mutual fund holdings.\n\nShould you add it to all five funds or put it into just one or two? Here is what experts suggest investors should consider before putting a small lump sum to work.\n\nAditya Agarwal, Co-founder, Wealthy.in said the number of funds matters less than the portfolio\u2019s current asset allocation. \u201cThe right question is not \u2018how should I split this?\u2019 but \u2018which part of my portfolio is short of its target?\u2019\u201d\n\nIf an investor has a target mix\u2014for example, a specific allocation to equity, debt and gold\u2014the bonus can go towards the asset class that is furthest below its target. Splitting \u20b9 2,000 into each of five funds sounds balanced, but it simply repeats the current mix, including whatever imbalance already exists, Agarwal said.\n\nPutting the whole amount into one fund is perfectly fine when one gap is clearly larger than the others. Spreading it over two or three makes sense when a couple of asset classes are underweight, he added.\n\nManish P. Hingar, Founder and chief executive officer of Fintoo, said, \u201cDon\u2019t spread \u20b9 10,000 across all five funds. \u20b9 2,000 each makes very little difference. Look at your overall portfolio mix instead. Say your plan is 60% equity, and you currently sit at 52%; the bonus goes to equity. Put it into the one or two funds that are below their planned share. Let your asset allocation decide where the money goes, not your favourite fund.\u201d\n\nA fund falling in value alone is not a reason to add more money to it. Investors should first understand why it has underperformed.\n\n\u201cIf the whole market is down, adding money does lower your average cost. But if the fund has trailed similar funds for two to three years, the fund itself is the problem, and putting more money into it won\u2019t fix that,\u201d Hingar said.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 12:05 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "CNBC AI Forum live updates: Enterprise AI in Dallas", "full_content": "The CNBC AI Forum brings business leaders, entrepreneurs and researchers to Dallas on Oct. 1, 2026, for live conversations about how artificial intelligence is reshaping companies, workers and customers.\n\nCNBC's AI Forum will focus on the practical challenge of moving from experimentation to enterprise-scale deployment, along with the risks posed by autonomous agents, cybersecurity threats, the data center buildout and uneven regulation. Follow this live blog for updates, key quotes and takeaways from sessions on AI infrastructure, governance, financial services and the global race for technological leadership.\n\nCNBC is hosting its second annual AI Forum today in Dallas, Texas \u2014 highlighting that Dallas has become a hub for enterprise-minded AI development.\n\nDallas now boasts one of the country's largest tech workforces, driven by local universities' focus on expanding AI and engineering programs and by Texas's lower cost of living, which has been drawing talent away from Silicon Valley. Meanwhile, key industries, from telecom to healthcare to financial services, are embedding AI into existing infrastructure in Dallas or setting down new roots to build AI systems that can solve real-world problems for their customers.\n\nIn addition to OpenAI's Bret Taylor and Wells Fargo's Saul Van Beurden, CNBC has convened several executives, thought leaders, entrepreneurs, and researchers to talk about the wide-ranging impact of AI.\n\nOpenAI Chairman Bret Taylor is one of the most anticipated speakers at the CNBC AI Forum in Dallas.\n\nTaylor, the co-founder of AI startup Sierra , will be joined on stage by Saul Van Beurden, Wells Fargo co-CEO of consumer banking & head of AI, for a conversation with CNBC's Julia Boorstin about how organizations can scale AI to create value.\n\nIt's been a big week for OpenAI: the company held its annual DevDay developer conference Tuesday, where the AI company unveiled a number of new products and developer tools.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 12:03 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Global Bond Selloff Resumes; Yields Remain at Highs \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Global Bond Selloff Resumes; Yields Remain at Highs \u2014 Live Updates WSJ 10-year Treasury yield climbs to a 24-year high amid relentless global bond sell-off CNBC More swings for bond yields rattle financial markets worldwide PBS Stocks Fall After Manufacturing Data as Oil Climbs: Markets Wrap Bloomberg.com Global bond rout deepens, pushes US Treasury yields to 24-year peak Reuters", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 11:59 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Brent oil jumps more than 4% as U.S. reportedly sends third aircraft carrier to Middle East", "full_content": "Oil prices rose sharply Thursday, following a report the U.S. is sending a third aircraft-carrier strike group to the Middle East.\n\nBrent crude , the international benchmark, was last seen trading about 4.6% higher at $102.55 per barrel, while U.S. West Texas Intermediate futures rose about 3% to $93.24.\n\nU.S. officials told The Wall Street Journal that Marine Corps ships and up to 10,000 additional troops are also being deployed to the region. The forces are expected to arrive by the end of November, the officials said.\n\nThe USS Theodore Roosevelt left San Diego on a scheduled deployment Sunday, The Journal reported. The USS George H.W. Bush and USS George Washington are currently in the Middle East.\n\nMeanwhile, China's state oil major PetroChina canceled a handful of gasoline and jet fuel shipments that were planned for October, unnamed sources told Reuters, as Beijing looks to safeguard domestic supplies. CNBC could not independently verify the report.\n\nGlobal energy markets have been grappling with supply disruptions from the U.S.-Iran war in the Middle East and Russia's full-scale invasion of Ukraine.\n\nbrent UOB in a note Thursday said that crude flows from Middle East were reportedly nearing pre-war levels, but fuel supplies, particularly gasoline, were lagging behind.\n\nWorries over crude supply disruptions have eased following the resumption of oil tanker \u200bloadings by Saudi Arabia from its Red Sea port of Yanbu after the kingdom restarted operations on its East-West Pipeline.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 11:53 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "50% of Nifty stocks slip into bear territory, down up to 40% - What should investors do now? Experts view", "full_content": "More than 20 Nifty 50 constituents are now trading over 20% below their recent highs, as multiple challenges on Dalal Street prompt investors to shy away from riskier assets.\n\nCrude oil prices have been a focal point for markets since late February, when the US and Israel launched joint strikes on Iran, triggering a war in the Middle East.\n\nHigher energy prices caused global bond yields to spike to levels not seen in two decades, as investors started demanding higher compensation amid growing inflationary risks and widening government deficits.\n\nBack home, the falling rupee, persistent selling by overseas investors, and challenges in the rural economy have added more pressure, turning domestic equities into one of the worst performers among their Asian peers in 2026.\n\nThe sell-off spared no sector, with tech stocks continuing to bleed heavily, while bellwethers hovered near their Covid-era lows. FMCG, auto, and financial stocks were also severely hit in the sell-off.\n\nNifty 50 plunged 6% in September, taking its 2026 decline to 14.2% and positioning it for its biggest annual decline since 2011, when it crashed 24.62%.\n\nAccording to Trendlyne data, 25 constituents in the index are now trading 20% to 40% below their recent highs. On Dalal Street, corrections are defined as losses of 10%, while bear markets are marked by drawdowns of 20% or more.\n\nInfosys topped the chart as the tech major dropped 40% from its 52-week high of \u20b9 1,728, marking one of the biggest reversals in recent times. ITC is also facing difficulties in attracting bulls, as the stock crashed by a similar 40% from its October 2025 high of \u20b9 426.40.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:47 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "This silent alarm in the bond market tells you which stocks to buy and which to avoid", "full_content": "Widening credit spreads send an important signal that investors should heed about which stocks to buy and which to avoid", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 11:40 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Former LinkedIn chief Roslansky to leave Microsoft, following other exec departures", "full_content": "Microsoft executive Ryan Roslansky, who led the software company's LinkedIn subsidiary for six years, will leave at the end of 2026. Satya Nadella, Microsoft's CEO, announced the departure in a Thursday memo.\n\n\"Ryan leaves the organization in a strong position,\" Nadella wrote in his message to employees .\n\nAlongside other technology heavyweights, Redmond, Washington-based Microsoft has been trying to evolve and take advantage of the rise of generative artificial intelligence . Gaming head Phil Spencer and Office leader Rajesh Jha both left this year, and Charlie Bell, the company's head of security, became an individual contributor.\n\nRoslansky joined LinkedIn as product chief in 2009, when it was still private. Previously, he had held management roles at Yahoo and Glam Media. Microsoft acquired LinkedIn for $27 billion in 2016. In 2020, Roslansky replaced Jeff Weiner as LinkedIn CEO. During Roslansky's tenure, LinkedIn's membership expanded from 700 million to 1.3 billion.\n\nIn 2025, Roslansky took on additional responsibility in Microsoft's Office productivity software group. Earlier this year, Nadella named Roslansky and two other executives as leaders of the Microsoft 365 applications and the Copilot artificial intelligence platform, and Dan Shapero , LinkedIn's chief operating officer, became the professional social network's CEO.\n\nNadella noted Roslansky's contributions to the unified Copilot app , which Microsoft announced last week.\n\n\"With Copilot, we are executing rapidly against our vision to build a new OS for work that spans every model, every form factor, and every task, with Office fully embedded in Copilot and vice versa! Over the past year, Ryan's team has done critical work bringing together the product, engineering, and design foundations that have made this next phase possible.\"\n\nIn July, Microsoft disclosed that LinkedIn revenue growth for the June fiscal year sped up to 11% from less than 9% a year earlier.", "source": "CNBC World Economy", "pub_date_str": "01 Oct 2026, 11:31 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gen Z is trading stocks, investing in MFs using AI\u2014but can it replace human judgement? Experts explain", "full_content": "Artificial intelligence is emerging as a powerful research tool for Gen Z investors looking to invest in stocks, mutual funds and systematic investment plans (SIPs). However, experts caution that AI should complement\u2014not replace\u2014investor judgement, discipline and sound financial planning.\n\nOne Gen Z investor, for instance, used an AI tool to analyse his portfolio. Although he already owned a Flexi Cap Fund, the tool recommended another fund in the same category without adequately accounting for portfolio overlap.\n\nThis highlights some of the risks young investors need to consider when using AI for investment decisions.\n\nAmitha A. Jayan, Wealth Manager at Scripbox, said: \u201cAI summarises vast information, but fund NAVs, expense ratios, or financial metrics can occasionally be outdated. Double-check details on official platforms before committing. AI outputs are naturally generic. Every choice must match your specific risk capacity, tax bracket, time horizon, and short-term liquidity needs.\u201d\n\n\u201cAlgorithms tracking online sentiment can lean toward volatile or viral assets. True wealth creation comes from patient, long-term asset allocation,\u201d Jayan added.\n\nAI can process large volumes of information quickly, but investors still need to assess whether the information is relevant to their own financial circumstances.\n\nAshwiinii Deshpande (NFP Member), Director at Hitachintak Investservices, said: \u201cAI can calculate, but experience decides which variables and weights are appropriate. It can also miss information we never provide.\u201d\n\nAn investor may have a stable income today, but an unexpected financial emergency or future family responsibilities could significantly change their investment requirements. Such factors need to be considered when deciding the appropriate asset allocation.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:27 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzi
