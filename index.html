    const allData = {"general": [{"title": "Prop Shops Pull Back From NSE\u2019s $2 Trillion Derivatives Market", "full_content": "Proprietary traders\u2019 share of equity derivatives turnover has fallen to the lowest level in almost four years at the National Stock Exchange of India Ltd., as problems with the closing auction mechanism add to an increasingly restrictive trading environment.\n\nTheir share fell to 54.7% of the 193 trillion rupees in notional daily futures and options turnover in August, the lowest level since December 2022, according to bourse data. The proportion was about 62% in November 2024, just as the market regulator introduced sweeping curbs to check speculative trading.\n\nThe closing auction system has struggled to attract enough players since its launch on Aug. 3. The resulting thin liquidity has amplified price swings in both cash equities and derivative contracts, weighing on activity of professional trading desks. The 20-minute window and the single-price mechanism have also limited opportunities for market-making and arbitrage. The disruption comes on top of new curbs on bank funding for proprietary trading that took effect in July.\n\n\u201cThe days of prop desks dominating NSE options turnover are behind us,\u201d said Hariselvan Radhakrishnan, chief executive officer of research firm HST Wealth. Regulatory limits on weekly contracts, tighter central bank rules on leverage and greater regulatory scrutiny, have made high-turnover strategies more expensive to run in India, he said.\n\nThe retreat is also showing up in cash equities, where proprietary traders have lost ground to individual investors. Their share of turnover fell 172 basis points month-on-month in August, while retail investors\u2019 share rose 53 basis points to 33.5%, according to exchange data.\n\nFor high-frequency firms that rely on turnover, tight spreads and rapid position adjustments, changes to auction mechanics, order-cancellation rules and settlement can affect the profitability of individual strategies.\n\nThe closing auction rules may change again. The Securities and Exchange Board of India on Sept.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 06:52 AM IST", "pub_date_relative": "12m ago"}, {"title": "Sensex, Nifty prediction today: How Asian markets, crude will impact Indian markets? GIFT Nifty, KOSPI, Taiwan signals", "full_content": "Stock market prediction on Tuesday, 22 September, 2026 : The Indian stock market is likely start on a positive note, with Gift Nifty indicating a gap-up opening on Tuesday, 22 September.\n\nAsian markets opened on a higher note on Tuesday, while US stock futures ended in green, mostly reversing last week's losses on Monday.\n\nBenchmark indices ended higher on Monday, with the Sensex gaining 564 points and the Nifty extending its winning streak to four sessions. The rally was supported by easing crude oil prices, renewed foreign fund inflows and gains across global equity markets.\n\nThe 30-share BSE Sensex advanced 564.03 points, or 0.76%, to close at 74,858.99, its highest level in more than a week. During the session, the index climbed as much as 692.44 points, or 0.93%, to hit an intraday high of 74,987.40.\n\nThe 50-share NSE Nifty also rose for the fourth straight session, ending 67.90 points, or 0.29%, higher at 23,414.30.\n\n\u201cBenchmark indices opened flat and gradually moved into positive territory, extending their rebound for the fourth consecutive session as markets started the week on a positive note. However, market breadth remained weak despite the gains, while India VIX declined. Brent crude oil prices continued to remain above $100, keeping investor concerns elevated and limiting the overall market momentum ,\u201d said Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking.\n\nGift Nifty was trading around the 23,521.50 level, up nearly 75.20 points from the Nifty futures\u2019 previous close, indicating a positive start for the Indian st  data. The proportion was about 62% in November 2024, just as the market regulator introduced sweeping curbs to check speculative trading.\n\nThe closing auction system has struggled to attract enough players since its launch on Aug. 3. The resulting thin liquidity has amplified price swings in both cash equities and derivative contracts, weighing on activity of professional trading desks. The 20-minute window and the single-price mechanism have also limited opportunities for market-making and arbitrage. The disruption comes on top of new curbs on bank funding for proprietary trading that took effect in July.\n\n\u201cThe days of prop desks dominating NSE options turnover are behind us,\u201d said Hariselvan Radhakrishnan, chief executive officer of research firm HST Wealth. Regulatory limits on weekly contracts, tighter central bank rules on leverage and greater regulatory scrutiny, have made high-turnover strategies more expensive to run in India, he said.\n\nThe retreat is also showing up in cash equities, where proprietary traders have lost ground to individual investors. Their share of turnover fell 172 basis points month-on-month in August, while retail investors\u2019 share rose 53 basis points to 33.5%, according to exchange data.\n\nFor high-frequency firms that rely on turnover, tight spreads and rapid position adjustments, changes to auction mechanics, order-cancellation rules and settlement can affect the profitability of individual strategies.\n\nThe closing auction rules may change again. The Securities and Exchange Board of India on Sept.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 06:52 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sensex, Nifty prediction today: How Asian markets, crude will impact Indian markets? GIFT Nifty, KOSPI, Taiwan signals", "full_content": "Stock market prediction on Tuesday, 22 September, 2026 : The Indian stock market is likely start on a positive note, with Gift Nifty indicating a gap-up opening on Tuesday, 22 September.\n\nAsian markets opened on a higher note on Tuesday, while US stock futures ended in green, mostly reversing last week's losses on Monday.\n\nBenchmark indices ended higher on Monday, with the Sensex gaining 564 points and the Nifty extending its winning streak to four sessions. The rally was supported by easing crude oil prices, renewed foreign fund inflows and gains across global equity markets.\n\nThe 30-share BSE Sensex advanced 564.03 points, or 0.76%, to close at 74,858.99, its highest level in more than a week. During the session, the index climbed as much as 692.44 points, or 0.93%, to hit an intraday high of 74,987.40.\n\nThe 50-share NSE Nifty also rose for the fourth straight session, ending 67.90 points, or 0.29%, higher at 23,414.30.\n\n\u201cBenchmark indices opened flat and gradually moved into positive territory, extending their rebound for the fourth consecutive session as markets started the week on a positive note. However, market breadth remained weak despite the gains, while India VIX declined. Brent crude oil prices continued to remain above $100, keeping investor concerns elevated and limiting the overall market momentum ,\u201d said Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking.\n\nGift Nifty was trading around the 23,521.50 level, up nearly 75.20 points from the Nifty futures\u2019 previous close, indicating a positive start for the Indian stock market indices.\n\nSensex closed at 74,858.99, gaining 564.03 points (+0.76%). After opening at 74,535.18, the index touched a high of 74,987.40 and a low of 74,454.18. The benchmark maintained a positive tone throughout the session and gradually extended its gains, ending close to the 75,000 mark.", "source": al rate rises may be needed to achieve the central bank\u2019s inflation goal, which hasn\u2019t been met in more than five years.\n\nGold is \u201cholding extremely strong\u201d following the rate-hike with hawkish outlook, with falling energy prices offering support, Ryan McKay, an analyst at TD Securities, wrote in a note. \u201cDespite a hiking cycle being priced in, the broader precious metals landscape remains extremely favorable,\u201d with near-term weakness \u201cincreasingly seen as a buying opportunity,\u201d he dded.\n\nConfidence in the long-term outlook for the metal has also prompted some dip-buying in recent weeks.", "source": "LiveMint Markets", "pub_date_str": "22 Sep 2026, 06:41 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Binance faces U.S. probe over potential Iran sanctions violations- Bloomberg", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:32 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Paramount wins Warner Bros takeover after settling states, union lawsuits", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Sep 2026, 06:31 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Varmora Granito raises Rs 212 crore from anchor investors ahead of Rs 708 crore IPO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Varmora Granito raises Rs 212 crore  "22 Sep 2026, 07:04 AM IST", "total_stories": 378};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
