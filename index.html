l_content": "Coforge share price rose nearly 2% in early trade after Akhil Gupta was appointed Chairperson and Non-Executive Independent Director for five years.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "Varmora Granito Lists at 4.7% Premium on NSE Debut", "full_content": "Varmora Granito Ltd. debuted on the stock market with a 4.73% premium on NSE and 2.70% on BSE over its IPO price.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold prices dip Rs 4,300/10g in 2 days; silver falls Rs 8,800/kg as traders expect US Fed to hike rates again. Buy, sell or hold?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Gold prices dip Rs 4,300/10g in 2 days; silver falls Rs 8,800/kg as traders expect US Fed to hike rates again. Buy, sell or hold? The Economic Times daily newspaper is available online now. Read Today's Paper Gold prices dip Rs 4,300/10g in 2 days; silver falls Rs 8,800/kg as traders expect US Fed to hike rates again. Buy, sell or hold? SECTIONS Gold prices dip Rs 4,300/10g in 2 days; silver falls Rs 8,800/kg as traders expect US Fed to hike rates again. Buy, sell or hold? By Veer Sharma , ETMarkets.com Last Updated: Sep 29, 2026, 09:59:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold and silver prices extended losses on MCX as higher oil prices fuelled inflation concerns and raised expectations of further Fed rate hikes. Analysts expect near-term pressure on precious metals, while investors await clarity on US-Iran peace talks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 09:59 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "CNN, MS NOW, Politico ask judge to extend block on White House ban", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 11:18 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Block deal alert: Honasa Consumer shares tumble 5% after equity worth \u20b9643 crore changes hands - Should investors buy?", "full_content": "Shares of Honasa Consumer Ltd., the parent company of brands including Mamaearth, came under pressure on Tuesday, September 29, after a sizeable block transaction was executed shortly after the market opened. The deal involved around 1.4 crore shares, equivalent to 4.4% of the company's outstanding equity, putting the stock firmly in focus during the trading session.\n\nThe shares were exchanged at an average price of \u20b9 450 apiece, taking the aggregate transaction value to around \u20b9 643.4 crore. The deal price represented a discount of approximately 3.4% to Honasa Consumer's previous closing price.\n\nFollowing the transaction, the Honasa stock declined as much as 4.8% to touch an intraday low of \u20b9 443.70 per share on the BSE. Honasa Consumer was also among the most actively traded counters across the BSE and NSE during the session.\n\nThe identities of the official buyers and sellers involved in Tuesday's transaction were not immediately available.\n\nThe block deal was significantly larger than the transaction size indicated in earlier media reports. Those reports had suggested that Peak XV Partners Investments VI, Sequoia Capital Global Growth Fund III - US/India Annex Fund and Redwood Trust were looking to sell up to 2.73% of their combined existing outstanding equity in Honasa Consumer through block deals for as much as \u20b9 400 crore.\n\nThe reported floor price for that proposed transaction was \u20b9 450 per share, which would have represented a discount of up to 3.4% to the prevailing market price. The sellers were also expected to be subject to a 45-day lock-in period for any further sale of shares after the transaction.\n\nHowever, Tuesday's actual block deal involved around 4.4% of Honasa Consumer's equity, with shares worth \u20b9 643.4 crore changing hands. Jefferies acted as the sole bookrunner for the transaction.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:15 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "FM Nirmala Sitharaman pushes investment, economic ties with Saudi Arabia, Switzerland, Jordan at AIIB meet", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a FM Nirmala Sitharaman pushes investment, economic ties with Saudi Arabia, Switzerland, Jordan at AIIB meet The Economic Times daily newspaper is available online now. Read Today's Paper FM Nirmala Sitharaman pushes investment, economic ties with Saudi Arabia, Switzerland, Jordan at AIIB meet SECTIONS FM Nirmala Sitharaman pushes investment, economic ties with Saudi Arabia, Switzerland, Jordan at AIIB meet ANI Last Updated: Sep 29, 2026, 11:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Finance Minister Nirmala Sitharaman engaged in meetings in Doha to enhance economic ties with Saudi Arabia, Switzerland, and Jordan. Discussions included the India-Saudi Arabia Bilateral Investment Treaty and opportunities for Swiss investments in India's infrastructure sector. The focus also extended to food security and trade with Jordan, aiming to boost bilateral trade by 2030. Additionally, talks centered on post-flood reconstruction efforts with Nepal and potential Indian support.\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nCan Fly91\u2019s flightpath for India\u2019s smallest airline defy the doomy past?\n\nSmugglonomics: Geckos, dry dates, human hair \u2013 what makes something worth smuggling?\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "29 Sep 2026, 11:12 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Axiscades Tech share price locked in 10% upper circuit | What\u2019s driving the stock and what lies ahead?", "full_content": "Axiscades Technologies share price hit the 10% upper circuit on Tuesday, 29 September, after a large transaction was reported in the block deal window. According to media reports, this marks the biggest single-day gain for the stock since 1 July 2024.\n\nAround 40.61 lakh shares, representing 9.5% of Axiscades Technologies\u2019 equity, changed hands in the block deal, according to data available on the exchanges. The shares were reportedly transacted at an average price of \u20b9 1,824 apiece, taking the total deal value to around \u20b9 741 crore. The identities of the buyers and sellers were not immediately known.\n\nAt the end of the June quarter, Jupiter Capital Pvt. Ltd., the promoter of Axiscades Technologies, held a 58.04% stake in the company, while public shareholders owned 41.97%.\n\nAmong public shareholders, mutual funds held 1.45%, while more than 43,000 retail investors with authorised share capital of up to \u20b9 2 lakh collectively held a 20.67% stake. Bodies corporate held another 6.36% stake as of the end of the June quarter.\n\nThe block deal comes a month after Axiscades Technologies said it was evaluating the acquisition of a 90% stake in Cloud Wave for around \u20b9 254 crore. The company also plans to acquire the remaining 10% stake, according to its announcement, as reported.\n\nConsolidated revenue from operations, including continuing and discontinued operations, reached a quarterly record of \u20b9 346.7 crore in Q1 FY27, registering a 42.2% year-on-year increase and 27% sequential growth.\n\nRevenue from continuing operations stood at \u20b9 183.4 crore. On a like-for-like basis, excluding Add Solutions, which the management plans to exit in FY27, revenue was around \u20b9 181 crore, nearly doubling from approximately \u20b9 90 crore in Q1 FY26.\n\nHowever, reported profitability remained under pressure. EBITDA stood at \u20b9 27.9 crore, with an EBITDA margin of 8.1%, compared with \u20b9 34.1 crore and a 14% margin in Q1 FY26.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:03 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: China stocks edge up as policy support pledge lifts property shares", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China stocks edge up as policy support pledge lifts property shares Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China stocks edge up as policy support pledge lifts property shares SECTIONS Global Market: China stocks edge up as policy support pledge lifts property shares By Anupam Nagar , ETMarkets.com Last Updated: Sep 29, 2026, 11:02:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chinese mainland stocks edged higher as Beijing pledged stronger policy support to ease economic pressures, while Hong Kong shares fell. Property stocks gained after fresh measures to stabilise the housing market, while thin holiday trading and elevated bond yields capped sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 11:02 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ellenbarrie Industrial Gases shares rise 5% after securing Rs 481 crore order from BHEL", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ellenbarrie Industrial Gases shares rise 5% after securing Rs 481 crore order from BHEL Ellenbarrie Industrial Gases Share Price Linde India Share Price Refex Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ellenbarrie Industrial Gases shares rise 5% after securing Rs 481 crore order from BHEL SECTIONS Ellenbarrie Industrial Gases shares rise 5% after securing Rs 481 crore order from BHEL By Ritesh Presswala , ETMarkets.com Last Updated: Sep 29, 2026, 10:59:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ellenbarrie Industrial Gases shares rallied 5.10% after the company secured a Rs 481-crore contract from BHEL to build a 1,200 TPD cryogenic Air Separation Unit for its Coal to Ammonium Nitrate Project. The turnkey project will be executed over eight quarters and is expected to be commissioned in FY29, expanding Ellenbarrie\u2019s presence in India\u2019s coal gasification ecosystem.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 10:59 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Rising bond yields put the brakes on stocks", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 10:55 AM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Stock market crash: Why Sensex crashed 1800 points, Nifty lost 550 points in 2 days? Top 5 reasons", "full_content": "Stock market crash: The key benchmark indices of the Indian stock market extended their losing streak for the second straight session on Tuesday. The Nifty 50 index opened lower at 22,732 and touched an intraday low of 22.569 within a few minutes of the Opening Bell. While hitting this intraday low, the 50-stock index lost around 571 points in the last two straight sessions.\n\nThe BSE Sensex today opened lower at 72,633 and touched an intraday low of 72,064, logging more than 1800 points loss in two straight sessions. Likewise, the Bank Nifty index opened on the lower side at 54,283 and hit an intraday low of 53,785, clocking around 1800 points loss in two successive sessions.\n\nAccording to stock market experts, rising bond yields across the world, crude oil prices remaining elevated, buzz about a weak earnings season, a weak Indian Rupee, and buzz about the fast-approaching high-interest regime.\n\nPointing towards the money shift angle, Avinash Gorakshkar, Founder of Avinash Mentor Research, said, \u201cIt's not that only the US bond yield is soaring. It is soaring globally. The US 10-year bond yield has crossed 5%, the highest since 2007. Likewise, the Japanese 10-year bond yield is at a 1996 high, and the French 10-year bond yield is at its highest since 2008.\u201d\n\nGorakshkar said that investors are shifting their money from equities and other assets to bonds, as they offer better returns.\n\nPointing towards the side effect of crude oil price rise post-US-Iran war, Amit Goel, Chief Global Strategist at PACE 360, said, \u201cCrude oil prices sustaining at the elevated levels have renewed the fear of inflation, which is expected to put pressure on the Indian government, as they import around 85% of the domestic demand for crude oil.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 10:53 AM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Orient Cables IPO Day 3: GMP at 27%; subscription crosses 8 times. key details inside", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Orient Cables IPO Day 3: GMP at 27%; subscription crosses 8 times. key details inside JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Orient Cables IPO Day 3: GMP at 27%; subscription crosses 8 times. key details inside SECTIONS Orient Cables IPO Day 3: GMP at 27%; subscription crosses 8 times. key details inside By Ritesh Presswala , ETMarkets.com Last Updated: Sep 29, 2026, 10:49:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Rs 552-crore Orient Cables IPO entered its final day of bidding on September 29 amid strong investor demand. In the grey market, the IPO was commanding a 27% premium over its issue price. The book-built issue comprises a fresh issue of 1.18 crore shares worth Rs 320 crore and an OFS of 85.29 lakh shares worth Rs 232 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 10:49 AM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Vedanta Iron, Vedanta Oil and Gas to Vedanta Power: All Vedanta Group stocks in red- Opportunity for bottom fishing?", "full_content": "Shares of all Vedanta Group stocks including Vedanta Limited, Vedanta Iron and Steel, Vedanta Oil and Gas, Vedanta Power, Hindustan Zinc, Vedanta Aluminium, etc were trading under pressure during the early hours of the Tuesday\u2019s trading session.\n\nThe recent decline in the Vedanta Group stocks has come as nearly all six of them continued to decline over the last one month. Out of all of them, Vedanta Iron & Steel has declined nearly 17.65% over the past one month.\n\nVedanta Limited share price opened lower on Tuesday and saw mild recovery during the day. Vedanta share price was trading marginally lower at \u20b9 258.10 per share on BSE with a market capitalisation of \u20b9 1,00,927.12 crore at 10 am on Tuesday. The stock has delivered a negative 10% return in one month. Its share price value has surged 19% in 2026 so far and around 58% in one year.\n\n\"The broader trend remains weak below key moving averages. RSI at 42.1 has recovered. Support is \u20b9 250, with major resistance at \u20b9 270,\" explained Virat Jagad Sr. Technical Research Analyst at Bonanza.\n\nVedanta Iron and Steel stock opened lower today but saw some recovery in the next thirty minutes. The metal stock was trading marginally higher at \u20b9 31.48 per share on BSE with an MCap of \u20b9 5,321.45 crore at 10 am on Tuesday. Its share price value has declined 18.48% in one month and around 3% in three months.\n\n\"The broader trend remains bearish, but the stock is attempting to form a base around \u20b9 30\u201331. RSI at 42.7 indicates some momentum recovery. Resistance is \u20b9 33\u201333.5; a sustained move above \u20b9 33.5 could strengthen the recovery,\" noted the expert.\n\nVedanta Aluminium Metal stock dipped to an intraday low of \u20b9 416.75 per share on BSE on Tuesday. The stock staged some recovery and was up 0.05% at \u20b9 419.85 per share at 10:10 am. Vedanta Aluminium Metal\u2019s stock value has declined 8% in one month and around 7.24% in three months.\n\n\"Price remains below both moving averages, keeping the trend weak.RSI at 43.4 has recovered.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 10:44 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "From TCS, Titan to Tata Tele - Tata Group stocks fall as Trusts plans move to prevent holdco listing | Details here", "full_content": "Most Tata Group stocks suffered losses in morning trade on Tuesday, 29 September, after reports emerged that Tata Trusts has proposed a restructuring that would merge two of its operating companies with the Group's holding company (holdco), Tata Sons , in a bid to sidestep its regulatory classification as a core investment company (CIC), to avoid the requirement of a stock market listing.\n\nGroup stocks such as Tata Teleservices, Tata Motors PV, Titan, TCS, Tata Chemicals, Tata Power, Tata Steel, and Tata Tech plunged up to 5% during the morning session.\n\nStocks such as Tata Capital, Tata Consumer, Tata Elxsi, Tata Investment, Trent, and Voltas also declined significantly.\n\nTata Trusts, the largest stakeholder of Tata Sons, has proposed the merger of Tata Electronics Systems Solutions (TESS) and Tata Consulting Engineers (TCE) with Tata Sons.\n\nTata Trusts has asked the holding company's board to consider the plan and seek a prior no-objection certificate (NOC) from the RBI, as per a PTI report.\n\nThe merger will help the company avoid being classified as either a CIC or a non-banking financial company (NBFC), according to the philanthropic entities, since the merged entity will have net assets of \u20b9 2,00,158 crore, while its investments in group companies will amount to \u20b9 1,77,120 crore -less than 90% of its total net assets.\n\nThe Reserve Bank of India (RBI) considers Tata Sons as an upper-layer non-banking financial company (NBFC) and a core investment company (CIC).\n\nThe RBI classifies companies with more than 50% of their income from financial assets as NBFCs. Further, it defines a CIC as an NBFC that has at least 90% of its assets invested in shares, bonds, or loans within group firms.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 10:43 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "China has three new criteria for humanoid robot IPOs. Few, if any, meet them", "full_content": "BEIJING \u2014 China's securities regulator is raising the bar for public listings of humanoid robot startups, according to three sources familiar with the CSRC's thinking.\n\nIt's a sign of how one of the hottest sectors of the market is cooling, as investors globally assess whether artificial intelligence stocks are in a bubble .\n\nThe Chinese regulator wants local \"embodied AI\" startups seeking to go public to meet three specific criteria, according to the sources, who requested anonymity due to the sensitivity of the situation.\n\nEven if a startup only has to meet two of the three criteria, as one source indicated, it's unclear which, if any, of the companies can do so.\n\nThat's lowered expectations to just a handful, or none, of these startups making it to public markets, the sources said.\n\nAt least two dozen humanoid-related embodied AI companies have filed to list in Hong Kong alone, according to two of the sources. Hong Kong in May 2025 started letting tech companies file confidentially for IPOs.\n\nThe Hong Kong stock exchange and China Securities Regulatory Commission did not immediately respond to a request for comment. Mainland China companies wanting to list in Hong Kong also need the CSRC's blessing.\n\nScrutiny on China's growing number of humanoid robot startups and their fast-growing valuations \u2014 supported by a mix of government and private sector funds \u2014 has grown over the last several weeks.", "source": "CNBC Finance", "pub_date_str": "29 Sep 2026, 10:43 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "PB Fintech shares suffer Rs 37,000 crore shock in 4 days but Jefferies, Bernstein see up to 100% upside", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a PB Fintech shares suffer Rs 37,000 crore shock in 4 days but Jefferies, Bernstein see up to 100% upside PB Fintech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper PB Fintech shares suffer Rs 37,000 crore shock in 4 days but Jefferies, Bernstein see up to 100% upside SECTIONS PB Fintech shares suffer Rs 37,000 crore shock in 4 days but Jefferies, Bernstein see up to 100% upside By Veer Sharma , ETMarkets.com Last Updated: Sep 29, 2026, 10:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis PB Fintech shares have plunged 42% in four sessions, wiping out Rs 37,000 crore in market value after IRDAI proposed reforms targeting insurance distribution and dark patterns. While Jefferies cut its target to Rs 1,540, Bernstein retained an Outperform rating with a Rs 2,310 target, implying 100% upside.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 10:42 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India readies $25 billion for Deep Tech investment as U.S. and China race ahead", "full_content": "India is preparing to deploy $25 billion to support Deep Tech start-ups in the country, as it tries to catch up with the U.S. and China in the global tech race to cut its reliance on frontier foreign technology.\n\nIn the last decade, India invested $11.6 billion in Deep Tech , Rajat Tandon, president of the Indian Venture and Alternative Capital Association, told CNBC.\n\nBut now, the government alone has committed to invest $11 billion under the Research Development Infrastructure Fund, which will be matched by venture capital and private equity fund managers, he said.\n\nThree or four billion more will be added, making \"$25 billion available to be spent on Deep-Tech investments,\" Tandon said.\n\nDeep Tech is a broad term used for start-ups in artificial intelligence, semiconductors, advanced manufacturing, drones and space tech. Experts told CNBC that the funding push comes as the government has realized that frontier tech is becoming \"very critical\" amid rising geopolitical tensions.\n\nChina and the U.S. currently lead the global AI race, and while Chinese tech is seen with suspicion in India , Washington's curbs on tech exports make it unreliable.\n\n\"Tariffs from the U.S. actually help this [Deep Tech] segment a lot,\" Anandamoy Roychowdhury, managing director of Crane Venture Partners, said, adding that India will develop local Deep Tech companies as it fears that \"important technology can get cut off at any point.\"\n\nSome of these fears were realized earlier in June when Anthropic disabled access to its new models \u2014 Fable 5 and Mythos 5 \u2014 for foreign nationals, complying with an export-control directive from the U.S. government.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 10:42 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How hybrid long-short SIFs differ in their strategies", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSpecialized investment funds (SIFs), a new category launched by the Securities and Exchange Board of India (Sebi), are designed to allow investors to gain exposure to long-short strategies, which are not available in the mutual fund space. The minimum investment is \u20b9 10 lakh.\n\nOf the 33 SIFs launched to date, 11 are hybrid long-short funds, which must invest at least 25% each in equity and equity-related instruments and debt, and can take short positions of up to 25% of net assets. They managed over \u20b9 19,000 crore of investor assets, about 63% of the total SIF assets under management (AUM) as of 31 August 2026, according to data from SIF360.com.\n\nEdelweiss\u2019s Altiva Hybrid Long-Short Fund is aimed at investors seeking slightly better returns than arbitrage funds. It would employ a mix of equity arbitrage, debt, special situations and derivative strategies.\n\n\u201cSpecial situations are corporate events, such as mergers, demergers and initial public offerings ( IPOs ), that can create short-term price gaps a fund can capture. A common derivative strategy is the covered call: the fund holds a stock and sells a call option on it, earning a premium in return for giving up gains above a set price,\u201d said Jain.\n\n\u201cBandhan AMC\u2019s Arudha Hybrid Long-Short Fund invests 60-65% in debt, mostly AAA-rated or government securities with a duration of one to four years, with about 10% in AA and AA+ rated securities,\u201d said Basu.\n\nThe remaining 35-40% goes into arbitrage, so the fund carries no directional equity exposure. Directional equity exposure means the fund is betting on the market rising or falling, rather than locking in a price difference as it does in arbitrage.\n\nHSBC Asset Management (India) Pvt. Ltd\u2019s RedHex Hybrid Long-Short Fund also leans on debt, along with arbitrage. But the fund also looks at credit opportunities, along with arbitrage and other strategies.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 10:40 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Adani stocks today: Adani Power, Adani Energy, Adani Enterprises slip after \u20b91.48 crore SEBI settlement", "full_content": "Shares of several Adani Group companies declined on Tuesday, September 29, after the Securities and Exchange Board of India (SEBI) settled proceedings concerning alleged violations of minimum public shareholding (MPS) norms involving four listed group companies and their directors.\n\nThe development put Adani Power, Adani Ports, Adani Enterprises and Adani Energy Solutions in focus during the trading session. Most Adani Group stocks also declined in trade today, except 1 - Adani Ports.\n\nAdani Power was the top dragger, with its shares declining 1.3% to \u20b9 193.75; meanwhile, Adani Total Gas fell 1.1% to \u20b9 588.00.\n\nAdani Green Energy also slipped 1.1% to \u20b9 1,224.00, while Adani Enterprises declined 0.8% to \u20b9 2,803.55.\n\nAdani Energy Solutions , formerly known as Adani Transmission, was down 0.7% at \u20b9 1,277.45. In contrast, Adani Ports and Special Economic Zone (APSEZ) gained 0.6%.\n\nThe latest development followed a settlement between SEBI and Adani Group chairman Gautam Adani, four group companies and other individuals. The proceedings were settled for a total amount of \u20b9 1.48 crore.\n\nThe settlement covers Adani Enterprises, Adani Power, APSEZ and Adani Transmission, now known as Adani Energy Solutions, along with their respective directors.\n\nThe proceedings originated from complaints received by SEBI in June and July 2020. The complaints alleged that certain listed Adani Group companies had not complied with minimum public shareholding requirements. Following a preliminary examination, SEBI initiated an investigation on October 23, 2020.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 10:34 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks to buy: JM Financial expects soft Q2 season for IT majors; check target prices for Infosys, TCS, others", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Stocks to buy: JM Financial expects soft Q2 season for IT majors; check target prices for Infosys, TCS, others Written by Debaroti Adhikary , ETMarkets.com | Sep 29, 2026, 10:37:36 AM IST 1 / 7 IT Tracker The IT companies are all set to begin the Q2 season, with TCS kickstarting the cycle on October 8. JM Financial noted that investors expect some improvement in growth, given that Q2 is seasonally a stronger quarter. However, macro uncertainty and AI-led productivity continue, while competitive intensity has also increased, with the industry now entering the fourth year of subdued growth, it warned. Overall, the domestic brokerage expects another soft quarter for most large tiers. Here are its ratings and target prices for 6 major IT stocks under its coverage.\n\nJM Financial has an 'Add' rating on the shares of Tata Consultancy Services (TCS) with a target price of Rs 2,375 apiece. This implies more than 14% upside potential from last week\u2019s closing level of Rs 2,082 apiece. For the earnings print of India\u2019s largest IT services company, the domestic brokerage said commentary on demand recovery, ramp up on the BSNL deal and margin recovery towards the 25% FY27 exit aspiration amid AI investments will be among the key things to watch out for. TCS will announce Q2 earnings on October 2. JM Financial expects the company to report marginal improvement in margins as wage hikes are behind, majorly offset by investments in the business.\n\nJM Financial has an \u2018Add\u2019 rating on the shares of Infosys with a target price of Rs 1,130 apiece. This implies nearly 13% upside potential from last week\u2019s closing level of Rs 1,000.2 apiece. Infosys will announce its Q2 earnings on October 23.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 10:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Australia says more hikes not off the table after raising rates to 15-year high", "full_content": "Australia's central bank on Tuesday raised policy rates to 4.6%, the highest level in 15 years, as the country looks to contain inflation stoked by the Middle East conflict.\n\nThe hike of 25 basis points to the cash rate was in line with expectations by economists polled by Reuters.\n\nThe Reserve Bank of Australia has now raised rates four times this year by a total 100 basis points as inflation remains sticky.\n\nIn its statement , the RBA said some of the upside risks flagged in its August meeting were now materializing.\n\n\"The conflict in the Middle East has broadened and global energy prices are now much higher than had been assumed,\" the central bank wrote, adding that AI-related demand was driving rapid price increases for technology-related goods.\n\nThe RBA also said that it would \"continue to do what it considers necessary,\" to contain inflation, including increasing the policy rate further.\n\nThe S&P/ASX 200 and the Australian dollar were flat following the policy decision.\n\nAustralia's inflation has run above its target band of 2%-3% for 2026, hitting a high of 4.6% in March. The country's inflation rate last came in at 3.5% in July, beating estimates. August print is set to be released Wednesday.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 10:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Vikram Solar shares rise 3% after securing 400 MW module order from leading EPC company", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Vikram Solar shares rise 3% after securing 400 MW module order from leading EPC company Vikram Solar Share Price Waaree Energies Share Price Premier Energies Share Price Emmvee Photovoltaic Power Share Price Saatvik Green Energy Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Vikram Solar shares rise 3% after securing 400 MW module order from leading EPC company SECTIONS Vikram Solar shares rise 3% after securing 400 MW module order from leading EPC company By Surbhi Khanna , ET Online Last Updated: Sep 29, 2026, 10:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vikram Solar shares rose 3% after securing a 400 MW module supply order for decentralised solar projects across Maharashtra. The company will supply 620 Wp N-Type TOPCon G12R modules from October 2026 through March 2027. The order strengthens its presence in agricultural-feeder solarisation and India\u2019s expanding renewable energy infrastructure.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news of 10.6 percentage points\u2014the largest among the three segments.\n\nYet the bands immediately below expanded. The proportion at P/E of 40-60 times rose to 16% from 13.8%, while the share at 60-80 times increased to 9.6% from 8.5%.\n\nConsequently, the overall share above 40 times earnings fell by a smaller 7.3 percentage points, to 46.9% from 54.2%. Almost half the largecap sample still trades above that threshold.\n\nThere are nevertheless more lower-multiple choices among largecaps. The share trading at 10-25 times earnings increased to 25.5% from 17%, while the 5-10 times band expanded to 8.5% from 6.4%. The proportion at 25-40 times narrowed to 15% from 21.3%.\n\nShah said foreign investor withdrawals and slower earnings growth had weighed on largecap valuations, alongside weak sentiment towards private banks and information technology companies.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 10:21 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IPO GMP Today: SRIT India vs Shah Investor's Home - Which Has the Highest Listing Gain?", "full_content": "SRIT India IPO leads Shah Investor's Home in GMP, with a higher GMP-implied listing gain as both issues enter Day 2 of subscription.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:20 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nifty breaks below 23K! Experts see more pain ahead, predict 21K levels on these 3 factors", "full_content": "Stock market crash: After trading in a range of 23,000 to 24,000 for more than a month, the Nifty 50 index finally broke down and slipped below 23,000 decisively. Soaring US bond yields, elevated crude oil prices, and buzz about a weak monsoon yield are among the major drags that pulled down the Nifty 50 and other key benchmark indices below their crucial support levels.\n\nAccording to stock market experts, rising US bond yields, especially the US 10-year bond yield, is the major drag for the Indian stock market. However, the sustained elevation of crude oil prices has renewed inflation fears, which may dent industrial margins and quarterly earnings. They said the US 10-year bond yield has crossed 5%, and any further escalation is expected to put extra pressure on the Nifty 50 and other indices. In fact, inflation is expected to remain a major concern, as higher crude oil prices and weak monsoon output are likely to put extra pressure on the government's exchequer.\n\nSpeaking on the outlook for the Nifty 50 today, Sumeet Bagadia, Executive Director at Choice Broking, said, \u201cThe breakdown below 23,000 and the lower-high neckline, coupled with rising volumes, has further weakened the short-term structure. The 22,700\u201322,600 zone is the immediate support area, while 22,900\u201323,100 is likely to act as the first recovery hurdle.\u201d\n\nExpecting the weakness to continue further, Sumeet Bagadia said, \u201cPSU Banks, Realty, MidSmall Financials and Banks were among the biggest sectoral laggards, while higher Call OI around 23,000\u201322,900 indicates overhead supply. With PCR at 0.62 and India VIX rising 12.15% to 13.6375, the near-term setup remains bearish, with volatility likely to stay elevated.\u201d\n\nAsked about how much downside in the Nifty 50 index we can expect, Vaishali Parekh, Vice President \u2014 Technical Research at Prabhudas Lilladher, said, \u201cThe Nifty 50 index has formed a huge bearish candle on the daily chart.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 10:18 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Honasa Consumer shares fall 5% after Rs 643 crore block deal; Peak XV, Sequoia likely sellers", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Honasa Consumer shares fall 5% after Rs 643 crore block deal; Peak XV, Sequoia likely sellers Honasa Consumer Share Price Godrej Consumer Products Share Price Dabur India Share Price Colgate-Palmolive (India) Share Price Gillette India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Honasa Consumer shares fall 5% after Rs 643 crore block deal; Peak XV, Sequoia likely sellers SECTIONS Honasa Consumer shares fall 5% after Rs 643 crore block deal; Peak XV, Sequoia likely sellers By Veer Sharma , ETMarkets.com Last Updated: Sep 29, 2026, 10:15:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Honasa Consumer shares declined up to 5% after 1.4 crore shares worth Rs 643 crore changed hands in a block deal. The transaction comes after the Mamaearth parent reported a 116.5% YoY rise in Q1 FY27 profit to Rs 90 crore. The company has set a Rs 5,500-crore revenue target by FY31, aiming to expand EBITDA margins to 15%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 10:15 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IPO pipeline swells to nearly Rs 4 lakh crore: Liquidity squeeze for secondary markets or valuation reset? Analysts weigh in", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IPO pipeline swells to nearly Rs 4 lakh crore: Liquidity squeeze for secondary markets or valuation reset? Analysts weigh in The Economic Times daily newspaper is available online now. Read Today's Paper IPO pipeline swells to nearly Rs 4 lakh crore: Liquidity squeeze for secondary markets or valuation reset? Analysts weigh in SECTIONS IPO pipeline swells to nearly Rs 4 lakh crore: Liquidity squeeze for secondary markets or valuation reset? Analysts weigh in By Kumar Gaurav , ETMarkets.com Last Updated: Sep 29, 2026, 10:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's primary market is on the brink of a colossal IPO wave, with estimates nearing Rs 4 lakh crore. Analysts express concern that this influx might siphon off liquidity from the secondary market, which could adversely affect current stock values. While IPO activity undoubtedly impacts liquidity, experts emphasize that multiple factors shape market dynamics. Historical analysis indicates that secondary market valuations may eventually appeal more to investors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 10:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Ola Electric's Battery Bet Impresses HSBC. The Balance Sheet Does Not", "full_content": "The company's stock took a hit in trade on Monday and fell as much as 3.5% to Rs 36.53, compared to a 0.86% fall in the benchmark Nifty index and a 0.7% fall in the entire auto sector.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Crash Live: Nifty50 Breaches 22,600, Sensex Slides 650 Points; Nifty Bank Hits 3-Month Low", "full_content": "That said, the BSE Sensex opened 138.04 points lower at 72,633.68, from its previous close of 72,771.72. Meanwhile, the NSE Nifty50 opened 47.8 points lower at 22,732.45, compared with its previous close of 22,780.25.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "PB Fintech shares extend losses for fourth straight session; loses 41% in four days \u2014 what investors should do?", "full_content": "PB Fintech shares fell more than 5% on Tuesday, 29 September, extending a sharp sell-off that has wiped out around 41% of the stock\u2019s value over the past four sessions. The Policybazaar parent, however, rebounded more than 3.5% in early trade on Monday after Bernstein retained its \u2018Outperform\u2019 rating on the stock with a target price of \u20b9 2,310 per share.\n\nBernstein\u2019s target price implied an upside of more than 98% from PB Fintech\u2019s Friday closing price, even as the brokerage expects the proposed changes to the insurance distribution framework to have a significant impact on the company\u2019s earnings, according to media reports. The brokerage estimates that the proposed regulatory framework could result in a 40% reduction in insurance take rates, potentially reducing PB Fintech\u2019s FY28 consolidated revenue by 36%. However, it expects Paisabazaar to provide some cushion against the impact.\n\nThe recent volatility in PB Fintech shares comes after the Insurance Regulatory and Development Authority of India (IRDAI) proposed sweeping changes to insurance distribution rules, including restrictions on certain \u201cdark patterns\u201d used on insurance and distributor websites. The regulator\u2019s consultation paper also proposes changes and caps on commissions across health, motor and life insurance, potentially altering the economics of insurance distribution platforms such as Policybazaar.\n\nMonday\u2019s recovery came after a particularly sharp two-session sell-off triggered by concerns over the proposed overhaul of insurance distribution economics. Bernstein had warned last week that the proposed commission changes were more severe than expected and that PB Fintech could be among the companies most affected.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 10:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Augmont Enterprises share price touches record high, hits 10% upper circuit for second day | What should investors do?", "full_content": "Augmont Enterprises share price reached to a record high of \u20b9 1,062.20, hitting 10% upper circuit for second session straight on Tuesday, 29 September, after the company was empanelled by the National Stock Exchange of India (NSE) as a key partner to promote Electronic Gold Receipts (EGRs).\n\nThe stock has witnessed a significant rally of over 24.47% in a week and has generated 17% returns since its listing on 31 August.\n\nIn an exchange filing dated 26 September, Augmont Enterprises said that this is strategic partnership designed to simplify the process of EGR creation and extinguishment, and to promote trading in EGRs, further deepening India\u2019s gold ecosystem.\n\nUnder the partnership, Augmont will leverage its expertise across the gold value chain to strengthen the digital infrastructure for EGRs, while providing technical and on-ground support for the development of the product. The collaboration is aimed at enabling the seamless conversion of physical gold into EGRs and the reconversion of EGRs into physical gold within a regulated framework.\n\nEGRs are dematerialised securities representing ownership of physical gold that is securely stored in SEBI-accredited vaults and held electronically through depositories. Each EGR is fully backed by physical gold and can be traded on the exchange, integrating gold more closely with the formal financial system.\n\nThrough the partnership, NSE seeks to build a stronger and more transparent gold trading ecosystem, supporting efficient price discovery, broader market participation and greater trust among jewellers, refiners, traders and institutional investors.\n\n\u201cThe empanelment of Augmont marks an important step in building a deep and vibrant ecosystem for Electronic Gold Receipts.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 10:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "AXISCADES Technologies Share Price Hits 10% Upper Circuit Today \u2014 Here's Why", "full_content": "At 9:42 am, the shares remained locked in the 10% upper circuit at Rs 2,072.80. In comparison, the BSE Sensex was trading 0.76% lower at around 72,203.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:08 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bharti Airtel, Vi shares rise up to 2% after Aug mobile subscriber data. Which is Nomura\u2019s top pick?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bharti Airtel, Vi shares rise up to 2% after Aug mobile subscriber data. Which is Nomura\u2019s top pick? Bharti Airtel Share Price Vodafone Idea Share Price Bharti Hexacom Share Price Tata Communications Share Price Tata Teleservices (Maharashtra) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bharti Airtel, Vi shares rise up to 2% after Aug mobile subscriber data. Which is Nomura\u2019s top pick? SECTIONS Bharti Airtel, Vi shares rise up to 2% after Aug mobile subscriber data. Which is Nomura\u2019s top pick? By Debaroti Adhikary , ETMarkets.com Last Updated: Sep 29, 2026, 10:18:00 AM IST Rate Story ct markets \u2014 a core CFA economics topic."}, {"title": "Why are R Systems International shares up 28% in 2 days despite weak trends on Dalal Street? Reason, next target price", "full_content": "R Systems International shares continued witnessing strong buying interest for the second consecutive session on Tuesday, 29 September. R Systems International's share price opened at \u20b9 289.70 against its previous close of \u20b9 277.60 and jumped as much as 9% to hit an intraday high of \u20b9 302.75. At this price, the stock has surged 28.4% in just two consecutive sessions. On the other hand, the equity benchmark Sensex has crashed by 2.5% in just two sessions, hitting an intraday low of 72,064 on Tuesday.\n\nThe stock is witnessing strong traction ahead of the record date for the second interim dividend for the financial year 2026 (FY26).\n\nOn Friday, 25 September, the company's board declared a second interim dividend of \u20b9 8 for FY26.\n\nThe record date for determining shareholders' entitlement to the said dividend is Thursday, 1 October 2026. The dividend for FY26 will be paid on or before 24 October 2026.\n\nBy 10 am on Tuesday, the stock has jumped nearly 18% in the last six months. However, over the last one year, it is down 28%, hitting a 52-week low of \u20b9 213.50 on 6 July this year after hitting a 52-week high of \u20b9 446.55 on 6 October last year. On a monthly scale, the stock is up nearly 21% so far in September, after a 6% fall in August.\n\nAccording to Vipin Kumar, AVP-Research at Globe Capital Market, underscored that the stock has witnessed a sharp bounce back from the price support at the \u20b9 220 level and is heading towards the resistance level of \u20b9 325, which is the upper band price resistance of a past 8-month congestion zone ( \u20b9 220\u2013 \u20b9 325 levels).\n\n\"Going forward, a decisive close above \u20b9 325 spot levels is crucial for a sustainable move towards \u20b9 380 and higher in the near term,\" said Kumar.\n\nAditya Thukral, founder and analyst at AT Research and Risk Managers, noted that R Systems International has been trading within a sideways box on price charts.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 09:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Crash: Nifty Breaches 22,600, Sensex Slumps 700 Points \u2014 Three Reasons Why Market is Falling", "full_content": "Barring Pharma, all sectoral indices are in the red, with Media and Financial Services leading the losses.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 09:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Forgot to file ITR but employer had deducted TDS: When can income-tax penalty still apply? ITAT explains", "full_content": "Not filing an income-tax return on time does not by itself mean that the entire income declared later can be treated as under-reported income for penalty purposes, a recent Income Tax Appellate Tribunal (ITAT) ruling has held.\n\nThe Mumbai bench of the ITAT deleted a \u20b9 3.95 lakh penalty under section 270A imposed on a ship captain who had failed to file his income-tax return within the prescribed deadline. The taxpayer subsequently filed his return after receiving a reassessment notice. However, the income disclosed by him was accepted by the tax department without any addition or variation.\n\nThe ruling in Vivek Trivedi vs ACIT , pronounced on 23 September 2026, is relevant for taxpayers who may have missed the original ITR deadline but whose income is otherwise reported to the tax department, particularly through TDS.\n\nThe taxpayer, Vivek Trivedi, was working as a ship captain with MMS Maritime (India) Pvt Ltd. He had not filed his return for assessment year 2020-21 within the time prescribed under section 139(1).\n\nThe income-tax department subsequently received information relating to his financial transactions, including the purchase of an immovable property for about \u20b9 1.43 crore , salary receipts and interest income. It then initiated reassessment proceedings and issued a notice under section 148.\n\nTrivedi filed his return on 27 May 2024, declaring total income of \u20b9 31.58 lakh .\n\nDuring the reassessment, he provided documents explaining his property purchase and other income. The assessing officer found that \u20b9 1.30 crore of the property purchase had been funded through a housing loan from HDFC Ltd, while the remaining amount was explained through redemption of mutual funds and fixed deposits.\n\nHis salary and interest income were also verified. Importantly, the assessing officer did not make any addition to the income declared by Trivedi. The reassessment was completed with his total income remaining at \u20b9 31.58 lakh.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 09:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Global Market: Shein shares tumble 6% as quarterly profit plunges 67%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Shein shares tumble 6% as quarterly profit plunges 67% Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Shein shares tumble 6% as quarterly profit plunges 67% SECTIONS Global Market: Shein shares tumble 6% as quarterly profit plunges 67% By Anupam Nagar , ETMarkets.com Last Updated: Sep 29, 2026, 0     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
