h.\n\nWithin the banking pack, AU Small Finance Bank led the Nifty Bank gainers, climbing over 4%. IndusInd Bank, Axis Bank, IDFC First Bank and ICICI Bank advanced between 3% and 4% each.\n\nCanara Bank and HDFC Bank gained over 2% each, while Bank of Baroda, Punjab National Bank, State Bank of India and Kotak Mahindra Bank added over 1% each.\n\nThe strong performance across private banks, public sector banks, NBFCs, insurance companies and asset management businesses highlighted the breadth of the financial sector rally.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 11:21 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Midterm Election results impact on oil and IT shares: Reliance, Indian Oil, TCS, Infosys - 10 stocks from experts", "full_content": "US Midterm Election Results 2026 | Stocks to buy: Following the sell-off trigger in the US bond market and the US dollar after the humiliating defeat of Donald Trump's Republican Party, global markets, including India's Sensex, Nifty, Bank Nifty and other broad market indices, are skyrocketing. By 10:10 AM on Thursday, the BSE Sensex is up close to 1700 points, or more than 2%; the Nifty 50 index is up over 400 points, or 1.75%; and the Bank Nifty index is up by around 1100 points, or 2%.\n\nAccording to stock market experts, this rally in the Indian stock market is due to a sharp shift of smart money from the US bond market to other assets such as equities, gold, and silver, following weakness in the US dollar. They said that the fall in the US dollar can be attributed to the humiliating defeat of the US President Donald Trump's Republican Party in the US Midterm Elections. Expecting relief for Indian H-1B Visa applicants in the tech and IT sector, and easing of Middle East tensions and Russian sanctions, they predicted a big jump in IT and oil stocks in the medium- to long-term. They advised investors to consider oil refiners when choosing an oil stock, as oil refiners earn big by exporting diesel, which shot up to $200 per barrel from $108 during the US-Iran war.\n\nDecoding Trump's Republican Party's defeat in the US Midterm Elections, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said that President Donald Trump\u2019s setback in the US midterm elections, which handed control of Congress to the Democrats, introduces a mix of relief and policy friction for the Indian stock market.\n\nExpecting relief for the IT and tech sector after the US Midterm Election Results 2026, Seema Srivastava said, \u201cA Democratic-led Congress is expected to push back against aggressive restrictions on skilled immigration and heavy H-1B visa fees.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 11:02 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Qualcomm Earnings: 5 key takeaways from Q4 results", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Qualcomm Earnings: 5 key takeaways from Q4 results Written by Anupam Nagar , ETMarkets.com | Nov 05, 2026, 11:04:04 AM IST 1 / 5 \u200bQualcomm revenue falls 8% Qualcomm reported an 8% year-on-year decline in fourth-quarter revenue to $10.32 billion, as weakness in its smartphone chip business offset strong growth in automotive sales. Adjusted earnings stood at $2.17 per share, marginally above analysts' estimates of $2.16. (Sources: CNBC, WSJ, Reuters)\n\nQualcomm's handset business remained the biggest drag on its performance, with revenue falling 26% year-on-year to $5.14 billion. Higher memory costs and sluggish smartphone demand weighed on sales, while declining Apple-related revenue added to the pressure.\n\nQualcomm's automotive business emerged as a bright spot, with revenue jumping 89% year-on-year to a record $1.99 billion. Internet of Things revenue also increased 4% to $1.89 billion, highlighting the company's efforts to diversify beyond smartphones.\n\nQualcomm expects chip-design operating margins to decline to 20%-22% in the first quarter of fiscal 2027, compared with 24% in the September quarter. Rising costs across wafer fabrication, assembly, testing, advanced packaging and memory are squeezing profitability. The company is raising product prices, but expects the full earnings benefit to materialise only in the second half of fiscal 2027.\n\nQualcomm is accelerating its expansion into AI data centres, automotive and connected devices to reduce its dependence on smartphones. The company reiterated its $5 billion fiscal 2027 data-centre revenue target and expects non-handset revenue to grow more than 60% year-on-year. A multi-year collaboration with Amazon for AI data-centre products adds to its growth ambitions.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 11:01 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Alphabet stock jumps 5%: Why Google Parent shares rallied", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Alphabet stock jumps 5%: Why Google Parent shares rallied Written by Anupam Nagar , ETMarkets.com | Nov 05, 2026, 10:54:18 AM IST 1 / 5 \u200bAlphabet shares rally nearly 5% Shares of Google parent Alphabet surged as much as 5.9% during Wednesday's trading session, before closing 3.2% higher at $288.93. The rally followed a Democratic sweep in the US midterm elections, which raised expectations of tighter scrutiny of new data centre projects and potentially eased concerns over massive AI infrastructure spending. (Sources: The Motley Fool, TradingView, Investing.com)\n\nDemocratic victories have raised the possibility of stricter regulations on data centre construction, including potential moratoriums over concerns about electricity consumption, water availability and environmental impact. Such restrictions could limit new capacity additions and benefit established technology companies like Alphabet, which already operate extensive data centre networks.\n\nAlphabet plans to spend between $195 billion and $205 billion on capital expenditure in 2026, more than double its spending of around $90 billion last year. The investments are aimed at expanding computing infrastructure to support growing demand for artificial intelligence and cloud services. However, the scale of spending has raised concerns about cash flows and the returns on investment.\n\nAlphabet has raised \u20ac6 billion through a seven-tranche euro bond offering, following a \u20ac9 billion issuance in May. The latest borrowing takes its euro-denominated bond sales this year to \u20ac15 billion.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 10:50 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "PhysicsWallah shares jump 10% after Q2 profit more than doubles: Buy, sell or hold? Brokerages on Alakh Pandey-led firm", "full_content": "PhysicsWallah shares rose 10% after Q2 FY27 net profit more than doubled to \u20b9143.63 crore, whi     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
