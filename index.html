"source": "Google News Business", "pub_date_str": "27 Oct 2026, 12:39 AM IST", "pub_date_relative": "17m ago"}, {"title": "River City Bank Q3 2026 slides: core earnings rise, credit quality pristine", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:36 AM IST", "pub_date_relative": "19m ago"}, {"title": "Fed hold expected this week as markets watch for December hike signals", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:36 AM IST", "pub_date_relative": "20m ago"}, {"title": "Aspen Neuroscience, Bambusa Therapeutics launch US IPOs as biotech boom rolls on", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:36 AM IST", "pub_date_relative": "20m ago"}, {"title": "Earnings week preview: Microsoft, Amazon, Intel and more report Oct 26\u201329", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:35 AM IST", "pub_date_relative": "20m ago"}, {"title": "Anthropic IPO live updates: Here's when the stock lock-ups expire after the first trade", "full_content": "Anthropic is officially headed for the public market in what is expected to be a historic offering for a 5-year-old company that's been at the heart of the generative artificial intelligence boom.\n\nIn a Form S-1 filing with the Securities and Exchange Commission , Anthropic said it plans to list on the Nasdaq under ticker symbol \"ANT.\"\n\nThe company behind Claude confidentially filed with the SEC in June, giving the agency time to review its financials before they were made available to the public and prospective investors.\n\nAnthropic CEO Dario Amodei co-founded the company in 2021 after he and a small group of researchers defected from OpenAI , now its chief rival. Anthropic's Claude model and services have captivated the corporate world, as companies have opened their wallets in an effort to crack new growth opportunities and find internal efficiencies.\n\nExpansion has accelerated in 2026, driven largely by the popularity of AI coding tool Claude Code , and powerful models including Claude Fable 5 and Mythos 5 . The company has been racing to maintain an edge over competitors like OpenAI and Google , and faced sharp criticism over its positions on safety, regulation and national security, leading to two high-profile disputes with the U.S. government in recent months.\n\nAnthropic's offering, if it doesn't get derailed, will land just a few months after Elon Musk's SpaceX debuted on the Nasdaq in by far the biggest IPO on record, ultimately raising $85.7 billion. It's been a volatile stretch for SpaceX shares, which finished last week slightly below where they opened in June.\n\nAs it prepares to hit the market, Anthropic has to contend with severe jitters on Wall Street as concerns grow over whether spending on AI services will justify the trillions of dollars in expected infrastructure costs.", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 12:32 AM IST", "pub_date_relative": "24m ago"}, {"title": "Intuitive Surgical director Gary Guthart sells $9.08M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:31 AM IST", "pub_date_relative": "25m ago"}, {"title": "Earnings preview: WELL, CDNS, NUE and PSA report after the close Oct. 26", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:31 AM IST", "pub_date_relative": "25m ago"}, {"title": "Verizon earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:30 AM IST", "pub_date_relative": "25m ago"}, {"title": "Oil falls from near six-month high as Iran mediation efforts ease supply worries", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:28 AM IST", "pub_date_relative": "28m ago"}, {"title": "Stock Market Today: Stocks Jump to Begin Busy Week of Tech Earnings, Fed Rate Decision; AI Stocks Gain on Enthusiasm for Anthropic IPO - Investopedia", "full_content": "Stock Market Today: Stocks Jump to Begin Busy Week of Tech Earnings, Fed Rate Decision; AI Stocks Gain on Enthusiasm for Anthropic IPO Investopedia Stock market today: Dow, S&P 500, Nasdaq rally as investors parse Anthropic IPO filing, busy week of tech earnings Yahoo Finance US stocks climb amid shaky trading in markets worldwide AP News Futures Rise; Musk Warning, Meta News In Focus Investor's Business Daily Stock market rises as Wall Street looks to rebound after difficult week (SP500:) Seeking Alpha", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 12:26 AM IST", "pub_date_relative": "29m ago"}, {"title": "Bank of Hawaii Q3 2026 slides: margin expands for 10th quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:25 AM IST", "pub_date_relative": "31m ago"}, {"title": "Trump DOJ unlawfully fired Epstein prosecutor Maurene Comey, judge rules", "full_content": "A federal judge ruled Monday that the Department of Justice's firing last year of New York federal prosecutor Maurene Comey , the daughter of former FBI Director James Comey , was unlawful.\n\nJudge Jesse Furman, in his ruling , also granted Maurene Comey retroactive reinstatement and back pay as an assistant U.S. Attorney for the Southern District of New York from her termination on July 16, 2025, through Dec. 20, 2025, when the judge inferred she accepted another job.\n\nThe DOJ said it would appeal the ruling in U.S. District Court in Manhattan, in which Furman rejected the department's arguments that the attorney general had authority to dismiss Comey without cause.\n\nComey's lawyers, in a statement, said, \"This hard-earned victory belongs to Ms. Comey, to all civil servants, and to all fighting for the rule of law.\"\n\n\"As the Court correctly held, to accept the government's argument about unlimited executive power 'would be to unsettle the very equilibrium established by this Nation's constitutional system,'\" the lawyers said. \"This decision reaffirms our bedrock system of checks and balances: the President is not above the law.\"\n\nBefore her termination, Comey was involved in a series of high-profile federal prosecutions, including ones against the sex offender Jeffrey Epstein, his accomplice, Ghislaine Maxwell, and Sean \"Diddy\" Combs.\n\nHer lawsuit against the DOJ argued that her termination violated federal law and the Constitution, and stemmed from President Donald Trump 's longstanding animus toward her father, whom Trump had fired as FBI director in 2017.\n\nJames Comey is currently under federal indictment that accuses him of threatening Trump's life by posting on Instagram a photo of seashells forming the number \"86 47.\" His attorneys are seeking to have that case tossed out.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 12:22 AM IST", "pub_date_relative": "33m ago"}, {"title": "Federal Reserve is likely to hold interest rates steady in October. Here's what that means for consumers", "full_content": "The Federal Reserve is expected to leave interest rates unchanged at its upcoming October meeting \u2014 even as higher energy costs complicate the inflation outlook and put additional pressure on household budgets.\n\nThe consumer price index , a broad measure of inflation, rose again in September, bringing the annual inflation rate up to 3.7%. Surging oil prices stemming from the U.S. war with Iran also helped drive September's producer price index higher. On Friday, Brent crude oil was trading at a five-month high before falling slightly.\n\nThe Fed raised rates by 25 basis points to a range of 3.75% to 4% last month, its first hike since 2023 . But fed funds futures last priced in less than a 10% chance the central bank will raise rates by another quarter point at its meeting this week, according to the CME Group's FedWatch tool. Nearly 75% expect at least one hike by year-end.\n\n\"Inflation is still the No. 1 problem in the U.S. economy, and there are a lot of signs it is getting more broad-based,\" said Heather Long, chief economist at Navy Federal Credit Union. \"For consumers, it means really high borrowing costs for the foreseeable future.\"\n\nHowever, \"given that it's right before an election,\" she added, \"they won't hike in October.\"\n\nThe central bank's upcoming meeting comes just days before the midterm elections and marks the final word on the pace of inflation in the U.S. before voters head to the polls, which could impact how much power each political party has in Washington.\n\nIn previous election cycles, the Fed has mostly maintained its charted course, research shows. The four times the Fed raised rates near a midterm \u2014 1978, 1982, 2018 and 2022 \u2014 were all tied to rising inflation, according to Mark Shore, director and economist at CME Group .\n\nFed Chairman Kevin Warsh has expressed a commitment to bringing inflation down to the Fed's 2% target .", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 12:21 AM IST", "pub_date_relative": "35m ago"}, {"title": "J&J's potential 'game-changer' drug \u2014 plus, what Microsoft's mass buyouts mean", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 12:15 AM IST", "pub_date_relative": "41m ago"}, {"title": "Apple responds to user reports of broken iPhone Duo screens on new foldable phone", "full_content": "Apple's first foldable phone, the iPhone Duo, hit store shelves on Friday to considerable lines and long wait times for pre-orders.\n\nBut some customers who were lucky enough to get the $1,999-and-up phone on its first weekend have been reporting a pretty big problem: The inner screen of the phone can break, showing horizontal bright lines emanating from the phone's hinge.\n\nApple on Monday said it was aware of the issue, which it said affected a \"small number\" of phones, and that it would replace the devices under its AppleCare warranty.\n\n\"We are aware of an issue impacting the inner display on a small number of iPhone Duo units,\" an Apple representative told CNBC. \"If users experience issues with their iPhone Duo display, they should contact AppleCare for a replacement.\"\n\nApple says on its website that an inner-screen repair will be $999 for iPhone Duos that are out-of-warranty.\n\nMost of the reports are from anonymous customers on online forums such as Reddit and X , and there are fake images online as well. But well-respected device repair firm iFixit weighed in on Sunday, after tearing down the new device and testing its resistance to dust, and theorized the issues may have to do with Apple's hinge design.\n\n\"Many of these damage reports describe folding or unfolding the phone, hearing a crunch, and pushing past it,\" said iFixit technician Shahram Mokhtari in its teardown video . \"Right where the damage is happening, the hinge is shaped a little differently.\"\n\n\"The hinge is actually dozens of parts, with ludicrous precision,\" iFixit CEO Kyle Wiens posted on X. \"A manufacturing variance or grain of sand can kill the fragile display panel it protects.\"", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 12:13 AM IST", "pub_date_relative": "43m ago"}, {"title": "Cotton shortage set to worsen as new deals drive export demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Cotton shortage set to worsen as new deals drive export demand The Economic Times daily newspaper is available online now. Read Today's Paper Cotton shortage set to worsen as new deals drive export demand SECTIONS Cotton shortage set to worsen as new deals drive export demand By Jayashree Bhosale , ET B ing systems ahead of IPO ETMarkets.com Last Updated: Oct 27, 2026, 12:17:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic pauses training of its next generation AI model for more than a month over security concerns, while four AI models access live external computer systems during testing. The company discloses the incidents in its IPO filing as it warns that training delays could affect revenue and leave it behind rivals.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 12:08 AM IST", "pub_date_relative": "48m ago"}, {"title": "Anthropic IPO: Alphabet Set To Become Largest Shareholder, Amazon Among Biggest Backers", "full_content": "Alphabet has the option to buy up to $10 billion in Anthropic shares alongside its planned IPO, while Amazon has invested $13 billion in the AI startup. The agreements highlight Big Tech\u2019s growing financial and infrastructure ties to AI developers.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 12:07 AM IST", "pub_date_relative": "49m ago"}, {"title": "FTC and 20 states sue Dollar General, alleging retailer overcharged shoppers", "full_content": "The Federal Trade Commission said Monday that it filed a lawsuit along with 20 states accusing Dollar General of charging customers more than the prices it displays on shelves, price tags and in advertisements.\n\nShares of Dollar General dropped about 4 % after the FTC announced the lawsuit .\n\nThe complaint alleges that thousands of Dollar General stores have \"taken advantage of vulnerable shoppers by extracting millions of dollars in unlawful overcharges with insufficient safeguards to prevent the practice.\"\n\nIt also argues that Dollar General has received \"tens of thousands\" of complaints from consumers about charging higher than advertised prices, but that it has not implemented policies to address the problem.\n\nThe states joining the FTC in the lawsuit are Alabama, Arizona, Arkansas, California, Connecticut, Florida, Illinois, Iowa, Kansas, Louisiana, Michigan, Mississippi, Nebraska, New Jersey, North Carolina, Ohio, Oklahoma, Tennessee, Utah and Wisconsin.\n\n\"Dollar General has betrayed the trust of millions of American consumers and imposed significant financial harm on communities and consumers who are already struggling to make their paychecks last,\" said Christopher Mufarrige, director of the FTC's Bureau of Consumer Protection.\n\nDollar General did not immediately respond to a request for comment.\n\nThe suit comes as shoppers look for discounts while they face elevated food and gas prices. Officials across the political spectrum also aim to show their efforts to protect consumers from high costs ahead of the midterm election next week.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 12:07 AM IST", "pub_date_relative": "49m ago"}, {"title": "India and US fine-tune trade pact after concluding most talks, says Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India and US fine-tune trade pact after concluding most talks, s g people familiar with the matter.\n\nThe company is considering launching the IPO as early as December, although the timing and size of the offering remain subject to change. Sembcorp Green Infra filed its draft IPO papers in August and is awaiting regulatory approval.\n\nBacked by Temasek Holdings Pte., the renewable energy company plans to raise funds through a fresh issue of equity shares, with no offer-for-sale (OFS) component. According to its draft red herring prospectus (DRHP), the proceeds Id:11793024495583\n\nwill be used to repay certain borrowings of the company and its subsidiaries.\n\nSembcorp Green Infra is among India's 10 largest renewable energy independent power producers by operational capacity as of March 31, 2026, according to its IPO prospectus.\n\nThe company operates across 18 states and has more than 75 renewable energy assets. Its gross renewable energy portfolio stood at 7.6 gigawatts (GW), including operational capacity and projects under development.\n\nAs of March 31, 2026, the company had 3.60 GW of operational renewable energy capacity, while approximately 4.04 GW/GWh of projects were under construction, according to the information provided in its prospectus.\n\nThe under-construction portfolio includes 2.61 GW of renewable energy capacity and 1,433 megawatt-hours (MWh) of battery energy storage system (BESS) capacity.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 11:58 PM IST", "pub_date_relative": "58m ago"}, {"title": "Sunteck Realty H1FY27 net profit rises 20%, pre-sales up 19%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Sunteck Realty H1FY27 net profit rises 20%, pre-sales up 19% Sunteck Realty Share Price Kalpataru Share Price Puravankara Share Price Valor Estate Share Price Keystone Realtors Share Price The Economic Times daily newspaper is avail Dutch minister rules out CBAM rethink", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a EU can learn from India on cutting regulatory burden, says Piyush Goyal as Dutch minister rules out CBAM rethink The Economic Times daily newspaper is available online now. Read Today's Paper EU can learn from India on cutting regulatory burden, says Piyush Goyal as Dutch minister rules out CBAM rethink SECTIONS EU can learn from India on cutting regulatory burden, says Piyush Goyal as Dutch minister rules out CBAM rethink By Kirtika Suneja , ET Bureau Last Updated: Oct 26, 2026, 11:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Piyush Goyal addressed the India-Netherlands Business Forum, highlighting India's deregulation efforts to reduce burdens on businesses. He asserted that the EU could learn from India's successful approach to regulatory matters. Dutch Minister Sjoerd Sjoerdsma acknowledged the importance of necessary regulations but emphasized the need to review those that hinder trade. He reiterated that climate and product safety regulations are crucial for European consumers.\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "26 Oct 2026, 11:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Blue Energy Motors Opens Battery-Swap Station For EV Heavy Trucks Near Mumbai", "full_content": "Beyond electric trucking, the facility integrates battery-swapping infrastructure with an EV charging station accessible to the public, to cater to electric two-wheelers, four-wheelers and commercial vehicles.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Buying America at a discount: This timberland REIT is on sale", "full_content": "This timberland REIT is trading far below the value of its land assets even as it has stands to benefit from several different growth oppportunities.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 11:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft's Five-Year Pivot: Revenue Doubles On Cloud's $100B Milestone, Headcount Shrinks", "full_content": "The shift highlights how Microsoft is generating more revenue while keeping its workforce largely flat, even as its cloud business scales up and demand for AI infrastructure grows.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dalmia Bharat posts Rs 205 crore Q2 loss on exceptional hit", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Dalmia Bharat posts Rs 205 crore Q2 loss on exceptional hit Dalmia Bharat Share Price The Ramco Cements Share Price India Cements Share Price Orient Cement Share Price KCP Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Dalmia Bharat posts Rs 205 crore Q2 loss on exceptional hit SECTIONS Dalmia Bharat posts Rs 205 crore Q2 loss on exceptional hit By Nikita Periwal , ET Bureau Last Updated: Oct 26, 2026, 11:49:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Dalmia Bharat experienced a consolidated loss of Rs 205 crore in the September quarter of this year. This loss was due to an exceptional hit of Rs 339 crore related to asset impairment and employee separation. Sales volume rose by 3% year-on-year, while consolidated revenue increased by 4% to Rs 3,563 crore. However, EBITDA fell by 29% due to rising power and fuel costs, which increased by 22%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "My wife has only $80,000 saved for retirement. I have $2.2 million. Am I wrong to be shocked?", "full_content": "\u201cWhen I brought up retiring last spring, she said she was ready whenever I was, and I took that to mean we were in good shape.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Oct 2026, 11:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks rally to start the week, Nasdaq jumps 1% on Anthropic IPO enthusiasm: Live updates", "full_content": "Stocks rose Monday as semiconductor makers rallied after Anthropic's IPO filing revived enthusiasm for the artificial intelligence trade.\n\nThe Dow Jones Industrial Average added 126 points, or 0.2%. The S&P 500 gained 0.7%, while the Nasdaq Composite jumped 1%.\n\nChip stocks and other AI-related shares rose as Anthropic publicly filed for an IPO , an offering investors are betting will add new life to the flagging tech sector. The AI company behind Claude reported $16.29 billion in revenue for the six months ended June, a 1,304% increase from $1.16 billion during the same period a year earlier. It plans to list on the Nasdaq under ticker symbol \"ANT.\"\n\nOther major AI headlines added to the risk-on sentiment. Meta Platforms said Monday it is planning to raise $95 billion to support its AI investments. SpaceX CEO Elon Musk said over the weekend that the satellite and rocket launch company has closed a $40 billion debt deal for AI chips.\n\nSemiconductors rallied, with the iShares Semiconductor ETF (SOXX) popping more than 3%. Shares of Nvidia climbed 2.6%, Micron increased 4%, Broadcom rose 3% and Advanced Micro Devices jumped 3%.\n\n\"The market needed this, just like it needed SpaceX,\" Jay Woods, chief market strategist at Freedom Capital Markets, said in regards to Anthropic. \"This is a big confidence booster, and I anticipate the demand is going to be there because people have been waiting and talking about this one for a long time.\"\n\nThe news soothed some fears around the AI trade, which had been flagging in recent weeks amid growing concerns that the massive ramp up in spending on datacenters is not sustainable. The S&P 500 and the Nasdaq are coming off back-to-back weekly losses . Chipmakers are in a bear market, with the SOXX off roughly 25% from its high.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 11:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "These energy stocks are poised to profit from an imminent AI power crunch", "full_content": "Bloom Energy and Solaris Energy would benefit from an urgency around securing power to AI developers.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Oct 2026, 11:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nippon Life AMC shares: Last chance to buy for \u20b99.50 interim dividend; record date, dividend yield", "full_content": "Nippon Life India Asset Management shares are approaching a key date for dividend -seeking investors, with October 27, 2026, likely to be the last day to buy the stock to qualify for the \u20b9 9.50-per-share interim dividend. The company has fixed October 28 as the record date, while dividend payments are scheduled to begin on November 5.\n\nAlong with its September-quarter results, the company declared its first interim dividend for FY27. The company has followed a practice of issuing two dividends, an interim dividend and a final dividend. In the past 12 months, Nippon Life India Asset Management has declared an equity dividend amounting to \u20b9 21.50 per share.\n\nInvestors looking to benefit from this payout must ensure they own the stock before the record date. Under India\u2019s T+1 settlement cycle, shares purchased on or after the record date will not qualify for the dividend.\n\nOn October 22, the company reported a 6% decline in its consolidated net profit to \u20b9 324.4 crore for the September quarter, impacted by a one-time exceptional item of \u20b9 96.76 crore pertaining to Securities and Exchange Board of India (SEBI) settlement proceedings.\n\nThe decline in profit was attributed to an exceptional item of \u20b9 96.76 crore pertaining to SEBI settlement proceedings, according to the company\u2019s filing.\n\nHowever, its revenue from operations surged 21% year-on-year to \u20b9 796 crore from \u20b9 658.1 crore a year ago. The company\u2019s assets under management rose 14% year-on-year to \u20b9 8.68 lakh crore as of September 2026. This included Nippon India Mutual Fund\u2019s quarterly AUM, which grew 20% year-on-year to \u20b9 7.87 lakh crore.\n\nDuring FY25, the company received a show-cause notice dated August 30, 2024, from SEBI alleging non-compliance with certain provisions of securities laws regarding investments made by certain schemes of Nippon India Mutual Fund in Additional Tier-1 (AT-1) bonds issued by Yes Bank.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 11:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "S&P 500 vs Nasdaq 100: Which global index fund is right for Indian investors seeking international market exposure?", "full_content": "Indian investors looking to diversify beyond domestic mutual funds have two prominent US stock market indices to consider: the S&P 500 and Nasdaq 100. While both provide exposure to some of the world's largest companies, they differ in diversification, sector concentration and investment risks.\n\nThe US accounts for more than 60% of global stock market value , while companies represented by the S&P 500 alone account for over 40%, according to the July-September 2026 edition of The Tortoise Lens , a quarterly magazine published by PPFAS.\n\nIn the report, Akshay Falgunia, Fund Manager at PPFAS GIFT, explains why Indian investors should consider international diversification , which indices offer suitable exposure and how much of their equity portfolio they could allocate overseas.\n\nThe S&P 500 comprises approximately 500 leading US companies across multiple sectors. According to Falgunia, these companies collectively represent more than 40% of global stock market value, making the index a broad-based option for international diversification.\n\nSeveral companies in the index also generate substantial revenue outside America, providing investors with exposure to businesses operating across international markets.\n\nThe Nasdaq 100, meanwhile, comprises 100 of the largest non-financial companies listed on the Nasdaq Stock Market. It has a greater concentration in technology and biotechnology businesses.\n\nFalgunia identifies the S&P 500 as a starting point for investors seeking broad international exposure. For those looking for greater exposure to innovation and comfortable with higher volatility, he highlights the Nasdaq 100.\n\nHowever, investing internationally does not automatically guarantee diversification. The report cautions against concentrating an entire overseas portfolio in artificial intelligence or another popular investment theme.", "source": "LiveMint Money", "pub_date_str": "26 Oct 2026, 11:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Prahaar Box Office Collection Day 11: Rajkummar Rao Starrer Nears Rs 25 Crore Mark, Will It Cross It?", "full_content": "Rajkummar Rao starrer Prahaar: The Untold Story Of Ujjwal Nikam has earned Rs 48.61 lakh on Day 11, taking its India gross collection to Rs 24.91 crore.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why investors are bullish on Anthropic \u2014 despite some big risks", "full_content": "Investors sounded positive about Anthropic's IPO filing, despite some large risks", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 11:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Thawed chicken to non-stick pans, we answered your food and kitchen safety questions - The Guardian", "full_content": "Thawed chicken to non-stick pans, we answered your food and kitchen safety questions The Guardian The FDA Found Lead in Cookware \u2014 As a Public Health Expert, These Are the Alternatives I Recommend Food & Wine I Chucked My Favorite Nonstick Pan When I Found Out It Had PFAS \u2014 and the Non-Toxic Swaps I\u2019ve Made Since Food & Wine", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 11:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Bold but sane\u2019: what we learnt from Anthropic\u2019s 240,000-word IPO filing", "full_content": "Prospectus details AI lab\u2019s \u2018mission\u2019, $800bn data centre commitments and extraordinary governance structure", "source": "FT Markets", "pub_date_str": "26 Oct 2026, 11:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "PHP Issues Second Windows Security Update in Five Days to Fix Brotli Code Execution Flaw - The Hacker News", "full_content": "PHP Issues Second Windows Security Update in Five Days to Fix Brotli Code Execution Flaw The Hacker News The 5 Things You Need to Know About the PHP Security Flaw Breaking the Internet The New York Times Welcome to the Valley of Pain The Atlantic AI is exposing how fragile the web really is. What you can do to stay safe CNN Can\u2019t Patch PHP2Shell Yet? Build a Stopgap with the Controls You Own Qualys", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 11:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Udta Teer Box Office Collection Day 4: Ayushmann Khurrana-Sara Ali Khan Starrer Crosses Rs 25 Crore In India", "full_content": "Udta Teer has earned Rs 3.53 crore on Day 4 so far, taking its India gross collection to Rs 26.37 crore, with 11.2% occupancy across 5,949 shows.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft offers a quarter of its global workforce voluntary buyouts as AI spending accelerates - AP News", "full_content": "Microsoft offers a quarter of its global workforce voluntary buyouts as AI spending accelerates AP News Microsoft offers voluntary buyouts to 60,000 employees as AI leads to efficiency push CNBC Microsoft offers buyouts to 60,000 workers as it looks to trim costs Los Angeles Times Microsoft offers buyouts to around 60,000 employees to contain costs Reuters Microsoft is the Latest Company to Reduce its Workforce Over AI. It's Offering Buyouts to Tens of Thousands. Yahoo Finance", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 11:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Paytm Guides 2-3 Quarter Horizon For UPI MDR Transition To Stabilise After Strong Q2 Show", "full_content": "Paytm expects its payment processing margin to expand by 2.5 basis points following the implementation of UPI Merchant Discount Rate, with the full impact of the transition expected to settle over the next two to three quarters, the company said alongside its September quarter results.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft offers voluntary buyouts to 60,000 employees as AI leads to efficiency push", "full_content": "Microsoft said Monday that it's offering buyouts to a wide swath of employees as it strives to balance a costly artificial intelligence infrastructure build-out with capital efficiency.\n\nThe software maker announced a new voluntary exit offer for certain workers in the U.S., Canada, India and the United Kingdom at its experience level of 70 or below.\n\nAround 60,000 people are eligible, according to a person familiar with the matter, who asked not to be named while discussing an internal matter. The effort affects about 27% of Microsoft's total workforce of 223,000 people.\n\nMicrosoft has been ramping up spending on data centers to accommodate high AI computing demand, supplying cloud services to Anthropic, OpenAI and a slew of other companies. That put a strain on Microsoft's finances. In April, it announced a first-ever voluntary retirement program that around 7% of U.S. employees were eligible for. Then, in July, Microsoft announced plans to lay off 4,800 employees .\n\n\"The Voluntary Exit Offer reflects an important part of how we're evolving our approach to change: creating greater flexibility and, where possible, more ways for employees to shape their next chapter,\" Amy Coleman, Microsoft's executive vice president and chief people officer, wrote in a memo to employees . \"This builds on what we learned earlier this year through the Voluntary Retirement Program.\"\n\nMicrosoft is in the midst of a business model transformation , increasingly trying to charge clients based on how much AI they actually use. It has armed programmers, sellers and supply chain workers with AI tools and observed noticeable results . At the same time, the 51-year-old maker of Windows and Office wants to ensure that it has the right talent to go after its most compelling new growth opportunities.\n\nThe idea is to make the shift without weakening Microsoft's financial profile.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Noel Tata Writes To Tata Sons Challenging Chandra's Reappointment, Seeks Disclosure Of Venu Srinivasan's TVS Links", "full_content": "In an eight-page letter to the Tata Sons company secretary and board, Tata Trusts Chairperson Noel Tata questions the validity of N Chandrasekaran's reappointment, alleges non-disclosure of commercial dealings between TVS Motor and a company linked to the chairman's family, and seeks records of board deliberations, conflict declarations and legal opinions.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mumbai Trains Chaos: 3 Dead As Commuters Forced To Walk On Tracks After Fire Triggers Disruption", "full_content": "Three people were found dead on Mumbai railway tracks as train services faced disruption following a fire near Kanjurmarg station.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:08 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "South Africa Vs Australia 3rd Test Live Streaming: When And Where To Watch In India", "full_content": "Temba Bavuma's 179 and Marco Jansen's five-wicket haul helped South Africa bounce back in the second Test. Can the hosts carry that momentum into Cape Town?", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:00 AM IST", "pub_date_relative": "just now", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today: All You Need To Know Going Into Trade On Oct 27", "full_content": "Stocks in the news, big brokerage calls of the day, complete trade setup and much more!", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 06:00 AM IST", "pub_date_relative": "just now", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "River City Bank Q3 2026 slides: core earnings rise, credit quality pristine", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:36 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings week preview: Microsoft, Amazon, Intel and more report Oct 26\u201329", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:35 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO live updates: Here's when the stock lock-ups expire after the first trade", "full_content": "Anthropic is officially headed for the public market in what is expected to be a historic offering for a 5-year-old company that's been at the heart of the generative artificial intelligence boom.\n\nIn a Form S-1 filing with the Securities and Exchange Commission , Anthropic said it plans to list on the Nasdaq under ticker symbol \"ANT.\"\n\nThe company behind Claude confidentially filed with the SEC in June, giving the agency time to review its financials before they were made available to the public and prospective investors.\n\nAnthropic CEO Dario Amodei co-founded the company in 2021 after he and a small group of researchers defected from OpenAI , now its chief rival. Anthropic's Claude model and services have captivated the corporate world, as companies have opened their wallets in an effort to crack new growth opportunities and find internal efficiencies.\n\nExpansion has accelerated in 2026, driven largely by the popularity of AI coding tool Claude Code , and powerful models including Claude Fable 5 and Mythos 5 . The company has been racing to maintain an edge over competitors like OpenAI and Google , and faced sharp criticism over its positions on safety, regulation and national security, leading to two high-profile disputes with the U.S. government in recent months.\n\nAnthropic's offering, if it doesn't get derailed, will land just a few months after Elon Musk's SpaceX debuted on the Nasdaq in by far the biggest IPO on record, ultimately raising $85.7 billion. It's been a volatile stretch for SpaceX shares, which finished last week slightly below where they opened in June.\n\nAs it prepares to hit the market, Anthropic has to contend with severe jitters on Wall Street as concerns grow over whether spending on AI services will justify the trillions of dollars in expected infrastructure costs.", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 12:32 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings preview: WELL, CDNS, NUE and PSA report after the close Oct. 26", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:31 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Verizon earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 12:30 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Stocks Jump to Begin Busy Week of Tech Earnings, Fed Rate Decision; AI Stocks Gain on Enthusiasm for Anthropic IPO - Investopedia", "full_content": "Stock Market Today: Stocks Jump to Begin Busy Week of Tech Earnings, Fed Rate Decision; AI Stocks Gain on Enthusiasm for Anthropic IPO Investopedia Stock market today: Dow, S&P 500, Nasdaq rally as investors parse Anthropic IPO filing, busy week of tech earnings Yahoo Finance US stocks climb amid shaky trading in markets worldwide AP News Futures Rise; Musk Warning, Meta News In Focus Investor's Business Daily Stock market rises as Wall Street looks to rebound after difficult week (SP500:) Seeking Alpha", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 12:26 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Federal Reserve is likely to hold interest rates steady in October. Here's what that means for consumers", "full_content": "The Federal Reserve is expected to leave interest rates unchanged at its upcoming October meeting \u2014 even as higher energy costs complicate the inflation outlook and put additional pressure on household budgets.\n\nThe consumer price index , a broad measure of inflation, rose again in September, bringing the annual inflation rate up to 3.7%. Surging oil prices stemming from the U.S. war with Iran also helped drive September's producer price index higher. On Friday, Brent crude oil was trading at a five-month high before falling slightly.\n\nThe Fed raised rates by 25 basis points to a range of 3.75% to 4% last month, its first hike since 2023 . But fed funds futures last priced in less than a 10% chance the central bank will raise rates by another quarter point at its meeting this week, according to the CME Group's FedWatch tool. Nearly 75% expect at least one hike by year-end.\n\n\"Inflation is still the No. 1 problem in the U.S. economy, and there are a lot of signs it is getting more broad-based,\" said Heather Long, chief economist at Navy Federal Credit Union. \"For consumers, it means really high borrowing costs for the foreseeable future.\"\n\nHowever, \"given that it's right before an election,\" she added, \"they won't hike in October.\"\n\nThe central bank's upcoming meeting comes just days before the midterm elections and marks the final word on the pace of inflation in the U.S. before voters head to the polls, which could impact how much power each political party has in Washington.\n\nIn previous election cycles, the Fed has mostly maintained its charted course, research shows. The four times the Fed raised rates near a midterm \u2014 1978, 1982, 2018 and 2022 \u2014 were all tied to rising inflation, according to Mark Shore, director and economist at CME Group .\n\nFed Chairman Kevin Warsh has expressed a commitment to bringing inflation down to the Fed's 2% target .", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 12:21 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Apple responds to user reports of broken iPhone Duo screens on new foldable phone", "full_content": "Apple's first foldable phone, the iPhone Duo, hit store shelves on Friday to considerable lines and long wait times for pre-orders.\n\nBut some customers who were lucky enough to get the $1,999-and-up phone on its first weekend have been reporting a pretty big problem: The inner screen of the phone can break, showing horizontal bright lines emanating from the phone's hinge.\n\nApple on Monday said it was aware of the issue, which it said affected a \"small number\" of phones, and that it would replace the devices under its AppleCare warranty.\n\n\"We are aware of an issue impacting the inner display on a small number of iPhone Duo units,\" an Apple representative told CNBC. \"If users experience issues with their iPhone Duo display, they should contact AppleCare for a replacement.\"\n\nApple says on its website that an inner-screen repair will be $999 for iPhone Duos that are out-of-warranty.\n\nMost of the reports are from anonymous customers on online forums such as Reddit and X , and there are fake images online as well. But well-respected device repair firm iFixit weighed in on Sunday, after tearing down the new device and testing its resistance to dust, and theorized the issues may have to do with Apple's hinge design.\n\n\"Many of these damage reports describe folding or unfolding the phone, hearing a crunch, and pushing past it,\" said iFixit technician Shahram Mokhtari in its teardown video . \"Right where the damage is happening, the hinge is shaped a little differently.\"\n\n\"The hinge is actually dozens of parts, with ludicrous precision,\" iFixit CEO Kyle Wiens posted on X. \"A manufacturing variance or grain of sand can kill the fragile display panel it protects.\"", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 12:13 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Cotton shortage set to worsen as new deals drive export demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Cotton shortage set to worsen as new deals drive export demand The Economic Times daily newspaper is available online now. Read Today's Paper Cotton shortage set to worsen as new deals drive almia Bharat experienced a consolidated loss of Rs 205 crore in the September quarter of this year. This loss was due to an exceptional hit of Rs 339 crore related to asset impairment and employee separation. Sales volume rose by 3% year-on-year, while consolidated revenue increased by 4% to Rs 3,563 crore. However, EBITDA fell by 29% due to rising power and fuel costs, which increased by 22%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks rally to start the week, Nasdaq jumps 1% on Anthropic IPO enthusiasm: Live updates", "full_content": "Stocks rose Monday as semiconductor makers rallied after Anthropic's IPO filing revived enthusiasm for the artificial intelligence trade.\n\nThe Dow Jones Industrial Average added 126 points, or 0.2%. The S&P 500 gained 0.7%, while the Nasdaq Composite jumped 1%.\n\nChip stocks and other AI-related shares rose as Anthropic publicly filed for an IPO , an offering investors are betting will add new life to the flagging tech sector. The AI company behind Claude reported $16.29 billion in revenue for the six months ended June, a 1,304% increase from $1.16 billion during the same period a year earlier. It plans to list on the Nasdaq under ticker symbol \"ANT.\"\n\nOther major AI headlines added to the risk-on sentiment. Meta Platforms said Monday it is planning to raise $95 billion to support its AI investments. SpaceX CEO Elon Musk said over the weekend that the satellite and rocket launch company has closed a $40 billion debt deal for AI chips.\n\nSemiconductors rallied, with the iShares Semiconductor ETF (SOXX) popping more than 3%. Shares of Nvidia climbed 2.6%, Micron increased 4%, Broadcom rose 3% and Advanced Micro Devices jumped 3%.\n\n\"The market needed this, just like it needed SpaceX,\" Jay Woods, chief market strategist at Freedom Capital Markets, said in regards to Anthropic. \"This is a big confidence booster, and I anticipate the demand is going to be there because people have been waiting and talking about this one for a long time.\"\n\nThe news soothed some fears around the AI trade, which had been flagging in recent weeks amid growing concerns that the massive ramp up in spending on datacenters is not sustainable. The S&P 500 and the Nasdaq are coming off back-to-back weekly losses . Chipmakers are in a bear market, with the SOXX off roughly 25% from its high.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 11:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "These energy stocks are poised to profit from an imminent AI power crunch", "full_content": "Bloom Energy and Solaris Energy would benefit from an urgency around securing power to AI developers.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Oct 2026, 11:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nippon Life AMC shares: Last chance to buy for \u20b99.50 interim dividend; record date, dividend yield", "full_content": "Nippon Life India Asset Management shares are approaching a key date for dividend -seeking investors, with October 27, 2026, likely to be the last day to buy the stock to qualify for the \u20b9 9.50-per-share interim dividend. The company has fixed October 28 as the record date, while dividend payments are scheduled to begin on November 5.\n\nAlong with its September-quarter results, the company declared its first interim dividend for FY27. The company has followed a practice of issuing two dividends, an interim dividend and a final dividend. In the past 12 months, Nippon Life India Asset Management has declared an equity dividend amounting to \u20b9 21.50 per share.\n\nInvestors looking to benefit from this payout must ensure they own the stock before the record date. Under India\u2019s T+1 settlement cycle, shares purchased on or after the record date will not qualify for the dividend.\n\nOn October 22, the company reported a 6% decline in its consolidated net profit to \u20b9 324.4 crore for the September quarter, impacted by a one-time exceptional item of \u20b9 96.76 crore pertaining to Securities and Exchange Board of India (SEBI) settlement proceedings.\n\nThe decline in profit was attributed to an exceptional item of \u20b9 96.76 crore pertaining to SEBI settlement proceedings, according to the company\u2019s filing.\n\nHowever, its revenue from operations surged 21% year-on-year to \u20b9 796 crore from \u20b9 658.1 crore a year ago. The company\u2019s assets under management rose 14% year-on-year to \u20b9 8.68 lakh crore as of September 2026. This included Nippon India Mutual Fund\u2019s quarterly AUM, which grew 20% year-on-year to \u20b9 7.87 lakh crore.\n\nDuring FY25, the company received a show-cause notice dated August 30, 2024, from SEBI alleging non-compliance with certain provisions of securities laws regarding investments made by certain schemes of Nippon India Mutual Fund in Additional Tier-1 (AT-1) bonds issued by Yes Bank.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 11:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500 vs Nasdaq 100: Which global index fund is right for Indian investors seeking international market exposure?", "full_content": "Indian investors looking to diversify beyond domestic mutual funds have two prominent US stock market indices to consider: the S&P 500 and Nasdaq 100. While both provide exposure to some of the world's largest companies, they differ in diversification, sector concentration and investment risks.\n\nThe US accounts for more than 60% of global stock market value , while companies represented by the S&P 500 alone account for over 40%, according to the July-September 2026 edition of The Tortoise Lens , a quarterly magazine published by PPFAS.\n\nIn the report, Akshay Falgunia, Fund Manager at PPFAS GIFT, explains why Indian investors should consider international diversification , which indices offer suitable exposure and how much of their equity portfolio they could allocate overseas.\n\nThe S&P 500 comprises approximately 500 leading US companies across multiple sectors. According to Falgunia, these companies collectively represent more than 40% of global stock market value, making the index a broad-based option for international diversification.\n\nSeveral companies in the index also generate substantial revenue outside America, providing investors with exposure to businesses operating across international markets.\n\nThe Nasdaq 100, meanwhile, comprises 100 of the largest non-financial companies listed on the Nasdaq Stock Market. It has a greater concentration in technology and biotechnology businesses.\n\nFalgunia identifies the S&P 500 as a starting point for investors seeking broad international exposure. For those looking for greater exposure to innovation and comfortable with higher volatility, he highlights the Nasdaq 100.\n\nHowever, investing internationally does not automatically guarantee diversification. The report cautions against concentrating an entire overseas portfolio in artificial intelligence or another popular investment theme.", "source": "LiveMint Money", "pub_date_str": "26 Oct 2026, 11:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why investors are bullish on Anthropic \u2014 despite some big risks", "full_content": "Investors sounded positive about Anthropic's IPO filing, despite some large risks", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 11:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "\u2018Bold but sane\u2019: what we learnt from Anthropic\u2019s 240,000-word IPO filing", "full_content": "Prospectus details AI lab\u2019s \u2018mission\u2019, $800bn data centre commitments and extraordinary governance structure", "source": "FT Markets", "pub_date_str": "26 Oct 2026, 11:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Paytm Guides 2-3 Quarter Horizon For UPI MDR Transition To Stabilise After Strong Q2 Show", "full_content": "Paytm expects its payment processing margin to expand by 2.5 basis points following the implementation of UPI Merchant Discount Rate, with the full impact of the transition expected to settle over the next two to three quarters, the company said alongside its September quarter results.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Microsoft offers voluntary buyouts to 60,000 employees as AI leads to efficiency push", "full_content": "Microsoft said Monday that it's offering buyouts to a wide swath of employees as it strives to balance a costly artificial intelligence infrastructure build-out with capital efficiency.\n\nThe software maker announced a new voluntary exit offer for certain workers in the U.S., Canada, India and the United Kingdom at its experience level of 70 or below.\n\nAround 60,000 people are eligible, according to a person familiar with the matter, who asked not to be named while discussing an internal matter. The effort affects about 27% of Microsoft's total workforce of 223,000 people.\n\nMicrosoft has been ramping up spending on data centers to accommodate high AI computing demand, supplying cloud services to Anthropic, OpenAI and a slew of other companies. That put a strain on Microsoft's finances. In April, it announced a first-ever voluntary retirement program that around 7% of U.S. employees were eligible for. Then, in July, Microsoft announced plans to lay off 4,800 employees .\n\n\"The Voluntary Exit Offer reflects an important part of how we're evolving our approach to change: creating greater flexibility and, where possible, more ways for employees to shape their next chapter,\" Amy Coleman, Microsoft's executive vice president and chief people officer, wrote in a memo to employees . \"This builds on what we learned earlier this year through the Voluntary Retirement Program.\"\n\nMicrosoft is in the midst of a business model transformation , increasingly trying to charge clients based on how much AI they actually use. It has armed programmers, sellers and supply chain workers with AI tools and observed noticeable results . At the same time, the 51-year-old maker of Windows and Office wants to ensure that it has the right talent to go after its most compelling new growth opportunities.\n\nThe idea is to make the shift without weakening Microsoft's financial profile.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Noel Tata Writes To Tata Sons Challenging Chandra's Reappointment, Seeks Disclosure Of Venu Srinivasan's TVS Links", "full_content": "In an eight-page letter to the Tata Sons company secretary and board, Tata Trusts Chairperson Noel Tata questions the validity of N Chandrasekaran's reappointment, alleges non-disclosure of commercial dealings between TVS Motor and a company linked to the chairman's family, and seeks records of board deliberations, conflict declarations and legal opinions.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Buy, Sell Or Hold: Kalyan Jewellers, Biocon, Paytm, Reliance Industries, ITC And IDFC First Bank \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including Kalyan Jewellers, Biocon, Paytm, Reliance Industries, ITC and IDFC First Bank.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 11:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why you shouldn\u2019t bother reading the Anthropic IPO filing", "full_content": "Valuing AI lab based on its historic reported numbers is a fool\u2019s errand", "source": "FT Markets", "pub_date_str": "26 Oct 2026, 10:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Lula wins Brazil runoff after prediction markets favored Bolsonaro", "full_content": "Luiz In\u00e1cio Lula da Silva was reelected president of Brazil on Sunday in a runoff election, an upset that prediction markets odds failed to anticipate.\n\nLula defeated Fl\u00e1vio Bolsonaro , the right-wing candidate and son of former president Jair Bolsonaro, by 51.8% to 48.2%, according to the country's Superior Electoral Court.\n\nAs late as Sunday afternoon, Lula remained a significant underdog on prediction markets. Even just after 8:30 p.m. ET on Sunday, Lula's odds were at 21% on Kalshi.\n\nBolsonaro's odds on prediction markets surged after first-round voting on Oct. 4, with both Kalshi and Polymarket giving Bolsonaro an over 80% chance of ousting Lula. The Kalshi contract asked, \"Brazil Presidential election winner?\" and was verified by reporting from the Associated Press.\n\nKalshi co-founder and CEO Tarek Mansour has previously defended Kalshi's election contracts. In August, Kalshi reflected a 95% likelihood of Wisconsin Democratic socialist Francesca Hong winning the Democratic gubernatorial primary over Milwaukee County executive David Crowley. Instead, Hong lost the race by less than 1 percentage point.\n\n\"Before the 'prediction markets got it wrong' headlines roll in: a 5% probability doesn't mean it won't happen,\" Mansour wrote in an Aug. 12 social media post on X. \"It means it should happen 1 in 20 times. If 5% candidates never won, the markets would be broken.\"\n\nOdds and prediction market platforms do not use methodologies used by traditional political polling, and therefore are not substitutes for political polls.\n\nUnlike prediction market odds, which pointed to a clear Bolsonaro victory, political polls showed a tight race in the days leading up to the contest.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 10:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Tesla stock leaves rest of the Magnificent 7 in the dust, surging to October\u2019s top spot - Yahoo Finance", "full_content": "Tesla stock leaves rest of the Magnificent 7 in the dust, surging to October\u2019s top spot Yahoo Finance Tesla-SpaceX Merger Hopes Send Bearish Ratings to 11-Year Low Bloomberg.com Tesla Stock Jumps on Buy Upgrade. Why It Can Surge 20%. Barron's Cantor Fitzgerald reiterates Tesla stock rating on strong cash flow Investing.com Tesla Stock, Upgraded On SpaceX Prospects, Moves Into A Buy Zone Investor's Business Daily", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 10:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Chip Stocks Push Nasdaq On Course To One-Month High On Anthropic IPO Buzz: Nvidia, Micron Lead Gains", "full_content": "US stocks rallied as Anthropic\u2019s IPO filing revived enthusiasm for artificial intelligence shares, lifting the Nasdaq Composite 1% to a one-month high.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 10:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Is it curtains for COLA? Saving Social Security coul     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
