ins after drug shows sustained blood pressure cuts", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 10:59 PM IST", "pub_date_relative": "13m ago"}, {"title": "Danaher at UBS Global Healthcare Conference: growth plan takes shape", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 10:58 PM IST", "pub_date_relative": "14m ago"}, {"title": "Google says new Australian internet safety bill could cut off under-18s from Gmail", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 10:54 PM IST", "pub_date_relative": "18m ago"}, {"title": "US opens probe into Waymo vehicles over school bus safety violations", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Nov 2026, 10:54 PM IST", "pub_date_relative": "18m ago"}, {"title": "Received cash from customers and deposited it in your bank account? When can income tax authorities tax it", "full_content": "An insurance agent who deposited over \u20b9 35 lakh in cash during demonetisation won an income-tax dispute after the Income Tax Appellate Tribunal (ITAT), Jaipur, accepted that the money represented premiums collected from policyholders and not his unexplained income.\n\nIn Surendra Kumar Sharma vs Income Tax Officer, the tribunal, in an order dated 1 October 2026, directed the tax department to delete an addition of \u20b9 35,08,550 made under Section 69A of the Income-tax Act, 1961.\n\nThe dispute arose after the tax department questioned cash deposits made by Sharma, a general insurance commission agent from Rajasthan, during the demonetisation period in assessment year 2017-18. Sharma maintained that the money belonged to customers who had paid their insurance premiums in cash and that he had deposited the collections into his bank account before transferring them to insurance companies.\n\nThe assessing officer, however, treated the deposits as unexplained money. The Commissioner of Income Tax (Appeals), or CIT(A), upheld the addition, prompting Sharma to approach the Jaipur bench of the ITAT.\n\nThe tax authorities raised two main objections to Sharma's explanation.\n\nFirst, some of the insurance policies submitted as evidence named other individuals as agents instead of Sharma. The department questioned how he could claim to have collected the premiums when his name did not appear on the policy documents.\n\nSecond, the authorities questioned his failure to establish that the cash collected from policyholders during demonetisation specifically included the specified bank notes (SBNs), or the withdrawn \u20b9 500 and \u20b9 1,000 currency notes, which were found deposited in his bank account.\n\nSharma explained that he had entered into commission-sharing arrangements with agents representing other insurance companies.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 10:53 PM IST", "pub_date_relative": "19m ago"}, {"title": "Jim Cramer says this is the stock to buy as data center development slows", "full_content": "Jim Cramer says a slowdown in data center construction gives Amazon an edge.", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 10:52 PM IST", "pub_date_relative": "20m ago"}, {"title": "There is no one at Nvidia who would be ready to replace Jensen Huang", "full_content": "Nvidia\u2019s CEO has an \u201coutsize role and unclear succession.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "09 Nov 2026, 10:51 PM IST", "pub_date_relative": "22m ago"}, {"title": "Nvidia's CEO turmoil gives newly empowered Democrats fresh ammunition in pursuit of oversight", "full_content": "Nvidia CEO Jensen Huang's close ties to the U.S. government were already poised to loosen with Democrats winning control of Congress and promising far more oversight of AI development than what the chip giant has experienced under Republican leadership.\n\nThat was before he admitted on Sunday to having an extramarital affair .\n\nThe CEO was romantically involved with Alice Huang, according to The Financial Times , who U.S. intelligence officials believe is a spy for China's Ministry of State Security, The New York Times reported. Alice Huang is also affiliated with an Nvidia customer called Megaspeed that's been accused of helping restricted Chinese companies acquire Nvidia's artificial intelligence chips.\n\nHuang apologized to staffers in a note on Sunday for being \"unfaithful to my wife,\" and said the company's board was investigating any related national security concerns. Nvidia's board said it has \"confidence in Jensen,\" who co-founded the company in 1993 and has led it ever since, building a net worth of more than $150 billion in the process.\n\nEven before last week's midterm elections , which saw Democrats win sweeping majorities in the House and Senate, vocal party leaders wanted answers from Huang about China's access to advanced Nvidia chips and his company's lobbying for favorable legislation. Sen. Elizabeth Warren of Massachusetts said days before the election, when the spy story was first surfacing , that \"we must pass bipartisan legislation to keep our advanced AI technology out of China's hands.\" Months before that, in June, Huang declined an invitation from Warren to testify before the Senate Banking Committee.\n\nDemocratic House leader Hakeem Jeffries of New York, who is the presumed speaker of the House in the new Congress, told CBS News on Monday that it is \"a significant issue of concern.\"\n\nJeffries said there is a classified briefing with White House officials later Monday, and he expects the Nvidia CEO's affair to be discussed.", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 10:35 PM IST", "pub_date_relative": "37m ago"}, {"title": "Trump administration's embrace of \"perp\" futures sets off risk alarms for Wall Street stalwarts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache supermarket fridge hacking - BBC", "full_content": "France accuses Iran of supermarket fridge hacking BBC France blames Iran for \u2018unprecedented\u2019 supermarket fridge cyberattack CNN Perhaps Connecting Fridges to the Internet Was a Bad Idea The Atlantic EXCLUSIVE: French officials accuse Iran of being behind refrigerator hacks Reuters France accuses Iran of cyberattack on European fridges Al Jazeera", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 10:25 PM IST", "pub_date_relative": "48m ago"}, {"title": "AMD stock rallies 12% as Google Cloud taps its EPYC processors for next-generation AI infrastructure", "full_content": "A Ksheerasagar Published 9 Nov 2026, 10:24 PM IST Prefer Livemint on Google Shares of Advanced Micro Devices (AMD) extended their recovery for a second consecutive session on Monday, November 9, surging 12.5% to an intraday high of $504.80 apiece.\n\nThe rally came after the Nvidia rival announced that its fifth-generation EPYC server processors would power Alphabet's Google Cloud TPU 8tx systems.\n\nThe collaboration brings together AMD's EPYC central processing units (CPUs), Infinity Guard security capabilities, and x86 software compatibility with Google's TPU AI acceleration technology, as per company's release.\n\nThe partnership is aimed at helping enterprises deploy sensitive AI workloads, including inference, fine-tuning, and reinforcement learning, in the cloud while maintaining data protection.\n\nThe announcement comes as technology companies increasingly invest in specialised AI infrastructure to support the growing demand for advanced AI models and applications.\n\nUnder the deployment, AMD said that it fifth-generation EPYC processors will manage workload orchestration, data preparation, and high-throughput communication with Google's TPU accelerators. The system uses AMD's Secure Encrypted Virtualization (SEV) technology alongside Google's TPU architecture to extend confidential computing protection beyond the CPU to connected accelerators.\n\nThis allows sensitive information, including customer prompts, model weights, and intermediate data, to remain protected while being processed and transferred between the host processors and accelerators.\n\nDan McNamara, senior vice president and general manager of Compute and Enterprise AI at AMD, said the most capable AI systems require a CPU foundation that can match the performance demands of the accelerators they support.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 10:24 PM IST", "pub_date_relative": "48m ago"}, {"title": "Earth's Heat Imbalance Hits Record High: How Supersized El Nino Risks Global Climate Through 2027", "full_content": "Global temperatures averaged 1.47\u00b0C above pre-industrial levels during January-September; intensifying El Ni\u00f1o could drive further warming into 2027", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 10:23 PM IST", "pub_date_relative": "49m ago"}, {"title": "This software stock is bucking the latest tech rout and breaking out", "full_content": "Unity Software shares surged following earnings, signaling a potential turnaround. Here's where the charts suggest the stock could head next.", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 10:20 PM IST", "pub_date_relative": "52m ago"}, {"title": "Trump\u2019s tech allies face a revolt from within their own industry - The Washington Post", "full_content": "Trump\u2019s tech allies face a revolt from within their own industry The Washington Post Elon Musk and the tech bros banked on Trump and lost. Humbled, humiliated: what will they do next? | Jonathan Liew The Guardian Tech Billionaires Face Tricky Political Waters After Democratic Midterm Sweep The New York Times Jennifer O'Connell: Silicon Valley\u2019s tech bros bet everything on Trump. What will they do now? The Irish Times How a blue wave crushed the tech right LinkedIn", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 10:20 PM IST", "pub_date_relative": "52m ago"}, {"title": "Carney Recruits Bridgewater Co-CIO to Run Canada Sovereign Wealth Fund - Bloomberg.com", "full_content": "Carney Recruits Bridgewater Co-CIO to Run Canada Sovereign Wealth Fund Bloomberg.com Karniol-Tambour to leave Bridgewater to lead Canada's sovereign fund Reuters Ottawa taps Bridgewater executive to lead sovereign wealth fund The Globe and Mail Canada Taps Senior Bridgewater Executive to Run Sovereign Wealth Fund WSJ The Canada Strong Fund wants your investment dollars \u2014 but is it a green choice? Canada's National Observer", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 10:15 PM IST", "pub_date_relative": "57m ago"}, {"title": "Google Expands Gen-8 Lineup With TPU 8tx, 8i Max: How This Targets AI Agent Workloads", "full_content": "Google's latest AI chips target secure computing and memory-intensive workloads as businesses increasingly deploy autonomous AI agents, strengthening its push against Nvidia.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 10:13 PM IST", "pub_date_relative": "59m ago"}, {"title": "Honda to invest $3 billion in new vehicle assembly plant in Ohio", "full_content": "MARYSVILLE, Ohio \u2014 Honda Motor plans to invest $3 billion to build a new vehicle assembly plant in Ohio, the automaker announced Monday.\n\nHonda said the new plant, which will be near its other facilities in Marysville, Ohio, is expected to begin production in 2029, have a capacity for 240,000 vehicles annually and create more than 2,000 jobs.\n\nThe facility is expected to be capable of producing traditional vehicles with internal combustion engines, all-electric vehicles and hybrid models, which have been growing in popularity in the U.S.\n\nThe plant is expected to increase Honda's light-duty vehicle capacity to 1.3 million units annually in the U.S. It currently has 12 manufacturing plants in United States, eight of which produce engines or light-duty vehicles for the auto industry.\n\nIt's the company's first new mass production U.S. vehicle assembly plant since it opened a facility in Indiana in 2008. It also opened a $70 million performance vehicle facility in 2016 and a multibillion-dollar joint venture battery plant earlier this year, both in Ohio.\n\n\"This is not simply an investment in another plant. It is an investment in the future of Honda manufacturing in America,\" Bob Nelson, executive vice president of American Honda Motor, said during the announcement at the company's U.S. heritage center in Ohio.\n\nThe auto industry has been trying to localize more production amid President Donald Trump 's tariffs and inflated logistics costs that have cut into profits.\n\nHonda's plans for a new plant come roughly two weeks after Volkswagen-owned luxury brand Audi announced it would invest more than $4 billion in its first U.S. manufacturing facility in Georgia.", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 10:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "These stocks on Josh Brown's list got washed out in last week's sell-off. Where to go from here", "full_content": "Last week was one of the wildest market moments we've seen in a long time, said the CEO of Ritholtz Wealth Management.", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 10:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Russia rations petrol after new Ukrainian strikes on refineries", "full_content": "State-owned Rosneft limits sales to 30 litres per car in cities and 50 litres on highways", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 10:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Parag Parikh Flexi Cap adds Netflix, exits Meta: What changed in its October portfolio? Check latest stock picks", "full_content": "Parag Parikh Flexi Cap Fund made notable changes to its domestic and international stock portfolios in October 2026, adding Netflix as a new investment, exiting Meta Platforms and reducing its exposure to Microsoft. The fund also increased its holdings in several Indian companies, including DLF, Maruti Suzuki, Mahindra & Mahindra, Indus Towers and Petronet LNG.\n\nThe changes are significant for investors tracking one of India's largest actively managed flexi-cap mutual funds. The fund's October portfolio also offers a snapshot of its investment strategy. Large-cap stocks accounted for 67.22% of its domestic equity allocation, while mid-cap and small-cap stocks made up 8.43% and 5.50%, respectively.\n\nNetflix was the fund's biggest new addition. It accounted for 3.06% of the fund's assets under management (AUM) at the end of October.\n\nAmong Indian stocks, DLF saw the largest increase in allocation , with its weight rising by 0.88 percentage points compared with September. The fund also raised its exposure to Maruti Suzuki by 0.29 percentage points and Mahindra & Mahindra by 0.25 percentage points.\n\nIndus Towers and Petronet LNG saw their allocations increase by 0.24 and 0.21 percentage points, respectively.\n\nOther additions included Mahanagar Gas , Coal India , Indraprastha Gas and EID Parry.\n\nThe fund completely exited Meta Platforms, which had accounted for 2.80% of AUM in the October portfolio-change disclosure.\n\nIt also reduced its Microsoft holding, with the reduction equivalent to 1.05% of AUM.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 10:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil prices hit 10-week low after Trump says strikes on Iran \u2018highly unlikely\u2019", "full_content": "Brent crude extended last week\u2019s losses that followed Republicans\u2019 historic midterms defeat", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 10:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia live updates: Nvidia stock falls 5% as board investigates CEO's affair with alleged Chinese spy - Yahoo Finance", "full_content": "Nvidia live updates: Nvidia stock falls 5% as board investigates CEO's affair with alleged Chinese spy Yahoo Finance Nvidia shares fall after investigation into CEO's relationship with alleged Chinese spy Fox Business Analysts say Nvidia CEO unlikely to be ousted over affair, but raise questions about company's future Yahoo Finance Nvidia is in peril. Can it survive without Jensen Huang? CNN Nvidia's investigation into CEO Huang's affair puts a spotlight on chip billionaire's personal life AP News", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 10:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why renters are obsessed with these $300 \u2018boneless couches\u2019", "full_content": "Black Friday could be the perfect time to buy one.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Nov 2026, 09:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Lakhs Of Points Gone Overnight: Amex Cardholders Allege Retroactive Rewards Clawback", "full_content": "Amex India has removed points linked to cancelled cards, citing a technical issue. Cardholders question the clawback of rewards held in pooled accounts.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fund manager Nick Train has best month since 2000 on back of AI market rout", "full_content": "Stockpicker hopes his investment strategy is past its \u2018nadir\u2019 after bruising few years", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 09:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Hardik Pandya-Arshdeep Singh Trade: Abhinav Mukund Questions PBKS' Move, Raises Shreyas Factor", "full_content": "Hardik has captained Mumbai Indians over the last three IPL seasons, but his potential move to Punjab could see him take up a different role.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Planning a big wedding? One unexpected event could derail it; can insurance save the day? All you need to know", "full_content": "Indians are known for having big, lavish weddings, with families often spending huge amounts on venues, catering, decorations, jewellery and other arrangements. However, an unforeseen event such as a natural disaster, fire or sudden cancellation of a function can disrupt months of planning.\n\nIn some cases, an incident could also result in physical damage or theft of valuables during the celebrations. Since people often save for years to finance their own or their children's big day, it's better to have a fallback plan.\n\nTo protect yourself from events beyond your control, individuals can consider wedding insurance , which covers certain financial losses arising from the above-mentioned risks. However, before purchasing a policy, you should understand its coverage, premium costs and limitations.\n\nA wedding insurance plan covers heavy expenses incurred either due to wedding cancellation or any other damage, according to a blog post by Paisabazaar . The policy classifies different situations under the following categories:\n\nA wedding insurance plan also offers coverage in case of cancellation or loss due to fire, theft or burglary. In such cases, you can recover the advance amount paid for catering services, wedding venue, travel agencies and hotel bookings.\n\nThe policy can also cover printing cost of wedding invitation cards and expenses incurred for venue decoration and wedding set, depending on the insurer's offerings and the plan's terms and conditions.\n\nAlthough wedding insurance covers several risks, there are certain limitations. According to blog post, policyholders cannot make a claim in these cases:\n\nPolicyholders must note that wedding cancellations are only covered by the insurance policy if they happen due to unforeseen emergencies outside of your control, such as severe illness, injury, or hospitalisation of the bride, groom or their immediate family member, extreme weather etc.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 09:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "US dollar dips as easing AI and Mideast worries limit its appeal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a US dollar dips as easing AI and Mideast worries limit its appeal The Economic Times daily newspaper is available online now. Read Today's Paper US dollar dips as easing AI and Mideast worries limit its appeal SECTIONS US dollar dips as easing AI and Mideast worries limit its appeal By Reuters Last Updated: Nov 09, 2026, 09:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis After a six-month high, the US dollar is now on a downward trend, largely spurred by impressive job growth figures. Investors are eagerly awaiting the upcoming consumer price index data, a key factor for Federal Reserve rate considerations. Meanwhile, the euro and other currencies are rebounding against the dollar, backed by solid economic indicators.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 09:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Buy, Sell Or Hold: Divi's Labs, Tata Power, Kalyan Jewellers, Reliance Industries, L&T And Shriram Finance \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including Divi's Labs, Tata Power, Kalyan Jewellers, Relaince and L&T.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anjali Anand Recalls Her Shah Rukh Khan Obsession: 'I Had A Whole Chapter Om Shanti Om Rough Book'", "full_content": "Anjali Anand spoke about her childhood love for cinema, her early ambitions and her journey in the entertainment industry.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks rebound after AI rout", "full_content": "Lower oil prices help equity indices shrug off fall in Nvidia shares", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 09:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Commerce Dept. Chip Inquiry Was Halted After Nvidia Intervention - The New York Times", "full_content": "Commerce Dept. Chip Inquiry Was Halted After Nvidia Intervention The New York Times Nvidia intervention preceded transfer of chip probe to Justice Department Investing.com Commerce Dept. inquiry into chips transferred to DOJ after Nvidia intervention: report TradingView Midday Need to Know: Megaspeed inquiry, NVDA's robotic model and tools, and more (SP500:) Seeking Alpha US Commerce Probe Into Megaspeed Halted After Nvidia Intervened: Report NDTV Profit", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 09:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "People are paying thousands for a home upgrade that\u2019s often unnecessary - The Washington Post", "full_content": "People are paying thousands for a home upgrade that\u2019s often unnecessary The Washington Post", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 09:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018It seems bizarre\u2019: We\u2019re in our 80s with $950,000 in traditional IRAs. Why is our adviser pushing Roth conversions?", "full_content": "\u201cOur basic living expenses are covered by $110,000 in annual pensions and Social Security.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "09 Nov 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves in early trading: Nvidia, AMD, Eli Lilly, cruise lines \u2014 Live updates", "full_content": "The stock market is kicking off the week on a strong note following a losing week. That wasn't the case for every name, however.\n\nNvidia fell in early trading after CEO Jensen Huang admitted to having a relationship with an alleged Chinese spy. But despite Nvidia's declines, other semiconductor names held up well in early trading.\n\nFollow below as CNBC breaks down the biggest stock market moves of the day:\n\nEnergy stocks are falling as oil prices retreat from recent highs.\n\nOil prices fell Monday after President Donald Trump said Sunday that renewed strikes on Iran were \"highly unlikely\" if negotiations made progress.\n\nImproving prospects for Middle East diplomacy could reduce fears of supply disruptions, reducing some of the geopolitical risks priced into crude. U.S. West Texas Intermediate futures dropped 3% to around $87 per barrel. International benchmark Brent slid 4% to about $94 per barrel.\n\nOil futures price trend Energy stocks have faced broader selling pressure as oil prices retreat. Stocks of Exxon Mobil, Chevron , ConocoPhillips , Occidental Petroleum and EOG Resources fell in intraday trading. Sustained declines in crude prices could potentially reduce future revenue and cash-flow expectations for energy companies.\n\nInvestors are also watching Constellation Energy , NRG Energy and Occidental Petroleum on Monday, followed by financial results from Venture Global , Petrobras and Ecopetrol on Tuesday. Outlooks from these companies could provide fresh clues around oil and gas prices, supply and overall shareholder returns.", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 09:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "What is Megaspeed? The Nvidia chip buyer in the spotlight after Jensen Huang\u2019s affair", "full_content": "Singapore-based cloud computing company Megaspeed is in the international spotlight after Nvidia CEO Jensen Huang admitted to being unfaithful to his wife, following reports linking him to Megaspeed executive Alice Huang.\n\nU.S. intelligence officials believe she is a Chinese intelligence asset, according to The New York Times.\n\nWhile the Nvidia CEO \u2014 one of the world's most prominent executives and a figurehead of the AI industry \u2013 did not name Megaspeed or Alice Huang in his statement, he acknowledged his infidelity and said Nvidia's Board of Directors had begun an independent investigation \"regarding the national security concerns raised in news reports.\"\n\n\"I support the investigation and will cooperate fully. I love our country and our company. I am committed to protecting NVIDIA and supporting America's national security. I am proud and grateful to be an American,\" he said.\n\nNvidia said in a statement it had \"no reason to believe that either national security or NVIDIA secrets were compromised,\" but that its \"Board's inquiry will examine all available information.\"\n\nTech darling Nvidia sells advanced AI and data center chips and has customers including Microsoft , Amazon , Google , Meta and Oracle . The explosion in AI adoption in recent years has fueled its stock and pushed it to a $5 trillion market cap earlier this year.\n\nMegaspeed sells services to Asia Pacific-based companies that need large amounts of computing capacity, usually for AI projects, by selling access to computing resources hosted in data centers in Southeast Asia.\n\nIt advertises itself as a \"core business partner\" of Nvidia's computing power cloud business in the region, allowing customers to rent computing power from Nvidia GPUs, or \"graphics processing units\" \u2014 specialized chips designed to do many calculations at the same time.", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 09:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks Climb as Buyers Step In Despite Nvidia Woes: Markets Wrap - Bloomberg.com", "full_content": "Stocks Climb as Buyers Step In Despite Nvidia Woes: Markets Wrap Bloomberg.com Dow rallies 1,000 points, Nasdaq jumps 2% as stocks climb out of postelection slump: Live updates CNBC Wall Street rallies after last week\u2019s AI rout; Nvidia falls Honolulu Star-Advertiser Stock market today: Dow, S&P 500, Nasdaq futures rise with Nvidia stock, AI trade in focus Yahoo Finance US stocks rally and recover more of last week\u2019s losses as oil prices swing lower AP News", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 09:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kumar Vishwas Thanks Ramayana Team, Says Being Part Of Film Is A 'Blessing Beyond Words'", "full_content": "The poet and lyricist thanked producer Namit Malhotra, director Nitesh Tiwari, AR Rahman and Hans Zimmer for giving him the opportunity to contribute to the film.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "A Peek Into Vijay Deverakonda, Rashmika Mandanna's Family Holiday In Japan", "full_content": "Vijay Deverakonda and Rashmika Mandanna celebrated their first Diwali after marriage in Japan, enjoying a family holiday with Vijay's parents and brother Anand Deverakonda.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:22 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Dow rallies 1,000 points, Nasdaq jumps 2% as stocks climb out of postelection slump: Live updates", "full_content": "Stocks surged on Monday, boosted by a decline in oil prices as well as gains in technology shares after last week's volatility.\n\nThe Dow Jones Industrial Average popped 1,001 points, or 2%, supported by gains in stocks such as Goldman Sachs and Caterpillar . The S&P 500 rose 2.4%, while the Nasdaq Composite gained 2.7%.\n\nWith Monday's rally, the Dow is now above the level it closed on Election Day. The S&P 500 and tech-heavy Nasdaq still remain slightly below, however.\n\nOil prices fell on Monday, lifting investor sentiment. U.S. West Texas Intermediate futures dropped 3% to around $87 per barrel. International benchmark Brent slid 4% to about $94 per barrel.\n\nFriday's market partially rebounded from Thursday's brutal AI-driven sell-off, as chip stocks recovered on renewed buying. However, concerns linger in the wake of the Democrats' strong midterm results, with investors fearing that tighter regulations on data center construction, energy use, and development costs could slow the AI infrastructure boom .\n\nThe tech sector also focused on the bombshell announcement Sunday that Nvidia's board of directors is opening an investigation into co-founder and CEO Jensen Huang's relationship with a businesswoman who U.S. intelligence agencies say is a Chinese spy. Nvidia shares were last down 6%.\n\n\"Magnificent Seven\" names were higher contrary to Nvidia. Amazon gained 5%, while Tesla and Alphabet climbed more than 3%. Microsoft added 2%.\n\nOther chip stocks advanced as well, with Broadcom and Advanced Micro Devices each popping 5%. The iShares Semiconductor ETF (SOXX) \u2014 which dropped around 13% last week \u2014 rose more than 6%.", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 11:03 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "We're adding a consumer stock to diversify beyond the volatile AI trade", "full_content": "We wanted to add a less cyclical company with a cheap valuation and that consistently returns capital to its shareholders.", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 11:01 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump questions midterm election results, revives voting-machine conspiracy", "full_content": "President Donald Trump on Monday questioned the legitimacy of the midterm election results, resurrecting his pattern of raising doubts about electoral losses for himself and other Republicans .\n\nTrump's social media post raising questions about the election came six days after his fellow Republicans suffered historic defeats at the polls nationwide, including in several GOP strongholds like Texas and South Carolina .\n\n\"Does anybody really believe that this 'Election' was honest,\" Trump wrote on Truth Social.\n\n\"How could the Polls be so wrong??? Some early voting 'dumps' were so large that it was impossible to win, no matter how many people went to vote,\" the president said. \"It's all about the machines, which are far more important than the voter!\"\n\nTrump's post was a sharp pivot from what has been a conciliatory tone after last Tuesday's thumping of Republican candidates, which resulted in Democrats regaining majorities in both the Senate and House of Representatives.\n\nOn Election Night, Trump told The New York Times that he was \"absolutely willing\" to accept the results of the midterms, and that he was willing to work with Democrats.\n\n\"We'll, you know, look forward to working with them,\" Trump told The Times. \"We'll probably work something out.\"\n\nThe next day, Trump said, \"I'll get along probably with the Democrats unless they want to be destructive.\"", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 11:01 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump administration's embrace of \"perp\" futures sets off risk alarms for Wall Street stalwarts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Trump administration's embrace of \"perp\" futures sets off risk alarms for Wall Street stalwarts Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Trump administration's embrace of \"perp\" futures sets off risk alarms for Wall Street stalwarts SECTIONS Trump administration's embrace of \"perp\" futures sets off risk alarms for Wall Street stalwarts Reuters Last Updated: Nov 09, 2026, 10:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The decision by the Trump administration to launch perpetual futures has sparked significant worry among market stakeholders. Leaders from established exchanges contend that these offerings might disrupt existing market dynamics and risk assessment practices. They claim that perpetual futures ought to be categorized as swaps due to their unique trading characteristics. Moreover, ongoing trading raises alarm about liquidity and counterparty risk, especially in turbulent market conditions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 10:28 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AMD stock rallies 12% as Google Cloud taps its EPYC processors for next-generation AI infrastructure", "full_content": "A Ksheerasagar Published 9 Nov 2026, 10:24 PM IST Prefer Livemint on Google Shares of Advanced Micro Devices (AMD) extended their recovery for a second consecutive session on Monday, November 9, surging 12.5% to an intraday high of $504.80 apiece.\n\nThe rally came after the Nvidia rival announced that its fifth-generation EPYC server processors would power Alphabet's Google Cloud TPU 8tx systems.\n\nThe collaboration brings together AMD's EPYC central processing units (CPUs), Infinity Guard security capabilities, and x86 software compatibility with Google's TPU AI acceleration technology, as per company's release.\n\nThe partnership is aimed at helping enterprises deploy sensitive AI workloads, including inference, fine-tuning, and reinforcement learning, in the cloud while maintaining data protection.\n\nThe announcement comes as technology companies increasingly invest in specialised AI infrastructure to support the growing demand for advanced AI models and applications.\n\nUnder the deployment, AMD said that it fifth-generation EPYC processors will manage workload orchestration, data preparation, and high-throughput communication with Google's TPU accelerators. The system uses AMD's Secure Encrypted Virtualization (SEV) technology alongside Google's TPU architecture to extend confidential computing protection beyond the CPU to connected accelerators.\n\nThis allows sensitive information, including customer prompts, model weights, and intermediate data, to remain protected while being processed and transferred between the host processors and accelerators.\n\nDan McNamara, senior vice president and general manager of Compute and Enterprise AI at AMD, said the most capable AI systems require a CPU foundation that can match the performance demands of the accelerators they support.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 10:24 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "This software stock is bucking the latest tech rout and breaking out", "full_content": "Unity Software shares surged following earnings, signaling a potential turnaround. Here's where the charts suggest the stock could head next.", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 10:20 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Carney Recruits Bridgewater Co-CIO to Run Canada Sovereign Wealth Fund - Bloomberg.com", "full_content": "Carney Recruits Bridgewater Co-CIO to Run Canada Sovereign Wealth Fund Bloomberg.com Karniol-Tambour to leave Bridgewater to lead Canada's sovereign fund Reuters Ottawa taps Bridgewater executive to lead sovereign wealth fund The Globe and Mail Canada Taps Senior Bridgewater Executive to Run Sovereign Wealth Fund WSJ The Canada Strong Fund wants your investment dollars \u2014 but is it a green choice? Canada's National Observer", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 10:15 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "These stocks on Josh Brown's list got washed out in last week's sell-off. Where to go from here", "full_content": "Last week was one of the wildest market moments we've seen in a long time, said the CEO of Ritholtz Wealth Management.", "source": "CNBC Top News", "pub_date_str": "09 Nov 2026, 10:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Parag Parikh Flexi Cap adds Netflix, exits Meta: What changed in its October portfolio? Check latest stock picks", "full_content": "Parag Parikh Flexi Cap Fund made notable changes to its domestic and international stock portfolios in October 2026, adding Netflix as a new investment, exiting Meta Platforms and reducing its exposure to Microsoft. The fund also increased its holdings in several Indian companies, including DLF, Maruti Suzuki, Mahindra & Mahindra, Indus Towers and Petronet LNG.\n\nThe changes are significant for investors tracking one of India's largest actively managed flexi-cap mutual funds. The fund's October portfolio also offers a snapshot of its investment strategy. Large-cap stocks accounted for 67.22% of its domestic equity allocation, while mid-cap and small-cap stocks made up 8.43% and 5.50%, respectively.\n\nNetflix was the fund's biggest new addition. It accounted for 3.06% of the fund's assets under management (AUM) at the end of October.\n\nAmong Indian stocks, DLF saw the largest increase in allocation , with its weight rising by 0.88 percentage points compared with September. The fund also raised its exposure to Maruti Suzuki by 0.29 percentage points and Mahindra & Mahindra by 0.25 percentage points.\n\nIndus Towers and Petronet LNG saw their allocations increase by 0.24 and 0.21 percentage points, respectively.\n\nOther additions included Mahanagar Gas , Coal India , Indraprastha Gas and EID Parry.\n\nThe fund completely exited Meta Platforms, which had accounted for 2.80% of AUM in the October portfolio-change disclosure.\n\nIt also reduced its Microsoft holding, with the reduction equivalent to 1.05% of AUM.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 10:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Nvidia live updates: Nvidia stock falls 5% as board investigates CEO's affair with alleged Chinese spy - Yahoo Finance", "full_content": "Nvidia live updates: Nvidia stock falls 5% as board investigates CEO's affair with alleged Chinese spy Yahoo Finance Nvidia shares fall after investigation into CEO's relationship with alleged Chinese spy Fox Business Analysts say Nvidia CEO unlikely to be ousted over affair, but raise questions about company's future Yahoo Finance Nvidia is in peril. Can it survive without Jensen Huang? CNN Nvidia's investigation into CEO Huang's affair puts a spotlight on chip billionaire's personal life AP News", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 10:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Planning a big wedding? One unexpected event could derail it; can insurance save the day? All you need to know", "full_content": "Indians are known for having big, lavish weddings, with families often spending huge amounts on venues, catering, decorations, jewellery and other arrangements. However, an unforeseen event such as a natural disaster, fire or sudden cancellation of a function can disrupt months of planning.\n\nIn some cases, an incident could also result in physical damage or theft of valuables during the celebrations. Since people often save for years to finance their own or their children's big day, it's better to have a fallback plan.\n\nTo protect yourself from events beyond your control, individuals can consider wedding insurance , which covers certain financial losses arising from the above-mentioned risks. However, before purchasing a policy, you should understand its coverage, premium costs and limitations.\n\nA wedding insurance plan covers heavy expenses incurred either due to wedding cancellation or any other damage, according to a blog post by Paisabazaar . The policy classifies different situations under the following categories:\n\nA wedding insurance plan also offers coverage in case of cancellation or loss due to fire, theft or burglary. In such cases, you can recover the advance amount paid for catering services, wedding venue, travel agencies and hotel bookings.\n\nThe policy can also cover printing cost of wedding invitation cards and expenses incurred for venue decoration and wedding set, depending on the insurer's offerings and the plan's terms and conditions.\n\nAlthough wedding insurance covers several risks, there are certain limitations. According to blog post, policyholders cannot make a claim in these cases:\n\nPolicyholders must note that wedding cancellations are only covered by the insurance policy if they happen due to unforeseen emergencies outside of your control, such as severe illness, injury, or hospitalisation of the bride, groom or their immediate family member, extreme weather etc.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 09:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US dollar dips as easing AI and Mideast worries limit its appeal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a US dollar dips as easing AI and Mideast worries limit its appeal The Economic Times daily newspaper is available online now. Read Today's Paper US dollar dips as easing AI and Mideast worries limit its appeal SECTIONS US dollar dips as easing AI and Mideast worries limit its appeal By Reuters Last Updated: Nov 09, 2026, 09:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis After a six-month high, the US dollar is now on a downward trend, largely spurred by impressive job growth figures. Investors are eagerly awaiting the upcoming consumer price index data, a key factor for Federal Reserve rate considerations. Meanwhile, the euro and other currencies are rebounding against the dollar, backed by solid economic indicators.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 09:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Buy, Sell Or Hold: Divi's Labs, Tata Power, Kalyan Jewellers, Reliance Industries, L&T And Shriram Finance \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including Divi's Labs, Tata Power, Kalyan Jewellers, Relaince and L&T.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Commerce Dept. Chip Inquiry Was Halted After Nvidia Intervention - The New York Times", "full_content": "Commerce Dept. Chip Inquiry Was Halted After Nvidia Intervention The New York Times Nvidia intervention preceded transfer of chip probe to Justice Department Investing.com Commerce Dept. inquiry into chips transferred to DOJ after Nvidia intervention: report TradingView Midday Need to Know: Megaspeed inquiry, NVDA's robotic model and tools, and more (SP500:) Seeking Alpha US Commerce Probe Into Megaspeed Halted After Nvidia Intervened: Report NDTV Profit", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 09:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks making the biggest moves in early trading: Nvidia, AMD, Eli Lilly, cruise lines \u2014 Live updates", "full_content": "The stock market is kicking off the week on a strong note following a losing week. That wasn't the case for every name, however.\n\nNvidia fell in early trading after CEO Jensen Huang admitted to having a relationship with an alleged Chinese spy. But despite Nvidia's declines, other semiconductor names held up well in early trading.\n\nFollow below as CNBC breaks down the biggest stock market moves of the day:\n\nEnergy stocks are falling as oil prices retreat from recent highs.\n\nOil prices fell Monday after President Donald Trump said Sunday that renewed strikes on Iran were \"highly unlikely\" if negotiations made progress.\n\nImproving prospects for Middle East diplomacy could reduce fears of supply disruptions, reducing some of the geopolitical risks priced into crude. U.S. West Texas Intermediate futures dropped 3% to around $87 per barrel. International benchmark Brent slid 4% to about $94 per barrel.\n\nOil futures price trend Energy stocks have faced broader selling pressure as oil prices retreat. Stocks of Exxon Mobil, Chevron , ConocoPhillips , Occidental Petroleum and EOG Resources fell in intraday trading. Sustained declines in crude prices could potentially reduce future revenue and cash-flow expectations for energy companies.\n\nInvestors are also watching Constellation Energy , NRG Energy and Occidental Petroleum on Monday, followed by financial results from Venture Global , Petrobras and Ecopetrol on Tuesday. Outlooks from these companies could provide fresh clues around oil and gas prices, supply and overall shareholder returns.", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 09:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What is Megaspeed? The Nvidia chip buyer in the spotlight after Jensen Huang\u2019s affair", "full_content": "Singapore-based cloud computing company Megaspeed is in the international spotlight after Nvidia CEO Jensen Huang admitted to being unfaithful to his wife, following reports linking him to Megaspeed executive Alice Huang.\n\nU.S. intelligence officials believe she is a Chinese intelligence asset, according to The New York Times.\n\nWhile the Nvidia CEO \u2014 one of the world's most prominent executives and a figurehead of the AI industry \u2013 did not name Megaspeed or Alice Huang in his statement, he acknowledged his infidelity and said Nvidia's Board of Directors had begun an independent investigation \"regarding the national security concerns raised in news reports.\"\n\n\"I support the investigation and will cooperate fully. I love our country and our company. I am committed to protecting NVIDIA and supporting America's national security. I am proud and grateful to be an American,\" he said.\n\nNvidia said in a statement it had \"no reason to believe that either national security or NVIDIA secrets were compromised,\" but that its \"Board's inquiry will examine all available information.\"\n\nTech darling Nvidia sells advanced AI and data center chips and has customers including Microsoft , Amazon , Google , Meta and Oracle . The explosion in AI adoption in recent years has fueled its stock and pushed it to a $5 trillion market cap earlier this year.\n\nMegaspeed sells services to Asia Pacific-based companies that need large amounts of computing capacity, usually for AI projects, by selling access to computing resources hosted in data centers in Southeast Asia.\n\nIt advertises itself as a \"core business partner\" of Nvidia's computing power cloud business in the region, allowing customers to rent computing power from Nvidia GPUs, or \"graphics processing units\" \u2014 specialized chips designed to do many calculations at the same time.", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 09:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks Climb as Buyers Step In Despite Nvidia Woes: Markets Wrap - Bloomberg.com", "full_content": "Stocks Climb as Buyers Step In Despite Nvidia Woes: Markets Wrap Bloomberg.com Dow rallies 1,000 points, Nasdaq jumps 2% as stocks climb out of postelection slump: Live updates CNBC Wall Street rallies after last week\u2019s AI rout; Nvidia falls Honolulu Star-Advertiser Stock market today: Dow, S&P 500, Nasdaq futures rise with Nvidia stock, AI trade in focus Yahoo Finance US stocks rally and recover more of last week\u2019s losses as oil prices swing lower AP News", "source": "Google News Business", "pub_date_str": "09 Nov 2026, 09:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia investigates CEO Jensen Huang's relationship with alleged Chinese spy", "full_content": "Nvidia has opened an investigation into co-founder and CEO Jensen Huang's relationship with a businesswoman who intelligence agencies say is a Chinese spy.\n\nU.S. intelligence agencies have expressed concerns that the woman, Alice Huang, who is affiliated with a cloud company and an Nvidia customer called Megaspeed, has been passing information to Beijing, according to reports in The New York Times and the Financial Times.\n\nHuang told Nvidia staff in an email on Sunday that he had an affair with the woman and that Nvidia's board of directors had opened an independent investigation into the spying allegations.\n\n\"I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did,\" Huang wrote in the message. \"I am deeply sorry.\"\n\nAn Nvidia spokesperson said that Huang was committed to continuing as CEO of Nvidia without interruption.\n\nIn a statement, the Nvidia board said it would investigate the allegations that Huang had been the target of a foreign intelligence effort.\n\n\"While the Board has no reason to believe that either national security or NVIDIA secrets were compromised, the Board's inquiry will examine all available information,\" Nvidia's board said in a statement.\n\nRead Huang's email to Nvidia employees and the company board of directors' statement here .", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 09:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US Stock Market Today: Dow, S&P Gain As Oil Cools; Barring Nvidia, All Tech Stocks Jump", "full_content": "This follows a mixed session on Friday, when Wall Street recovered some ground after Thursday's sharp technology-led sell-off. The Nasdaq Composite rose 1.09%, while the S&P 500 gained 0.31%. The Dow Jones Industrial Average, however, fell 237.33 points, or 0.46%.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wall Street bounces back from AI sell-off, Nasdaq rallies over 3%, but Nvidia plunges 9% on Jensen Huang controversy", "full_content": "US markets kicked off Monday's trade on a strong note, as Wall Street looked to recover from its worst weekly performance in nearly two years, with a drop in crude oil prices and dip-buyers stepping in to pick up beaten-down shares.\n\nThe Dow Jones Industrial Average jumped 844 points, or 1.65%. The S&P 500 rose 2%, while the Nasdaq Composite gained 3.4% at their respective intraday highs.\n\nLast week, the S&P 500 posted its biggest weekly loss since April 2025, while $2.3 trillion was wiped off the value of the Nasdaq 100 on Thursday alone, amid concerns that the Democratic Party could crack down on the AI industry after its sweeping gains in Congress.\n\nJapanese and Taiwanese equities both slipped into bear markets last week, while South Korea's two giant chipmakers, Samsung Electronics Co. and SK Hynix Inc., tumbled more than 16%. However, there was a silver lining for some of the out-of-favor markets.\n\nLast week's sell-off prompted value buyers to step in and pick up beaten-down stocks, while an extended decline in crude oil prices further supported market sentiment.\n\nBrent crude fell 4% towards $94 a barrel, extending last week's 16% decline following an unconfirmed report that Iran had made concessions on its demands over the Strait of Hormuz.\n\nCNN cited US President Donald Trump as saying on Sunday that it was \"highly unlikely\" he would order further strikes against Tehran if negotiations showed progress, although Secretary of State Marco Rubio played down the chances of a breakthrough.\n\nNvidia was the biggest drag among chip stocks, falling 9% to a seven-month low of $170 apiece, after CEO Jensen Huang admitted to having an affair with a woman identified in a series of reports as a suspected Chinese spy. The news contributed to a drop of as much as 1% in Nasdaq 100 futures at the Asian market open before the contracts reversed those losses.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 09:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold Bulls To Bounce Back? Why JPMorgan Sees Metal Touching A Record $6,000 By 2026-End", "full_content": "Stronger US labour market and uncertainty over interest rates is expected to keep the precious metal rates volatile in the near term.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:12 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nvidia shares fall as it probes alleged Chinese spy scandal", "full_content": "Board of chipmaker opens investigation after chief executive Jensen Huang admits to affair", "source": "FT Markets", "pub_date_str": "09 Nov 2026, 09:06 PM IST", "pub_date_relative": "2h ago"     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
