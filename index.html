    const allData = {"general": [{"title": "Macy's postpones Thanksgiving Day Parade due to severe weather", "full_content": "Macy's on Wednesday announced it's postponing its Thanksgiving Day Parade, originally scheduled for Thursday, due to severe weather.\n\nThe parade, held each year on Thanksgiving morning, will now take place on Saturday at 8:30 a.m. ET, according to the company. The New York City area is expected to have heavy rain and thunderstorms on Thanksgiving.\n\n\"The safety of our participants and spectators is our top priority, and after close consultation with our city and agency partners, we have made the decision to move this year's celebration,\" Macy's said in a statement.\n\nThis year's event marks the 100th Macy's Thanksgiving Day Parade. The annual event has never been canceled due to weather, though it was suspended between 1942 and 1944 for World War II.\n\nThe parade's viability this year had been in question after concerns arose over strong winds that could become dangerous for the massive balloons that the event is known for. Many of the balloons had already been inflated as of Wednesday afternoon.\n\nThe postponement also means thousands of volunteers and artists slated to perform will have to adapt to Saturday's schedule.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 03:56 AM IST", "pub_date_relative": "11m ago"}, {"title": "Moody\u2019s says Nvidia\u2019s Huang reinstatement eases uncertainty, ratings unchanged", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 03:54 AM IST", "pub_date_relative": "13m ago"}, {"title": "US Treasury financial crime watchdog hit by suspected cyber attack", "full_content": "FinCen takes systems offline after detecting unauthorised access amid growing fears over vulnerability of technology systems", "source": "FT Markets", "pub_date_str": "26 Nov 2026, 03:54 AM IST", "pub_date_relative": "13m ago"}, {"title": "US airlines face higher costs from proposed Embraer Risk Management, has put out reports since the company\u2019s initial public offering and said in an interview on Wednesday that the stock is trading at levels that should be attractive for long-term investors. Meanwhile, his colleague Felix Wang, a global tech analyst, sent out a note to clients on Tuesday, recommending they short the stock.\n\nAfter Wang published his view, Freedman took to social media to distance himself from it, saying he was \u201cnot involved in the research or process that led to that decision.\u201d\n\nWang\u2019s pessimism is predicated on the growing difficulty of financing the data centers that Anthropic relies on for computing power, along with concerns about the long-term business demand for Anthropic\u2019s models. Freedman\u2019s optimism is focused on the potential for Anthropic to become a new operating system for the business world, along with the signals of robust short-term demand. Wang sees the stock falling to $59, versus Freedman\u2019s fair value target of $92.\n\nThe opposing views within one firm illustrate the broader rifts in the market about how to value the disruptive potential of artificial intelligence and one of the key companies behind it. It also shows the divisive nature of the stock, which spiked to a valuation of $2 trillion right after it went public, before sharply pulling back.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 03:31 AM IST", "pub_date_relative": "36m ago"}, {"title": "Liesman: Why Greenspan could bet on productivity \u2014 and Warsh needs to hike", "full_content": "In a discussion on CNBC's Halftime Report Wednesday, the question came up: Why can't Federal Reserve Chairman Kevin Warsh hold the line on interest rates the way his icon Alan Greenspan did at the beginning of the dot-com era?\n\nGreenspan famously leaned against inflation hawks on his committee in 1995 and 1996, holding the line on interest rates amid strong growth, because he believed in the productivity promise of the internet revolution.\n\nIt would be nice if Warsh could follow the same playbook amid the artificial intelligence build-out and keep rates steady until the productivity arrives. Unfortunately, a quick look at the numbers shows just how different the situation is for Warsh when it comes to inflation , the magnitude of the capital-investment boom and the monetary and fiscal stimulus boosting the economy.\n\nBottom line: the Fed looks like it has to hike \u2014 and maybe substantially \u2014 to be anywhere close to the position where the Fed was in Greenspan's time at the dawn of a major technological revolution.\n\nIt may be that the massive capex spending on AI will mean more productivity and less inflation down the road. But the front-end build-out is proving to be more inflationary, and more challenging, to a Fed already dealing with high inflation. In many ways, that's the opposite of what Greenspan had to handle.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 03:26 AM IST", "pub_date_relative": "41m ago"}, {"title": "How the Trump administration determined Jensen Huang is not a national security threat - Reuters", "full_content": "How the Trump administration determined Jensen Huang is not a national security threat Reuters Vance says he was assured Jensen Huang was not under DOJ investigation CNBC Vance Defends Huang\u2019s Nvidia Return, Blames \u2018Anonymous Sources\u2019 Bloomberg The Trump team is getting more and more evasive about Jensen Huang CNN Live updates: Vance says Nvidia\u2019s CEO Jensen Huang \u2018doesn\u2019t need a pardon\u2019 NBC News", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 03:25 AM IST", "pub_date_relative": "43m ago"}, {"title": "JPMorgan Sees $450 Billion AI Debt Blitz in 2027 Before Plateau", "full_content": "(Bloomberg) -- Companies will tap public high-grade debt markets for $450 billion next year to finance their artificial intelligence-related capital expenditures, even as a growth plateau looms for the burgeoning industry further down the road, according to analysts at JPMorgan Chase & Co.\n\nThe financing would be an increase from the $368 billion of global investment grade bond issuance for AI-focused companies this year, according to the bank.\n\nOverall, AI-related capital spending will nearly double to $1.4 trillion in 2027 before leveling off in the following year, strategists led by Tarek Hamid and Nathaniel Rosenbaum wrote.\n\nThe strategists expect spending growth to slow sharply in 2028 as the industry settles into a steady run rate \u2014 a trend potentially foreshadowed by cautious commentary from Asian tech giants including Tencent and Alibaba.\n\n\u201cDue to the deceleration in overall industry growth rates, there will be a quarter in late 2027 or early 2028 when the outlook for next quarter\u2019s capital spending will be basically flat,\u201d the strategists wrote. \u201cWhether the market reacts positively or negatively to that is anyone\u2019s guess.\u201d\n\nThe shift is set to create a more predictable debt supply for credit markets even as flat spending growth risks unsettling investor sentiment, the strategists said.\n\nThe bank expects the AI industry to build 151 gigawatts of data center capacity at a cost of $7 trillion between 2027 and 2031. Since most data center projects take multiple years to build and raise capital upfront, much of 2027\u2019s buildout is already paid for, meaning \u201cfunding in 2027 is really for 2028,\u201d they wrote.\n\nIn addition to the investment-grade debt, the bank expects companies to raise $65 billion through leveraged finance and $25 billion to $35 billion in securitized products in 2027.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 03:20 AM IST", "pub_date_relative": "47m ago"}, {"title": "Stocks Swoon as AI Fears Spur Rush to Treasuries: Markets Wrap - Bloomberg", "full_content": "Stocks Swoon as AI Fears Spur Rush to Treasuries: Markets Wrap Bloomberg Dow closes higher Wednesday, wiping out 1,100-point loss in stunning rebound: Live updates CNBC Stocks Slump Again as Investors Fret About A.I., Tariffs and Inflation The New York Times Stock market today: Dow erases losses to end positive, S&P 500 and Nasdaq recover ground amid AI sell-off Yahoo Finance Moody's says Nvidia's Huang reinstatement eases uncertainty, ratings unchanged Reuters", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 03:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bullish hopes spring as traders bet against a higher VIX: Options Action Live", "full_content": "With stocks mounting a comeback Wednesday, options trading across a few key volatility products suggests big swings in stocks may dampen in the near term.\n\nMore than 80,000 options traded on the Barclays S&P 500 VIX Short Term Futures ETN (VXX) , almost three times the 30-day average, with more puts trading than calls, according to LiveVol data. The fund aims to track the moves in Cboe's VIX Index , which surged to 35 early Wednesday but slipped to below 28 as the S&P 500 rallied to within 25 basis points of unchanged.\n\nAt the same time, options volume on VIX itself was 50% above average, with an even more distinctive bias towards puts, suggesting traders see stocks firming, or at least, the size of the market's moves shrinking. Of the 850,000 options traded on VIX, more than 515,000 were puts, with twice as many puts likely initiated by buyers than calls, Cboe data show.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks close lower in volatile session as AI trade remains under pressure", "full_content": "Chip group Nvidia among losers but AI start-up Anthropic a bright spot as shares finish higher", "source": "FT Markets", "pub_date_str": "26 Nov 2026, 02:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "The 150 Best Black Friday Deals Live Right Now | Reviews by Wirecutter - The New York Times", "full_content": "The 150 Best Black Friday Deals Live Right Now | Reviews by Wirecutter The New York Times The 140 best Black Friday deals actually worth shopping now, according to our experts CNN I found 37 Black Friday tech deals actually worth shopping Mashable The Best Clothing, Jewellery and Bag Deals According to a Shopping Editor Who What Wear The Early Black Friday Bargains Worth Bagging WIRED", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 02:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dow closes higher Wednesday, wiping out 1,100-point loss in stunning rebound: Live updates", "full_content": "The Dow Jones Industrial Average erased an 1,100-point plunge on Wednesday as Wall Street tried to recover from steep declines led by artificial intelligence-linked stocks.\n\nThe blue-chip Dow advanced 164.25 points, or 0.33%, to end at 50,182.95. The Nasdaq Composite , however, fell 0.62% to 23,585.80, while the S&P 500 shed 0.25% to close at 7,182.78.\n\nStocks came well off their lows as the session went on. The blue-chip Dow lost more than 1,100 points, or 2.2% at its low of the day. The tech-heavy Nasdaq was down 4.6%, and the broad market S&P 500 shed 3.2% at their respective lows.\n\nTraders chalked up part of the rebound to light trading ahead of the Thanksgiving holiday as well as the circulation of a blog post by Michael Burry, in which he said that his portfolio is \" temporarily almost entirely long .\"\n\nThe Dow was boosted by gains in stocks such as International Business Machines , Salesforce and Sherwin-Williams . S&P 500 sectors such as materials, energy and real estate were all higher, bolstering the index.\n\nDow, 1-day However, Nvidia led AI-related stocks lower, dropping almost 4%. Micron Technology moved down 4.5%, while Oracle declined more than 5%, and Alphabet shed more than 2%. The State Street Technology Select Sector ETF (XLK) ended nearly 1% lower.\n\nMeanwhile, semiconductor stock Ambarella plummeted more than 19% after its forecast for the current quarter came in light . The company's earnings and revenue for the third quarter also missed expectations.\n\n\"This market is very bifurcated\" between AI and non-AI stocks, said David Wagner, head of equities at Aptus Capital Advisors. \"The market is pulling back obviously due to a pullback in tech, pullback in semis, pullback in the AI narrative, but right now, I don't see that being a growth scare. I see it being a sentiment-based scare\" based on factors such as the composition of Congress in the new year, he added.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Tech stocks sink but close well off the lows, Anthropic struggles to rebound above IPO price", "full_content": "Technology stocks fell on Wednesday as excitement over Nvidia CEO Jensen Huang 's return faded and failed to calm concerns over the sustainability of the artificial intelligence trade.\n\nThe tech-heavy Nasdaq Composite declined 0.6% and traded off its lows, recovering from steeper losses earlier in the session. Semiconductor stocks dragged on the index, and the VanEck Semiconductor ETF that tracks the sector edged down 1%.\n\n\"We just feel that this is panic right now,\" Venu Krishna, head of U.S. equity strategy at Barclays, told CNBC's \" Squawk on the Street \" on Wednesday.\n\n\"What the market is telling you is that the AI growth narrative has hit a wall and given the centrality of that theme at the economic level, the market is expecting some sort of a macro shock,\" he added.\n\nAfter notching one of its best days on record Monday, Nvidia has fallen in the days since and slumped 4% Wednesday. Advanced Micro Devices , Marvell Technology and Intel all edged lower. Micron Technology declined 4%.\n\nHuang's return to Nvidia on Monday briefly revived appetite for tech stocks but didn't fully calm investor concerns over the high costs tied to the AI build-out and worries of a potential slowdown.\n\nNvidia stock chart Other stocks tied to the AI trade also plummeted. Oracle fell more than 5%. CoreWeave and Nebius moved lower.\n\nAI lab Anthropic bucked the sell-off, however, and climbed more than 4% after shares dropped below last week's blockbuster IPO price.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "10-year Treasury yield slides despite sticky inflation data as investors buy bonds for protection", "full_content": "U.S. Treasury yields fell on Wednesday, with investors fleeing to bonds for protection after October's personal consumption expenditures price index showed that inflation continued to accelerate.\n\nThe 10-year Treasury note yield \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 was more than 3 basis points lower at 4.866%.\n\nThe yield on the 2-year Treasury note, which typically moves in line with short-term Federal Reserve interest rate decisions, was down more than 2 basis points at 4.65%.\n\nThe longer-dated 30-year Treasury yield, which tends to track geopolitical events, was more than 3 basis points lower at 5.254%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe personal consumption expenditures price index \u2014 the Federal Reserve's preferred gauge of underlying inflation \u2014 rose 3.8% year over year for October, in line with the Dow Jones consensus estimate. Separately, economic growth came in much stronger for the third quarter. Gross domestic product rose at a 4.3% annualized rate, according to a revised Commerce Department estimate.\n\nThe data reinforced expectations for another Fed rate hike in December.\n\n\"[I]t is more urgent than ever that Fed officials step up the pace of interest rate hikes to cool off economic demand,\" said Chris Rupkey, chief economist at FWDBONDS. \"Rate hikes are coming. Lots of them. Bet on it. The economy and inflation are literally on fire.\"", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Vance says he was assured Jensen Huang was not under DOJ investigation", "full_content": "Vice President JD Vance said Wednesday that Attorney General Todd Blanche told him Nvidia CEO Jensen Huang was not under investigation.\n\n\"I was told by the Department of Justice and multiple officials in our national security apparatus that he was under no investigation,\" Vance told reporters in Ohio on Wednesday after being asked what assurances he had gotten that Huang was not under investigation. \"Not even that he was about to be prosecuted; that he's under no investigation.\"\n\nVance spoke two days after President Donald Trump told CNBC in an interview that an investigation had been done.\n\nTrump was asked what Blanche had told him about potential criminal liability for Huang and the question of whether Nvidia chips had ended up in China in violation of U.S. export laws.\n\n\"They did a pretty good investigation, and they felt that he, himself, was exonerated,\" Trump said Monday.\n\nReuters reported Wednesday that the Department of Justice did not conduct a formal investigation into Huang before Trump pushed for his reinstatement as CEO.\n\nBlanche had concluded there was no evidence Huang had broken any laws based on investigations into Nvidia clients Super Micro Computer and Megaspeed, according to the report.\n\nThe DOJ did not immediately respond to a request for comment on the Reuters report. And the White House didn't immediately respond to a request for comment on Vance saying Huang was under no investigation when Trump had said there was one. Nvidia didn't immediately respond to a request for comment about Vance's remarks.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX, Musk pledge to donate a share each to active Trump Accounts", "full_content": "SpaceX said Wednesday it will donate one share of the company's class A stock to every active Trump Account , and CEO Elon Musk would personally match the gift.\n\n\"SpaceX is building the infrastructure of the future and working to make life multiplanetary,\" the company said in a statement. \"We believe ownership of the company creating these systems should extend to the next generation of Americans for their long-term benefit.\"\n\nThe White House announced in October that nearly 70 million Trump Accounts had been created, including more than 60 million through auto-enrollment. It's unclear how many are considered active.\n\nEligible children must have their account claimed to enable contributions from family members, friends and employers, and to receive the government's one-time $1,000 seed contribution. Auto-enrolled children can receive philanthropic contributions without a parent or guardian claiming an account, according to TrumpAccounts.gov.\n\nRepresentatives for SpaceX and the U.S. Department of the Treasury did not immediately respond to a request for further details about the planned gift.\n\nSpaceX Chief Operating Officer Gwynne Shotwell had previously agreed to make a personal gift of over 2 million SpaceX shares to Trump Accounts, with eligible account holders expected to receive them in December .\n\nIn October, Elon Musk posted on X that he would give a share of SpaceX to every kid in America next year.\n\nTrump Accounts, also known as 530A accounts, are open to any U.S. child under 18 with a Social Security number.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "Volatility-weary investors side swiped as tariff mayhem adds to tech pain - Reuters", "full_content": "Volatility-weary investors side swiped as tariff mayhem adds to tech pain Reuters Trump unveils new tariffs over excess industrial capacity, undeterred by midterms defeat Reuters Morning Bid: Tariff fear compounds AI recoil Yahoo Finance 5 Things Investors Need to Know About Wednesday\u2019s Markets Investopedia Stocks tumble on new tariffs, inflation worries, leading to an AI sell-off Fast Company", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 02:20 AM IST", "pub_date_relative": "1h ago"}, {"title": "Yen, Swiss franc gain as dollar slips in volatile AI-driven session", "full_content": "Nov 25 - The safe-haven Swiss franc and Japanese yen gained on Wednesday, while the dollar slipped during a volatile day as AI-related stocks tumbled sharply, before clawing back much of their earlier losses.\n\nThe tech-heavy Nasdaq Composite fell around 4% on a renewed selloff in artificial intelligence-linked stocks, before rebounding to last be down around 0.6%.\n\nStocks mounted \"a huge comeback,\" said Adam Button, chief currency analyst at investingLive. \"I wonder if this is a short-covering rally in a holiday-shortened week but at worst it's a sign of life.\"\n\nMost US markets will be closed on Thursday for the Thanksgiving Day holiday.\n\nThe US currency earlier benefited from the risk-off move, before falling later in the session.\n\nThe dollar index, which measures the greenback against a basket of currencies including the yen and the euro, was last down 0.22% at 103.62, with the euro up 0.17% at $1.0983.\n\nThe greenback has acted as a safe haven when stocks tumble, but it is also swayed by capital inflows and growth expectations linked to the AI trade.\n\nThe Japanese yen strengthened 0.06% against the greenback to 159.13 per dollar. Against the Swiss franc, the dollar weakened 0.63% to 0.83.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "Gold falls to more than one-year low after data shows U.S. inflation rose further", "full_content": "Gold fell to its lowest level in more \u200cthan a year after strong U.S. inflation data failed to assuage concerns surrounding the Federal Reserve's rate-hike path .\n\nSpot gold was down 0.6% to $3,534.16 per ounce by 1:24 p.m. ET. Earlier, the commodity touched its lowest level since \u200bAugust 2025.\n\nAt one point, the metal fell below the key $3,500 level for the first time since \u200bSeptember 2025.\n\nU.S. gold futures for December delivery dropped 0.9% to $3,529.4.\n\nU.S. inflation rose \u2060further in October, with the Personal Consumption Expenditures Price Index rising 0.3% after an \u200bunrevised 0.5% gain in September, the Commerce Department's Bureau of Economic Analysis said on Wednesday.\n\n\"With \u200binflationary pressures remaining significantly above the Fed target, the likelihood continues that the Fed will raise interest rates moving forward, which adds pressure to gold,\" David Meger, director of metals trading at High Ridge \u200bFutures, said.\n\n\"That's been one of the main themes that remains a headwind for the gold \u200bmarket, and today's PCE data did nothing to allay those concerns.\"\n\nElevated rates tend to diminish the attractiveness \u200cof \u2060non-yielding gold relative to interest-bearing assets.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 01:47 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin Miners Hammered Again as Price Rout Squeezes Margins", "full_content": "(Bloomberg) -- The plunge in the value of Bitcoin is putting pressure on billion-dollar mining companies to liquidate their remaining token reserves, both to cover steep operating costs and to fund an increasingly strained pivot into AI data centers.\n\nA key measure of mining revenue, known as hash price, slumped to its lowest in at least a year as Bitcoin fell to a more than two-year low of around $55,000 last weekend, Hashrate Index data show. JPMorgan Chase & Co. recently estimated the average cost of producing a Bitcoin at around $86,000, though expenses vary significantly among operators.\n\nThose deteriorating economics threaten to compound pressures across the broader crypto market. Even though some of the largest publicly traded operators have already pared their holdings, sustained losses could trigger a fresh wave of forced selling.\n\n\u201cIt\u2019s likely that we\u2019ll see pressure for companies to liquidate their Bitcoin holdings more because the bills have to get paid, payroll has to run regardless of what the price of Bitcoin is,\u201d said Mark Zalan, chief executive officer of Bitcoin-mining services provider GoMining.\n\nBitcoin mining is an energy-intensive process, in which miners invest billions of dollars to build data centers, and purchase specialized computers and massive amounts of power, to earn token rewards released by the Bitcoin network by validating transactions.\n\nMARA Holdings Inc., Core Scientific Inc. and CleanSpark Inc. are among the large publicly traded miners that have already been selling off reserves. Even American Bitcoin Corp., a Trump family-backed firm that once pledged to hold every token its mines in reserve, changed gears and sold Bitcoin to help cover operating costs in the third quarter.\n\nShares of the companies have been been hit hard by the collapse of the token price. MARA has slumped around 40% this year, while CleanSpark is off 50%.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:45 AM IST", "pub_date_relative": "2h ago"}, {"title": "SpaceX, Musk pledge to donate a share each to active Trump Accounts - CNBC", "full_content": "SpaceX, Musk pledge to donate a share each to active Trump Accounts CNBC SpaceX\u2019s New Stock Giveaway Sweetens the Deal on Trump Accounts Barron's Elon Musk And SpaceX Pledge Matching Trump Account Contributions Forbes SpaceX and Elon Musk say they will donate shares to Trump Accounts. The Verge SpaceX, Elon Musk to give one share each to active Trump accounts Yahoo Finance", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 01:37 AM IST", "pub_date_relative": "2h ago"}, {"title": "Fed survey shows continued growth and sticky inflation in recent weeks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Fed survey shows continued growth and sticky inflation in recent weeks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Fed survey shows continued growth and sticky inflation in recent weeks SECTIONS Fed survey shows continued growth and sticky inflation in recent weeks Reuters Last Updated: Nov 26, 2026, 01:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The United States is currently experiencing modest economic growth; however, inflation continues to be a significant concern. This has prompted the Federal Reserve to contemplate potential interest rate adjustments. Recent reports show a marked increase in the Personal Consumption Expenditures Price Index for October versus a year ago. Businesses are facing rising expenses across multiple sectors, highlighting persistent economic challenges and uncertainties on the horizon.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 01:37 AM IST", "pub_date_relative": "2h ago"}, {"title": "Agencies announce dollar thresholds for applicability of truth in lending and consumer leasing rules for consumer credit and lease transactions", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 3:00 p.m. EST Share --> --> --> --> --> --> The Federal Reserve Board and the Consumer Financial Protection Bureau today announced the dollar thresholds used to determine whether certain consumer credit and lease transactions in 2027 are subject to certain protections under Regulation Z (Truth in Lending) and Regulation M (Consumer Leasing).\n\nBy law, the agencies are required to adjust the thresholds annually based on the annual percentage increase in the Consumer Price Index for Urban Wage Earners and Clerical Workers, known as CPI-W. Transactions at or below the thresholds are subject to the protections of the regulations.\n\nSpecifically, based on the 3.9 percent annual percentage increase in the CPI-W as of June 1, 2026, Regulation Z and Regulation M generally will apply to consumer credit transactions and consumer leases of $76,300 or less in 2027. However, private education loans and loans secured by real property, such as mortgages, are subject to Regulation Z regardless of the amount of the loan.\n\nFederal Register notice: Consumer Leasing (Regulation M) (PDF)\n\nFederal Register notice: Truth in Lending (Regulation Z) (PDF)", "source": "Federal Reserve", "pub_date_str": "26 Nov 2026, 01:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Agencies announce dollar thresholds for smaller loan exemption from appraisal requirements for higher-priced mortgage loans", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 3:00 p.m. EST Share --> --> --> --> --> --> The Consumer Financial Protection Bureau, the Federal Reserve Board, and the Office of the Comptroller of the Currency today announced that the 2027 threshold for higher-priced mortgage loans that are subject to special appraisal requirements will increase from $34,200 to $35,500.\n\nThe threshold amount will be effective January 1, 2027, and is based on the 3.9 percent annual percentage increase in the Consumer Price Index for Urban Wage Earners and Clerical Workers, known as CPI-W, as of June 1, 2026.\n\nThe Dodd-Frank Act added special appraisal requirements for higher-priced mortgage loans to the Truth in Lending Act, including that creditors obtain a written appraisal based on a physical visit to the interior of the home before making a higher-priced mortgage loan. The rules implementing these requirements contain an exemption for loans at or below a threshold amount that is adjusted annually to reflect CPI-W increases.\n\nFederal Register notice: Appraisals for Higher-Priced Mortgage Loans Exemption Threshold (PDF)", "source": "Federal Reserve", "pub_date_str": "26 Nov 2026, 01:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "We're buying more of a stock down big from its July highs", "full_content": "We're dipping into our large cash position as the market remains oversold.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 01:25 AM IST", "pub_date_relative": "2h ago"}, {"title": "EU postpones discussion to approve Tesla's self-driving tech", "full_content": "A European Union meeting expected to consider Tesla 's bid for bloc-wide approval of its assisted self-driving system has been postponed until Dec. 15, a European Commission spokesperson told Reuters on Wednesday.\n\nThe Technical Committee for Motor Vehicles had been expected to consider, and potentially vote on, the system at its December meeting after no vote was held at two earlier meetings following preliminary approval from the Netherlands in April.\n\nTesla Assisted Driving, renamed from Full Self-Driving as a result of concerns from regulators, is a so-called \"hands-off, eyes-on\" system that can steer, accelerate and brake while requiring constant supervision from the driver.\n\nThe vote is a key hurdle in Tesla's effort to roll out the technology across Europe. Nearly a dozen countries have followed the Dutch lead, with Italy the most populous to begin a rollout. But EU-wide approval requires backing from at least 15 of the bloc's 27 member states representing 65% of its population.\n\nA rejection at EU level would invalidate the national approvals already granted.\n\nThe meeting had originally been scheduled for Dec. 1, Dutch regulator RDW told Reuters. Belgium's Flanders transport ministry initially said it had been moved to Dec. 7 before the commission clarified that it would instead take place on Dec. 15.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 01:24 AM IST", "pub_date_relative": "2h ago"}, {"title": "S&P Global places Nvidia rating on 'CreditWatch Negative' on rising management and governance risks - Reuters", "full_content": "S&P Global places Nvidia rating on 'CreditWatch Negative' on rising management and governance risks Reuters See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 01:24 AM IST", "pub_date_relative": "2h ago"}, {"title": "SpaceX gets green light to deploy 1 million satellites for data centers in space - NBC News", "full_content": "SpaceX gets green light to deploy 1 million satellites for data centers in space NBC News SpaceX wins FCC approval to deploy 1 million orbital data center satellites CNBC Trump administration approves Elon Musk\u2019s plan for datacenters in space The Guardian US authorizes SpaceX to deploy 1 million satellites for data centers in space Reuters SpaceX Gets Approval to Launch One Million Satellites for Orbital Data Centers WSJ", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 01:24 AM IST", "pub_date_relative": "2h ago"}, {"title": "Copper slumps to lowest in 11 months as investors flee", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a Copper slumps to lowest in 11 months as investors flee The Economic Times daily newspaper is available online now. Read Today's Paper Copper slumps to lowest in 11 months as investors flee SECTIONS Copper slumps to lowest in 11 months as investors flee Reuters Last Updated: Nov 26, 2026, 01:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Copper prices on the London Metal Exchange have plummeted to their lowest point in over 11 months, fueled by a shift away from technology and AI stocks, causing widespread market anxiety. Notably, open interest in copper reflects this trend, showing a significant dip in trading activity. Prices for other metals like tin and aluminum also saw sharp falls, as ongoing market uncertainties dampen investor confidence in commodities.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 01:23 AM IST", "pub_date_relative": "2h ago"}, {"title": "SpaceX wins FCC approval to deploy 1 million orbital data center satellites", "full_content": "The Federal Communications Commission has authorized Elon Musk 's SpaceX to put 1 million artificial intelligence computing satellites in orbit, Chairman Brendan Carr announced on Wednesday.\n\nCarr said in a post on X, the social network owned by SpaceX, that the company's Starmind constellation, and \"competitor constellations will use solar power to extend America's lead\" in AI.\n\nMusk said in a reply, \"Much appreciated. This will be a great asset to America and the world.\"\n\nThe FCC, in its authorization filing , noted that SpaceX's application \"received a substantial number of comments from the public, including petitions to deny filed by Kuiper Systems LLC ( Amazon Leo), Viasat Inc. (Viasat), and the American Astronomical Society (AAS).\"\n\nIn a March petition urging the FCC to deny SpaceX's application, Amazon had labeled the company's Starmind project as a \"lofty ambition rather than a real plan.\"\n\nThe e-commerce and cloud computing giant is building a competitor to SpaceX's Starlink satellite internet service, and said it would take SpaceX \"centuries\" to build the constellation, adding that the company provided scant details about how it would \"deliver on these grand claims.\"\n\nThe petition resulted in a rebuke from Carr , who said Amazon \"should focus on the fact\" that it's falling short of its own satellite deployment milestone.\n\nOther companies have also set their sights on orbital data centers. Google last year announced Project Suncatcher , which it describes as a \"moonshot to put AI in space,\" and launched its first chips into space on a SpaceX rocket and Planet Labs satellite in October.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 01:22 AM IST", "pub_date_relative": "2h ago"}, {"title": "US yields fall but move off lows as stocks pare sharp losses", "full_content": "NEW YORK, Nov 25 (Reuters) - US Treasury yields declined on Wednesday but were off their earlier lows, as another drop in AI-related stocks that caused sharp losses in equity markets lost steam and dampened the safe-haven appeal of bonds.\n\nUS stocks saw sharp losses in the first half of the trading session, with stocks related to the buildout of the emerging technology showing continued weakness, as the reinstatement of Nvidia CEO Jensen Huang earlier this week has proved to be only a temporary reprieve from the selling pressure in the space.\n\nBut stocks have mounted a comeback in the latter stages of trading, with the S&P 500 technology sector down 1.3% after falling as much as 5.4% on the day, while the Nasdaq Composite was down 0.7% after falling as much as 4.7%.\n\nThe yield on the benchmark US 10-year Treasury note fell 6.2 basis points to 4.84% and was on pace for its seventh daily drop in the past eight sessions. The yield on the 10-year had earlier fallen to 4.8%, its lowest since September 9.\n\n\"When the market moves this fast to the downside, everybody gets a little nervous. I'm not doing cartwheels or anything like that,\" said Scott Wren, market strategist at North Star Market Analysis LLC in St. Louis.\n\n\"You're not likely to go a whole lot below 4.80% or so in the yield on the 10-year.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:13 AM IST", "pub_date_relative": "2h ago"}, {"title": "Saudi national in OpenAI bugging case is out on bond after DOJ tries to block release", "full_content": "Abdulrahman Alfozan , the Saudi national accused of bugging an executive conference room at OpenAI 's headquarters, has been released from custody , his attorney told CNBC on Wednesday.\n\nThe confirmation of Alfozan's release came a day after a federal judge in San Francisco said the defendant would be allowed out of jail on a $1 million bond, despite prosecutors' warnings that he posed a serious flight risk.\n\nAlfozan, a former OpenAI engineer, is expected to be fitted with an ankle monitor, his attorney, David Rizk, previously told CNBC.\n\nAlfozan was scheduled to be released from detention Wednesday morning at 8 a.m. PT. Shortly before that deadline, U.S. Attorney Craig Missakian of the Northern District of California urged the court to maintain Alfozan's detention pending trial, \"given the significant risk that the defendant will flee to Saudi Arabia if he is released from custody.\"\n\nIn an order posted on the case docket later Wednesday, Judge Vince Chhabria said the court only learned of the government's last-minute bid to block Alfozan's release after he had already been let out. The government's motion \"is therefore denied as moot,\" Chhabria's order stated. The judge set a hearing for Dec. 3 on the bid to revoke the magistrate judge's order releasing Alfozan.\n\nPointing to Alfozan's \"ample resources, significant family and professional ties to Saudi Arabia, and few remaining ties to the United States,\" Missakian had argued in a court filing that the release conditions imposed by Magistrate Judge Alex Tse \"are insufficient to safeguard the defendant's appearance for future proceedings in this case.\"\n\nAlfozan \"presents a serious risk of flight that no set of release conditions can reasonably mitigate,\" Missakian wrote.\n\nHis office sought to pause the magistrate judge's release order until a ruling on a motion to revoke it. The Department of Justice did not immediately respond to CNBC's request for comment on Alfozan's release.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 12:41 AM IST", "pub_date_relative": "3h ago"}, {"title": "Sale of Stefanik family\u2019s D.C. home deemed \u2018unusual,\u2019 city records show - The Washington Post", "full_content": "Sale of Stefanik family\u2019s D.C. home deemed \u2018unusual,\u2019 city records show The Washington Post Report: Sale of Stefanik's DC townhouse to mystery buyer raises questions NCPR: North Country Public Radio Elise Stefanik\u2019s Mystery Property Windfall Drama Takes Bombshell Twist Yahoo It\u2019s Golden Dukes Time of Year \u2013 Golden Stefaniks? Talking Points Memo Questions swirl over above-market purchase of Republican\u2019s DC home The Independent", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 12:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "Soybeans rebound ahead of holiday as soymeal futures climb", "full_content": "(Rewrites throughout with US trading, adds quote, updates prices, changes byline, changes dateline from PARIS/SINGAPORE)\n\nCHICAGO, Nov 25 (Reuters) - US soybean futures rebounded on Wednesday from overnight lows as soymeal futures rallied and as traders shrugged off concerns that trade tensions with China would disrupt a robust pace of US exports.\n\nCorn firmed on short covering ahead of the US Thanksgiving holiday market closure on Thursday after sinking to a five-month low the previous day, while wheat futures mixed amid demand headwinds from a strong dollar and improving US crop conditions.\n\nGrain markets will be closed on Thursday before reopening on Friday for an abbreviated trading session.\n\nFutures were mostly lower in overnight trading after US President Donald Trump's administration proposed new tariffs on 14 major trading partners including China.\n\nBut soybeans clawed back the losses as investors assessed that exports to China would not be severely impacted as the top soy importer was already on pace to meet its annual purchasing commitment, and as the two countries continue to work on resolving agricultural trade issues. Meanwhile, any crop shortfall in South America could spark additional US soy demand, analysts said.\n\nThe market also drew support from soaring soymeal futures as demand from the EU could rise due to new deforestation rules set take effect in late December.\n\n\"You've got meal on fire, the idea that our crush is going to be strong and that we're going to be exporting a lot of meal. China is going to buy the 25 million metric tons, come hell or high water, tariffs or no tariffs,\" said Ted Seifried, chief market strategist at Zaner Ag Hedge.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 12:08 AM IST", "pub_date_relative": "3h ago"}, {"title": "From ropeways to ring roads: Karan Adani reveals the group\u2019s next big bets at ET Bengal Ascends", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a From ropeways to ring roads: Karan Adani reveals the group\u2019s next big bets at ET Bengal Ascends The Economic Times daily newspaper is available online now. Read Today's Paper From ropeways to ring roads: Karan Adani reveals the group\u2019s next big bets at ET Bengal Ascends SECTIONS From ropeways to ring roads: Karan Adani reveals the group\u2019s next big bets at ET Bengal Ascends By ET TEAM Last Updated: Nov 26, 2026, 12:08:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Adani Group aims to expand its operations in West Bengal by bidding for thermal power and infrastructure projects. The group plans to develop the Kolkata Outer Ring Road to ease urban congestion. Karan Adani highlighted the importance of strategic infrastructure planning to avoid bottlenecks in port operations. The company secured a renewable power supply contract for 1,750 MW starting July 2028.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "26 Nov 2026, 12:08 AM IST", "pub_date_relative": "3h ago"}, {"title": "Anthropic teeters at $1 trillion market cap. Why it may stabilize from here", "full_content": "Anthropic's post-IPO slide tests the AI trade as analysts defend its enterprise edge.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 12:06 AM IST", "pub_date_relative": "4h ago"}, {"title": "Lille vs Bayern Munich Live Streaming: Likely Lineups; How To Watch Champions League Match On TV, Online?", "full_content": "Bayern Munich will aim to extend their unbeaten Champions League run when they face Lille in France. Here's how to watch the match live in India.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 12:05 AM IST", "pub_date_relative": "4h ago"}, {"title": "Anthropic's slide tests Wall Street's lofty bets on future AI profits - Reuters", "full_content": "Anthropic's slide tests Wall Street's lofty bets on future AI profits Reuters Anthropic\u2019s Stock Debut Could Hurt Tech Start-Ups The New York Times The AI Grinch Won\u2019t Steal Christmas, but Watch Next Year WSJ How to buy Anthropic at a discount with less risk CNBC Anthropic shares tumble below $83 IPO price, on track to lose nearly $200 billion in value Reuters", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 12:05 AM IST", "pub_date_relative": "4h ago"}, {"title": "Stocks To Watch Today: Siemens Energy, Wipro, Lupin, Punjab National Bank And Acme Solar", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Thursday.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 12:00 AM IST", "pub_date_relative": "4h ago"}, {"title": "US accuses India of creating manufacturing overcapacity through PLI, Make in India schemes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a US accuses India of creating manufacturing overcapacity through PLI, Make in India schemes The Economic Times daily newspaper is available online now. Read Today's Paper US accuses India of creating manufacturing overcapacity through PLI, Make in India schemes SECTIONS US accuses India of creating manufacturing overcapacity through PLI, Make in India schemes PTI Last Updated: Nov 25, 2026, 11:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Concerns have emerged from the US about India\u2019s industrial approaches, especially those facilitating manufacturing growth and export enhancement. Initiatives like Make in India, coupled with financial policies that uphold low interest rates, are under scrutiny. The US Trade Representative details factors tied to excess capacity in Indian manufacturing, pointing to issues in specific industries like steel and solar energy, which pose notable challenges for US companies and employees.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 11:55 PM IST", "pub_date_relative": "4h ago"}, {"title": "Thanksgiving Day hours: What\u2019s open and closed across grocery, retail and restaurants - Fox Business", "full_content": "Thanksgiving Day hours: What\u2019s open and closed across grocery, retail and restaurants Fox Business Last-minute holiday needs? These stores are open on Thanksgiving WRAL Several KC area grocery stores will be open on Thanksgiving. See where and when Kansas City Star What\u2019s closed on Thanksgiving and when stores reopen on Black Friday AP News Thanksgiving store hours 2026: What stores are open and closed on Nov. 26 Mashable", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 11:55 PM IST", "pub_date_relative": "4h ago"}, {"title": "\u2018If we can solve Riemann, what can\u2019t we do?\u2019: mathematicians shocked and excited by AI breakthroughs - Nature", "full_content": "\u2018If we can solve Riemann, what can\u2019t we do?\u2019: mathematicians shocked and excited by AI breakthroughs Nature What\u2019s going on with the Riemann hypothesis? Ars Technica The Most Famous Problem in Math Was Just Solved by AI\u2014and This Human WSJ Anthropic worker claims to have solved a Holy Grail of math problems with the help of AI CNN Two groups verify mathematician\u2019s claim that Claude helped prove mathematics problem The Guardian", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 11:53 PM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "US Treasury financial crime watchdog hit by suspected cyber attack", "full_content": "FinCen takes systems offline after detecting unauthorised access amid growing fears over vulnerability of technology systems", "source": "FT Markets", "pub_date_str": "26 Nov 2026, 03:54 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Dermata Therapeutics receives Nasdaq notice for minimum bid price non-compliance", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 03:52 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Crypto Fund Trader Launches Its Own Perpetuals Terminal For Traders Worldwide", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 03:52 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Cathay General Bancorp expands buyback program to $200M", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 03:50 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stardust Power to be delisted from Nasdaq; board member resigns", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 03:48 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fisher & Paykel H1 FY27 slides: profit jumps 37%, margins top targets", "full_content": "", "source": "Investing.com News", "pub_date_str": "26 Nov 2026, 03:47 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic\u2019s Stock Sparks Rare Divide Inside One Wall Street Firm", "full_content": "Two equity analysts at a single Wall Street research firm have taken the unusual step of posting conflicting views on the outlook for the hottest stock in the market: Anthropic PBC\u2019s newly listed shares.\n\nOn one side, Andrew Freedman, a communications and software analyst at Hedgeye Risk Management, has put out reports since the company\u2019s initial public offering and said in an interview on Wednesday that the stock is trading at levels that should be attractive for long-term investors. Meanwhile, his colleague Felix Wang, a global tech analyst, sent out a note to clients on Tuesday, recommending they short the stock.\n\nAfter Wang published his view, Freedman took to social media to distance himself from it, saying he was \u201cnot involved in the research or process that led to that decision.\u201d\n\nWang\u2019s pessimism is predicated on the growing difficulty of financing the data centers that Anthropic relies on for computing power, along with concerns about the long-term business demand for Anthropic\u2019s models. Freedman\u2019s optimism is focused on the potential for Anthropic to become a new operating system for the business world, along with the signals of robust short-term demand. Wang sees the stock falling to $59, versus Freedman\u2019s fair value target of $92.\n\nThe opposing views within one firm illustrate the broader rifts in the market about how to value the disruptive potential of artificial intelligence and one of the key companies behind it. It also shows the divisive nature of the stock, which spiked to a valuation of $2 trillion right after it went public, before sharply pulling back.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 03:31 AM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Liesman: Why Greenspan could bet on productivity \u2014 and Warsh needs to hike", "full_content": "In a discussion on CNBC's Halftime Report Wednesday, the question came up: Why can't Federal Reserve Chairman Kevin Warsh hold the line on interest rates the way his icon Alan Greenspan did at the beginning of the dot-com era?\n\nGreenspan famously leaned against inflation hawks on his committee in 1995 and 1996, holding the line on interest rates amid strong growth, because he believed in the productivity promise of the internet revolution.\n\nIt would be nice if Warsh could follow the same playbook amid the artificial intelligence build-out and keep rates steady until the productivity arrives. Unfortunately, a quick look at the numbers shows just how different the situation is for Warsh when it comes to inflation , the magnitude of the capital-investment boom and the monetary and fiscal stimulus boosting the economy.\n\nBottom line: the Fed looks like it has to hike \u2014 and maybe substantially \u2014 to be anywhere close to the position where the Fed was in Greenspan's time at the dawn of a major technological revolution.\n\nIt may be that the massive capex spending on AI will mean more productivity and less inflation down the road. But the front-end build-out is proving to be more inflationary, and more challenging, to a Fed already dealing with high inflation. In many ways, that's the opposite of what Greenspan had to handle.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 03:26 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How the Trump administration determined Jensen Huang is not a national security threat - Reuters", "full_content": "How the Trump administration determined Jensen Huang is not a national security threat Reuters Vance says he was assured Jensen Huang was not under DOJ investigation CNBC Vance Defends Huang\u2019s Nvidia Return, Blames \u2018Anonymous Sources\u2019 Bloomberg The Trump team is getting more and more evasive about Jensen Huang CNN Live updates: Vance says Nvidia\u2019s CEO Jensen Huang \u2018doesn\u2019t need a pardon\u2019 NBC News", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 03:25 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "JPMorgan Sees $450 Billion AI Debt Blitz in 2027 Before Plateau", "full_content": "(Bloomberg) -- Companies will tap public high-grade debt markets for $450 billion next year to finance their artificial intelligence-related capital expenditures, even as a growth plateau looms for the burgeoning industry further down the road, according to analysts at JPMorgan Chase & Co.\n\nThe financing would be an increase from the $368 billion of global investment grade bond issuance for AI-focused companies this year, according to the bank.\n\nOverall, AI-related capital spending will nearly double to $1.4 trillion in 2027 before leveling off in the following year, strategists led by Tarek Hamid and Nathaniel Rosenbaum wrote.\n\nThe strategists expect spending growth to slow sharply in 2028 as the industry settles into a steady run rate \u2014 a trend potentially foreshadowed by cautious commentary from Asian tech giants including Tencent and Alibaba.\n\n\u201cDue to the deceleration in overall industry growth rates, there will be a quarter in late 2027 or early 2028 when the outlook for next quarter\u2019s capital spending will be basically flat,\u201d the strategists wrote. \u201cWhether the market reacts positively or negatively to that is anyone\u2019s guess.\u201d\n\nThe shift is set to create a more predictable debt supply for credit markets even as flat spending growth risks unsettling investor sentiment, the strategists said.\n\nThe bank expects the AI industry to build 151 gigawatts of data center capacity at a cost of $7 trillion between 2027 and 2031. Since most data center projects take multiple years to build and raise capital upfront, much of 2027\u2019s buildout is already paid for, meaning \u201cfunding in 2027 is really for 2028,\u201d they wrote.\n\nIn addition to the investment-grade debt, the bank expects companies to raise $65 billion through leveraged finance and $25 billion to $35 billion in securitized products in 2027.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 03:20 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Stocks Swoon as AI Fears Spur Rush to Treasuries: Markets Wrap - Bloomberg", "full_content": "Stocks Swoon as AI Fears Spur Rush to Treasuries: Markets Wrap Bloomberg Dow closes higher Wednesday, wiping out 1,100-point loss in stunning rebound: Live updates CNBC Stocks Slump Again as Investors Fret About A.I., Tariffs and Inflation The New York Times Stock market today: Dow erases losses to end positive, S&P 500 and Nasdaq recover ground amid AI sell-off Yahoo Finance Moody's says Nvidia's Huang reinstatement eases uncertainty, ratings unchanged Reuters", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 03:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bullish hopes spring as traders bet against a higher VIX: Options Action Live", "full_content": "With stocks mounting a comeback Wednesday, options trading across a few key volatility products suggests big swings in stocks may dampen in the near term.\n\nMore than 80,000 options traded on the Barclays S&P 500 VIX Short Term Futures ETN (VXX) , almost three times the 30-day average, with more puts trading than calls, according to LiveVol data. The fund aims to track the moves in Cboe's VIX Index , which surged to 35 early Wednesday but slipped to below 28 as the S&P 500 rallied to within 25 basis points of unchanged.\n\nAt the same time, options volume on VIX itself was 50% above average, with an even more distinctive bias towards puts, suggesting traders see stocks firming, or at least, the size of the market's moves shrinking. Of the 850,000 options traded on VIX, more than 515,000 were puts, with twice as many puts likely initiated by buyers than calls, Cboe data show.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dow closes higher Wednesday, wiping out 1,100-point loss in stunning rebound: Live updates", "full_content": "The Dow Jones Industrial Average erased an 1,100-point plunge on Wednesday as Wall Street tried to recover from steep declines led by artificial intelligence-linked stocks.\n\nThe blue-chip Dow advanced 164.25 points, or 0.33%, to end at 50,182.95. The Nasdaq Composite , however, fell 0.62% to 23,585.80, while the S&P 500 shed 0.25% to close at 7,182.78.\n\nStocks came well off their lows as the session went on. The blue-chip Dow lost more than 1,100 points, or 2.2% at its low of the day. The tech-heavy Nasdaq was down 4.6%, and the broad market S&P 500 shed 3.2% at their respective lows.\n\nTraders chalked up part of the rebound to light trading ahead of the Thanksgiving holiday as well as the circulation of a blog post by Michael Burry, in which he said that his portfolio is \" temporarily almost entirely long .\"\n\nThe Dow was boosted by gains in stocks such as International Business Machines , Salesforce and Sherwin-Williams . S&P 500 sectors such as materials, energy and real estate were all higher, bolstering the index.\n\nDow, 1-day However, Nvidia led AI-related stocks lower, dropping almost 4%. Micron Technology moved down 4.5%, while Oracle declined more than 5%, and Alphabet shed more than 2%. The State Street Technology Select Sector ETF (XLK) ended nearly 1% lower.\n\nMeanwhile, semiconductor stock Ambarella plummeted more than 19% after its forecast for the current quarter came in light . The company's earnings and revenue for the third quarter also missed expectations.\n\n\"This market is very bifurcated\" between AI and non-AI stocks, said David Wagner, head of equities at Aptus Capital Advisors. \"The market is pulling back obviously due to a pullback in tech, pullback in semis, pullback in the AI narrative, but right now, I don't see that being a growth scare. I see it being a sentiment-based scare\" based on factors such as the composition of Congress in the new year, he added.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tech stocks sink but close well off the lows, Anthropic struggles to rebound above IPO price", "full_content": "Technology stocks fell on Wednesday as excitement over Nvidia CEO Jensen Huang 's return faded and failed to calm concerns over the sustainability of the artificial intelligence trade.\n\nThe tech-heavy Nasdaq Composite declined 0.6% and traded off its lows, recovering from steeper losses earlier in the session. Semiconductor stocks dragged on the index, and the VanEck Semiconductor ETF that tracks the sector edged down 1%.\n\n\"We just feel that this is panic right now,\" Venu Krishna, head of U.S. equity strategy at Barclays, told CNBC's \" Squawk on the Street \" on Wednesday.\n\n\"What the market is telling you is that the AI growth narrative has hit a wall and given the centrality of that theme at the economic level, the market is expecting some sort of a macro shock,\" he added.\n\nAfter notching one of its best days on record Monday, Nvidia has fallen in the days since and slumped 4% Wednesday. Advanced Micro Devices , Marvell Technology and Intel all edged lower. Micron Technology declined 4%.\n\nHuang's return to Nvidia on Monday briefly revived appetite for tech stocks but didn't fully calm investor concerns over the high costs tied to the AI build-out and worries of a potential slowdown.\n\nNvidia stock chart Other stocks tied to the AI trade also plummeted. Oracle fell more than 5%. CoreWeave and Nebius moved lower.\n\nAI lab Anthropic bucked the sell-off, however, and climbed more than 4% after shares dropped below last week's blockbuster IPO price.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "10-year Treasury yield slides despite sticky inflation data as investors buy bonds for protection", "full_content": "U.S. Treasury yields fell on Wednesday, with investors fleeing to bonds for protection after October's personal consumption expenditures price index showed that inflation continued to accelerate.\n\nThe 10-year Treasury note yield \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 was more than 3 basis points lower at 4.866%.\n\nThe yield on the 2-year Treasury note, which typically moves in line with short-term Federal Reserve interest rate decisions, was down more than 2 basis points at 4.65%.\n\nThe longer-dated 30-year Treasury yield, which tends to track geopolitical events, was more than 3 basis points lower at 5.254%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe personal consumption expenditures price index \u2014 the Federal Reserve's preferred gauge of underlying inflation \u2014 rose 3.8% year over year for October, in line with the Dow Jones consensus estimate. Separately, economic growth came in much stronger for the third quarter. Gross domestic product rose at a 4.3% annualized rate, according to a revised Commerce Department estimate.\n\nThe data reinforced expectations for another Fed rate hike in December.\n\n\"[I]t is more urgent than ever that Fed officials step up the pace of interest rate hikes to cool off economic demand,\" said Chris Rupkey, chief economist at FWDBONDS. \"Rate hikes are coming. Lots of them. Bet on it. The economy and inflation are literally on fire.\"", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 02:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Vance says he was assured Jensen Huang was not under DOJ investigation", "full_content": "Vice President JD Vance said Wednesday that Attorney General Todd Blanche told him Nvidia CEO Jensen Huang was not under investigation.\n\n\"I was told by the Department of Justice and multiple officials in our national security apparatus that he was under no investigation,\" Vance told reporters in Ohio on Wednesday after being asked what assurances he had gotten that Huang was not under investigation. \"Not even that he was about to be prosecuted; that he's under no investigation.\"\n\nVance spoke two days after President Donald Trump told CNBC in an interview that an investigation had been done.\n\nTrump was asked what Blanche had told him about potential criminal liability for Huang and the question of whether Nvidia chips had ended up in China in violation of U.S. export laws.\n\n\"They did a pretty good investigation, and they felt that he, himself, was exonerated,\" Trump said Monday.\n\nReuters reported Wednesday that the Department of Justice did not conduct a formal investigation into Huang before Trump pushed for his reinstatement as CEO.\n\nBlanche had concluded there was no evidence Huang had broken any laws based on investigations into Nvidia clients Super Micro Computer and Megaspeed, according to the report.\n\nThe DOJ did not immediately respond to a request for comment on the Reuters report. And the White House didn't immediately respond to a request for comment on Vance saying Huang was under no investigation when Trump had said there was one. Nvidia didn't immediately respond to a request for comment about Vance's remarks.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SpaceX, Musk pledge to donate a share each to active Trump Accounts", "full_content": "SpaceX said Wednesday it will donate one share of the company's class A stock to every active Trump Account , and CEO Elon Musk would personally match the gift.\n\n\"SpaceX is building the infrastructure of the future and working to make life multiplanetary,\" the company said in a statement. \"We believe ownership of the company creating these systems should extend to the next generation of Americans for their long-term benefit.\"\n\nThe White House announced in October that nearly 70 million Trump Accounts had been created, including more than 60 million through auto-enrollment. It's unclear how many are considered active.\n\nEligible children must have their account claimed to enable contributions from family members, friends and employers, and to receive the government's one-time $1,000 seed contribution. Auto-enrolled children can receive philanthropic contributions without a parent or guardian claiming an account, according to TrumpAccounts.gov.\n\nRepresentatives for SpaceX and the U.S. Department of the Treasury did not immediately respond to a request for further details about the planned gift.\n\nSpaceX Chief Operating Officer Gwynne Shotwell had previously agreed to make a personal gift of over 2 million SpaceX shares to Trump Accounts, with eligible account holders expected to receive them in December .\n\nIn October, Elon Musk posted on X that he would give a share of SpaceX to every kid in America next year.\n\nTrump Accounts, also known as 530A accounts, are open to any U.S. child under 18 with a Social Security number.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:23 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Volatility-weary investors side swiped as tariff mayhem adds to tech pain - Reuters", "full_content": "Volatility-weary investors side swiped as tariff mayhem adds to tech pain Reuters Trump unveils new tariffs over excess industrial capacity, undeterred by midterms defeat Reuters Morning Bid: Tariff fear compounds AI recoil Yahoo Finance 5 Things Investors Need to Know About Wednesday\u2019s Markets Investopedia Stocks tumble on new tariffs, inflation worries, leading to an AI sell-off Fast Company", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 02:20 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Yen, Swiss franc gain as dollar slips in volatile AI-driven session", "full_content": "Nov 25 - The safe-haven Swiss franc and Japanese yen gained on Wednesday, while the dollar slipped during a volatile day as AI-related stocks tumbled sharply, before clawing back much of their earlier losses.\n\nThe tech-heavy Nasdaq Composite fell around 4% on a renewed selloff in artificial intelligence-linked stocks, before rebounding to last be down around 0.6%.\n\nStocks mounted \"a huge comeback,\" said Adam Button, chief currency analyst at investingLive. \"I wonder if this is a short-covering rally in a holiday-shortened week but at worst it's a sign of life.\"\n\nMost US markets will be closed on Thursday for the Thanksgiving Day holiday.\n\nThe US currency earlier benefited from the risk-off move, before falling later in the session.\n\nThe dollar index, which measures the greenback against a basket of currencies including the yen and the euro, was last down 0.22% at 103.62, with the euro up 0.17% at $1.0983.\n\nThe greenback has acted as a safe haven when stocks tumble, but it is also swayed by capital inflows and growth expectations linked to the AI trade.\n\nThe Japanese yen strengthened 0.06% against the greenback to 159.13 per dollar. Against the Swiss franc, the dollar weakened 0.63% to 0.83.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:00 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold falls to more than one-year low after data shows U.S. inflation rose further", "full_content": "Gold fell to its lowest level in more \u200cthan a year after strong U.S. inflation data failed to assuage concerns surrounding the Federal Reserve's rate-hike path .\n\nSpot gold was down 0.6% to $3,534.16 per ounce by 1:24 p.m. ET. Earlier, the commodity touched its lowest level since \u200bAugust 2025.\n\nAt one point, the metal fell below the key $3,500 level for the first time since \u200bSeptember 2025.\n\nU.S. gold futures for December delivery dropped 0.9% to $3,529.4.\n\nU.S. inflation rose \u2060further in October, with the Personal Consumption Expenditures Price Index rising 0.3% after an \u200bunrevised 0.5% gain in September, the Commerce Department's Bureau of Economic Analysis said on Wednesday.\n\n\"With \u200binflationary pressures remaining significantly above the Fed target, the likelihood continues that the Fed will raise interest rates moving forward, which adds pressure to gold,\" David Meger, director of metals trading at High Ridge \u200bFutures, said.\n\n\"That's been one of the main themes that remains a headwind for the gold \u200bmarket, and today's PCE data did nothing to allay those concerns.\"\n\nElevated rates tend to diminish the attractiveness \u200cof \u2060non-yielding gold relative to interest-bearing assets.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 01:47 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin Miners Hammered Again as Price Rout Squeezes Margins", "full_content": "(Bloomberg) -- The plunge in the value of Bitcoin is putting pressure on billion-dollar mining companies to liquidate their remaining token reserves, both to cover steep operating costs and to fund an increasingly strained pivot into AI data centers.\n\nA key measure of mining revenue, known as hash price, slumped to its lowest in at least a year as Bitcoin fell to a more than two-year low of around $55,000 last weekend, Hashrate Index data show. JPMorgan Chase & Co. recently estimated the average cost of producing a Bitcoin at around $86,000, though expenses vary significantly among operators.\n\nThose deteriorating economics threaten to compound pressures across the broader crypto market. Even though some of the largest publicly traded operators have already pared their holdings, sustained losses could trigger a fresh wave of forced selling.\n\n\u201cIt\u2019s likely that we\u2019ll see pressure for companies to liquidate their Bitcoin holdings more because the bills have to get paid, payroll has to run regardless of what the price of Bitcoin is,\u201d said Mark Zalan, chief executive officer of Bitcoin-mining services provider GoMining.\n\nBitcoin mining is an energy-intensive process, in which miners invest billions of dollars to build data centers, and purchase specialized computers and massive amounts of power, to earn token rewards released by the Bitcoin network by validating transactions.\n\nMARA Holdings Inc., Core Scientific Inc. and CleanSpark Inc. are among the large publicly traded miners that have already been selling off reserves. Even American Bitcoin Corp., a Trump family-backed firm that once pledged to hold every token its mines in reserve, changed gears and sold Bitcoin to help cover operating costs in the third quarter.\n\nShares of the companies have been been hit hard by the collapse of the token price. MARA has slumped around 40% this year, while CleanSpark is off 50%.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:45 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed survey shows continued growth and sticky inflation in recent weeks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Fed survey shows continued growth and sticky inflation in recent weeks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Fed survey shows continued growth and sticky inflation in recent weeks SECTIONS Fed survey shows continued growth and sticky inflation in recent weeks Reuters Last Updated: Nov 26, 2026, 01
