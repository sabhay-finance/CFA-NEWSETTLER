    const allData = {"general": [{"title": "Microsoft outage hits Outlook. AWS and Google users also report issues", "full_content": "Microsoft suffered a widespread outage on Thursday that impacted thousands of users in North America, according to outage-tracking website Downdetector.com .\n\nThe outage began shortly before 1 p.m. and affected services like Outlook, Teams and 365. Amazon Web Services and Google users also reported outages on the site.\n\n\"We've determined a portion of infrastructure is experiencing elevated load across multiple regions, which is likely contributing to the connectivity errors,\" the company's Microsoft 365 Status account wrote in a post to social media platform X shortly after 1:30 p.m. ET.\n\nThe company determined that the outage was caused by an increase in unavailable servers and launched a restart of impacted servers. The shutdown may be linked to failed health checks caused by a \"specific component that's responsible for processing server health,\" they added .\n\n\"We've taken steps to prevent additional servers from being impacted while we work to return the affected servers to service,\" Microsoft added.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 02:27 AM IST", "pub_date_relative": "just now"}, {"title": "Nvidia live updates: Jensen Huang had \u2018intimate relationship\u2019 with second employee, Reuters reports", "full_content": "Nvidia CEO Jensen Huang is stepping down as CEO of the chipmaker he co-founded 33 years ago and built into a $4 trillion company that powered the artificial intelligence boom, the company announced Thursday.\n\n\"The Board has full confidence in Colette and the leadership team, and we expect the company's operations, customer commitments and product roadmap to continue without interruption,\" said board chair Harvey Jones in a release announcing the news.\n\nThe company will begin the search for a permanent CEO to replace Huang and will consider both internal and external candidates, according to the release.\n\nKress also provided a statement in the release, but Huang was not quoted.\n\nAfter a meteoric rise to fame due to Nvidia's central role in AI, Huang's dramatic fall has been even more rapid, following a series of stinging revelations about his romantic ties to a woman believed by the U.S. intelligence community to be a Chinese spy.\n\nHuang, 63, apologized on Sunday for being \"unfaithful to my wife,\" though he provided no details about the affair with businesswoman Alice Huang, who has worked for a Chinese company and Nvidia customer called Megaspeed. Late Wednesday, The New York Times reported that the Nvidia CEO also had a separate affair, this one with Kimberly Powell, vice president of health care at the chipmaker. Later that afternoon, The Times and other outlets reported that Nvidia's board met to discuss the company's future.\n\nHuang's downfall also puts the spotlight on President Donald Trump , who formed a particularly close relationship with the CEO of what, until recently, was the world's most valuable company. Huang became a key voice on U.S. AI policy while pushing for issues that were in Nvidia's interest, such as preserving access to open-source AI, and lobbying to allow chip exports to China.\n\nPresident Trump lamented the \"horrible thing\" that happened to Huang in an interview conducted hours after his close corporate ally resigned as Nvidia's CEO.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 02:26 AM IST", "pub_date_relative": "1m ago"}, {"title": "Earnings call transcript: Banrisul Q3 2026 profit falls as credit costs bite", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:25 AM IST", "pub_date_relative": "3m ago"}, {"title": "Dollar scales fresh 19-month peak, yen hits 160 for first time since September", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:23 AM IST", "pub_date_relative": "4m ago"}, {"title": "Nasdaq falters as Nvidia shares fall on CEO exit, oil prices rise: Live updates", "full_content": "The Nasdaq Composite fell on Thursday as investors assessed the departure of Nvidia CEO Jensen Huang and the outlook of the conflict in the Middle East\n\nThe tech-heavy Nasdaq dropped 0.5%, while the Dow Jones Industrial Average shed 99 points, or 0.2%. The S&P 500 fell 0.3%.\n\nNasdaq Composite, 1 day Nvidia shares fell more than 5% after the company announced that Huang had resigned and named CFO Colette Kress as interim CEO. This comes after Huang reportedly had an affair with an alleged Chinese spy.\n\nWhile the stock remained under pressure, selling pressure had eased considerably from earlier in the day \u2014 shares were down double digits at one point after the announcement.\n\nInvestors moved into competitors of Nvidia, particularly Advanced Micro Devices and Broadcom , which were up around 5% each. Hyperscalers such as Alphabet \u2014 a key buyer of Nvidia chips and leader of the AI rally \u2014 also increased nearly 2%.\n\n\"This is a golden opportunity for Amazon, for Google, for AMD, for Broadcom, for OpenAI and Anthropic, who are hiring chip experts to help them design their own chips,\" said Jed Ellerbroek, portfolio manager at Argent Capital Management.\n\n\"Nvidia's fate as one company is one thing, but this AI revolution is way bigger than that,\" he also said. \"If Nvidia falls from grace and their chips are no longer the best, and AMDs are better or Google's are better, then people will switch over and buy them. The demand for the chips is not is not going down.\"\n\nHurting sentiment further, oil prices rose after after President Donald Trump said in a Truth Social post , \"We don't need a deal with Iran. Those days have long since passed.\" U.S. West Texas Intermediate crude futures rose 2.55% to settle at $88.74 per barrel, while Brent crude futures added 3.3% to settle at $95.82 a barrel.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 02:23 nezuela\u2019s oil revenues, report says", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:18 AM IST", "pub_date_relative": "9m ago"}, {"title": "Nvidia CEO Jensen Huang resigns in blow to AI boom he helped foster", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:18 AM IST", "pub_date_relative": "9m ago"}, {"title": "The bond market now has an even bigger fear than AI fallout", "full_content": "Carnage in tech stocks made Treasurys look more attractive in recent weeks, but fears of more Fed rate hikes are now driving yields higher", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 02:14 AM IST", "pub_date_relative": "14m ago"}, {"title": "US stocks: Retail buyers limit Nvidia stock rout", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Retail buyers limit Nvidia stock rout Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Retail buyers limit Nvidia stock rout SECTIONS US stocks: Retail buyers limit Nvidia stock rout Reuters Last Updated: Nov 13, 2026, 02:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Retail investors poured a record $111 million into Nvidia shares during Thursday\u2019s first half-hour of trading, helping the stock trim an opening loss of as much as 14% to about 5%. The dip-buying suggests confidence in the AI trade remains resilient despite CEO Jensen Huang\u2019s departure and Nvidia\u2019s loss of more than $1 trillion in market value over five weeks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 02:06 AM IST", "pub_date_relative": "21m ago"}, {"title": "Alice Huang tied to Nvidia\u2019s biggest Chinese competitor", "full_content": "Alleged Chinese spy Alice Huang may have simultaneously owned stakes in businesses in China that benefited Nvidia's biggest competitor in China, Huawei, while she was in business with Nvidia and also reportedly having a romantic affair with its ousted CEO Jensen Huang .\n\nThe connection between Alice Huang and Huawei was first discovered by analysts at private intelligence firm Tesari. The firm exclusively shared its findings with CNBC. Tesari provides intelligence research to private companies and the U.S. government.\n\nThis previously unreported entanglement was first uncovered by the research firm which uses artificial intelligence to collect evidence and specializes in national security investigations around the world. The connections may raise questions about Alice Huang's intent and conduct in her relationship with the CEO and whether Jensen Huang knew his romantic partner was closely connected with his competition. Jensen Huang has acknowledged having an affair, though the precise timing of his relationship with Alice Huang is unknown.\n\nThe mysterious saga of Alice Huang involves a tangle of interlocking corporations and transactions that show her connection to entities that ultimately provided computing power to Huawei in China.\n\nHuawei is known as a Chinese government \"state champion\" in the technology and telecommunications sectors, meaning it receives enormous financial support from the government in Beijing so it can lower prices and undercut global competitors.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 02:04 AM IST", "pub_date_relative": "23m ago"}, {"title": "Trump says \u2018we don\u2019t need a deal with Iran\u2019", "full_content": "The U.S. should no longer seek a deal with Iran, President Donald Trump said Thursday as he directed Vice President JD Vance to instead focus his attention on corruption and crime in Democratic cities and states.\n\n\"We don't need a deal with Iran. Those days have long since passed,\" Trump wrote in a Truth Social post.\n\n\"We've got their money, Hundreds of Billions of Dollars, and we've got their Strait!\" Trump wrote, referring to the Strait of Hormuz, a key choke point in the ongoing U.S.-Iran war.\n\nThe announcement came just over a week after Republicans suffered huge losses in the midterm election. Vance and other Republicans have pinned those losses on the Iran war, which the U.S. and Israel started in late February.\n\nIn the weeks leading up to Election Day, Trump repeatedly suggested the U.S. could resume launching military strikes, which have largely subsided as a tense stalemate has taken hold in the region.\n\nThe Wall Street Journal on Wednesday reported that Vance, who has led diplomatic efforts with Iran in prior months, was considering face-to-face talks with a top Iranian security official.\n\nThe unpopular Iran war, which Trump and others in his administration said would be won in a matter of weeks, is now in its ninth month with no clear end in sight. The conflict has driven up global energy prices, creating a ripple effect through the economy and exacerbating concerns about inflation and affordability that were paramount to voters in the midterms.\n\nCorruption emerged as another top issue that broke in Democrats' favor in the election. Trump's post Thursday morning attempts to flip the script, blaming Democratic-run areas for allowing corruption and crime to proliferate.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 02:04 AM IST", "pub_date_relative": "24m ago"}, {"title": "Jensen Huang's exit from Nvidia raises critical questions about the future of AI", "full_content": "Michael Dell described Jensen Huang as a \"visionary of the AI age.\" Deutsche Telekom CEO Tim H\u00f6ttges said a photo with the Nvidia CEO produced more media coverage for his company than its iPhone launch. During the keynote of his annual Dreamforce conference, Salesforce's Marc Benioff said, \"Jensen, we're all following you, bro,\" as the two paced through the audience.\n\nFollow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation\n\nHis fame extended way beyond tech. In May, Huang joined President Donald Trump on Air Force One for a trip to China to meet with President Xi Jinping . Three months later, Huang gathered six of the biggest names at the Nasdaq to announce on CNBC a proposed $500 billion artificial intelligence buildout plan, cementing his central role at the intersection of Wall Street and Silicon Valley.\n\nAs Nvidia became the first company to rip past a $5 trillion market cap, bending the laws of physics with its advanced graphics processing units and pushing the AI boom to seemingly endless bounds, the now 63-year-old Huang, clad in a black leather jacket, traversed the globe as the face of the brand powering the next industrial revolution.\n\nOver the past week it all came crashing down. Following two reported extramarital affairs \u2014 one with an alleged Chinese spy and another with an employee \u2014 Huang is leaving the company he co-founded 33 years ago in crisis, and thrusting the AI market into chaos. The board is now left to pick a successor for a company that's been run by a singular figure with no second-in-command. Chief Financial Officer Colette Kress has been named interim CEO. Harvey Jones has been appointed chairman.\n\n\"How companies handle a crisis determines their future,\" former Cisco CEO John Chambers, now a startup investor, told CNBC's \" Fast Money \" on Wednesday.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 02:02 AM IST", "pub_date_relative": "26m ago"}, {"title": "Lutnick should ban Chinese memory maker CXMT from U.S., Sen. Cotton says", "full_content": "Sen. Tom Cotton , R-Ark., is urging the Trump administration to take a harsher stance toward Chinese memory maker ChangXin Memory Technologies .\n\n\"CXMT, one of Communist China's national memory chip champions, poses a growing risk to our economic prosperity and military superiority,\" Cotton wrote in a letter sent Thursday to Commerce Secretary Howard Lutnick. \"The U.S. must take action to prevent CXMT from gaining a stronger foothold in the global market.\"\n\nCXMT is the world's fourth-largest producer of DRAM \u2013 or dynamic random access memory \u2013 which powers many basic functions of computers and smartphones.\n\nCotton, in a letter first obtained by CNBC, is asking Lutnick to push CXMT onto the department's Bureau of Industry and Security Entity List, which would significantly restrict U.S. firms' ability to do business with the company.\n\n\"It basically means that U.S. companies are not allowed to do business with that entity-listed company, and that entity-listed company does not get access to U.S. technology,\" said Kyle Chan, a Brookings Institution fellow who studies China's technology development.\n\nDRAM is a \"commodity,\" MS Hwang , research director at Counterpoint, told CNBC, meaning it is made to a global standard and is generally interchangeable from one manufacturer to another.\n\nHowever, with the right production technology, it can also form the building blocks of HBM, or high-bandwidth memory. HBM is an extremely high-demand product that powers AI chips made by Nvidia , Google and Amazon Web Services, which are central to the growth of artificial intelligence giants including Anthropic and OpenAI. It's made by just three main companies: Samsung , SK Hynix and Micron .\n\nThe Commerce Department and CXMT didn't immediately respond to CNBC's requests for comment.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:58 AM IST", "pub_date_relative": "29m ago"}, {"title": "United Airlines won\u2019t let AI agents book your flight. Expert says you shouldn't let a bot do that for you, anyway", "full_content": "United Airlines said Wednesday it would be restricting artificial intelligence bots from its digital platforms, warning that allowing third-party AI assistants to access account credentials could expose sensitive personal information, lead to unintended purchases or other unauthorized account activity. The move is similar to Amazon's recent blocking of Meta's Muse agent from making purchases on its site.\n\nStill, AI agents can complete a wide range of tasks on your behalf. Instead of just asking Muse what the weather will be tomorrow, you can tell it to suggest an outfit based on tomorrow's weather forecast and book you a rideshare if it's going to rain, for example. Or, rather than just creating an itinerary for your next vacation, you can connect a payment option and have your Dot \u2014 OpenAI's agent offering \u2014 book flights, hotels and excursions for you.\n\nYou can even have an AI agent buy and sell stocks through investing platforms like Robinhood.\n\nRelying on an AI agent for any of these tasks may come with mixed results depending on which agent you use, what data you allow it to access and the complexity of the task you've asked it to carry out. Because broadly, agentic AI is still in its infancy, you may not want to let an agent make decisions \"anytime [your] health, wealth, or privacy are involved,\" says Shomit Ghose, adjunct professor at the University of San Francisco School of Management, and lecturer at the University of California, Berkeley College of Engineering.\n\n\"You can have agents do interesting things for you, like categorize your spending, or flag unusual charges, or model what-if scenarios,\" he says. \"Those are good things, but bad things would be moving money, making trades, filing forms.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:54 AM IST", "pub_date_relative": "33m ago"}, {"title": "I\u2019m 17 and will be a first-generation college student. Is law school worth being $200,000 in debt?", "full_content": "\u201cI\u2018\u2019m considering a pre-law track \u2026 I\u2019m just a bit hesitant because of how expensive law school is.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 01:47 AM IST", "pub_date_relative": "41m ago"}, {"title": "US Fed sets new meeting schedule for 2027, as foretold by Chairman Kevin Warsh", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US Fed sets new meeting schedule for 2027, as foretold by Chairman Kevin Warsh Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Fed sets new meeting schedule for 2027, as foretold by Chairman Kevin Warsh SECTIONS US Fed sets new meeting schedule for 2027, as foretold by Chairman Kevin Warsh By Reuters Last Updated: Nov 13, 2026, 01:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Federal Reserve will hold seven rate-setting meetings in 2027 instead of the customary eight, while dedicating its October gathering to broader monetary-policy strategy. The revised schedule also moves the year\u2019s final policy meeting to November and removes designations for quarterly economic projections as Chair Kevin Warsh reviews the Fed\u2019s communication practices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 01:42 AM IST", "pub_date_relative": "45m ago"}, {"title": "Donald Trump Jr. exits advisory role at Kalshi prediction market", "full_content": "Prediction market platform Kalshi ended its advisory contract with Donald Trump Jr. in response to his venture capital firm, 1789 Capital, also holding a stake in rival platform Polymarket, according to Kalshi's spokesperson.\n\nConversations on Trump Jr.'s exit began in August after 1789 Capital announced a major stake in Polymarket , the spokesperson said. It was a mutual arrangement, with both Kalshi and Trump Jr. agreeing it was a conflict of interest to keep the president's son as an advisor while serving as a top investor for Polymarket, the spokesperson added.\n\nTrump Jr.'s departure comes after Democrats secured a majority across the House and the Senate, with the party expected to crack down on the prediction market industry. While Trump Jr. has exited Kalshi, he still serves as an advisor to Polymarket. His ties to the industry could make prediction markets an easy target for lawmakers to go after, Joseph Konizeski, a former trial attorney in the CFTC, previously told CNBC.\n\nIn early October, Kalshi CEO Tarek Mansour said on MS NOW that Trump Jr.'s connection to the company creates an \"optics issue,\" but added that it has never relied on that relationship to gain favor with the government.\n\nKalshi first named Donald Trump Jr. a strategic advisor for the company in January 2025.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:33 AM IST", "pub_date_relative": "54m ago"}, {"title": "Outlook outage: Microsoft reports 'issues' with Teams and email - ABC News - Breaking News, Latest News and Videos", "full_content": "Outlook outage: Microsoft reports 'issues' with Teams and email ABC News - Breaking News, Latest News and Videos Microsoft 365 hit by multi-region connectivity issues amid elevated infrastructure load Fox Business Microsoft \u2018restarting\u2019 as outage impacts global users, with Outlook and Teams affected The Guardian Outlook Outage: Microsoft\u2019s Email Service Goes Down Nationwide Variety Microsoft 365, Outlook down for thousands of US users, Downdetector shows Reuters", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 01:33 AM IST", "pub_date_relative": "54m ago"}, {"title": "United Airlines blocks AI agents from booking flights - The Washington Post", "full_content": "United Airlines blocks AI agents from booking flights The Washington Post United Airlines Blocks A.I. Agents From Booking Flights on Customers\u2019 Behalf The New York Times Exclusive | United Airlines Is Banning AI Bots From Booking Flights WSJ United Airlines Alone In Blocking AI Agents From Booking Flights\u2014Rivals Say Customers Assume Risk Forbes United Airlines bans AI agents from booking flights on behalf of travelers CBS News", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 01:32 AM IST", "pub_date_relative": "55m ago"}, {"title": "Jensen Huang is out and Nvidia stock is down\u2014what market pros say about buying dips", "full_content": "Nvidia co-founder Jensen Huang has resigned as the firm's president and CEO, the company announced Thursday. Investors reacted negatively to the news. By 2:30 p.m., shares of the chipmaking giant were down more than 5%, and now sit 31% below their high on October 6.\n\nIt's easy to see why Huang's departure, which comes amid revelations of his romantic ties to a woman believed by the U.S. intelligence community to be a Chinese spy , has investors feeling queasy. The company Huang co-founded 33 years ago \u2014 and whose chips have powered the artificial intelligence boom \u2014 has grown into the firm currently valued at about $4 trillion under his leadership.\n\n\"The premise here is that there is no successor to a generational founder,\" says Michael Monaghan, portfolio manager of the Founders 100 ETF, which invests in founder-led companies. \"It's that they're one of one, and what they bring from a vision, execution and grit standpoint is not replaceable.\"\n\nWhile some investors are exiting Nvidia positions based on that premise \u2014 Monaghan's fund must, per its prospectus \u2014 others will see the slip in Nvidia's price as an opportunity to buy a great stock on proverbial sale , he says.\n\nLooking purely at the numbers, the opportunity to buy a stock with Nvidia's prodigious projected growth at its current depressed price \"happens once a decade, maybe once in a career as an investor,\" he says.\n\nIn investing parlance, the latter group of investors is \" buying the dip \" \u2014 investing in an asset after a decline in its value in anticipation of a bounceback. Whether it's a prudent strategy for you with Nvidia or any other stock requires some examination, investing experts say \u2014 not only of the stock in question, but your own portfolio strategy.\n\nWhen an investment you own or are interested in declines, your first move is to examine your reason for buying or holding it, says Tom Hainlin, national investment strategist at U.S.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:31 AM IST", "pub_date_relative": "57m ago"}, {"title": "Who will replace Jensen Huang? Here's our early thoughts on the search for Nvidia's next CEO", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:30 AM IST", "pub_date_relative": "57m ago"}, {"title": "Nvidia: Ex-prosecutor Joon Kim and Wachtell, Lipton bring big track record to investigation", "full_content": "Joon Kim , the lawyer tapped by artificial intelligence chip giant Nvidia to investigate its former CEO Jensen Huang , and the Big Law firm he works for have a long history of investigating high-profile cases.\n\nKim, in his career as a top federal prosecutor and as an attorney in private practice, has had in his sights mobster John \"The Teflon Don\" Gotti's son, former New York Gov. Andrew Cuomo , the Federal Deposit Insurance Corp . and other high-profile people and companies.\n\nThe law firm that Kim recently joined \u2014 Wachtell, Lipton, Rosen & Katz \u2014 this year conducted an investigation for the NBA of the Los Angeles Clippers and its billionaire owner, Steve Ballmer , which ended with the basketball league imposing stiff sanctions on Ballmer and the Clippers for violating salary cap rules in connection with superstar Kawhi Leonard.\n\nOn Tuesday, Nvidia said it had retained Kim, 55, and Wachtell, Lipton to \"conduct a thorough and independent investigation\" of allegations that its then-CEO Jensen Huang had been the target of a foreign intelligence effort involving his affair with a woman, Alice Huang. U.S. intelligence suspects her of being a spy for China .\n\nJensen Huang resigned as CEO on Thursday morning on the heels of a New York Times report that he had also had an extramarital affair with an Nvidia executive, Kimberly Powell, who reports to him.\n\nThat allegation could be added to the list of issues that Kim will be looking into as part of his probe.\n\nNvidia did not immediately respond when asked if the parameters of the investigation would be affected by the new claim. A spokeswoman for Wachtell, Lipton declined to comment for this article on behalf of the firm and Kim.\n\nFriends and former colleagues of Kim said Nvidia has made a smart decision in retaining him for the job.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia live updates: Following Jensen Huang's resignation as CEO, allegations of a third affair emerge - Yahoo Finance", "full_content": "Nvidia live updates: Following Jensen Huang's resignation as CEO, allegations of a third affair emerge Yahoo Finance Who is Colette Kress, Nvidia\u2019s new interim CEO? NBC News Jensen Huang Said to Have Had Relationship With Nvidia Executive Who Reports to Him The New York Times Before Nvidia, Jensen Huang washed dishes in Oregon Axios EXCLUSIVE: Former Nvidia CEO Huang had a relationship with a second employee, sources say Reuters", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 01:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "The S&P 500 is shrugging off Nvidia\u2019s selloff. Here\u2019s what\u2019s keeping the rest of the market afloat.", "full_content": "Investors have been forced to look up from the poster child of the artificial-intelligence trade and remember the other stocks on the board.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 01:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018A dark day for Nvidia\u2019: Here\u2019s what analysts have been saying about Jensen Huang\u2019s departure", "full_content": "Nvidia investors are preparing for a future without Jensen Huang after the CEO's resignation was announced on Thursday.\n\nMarkets were on tenterhooks ahead of the decision amid reports that the chip giant's board had convened to discuss his future with the company. By the time of the announcement, at least six analysts had downgraded the stock between Wednesday night and Thursday morning.\n\nThe New York Times on Wednesday reported that Huang had engaged in a second extramarital affair with an employee. The CEO was already under scrutiny after Huang admitted to having a romantic relationship with a woman U.S. intelligence believes is a Chinese spy.\n\nNvidia announced on Thursday morning that, following a board meeting, Huang would step down after more than 30 years at the company's helm.\n\nThose downgrading the stock included longtime Nvidia bull Ben Reitzes of Melius Research.\n\nNvidia shares were seen down more than 12% shortly after the open on Wall Street, bringing losses for the last month close to 25%.\n\nHere's what analysts and investors are saying about the company and the stock.\n\nReitzes changed his rating for Nvidia to hold from buy. His price target is now $185 \u2014 down from $315 \u2014 is 6% above the level at which shares last closed.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:17 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump administration is hiring debt collectors to go after defaulted student-loan borrowers for first time in 6 years", "full_content": "The Treasury Department proposes to pay debt collectors much less than in the past to help borrowers get out of default.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 01:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Watch these levels to know if Nasdaq-100 is set to break out", "full_content": "Todd Gordon breaks down the charts in a confusing market.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia stock pares morning losses after CEO Jensen Huang announces resignation", "full_content": "Follow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation here.\n\nNvidia shares were trading down 5% on Thursday after Jensen Huang announced he would immediately step down as CEO and a member of the board at the chipmaker. The stock hovered just under $4 trillion in market cap, after paring steeper losses earlier in the day of as much as 14%. Nvidia has closed above the market cap benchmark since July 2025.\n\nChief Financial Officer Colette Kress will serve as interim CEO until a new leader is appointed, Nvidia said in a Thursday statement. Harvey C. Jones, former CEO of Synopsys, will become the first-ever chair of the board.\n\nOn Sunday, Huang admitted to having an affair . The CEO was romantically involved with Alice Huang, an executive at cloud company Megaspeed , according to The Financial Times , who U.S. intelligence officials believe is a spy for China.\n\nThe New York Times on Wednesday reported that Huang had another extramarital relationship with Kimberly Powell, vice president of health care at Nvidia. Powell reports to Huang, according to the Times.\n\nNvidia shares over the past five days. Before Huang resigned, several Wall Street analysts told CNBC that this departure could lead the stock to fall 20%, given how critical he has been to Nvidia's success. Nvidia's stock is already down more than 20% over the last month.\n\nBernstein on Thursday slashed its price target on Nvidia's stock by half from $400 to $200.\n\nStacy Rasgon, a senior analyst at Bernstein, told CNBC's \"Squawk Box Asia\" on Thursday that Huang's alleged affair with a direct report means it is \"much tougher for the board to leave him in position.\"", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Here's what Nvidia interim CEO Colette Kress and board chair Harvey Jones wrote to Nvidia employees", "full_content": "On the heels of founder Jensen Huang's resignation as CEO of Nvidia , new interim CEO Colette Kress and board chair Harvey Jones sent emails to employees Thursday expressing gratitude and optimism for the future.\n\nCNBC obtained copies of the emails from a source familiar with the matter, who said Jones sent the first email and Kress replied shortly after.\n\nFollow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation\n\n\"The Board, Estaff and I recognize that this has been an extraordinarily difficult period and I want you to know how grateful we are for your resilience, professionalism and continued dedication,\" Kress wrote in her email.\n\nThe term Estaff is commonly used to refer to executive staff, the group of direct reports to C-suite executives at a company. Nvidia will host a company meeting on November 18 at 9am PST, her email said.\n\nBoard chair Jones took a similar tone in his email, and praised Kress as \"a key architect of NVIDIA's growth and capital strategy.\"\n\n\"The Board has full confidence in Colette to deliver on our commitments to shareholders, customers, partners, and to each of you,\" Jones wrote.\n\nI believe deeply in this company and in its future. More than anything, I believe in each of you, in our customers and partners and in the vital role we play every day in the global economy.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves Thursday: Super Micro Computer, Nvidia, CoreWeave, Nebius, Yeti & more", "full_content": "Nvidia was front and center once again on Thursday, after Jensen Huang resigned from his post as CEO on the heels of another extramarital affair.\n\nCoreWeave dipped as traders cashed in some of their chips following the stock's massive gains a day earlier. Fellow neocloud play Nebius tumbled after lifting its 2026 forecast for capital expenditures spending.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nThe maker of data center servers fell on Thursday after Bloomberg News reported, citing a person familiar, that the Justice Department is looking into whether Alice Huang helped smuggle Super Micro Computer's products.\n\nSuper Micro Computer on Thursday Alice Huang is the woman with whom former Nvidia CEO Jensen Huang had had an affair . U.S. intelligence officials also believe her to be a Chinese spy.\n\nAustin, Texas-based Yeti Holdings sank 8%, extending a three-day decline, after third-quarter adjusted revenue of $517.9 million missed Wall Street analyst estimates of $523 million and the cooler and travel mug maker lowered full-year forecasts for earnings per share excluding one-time items, adjusted revenue and adjusted operating income.\n\nYeti has now tumbled 14% in three days and more than 22% in the past three months.\n\nThe New Jersey-based neocloud provider sank almost 8%, one day after soaring 25% in the wake of better-than-expected third-quarter results.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang's Nvidia exit casts shadow over Wall Street\u2019s $500 billion AI financing bet", "full_content": "Leadership change at Nvidia has the potential to threaten financing of the artificial intelligence boom and test Jensen Huang's $500 billion vision to turn AI chips into tradable debt securities.\n\nThe Nvidia CEO's resignation was announced Thursday following revelations that he had two extramarital affairs \u2014 one with an employee and the other with a woman believed by U.S. intelligence to be a Chinese spy .\n\nNvidia. Shares in the tech giant \u2014 which has become central to the AI build-out in recent years \u2014 initially plunged more than 13% following Huang's resignation, before paring losses.\n\nNvidia has never identified a successor to Huang, who has led the chipmaker since its founding in 1993. Colette Kress, chief financial officer, has been named interim CEO.\n\nFollow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation\n\nThe company has been dubbed the \"central bank\" of the AI build-out, with Huang seen as the \"hypeman\" for the sector and its chips considered the industry's gold standard.\n\nHuang's departure raises a central question: whether his successor can carry forward a financing strategy designed to transform GPUs from rapidly depreciating hardware into bankable infrastructure assets\n\nThe $4.2 trillion firm's industry dominance, with Huang front and center, allowed it to sign memorandums of understanding with some of Wall Street's biggest asset managers, intended to secure third-party capital for a landmark $500 billion AI financing drive .", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold drops to over one-year low as fading Middle East peace hopes fan inflation fears", "full_content": "Nov 12 (Reuters) - Gold prices slid 3% on Thursday, extending losses for a third straight session to hit a more-than-one-year low, as oil prices climbed on fading hopes for peace in the Middle East that spurred fears of higher inflation and elevated interest rates.\n\nSpot gold dipped 2.7% to $3,880.93 per ounce by 1:53 p.m. ET (1855 GMT), having touched its lowest level since October 2025 earlier in the session.\n\nUS gold futures for December delivery settled 2.9% lower at $3,885.30 per ounce.\n\nUS President Donald Trump said on social media that the US did not need a deal with Iran, quashing hopes of a deal to end the conflict.\n\nOil rose, fanning inflationary concerns and expectations that the US Federal Reserve could keep interest rates higher for longer.\n\n\"Higher energy prices continue to warrant a hawkish Fed, and a hawkish Fed is an environment of higher interest rates and hence a headwind for the yellow metal,\" David Meger, director of metals trading at High Ridge Futures, said.\n\nA hot US inflation reading on Tuesday, hawkish remarks from Fed officials this week and a US dollar rally to a near 19-month high \"are working to press the gold market lower,\" said Jim Wyckoff, a market analyst at American Gold Exchange.\n\nTraders see an 87% chance of a 25-basis-point rate hike in December, while the probability of a larger 50-basis-point move also increased.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s stock selloff may be just beginning, even after shedding 30% from its peak", "full_content": "While shares of Nvidia look cheap on paper and on the charts, Wall Street analysts see more volatility ahead.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 12:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "This identity verification leader is growing beyond airports \u2014 and investors are noticing", "full_content": "Clear Secure is pairing membership growth in its airport business with fast-rising Clear1 bookings, strengthening its investment case.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 12:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "The prostate-cancer screening rules just changed. Here\u2019s when men should get tested.", "full_content": "The American Cancer Society now recommends most men get their first PSA test when they turn 50. Black men and other men considered high risk should start screening at age 45.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 12:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "In a policy switch, the Fed says its October 2027 meeting will not see a vote on interest rates", "full_content": "The Federal Reserve won't vote on a potential interest-rate change at its October 2027 meeting, a departure that is part of a broader initiative from Chairman Kevin Warsh aimed at reducing the central bank's market footprint.\n\nAccording to an announcement Thursday, the rate-setting Federal Open Market Committee will set aside its Oct. 26-27 session for \"the discussion of broad monetary policy strategy issues.\"\n\nWarsh announced the move at his news conference after the FOMC met in October, though he did not specify which meeting would be affected.\n\nIn 2027, there will be seven voting meetings, with the October session set up as extra time for policy deliberation without a formal vote or post-meeting statement. The new calendar shows that the final meeting of the year will now take place in November. It had previously been set for December.\n\n\"Now, what's the reasoning behind this change? To me, it's quite straightforward,\" the chairman said in explaining his rationale. \"Getting policy right involves assessing near-term developments at timely, regular, and information-rich intervals.\"\n\n\"But it's equally important we reserve time and space, as an intellectually diverse group, for strategic deliberations\u2014for thinking anew about big questions, looking out over longer time horizons, focusing, as I say, on the left side of the decimal point,\" he said.\n\nWarsh has been critical of the Fed's prior communications strategy, saying policymakers spent too much time providing guidance on policy moves that handcuffed them when it came time to make decisions.\n\nUnder typical practice, the Fed meets eight times a year, following with a vote on interest rates and then a news conference from the chair.", "source": "CNBC Finance", "pub_date_str": "13 Nov 2026, 12:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oil prices rise after Trump says no Iran deal needed: 'We've got their Strait'", "full_content": "U.S. oil prices rose Thursday, as comments from President Donald Trump stoked worries that an end to the U.S.-Iran war was not in sight.\n\nBrent crude traded 1.9% higher at $94.48 per barrel. West Texas Intermediate futures were up 2% at $88.19 per barrel.\n\n\"We don't need a deal with Iran. Those days have long since passed. We've got their money, Hundreds of Billions of Dollars, and we've got their Strait!\" Trump said in a Truth Social post .\n\nJeffrey Currie, founder of Real Macro and a widely followed forecaster on Wall Street, said oil prices in the near term will remain tame because there is now a substantial amount of volume coming out of the Middle East. However, he noted that sky-high insurance and tanker rates are keeping prices elevated on longer-dated oil futures contracts.\n\n\"While it caps the prompt barrel, it does nothing to cheapen the next one, which is why you can't get bearish here nor can you get really bullish,\" said Currie to CNBC's \"The Exchange.\"\n\nOn the investing front, Currie said he still favors long-dated oil and the drilling and producer stocks.\n\nBrent and WTI- YTD Thursday's moves come as oil prices have been under pressure after comments from Trump following the U.S. midterm elections eased fears of further strikes on Iran. WTI is down 16% in November, and Brent has lost 20%.\n\nTrump said Sunday that fresh attacks were highly unlikely as talks to end the conflict progressed, despite both \u2060countries reporting that shipping had been hit in or near the Strait of Hormuz. He also said further military action did not appear necessary \"at this point,\" easing concerns about prolonged disruptions to Middle East oil supplies.", "source": "CNBC Finance", "pub_date_str": "13 Nov 2026, 12:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen and Lori Huang's Nvidia fortune is jointly controlled. How that makes things complicated now that he's resigned", "full_content": "A version of this article appeared in CNBC's Inside Wealth newsletter, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions straight to your inbox.\n\nJensen Huang's $140 billion stake in Nvidia is largely held by trusts that are co-owned with his wife, Lori, creating added uncertainty for the shares and his financial future following his resignation from the company, according to attorneys and SEC filings.\n\nFollow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation\n\nHuang and his wife jointly own about 800 million Nvidia shares worth roughly $135 billion through a complex web of trusts and LLCs created for tax and estate planning purposes, according to SEC filings. Jensen Huang directly owns about 70 million shares valued at about $12 billion.\n\nWhile owning company stock through a trust is common among tech founders and CEOs, it's less typical for a founder to have equal ownership with a spouse, tax experts say. The arrangement further complicates Huang's sudden exit from the company, but could prove to be a stabilizing force for the shares, since the trusts make it more difficult for either Huang or his wife to quickly sell.\n\n\"Each of Mr. Huang and his wife may be deemed to have shared beneficial ownership of, and to exercise shared voting and investment power over,\" according to an SEC filing.\n\nAccording to the filings, Jensen and Lori Huang own about 530 million shares as co-trustees of the Jen-Hsun and Lori Huang Living Trust, created in 1995. They're also co-trustees of the Huang 2012 Irrevocable Trust, which owns 31.4 million shares, and the Huang Irrevocable Remainder Trust, which owns 109 million shares. About 135 million shares are held by LLCs that have the Living Trust as the sole member, according to the filings.\n\nLori Huang is the president of the Jen-Hsun and Lori Huang Foundation, which owns 69 million shares and reported $9 billion in net assets in 2024, according to IRS filings.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 12:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Electrification is only part of the climate battle", "full_content": "A COP31 pledge to expand electric power ought to have a green target attached", "source": "FT Markets", "pub_date_str": "13 Nov 2026, 12:19 AM IST", "pub_date_relative": "2h ago"}, {"title": "Kalshi ends Donald Trump Jr's advisory contract due to Polymarket conflict", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Kalshi ends Donald Trump Jr's advisory contract due to Polymarket conflict Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Kalshi ends Donald Trump Jr's advisory contract due to Polymarket conflict SECTIONS Kalshi ends Donald Trump Jr's advisory contract due to Polymarket conflict Reuters Last Updated: Nov 13, 2026, 12:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Prediction-market platform Kalshi has ended Donald Trump Jr.\u2019s advisory role by mutual agreement after his venture-capital firm, 1789 Capital, increased its investment in rival Polymarket. Discussions began after 1789 Capital led Polymarket\u2019s latest funding round, according to a Kalshi spokesperson.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 12:16 AM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018He calls my plans a fantasy\u2019: My husband says we can\u2019t afford our $200,000-a-year dream retirement. I think he\u2019s cheap.", "full_content": "\u201cWe have $2 million saved in our retirement accounts and a house worth $1.3 million.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 12:16 AM IST", "pub_date_relative": "2h ago"}, {"title": "Rail Vikas Nigam in focus today after mixed Q2 performance; stock down 68% from record peak", "full_content": "A Ksheerasagar Published 13 Nov 2026, 12:13 AM IST Prefer Livemint on Google Shares of Rail Vikas Nigam (RVNL) are expected to attract investor interest during Friday's trade, November 13, after the railway major reported its financial performance for the September quarter (Q2 FY27) post-market hours on Thursday.\n\nThe company reported a net profit of \u20b9 253.71 crore in Q2 FY27, registering a growth of 10% year-on-year (YoY) compared to \u20b9 230.52 crore in Q2 FY26. The growth in profitability came despite a decline in revenue, supported by a reduction in expenses during the quarter.\n\nRevenue from operations declined by 8.24% YoY to \u20b9 4,701 crore in Q2 FY27 from \u20b9 5,123 crore in the corresponding quarter of the previous financial year.\n\nOn the operating front, RVNL reported an operating profit of \u20b9 264 crore in Q2 FY27, marking an increase of 19.51% compared to \u20b9 221 crore in Q2 FY26, indicating an improvement in operating performance despite the decline in revenue.\n\nFor the first half of FY27 (H1 FY27), RVNL reported a net profit of \u20b9 413.23 crore, registering a growth of 13.25% compared to \u20b9 365 crore in H1 FY26.\n\nHowever, revenue from operations remained almost flat during the six-month period at \u20b9 9,022 crore in H1 FY27 against \u20b9 9,032 crore in H1 FY26, registering a marginal decline of 0.11% YoY.\n\nOn the operating front, the railway major reported a significant improvement, with operating profit increasing by 62.29% to \u20b9 448.60 crore in H1 FY27 compared to \u20b9 276.43 crore in the corresponding period of the previous financial year. The strong growth in operating profit indicates an improvement in operating profitability during the first half of FY27.\n\nThe shares have been falling steadily since May and have closed each following month in red, losing 40% through the October close. However, the stock saw renewed momentum in November, surging 14% so far.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 12:13 AM IST", "pub_date_relative": "2h ago"}, {"title": "U.S. inflation is already bad enough. It might get worse.", "full_content": "Federal Reserve Chairman Kevin Warsh has vowed the Fed will smite high inflation \u2014 but the death blows won\u2019t come fast or easy.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 12:09 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Microsoft outage hits Outlook. AWS and Google users also report issues", "full_content": "Microsoft suffered a widespread outage on Thursday that impacted thousands of users in North America, according to outage-tracking website Downdetector.com .\n\nThe outage began shortly before 1 p.m. and affected services like Outlook, Teams and 365. Amazon Web Services and Google users also reported outages on the site.\n\n\"We've determined a portion of infrastructure is experiencing elevated load across multiple regions, which is likely contributing to the connectivity errors,\" the company's Microsoft 365 Status account wrote in a post to social media platform X shortly after 1:30 p.m. ET.\n\nThe company determined that the outage was caused by an increase in unavailable servers and launched a restart of impacted servers. The shutdown may be linked to failed health checks caused by a \"specific component that's responsible for processing server health,\" they added .\n\n\"We've taken steps to prevent additional servers from being impacted while we work to return the affected servers to service,\" Microsoft added.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 02:27 AM IST", "pub_date_relative": "just now", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Earnings call transcript: Banrisul Q3 2026 profit falls as credit costs bite", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:25 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq falters as Nvidia shares fall on CEO exit, oil prices rise: Live updates", "full_content": "The Nasdaq Composite fell on Thursday as investors assessed the departure of Nvidia CEO Jensen Huang and the outlook of the conflict in the Middle East\n\nThe tech-heavy Nasdaq dropped 0.5%, while the Dow Jones Industrial Average shed 99 points, or 0.2%. The S&P 500 fell 0.3%.\n\nNasdaq Composite, 1 day Nvidia shares fell more than 5% after the company announced that Huang had resigned and named CFO Colette Kress as interim CEO. This comes after Huang reportedly had an affair with an alleged Chinese spy.\n\nWhile the stock remained under pressure, selling pressure had eased considerably from earlier in the day \u2014 shares were down double digits at one point after the announcement.\n\nInvestors moved into competitors of Nvidia, particularly Advanced Micro Devices and Broadcom , which were up around 5% each. Hyperscalers such as Alphabet \u2014 a key buyer of Nvidia chips and leader of the AI rally \u2014 also increased nearly 2%.\n\n\"This is a golden opportunity for Amazon, for Google, for AMD, for Broadcom, for OpenAI and Anthropic, who are hiring chip experts to help them design their own chips,\" said Jed Ellerbroek, portfolio manager at Argent Capital Management.\n\n\"Nvidia's fate as one company is one thing, but this AI revolution is way bigger than that,\" he also said. \"If Nvidia falls from grace and their chips are no longer the best, and AMDs are better or Google's are better, then people will switch over and buy them. The demand for the chips is not is not going down.\"\n\nHurting sentiment further, oil prices rose after after President Donald Trump said in a Truth Social post , \"We don't need a deal with Iran. Those days have long since passed.\" U.S. West Texas Intermediate crude futures rose 2.55% to settle at $88.74 per barrel, while Brent crude futures added 3.3% to settle at $95.82 a barrel.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 02:23 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: Frontera Energy posts stronger Q3 2026 results", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:23 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Security National Financial Q3 2026 earnings fall as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:23 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Total Energy Services misses Q3 2026 profit view", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:22 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ribbon Acquisition cancels extraordinary general meeting scheduled for Friday", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:22 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings call transcript: PodcastOne tops Q2 2026 EPS view as loss narrows", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Nov 2026, 02:22 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Home sales in worst slump since the aftermath of the Great Recession - The Washington Post", "full_content": "Home sales in worst slump since the aftermath of the Great Recession The Washington Post Home Sales in October Plummet to 16-Year Low WSJ 'Punch in the gut': Homes sales fall to their lowest in 16 years NPR Sales of Existing US Homes Tumble to Lowest Level Since 2010 Bloomberg.com 'A tough market': Home sales fall to lowest level since 2010 as high mortgage rates paralyze activity Yahoo Finance", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 02:20 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The bond market now has an even bigger fear than AI fallout", "full_content": "Carnage in tech stocks made Treasurys look more attractive in recent weeks, but fears of more Fed rate hikes are now driving yields higher", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 02:14 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "US stocks: Retail buyers limit Nvidia stock rout", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Retail buyers limit Nvidia stock rout Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Retail buyers limit Nvidia stock rout SECTIONS US stocks: Retail buyers limit Nvidia stock rout Reuters Last Updated: Nov 13, 2026, 02:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Retail investors poured a record $111 million into Nvidia shares during Thursday\u2019s first half-hour of trading, helping the stock trim an opening loss of as much as 14% to about 5%. The dip-buying suggests confidence in the AI trade remains resilient despite CEO Jensen Huang\u2019s departure and Nvidia\u2019s loss of more than $1 trillion in market value over five weeks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 02:06 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump says \u2018we don\u2019t need a deal with Iran\u2019", "full_content": "The U.S. should no longer seek a deal with Iran, President Donald Trump said Thursday as he directed Vice President JD Vance to instead focus his attention on corruption and crime in Democratic cities and states.\n\n\"We don't need a deal with Iran. Those days have long since passed,\" Trump wrote in a Truth Social post.\n\n\"We've got their money, Hundreds of Billions of Dollars, and we've got their Strait!\" Trump wrote, referring to the Strait of Hormuz, a key choke point in the ongoing U.S.-Iran war.\n\nThe announcement came just over a week after Republicans suffered huge losses in the midterm election. Vance and other Republicans have pinned those losses on the Iran war, which the U.S. and Israel started in late February.\n\nIn the weeks leading up to Election Day, Trump repeatedly suggested the U.S. could resume launching military strikes, which have largely subsided as a tense stalemate has taken hold in the region.\n\nThe Wall Street Journal on Wednesday reported that Vance, who has led diplomatic efforts with Iran in prior months, was considering face-to-face talks with a top Iranian security official.\n\nThe unpopular Iran war, which Trump and others in his administration said would be won in a matter of weeks, is now in its ninth month with no clear end in sight. The conflict has driven up global energy prices, creating a ripple effect through the economy and exacerbating concerns about inflation and affordability that were paramount to voters in the midterms.\n\nCorruption emerged as another top issue that broke in Democrats' favor in the election. Trump's post Thursday morning attempts to flip the script, blaming Democratic-run areas for allowing corruption and crime to proliferate.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 02:04 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jensen Huang's exit from Nvidia raises critical questions about the future of AI", "full_content": "Michael Dell described Jensen Huang as a \"visionary of the AI age.\" Deutsche Telekom CEO Tim H\u00f6ttges said a photo with the Nvidia CEO produced more media coverage for his company than its iPhone launch. During the keynote of his annual Dreamforce conference, Salesforce's Marc Benioff said, \"Jensen, we're all following you, bro,\" as the two paced through the audience.\n\nFollow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation\n\nHis fame extended way beyond tech. In May, Huang joined President Donald Trump on Air Force One for a trip to China to meet with President Xi Jinping . Three months later, Huang gathered six of the biggest names at the Nasdaq to announce on CNBC a proposed $500 billion artificial intelligence buildout plan, cementing his central role at the intersection of Wall Street and Silicon Valley.\n\nAs Nvidia became the first company to rip past a $5 trillion market cap, bending the laws of physics with its advanced graphics processing units and pushing the AI boom to seemingly endless bounds, the now 63-year-old Huang, clad in a black leather jacket, traversed the globe as the face of the brand powering the next industrial revolution.\n\nOver the past week it all came crashing down. Following two reported extramarital affairs \u2014 one with an alleged Chinese spy and another with an employee \u2014 Huang is leaving the company he co-founded 33 years ago in crisis, and thrusting the AI market into chaos. The board is now left to pick a successor for a company that's been run by a singular figure with no second-in-command. Chief Financial Officer Colette Kress has been named interim CEO. Harvey Jones has been appointed chairman.\n\n\"How companies handle a crisis determines their future,\" former Cisco CEO John Chambers, now a startup investor, told CNBC's \" Fast Money \" on Wednesday.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 02:02 AM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Lutnick should ban Chinese memory maker CXMT from U.S., Sen. Cotton says", "full_content": "Sen. Tom Cotton , R-Ark., is urging the Trump administration to take a harsher stance toward Chinese memory maker ChangXin Memory Technologies .\n\n\"CXMT, one of Communist China's national memory chip champions, poses a growing risk to our economic prosperity and military superiority,\" Cotton wrote in a letter sent Thursday to Commerce Secretary Howard Lutnick. \"The U.S. must take action to prevent CXMT from gaining a stronger foothold in the global market.\"\n\nCXMT is the world's fourth-largest producer of DRAM \u2013 or dynamic random access memory \u2013 which powers many basic functions of computers and smartphones.\n\nCotton, in a letter first obtained by CNBC, is asking Lutnick to push CXMT onto the department's Bureau of Industry and Security Entity List, which would significantly restrict U.S. firms' ability to do business with the company.\n\n\"It basically means that U.S. companies are not allowed to do business with that entity-listed company, and that entity-listed company does not get access to U.S. technology,\" said Kyle Chan, a Brookings Institution fellow who studies China's technology development.\n\nDRAM is a \"commodity,\" MS Hwang , research director at Counterpoint, told CNBC, meaning it is made to a global standard and is generally interchangeable from one manufacturer to another.\n\nHowever, with the right production technology, it can also form the building blocks of HBM, or high-bandwidth memory. HBM is an extremely high-demand product that powers AI chips made by Nvidia , Google and Amazon Web Services, which are central to the growth of artificial intelligence giants including Anthropic and OpenAI. It's made by just three main companies: Samsung , SK Hynix and Micron .\n\nThe Commerce Department and CXMT didn't immediately respond to CNBC's requests for comment.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:58 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US Fed sets new meeting schedule for 2027, as foretold by Chairman Kevin Warsh", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US Fed sets new meeting schedule for 2027, as foretold by Chairman Kevin Warsh Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Fed sets new meeting schedule for 2027, as foretold by Chairman Kevin Warsh SECTIONS US Fed sets new meeting schedule for 2027, as foretold by Chairman Kevin Warsh By Reuters Last Updated: Nov 13, 2026, 01:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Federal Reserve will hold seven rate-setting meetings in 2027 instead of the customary eight, while dedicating its October gathering to broader monetary-policy strategy. The revised schedule also moves the year\u2019s final policy meeting to November and removes designations for quarterly economic projections as Chair Kevin Warsh reviews the Fed\u2019s communication practices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 01:42 AM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Donald Trump Jr. exits advisory role at Kalshi prediction market", "full_content": "Prediction market platform Kalshi ended its advisory contract with Donald Trump Jr. in response to his venture capital firm, 1789 Capital, also holding a stake in rival platform Polymarket, according to Kalshi's spokesperson.\n\nConversations on Trump Jr.'s exit began in August after 1789 Capital announced a major stake in Polymarket , the spokesperson said. It was a mutual arrangement, with both Kalshi and Trump Jr. agreeing it was a conflict of interest to keep the president's son as an advisor while serving as a top investor for Polymarket, the spokesperson added.\n\nTrump Jr.'s departure comes after Democrats secured a majority across the House and the Senate, with the party expected to crack down on the prediction market industry. While Trump Jr. has exited Kalshi, he still serves as an advisor to Polymarket. His ties to the industry could make prediction markets an easy target for lawmakers to go after, Joseph Konizeski, a former trial attorney in the CFTC, previously told CNBC.\n\nIn early October, Kalshi CEO Tarek Mansour said on MS NOW that Trump Jr.'s connection to the company creates an \"optics issue,\" but added that it has never relied on that relationship to gain favor with the government.\n\nKalshi first named Donald Trump Jr. a strategic advisor for the company in January 2025.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:33 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Outlook outage: Microsoft reports 'issues' with Teams and email - ABC News - Breaking News, Latest News and Videos", "full_content": "Outlook outage: Microsoft reports 'issues' with Teams and email ABC News - Breaking News, Latest News and Videos Microsoft 365 hit by multi-region connectivity issues amid elevated infrastructure load Fox Business Microsoft \u2018restarting\u2019 as outage impacts global users, with Outlook and Teams affected The Guardian Outlook Outage: Microsoft\u2019s Email Service Goes Down Nationwide Variety Microsoft 365, Outlook down for thousands of US users, Downdetector shows Reuters", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 01:33 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Jensen Huang is out and Nvidia stock is down\u2014what market pros say about buying dips", "full_content": "Nvidia co-founder Jensen Huang has resigned as the firm's president and CEO, the company announced Thursday. Investors reacted negatively to the news. By 2:30 p.m., shares of the chipmaking giant were down more than 5%, and now sit 31% below their high on October 6.\n\nIt's easy to see why Huang's departure, which comes amid revelations of his romantic ties to a woman believed by the U.S. intelligence community to be a Chinese spy , has investors feeling queasy. The company Huang co-founded 33 years ago \u2014 and whose chips have powered the artificial intelligence boom \u2014 has grown into the firm currently valued at about $4 trillion under his leadership.\n\n\"The premise here is that there is no successor to a generational founder,\" says Michael Monaghan, portfolio manager of the Founders 100 ETF, which invests in founder-led companies. \"It's that they're one of one, and what they bring from a vision, execution and grit standpoint is not replaceable.\"\n\nWhile some investors are exiting Nvidia positions based on that premise \u2014 Monaghan's fund must, per its prospectus \u2014 others will see the slip in Nvidia's price as an opportunity to buy a great stock on proverbial sale , he says.\n\nLooking purely at the numbers, the opportunity to buy a stock with Nvidia's prodigious projected growth at its current depressed price \"happens once a decade, maybe once in a career as an investor,\" he says.\n\nIn investing parlance, the latter group of investors is \" buying the dip \" \u2014 investing in an asset after a decline in its value in anticipation of a bounceback. Whether it's a prudent strategy for you with Nvidia or any other stock requires some examination, investing experts say \u2014 not only of the stock in question, but your own portfolio strategy.\n\nWhen an investment you own or are interested in declines, your first move is to examine your reason for buying or holding it, says Tom Hainlin, national investment strategist at U.S.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:31 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Nvidia: Ex-prosecutor Joon Kim and Wachtell, Lipton bring big track record to investigation", "full_content": "Joon Kim , the lawyer tapped by artificial intelligence chip giant Nvidia to investigate its former CEO Jensen Huang , and the Big Law firm he works for have a long history of investigating high-profile cases.\n\nKim, in his career as a top federal prosecutor and as an attorney in private practice, has had in his sights mobster John \"The Teflon Don\" Gotti's son, former New York Gov. Andrew Cuomo , the Federal Deposit Insurance Corp . and other high-profile people and companies.\n\nThe law firm that Kim recently joined \u2014 Wachtell, Lipton, Rosen & Katz \u2014 this year conducted an investigation for the NBA of the Los Angeles Clippers and its billionaire owner, Steve Ballmer , which ended with the basketball league imposing stiff sanctions on Ballmer and the Clippers for violating salary cap rules in connection with superstar Kawhi Leonard.\n\nOn Tuesday, Nvidia said it had retained Kim, 55, and Wachtell, Lipton to \"conduct a thorough and independent investigation\" of allegations that its then-CEO Jensen Huang had been the target of a foreign intelligence effort involving his affair with a woman, Alice Huang. U.S. intelligence suspects her of being a spy for China .\n\nJensen Huang resigned as CEO on Thursday morning on the heels of a New York Times report that he had also had an extramarital affair with an Nvidia executive, Kimberly Powell, who reports to him.\n\nThat allegation could be added to the list of issues that Kim will be looking into as part of his probe.\n\nNvidia did not immediately respond when asked if the parameters of the investigation would be affected by the new claim. A spokeswoman for Wachtell, Lipton declined to comment for this article on behalf of the firm and Kim.\n\nFriends and former colleagues of Kim said Nvidia has made a smart decision in retaining him for the job.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 01:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "The S&P 500 is shrugging off Nvidia\u2019s selloff. Here\u2019s what\u2019s keeping the rest of the market afloat.", "full_content": "Investors have been forced to look up from the poster child of the artificial-intelligence trade and remember the other stocks on the board.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 01:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump administration is hiring debt collectors to go after defaulted student-loan borrowers for first time in 6 years", "full_content": "The Treasury Department proposes to pay debt collectors much less than in the past to help borrowers get out of default.", "source": "MarketWatch Top Stories", "pub_date_str": "13 Nov 2026, 01:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Watch these levels to know if Nasdaq-100 is set to break out", "full_content": "Todd Gordon breaks down the charts in a confusing market.", "source": "CNBC Top News", "pub_date_str": "13 Nov 2026, 01:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia stock pares morning losses after CEO Jensen Huang announces resignation", "full_content": "Follow CNBC's live coverage of Nvidia CEO Jensen Huang's resignation here.\n\nNvidia shares were trading down 5% on Thursday after Jensen Huang announced he would immediately step down as CEO and a member of the board at the chipmaker. The stock hovered just under $4 trillion in market cap, after paring steeper losses earlier in the day of as much as 14%. Nvidia has closed above the market cap benchmark since July 2025.\n\nChief Financial Officer Colette Kress will serve as interim CEO until a new leader is appointed, Nvidia said in a Thursday statement. Harvey C. Jones, former CEO of Synopsys, will become the first-ever chair of the board.\n\nOn Sunday, Huang admitted to having an affair . The CEO was r
