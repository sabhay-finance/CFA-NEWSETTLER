TIONS US stocks: Summit shares drop after US FDA declines to approve lung cancer drug Reuters Last Updated: Nov 16, 2026, 09:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Summit Therapeutics faced a notable decline in share value following the FDA's ruling on ivonescimab, which revealed insufficient overall survival benefits during late-stage trials. Despite Summit's emphasis on regional survival differences, analysts worry that this decision could have repercussions for similar treatments in development. Investors now eagerly await new trial results comparing ivonescimab with conventional lung cancer therapies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Nov 2026, 09:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "These 13 S&P 500 stocks can rise up to 70% over the next year, according to analysts", "full_content": "Consensus earnings estimates have continued to increase, especially for semiconductor manufacturers whose share have declined significantly since the end of September, which underscores several calls for investors to load up on stocks.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Nov 2026, 09:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rocket from Boeing-Lockheed firm fails mid-flight, destroys payload of Amazon satellites", "full_content": "A Vulcan rocket owned by United Launch Alliance, the \u2060joint venture of Boeing and Lockheed Martin , failed on Sunday shortly after liftoff from Florida, destroying its payload of 40 satellites from Amazon's Leo internet network in the launch company's first mission failure.\n\nThe rocket \u200bfailed roughly 10 minutes after liftoff from the Cape \u200bCanaveral Space Force Station in Florida, and \u200bthe cause was not immediately clear. It represented a major setback for the two-decade-old company's new flagship rocket as ULA sought to begin a regular launch cadence for Amazon's burgeoning satellite internet constellation.\n\n\"Based on data received by our Launch Director, we confirm that the Vulcan vehicle launched from Space Launch Complex 41 suffered an anomaly 10 minutes \u2060into the \u200cflight and failed to deliver the Amazon mission to orbit,\" ULA said in a \u2060statement.\n\n\"Every flight generates data, and every flight teaches us something. Since the anomaly just occurred, we don't have any specific data yet to understand what occurred today,\" ULA said.\n\nThe failure is expected to lead to a lengthy technical investigation that would keep the rocket off the market for months. This could deepen a US launch bottleneck brought on by other rocket mishaps and challenges across \u200cthe industry as well as the looming retirement of SpaceX's Falcon 9, the world's most active rocket. SpaceX is no longer accepting bookings for the Falcon 9.\n\n\"There is risk with any launch, and that's especially true for inaugural missions like LV-01,\" Amazon said in a statement, referring to \u200bSunday's mission.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 09:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "$51 billion capex, 23% earnings growth: Adani Ports, Adani Green to Energy; Jefferies sees up to 44% upside in 6 stocks", "full_content": "AMBUJACEM ADANIPOWER ADANIENSOL ADANIGREEN A Ksheerasagar Published 16 Nov 2026, 09:11 PM IST Prefer Livemint on Google Global brokerage firm Jefferies, in its latest outlook, has retained its bullish stance on Adani Group companies, maintaining Buy ratings on six group companies and expecting an average upside potential of nearly 25% from their respective closing prices cited in the report.\n\nThe brokerage's positive outlook stems from the group's emergence as one of India's largest capital spenders over the past five years, with EBITDA and assets growing at compound annual growth rates (CAGRs) of approximately 20% and 22%, respectively, over FY17-FY26. This growth has been driven by execution, strategic mergers and acquisitions (M&A), and exposure to India's structural growth priorities.\n\nJefferies expects the group's capital expenditure (capex) spree to continue for another three years, with Adani Group companies likely to emerge as the largest contributors to private-sector capex. The group is expected to account for approximately 28% of the aggregate private-sector spending of $180-190 billion over FY27-FY29.\n\nThe brokerage said the group's capex programme is likely to remain concentrated in the energy, transportation, building materials, and infrastructure sectors, reflecting its strategy of strengthening core businesses while selectively expanding into adjacent segments.\n\nAmong these, Jefferies expects a $51 billion capex programme across six companies\u2014Adani Ports, Adani Enterprises , Ambuja Cements , Adani Power , Adani Energy Solutions , and Adani Green Energy \u2014all of which it has maintained Buy ratings.\n\nThe brokerage estimates that the execution of the $51 billion capex programme will drive a 23% CAGR in EBITDA and EPS over FY26-FY29E, supported by volume growth and market-share gains.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 09:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia live updates: Interim CEO Kress prepares for Q3 earnings, with Huang reportedly planning comeback - Yahoo Finance", "full_content": "Nvidia live updates: Interim CEO Kress prepares for Q3 earnings, with Huang reportedly planning comeback Yahoo Finance Nvidia's Colette Kress confronts key questions in first earnings report since Jensen Huang\u2019s exit CNBC Buying Nvidia Now? Really? (NASDAQ:NVDA) Seeking Alpha Here\u2019s How Much Traders Expect Nvidia Stock to Move After Earnings Tuesday Investopedia Will Nvidia earnings steady the AI sell-off? Financial Times", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 09:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mid-cap stocks: AI-led short-cycle deals rise; Anand Rathi identifies mid-cap IT stocks Mphasis, Sonata set to benefit", "full_content": "PERSISTENT KPITTECH A Ksheerasagar Published 16 Nov 2026, 09:05 PM IST Prefer Livemint on Google Domestic brokerage firm Anand Rathi, in its recent report, said Indian mid-cap technology companies delivered better-than-expected revenue growth in the September-ending quarter, despite muted expectations, with median year-on-year constant currency (CC) revenue growth improving to around 3.1% from 2% in Q1FY27.\n\nThe brokerage highlighted that mid-cap companies, including Persistent Systems , Birlasoft, Firstsource, and Sonata Software , benefited from around 1% quarter-on-quarter rupee depreciation, which partly offset the impact of wage hikes across several companies. It also noted that EBIT margins remained largely stable.\n\nThe median EBIT margin stood at 13.4%, compared with 13.5% in Q4FY26. The brokerage noted that the banking, financial services, and insurance (BFSI) segment continues to be a structural growth driver for mid-cap IT companies, with technology spending by US banks increasing at a double-digit pace year-on-year.\n\nAnand Rathi also highlighted an emerging trend across IT companies, first articulated by LTM and subsequently echoed by Mphasis and Sonata Software, with a considerable increase in short-cycle, project-based deals, primarily related to AI.\n\nThis comes as enterprises adopt a wait-and-watch approach towards longer-tenure contracts amid geopolitical uncertainty.\n\nLooking ahead, the brokerage expects revenue growth to remain muted in FY27 due to AI-led deflationary pressures, compounded by geopolitical uncertainty.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 09:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks: Nasdaq slides over 1% as AI selloff deepens ahead of Nvidia earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: Nasdaq falls 1% at open as Nvidia woes weigh on sentiment ahead of earnings Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Nasdaq slides over 1% as AI selloff deepens ahead of Nvidia earnings SECTIONS US stocks: Nasdaq slides over 1% as AI selloff deepens ahead of Nvidia earnings Reuters Last Updated: Nov 16, 2026, 09:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks fell as investors reacted to a selloff in AI firms, with Nvidia taking a hit. The resignation of Jensen Huang, Nvidia's leader, raised concerns, adding to market anxiety. Simultaneously, fresh US regulations limited China's access to advanced AI chips, further affecting sentiment. Major semiconductor companies reported notable losses, weakening overall market confidence. Investors now look to the Fed's insights and upcoming earnings for future guidance.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Nov 2026, 09:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia stock falls as investors price in fallout from Jensen Huang's resignation", "full_content": "Nvidia 's stock continued to slide in the wake of CEO Jensen Huang 's resignation , falling about 2% on Monday after the chip giant lost hundreds of billions in market cap last week.\n\nHuang resigned from Nvidia, the company's board announced on Thursday, after mounting scrutiny following reports that he had a relationship with a woman believed to be a Chinese spy. Huang told employees he had an affair in an email on Nov. 8.\n\nIt was later reported that Huang had romantic relationships with two Nvidia employees. Nvidia did not immediately respond to CNBC's request for comment on Friday.\n\nNvidia stock. An online petition calling for Huang's reinstatement as Nvidia CEO has drawn more than 170,000 signatures , as prominent tech executives, including Elon Musk , rallied behind him.\n\nMeanwhile, U.S. lawmakers are pushing to launch comprehensive investigations into the scandal.\n\nHuang cofounded Nvidia in 1993 and led the company through its meteoric rise to becoming the world's most valuable company, with its AI chips underpinning the technology's boom.\n\nNvidia appointed longtime finance chief Colette Kress as interim CEO and said its board would consider both internal and external candidates in its search for a permanent successor.\n\nTreasury Secretary Scott Bessent on Sunday called for a \"dramatic shakeup\" at Nvidia, adding that the board should look outside the company for its next chief executive.", "source": "CNBC World Economy", "pub_date_str": "16 Nov 2026, 08:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia set to deliver first life-after-Huang briefing - Reuters", "full_content": "Nvidia set to deliver first life-after-Huang briefing Reuters \"No sane person questions whether AI works\" \u2014 but an AI bubble appears ready to pop. Axios COMMENTARY: Tech's telltale week Reuters How Nvidia turmoil and a Democratic Congress could reshape the AI trade, according to ETF experts CNBC AI\u2019s Long List of Problems Just Got a Whole Lot Worse Mother Jones", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 08:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Crystal Crop Protection IPO GMP today: How much listing gain is expected? Check profit calculator before bidding starts", "full_content": "Crystal Crop Protection\u2019s initial public offering (IPO) will open for subscription on Wednesday, November 18, 2026. Its latest grey market premium (GMP) indicated 4.78% listing gain, as per media reports tracking GMP. The IPO is a combination of fresh issue and offer for sale (OFS).\n\nFor investors who closely track primary market developments, here\u2019s a calculation of expected listing gain per lot for Crystal Crop Protection IPO .\n\nIts grey market premium was last recorded at \u20b9 13, as per media reports at 7:37 pm on November 16, indicating 4.78% listing gain. Considering the IPO\u2019s upper price band (of \u20b9 272 per share), the issue is likely to be listed at \u20b9 285 per share (which is the sum of the latest GMP and upper price band).\n\nCrystal Crop Protection IPO is a book build issue of \u20b9 455.49 crore and is a combination of 1.31 crore shares aggregating to \u20b9 354.77 crores and offer for sale of 37.03 lakh shares (equivalent to \u20b9 100.71 crore).\n\nThe IPO will open for subscription on November 18 and conclude on November 20. The issue allotment is likely to be finalized on November 23, followed by listing expected on November 26.\n\nThe IPO\u2019s issue price band is fixed at \u20b9 259- \u20b9 272 per share. A single lot of the IPO consists of 55 shares. Retail investors can apply for a minimum of single lot, ie \u20b9 14,960 (for 55 shares). Retail investors can apply for maximum 13 lots, ie 715 shares (equivalent to \u20b9 1,94,480). Small High-Net-Worth Individual (SHNI) are required to invest 14 lots, ie 770 shares (worth \u20b9 2,09,440)\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 08:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UK short-term borrowing costs hit three-year high", "full_content": "Two-year gilt yield breaches 5% on strong economic data and hawkish messaging from Bank of England", "source": "FT Markets", "pub_date_str": "16 Nov 2026, 08:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Sectoral mutual funds: Should you invest? Risks, returns and 5 things to consider before investing your money", "full_content": "Sectoral mutual funds can help investors benefit from the growth of specific industries such as banking, information technology, pharmaceuticals, defence and infrastructure. When an industry enters a favourable business cycle, these schemes can outperform diversified equity funds. However, their concentrated portfolios can also magnify losses when the sector faces a downturn.\n\nUnlike diversified equity funds, which spread investments across industries, sectoral funds invest predominantly in companies belonging to a particular sector. Their performance depends heavily on industry-specific developments, making it important for investors to assess not just growth prospects but also valuations and the timing of their investment.\n\nExperts suggest considering five factors before investing in these schemes.\n\nSectoral funds are more suitable for investors who understand market cycles, have a higher risk appetite and can actively track developments in individual industries.\n\n\"Sectoral funds are more suitable for investors who understand the fundamentals and technicals of the market and are equipped to make tactical calls on the sectors they wish to invest in,\" said Bharath Rathore, executive director, Anand Rathi Wealth Ltd.\n\nHe said first-time equity investors should start with diversified funds rather than take concentrated bets on a single industry.\n\nMadhu Lunawat, founder, MD and CEO of The Wealth Company Mutual Fund, said investors must get three decisions right: identify a sector with strong future prospects, enter at a reasonable valuation and recognise when the investment opportunity is losing its attractiveness.\n\nFor investors without the time or expertise to monitor individual industries, diversified equity funds may be a more suitable starting point.", "source": "LiveMint Money", "pub_date_str": "16 Nov 2026, 08:42 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks making the biggest moves Monday: L3Harris, Nvidia, Take-Two Interactive, Yeti, American Airlines & more", "full_content": "Nvidia shares were under pressure once again on Monday, with traders bracing for the company's quarterly report due postmarket Tuesday.\n\nOther stocks making moves include Take-Two Interactive, as gamers await the release of \"Grand Theft Auto VI\", and Yeti Holdings, which pulled back following an analyst downgrade.\n\nFollow along as CNBC highlights the biggest stock market moves of the day.\n\nShares of Tyson Foods advanced more than 9% on better-than-expected quarterly results.\n\nThe company delivered earnings per share of 61 cents on revenue of $14.59 billion. Analysts polled by FactSet expected a profit of 53 cents per share on revenue of $14.1 billion. Tyson is known for its portfolio of food products which include beef, pork, chicken, and prepared foods.\n\nTo be sure, the company's guidance for fiscal 2027 was cause for some pause. Management expects operating income of $1.7 billion to $2.15 billion, which is in line with FactSet's $2.13 billion estimate.\n\nThe company also expects beef production to decrease by about 2% next year and anticipates an operating income loss in the segment.\n\nL3Harris , a defense electronics contractor, fell 4% after the Trump administration blamed it for Friday's nearly five-hour nationwide groundstop of all airline traffic.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 08:38 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chip stocks fall on US semiconductor restrictions: AlphaCheck - Yahoo Finance", "full_content": "Chip stocks fall on US semiconductor restrictions: AlphaCheck Yahoo Finance Wall Street and Main Street Agree: It\u2019s Time to Tame the AI Trade Barron's Inside the Frenetic Month That Shook Wall Street\u2019s AI Trade WSJ Treasuries Tracked AI Chips for a Month: 10-Year Fell 44bp FourWeekMBA Bond Yields Cooled As Markets Repriced The AI Trade Finimize", "source": "Google News Business", "pub_date_str": "16 Nov 2026, 08:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Novo says Wegovy injection lowers BMI and obesity rates in children in trial", "full_content": "Novo on Monday released full results from a late-stage trial showing its blockbuster Wegovy injection helped children ages 6 to under 12 with obesity shed weight, significantly lowering their body mass index.\n\nWegovy reduced BMI by an estimated 19.7 percentage points on average compared with a placebo at 68 weeks, with BMI falling 17.4% among children receiving the drug and rising 2.2% among those receiving a placebo. Those results assumed patients stayed on treatment during the trial.\n\nWhen evaluating all children in the study, including those who discontinued treatment, Wegovy lowered BMI by an estimated average of 16.2 percentage points more than the placebo at 68 weeks. All 167 kids in the study received lifestyle modifications throughout the trial, including a \u200breduced-calorie diet and increased physical activity.\n\nThe detailed results mark an encouraging step forward in treating childhood obesity \u2014 a chronic disease that can carry serious cardiovascular, metabolic and psychosocial consequences but has had few treatment options for younger children. When left unaddressed, childhood obesity can extend into adulthood, bringing earlier and more severe health complications.\n\n\"This is a very significant disease burden in this very young patient population,\" said Dr. Andrea Traina, Novo's medical director lead of obesity.\n\nIn 2025, the disease affected an estimated roughly 177 million children and teens ages 5 to 19 worldwide, according to the World Obesity Federation. That figure is projected to rise to 228 million by 2040.\n\nWhile Wegovy is already approved to treat obesity in children ages 12 and older, there are currently no approved medications for those under 12.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 08:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Jensen Huang Scandal: Timeline That Led To His Resignation\u2014And Potential Comeback - Forbes", "     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
