 Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:48 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US Fed\u2019s Bowman sees no urgency for another rate hike", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Fed\u2019s Bowman sees no urgency for another rate hike Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Fed\u2019s Bowman sees no urgency for another rate hike SECTIONS US Fed\u2019s Bowman sees no urgency for another rate hike ETMarkets.com Last Updated: Oct 14, 2026, 10:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Michelle Bowman, the Vice Chair for Supervision of the US Federal Reserve, spoke during the IMF-World Bank meetings in Bangkok. She stated that the central bank does not feel urgency for further rate hikes at this time. Bowman's comments came after a recent rate increase that set the target range to 3.75%-4.00%. Additionally, she addressed the need for stronger oversight in light of recent bank failures.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:48 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Prices increased sharply in September in last inflation report ahead of elections - The Washington Post", "full_content": "Prices increased sharply in September in last inflation report ahead of elections The Washington Post Inflation rose to 3.7% last month in last snapshot of consumer prices before the midterms CNN Stock market today: Hot inflation report drops tech, drives S&P 500, Nasdaq down Yahoo Finance Here's the inflation breakdown for September 2026 \u2014 in one chart CNBC Steve Moore warns stubborn inflation could complicate Fed rate decision KOMO", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 10:39 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Delta One gets a boozy upgrade with $200 wines, luxe dining and new suites on the way - The Points Guy", "full_content": "Delta One gets a boozy upgrade with $200 wines, luxe dining and new suites on the way The Points Guy The New Era of Delta One Delta News Hub Delta's business-class revamp: New seats, menus, plates and more Porsches CNBC Delta One gets major upgrade to dining, passenger experience The Business Journals Delta One Adds Blanton\u2019s Bourbon and Hugo Spritzes to Revamped Menu VinePair", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 10:39 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Morgan Stanley tops estimates as equities trading revenue beats expectations by $909 million", "full_content": "Morgan Stanley posted third-quarter results that beat expectations on blockbuster results in its equities trading franchise.\n\nThe company said profit climbed 6.5% to $4.91 billion, or $3.03 a share. Revenue rose 12% to $20.34 billion.\n\nThe firm's equities trading division, long a marquee business for Morgan Stanley, posted a 41% increase in revenue to $5.8 billion, exceeding the StreetAccount estimate by about $909 million.\n\nMorgan Stanley noted widespread strength across its equities products and regions, but cited Asia as a source of particular strength in the quarter. The gains in that business helped offset disappointments elsewhere.\n\nFixed income trading revenue fell 7% to $2.01 billion, driven by declines in credit and commodities, which is roughly $260 million below expectations.\n\nInvestment banking revenue edged 2% higher to $2.16 billion, about $110 million below expectations. The bank cited an increase in advisory revenue on more completed mergers, but declines in equity underwriting on lower initial public offerings and a drop in fixed income underwriting.\n\nStill, the results were \"good, but not great,\" as some business metrics showed slower improvement in the quarter, Wells Fargo analyst Mike Mayo said Wednesday in a note.\n\nThe economy is subject to two key forces right now: the boost from the artificial intelligence build-out and the drag from geopolitical strife, Morgan Stanley CEO Ted Pick told CNBC's Leslie Picker on Wednesday.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 10:38 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fannie Mae sharply raises mortgage rate forecast for 2027", "full_content": "Economists at Fannie Mae are now predicting much higher mortgage rates through the end of 2026 and into 2027. It now puts the average rate on the 30-year fixed at 7.4% for the fourth quarter of this year and 7.5% through all of next year. It previously forecast 6.8% for the fourth quarter and 6.7% for all of next year.\n\nThe average rate on the 30-year fixed stood at 7.46% Tuesday, according to Mortgage News Daily, but will likely move higher today. Bond yields are rising after a hotter-than-expected inflation report.\n\nMortgage rates have been rising sharply since the start of September, as inflation remains stubbornly high and bond markets sell off due to several factors. The Federal Reserve also raised its benchmark rate for the first time in more than three years. Mortgage rates do not follow the Fed's rate exactly, but they do react to how the central bank sees inflation going forward.\n\nMortgage rates loosely follow the yield on the 10-year Treasury, which has been rising sharply on higher oil prices and growing concerns in the global economy.\n\nCNBC's Property Play with Diana Olick covers new and evolving opportunities for the real estate investor, delivered weekly to your inbox.\n\nHigher rates have already put the housing market in an early deep freeze this fall. Pending sales, counted by signed contracts on existing homes, were down 8.5% in September year-over-year, according to Zillow. Mortgage demand continues to drop sharply, as buyers face higher prices and weakening affordability. Not only can fewer buyers now afford a home, but fewer can qualify for a mortgage.\n\nFannie Mae did not respond to requests for comment on its latest forecast.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:38 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Progressive earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Oct 2026, 10:36 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CoreWeave shares tumble as bond yields near 15% on concern about AI borrowing binge", "full_content": "CoreWeave 's stock and bonds were both hit on Wednesday as investor fear grew that some technology companies are borrowing too heavily for the artificial intelligence build-out.\n\nShares of the so-called neocloud nosedived 16%, while yields on its debt jumped higher. The yield to maturity on its 9.625% bond due in 2032 is sitting at 14.8%, while that of its 9.75% bond due in 2031 is around 14.9%. Bond yields move inversely to prices.\n\nWhile investors were once excited about getting in on the AI action, investor sentiment has started to shift, said Luis Alvarado, co-head of global fixed income strategy at Wells Fargo Investment Institute.\n\nNow, investors are demanding more risk compensation, he said.\n\n\"The era of easy money, which we experienced in the first nine months of the year, is starting to disappear and dissipate,\" Alvarado noted. \"Now the extra dollar or the marginal dollar is going to be more looked at with a microscope into the concessions that the issuer is giving you back.\"\n\nTech investor Chamath Palihapitiya , founder and CEO of investment firm Social Capital and CEO of AI company 8090, called out CoreWeave's soaring yields on X late Tuesday. That prompted Tesla and SpaceX CEO Elon Musk to respond, \"yikes.\"\n\nPalihapitiya shared a chart of the 2032 bond, noting that the yield \"touched 15%\" and then \"closed at a new high\" on Tuesday. He also included part of his deep dive into whether the AI build-out is creating a private credit bubble, in which he noted \"how little extra lenders appear to charge for AI risk.\"\n\nCoreWeave's balance sheet is \"relatively bad\" compared to its neocloud peers, said Paul Meeks, head of technology research at Freedom Capital Markets. That's because CoreWeave has done more borrowing and is currently building more data centers, he explained.", "source": "CNBC World Economy", "pub_date_str": "14 Oct 2026, 10:36 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "3 things that are driving inflation higher", "full_content": "Struggling with elevated prices? You don\u2019t have to look much further than your local gas station.", "source": "MarketWatch Top Stories", "pub_date_str": "14 Oct 2026, 10:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Treasury says largest U.S. banks let politics influence who received banking services", "full_content": "The Treasury Department's Office of the Comptroller of the Currency found some of the largest banks serving the U.S. allowed political considerations, public pressure and social concerns to influence decisions about who received banking services, according to a sweeping report released Wednesday.\n\nThe OCC said it reviewed the nine largest national banks under its supervision, examining nearly 100,000 complaints and about 420,000 pages of documents. It found that all nine had used \"reputation risk\" policies that lacked \"clear,\" \"objective\" standards and could disadvantage customers because of their political or religious views or lawful business activities.\n\n\"Banks should make decisions based on financial risk, not the political or social preferences of their employees or executives,\" Comptroller of the Currency Jonathan Gould said, according to a transcript of his in remarks Wednesday in Lexington, Kentucky.\n\nThe findings may lend new regulatory weight to a grievance President Donald Trump has pressed since returning to office. Trump has repeatedly accused and sued major banks for discriminating against conservatives and has said he was personally \" debanked \" after the Jan. 6, 2021, Capitol insurrection , claims banks have denied .\n\nThe report lands a day after the OCC and other Treasury regulators imposed more than $1.2 billion in penalties on Bank of America over separate anti-money-laundering failures . At the same time, the OCC said it is examining whether banks' efforts to comply with anti-money-laundering rules have themselves contributed to debanking.\n\nThe review covered JPMorgan Chase , Bank of America, Citibank , Wells Fargo , U.S.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Bank of America shares drop 8% after third-quarter revenue miss and regulatory penalty", "full_content": "Bank of America on Wednesday posted a sharp profit decline after being hit with a $1.2 billion penalty by U.S. regulators, while revenue also disappointed after trading operations generated about $750 million less than expected.\n\nThe bank's third-quarter profit fell 17% to $6.93 billion, or 91 cents a share. Excluding the penalty, which sapped income by 17 cents, EPS would've been $1.08 a share.\n\nCompanywide revenue rose 3.2% to $30.12 billion in the quarter, on an FTE basis, but that was below expectations by about $570 million, largely on misses from Wall Street trading operations.\n\nFixed income trading revenue dropped 17% to $2.55 billion on weakness in mortgages, municipals and credit activity. That is roughly $450 million below the StreetAccount estimate.\n\nEquities trading revenue climbed 10% to $2.51 billion, but that was also below analysts' expectations, by nearly $300 million.\n\nThe trading disappointment comes after CEO Brian Moynihan told analysts last month that trading revenue would be roughly flat; instead the combined bond and stock trading results fell by 5%.\n\nInvestment banking revenue dropped 11% to $1.8 billion, roughly in line with expectations and Moynihan's September guidance.\n\nNet interest income, a key profitability driver watched closely by Bank of America investors, rose 7.9% to $16.6 billion, slightly edging out the $16.53 billion StreetAccount estimate.", "source": "CNBC Finance", "pub_date_str": "14 Oct 2026, 10:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio IPO sparks investor buzz: GMP hits 20% as Reliance\u2019s telecom arm announces price band, dates", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio IPO sparks investor buzz: GMP hits 20% as Reliance\u2019s telecom arm announces price band, dates Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO sparks investor buzz: GMP hits 20% as Reliance\u2019s telecom arm announces price band, dates SECTIONS Jio IPO sparks investor buzz: GMP hits 20% as Reliance\u2019s telecom arm announces price band, dates By Kumar Gaurav , ETMarkets.com Last Updated: Oct 14, 2026, 10:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms\u2019 IPO grey market premium climbed to Rs 220 after the company filed its red herring prospectus (RHP) on Wednesday. The GMP implies a nearly 20% premium over the upper price band of Rs 1,119. The Rs 30,213 crore IPO, opening on October 21 and closing on October 23, is set to surpass Hyundai Motor India\u2019s 2024 offering to become India\u2019s largest-ever public issue.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trump's diesel dilemma \u2014 by the numbers", "full_content": "Diesel prices are surging as midterms approach \u2013 and they are likely to stay high in the near future, according to analysts.\n\nThe International Energy Agency's monthly report for October, released Wednesday, was the latest to predict that constraints on the diesel market will likely keep prices elevated into next year. The group warned that even if refineries step up production of diesel into the year-end, inventories will likely remain strained until the second half of 2027.\n\nLast Friday, President Donald Trump unexpectedly paused sanctions on Russian diesel fuel and announced that he reached a deal with President Vladimir Putin in which the Kremlin would release 4.8 million metric tons of diesel , or nearly 36 million barrels, to the global market.\n\nOver the weekend, he took to Truth Social to announce an \"energy ceasefire\" between Russia and Ukraine , but Ukrainian President Volodymyr Zelenskyy later accused Russia of attacking the country's energy facilities .\n\nThe foreign policy developments come as rising fuel prices \u2014 particularly skyrocketing diesel \u2014 have become a major flashpoint ahead of this year's midterm election. But releasing Russian diesel to the global market is unlikely to drop prices in the near term. A note from Goldman Sachs last week even predicted that diesel prices will remain high through 2027 as refineries struggle to meet demand.\n\nWholesale diesel prices have more than doubled since the beginning of 2026 through the end of September as both the war in Iran and Russia's war in Ukraine have dramatically cut global supply.\n\nTrump has insisted that the war in Ukraine is to blame for high diesel prices. On July 8, Russia banned diesel exports after Ukraine struck its refineries. In the U.S., the price of a gallon of diesel rose nearly 40% between July 6 and Sept.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "10-year Treasury yield jumps as September core inflation comes in hotter than expected", "full_content": "The 10-year Treasury note yield rose on Wednesday following the latest U.S. inflation print.\n\nThe yield on the 10-year Treasury note \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 jumped more than 2 basis points to 5.242%. It had reached the highest level since Oct. 8 earlier in the day.\n\nThe longer-dated 30-year U.S. Treasury yield \u2014 which tends to react most to geopolitical events \u2014 was up less than 1 basis point to 5.568%.\n\nThe 2-year Treasury \u2014 which closely tracks the Fed's interest rate decisions \u2014 gained more than 5 basis points to 4.852% after earlier hitting its highest level since Sept. 29.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely.\n\nThe consumer price index rose 3.7% year over year in September, higher than the Dow Jones consensus estimate of 3.6%. Core inflation, excluding food and energy prices, came in at 2.6% on an annualized basis, versus the 2.5% consensus estimate.\n\nThe latest inflation reading comes just two weeks before the Fed's next interest rate decision.\n\nWith inflation remaining sticky, the central bank may need to raise rates higher and keep them there for longer in 2027, said Christopher Rupkey, chief economist at Fwdbonds.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Netflix Film VP Doug Belgrad Out In Layoffs - The Hollywood Reporter", "full_content": "Netflix Film VP Doug Belgrad Out In Layoffs The Hollywood Reporter Netflix to lay off roughly 1,000 employees, or 6% of workforce CNBC Netflix cuts 1,000 jobs in company\u2019s biggest layoffs ever, despite strong revenue growth San Francisco Chronicle Netflix cuts about 6% of jobs in biggest layoff since 2022 Reuters Exclusive | Netflix Eliminates About 1,000 Jobs in Biggest Cuts Since 2022 WSJ", "source": "Google News Business", "pub_date_str": "14 Oct 2026, 10:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ukraine warns Starlink limits are disrupting military operations as Russia pounds its energy infrastructure", "full_content": "Ukraine has accused Elon Musk's SpaceX of imposing new restrictions on its military-grade Starlink internet service without warning, disrupting Ukrainian military operations.\n\nIt comes as Russia intensifies attacks on the country's energy infrastructure despite President Donald Trump's proposed \"energy ceasefire.\"\n\nSerhii Beskrestnov, an adviser to President Volodymyr Zelenskyy on defense technology, said Wednesday that SpaceX has implemented a speed limit on Starlink terminals in motion without notifying Ukrainian defense forces, disrupting some missions. The restrictions apply to the sister service Starshield, which supports national security.\n\nMeanwhile, Russia unleashed an attack on Ukrainian energy infrastructure overnight, leaving at least 600,000 people without power in the Kyiv and Kharkiv regions, raising further questions about the \"energy ceasefire\" announced by Trump on Sunday.\n\n\"There is significant damage to facilities and equipment \u2013 at 26 facilities of our power system and four facilities in the oil and gas sector,\" Zelenskyy said in a post on X early Wednesday.\n\nHe highlighted a targeted ballistic missile strike against the energy infrastructure that Zelenskyy said should have been covered by the \"energy ceasefire\" announced by President Donald Trump on Sunday.\n\n\"The strike was entirely deliberate and demonstrative in its scale \u2013 Russia has never before shown such ostentatious disrespect toward the United States,\" Zelenskyy said.\n\nThe attack comes after the Ukrainian president on Monday accused Russia of violating Trump's proposal that the adversaries stop attacking each other's energy facilities to help bring down the cost of oil and diesel.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 10:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "BlackRock's Larry Fink warns a data center moratorium could trigger a recession", "full_content": "BlackRock CEO Larry Fink warned that a halt to data center construction could trigger an economic slowdown.\n\n\"If we have a moratorium of some sort in this country, we will be in a recession,\" Fink told CNBC Wednesday, after BlackRock reported better-than-expected third-quarter earnings early Wednesday. BlackRock advanced about 1% in late morning trading.\n\n\"So much of our economy is based on the buildout of this capex,\" Fink added, referring to the massive investments made to develop artificial intelligence infrastructure.\n\nFink's warning comes as strong, local opposition to data center construction has emerged as a key issue in the Nov. 3 midterm elections, as communities struggle with rising utility costs, water use, environmental damage and questions over investment transparency.\n\nWhile Fink acknowledged fears about the data center buildout, he also noted \"most of it is on misinformation.\"\n\nThe stakes are high. Wall Street analysts estimate total AI capital expenditures could climb above $1 trillion in 2027 and total in excess of $5 trillion by 2030 .\n\n\"Data centers are not the problem. They're creating more new jobs than ever before,\" the BlackRock note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings season is heating up. UBS thinks these stocks could beat expectations", "full_content": "The investment bank called out a few names whose results are likely to impress Wall Street.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 09:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Abilene Christian University is giving Ivy League endowments a run for their money in the market", "full_content": "While universities like Harvard and Yale carry around endowments that are larger than some small countries' economies, this bull market has provided an environment in which their market performance can be rivaled by nimble collegiate counterparts lacking their vast resources and donor networks.\n\nYale University's $44 billion endowment, a close comp to Nepal's GDP, has returned 9.4% over the past decade through June 2025 \u2014 good, but not good enough to beat Abilene Christian University, a private Christian university in Abilene, Texas , and its 11.4% over the same period, which recently led it to surpass the $1 billion in assets milestone .\n\nThrough June 2026, ACU's 10-year return climbed to 13.6%, against 9.1% for a benchmark of 70% global stocks and 30% bonds, according to data provided by the school. But it's more than just a good year: ACU's 20-year 10.9% average through June 2026 is well above its 6.8% benchmark.\n\nFor many schools, this is the period (September to November) when fiscal year investment performance is released, but not all information is released at the same time. Yale, for instance, has yet to publish its 2026 numbers. The most-cited annual study of hundreds of endowments, the NACUBO-Commonfund Study of Endowments , will be published in February 2027 for FY 2026 performance data.\n\nJoe Lee, president and chief investment officer of ACIMCO (Abilene Christian Investment Management Company), a university-controlled investment company that manages the school's portfolio, said that many small, but good, sound decisions early on, years ago, have compounded over time.\n\n\"We do the standard stuff that other endowments do,\" Lee said, pointing to a philosophy that is equity-oriented, incorporates super long time horizons, and employs good managers and diversification techniques.\n\nBut he also said being small can be an advantage, \"if you lean into the advantages of a smaller endowment,\" Lee said.", "source": "CNBC Top News", "pub_date_str": "14 Oct 2026, 09:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Asked to be an executor? Know your duties before you agree", "full_content": "You have chosen the sensible approach of understanding your role as an executor before accepting the responsibility.\n\nUnder law, the deceased\u2019s property vests in the executor, who acts as the legal representative of the estate. In practice, you have to locate the will and assets, pay funeral expenses, debts and taxes from the estate, and then transfer the assets to the legatees as the will directs.\n\nYou will also need to complete formalities such as obtaining a PAN card for the estate, opening an estate bank account and dealing with various authorities and institutions, depending on the nature of the assets. These could include land revenue authorities, housing societies and provident fund authorities. The entire process can last months and often years.\n\nProbate is no longer mandatory anywhere in India after December 2025, but you may still have to apply for it if family members are likely to dispute the will or if a regulator or financial institution requires it under its policies. Once probate is granted, you must file an inventory of the estate in court within six months and an account within a year.\n\nYou are not entitled to a fee for acting as executor unless the will provides for remuneration. That said, reasonable expenses, such as travel costs and legal and professional fees, can be paid or reimbursed from the estate.\n\nPresumably, your friend has asked you to be the executor of a will that he intends to sign imminently. Before accepting, you should discuss some good practices with him to make administering the estate easier.\n\nHe should also take legal advice to ensure that the will is clear and unambiguous. Urge him to name a co-executor or alternate executor, ideally someone younger or a family member, in case you are unable or unwilling to follow through with this responsibility later.", "source": "LiveMint Money", "pub_date_str": "14 Oct 2026, 09:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Air India Sets Up Committee Under CEO To Explore Cost-saving Measures", "full_content": "Air India, which is jointly owned by Tata Group and Singapore Airlines, recorded a consolidated loss of Rs 22,238.23 crore in the 2025-26 financial year.", "source": "NDTV Profit", "pub_date_str": "14 Oct 2026, 09:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sebi confirms interim curbs on Rajesh Exports, says financial disclosure concerns remain unresolved", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi confirms interim curbs o     function storyHTML(s, num, showCFA) {

            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
