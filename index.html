"pub_date_relative": "8m ago"}, {"title": "ABM Industries\u2019 (ABM) Cash Flow Jump Masks A Split Business Story", "full_content": "Skip to navigation Skip to main content Skip to right column ABM Industries\u2019 (ABM) Cash Flow Jump Masks A Split Business Story Maham Fatima Sat, September 12, 2026 at 6:21 AM PDT 4 min read ABM On September 8, ABM Industries (NYSE: ABM ) told investors that a business famous for grinding out steady, unglamorous cash flow had rediscovered exactly that. Free cash flow through the first nine months of fiscal 2026 jumped more than $150 million from a year earlier, and management used the moment to raise guidance across the board. But underneath that headline, the quarter split cleanly into segments pulling in opposite directions, and the stock's muted valuation suggests the market hasn't fully bought the turnaround yet.\n\nNine-month free cash flow reached $199.6 million, up from $42.4 million a year earlier, a swing management credited to tighter working capital discipline and the stabilization of a previously disruptive ERP rollout. That improvement gave ABM room to raise its full-year reported free cash flow outlook to $210 million and its normalized figure to $285 million. Adjusted EPS climbed 27% to $1.04, helped by higher segment profit and prior share buybacks, while the company hit its target leverage ratio of below 3 times a full quarter ahead of schedule. The more interesting story sits in ABM's newer businesses. Semiconductor, microgrid, and data center work generated nearly $775 million in revenue over nine months, now more than 11% of the total, and semiconductor organic growth alone ran 65%.\n\nThe recent WGNSTAR acquisition pushed ABM further into that world, with CEO Scott Salmirs describing the deal as giving the company the ability to operate \"inside the bull's eye\" of semiconductor fabrication plants rather than just around them. Aviation revenue grew 12% to $328.1 million on travel demand and the ongoing Heathrow ramp, and manufacturing and distribution revenue rose 18% to $481 million.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:51 PM IST", "pub_date_relative": "11m ago"}, {"title": "Dan Loeb\u2019s Third Point Increased Its Reported Hut 8 Stake and Disclosed Riot Debt Exposure", "full_content": "Skip to navigation Skip to main content Skip to right column Dan Loeb\u2019s Third Point Increased Its Reported Hut 8 Stake and Disclosed Riot Debt Exposure Habib Ur Rehman Sat, September 12, 2026 at 6:21 AM PDT 3 min read RIOT HUT Dan Loeb's Third Point disclosed exposure to Hut 8 Corp. (NASDAQ: HUT ) and Riot Platforms, Inc. (NASDAQ: RIOT ) in its latest quarterly filing. The security types matter: it owned Hut 8 common shares and Riot notes, not matching equity positions in two AI infrastructure companies.\n\nInsider Monkey's database counted 73 Hut 8 holders in Q2 2026 versus 60 in Q1, and 55 Riot holders versus 49. These historical counts describe the broader sample, rather than the character of Third Point's individual instruments.\n\nThe manager's consecutive SEC tables show Hut 8 shares increasing from 869,563 at March 31 to 1,315,000 at June 30. The newer table also lists $3.5 million principal amount of Riot notes, valued at approximately $7.03 million, with no corresponding Riot position in the earlier table.\n\nLate-August coverage renewed attention to the exposure, but the filings do not establish recent trades or Loeb's reasons for owning either security. Buying the two common stocks would not reproduce the disclosed positions.\n\nHut 8's August 4 update reported 949 megawatts of contracted IT capacity, approximately $26.6 billion of expected aggregate base-term contract value and $7.5 billion of project financing secured. Those figures describe a substantial development opportunity, not an equivalent amount of revenue already earned.\n\nFinancing can help turn power access into leasable infrastructure. Shareholders still need construction, commissioning and tenant payments to follow the planned sequence. Large contractual totals alone cannot establish the return remaining after development costs and financing obligations.\n\nRiot provides a smaller but tangible operating comparison.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:51 PM IST", "pub_date_relative": "11m ago"}, {"title": "Iran Says It\u2019s No Longer Bound by the Nuclear Treaty. What That Does to Oil, Gold, and Bitcoin", "full_content": "Skip to navigation Skip to main content Skip to right column Iran Says It\u2019s No Longer Bound by the Nuclear Treaty. What That Does to Oil, Gold, and Bitcoin Sam Daodu Sat, September 12, 2026 at 6:20 AM PDT 5 min read BTC-USD CL=F Quick Read Iranian MP Mohseni-Sani declared the NPT no longer binding on Tehran, driving Brent crude from $96 to $110 a barrel in eight days.\n\nGold fell to $4,319 an ounce during an active conflict, signaling dollar strength and real yields are overpowering the traditional safe-haven bid.\n\nBitcoin closed at $77,231 with the VIX at 18, as markets treat a single lawmaker's remark as noise until a formal NPT withdrawal is filed.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMohammadreza Mohseni-Sani, a member of the Iranian parliament's National Security and Foreign Policy Committee, said on September 12, 2026, that Tehran no longer regards the Nuclear Non-Proliferation Treaty as binding. US strikes on Iran resumed on September 2.\n\nBitcoin (CRYPTO:BTC) closed at $77,231 on September 12, 2026, down from a $79,852 intraday high the day before. Oil is reacting to the conflict, and gold is falling when a war should lift it. So does an Iranian lawmaker's line reach Bitcoin in any measurable way?\n\nMohseni-Sani told the Tehran outlet Didban Iran that Tehran no longer treats the Nuclear Non-Proliferation Treaty as binding, \"whether by remaining in it or leaving it.\" His committee handles nuclear policy, and he said in March 2026 that a withdrawal bill could pass with strong support.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:50 PM IST", "pub_date_relative": "12m ago"}, {"title": "Buffett's confidence in troubled decade-old acquisition finally pays off", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nSix years ago, when Berkshire Hathaway took an $11 billion write-down of its $37.2 billion 2016 acquisition of Precision Castparts, Warren Buffett wrote in his annual letter to shareholders he had paid \"too much\" for the company, which makes \" complex metal components and products .\"\n\nWhile it was a \"fine company \u2013 the best in its business,\" he had been \"simply too optimistic\" about its profit potential, a \"miscalculation ... laid bare\" by the enormous downturn for the aerospace industry, Precision Castparts' largest customers, amid the Covid pandemic.\n\nIn a CNBC interview when the deal was first announced, Buffett admitted it was \"a very high multiple for us to pay,\" but told shareholders at the 2016 meeting he had great confidence in Mark Donegan , the company's CEO, both then and now, and the company's long-term profit outlook.\n\nIt's taken longer than he planned, but Buffett's purchase is now looking pretty good.\n\nAs Reuters puts it , there is currently a shortage of the \"complex\" products Precision Castparts makes that are essential for engine turbine blades.\n\nThey're also used in natural gas turbines, which are in demand to produce energy for artificial intelligence data centers.\n\nThis week, GE Aerospace announced it would pay $11.75 billion to acquire Consolidated Precision Products , one of the few companies that competes against Precision Castparts.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 06:50 PM IST", "pub_date_relative": "12m ago"}, {"title": "If a Stock Market Crash Is Coming, History Says This 1 Move Protects Investors Every Single Time", "full_content": "Skip to navigation Skip to main content Skip to right column If a Stock Market Crash Is Coming, History Says This 1 Move Protects Investors Every Single Time Katie Brockman, The Motley Fool Sat, September 12, 2026 at 6:20 AM PDT 4 min read NVDA ^GSPC ^DJI ^IXIC CL=F The stock market is in a tricky place right now, and investors would be wise to start preparing for volatility.\n\nDespite major market indexes like the S&P 500 (SNPINDEX: ^GSPC), Dow Jones Industrial Average (DJINDICES: ^DJI), and Nasdaq Composite (NASDAQINDEX: ^IXIC) reaching all-time highs earlier this year, there's no shortage of headwinds facing the market. Oil prices climbed to more than $100 per barrel, tariff battles are wreaking havoc yet again, and it's becoming more likely the Federal Reserve will hike interest rates this month.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAlthough stocks have been incredibly resilient through all of this turbulence so far, a bear market is inevitable at some point. Fortunately, decades worth of history prove that just one move can protect your investments.\n\nWhen the market is tumbling, it can be tempting to either sell your stocks or stop investing altogether. The risk in that, though, is that while it's certain a bear market will begin eventually, nobody knows when that might be.\n\nSay, for instance, you had gotten out of the market in March. The war in Iran had just begun, and many investors worried that soaring oil prices would crash the broader market. Since March 1, however, the S&P 500 has climbed by more than 12%.\n\nBecause the market can be so unpredictable in the short term, trying to time it effectively is nearly impossible.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:50 PM IST", "pub_date_relative": "12m ago"}, {"title": "After closures, Denny's bets on a comeback", "full_content": "Skip to navigation Skip to main content Skip to right column After closures, Denny's bets on a comeback Mike Snider, USA TODAY Sat, September 12, 2026 at 6:19 AM PDT 6 min read Denny's wants to serve customers a new menu \u2013 and a new narrative.\n\nAn all-too-familiar development made the news earlier this week when a franchisee closed five Denny's restaurants in Minnesota and Wisconsin, first reported by Minnesota news site Bring Me the News . In a note posted on the door of one of the restaurants, the franchisee said it planned to file for bankruptcy.\n\nBut there's more to the story, according to Denny's. The restaurant chain, founded in 1953 as a California doughnut and coffee shop, is looking beyond the public plotline of restaurant closings that has haunted the company for nearly two years. In October 2024, Stephen Dunn, the company's then-chief global development officer told investors Denny's would close 150 locations by the end of 2025. Then in February 2025, then-chief financial officer Robert Verostek said additional restaurant closures would happen by year's end.\n\nBut a new story arc began in November 2025, when Denny's announced it would become privately held after being acquired by private equity firm TriArtisan Capital Advisors, investment management company Treville Capital Group and restaurant company Yadav Enterprises, Inc. The deal, which was valued at $620 million at the time and became official in January, also included 78 locations of the Keke's Breakfast Cafe brand.\n\nThe buyers know the restaurant business. TriArtisan's holdings include P.F.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:49 PM IST", "pub_date_relative": "13m ago"}, {"title": "Analysis-Houthi advance in Yemen puts U.S. in a new bind", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Sep 2026, 06:48 PM IST", "pub_date_relative": "14m ago"}, {"title": "Tehran won\u2019t surrender to the U.S., Iranian President Pezeshkian says, as India's Modi urges dialogue and peace", "full_content": "Iranian President Masoud Pezeshkian said his country will not surrender, adding that it has resisted aggression from the U.S. and Israel.\n\n\"Iran has successfully stood against Israel and the U.S .,\" Pezeshkian said late Friday as he addressed a gathering of Indian religious leaders in New Delhi. \"Since we are seeking truth and justice, we will not yield in front of bullying arrogance.\"\n\nPezeshkian's comments ahead of the BRICS Summit in India over the weekend came on the heels of U.S. President Donald Trump's assertion that Iran would have wiped out Israel and the Middle East, and started hitting U.S. cities, if Washington had not taken military action against Iran.\n\n\"If I had it to do again, I would do exactly what I did,\" Trump said on Thursday.\n\nPezeshkian, who is on his first visit to India, also met with Indian Prime Minister Narendra Modi on Friday. During the bilateral meeting, Modi raised concerns about the safety of seafarers and underscored the need for peace and for freedom of navigation and commerce.\n\nShipments of oil and other cargoes through the critical Strait of Hormuz separating Iran and Oman have slowed to a trickle since the U.S. and Israel began their war on Iran on Feb. 28, stranding ships and seafarers for weeks or months at a time.\n\nThe Indian prime minister reiterated his appeal to resolve the conflict in the Middle East with \"dialogue and diplomacy.\"\n\nHowever, in his opening remarks at the BRICS Summit on Saturday, Modi called the current global order a \"pyramid of privilege\" where countries from the global south do not have enough power to shape the decisions that affect them.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 06:45 PM IST", "pub_date_relative": "17m ago"}, {"title": "BRICS for immediate restoration of fully functioning WTO dispute settlement system", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a BRICS for immediate restoration of fully functioning WTO dispute settlement system The Economic Times daily newspaper is available online now. Read Today's Paper BRICS for immediate restoration of fully functioning WTO dispute settlement system SECTIONS BRICS for immediate restoration of fully functioning WTO dispute settlement system PTI Last Updated: Sep 12, 2026, 06:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis BRICS leaders strongly advocate for restoring the WTO dispute settlement mechanism. They committed to strengthening the organization through necessary reforms and negotiations. The Appellate Body's functioning stalled after the US blocked member appointments. Developing nations believe a two-tier system is fundamental for dispute resolution. BRICS members will engage constructively in WTO reform discussions.\n\nET Prime special: Know Your Company \u2013 Coal India, Part 1: One tonne of coal, two prices\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Sep 2026, 06:45 PM IST", "pub_date_relative": "17m ago"}, {"title": "Netskope\u2019s (NTSK) AI Security Push Is Already Paying Off", "full_content": "Skip to navigation Skip to main content Skip to right column Netskope\u2019s (NTSK) AI Security Push Is Already Paying Off Maham Fatima Sat, September 12, 2026 at 6:14 AM PDT 3 min read NETS.PVT NTSK On September 2, Netskope (NASDAQ: NTSK ) turned in a second quarter that answered the question hanging over every young cybersecurity name: can the growth actually hold up? Annual recurring revenue climbed 27% to $899 million, revenue beat guidance at $220.5 million, and management raised its full-year outlook. The company also leaned harder into a newer growth engine, AI security, that could reshape how big its opportunity really is.\n\nThe core business is compounding in a way that shows up in nearly every metric. Remaining performance obligations jumped 36% to $1.35 billion, net retention held at 114%, and gross retention hit an all-time high, all signs that existing customers are staying and spending more. The number of customers generating over $100,000 in annual recurring revenue rose 23% to 1,686 and now makes up 87% of total ARR. Platform adoption is deepening too, with 59% of customers now using four or more Netskope products, up from 51% a year ago, and margins are following: gross margin reached 77%, and operating margin improved 11 percentage points to negative 9%.\n\nLayered on top of that is the AI security push. Netskope pegs the greenfield opportunity there at $170 billion within a broader $336 billion market, and about a third of its AI security pipeline is already in or entering the proof-of-concept phase. The company's AI Fast Path technology cut latency by as much as 90% in real-world testing; it rolled out post-quantum cryptography across more than 120 data centers, and it joined Nvidia's Open Secure AI Alliance. Gartner and IDC both named Netskope a leader in SSE and SASE during the quarter.\n\nThat growth is not free.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:44 PM IST", "pub_date_relative": "18m ago"}, {"title": "5 REITs That Turn Long-Term Leases Into Reliable Dividend Income", "full_content": "Skip to navigation Skip to main content Skip to right column 5 REITs That Turn Long-Term Leases Into Reliable Dividend Income Chris Lange Sat, September 12, 2026 at 6:12 AM PDT 9 min read O NNN EPRT WPC ADC Quick Read Realty Income (O) has raised its monthly dividend for 115 straight quarters; NNN REIT (NNN) has grown its annual payout for 37 consecutive years.\n\nAll five net lease REITs carry near-99% occupancy, AFFO payout ratios in the mid-60s to low-70s, and raised their 2026 earnings guidance.\n\nEssential Properties (EPRT) carries the lowest leverage at 3.5x net debt with a 64% AFFO payout ratio, while cap rates across the group range from 7% to 7.8%.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Realty Income didn't make the cut. Enter your email to see the names that beat O. The report is free. Enter your email and see if any of your stocks made the cut.\n\nA net lease is a rental structure where the tenant, not the landlord, pays for property taxes, insurance and maintenance in addition to base rent. That arrangement, often called triple-net or NNN, strips most operating volatility out of the landlord's cash flow and turns a building into something closer to a long-duration bond with contractual escalators. It is the reason net lease REITs are pitched as retirement-income vehicles: initial cash cap rates across this roster currently sit in a 7.0% to 7.8% range, with lease terms often stretching well past a decade. For dividend safety we use adjusted funds from operations (AFFO) coverage, not an earnings payout ratio, because REIT net income is distorted by non-cash depreciation. Every name below is an equity REIT that owns real property.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:42 PM IST", "pub_date_relative": "20m ago"}, {"title": "NVIDIA and Digital Realty\u2019s Flexible AI Factory Faces a Test That More Funding Alone Can\u2019t Solve", "full_content": "Skip to navigation Skip to main content Skip to right column NVIDIA and Digital Realty\u2019s Flexible AI Factory Faces a Test That More Funding Alone Can\u2019t Solve Habib Ur Rehman Sat, September 12, 2026 at 6:12 AM PDT 3 min read NVDA DLR Emerald AI's $150 million financing brings fresh resources to a problem that connects NVIDIA Corporation (NASDAQ: NVDA ) and Digital Realty Trust, Inc. (NYSE: DLR ): making AI infrastructure operate within the power grid's constraints. The potential reward is more usable computing capacity. The unresolved test is whether flexibility preserves the service customers need.\n\nEmerald's August 25 announcement listed NVIDIA among the investors and said the capital would support commercial expansion. It also identified a nearly 100-megawatt research factory in Manassas, Virginia, being developed with NVIDIA and Digital Realty and expected online later this year.\n\nThat timing matters. An October 2025 announcement had targeted the first half of 2026. Investors should use the newer schedule rather than assume the original opening date proves that the Virginia facility is already operating.\n\nThe proposed approach coordinates computing workloads and onsite energy resources so a facility can adjust its electricity draw when the grid is under strain. NVIDIA's software and infrastructure controls form part of the architecture, alongside Emerald's orchestration technology.\n\nFor the chipmaker, successful deployments could ease a constraint on customers installing and using its systems. That would support demand through practical infrastructure availability, not simply through another investment in an AI startup.\n\nEmerald already reports commercial deployment at an entire California data center. That supports the concept, although it does not establish the Virginia project's eventual economics. A system that reduces electricity draw while disrupting valuable workloads would offer a weaker proposition.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:42 PM IST", "pub_date_relative": "20m ago"}, {"title": "Credit card limit \u20b93 lakh, usage \u20b950,000: How unused credit can help your credit score and finances", "full_content": "A credit card with a \u20b9 3 lakh limit does not mean that the cardholder should recklessly spend \u20b9 3 lakh. Such a limit requires responsible management. If monthly usage is limited to \u20b9 50,000, the available credit can provide an individual with both a lower credit utilisation ratio and a meaningful financial cushion.\n\nIt is also essential to ensure that the higher credit card limit should never be mistaken for additional income. What every credit card user should acknowledge is that these are credit tools; they require sensible usage, and should not replace an individual\u2019s day-to-day spendings. The reason is that credit card debt is one of the most expensive forms of debt.\n\nKeeping these basics in mind, let us discuss the benefits, pros and cons of maintaining a lower credit card utilisation ratio, and how the used limit can help with managing spending more efficiently.\n\nWith a \u20b9 3 lakh credit card limit and \u20b9 50,000 in outstanding balance, the credit card holder is using about 16.7% of the available limit. This metric should generally be less than 30% of the total credit limit.\n\nWhen an individual keeps utilisation relatively low, it is viewed favourably by lending institutions. Such a habit also helps maintain a healthy credit profile and a higher credit score, provided dues are repaid on time, without delays or missed payments.\n\nSiddharth Mehta, Co-founder & COO, Kiwi, explained this aspect in detail, stating, \u201cA credit card limit of \u20b9 3 lakh, when only \u20b9 50,000 is utilised, means the customer is using just around 16.7% of the available limit.", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 06:41 PM IST", "pub_date_relative": "21m ago"}, {"title": "Some Dividend Growth ETFs Are Beating the Broad Market -- Is It Sustainable?", "full_content": "Skip to navigation Skip to main content Skip to right column Some Dividend Growth ETFs Are Beating the Broad Market -- Is It Sustainable? Dana George, The Motley Fool Sat, September 12, 2026 at 6:05 AM PDT 3 min read NVDA SCHD ^GSPC Dividend growth exchange-traded funds (ETFs) are having their day in the sun, often outperforming the broad market. For example, the Schwab U.S. Dividend Equity ETF (NYSEMKT: SCHD) has delivered a one-year total return of 28.7% (through Sept. 10, 2026), compared with the S&P 500 's return of roughly 18.6% over the same period.\n\nWhile some dividend growth ETFs are making waves, it's worth taking a closer look. For a more nuanced picture, this article will touch on the historically cyclical nature of dividend growth funds. You can't predict the future, but you can learn to recognize patterns from the past.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAs attractive as SCHD, iShares Core Dividend Growth ETF (NYSEMKT: DGRO), and other dividend growth ETFs are, no investment is guaranteed. Weighing the pros and cons can help you determine if a growth fund is right for you.\n\nRegular payouts may continue, even when company earnings are down.\n\nWhen stock values decline, that decline could offset the yield.\n\nInvestors can thank the current financial environment for dividend growth. Rising interest rates put pressure on long-duration growth stocks while favoring cash-generative, shareholder-friendly companies. And historically, dividend strategies have held up better during recessions and periods of rising rates. However, because the market is ever-changing, the types of investments people are interested in change with it.\n\nYou can reasonably count on a few things.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:35 PM IST", "pub_date_relative": "27m ago"}, {"title": "Kohl\u2019s expands in-store partnership as customers look elsewhere", "full_content": "Skip to navigation Skip to main content Skip to right column Kohl\u2019s expands in-store partnership as customers look elsewhere Patricia Battle Sat, September 12, 2026 at 6:03 AM PDT 3 min read KSS Kohl's is expanding a key partnership in its stores as its customers tighten their budgets and gravitate toward other retailers.\n\nIn the second quarter of this year, the department store chain's comparable sales dipped 0.9% year over year, while its operating income decreased 6.5%, according to its latest earnings report . Recent Placer.ai data also revealed that overall customer visits in its stores dropped by 1.4% year over year.\n\nOn an earnings call in August , Kohl's executives revealed that low- to middle-income customers are making trade-offs in their discretionary spending by increasingly opting for lower-priced brands.\n\n\"Our customers remain under financial pressure, and they are becoming increasingly choiceful, actively seeking value in every purchase,\" said Kohl's CEO Michael Bender.\n\nIn an effort to win over customers, Kohl's is expanding its Babies\"R\"Us partnership, which first launched in March 2024.\n\nThe department store chain is adding Babies\"R\"Us shops to an additional 56 existing stores this month, featuring new brands and products, according to a new press release .\n\nThis includes 25 Kohl's locations in California, 20 in Texas, two in New York, two in Illinois, and one location each in Arizona, Colorado, Idaho, Nebraska, New Jersey, Oregon, and Pennsylvania.\n\nRelated: Kohl's has a customer problem that's proving hard to fix", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:33 PM IST", "pub_date_relative": "29m ago"}, {"title": "Boeing and engineers' union reach tentative contract agreement", "full_content": "Boeing and its engineering union reached a \u200ctentative contract agreement on Friday, union officials said.\n\nThe four-year offer includes higher general wage increases than the first offer, which members of the Society of Professional Engineering Employees in Aerospace (SPEEA) overwhelmingly rejected in an August 21 vote.\n\nIf approved, \u200bthe roughly 17,000 members of SPEEA's professional and technical units would get a 10% wage \u200braise on October 16, followed by 4% raises plus merit-based increases in 2027 \u2060through 2030.\n\n\"Our final contract offer addresses the top priorities identified by our employees and SPEEA's bargaining \u200bteams, including an immediate wage increase and larger wage pools with guarantees,\" Boeing's Ben Nimmergut, vice president \u200band functional chief engineer for production engineering, said in a statement.\n\nThe latest offer includes changes to work-from-home policies and overtime limits for professional unit members, according to the union.\n\nAfter rejecting Boeing's first offer, SPEEA members said in an \u200binternal survey that their top priority was getting higher general wage increases.\n\n\"We heard you clearly, in \u200byour survey responses and comments at Town Hall meetings. We took your words with us back to the table, \u200cand \u2060they shaped every conversation we had with Boeing executives,\" SPEEA's negotiating team said in a statement.\n\nThe tentative deal \"isn't everything we'd asked for, but it represents a real step forward toward improving our pay and work lives and rebuilding the relationship between Boeing leadership and our union's members,\" the team said.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 06:32 PM IST", "pub_date_relative": "30m ago"}, {"title": "NXP Semiconductors Eyes Physical AI Leadership, Sees Data Center Growth Surge", "full_content": "Skip to navigation Skip to main content Skip to right column NXP Semiconductors Eyes Physical AI Leadership, Sees Data Center Growth Surge MarketBeat Sat, September 12, 2026 at 6:02 AM PDT 6 min read NXPI Key Points Interested in NXP Semiconductors N.V.? Here are five stocks we like better.\n\nNXP is positioning itself as a leader in \"physical AI\" by combining security, safety, real-time processing and reliability for intelligent edge systems in vehicles, factories and infrastructure.\n\nAutomotive growth is centered on software-defined vehicles, autonomy-related radar, electrification and connectivity. These areas represented nearly half of automotive revenue in the second quarter and grew more than 20% year over year.\n\nData-center revenue is expected to reach about $500 million this year , up from $200 million last year, with roughly 20% growth anticipated into next year. NXP also reported healthy demand and plans to move toward a more asset-light manufacturing model.\n\nWhy NXP Semiconductors Could Be the AI Stock Everyone Is Missing\n\nNXP Semiconductors (NASDAQ:NXPI) is positioning its portfolio around \"physical AI,\" with Chief Executive Officer Rafael Sotomayor saying the company aims to apply its longstanding strengths in security, functional safety, real-time processing and reliability to increasingly intelligent edge devices.\n\nSpeaking at the Goldman Sachs Communacopia + Technology Conference, Sotomayor said artificial intelligence capabilities are moving from the cloud to edge devices that can perceive their surroundings, make decisions and act autonomously. Those applications, including vehicles, factories and infrastructure, require systems that operate deterministically and meet high standards for safety and security, he said.\n\n\u2192 3 Lesser-Known Quantum Plays the Market May Be Overlooking Right Now", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:32 PM IST", "pub_date_relative": "30m ago"}, {"title": "8th pay commission: Pension revision, minimum pension, dearness relief, pension commutation\u2014Top 12 demands by pensioners", "full_content": "The 8th central pay commission (8th CPC) in its consultation stage is undertaking state visits and meetings with various employee and pensioner representative groups, unions and stakeholders to gather suggestions before making its own recommendations next year.\n\nIt is chaired by former Supreme Court Judge Justice Ranjana Prakash Desai , with Pankaj Jain, a former IAS, as Member-Secretary, and Professor Pulak Ghosh, tenured Professor of Finance, Member of the Economic Advisory Council to the Prime Minister, as a Member of the Commission.\n\nConstituted every 10 years, it is likely to make its official announcement latest by May 2027, impacting around 1 crore beneficiaries \u2014 including about 50 lakh central government employees and close to 65 lakh retired central government pensioners , including defence sector personnel and retirees.\n\nNotably, the panel released its official Terms of Reference ( ToR ) last year. On the agenda, among other issues, is the matter of pension revision for pensioners and family pensioners who retired on or before 31 December 2025.\n\nToday, we take a look at some of the top 12 demands been made by pensioners to the commission during the consultation stage so far.\n\nOthers have proposed introduction of progressive age-based pension enhancement up to 100% of the LPD for pensioners aged 90 years and above. Check below table:\n\nNotably, discussions on the 8th CPC are still ongoing, and there is no final decision on these matters yet. Further, once the 8th CPC recommendations come, the Centre will also have to approve them before they are implemented.\n\nAs per the timeline, the commission is likely to announce its recommendations within 18 months since constitution (on 3 November 2025). This means February or April 2027 is the earliest we can get any official announcements on its decisions. But its absolute deadline to submit the report is May 2027 .", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 06:31 PM IST", "pub_date_relative": "30m ago"}, {"title": "Prediction: This Tech Giant Could Be Worth Twice as Much by 2030", "full_content": "Skip to navigation Skip to main content Skip to right column Prediction: This Tech Giant Could Be Worth Twice as Much by 2030 Vandita Jadeja Sat, September 12, 2026 at 6:00 AM PDT 5 min read META BLK Quick Read Meta (META) trades at just 16x forward earnings despite 28% revenue growth, with a viable path to $1,300 per share by 2030.\n\nMeta's data center venture with BlackRock (BLK) anchors a $145 billion 2026 capital budget that is crushing near-term free cash flow.\n\nAI ad tools drove a 15.7% conversion uplift, and Advantage Plus hit a $75 billion annual revenue run rate, powering the bull case.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Meta didn't make the cut. Enter your email to see the names that beat META. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMeta ( NASDAQ:META ) is spending like it is trying to buy the future. Capex of $31.1 billion in a single quarter, a full-year 2026 capital budget of $130 billion to $145 billion, and a data center venture with BlackRock ( NYSE:BLK ).\n\nYet Meta shares are actually down 2.21% year to date and off 14.03% over the past year. The site title asks whether this stock can double by 2030. That means $1,300. I think there is a path, and I want to show it to you (the buildout that gets Meta there also lifts the power, cooling, and networking suppliers we profiled in a free AI infrastructure report).\n\nThe top line looks healthy. Q2 2026 revenue grew 28% year-over-year to $60.8 billion. The problem is what is happening below revenue. Total expenses jumped 55%, dragged higher by $2.4 billion in legal-proceeding charges and $1.2 billion in severance. Operating margin compressed to 31%. Free cash flow collapsed to $784 million from $8.55 billion a year earlier.\n\nInvestors are also digesting a Q2 EPS miss of $6.18 versus $7.22 expected, which snapped a six-quarter beat streak.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago"}], "cfa": [{"title": "Trump's America-first world is pushing other powers to hedge their bets", "full_content": "When Chinese President Xi Jinping, Russian President Vladimir Putin and Indian Prime Minister Narendra Modi were together in China last year , images of the three leaders smiling, holding hands and chatting animatedly went viral.\n\nThis weekend, they meet again in New Delhi against an increasingly complicated geopolitical backdrop.\n\nIndia is hosting leaders of BRICS, a grouping of major emerging economies seeking greater influence in a global system long dominated by the U.S. and other Western powers. Xi, Putin and Iranian President Masoud Pezeshkian are among those expected to attend alongside Modi.\n\nThe U.S. and Israel are at war with Iran, Washington continues to push Moscow toward a deal to end the war in Ukraine, and U.S. President Donald Trump's trade policies have disrupted relationships with allies and rivals alike.\n\nAgainst that backdrop, the summit will put the spotlight on whether those pressures are giving some BRICS members more reason to cooperate on trade, energy and payments, even as deep divisions limit how far that cooperation can go.\n\nTrump's policies are not the reason these countries are talking. India and Russia have maintained close relations for decades, while the India-China thaw began before the latest U.S. trade tensions. But tariffs, sanctions and other economic pressure from Washington are adding another factor to their calculations.\n\nXi's visit will be his first to India since 2019, marking another step in a cautious thaw after deadly clashes along the countries' disputed Himalayan border in 2020.\n\nModi and Xi have sought to stabilize ties, with flights, visas and high-level contacts being restored. But tensions remain over their border, India's large trade deficit with Beijing and their strategic rivalry across Asia.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 06:54 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ABM Industries\u2019 (ABM) Cash Flow Jump Masks A Split Business Story", "full_content": "Skip to navigation Skip to main content Skip to right column ABM Industries\u2019 (ABM) Cash Flow Jump Masks A Split Business Story Maham Fatima Sat, September 12, 2026 at 6:21 AM PDT 4 min read ABM On September 8, ABM Industries (NYSE: ABM ) told investors that a business famous for grinding out steady, unglamorous cash flow had rediscovered exactly that. Free cash flow through the first nine months of fiscal 2026 jumped more than $150 million from a year earlier, and management used the moment to raise guidance across the board. But underneath that headline, the quarter split cleanly into segments pulling in opposite directions, and the stock's muted valuation suggests the market hasn't fully bought the turnaround yet.\n\nNine-month free cash flow reached $199.6 million, up from $42.4 million a year earlier, a swing management credited to tighter working capital discipline and the stabilization of a previously disruptive ERP rollout. That improvement gave ABM room to raise its full-year reported free cash flow outlook to $210 million and its normalized figure to $285 million. Adjusted EPS climbed 27% to $1.04, helped by higher segment profit and prior share buybacks, while the company hit its target leverage ratio of below 3 times a full quarter ahead of schedule. The more interesting story sits in ABM's newer businesses. Semiconductor, microgrid, and data center work generated nearly $775 million in revenue over nine months, now more than 11% of the total, and semiconductor organic growth alone ran 65%.\n\nThe recent WGNSTAR acquisition pushed ABM further into that world, with CEO Scott Salmirs describing the deal as giving the company the ability to operate \"inside the bull's eye\" of semiconductor fabrication plants rather than just around them. Aviation revenue grew 12% to $328.1 million on travel demand and the ongoing Heathrow ramp, and manufacturing and distribution revenue rose 18% to $481 million.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:51 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dan Loeb\u2019s Third Point Increased Its Reported Hut 8 Stake and Disclosed Riot Debt Exposure", "full_content": "Skip to navigation Skip to main content Skip to right column Dan Loeb\u2019s Third Point Increased Its Reported Hut 8 Stake and Disclosed Riot Debt Exposure Habib Ur Rehman Sat, September 12, 2026 at 6:21 AM PDT 3 min read RIOT HUT Dan Loeb's Third Point disclosed exposure to Hut 8 Corp. (NASDAQ: HUT ) and Riot Platforms, Inc. (NASDAQ: RIOT ) in its latest quarterly filing. The security types matter: it owned Hut 8 common shares and Riot notes, not matching equity positions in two AI infrastructure companies.\n\nInsider Monkey's database counted 73 Hut 8 holders in Q2 2026 versus 60 in Q1, and 55 Riot holders versus 49. These historical counts describe the broader sample, rather than the character of Third Point's individual instruments.\n\nThe manager's consecutive SEC tables show Hut 8 shares increasing from 869,563 at March 31 to 1,315,000 at June 30. The newer table also lists $3.5 million principal amount of Riot notes, valued at approximately $7.03 million, with no corresponding Riot position in the earlier table.\n\nLate-August coverage renewed attention to the exposure, but the filings do not establish recent trades or Loeb's reasons for owning either security. Buying the two common stocks would not reproduce the disclosed positions.\n\nHut 8's August 4 update reported 949 megawatts of contracted IT capacity, approximately $26.6 billion of expected aggregate base-term contract value and $7.5 billion of project financing secured. Those figures describe a substantial development opportunity, not an equivalent amount of revenue already earned.\n\nFinancing can help turn power access into leasable infrastructure. Shareholders still need construction, commissioning and tenant payments to follow the planned sequence. Large contractual totals alone cannot establish the return remaining after development costs and financing obligations.\n\nRiot provides a smaller but tangible operating comparison.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:51 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Iran Says It\u2019s No Longer Bound by the Nuclear Treaty. What That Does to Oil, Gold, and Bitcoin", "full_content": "Skip to navigation Skip to main content Skip to right column Iran Says It\u2019s No Longer Bound by the Nuclear Treaty. What That Does to Oil, Gold, and Bitcoin Sam Daodu Sat, September 12, 2026 at 6:20 AM PDT 5 min read BTC-USD CL=F Quick Read Iranian MP Mohseni-Sani declared the NPT no longer binding on Tehran, driving Brent crude from $96 to $110 a barrel in eight days.\n\nGold fell to $4,319 an ounce during an active conflict, signaling dollar strength and real yields are overpowering the traditional safe-haven bid.\n\nBitcoin closed at $77,231 with the VIX at 18, as markets treat a single lawmaker's remark as noise until a formal NPT withdrawal is filed.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMohammadreza Mohseni-Sani, a member of the Iranian parliament's National Security and Foreign Policy Committee, said on September 12, 2026, that Tehran no longer regards the Nuclear Non-Proliferation Treaty as binding. US strikes on Iran resumed on September 2.\n\nBitcoin (CRYPTO:BTC) closed at $77,231 on September 12, 2026, down from a $79,852 intraday high the day before. Oil is reacting to the conflict, and gold is falling when a war should lift it. So does an Iranian lawmaker's line reach Bitcoin in any measurable way?\n\nMohseni-Sani told the Tehran outlet Didban Iran that Tehran no longer treats the Nuclear Non-Proliferation Treaty as binding, \"whether by remaining in it or leaving it.\" His committee handles nuclear policy, and he said in March 2026 that a withdrawal bill could pass with strong support.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:50 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Buffett's confidence in troubled decade-old acquisition finally pays off", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nSix years ago, when Berkshire Hathaway took an $11 billion write-down of its $37.2 billion 2016 acquisition of Precision Castparts, Warren Buffett wrote in his annual letter to shareholders he had paid \"too much\" for the company, which makes \" complex metal components and products .\"\n\nWhile it was a \"fine company \u2013 the best in its business,\" he had been \"simply too optimistic\" about its profit potential, a \"miscalculation ... laid bare\" by the enormous downturn for the aerospace industry, Precision Castparts' largest customers, amid the Covid pandemic.\n\nIn a CNBC interview when the deal was first announced, Buffett admitted it was \"a very high multiple for us to pay,\" but told shareholders at the 2016 meeting he had great confidence in Mark Donegan , the company's CEO, both then and now, and the company's long-term profit outlook.\n\nIt's taken longer than he planned, but Buffett's purchase is now looking pretty good.\n\nAs Reuters puts it , there is currently a shortage of the \"complex\" products Precision Castparts makes that are essential for engine turbine blades.\n\nThey're also used in natural gas turbines, which are in demand to produce energy for artificial intelligence data centers.\n\nThis week, GE Aerospace announced it would pay $11.75 billion to acquire Consolidated Precision Products , one of the few companies that competes against Precision Castparts.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 06:50 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "If a Stock Market Crash Is Coming, History Says This 1 Move Protects Investors Every Single Time", "full_content": "Skip to navigation Skip to main content Skip to right column If a Stock Market Crash Is Coming, History Says This 1 Move Protects Investors Every Single Time Katie Brockman, The Motley Fool Sat, September 12, 2026 at 6:20 AM PDT 4 min read NVDA ^GSPC ^DJI ^IXIC CL=F The stock market is in a tricky place right now, and investors would be wise to start preparing for volatility.\n\nDespite major market indexes like the S&P 500 (SNPINDEX: ^GSPC), Dow Jones Industrial Average (DJINDICES: ^DJI), and Nasdaq Composite (NASDAQINDEX: ^IXIC) reaching all-time highs earlier this year, there's no shortage of headwinds facing the market. Oil prices climbed to more than $100 per barrel, tariff battles are wreaking havoc yet again, and it's becoming more likely the Federal Reserve will hike interest rates this month.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAlthough stocks have been incredibly resilient through all of this turbulence so far, a bear market is inevitable at some point. Fortunately, decades worth of history prove that just one move can protect your investments.\n\nWhen the market is tumbling, it can be tempting to either sell your stocks or stop investing altogether. The risk in that, though, is that while it's certain a bear market will begin eventually, nobody knows when that might be.\n\nSay, for instance, you had gotten out of the market in March. The war in Iran had just begun, and many investors worried that soaring oil prices would crash the broader market. Since March 1, however, the S&P 500 has climbed by more than 12%.\n\nBecause the market can be so unpredictable in the short term, trying to time it effectively is nearly impossible.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:50 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "After closures, Denny's bets on a comeback", "full_content": "Skip to navigation Skip to main content Skip to right column After closures, Denny's bets on a comeback Mike Snider, USA TODAY Sat, September 12, 2026 at 6:19 AM PDT 6 min read Denny's wants to serve customers a new menu \u2013 and a new narrative.\n\nAn all-too-familiar development made the news earlier this week when a franchisee closed five Denny's restaurants in Minnesota and Wisconsin, first reported by Minnesota news site Bring Me the News . In a note posted on the door of one of the restaurants, the franchisee said it planned to file for bankruptcy.\n\nBut there's more to the story, according to Denny's. The restaurant chain, founded in 1953 as a California doughnut and coffee shop, is looking beyond the public plotline of restaurant closings that has haunted the company for nearly two years. In October 2024, Stephen Dunn, the company's then-chief global development officer told investors Denny's would close 150 locations by the end of 2025. Then in February 2025, then-chief financial officer Robert Verostek said additional restaurant closures would happen by year's end.\n\nBut a new story arc began in November 2025, when Denny's announced it would become privately held after being acquired by private equity firm TriArtisan Capital Advisors, investment management company Treville Capital Group and restaurant company Yadav Enterprises, Inc. The deal, which was valued at $620 million at the time and became official in January, also included 78 locations of the Keke's Breakfast Cafe brand.\n\nThe buyers know the restaurant business. TriArtisan's holdings include P.F.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:49 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Tehran won\u2019t surrender to the U.S., Iranian President Pezeshkian says, as India's Modi urges dialogue and peace", "full_content": "Iranian President Masoud Pezeshkian said his country will not surrender, adding that it has resisted aggression from the U.S. and Israel.\n\n\"Iran has successfully stood against Israel and the U.S .,\" Pezeshkian said late Friday as he addressed a gathering of Indian religious leaders in New Delhi. \"Since we are seeking truth and justice, we will not yield in front of bullying arrogance.\"\n\nPezeshkian's comments ahead of the BRICS Summit in India over the weekend came on the heels of U.S. President Donald Trump's assertion that Iran would have wiped out Israel and the Middle East, and started hitting U.S. cities, if Washington had not taken military action against Iran.\n\n\"If I had it to do again, I would do exactly what I did,\" Trump said on Thursday.\n\nPezeshkian, who is on his first visit to India, also met with Indian Prime Minister Narendra Modi on Friday. During the bilateral meeting, Modi raised concerns about the safety of seafarers and underscored the need for peace and for freedom of navigation and commerce.\n\nShipments of oil and other cargoes through the critical Strait of Hormuz separating Iran and Oman have slowed to a trickle since the U.S. and Israel began their war on Iran on Feb. 28, stranding ships and seafarers for weeks or months at a time.\n\nThe Indian prime minister reiterated his appeal to resolve the conflict in the Middle East with \"dialogue and diplomacy.\"\n\nHowever, in his opening remarks at the BRICS Summit on Saturday, Modi called the current global order a \"pyramid of privilege\" where countries from the global south do not have enough power to shape the decisions that affect them.", "source": "CNBC Top News", "pub_date_str": "12 Sep 2026, 06:45 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "BRICS for immediate restoration of fully functioning WTO dispute settlement system", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a BRICS for immediate restoration of fully functioning WTO dispute settlement system The Economic Times daily newspaper is available online now. Read Today's Paper BRICS for immediate restoration of fully functioning WTO dispute settlement system SECTIONS BRICS for immediate restoration of fully functioning WTO dispute settlement system PTI Last Updated: Sep 12, 2026, 06:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis BRICS leaders strongly advocate for restoring the WTO dispute settlement mechanism. They committed to strengthening the organization through necessary reforms and negotiations. The Appellate Body's functioning stalled after the US blocked member appointments. Developing nations believe a two-tier system is fundamental for dispute resolution. BRICS members will engage constructively in WTO reform discussions.\n\nET Prime special: Know Your Company \u2013 Coal India, Part 1: One tonne of coal, two prices\n\nHormuz is a state, not a strait. There are 10 other possible chokepoints for the global economy, including India\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Sep 2026, 06:45 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Netskope\u2019s (NTSK) AI Security Push Is Already Paying Off", "full_content": "Skip to navigation Skip to main content Skip to right column Netskope\u2019s (NTSK) AI Security Push Is Already Paying Off Maham Fatima Sat, September 12, 2026 at 6:14 AM PDT 3 min read NETS.PVT NTSK On September 2, Netskope (NASDAQ: NTSK ) turned in a second quarter that answered the question hanging over every young cybersecurity name: can the growth actually hold up? Annual recurring revenue climbed 27% to $899 million, revenue beat guidance at $220.5 million, and management raised its full-year outlook. The company also leaned harder into a newer growth engine, AI security, that could reshape how big its opportunity really is.\n\nThe core business is compounding in a way that shows up in nearly every metric. Remaining performance obligations jumped 36% to $1.35 billion, net retention held at 114%, and gross retention hit an all-time high, all signs that existing customers are staying and spending more. The number of customers generating over $100,000 in annual recurring revenue rose 23% to 1,686 and now makes up 87% of total ARR. Platform adoption is deepening too, with 59% of customers now using four or more Netskope products, up from 51% a year ago, and margins are following: gross margin reached 77%, and operating margin improved 11 percentage points to negative 9%.\n\nLayered on top of that is the AI security push. Netskope pegs the greenfield opportunity there at $170 billion within a broader $336 billion market, and about a third of its AI security pipeline is already in or entering the proof-of-concept phase. The company's AI Fast Path technology cut latency by as much as 90% in real-world testing; it rolled out post-quantum cryptography across more than 120 data centers, and it joined Nvidia's Open Secure AI Alliance. Gartner and IDC both named Netskope a leader in SSE and SASE during the quarter.\n\nThat growth is not free.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:44 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "5 REITs That Turn Long-Term Leases Into Reliable Dividend Income", "full_content": "Skip to navigation Skip to main content Skip to right column 5 REITs That Turn Long-Term Leases Into Reliable Dividend Income Chris Lange Sat, September 12, 2026 at 6:12 AM PDT 9 min read O NNN EPRT WPC ADC Quick Read Realty Income (O) has raised its monthly dividend for 115 straight quarters; NNN REIT (NNN) has grown its annual payout for 37 consecutive years.\n\nAll five net lease REITs carry near-99% occupancy, AFFO payout ratios in the mid-60s to low-70s, and raised their 2026 earnings guidance.\n\nEssential Properties (EPRT) carries the lowest leverage at 3.5x net debt with a 64% AFFO payout ratio, while cap rates across the group range from 7% to 7.8%.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Realty Income didn't make the cut. Enter your email to see the names that beat O. The report is free. Enter your email and see if any of your stocks made the cut.\n\nA net lease is a rental structure where the tenant, not the landlord, pays for property taxes, insurance and maintenance in addition to base rent. That arrangement, often called triple-net or NNN, strips most operating volatility out of the landlord's cash flow and turns a building into something closer to a long-duration bond with contractual escalators. It is the reason net lease REITs are pitched as retirement-income vehicles: initial cash cap rates across this roster currently sit in a 7.0% to 7.8% range, with lease terms often stretching well past a decade. For dividend safety we use adjusted funds from operations (AFFO) coverage, not an earnings payout ratio, because REIT net income is distorted by non-cash depreciation. Every name below is an equity REIT that owns real property.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:42 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NVIDIA and Digital Realty\u2019s Flexible AI Factory Faces a Test That More Funding Alone Can\u2019t Solve", "full_content": "Skip to navigation Skip to main content Skip to right column NVIDIA and Digital Realty\u2019s Flexible AI Factory Faces a Test That More Funding Alone Can\u2019t Solve Habib Ur Rehman Sat, September 12, 2026 at 6:12 AM PDT 3 min read NVDA DLR Emerald AI's $150 million financing brings fresh resources to a problem that connects NVIDIA Corporation (NASDAQ: NVDA ) and Digital Realty Trust, Inc. (NYSE: DLR ): making AI infrastructure operate within the power grid's constraints. The potential reward is more usable computing capacity. The unresolved test is whether flexibility preserves the service customers need.\n\nEmerald's August 25 announcement listed NVIDIA among the investors and said the capital would support commercial expansion. It also identified a nearly 100-megawatt research factory in Manassas, Virginia, being developed with NVIDIA and Digital Realty and expected online later this year.\n\nThat timing matters. An October 2025 announcement had targeted the first half of 2026. Investors should use the newer schedule rather than assume the original opening date proves that the Virginia facility is already operating.\n\nThe proposed approach coordinates computing workloads and onsite energy resources so a facility can adjust its electricity draw when the grid is under strain. NVIDIA's software and infrastructure controls form part of the architecture, alongside Emerald's orchestration technology.\n\nFor the chipmaker, successful deployments could ease a constraint on customers installing and using its systems. That would support demand through practical infrastructure availability, not simply through another investment in an AI startup.\n\nEmerald already reports commercial deployment at an entire California data center. That supports the concept, although it does not establish the Virginia project's eventual economics. A system that reduces electricity draw while disrupting valuable workloads would offer a weaker proposition.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:42 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Some Dividend Growth ETFs Are Beating the Broad Market -- Is It Sustainable?", "full_content": "Skip to navigation Skip to main content Skip to right column Some Dividend Growth ETFs Are Beating the Broad Market -- Is It Sustainable? Dana George, The Motley Fool Sat, September 12, 2026 at 6:05 AM PDT 3 min read NVDA SCHD ^GSPC Dividend growth exchange-traded funds (ETFs) are having their day in the sun, often outperforming the broad market. For example, the Schwab U.S. Dividend Equity ETF (NYSEMKT: SCHD) has delivered a one-year total return of 28.7% (through Sept. 10, 2026), compared with the S&P 500 's return of roughly 18.6% over the same period.\n\nWhile some dividend growth ETFs are making waves, it's worth taking a closer look. For a more nuanced picture, this article will touch on the historically cyclical nature of dividend growth funds. You can't predict the future, but you can learn to recognize patterns from the past.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAs attractive as SCHD, iShares Core Dividend Growth ETF (NYSEMKT: DGRO), and other dividend growth ETFs are, no investment is guaranteed. Weighing the pros and cons can help you determine if a growth fund is right for you.\n\nRegular payouts may continue, even when company earnings are down.\n\nWhen stock values decline, that decline could offset the yield.\n\nInvestors can thank the current financial environment for dividend growth. Rising interest rates put pressure on long-duration growth stocks while favoring cash-generative, shareholder-friendly companies. And historically, dividend strategies have held up better during recessions and periods of rising rates. However, because the market is ever-changing, the types of investments people are interested in change with it.\n\nYou can reasonably count on a few things.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:35 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kohl\u2019s expands in-store partnership as customers look elsewhere", "full_content": "Skip to navigation Skip to main content Skip to right column Kohl\u2019s expands in-store partnership as customers look elsewhere Patricia Battle Sat, September 12, 2026 at 6:03 AM PDT 3 min read KSS Kohl's is expanding a key partnership in its stores as its customers tighten their budgets and gravitate toward other retailers.\n\nIn the second quarter of this year, the department store chain's comparable sales dipped 0.9% year over year, while its operating income decreased 6.5%, according to its latest earnings report . Recent Placer.ai data also revealed that overall customer visits in its stores dropped by 1.4% year over year.\n\nOn an earnings call in August , Kohl's executives revealed that low- to middle-income customers are making trade-offs in their discretionary spending by increasingly opting for lower-priced brands.\n\n\"Our customers remain under financial pressure, and they are becoming increasingly choiceful, actively seeking value in every purchase,\" said Kohl's CEO Michael Bender.\n\nIn an effort to win over customers, Kohl's is expanding its Babies\"R\"Us partnership, which first launched in March 2024.\n\nThe department store chain is adding Babies\"R\"Us shops to an additional 56 existing stores this month, featuring new brands and products, according to a new press release .\n\nThis includes 25 Kohl's locations in California, 20 in Texas, two in New York, two in Illinois, and one location each in Arizona, Colorado, Idaho, Nebraska, New Jersey, Oregon, and Pennsylvania.\n\nRelated: Kohl's has a customer problem that's proving hard to fix", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:33 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NXP Semiconductors Eyes Physical AI Leadership, Sees Data Center Growth Surge", "full_content": "Skip to navigation Skip to main content Skip to right column NXP Semiconductors Eyes Physical AI Leadership, Sees Data Center Growth Surge MarketBeat Sat, September 12, 2026 at 6:02 AM PDT 6 min read NXPI Key Points Interested in NXP Semiconductors N.V.? Here are five stocks we like better.\n\nNXP is positioning itself as a leader in \"physical AI\" by combining security, safety, real-time processing and reliability for intelligent edge systems in vehicles, factories and infrastructure.\n\nAutomotive growth is centered on software-defined vehicles, autonomy-related radar, electrification and connectivity. These areas represented nearly half of automotive revenue in the second quarter and grew more than 20% year over year.\n\nData-center revenue is expected to reach about $500 million this year , up from $200 million last year, with roughly 20% growth anticipated into next year. NXP also reported healthy demand and plans to move toward a more asset-light manufacturing model.\n\nWhy NXP Semiconductors Could Be the AI Stock Everyone Is Missing\n\nNXP Semiconductors (NASDAQ:NXPI) is positioning its portfolio around \"physical AI,\" with Chief Executive Officer Rafael Sotomayor saying the company aims to apply its longstanding strengths in security, functional safety, real-time processing and reliability to increasingly intelligent edge devices.\n\nSpeaking at the Goldman Sachs Communacopia + Technology Conference, Sotomayor said artificial intelligence capabilities are moving from the cloud to edge devices that can perceive their surroundings, make decisions and act autonomously. Those applications, including vehicles, factories and infrastructure, require systems that operate deterministically and meet high standards for safety and security, he said.\n\n\u2192 3 Lesser-Known Quantum Plays the Market May Be Overlooking Right Now", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:32 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th pay commission: Pension revision, minimum pension, dearness relief, pension commutation\u2014Top 12 demands by pensioners", "full_content": "The 8th central pay commission (8th CPC) in its consultation stage is undertaking state visits and meetings with various employee and pensioner representative groups, unions and stakeholders to gather suggestions before making its own recommendations next year.\n\nIt is chaired by former Supreme Court Judge Justice Ranjana Prakash Desai , with Pankaj Jain, a former IAS, as Member-Secretary, and Professor Pulak Ghosh, tenured Professor of Finance, Member of the Economic Advisory Council to the Prime Minister, as a Member of the Commission.\n\nConstituted every 10 years, it is likely to make its official announcement latest by May 2027, impacting around 1 crore beneficiaries \u2014 including about 50 lakh central government employees and close to 65 lakh retired central government pensioners , including defence sector personnel and retirees.\n\nNotably, the panel released its official Terms of Reference ( ToR ) last year. On the agenda, among other issues, is the matter of pension revision for pensioners and family pensioners who retired on or before 31 December 2025.\n\nToday, we take a look at some of the top 12 demands been made by pensioners to the commission during the consultation stage so far.\n\nOthers have proposed introduction of progressive age-based pension enhancement up to 100% of the LPD for pensioners aged 90 years and above. Check below table:\n\nNotably, discussions on the 8th CPC are still ongoing, and there is no final decision on these matters yet. Further, once the 8th CPC recommendations come, the Centre will also have to approve them before they are implemented.\n\nAs per the timeline, the commission is likely to announce its recommendations within 18 months since constitution (on 3 November 2025). This means February or April 2027 is the earliest we can get any official announcements on its decisions. But its absolute deadline to submit the report is May 2027 .", "source": "LiveMint Money", "pub_date_str": "12 Sep 2026, 06:31 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Prediction: This Tech Giant Could Be Worth Twice as Much by 2030", "full_content": "Skip to navigation Skip to main content Skip to right column Prediction: This Tech Giant Could Be Worth Twice as Much by 2030 Vandita Jadeja Sat, September 12, 2026 at 6:00 AM PDT 5 min read META BLK Quick Read Meta (META) trades at just 16x forward earnings despite 28% revenue growth, with a viable path to $1,300 per share by 2030.\n\nMeta's data center venture with BlackRock (BLK) anchors a $145 billion 2026 capital budget that is crushing near-term free cash flow.\n\nAI ad tools drove a 15.7% conversion uplift, and Advantage Plus hit a $75 billion annual revenue run rate, powering the bull case.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Meta didn't make the cut. Enter your email to see the names that beat META. The report is free. Enter your email and see if any of your stocks made the cut.\n\nMeta ( NASDAQ:META ) is spending like it is trying to buy the future. Capex of $31.1 billion in a single quarter, a full-year 2026 capital budget of $130 billion to $145 billion, and a data center venture with BlackRock ( NYSE:BLK ).\n\nYet Meta shares are actually down 2.21% year to date and off 14.03% over the past year. The site title asks whether this stock can double by 2030. That means $1,300. I think there is a path, and I want to show it to you (the buildout that gets Meta there also lifts the power, cooling, and networking suppliers we profiled in a free AI infrastructure report).\n\nThe top line looks healthy. Q2 2026 revenue grew 28% year-over-year to $60.8 billion. The problem is what is happening below revenue. Total expenses jumped 55%, dragged higher by $2.4 billion in legal-proceeding charges and $1.2 billion in severance. Operating margin compressed to 31%. Free cash flow collapsed to $784 million from $8.55 billion a year earlier.\n\nInvestors are also digesting a Q2 EPS miss of $6.18 versus $7.22 expected, which snapped a six-quarter beat streak.", "source": "Yahoo Finance", "pub_date_str": "12 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Construction robots attack America's housing shortage, but we're a long way from humanoid homebuilders", "full_content": "America's housing industry is under pressure to build more homes with a shrinking pool of skilled labor. Robotics and automation offer one potential answer, but the biggest gains so far are not coming from humanoid robots replacing workers on construction sites.\n\nThey are coming from narrower applications: machines that prevent mistakes, coordinate trades, and automate repetitive work, along with factories that move more of the construction process into controlled environments, say industry experts.\n\nThe United States is short roughly 1.2 million homes, according to the National Association of Home Builders 2026 Housing Outlook . Nearly 300,000 construction jobs remained open at the end of 2025, and NAHB estimates the industry needs to attract roughly 740,000 workers a year to account for growth, retirements, and workers leaving the field.\n\nThat labor gap compounds a decades-old productivity problem: Residential construction productivity has increased only about 16% since 1993, compared with gains of more than 50% across the overall economy, according to NAHB chief economist Robert Dietz.\n\nLabor shortages alone cost homebuilders about $11 billion a year through higher costs and lost production and add roughly two months to the average construction timeline, Dietz said.\n\nYet when asked whether robotics is already meaningfully improving homebuilding productivity, Dietz said, \"It's too early.\"\n\n\"There's no single, simple, scalable solution,\" he said, pointing to labor, regulatory costs, land availability, supply chains, and financing as additional constraints on housing production.\n\nThe results so far suggest robotics can produce meaningful gains on individual projects, but those gains remain too narrow and too limited in scale to materially reduce the national housing shortage .", "source": "CNBC World Economy", "pub_date_str": "12 Sep 2026, 06:30 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the
