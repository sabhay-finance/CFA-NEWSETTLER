<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Paris Hilton, Alexandria Ocasio-Cortez press House to pass Defiance Act to fight AI deepfake pornography", "full_content": "Artificial intelligence can turn an ordinary photo or video into a sexually explicit AI deepfake, with consequences that can follow victims into their classrooms and workplaces. Getting those images removed is one challenge. Holding the people who create or share them accountable is another. Policymakers, advocates and victims say additional federal legislation is needed, but a bill that would give victims new legal remedies has yet to receive a vote in the House after two years of efforts.\n\nOn Tuesday, Paris Hilton, one of the bill's most prominent advocates, was back on the steps of the U.S. Capitol alongside Defiance Act backers including Rep. Alexandria Ocasio-Cortez (D-NY) and Rep. Laurel Lee (R-FL) to press the U.S. House of Representatives to pass the bill into law. The U.S. Senate passed its most recent version of the measure by unanimous consent in January 2026.\n\nThe proposed bipartisan bill, the Defiance Act (Disrupt Explicit Forged Images And Non-Consensual Edits Act), would close gaps in an existing federal right to sue over sexually explicit deepfakes, creating the civil right to sue for victims of deepfake pornography. If passed, survivors could sue perpetrators who create, share, publish, solicit, or threaten to distribute this content without consent. Victims could also recover legal costs and seek court orders requiring the content to be removed.\n\n\"This work is very personal to me and it's just so terrifying now if AI gets into the wrong hands, what's possible,\" Hilton said during a new episode of the \"CNBC Changemakers\" podcast with Julia Boorstin.\n\nWhen Hilton was 19, she was pressured into allowing an intimate recording featuring her and her then-boyfriend, Rick Salomon.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 10:06 PM IST", "pub_date_relative": "2m ago"}, {"title": "Target shares rise 5% as retailer posts best sales growth in five years, hikes guidance", "full_content": "Target on Wednesday reported its best sales growth in more than five years and beat Wall Street's revenue expectations, the latest signs of its turnaround strategy taking hold.\n\nThe retailer said its net sales grew 7.1% during the fiscal third quarter. Comparable sales rose 5.6%, compared with StreetAccount estimates of up 3.8%. That growth was boosted by a 5% increase in comparable traffic, Target added.\n\n\"[It's] a healthy sign that guests are responding to our changes and choosing Target more often,\" CEO Michael Fiddelke told reporters.\n\nDigital comparable sales jumped nearly 10% during the quarter.\n\nEncouraged by the growth, Target raised its full-year guidance, upping its net sales growth guidance by 1 percentage point to around 6%. It's also expecting full-year operating income margin rate to be around 6.2%, which includes roughly 1.1 percentage points of benefit from tariff refunds.\n\nThe company also said it's now projecting full-year earnings per share to be in a range of $10.65 to $11.40, compared with prior guidance of between $9.90 and $10.90.\n\n\"The changes we've made across our assortment and guest experience are adding up,\" Fiddelke told reporters. \"While we're encouraged by the progress, we know there's more work ahead to sustain this momentum and deliver consistent growth over time.\"\n\nTarget shares climbed more than 5% in morning trading Wednesday.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 10:04 PM IST", "pub_date_relative": "4m ago"}, {"title": "Dow slides 600 points, Nasdaq seesaws as Nvidia earnings bounce fizzles: Live updates", "full_content": "The Dow Jones Industrial Average fell on Wednesday as Nvidia shares lost momentum following the chipmaker's better-than-expected earnings report.\n\nThe 30-stock index shed 607 points, or 1.2%. The S&P 500 traded down 0.5%, while the Nasdaq Composite traded around the flatline.\n\nShares of Nvidia were more than 2% lower, reversing course from earlier gains after the company's profit and revenue in the third quarter beat analysts' estimates. The company also lifted its revenue guidance for the fiscal year ending January 2028, calling for 75% growth year over year.\n\nThe report marked the chipmaker's first since Jensen Huang resigned last week as CEO, a move that came days after he admitted to an affair with a businesswoman alleged to be a Chinese spy.\n\n\"This wasn't a issue associated with defective chips or some breakdown in terms of their products. This was a personnel change. It's going to be an adjustment, but it's one that the market will work its way through, just as it always has in the past,\" said Eric Parnell, chief market strategist at Great Valley Advisor Group.\n\nWhen it comes to the broader artificial intelligence trade, however, Parnell noted that the underlying fundamental challenges, including those related to capital expenditures and debt financing, haven't changed \u2014 and might not anytime soon.\n\n\"It doesn't take much of a slowdown in earnings growth in the environment that we're in with the AI buildout and the AI spend to take these types of stocks down pretty quickly,\" he said. \"It's this type of volatility that I suspect we're not only going to continue to see but it's likely to increase as we go through 2027 and into 2028.\"\n\nThe Dow was also weighed down by losses in healthcare stocks like UnitedHealth as well as energy name Chevron and industrial giant Caterpillar . UnitedHealth lost 4%, while Chevron and Caterpillar declined around 3% and nearly 3%, respectively.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 10:03 PM IST", "pub_date_relative": "5m ago"}, {"title": "Tech outages are causing people to panic-buy. Costco is benefiting, Mizuho says", "full_content": "A series of tech outages has consumers stocking up on emergency supplies.\n\nCostco sales are seeing a lift because of it, according to research firm Mizuho.\n\nIn the final week of October, Mizuho estimates, Costco's U.S. comparable sales, excluding gasoline, rose 11% to 12%, up from the normal 6% to 7% the first three weeks in October. Costco reported an 8.1% increase for the month. The firm said the stronger pace is continuing through November, as 21 of the 26 high-ticket generators it tracked on Costco's website sold out as of Sunday night.\n\nShares of Costco were roughly flat-to-lower in Wednesday morning trading at around $1,107 apiece.\n\n\"Consumer anxiety following the Microsoft Outlook outage, the ground stoppage for all U.S. airline flights, and apocalyptic concerns flaring up across social media have all contributed to increased emergency prep sales at COST,\" Mizuho analyst David Bellinger said in a research note Monday. Bellinger will appear on CNBC's \"The Exchange\" during the 1 p.m. hour.\n\nOn Thursday, an outage occurred in Microsoft's Outlook and Teams, and on Friday the Federal Aviation Administration halted departures nationwide. On Monday, a software outage at JPMorgan Chase caused banking transaction delays, and a system outage delayed United Airlines flights. The National Security Agency said Tuesday that the spy agency's communication network went down temporarily.\n\nThe outages appear to come amid a rush to recover software vulnerabilities uncovered by AI tools, and officials are saying there's no reason for panic.\n\nStill, on TikTok and other social media platforms, posts urging people to stock up on food and supplies are gaining significant traction.", "source": "CNBC Finance", "pub_date_str": "18 Nov 2026, 10:03 PM IST", "pub_date_relative": "5m ago"}, {"title": "Dealbook Summit 2026 live updates: Altman says 'hard to imagine the AI industry without Jensen'", "full_content": "SpaceX founder and CEO Elon Musk is scheduled to appear at the New York Times DealBook Summit on Wednesday.\n\nAndrew Ross Sorkin , founder and editor of DealBook and co-anchor of CNBC's \"Squawk Box,\" is sitting down with Musk and other prominent business, economic and political leaders to discuss a wide range of newsmaking issues.\n\nOnce again artificial intelligence and the impact it is having on our world is top of mind. The conference comes as OpenAI rival Anthropic is about to make its public debut on Thursday, and it follows a series of widespread tech outages that have grounded airplanes, snarled email, and stymied banking transactions, among other disruptions.\n\nWhile the various IT issues have been a dramatic reminder of society's dependency on these services, the Anthropic IPO raises a number of questions about the valuations of AI companies, which have been under pressure. Voters were largely seen as having rebuked AI in the midterm elections in November, as a number of Democrats who have advocated for the slowdown of the AI data center buildout were ushered into power.\n\nPublic mistrust of tech billionaires and AI may have been stoked further by revelations that Nvidia CEO Jensen Huang was having an affair with Alice Huang, who is alleged to have had contact with Chinese intelligence. The Nvidia co-founder resigned last week, but has said that he will cooperate with the board's investigation and would be willing to return to the company if requested.\n\nOther key guests include Anduril Industries founder Palmer Luckey, Robinhood CEO Vlad Tenev, New York City Mayor Zohran Mamdani and Microsoft CEO Satya Nadella\n\nThe DealBook summit is taking a quick break ahead of an interview with Skydance CEO David Ellison.\n\nEarlier Wednesday, Christine Lagarde had declined to specify what her plans would be when she steps down as European Central Bank president in February.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 10:01 PM IST", "pub_date_relative": "6m ago"}, {"title": "CoreWeave\u2019s stock drops as Nvidia talks up a \u2018disciplined\u2019 approach to financing", "full_content": "Nvidia interim CEO Colette Kress said neoclouds are \u201cincreasingly important,\u201d but added the company will take \u201ca very strong look\u201d at the customers it helps with financing.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 10:00 PM IST", "pub_date_relative": "8m ago"}, {"title": "Vance scraps schedule to address tech outages as Trump admin insists incidents aren't linked", "full_content": "Vice President JD Vance on Wednesday abruptly canceled his scheduled appearance at The New York Times DealBook Summit to instead attend meetings on a recent wave of high-profile technology outages .\n\nThe cancellation was announced shortly after a senior Trump administration official insisted that the outages, which have affected a wide range of industries and have been felt across the country and around the world, are not the result of a cyberattack or any form of coordinated action.\n\n\"We have a great deal of confidence in our assessment that these incidents are the result of upgrades of the systems, systems being patched, hardware being applied\" or other \"disparate\" events, the official said on condition of anonymity to discuss the government's intelligence assessments.\n\nThe official briefed news outlets by phone in the wake of numerous major disruptions at large corporations and federal agencies in recent days, including a nationwide ground stop, a protracted Microsoft Outlook outage and a reported blackout of the National Security Agency's classified communications network.\n\nOther incidents include software issues at JPMorgan Chase , an outage at United Airlines that caused some flight delays and product issues at Apple .\n\nOn Tuesday, Director of National Intelligence Jay Clayton told CNBC that the outages are not a cyberattack \"not a coordinated effort by a nation state.\"\n\nHe gave a similar assurance on Wednesday to the House Homeland Security Committee.\n\n\"We have no indication that these incidents are related, that they're coordinated,\" Clayton said. \"We also have no indication that they're result of a state-sponsored malign actor.\"", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 09:58 PM IST", "pub_date_relative": "10m ago"}, {"title": "Dow slides 600 points, Nasdaq seesaws as Nvidia earnings bounce fizzles: Live updates - CNBC", "full_content": "Dow slides 600 points, Nasdaq seesaws as Nvidia earnings bounce fizzles: Live updates CNBC Tech stocks rise as investors shift focus to Anthropic IPO: AlphaCheck Yahoo Finance Wall Street wobbles as Nvidia and other AI stocks keep swinging sharply AP News Stocks Fall in Countdown to Nvidia\u2019s Earnings Test: Markets Wrap Bloomberg.com The AI Rally Needed a Win. Nvidia Earnings Weren\u2019t It. Barron's", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 09:56 PM IST", "pub_date_relative": "11m ago"}, {"title": "Brazil\u2019s finance minister signals additional fiscal measures in the near term", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:55 PM IST", "pub_date_relative": "13m ago"}, {"title": "EverQuote at RBC conference: growth accelerates as AI bets weigh margins", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:54 PM IST", "pub_date_relative": "13m ago"}, {"title": "Datadog at RBC conference: AI and modernization fuel growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:54 PM IST", "pub_date_relative": "14m ago"}, {"title": "PAR Technology at Stephens conference: ai push, growth and margin gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:53 PM IST", "pub_date_relative": "14m ago"}, {"title": "Innate Pharma stock tumbles after phase 1 trial data", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:53 PM IST", "pub_date_relative": "15m ago"}, {"title": "Drugs Made in America Acquisition II announces $250 million funding and preliminary Alpha AI Biotech proposal", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:52 PM IST", "pub_date_relative": "15m ago"}, {"title": "MaxCyte at Stephens conference: akron deal broadens cell therapy reach", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:50 PM IST", "pub_date_relative": "18m ago"}, {"title": "Guardian Pharmacy Services at Stephens 2026: growth amid ira pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:49 PM IST", "pub_date_relative": "19m ago"}, {"title": "After board win at Ethan Allen, investor Bergeron has big plans for CEO, returns", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "Hyster-Yale stock plunges on $125M debt offering plan", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:48 PM IST", "pub_date_relative": "20m ago"}, {"title": "Jeffries wins Democratic House speaker race, on track to make history in January", "full_content": "House Minority Leader Hakeem Jeffries won the nod from his caucus to become the next speaker of the House of Representatives.\n\nJeffries, D-N.Y., still needs to be officially elected when the new Congress convenes in January. But he appears to be on a glide path to winning the gavel after Democrats voted 251-11 to nominate him, according to a person familiar with the vote who spoke on condition of anonymity to describe the private meeting.\n\nThe win for Jeffries comes after months of acrimony over whether Democrats would stand by their existing leadership or oust them amid a progressive tide. Democrats trounced Republicans in the midterm elections and are poised to hold at least 257 House seats.\n\nJeffries would make history as the first Black speaker of the House if he is elected in January.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 09:44 PM IST", "pub_date_relative": "23m ago"}, {"title": "I watched Trump, Xi and Putin gather in China. Here are my top takeaways", "full_content": "SHENZHEN, China \u2014 It took a trip to China for me, an American, to see U.S. President Donald Trump in person for the first time.\n\nTrump emerged from a group of black-clad photographers and other personnel surrounding him at a welcome banquet in Shenzhen for the Asia-Pacific Economic Leaders' Meeting held November 17th to 19th.\n\nSeated just a few spots to his left was Russian President Vladimir Putin who picked up a glass of red wine to join a toast led by Chinese President Xi Jinping .\n\n\"At tomorrow's Leaders' Meeting, we will discuss measures to expand mutual opening up, explore pathways to innovation-driven growth, and identify opportunities to expand practical cooperation across various fields, so as to translate more initiatives into tangible results,\" Xi said in Mandarin, according to a CNBC translation.\n\nXi was speaking broadly, but Thursday's agenda includes a bilateral meeting with Trump, and their highly anticipated trilateral meeting with Putin.\n\nBut looking at the mood in the room, it seemed that their trilateral conversation had already started Wednesday night at their long banquet table. Much of what happens at APEC, including bilateral meetings and other exchanges between leaders, takes place away from the media.\n\nBut what struck me was how little sign there was of the tension surrounding Nvidia 's CEO Jensen Huang resignation, a controversy that has gripped markets for the past 10 days.\n\nAhead of Trump's entrance into the banquet hall, Chinese Commerce Minister Wang Wentao shared a friendly moment with U.S. Treasury Secretary Scott Bessent and other members of the American delegation.", "source": "CNBC Finance", "pub_date_str": "18 Nov 2026, 09:44 PM IST", "pub_date_relative": "24m ago"}, {"title": "After 156% surge in a day, this American firm stock rises another 5%. What's driving the biotech share rally?", "full_content": "Shares of US-based biotechnology company Sellas Life Sciences extended their spectacular rally on Wednesday, November 18, rising another 5% after soaring nearly 156% in the previous session.\n\nThe stock has come under investors' radar following a major breakthrough in a late-stage clinical trial of its experimental cancer vaccine, which demonstrated a significant improvement in survival outcomes among patients with an aggressive form of blood cancer.\n\nThe sharp rally came after the company announced positive results from its pivotal Phase 3 REGAL trial evaluating galinpepimut-S (GPS), an investigational immunotherapeutic cancer vaccine designed to treat acute myeloid leukaemia (AML).\n\nThe results marked a significant milestone for the company, with the trial meeting its primary endpoint of overall survival. Sellas said the treatment reduced the risk of death by 41% compared with the best available treatment, with a hazard ratio of 0.59 and a statistically significant p-value of 0.035, as per the company's press release.\n\nThe company said that the 126-patient study showed that patients receiving GPS achieved median overall survival of 24 months, compared with 14.7 months among those receiving the best available treatment.\n\nAcute Myeloid Leukemia (AML) is an aggressive cancer affecting the blood and bone marrow. According to the company, the vaccine works by training the body's immune system to identify and attack residual leukaemia cells carrying the WT1 protein.\n\nThe treatment was also generally well tolerated, with no new safety concerns identified and most treatment-related adverse events being mild to moderate.\n\nThe positive clinical findings have raised expectations around the vaccine's commercial potential and the company's regulatory roadmap.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 09:41 PM IST", "pub_date_relative": "26m ago"}, {"title": "Sahara India refund status: Govt transfers \u20b9221 crore. Has your money arrived? How to check", "full_content": "Sahara India refund status: Millions of investors who had put their savings into Sahara's cooperative societies are still waiting to get their money back. The government has now transferred more than \u20b9 10,037 crore to over 47.15 lakh depositors through the official Sahara refund process , offering a fresh update for those tracking their claims.\n\nAccording to the latest figures available as of November 18, 2026, around 1.51 crore people have applied for refunds. Of these, more than 47.15 lakh investors have received payments directly into their bank accounts.\n\nAround \u20b9 221.45 crore was transferred to eligible depositors in the seven days preceding November 18.\n\nFor investors who have already submitted their claims, the next step is to check whether their applications have been approved, are still being processed or require corrections.\n\nThe latest government figures offer an update on the scale of the refund exercise.\n\nThe government is processing claims through the Central Registrar of Cooperative Societies (CRCS)-Sahara Refund Portal.\n\nClaims are generally scrutinised within 30 days by the respective cooperative societies, while applicants are informed of the decision within 45 days of submitting their applications.\n\nDepositors do not need to visit a Sahara office or approach an agent to track their refund. The government has made the facility available online.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 09:39 PM IST", "pub_date_relative": "28m ago"}, {"title": "Jensen Huang has agreed to appear before Senate banking committee, Chairman Scott says", "full_content": "Former Nvidia CEO Jensen Huang has agreed to appear before the Senate Banking Committee, panel Chair Tim Scott , R-S.C., said on CNBC's \"Squawk Box\" on Wednesday.\n\nCommerce Secretary Howard Lutnick has also agreed to testify, Scott said. The agreements to appear voluntarily come as pressure builds on Capitol Hill to investigate Huang's affair with a suspected Chinese spy, which led to his ouster at the chipmaker he founded.\n\n\"They both have agreed,\" Scott said. \"We will hopefully have this done before Christmas.\"\n\nHuang reached an agreement on Tuesday with the chairmen of three House committees for a closed-door transcribed interview on Dec. 1 jointly before the three panels. Scott had asked Huang to appear publicly in the Senate.\n\nA spokesperson for the banking committee did not immediately respond to questions about when Huang and Lutnick would testify. In initial letters to the pair, Scott requested Huang appear on Dec. 3 and Lutnick appear on Dec. 10.\n\nScott said the appearances will provide the committee with \"more information about what they knew, when they knew it and why they didn't do something about it.\"\n\n\"Nvidia seemed to have fairly lax controls, and I want to know how much of the relationship with Alice [Huang] impacted Nvidia's unwillingness or inability, or frankly, just blindness to Megaspeed's providing access to China of the most advanced chipset,\" Scott said of Jensen Huang's testimony.\n\nThe outgoing banking committee chair also homed in on Lutnick, calling for answers as to why the commerce secretary did not act after being warned about Megaspeed \u2014 the Singaporean company where the alleged Chinese spy, Alice Huang, was an executive. Nvidia sold its chips to Megaspeed, which U.S. investigators suspect of diverting them to China.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 09:38 PM IST", "pub_date_relative": "30m ago"}, {"title": "Worried investors are paying a premium for these stocks \u2014 some with as much as 49% upside, analysts say", "full_content": "Defensive sectors have beaten the S&P 500 by a wide margin in recent months, even though they are priced much higher relative to earnings estimates than the index.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 09:34 PM IST", "pub_date_relative": "34m ago"}, {"title": "Stock Market Today: Dow Falls as Nvidia Earnings Fail to Soothe Investors' Nerves - WSJ", "full_content": "Stock Market Today: Dow Falls as Nvidia Earnings Fail to Soothe Investors' Nerves WSJ Four takeaways from Nvidia\u2019s first earnings report after Jensen Huang scandal CNN Strong Nvidia earnings are being clouded by China risks and succession questions Business Insider CoreWeave, Iren, Nebius shares sink following Nvidia earnings CNBC Nvidia Delivers Reassuring Results, Outlook. But Wall Street Split. Investor's Business Daily", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 09:30 PM IST", "pub_date_relative": "38m ago"}, {"title": "Oracle\u2019s stock is ridiculously cheap even under the most gloomy scenarios, analyst says", "full_content": "Even if you assume Oracle\u2019s AI data-center business disappears while its debt remains, Oracle shares are still trading lower than they should, according to new analysis from Bernstein.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 09:27 PM IST", "pub_date_relative": "41m ago"}, {"title": "Wall Street prepares for Anthropic IPO frenzy, despite broader AI stock slump - Reuters", "full_content": "Wall Street prepares for Anthropic IPO frenzy, despite broader AI stock slump Reuters Opinion | I Spent a Year Talking to Anthropic Employees. Here\u2019s What They Believe. The New York Times Anthropic\u2019s Low-Profile CFO Guides Firm Through \u2018Cone of Uncertainty\u2019 Bloomberg.com The Seven Anthropic Founders Who Are About to Become Multibillionaires WSJ Anthropic IPO, Nvidia shake-up raise questions about AI\u2019s future FOX 32 Chicago", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 09:22 PM IST", "pub_date_relative": "46m ago"}, {"title": "Stocks making the biggest moves Wednesday: Nvidia, Take-Two Interactive, Lowe's & more", "full_content": "Nvidia wavered after the embattled chipmaker reported quarterly figures that beat expectations and issued strong guidance.\n\nTake-Two Interactive also got a boost ahead of the release of \"Grand Theft Auto VI\", while Lowe's shares pulled back following the company posting third-quarter results.\n\nFollow along as CNBC covers the biggest stock market moves of the day.\n\nShares of Millicom International Cellular are up nearly 1% after JPMorgan upgraded the digital telecommunications and media company to overweight from neutral on Wednesday, maintaining a $105 price target, implying a 28% gain above Tuesday\u2019s close of $82.\n\nMillicom International Cellular - stock price for one year JPMorgan analyst Marcelo Santos sees a buying opportunity on the stock's recent weakness.\n\n\"Part of the weakness may have been due to technical factors, such as Tigo's removal from MSCI Sweden, and part due to the acquisition of Entel Peru, which we do not believe destroys value,\" Santos said.\n\nThe upgrade comes as Millicom expands in Latin America. The company agreed last week to buy Entel's Peru business for $1.71 billion, adding to its regional footprint.\n\nNvidia's post-earnings gains were short-lived, with the stock last down 0.4%. If the stock falls again, it would mark its fifth consecutive daily pullback.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 09:19 PM IST", "pub_date_relative": "48m ago"}, {"title": "Nvidia sinks after earnings, dragging down neoclouds", "full_content": "Nvidia shares sank around 2% Wednesday after the company issued its first earnings report since the departure of former CEO Jensen Huang .\n\nNeoclouds bounced initially following the report before trading lower Wednesday. CoreWeave sank over 6%, Iren more than 4% and Nebius declined around 1%.\n\nNvidia's third-quarter revenue came in at $115.84 billion, more than $6 billion above analysts' expectations of $109.10 billion, while fourth-quarter guidance of $130 billion topped the $125.1 billion consensus, according to LSEG.\n\nThe semiconductor giant continues to navigate the fallout from Huang's resignation last week. Shortly before the results, Huang made his first public statement since resigning last week, saying that he was open to returning to the company, after an outpouring of support from prominent tech figures .\n\nNeocloud stocks today But Harvey Jones, the new and first-ever chair of Nvidia's board, said on the earnings call that the board does not intend to reinstate him as CEO.\n\n\u2033[Hyperscalers] are the ones that are right now feverishly looking for more focus in terms of the compute that we have available,\" interim CEO Colette Kress told Jim Cramer on CNBC's \"Mad Money.\"\n\n\"This concept that anything is changing in terms of any of our types of customers \u2014 that is just not true. They are all continuing to be with us, and we have a very deep breath of different customers.\"\n\nThe U.S. Commerce Department announced a legal change on Monday to try and stem China's access to the most advanced Nvidia chips \u2014 which are already under export controls effectively preventing their import into the country \u2014 by restricting Chinese companies' ability to access compute remotely in overseas data centers.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 09:18 PM IST", "pub_date_relative": "50m ago"}, {"title": "Market Trading Guide: Deepak Fertilisers among 3 stock recommendations for Thursday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Market Trading Guide: Deepak Fertilisers among 3 stock recommendations for Thursday Written by Kumar Gaurav , ETMarkets.com | Nov 18, 2026, 09:19:14 PM IST 1 / 4 Stock Ideas Benchmark indices witnessed profit booking and closed in negative amid weak global cues, reversing some of the recent gains. However, easing Brent crude oil prices, which remained below the $95 mark, and appreciation in the rupee provided some support to investor sentiment, limiting the overall pressure. The Nifty 50 slipped 159 points, or 0.63%, to settle at 25,228, while the BSE Sensex declined 500 points, or 0.61%, to close at 82,032.\n\nVijaya Diagnostic Centre has witnessed a strong breakout from its sideways consolidation range, along with an Inverted Head and Shoulders pattern breakout on the daily chart. The move is supported by increasing volumes, indicating fresh buying interest and participation in the stock. It is currently trading above its 20, 50 and 100-Day EMAs, reflecting strength in the ongoing trend.\n\nThe RSI is at 63.73, suggesting healthy momentum and supporting the bullish price action. The stock has been consolidating for a while, and the recent breakout indicates a possible shift towards a stronger upward move.\n\nIf it sustains above the breakout zone, the stock may continue its momentum towards 1690. The stop-loss is placed at 1457 to manage downside risk.\n\nEureka Forbes has given a breakout above its sideways trading range on the daily chart, indicating a pickup in buying interest. The stock is also forming a higher highs and higher lows structure, suggesting that the trend is gradually turning stronger.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 09:14 PM IST", "pub_date_relative": "53m ago"}, {"title": "Nvidia\u2019s booming demand is \u2018hard to ignore,\u2019 but these four questions loom over the stock", "full_content": "Nvidia investors face uncertainty around CEO succession, the AI ecosystem, export controls and China.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 09:12 PM IST", "pub_date_relative": "56m ago"}, {"title": "Lowe's posts strong online sales, raises outlook despite slow housing market", "full_content": "Lowe's on Wednesday posted strong quarterly results and raised its full-year outlook as the company said it saw strength among professional shoppers.\n\nThe company said comparable sales grew 1.8% for the fiscal third quarter, driven by a 17.4% increase in online sales and \"solid\" performance in pro and home services sales. Net sales rose to $22.76 billion.\n\nBecause of the strength, Lowe's now said it expects full-year sales of roughly $92.5 billion, up from a previous projection of $92 billion. It also expects comparable sales to be up 0.5%, compared with previous guidance of flat.\n\nCEO Marvin Ellison told CNBC that the company is focused on growing despite economic headwinds and a sluggish housing market. He said Lowe's posted its sixth straight quarterly comparable sales increase and saw particular strength in appliances, which saw its largest revenue growth in five years.\n\n\"We believe irrespective of the macro environment we're in, we're going to take share because there's a lot of share out there that we can go and get, and we're going to be aggressive to go and get that share,\" Ellison told CNBC.\n\nLowe's also reported a pretax benefit of approximately $250 million from tariff refunds during the quarter, which contributed a 34-cent boost to earnings per share. Ellison said the company plans to use those funds to enhance the customer experience and bring value to shoppers.\n\nHe added that do-it-yourself customers and pro shoppers are not investing in major renovation projects but are instead spending on repair and maintenance projects.\n\n\"We are giving those pros what they need,\" he said. \"We're able to improve our fulfillment capabilities and our pro loyalty program.\"", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 09:09 PM IST", "pub_date_relative": "59m ago"}, {"title": "\u2018I felt so seen\u2019: Why families across America are laughing \u2014 and crying \u2014 over SNL\u2019s \u2018Sister\u2019 sketch", "full_content": "The late-night comedy sketch does the impossible by making female caregivers feel seen.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 09:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "NEFT transfer limit: How much money can you transfer in a day? Check RBI rules, charges and settlement time", "full_content": "The Reserve Bank of India (RBI) has not prescribed any upper limit on the amount that individuals can transfer through the National Electronic Funds Transfer (NEFT) system. However, banks are allowed to impose their own transaction limits based on their risk assessment, subject to approval by their respective boards.\n\nFor individuals transferring money from one bank account to another, there is no uniform maximum limit prescribed by the central bank. However, the rules are different for customers who do not have a bank account and want to transfer money by depositing cash at a bank branch.\n\nAccording to the RBI's NEFT Frequently Asked Questions (FAQs), updated on September 2, 2024, cash-based remittances through NEFT are restricted to \u20b9 50,000 per transaction.\n\nThe RBI has clarified that it does not impose any maximum limit on funds transferred through NEFT.\n\n\"No, there is no limit imposed by the RBI for funds transfer through NEFT system. However, a member bank may place amount limits based on its own risk perception with the approval of its Board,\" the central bank states in its FAQs.\n\nThis means customers can transfer amounts exceeding \u20b9 50,000 through NEFT , subject to the transaction limits prescribed by their respective banks.\n\nHowever, individuals without bank accounts can also use NEFT by depositing cash at an NEFT-enabled bank branch. Such customers must provide additional information, including their complete address and telephone number.\n\nThe RBI has capped these cash-based transfers at \u20b9 50,000 per transaction.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 08:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dalmia Bharat to consider share buyback at Nov 23 board meeting", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Dalmia Bharat to consider share buyback at Nov 23 board meeting Dalmia Bharat Share Price The Ramco Cements Share Price India Cements Share Price Orient Cement Share Price KCP Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Dalmia Bharat to consider share buyback at Nov 23 board meeting SECTIONS Dalmia Bharat to consider share buyback at Nov 23 board meeting PTI Last Updated: Nov 18, 2026, 08:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Dalmia Bharat, India's fourth-largest cement manufacturer, will hold a board meeting on November 23. The meeting will focus on a proposal for a buyback of fully paid-up equity shares. Specific details regarding the buyback size, price, and number of shares have not been disclosed yet. The company also plans to expand its cement capacity to 75 million tonnes per annum by FY28.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 08:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Target reports strongest quarterly sales gain in five years heading into the holiday shopping season", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Target reports strongest quarterly sales gain in five years heading into the holiday shopping season Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Target reports strongest quarterly sales gain in five years heading into the holiday shopping season SECTIONS Target reports strongest quarterly sales gain in five years heading into the holiday shopping season By AP Last Updated: Nov 18, 2026, 08:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Target reported a 7.1% increase in net sales for the third quarter, reaching $27.07 billion. The growth was attributed to a revitalized product lineup, expanded same-day deliveries, and price cuts. CEO Michael Fiddelke indicated that the sales momentum was observed across various income groups. The company aims to enhance clothing and home goods offerings while working on women's apparel and footwear.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Nov 2026, 08:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018GTA VI\u2019 publisher Take-Two jumps as gamers relish blockbuster release", "full_content": "As \"Grand Theft Auto VI\" begins its global rollout on Wednesday, gamers and critics are applauding the blockbuster release. And so is Wall Street.\n\nShares of Take-Two Interactive , the owner of the studio behind GTA VI, jumped more than 6% in premarket trading, with investors betting that glowing reviews from critics and players will propel sales and boost the company's bookings and revenue this year.\n\nDemand has been feverish - with players doing everything from taking several days of paid time off to signing \"contracts\" with their partners to get uninterrupted game time.\n\nHere are more details on the expected revenue impact for Take-Two:\n\nWells Fargo expects GTA VI to sell about 65 million units in its current fiscal year that runs through March, up from its prior forecast of 35 million units. The brokerage's estimate is also boosted by expectations for a potential PC release of the game early in 2027\n\nIt lifted its annual bookings forecast by 19% to $9.76 billion, versus a consensus estimate of $8 billion from LSEG data, and Take-Two's own projection of $8 billion to $8.20 billion. Brokerage Oppenheimer estimates about $1.85 billion in gross revenue in the first three days, compared with the $1 billion recorded by predecessor GTA V, released more than 13 years ago.\n\nA Sensor Tower tracker estimates roughly 17.1 million units have been sold as of early Wednesday, far exceeding pre-order volumes of all the biggest game releases in recent history", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 08:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic IPO: AI lab considers increasing the offering as investor demand surges", "full_content": "Anthropic is considering upsizing its IPO, people familiar with the details told CNBC, as the artificial intelligence lab weighs setting the price well above $80.\n\nThe company closed its order books and locked in total demand on Tuesday, setting the stage for the Claude creator's eagerly awaited Nasdaq listing. Institutional demand for the offering is around $400 billion, while retail demand is approaching $100 billion, according to the people, who asked not to be named because they were not authorized to speak publicly.\n\nThe orders are indications of interest and are not binding. All of the details are subject to change, and Anthropic will make final decisions on Wednesday afternoon, the people said. Anthropic is expected to set its final IPO price after market close on Wednesday.\n\nDemand for the offering is higher than it was for Elon Musk's SpaceX , even though the rocket maker had a bigger market offering. SpaceX debuted on the Nasdaq in June in by far the biggest IPO on record, ultimately raising $85.7 billion.\n\nThe AI lab said last week that it would offer 825 million shares in the IPO at a price range between $70 and $78 per share, which would net up to $64.35 billion at the high end of that range.\n\nAnthropic's listing is a major test for the AI industry, which has experienced a set of recent shocks, including a dramatic backlash that was felt at the polls in the midterm elections and last week's ouster of Nvidia CEO Jensen Huang . The market was already jittery on concerns that rising interest rates will make debt unaffordable for many data center developers and neoclouds.\n\nTech's biggest companies have significant exposure to Anthropic, whether as an investor, partner or customer. Amazon and Google both own stakes valued at over $100 billion, and a group of tech companies, including Google, Microsoft , Nvidia and Advanced Micro Devices agreed to collectively invest $26 billion in the IPO.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 08:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "India\u2019s youngest demat account holder is 6 days old: SEBI rules for opening accounts for minors", "full_content": "Parents can open a demat account in the name of a newborn or minor child to hold investments for their future. However, the Securities and Exchange Board of India ( SEBI ) has prescribed specific rules governing who can operate these accounts, the role of guardians and the transactions permitted in a minor's name.\n\nA six-day-old girl from New Delhi recently became India's youngest known demat account holder after her family completed the necessary documentation within a week of her birth, according to a CNBC-TV18 report.\n\nThe development has brought attention to the rules governing demat accounts for minors and the steps parents must follow before opening one.\n\nSEBI permits demat accounts to be opened in the name of minors, including newborns. However, such accounts must be operated by a guardian until the child turns 18.\n\nUnder SEBI's guidelines, the father can act as the guardian. In his absence, the mother can take up the responsibility. If both parents are absent, a guardian appointed by a court can operate the account.\n\nA minor cannot be a joint holder in another demat account. The minor must be the sole account holder, with the guardian managing the account on their behalf.\n\nParents need to complete the prescribed identity verification and documentation process before opening a demat account for their child.\n\nOpening a demat account for a minor does not allow parents to trade shares freely on the child's behalf.", "source": "LiveMint Money", "pub_date_str": "18 Nov 2026, 08:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "The key S&P 500 level Wall Street is watching", "full_content": "The benchmark ended Tuesday's session at 7,340.53, just under its 200-day average of 7,346.64. The next move may be lower.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 08:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fed\u2019s Waller says central bank may need to \u2018shock people\u2019 with half-point rate hike", "full_content": "Federal Reserve Governor Christopher Waller on Wednesday called for aggressive action against inflation , saying the central bank needs to \"shock people\" as prices continue to rise more than he expected.\n\nIn the near term, the policymaker told CNBC in a live interview that a half percentage point increase in the Fed's benchmark rate is probably necessary at the Dec. 8-9 meeting of the Federal Open Market Committee.\n\nHe said the central bank needs to reverse the three quarter-point reductions from last year and may need to do more.\n\n\"I'm very, very concerned about inflation. It's kind of headed in the wrong direction, and it's spreading out,\" Waller told CNBC's Steve Liesman during a \" Squawk Box \" interview. \"If you really want to get it down, you've got to start taking more aggressive actions.\"\n\nFutures prices are fully pricing in a quarter percentage point hike at the FOMC's December meeting. They also are anticipating another move in January, followed by at least one additional increase before the end of 2027, according to the CME Group's FedWatch gauge.\n\nWaller said the Fed wouldn't necessarily have to approve a half-point hike in December if it raised rates by a quarter point and signaled another move coming in January. However, Fed Chairman Kevin Warsh has been against that kind of forward guidance on grounds that it ties policymakers' hands.\n\n\"If you're not going to signal this very clearly to markets, you're going in January, my view is then you have to go 50 [basis points] in December to put it in place and get it done,\" he said.\n\nRecent statements from other central bankers indicate a range of opinions , though most agree that more policy tightening is needed to bring down inflation.", "source": "CNBC Finance", "pub_date_str": "18 Nov 2026, 08:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Two new housing reports point to bleak winter ahead, with record low sales", "full_content": "Two new reports on the housing market show activity slowing even more, after a September spike in mortgage rates sent it into a deep freeze.\n\nPending home sales in October dropped 4.7% month-over-month and were down 16.7% from October of last year, according to the National Association of Realtors. This is the lowest level in the index's 25-year history.\n\nAnalysts had been looking for a much smaller decline, likely because mortgage rates pulled back slightly in October, only to rise sharply again last week. The average rate on the 30-year fixed started October at 7.54% according to Mortgage News Daily and ended the month at 7.27%.\n\nThe pending count is based on signed contracts \u2014 people out shopping and signing deals during the month. It is therefore an indicator of future closed sales.\n\n\"Two consecutive months of record-low pending contracts point to very sluggish fourth-quarter home sales closings, and annual existing-home sales could be the lowest since the mid-1990s,\" said Lawrence Yun, NAR's chief economist in a release.\n\nRegionally, sales were down across the nation with the sharpest drops in the South, which is usually busiest for sales and the West which is most expensive.\n\nAnother report released Wednesday showed gains in home construction in October but raised a red flag going forward. Single-family housing starts rose 4% from September, according to the U.S. Census, but were down 3.2% year over year. Building permits, an indicator of future construction, dropped 8.7% for the month and were down 12.9% from October 2025. That is the lowest level for permits since May 2020, the start of the Covid-19 pandemic.\n\n\"Builders are dealing with a litany of obstacles to selling homes, whether it's rising costs of land, labor, and materials, high financing costs, or weak buyer demand,\" wrote Joel Berner, senior economist at Realtor.com.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 08:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "US tech stocks mixed after Nvidia results", "full_content": "Chip group raises forecast and new chief says \u2018it\u2019s business as usual\u2019 after revelations of Huang\u2019s affairs triggered sell-off", "source": "FT Markets", "pub_date_str": "18 Nov 2026, 08:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "India on track to hit $1 trillion exports target in FY27: Commerce Secretary", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India on track to hit $1 trillion exports target in FY27: Commerce Secretary The Economic Times daily newspaper is available online now. Read Today's Paper India on track to hit $1 trillion exports target in FY27: Commerce Secretary SECTIONS India on track to hit $1 trillion exports target in FY27: Commerce Secretary ET Online Last Updated: Nov 18, 2026, 08:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's exports increased by 16.6% in the first half of this fiscal year. The country aims to reach $1 trillion in exports by 2026-27. Commerce Secretary Rajesh Agrawal stated that India is on track to meet this goal. Despite global trade uncertainties, India continues to be viewed positively as a trusted trading partner. India achieved record exports of $863 billion in the previous fiscal year.\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nHow India\u2019s INR22.5 lakh crore gold loan boom is hiding a big hole\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "18 Nov 2026, 08:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s Kress faces a divided workforce as some employees push for Huang\u2019s return", "full_content": "The day before Colette Kress led her first earnings call as Nvidia's interim CEO, she did not want to talk about her predecessor, Jensen Huang .\n\n\"This is a new era for Nvidia,\" she told employees in an internal meeting on Monday, according to a person present, who spoke on the condition of anonymity. When someone brought up Huang, Kress quickly changed the subject, according to the person.\n\nOn Wednesday, Kress is due to address the whole company at the first Nvidia all-hands meeting since the public chaos over Huang's affair with an alleged Chinese spy and other reported relationships. And while Kress will be tasked with filling the leadership vacuum created by Huang's departure, she is also expected to tamp down public calls to bring him back.\n\nHuang himself weighed in with his first public statement Tuesday saying he would be \"honored\" to return to Nvidia.\n\nThe interim CEO, who has served as the company's CFO since 2013, must steady employees and convince customers and investors that Nvidia can execute on its ambitious targets without the man who made them. For those at the top, that has meant making clear that the company does not plan to bring Huang back.\n\n\"The board has determined that they will not reinstate Jensen,\" Kress said in an interview with CNBC's Jim Cramer on Tuesday. \"We want to grow in terms of everything that we need to do with our employees, our customers, our shareholders, and that is where we are going to focus moving forward.\"\n\nHarvey Jones, the newly appointed chair of Nvidia's board, echoed the sentiment on Tuesday's earnings call. \"The Nvidia board unanimously accepted his resignation and does not intend to reinstate Jensen as CEO,\" he said in opening remarks.\n\nKress stressed on the earnings call that the company was focused on the workers who remain, who she said are \"committed to doing their life's work at Nvidia.\" The company also reported better-than-expected earnings and seemed to calm investors' nerves , at least for the moment.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 08:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cal-Maine to cull 1.8 million birds, halt production at Florida facility after bird flu detected", "full_content": "Cal-Maine Foods said on Wednesday \u2060it would cull about 1.8 million \u200bbirds after \u200bavian influenza \u200bwas detected at one of its Florida facilities, forcing the \u2060US \u200cegg producer to temporarily \u2060halt production at the site.\n\nThe company said it has suspended production \u200cat the facility while following U.S. Department of Agriculture \u200bprotocols and will cull 1.4 million laying hens and 360,000 pullets, representing 2.7% of \u2060its flock.\n\nThe highly pathogenic avian \u200cinfluenza, commonly called bird flu, \u200chas led to the culling of hundreds of millions \u2060of birds over the past few years, \u2060disrupting food supplies \u2060and driving up prices, though human infections remain rare.\n\nAccording to \u200bthe \u200cU.S. Centers for Disease Control and Prevention (CDC), \"The human health risk to the general US public from HPAI \u200bviruses is considered low.\"", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 08:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "Assetz IPO gets SEBI nod; Bengaluru realty developer reportedly plans to raise \u20b91,200 crore", "full_content": "Market regulator SEBI has cleared the decks for Bengaluru-based real estate developer Assetz Ltd to proceed with its IPO plans, months after the company confidentially filed its draft offer documents.\n\nThe market regulator, on November 17, issued its observations on the company's draft red herring prospectus (DRHP), allowing it to proceed with the IPO within the next 18 months.\n\nSEBI's observations are a key regulatory requirement for companies seeking to launch public issues, including initial public offerings (IPOs). As part of the process, the regulator reviews the draft offer document, such as a Draft Red Herring Prospectus (DRHP), and issues its observations based on the review.\n\nThese observations may require the issuer to make certain changes or provide additional disclosures before proceeding with the public issue.\n\nThe latest development comes after Assetz filed its preliminary IPO papers with SEBI in August through the confidential filing route.\n\nA confidential filing allows companies to submit draft offer documents to the regulator for review without making them immediately available to the public, helping protect sensitive information, including financial details and business strategies, during the initial stages of the IPO process.\n\nThe company is reportedly looking to raise \u20b9 1,200 crore through its IPO, according to media reports. Mint has not independently verified the proposed fundraising size.\n\nThe regulatory clearance also comes at a time when sentiment in the Indian stock market has improved amid easing inflationary pressures following a sharp decline in crude oil prices.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 08:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia's Colette Kress tells Cramer: Employees and customers are not going anywhere", "full_content": "Nvidia's customers and employees remain committed to the company despite last week's abrupt departure of longtime leader Jensen Huang . That's the message interim CEO Colette Kress conveyed exclusively to CNBC's Jim Cramer shortly after the AI chip giant delivered a quarterly beat and strong guidance.\n\n\"[Hyperscalers] are the ones that are right now feverishly looking for more focus in terms of the compute that we have available,\" Kress said on \" Mad Money .\" \"This concept that anything is changing in terms of any of our types of customers \u2014 that is just not true. They are all continuing to be with us, and we have a very deep breath of different customers.\"\n\nKress' comments came after Nvidia reported better-than-expected quarterly earnings and revenue and bumped up its fiscal 2028 revenue growth estimate to 75% from the previous 70%. It was the first earnings report since Huang's resignation as CEO amid a widening affair scandal. Shares rose nearly 4% in after-hours trading as the results helped ease concerns about the chipmaker's outlook following the leadership shake-up.\n\nSome on Wall Street have wondered whether Huang's departure would prompt certain Nvidia customers to lean harder into their in-house designed chips and/or competitors such as Advanced Micro Devices .\n\nDuring the \"Mad Money\" interview Tuesday evening, Kress emphasized that major customers have continued expressing interest in the company's products. \"I have seen already with many of these [customers] contacting me and saying, 'Great to see everything intact. Great to see that there's more supply. I need more demand.'\"\n\nCustomer demand, however, wasn't the only issue facing Nvidia. Huang's departure has also raised questions about whether the chipmaker can retain the engineers and other employees who helped build its dominance in artificial intelligence.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "This software stock promises plenty more growth ahead. Buy it now, JPMorgan says", "full_content": "Manhattan Associates should see more upside as it converts more of its installed base to cloud and becomes more competitive with other SaaS firms, per JPMorgan.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fed\u2019s Waller says interest-rate hikes may be needed to \u2018shock\u2019 inflation out of the system", "full_content": "The central bank might need to hike interest rates by a full percentage point or more to cool down inflation, Federal Reserve governor Christopher Waller said Wednesday.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Target shares rise 5% as retailer posts best sales growth in five years, hikes guidance", "full_content": "Target on Wednesday reported its best sales growth in more than five years and beat Wall Street's revenue expectations, the latest signs of its turnaround strategy taking hold.\n\nThe retailer said its net sales grew 7.1% during the fiscal third quarter. Comparable sales rose 5.6%, compared with StreetAccount estimates of up 3.8%. That growth was boosted by a 5% increase in comparable traffic, Target added.\n\n\"[It's] a healthy sign that guests are responding to our changes and choosing Target more often,\" CEO Michael Fiddelke told reporters.\n\nDigital comparable sales jumped nearly 10% during the quarter.\n\nEncouraged by the growth, Target raised its full-year guidance, upping its net sales growth guidance by 1 percentage point to around 6%. It's also expecting full-year operating income margin rate to be around 6.2%, which includes roughly 1.1 percentage points of benefit from tariff refunds.\n\nThe company also said it's now projecting full-year earnings per share to be in a range of $10.65 to $11.40, compared with prior guidance of between $9.90 and $10.90.\n\n\"The changes we've made across our assortment and guest experience are adding up,\" Fiddelke told reporters. \"While we're encouraged by the progress, we know there's more work ahead to sustain this momentum and deliver consistent growth over time.\"\n\nTarget shares climbed more than 5% in morning trading Wednesday.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 10:04 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dow slides 600 points, Nasdaq seesaws as Nvidia earnings bounce fizzles: Live updates", "full_content": "The Dow Jones Industrial Average fell on Wednesday as Nvidia shares lost momentum following the chipmaker's better-than-expected earnings report.\n\nThe 30-stock index shed 607 points, or 1.2%. The S&P 500 traded down 0.5%, while the Nasdaq Composite traded around the flatline.\n\nShares of Nvidia were more than 2% lower, reversing course from earlier gains after the company's profit and revenue in the third quarter beat analysts' estimates. The company also lifted its revenue guidance for the fiscal year ending January 2028, calling for 75% growth year over year.\n\nThe report marked the chipmaker's first since Jensen Huang resigned last week as CEO, a move that came days after he admitted to an affair with a businesswoman alleged to be a Chinese spy.\n\n\"This wasn't a issue associated with defective chips or some breakdown in terms of their products. This was a personnel change. It's going to be an adjustment, but it's one that the market will work its way through, just as it always has in the past,\" said Eric Parnell, chief market strategist at Great Valley Advisor Group.\n\nWhen it comes to the broader artificial intelligence trade, however, Parnell noted that the underlying fundamental challenges, including those related to capital expenditures and debt financing, haven't changed \u2014 and might not anytime soon.\n\n\"It doesn't take much of a slowdown in earnings growth in the environment that we're in with the AI buildout and the AI spend to take these types of stocks down pretty quickly,\" he said. \"It's this type of volatility that I suspect we're not only going to continue to see but it's likely to increase as we go through 2027 and into 2028.\"\n\nThe Dow was also weighed down by losses in healthcare stocks like UnitedHealth as well as energy name Chevron and industrial giant Caterpillar . UnitedHealth lost 4%, while Chevron and Caterpillar declined around 3% and nearly 3%, respectively.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 10:03 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dealbook Summit 2026 live updates: Altman says 'hard to imagine the AI industry without Jensen'", "full_content": "SpaceX founder and CEO Elon Musk is scheduled to appear at the New York Times DealBook Summit on Wednesday.\n\nAndrew Ross Sorkin , founder and editor of DealBook and co-anchor of CNBC's \"Squawk Box,\" is sitting down with Musk and other prominent business, economic and political leaders to discuss a wide range of newsmaking issues.\n\nOnce again artificial intelligence and the impact it is having on our world is top of mind. The conference comes as OpenAI rival Anthropic is about to make its public debut on Thursday, and it follows a series of widespread tech outages that have grounded airplanes, snarled email, and stymied banking transactions, among other disruptions.\n\nWhile the various IT issues have been a dramatic reminder of society's dependency on these services, the Anthropic IPO raises a number of questions about the valuations of AI companies, which have been under pressure. Voters were largely seen as having rebuked AI in the midterm elections in November, as a number of Democrats who have advocated for the slowdown of the AI data center buildout were ushered into power.\n\nPublic mistrust of tech billionaires and AI may have been stoked further by revelations that Nvidia CEO Jensen Huang was having an affair with Alice Huang, who is alleged to have had contact with Chinese intelligence. The Nvidia co-founder resigned last week, but has said that he will cooperate with the board's investigation and would be willing to return to the company if requested.\n\nOther key guests include Anduril Industries founder Palmer Luckey, Robinhood CEO Vlad Tenev, New York City Mayor Zohran Mamdani and Microsoft CEO Satya Nadella\n\nThe DealBook summit is taking a quick break ahead of an interview with Skydance CEO David Ellison.\n\nEarlier Wednesday, Christine Lagarde had declined to specify what her plans would be when she steps down as European Central Bank president in February.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 10:01 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dow slides 600 points, Nasdaq seesaws as Nvidia earnings bounce fizzles: Live updates - CNBC", "full_content": "Dow slides 600 points, Nasdaq seesaws as Nvidia earnings bounce fizzles: Live updates CNBC Tech stocks rise as investors shift focus to Anthropic IPO: AlphaCheck Yahoo Finance Wall Street wobbles as Nvidia and other AI stocks keep swinging sharply AP News Stocks Fall in Countdown to Nvidia\u2019s Earnings Test: Markets Wrap Bloomberg.com The AI Rally Needed a Win. Nvidia Earnings Weren\u2019t It. Barron's", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 09:56 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Drugs Made in America Acquisition II announces $250 million funding and preliminary Alpha AI Biotech proposal", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Nov 2026, 09:52 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "I watched Trump, Xi and Putin gather in China. Here are my top takeaways", "full_content": "SHENZHEN, China \u2014 It took a trip to China for me, an American, to see U.S. President Donald Trump in person for the first time.\n\nTrump emerged from a group of black-clad photographers and other personnel surrounding him at a welcome banquet in Shenzhen for the Asia-Pacific Economic Leaders' Meeting held November 17th to 19th.\n\nSeated just a few spots to his left was Russian President Vladimir Putin who picked up a glass of red wine to join a toast led by Chinese President Xi Jinping .\n\n\"At tomorrow's Leaders' Meeting, we will discuss measures to expand mutual opening up, explore pathways to innovation-driven growth, and identify opportunities to expand practical cooperation across various fields, so as to translate more initiatives into tangible results,\" Xi said in Mandarin, according to a CNBC translation.\n\nXi was speaking broadly, but Thursday's agenda includes a bilateral meeting with Trump, and their highly anticipated trilateral meeting with Putin.\n\nBut looking at the mood in the room, it seemed that their trilateral conversation had already started Wednesday night at their long banquet table. Much of what happens at APEC, including bilateral meetings and other exchanges between leaders, takes place away from the media.\n\nBut what struck me was how little sign there was of the tension surrounding Nvidia 's CEO Jensen Huang resignation, a controversy that has gripped markets for the past 10 days.\n\nAhead of Trump's entrance into the banquet hall, Chinese Commerce Minister Wang Wentao shared a friendly moment with U.S. Treasury Secretary Scott Bessent and other members of the American delegation.", "source": "CNBC Finance", "pub_date_str": "18 Nov 2026, 09:44 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "After 156% surge in a day, this American firm stock rises another 5%. What's driving the biotech share rally?", "full_content": "Shares of US-based biotechnology company Sellas Life Sciences extended their spectacular rally on Wednesday, November 18, rising another 5% after soaring nearly 156% in the previous session.\n\nThe stock has come under investors' radar following a major breakthrough in a late-stage clinical trial of its experimental cancer vaccine, which demonstrated a significant improvement in survival outcomes among patients with an aggressive form of blood cancer.\n\nThe sharp rally came after the company announced positive results from its pivotal Phase 3 REGAL trial evaluating galinpepimut-S (GPS), an investigational immunotherapeutic cancer vaccine designed to treat acute myeloid leukaemia (AML).\n\nThe results marked a significant milestone for the company, with the trial meeting its primary endpoint of overall survival. Sellas said the treatment reduced the risk of death by 41% compared with the best available treatment, with a hazard ratio of 0.59 and a statistically significant p-value of 0.035, as per the company's press release.\n\nThe company said that the 126-patient study showed that patients receiving GPS achieved median overall survival of 24 months, compared with 14.7 months among those receiving the best available treatment.\n\nAcute Myeloid Leukemia (AML) is an aggressive cancer affecting the blood and bone marrow. According to the company, the vaccine works by training the body's immune system to identify and attack residual leukaemia cells carrying the WT1 protein.\n\nThe treatment was also generally well tolerated, with no new safety concerns identified and most treatment-related adverse events being mild to moderate.\n\nThe positive clinical findings have raised expectations around the vaccine's commercial potential and the company's regulatory roadmap.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 09:41 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Worried investors are paying a premium for these stocks \u2014 some with as much as 49% upside, analysts say", "full_content": "Defensive sectors have beaten the S&P 500 by a wide margin in recent months, even though they are priced much higher relative to earnings estimates than the index.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 09:34 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Dow Falls as Nvidia Earnings Fail to Soothe Investors' Nerves - WSJ", "full_content": "Stock Market Today: Dow Falls as Nvidia Earnings Fail to Soothe Investors' Nerves WSJ Four takeaways from Nvidia\u2019s first earnings report after Jensen Huang scandal CNN Strong Nvidia earnings are being clouded by China risks and succession questions Business Insider CoreWeave, Iren, Nebius shares sink following Nvidia earnings CNBC Nvidia Delivers Reassuring Results, Outlook. But Wall Street Split. Investor's Business Daily", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 09:30 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street prepares for Anthropic IPO frenzy, despite broader AI stock slump - Reuters", "full_content": "Wall Street prepares for Anthropic IPO frenzy, despite broader AI stock slump Reuters Opinion | I Spent a Year Talking to Anthropic Employees. Here\u2019s What They Believe. The New York Times Anthropic\u2019s Low-Profile CFO Guides Firm Through \u2018Cone of Uncertainty\u2019 Bloomberg.com The Seven Anthropic Founders Who Are About to Become Multibillionaires WSJ Anthropic IPO, Nvidia shake-up raise questions about AI\u2019s future FOX 32 Chicago", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 09:22 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks making the biggest moves Wednesday: Nvidia, Take-Two Interactive, Lowe's & more", "full_content": "Nvidia wavered after the embattled chipmaker reported quarterly figures that beat expectations and issued strong guidance.\n\nTake-Two Interactive also got a boost ahead of the release of \"Grand Theft Auto VI\", while Lowe's shares pulled back following the company posting third-quarter results.\n\nFollow along as CNBC covers the biggest stock market moves of the day.\n\nShares of Millicom International Cellular are up nearly 1% after JPMorgan upgraded the digital telecommunications and media company to overweight from neutral on Wednesday, maintaining a $105 price target, implying a 28% gain above Tuesday\u2019s close of $82.\n\nMillicom International Cellular - stock price for one year JPMorgan analyst Marcelo Santos sees a buying opportunity on the stock's recent weakness.\n\n\"Part of the weakness may have been due to technical factors, such as Tigo's removal from MSCI Sweden, and part due to the acquisition of Entel Peru, which we do not believe destroys value,\" Santos said.\n\nThe upgrade comes as Millicom expands in Latin America. The company agreed last week to buy Entel's Peru business for $1.71 billion, adding to its regional footprint.\n\nNvidia's post-earnings gains were short-lived, with the stock last down 0.4%. If the stock falls again, it would mark its fifth consecutive daily pullback.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 09:19 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia sinks after earnings, dragging down neoclouds", "full_content": "Nvidia shares sank around 2% Wednesday after the company issued its first earnings report since the departure of former CEO Jensen Huang .\n\nNeoclouds bounced initially following the report before trading lower Wednesday. CoreWeave sank over 6%, Iren more than 4% and Nebius declined around 1%.\n\nNvidia's third-quarter revenue came in at $115.84 billion, more than $6 billion above analysts' expectations of $109.10 billion, while fourth-quarter guidance of $130 billion topped the $125.1 billion consensus, according to LSEG.\n\nThe semiconductor giant continues to navigate the fallout from Huang's resignation last week. Shortly before the results, Huang made his first public statement since resigning last week, saying that he was open to returning to the company, after an outpouring of support from prominent tech figures .\n\nNeocloud stocks today But Harvey Jones, the new and first-ever chair of Nvidia's board, said on the earnings call that the board does not intend to reinstate him as CEO.\n\n\u2033[Hyperscalers] are the ones that are right now feverishly looking for more focus in terms of the compute that we have available,\" interim CEO Colette Kress told Jim Cramer on CNBC's \"Mad Money.\"\n\n\"This concept that anything is changing in terms of any of our types of customers \u2014 that is just not true. They are all continuing to be with us, and we have a very deep breath of different customers.\"\n\nThe U.S. Commerce Department announced a lega
