<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Income tax rules explained: Sold land or property? How Section 54EC bonds can help you claim capital gains tax exemption", "full_content": "If you have sold land or a building and made a long-term capital gain, you can reduce your tax liability by investing the capital gain in specified bonds under Section 54EC of the Income-tax Act, 1961.\n\nThe provision allows eligible taxpayers to claim an exemption, subject to investment limits, deadlines, and holding-period conditions.\n\nUnder the Income-tax Act, 2025, which came into effect on April 1, 2026, the corresponding provision is covered under Section 85, relating to capital gains tax exemption on investment in specified bonds, but all the key conditions remain the same.\n\nSection 54EC allows an individual or other eligible taxpayer to claim an exemption on long-term capital gains arising from the transfer of land, a building, or both by investing the gains in specified bonds.\n\nThe exemption applies to the amount invested, rather than the entire sale proceeds. If you invest only part of it, the exemption is restricted to the amount invested.\n\nFor example, suppose you sell a plot and earn a long-term capital gain of \u20b9 30 lakh after 24 months of holding. If you invest \u20b9 20 lakh in eligible Section 54EC bonds within the prescribed period, you may claim an exemption of \u20b9 20 lakh, while the remaining \u20b9 10 lakh remains taxable.\n\nThe specified bonds must be issued by the National Highways Authority of India (NHAI), the Rural Electrification Corporation (REC), or another issuer whose bonds are notified by the Central Government for this purpose.\n\nFor investments made on or after April 1, 2018, the bonds must have a redemption period exceeding five years.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 06:02 PM IST", "pub_date_relative": "8m ago"}, {"title": "Oklo chief of staff John Hanson sells $41,129 of stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 06:01 PM IST", "pub_date_relative": "9m ago"}, {"title": "Why look at real assets into 2027?", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 05:54 PM IST", "pub_date_relative": "16m ago"}, {"title": "Dividend, stock split, resolution plans record date Oct 26: Hexaware, Midaas, Talwalkars Better Value, Ashapura Fashion", "full_content": "Dividend , stock split, resolution plan: Shares of Hexaware Technologies Limited, Ashapura Intimates Fashion Limited, Midaas Fashions Limited, and Talwalkers Better Value Fitness will remain in focus on Monday, October 26, as these firms have fixed record date to determine the eligibility for multiple corporate actions.\n\nThese companies have fixed Monday, October 26, as record date, for dividend, stock split and resolution plan. Which means that investors must own these stocks on or before the record date to become eligible for the corporate action, whether it is dividend, stock split or resolution plan. Here are all the details to know.\n\nHexaware Technologies has fixed Monday, October 26, as the record date to determine the eligibility for dividend. The tech firm had earlier announced interim dividend of \u20b9 9.50 per share with a face value of Re 1 each. The stock closed marginally lower at \u20b9 590.70 per share on BSE on Friday.\n\nMidaas Fashions\u2019 board of directors, earlier, had approved a stock split from \u20b9 10 per equity share to \u20b9 5 per equity share. The company has fixed Monday, October 26, as the record date for investors to qualify for the stock split. Midaas Fashions share price closed marginally higher at \u20b9 185 per equity share on BSE on Friday.\n\nThe board of directors of Ashapura Intimates Fashion has fixed Monday, October 26, as the record date for the capital reduction of the company as per the order passed by the National Company Law Tribunal. The stock closed Intimates Fashion share price closed at \u20b9 1.35 per share on BSE on Friday, October 23.\n\nTalwalkars Better Value Fitness has also fixed Monday as record date for resolution plan. The stock closed 4.61% lower at \u20b9 1.45 per share on BSE on Friday.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 05:51 PM IST", "pub_date_relative": "19m ago"}, {"title": "Amarin\u2019s icosapent ethyl shows survival benefit in cancer trial", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 05:46 PM IST", "pub_date_relative": "24m ago"}, {"title": "Oklo CPO Renner sells $41,129 in stock after RSU vesting", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 05:46 PM IST", "pub_date_relative": "24m ago"}, {"title": "Everpure CVO John Colgrove sells $12.46M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 05:31 PM IST", "pub_date_relative": "39m ago"}, {"title": "Oklo chief strategy officer Goodwin sells $66,367 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 05:31 PM IST", "pub_date_relative": "39m ago"}, {"title": "What Democrats and Republicans fear most about each other: CNBC survey has the answers", "full_content": "If Democrats take over Congress , Republican voters are worried they'll move too far to the left and enact socialist policies. If Republicans keep control, Democrats fret about President Donald Trump having unchecked power.\n\nThose are the findings from a new CNBC poll that shows what each side of the political divide fears about the other as the midterm election looms. Republicans in the survey also say they worry about weakened border security and higher taxes under a Democratic Congress. Democrats say they're concerned about continued Immigration and Customs Enforcement deportations and ongoing military efforts in Iran under a Republican one.\n\n\"That totally shows the polarization \u2026 and the fear that one side is going to completely undo the agenda of the other,\" Ron Bonjean , a Republican strategist and co-founder of ROKK Solutions, said of the results. \"What Republicans are worried about is that Democrats are going to go back to the way it was during the Biden administration.\"\n\nThe results of the latest CNBC All-America Economic Survey \u2014 conducted between Oct. 14 and 18 and including 1,000 registered voters \u2014 could serve as a warning for both parties after the election.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 05:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "Marc Lore\u2019s Wonder bets on Texas, automation and user-built restaurants as it mulls IPO", "full_content": "Less than a decade after its founding, food startup Wonder has seen its footprint and valuation soar.\n\nStill, the company has even more ambitious plans ahead, like a subscription program to let diners run their own \"restaurants,\" an aggressive expansion in Texas and a potential initial public offering.\n\nCreated by serial entrepreneur Marc Lore in 2018, Wonder advertises itself as \"the best restaurants from across the country, all in one place.\" Diners can place takeout or delivery orders from its food hall-style locations on the Wonder-branded app or third-party platforms, including Grubhub, which Wonder now owns.\n\nAs Lore described it to CNBC, \"Wonder is a vertically integrated food technology platform to make great food more accessible.\"\n\nTo achieve its goal, Wonder plans to open locations in urban, suburban and rural areas nationwide and aims to keep prices lower than the cost of delivered groceries. Thanks to its ownership of Grubhub, Wonder customers who order through the startup's app don't have to pay delivery fees, and its menu prices aren't inflated to cover the cost of commission fees to the delivery platform. Plus, Wonder is automating some of its kitchen functions, like assembling salads and bowls and soon sauces and beverages.\n\nThe company aims for food preparation and delivery to be fully autonomous by 2040, Lore said.\n\nNow, Wonder has to convince diners its platform built on cost savings and choice makes it worth their while in a competitive industry.\n\nLore's lofty vision for Wonder has helped the company raise $3.3 billion to date, from investors like DoorDash , Alphabet 's venture arm and Gwyneth Paltrow. Its Series D fundraising round earlier this year raised its pre-money valuation to $9 billion \u2014 just under sandwich chain Subway's sale price two years ago.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 05:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "Why economic health no longer dictates stock-market returns", "full_content": "There is a wide disconnect between Wall Street and Main Street, and AI could drive them even further apart", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 05:30 PM IST", "pub_date_relative": "41m ago"}, {"title": "IPO GMP, subscription race: Reliance Jio Platforms vs Paras Healthcare - Grey market premium, QIB, NII, Retail details", "full_content": "Reliance Jio Platforms and Paras Healthcare IPOs witnessed contrasting levels of investor demand, with the former attracting bids worth several lakh crore rupees and the latter closing its subscription with a more modest response. While Jio Platforms' IPO was subscribed 22.19 times, driven by strong institutional participation, Paras Healthcare's public issue was subscribed 2.23 times on the final day of bidding.\n\nThe grey market premium (GMP) also points to a sharp difference in listing expectations. Jio Platforms' IPO GMP stood at \u20b9 250, implying a potential listing gain of around 22.34% over the upper end of its price band, while Paras Healthcare's GMP was \u20b9 12, indicating a potential gain of 1.73%. Grey market premiums are unofficial indicators and do not guarantee listing performance.\n\nThe public issues opened on 21 October and conclude on 23 October, with allotment scheduled for tomorrow (26 October).\n\nHere's a closer look at the subscription figures, investor categories and latest GMP trends for both IPOs.\n\nReliance Industries-backed Jio Platforms' IPO closed with bids for 22.19 times the shares on offer, as total demand across the public issue and anchor investor placement crossed \u20b9 7.4 lakh crore. The offering also received nearly 1.39 crore applications, marking an unprecedented response to the digital services company.\n\nBy 7 PM on Friday, investors had bid for 438.3 crore shares against 19.75 crore shares on offer, according to exchange data. Bids for the public issue alone exceeded \u20b9 4.9 lakh crore, excluding the anchor book, while retail demand crossed \u20b9 25,867 crore.\n\nQualified institutional buyers (QIBs) led the subscription, bidding for 345.8 crore shares against 4.9 crore shares reserved for them. The category was subscribed 70.55 times. Within the QIB segment, domestic financial institutions, including banks, financial institutions and insurers, bid for 152.5 crore shares, while foreign institutional investors bid for 123.9 crore shares.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 05:26 PM IST", "pub_date_relative": "45m ago"}, {"title": "Conservative party wins first election in nearly a century in British Columbia", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 05:24 PM IST", "pub_date_relative": "46m ago"}, {"title": "Earnings playbook: Alphabet, Microsoft, Amazon and more report this week. Here's what to expect", "full_content": "The megacaps are some of the 160 S&P 500 companies expected to report at a critical time for tech and the market.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 05:24 PM IST", "pub_date_relative": "46m ago"}, {"title": "SpaceX coverage network designs draw Wall Street's eye. Here's what analysts think", "full_content": "Rooftops and billboards may be more important than hefty infrastructure.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 05:20 PM IST", "pub_date_relative": "51m ago"}, {"title": "Explained: Received an interest-free loan money from employer? Know what this special benefit means; when it is taxable", "full_content": "If you have received an interest-free loan or a loan at a lower-than-market interest rate from your employer, it can make borrowing cheaper than taking a loan from a bank. However, under income-tax rules, this benefit has tax implications.\n\nHere\u2019s what this concessional loan means, how the taxable amount is calculated, and when the benefit is exempt.\n\nWhen an employer provides an interest-free or concessional loan to an employee or a member of their household, the value of such benefit is taxable as a \u201cperquisite\u201d.\n\nA perquisite is a benefit or facility provided by an employer in addition to an employee\u2019s salary. It arises when employers offer loans for personal purposes such as education, medical treatment or marriage.\n\nThese loans can be interest-free or carry a lower interest rate than market rates, with repayments generally deducted from the employee\u2019s salary over time.\n\nSince employees borrowing from their employers may pay less interest than those borrowing from banks at market rates, the tax rules provide for the interest benefit to be treated and taxed as a perquisite.\n\nThe rules also apply if the employer provides a loan to the employee\u2019s household members, including their spouse, children and their spouses, parents, servants and dependants.\n\nThe taxable value is calculated by comparing the interest that would have been payable at the applicable State Bank of India (SBI) rate for a similar loan with the interest, if any, recovered from the employee.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 05:17 PM IST", "pub_date_relative": "53m ago"}, {"title": "Lump sum vs instalments: How nominees can receive term insurance benefits after the insured person's death", "full_content": "People buy term insurance to ensure their families remain financially secure in the event of their untimely death. A term insurance policy is essentially an agreement between the insurer and the policyholder for a fixed period, typically ranging from 10 to 40 years, during which the insurer pays the death benefit to the beneficiaries if the policyholder passes away.\n\nThis can help ensure that the insured person's family has the financial support to handle outstanding debts and expenses in their absence.\n\nMost term insurance plans offer a lump sum payout to the designated nominees when the insured person passes away. Under Section 39 of the Insurance Act, 1938, a policyholder can nominate one or more persons to receive the policy proceeds who can be a parent, spouse or child (including minors).\n\nHowever, term insurance benefits are not always disbursed as a one-time payout. Nominees may also have the option to receive the monetary benefits in instalments or through a combination of a lump sum and regular payouts, though it depends on the particular policy's terms.\n\nA staggered payout option allows beneficiaries to receive the term insurance death benefit in instalments rather than as a lump sum. Payouts may be monthly, annually or in the form of an increasing monthly income, depending on the plan and insurance company, according to a Tata AIA blog post.\n\nIn the monthly payout mode, a nominee receives the death benefit in equal instalments for a fixed period of months or years. In the increasing income monthly mode, they receive proceeds in monthly instalments for a set period.\n\nHowever, each month or year, the percentage of the monthly income received increases to help you adjust and negate the effects of inflation. In the annual payout option, the nominee receives the income in annual instalments.\n\nAlso, there is another payment mode that combines the lump sum plus monthly income options.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 05:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here\u2019s the real signal to watch for the Fed\u2019s next move", "full_content": "Investors should focus not on the rate itself, but on where financial conditions are", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 05:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Malabar Gold rates October 2026: 22K, 24K gold compared with Tanishq, Joyalukkas; Which jeweller offers the best prices?", "full_content": "With the festive season underway, many people are looking to buy gold jewellery, coins and bars from their favourite jewellers. Popular brands such as Malabar Gold & Diamonds, Tanishq and Joyalukkas offer a range of gold ornaments and wedding jewellery to suit different needs.\n\nAccording to the Bullion data, the gold price on October 25, 2026, stands at \u20b9 14,250 per gram for 24-karat gold and \u20b9 13,063 per gram for 22-karat gold. However, retail prices can vary across jewellers, depending on their pricing and applicable charges.\n\nHere is a look at the latest gold rates from Malabar Gold & Diamonds, Tanishq and Joyalukkas, and how their prices compare.\n\nAccording to Malabar Gold & Diamonds' website, its displayed gold rates were last updated on October 24. The rates are as follows:\n\nKarat indicates the purity of gold out of 24 parts. 24-karat gold, marked 999, contains approximately 99.9% pure gold. 22-karat gold, marked 916, contains approximately 91.6% pure gold, with the remaining portion comprising other metals that improve its strength and durability. This makes it a suitable choice for jewellery.\n\nAccording to the online store rates provided for Joyalukkas, its gold prices on October 25 are as follows:\n\nBefore buying gold jewellery, consumers should check the jeweller\u2019s latest gold rate and compare prices across brands. The final cost may also include making charges, wastage charges, where applicable, and GST .\n\nSince gold rates change on a daily basis, buyers should confirm the prevailing rate and review the itemised bill before making a purchase.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 04:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Portuguese police clear Lisbon housing protest camp, arresting 25", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 04:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Upcoming IPO GMP: EAAA India vs SFC Environmental vs BLS Polymers vs MK Sons Fine Jewels vs Bombay Coated Special Steels", "full_content": "India\u2019s primary market is set for a busy week, with five companies launching their initial public offerings (IPOs) between 26 October and 29 October, aiming to raise nearly \u20b9 2,600 crore. The upcoming issues span alternative investments, polymers, environmental technology, jewellery retail and steel processing, offering investors exposure to a diverse mix of businesses.\n\nEAAA India Alternatives, an arm of Edelweiss Financial Services, will kick off the week with the largest offering, a \u20b9 1,200-crore IPO. SFC Environmental Technologies will follow with a \u20b9 667.53-crore issue, while M.K. Sons Fine Jewels, BLS Polymers and Bombay Coated and Special Steels will also tap the market.\n\nThe issues have different objectives: while some companies are raising fresh capital to fund expansion, working capital and debt repayment, others are offering existing shareholders an opportunity to sell their stakes.\n\nHere\u2019s a closer look at the five IPOs, GMPs, their issue sizes, price bands, subscription dates and use of proceeds.\n\nEAAA India Alternatives IPO GMP today, or grey market premium, is +36. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of EAAA India Alternatives share price was indicated at \u20b9 1,701 apiece, which is 2.16% higher than the IPO price of \u20b9 1,665.\n\nOver the last 3 sessions, the IPO GMP trend has moved downward, declining from \u20b9 121 to \u20b9 36, a decrease of \u20b9 85, according to experts.\n\nEAAA India Alternatives Ltd, an arm of Edelweiss Financial Services, will open its \u20b9 1,200-crore IPO for subscription on 26 October and close on 28 October. The company has fixed a price band of \u20b9 1,585\u2013 \u20b9 1,665 per share, valuing it at \u20b9 10,765 crore at the upper end of the band.\n\nThe IPO is entirely an offer for sale (OFS) by the Edelweiss Group, meaning the company will not receive any proceeds from the issue. The entire amount will go to the selling shareholder.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 04:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Shore Bancshares delivers 84% return after Fair Value signal", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 04:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "NovaBridge reports phase 1b data for gastric cancer drug", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 04:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cyclone Arnab Likely To Hit Andhra Coast On Oct. 28: IMD", "full_content": "Cyclone expected to make landfall on October 28 with winds reaching 140 kmph; heavy to very heavy rainfall forecast across coastal Andhra Pradesh and Odisha.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 04:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Shah Rukh Khan, Deepika Padukone To Reunite For Grand Song Sequence In 'King'", "full_content": "Shah Rukh Khan and Deepika Padukone are set to share screen space again in King. A reported song shoot in Mumbai is expected to bring the actors together, with choreographer Vaibhavi Merchant said to be leading the sequence.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Liverpool Vs Brighton & Hove Albion Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online In India?", "full_content": "Can Liverpool stop Brighton's winning momentum in the Premier League? The two sides meet at Anfield, and here's a look at the match schedule, team news, probable lineups and live streaming options.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kerala Blasters vs Mumbai City FC FC Live Streaming, Telecast: When, Where To Watch ISL Match On TV, Online", "full_content": "With Mumbai City FC set to face Kerala Blasters FC in the ISL, here is a look at when and where to watch the match live, along with the venue, kick-off time and likely playing XIs.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Column | Asking Eric: Am I \u2018abandoning\u2019 myself if I don\u2019t leave my wife? - The Washington Post", "full_content": "Column | Asking Eric: Am I \u2018abandoning\u2019 myself if I don\u2019t leave my wife? The Washington Post", "source": "Google News Business", "pub_date_str": "25 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank holiday tomorrow Monday Oct 26: Chandigarh, Bengaluru, Shimla, Srinagar, Jammu, Agartala branch closed; here's why", "full_content": "Banks in several parts of India will remain closed on Monday, October 26, as they will observe various regional holidays, including Laxmi Puja, Accession Day and Maharishi Valmiki\u2019s Birthday. The closures will vary by state and region, depending on the occasion being celebrated.\n\nThe bank holiday tomorrow is scheduled as part of the Reserve Bank of India (RBI) bank holiday calendar, which is released at the beginning of every year. According to the RBI calendar , October has a total of 11 holidays, excluding regular weekend offs on Sundays and the second and fourth Saturdays.\n\nBank holidays usually differ from region to region, depending on the festivals and other occasions celebrated in each area. The only time when all scheduled and non-scheduled banks suspend operations pan-India is during gazetted public holidays and regular weekend holidays.\n\nOn Monday, October 26, in-branch bank services will remain unavailable in cities such as Agartala, Bengaluru , Chandigarh, Jammu, Shimla and Srinagar.\n\nThe next bank holiday will fall on October 29, 2026, when banks across Shimla will remain closed due to the occasion of Karva Chauth, where married women observe a strict one day-long fast from sunrise to moonrise to pray for the safety, prosperity, and longevity of their husbands.\n\nThe last bank holiday of the month will be observed on October 31, when banks in Ahmedabad will remain closed to mark the birth anniversary of Sardar Vallabhbhai Patel, India\u2019s first Deputy Prime Minister and Home Minister.\n\nThe closure of physical branches, however, does not mean that banking services will come to a complete stop. Customers can continue using online or mobile banking services, unless they are specifically notified by the service provider of technical issues or any other reasons.\n\nIf you are facing cash emergencies, you are free to withdraw money from ATMs as they remain operational round the clock.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 04:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide stock market action on Monday Cyient Share Price Mphasis Share Price L&T Technology Services Share Price Hexaware Technologies Share Price Tata Technologies Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide stock market action on Monday SECTIONS Ahead of Market: 10 things that will decide stock market action on Monday By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 25, 2026, 04:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities fell over 2% last week as rising crude oil prices, FII outflows and geopolitical tensions weighed on sentiment. Broader markets underperformed, while global indices also declined and market breadth strongly favoured bears.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 04:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio Platforms IPO listing date and time, share price prediction, expected money gains basis GMP, expected m-cap; Details", "full_content": "Jio Platforms IPO listing date and time: The countdown to Jio Platforms initial public offering (IPO) has begun after the conclusion of subscription period over the past week. Backed by Mukesh Ambani\u2019s Reliance Industries Limited, the IPO became India's most subscribed stock offering as it surpassed the 2008 issue of Reliance Power, part of brother Anil's group.\n\nThe Jio Platforms IPO closed for subscription on Friday, and its allotment is likely to be finalised on Monday, October 26, followed by its listing next week. For investors who are closely tracking Jio IPO, here are all the details to know.\n\nThe Jio Platforms IPO will list on NSE and BSE with a tentative listing date fixed as Wednesday, October 28, 2026. Reliance Jio IPO will be listed on exchanges at 10 am.\n\nThe IPO listing process begins with a special pre-open session (SPOS) between 9 am and 9:45 am. The special session will open for order entry, modification, and cancellation.\n\nIt will be followed by order matching, trade confirmation and opening price determination session between 9:45 am and 9:55 am. Next is a five minute buffer and transition period followed by listing at 10 am.\n\nJio Platforms IPO\u2019s grey market premium (GMP) stood at \u20b9 250 per share, at 2:37 pm on October 25, 2026. With this, its estimated listing price is likely to remain close to \u20b9 1369 per share (which is the sum of upper price band of \u20b9 1119 and grey market premium). The latest grey market premium indicates an IPO listing of close to 22.34%.\n\nSuppose an investor receives allotment of one lot of 12 shares, on investment of \u20b9 13428. Considering the current grey market premium (indicating 22.34% of listing gain), the Jio IPO may list at \u20b9 13,428, which makes the potential money gain of \u20b9 3,000 for investors.\n\nThe IPO is a book build issue of \u20b9 30,213 crore and its issue is an entirely a fresh issue of 27 crore shares of \u20b9 30,213 crore.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 04:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bharat Coking Coal Q2 Results: PSU Coal India Arm Swings To Profit, Revenue Jumps 40% YoY", "full_content": "Bharat Coking Coal's revenue went up 39% year-on-year to Rs 4,413 crore from Rs 3,173 crore in the preceding fiscal.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 03:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "RailTel Q2 Results: Profit Drops 10% On One-Time Exceptional Loss, Revenue Up 20% YoY", "full_content": "RailTel Corporation of India reported a 20.5% year-on-year rise in Q2 revenue to Rs 1,146 crore, while net profit fell 9.9% to Rs 68.6 crore. EBITDA grew 13.9%, but the margin narrowed to 15.4%.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 03:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bank Nifty tumbles nearly 3%, slips below 55k: More selling pressure ahead for banking stocks? Check key levels to watch", "full_content": "Indian equity benchmarks extended their losses in a holiday-truncated week, with the BSE Sensex falling 2.15% and the NSE Nifty 50 declining 2.36%. The Sensex shed 1,605.44 points, while the Nifty 50 lost 546.15 points over the four trading sessions.\n\nThe selloff, triggered by surging crude oil prices amid the West Asia crisis, wiped out nearly \u20b9 21 lakh crore in investor wealth as benchmark indices declined for four consecutive sessions.\n\nBanking stocks also came under pressure, with the Nifty Bank index falling 2.79% over the week to close at 54,287.35. The index opened at 55,827.45, but persistent selling prevented it from sustaining its recent recovery. It slipped below the 55,000 mark and ended the week down 1,556.65 points, forming a strong bearish weekly candle and snapping its two-week winning streak.\n\nThe decline in banking stocks has been uneven. Over the past week, Yes Bank was the worst performer among the 14 Nifty Bank constituents, tumbling 10.84%, followed by IDFC First Bank, which fell 7.6%, and Axis Bank, down 5.58%. In contrast, PNB, Federal Bank and Union Bank of India posted gains, while ICICI Bank edged up marginally.\n\nOver the past month, Yes Bank plunged 32.19%, followed by IDFC First Bank, down 17.51%, and IndusInd Bank, which declined 13.66%. Federal Bank and ICICI Bank gained 4.35% and 4.32%, respectively, while Kotak Mahindra Bank rose 3.31%.\n\nOn a year-to-date basis, the Nifty Bank index has declined 8.89%, outperforming the Nifty 50 and Sensex, which have fallen 13.51% and 14.19%, respectively. The figures underline the broader weakness in Indian e\n\nHitesh Tailor, Research Analyst at Choice Broking, said Bank Nifty's weekly price action signals renewed selling pressure after the index broke below the 55,000 mark and slipped below its 100-week exponential moving average (EMA), an important technical level.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 03:38 PM IST", "pub_date_relative": "2h ago"}, {"title": "AI Could Add $2.5 Trillion To The Global Economy, But Rising Costs Threaten To Wipe Out $850 Billion", "full_content": "AI can empower high-skilled, higher-paid professionals instead of just automating low-wage jobs. Fields like healthcare, legal services, management, and tech present prime opportunities for cost-effective AI deployment.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 03:36 PM IST", "pub_date_relative": "2h ago"}, {"title": "Shilpa Rao's Mic Cut Mid-Show At Mumbai Event, AICWA Says 'Such Behaviour Towards An Artist Will Never Be Tolerated'", "full_content": "Shilpa Rao\u2019s performance was cut short after production delays at the Bollywood Music Project, prompting the All Indian Cine Workers Association to condemn her treatment and offer legal support.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 03:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "Peter Lynch on stock picking: 'You shouldn't own a stock if you can't\u2026'", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Peter Lynch on stock picking: 'You shouldn't own a stock if you can't\u2026' The Economic Times daily newspaper is available online now. Read Today's Paper Peter Lynch on stock picking: 'You shouldn't own a stock if you can't\u2026' SECTIONS Peter Lynch on stock picking: 'You shouldn't own a stock if you can't\u2026' By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 25, 2026, 03:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Peter Lynch\u2019s investing advice centres on understanding a company before buying its stock. The legendary Fidelity Magellan Fund manager stresses researching business fundamentals, growth prospects and financials rather than investing based on popularity or hearsay.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 03:32 PM IST", "pub_date_relative": "2h ago"}, {"title": "Kashmir: Hassan Mir urges month pension hike to \u20b93,000 for widows, orphans and elderly, payment of dues", "full_content": "Apni Party leader Ghulam Hassan Mir has urged the National Conference (NC) led Jammu and Kashmir state government to fulfil the party's election manifesto promise and formally increase monthly pension from \u20b9 1,000 to \u20b9 3,000, according to a report by local publication Greater Kashmir.\n\nMir urged that monthly pension be enhanced to benefit the elderly, orphans, widows and other vulnerable sections of society, the report said. He also called for release of pending pension payments reportedly not being received by beneficiaries over the past four months, it added.\n\nMir said delay in payments is causing considerable hardship to those who depend on the assistance for their daily needs. \u201cThe monthly pension may not mean much to the government, but for these people, it means a lot,\u201d he said. The report added that he also urged the state to investigate the reasons behind delay in payments.\n\n\u201cIf the salaries of senior government officials are withheld, there is an immediate outcry everywhere. Why, then, is there silence when the pensions of the most vulnerable people are delayed?\u201d he questioned, it said.\n\nMeanwhile, the EPFO's Central Board of Trustees is likely to discuss raising the minimum monthly pension under its Employees' Pension Scheme (EPS) at its next meeting in Gujarat on next month, according to a Business Standard report.\n\nThe CBT is expected to hold its 240th meeting in Gir on 19 November, where the issue is expected to be on the agenda, it cited two sources saying. This has been a long pending demand by pensioners and trade unions, it added.\n\nSince September 2014, the Centre has set minimum pension at \u20b9 1,000/month but trade unions and pensioners groups have argued that this is not enough to keep up with cost of living and inflation.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 03:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "J&K Bank boosts accident insurance to \u20b91 crore for J&K government staff; Check key benefits and loan concessions", "full_content": "Jammu and Kashmir Bank has increased the group personal accident insurance cover for permanent Jammu and Kashmir government employees from the current \u20b9 25 lakh to \u20b9 1 crore under a 5-year agreement signed with the Union Territory administration on 23 October 2026.\n\nThis agreement also focuses on enhancing disability benefits, financial assistance for employees' families, preferential loan facilities and banking concessions. The overall objective is to bring meaningful and positive changes in the lives of permanent government employees in the Union Territory.\n\nAs per the agreement, the accident insurance package provides \u20b9 1.35 crore in air accident cover, \u20b9 75 lakh for permanent total disability and \u20b9 55 lakh for permanent partial disability.\n\nFurthermore, there are also several noticeable additional benefits, including higher education assistance of \u20b9 8 lakh for a male child and \u20b9 10 lakh for a girl child following the insured employee\u2019s untimely demise. In such cases, eligible families can also receive up to \u20b9 10 lakh towards a girl child\u2019s marriage , along with \u20b9 10 lakh in air ambulance cover, subject to the applicable terms, rules and regulations.\n\nThis agreement was signed in the presence of Financial Commissioner (Additional Chief Secretary), Finance Department, Shailendra Kumar, and J&K Bank Managing Director and CEO Amitava Chatterjee. Given the uncertainties and unpredictability of life, the core aim of the agreement was to provide some semblance of assurance to citizens.\n\nAll permanent government employees will be eligible for zero-balance accounts, free international debit cards, with spouse add-on cards and lifetime-free RuPay credit cards.\n\nThe package also provides a 25-basis-point concession on applicable personal loan interest rates, subject to the prescribed benchmark floor.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 03:13 PM IST", "pub_date_relative": "2h ago"}, {"title": "From Salman Khan to Virat Kohli: Why are more celebs buying agricultural land in India? Check tax benefits", "full_content": "Agricultural land offers celebrities more than open spaces and peaceful weekend breaks. It combines farming opportunities, investment potential, privacy and a connection with nature. For wealthy buyers, these benefits can make farmland attractive alongside homes and other investments.\n\nSeveral well-known names own farms or rural properties across India. Salman Khan\u2019s Arpita Farms in Panvel covers 150 acres near Mumbai. The estate includes paddy fields, horse stables and large green spaces. Late Dharmendra\u2019s 100-acre Maharashtra estate features vegetables, fruit orchards and sustainable farming arrangements.\n\nVirat Kohli and Anushka Sharma reportedly purchased 5.1 acres of agricultural land in Alibaug. Their purchase, near Aaphale village and Nagveshwar Temple, cost \u20b9 37.86 crore.\n\nShah Rukh Khan\u2019s daughter, Suhana Khan , also owns agricultural and farmhouse land parcels in Alibaug. Amitabh Bachchan has invested in land in Alibaug and Ayodhya.\n\nFor some celebrities, farming provides a closer link with their roots. Nawazuddin Siddiqui purchased 13.75 acres in Budhana, his ancestral hometown in Uttar Pradesh.\n\nOthers have focused on growing food and improving their land. Prakash Raj grows grains and trees, practises sustainable farming and sells homegrown produce.\n\nR Madhavan\u2019s Tamil Nadu farm focuses on coconuts and restoring barren land. His efforts also encourage local birds and support the surrounding environment.\n\nJackie Shroff\u2019s 44,000-square-foot property between Mumbai and Pune includes organic gardening and a fish pond. Aamir Khan owns a rustic two-acre property in Panchgani. Varun Dhawan has also acquired a rural farm property for nature-focused work.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 03:10 PM IST", "pub_date_relative": "3h ago"}, {"title": "Gold prices jump from \u20b9432 to \u20b91.42 lakh in 50 years: Should you sell inherited gold jewellery, exchange it or keep it?", "full_content": "Gold prices have risen sharply over the years, making inherited jewellery worth revisiting. A necklace passed down by a parent or a pair of old bangles may hold both financial and sentimental value. But should you sell the jewellery at current prices, keep it for future use, or exchange it for a new design?\n\nAccording to Bullion data, gold prices today stand at \u20b9 1,42,500 per 10 grams for 24-karat gold. In 2016, the price was around \u20b9 28,624 per 10 grams, while 20 years ago, in 2006, it was \u20b9 8,400. In 1976, 50 years ago, the gold price was just \u20b9 432 per 10 grams, according to Bankbazaar data.\n\nBut the decision to sell inherited gold involves more than the prevailing gold rate and returns. Purity, resale value, and tax implications can all affect the outcome. Here are six things to check before deciding what to do with inherited gold.\n\nDo not value jewellery only by its total weight. Stones, pearls and other non-gold components must be excluded, while purity determines the applicable rate. Check the hallmark and get the jewellery tested if its purity is uncertain.\n\nA necklace inherited from a parent may have significance beyond its resale price. Consider whether the piece is likely to be worn, preserved, or passed on. Antique craftsmanship may also warrant a separate check before selling it as scrap gold.\n\nThe market rate is not necessarily the amount a jeweller will pay. Ask for the rate applied, net gold weight, and every deduction. Compare written quotations from multiple buyers before finalising the sale.\n\nExample: If the assessed gold weighs 20 grams and the applicable rate is \u20b9 13,070 per gram for 22-karat, its indicative metal value is \u20b9 2,61,400. If the jeweller deducts \u20b9 5,000, the payout would be \u20b9 2,56,400.\n\nExchanging old jewellery can reduce the amount payable for a new piece, but making charges and applicable GST add to the bill.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 03:01 PM IST", "pub_date_relative": "3h ago"}, {"title": "Tukaram Mundhe Effect In Bihar: IAS Officer's Batchmate Inspects 531 Eateries In 3 Months Of Crackdown", "full_content": "Bihar conducted 531 food safety inspections in three months, seizing or destroying food. Kumar Ravi\u2019s campaign targets unsafe food practices, but low consumer awareness remains a key challenge.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 02:59 PM IST", "pub_date_relative": "3h ago"}, {"title": "Why fund managers are mixed on gilt funds", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBond yields are climbing globally, and Indian investors in gilt funds face a difficult choice: lock in higher yields now or wait for a potentially better entry point.\n\nThe US 10-year Treasury yield is hovering around 5%, up from around 4% a year ago, while Brent crude oil has climbed past $110 a barrel on supply concerns in West Asia, raising the risk that inflation will stay higher for longer.\n\nIn India, yield on the benchmark 10-year government security (g-sec) stood at 7.47% on 23 October, up from around 6.76% in mid-August and about 6.54% a year ago. The yield is at its highest level in three-and-a-half years. Rising US yields, higher crude oil prices and monetary tightening at home have all contributed to the pressure.\n\nFor investors, rising yields cut both ways. Higher yields can make government bonds more attractive to new investors, but they also push down the prices of existing bonds, inflicting mark-to-market losses on debt funds that hold them. Gilt funds, which invest predominantly in government securities, can be particularly sensitive to these moves when their portfolios have longer durations.\n\nOn average, gilt funds\u2019 net asset values (NAVs) have fallen about 2.5% since mid-August. Some fund managers see the correction as an opportunity to build positions gradually. Others believe yields could rise further, making patience the better strategy.\n\nThe argument for investing now rests on the view that yields are already attractive and that much of the expected monetary tightening may be reflected in bond prices.\n\n\u201cYields at close to 7.45-7.5% are a good entry point. But investors should enter in a staggered manner and not put the entire sum in at one go, as oil is rising and yields are elevated globally. We don\u2019t know where the top will be,\u201d said Puneet Pal, head of fixed income at PGIM India Mutual Fund.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 02:57 PM IST", "pub_date_relative": "3h ago"}, {"title": "Bank holidays next week: SBI, HDFC, ICICI branches to remain closed on these 3 days from 26-31 Oct? Check RBI calendar", "full_content": "Bank holiday next week : Public and private lenders, including branches of the State Bank of India ( SBI ), HDFC Bank, ICICI Bank , Punjab National Bank (PNB) and Canara Bank will be closed on a number of days between 26-31 October for various reasons, according to the official Reserve Bank of India schedule.\n\nAs per RBI rules, all scheduled and non-scheduled banks observe listed holidays and mandatory closure on second and fourth Saturdays and every Sunday in a month. In-branch services are shut, but digital services (online net banking, app) will remain operational.\n\nUsually, in addition to the common national and gazetted holidays, or weekend offs, banks in India could have local holidays and festivals off, as required. The central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks, including the SBI, HDFC Bank , ICICI Bank, Axis Bank, PNB, Canara Bank, Bank of Baroda and other lenders across India will remain closed on the following dates next week:\n\n\u2014 Monday, October 26 (Laxmi Puja / Accession Day / Maharishi Valmiki\u2019s Birthday): Branches will be closed in Agartala, Chandigarh, Jammu, Shimla, and Srinagar.\n\n\u2014 Thursday, October 29 ( Karva Chauth ): Banks in Shimla will remain closed.\n\n\u2014 Saturday, October 31 (Sardar Vallabhbhai Patel's Birthday): Banks in Ahmedabad will be closed.\n\nDuring bank holidays , online banking services remain available across the country to ensure uninterrupted access to banking services. Customers can use these services for convenient financial transactions.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 02:57 PM IST", "pub_date_relative": "3h ago"}, {"title": "Jio Platforms IPO allotment status check online by PAN number guide for KFin Tech Registrar Portal on ris.kfintech.com", "full_content": "Jio Platforms initial public offering (IPO) allotment is all set to be finalised on Monday, October 26. Backed by Mukesh Ambani\u2019s Reliance Industries Limited (RIL), Jio IPO was subscribed more than 22 times during the bidding period.\n\nAs all eyes are now on the finalisation of allotment shares, here\u2019s how investors can check allotment status on KFin Tech registrar portal.\n\nInvestors can check their allotment status on KFin Technologies website by three different methods, ie, PAN Number, IPO Application Number, and demat account number.\n\n- Select the drop-down menu, and choose Jio Platforms option.\n\n-Readers must note that Reliance Jio IPO name will be visible on the dropdown menu list only after the allotment is officially finalized.\n\n-Once you select Jio IPO, now select PAN number as search type.\n\n-Readers can also select other methods like IPO application number, demat account number.\n\n-Proceed with PAN number option and then enter details like identification number.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 02:53 PM IST", "pub_date_relative": "3h ago"}, {"title": "Mumbai Chokes As Road Dust, Traffic-Fueled Smog Further Worsens Air Quality", "full_content": "Mumbai's hazy skyline has renewed concerns over the sources of its air pollution. Research points to road dust, vehicle emissions and industrial activity, while questions over monitoring and enforcement are putting the city's pollution control measures under scrutiny.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 02:41 PM IST", "pub_date_relative": "3h ago"}, {"title": "Put Your A.I. Agents to Work With These 5 Killer Tasks - The New York Times", "full_content": "Put Your A.I. Agents to Work With These 5 Killer Tasks The New York Times When AI agents run your life Vox \u2018Know Your Agent\u2019 will be the new rule of the AI age Financial Times AI\u2019s use of personal info raises concerns Northwest Arkansas Democrat-Gazette Will the A.I. Assistant Wars Produce a SuperApp? Observer", "source": "Google News Business", "pub_date_str": "25 Oct 2026, 02:31 PM IST", "pub_date_relative": "3h ago"}, {"title": "Kieron Pollard Gets Key Role At MI: A Look At The Head Coaches Of The IPL Franchise So Far", "full_content": "From Lalchand Rajput in the inaugural IPL season to Mahela Jayawardene's title winning years, Mumbai Indians have had several coaches shape their journey. Kieron Pollard is the latest to take charge for IPL 2027.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 02:21 PM IST", "pub_date_relative": "3h ago"}, {"title": "Cultivation of large cardamom emerges as a lucrative option for higher income from limited land", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Cultivation of large cardamom emerges as a lucrative option for higher income from limited land The Economic Times daily newspaper is available online now. Read Today's Paper Cultivation of large cardamom emerges as a lucrative option for higher income from limited land SECTIONS Cultivation of large cardamom emerges as a lucrative option for higher income from limited land PTI Last Updated: Oct 25, 2026, 02:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A farmer in Himachal Pradesh's Bilaspur district has cultivated large cardamom for 20 years, producing 2-3 quintals annually on about one bigha of land. Priced at around Rs 1.8 lakh per quintal, the crop offers an alternative income source for farmers with reliable irrigation, according to the agriculture department.\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Oct 2026, 02:20 PM IST", "pub_date_relative": "3h ago"}, {"title": "Lula, Bolsonaro rally supporters on final day before Brazil presidential runoff", "full_content": "Brazilian President Luiz Inacio Lula da Silva and Senator Flavio Bolsonaro wrapped up their campaigns on Saturday ahead of Sunday's presidential runoff vote, mobilizing supporters and making a final push for undecided voters.\n\nThe two candidates have remained neck and neck in polls following a stronger-than-expected performance by the right-wing senator in the first round. On Saturday, a CNT/MDA poll showed the senator with a 1.3-point lead.\n\nLula, who is seeking a fourth non-consecutive term, kicked off his last day of campaigning with a march along Rio de Janeiro's iconic Copacabana beach, where thousands of supporters joined the leftist incumbent under a blazing sun.\n\n\"We're going to win the election for one simple reason: it's true that the people want change, (but) they want to move forward. They don't want to go backward,\" Lula told journalists before the rally.\n\nLater, the president led another march in Sao Paulo, passing along Paulista Avenue, a traditional venue for political demonstrations in Brazil's largest city.\n\n\"It's so exciting to see everyone here. This is the kind of energy we want for Brazil. Brazil is ours,\" said Gisele Passos, a 61-year-old businesswoman at the Sao Paulo rally.\n\nFor many Lula supporters, the rallies carried a bittersweet undertone. The 80-year-old president and former union leader is widely expected to be making his final bid for office, lending the campaign's closing events the feel of a farewell tour.\n\n\"He's one of a kind. He has had an incredible, remarkable, and hard-fought journey. We're very proud of that,\" said Olga Leal, a 62-year-old retiree in Sao Paulo.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 02:18 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Income tax rules explained: Sold land or property? How Section 54EC bonds can help you claim capital gains tax exemption", "full_content": "If you have sold land or a building and made a long-term capital gain, you can reduce your tax liability by investing the capital gain in specified bonds under Section 54EC of the Income-tax Act, 1961.\n\nThe provision allows eligible taxpayers to claim an exemption, subject to investment limits, deadlines, and holding-period conditions.\n\nUnder the Income-tax Act, 2025, which came into effect on April 1, 2026, the corresponding provision is covered under Section 85, relating to capital gains tax exemption on investment in specified bonds, but all the key conditions remain the same.\n\nSection 54EC allows an individual or other eligible taxpayer to claim an exemption on long-term capital gains arising from the transfer of land, a building, or both by investing the gains in specified bonds.\n\nThe exemption applies to the amount invested, rather than the entire sale proceeds. If you invest only part of it, the exemption is restricted to the amount invested.\n\nFor example, suppose you sell a plot and earn a long-term capital gain of \u20b9 30 lakh after 24 months of holding. If you invest \u20b9 20 lakh in eligible Section 54EC bonds within the prescribed period, you may claim an exemption of \u20b9 20 lakh, while the remaining \u20b9 10 lakh remains taxable.\n\nThe specified bonds must be issued by the National Highways Authority of India (NHAI), the Rural Electrification Corporation (REC), or another issuer whose bonds are notified by the Central Government for this purpose.\n\nFor investments made on or after April 1, 2018, the bonds must have a redemption period exceeding five years.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 06:02 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dividend, stock split, resolution plans record date Oct 26: Hexaware, Midaas, Talwalkars Better Value, Ashapura Fashion", "full_content": "Dividend , stock split, resolution plan: Shares of Hexaware Technologies Limited, Ashapura Intimates Fashion Limited, Midaas Fashions Limited, and Talwalkers Better Value Fitness will remain in focus on Monday, October 26, as these firms have fixed record date to determine the eligibility for multiple corporate actions.\n\nThese companies have fixed Monday, October 26, as record date, for dividend, stock split and resolution plan. Which means that investors must own these stocks on or before the record date to become eligible for the corporate action, whether it is dividend, stock split or resolution plan. Here are all the details to know.\n\nHexaware Technologies has fixed Monday, October 26, as the record date to determine the eligibility for dividend. The tech firm had earlier announced interim dividend of \u20b9 9.50 per share with a face value of Re 1 each. The stock closed marginally lower at \u20b9 590.70 per share on BSE on Friday.\n\nMidaas Fashions\u2019 board of directors, earlier, had approved a stock split from \u20b9 10 per equity share to \u20b9 5 per equity share. The company has fixed Monday, October 26, as the record date for investors to qualify for the stock split. Midaas Fashions share price closed marginally higher at \u20b9 185 per equity share on BSE on Friday.\n\nThe board of directors of Ashapura Intimates Fashion has fixed Monday, October 26, as the record date for the capital reduction of the company as per the order passed by the National Company Law Tribunal. The stock closed Intimates Fashion share price closed at \u20b9 1.35 per share on BSE on Friday, October 23.\n\nTalwalkars Better Value Fitness has also fixed Monday as record date for resolution plan. The stock closed 4.61% lower at \u20b9 1.45 per share on BSE on Friday.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 05:51 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Marc Lore\u2019s Wonder bets on Texas, automation and user-built restaurants as it mulls IPO", "full_content": "Less than a decade after its founding, food startup Wonder has seen its footprint and valuation soar.\n\nStill, the company has even more ambitious plans ahead, like a subscription program to let diners run their own \"restaurants,\" an aggressive expansion in Texas and a potential initial public offering.\n\nCreated by serial entrepreneur Marc Lore in 2018, Wonder advertises itself as \"the best restaurants from across the country, all in one place.\" Diners can place takeout or delivery orders from its food hall-style locations on the Wonder-branded app or third-party platforms, including Grubhub, which Wonder now owns.\n\nAs Lore described it to CNBC, \"Wonder is a vertically integrated food technology platform to make great food more accessible.\"\n\nTo achieve its goal, Wonder plans to open locations in urban, suburban and rural areas nationwide and aims to keep prices lower than the cost of delivered groceries. Thanks to its ownership of Grubhub, Wonder customers who order through the startup's app don't have to pay delivery fees, and its menu prices aren't inflated to cover the cost of commission fees to the delivery platform. Plus, Wonder is automating some of its kitchen functions, like assembling salads and bowls and soon sauces and beverages.\n\nThe company aims for food preparation and delivery to be fully autonomous by 2040, Lore said.\n\nNow, Wonder has to convince diners its platform built on cost savings and choice makes it worth their while in a competitive industry.\n\nLore's lofty vision for Wonder has helped the company raise $3.3 billion to date, from investors like DoorDash , Alphabet 's venture arm and Gwyneth Paltrow. Its Series D fundraising round earlier this year raised its pre-money valuation to $9 billion \u2014 just under sandwich chain Subway's sale price two years ago.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 05:30 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IPO GMP, subscription race: Reliance Jio Platforms vs Paras Healthcare - Grey market premium, QIB, NII, Retail details", "full_content": "Reliance Jio Platforms and Paras Healthcare IPOs witnessed contrasting levels of investor demand, with the former attracting bids worth several lakh crore rupees and the latter closing its subscription with a more modest response. While Jio Platforms' IPO was subscribed 22.19 times, driven by strong institutional participation, Paras Healthcare's public issue was subscribed 2.23 times on the final day of bidding.\n\nThe grey market premium (GMP) also points to a sharp difference in listing expectations. Jio Platforms' IPO GMP stood at \u20b9 250, implying a potential listing gain of around 22.34% over the upper end of its price band, while Paras Healthcare's GMP was \u20b9 12, indicating a potential gain of 1.73%. Grey market premiums are unofficial indicators and do not guarantee listing performance.\n\nThe public issues opened on 21 October and conclude on 23 October, with allotment scheduled for tomorrow (26 October).\n\nHere's a closer look at the subscription figures, investor categories and latest GMP trends for both IPOs.\n\nReliance Industries-backed Jio Platforms' IPO closed with bids for 22.19 times the shares on offer, as total demand across the public issue and anchor investor placement crossed \u20b9 7.4 lakh crore. The offering also received nearly 1.39 crore applications, marking an unprecedented response to the digital services company.\n\nBy 7 PM on Friday, investors had bid for 438.3 crore shares against 19.75 crore shares on offer, according to exchange data. Bids for the public issue alone exceeded \u20b9 4.9 lakh crore, excluding the anchor book, while retail demand crossed \u20b9 25,867 crore.\n\nQualified institutional buyers (QIBs) led the subscription, bidding for 345.8 crore shares against 4.9 crore shares reserved for them. The category was subscribed 70.55 times. Within the QIB segment, domestic financial institutions, including banks, financial institutions and insurers, bid for 152.5 crore shares, while foreign institutional investors bid for 123.9 crore shares.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 05:26 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings playbook: Alphabet, Microsoft, Amazon and more report this week. Here's what to expect", "full_content": "The megacaps are some of the 160 S&P 500 companies expected to report at a critical time for tech and the market.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 05:24 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpaceX coverage network designs draw Wall Street's eye. Here's what analysts think", "full_content": "Rooftops and billboards may be more important than hefty infrastructure.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 05:20 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Explained: Received an interest-free loan money from employer? Know what this special benefit means; when it is taxable", "full_content": "If you have received an interest-free loan or a loan at a lower-than-market interest rate from your employer, it can make borrowing cheaper than taking a loan from a bank. However, under income-tax rules, this benefit has tax implications.\n\nHere\u2019s what this concessional loan means, how the taxable amount is calculated, and when the benefit is exempt.\n\nWhen an employer provides an interest-free or concessional loan to an employee or a member of their household, the value of such benefit is taxable as a \u201cperquisite\u201d.\n\nA perquisite is a benefit or facility provided by an employer in addition to an employee\u2019s salary. It arises when employers offer loans for personal purposes such as education, medical treatment or marriage.\n\nThese loans can be interest-free or carry a lower interest rate than market rates, with repayments generally deducted from the employee\u2019s salary over time.\n\nSince employees borrowing from their employers may pay less interest than those borrowing from banks at market rates, the tax rules provide for the interest benefit to be treated and taxed as a perquisite.\n\nThe rules also apply if the employer provides a loan to the employee\u2019s household members, including their spouse, children and their spouses, parents, servants and dependants.\n\nThe taxable value is calculated by comparing the interest that would have been payable at the applicable State Bank of India (SBI) rate for a similar loan with the interest, if any, recovered from the employee.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 05:17 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Lump sum vs instalments: How nominees can receive term insurance benefits after the insured person's death", "full_content": "People buy term insurance to ensure their families remain financially secure in the event of their untimely death. A term insurance policy is essentially an agreement between the insurer and the policyholder for a fixed period, typically ranging from 10 to 40 years, during which the insurer pays the death benefit to the beneficiaries if the policyholder passes away.\n\nThis can help ensure that the insured person's family has the financial support to handle outstanding debts and expenses in their absence.\n\nMost term insurance plans offer a lump sum payout to the designated nominees when the insured person passes away. Under Section 39 of the Insurance Act, 1938, a policyholder can nominate one or more persons to receive the policy proceeds who can be a parent, spouse or child (including minors).\n\nHowever, term insurance benefits are not always disbursed as a one-time payout. Nominees may also have the option to receive the monetary benefits in instalments or through a combination of a lump sum and regular payouts, though it depends on the particular policy's terms.\n\nA staggered payout option allows beneficiaries to receive the term insurance death benefit in instalments rather than as a lump sum. Payouts may be monthly, annually or in the form of an increasing monthly income, depending on the plan and insurance company, according to a Tata AIA blog post.\n\nIn the monthly payout mode, a nominee receives the death benefit in equal instalments for a fixed period of months or years. In the increasing income monthly mode, they receive proceeds in monthly instalments for a set period.\n\nHowever, each month or year, the percentage of the monthly income received increases to help you adjust and negate the effects of inflation. In the annual payout option, the nominee receives the income in annual instalments.\n\nAlso, there is another payment mode that combines the lump sum plus monthly income options.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 05:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Malabar Gold rates October 2026: 22K, 24K gold compared with Tanishq, Joyalukkas; Which jeweller offers the best prices?", "full_content": "With the festive season underway, many people are looking to buy gold jewellery, coins and bars from their favourite jewellers. Popular brands such as Malabar Gold & Diamonds, Tanishq and Joyalukkas offer a range of gold ornaments and wedding jewellery to suit different needs.\n\nAccording to the Bullion data, the gold price on October 25, 2026, stands at \u20b9 14,250 per gram for 24-karat gold and \u20b9 13,063 per gram for 22-karat gold. However, retail prices can vary across jewellers, depending on their pricing and applicable charges.\n\nHere is a look at the latest gold rates from Malabar Gold & Diamonds, Tanishq and Joyalukkas, and how their prices compare.\n\nAccording to Malabar Gold & Diamonds' website, its displayed gold rates were last updated on October 24. The rates are as follows:\n\nKarat indicates the purity of gold out of 24 parts. 24-karat gold, marked 999, contains approximately 99.9% pure gold. 22-karat gold, marked 916, contains approximately 91.6% pure gold, with the remaining portion comprising other metals that improve its strength and durability. This makes it a suitable choice for jewellery.\n\nAccording to the online store rates provided for Joyalukkas, its gold prices on October 25 are as follows:\n\nBefore buying gold jewellery, consumers should check the jeweller\u2019s latest gold rate and compare prices across brands. The final cost may also include making charges, wastage charges, where applicable, and GST .\n\nSince gold rates change on a daily basis, buyers should confirm the prevailing rate and review the itemised bill before making a purchase.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 04:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Upcoming IPO GMP: EAAA India vs SFC Environmental vs BLS Polymers vs MK Sons Fine Jewels vs Bombay Coated Special Steels", "full_content": "India\u2019s primary market is set for a busy week, with five companies launching their initial public offerings (IPOs) between 26 October and 29 October, aiming to raise nearly \u20b9 2,600 crore. The upcoming issues span alternative investments, polymers, environmental technology, jewellery retail and steel processing, offering investors exposure to a diverse mix of businesses.\n\nEAAA India Alternatives, an arm of Edelweiss Financial Services, will kick off the week with the largest offering, a \u20b9 1,200-crore IPO. SFC Environmental Technologies will follow with a \u20b9 667.53-crore issue, while M.K. Sons Fine Jewels, BLS Polymers and Bombay Coated and Special Steels will also tap the market.\n\nThe issues have different objectives: while some companies are raising fresh capital to fund expansion, working capital and debt repayment, others are offering existing shareholders an opportunity to sell their stakes.\n\nHere\u2019s a closer look at the five IPOs, GMPs, their issue sizes, price bands, subscription dates and use of proceeds.\n\nEAAA India Alternatives IPO GMP today, or grey market premium, is +36. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of EAAA India Alternatives share price was indicated at \u20b9 1,701 apiece, which is 2.16% higher than the IPO price of \u20b9 1,665.\n\nOver the last 3 sessions, the IPO GMP trend has moved downward, declining from \u20b9 121 to \u20b9 36, a decrease of \u20b9 85, according to experts.\n\nEAAA India Alternatives Ltd, an arm of Edelweiss Financial Services, will open its \u20b9 1,200-crore IPO for subscription on 26 October and close on 28 October. The company has fixed a price band of \u20b9 1,585\u2013 \u20b9 1,665 per share, valuing it at \u20b9 10,765 crore at the upper end of the band.\n\nThe IPO is entirely an offer for sale (OFS) by the Edelweiss Group, meaning the company will not receive any proceeds from the issue. The entire amount will go to the selling shareholder.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 04:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Shore Bancshares delivers 84% return after Fair Value signal", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 04:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Liverpool Vs Brighton & Hove Albion Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online In India?", "full_content": "Can Liverpool stop Brighton's winning momentum in the Premier League? The two sides meet at Anfield, and here's a look at the match schedule, team news, probable lineups and live streaming options.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide stock market action on Monday Cyient Share Price Mphasis Share Price L&T Technology Services Share Price Hexaware Technologies Share Price Tata Technologies Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide stock market action on Monday SECTIONS Ahead of Market: 10 things that will decide stock market action on Monday By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 25, 2026, 04:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities fell over 2% last week as rising crude oil prices, FII outflows and geopolitical tensions weighed on sentiment. Broader markets underperformed, while global indices also declined and market breadth strongly favoured bears.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 04:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jio Platforms IPO listing date and time, share price prediction, expected money gains basis GMP, expected m-cap; Details", "full_content": "Jio Platforms IPO listing date and time: The countdown to Jio Platforms initial public offering (IPO) has begun after the conclusion of subscription period over the past week. Backed by Mukesh Ambani\u2019s Reliance Industries Limited, the IPO became India's most subscribed stock offering as it surpassed the 2008 issue of Reliance Power, part of brother Anil's group.\n\nThe Jio Platforms IPO closed for subscription on Friday, and its allotment is likely to be finalised on Monday, October 26, followed by its listing next week. For investors who are closely tracking Jio IPO, here are all the details to know.\n\nThe Jio Platforms IPO will list on NSE and BSE with a tentative listing date fixed as Wednesday, October 28, 2026. Reliance Jio IPO will be listed on exchanges at 10 am.\n\nThe IPO listing process begins with a special pre-open session (SPOS) between 9 am and 9:45 am. The special session will open for
