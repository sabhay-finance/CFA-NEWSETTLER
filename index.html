, 11:44 PM IST", "pub_date_relative": "1m ago"}, {"title": "Health insurance: Sum insured, policy terms, evolving needs - all you need to know before policy renewal", "full_content": "A health insurance policy delivers vital coverage against unexpected injuries and illnesses while offering significant tax benefits. Maintaining continuous coverage requires timely policy renewal; missing the deadline can lead to policy lapse, loss of accumulated benefits, and the re-imposition of waiting periods. While many insurers offer a 15- to 30-day grace period, failing to renew within this window leaves individuals\u2014especially those with existing medical conditions\u2014completely unprotected.\n\nTo maintain effective coverage and avoid unexpected out-of-pocket costs, keep these critical factors in mind during the renewal process:\n\nRetain Proof & Inform Family: Keep a physical or digital copy of the premium payment receipt for your records, and ensure family members are fully aware of the updated terms and renewal status to streamline claim processing during emergencies.\n\nRenewing a health insurance policy on time is essential to maintain continuous financial protection against medical expenses. Timely renewal helps policyholders avoid a break in coverage and preserve applicable continuity benefits.\n\nBefore renewing, policyholders should review whether the existing coverage remains adequate for their current healthcare needs. Key factors to check include the renewal date, sum insured, policy terms and premium payable.\n\nComparing premiums and coverage options available in the market can also help individuals and families assess whether their existing plan continues to meet their requirements. A careful review at renewal can ensure that the policy provides appropriate protection without paying for unsuitable or unnecessary coverage.\n\nFor about a decade, Livemint\u2014News Desk has been a credible source for authentic and timely news, and well-researched analysis on national news, business, personal finance, corporates, politics and geopolitics.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 11:40 PM IST", "pub_date_relative": "5m ago"}, {"title": "Here are 3 alternatives for investors looking to dodge the bond-market beatdown", "full_content": "U.S. stocks have kept chugging higher this year, but bonds haven\u2019t been able to shake off a five-year slump. That has sent some investors interested in a diversified portfolio searching for alternatives.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 11:37 PM IST", "pub_date_relative": "8m ago"}, {"title": "Pete Hegseth reports at least $3.1 million in cash, investments and Bitcoin", "full_content": "Defense Secretary Pete Hegseth reported at least $3.1 million in cash, retirement investments and Bitcoin in his newly released 2025 annual financial disclosure , including more than $1 million held in a single bank account.\n\nThe Office of Government Ethics filings provides the latest look at the finances of the former firebrand Fox News host, who was confirmed as defense secretary in January 2025. Hegseth is currently facing calls to be impeached from members of his own party related to his handling of the war in Iran .\n\nHegseth reported five retirement-fund holdings worth between roughly $500,000 and $1.25 million. His wife, Jennifer Hegseth, reported retirement investments worth roughly $1.55 million to $3.1 million, including broad U.S. stock and small-cap funds .\n\nThe household also reported three cash accounts, including one worth more than $1 million, and Bitcoin valued at between roughly $16,000 and $65,000.\n\nThat's a substantial increase in cash from Hegseth's nominee disclosure from December 2024. At the time, an account listed as \"U.S. bank #2\" held between $15,001 and $50,000. His new filing lists an account under the same description at more than $1 million.\n\nThe disclosure also shows a broad reshuffling of the family's investments after Hegseth joined the administration, typical of new cabinet secretaries to avoid the appearance of conflicts of interest .\n\nHegseth and his family made 16 purchases of exchange-traded funds in 2025 worth between about $1.41 million and $3.05 million, according to a CNBC analysis of the reported ranges.\n\nThose purchases followed sales of dozens of individual stocks, including shares of defense contractors Lockheed Martin and Northrop Grumman , each sold in February for between $1,001 and $15,000. Hegseth's ethics agreement required him to consult with ethics officials over potential conflicts but did not specifically direct him to sell those holdings.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:35 PM IST", "pub_date_relative": "10m ago"}, {"title": "White House allows blocked reporters in after judge lifts Trump ban", "full_content": "The White House on Thursday began readmitting journalists from three media outlets \u2014 MS NOW, CNN and Politico \u2014 after a federal judge temporarily lifted President Donald Trump 's ban on those outlets.\n\nThe move came after Secret Service officers initially barred some journalists from those outlets from entering the White House earlier Thursday despite the order by Judge Timothy Kelly .\n\nKelly ordered Trump and other defendants in a lawsuit by the outlets reply to their new court filing notifying him of non-compliance with his temporary restraining order against the president's ban .\n\nThe White House's director of operations responded to Kelly with a declaration that said the White House had restored press passes to the affected outlets. The outlets by that time had begun reporting that their journalists were being admitted to the White House.\n\nKelly issued his restraining order, which will last for at least 14 days, late Wednesday night. It directed the White House to \"immediately\" restore access to the three outlets.\n\nThe outlets had been blocked from entering the White House since Saturday, a day after Trump announced his ban.\n\nThe president had initially said he was blocking the outlets from the White House because of \"cumulative stories\" that contained lies about him and his administration.\n\nThe outlets in their civil complaint said that statement by Trump, and subsequent ones, bolstered their claim that he was violating their First Amendment rights to a free press by targeting them for what they reported about him.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:32 PM IST", "pub_date_relative": "13m ago"}, {"title": "Analysis: Higher Treasury yields deliver a reality check on a hot, inflation-prone economy", "full_content": "The jump in Treasury yields this week is delivering a reality check about a strong economy, stubborn inflation and the growing cost of the national debt .\n\nThat will put the squeeze on the debt-heavy Trump administration as it tries to find a path forward for the economy.\n\nIt also highlights the tension between the nation's top two economic policymakers. Federal Reserve Chairman Kevin Warsh wants to hear what markets are saying. Treasury Secretary Scott Bessent wants to use his tools to change the message when he believes it's wrong.\n\nBond yields jumped Wednesday, and were trading near multiple-decade highs Thursday , as traders digested surprisingly positive purchasing managers indexes against the backdrop of a Fed that as of last week has started hiking its short-term policy rate. The 2-year Treasury yield rose 10 basis points to 4.87%, while the 10-year Treasury climbed 17 basis points to 5.12% on Thursday morning.\n\nThose yields are extraordinary by recent standards but less so over a longer horizon. The 10-year Treasury averaged about 5.9% from 1990 through 2006, before years of slow growth and usually low interest rates reset Americans' expectations about borrowing costs.\n\nNow the economy looks stronger, propelled in part by a surge in investment in artificial intelligence . Competition for capital has contributed to higher interest rates.\n\nThe boom appears to go deeper. The Census Bureau reported last week that real median household income rose 2.6% to $87,460 and the poverty rate fell by half a percentage point to 10.2%.\n\nThe economy's recent strength has also come on the back of a flood of government deficit spending, driven in part by large tax cuts under the first and second Trump administrations, with Iran war spending piling on. The federal deficit is set to come in above 6% of gross domestic product this year, based on data from the Congressional Budget Office.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:26 PM IST", "pub_date_relative": "19m ago"}, {"title": "3 reasons now is the right time to plan your 2027 summer holiday", "full_content": "It might feel way too early to start thinking about summer vacation. It's not even Thanksgiving, and you may still be figuring out holiday travel plans amid rising fuel prices .\n\nAirline fares have already risen over 23% from last year, according to the most recent consumer price index . If travel prices rise even further, now is an even better time to start thinking about future plans. Travel rewards can be an excellent way to reduce your out-of-pocket expenses, especially for flights and hotels.\n\nOne of the best ways to optimize your points and miles is to plan ahead. You'll need time to accumulate rewards, and you'll generally have more options the farther in advance you book.\n\nIf you're already stressing about how to afford your vacation next summer, here are three ways planning ahead can help.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .\n\nUsing miles, points and cash-back rewards is a great way to save money on travel. For most people, the quickest way to amass a large rewards balance is to earn a welcome bonus from a new credit card.\n\nThe best limited-time welcome offers can be worth thousands of dollars in travel, but you can't just get approved for a card and use the rewards right away. You typically have to meet a minimum spending requirement within a certain amount of time from when you open the card (usually three to six months).\n\nIf you open an airline or travel credit card right now, you could have the bonus miles or points in your account and ready to use by December. Even if you're not ready to apply for a card, now is a great time to start thinking about what card is the best fit for next year's travel plans. Card offers frequently change, and if you know what card you want, you can be prepared to jump on a big offer when it's available.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:26 PM IST", "pub_date_relative": "19m ago"}, {"title": "Fed officials see rates likely rising to curb high inflation", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:20 PM IST", "pub_date_relative": "25m ago"}, {"title": "White House asks OpenAI, Anthropic to hold models from British testers, Politico reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:19 PM IST", "pub_date_relative": "26m ago"}, {"title": "IRDAI commission proposals: Why does Nithin Kamath see regulatory risk as key?", "full_content": "Zerodha founder and CEO Nithin Kamath has renewed his warning that regulatory risk remains the biggest threat for any regulated financial business after the Insurance Regulatory and Development Authority of India (IRDAI) proposed sweeping changes to insurance commission rules.\n\nOn Wednesday, IRDAI issued a consultation paper on \u2018Recalibrating Economics of Insurance Distribution,' setting out a comprehensive framework of reforms covering insurance distribution, its structure, expenses, commissions, market conduct, transparency, and leveraging digital infrastructure.\n\nThe consultation paper proposes different commission limits based on insurance type, product, and distributor, with tied agents allowed higher commissions than other distribution entities.\n\nAlongside the commission caps, IRDAI has proposed a phased reduction in expense-of-management (EoM) limits. For life insurers, the limit would fall to 15% of gross direct premium income within two years and 12.5% within five years. For general insurers, it would decline to 25% within two years and 20% within five years.\n\nThe proposals could particularly affect the NBFC credit-life distribution model. First-year commissions on loan-bundled life cover are proposed at 2-2.5% for distribution entities, compared with effective payouts of about 45% currently, according to the consultation paper.\n\nIRDAI has also proposed prohibiting compulsory bundling of insurance with loans, which could affect policy attachment rates.\n\nReacting to the IRDAI draft, Kamath said, \u201cI keep saying this: for any regulated business, the biggest risk is regulatory risk.\u201d\n\nHe added, \u201cToday's IRDAI draft on insurance commissions is a good reminder.\u201d", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 11:18 PM IST", "pub_date_relative": "26m ago"}, {"title": "Earnings call transcript: Vecima tops revenue forecast in Q4 2026, EPS misses", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:18 PM IST", "pub_date_relative": "27m ago"}, {"title": "White House asks AI firms to delay sharing models with UK - report", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:17 PM IST", "pub_date_relative": "27m ago"}, {"title": "IN8bio at Sidoti Small-Cap Virtual Conference: gamma-delta push", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:17 PM IST", "pub_date_relative": "28m ago"}, {"title": "A new bill in Congress would lower the retirement age to 60. See who would qualify.", "full_content": "A new bill calling for lowering Social Security\u2019s full retirement age from 67 to 60 for workers in physically demanding jobs could put additional strain on the trust fund that backs the system and create a two-tiered system among workers, retirement experts said.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 11:17 PM IST", "pub_date_relative": "28m ago"}, {"title": "Term insurance maths: Forget the 10x rule, here is what you actually need to avoid being underinsured", "full_content": "A term insurance cover of \u20b9 1 crore sounds like a substantial safety net, but the figure alone reveals little about actual family protection. For an individual earning \u20b9 10 lakh annually, the traditional \"10 times income\" rule points to a \u20b9 1 crore policy. However, this simple multiplier ignores crucial realities like home loans, young children, future education expenses, and years of recurring household bills. Financial planners now advise treating the 10x formula merely as a baseline rather than a definitive answer.\n\nTo determine adequate coverage, families must evaluate what funds would be necessary if the primary breadwinner's income vanishes. This comprehensive approach\u2014known as Human Life Value-based planning \u2014evaluates total income, liabilities, future commitments, and net financial contributions.\n\nConsider a 35-year-old earning \u20b9 12 lakh a year with a \u20b9 50 lakh home loan. While a 10x calculation suggests a \u20b9 1.2 crore policy, factoring in future education and loan repayments reveals a major shortfall. Conversely, if a family calculates total obligations at \u20b9 2 crore but holds \u20b9 50 lakh in usable financial assets, their net coverage requirement sits closer to \u20b9 1.5 crore.\n\nTerm insurance requires periodic reassessment rather than a \"set-and-forget\" approach. Key life events\u2014such as marriage, having a child, taking on a new mortgage, securing a major pay raise, or building substantial wealth\u2014warrant an immediate review of your total cover. Ultimately, the right coverage is not the largest policy available, but the exact amount required to settle debts, fund key goals, and seamlessly replace lost income.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 11:16 PM IST", "pub_date_relative": "29m ago"}, {"title": "Rising Treasury yields could push car loan rates higher, experts say. What buyers need to know", "full_content": "With yields on Treasurys continuing to push higher, consumers are likely to see interest rates on their borrowing rise \u2014 including for car loans, experts say.\n\nAcross both short-term and long-term Treasurys, yields have climbed as stronger-than-expected economic data has fueled inflation concerns and expectations that the Federal Reserve could raise interest rates further.\n\nLast week, the central bank's rate-setting committee boosted its federal funds rate \u2014 the rate banks charge one another for overnight lending \u2014 by a quarter-point to a target range of 3.75% to 4.0%. That benchmark can impact the interest rates consumers face when borrowing money, as well as how much their savings can earn.\n\nThe yield on 30-year Treasury bonds reached 5.446% Thursday morning, a level not seen since 2004. The 10-year Treasury note yield \u2014 a benchmark for mortgage rates \u2014 jumped to 5.15%, which was last hit in 2006. The five-year Treasury yield was above 5% in mid-morning trading, which is the highest it's been since 2006.\n\n\"Many auto loan interest rates move with the five-year or 10-year Treasury note. When bond yields are on the rise, we typically see auto loan interest rates move up as well,\" said Patrick Manzi, chief economist for the National Automobile Dealers Association, a trade group that represents auto dealerships.\n\n\"Given the run-up in bond yields recently, we expect that auto loan rates will be increasing as well,\" Manzi said.\n\nFinancing costs have already been edging higher, with loan interest rates for new vehicles rising about 20 basis points over the past two months and rates for used cars up about 10 basis points in that time, Jeremy Robb, chief economist for Cox Automotive, said in a Sept. 21 report .\n\n\"Those moves are unlikely to change the average payment substantially, but they may weigh more on consumer psychology and further discourage big-ticket purchases,\" Robb said.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:15 PM IST", "pub_date_relative": "29m ago"}, {"title": "UPI MDR on loan repayments: What charge applies to EMIs and who bears it? Here's what borrowers need to know", "full_content": "With UPI MDR set to apply from 15 October 2026, the charge will not only apply to spending transactions but also to certain loan repayments and EMI collections.\n\nHowever, the MDR will be levied on the merchant side and not directly on borrowers. For debt collection transactions, including loan repayments and EMI collections, UPI payments above \u20b9 2,000 will attract a flat MDR of \u20b9 5 per transaction.\n\nMukesh Pandey, Founder and MD, Rupyaapaisa.com said the \u20b9 5 MDR applies only to UPI transactions of \u20b9 2,000 and above that fall under debt collection, including repayments of loans taken from NBFCs and other financing sources.\n\nFor example, if a borrower repays an EMI of \u20b9 5,000 or a loan amount of \u20b9 25,000 through a UPI debit transaction, the applicable MDR would be \u20b9 5 per transaction, he said.\n\nThe \u20b9 5 MDR is a charge on the merchant side and should not be assumed to be an additional cost for the borrower. In a normal UPI lending transaction, the lender or the collection agency will pay this fee. For credit card payments, the credit card issuer who receives the payment pays the MDR, Pandey said.\n\n\u201cIn the case of credit card payments, the cost of processing the payment is charged by the merchant bank to the card company,\u201d said Siddharth Maurya, Managing Director, Vibhvangal Anukulara.\n\nThere is a difference between using credit to make a purchase and subsequently repaying the loan or EMI linked to that purchase, Pandey said.\n\nFor example, suppose a consumer buys a TV worth \u20b9 60,000 from an LG store using an EMI loan or credit facility available at the point of sale. The MDR rules would apply to the original \u20b9 60,000 purchase, depending on the payment method used. However, the subsequent \u20b9 5,000 monthly EMI payments will not be subjected to MDR treatment, he explained.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 11:15 PM IST", "pub_date_relative": "30m ago"}, {"title": "Snapdeal parent AceVector raises Rs 189 crore from anchors; Negen, Singularity among top investors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Snapdeal parent AceVector raises Rs 189 crore from anchors; Negen, Singularity among top investors The Economic Times daily newspaper is available online now. Read Today's Paper Snapdeal parent AceVector raises Rs 189 crore from anchors; Negen, Singularity among top investors SECTIONS Snapdeal parent AceVector raises Rs 189 crore from anchors; Negen, Singularity among top investors By Akash Podishetti , ETMarkets.com Last Updated: Sep 24, 2026, 11:14:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a significant move, AceVector, the owner of Snapdeal, has successfully garnered Rs 189 crore from anchor investors for its upcoming IPO, scheduled to open on September 25 with a set price range of Rs 30-32 per share. Major allocations were made to funds like Negen Undiscovered Value Fund and Singularity Growth Opportunities Fund II.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 11:14 PM IST", "pub_date_relative": "30m ago"}, {"title": "New York sues Polymarket U.S., two months after filing lawsuit against Kalshi", "full_content": "New York State filed suit against Polymarket U.S. on Thursday, nearly two months after the state sued the platform's competitor, Kalshi.\n\n\"By skirting New York's laws, Polymarket is targeting the most vulnerable and depriving New York families of critical services and support,\" state Attorney General Letitia James said in a statement.\n\nThe lawsuit claims Polymarket operates an illegal gambling platform and is in violation of state gambling laws, including having no license with the New York State Gaming Commission. The lawsuit further claims Polymarket allows activity by users over 18 and cited a report from the state's Office of Addiction Services and Supports that those between 18 and 24 are at \"high-risk\" of gambling addictions.\n\n\"By running an unlicensed gambling operation, Polymarket has done more than just knowingly violate state law, they have put New Yorkers at risk, especially those underage who are most vulnerable to problem gaming,\" Governor Kathy Hochul said in a statement.\n\nThe lawsuit asks for penalties, including three times the amount of any Polymarket gains, and to pay $100,000 for each attempt or offer of \"sports wagering or mobile sports wagering\" in New York. The lawsuit also asks Polymarket U.S. to provide an account of all trades placed on the platform, the money lost by users and the amount Polymarket U.S. earned.\n\nPolymarket U.S. debuted in December 2025 and is regulated by the Commodity Futures Trading Commission, the federal agency that regulates prediction markets platforms. The company also runs an offshore predictions platform, which was founded in 2020. The CFTC didn't immediately respond to a request for comment.\n\nThe lawsuit is the latest in the escalating regulatory feud between states and the platforms. The CFTC has retaliated, suing several states and asserting it has the right to regulate the markets.\n\nPolymarket defended itself against the latest New York action.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:14 PM IST", "pub_date_relative": "31m ago"}, {"title": "Kolibri Global Energy at Small-Cap Virtual Conference: reserve upside in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:09 PM IST", "pub_date_relative": "36m ago"}], "cfa": [{"title": "S&P 500 falls slightly as rising yields curb optimism over Strait of Hormuz reopening: Live updates", "full_content": "Stocks fell Thursday, as the move higher in yields restrained any optimism following a report of the U.S. and Iran potentially reaching a deal to reopen the Strait of Hormuz.\n\nThe S&P 500 dipped 0.1%, while the Nasdaq Composite lost 0.2%. The Dow Jones Industrial Average dropped 162 points, or 0.3%.\n\nStocks came off their session lows after Reuters, citing sources, reported that U.S. and Iranian negotiators in New York are considering a deal that would bring a phased end to the conflict in the Middle East, whereby Iran would reopen the Strait of Hormuz and the U.S. would lift its economic blockade on Tehran.\n\nBut any gains were restricted by the move higher in oil prices and bond yields. International Brent crude futures rose 2% to around $105 a barrel, while West Texas Intermediate crude gained 2% to around $94.\n\nMeanwhile, the 30-year Treasury bond yield touched 5.446%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.15%, near levels not reached since July 2007. The 2-year note yield was flat on the day, but scaled to a 2023 high earlier in the week.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a 66% likelihood that the Federal Reserve lifts its key rate once more in October, per the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face higher borrowing costs at a time when they're already paying more in fuel costs.\n\nYet, Wednesday's readings from S&P Global's manufacturing and services purchasing managers' indexes suggested that U.S. businesses are continuing to boom.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:44 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Health insurance: Sum insured, policy terms, evolving needs - all you need to know before policy renewal", "full_content": "A health insurance policy delivers vital coverage against unexpected injuries and illnesses while offering significant tax benefits. Maintaining continuous coverage requires timely policy renewal; missing the deadline can lead to policy lapse, loss of accumulated benefits, and the re-imposition of waiting periods. While many insurers offer a 15- to 30-day grace period, failing to renew within this window leaves individuals\u2014especially those with existing medical conditions\u2014completely unprotected.\n\nTo maintain effective coverage and avoid unexpected out-of-pocket costs, keep these critical factors in mind during the renewal process:\n\nRetain Proof & Inform Family: Keep a physical or digital copy of the premium payment receipt for your records, and ensure family members are fully aware of the updated terms and renewal status to streamline claim processing during emergencies.\n\nRenewing a health insurance policy on time is essential to maintain continuous financial protection against medical expenses. Timely renewal helps policyholders avoid a break in coverage and preserve applicable continuity benefits.\n\nBefore renewing, policyholders should review whether the existing coverage remains adequate for their current healthcare needs. Key factors to check include the renewal date, sum insured, policy terms and premium payable.\n\nComparing premiums and coverage options available in the market can also help individuals and families assess whether their existing plan continues to meet their requirements. A careful review at renewal can ensure that the policy provides appropriate protection without paying for unsuitable or unnecessary coverage.\n\nFor about a decade, Livemint\u2014News Desk has been a credible source for authentic and timely news, and well-researched analysis on national news, business, personal finance, corporates, politics and geopolitics.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 11:40 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Here are 3 alternatives for investors looking to dodge the bond-market beatdown", "full_content": "U.S. stocks have kept chugging higher this year, but bonds haven\u2019t been able to shake off a five-year slump. That has sent some investors interested in a diversified portfolio searching for alternatives.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 11:37 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Pete Hegseth reports at least $3.1 million in cash, investments and Bitcoin", "full_content": "Defense Secretary Pete Hegseth reported at least $3.1 million in cash, retirement investments and Bitcoin in his newly released 2025 annual financial disclosure , including more than $1 million held in a single bank account.\n\nThe Office of Government Ethics filings provides the latest look at the finances of the former firebrand Fox News host, who was confirmed as defense secretary in January 2025. Hegseth is currently facing calls to be impeached from members of his own party related to his handling of the war in Iran .\n\nHegseth reported five retirement-fund holdings worth between roughly $500,000 and $1.25 million. His wife, Jennifer Hegseth, reported retirement investments worth roughly $1.55 million to $3.1 million, including broad U.S. stock and small-cap funds .\n\nThe household also reported three cash accounts, including one worth more than $1 million, and Bitcoin valued at between roughly $16,000 and $65,000.\n\nThat's a substantial increase in cash from Hegseth's nominee disclosure from December 2024. At the time, an account listed as \"U.S. bank #2\" held between $15,001 and $50,000. His new filing lists an account under the same description at more than $1 million.\n\nThe disclosure also shows a broad reshuffling of the family's investments after Hegseth joined the administration, typical of new cabinet secretaries to avoid the appearance of conflicts of interest .\n\nHegseth and his family made 16 purchases of exchange-traded funds in 2025 worth between about $1.41 million and $3.05 million, according to a CNBC analysis of the reported ranges.\n\nThose purchases followed sales of dozens of individual stocks, including shares of defense contractors Lockheed Martin and Northrop Grumman , each sold in February for between $1,001 and $15,000. Hegseth's ethics agreement required him to consult with ethics officials over potential conflicts but did not specifically direct him to sell those holdings.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:35 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "White House allows blocked reporters in after judge lifts Trump ban", "full_content": "The White House on Thursday began readmitting journalists from three media outlets \u2014 MS NOW, CNN and Politico \u2014 after a federal judge temporarily lifted President Donald Trump 's ban on those outlets.\n\nThe move came after Secret Service officers initially barred some journalists from those outlets from entering the White House earlier Thursday despite the order by Judge Timothy Kelly .\n\nKelly ordered Trump and other defendants in a lawsuit by the outlets reply to their new court filing notifying him of non-compliance with his temporary restraining order against the president's ban .\n\nThe White House's director of operations responded to Kelly with a declaration that said the White House had restored press passes to the affected outlets. The outlets by that time had begun reporting that their journalists were being admitted to the White House.\n\nKelly issued his restraining order, which will last for at least 14 days, late Wednesday night. It directed the White House to \"immediately\" restore access to the three outlets.\n\nThe outlets had been blocked from entering the White House since Saturday, a day after Trump announced his ban.\n\nThe president had initially said he was blocking the outlets from the White House because of \"cumulative stories\" that contained lies about him and his administration.\n\nThe outlets in their civil complaint said that statement by Trump, and subsequent ones, bolstered their claim that he was violating their First Amendment rights to a free press by targeting them for what they reported about him.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:32 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Analysis: Higher Treasury yields deliver a reality check on a hot, inflation-prone economy", "full_content": "The jump in Treasury yields this week is delivering a reality check about a strong economy, stubborn inflation and the growing cost of the national debt .\n\nThat will put the squeeze on the debt-heavy Trump administration as it tries to find a path forward for the economy.\n\nIt also highlights the tension between the nation's top two economic policymakers. Federal Reserve Chairman Kevin Warsh wants to hear what markets are saying. Treasury Secretary Scott Bessent wants to use his tools to change the message when he believes it's wrong.\n\nBond yields jumped Wednesday, and were trading near multiple-decade highs Thursday , as traders digested surprisingly positive purchasing managers indexes against the backdrop of a Fed that as of last week has started hiking its short-term policy rate. The 2-year Treasury yield rose 10 basis points to 4.87%, while the 10-year Treasury climbed 17 basis points to 5.12% on Thursday morning.\n\nThose yields are extraordinary by recent standards but less so over a longer horizon. The 10-year Treasury averaged about 5.9% from 1990 through 2006, before years of slow growth and usually low interest rates reset Americans' expectations about borrowing costs.\n\nNow the economy looks stronger, propelled in part by a surge in investment in artificial intelligence . Competition for capital has contributed to higher interest rates.\n\nThe boom appears to go deeper. The Census Bureau reported last week that real median household income rose 2.6% to $87,460 and the poverty rate fell by half a percentage point to 10.2%.\n\nThe economy's recent strength has also come on the back of a flood of government deficit spending, driven in part by large tax cuts under the first and second Trump administrations, with Iran war spending piling on. The federal deficit is set to come in above 6% of gross domestic product this year, based on data from the Congressional Budget Office.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:26 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "3 reasons now is the right time to plan your 2027 summer holiday", "full_content": "It might feel way too early to start thinking about summer vacation. It's not even Thanksgiving, and you may still be figuring out holiday travel plans amid rising fuel prices .\n\nAirline fares have already risen over 23% from last year, according to the most recent consumer price index . If travel prices rise even further, now is an even better time to start thinking about future plans. Travel rewards can be an excellent way to reduce your out-of-pocket expenses, especially for flights and hotels.\n\nOne of the best ways to optimize your points and miles is to plan ahead. You'll need time to accumulate rewards, and you'll generally have more options the farther in advance you book.\n\nIf you're already stressing about how to afford your vacation next summer, here are three ways planning ahead can help.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .\n\nUsing miles, points and cash-back rewards is a great way to save money on travel. For most people, the quickest way to amass a large rewards balance is to earn a welcome bonus from a new credit card.\n\nThe best limited-time welcome offers can be worth thousands of dollars in travel, but you can't just get approved for a card and use the rewards right away. You typically have to meet a minimum spending requirement within a certain amount of time from when you open the card (usually three to six months).\n\nIf you open an airline or travel credit card right now, you could have the bonus miles or points in your account and ready to use by December. Even if you're not ready to apply for a card, now is a great time to start thinking about what card is the best fit for next year's travel plans. Card offers frequently change, and if you know what card you want, you can be prepared to jump on a big offer when it's available.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:26 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fed officials see rates likely rising to curb high inflation", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:20 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IRDAI commission proposals: Why does Nithin Kamath see regulatory risk as key?", "full_content": "Zerodha founder and CEO Nithin Kamath has renewed his warning that regulatory risk remains the biggest threat for any regulated financial business after the Insurance Regulatory and Development Authority of India (IRDAI) proposed sweeping changes to insurance commission rules.\n\nOn Wednesday, IRDAI issued a consultation paper on \u2018Recalibrating Economics of Insurance Distribution,' setting out a comprehensive framework of reforms covering insurance distribution, its structure, expenses, commissions, market conduct, transparency, and leveraging digital infrastructure.\n\nThe consultation paper proposes different commission limits based on insurance type, product, and distributor, with tied agents allowed higher commissions than other distribution entities.\n\nAlongside the commission caps, IRDAI has proposed a phased reduction in expense-of-management (EoM) limits. For life insurers, the limit would fall to 15% of gross direct premium income within two years and 12.5% within five years. For general insurers, it would decline to 25% within two years and 20% within five years.\n\nThe proposals could particularly affect the NBFC credit-life distribution model. First-year commissions on loan-bundled life cover are proposed at 2-2.5% for distribution entities, compared with effective payouts of about 45% currently, according to the consultation paper.\n\nIRDAI has also proposed prohibiting compulsory bundling of insurance with loans, which could affect policy attachment rates.\n\nReacting to the IRDAI draft, Kamath said, \u201cI keep saying this: for any regulated business, the biggest risk is regulatory risk.\u201d\n\nHe added, \u201cToday's IRDAI draft on insurance commissions is a good reminder.\u201d", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 11:18 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Earnings call transcript: Vecima tops revenue forecast in Q4 2026, EPS misses", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:18 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IN8bio at Sidoti Small-Cap Virtual Conference: gamma-delta push", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:17 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Rising Treasury yields could push car loan rates higher, experts say. What buyers need to know", "full_content": "With yields on Treasurys continuing to push higher, consumers are likely to see interest rates on their borrowing rise \u2014 including for car loans, experts say.\n\nAcross both short-term and long-term Treasurys, yields have climbed as stronger-than-expected economic data has fueled inflation concerns and expectations that the Federal Reserve could raise interest rates further.\n\nLast week, the central bank's rate-setting committee boosted its federal funds rate \u2014 the rate banks charge one another for overnight lending \u2014 by a quarter-point to a target range of 3.75% to 4.0%. That benchmark can impact the interest rates consumers face when borrowing money, as well as how much their savings can earn.\n\nThe yield on 30-year Treasury bonds reached 5.446% Thursday morning, a level not seen since 2004. The 10-year Treasury note yield \u2014 a benchmark for mortgage rates \u2014 jumped to 5.15%, which was last hit in 2006. The five-year Treasury yield was above 5% in mid-morning trading, which is the highest it's been since 2006.\n\n\"Many auto loan interest rates move with the five-year or 10-year Treasury note. When bond yields are on the rise, we typically see auto loan interest rates move up as well,\" said Patrick Manzi, chief economist for the National Automobile Dealers Association, a trade group that represents auto dealerships.\n\n\"Given the run-up in bond yields recently, we expect that auto loan rates will be increasing as well,\" Manzi said.\n\nFinancing costs have already been edging higher, with loan interest rates for new vehicles rising about 20 basis points over the past two months and rates for used cars up about 10 basis points in that time, Jeremy Robb, chief economist for Cox Automotive, said in a Sept. 21 report .\n\n\"Those moves are unlikely to change the average payment substantially, but they may weigh more on consumer psychology and further discourage big-ticket purchases,\" Robb said.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:15 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Snapdeal parent AceVector raises Rs 189 crore from anchors; Negen, Singularity among top investors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Snapdeal parent AceVector raises Rs 189 crore from anchors; Negen, Singularity among top investors The Economic Times daily newspaper is available online now. Read Today's Paper Snapdeal parent AceVector raises Rs 189 crore from anchors; Negen, Singularity among top investors SECTIONS Snapdeal parent AceVector raises Rs 189 crore from anchors; Negen, Singularity among top investors By Akash Podishetti , ETMarkets.com Last Updated: Sep 24, 2026, 11:14:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a significant move, AceVector, the owner of Snapdeal, has successfully garnered Rs 189 crore from anchor investors for its upcoming IPO, scheduled to open on September 25 with a set price range of Rs 30-32 per share. Major allocations were made to funds like Negen Undiscovered Value Fund and Singularity Growth Opportunities Fund II.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 11:14 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "New York sues Polymarket U.S., two months after filing lawsuit against Kalshi", "full_content": "New York State filed suit against Polymarket U.S. on Thursday, nearly two months after the state sued the platform's competitor, Kalshi.\n\n\"By skirting New York's laws, Polymarket is targeting the most vulnerable and depriving New York families of critical services and support,\" state Attorney General Letitia James said in a statement.\n\nThe lawsuit claims Polymarket operates an illegal gambling platform and is in violation of state gambling laws, including having no license with the New York State Gaming Commission. The lawsuit further claims Polymarket allows activity by users over 18 and cited a report from the state's Office of Addiction Services and Supports that those between 18 and 24 are at \"high-risk\" of gambling addictions.\n\n\"By running an unlicensed gambling operation, Polymarket has done more than just knowingly violate state law, they have put New Yorkers at risk, especially those underage who are most vulnerable to problem gaming,\" Governor Kathy Hochul said in a statement.\n\nThe lawsuit asks for penalties, including three times the amount of any Polymarket gains, and to pay $100,000 for each attempt or offer of \"sports wagering or mobile sports wagering\" in New York. The lawsuit also asks Polymarket U.S. to provide an account of all trades placed on the platform, the money lost by users and the amount Polymarket U.S. earned.\n\nPolymarket U.S. debuted in December 2025 and is regulated by the Commodity Futures Trading Commission, the federal agency that regulates prediction markets platforms. The company also runs an offshore predictions platform, which was founded in 2020. The CFTC didn't immediately respond to a request for comment.\n\nThe lawsuit is the latest in the escalating regulatory feud between states and the platforms. The CFTC has retaliated, suing several states and asserting it has the right to regulate the markets.\n\nPolymarket defended itself against the latest New York action.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:14 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "RedBird Capital to acquire majority stake in Puck at $250 million valuation, memo says", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 11:07 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wall Street Rebounds: S&P 500 Erases Its Decline On Hormuz Deal Hopes", "full_content": "The S&P 500 erased its decline after Reuters reported that US and Iranian negotiators are exploring a phased path out of war that would involve Tehran reopening the waterway and Washington lifting its economic blockade.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 11:05 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "BNP Paribas Taps Google For AI But Draws A Firm Line At Highly Confidential Customer Data", "full_content": "BNP Paribas will use Google's public cloud and Gemini models for AI agents while keeping highly confidential data outside public cloud and retaining on-premises infrastructure.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 11:02 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "As bond rout worsens, a trade Wall Street uses to replace them booms in popularity", "full_content": "If the U.S. Treasury bond market has 99 problems, the surge in popularity of a particular type of options trade may be the one that gets talked about the least. The options strategy, commonly referred to as a \"box spread,\" combines four options at two strike prices: one bullish call spread and one bearish put spread \u2014 mostly on the S&P 500 Index \u2014 to create a market-neutral position whose price at execution becomes cash received by the seller, or borrower, and whose fixed value at expiration is the total amount received by the buyer, or lender. The difference between the two represents the \"interest\" paid to the lender. It's as close to risk-free income as the derivatives market has to offer, with a bonus: because it's an equity-derivative product, it falls under the lower tax category of capital gains versus interest income. The value of open box-trade loans on S&P 500 options hit an all-time high of $146 billion last Friday, according to Cboe Global Markets data compiled for CNBC. Average daily notional value traded was more than $2.3 billion last month, up 26% from a year ago, with retail traders accounting for $54 million on a daily basis. Right now S&P box spreads yield an income of more than 4.4% using contracts expiring in three months. That compares to under 4 percent in three-month Treasuries and about a 3.9% overnight SOFR rate.\n\n\"We've seen an uptick in use by ETF sponsors, wealth advisors, and even some larger retail accounts who have found the effective interest rates beat their alternatives on both the lending and borrowing side,\" Henry Schwartz, VP of Derivatives Market Intelligence, said in an email. Once considered a clever but complex strategy reserved for high-end institutional clients and the biggest banks, the trade has gone mainstream as exchange-traded-funds package the trade into their low-cost vehicles and the investing public and advisors get more comfortable with options-based strategies.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 11:00 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SEBI launches portfolio managers route for mutual funds: Here's what the new \u20b925 lakh PRIM route means for investors", "full_content": "SEBI has approved a new route allowing portfolio managers to build portfolios using mutual funds, ETFs, index funds and SIFs. With a minimum investment of \u20b925 lakh, PRIM could offer investors a professionally managed alternative to investing directly in mutual funds.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 10:49 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Global bond selloff deepens, as US 30-year yields hit highest since 2004 - Reuters", "full_content": "Global bond selloff deepens, as US 30-year yields hit highest since 2004 Reuters S&P 500 bounces slightly on report U.S. and Iran discussing reopening of Strait of Hormuz: Live updates CNBC U.S. 30-year Treasury yield hits highest since 2004 qz.com Bond Markets Are Volatile and Oil Prices Rise The New York Times Stock Market Today: Dow, S&P 500 and Nasdaq fall as investors anticipate further Fed rate hikes; 10-year Treasury yield remains above 5%; Trump meets with Xi MarketWatch", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 10:46 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "24 Sep 2026, 11:45 PM IST", "total_stories": 400};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
