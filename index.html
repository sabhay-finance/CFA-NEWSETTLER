a new Sukanya Samriddhi Account (SSA) in her name. Furthermore, do remember, the account may be opened anytime from the birth of the girl child until she attains the age of 10 years. As per the rules, an account can be opened by a guardian only if the girl child has not attained the age of 10 years on the date of account opening.\n\nKeeping these important points and aspects in mind, let us discuss the salient features of the Sukanya Samriddhi Yojana in order to better equip aspiring investors and help them make meaningful investment decisions.\n\nThis is yet another important question that needs clarification. Be clear, turning 10 does not close or invalidate an existing Sukanya Samriddhi Account. If the account was initially opened before the girl\u2019s 10th birthday, it can continue to run normally under the scheme\u2019s rules .", "source": "LiveMint Money", "pub_date_str": "30 Aug 2026, 11:12 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Upcoming IPOs: Purple Style Labs IPO, Deepa Jewellers IPO among 7 new issues to open next week; full list here", "full_content": "Upcoming IPOs: The Indian primary market is all set to witness another busy week as seven new initial public offerings (IPOs) are scheduled to open for subscription in the coming week.\n\nThree mainboard IPOs - Purple Style Labs IPO, Deepa Jewellers IPO and Rays of Belief IPO - will collectively raise over \u20b9 1,265 crore next week. Meanwhile, in the small and medium enterprise (SME) segment, four new IPOs - Phychem Technologies IPO, Shanti Inorganics IPO, Ashutosh Fibre IPO, and Farm Peace IPO - will open for bidding.\n\nApart from new IPOs, the market will also witness eight new mainboard IPOs make their stock market debut in the upcoming week. The remaining three companies whose IPOs are currently open for subscription will conclude their offerings next week ahead of their stock market listings.\n\nPurple Style Labs IPO will open for subscription on August 31 and remain open until September 2. The public issue is a book-built offering worth \u20b9 680 crore and comprises an entirely fresh issue of 1.18 crore shares. The price band for the IPO has been fixed at \u20b9 546\u2013 \u20b9 575 per share.\n\nRays of Belief IPO will be open for subscription from September 1 to September 3. The \u20b9 125 crore public issue is entirely a fresh issue comprising 0.52 crore shares. The company has fixed the IPO price band at \u20b9 227\u2013 \u20b9 239 per share.\n\nDeepa Jewellers IPO will open for subscription on September 1, 2026, and remain open until September 3, 2026. The \u20b9 459.72-crore public issue is a book-built offering comprising a fresh issue of 1.41 crore shares worth \u20b9 250 crore and an offer for sale (OFS) of 1.18 crore shares aggregating \u20b9 209.72 crore. The IPO has fixed a price band of \u20b9 168 to \u20b9 177 per share.\n\nAshutosh Fibre IPO will open for subscription on August 31 and remain open until September 2. The \u20b9 56.35-crore public issue is a book-built offering comprising an entirely fresh issue of 61.25 lakh shares.", "source": "LiveMint Markets", "pub_date_str": "30 Aug 2026, 12:40 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bitcoin consolidates at $78K between key MAs: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Aug 2026, 12:32 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "NSE IPO: SBI, Subsidiary To Dilute 1% Stake In Proposed Rs 30,000-Crore Public Issue", "full_content": "The bank is participating in the NSE IPO and will dilute a 0.65% stake in the exchange, SBI Chairman C S Setty told PTI in an interview.", "source": "NDTV Profit", "pub_date_st  scheme? Is it 10 years? If yes, can I apply for the scheme even though my daughter has already turned 10?\n\nThe answer to these questions is that if your daughter has already turned 10, you are not permitted to open a new Sukanya Samriddhi Account (SSA) in her name. Furthermore, do remember, the account may be opened anytime from the birth of the girl child until she attains the age of 10 years. As per the rules, an account can be opened by a guardian only if the girl child has not attained the age of 10 years on the date of account opening.\n\nKeeping these important points and aspects in mind, let us discuss the salient features of the Sukanya Samriddhi Yojana in order to better equip aspiring investors and help them make meaningful investment decisions.\n\nThis is yet another important question that needs clarification. Be clear, turning 10 does not close or invalidate an existing Sukanya Samriddhi Account. If the account was initially opened before the girl\u2019s 10th birthday, it can continue to run normally under the scheme\u2019s rules .", "source": "LiveMint Money", "pub_date_str": "30 Aug 2026, 11:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mcap Of Seven Of Top-10 Most-Valued Firms Erodes Rs 1.13 Lakh Crore; Airtel, RIL Worst Hit", "full_content": "The valuation of Bharti Airtel tumbled Rs 40,500.85 crore to Rs 11,74,462.30 crore. Reliance Industries' valuation eroded Rs 40,056.32 crore to reach Rs 17,38,119.27 crore.", "source": "NDTV Profit", "pub_date_str": "30 Aug 2026, 11:04 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Corporate actions this week: NTPC, Coal India among nearly 90 cos set to hit record dates for dividend payouts, bonus issues & stock splits", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Corporate actions this week: NTPC, Coal India among nearly 90 cos set to hit record dates for dividend payouts, bonus issues & stock splits Coal India Share Price NMDC Share Price KIOCL Share Price Gujarat Mineral Development Corporation Share Price Sandur Manganese & Iron Ores Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Corporate actions this week: NTPC, Coal India among nearly 90 cos set to hit record dates for dividend payouts, bonus issues & stock splits SECTIONS Corporate actions this week: NTPC, Coal India among nearly 90 cos set to hit record dates for dividend payouts, bonus issues & stock splits By Debaroti Adhikary , ETMarkets.com Last Updated: Aug 30, 2026, 11:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nearly 90 companies, including NTPC, Coal India and Oil India, have scheduled record dates for dividends, bonus issues and stock splits from August 31 to September 4. Investors must hold the respective shares as of the record date to qualify. Mastek, Glenmark Pharma and Triveni Engineering are among Monday\u2019s stocks, with several companies announcing dividends for shareholders.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Aug 2026, 10:56 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dividend Stocks To Watch: Coal India, NTP, ONGC, Shipping Corp, Gail, Glenmark Pharma, Mastek And 82 Others; Check Full List", "full_content": "To be eligible for these payouts, investors must be mindful of the ex-dividend date, which is the day the share price adjusts to reflect the upcoming dividend.", "source": "NDTV Profit", "pub_date_str": "30 Aug 2026, 10:31 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Just bought your dream house? Here is the ultimate post-home-buying checklist \u2014 From spare keys to unrecorded ownership", "full_content": "You\u2019ve signed the endless stack of papers, posed for the mandatory photo with the keys, and finally unlocked the door to your dream home. Time to celebrate, right? Not quite yet.\n\nWhile property registration feels like the finish line, it\u2019s actually just the beginning, according to a viral real estate post. Before you start picking out curtain colours or planning the housewarming party, there is a crucial post-possession checklist you need to tackle.\n\nFrom hidden spare keys to unrecorded ownership, Gurugram-based real estate firm Shail Homes shared what new owners must do immediately to truly secure their new investment.\n\nThe very first step before moving in is to change the main door lock. You never know who\u2014previous owners, brokers, or contractors\u2014might still have a spare key.\n\nDo not wait for the first bill to arrive. Transfer the electricity and water connections immediately to get all utility bills updated in your legal name.\n\nProperty registration is not enough in many Indian states. Apply for property mutation at the local municipal corporation to ensure the property is recorded under your name in the government's revenue records.\n\nIf you have purchased an apartment in a gated community, secure a Society Transfer & No Objection Certificate (NOC). This ensures your ownership is officially updated in the housing society's internal records.\n\nProtect yourself from unexpected financial liabilities. Ensure the previous owner has cleared all pending dues, including:", "source": "LiveMint Money", "pub_date_str": "30 Aug 2026, 10:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buy or sell: Ganesh Dongre of Anand Rathi recommends 3 stocks to buy on Monday - 31 August 2026", "full_content": "Indian stock market : Indian equity markets ended the week on a cautious footing, extending their recent correction amid concerns over global interest-rate trends, geopolitical uncertainties and volatility linked to the introduction of the new Closing Auction Session. While a sharp recovery on Friday, led by strong buying in IT stocks on the back of positive global technology cues, offered some relief, the benchmark indices remained in the red for the third consecutive week.\n\nOver the week, the Nifty slipped around 0.31% to end at 24,175.65, while the Sensex declined nearly 0.36% to close at 77,264.51. The broader market, however, showed greater resilience, with the Midcap and Smallcap indices advancing approximately 0.52% and 0.51%, respectively.\n\n\u201cThe Nifty closed the week at 24,175, loosing 0.23% , while the Bank Nifty ended at 57,496, loosing 0.46% for the week. Sectoral performance remained broadly positive, with Metal, Information Technology and Pharma emerging as the key outperformers, each gaining nearly 4% during the week. Overall, buying interest was visible across most sectors, indicating that market breadth and investor participation remained supportive,\u201d said Ganesh Dongre, Senior Manager of Technical Research at Anand Rathi.\n\nAccording to Dongre, derivative positioning suggests a relatively defined trading range for the Nifty for the coming expiry week. On the Put side, the highest Put OI is concentrated at 24,000, followed by 23,900, while on the Call side, the highest Call OI is visible at 24,500, followed by 24,600. This positioning indicates that the Nifty could remain range-bound between 23,900 and 24,600 during the week. A sustained move above 24,600, accompanied by Call unwinding and fresh long buildup, could improve short-term momentum and pave the way for further upside.", "source": "LiveMint Markets", "pub_date_str": "30 Aug 2026, 10:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Car insurance expiry soon? Here's all you need to know about renewal before you miss out on 'No Claim Bonus' benefits", "full_content": "To maintain coverage and protect No Claim Bonus, vehicle owners should renew their insurance before expiry since delayed renewal can lead to financial repercussions. Timely renewal safeguards against untoward accidents.", "source": "LiveMint Money", "pub_date_str": "30 Aug 2026, 10:05 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nordic American Tankers earnings beat by $0.08, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Aug 2026, 09:42 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Weak September rains could push FY27 inflation to 5.5% or higher: Report", "full_content": "India's inflation outlook hinges critically on September rainfall performance. A monsoon shortfall could push inflation to 5.5 percent or     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
