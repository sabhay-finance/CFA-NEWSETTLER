s in happy relationships know what the other one is really going through, week after week. The unhappy ones have often slipped into a kind of parallel coexistence, where they share a home and a calendar and not much else.\n\nThat difference can be built or lost in moments that may feel too small to matter. I call them \"reentry moments.\"\n\n\"Reentry moments\" are the first minute or two when a couple comes back together after time apart. These reunions follow any period of temporary physical separation, whether that's a workday, a weekend away with friends or a four-day work trip.\n\nLet's say your wife mentioned in the morning that she had a presentation that day. You get home and see her, as usual, with her laptop on the couch. You ask her, \"How was your presentation?\"\n\nShe stops typing, sets the laptop on the coffee table and tells you that no one really responded to it, and just thanked her and moved on. She spent the rest of her afternoon turning the presentation over in her head, trying to figure out what went wrong.\n\nConnecting as soon as you reunite keeps you from misreading each other. If your wife is still thinking about the presentation and you ask whether she booked the rental car for your trip next week, the annoyance in her response can sound like annoyance with you. You might snap back, and now you're arguing about the rental car when neither of you cares about it.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 08:06 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Hornbeck earnings up next: First test for Helix merger", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 08:05 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hub Group earnings up next: Can intermodal rebound offset woes?", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 08:05 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ITC Q2 results 2026 preview: Will cigarette business drive growth? Profit, revenue expectations - share price target", "full_content": "ITC Q2 results 2026 preview: Shares of ITC Limited will remain in focus on Monday, as the FMCG major is set to announce its second quarter results for the financial year 2026-27 tomorrow. Its FMCG business may see double digit EBIT growth with flat margins, and cigarette business is expected to decline, according to experts.\n\nITC share price closed marginally higher on Friday, October 30. The FMCG stock has delivered 3.27% return in one week, but it has declined 27% in 2026 so far. As all eyes will be on ITC Q2 results tomorrow, here\u2019s what to expect from the FMCG giant.\n\nITC may see 7% revenue growth during the quarter under review, whereas EBITDA may decline 24%, affected by weaker margins across segments, according to HDFC Securities report.\n\n\u201cWe see EBIT margin to remain stressed. We see consolidated segment EBIT to see 20% decline YoY,\u201d stated the brokerage in its report. The consumer goods giant may see double digit decline in its adjusted profit after tax (PAT)\n\nIts FMCG business is expected to post healthy growth, highlighted Motilal Oswal Financial Services Limited (MOFSL) in its report, modelling 14% revenue growth in the segment.\n\nThe Kolkata-headquartered conglomerate is likely to witness 74% growth in cigarette gross revenue, which is likely to lead to 20% decline in net sales (after surge in excise), noted HDFC Securities in its report, highlighting its expectation of 7% decline in volume growth in the segment.\n\n\u201cThe company has achieved 75-80% price hikes, which is likely to help company achieve EBIT/Stick neutrality. The company has also series of new product launches to address volume. We see EBIT margin to remain stressed. We see consolidated segment EBIT to see 20% decline YoY.\u201d\n\nAccording to the MOFSL report, ITC\u2019s cigarette business revenue is expected to decline 22%, and volume is anticipated to decline 8% on an annual basis.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 08:03 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why AI is boosting Meta's ad business while hurting Google search", "full_content": "Google and Facebook have dominated the internet for the past two decades, turning billions of eyeballs into trillions in advertising dollars over that stretch. But with the ChatGPT era altering how consumers engage online, the companies are diverging.\n\nIn the third quarter , Meta's ad business grew more than twice as quickly as Google's Search and other unit, backing up Mark Zuckerberg's claim that his company's investments in artificial intelligence are leading to better targeting tools for brands to promote goods and services across Facebook and Instagram.\n\nGoogle's problem is that chatbots are becoming an alternative to search, leading consumers to click far fewer blue links and hurting Google's ad revenue. Anthropic's Claude chatbot and Meta's recently launched Muse assistant are adding to the mix. Meanwhile, users are spending more time scrolling on Instagram, giving Meta more advertising opportunities.\n\n\"It's a double-edged sword, because as AI revolutionizes discovery, people might come across tools they like better than Google,\" Nate Elliott, an analyst covering AI at Emarketer, told CNBC in an email. \"If ChatGPT or Claude or Muse is better at helping them find what they're looking for, people's search habits might change for the first time in a generation. That's potentially catastrophic for Google's ad business.\"\n\nMeta's ad revenue rose 26% in the quarter to $63.1 billion, up from $ 50.1 billion a year earlier, compared with 12% growth for Google's search division, which brought in $63.4 billion. That 14-point growth gap is the widest in Meta's favor since 2021, and it puts the two businesses neck and neck by size, though Google got an additional $11 billion in third-quarter revenue from YouTube.\n\nFollowing its disappointing third-quarter earnings report on Wednesday, Alphabet had its worst day ever on the stock market, plunging more than 12% and wiping out about $500 billion in market cap.", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 08:01 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NordFX Launches Oil Loss Insurance for New Brent and WTI Traders", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 07:32 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Midterm US elections, earnings, jobs data loom for AI-wary stock market", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Nov 2026, 07:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This is the biggest threat to the AI-powered bull market", "full_content": "Blockbuster earnings growth has helped to power the stock market higher in 2026. In 2027, that engine might stall.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Nov 2026, 07:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cash rewards coming? PFC, CONCOR, RITES, to Sonata- These firms to announce dividend with Q2 results 2026 this week", "full_content": "At least 20 companies are scheduled to report Q2FY27 results this week, alongside dividend announcements. Companies to watch include Power Finance Corporation, CONCOR, RITES, Sonata Software, NLC India, Aurobindo Pharma and Emami.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 07:03 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Sebi to delist penny stocks: Market regulator plans AI-based surveillance of such firms", "full_content": "The Securities and Exchange Board of India plans to delist companies that have no economic activity. This move aims to protect investors, especially those investing in penny stocks. The regulator highlights the potential dangers posed by such inactive companies in the market. Additionally, Sebi intends to announce compliance requirements for foreign institutional investors soon.", "source": "Economic Times Economy", "pub_date_str": "01 Nov 2026, 06:49 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Companies promised AI gains \u2014 here's how the payoff showed up in earnings", "full_content": "Santander, Novartis and other companies say AI is beginning to boost revenue, cut costs or improve profitability as investors seek returns.", "source": "CNBC World Economy", "pub_date_str": "01 Nov 2026, 06:04 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crocs stock jumped 25% after earnings. Here's why that might be just the beginning", "full_content": "Since CNBC flagged Crocs' depressed valuation on Oct. 13, the stock has surged 30%, fueled by a massive 25.5% post-earnings rally on Thursday.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 06:02 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The midterm election could reshape the muni bond market. Here\u2019s what investors need to know", "full_content": "The 2026 election could affect municipal bonds through state tax measures, new bond supply and the makeup of Congress.", "source": "CNBC Top News", "pub_date_str": "01 Nov 2026, 06:00 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Sun Pharma shares gain despite Q2 profit slips 36% YoY | Should you buy, sell or hold? What brokerage says, target price", "full_content": "Sun Pharma shares rose 0.87% despite a 36.4% year-on-year drop in September-quarter net profit to \u20b91,988.5 crore. Revenue increased 11.9% to \u20b916,198.7 crore, driven by India and innovative medicines, while exceptional US litigation and Organon acquisition costs weighed on earnings.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 05:41 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tax twist for OMC stocks: Indian Oil, BPCL, HPCL shares in 2 Nov focus after this decision by Govt on petrol, diesel", "full_content": "Shares of IOCL, BPCL and HPCL may remain in focus after the government raised export duties on diesel and aviation turbine fuel while cutting the petrol export levy to zero for the fortnight starting October 31.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 05:41 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US critical minerals push delivers a gold rush \u2014 for Washington lobbyists", "full_content": "Billions in government backing have produced a flurry of deals but little increase in domestic production", "source": "FT Markets", "pub_date_str": "01 Nov 2026, 05:30 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Sensex and Nifty ended the week up about 0.5%, supported by resilient large-cap, IT and healthcare stocks. However, midcap and smallcap indices fell as much as 2% amid rising crude oil prices, inflation concerns and a global technology sell-off.", "source": "Economic Times Markets", "pub_date_str": "01 Nov 2026, 05:16 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "From Wall Street to D-Street: What history suggests for S&P 500 returns, impact on India stock market, Sensex, Nifty", "full_content": "Emkay expects the 2026 US midterms to have limited direct impact on US-India relations, with trade and immigration frictions likely to persist. For Indian markets, oil, the dollar, and US bond yields matter more; renewed tensions with Iran could lift oil prices and pressure the rupee and equities.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 04:54 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "A big sell-off collides with more Big Tech earnings and a midterm election: What to watch this week - Yahoo Finance", "full_content": "A big sell-off collides with more Big Tech earnings and a midterm election: What to watch this week Yahoo Finance A Stock Market Smackdown Week: Elections, Jobs Data, Iran And Earnings Investor's Business Daily Investors trim growth bets over fears of US economy\u2019s AI exposure Financial Times Cramer\u2019s week ahead: Expect more volatility as tech earnings, midterms loom CNBC Midterm US elections, earnings, jobs data loom for AI-wary stock market By Reuters Investing.com", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 04:30 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI stocks just lost $5 trillion \u2014 but history says the stock market's sweetest stretch starts now - Yahoo Finance", "full_content": "AI stocks just lost $5 trillion \u2014 but history says the stock market's sweetest stretch starts now Yahoo Finance AI Investors Are Racing to Get Insurance on the Biggest Market Bet in History WSJ Wall Street scrambles for protection as AI investment risks mount (XLK:NYSEARCA) Seeking Alpha AI investors rush to hedge against potential tech market downturn - WSJ Investing.com US MARKET CALL: AI Spooking Investors Yardeni QuickTakes", "source": "Google News Business", "pub_date_str": "01 Nov 2026, 04:30 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Equity Investments"], "exam_ ver losses, while industry partners froze some funds.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 03:15 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why your idle cash is quietly losing its value: Here's how to beat Inflation and get out of stagnant, low-interest traps", "full_content": "With inflation at 5.8%, savings accounts paying 2.7% to 3% lose purchasing power, despite growing balances. Keep three to six months of essential expenses accessible, then consider diversified investments for longer-term goals.&nbsp;", "source": "LiveMint Money", "pub_date_str": "01 Nov 2026, 03:15 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dividend stocks, bonus shares, split, buyback issues in Nov 2026: Coal India, HUL, Infosys, Power Grid, others | List", "full_content": "Upcoming record dates: November 2026 brings a busy calendar of corporate actions, with companies including Coal India, Infosys, Hindustan Unilever and Power Grid setting record dates. Investors will also watch market performance after the Nifty 50 and Sensex rose in October.", "source": "LiveMint Markets", "pub_date_str": "01 Nov 2026, 03:11 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Festive-season clean-up: how to declutter your mutual fund and stock portfolio", "full_content": "Too many funds and stocks can make investments harder to track and manage. Here\u2019s how to weed out overlapping and underperforming holdings, rebalance your portfolio and keep your financial goals on track.", "source": "LiveMint Money", "pu     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
