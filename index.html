ia on Sunday, calling it a business decision aimed at growing sales and reducing exposure to U.S. tariffs.\n\nThe plant, set to be Audi's first in the U.S., was announced Saturday by President Donald Trump during a rally in Georgia, near where the Volkswagen -owned luxury brand plans to build the new SUV-producing facility.\n\n\"We have significantly greater ambitions for Audi in America,\" Audi CEO Gernot Dollner said during a media roundtable Sunday. \"The United States is the second largest premium market in the world, and today we are not fully exploiting this potential. We are changing that.\"\n\nThe announcement comes amid an intense restructuring of its VW parent company, including plans to cut 50,000 jobs and close four German plants , including an Audi facility, between 2031 and \u200b2034.\n\nDollner, who joined Trump at the rally, said the decision for a plant in the U.S. was years in the making, with more than 70 locations evaluated over \"many months\" and \"intense\" negotiations with public officials.\n\n\"This is not a decision against Germany. Germany remains the backbone of Audi,\" Dollner said. \"We develop our cars here. Our technologies are created here, and Georgia does not take any task away from us in Germany.\"\n\nDollner said localized production is the best decision for the brand, which has struggled in sales this decade amid rising operational costs and Trump's tariffs on vehicles from Germany and other countries into the U.S. Current tariffs on vehicles from Germany are 15%, down from 25%.\n\nLast year, U.S. tariffs cost Audi 1.2 billion euros ($1.4 billion), as it imports all its vehicles for the U.S. market from Europe or Mexico.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 10:12 PM IST", "pub_date_relative": "24m ago"}, {"title": "A Veteran of the Telecom Bust Navigates the AI Boom - WSJ", "full_content": "A Veteran of the Telecom Bust Navigates the AI Boom WSJ", "source": "Google News Business", "pub_date_str": "25 Oct nezuela's opposition leader Machado returns after months in exile, as doubts over democracy deepen", "full_content": "Opposition leader and Nobel laureate Mar\u00eda Corina Machado reappeared in Venezuela Sunday for the first time since December, about a month before the U.S. military deposed the country's then-President Nicol\u00e1s Maduro.\n\nMachado announced her arrival on social media, writing, \"I am here. With you.\"\n\nMeanwhile, Venezuela's opposition leader Edmundo Gonzalez wrote on X, confirming Machado's arrival and saying he would be next to her \"very soon.\"\n\n\"Today is a very important day for Venezuelans. Our sovereign voice returns with her to lead and guide this process!\" he wrote. \"You know it, this is until the end.\"\n\nMachado's homecoming, after more than 10 months in exile, comes as doubts about Venezuela's democratic future \u2014 and the U.S.'s role in it \u2014 deepen.\n\nSince Maduro's ouster, acting President Delcy Rodr\u00edguez, a longtime Maduro ally who received the Trump administration's blessing to succeed him, has run Venezuela.\n\nRodr\u00edguez has exceeded the time she was authorized to serve as acting president following Maduro's capture and no election is scheduled.\n\nMachado went into hiding in Venezuela for 11 months after being briefly detained following a protest in January 2025. After a clandestine escape, she reappeared in Norway that December, where she was awarded the Nobel Peace Prize for her peaceful challenge to Maduro's authoritarian government.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 09:49 PM IST", "pub_date_relative": "48m ago"}, {"title": "F1 US GP Final Race Live Streaming: When And Where To Watch In India", "full_content": "Max Verstappen starts alongside Kimi Antonelli on the front row, while George Russell and Lewis Hamilton will also have a key role in the championship battle in Texas.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h  company has announced \u20b9 9.50 per equity share payout. The stock closed marginally lower at \u20b9 590.70 per share on BSE on Friday.\n\nL&T Technology Services (LTTS)\u2019s board of directors has approved \u20b9 20 per equity share dividend and has fixed October 27 as the record date. The stock closed 1.10% lower at \u20b9 3910.6 per share on Friday.\n\nThe company has fixed October 30 as the record date for its \u20b9 0.25 per equity share dividend payout. The stock closed 5% lower at \u20b9 167.35 per share on BSE on Friday.\n\nCyient Limited has announced \u20b9 12 per equity share dividend for FY27 and has fixed October 28 as the record date for the payout. Its share price value closed 7.40% higher at \u20b9 1229.25 per share on BSE on Friday.\n\nIt announced \u20b9 0.15 per equity share dividend and fixed October 30 as the record date. Sagility share price closed 2.97% lower at \u20b9 44.10 per share on BSE on Friday.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 08:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Does enough capital exist to finance everyone\u2019s ambitious AI spending plans?", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 08:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tier-4 Security, Zero Third-Party Cloud: RBI Chief Explains How New Hub Fortifies India's Banking", "full_content": "RBI Governor Sanjay Malhotra says the central bank\u2019s new Bhubaneswar institute will train bank employees and financial sector professionals in cybersecurity as AI, quantum computing and other emerging technologies reshape digital risks.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Very high\u2019 expectations from India-EU FTA, says Rotterdam port chief", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a \u2018Very high\u2019 expectations from India-EU FTA, says Rotterdam port chief The Economic Times daily newspaper is available online now. Read Today's Paper \u2018Very high\u2019 expectations from India-EU FTA, says Rotterdam port chief SECTIONS \u2018Very high\u2019 expectations from India-EU FTA, says Rotterdam port chief ET Online Last Updated: Oct 25, 2026, 08:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Boudewijn Siemons, CEO of the Port of Rotterdam, expressed high expectations for the India-EU free trade agreement. He highlighted the importance of collaboration between ports and nations to facilitate global trade. Siemons conveyed his optimism about increased business opportunities between Europe and India. Negotiations for the free trade agreement have concluded, with hopes to sign it by year-end. The implementation of the agreement is anticipated for next year.\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "25 Oct 2026, 08:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "Barcelona Vs Real Madrid El Clasico: Yamal, Mbappe Face Off Before Ballon d'Or Ceremony", "full_content": "Barcelona host Real Madrid on Sunday as Yamal and Mbappe look to make their mark ahead of the Ballon d'Or gala in London.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Indian Bank hikes interest rates on special-tenure fixed deposits \u2014 check how much 555-day and 777-day FDs are offering", "full_content": "Public-sector lender Indian Bank has increased interest rates by 15 basis points each on two of its special fixed deposit (FD) schemes, with the revised rates taking effect from Friday, October 23, 2026.\n\nThe new rates apply to its 555-day Ind Grow and 777-day Ind Prosper deposits, offering customers higher returns on their investments. Meanwhile, the bank's offered interest rates on other listed tenures remain unchanged.\n\nIndian Bank's decision to raise interest rates on its fixed deposits comes after the Reserve Bank of India (RBI) on October 7, raised repo rate by 25 bps to 5.50% from 5.25%, marking the first such increase since February 2023.\n\nFollowing the revision, the annual interest rate on the 555-day Ind Grow deposit has been raised to 6.80% from 6.65%. Meanwhile, the annual rate on the 777-day Ind Prosper scheme has been increased to 6.75% from 6.60%.\n\nIndian Bank offers senior citizens an additional 0.5 percentage point and super senior citizens an additional 0.75 percentage point over the applicable interest rates for general customers on these special deposits.\n\nThese additional benefits can make the special fixed deposit schemes attractive to older depositors seeking predictable returns. However, they should also consider the deposit tenure, premature withdrawal rules and tax implications.\n\nBoth Ind Grow and Ind Prosper are special-tenure deposit schemes, which are meant for depositors looking to keep their money invested for a fixed period. You can choose between the two by assessing how long you can set aside your savings and whether you may require the funds before maturity.\n\nPremature withdrawal from special-tenure FDs may be allowed if it is callable, in which the bank may apply a penalty and recalculate interest based on the period for which the deposit remained open. Meanwhile, non-callable FDs generally place stricter limits on early withdrawal.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 08:29 PM IST", "pub_date_relative": "2h ago"}, {"title": "Here are 4 big things we're watching in the stock market this week", "full_content": "Peak earnings season, plus a Fed meeting and fresh inflation data.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 08:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "Exclusive | JetBlue Creditors Hire Advisers as Airline\u2019s Shares, Bonds Sink - WSJ", "full_content": "Exclusive | JetBlue Creditors Hire Advisers as Airline\u2019s Shares, Bonds Sink WSJ JetBlue Lenders Organize After Stock, Debt Fall to Record Lows Bloomberg.com JetBlue creditors hire bankruptcy advisers as debt concerns grow TheStreet Is JetBlue Airways (JBLU) Cheap After New Loyalty Partnerships And A 43% Undervalued View? Simply Wall Street JetBlue Airways Corp. stock underperforms Thursday when compared to competitors MarketWatch", "source": "Google News Business", "pub_date_str": "25 Oct 2026, 08:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "'Wars Not Just Fought With Weapons': PM Modi Warns Of Economic Warfare At RBI's Date Centre Launch", "full_content": "The facility in Odisha will host critical payment and settlement systems, while a dedicated cybersecurity institute will focus on training, research and technology capabilities.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:04 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin steadies near $80,400 after weekend selloff, Fed decision looms", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 08:02 PM IST", "pub_date_relative": "2h ago"}, {"title": "Trade Setup For Oct. 26: Nifty Support Slips To 22,500 As Brent Crude Spike Prevents Upside \u2014 Key Levels", "full_content": "Nifty continues to trade comfortably below its crucial moving averages. The daily RSI is also declining and approaching the key 40 mark, which could further weaken the momentum if breached, according to analysts. With the benchmark index showing signs of renewed weakness, all eyes are now on the crucial support levels that could determine the extent of the next move.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:01 PM IST", "pub_date_relative": "2h ago"}, {"title": "My spouse was awarded $90,000 from my 401(k) in our divorce. How is that fair?", "full_content": "\u201cI retired in 2020 and subsequently went through a divorce a few years later.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 08:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Carney\u2019s energy ambitions boosted by Conservative victory in British Columbia", "full_content": "Party leader wants to end emissions limits and replace province\u2019s carbon tax framework", "source": "FT Markets", "pub_date_str": "25 Oct 2026, 07:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "I Leased A Kia EV6 For $137 A Month, And I Still Went EV After Incentives Disappeared - Jalopnik", "full_content": "I Leased A Kia EV6 For $137 A Month, And I Still Went EV After Incentives Disappeared Jalopnik", "source": "Google News Business", "pub_date_str": "25 Oct 2026, 07:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Reliance\u2019s Jio Platforms IPO allotment on Mon, Oct 26: What happens to your money if you get none, one or many lots?", "full_content": "Jio IPO allotment on October 26: Jio Platforms saw bumper response, with the issue subscribed more than 22 times. As the Mukesh Ambani's Reliance Industries Limited (RIL)-backed Jio IPO witnessed record bidding, let\u2019s understand different possible allotment scenarios for investors who applied for more lots. What happens if you are allotted multiple lots, just one or none?\n\nThere are a lot of chances that investors may end up receiving no lots of Jio IPO, given its oversubscription. In case of allotment of zero lots, the entire amount blocked in your account for Jio IPO will be completely unblocked and no money will be deducted.\n\nFor investors who receive allotment of a single lot, the exact amount required for one lot will be debited from your bank account. Jio Platforms IPO has fixed issue price band at \u20b9 1,065 to \u20b9 1,119 per share.\n\nOne lot consists of 12 shares of an issue. Hence, the minimum amount required by an investor to apply for a Jio IPO lot is \u20b9 13,428 (considering its upper price band). Which means that an amount of \u20b9 13,428 will be deducted from the bank account if one lot is allotted.\n\nIt is very unlikely for investors to receive multiple lots of Jio IPO as the issue was oversubscribed by a significant number. Under the retail category, investors can apply for 14 lots, ie \u20b9 1,87,992. Investors can also apply through Reliance Industries Limited (RIL) shareholders quota and employee quota too.\n\nJio Platforms IPO\u2019s latest grey market premium (GMP) stood at \u20b9 248 at 6:37 pm on Sunday, as per media reports. Considering its upper price band mark, Jio IPO\u2019s estimated listing price is likely to stand near \u20b9 1367 per share (which is the sum of upper price band and latest GMP). The issue is likely to be listed on exchanges on Wednesday, October 28.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 07:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "In pictures: Initially peaceful protests across France over inequality again descend into violence", "full_content": "Mostly peaceful protests across France over a worsening cost-of-living crisis and growing inequality descended into violence for a second straight weekend.\n\nFrance's Interior Ministry said 410,000 people took part in protests in several major cities, including Paris.\n\nAfter rioters set fire to the historic city hall in Limoges and looters smashed supermarkets and luxury boutiques in Lyon last weekend, French authorities greatly stepped up security ahead of Saturday's protests.\n\nIn Paris on Saturday, riot police fired tear gas and water cannon to disperse a group of around 500 hooded youths who hurled stones at officers, Reuters quoted a security official as saying.\n\nIn France's second city, Marseille, youths dragged large metal sheets to block a street, set fire to rubbish bins, and hurled rocks and bottles at riot police. The confrontations continued after sunset, and police said looters raided two jewelry shops, according to a Reuters report.\n\nClashes also flared in Lyon, Bordeaux and Grenoble, while police fired volleys of tear gas at demonstrators in Clermont-Ferrand, Lille, Nantes and Nice, according to the agency.\n\nHowever, the violence was still less intense than a week ago, when looters and vandals went on the rampage in a number of French cities.\n\nThe demonstrations began last month as a group of high school students in suburban Paris lamented poor school conditions, including teacher shortages and unsatisfactory facilities. The demonstrations have since grown and evolved into nationwide protests.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 07:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bertie fights off the song of turbo-charged returns", "full_content": "It had been borne in upon Bertie on countless occasions that a phone call from his winsome private banker Natasha was a prelude to poor investment decisions, and yet he always answered. Our man evidently lacked Odysseus\u2019s resolve to tie himself to his ship\u2019s mast in order not to fall prey to the sirens\u2019 song.\n\n\u201cHello sir! How are you? Long time\u201d. Natasha began in her lilting sales voice. Bertie realised how scores of sailors who got shipwrecked on the island of the sirens must have felt. One knew that the song was pulling one towards one\u2019s certain demise but it was so alluring that one still steered towards it. \u201cAm good, Natasha. How have you been?\u201d Bertie attempted his formal voice.\n\n\u201cWhen can I come over, Bert? Let us review your portfolio na.\u201d Natasha continued. \u201cWe have some great new products which you will love\u201d. Bertie could see the rocks on the jagged coastline but he was no longer in charge of the words emanating from his mouth. \u201cNext week. Fat Cats Club.\u201d\n\n\u201cSure sir. Can\u2019t wait\u201d Natasha hung up. Bertie imagined her doing the not-so-nice Leonardo DiCaprio gesture from Wolf of Wall Street after he had hung up on a naive client.\n\nAt Fat Cats Club the following week, Bertie looked at his portfolio returns and discovered a new meaning of the word \u2018equity\u2019\u2014everything was equally bad. He feebly vocalised this concern: \u201cThis is bad, Natasha\u201d.\n\n\u201cBut you know how the markets have been na. Who better than you to know it? Everybody in our office loves to hear your market views.\u201d Natasha had pulled a clever one. She had not only wrapped the stench of bad returns in a bouquet of flattery but also managed to deflect the blame for poor returns to Bertie.\n\n\u201cSo, what now?\u201d asked a troubled Bertie, gazing at Natasha with hopeful eyes.\n\nShe had a twinkle in her eye as if she was going to pull out a black rabbit from her expensive handbag. \u201cWe have just the thing,\u201d she said.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 07:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Cities cannot be governed from state capitals, need empowered local governments: NITI Aayog's Rajiv Gauba", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Cities cannot be governed from state capitals, need empowered local governments: NITI Aayog's Rajiv Gauba The Economic Times daily newspaper is available online now. Read Today's Paper Cities cannot be governed from state capitals, need empowered local governments: NITI Aayog's Rajiv Gauba SECTIONS Cities cannot be governed from state capitals, need empowered local governments: NITI Aayog's Rajiv Gauba ANI Last Updated: Oct 25, 2026, 07:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Rajiv Gauba emphasized the need for reforms in urban governance during the National Urban Conclave. He highlighted the importance of empowering city governments and proposed directly elected mayors for better governance. The projected increase in India's urban population demands significant infrastructure and service management changes. Gauba called for improved municipal revenues and the adoption of the Model Tenancy Act to support affordable housing.\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Oct 2026, 07:34 PM IST", "pub_date_relative": "3h ago"}, {"title": "I paid off $11,000 of credit card debt in 18 months while still traveling, shopping and living my life", "full_content": "Yes, I am a personal finance reporter with over seven years of experience telling readers how to wisely manage their money. Yes, I've also been in credit card debt for basically all of that time.\n\nI have carried a balance on one or more credit cards for nearly all of the 10 years I have had credit cards. Sometimes, especially in the early years when I was still a college student, I did not have the cash on hand to pay it all off. Most of the time, however, I just didn't have the discipline.\n\nI was making more than the minimum payment every month, but I also felt like credit card debt was normal so I didn't make a concerted effort to fully clear my balance. I assumed when my peers were putting things on credit , they too, weren't paying it off right away, though many of them actually were.\n\nI did get my cards paid off for a brief period in 2020 when I put my Covid-19 stimulus checks toward my debt. But then I got a dog, moved into my own apartment and continued traveling and spending at levels I felt were manageable. Soon I was carrying a balance again and that balance gradually grew to a peak of $11,310 in March 2025.\n\nBut as of Sept. 18, I am credit card debt-free. Here's how I racked up five figures of debt and paid it all off in under two years.\n\nMy debt came from a mix of genuine necessities and trivial pursuits. I charged vet bills and supplies for my dog but also flights and hotels for trips whenever I felt like I could afford them, and treated myself to dinner or a new outfit admittedly too often. Instead of intentionally making payments to bring down the balance, I'd often use so-called \" girl math \" to justify my continued card usage.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Lecce vs Juventus Live Streaming: When And Where To Watch Serie A Match Live In India", "full_content": "Juventus face a tricky away test against Lecce as they aim to get their Serie A campaign back on track. Check when and where to watch the match live in India.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "\u2018She\u2019s living the dream\u2019: My stepmother said I can buy my childhood home for $850,000. Is she taking advantage of me?", "full_content": "\u201cMy late father bought our house for $250,000 in the 1990s.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "More than a third of S&P 500 companies are about to report earnings as market confidence cracks", "full_content": "\u201cWith cautious to negative market sentiment, it could be a tricky week,\u201d one strategist says.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "These Mini Power Plants Aim to Make Green Fuel, Using the Air Around Them - WSJ", "full_content": "These Mini Power Plants Aim to Make Green Fuel, Using the Air Around Them WSJ", "source": "Google News Business", "pub_date_str": "25 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "My husband wants to sell our $1.5 million home and invest the proceeds. But this is where we raised our kids \u2014 and I can\u2019t bear to leave.", "full_content": "\u201cHe wants to buy something for $600,000 now that we are empty-nesters.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 07:15 PM IST", "pub_date_relative": "3h ago"}, {"title": "Saudi Arabia says it intercepted missiles and drones from Iran-backed Houthis", "full_content": "Saudi Arabia intercepted drones and missiles headed for several cities, including the capital Riyadh, fired by Iran -aligned Houthis on Sunday, the Saudi-led coalition in Yemen said.\n\nThe ongoing fighting between Saudi Arabia and the Yemen-based Houthis, combined with remarks by President Donald Trump last week suggesting that the U.S. and Israel are planning fresh strikes on Iran after the Nov. 3 midterm elections, drove oil prices to a six-month high Friday.\n\nThe official Saudi Press Agency quoted the spokesperson of the Saudi-led Coalition to Restore Legitimacy in Yemen, Turki Al-Maliki, as saying two drones and a ballistic missile were \"intercepted and destroyed\" as they headed toward Riyadh.\n\nThe agency quoted Al-Maliki as saying that 10 ballistic missiles launched by the Houthis toward the southern region of Saudi Arabia were also intercepted, as was a cruise missile headed for the city of Khamis Mushait.\n\nThe Houthis said in a Telegram post that they \"carried out seven qualitative military operations using a number of ballistic missiles and drones.\"\n\nThe targets included Riyadh's King Khalid International Airport and oil giant Saudi Aramco's facilities in Yanbu on Saudi Arabia's west coast as well as other airports and energy installations around the country, the Houthis said.\n\nKing Khalid International Airport said in a notice to travelers that it was resuming operations Sunday, using its Terminal 1 for domestic flights and Terminal 2 for overseas routes.\n\nThe airport suspended operations on Oct. 10 following a strike that killed at least 13 people and injured around 300 others, making it the deadliest attack on Saudi Arabia in more than a decade.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 07:11 PM IST", "pub_date_relative": "3h ago"}, {"title": "7 Kirkland Signature Cheeses To Buy At Costco And 3 To Skip - The Takeout", "full_content": "7 Kirkland Signature Cheeses To Buy At Costco And 3 To Skip The Takeout", "source": "Google News Business", "pub_date_str": "25 Oct 2026, 07:10 PM IST", "pub_date_relative": "3h ago"}, {"title": "Ranabaali Box Office Collection Day 10: Vijay Deverakonda Starrer Holds Strong In Week 2, Nears Rs 55 Crore", "full_content": "Ranabaali earns Rs 2.48 crore on Day 10 so far, taking its India gross collection to Rs 53.30 crore. The Vijay Deverakonda starrer records 30.9% occupancy across 1,480 shows.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:09 PM IST", "pub_date_relative": "3h ago"}, {"title": "'He Knew Me So Well\u2019: Anil Kapoor Gets Emotional As Gagan Reminds Him Of Satish Kaushik On India Ke Top 1%", "full_content": "Anil Kapoor got emotional after meeting Gagan, a contestant who resembles late actor Satish Kaushik. The actor recalled his close bond with Kaushik, their dream of playing twin brothers and his memorable role as Calendar in Mr India.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:09 PM IST", "pub_date_relative": "3h ago"}, {"title": "France Reports First Ever Human Case Of Shamonda Virus: Public Risk, Symptoms Explained", "full_content": "The virus, previously detected in animals, has been linked to the death of an immunocompromised man in his 60s. The WHO says further investigations are underway, with no evidence of human-to-human transmission.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:08 PM IST", "pub_date_relative": "3h ago"}, {"title": "Should you travel together? Ask these questions before booking: 'It'll save you time, money and disappointment'", "full_content": "Blow-up fights at the Colosseum, tears atop Mount Kilimanjaro and clashes over the window seat: Incompatible travel buddies can ruin a vacation.\n\nAs experts in friendship , travel and decision-making , we know that the stresses and complications of travel, not to mention the near-infinite number of decisions you have to make, can put a lot of pressure on a relationship that was perfectly delightful within a 10-mile radius of your homes. There's a reason that people tell you to travel with someone before you marry them!\n\nThirty-five percent of travelers found that they weren't compatible with a travel buddy, according to a Booking.com survey conducted in July of 1,253 U.S. adults who'd gone away overnight within the last 12 months. Twenty-one percent of respondents had even left a trip part-way through because of their travel partner, and a bad vacation made 28% think about ending the relationship or friendship with their ill-suited travel companion.\n\nThe problem is that we can have different, unsaid expectations of what a getaway might entail: Does one person want every day booked dawn-to-dusk with activities, while the other wants to lounge in the hotel spa until cocktail hour? Does someone want to go all out with seafood towers and Champagne, while the rest of the group prefers to nosh on convenience store hot dogs and guzzle local beer?\n\nNot every friend, romantic partner or family member is the right travel partner for you. And it'll save you time, money and disappointment to figure that out before you plan your itinerary.\n\nWe've created a quiz to help you quickly determine compatibility with your prospective travel partner so you can sidestep potential headaches down the line.\n\nStart with the basics. Some of us can conk out in the middle of the nightclub; others need a white noise machine, blackout curtains and a room to ourselves.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 07:08 PM IST", "pub_date_relative": "3h ago"}, {"title": "Central government pensioners await DR hike as Bharat Pensioners Samaj seeks cabinet secretary\u2019s intervention", "full_content": "Central government pensioners and family pensioners are awaiting the announcement of the latest dearness relief (DR) hike, with the Bharat Pensioners Samaj (BPS) urging the government to expedite the decision and release the pending instalment.\n\nIn a letter dated October 22, 2026, Avinash Rajput, secretary general of BPS, requested the Cabinet secretary to intervene and direct the Department of Pension and Pensioners\u2019 Welfare (DoPPW) and the Department of Expenditure (DoE), under the Ministry of Finance, to announce and release the pending DR instalment at the earliest.\n\n\u201cThe delay has caused disappointment and uncertainty among pensioners, particularly elderly and financially dependent pensioners who look forward to this additional amount to meet their household and medical expenses,\u201d the letter stated.\n\nBPS claims to represent around one million central government pensioners.\n\nIn its letter, the pensioners\u2019 organisation said that retirees had expected the DR hike announcement before Dussehra, which fell on October 21.\n\nThe organisation highlighted that the festive season generally brings additional household and family expenses, making the timely release of enhanced dearness relief particularly important for pensioners.\n\n\u201cDearness relief is not a bonus or a discretionary favour; it is an essential adjustment intended to mitigate the impact of rising prices on the fixed incomes of pensioners. Timely disbursement is, therefore, important for their financial security and peace of mind,\u201d said the BPS.\n\nBPS has requested the Cabinet secretary to take up the matter with the concerned departments and ensure the early announcement and disbursement of the pending DR instalment, along with arrears, to pensioners and family pensioners.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 07:07 PM IST", "pub_date_relative": "3h ago"}, {"title": "Govt Extends Deadlines For Corporates To File Annual Financial Statements For FY26: Check New Date", "full_content": "The Ministry of Corporate Affairs has extended the deadline for FY26 financial statement filings to December 31 and annual returns to January 31, 2027. Companies can use the revised timelines without paying additional filing fees.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:07 PM IST", "pub_date_relative": "3h ago"}, {"title": "'Next Up, Rs 4,500 Belan?' Harsh Goenka's Hilarious Take On IKEA's Rs 760 Chic Chrome Steel Thali", "full_content": "Harsh Goenka pokes fun at the premium positioning of everyday Indian household products after a US influencer describes IKEA's stainless-steel plates as \u201cchic chrome\u201d tableware.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:04 PM IST", "pub_date_relative": "3h ago"}, {"title": "Stock market prediction for Monday Oct 26: Sensex, Nifty levels, top stocks to watch - Will bulls dance again?", "full_content": "Stock market outlook this week: The Nifty 50 fell nearly 2% last week, snapping its two-week winning streak as geopolitical tensions and volatility in Brent crude oil prices kept investors on edge. The decline took the index\u2019s year-to-date (YTD) losses to nearly 13.56%, putting it on track for its worst annual performance in over a decade.\n\nNifty 50 closed 0.39% lower at 22,600 points on Friday, with Nifty Bank declining 1.10%. Nifty Midcap Select fell close to 2.20% on Friday. BSE Sensex was down 0.17% at 73,123.83 points. As we head for a new week, let\u2019s understand whether bulls will stage a comeback on Dalal Street or bears will continue to drag Nifty and Sensex lower.\n\nThe Nifty 50 declined nearly 2.36% last week and moved closer to its 200 weeks exponential moving average (EMA). The overall technical structure remains weak, with selling pressure visible across sectors except IT, highlighted Dr. Ravi Singh, Chief Research Officer from Master Capital Services Ltd.\n\n\u201cImmediate support is placed near 22300, and a decisive breakdown below this zone could trigger further selling towards 22000, a key psychological support level. On the upside, the 22850-22900 zone remains a crucial resistance area, coinciding with the 21 days EMA. As long as the index trades below this hurdle, the strategy remains sell on rise, with recovery attempts facing sustained selling pressure,\u201d explained Ravi.\n\nNifty 50 has formed a bearish candle with a long lower shadow indicating continuation of the corrective decline for the fourth session in a row.\n\nThe benchmark equity index has retraced 80% of its previous six sessions up move, highlighted Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking, adding that a follow through weakness below 22,372 will open downside towards the current month low of 22,180.\n\n\u201cIndex holding above last week's low of 22,372 will lead to consolidation in the range of 22,370-22,850 in the coming week.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 07:02 PM IST", "pub_date_relative": "3h ago"}, {"title": "Ramayana 'Mangal Rang\u2019 X Reviews: 'Pure Magic' To 'Soulful Fans Hail Ranbir-Sai Chemistry And A.R. Rahman\u2019s Music", "full_content": "Mangal Rang has received positive reactions from fans, who called it \u201cpure magic\u201d and \u201ceasily the best song\u201d from Ramayana. Viewers also praised Ranbir Kapoor-Sai Pallavi\u2019s chemistry and Arijit Singh-Shreya Ghoshal\u2019s soulful vocals.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:01 PM IST", "pub_date_relative": "3h ago"}, {"title": "SC Freiburg Vs Bayern Munich Live Streaming: Likely Lineups; How To Watch Bundesliga Match On TV, Online?", "full_content": "Can SC Freiburg end Bayern Munich\u2019s dominance? Harry Kane and co. face a crucial Bundesliga test Away From Home.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:00 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "We have a $300,000 mortgage with a 2.75% interest rate. I want to pay it off. My husband says I\u2019m crazy. Who\u2019s right?", "full_content": "\u201cI don\u2019t want to enter retirement owing six figures when we have the cash to clear it.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 10:30 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PSU Q2 results 2026 preview: BEL, Coal India, IGL - Earnings estimate, brokerage target price, returns potential", "full_content": "PSU Q2 results 2026 preview: Shares of multiple Public Sector Undertakings (PSUs), including, Bharat Electronics , Coal India , and Indraprastha Gas Limited (IGL) will remain in focus this week due to their upcoming company earnings for the second quarter of financial year 2026-27.\n\nFor investors who closely track PSU Q2 results 2026, here is a closer look to their earnings preview, target price, returns potential.\n\nBharat Electronics LImited (BEL)\u2019s board of directors meeting will be held on Friday, October 30. The defence PSU is expected to see revenue growth of around 16% on an annual basis, led by the healthy execution of the opening order book of \u20b9 720 billion, according to Motilal Oswal Financial Services Limited (MOFSL).\n\nLarge orders including QRSAM, Uttam radars, next-gen corvettes, P75I, submarines, etc, will be key monitorables. \u201cWe expect margins to fall by 170bp YoY to ~27.7%, due to execution of a changing product mix,\u201d read Motilal Oswal report.\n\nMotilal Oswal gave \u2018Buy\u2019 rating for the stock with a target price of \u20b9 530 per share, indicating a 38% upside potential. BEL share price closed 1.88% lower at \u20b9 360.10 per share on BSE on Friday.\n\nCoal India\u2019s board of directors meeting is fixed for Thursday, October 29, 2026. The PSU\u2019s coal production is likely to remain muted due to seasonal weakness. Strong e-auction premium amid global uncertainty will also impact Q2 earnings.\n\nVolume offtake post-monsoon will be key monitorable, as per Motilal Oswal Financial Services Limited.\n\nThe PSU stock closed 1.08% lower at \u20b9 397.75 per share on BSE on Friday. Motilal Oswal gave a \u2018Buy\u2019 rating to the stock with a target price of \u20b9 500 per share, indicating 18% upside potential.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 10:18 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Audi defends plans for a $4 billion Georgia plant amid VW restructuring, tariffs", "full_content": "DETROIT \u2014 Audi's CEO defended the carmaker's plans for a new $4 billion plant in Georgia on Sunday, calling it a business decision aimed at growing sales and reducing exposure to U.S. tariffs.\n\nThe plant, set to be Audi's first in the U.S., was announced Saturday by President Donald Trump during a rally in Georgia, near where the Volkswagen -owned luxury brand plans to build the new SUV-producing facility.\n\n\"We have significantly greater ambitions for Audi in America,\" Audi CEO Gernot Dollner said during a media roundtable Sunday. \"The United States is the second largest premium market in the world, and today we are not fully exploiting this potential. We are changing that.\"\n\nThe announcement comes amid an intense restructuring of its VW parent company, including plans to cut 50,000 jobs and close four German plants , including an Audi facility, between 2031 and \u200b2034.\n\nDollner, who joined Trump at the rally, said the decision for a plant in the U.S. was years in the making, with more than 70 locations evaluated over \"many months\" and \"intense\" negotiations with public officials.\n\n\"This is not a decision against Germany. Germany remains the backbone of Audi,\" Dollner said. \"We develop our cars here. Our technologies are created here, and Georgia does not take any task away from us in Germany.\"\n\nDollner said localized production is the best decision for the brand, which has struggled in sales this decade amid rising operational costs and Trump's tariffs on vehicles from Germany and other countries into the U.S. Current tariffs on vehicles from Germany are 15%, down from 25%.\n\nLast year, U.S. tariffs cost Audi 1.2 billion euros ($1.4 billion), as it imports all its vehicles for the U.S. market from Europe or Mexico.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 10:12 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dividend buzz: Dalmia Bharat, Mazagon Dock, Coal India, NTPC, others to consider payouts this week - Check full list", "full_content": "Dividend buzz: The earnings season is in full swing, with a host of companies, ranging from consumer giants to Public Sector Undertakings (PSUs), set to announce dividends, along with their results for the quarter ended in September 2026.\n\nREC, Supreme Industries, Dalmia Bharat , DCM Shriram , QGI Finance Limited, Mazagon Dock, Gravita India , Tanla Platforms, Siyaram Silk, and Sundaram are among the top companies which are set to announce their second quarter results for financial year 2026-27 and dividend.\n\nVaibhav Global, Sasken Tech, Coal India, Laurus Labs, Godrej Consumer, Sanofi India , CARE Ratings , Symphony, Varun Beverages, NTPC.\n\nNifty 50 closed 0.39% lower at 22,600 points on Friday, with Nifty Bank declining 1.10%. Nifty Midcap Select fell close to 2.20% on Friday. BSE Sensex was down 0.17% at 73,123.83 points.\n\nThe Nifty 50 declined nearly 2.36% last week and moved closer to its 200 weeks exponential moving average (EMA). The overall technical structure remains weak, with selling pressure visible across sectors except IT, highlighted Dr. Ravi Singh, Chief Research Officer from Master Capital Services Ltd.\n\n\u201cImmediate support is placed near 22300, and a decisive breakdown below this zone could trigger further selling towards 22000, a key psychological support level. On the upside, the 22850-22900 zone remains a crucial resistance area, coinciding with the 21 days EMA,\u201d stated Ravi.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 09:49 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IT stocks dividend record date this week: Cyient, LT Tech, Hexaware, Hypersoft, Sagility - Who pays most? Amount, return", "full_content": "Cyient Limited, L&T Technology Services Limited, Hexaware Technologies Limited, Hypersoft Technologies Limited and Sagility are among the top five information technology (IT) stocks that have fixed dividend record dates in the coming week.\n\nWhile these IT stocks will remain in focus this week because of corporate actions, the overall segment has bucked the broader market's weak trend. Nifty IT has surged nearly 1.17% over the past five trading sessions despite overall bearish sentiment prevailing across the stock market.\n\nFor investors who closely track dividend linked updates, here are all the details about IT stocks with dividend record dates this week and their return.\n\nHexaware Technologies has fixed Monday, October 26 as the record date for dividend payout. The IT company has announced \u20b9 9.50 per equity share payout. The stock closed marginally lower at \u20b9 590.70 per share on BSE on Friday.\n\nL&T Technology Services (LTTS)\u2019s board of directors has approved \u20b9 20 per equity share dividend and has fixed October 27 as the record date. The stock closed 1.10% lower at \u20b9 3910.6 per share on Friday.\n\nThe company has fixed October 30 as the record date for its \u20b9 0.25 per equity share dividend payout. The stock closed 5% lower at \u20b9 167.35 per share on BSE on Friday.\n\nCyient Limited has announced \u20b9 12 per equity share dividend for FY27 and has fixed October 28 as the record date for the payout. Its share price value closed 7.40% higher at \u20b9 1229.25 per share on BSE on Friday.\n\nIt announced \u20b9 0.15 per equity share dividend and fixed October 30 as the record date. Sagility share price closed 2.97% lower at \u20b9 44.10 per share on BSE on Friday.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 08:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Tier-4 Security, Zero Third-Party Cloud: RBI Chief Explains How New Hub Fortifies India's Banking", "full_content": "RBI Governor Sanjay Malhotra says the central bank\u2019s new Bhubaneswar institute will train bank employees and financial sector professionals in cybersecurity as AI, quantum computing and other emerging technologies reshape digital risks.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018Very high\u2019 expectations from India-EU FTA, says Rotterdam port chief", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a \u2018Very high\u2019 expectations from India-EU FTA, says Rotterdam port chief The Economic Times daily newspaper is available online now. Read Today's Paper \u2018Very high\u2019 expectations from India-EU FTA, says Rotterdam port chief SECTIONS \u2018Very high\u2019 expectations from India-EU FTA, says Rotterdam port chief ET Online Last Updated: Oct 25, 2026, 08:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Boudewijn Siemons, CEO of the Port of Rotterdam, expressed high expectations for the India-EU free trade agreement. He highlighted the importance of collaboration between ports and nations to facilitate global trade. Siemons conveyed his optimism about increased business opportunities between Europe and India. Negotiations for the free trade agreement have concluded, with hopes to sign it by year-end. The implementation of the agreement is anticipated for next year.\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "25 Oct 2026, 08:34 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Indian Bank hikes interest rates on special-tenure fixed deposits \u2014 check how much 555-day and 777-day FDs are offering", "full_content": "Public-sector lender Indian Bank has increased interest rates by 15 basis points each on two of its special fixed deposit (FD) schemes, with the revised rates taking effect from Friday, October 23, 2026.\n\nThe new rates apply to its 555-day Ind Grow and 777-day Ind Prosper deposits, offering customers higher returns on their investments. Meanwhile, the bank's offered interest rates on other listed tenures remain unchanged.\n\nIndian Bank's decision to raise interest rates on its fixed deposits comes after the Reserve Bank of India (RBI) on October 7, raised repo rate by 25 bps to 5.50% from 5.25%, marking the first such increase since February 2023.\n\nFollowing the revision, the annual interest rate on the 555-day Ind Grow deposit has been raised to 6.80% from 6.65%. Meanwhile, the annual rate on the 777-day Ind Prosper scheme has been increased to 6.75% from 6.60%.\n\nIndian Bank offers senior citizens an additional 0.5 percentage point and super senior citizens an additional 0.75 percentage point over the applicable interest rates for general customers on these special deposits.\n\nThese additional benefits can make the special fixed deposit schemes attractive to older depositors seeking predictable returns. However, they should also consider the deposit tenure, premature withdrawal rules and tax implications.\n\nBoth Ind Grow and Ind Prosper are special-tenure deposit schemes, which are meant for depositors looking to keep their money invested for a fixed period. You can choose between the two by assessing how long you can set aside your savings and whether you may require the funds before maturity.\n\nPremature withdrawal from special-tenure FDs may be allowed if it is callable, in which the bank may apply a penalty and recalculate interest based on the period for which the deposit remained open. Meanwhile, non-callable FDs generally place stricter limits on early withdrawal.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 08:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Here are 4 big things we're watching in the stock market this week", "full_content": "Peak earnings season, plus a Fed meeting and fresh inflation data.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 08:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Exclusive | JetBlue Creditors Hire Advisers as Airline\u2019s Shares, Bonds Sink - WSJ", "full_content": "Exclusive | JetBlue Creditors Hire Advisers as Airline\u2019s Shares, Bonds Sink WSJ JetBlue Lenders Organize After Stock, Debt Fall to Record Lows Bloomberg.com JetBlue creditors hire bankruptcy advisers as debt concerns grow TheStreet Is JetBlue Airways (JBLU) Cheap After New Loyalty Partnerships And A 43% Undervalued View? Simply Wall Street JetBlue Airways Corp. stock underperforms Thursday when compared to competitors MarketWatch", "source": "Google News Business", "pub_date_str": "25 Oct 2026, 08:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bitcoin steadies near $80,400 after weekend selloff, Fed decision looms", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 08:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trade Setup For Oct. 26: Nifty Support Slips To 22,500 As Brent Crude Spike Prevents Upside \u2014 Key Levels", "full_content": "Nifty continues to trade comfortably below its crucial moving averages. The daily RSI is also declining and approaching the key 40 mark, which could further weaken the momentum if breached, according to analysts. With the benchmark index showing signs of renewed weakness, all eyes are now on the crucial support levels that could determine the extent of the next move.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 08:01 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Reliance\u2019s Jio Platforms IPO allotment on Mon, Oct 26: What happens to your money if you get none, one or many lots?", "full_content": "Jio IPO allotment on October 26: Jio Platforms saw bumper response, with the issue subscribed more than 22 times. As the Mukesh Ambani's Reliance Industries Limited (RIL)-backed Jio IPO witnessed record bidding, let\u2019s understand different possible allotment scenarios for investors who applied for more lots. What happens if you are allotted multiple lots, just one or none?\n\nThere are a lot of chances that investors may end up receiving no lots of Jio IPO, given its oversubscription. In case of allotment of zero lots, the entire amount blocked in your account for Jio IPO will be completely unblocked and no money will be deducted.\n\nFor investors who receive allotment of a single lot, the exact amount required for one lot will be debited from your bank account. Jio Platforms IPO has fixed issue price band at \u20b9 1,065 to \u20b9 1,119 per share.\n\nOne lot consists of 12 shares of an issue. Hence, the minimum amount required by an investor to apply for a Jio IPO lot is \u20b9 13,428 (considering its upper price band). Which means that an amount of \u20b9 13,428 will be deducted from the bank account if one lot is allotted.\n\nIt is very unlikely for investors to receive multiple lots of Jio IPO as the issue was oversubscribed by a significant number. Under the retail category, investors can apply for 14 lots, ie \u20b9 1,87,992. Investors can also apply through Reliance Industries Limited (RIL) shareholders quota and employee quota too.\n\nJio Platforms IPO\u2019s latest grey market premium (GMP) stood at \u20b9 248 at 6:37 pm on Sunday, as per media reports. Considering its upper price band mark, Jio IPO\u2019s estimated listing price is likely to stand near \u20b9 1367 per share (which is the sum of upper price band and latest GMP). The issue is likely to be listed on exchanges on Wednesday, October 28.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 07:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bertie fights off the song of turbo-charged returns", "full_content": "It had been borne in upon Bertie on countless occasions that a phone call from his winsome private banker Natasha was a prelude to poor investment decisions, and yet he always answered. Our man evidently lacked Odysseus\u2019s resolve to tie himself to his ship\u2019s mast in order not to fall prey to the sirens\u2019 song.\n\n\u201cHello sir! How are you? Long time\u201d. Natasha began in her lilting sales voice. Bertie realised how scores of sailors who got shipwrecked on the island of the sirens must have felt. One knew that the song was pulling one towards one\u2019s certain demise but it was so alluring that one still steered towards it. \u201cAm good, Natasha. How have you been?\u201d Bertie attempted his formal voice.\n\n\u201cWhen can I come over, Bert? Let us review your portfolio na.\u201d Natasha continued. \u201cWe have some great new products which you will love\u201d. Bertie could see the rocks on the jagged coastline but he was no longer in charge of the words emanating from his mouth. \u201cNext week. Fat Cats Club.\u201d\n\n\u201cSure sir. Can\u2019t wait\u201d Natasha hung up. Bertie imagined her doing the not-so-nice Leonardo DiCaprio gesture from Wolf of Wall Street after he had hung up on a naive client.\n\nAt Fat Cats Club the following week, Bertie looked at his portfolio returns and discovered a new meaning of the word \u2018equity\u2019\u2014everything was equally bad. He feebly vocalised this concern: \u201cThis is bad, Natasha\u201d.\n\n\u201cBut you know how the markets have been na. Who better than you to know it? Everybody in our office loves to hear your market views.\u201d Natasha had pulled a clever one. She had not only wrapped the stench of bad returns in a bouquet of flattery but also managed to deflect the blame for poor returns to Bertie.\n\n\u201cSo, what now?\u201d asked a troubled Bertie, gazing at Natasha with hopeful eyes.\n\nShe had a twinkle in her eye as if she was going to pull out a black rabbit from her expensive handbag. \u201cWe have just the thing,\u201d she said.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 07:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Cities cannot be governed from state capitals, need empowered local governments: NITI Aayog's Rajiv Gauba", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Cities cannot be governed from state capitals, need empowered local governments: NITI Aayog's Rajiv Gauba The Economic Times daily newspaper is available online now. Read Today's Paper Cities cannot be governed from state capitals, need empowered local governments: NITI Aayog's Rajiv Gauba SECTIONS Cities cannot be governed from state capitals, need empowered local governments: NITI Aayog's Rajiv Gauba ANI Last Updated: Oct 25, 2026, 07:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Rajiv Gauba emphasized the need for reforms in urban governance during the National Urban Conclave. He highlighted the importance of empowering city governments and proposed directly elected mayors for better governance. The projected increase in India's urban population demands significant infrastructure and service management changes. Gauba called for improved municipal revenues and the adoption of the Model Tenancy Act to support affordable housing.\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Oct 2026, 07:34 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "More than a third of S&P 500 companies are about to report earnings as market confidence cracks", "full_content": "\u201cWith cautious to negative market sentiment, it could be a tricky week,\u201d one strategist says.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'He Knew Me So Well\u2019: Anil Kapoor Gets Emotional As Gagan Reminds Him Of Satish Kaushik On India Ke Top 1%", "full_content": "Anil Kapoor got emotional after meeting Gagan, a contestant who resembles late actor Satish Kaushik. The actor recalled his close bond with Kaushik, their dream of playing twin brothers and his memorable role as Calendar in Mr India.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 07:09 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Central government pensioners await DR hike as Bharat Pensioners Samaj seeks cabinet secretary\u2019s intervention", "full_content": "Central government pensioners and family pensioners are awaiting the announcement of the latest dearness relief (DR) hike, with the Bharat Pensioners Samaj (BPS) urging the government to expedite the decision and release the pending instalment.\n\nIn a letter dated October 22, 2026, Avinash Rajput, secretary general of BPS, requested the Cabinet secretary to intervene and direct the Department of Pension and Pensioners\u2019 Welfare (DoPPW) and the Department of Expenditure (DoE), under the Ministry of Finance, to announce and release the pending DR instalment at the earliest.\n\n\u201cThe delay has caused disappointment and uncertainty among pensioners, particularly elderly and financially dependent pensioners who look forward to this additional amount to meet their household and medical expenses,\u201d the letter stated.\n\nBPS claims to represent around one million central government pensioners.\n\nIn its letter, the pensioners\u2019 organisation said that retirees had expected the DR hike announcement before Dussehra, which fell on October 21.\n\nThe organisation highlighted that the festive season generally brings additional household and family expenses, making the timely release of enhanced dearness relief particularly important for pensioners.\n\n\u201cDearness relief is not a bonus or a discretionary favour; it is an essential adjustment intended to mitigate the impact of rising prices on the fixed incomes of pensioners. Timely disbursement is, therefore, important for their financial security and peace of mind,\u201d said the BPS.\n\nBPS has requested the Cabinet secretary to take up the matter with the concerned departments and ensure the early announcement and disbursement of the pending DR instalment, along with arrears, to pensioners and family pensioners.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 07:07 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Stock market prediction for Monday Oct 26: Sensex, Nifty levels, top stocks to watch - Will bulls dance again?", "full_content": "Stock market outlook this week: The Nifty 50 fell nearly 2% last week, snapping its two-week winning streak as geopolitical tensions and volatility in Brent crude oil prices kept investors on edge. The decline took the index\u2019s year-to-date (YTD) losses to nearly 13.56%, putting it on track for its worst annual performance in over a decade.\n\nNifty 50 closed 0.39% lower at 22,600 points on Friday, with Nifty Bank declining 1.10%. Nifty Midcap Select fell close to 2.20% on Friday. BSE Sensex was down 0.17% at 73,123.83 points. As we head for a new week, let\u2019s understand whether bulls will stage a comeback on Dalal Street or bears will continue to drag Nifty and Sensex lower.\n\nThe Nifty 50 declined nearly 2.36% last week and moved closer to its 200 weeks exponential moving average (EMA). The overall technical structure remains weak, with selling pressure visible across sectors except IT, highlighted Dr. Ravi Singh, Chief Research Officer from Master Capital Services Ltd.\n\n\u201cImmediate support is placed near 22300, and a decisive breakdown below this zone could trigger further selling towards 22000, a key psychological support level. On the upside, the 22850-22900 zone remains a crucial resistance area, coinciding with the 21 days EMA. As long as the index trades below this hurdle, the strategy remains sell on rise, with recovery attempts facing sustained selling pressure,\u201d explained Ravi.\n\nNifty 50 has formed a bearish candle with a long lower shadow indicating continuation of the corrective decline for the fourth session in a row.\n\nThe benchmark equity index has retraced 80% of its previous six sessions up move, highlighted Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking, adding that a follow through weakness below 22,372 will open downside towards the current month low of 22,180.\n\n\u201cIndex holding above last week's low of 22,372 will lead to consolidation in the range of 22,370-22,850 in the coming week.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 07:02 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NPS Vatsalya: Can your child continue this pension scheme after turning 18? Know the investment rules and exit options", "full_content": "Parents who want to start saving for their child's future can explore NPS Vatsalya, a scheme designed for long-term financial planning for minors. Parents can start contributing to NPS Vatsalya as soon as they open an account for their child.\n\nBut what happens when the child turns 18? Who gets the accumulated money, and what options are available for managing or withdrawing it? Here\u2019s what you need to know.\n\nNPS Vatsalya is a contributory savings scheme for minors under the National Pension System (NPS). It is regulated by the Pension Fund Regulatory and Development Authority ( PFRDA ).\n\nThe account is opened in the minor's name, with the child as the sole beneficiary. A parent or legal guardian operates it until the child turns 18, and a Permanent Retirement Account Number (PRAN) is issued in the child's name.\n\nIndian citizens below 18 years, including eligible Non-Resident Indians (NRIs) and Overseas Citizens of India (OCIs), can have an NPS Vatsalya account. The scheme is available irrespective of gender. The parent or legal guardian opens and manages the account on behalf of the minor.\n\nThe minimum initial contribution is \u20b9 250, followed by a minimum annual contribution of \u20b9 250. There is no maximum contribution limit. Investments are managed by a pension fund registered with PFRDA. Returns are market-linked and are not guaranteed.\n\nThe parent or legal guardian manages the account on behalf of the minor until they turn 18. Upon attaining majority, the subscriber (or child) takes charge of the account and is responsible for its management.\n\nThe accumulated contributions, investment returns, and benefits belong solely to the subscriber. The account holder has three options after attaining 18 years of age:", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 06:50 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "JetBlue creditors are working with restructuring adviser PJT Partners, WSJ reports", "full_content": "A senior creditors group for JetBlue Airways is working with restructuring adviser PJT Partners , The Wall Street Journal reported on Friday, citing people familiar with the matter.\n\nA surge in jet fuel expenses due to the Iran war has pressured margins for U.S. airlines despite higher airfares and steady demand for air travel.\n\nThe carrier's shares, which are down 42% this year, closed 0.94% lower at $2.62 on Friday.\n\nJetBlue is undergoing a financial and operational overhaul to cut costs and plans to expand its premium offerings.\n\nAs of June 30, JetBlue had $1.66 billion in cash and cash equivalents along with $8.5 billion of debt and finance lease obligations, according to its filings.\n\n\"JetBlue remains confident in its JetForward strategy and the progress being made toward returning to sustained profitability,\" the company said in an emailed statement.\n\nPJT did not immediately respond to a Reuters request for comment.", "source": "CNBC Top News", "pub_date_str": "25 Oct 2026, 06:38 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings flood, Fed meeting will test rickety AI market rally", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Oct 2026, 06:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Worried about this stock-market selloff? Relief may be coming after the midterms \u2014 no matter who wins.", "full_content": "The nine months between Election Day and June 30 have seen the S&P 500 deliver an average return of 15.5% going back to 1950.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Oct 2026, 06:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Planning to buy gold jewellery on Dhanteras? How to check its purity beyond hallmarking | Complete process explained", "full_content": "Gold purchases typically rise during the festive season in India, with many households buying jewellery, coins and bars for investment or as part of tradition. This uptick in demand is often witnessed during Akshaya Tritiya and Dhanteras, when buying the yellow metal is considered auspicious.\n\nThis year, Dhanteras falls on November 6, and if you are planning to make a gold purchase on this day, it is important to ensure that the jewellery or coins you purchase meet the promised purity standards. It is particularly important if you are buying from a local or small jewellery store.\n\nThe first thing most buyers look for when buying gold items is the hallmark, which indicates that the gold has been officially tested and certified for purity by a government-authorized agency. In India, this certification is provided by the Bureau of Indian Standards (BIS).\n\nHowever, checking the hallmark alone may not be enough to ensure the authenticity of a gold item, as fake hallmarks can also be used on gold jewellery .\n\nThis is where the Hallmark Unique Identification (HUID) code becomes important. The six-digit alphanumeric code stamped on BIS-hallmarked gold jewellery allows buyers to verify the jewellery's details and purity through the BIS Care mobile app or its online portal.\n\nThe process to verify a gold item's HUID code can be easily done online. Here\u2019s are the steps through which you can check and confirm the authenticity of gold jewellery using the HUID number before purchasing it.\n\nStep 1: Locate the HUID code: Find the 6-digit alphanumeric code stamped on your jewellery item. It is engraved near the BIS logo, the purity stamp such as 22K or 18K, and the jeweller\u2019s identification mark.\n\nStep 2: Get the BIS CARE app: Download the official application from the Google Play Store (For android phones) or the Apple App Store (for iPhones). This app is used to verify hallmarked jewellery.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 06:24 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u2018Nonanswers\u2019 aren\u2019t working. This is what investors really need from the Fed.", "full_content": "What really matters to investors, economists say, is for Fed Chairman Kevin Warsh to prove he can successfully communicate the central bank\u2019s strategy.", "s     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
