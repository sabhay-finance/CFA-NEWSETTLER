    const allData = {"general": [{"title": "Dow tumbles 500 points as Middle East tensions rise, selling broadens beyond tech: Live updates", "full_content": "The Dow slid on Friday as a sell-off in tech in the prior session shifted to other areas of the market and U.S. oil prices topped $100 a barrel amid rising fears that the U.S.-Iran conflict would flare up again.\n\nThe Dow Jones Industrial Average dropped 543 points, or 1%, while the S&P 500 slipped 0.3%. The Nasdaq Composite gained 0.7%.\n\nMore defensive stocks came under pressure on Friday, with the consumer staples, utilities and healthcare sectors all lower. Dow component American Express fell more than 3% after announcing it was cutting about 5% of its global workforce , citing the need to \"prepare for AI.\" Caterpillar also edged down about 2%, while Goldman Sachs fell around 1%, adding pressure to the 30-stock index.\n\nOn Thursday, many technology stocks had pulled back as traders assessed the impact of outsized corporate borrowing and rising rates on AI and other tech names. Microsoft ticked higher on Friday. However, chip stocks such as Micron Technology and Advanced Micro Devices were making a stronger move, with gains of 4% and 2%, respectively.\n\n\"For the last two weeks, investors have been sprinting from tech stocks and data center beneficiary stocks to safe stuff, and eventually, you run out of people willing to do that sprint, and that's what today looks like and feels like,\" Jed Ellerbroek, portfolio manager at Argent Capital Management, told CNBC.\n\nEllerbroek added that tech companies' earnings have proven strong this season, giving investors a reason to embrace tech stocks and focus less on emotion-based flights to safety.\n\n\"Emotion and fear play a really big role,\" the investor said. But, \"we've gotten a few tech companies' [latest quarterly financial reports] and their earnings results have been good.\"\n\nThe 10-year Treasury yield was steady at around 4.994%.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 11:18 PM IST", "pub_date_relative": "6m ago"}, {"title": "Why is Accenture stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:12 PM IST", "pub_date_relative": "12m ago"}, {"title": "DOJ sues to block Alaska from certifying Senate race winner if Republican narrowly loses", "full_content": "The Department of Justice filed an extraordinary lawsuit seeking to block Alaska from certifying the winner of its upcoming U.S. Senate election if incumbent Republican Sen. Dan Sullivan loses .\n\nThe lawsuit cites what it argues is likely voter confusion from the name of another candidate, retired teacher Daniel J. Sullivan, on the ballot.\n\nThe DOJ says that could help Democratic nominee Mary Peltola defeat the incumbent, Dan S. Sullivan, in what is expected to be a close contest. The Alaska race is one of several Senate contests in November that could determine whether Republicans retain their slim majority in the upper chamber of Congress.\n\n\"The United States accordingly brings this lawsuit to protect the integrity of the 2026 Senate election in Alaska,\" says the suit filed Thursday in U.S. District Court in Alaska. In addition to the state, the complaint names Alaska Elections Division Director Carol Beecher, the state's election boards and the state Ballot Counting Review Board as defendants.\n\nThe suit asks a federal judge in Alaska to bar the state from certifying \"any result that may be impacted by voter confusion ... pending an investigation to determine whether votes cast for Daniel J. Sullivan were meant to be cast for Senator Sullivan.\"\n\nThe suit alleges that Daniel J. Sullivan's \"sole purpose\" of running for the Senate \"is to benefit the Peltola campaign by reducing the number of votes for Senator Sullivan.\" Sullivan first registered as a Republican earlier this year. He previously was a member of the Alaska Independence Party.\n\nThe Cook Political Report with Amy Walter rates the Alaska Senate race as one of seven \"toss-up\" contests for that chamber. The election tracking site FiftyPlusOne 's average of polling shows Peltola, a former U.S. House member from Alaska, with just a two-point lead over Sullivan.\n\nThe suit came hours after President Donald Trump, in a Truth Social post, wrote, \"I am very concerned about the Dan S. Sullivan Race for the U.S.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 11:12 PM IST", "pub_date_relative": "12m ago"}, {"title": "Musk's SpaceX is still restricting Starlink in Ukraine and the toll is rising", "full_content": "SpaceX 's Starlink internet system continues to be throttled in Ukraine as the stakes rise for the war-torn country, Ukrainian officials and a national security expert said Friday.\n\n\"Every day matters for Ukraine, because every Ukrainian life matters,\" wrote Denys Sienik, Ukraine's deputy ambassador to the U.S., in a Friday post on X .\n\n\"Our people are waiting for positive news, hoping that the restrictions will be lifted and our defenders will have the capabilities they need to protect lives,\" Sienik said. \"Unfortunately, as of today, nothing has changed. We continue to wait.\"\n\nSince Oct. 14, Ukrainian officials have accused SpaceX of undermining the country's ability to defend itself by imposing speed limits on Starshield, the military-grade Starlink offering. Any drone traveling above 100 mph lost its connection, disrupting some missions, officials said.\n\nDespite recent comments from President Donald Trump that indicated service was restored, Ukraine's Starshield terminals continued to experience problems on Friday, said Dmitri Alperovitch, chairman of the Silverado Policy Accelerator, a Washington, D.C., think tank focused on energy, defense tech and global trade.\n\n\"They are losing drones,\" Alperovitch, who is also a co-founder and former chief technology officer of cybersecurity firm CrowdStrike , told CNBC. \"Ability to do mid strike to hit Russian logistics is now limited.\"\n\nUkrainian President Volodymyr Zelenskyy said in a Friday post on X that the restrictions on Starlink and Starshield \"are still there,\" and added, \"The speed has not been restored.\" He noted that the country is also waiting for the U.S. to deliver missile interceptors \"that were already agreed on.\"\n\n\"Things have become harder \u2014 partly because of the Starlink and Starshield policies and speed limits,\" Zelenskyy wrote. \"But our frontline is still holding and I am proud of how strong our people are.\"", "source": "CNBC World Economy", "pub_date_str": "23 Oct 2026, 11:11 PM IST", "pub_date_relative": "13m ago"}, {"title": "Roche\u2019s sefaxersen shows 43% proteinuria reduction in IgAN trial", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:10 PM IST", "pub_date_relative": "14m ago"}, {"title": "Investors are starting to find opportunities in the battered bond market", "full_content": "Even after another bond market rout Friday, investors are turning their attention toward Treasurys, anticipating that yields may be topping out.\n\nThe benchmark 10-year note spent the day flirting with the psychologically important 5% level as oil prices surged and a fresh consumer survey showed that inflation expectations remain a good distance above the Federal Reserve's 2% goal.\n\nStill, some market participants see reason for hope in a market bludgeoned this year over worries about rising prices, tensions in the Middle East and stiff competition from artificial-intelligence hyperscalers flooding the market with debt.\n\nBank of America's Michael Hartnett in a client note declared \"The Price is Right\" on the battered Treasury market, which he noted has seen its worst long-run return in the past 100 years.\n\nThe investment strategist noted in his weekly money-flow summary that the \"secular contrarian [trade] would be adding bonds,\" drawing a parallel to similar long-run negative returns for stocks and commodities that later proved to be good entry points\n\nDespite the negative returns and soaring yields this year, investors are putting money into fixed income and government debt in particular.\n\nTreasurys saw $5.4 billion in inflows over the past week, part of $12.1 billion overall into the bond market, according to data compiled by BofA. The iShares 20+ Year Treasury Bond ETF, a $47.3 billion fund that offers exposure to long-dated government debt, has seen $1.14 billion in fresh investor cash over the past month.\n\nOne reason for investor enthusiasm is the simple belief that the Treasury sell-off has exhausted itself, with the market pricing in the various risks to the market and now at least ready to stabilize.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 11:10 PM IST", "pub_date_relative": "14m ago"}, {"title": "Macy\u2019s declares quarterly dividend of 19.15 cents per share", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:06 PM IST", "pub_date_relative": "18m ago"}, {"title": "Exclusive-First Russian diesel from Putin-Trump deal heading for US, data shows", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:06 PM IST", "pub_date_relative": "18m ago"}, {"title": "Raymond James reiterates Alnylam stock Strong Buy on positive trial data", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:59 PM IST", "pub_date_relative": "26m ago"}, {"title": "10-year Treasury yield drops back to 5% this week as investors seek cover from AI worries", "full_content": "Investors ran for cover this week as artificial intelligence fears and higher oil prices hit stocks, driving the yield on the 10-year U.S. Treasury note below 5%.\n\nThe benchmark yield was just under 5% on Friday, after falling beneath that level Thursday for the first time in a month, as investors continued to express misgivings over the massive debt tech companies are taking on to finance their build-out of AI networks.\n\nInvestors are also weighing higher energy prices as the Iran war drags on and are looking ahead to next week's Federal Reserve meeting, said Art Hogan, chief market strategist at B. Riley Wealth.\n\n\"The massive selling of Treasurys in the month of September, bringing yields up by close to 50 basis points, clearly got ahead of itself,\" he said. \"What we're seeing over the last two weeks is the slow unwind of that trade back to what is likely a more normalized level of yield.\"\n\nOn Friday, the yield on the 10-year U.S. Treasury \u2014 used as a benchmark for borrowing costs including mortgages \u2014 rose more than 3 basis points to 4.99%.\n\nThe yield on the 2-year Treasury note, which more closely follows short-term Federal Reserve policy, increased by 5 basis points to 4.686%. Yields on longer-dated 30-year U.S. Treasurys climbed nearly 3 basis points to 5.315%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThis week's rebound in Treasury prices comes just weeks after 10- and 30-year yields jumped to their highest levels in more than 20 years .", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:56 PM IST", "pub_date_relative": "28m ago"}, {"title": "Texas Senate race: New Talarico ad rips Elon Musk 'dark money' push", "full_content": "James Talarico 's campaign hit back at Elon Musk Thursday, calling the 2026 election cycle's top spender out for his cash infusion in the Texas Senate race amid an ongoing feud between the Democratic nominee and the world's richest man.\n\nA video posted by the Talarico campaign's account on X Thursday of a new ad targets Musk for his record spending in favor of Republican nominee Ken Paxton, telling him \"Texas is not for sale.\"\n\n\"Do you keep seeing these attack ads against James Talarico? Look a little closer. The same super PACs are paying for nearly all of them,\" the video's narrator intones. \"But who's funding these dark money groups? Elon Musk.\"\n\n\"He's almost single-handedly bankrolling the effort to install Ken Paxton in the U.S. Senate,\" the narrator continues.\n\n\"Elon wants to buy up our land, he wants to buy up our water, and now, he wants to buy his own personal U.S. senator. He knows that if his millions drag the most corrupt politician in Texas across the finish line, Ken Paxton will owe him everything.\"\n\nThe new ad dropped with less than two weeks until the midterm election and amid an ongoing feud between Talarico and Musk.\n\nIn a post Wednesday on X, Musk said, \"There is something deeply wrong with James Talarico.\" And on Thursday, he wrote on X that \"Talarico hates Texas and America\" while reposting a video about voter-ID requirements.\n\nTalarico fired back Wednesday, replying to the earlier post, \"There is something deeply wrong with a political system that allows one trillionaire to buy his own personal U.S. Senator.\"", "source": "CNBC World Economy", "pub_date_str": "23 Oct 2026, 10:56 PM IST", "pub_date_relative": "28m ago"}, {"title": "Qatar deal to buy U.S. natural gas shows how Iran war has redrawn global energy markets", "full_content": "Before the Iran war, Qatar was one of the biggest natural gas exporters in the world. After only eight months, the Gulf state is now buying supplies from its principal competitor \u2014 the United States.\n\nQatarEnergy struck a deal Thursday with U.S. exporter Cheniere Energy to buy 4 million metric tons of liquefied natural gas (LNG) annually through 2054. The purchase price is indexed to the U.S. Henry Hub price plus a fixed fee. Deliveries are expected to begin in the 2030s.\n\n\"We look forward to reliably supplying QatarEnergy from both Sabine Pass and Corpus Christi into the second half of this century,\" Cheniere CEO Jack Fusco said in a statement.\n\nThe gas that Doha will buy is less than 1% of the global LNG trade of more than 400 milion metric tons. But \"in terms of an individual deal, this is about as big as you see in the U.S,\" said Alex Munton, director of global gas and LNG at Rapidan Energy in Houston.\n\nThe deal signals how the Iran war is reshaping global energy markets to the benefit of U.S. companies, cementing the dominance of American LNG exporters. Shares of Cheniere and Venture Global , the other independent U.S. player, have gained 26% and 40%, respectively, since the start of the war.\n\nQatar was second only to the U.S. in LNG exports before the war. But shipments have since collapsed in the eight months since Iran bombed its key production facility at Ras Laffan. The attack badly damaged two production lines, taking out about 17% of Qatar's LNG export capacity.\n\nIt will take about three years to repair the damage at Ras Laffan, Qatar's Energy Minister Saad Sherida Al-Kaabi has said. The Persian Gulf state has declared force majeure \u2014 citing unexpected, uncontrollable events preventing contracts from being honored \u2014 every month since the March attack.\n\n\"It did give us a big blow, if you will, for our production capability for the next few years,\" Al-Kaabi said in an interview on the sidelines of the U.N. General Assembly in September.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:55 PM IST", "pub_date_relative": "29m ago"}, {"title": "Jana Small Finance Bank Q2 FY27 slides: record profit drives guidance upgrade", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:52 PM IST", "pub_date_relative": "32m ago"}, {"title": "American Express is cutting 5% of its workforce to 'prepare for AI'", "full_content": "American Express is cutting thousands of employees as the leading credit card company prepares for artificial intelligence to take over more of its internal processes.\n\nAmex is eliminating 5% of its global workforce and taking a $336 million restructuring charge, CEO Stephen Squeri told analysts Friday on the company's third-quarter earnings call. The firm had almost 77,000 employees at the end of 2025.\n\nChief Financial Officer Christophe Le Caillec told CNBC in an interview that the restructuring was to make American Express \"leaner, more agile, and also to prepare for AI.\"\n\n\"You don't want to automate processes that are not optimally structured,\" Le Caillec said. \"So what we're doing here is to reduce layers and increase spans of controls, so that we can automate and take advantage of AI in the coming quarters and the coming years.\"\n\nThe Amex announcement reflects a broader trend across financial services, where banks are working to replace repetitive roles with AI automation. On Thursday, Barclays confirmed plans to trim 5,000 jobs \u2014 also roughly 5% of its staff \u2014 in another tech-driven cost initiative. The moves come even as the sector is enjoying robust profits from growing consumer spending and resilient credit.\n\nDuring the analyst call, Squeri said the charge was to improve the company's efficiency.\n\n\"We've got good momentum, but to accelerate innovation and win over the next few years, we needed to become [a] more agile and efficient organization,\" Squeri said.\n\nSqueri devoted a 10-minute section of his prepared remarks to his views on AI, focusing mainly on how it will be used to personalize experiences and offers for Amex cardholders.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:51 PM IST", "pub_date_relative": "33m ago"}, {"title": "IPO Subscription status comparison: Reliance Jio IPO vs Hyundai IPO vs NSE IPO - Who won the race?", "full_content": "Reliance Jio IPO vs Hyundai IPO vs NSE IPO: Jio Platforms initial public offering closed on Friday with bumper subscription. Backed by Reliance Industries Limited, Jio IPO was subscribed 22.19x by the end of third day of subscription.\n\nJio Platforms is all set to become India\u2019s biggest ever IPO after dethroning Hyundai IPO which came in 2024. With Reliance Jio IPO drawing strong response, let's understand how it compares with Hyundai Motor India's IPO (which came in 2024), and National Stock Exchange (NSE) IPO.\n\nThe IPO was subscribed 22.19x by the end of day 3. As the Reliance Jio IPO subscription closed on Friday, here is full breakdown of how much the issue was subscribed over the last three days in different segment.\n\nJio IPO was subscribed 22.19 x on day 3. The issue was subscribed 70.55 times in the qualified institutional buyers (QIB) category, 14 times in non institutional investors (NII) category, 2.72 times in the retail investors segment.\n\nIt received 2.93x bidding in employee reserved quota, and 7.60x subscription in the reservation portion shareholder.\n\nHyundai Motor India IPO opened on October 15, 2024 and closed on October 17, 2024. It was subscribed 2.37 times on its third day of subscription in October 2024, reported Mint earlier. The issue saw 6.95x bidding in QIB category, 0.60x in the NII segment, 0.50x to 0.60x in the retail portion, and 1.74x in the employee portion.\n\nNSE IPO opened for subscription on September 17, 2026 and closed on September 21, 2026. By the end of third day, the issue was subscribed nearly 5.71 x, reported Mint earlier.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:49 PM IST", "pub_date_relative": "35m ago"}, {"title": "GTT Q3 2026 slides: order surge drives record backlog despite revenue dip", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:47 PM IST", "pub_date_relative": "37m ago"}, {"title": "Sebi bars Avadhut Sathe, academy from markets, imposes \u20b911.5 crore penalty", "full_content": "The Securities and Exchange Board of India (Sebi) has imposed penalties totalling \u20b9 11.5 crore on Avadhut Sathe Trading Academy Pvt. Ltd (ASTAPL) and its directors, and barred them from accessing the securities markets for periods of up to two years for providing unregistered investment advisory and research analyst activities.\n\nIn a final order issued on Friday, the market regulator directed ASTAPL and its founder Avadhut Dinkar Sathe to disgorge and refund \u20b9 546.17 crore to eligible investors and participants who paid for its unregistered services. It has also ordered a deposit of \u20b9 67.87 crore in interest with Sebi\u2019s Investor Protection and Education Fund.\n\nSebi imposed a penalty of \u20b9 6 crore on ASTAPL, \u20b9 4 crore on Sathe and \u20b9 1.5 crore on Gouri Avadhut Sathe, another director.\n\nSebi also prohibited ASTAPL and Avadhut Sathe from accessing or dealing in the securities markets, directly or indirectly, for two years or until they comply with the refund direction, whichever is later. Gouri Sathe has been barred for six months.\n\nSebi had issued an interim order on the matter on 5 December 2025.\n\nThe regulator\u2019s action follows its findings that the academy\u2019s activities went beyond financial education and included investment advice and research-related services without the required registrations. The order cites recommendations on specific securities, including buy and sell calls, price targets and stop-loss levels, delivered through live sessions and WhatsApp communications.\n\nThe order directs ASTAPL and Sathe to publish refund notices within 30 days of receiving it in two national newspapers\u2014one English and one Hindi\u2014and a local-language newspaper. The notices must explain how eligible claimants can seek refunds.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:46 PM IST", "pub_date_relative": "38m ago"}, {"title": "Doctors call Moderna, Merck cancer vaccine data a major advancement \u2014 despite Wall Street reaction", "full_content": "Beneath the chaos surrounding Moderna and Merck 's latest data on their personalized cancer vaccine, oncologists see something else: an important milestone in melanoma treatment.\n\nThe companies on Thursday released detailed results from a phase 3 trial on their mRNA-based shot after partial data leaked on social media platforms earlier that day.\n\nThe vaccine, known as intismeran autogene, reduced the risk of melanoma recurrence or death by 42% when given alongside Merck's immunotherapy Keytruda, compared with Keytruda alone. The combination also reduced the risk of cancer spreading to distant parts of the body or death by 38%, compared with just the immunotherapy, according to the trial on roughly 1,100 patients whose tumors were removed by surgery.\n\nThe stock market's reaction contrasted with the assessment of six melanoma specialists, who told CNBC the results represent a clinically meaningful advance that could eventually become a standard of care for patients who undergo surgery first and have not received immunotherapy before their operation.\n\n\"This has the potential to be a major breakthrough in melanoma treatment and also cancer immunotherapy in general that will open the door to greater outcomes for patients,\" said Dr. Sekwon Jang, a melanoma specialist at Inova Schar Cancer and principal investigator at one of the trial's U.S. sites.\n\nDr. Janice Mehnert, NYU Langone skin cancer specialist and trial investigator, added that \"this is the first time we're seeing that when you add something to immunotherapy, you actually boost the efficacy of the immunotherapy.\"\n\nThe vaccine is not far from potentially entering the market for the first time and reaching melanoma patients. In an interview ahead of the results, Moderna CEO St\u00e9phane Bancel said the company is finishing a filing with regulators as it aims to get the drug fully approved next year.\n\n\"It's a very, very happy moment for the field, for patients,\" he said.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:45 PM IST", "pub_date_relative": "39m ago"}, {"title": "The S&P 500 is forming a bearish chart pattern. Can it snap out of it?", "full_content": "The S&P 500 has struggled to break decisively above 7,800 since first reaching that area in late July.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:44 PM IST", "pub_date_relative": "41m ago"}, {"title": "BP, Louisiana agree to resolve Deepwater Horizon disputes", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:42 PM IST", "pub_date_relative": "42m ago"}, {"title": "Goldman Sachs sees US stocks dip on tech earnings and macro shifts", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:41 PM IST", "pub_date_relative": "43m ago"}, {"title": "Gabelli Equity Trust stock hits 52-week low at 5.11 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:39 PM IST", "pub_date_relative": "45m ago"}, {"title": "Smith & Nephew talks with J&J on orthopaedics deal fail over CEO role, source says - Reuters", "full_content": "Smith & Nephew talks with J&J on orthopaedics deal fail over CEO role, source says Reuters How a transatlantic mega-merger fell apart over a leadership tug of war Financial Times UK Markets Eye A Higher Open As Deals And Data Clash Finimize U.K. stocks higher at close of trade; Investing.com United Kingdom 100 up 0.24% By Investing.com Investing.com Johnson & Johnson and Smith & Nephew Merger: $10 Billion Debt and \"Who Would Be CEO\" Dispute the deep dive", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 10:34 PM IST", "pub_date_relative": "50m ago"}, {"title": "Oil hits $117 for first time since April on fears of flare-up in Iran hostilities", "full_content": "Rise in energy prices pushes US inflation expectations higher", "source": "FT Markets", "pub_date_str": "23 Oct 2026, 10:31 PM IST", "pub_date_relative": "54m ago"}, {"title": "The ledger problem", "full_content": "Tokenisation doesn\u2019t suspend the laws of finance", "source": "FT Markets", "pub_date_str": "23 Oct 2026, 10:30 PM IST", "pub_date_relative": "54m ago"}, {"title": "Stockpickers: Aberdeen, ITM Power, Tristel", "full_content": "Our experts discuss which companies to buy, sell or hold this week", "source": "FT Markets", "pub_date_str": "23 Oct 2026, 10:30 PM IST", "pub_date_relative": "54m ago"}, {"title": "\u2018Some people did everything right\u2019: I lost my home in the Great Recession. I rent in my 50s. Why is that judged as failure?", "full_content": "\u201dI earn $110,000 a year.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "23 Oct 2026, 10:30 PM IST", "pub_date_relative": "55m ago"}, {"title": "Strong macro fundamentals, policy interventions to anchor eco against global headwinds: RBI bulletin", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Strong macro fundamentals, policy interventions to anchor eco against global headwinds: RBI bulletin The Economic Times daily newspaper is available online now. Read Today's Paper Strong macro fundamentals, policy interventions to anchor eco against global headwinds: RBI bulletin SECTIONS Strong macro fundamentals, policy interventions to anchor eco against global headwinds: RBI bulletin PTI Last Updated: Oct 23, 2026, 10:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Strong macroeconomic fundamentals continue to support the Indian economy against global inflation and trade tensions. Recent geopolitical frictions have resulted in increased prices and supply chain issues, leading to policy changes. Currency fluctuations were observed, but measures by the Reserve Bank helped stabilize the rupee recently. Foreign Direct Investment remains robust, driven by significant inflows from major sources like the US and Singapore.\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Oct 2026, 10:26 PM IST", "pub_date_relative": "58m ago"}, {"title": "Stocks making the biggest moves midday: Chevron, CrowdStrike, American Express, SK Hynix & more", "full_content": "Here are some of the companies making headlines in midday trading.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:25 PM IST", "pub_date_relative": "59m ago"}, {"title": "AI's 'Black October': Critical PHP flaws set off global security scramble", "full_content": "Cybersecurity teams around the globe are rushing to patch PHP programming language flaws this week, in an artificial intelligence safety moment that's being described as \"Black October.\"\n\nNearly 70% of all websites use PHP, according to some estimates.\n\n\"In the last 2 days there have been several dozen cyber attacks which, in isolation, would each have been the worst to happen in an entire calendar year,\" John Milinovich, senior director of product management at Figma, wrote in a post on X on Thursday. \"Every sector from government to education to big tech and banks is being massively affected, and people are starting to freak out.\"\n\nResearchers at Google's Wiz and the AI firm Calif discovered major vulnerabilities in PHP in August by using advanced AI models from OpenAI and Google. But by Tuesday, the warnings had spread online, prompting governments and businesses around the globe to scramble to contain the fallout .\n\nMajor AI companies have been warning about the technology's advancing cybersecurity capabilities since April, when Anthropic announced a limited rollout of its powerful model called Mythos . Concerns mounted in July, when OpenAI disclosed that two of its models escaped containment, accessed the open internet and breached a company called Hugging Face .\n\nExperts believe the PHP security flaws serve as the latest example of what's to come.\n\nJason Clinton, deputy chief information security officer at Anthropic, wrote in a post on X on Thursday that the cybersecurity landscape is likely to get \"a lot worse\" before it gets better.\n\n\"Security leaders, never let a crisis go to waste: please go to your boards and ask for help right now,\" Clinton said. \"Not for ai, for the basics. (we need to hold on for ~18 months.)\"", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:25 PM IST", "pub_date_relative": "59m ago"}, {"title": "U.S. fines Air France, KLM over flights in prohibited Iraqi airspace", "full_content": "The U.S. Transportation Department said Friday it was fining Air France and KLM a total of $425,000 for operating dozens of flights in prohibited Iraqi airspace while carrying Delta Air Lines ' code share.\n\nThe Federal Aviation Administration prohibits flight operations by U.S. operators in foreign-managed airspace where conflict, militant activity, or heightened tensions can threaten the safety of flights, and foreign airlines operating flights with a U.S. airline's code must abide by these prohibitions.\n\nAir France operated more than 30 flights and KLM more than 100 flights carrying the Delta code through FAA-prohibited airspace over Iraq between early 2022 and 2025, USDOT said.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fewer people are flying as airfare soars. Here's why airlines aren't worried", "full_content": "Fewer people are flying this year, but with airfare this high and climbing , airline executives say that's just fine.\n\nThe number of people screened at U.S. checkpoints is on track for its first annual decline since 2020. Major U.S. carriers have said capturing higher fares is more important than fully filling their planes or flying record numbers of travelers.\n\n\"We're actively prioritizing yield versus load factor and really happy as we see it. It fits right in with the premium investments that we're making,\" American Airlines Chief Commercial Officer Nat Pieper said on the company's earnings call Thursday.\n\nAmerican's load factor, a gauge of how full planes are flying, fell to 83.4% in the third quarter from 86% in the same quarter of 2025.\n\nThe price of plane tickets has skyrocketed as airlines grapple with a spike in jet fuel prices, their biggest expense after labor, and pass more of those costs on to customers.\n\nFares in September were up more than 22% from a year earlier, according to the latest inflation read. Fare tracker Hopper said it expects this holiday season to come with the most expensive ticket prices in years.\n\nThe average Southwest Airlines fare in the third quarter, for example, was $231.69, up close to $50 from a year earlier. That doesn't include Southwest's new fees, like its extra charges for checked bags or a seat closer to the front of the plane.\n\nThe airline's count of revenue passengers, however, fell 3.2% from a year ago, to about 33.5 million people.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "EAAA India Alternatives mops up Rs 360 crore from anchor investors; IPO opens on Oct 26", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a EAAA India Alternatives mops up Rs 360 crore from anchor investors; IPO opens on Oct 26 Elixir Capital Share Price Mantra Capital Share Price Banas Finance Share Price Royal India Corporation Share Price Classic Leasing & Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper EAAA India Alternatives mops up Rs 360 crore from anchor investors; IPO opens on Oct 26 SECTIONS EAAA India Alternatives mops up Rs 360 crore from anchor investors; IPO opens on Oct 26 By Kumar Gaurav , ETMarkets.com Last Updated: Oct 23, 2026, 10:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis EAAA India Alternatives has successfully raised approximately Rs 360 crore from anchor investors prior to its IPO. This IPO is set to open for public subscription on October 26. The company will not receive any proceeds from the issue as it is an offer for sale. Prominent institutional investors and major domestic mutual fund houses participated in the anchor allocation.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 10:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why Vaibhav Sooryavanshi Is Still On The Bench? India Coach Explains", "full_content": "India batting coach Sitanshu Kotak has urged fans to be patient with Vaibhav Sooryavanshi, saying the growing 'must play' calls are not good for the teenager's development.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "College campuses have (largely) gone silent. Can practicing small talk and phone-free spaces change that?", "full_content": "Gatot Adriansyah | E+, ferrantraite | E+, PrathanChorruangsak | iStock | Getty Images Plus | Getty Images Charlie Harker had high hopes for college.\n\nBefore starting her freshman year in 2023, the Lebanon, Ohio, resident had planned to meet people through clubs or at the dorms. She'd expected there would be an open, vibrant atmosphere ripe for making friends. She'd quickly find her people.\n\n\"And then I got to school,\" says the 21-year-old senior at the University of Cincinnati. \"I didn't know anyone on my floor. No one had their door open. No one would really talk to you.\" That fun and peer-filled campus life she'd been promised by both family and pop culture turned out to be, at least to some extent, a relic of the past.\n\nHarker's college experience is fairly common these days. From 2003 to 2025, 20-to 24-year-olds' socializing and communicating in the U.S dropped 52%, from an average of 64 minutes per day in their leisure time to an average of just over 30 minutes per day. Over the same period, 15-to 19-year-olds' leisure time socializing dropped 32% to 38 minutes, according to the Bureau of Labor Statistics .\n\nStudents these days view school as more \"transactional\" than in the past, says Steven Rogelberg , Chancellor's professor of organizational science, management and psychology at the University of North Carolina at Charlotte. \"You go there, you take your classes, and then you leave.\"\n\nThat's a problem for a variety of reasons. If they're not meeting in class or stopping each other in the hallways, young people may be missing out on developing both friendships and social skills , which are critical for long-term life and career success.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Walmart, Best Buy and other stores now use digital price tags. Critics say they could lead to different prices for different shoppers.", "full_content": "Store aisles are getting a digital makeover.", "source": "MarketWatch Top Stories", "pub_date_str": "23 Oct 2026, 10:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "American Express Shares Tank Nearly 4% After Slashing 5% Of Global Workforce To 'Prepare For AI'", "full_content": "American Express will cut 5% of its global workforce and take a $336 million restructuring charge as it reorganises operations to improve efficiency and prepare for wider AI adoption.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "iPhone Duo Goes On Sale Worldwide: Strong Demand, Limited Stock And Mixed Reviews", "full_content": "Apple's first foldable, the iPhone Duo, went on sale worldwide on Friday at about $2,000. With supply limited, launch-day crowds were smaller than for past iPhones, and reviews were mixed.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Micron Stock Leads Chip Rebound. Dip Buyers Must Buckle Up as AI Chaos Swirls. - Barron's", "full_content": "Micron Stock Leads Chip Rebound. Dip Buyers Must Buckle Up as AI Chaos Swirls. Barron's Could a $10,000 Investment in Micron Set You Up for Life? Yahoo Finance Micron Stock: The AI Memory Tax Could Change Everything (NASDAQ:MU) Seeking Alpha Micron leads memory stock rebound candidates after sharp selloff Investing.com History Says Micron Stock Gains 28% During the Fourth Quarter. Here's Why I Think Shares Will Surge Even More Before 2026 Is Over. The Motley Fool", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Supreme Petrochem Q2 results, dividend 2026: Check amount, record date, yield, history, stock returns", "full_content": "Petrochemical company Supreme Petrochem announced a first interim dividend of \u20b9 2.50 per share for FY27 alongside its financial results for the September quarter on Friday, October 23.\n\n\u201cDeclared interim dividend of \u20b9 2.50 per equity share of the company (viz. 125%) for the financial year 2026-2027 on its paid-up equity share capital (consisting of 188,041,342 equity shares of \u20b9 2 each), entailing an outgo of \u20b9 4,701.03 lakh,\u201d the company said in its regulatory filing.\n\nThe company has fixed Friday, October 30, as the record date to determine shareholders\u2019 eligibility for the dividend. However, it has not disclosed when the dividend payment will commence.\n\nInvestors looking to benefit from the payout must ensure they purchase the stock in time to qualify for the dividend. Under India\u2019s T+1 settlement cycle, shares purchased on or after the record date will not qualify for the payout.\n\nOver the past 12 months, Supreme Petrochem has declared equity dividends totalling \u20b9 10.50 per share. At the current share price of \u20b9 712.60, the company\u2019s dividend yield stands at 1.47%.\n\nSupreme Petrochem follows a quarterly dividend payout policy, distributing a portion of its profits to shareholders and offering them an opportunity to earn regular income alongside potential capital appreciation.\n\nSupreme Petrochem reported strong financial performance for the second quarter of FY27, with operational revenue rising 77.8% year-on-year to \u20b9 1,956 crore from \u20b9 1,100.2 crore in Q2 FY26.\n\nOperational EBITDA surged 91.4% to \u20b9 148.5 crore from \u20b9 77.6 crore, while total EBITDA increased 85.1% to \u20b9 159.9 crore from \u20b9 86.4 crore. Profit after tax (PAT) rose 97% to \u20b9 95 crore, compared with \u20b9 48.2 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Two ex-FBI officials charged with allegedly lying about Hunter Biden probe: DOJ", "full_content": "Two former senior FBI officials were taken into custody on Friday after being charged with lying to Congress about their roles in investigations into Hunter Biden , top Department of Justice officials announced.\n\nThe former officials, 46-year-old Nikki Floris and 56-year-old Bradley Benavides, surrendered on arrest warrants Friday morning, the DOJ said in a press release .\n\nThe charges were filed less than two weeks before the midterm election , breaking with longstanding DOJ guidance discouraging actions that could affect upcoming political races.\n\nThe announcement also comes amid growing concerns that President Donald Trump \u2014 who refused to accept his 2020 election loss and tried repeatedly to overturn those results \u2014 is looking for ways to challenge potential Republican midterm losses.\n\nOn Thursday, the DOJ filed an unusual lawsuit against Alaska seeking to preemptively challenge the results of that state's Senate race if incumbent Republican Sen. Dan Sullivan narrowly loses.\n\nThe charges unveiled Friday morning accuse the two ex-FBI agents of lying in 2023 testimony before the House Judiciary Committee about their agency's probe of Hunter Biden, the now-56-year-old son of former President Joe Biden .\n\nThe agents were \"actively involved\" in federal investigations of Hunter Biden, which began in 2019 on tax- and money-laundering-related matters, but said otherwise in separate interviews before the House panel, according to an FBI special agent's affidavit in support of the charges.\n\n\"Floris and Benavides allegedly lied to Congress about their roles in the FBI's Hunter Biden investigations, with one claiming they only learned about it from Wikipedia \u2014 despite evidence showing their involvement in helping shape the public narrative about Hunter Biden's laptop right before the election,\" U.S. Attorney for the District of Columbia Jeanine Pirro said in an X post.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "$120 Oil Is Almost Here, and Trump Has Few Good Options - Crude Oil Prices Today | OilPrice.com", "full_content": "$120 Oil Is Almost Here, and Trump Has Few Good Options Crude Oil Prices Today | OilPrice.com Brent crude hits more than five-month high on Houthi-Saudi attacks, UAE oil spill Reuters Global Oil Price Hits $117 a Barrel, Highest Since April The New York Times Oil prices approach Iran-war highs as soaring tanker rates trigger a second energy squeeze MarketWatch Oil Holds Biggest Gain in Week as Saudi Attacks Fan Supply Risks Bloomberg.com", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 10:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nasdaq ticks up as tech stocks steady; SpaceX worries hit telecoms - Reuters", "full_content": "Nasdaq ticks up as tech stocks steady; SpaceX worries hit telecoms Reuters Stock Market Today: Dow and S&P 500 fall, Nasdaq waffles as tech stocks bounce and oil prices climb MarketWatch Nasdaq Futures Rise After Chip Selloff While S&P 500, Dow Track Mixed Open: SLV, GLD, SOXL, BE In Focus Yahoo Finance Sandisk, Datadog, Amazon Lead S&P 500 As AI Stocks Rebound Investor's Business Daily Nasdaq climbs more than 1% as AI trade makes a comeback CNBC", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 09:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "US 10-Year Treasury Yields Drops To 5% As Investors Take Cover From AI-Battered Stocks", "full_content": "The US 10-year Treasury yield fell to around 4.95% on October 22, recording its steepest daily decline since the March 2023 banking crisis. Investors moved into government bonds as AI-related stock losses rattled markets.", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 09:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio Platforms IPO draws record 10 million applications amid strong investor demand", "full_content": "Jio Platforms Ltd\u2019s initial public offering (IPO) attracted more than 10 million applications over its three-day subscription window, the highest number for any share sale in India\u2019s history, as investors placed bids worth \u20b9 4.9 trillion.\n\nThe \u20b9 30,213-crore offering was subscribed 22.19 times by Friday, according to the BSE, with demand far exceeding the shares reserved for institutional investors. Foreign institutional investors (FIIs) submitted bids worth \u20b9 1.39 trillion, subscribing to their reserved portion 25 times, despite being net sellers in the secondary market. They have net sold shares worth \u20b9 96,612 crore in September and October so far.\n\nThe country\u2019s largest-ever IPO was fully subscribed within 100 minutes of opening on Wednesday, 21 October, the first day of IPO. Backed by Reliance Industries Ltd, Jio Platforms counts Meta Platforms Inc. and Google parent Alphabet Inc. among its investors and is led by Akash Ambani , the eldest son of Reliance chairman Mukesh Ambani. Retail investors put 2.72 more bids for the IPO. While the non-institutional investors (NIIs) put 14 times more bids for the IPO.\n\nThe blockbuster response is being watched as a test of investor appetite for large listings at a time when Indian equities have underperformed other Asian markets.\n\n\u201cThe strong demand is also reflected in the availability of institutional capital waiting to be deployed, with both domestic and foreign investors looking to participate in India\u2019s story,\u201d said Manick Wadhwa, executive director at SKI Capital Services Ltd. Despite pressure on Indian equities from rising bond yields, rupee depreciation and geopolitical tensions, investors viewed Jio as an attractive bottom-up investment opportunity, he said.\n\nJio Platforms\u2019 scale and faster revenue growth than its listed telecom rivals underpin its public offering.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 09:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Chennai Petroleum vs MRPL: Which PSU refinery stock wins on Q2 profit, revenue, dividends? Experts weigh in on outlook", "full_content": "Chennai Petroleum vs MRPL: Chennai Petroleum Corporation Limited and Mangalore Refinery and Petrochemicals Limited (MRPL) are among top refinery Public Sector Undertaking (PSUs) that have recently announced second quarter results for the financial year 2026-27.\n\nWhile Chennai Petro reported a 212% yearly jump in net profit, MRPL\u2019s Q2 profit more than tripled on an annual basis. Both the PSU stocks have also declared dividend for FY27. For investors who closely track development around PSU stocks, here are all the details to know.\n\nThe Tamil Nadu-headquartered oil refining company reported a 212% year-on-year jump in its consolidated net profit for the period to \u20b9 2247.03 crore in Q2FY27 against \u20b9 719.19 crore reported in the year ago period.\n\nMangalore Refinery and Petrochemicals Limited (MRPL), a subsidiary of Oil and Natural Gas Corporation (ONGC), posted a nearly threefold annual jump in its standalone net profit to \u20b9 1,881 crore in the second quarter of FY27, compared with \u20b9 639 crore in the corresponding quarter last year.\n\nIts net consolidated revenue from operations surged to \u20b9 22,055 crore in Q2FY27 against \u20b9 20,033 reported in the corresponding quarter. Chennai Petroleum Corporation Limited\u2019s net revenue stood at \u20b9 29,358 crore reported in the first quarter of financial year 2026-27.\n\nMRPL\u2019s revenue from operations surged 37% on an annual basis to \u20b9 35,590 crore in Q2 FY27 from \u20b9 25,953 crore in Q2 FY26.\n\nChennai Petro has announced an interim dividend of \u20b9 25 per equity share, representing a 250% payout on the stock\u2019s face value of \u20b9 10 per share. The board has also announced a record date to determine the eligibility of shareholders for the payout.\n\nMRPL\u2019s board of directors approved the first interim dividend of \u20b9 3 per equity share, representing 30% of the face value of each share.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 09:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Funeral Turns Deadly In Jordan As Gunmen Storm Church; Six Killed, 28 Injured", "full_content": "Following the deadly attack at a church in Jordan, which has claimed six lives so far, King Abdullah II vowed severe action against those responsible. He said, \"Every Jordanian life is precious, and we will strike with an iron fist against those who dare to threaten our nation.\"", "source": "NDTV Profit", "pub_date_str": "23 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "What we want to see when this data center stock reports earnings next week", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 09:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "India's exports to Germany could cross $50 billion by 2030: ASSOCHAM", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India's exports to Germany could cross $50 billion by 2030: ASSOCHAM The Economic Times daily newspaper is available online now. Read Today's Paper India's exports to Germany could cross $50 billion by 2030: ASSOCHAM SECTIONS India's exports to Germany could cross $50 billion by 2030: ASSOCHAM ANI Last Updated: Oct 23, 2026, 09:42:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ASSOCHAM said the potential for expanding market access, investment and business partnerships between India and Germany. It said the two countries could use their respective strengths in manufacturing, technology and innovation to deepen economic ties and create new growth opportunities.\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Oct 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "American Airlines says airfares could stay elevated even if fuel prices drop - Fox Business", "full_content": "American Airlines says airfares could stay elevated even if fuel prices drop Fox Business American sets new revenue records amid historic fuel cost pressure American Airlines Newsroom American Airlines forecasts bigger loss in 2026 on fuel spike, plans to slow growth next year CNBC Airfares will not return to pre-Iran war levels, American Airlines warns Financial Times US airlines struggle to offset soaring fuel costs with big fare hikes Reuters", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Dow tumbles 500 points as Middle East tensions rise, selling broadens beyond tech: Live updates", "full_content": "The Dow slid on Friday as a sell-off in tech in the prior session shifted to other areas of the market and U.S. oil prices topped $100 a barrel amid rising fears that the U.S.-Iran conflict would flare up again.\n\nThe Dow Jones Industrial Average dropped 543 points, or 1%, while the S&P 500 slipped 0.3%. The Nasdaq Composite gained 0.7%.\n\nMore defensive stocks came under pressure on Friday, with the consumer staples, utilities and healthcare sectors all lower. Dow component American Express fell more than 3% after announcing it was cutting about 5% of its global workforce , citing the need to \"prepare for AI.\" Caterpillar also edged down about 2%, while Goldman Sachs fell around 1%, adding pressure to the 30-stock index.\n\nOn Thursday, many technology stocks had pulled back as traders assessed the impact of outsized corporate borrowing and rising rates on AI and other tech names. Microsoft ticked higher on Friday. However, chip stocks such as Micron Technology and Advanced Micro Devices were making a stronger move, with gains of 4% and 2%, respectively.\n\n\"For the last two weeks, investors have been sprinting from tech stocks and data center beneficiary stocks to safe stuff, and eventually, you run out of people willing to do that sprint, and that's what today looks like and feels like,\" Jed Ellerbroek, portfolio manager at Argent Capital Management, told CNBC.\n\nEllerbroek added that tech companies' earnings have proven strong this season, giving investors a reason to embrace tech stocks and focus less on emotion-based flights to safety.\n\n\"Emotion and fear play a really big role,\" the investor said. But, \"we've gotten a few tech companies' [latest quarterly financial reports] and their earnings results have been good.\"\n\nThe 10-year Treasury yield was steady at around 4.994%.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 11:18 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "DOJ sues to block Alaska from certifying Senate race winner if Republican narrowly loses", "full_content": "The Department of Justice filed an extraordinary lawsuit seeking to block Alaska from certifying the winner of its upcoming U.S. Senate election if incumbent Republican Sen. Dan Sullivan loses .\n\nThe lawsuit cites what it argues is likely voter confusion from the name of another candidate, retired teacher Daniel J. Sullivan, on the ballot.\n\nThe DOJ says that could help Democratic nominee Mary Peltola defeat the incumbent, Dan S. Sullivan, in what is expected to be a close contest. The Alaska race is one of several Senate contests in November that could determine whether Republicans retain their slim majority in the upper chamber of Congress.\n\n\"The United States accordingly brings this lawsuit to protect the integrity of the 2026 Senate election in Alaska,\" says the suit filed Thursday in U.S. District Court in Alaska. In addition to the state, the complaint names Alaska Elections Division Director Carol Beecher, the state's election boards and the state Ballot Counting Review Board as defendants.\n\nThe suit asks a federal judge in Alaska to bar the state from certifying \"any result that may be impacted by voter confusion ... pending an investigation to determine whether votes cast for Daniel J. Sullivan were meant to be cast for Senator Sullivan.\"\n\nThe suit alleges that Daniel J. Sullivan's \"sole purpose\" of running for the Senate \"is to benefit the Peltola campaign by reducing the number of votes for Senator Sullivan.\" Sullivan first registered as a Republican earlier this year. He previously was a member of the Alaska Independence Party.\n\nThe Cook Political Report with Amy Walter rates the Alaska Senate race as one of seven \"toss-up\" contests for that chamber. The election tracking site FiftyPlusOne 's average of polling shows Peltola, a former U.S. House member from Alaska, with just a two-point lead over Sullivan.\n\nThe suit came hours after President Donald Trump, in a Truth Social post, wrote, \"I am very concerned about the Dan S. Sullivan Race for the U.S.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 11:12 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Investors are starting to find opportunities in the battered bond market", "full_content": "Even after another bond market rout Friday, investors are turning their attention toward Treasurys, anticipating that yields may be topping out.\n\nThe benchmark 10-year note spent the day flirting with the psychologically important 5% level as oil prices surged and a fresh consumer survey showed that inflation expectations remain a good distance above the Federal Reserve's 2% goal.\n\nStill, some market participants see reason for hope in a market bludgeoned this year over worries about rising prices, tensions in the Middle East and stiff competition from artificial-intelligence hyperscalers flooding the market with debt.\n\nBank of America's Michael Hartnett in a client note declared \"The Price is Right\" on the battered Treasury market, which he noted has seen its worst long-run return in the past 100 years.\n\nThe investment strategist noted in his weekly money-flow summary that the \"secular contrarian [trade] would be adding bonds,\" drawing a parallel to similar long-run negative returns for stocks and commodities that later proved to be good entry points\n\nDespite the negative returns and soaring yields this year, investors are putting money into fixed income and government debt in particular.\n\nTreasurys saw $5.4 billion in inflows over the past week, part of $12.1 billion overall into the bond market, according to data compiled by BofA. The iShares 20+ Year Treasury Bond ETF, a $47.3 billion fund that offers exposure to long-dated government debt, has seen $1.14 billion in fresh investor cash over the past month.\n\nOne reason for investor enthusiasm is the simple belief that the Treasury sell-off has exhausted itself, with the market pricing in the various risks to the market and now at least ready to stabilize.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 11:10 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Macy\u2019s declares quarterly dividend of 19.15 cents per share", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 11:06 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "10-year Treasury yield drops back to 5% this week as investors seek cover from AI worries", "full_content": "Investors ran for cover this week as artificial intelligence fears and higher oil prices hit stocks, driving the yield on the 10-year U.S. Treasury note below 5%.\n\nThe benchmark yield was just under 5% on Friday, after falling beneath that level Thursday for the first time in a month, as investors continued to express misgivings over the massive debt tech companies are taking on to finance their build-out of AI networks.\n\nInvestors are also weighing higher energy prices as the Iran war drags on and are looking ahead to next week's Federal Reserve meeting, said Art Hogan, chief market strategist at B. Riley Wealth.\n\n\"The massive selling of Treasurys in the month of September, bringing yields up by close to 50 basis points, clearly got ahead of itself,\" he said. \"What we're seeing over the last two weeks is the slow unwind of that trade back to what is likely a more normalized level of yield.\"\n\nOn Friday, the yield on the 10-year U.S. Treasury \u2014 used as a benchmark for borrowing costs including mortgages \u2014 rose more than 3 basis points to 4.99%.\n\nThe yield on the 2-year Treasury note, which more closely follows short-term Federal Reserve policy, increased by 5 basis points to 4.686%. Yields on longer-dated 30-year U.S. Treasurys climbed nearly 3 basis points to 5.315%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThis week's rebound in Treasury prices comes just weeks after 10- and 30-year yields jumped to their highest levels in more than 20 years .", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:56 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Qatar deal to buy U.S. natural gas shows how Iran war has redrawn global energy markets", "full_content": "Before the Iran war, Qatar was one of the biggest natural gas exporters in the world. After only eight months, the Gulf state is now buying supplies from its principal competitor \u2014 the United States.\n\nQatarEnergy struck a deal Thursday with U.S. exporter Cheniere Energy to buy 4 million metric tons of liquefied natural gas (LNG) annually through 2054. The purchase price is indexed to the U.S. Henry Hub price plus a fixed fee. Deliveries are expected to begin in the 2030s.\n\n\"We look forward to reliably supplying QatarEnergy from both Sabine Pass and Corpus Christi into the second half of this century,\" Cheniere CEO Jack Fusco said in a statement.\n\nThe gas that Doha will buy is less than 1% of the global LNG trade of more than 400 milion metric tons. But \"in terms of an individual deal, this is about as big as you see in the U.S,\" said Alex Munton, director of global gas and LNG at Rapidan Energy in Houston.\n\nThe deal signals how the Iran war is reshaping global energy markets to the benefit of U.S. companies, cementing the dominance of American LNG exporters. Shares of Cheniere and Venture Global , the other independent U.S. player, have gained 26% and 40%, respectively, since the start of the war.\n\nQatar was second only to the U.S. in LNG exports before the war. But shipments have since collapsed in the eight months since Iran bombed its key production facility at Ras Laffan. The attack badly damaged two production lines, taking out about 17% of Qatar's LNG export capacity.\n\nIt will take about three years to repair the damage at Ras Laffan, Qatar's Energy Minister Saad Sherida Al-Kaabi has said. The Persian Gulf state has declared force majeure \u2014 citing unexpected, uncontrollable events preventing contracts from being honored \u2014 every month since the March attack.\n\n\"It did give us a big blow, if you will, for our production capability for the next few years,\" Al-Kaabi said in an interview on the sidelines of the U.N. General Assembly in September.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:55 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jana Small Finance Bank Q2 FY27 slides: record profit drives guidance upgrade", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:52 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "American Express is cutting 5% of its workforce to 'prepare for AI'", "full_content": "American Express is cutting thousands of employees as the leading credit card company prepares for artificial intelligence to take over more of its internal processes.\n\nAmex is eliminating 5% of its global workforce and taking a $336 million restructuring charge, CEO Stephen Squeri told analysts Friday on the company's third-quarter earnings call. The firm had almost 77,000 employees at the end of 2025.\n\nChief Financial Officer Christophe Le Caillec told CNBC in an interview that the restructuring was to make American Express \"leaner, more agile, and also to prepare for AI.\"\n\n\"You don't want to automate processes that are not optimally structured,\" Le Caillec said. \"So what we're doing here is to reduce layers and increase spans of controls, so that we can automate and take advantage of AI in the coming quarters and the coming years.\"\n\nThe Amex announcement reflects a broader trend across financial services, where banks are working to replace repetitive roles with AI automation. On Thursday, Barclays confirmed plans to trim 5,000 jobs \u2014 also roughly 5% of its staff \u2014 in another tech-driven cost initiative. The moves come even as the sector is enjoying robust profits from growing consumer spending and resilient credit.\n\nDuring the analyst call, Squeri said the charge was to improve the company's efficiency.\n\n\"We've got good momentum, but to accelerate innovation and win over the next few years, we needed to become [a] more agile and efficient organization,\" Squeri said.\n\nSqueri devoted a 10-minute section of his prepared remarks to his views on AI, focusing mainly on how it will be used to personalize experiences and offers for Amex cardholders.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:51 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IPO Subscription status comparison: Reliance Jio IPO vs Hyundai IPO vs NSE IPO - Who won the race?", "full_content": "Reliance Jio IPO vs Hyundai IPO vs NSE IPO: Jio Platforms initial public offering closed on Friday with bumper subscription. Backed by Reliance Industries Limited, Jio IPO was subscribed 22.19x by the end of third day of subscription.\n\nJio Platforms is all set to become India\u2019s biggest ever IPO after dethroning Hyundai IPO which came in 2024. With Reliance Jio IPO drawing strong response, let's understand how it compares with Hyundai Motor India's IPO (which came in 2024), and National Stock Exchange (NSE) IPO.\n\nThe IPO was subscribed 22.19x by the end of day 3. As the Reliance Jio IPO subscription closed on Friday, here is full breakdown of how much the issue was subscribed over the last three days in different segment.\n\nJio IPO was subscribed 22.19 x on day 3. The issue was subscribed 70.55 times in the qualified institutional buyers (QIB) category, 14 times in non institutional investors (NII) category, 2.72 times in the retail investors segment.\n\nIt received 2.93x bidding in employee reserved quota, and 7.60x subscription in the reservation portion shareholder.\n\nHyundai Motor India IPO opened on October 15, 2024 and closed on October 17, 2024. It was subscribed 2.37 times on its third day of subscription in October 2024, reported Mint earlier. The issue saw 6.95x bidding in QIB category, 0.60x in the NII segment, 0.50x to 0.60x in the retail portion, and 1.74x in the employee portion.\n\nNSE IPO opened for subscription on September 17, 2026 and closed on September 21, 2026. By the end of third day, the issue was subscribed nearly 5.71 x, reported Mint earlier.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:49 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "GTT Q3 2026 slides: order surge drives record backlog despite revenue dip", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:47 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sebi bars Avadhut Sathe, academy from markets, imposes \u20b911.5 crore penalty", "full_content": "The Securities and Exchange Board of India (Sebi) has imposed penalties totalling \u20b9 11.5 crore on Avadhut Sathe Trading Academy Pvt. Ltd (ASTAPL) and its directors, and barred them from accessing the securities markets for periods of up to two years for providing unregistered investment advisory and research analyst activities.\n\nIn a final order issued on Friday, the market regulator directed ASTAPL and its founder Avadhut Dinkar Sathe to disgorge and refund \u20b9 546.17 crore to eligible investors and participants who paid for its unregistered services. It has also ordered a deposit of \u20b9 67.87 crore in interest with Sebi\u2019s Investor Protection and Education Fund.\n\nSebi imposed a penalty of \u20b9 6 crore on ASTAPL, \u20b9 4 crore on Sathe and \u20b9 1.5 crore on Gouri Avadhut Sathe, another director.\n\nSebi also prohibited ASTAPL and Avadhut Sathe from accessing or dealing in the securities markets, directly or indirectly, for two years or until they comply with the refund direction, whichever is later. Gouri Sathe has been barred for six months.\n\nSebi had issued an interim order on the matter on 5 December 2025.\n\nThe regulator\u2019s action follows its findings that the academy\u2019s activities went beyond financial education and included investment advice and research-related services without the required registrations. The order cites recommendations on specific securities, including buy and sell calls, price targets and stop-loss levels, delivered through live sessions and WhatsApp communications.\n\nThe order directs ASTAPL and Sathe to publish refund notices within 30 days of receiving it in two national newspapers\u2014one English and one Hindi\u2014and a local-language newspaper. The notices must explain how eligible claimants can seek refunds.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 10:46 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Doctors call Moderna, Merck cancer vaccine data a major advancement \u2014 despite Wall Street reaction", "full_content": "Beneath the chaos surrounding Moderna and Merck 's latest data on their personalized cancer vaccine, oncologists see something else: an important milestone in melanoma treatment.\n\nThe companies on Thursday released detailed results from a phase 3 trial on their mRNA-based shot after partial data leaked on social media platforms earlier that day.\n\nThe vaccine, known as intismeran autogene, reduced the risk of melanoma recurrence or death by 42% when given alongside Merck's immunotherapy Keytruda, compared with Keytruda alone. The combination also reduced the risk of cancer spreading to distant parts of the body or death by 38%, compared with just the immunotherapy, according to the trial on roughly 1,100 patients whose tumors were removed by surgery.\n\nThe stock market's reaction contrasted with the assessment of six melanoma specialists, who told CNBC the results represent a clinically meaningful advance that could eventually become a standard of care for patients who undergo surgery first and have not received immunotherapy before their operation.\n\n\"This has the potential to be a major breakthrough in melanoma treatment and also cancer immunotherapy in general that will open the door to greater outcomes for patients,\" said Dr. Sekwon Jang, a melanoma specialist at Inova Schar Cancer and principal investigator at one of the trial's U.S. sites.\n\nDr. Janice Mehnert, NYU Langone skin cancer specialist and trial investigator, added that \"this is the first time we're seeing that when you add something to immunotherapy, you actually boost the efficacy of the immunotherapy.\"\n\nThe vaccine is not far from potentially entering the market for the first time and reaching melanoma patients. In an interview ahead of the results, Moderna CEO St\u00e9phane Bancel said the company is finishing a filing with regulators as it aims to get the drug fully approved next year.\n\n\"It's a very, very happy moment for the field, for patients,\" he said.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:45 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The S&P 500 is forming a bearish chart pattern. Can it snap out of it?", "full_content": "The S&P 500 has struggled to break decisively above 7,800 since first reaching that area in late July.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 10:44 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Goldman Sachs sees US stocks dip on tech earnings and macro shifts", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 10:41 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Smith & Nephew talks with J&J on orthopaedics deal fail over CEO role, source says - Reuters", "full_content": "Smith & Nephew talks with J&J on orthopaedics deal fail over CEO role, source says Reuters How a transatlantic mega-merger fell apart over a leadership tug of war Financial Times UK Markets Eye A Higher Open As Deals And Data Clash Finimize U.K. stocks higher at close of trade; Investing.com United Kingdom 100 up 0.24% By Investing.com Investing.com Johnson & Johnson and Smith & Nephew Merger: $10 Billion Debt and \"Who Would Be CEO\" Dispute the deep dive", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 10:34 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Oil hits $117 for first time since April on fears of flare-up in Iran hostilities", "full_content": "Rise in energy prices pushes US inflation expectations higher", "source": "FT Markets", "pub_date_str": "23 Oct 2026, 10:31 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018Some people did everything right\u2019: I lost my home in the Great Recession. I rent in my 50s. Why is that judged as failure?", "full_content": "\u201dI earn $110,000 a year.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "23 Oct 2026, 10:30 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Strong macro fundamentals, policy interventions to anchor eco against global headwinds: RBI bulletin", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Strong macro fundamentals, policy interventions to anchor eco against global headwinds: RBI bulletin The Economic Times daily newspaper is available online now. Read Today's Paper Strong macro fundamentals, policy interventions to anchor eco against global headwinds: RBI bulletin SECTIONS Strong macro fundamentals, policy interventions to anchor eco against global headwinds: RBI bulletin PTI Last Updated: Oct 23, 2026, 10:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Strong macroeconomic fundamentals continue to support the Indian economy against global inflation and trade tensions. Recent geopolitical frictions have resulted in increased prices and supply chain issues, leading to policy changes. Currency fluctuations were observed, but measures by the Reserve Bank helped stabilize the rupee recently. Foreign Direct Investment remains robust, driven by significant inflows from major sources like the US and Singapore.\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Oct 2026, 10:26 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. fines Air France, KLM over flights in prohibited Iraqi airspace", "full_content": "The U.S. Transportation Department said Friday it was fining Air France and KLM a total of $425,000 for operating dozens of flights in prohibited Iraqi airspace while carrying Delta Air Lines ' code share.\n\nThe Federal Aviation Administration prohibits flight operations by U.S. operators in foreign-managed airspace where conflict, militant activity, or heightened tensions can threaten the safety of flights, and foreign airlines operating flights with a U.S. airline's code must abide by these prohibitions.\n\nAir France operated more than 30 flights and KLM more than 100 flights carrying the Delta code through FAA-prohibited airspace over Iraq betwe
