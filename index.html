    const allData = {"general": [{"title": "Anti-Houthi forces retreat in Yemen as Iran strikes Bahrain in attack on U.S. base", "full_content": "Iran and its allies ramped up pressure on the U.S. and allied Gulf states on two fronts on Sunday, with Saudi-backed forces retreating in their battle against the Iran-aligned Houthis in Yemen and Iran itself firing drones at U.S. bases in Bahrain.\n\nIn Yemen, Saudi Arabia's campaign against the Houthis suffered a major setback, as its allies, fighting on behalf of the internationally recognized Yemeni government, pulled back from the Bab el-Mandeb Strait to defend their temporary capital Aden on the southern coast.\n\nThe announcement signaled the apparent end of a six-week government counteroffensive to drive the Houthis from the mouth of the Red Sea to secure a key oil route.\n\nMeanwhile, Iranian attacks on Bahrain, headquarters of the U.S. Fifth Fleet in the Gulf, were likely to put new pressure on U.S. President Donald Trump to resolve the war he launched nearly nine months ago.\n\nSince the unpopular war contributed to a defeat for his Republicans in midterm elections this month, Trump has played down the need for a diplomatic breakthrough.\n\nMajor warfare between the U.S. and Iran has calmed since the early phase of the conflict, but with diplomacy stalled there is little immediate prospect of a resolution either to the wider conflict or the war in Yemen.\n\nSunday's announcement of a Yemeni government retreat raises the prospect of new Houthi advances towards Aden on the southern coast, base of the internationally recognized government since the Houthis drove it from the capital Sanaa more than a decade ago.\n\n\"The Southern Armed Forces announce the implementation of a redeployment operation for its forces from Dhubab Airport and the Bab el-Mandeb area, west of Taiz Governorate,\" the main military force fighting for Yemen's government in the south of the country said in a statement.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 12:41 AM IST", "pub_date_relative": "13m ago"}, {"title": "New Maori generation seeks to reshape New Zealand\u2019s political landscape", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 12:36 AM IST", "pub_date_relative": "18m ago"}, {"title": "Fed 'has some work to do on inflation,' Kansas City Fed chief says", "full_content": "The Federal Reserve has the tools and responsibility to address price pressures that are \"running too hot,\" and the central bank \"has some work to do on inflation,\" Kansas City Fed President Jeff Schmid said Sunday.\n\nSchmid, speaking to a credit union conference in Hawaii, did not specifically call for additional rate hikes, but said inflation is \"uncomfortably above the 2% price stability target, and moving in the wrong direction.\"\n\nCommon narratives that have recently evolved around the nature of current inflation and the Fed's ability to contain it are off-base, Schmid said.\n\nFirst, Schmid said, the view that high inflation is a reflection of repeated supply shocks neglects that \"inflation is always the result of an imbalance between supply and demand. It is in the context of strong demand that a disruption to supply drives up prices. Demand always plays a role in inflation, and the Fed, through its influence on demand, always has the tools and responsibility to address inflation.\"\n\nSchmid, who is not a Federal Open Market Committee voting member this year, said he also disagrees with the narrative that the sources of demand-induced inflation right now \u2014 like the artificial intelligence buildout \u2014 are resistant to Fed policy.\n\nThe Fed raised rates by a quarter-percentage point in September to 3.75%-4.00% but opted not to lift them again at last month's meeting.\n\nAfter recent inflation readings came in higher than expected and comments from other Fed officials, including influential Governor Christopher Waller, interest rate futures markets are now fully priced for a quarter-point increase at December's meeting, with a small probability of a half-point hike.\n\n\"I would also push back on the idea that meeting our inflation objective requires a reaction from any particular set of prices, for example prices for AI-related technology goods,\" Schmid said.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 12:34 AM IST", "pub_date_relative": "20m ago"}, {"title": "Gaia director Paul Sutherland buys $13,647 of company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 12:31 AM IST", "pub_date_relative": "23m ago"}, {"title": "Kansas City Fed\u2019s Schmid says central bank has work to do on inflation", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 12:28 AM IST", "pub_date_relative": "26m ago"}, {"title": "Wall Street Week Ahead: Nvidia earnings, Anthropic IPO, Federal Reserve minutes, retail sales - Top things to watch", "full_content": "Rajendra Saxena Published 16 Nov 2026, 12:02 AM IST Prefer Livemint on Google Wall Street is heading into a crucial week, with investors closely tracking Nvidia's quarterly earnings, artificial intelligence (AI) company Anthropic's proposed initial public offering (IPO) and the release of the Federal Reserve's October meeting minutes. These developments, along with key US economic indicators and corporate earnings, are expected to influence sentiment across American stock markets.\n\nNvidia's earnings announcement on Tuesday will be among the biggest events of the week, as investors look for indications that demand for AI infrastructure remains strong amid concerns over the sustainability of massive investments in the sector.\n\nMeanwhile, Anthropic's proposed stock market debut and fresh signals on the US economy could add to market volatility.\n\nThe US semiconductor giant is scheduled to announce its fiscal third-quarter results on Tuesday.\n\nAccording to LSEG data, analysts expect Nvidia to report earnings growth of around 90% on revenue of approximately $109 billion.\n\nInvestors will particularly focus on the company's outlook for AI-related spending and demand for its advanced chips, which have been at the centre of the global AI investment boom.\n\nNvidia shares came under pressure last week amid controversies surrounding its longtime chief executive and co-founder Jensen Huang, according to the developments outlined in the report.\n\nThe company's market capitalisation has also declined significantly. LSEG data showed that Nvidia's valuation fell from approximately $5.8 trillion in early October to $3.9 trillion as of Friday.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 12:02 AM IST", "pub_date_relative": "51m ago"}, {"title": "Houthis claim missile attack on Riyadh airport", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 12:01 AM IST", "pub_date_relative": "53m ago"}, {"title": "'We slept here': Flight delays linger but schedule is back on track for Monday", "full_content": "U.S. flights are set to run close to normal on Monday as airlines scramble to get back on track after the Federal Aviation Administration grounded departures nationwide for more than four hours on Friday.\n\nDisruptions lingered on Sunday, but passengers were getting on their way.\n\nMore than 1,600 U.S. flights there were canceled as of noon ET and more than 4,000 were delayed, according to FlightAware data. That was far fewer than the almost 6,700 cancellations on Saturday and more than 9,200 on Sunday when the FAA halted all departures into U.S. airports.\n\n\"We slept here,\" said Beth Martin, who was trying to travel home to Birmingham, Alabama, from New York's LaGuardia Airport on Sunday at the end of her daughter's birthday trip. They were booked for Saturday night, and when delay announcements started rolling in from Delta Air Lines , they decided to make good use of the extra time: after strolling through Central Park, they went window shopping on Fifth Avenue.\n\nBut when the flight was canceled, the standby list on a backup flight looked grim, and their original midtown hotel was charging about $700 for an additional night, the two of them slept at LaGuardia on Saturday. She said they found wheelchairs to sleep in outside security.\n\nTransportation Secretary Sean Duffy on Saturday tied the issue to a router and work to update from copper wires, a system overseen by L3Harris Technologies , to a fiber-optic system. FAA administrator Bryan Bedford said the upgrades were part of \"routine\" maintenance to switch over to fiber optic.\n\n\"We are supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel,\" L3Harris said in a statement Saturday afternoon.\n\nAirlines waived change fees and fare differences and offered pilots and flight attendants extra pay to ease the delays.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 11:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "DOT Sec. Duffy ties router in southern Arkansas to issues that led to nationwide ground stop", "full_content": "Transportation Secretary Sean Duffy said Sunday that a router installed in southern Arkansas as part of an upgrade to a system overseen by L3Harris Technologies could be key to problems that led officials to order the biggest halt to flight departures to U.S. airports since 9/11 on Friday.\n\n\"We think it was the installation or the router that was the bad actor,\" Duffy said in an interview with Fox News. \"We're open if we see something else, we're going to continue to investigate with our federal partners and law enforcement.\"\n\nDuffy told ABC's \"This Week\" in a separate interview that the router was located in El Dorado in southern Arkansas. The equipment, along with another router that was in Amarillo, Texas, is at an L3Harris lab in Florida for examination, Duffy said.\n\nHe said the router, part of ongoing work to switch from copper wire to a fiber-optic system, began flooding other systems. Federal officials said on Saturday that \"instability\" in communication feeds and data like radar prompted the more than four-hour ground stop.\n\nFlight disruptions lingered on Sunday but were far from the thousands of cancellations passengers faced on Friday and Saturday.\n\nThere was \"zero evidence\" that the problem was caused by something \"nefarious\" or anything related to artificial intelligence, Bryan Bedford, the head of the Federal Aviation Administration, said at a press conference with Duffy Saturday morning.\n\nBedford said no FAA facilities went dark but that officials decided to ground flights because of \"instability\" in information feeds to air traffic control centers that handle en route aircraft at high altitudes and eventually to others closer to airports.\n\nThe issue occurred during \"routine\" upgrades of switching from a copper wire system to fiber, Bedford said.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 11:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Income tax department flags \u20b91.5 crore deal over WhatsApp chat and \u20b910 note photo; why ITAT deleted the addition", "full_content": "A WhatsApp conversation, a \u20b9 10 note photograph and a statement alleging a cash delivery of \u20b9 1.5 crore led to a tax addition against Ahmedabad-based Khushi Advertising Ideas Private Limited. The Income Tax Appellate Tribunal (ITAT), however, found that the department had not established the company\u2019s involvement in the alleged transaction and upheld deletion of the addition.\n\nThe Ahmedabad bench delivered the ruling in DCIT vs Khushi Advertising Ideas Private Limited , ITA No. 2200/AHD/2025 on 14 October 2026, dismissing the department\u2019s appeal for assessment year 2023-24. The tribunal held that third-party communications and statements, without corroborating evidence linking cash delivery to the taxpayer , could not sustain the addition.\n\nThe matter originated in a search conducted on the Miraj Group on 21 February 2023. Investigators recovered WhatsApp conversations from the mobile phone of Amit Sharma, a director of Miraj Entertainment Limited (MEL).\n\nAccording to the messages, Sharma had asked Sanjay Singh to arrange \u20b9 2 crore in cash. Of this, \u20b9 1.5 crore was allegedly delivered to Khushi Advertising Ideas in Ahmedabad. A \u20b9 10 note photograph was reportedly sent to Singh as an identifying token for the transaction.\n\nIn a statement recorded under Section 132(4) of the Income Tax Act, Singh claimed that he had delivered \u20b9 1.5 crore to a person named Ajay in exchange for the token. The department treated the messages and statement as evidence of an accommodation-entry arrangement involving MEL and the advertising company.\n\nThe assessing officer alleged that Khushi Advertising Ideas received cash from MEL and routed the amount back through banking channels. The officer treated \u20b9 1.5 crore as unexplained expenditure under Section 69C, alleging that the company had recorded bogus expenditure in its books.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 11:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bessent calls for \u2018dramatic shakeup\u2019 at Nvidia, urges outside CEO", "full_content": "Treasury Secretary Scott Bessent on Sunday called for a \"dramatic shakeup\" at Nvidia after CEO Jensen Huang 's resignation, questioning whether the chipmaker pursued illicit sales of its advanced artificial intelligence chips to boost earnings.\n\nBessent said Nvidia's board should look outside the company for its next chief executive and suggested other executives should face scrutiny over the chip giant's compliance with U.S. export controls.\n\n\"I want to keep coming back to what was the culture at Nvidia, and were they pressing these seemingly illicit sales to goose their revenues and their earnings?\" Bessent said in an interview on Fox News.\n\nThe remarks come amid a growing feud between Bessent and Commerce Secretary Howard Lutnick over the suspected diversion of advanced AI chips to China, even as the Treasury secretary continues to defend President Donald Trump's handling of the matter.\n\nBoth Bessent and Lutnick are expected to accompany Trump to China this week, Semafor reported Sunday, putting the two Cabinet secretaries alongside the president as he prepares to meet with Chinese President Xi Jinping and Russian President Vladimir Putin on the sidelines of the APEC summit.\n\nA White House official told Reuters on Thursday that the president maintains \"complete confidence\" in Lutnick, despite mounting scrutiny of the secretary\u2019s handling of the Nvidia matter.\n\nHuang resigned Thursday following revelations about his relationship with Alice Huang, a former executive at Singapore-based Megaspeed , whom U.S. intelligence officials suspect of spying for China. Megaspeed is suspected of diverting Nvidia chips to China in violation of U.S. export controls.\n\nNvidia named Chief Financial Officer Colette Kress interim CEO.", "source": "CNBC World Economy", "pub_date_str": "15 Nov 2026, 11:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "It\u2019s not just an affair. Nvidia\u2019s bigger issue could be chip smuggling. - The Washington Post", "full_content": "It\u2019s not just an affair. Nvidia\u2019s bigger issue could be chip smuggling. The Washington Post How Jensen Huang Built the Backdoor Route That Keeps Beijing in the AI Race WSJ Commerce Department Finalizing Long-Awaited AI Remote Access Rule The Information How the Nvidia scandal lifted the curtain on a loophole that\u2019s giving China access to US chips CNN Congress moves to pass tighter AI chip export rules following Nvidia scandal Financial Times", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 11:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "VIVOS president Brad Weeks acquires $1,231 of common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 11:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "GTA 6 Dwarfs Hollywood With $3.2-Billion Year-One Sales Projection \u2014 Check New Features", "full_content": "Grand Theft Auto VI's impact on entertainment is anticipated to eclipse major releases such as Avengers: Doomsday and Dune: Part Three in terms of both money and cultural relevance.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 11:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Transportation secretary says he doesn\u2019t apologize for FAA\u2019s nationwide ground stop - NBC News", "full_content": "Transportation secretary says he doesn\u2019t apologize for FAA\u2019s nationwide ground stop NBC News Exclusive | The Single Router in Southern Arkansas That Ground Air Travel to a Halt WSJ Duffy blames Congress, prior administrations for air travel halt, chaos The Washington Post The systems used to keep America flying are ancient. That makes fixing the problem that much more difficult CNN What to know about flights after the US nationwide ground stop AP News", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 11:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Belgium vs Italy Live Streaming: When And Where To Watch UEFA Nations League Match On TV, Online?", "full_content": "Kevin De Bruyne-led Belgium will take on Italy in their final group-stage fixture of the 2026-27 UEFA Nations League.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bessent Says Nvidia Needs \u2018Dramatic Shakeup\u2019 With Huang Out - Bloomberg.com", "full_content": "Bessent Says Nvidia Needs \u2018Dramatic Shakeup\u2019 With Huang Out Bloomberg.com Bessent calls for \u2018dramatic shakeup\u2019 at Nvidia, urges outside CEO CNBC New candidate emerges to replace Jensen Huang as Nvidia CEO Fox Business Nvidia co-founder Chris Malachowsky is seen as a potential successor to Huang Yahoo Finance Analysis \u2022 How Nvidia's turmoil could become a problem for Israel's economy Haaretz", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 10:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Pension cannot be attached to recover another person's loan even if retired employee stood as guarantor: J&K&L HC", "full_content": "The Jammu and Kashmir and Ladakh High Court has ruled that pensionary benefits of a retired government employee cannot be subjected to coercive recovery measures for repayment of a loan borrowed by another person, even if the retired employee had stood as a guarantor for the loan.\n\nAllowing an appeal filed by a retired police personnel, Justice Moksha Khajuria Kazmi set aside a trial court order that had refused interim protection to the appellant. The High Court restrained Jammu and Kashmir Bank from deducting any amount from his pension account towards repayment of the loan obtained by the principal borrower, reported LiveLaw .\n\nThe court observed that pension is a welfare measure intended to safeguard the financial security of retired employees and their families. It is meant to protect them from financial dependence, destitution and hardship and, therefore, cannot be subjected to coercive recovery merely because an employee had stood as a loan guarantor during his service .\n\nHowever, the court clarified that the bank would remain free to recover its outstanding dues from the principal borrower through legally permissible means.\n\nThe appellant, Nazir Ahmad Kuchay, a retired police personnel and senior citizen, had stood as a guarantor for an individual who obtained financial assistance from Jammu and Kashmir Bank.\n\nAfter the principal borrower defaulted on loan repayments, the bank allegedly began deducting the outstanding amounts from Kuchay's bank account.\n\nBy that time, Kuchay had retired from government service and was dependent on his pensionary benefits to meet his and his family's living expenses.\n\nHe approached the bank and informed it about his retirement and dependence on pension income. According to his submissions, the bank assured him that no further deductions would be made from his pension account. However, the deductions allegedly continued despite the assurance.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 10:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "U.S. flight disruptions enter third day, FAA eyes Monday return to normal", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 10:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bessent Says Nvidia Needs 'Dramatic Shakeup' With Huang Out", "full_content": "Treasury Secretary Scott Bessent suggested the company should go outside the firm to find new leadership.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "Helus Pharma to present Phase 3 depression trial results Monday", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 10:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "Prince William, Kate Middleton To Meet PM Modi During India Visit", "full_content": "The Prince of Wales will attend the environmental awards ceremony during his three-day Mumbai visit before travelling to New Delhi for talks with Prime Minister Narendra Modi.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin wallet untouched since 2011 moves \u20b944 crore after legal notice in $260 billion lawsuit targeting dormant BTC", "full_content": "A Bitcoin wallet untouched since February 2011 has moved its entire holding of 75 Bitcoin, worth about $5 million (around \u20b9 44 crore), to a new address. The 12 November transfer has drawn attention because the wallet was among 39,069 addresses named in a New York lawsuit seeking ownership of nearly 3.8 million Bitcoin, valued at about $260 billion.\n\nThe transaction also moved a tiny Bitcoin payment sent to the address in May to deliver a court-ordered legal notice. The timing raises questions about a possible link to the lawsuit, but does not establish why the coins moved.\n\nAccording to CoinDesk, the address was listed as defendant No. 3,419 in the amended complaint. It received its original 75 BTC in two transactions in February 2011 and had not spent those coins since.\n\nOn 22 May 2026, the address received 546 satoshis, worth less than 40 cents, in a transaction carrying the words \u201cCOURT-ORDERED LEGAL NOTICE\u201d and a link to the plaintiffs\u2019 notice page. A satoshi is the smallest unit of Bitcoin; one BTC equals 100 million satoshis.\n\nThe wallet had also received a small payment in July 2025 carrying an owner notice from Salomon Brothers Strategic Advisors, the consultant hired by the plaintiffs to contact holders of the targeted addresses.\n\nOn Thursday evening, the entire balance was transferred to a new address. The transaction combined six inputs, including the original Bitcoin and the small deposits used for the notices, leaving the old address empty.\n\nThe six inputs included the original holdings and four deposits , two carrying notices. Such payments, called dust transactions, are tiny amounts sent to an address and can carry information in transaction data. This allowed plaintiffs to reach addresses without knowing owners.\n\nThe transfer shows that someone had access to the private keys needed to spend the Bitcoin. It does not identify that person, prove the legal notice was read or confirm that the lawsuit prompted the move.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 10:27 PM IST", "pub_date_relative": "2h ago"}, {"title": "Trump breaks silence about FAA nationwide ground stop, blames Biden administration", "full_content": "President Donald Trump on Sunday made his first public comments about Friday's nationwide ground stop by the Federal Aviation Administration, blaming the Biden administration for making an \"old and broken\" air traffic control system worse . Trump also urged Congress to approve more funding to modernize the system.\n\nThe ground stop lasted more than four hours Friday, disrupted flights nationwide, contributed to thousands of cancellations and delays, and affected hundreds of thousands of passengers.\n\n\"The Biden Administration was an FAA disaster,\" Trump wrote on his social media platform. \"Big money spent unwisely, making an old and broken system worse than when they began.\"\n\nThe president added that his administration has \"the knowledge and plan for the Flight Control Systems,\" but said that \"we need Congress to give the money, FAST!\"\n\nCongress approved $12.5 billion for the FAA last year as part of a major tax and spending package. Transportation Secretary Sean Duffy has said that the aging air traffic control system will need more funding for a broader overhaul.\n\nThe FAA said its equipment became unstable after a high volume of data flooded its network. The agency said contractor work at one site may be related and that the underlying cause remains under investigation .\n\nNationwide FAA ground stops are rare. Before the Nov. 2026 shutdown, the last two were after the Sept. 11 attacks and a brief FAA computer outage in January 2023.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 10:26 PM IST", "pub_date_relative": "2h ago"}, {"title": "US air travel disruptions continue into third day", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 10:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "Cyclone Murasu Caused Rs 2,484-Crore Damage in Andhra Pradesh; CM Seeks Immediate Central Aid", "full_content": "Paddy losses are estimated at up to 90 percent in Eluru, while more than 1,385 km of roads were damaged.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "Teradyne CEO Gregory Smith sells $1.35 million in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 10:16 PM IST", "pub_date_relative": "2h ago"}, {"title": "Watrana Rentals IPO GMP profit calculator on latest GMP: How much profit can retail and HNI investors expect?", "full_content": "Watrana Rentals\u2019 initial public offering is scheduled to open for subscription this week on Thursday, November 19. The SME IPO is an entirely fresh issue of 49.02 lakh shares of \u20b9 120.10 crore.\n\nThe SME IPO will open for subscription in the second half of next week and close the following week. The IPO\u2019s latest grey market premium (GMP) hints at 8.98% estimated listing gain, as per media reports trading the grey market price at 9 pm on Sunday, November 15. Here\u2019s how much profit investors can expect in different categories in the SME IPO.\n\nWatrana Rentals IPO grey market premium (IPO GMP) stood at \u20b9 22, hinting at 8.98% listing day gain. Considering its upper price band, i.e. of \u20b9 245 per share, the IPO is likely to be listed at \u20b9 267 per share (sum of IPO GMP today and upper price band).\n\nThe SME IPO has fixed issue price band at \u20b9 232 to \u20b9 245 per share. Its lot size for an application is 600 shares.\n\nUnlike mainboard IPO, investors are required to bid for a higher number of shares for an SME IPO. Hence, an individual investor must bid for minimum 2 lots, ie 1200 shares (nearly equivalent to \u20b9 2,94,000). Small High net worth individuals (SHNIs) are required to apply for minimum 3 lots, ie 1800 (approx \u20b9 4,41,000) and a maximum of 6 , ie 3600 (approx \u20b9 8,82,000 ). B-HNIs are required to subscribe for a minimum of 7 lots, ie 4200 shares (approx \u20b9 10,29,000).\n\nWatrana Rentals is a book build issue of \u20b9 120.10 crore and is an entirely a fresh issue of 49.02 lakh shares of \u20b9 120.10 crore. The IPO will open for subscription on November 19, Thursday and close on November 23, Monday. The IPO allotment is likely to be finalised on November 25, followed by expected listing on November 27 on NSE SME.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 10:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Small-cap mutual funds: Should you continue your SIP? 10-year rolling returns reveal risks investors may be missing", "full_content": "Small-cap mutual funds have delivered higher long-term returns than large-cap funds on average, making them attractive to investors willing to take on greater risk. But the headline numbers do not tell the whole story. An investor who stayed invested in small-cap funds for 10 years could still have experienced a negative return, according to historical rolling SIP data in Edelweiss Mutual Fund's November 2026 presentation.\n\nThe data offers an important lesson for investors. While small-cap funds can reward patience over long periods, their returns are far from consistent. The timing of investments, market cycles and the ability to withstand sharp falls can make a significant difference to the outcome.\n\nThe presentation compares five-year and 10-year systematic investment plan (SIP) returns across large-cap, mid-cap and small-cap categories. As of 30 October 2026, small-cap funds delivered an average 10-year SIP return of 15.02%, compared with 17.61% for mid-cap funds and 12.93% for large-cap funds. However, the minimum 10-year SIP return for small-cap funds was -0.13%, against 6.37% for mid-cap funds and 5.07% for large-cap funds.\n\nThe difference between average and minimum returns is important. While the average 10-year SIP return for small-cap funds was around 15%, the minimum outcome was marginally negative. This means that not every 10-year investment period delivered positive returns, even when investors spread their investments through monthly instalments.\n\nThe numbers also show that mid-cap funds had the highest average SIP returns across both five-year and 10-year periods in this comparison. Their minimum 10-year return was also higher than that of large-cap and small-cap funds.\n\nFor investors, the takeaway is that a higher average return does not necessarily translate into a better outcome across every investment period.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:44 PM IST", "pub_date_relative": "3h ago"}, {"title": "Nvidia Sought Taipei's Help Over Employee's Chip Smuggling Case", "full_content": "Nvidia Corp. appealed to Taiwanese officials after prosecutors on the island accused an employee of helping to smuggle AI chips into China, raising fresh questions about how the firm views its own role in stopping the illicit trade.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 09:34 PM IST", "pub_date_relative": "3h ago"}, {"title": "\u2018We had the worst fight\u2019: I want my husband to retire at 65, but I don\u2019t want to lose his $280,000 salary. Is that unreasonable?", "full_content": "\u201cWe have $2.6 million, most of it in his 401(k) and IRAs, plus $450,000 in a brokerage account.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 09:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Egypt Urges Indian Companies To Set Up Units; Offers Land, Government Assistance", "full_content": "Egypt has offered Indian companies land parcels in its investment zones to establish manufacturing facilities and explore the possibility of a dedicated Egyptian-Indian investment zone.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 09:28 PM IST", "pub_date_relative": "3h ago"}, {"title": "Multibagger small cap stock delivers 91% return in 1 year! IDBI Capital sees 17% upside - Do you own? Check target price", "full_content": "Sharmila Bhadoria Published 15 Nov 2026, 09:25 PM IST Prefer Livemint on Google Shares of Rolex Rings Limited have delivered impressive returns over the past few months. The auto ancillary stock ended last week with 6% gains. The Gujarat-headquartered company is likely to benefit from the \u2018Make in India\u2019 theme, according to IDBI Capital which sees nearly 17% upside potential in the stock.\n\nRolex Rings Limited shares ended 2.20% lower on Friday, as part of some correction witnessed after strong rally in the previous session.\n\nWith the settling down of the tariff uncertainty and improved demand outlook in both the business verticals, Rolex is likely to benefit from the \u2018Made in India\u2019 ecosystem.\n\nThe company reported strong set of numbers in the second quarter of financial year 2026-27. Its revenue from operations, EBITDA and profit after tax (PAT) increased by 43%, 72%, and 67% for the quarter on an annual basis.\n\n\u201cThe revenue growth was majorly led by strong growth in the exports of auto components which grew by 90% YoY to \u20b9 1.29bn. The domestic bearings segment and the domestic auto components segment registered healthy growth of ~10% and ~30% respectively on YoY basis,\u201d highlighted the brokerage in its report.\n\nIDBI Capital maintained a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 241 per share. \u201cWe expect Rolex to be a strong beneficiary of the \u201cManufacture in India\u201d theme. Utilisations are also set to move from ~65% in FY26 to ~70-72% in FY27.We maintain BUY with revised TP of \u20b9 241 at 23x FY28 expected earnings,\u201d read the brokerage report.\n\nThe auto ancillary stock closed 2.20% lower at \u20b9 213.25 per share on BSE with a market capitalisation of \u20b9 5,594.25 crore on Friday, November 13. Its share price value has surged 6% in one week, 30% in two weeks, 25% in one month, 44% in six months and around 91% in one year.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 09:25 PM IST", "pub_date_relative": "3h ago"}, {"title": "India To Host 2029 Champions Trophy; 2031 ODI World Cup With Bangladesh", "full_content": "The ICC has fixed dates for every major men\u2019s tournament from 2028 to 2035. Host nations for all events after 2031, however, are yet to be named.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 09:19 PM IST", "pub_date_relative": "3h ago"}, {"title": "India, US Already Agreed On Preferential Market Access For Indian Goods, Says Piyush Goyal", "full_content": "Piyush Goyal on Sunday said that both India and the US have already agreed that Indian goods in the American market will be granted preferential market access compared to competitor nations.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 09:14 PM IST", "pub_date_relative": "3h ago"}, {"title": "Scene Box Office Collection Day 10: Suriya Starrer Stays Steady On Second Sunday", "full_content": "Scene is a Tamil action-comedy written and directed by Jithu Madhavan, with Suriya in the lead alongside Nazriya Nazim, Naslen K Gafoor, Lal and Anandraj.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 09:11 PM IST", "pub_date_relative": "3h ago"}, {"title": "144% return in 6 months: Multibagger to turn 1 stock into 18 after split, bonus- Do you own it? Check ratio, return", "full_content": "Shares of SC Agrotech have witnessed a sharp rally over the past few months, with the small-cap stock delivering nearly 62% returns in just two weeks and around 72% in a month. Not only this, the multibagger stock has more than doubled investors' wealth over the past six months.\n\nSC Agrotech stock is likely to attract heightened investors' interest following the proposed corporate actions, which includes a 1:10 stock split and a 4:5 bonus issue. If approved and implemented, every existing share will effectively turn into 18 shares.\n\nAs per the company\u2019s BSE filing each existing equity share of SC Agrotech will be subdivided into 10 shares, followed by a bonus issue of four shares for every 5 shares held.\n\nIf you are holding a single SC Agrotech stock on record date, it will turn into 10 shares (with face value Re 1). Then you will receive four shares for 5 shares held, as per the proposed bonus issue. Which means investors holding 10 shares, will receive additional 8 shares (4 stocks for every 5 held), taking the total count to 18.\n\nSC Agrotech has fixed stock split in the ratio of 1:10, which means that every investor holding single stock (of face value \u20b9 10) will, now own 10 stocks (with face value of Re 1 each), after the execution of stock split.\n\nThe company has rewarded investors with bonus issue in the ratio of 4:5. Its board of directors recommended the issue of 4 fully paid-up bonus equity shares for every five fully paid up equity shares. Only those investors who will own the stock before the record date will be eligible for the bonus issue corporate action.\n\nThe board of directors is yet to determine the record date for both the corporate actions.\n\nThe stock closed 5% higher at its 52-week high level of \u20b9 62.38 per share on Friday, November 13. Its share price value has surged 144% in six months, 60% year to date (YTD), and 266% in one year.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 09:01 PM IST", "pub_date_relative": "3h ago"}, {"title": "3 big things we're watching in the stock market in the week ahead", "full_content": "Nvidia and Anthropic will share the spotlight in a pivotal week for the AI trade.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 08:56 PM IST", "pub_date_relative": "3h ago"}, {"title": "How long will it take to build a \u20b91 crore corpus through \u20b910,000, \u20b920,000 or \u20b930,000 monthly SIP?", "full_content": "Building a retirement or long-term investment corpus of \u20b9 1 crore is a major financial milestone for many investors. A systematic investment plan (SIP) in mutual funds can help achieve this goal by allowing individuals to invest a fixed amount regularly rather than committing a large sum at once.\n\nHowever, the time required to accumulate \u20b9 1 crore depends on several factors, including the monthly investment amount, investment duration and returns generated by the mutual fund scheme.\n\nInvestors can choose from different categories of mutual funds , including equity, hybrid and debt funds, depending on their financial goals and risk appetite.\n\nAn SIP is an investment facility offered by mutual funds that allows investors to contribute a fixed amount at regular intervals, such as weekly, monthly or quarterly.\n\nInstead of investing a lump sum, investors can gradually build wealth through regular contributions. SIPs also help develop financial discipline and allow investors to benefit from rupee-cost averaging over the long term.\n\nThe time taken to reach a \u20b9 1 crore corpus largely depends on the returns generated by investments.\n\nAccording to 10-year mutual fund performance data from Value Research, several equity mutual fund categories have delivered annualised returns exceeding 12%. Hybrid fund categories have delivered returns of around 10%, while debt fund categories have generated approximately 8% annualised returns.\n\nFor calculation purposes, annualised returns of 12% for equity funds, 10% for hybrid funds and 8% for debt funds have been assumed.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 08:55 PM IST", "pub_date_relative": "3h ago"}, {"title": "Hong Kong developer New World unveils $3.2bn rights issue", "full_content": "Cheng family\u2019s property firm prices share offer at 82% discount as it moves to slash debts", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 08:54 PM IST", "pub_date_relative": "4h ago"}, {"title": "China\u2019s hottest stocks these days have one thing in common: names that sound like sheep", "full_content": "Shares of fish processors, lighting manufacturers and appliance makers have soared ahead of the Year of the Sheep. Investor appetite has had little to do with the status of their businesses.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 08:52 PM IST", "pub_date_relative": "4h ago"}, {"title": "Gold rush turns deadly in Guinea", "full_content": "High gold prices have driven a wave of fresh mining, and Conakry is cracking down", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 08:43 PM IST", "pub_date_relative": "4h ago"}, {"title": "Gold, Silver Prices This Week: Inflation Data, West Asia Tensions To Keep Bullion Markets Volatile", "full_content": "The World Gold Council said exchange-traded fund investors had remained largely on the sidelines during the current quarter following record inflows in the third quarter of 2026.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 08:43 PM IST", "pub_date_relative": "4h ago"}, {"title": "FD returns: Your bank offers 6.35% interest, but how much do you actually earn after tax? Check returns across top banks", "full_content": "A bank fixed deposit may offer an interest rate of 6.35%, but the amount you eventually earn can be considerably lower once tax is accounted for. For investors in the 30% tax bracket, the post-tax return on a five-year bank FD averages just 4.60%, according to the November 2026 Wealth Conversations report by FundsIndia.\n\nThe report compares fixed deposit rates offered by HDFC Bank , ICICI Bank , State Bank of India (SBI) and Punjab National Bank (PNB) for deposits below \u20b9 3 crore. The rates are based on information available on the respective banks' websites as of 8 November 2026. FundsIndia has calculated post-tax returns assuming a 30% tax rate.\n\nThe difference between the advertised interest rate and the post-tax return is important when comparing FDs. While the average five-year FD rate across the four banks is 6.35%, the corresponding post-tax return is 4.60%.\n\nICICI Bank offers the highest five-year FD interest rate among the four banks at 6.60%. After accounting for tax at 30%, the return comes down to 4.79%.\n\nHDFC Bank offers 6.40% for the same tenure, translating into a post-tax return of 4.64%. PNB's five-year FD rate stands at 6.35%, with a post-tax return of 4.60%. SBI offers 6.05%, which translates into 4.38% after tax.\n\nSource: FundsIndia Research, based on respective bank websites as of 8 November 2026. Post-tax rates assume a 30% tax rate.\n\nThe gap between the highest and lowest post-tax returns is 0.41 percentage points. While the difference may appear small, it can matter when investors are comparing deposits across banks and deciding where to lock in their money.\n\nThe difference between pre-tax and post-tax returns is visible across shorter and longer deposit tenures as well. For six-month deposits , the average interest rate is 5.13%, but the post-tax return is 3.57%.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 08:40 PM IST", "pub_date_relative": "4h ago"}, {"title": "\u2018I\u2019m sick of flying\u2019: I paid for priority boarding, but the overhead bins were full. Was I duped?", "full_content": "\u201cMaybe next time I\u2019ll try the other approach: I\u2019ll board whenever I feel like it and drop my suitcase in the first open slot I see.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 08:30 PM IST", "pub_date_relative": "4h ago"}, {"title": "Nvidia is gearing up for one of Wall Street\u2019s most anticipated earnings calls in years", "full_content": "Jensen Huang\u2019s sudden departure has made Tuesday\u2019s earnings call \u201cthe most important in the company\u2019s history.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 08:30 PM IST", "pub_date_relative": "4h ago"}, {"title": "Traders Turn to Kalshi Stock \u2018Perps\u2019 on Nvidia and SpaceX as Leverage Fears Grow - Bloomberg.com", "full_content": "Traders Turn to Kalshi Stock \u2018Perps\u2019 on Nvidia and SpaceX as Leverage Fears Grow Bloomberg.com Kalshi Stock Perps Draw Traders Ahead of Dec. 1 Hearing RG.org Kalshi Stock Perpetuals Reach $5 Billion in Notional Volume www.tokenpost.com Kalshi's new stock market has traded $1.75 billion \u2013 Most of the trades are small FXStreet Nvidia Perps on Kalshi Trade $405M With Up to 4.6x Leverage FourWeekMBA", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 08:30 PM IST", "pub_date_relative": "4h ago"}, {"title": "Private Hospitals Corner Rs 2.67 Lakh Crore, Nearly Double Government Hospital Spend in FY24", "full_content": "Pharmacies emerged as the second-largest spending category after private hospitals, with expenditure of Rs 1,72,459 crore.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 08:27 PM IST", "pub_date_relative": "4h ago"}, {"title": "US FDA Rejects Summit's China-Originated Lung Cancer Drug", "full_content": "The FDA issued a so-called Complete Response Letter saying that it can't approve Summit's application in its present form because the drug didn't help patients live longer in a statistically significant way.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 08:18 PM IST", "pub_date_relative": "4h ago"}, {"title": "Megaspeed says Alice Huang left company in 2025, denies wrongdoing amid Nvidia scandal - CBS News", "full_content": "Megaspeed says Alice Huang left company in 2025, denies wrongdoing amid Nvidia scandal CBS News See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 08:06 PM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Fed 'has some work to do on inflation,' Kansas City Fed chief says", "full_content": "The Federal Reserve has the tools and responsibility to address price pressures that are \"running too hot,\" and the central bank \"has some work to do on inflation,\" Kansas City Fed President Jeff Schmid said Sunday.\n\nSchmid, speaking to a credit union conference in Hawaii, did not specifically call for additional rate hikes, but said inflation is \"uncomfortably above the 2% price stability target, and moving in the wrong direction.\"\n\nCommon narratives that have recently evolved around the nature of current inflation and the Fed's ability to contain it are off-base, Schmid said.\n\nFirst, Schmid said, the view that high inflation is a reflection of repeated supply shocks neglects that \"inflation is always the result of an imbalance between supply and demand. It is in the context of strong demand that a disruption to supply drives up prices. Demand always plays a role in inflation, and the Fed, through its influence on demand, always has the tools and responsibility to address inflation.\"\n\nSchmid, who is not a Federal Open Market Committee voting member this year, said he also disagrees with the narrative that the sources of demand-induced inflation right now \u2014 like the artificial intelligence buildout \u2014 are resistant to Fed policy.\n\nThe Fed raised rates by a quarter-percentage point in September to 3.75%-4.00% but opted not to lift them again at last month's meeting.\n\nAfter recent inflation readings came in higher than expected and comments from other Fed officials, including influential Governor Christopher Waller, interest rate futures markets are now fully priced for a quarter-point increase at December's meeting, with a small probability of a half-point hike.\n\n\"I would also push back on the idea that meeting our inflation objective requires a reaction from any particular set of prices, for example prices for AI-related technology goods,\" Schmid said.", "source": "CNBC Top News", "pub_date_str": "16 Nov 2026, 12:34 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Kansas City Fed\u2019s Schmid says central bank has work to do on inflation", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Nov 2026, 12:28 AM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Wall Street Week Ahead: Nvidia earnings, Anthropic IPO, Federal Reserve minutes, retail sales - Top things to watch", "full_content": "Rajendra Saxena Published 16 Nov 2026, 12:02 AM IST Prefer Livemint on Google Wall Street is heading into a crucial week, with investors closely tracking Nvidia's quarterly earnings, artificial intelligence (AI) company Anthropic's proposed initial public offering (IPO) and the release of the Federal Reserve's October meeting minutes. These developments, along with key US economic indicators and corporate earnings, are expected to influence sentiment across American stock markets.\n\nNvidia's earnings announcement on Tuesday will be among the biggest events of the week, as investors look for indications that demand for AI infrastructure remains strong amid concerns over the sustainability of massive investments in the sector.\n\nMeanwhile, Anthropic's proposed stock market debut and fresh signals on the US economy could add to market volatility.\n\nThe US semiconductor giant is scheduled to announce its fiscal third-quarter results on Tuesday.\n\nAccording to LSEG data, analysts expect Nvidia to report earnings growth of around 90% on revenue of approximately $109 billion.\n\nInvestors will particularly focus on the company's outlook for AI-related spending and demand for its advanced chips, which have been at the centre of the global AI investment boom.\n\nNvidia shares came under pressure last week amid controversies surrounding its longtime chief executive and co-founder Jensen Huang, according to the developments outlined in the report.\n\nThe company's market capitalisation has also declined significantly. LSEG data showed that Nvidia's valuation fell from approximately $5.8 trillion in early October to $3.9 trillion as of Friday.", "source": "LiveMint Markets", "pub_date_str": "16 Nov 2026, 12:02 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'We slept here': Flight delays linger but schedule is back on track for Monday", "full_content": "U.S. flights are set to run close to normal on Monday as airlines scramble to get back on track after the Federal Aviation Administration grounded departures nationwide for more than four hours on Friday.\n\nDisruptions lingered on Sunday, but passengers were getting on their way.\n\nMore than 1,600 U.S. flights there were canceled as of noon ET and more than 4,000 were delayed, according to FlightAware data. That was far fewer than the almost 6,700 cancellations on Saturday and more than 9,200 on Sunday when the FAA halted all departures into U.S. airports.\n\n\"We slept here,\" said Beth Martin, who was trying to travel home to Birmingham, Alabama, from New York's LaGuardia Airport on Sunday at the end of her daughter's birthday trip. They were booked for Saturday night, and when delay announcements started rolling in from Delta Air Lines , they decided to make good use of the extra time: after strolling through Central Park, they went window shopping on Fifth Avenue.\n\nBut when the flight was canceled, the standby list on a backup flight looked grim, and their original midtown hotel was charging about $700 for an additional night, the two of them slept at LaGuardia on Saturday. She said they found wheelchairs to sleep in outside security.\n\nTransportation Secretary Sean Duffy on Saturday tied the issue to a router and work to update from copper wires, a system overseen by L3Harris Technologies , to a fiber-optic system. FAA administrator Bryan Bedford said the upgrades were part of \"routine\" maintenance to switch over to fiber optic.\n\n\"We are supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel,\" L3Harris said in a statement Saturday afternoon.\n\nAirlines waived change fees and fare differences and offered pilots and flight attendants extra pay to ease the delays.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 11:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Bessent calls for \u2018dramatic shakeup\u2019 at Nvidia, urges outside CEO", "full_content": "Treasury Secretary Scott Bessent on Sunday called for a \"dramatic shakeup\" at Nvidia after CEO Jensen Huang 's resignation, questioning whether the chipmaker pursued illicit sales of its advanced artificial intelligence chips to boost earnings.\n\nBessent said Nvidia's board should look outside the company for its next chief executive and suggested other executives should face scrutiny over the chip giant's compliance with U.S. export controls.\n\n\"I want to keep coming back to what was the culture at Nvidia, and were they pressing these seemingly illicit sales to goose their revenues and their earnings?\" Bessent said in an interview on Fox News.\n\nThe remarks come amid a growing feud between Bessent and Commerce Secretary Howard Lutnick over the suspected diversion of advanced AI chips to China, even as the Treasury secretary continues to defend President Donald Trump's handling of the matter.\n\nBoth Bessent and Lutnick are expected to accompany Trump to China this week, Semafor reported Sunday, putting the two Cabinet secretaries alongside the president as he prepares to meet with Chinese President Xi Jinping and Russian President Vladimir Putin on the sidelines of the APEC summit.\n\nA White House official told Reuters on Thursday that the president maintains \"complete confidence\" in Lutnick, despite mounting scrutiny of the secretary\u2019s handling of the Nvidia matter.\n\nHuang resigned Thursday following revelations about his relationship with Alice Huang, a former executive at Singapore-based Megaspeed , whom U.S. intelligence officials suspect of spying for China. Megaspeed is suspected of diverting Nvidia chips to China in violation of U.S. export controls.\n\nNvidia named Chief Financial Officer Colette Kress interim CEO.", "source": "CNBC World Economy", "pub_date_str": "15 Nov 2026, 11:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "It\u2019s not just an affair. Nvidia\u2019s bigger issue could be chip smuggling. - The Washington Post", "full_content": "It\u2019s not just an affair. Nvidia\u2019s bigger issue could be chip smuggling. The Washington Post How Jensen Huang Built the Backdoor Route That Keeps Beijing in the AI Race WSJ Commerce Department Finalizing Long-Awaited AI Remote Access Rule The Information How the Nvidia scandal lifted the curtain on a loophole that\u2019s giving China access to US chips CNN Congress moves to pass tighter AI chip export rules following Nvidia scandal Financial Times", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 11:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Pension cannot be attached to recover another person's loan even if retired employee stood as guarantor: J&K&L HC", "full_content": "The Jammu and Kashmir and Ladakh High Court has ruled that pensionary benefits of a retired government employee cannot be subjected to coercive recovery measures for repayment of a loan borrowed by another person, even if the retired employee had stood as a guarantor for the loan.\n\nAllowing an appeal filed by a retired police personnel, Justice Moksha Khajuria Kazmi set aside a trial court order that had refused interim protection to the appellant. The High Court restrained Jammu and Kashmir Bank from deducting any amount from his pension account towards repayment of the loan obtained by the principal borrower, reported LiveLaw .\n\nThe court observed that pension is a welfare measure intended to safeguard the financial security of retired employees and their families. It is meant to protect them from financial dependence, destitution and hardship and, therefore, cannot be subjected to coercive recovery merely because an employee had stood as a loan guarantor during his service .\n\nHowever, the court clarified that the bank would remain free to recover its outstanding dues from the principal borrower through legally permissible means.\n\nThe appellant, Nazir Ahmad Kuchay, a retired police personnel and senior citizen, had stood as a guarantor for an individual who obtained financial assistance from Jammu and Kashmir Bank.\n\nAfter the principal borrower defaulted on loan repayments, the bank allegedly began deducting the outstanding amounts from Kuchay's bank account.\n\nBy that time, Kuchay had retired from government service and was dependent on his pensionary benefits to meet his and his family's living expenses.\n\nHe approached the bank and informed it about his retirement and dependence on pension income. According to his submissions, the bank assured him that no further deductions would be made from his pension account. However, the deductions allegedly continued despite the assurance.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 10:46 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Bessent Says Nvidia Needs 'Dramatic Shakeup' With Huang Out", "full_content": "Treasury Secretary Scott Bessent suggested the company should go outside the firm to find new leadership.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:34 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Bitcoin wallet untouched since 2011 moves \u20b944 crore after legal notice in $260 billion lawsuit targeting dormant BTC", "full_content": "A Bitcoin wallet untouched since February 2011 has moved its entire holding of 75 Bitcoin, worth about $5 million (around \u20b9 44 crore), to a new address. The 12 November transfer has drawn attention because the wallet was among 39,069 addresses named in a New York lawsuit seeking ownership of nearly 3.8 million Bitcoin, valued at about $260 billion.\n\nThe transaction also moved a tiny Bitcoin payment sent to the address in May to deliver a court-ordered legal notice. The timing raises questions about a possible link to the lawsuit, but does not establish why the coins moved.\n\nAccording to CoinDesk, the address was listed as defendant No. 3,419 in the amended complaint. It received its original 75 BTC in two transactions in February 2011 and had not spent those coins since.\n\nOn 22 May 2026, the address received 546 satoshis, worth less than 40 cents, in a transaction carrying the words \u201cCOURT-ORDERED LEGAL NOTICE\u201d and a link to the plaintiffs\u2019 notice page. A satoshi is the smallest unit of Bitcoin; one BTC equals 100 million satoshis.\n\nThe wallet had also received a small payment in July 2025 carrying an owner notice from Salomon Brothers Strategic Advisors, the consultant hired by the plaintiffs to contact holders of the targeted addresses.\n\nOn Thursday evening, the entire balance was transferred to a new address. The transaction combined six inputs, including the original Bitcoin and the small deposits used for the notices, leaving the old address empty.\n\nThe six inputs included the original holdings and four deposits , two carrying notices. Such payments, called dust transactions, are tiny amounts sent to an address and can carry information in transaction data. This allowed plaintiffs to reach addresses without knowing owners.\n\nThe transfer shows that someone had access to the private keys needed to spend the Bitcoin. It does not identify that person, prove the legal notice was read or confirm that the lawsuit prompted the move.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 10:27 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trump breaks silence about FAA nationwide ground stop, blames Biden administration", "full_content": "President Donald Trump on Sunday made his first public comments about Friday's nationwide ground stop by the Federal Aviation Administration, blaming the Biden administration for making an \"old and broken\" air traffic control system worse . Trump also urged Congress to approve more funding to modernize the system.\n\nThe ground stop lasted more than four hours Friday, disrupted flights nationwide, contributed to thousands of cancellations and delays, and affected hundreds of thousands of passengers.\n\n\"The Biden Administration was an FAA disaster,\" Trump wrote on his social media platform. \"Big money spent unwisely, making an old and broken system worse than when they began.\"\n\nThe president added that his administration has \"the knowledge and plan for the Flight Control Systems,\" but said that \"we need Congress to give the money, FAST!\"\n\nCongress approved $12.5 billion for the FAA last year as part of a major tax and spending package. Transportation Secretary Sean Duffy has said that the aging air traffic control system will need more funding for a broader overhaul.\n\nThe FAA said its equipment became unstable after a high volume of data flooded its network. The agency said contractor work at one site may be related and that the underlying cause remains under investigation .\n\nNationwide FAA ground stops are rare. Before the Nov. 2026 shutdown, the last two were after the Sept. 11 attacks and a brief FAA computer outage in January 2023.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 10:26 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Watrana Rentals IPO GMP profit calculator on latest GMP: How much profit can retail and HNI investors expect?", "full_content": "Watrana Rentals\u2019 initial public offering is scheduled to open for subscription this week on Thursday, November 19. The SME IPO is an entirely fresh issue of 49.02 lakh shares of \u20b9 120.10 crore.\n\nThe SME IPO will open for subscription in the second half of next week and close the following week. The IPO\u2019s latest grey market premium (GMP) hints at 8.98% estimated listing gain, as per media reports trading the grey market price at 9 pm on Sunday, November 15. Here\u2019s how much profit investors can expect in different categories in the SME IPO.\n\nWatrana Rentals IPO grey market premium (IPO GMP) stood at \u20b9 22, hinting at 8.98% listing day gain. Considering its upper price band, i.e. of \u20b9 245 per share, the IPO is likely to be listed at \u20b9 267 per share (sum of IPO GMP today and upper price band).\n\nThe SME IPO has fixed issue price band at \u20b9 232 to \u20b9 245 per share. Its lot size for an application is 600 shares.\n\nUnlike mainboard IPO, investors are required to bid for a higher number of shares for an SME IPO. Hence, an individual investor must bid for minimum 2 lots, ie 1200 shares (nearly equivalent to \u20b9 2,94,000). Small High net worth individuals (SHNIs) are required to apply for minimum 3 lots, ie 1800 (approx \u20b9 4,41,000) and a maximum of 6 , ie 3600 (approx \u20b9 8,82,000 ). B-HNIs are required to subscribe for a minimum of 7 lots, ie 4200 shares (approx \u20b9 10,29,000).\n\nWatrana Rentals is a book build issue of \u20b9 120.10 crore and is an entirely a fresh issue of 49.02 lakh shares of \u20b9 120.10 crore. The IPO will open for subscription on November 19, Thursday and close on November 23, Monday. The IPO allotment is likely to be finalised on November 25, followed by expected listing on November 27 on NSE SME.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 10:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Small-cap mutual funds: Should you continue your SIP? 10-year rolling returns reveal risks investors may be missing", "full_content": "Small-cap mutual funds have delivered higher long-term returns than large-cap funds on average, making them attractive to investors willing to take on greater risk. But the headline numbers do not tell the whole story. An investor who stayed invested in small-cap funds for 10 years could still have experienced a negative return, according to historical rolling SIP data in Edelweiss Mutual Fund's November 2026 presentation.\n\nThe data offers an important lesson for investors. While small-cap funds can reward patience over long periods, their returns are far from consistent. The timing of investments, market cycles and the ability to withstand sharp falls can make a significant difference to the outcome.\n\nThe presentation compares five-year and 10-year systematic investment plan (SIP) returns across large-cap, mid-cap and small-cap categories. As of 30 October 2026, small-cap funds delivered an average 10-year SIP return of 15.02%, compared with 17.61% for mid-cap funds and 12.93% for large-cap funds. However, the minimum 10-year SIP return for small-cap funds was -0.13%, against 6.37% for mid-cap funds and 5.07% for large-cap funds.\n\nThe difference between average and minimum returns is important. While the average 10-year SIP return for small-cap funds was around 15%, the minimum outcome was marginally negative. This means that not every 10-year investment period delivered positive returns, even when investors spread their investments through monthly instalments.\n\nThe numbers also show that mid-cap funds had the highest average SIP returns across both five-year and 10-year periods in this comparison. Their minimum 10-year return was also higher than that of large-cap and small-cap funds.\n\nFor investors, the takeaway is that a higher average return does not necessarily translate into a better outcome across every investment period.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:44 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Multibagger small cap stock delivers 91% return in 1 year! IDBI Capital sees 17% upside - Do you own? Check target price", "full_content": "Sharmila Bhadoria Published 15 Nov 2026, 09:25 PM IST Prefer Livemint on Google Shares of Rolex Rings Limited have delivered impressive returns over the past few months. The auto ancillary stock ended last week with 6% gains. The Gujarat-headquartered company is likely to benefit from the \u2018Make in India\u2019 theme, according to IDBI Capital which sees nearly 17% upside potential in the stock.\n\nRolex Rings Limited shares ended 2.20% lower on Friday, as part of some correction witnessed after strong rally in the previous session.\n\nWith the settling down of the tariff uncertainty and improved demand outlook in both the business verticals, Rolex is likely to benefit from the \u2018Made in India\u2019 ecosystem.\n\nThe company reported strong set of numbers in the second quarter of financial year 2026-27. Its revenue from operations, EBITDA and profit after tax (PAT) increased by 43%, 72%, and 67% for the quarter on an annual basis.\n\n\u201cThe revenue growth was majorly led by strong growth in the exports of auto components which grew by 90% YoY to \u20b9 1.29bn. The domestic bearings segment and the domestic auto components segment registered healthy growth of ~10% and ~30% respectively on YoY basis,\u201d highlighted the brokerage in its report.\n\nIDBI Capital maintained a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 241 per share. \u201cWe expect Rolex to be a strong beneficiary of the \u201cManufacture in India\u201d theme. Utilisations are also set to move from ~65% in FY26 to ~70-72% in FY27.We maintain BUY with revised TP of \u20b9 241 at 23x FY28 expected earnings,\u201d read the brokerage report.\n\nThe auto ancillary stock closed 2.20% lower at \u20b9 213.25 per share on BSE with a market capitalisation of \u20b9 5,594.25 crore on Friday, November 13. Its share price value has surged 6% in one week, 30% in two weeks, 25% in one month, 44% in six months and around 91% in one year.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 09:25 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "144% return in 6 months: Multibagger to turn 1 stock into 18 after split, bonus- Do you own it? Check ratio, return", "full_content": "Shares of SC Agrotech have witnessed a sharp rally over the past few months, with the small-cap stock delivering nearly 62% returns in just two weeks and around 72% in a month. Not only this, the multibagger stock has more than doubled investors' wealth over the past six months.\n\nSC Agrotech stock is likely to attract heightened investors' interest following the proposed corporate actions, which includes a 1:10 stock split and a 4:5 bonus issue. If approved and implemented, every existing share will effectively turn into 18 shares.\n\nAs per the company\u2019s BSE filing each existing equity share of SC Agrotech will be subdivided into 10 shares, followed by a bonus issue of four shares for every 5 shares held.\n\nIf you are holding a single SC Agrotech stock on record date, it will turn into 10 shares (with face value Re 1). Then you will receive four shares for 5 shares held, as per the proposed bonus issue. Which means investors holding 10 shares, will receive additional 8 shares (4 stocks for every 5 held), taking the total count to 18.\n\nSC Agrotech has fixed stock split in the ratio of 1:10, which means that every investor holding single stock (of face value \u20b9 10) will, now own 10 stocks (with face value of Re 1 each), after the execution of stock split.\n\nThe company has rewarded investors with bonus issue in the ratio of 4:5. Its board of directors recommended the issue of 4 fully paid-up bonus equity shares for every five fully paid up equity shares. Only those investors who will own the stock before the record date will be eligible for the bonus issue corporate action.\n\nThe board of directors is yet to determine the record date for both the corporate actions.\n\nThe stock closed 5% higher at its 52-week high level of \u20b9 62.38 per share on Friday, November 13. Its share price value has surged 144% in six months, 60% year to date (YTD), and 266% in one year.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 09:01 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "3 big things we're watching in the stock market in the week ahead", "full_content": "Nvidia and Anthropic will share the spotlight in a pivotal week for the AI trade.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 08:56 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How long will it take to build a \u20b91 crore corpus through \u20b910,000, \u20b920,000 or \u20b930,000 monthly SIP?", "full_content": "Building a retirement or long-term investment corpus of \u20b9 1 crore is a major financial milestone for many investors. A systematic investment plan (SIP) in mutual funds can help achieve this goal by allowing individuals to invest a fixed amount regularly rather than committing a large sum at once.\n\nHowever, the time required to accumulate \u20b9 1 crore depends on several factors, including the monthly investment amount, investment duration and returns generated by the mutual fund scheme.\n\nInvestors can choose from different categories of mutual funds , including equity, hybrid and debt funds, depending on their financial goals and risk appetite.\n\nAn SIP is an investment facility offered by mutual funds that allows investors to contribute a fixed amount at regular intervals, such as weekly, monthly or quarterly.\n\nInstead of investing a lump sum, investors can gradually build wealth through regular contributions. SIPs also help develop financial discipline and allow investors to benefit from rupee-cost averaging over the long term.\n\nThe time taken to reach a \u20b9 1 crore corpus largely depends on the returns generated by investments.\n\nAccording to 10-year mutual fund performance data from Value Research, several equity mutual fund categories have delivered annualised returns exceeding 12%. Hybrid fund categories have delivered returns of around 10%, while debt fund categories have generated approximately 8% annualised returns.\n\nFor calculation purposes, annualised returns of 12% for equity funds, 10% for hybrid funds and 8% for debt funds have been assumed.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 08:55 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Hong Kong developer New World unveils $3.2bn rights issue", "full_content": "Cheng family\u2019s property firm prices share offer at 82% discount as it moves to slash debts", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 08:54 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold rush turns deadly in Guinea", "full_content": "High gold prices have driven a wave of fresh mining, and Conakry is cracking down", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 08:43 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold, Silver Prices This Week: Inflation Data, West Asia Tensions To Keep Bullion Markets Volatile", "full_content": "The World Gold Council said exchange-traded fund investors had remained largely on the sidelines during the current quarter following record inflows in the third quarter of 2026.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 08:43 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FD returns: Your bank offers 6.35% interest, but how much do you actually earn after tax? Check returns across top banks", "full_content": "A bank fixed deposit may offer an interest rate of 6.35%, but the amount you eventually earn can be considerably lower once tax is accounted for. For investors in the 30% tax bracket, the post-tax return on a five-year bank FD averages just 4.60%, according to the November 2026 Wealth Conversations report by FundsIndia.\n\nThe report compares fixed deposit rates offered by HDFC Bank , ICICI Bank , State Bank of India (SBI) and Punjab National Bank (PNB) for deposits below \u20b9 3 crore. The rates are based on information available on the respective banks' websites as of 8 November 2026. FundsIndia has calculated post-tax returns assuming a 30% tax rate.\n\nThe difference between the advertised interest rate and the post-tax return is important when comparing FDs. While the average five-year FD rate across the four banks is 6.35%, the corresponding post-tax return is 4.60%.\n\nICICI Bank offers the highest five-year FD interest rate among the four banks at 6.60%. After accounting for tax at 30%, the return comes down to 4.79%.\n\nHDFC Bank offers 6.40% for the same tenure, translating into a post-tax return of 4.64%. PNB's five-year FD rate stands at 6.35%, with a post-tax return of 4.60%. SBI offers 6.05%, which translates into 4.38% after tax.\n\nSource: FundsIndia Research, based on respective bank websites as of 8 November 2026. Post-tax rates assume a 30% tax rate.\n\nThe gap between the highest and lowest post-tax returns is 0.41 percentage points. While the difference may appear small, it can matter when investors are comparing deposits across banks and deciding where to lock in their money.\n\nThe difference between pre-tax and post-tax returns is visible across shorter and longer deposit tenures as well. For six-month deposits , the average interest rate is 5.13%, but the post-tax return is 3.57%.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 08:40 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia is gearing up for one of Wall Street\u2019s most anticipated earnings calls in years", "full_content": "Jensen Huang\u2019s sudden departure has made Tuesday\u2019s earnings call \u201cthe most important in the company\u2019s history.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 08:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Traders Turn to Kalshi Stock \u2018Perps\u2019 on Nvidia and SpaceX as Leverage Fears Grow - Bloomberg.com", "full_content": "Traders Turn to Kalshi Stock \u2018Perps\u2019 on Nvidia and SpaceX as Leverage Fears Grow Bloomberg.com Kalshi Stock Perps Draw Traders Ahead of Dec. 1 Hearing RG.org Kalshi Stock Perpetuals Reach $5 Billion in Notional Volume www.tokenpost.com Kalshi's new stock market has traded $1.75 billion \u2013 Most of the trades are small FXStreet Nvidia Perps on Kalshi Trade $405M With Up to 4.6x Leverage FourWeekMBA", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 08:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers",
