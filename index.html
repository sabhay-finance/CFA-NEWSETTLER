 news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 09:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "BSE, Angel One Fall Over 3% On SEBI CAS Changes; MCX, Groww, NSE Also Decline", "full_content": "Under the revised framework, the closing auction session will run from 3:30 p.m. to 3:40 p.m., with most changes taking effect from December 7, 2026.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jio IPO: Meta, Google sit on nearly \u20b91 lakh crore paper profit & neither is selling", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Jio IPO: Meta, Google sit on nearly \u20b91 lakh crore paper profit & neither is selling Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO: Meta, Google sit on nearly \u20b91 lakh crore paper profit & neither is selling SECTIONS Jio IPO: Meta, Google sit on nearly \u20b91 lakh crore paper profit & neither is selling By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 16, 2026, 09:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Meta Platforms and Google are poised to realize significant gains from their Jio investment made in 2020. To bolster its growth, Jio Platforms is moving forward with an initial public offering planned to raise around \u20b930,213 crore, achieving a valuation of \u20b910.3 lakh crore. Neither Meta nor Google plans to divest shares in this round as existing backers maintain their stakes.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 09:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "PRIM mutual fund route explained: How the new PMS option works, \u20b925 lakh minimum investment and contract renewal rules", "full_content": "If you invest in mutual funds and ETFs, there is a new route to access portfolio management services similar to those offered by Portfolio Management Services ( PMS ), but with a lower entry threshold. It is called the Portfolio Managers Route for Investing in Mutual Fund Units (PRIM).\n\nAnnounced at SEBI \u2019s board meeting on 24 September 2026, PRIM will allow investors to access portfolio management services with a minimum investment of \u20b9 25 lakh, compared with the \u20b9 50 lakh minimum for conventional PMS.\n\nUnder PRIM, portfolio managers can invest your money only in direct plans of mutual funds, including ETFs, index funds and Specialised Investment Funds (SIFs) offered by Indian asset management companies (AMCs). Direct equity investments in individual stocks are not included under this route.\n\nAt its board meeting, SEBI approved the introduction of the Securities and Exchange Board of India (Portfolio Managers) Regulations, 2026, replacing the Securities and Exchange Board of India (Portfolio Managers) Regulations, 2020.\n\nAfter this, SEBI notified the new Portfolio Managers Regulations on 12 October 2026, through a Gazette notification dated 7 October 2026. One provision that PRIM investors should pay attention to is the treatment of renewals.\n\nThe regulations mention, \u201cAny renewal of portfolio on maturity of the initial period of agreement shall be deemed as a fresh investment.\u201d\n\nDoes this mean investors need to invest another \u20b9 25 lakh to continue? Here\u2019s what the rule means for investors.\n\nNiharika Tripathi, Head of Products & Research, Wealthy.in said, \u201cIn simple terms, renewing a PRIM agreement is treated as starting a new one, so the \u20b9 25 lakh minimum applies again at that point. The portfolio has to meet the entry rules afresh, just as it did on day one.\u201d", "source": "LiveMint Money", "pub_date_str": "16 Oct 2026, 09:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Zetwerk Manufacturing Business IPO Day 2: GMP at 9%; Check subscription status, and key details", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Zetwerk Manufacturing Business IPO Day 2: GMP at 9%; Check subscription status, and key details JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & St     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
