anies, not Mint. We advise investors to check with certified experts before making any investment decisions.\n\nVaamanaa covers business and stock market news.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:25 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How Donald Trump's proposed fresh tariff salvo for India compare with rival nations", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a How Donald Trump's proposed fresh tariff salvo for India compare with rival nations The Economic Times daily newspaper is available online now. Read Today's Paper How Donald Trump's proposed fresh tariff salvo for India compare with rival nations SECTIONS How Donald Trump's proposed fresh tariff salvo for India compare with rival nations Reuters Last Updated: Nov 26, 2026, 02:22:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The US has proposed a 25% tariff on Indian imports to address excess industrial capacity issues. This rate could decrease to 17% if a trade deal is reached. India's trade ministry is reviewing the US's trade practices allegations while defending its own situation. Trade talks have been prolonged due to various complications, including tariff laws and military incidents.\n\nTrump's new tariff tantrum for India, China can run into a legal and political minefield\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines", "source": "Economic Times Economy", "pub_date_str": "26 Nov 2026, 02:22 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NMDC battles weak offtake despite strong steel demand", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIron ore miner NMDC continues to grapple with muted offtake even though steel demand is strong. Steelmakers are increasingly meeting their additional requirements of ore\u2014a key input\u2014through captive mining.\n\nNMDC\u2019s October sales fell 12% year-on-year (y-o-y), partly due to rail disruption slowing ore dispatches, belying expectations of a post-monsoon recovery. In the first seven months of FY27, volumes fell 2% to 25.7 million tonnes (mt), while output rose 22% to 32.3 mt.\n\nNMDC also faces the prospect of a more competitive market after the government relaxed restrictions on ore sales by captive miners in August. Domestic producers Tata Steel Ltd and Steel Authority of India Ltd have outlined plans to increase merchant sales from their mines. The government also reduced tax-related uncertainty for NMDC by curtailing the powers of state governments to levy taxes on miners.\n\nBesides, a global surplus amid a slowdown in China\u2019s steel output is weighing on prices. According to Nomura Research, iron ore prices fell to $84 per tonne in the week ended 20 November, down 17% y-o-y and the lowest level for 2026.\n\nThe subdued market conditions were reflected in NMDC\u2019s financials. September quarter (Q2FY27) revenue grew 4% y-o-y to \u20b9 6,638 crore, with iron ore realization increasing 10%, partly offset by a 2% fall in offtake. Higher royalty and other expenses meant Ebitda fell 4% to \u20b9 1,940 crore.\n\n\u201cWe reduce our FY27/FY28 sales estimates to 53mt/58mt from 58mt/62mt and adjust realizations assumptions, resulting in an 18%/12% cut to our Ebitda estimates,\u201d noted Systematix Institutional Equities. This would still need monthly sales to average 5.5 mt for the remaining five months, against 3.7 mt so far in FY27. FY26 sales were 50 mt.\n\nNMDC is focusing on value addition through pelletization to lower iron ore dependence. Revenue from pellet sales rose 40% in Q2, contributing 13% to total revenue.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 02:19 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global stocks rally as investors shrug off U.S. tariffs and AI jitters", "full_content": "Global stocks rallied on Thursday, staging a tentative recovery from an intense AI-driven sell-off and looked past a fresh set of tariffs unveiled by the White House on Wednesday.\n\nU.S. markets will be closed Thursday for the Thanksgiving holiday and will have a shortened trading session on Friday. During Wednesday's regular session, the Dow gained 0.33%, the tech-heavy Nasdaq Composite fell 0.62% and the S&P 500 shed 0.25%.\n\nIn Europe on Thursday, equities rose sharply. The pan-European Stoxx 600 was 1.4% higher shortly after the opening bell, with all sectors and major bourses in positive territory.\n\nGermany's DAX led gains on a rise of 1.7%, while the Stoxx 600 Technology index jumped almost 2%. The regional tech index has lost more than 12% so far this month, amid jitters around a potential AI bubble bursting and the ousting \u2014 and return \u2014 of Jensen Huang as Nvidia CEO.\n\nGerman semiconductor firm Infineon was more than 4% higher in early trading, as chip stocks notched a boost. ASMI and ASML gained 2.8% and 2.4%, respectively, while Be Semiconductor added close to 3%.\n\nSouth Korea's Kospi gained 0.29% to close at 4,711.21, while the small-cap Kosdaq index advanced 0.78% to 655.71 after the country's central bank hiked benchmark lending rates to a 2-year high, in its final meeting of the year.\n\nJapan's Nikkei 225 rose 0.86% to 57,499.16 while the Topix edged 0.11% higher to 3,750.4. Australia's S&P/ASX 200 gained 0.82% to 8,763.8.\n\nHong Kong's Hang Seng index was up 1.52% in its last hour of trade, while mainland China's CSI 300 edged higher marginally, closing at 3,900.55.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 02:12 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks, Nasdaq Futures Climb as AI Trade Rebounds: Markets Wrap - Bloomberg.com", "full_content": "Stocks, Nasdaq Futures Climb as AI Trade Rebounds: Markets Wrap Bloomberg.com Global stocks steady after volatile US trading over AI risks Financial Times Stocks rally in Asia, US tariffs not as dire as feared Reuters Global stocks rally as investors shrug off U.S. tariffs and AI jitters CNBC Global markets rebound as tech shares recover and tariff fears ease Yahoo Finance", "source": "Google News Business", "pub_date_str": "26 Nov 2026, 02:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold prices crash \u20b922,000 in a month: Is this the right time to buy to make profits when prices go up? Experts' advice", "full_content": "Gold prices have corrected sharply over the past month, with MCX gold futures falling by nearly \u20b9 22,000 per 10 grams from around \u20b9 1.43 lakh to \u20b9 1.22 lakh. The decline has brought some relief to consumers preparing for the wedding season, but it has also raised a key question: Is this an opportunity to buy gold at lower levels, or could prices fall further?\n\nThe correction has been driven by expectations of another US Federal Reserve rate hike, persistent inflation concerns, elevated US bond yields, a stronger dollar and profit-booking after gold's substantial rally earlier this year. A stronger Indian rupee has added to the pressure on domestic gold prices.\n\nMCX gold is down around 9% year-to-date from approximately \u20b9 1.34 lakh per 10 grams at the end of 2025. It touched a low of \u20b9 1,17,906 per 10 grams on 25 November, marking a decline of around 17% from its level a month earlier and nearly 12% from the start of the year.\n\nOn Thursday, 26 November, MCX gold opened with a modest gap-up near \u20b9 1,22,740 per 10 grams and was trading around \u20b9 1,22,580, up approximately 1.2%. The metal was holding above the \u20b9 1,21,000\u2013 \u20b9 1,21,700 support zone.\n\nGold's recovery, however, has been more muted than silver's. MCX gold gained around 1.2%, compared with a 3.2% advance in silver, as the latter staged a stronger rebound following its deeper correction.\n\nWith gold prices down sharply and wedding-related demand picking up, experts see the correction as an opportunity for physical buyers. However, they caution against investing the entire amount at once, given the possibility of further volatility and downside risks.\n\nGaurav Arora, Head of Research at SAHI, said the correction has been driven by expectations of another US Federal Reserve rate hike and persistent inflation in the US.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ordered silver coins, received rakhis: 5 online shopping lessons from Delhi Consumer Commission\u2019s \u20b920,000 order", "full_content": "Online shopping offers convenience and attractive deals, but receiving the wrong product can quickly turn a routine purchase into a long consumer dispute.\n\nA recent Delhi consumer commission order shows why e-commerce platforms must be transparent and handle delivery complaints properly. It also shows why customers should preserve evidence when an order goes wrong and check what they receive right away.\n\nA Delhi consumer commission has directed Amazon Seller Services Pvt Ltd to pay \u20b9 20,000 in compensation to Akshay Mittal, who was delivered two packets of rakhis instead of the four silver coins he had ordered for \u20b9 5,996, according to a Times of India report.\n\nAccording to the report, the aggrieved customer, Mittal, placed the order on November 10, 2023, for four 50-gram silver coins with 999 purity. Later on, he was delivered the wrong product on November 12. Subsequently, he filed a complaint with Amazon, and the platform refunded \u20b9 5,996 on November 26 instead of arranging an appropriate replacement.\n\nAfter reviewing the facts of the case, the District Consumer Disputes Redressal Commission, South II, Delhi, stated that Mittal had never applied for or requested a refund, and that Amazon should have replaced the original products. Due to this, the commission held the platform guilty of \u2018deficiency in services\u2019 and \u2018 unfair trade practices \u2019, directing it to pay \u20b9 20,000 within 60 days.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Family pension denied to disabled son over missing records: How he won relief from Armed Forces Tribunal after 9 years", "full_content": "Can an adult child with a lifelong disability claim family pension after the death of a parent who served in the armed forces? A case before the Armed Forces Tribunal (AFT), Chandigarh, has brought this question into focus.\n\nFamily pension is a regular payment made by the government to eligible family members of a deceased employee or pensioner to provide financial support after their death. It is generally paid first to the surviving spouse. After the spouse's death, the pension will pass to children.\n\nChildren with disabilities that prevent them from earning a livelihood may qualify for lifelong family pension, subject to the applicable rules.\n\nThe Chandigarh case concerns a 68-year-old man with a lifelong physical disability who sought his late soldier father's family pension. His claim faced objections from the authorities, including over the absence of his name from his father's Army service records. Here's what happened and how he won the case.\n\nAccording to a Times of India report, the applicant, Anil Kumar, lives in Palampur, Himachal Pradesh, with his wife. His father served in the Indian Army from 1940 to 1957 and died in 1975.\n\nAfter his father's death, Kumar's mother, Guffi Devi, received a family pension from 1988 until her death in 2016. Kumar subsequently applied to have the pension transferred to his name, but the Army's Record Office rejected his requests in 2017 and 2019.\n\nThe authorities cited the absence of his name in his father's service records. They also argued that the documents had been destroyed after the mandatory 50-year retention period and that his claim was time-barred, meaning it had been filed beyond the prescribed legal period.\n\nKumar has a congenital deformity affecting his right leg. Medical certificates from Civil Hospital, Palampur, and Zonal Hospital, Dharamshala, assessed his disability at 45% for life and established that he could not earn his livelihood.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "U.S. tariff-hike threats pile pressure on partners to sign trade deals", "full_content": "The Trump administration has unveiled a fresh tariff salvo on more than a dozen trading partners, with China, Vietnam, and India facing some of the steepest potential rates and mounting pressure to conclude trade deals with Washington.\n\nThe proposed tariffs, framed as curbing excess industrial capacity, start at 15% for the European Union, South Korea, Switzerland and Taiwan and rise to as much as 35% for Vietnam.\n\nThe U.S. Trade Representative's Office said it intends to cap the new duties at lower levels for countries that have completed trade deals or are still negotiating with Washington.\n\nThe overall impact on the region is likely to be limited, said Mark Williams, chief Asia economist at Capital Economics. The proposal \"puts most of the targeted countries back where they were earlier in the year,\" he said, after the Supreme Court struck down Trump's emergency tariffs in February.\n\nStill, the proposal could give some countries an incentive to speed up trade talks in order to lock in lower tariff rates, analysts said.\n\nOn Wednesday, U.S. Trade Representative Jamieson Greer said that the new policy likely will not take effect for months, with a senior U.S. official saying the duties could take effect as early as January.\n\nChina faces a capped rate of 20%, on top of an existing 25% tariff imposed during President Donald Trump's first term. The rate could rise to 40% if the trade truce reached in South Korea last October is not extended beyond January, the USTR said.\n\nBeijing has rejected Washington's claim of excess capacity while vowing to take measures necessary to protect its rights.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 01:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India's Capex Cycle Has Years To Run: Vikas Khemani Prefers Enabler Companies", "full_content": "Khemani said the opportunity extends beyond companies directly undertaking capital expenditure to businesses supplying the equipment, products and services that enable the investment cycle.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India Well-Placed To Navigate US Tariff Hurdles, Industry Veterans Say", "full_content": "The Donald Trump administration proposed doubling tariffs on India to 25% following a Section 301 investigation into manufacturing overcapacity across 14 countries. However, the proposed tariff rate could come down to 17% if India and the US reach a reciprocal trade agreement.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fearing layoff due to AI? Job insurance may help you deal with financial crisis: Check if you are eligible", "full_content": "More than two lakh tech workers lost their jobs globally through November this year. For workers worried about AI replacing their roles, the immediate concern is paying bills. Job insurance can offer temporary relief if the policy covers the reason for dismissal. This is applicable to any type of layoff.\n\nTrueUp tracked 2,09,841 job losses across 742 layoff events in the global technology industry. Tech companies cut around 642 jobs per day this year, down from 579 per day in 2025. These figures track overall job cuts across the industry, whether AI-related or not.\n\nJob insurance in India comes as an add-on to another policy, not as a standalone policy, according to Paisabazaar. You may find it with home insurance, accident cover or critical illness insurance. A payout can help with home loan instalments or other financial commitments. You may get support for up to three months while looking for work.\n\nYou generally need a salaried job with a registered company to qualify for this cover. Self-employed workers are ineligible under the terms Paisabazaar describes.\n\nCasual, seasonal, temporary and contractual employment also fall outside that cover. You may be eligible to buy the add-on yet still face restrictions when claiming.\n\nThe reason for losing your job matters as much as your employment status. Some plans may cover job loss linked to critical illness or disability following an accident.\n\nTermination or temporary suspension can also qualify under the relevant terms. If AI replaces your role, you need to check how the policy treats that reason for termination. Since companies rarely disclose AI as the direct reason behind layoffs , yours may fall under standard terminations.\n\nA waiting period can range from 30 to 90 days after the policy starts. Losing your job during that period can rule out a payout.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump Tariff Threat impact on Indian stocks: Gokaldas Exports to Welspun Living - Shares that could face biggest heat", "full_content": "WELSPUNLIV ICIL TRIDENT APEX Vaamanaa Sethi Published 26 Nov 2026, 01:26 PM IST Prefer Livemint on Google India-US trade deal : The latest US tariff rates announced on Wednesday has proposed a 17% tariff on Indian exports if New Delhi \u201cwere to reach an agreement on Reciprocal Trade\u201d with Washington. However, in the absence of a trade agreement, India could face tariffs of up to 25% under Section 301 investigations covering excess production capacity that affects US interests.\n\nIn comparison, the USTR has proposed tariffs of 18% on Bangladesh, Cambodia and Thailand, and 20% on China and Vietnam, subject to the respective countries reaching trade agreements with the US. This could give Indian exporters a competitive edge over their counterparts in these competing economies.\n\nEarlier, in February, US President Donald Trump had announced a trade deal with India, claiming that New Delhi had agreed to significantly increase its purchases of American goods. The announcement came after Washington agreed to reduce tariffs on Indian exports to 18% from the earlier rate of 50%.\n\nAccording to V K Vijayakumar, Chief Investment Strategist, Geojit Investments Limited, the tariff threat is unlikely to have any impact on the Indian stock market in the near-term.\n\n\u201cThe US administration has proposed 25% tariffs on India ( 17% if a trade deal is struck) along with tariffs proposed on many other countries. This is more a tactic to apply pressure on India to reach a deal. India is unlikely to relent much,\u201d Vijayakumar said.\n\nOn the other hand, Vinit Bolinjkar, Head of Research, Ventura, said that The proposed US tariffs of up to 25% on Indian imports could trigger near-term market volatility, weigh on export competitiveness and put pressure on corporate earnings.\n\n\u201cExport-oriented sectors such as textiles, gems and jewellery, engineering goods and marine products remain particularly vulnerable to margin compression and slower order inflows.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tanla Platforms shares plunge 12% in 6 days amid SC's setback for subsidiary Karix Mobile; details about \u20b9375 cr dispute", "full_content": "Pranati Deva Published 26 Nov 2026, 01:21 PM IST Prefer Livemint on Google Tanla Platforms shares fell around 4% in intraday trade on Thursday, November 26, after the Supreme Court dismissed an appeal filed by its subsidiary Karix Mobile challenging rival OneXtel's selection for a government messaging gateway services contract worth \u20b9 330\u2013375 crore.\n\nThe Supreme Court upheld the Delhi High Court's April 2026 ruling in favour of OneXtel, dealing a setback to Karix's challenge against the tender award. The apex court also directed Karix to pay \u20b9 50,000 in costs to the Supreme Court Advocate-on-Record Association within three weeks.\n\nThe development comes as Tanla Platforms' stock has been under pressure in recent sessions, despite delivering positive returns over longer periods.\n\nTanla Platforms opened at \u20b9 649 on Thursday and subsequently touched an intraday high of \u20b9 653.65. The stock was also in the red in the previous session, taking its decline to 8.5% over two days.\n\nOver the last six trading sessions, the stock has closed lower in five, losing around 12% during the period.\n\nHowever, its performance over longer periods remains positive. Tanla Platforms shares have gained 10% in one month, 19% in three months, 18% in six months and 10% over the past year.\n\nA bench of Justices PS Narasimha and Alok Aradhe upheld the Delhi High Court's April 2026 judgment, which had ruled in favour of OneXtel's selection for the National Informatics Centre Services Inc (NICSI) contract.\n\nKarix had challenged the award, alleging that OneXtel was ineligible because it had submitted a false and invalid Capability Maturity Model Integration (CMMI) certification. It argued that the certification was issued by UK Certification and Inspection Ltd, which was not authorised by the CMMI Institute under the Information Systems Audit and Control Association (ISACA).", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "New NFO alert! Invesco India Financial Services Debt Fund\u2014See full offer period, minimum investment amount, more details", "full_content": "New Fund Offer alert: Invesco Mutual Fund (MF) has launched the Invesco India Financial Services Debt Fund, an open-ended debt scheme investing in the financial services sector, the company stated.\n\nManaged by Vikas Garg and Gaurav Jakhotia, the scheme carries moderate interest rate and credit risk and will be benchmarked against the CRISIL Financial Services Short Term Debt Index, as per the fund house.\n\nIt added that the scheme comes amid a rise in India's corporate bond market , where financial sector bonds account for around 50% of the market, according to SEBI data as of the end of September.\n\nThe fund house noted that \u201cimproving credit metrics across banks and non-banking financial companies (NBFCs), coupled with higher carry opportunities available in financial sector bonds, create a compelling environment for a dedicated sector-focused debt strategy\u201d.\n\nAs per the fund house, the product comes at a time when India's financial sector \u201cis demonstrating strong fundamentals, supported by improving asset quality, robust capital buffers and a growing universe of high-quality issuers\u201d.\n\n\u201cThrough rigorous credit research, our proprietary risk assessment framework and active portfolio management, we aim to build a high-quality portfolio that seeks to deliver attractive risk-adjusted income opportunities for investors,\u201d Garg stated.\n\nInvesco Asset Management (India) has an average assets under management (AUM) of over \u20b9 1,75,623 crore for the quarter ending September 2026 across mutual funds, PMS, and offshore advisory business, as per the release.\n\nInvesco is a global independent investment management firm with offices in over 20 countries, managing $2.5 trillion in assets on behalf of clients worldwide as of June 30, 2026, it added.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why is Max Healthcare stock surging despite regulatory headwinds?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMax Healthcare Institute's stock has staged a sharp recovery, gaining around 30% in a month. The rally follows a steep fall since September, when the Supreme Court raised concerns over inflation in anti-cancer drugs. Soon after, the National Pharmaceutical Pricing Authority capped trade margins at 30% on 137 non-scheduled anti-cancer drugs.\n\nEffective 9 November, the move is expected to reduce prices of several medicines by as much as 70%. Moreover, as per a Mint report , similar caps are being considered for other high-cost and essential drugs, including antibiotics, diabetes and heart medicines, and biologics.\n\nEven so, the stock's recovery suggests investors are reassessing the potential earnings damage amid improving capacity utilisation and expectations of stronger growth. Still, Max's relatively high exposure to oncology and government-sponsored healthcare schemes makes it more vulnerable to regulatory changes than peers.\n\nOncology contributed 22% of Max's inpatient revenue, a key revenue source for hospitals, in the first half of FY27 (H1FY27), down from 26% a year ago. However, only 30% of its oncology revenue comes from chemotherapy drugs, some of which are affected by the new restrictions.\n\nMoreover, with hospitals expected to raise prices of other services, the net impact on earnings may be lower than initially feared. \u201cFactoring in lower Onco revenues and likely implementation of price caps on Onco drugs, we marginally trim our Ebitda estimates by 3% each for FY27/28E,\u201d said a report by Anand Rathi Share and Stock Brokers.\n\nBut oncology is not Max's only regulatory vulnerability. Its relatively higher exposure to government-sponsored patients has been a double-edged sword.\n\nCentral Government Health Scheme (CGHS) package rates were revised upwards in October 2025, after years of stagnation.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 01:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Taking on Starlink: Europe\u2019s largest satellite factory opens in push to rival Musk", "full_content": "The largest satellite factory in Europe was inaugurated in Belgium this week, boosting the continent's efforts to challenge Elon Musk's Starlink and reduce reliance on U.S. space infrastructure.\n\nPrivately held Belgian satellite manufacturer Aerospacelab secured a 2.4-billion-euro ($2.6 billion) contract in September to manufacture 264 of the 348 satellites planned for IRIS\u00b2, the European Union's answer to SpaceX 's Starlink business.\n\nAerospacelab said this will \"form the backbone of Europe's sovereign, secure, and resilient connectivity infrastructure by 2030.\" It will be named Ectro from Nov. 30.\n\nIts new oval-shaped, 20,000-square-meter facility in southern Belgium, inaugurated by Belgian King Philippe, will be able to produce up to 500 satellites annually, which would make it the world's third-largest satellite production site, according to the Belgian royal palace.\n\nEmployees are expected to move into the megafactory in January, and production is slated to begin by the end of 2028, according to AFP.\n\nSatellite connectivity has become increasingly important to everyday life as well as national security.\n\nIt provides internet access to remote locations and defense equipment like warships and fighter jets, and lets governments and militaries communicate securely where Earth-based networks are unavailable or disrupted.\n\nThe importance of such capabilities has become particularly apparent in Ukraine, as the country's military relies heavily on Starlink connectivity to fight Russian forces. Recent restrictions to the service over Russian-occupied territory reported by Ukrainian officials further underscored the way geopolitical conflict may depend on commercial businesses.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 01:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Mutual fund returns fall, SIP exits rise: Study explains why regular-plan investors hold on longer than direct ones", "full_content": "Direct and regular plans are two options available to mutual fund investors. Direct plans do not involve distributor commissions and are routed directly through AMCs. Both invest in the same portfolio, but regular plans have a higher expense ratio due to distributor commissions.\n\nFrom 1 November, direct plans will be the default option on AMC digital platforms to ensure investors are aware of the plan they choose. But does choosing a direct plan necessarily mean investors are better equipped to manage their investments on their own?\n\nIn October, 59.12 lakh SIP s were discontinued or completed their tenure, compared with 50.68 lakh new SIP registrations.\n\nDespite market volatility, investors in regular plans have tended to stay invested for longer. According to the latest Wealthy\u2013Monitor Deloitte study, The Human Link: Voice of the Mutual Fund Distributor in 2026 , continued engagement with distributors helps investors stay focused on their financial goals amid market volatility.\n\nThe study highlights a clear difference in the holding patterns of regular and direct-plan investors.\n\nAccording to AMFI\u2013Crisil Factbook 2026 data analysed in the report, 23.5% of assets in regular plans had remained invested for more than five years as of March, compared with around 14% in direct plans.\n\nThe difference was even wider for SIP investments. Around 34.4% of regular-plan SIP assets had remained invested for over five years, against 19.9% in direct plans. This 14.5-percentage-point gap highlights the role of distributors in helping investors remain committed during market fluctuations.\n\nOne investor interviewed as part of the study summed up the value of continued engagement during market volatility: \u201cIf I were investing on my own, I probably would have withdrawn everything in panic. Having a guide who speaks with you during market downturns and explains why things have fallen makes a huge difference.\u201d", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 01:08 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Over 2,200% Return In 5 Years: BSE Shares Jump 5% As HSBC Prefers 'David Over Goliath'", "full_content": "The BSE share price touched an intraday high of Rs 3,944, taking its five-year returns to around 2,234%.", "source": "NDTV Profit", "pub_date_str": "26 Nov 2026, 01:08 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Robots could be doing household chores in just 1-2 years, Chinese EV firm says", "full_content": "BEIJING \u2014 The household robot could soon become a reality, Brian Gu, co-president of Xpeng , a Chinese electric car company which has entered the humanoids space, told CNBC.\n\n\"Maybe after successful deployment into commercial settings, maybe another one to two years, we can start thinking about deploying into home settings,\" Gu said. \"Technology is moving at a much faster clip.\"\n\nXpeng revealed its latest general-purpose humanoid robot Iron on Wednesday. The company plans to start training the robot as a store assistant in its retail car locations in the first quarter next year, after starting mass production in January. Sales are set to begin in the second quarter, with deliveries expected later in the year.\n\nFounded in 2014 as an electric car company, Xpeng beat Tesla to rolling out driver-assist in mainland China. The Chinese automaker has launched its own artificial intelligence chips. It's also expanded into personal flying vehicles and robotics. The robotics unit this summer raised $900 million at a $6.3 billion valuation in its first funding round, led by IDG Capital.\n\nInvestors, however, appear to be a tad skeptical about the developments at Xpeng, with the downturn in the Chinese auto market also weighing on the company. Xpeng's shares, listed in both New York and Hong Kong, have dropped more than 55% this year amid broad sector declines.\n\nChina's humanoid industry has faced more regulatory scrutiny on financing in recent months after Unitree's high-profile IPO and stock slump, as well as a rush of capital into the sector. That's all raised questions about commercialization and the efficacy of the core tech.\n\nGu said Xpeng's robotics stands out for its rare combination of the hardware, software and real-life use cases. He's expecting to add more investors after Iron's planned commercial launch next year.\n\n\"You can always make the head talk, you can always make the leg run, you can always make the hands to do certain tasks,\" Gu said.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 01:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "It\u2019s an earnings bubble, not a valuation bubble", "full_content": "The difference matters", "source": "FT Markets", "pub_date_str": "26 Nov 2026, 01:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wealthy Europeans look beyond stocks amid AI selloff. Here\u2019s where they\u2019re investing", "full_content": "Wealthy Europeans are looking to alternative asset classes to build exposure to artificial intelligence themes amid turbulence in public markets.\n\nGoldman Sachs Alternatives' inaugural survey of high-net-worth and ultra-high-net-worth investors found 47% of European respondents saw alternatives as the best way to gain exposure to AI and future tech growth, compared to just 24% of U.S. investors.\n\nThe survey found a significant gap between the U.S. and Europe in terms of investor knowledge of alternatives, which include assets like private equity, property and infrastructure. Goldman said 82% of European respondents are familiar with the alternative investments market \u2014 compared to 50% of U.S. investors.\n\nGoldman polled 1,000 investors with at least 1 million in investable assets in their local currency across the U.K., France, Germany, Italy and Switzerland. The survey was carried out between June 29 and Aug. 18 this year.\n\nThe report on the findings, published Wednesday, did not specify the proportion of respondents who already have a stake in some kind of alternative investment \u2014 but wealthy Europeans appeared particularly bullish on the space.\n\nPrivate equity made up the largest proportion of current alternatives holdings. Among wealthy Europeans with alternatives exposure, 62% said they invested in private equity. The second most commonly held asset class was private real estate, which was backed by 51% of European alternatives investors. Hedge funds were held by 37% of European alternatives owners, and private infrastructure was held by 30%.\n\nOne in four respondents who did not already own an alternative investment said they were likely to invest in the market in the coming 12 months.", "source": "CNBC Top News", "pub_date_str": "26 Nov 2026, 12:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "KFin Technologies shares jump 7% as Mahanadi Coalfields IPO buzz lifts registrar;experts see further upside | Here's why", "full_content": "KFin Technologies shares surged over 7% on Thursday, 26 November, amid a positive trend in the broader stock market and investor interest surrounding the allotment of the Mahanadi Coalfields IPO, for which the company is acting as the registrar.\n\nThe stock opened at \u20b9 935.75 apiece on the BSE and subsequently climbed to an intraday high of \u20b9 997.90 per share.\n\nThe allotment of the Mahanadi Coalfields IPO was finalised on Wednesday, 25 November. The refund process for applicants who did not receive an allotment is scheduled to begin on Thursday, 26 November. Shares will also be credited to the demat accounts of successful applicants on the same day.\n\nThe IPO is scheduled to list on the stock exchanges on Friday, 27 November.\n\nSeparately, KFin Technologies disclosed in an exchange filing on Wednesday that the Securities and Exchange Board of India (SEBI) had passed an adjudication order dated 25 November 2026, imposing a monetary penalty of \u20b9 10 lakh on the company under Section 15HB of the SEBI Act, 1992.\n\nThe order relates to a case involving Vanita Krishnakant Gandhi and concerns a transmission-cum-dematerialisation request for certain shares of Balkrishna Industries Limited.\n\nKFin Technologies was involved in processing the request in its capacity as a Registrar to an Issue and Share Transfer Agent (RTA). SEBI imposed the penalty on the company in connection with the matter.\n\nRajesh Bhosale, Technical Analyst at My Advisor Alpha, said capital market stocks are witnessing strong buying interest, with KFin Technologies also seeing significant volume-led traction. He noted that the stock has registered a technical breakout and is trading above all its key moving averages, suggesting potential further upside in the near term. Bhosale sees \u20b9 1,030 as the next potential target, while \u20b9 940 is likely to act as support.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 12:47 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Is the stock market open for Thanksgiving? The answer might surprise you.", "full_content": "The answer to the question of whether the stock market is open on Thanksgiving isn\u2019t a simple yes or no, as the major exchanges are closed, but trading of equity futures is open for part of the day.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Nov 2026, 12:46 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bulls, bears slug it out at 26000 after sharp Nifty rally", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBears and bulls are slugging it out around the 26000 Nifty call option strike expiring on 29 December. A breach of this level, holding for two to three trading sessions, could pave the way for the benchmark index to catapult to a fresh record high.\n\nThe Nifty has gained 12% this month to 25,819.25 as of Wednesday's close. It was 0.4% higher at 25,916.70 around 12.30 pm on Thursday.\n\n\u201cThe momentum suggests the market could hit a new high next month, surpassing 26000-26100, but we are waiting for Thursday-Friday end-of-day data, which could strengthen our belief,\u201d said Shai Coelho, founder of Vtrender, an online charting firm.\n\nThe 26,000 call option expiring on 29 December has attracted attention because its volume-weighted average price \u2013 the level at which maximum Nifty shares have been transacted \u2013 is \u20b9 436 per share. One Nifty options contract comprises 65 shares.\n\nThis means the breakeven price for the seller of the call is 26436, above the 26373.2 record high that Nifty hit on 5 January. Breakeven implies neither profit nor loss.\n\nBeyond this breakeven level, call sellers could face unlimited losses. This would force them to close out their positions around 26150-26200, strengthening the rally, said Coelho.\n\nA call seller\u2019s maximum profit is limited to the premium paid by the call buyer \u2013 in this case \u20b9 436. The potential loss of a call seller, however, is unlimited.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 12:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Multibagger stock Pitti Engineering shares snap 5-day losing streak, gains 13% on high volumes; up 291% in 5 years", "full_content": "Pitti Engineering shares surged as much as 13% on Thursday, ending a five-session decline amid elevated trading volumes. The rebound came despite a 15.47% year-on-year fall in second-quarter net profit, as investors weighed revenue growth and the company\u2019s expansion plans.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 12:16 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Multibagger stock to buy: SG Mart shares rise 4% despite 5800% rally in 5 years | Buy, sell or hold? Experts explain", "full_content": "SG Mart shares opened at \u20b9749 apiece on NSE today, as compared to previous close of \u20b9829.45 on Wednesday and touched an intraday high of \u20b9865 on 26 November.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:55 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IDBI Bank pension dispute: Why SC dismiss employees' appeals amid stake sale? Can they still challenge the decision?", "full_content": "The Supreme Court dismissed appeals challenging IDBI Bank\u2019s pension scheme, affirming that the bank is not State under the Constitution.&nbsp;", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 11:48 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Multibagger small-cap stock announces 5:9 bonus issue; shares jump over 800% in 1 year | Record date, key details", "full_content": "Indus Finance will issue five bonus shares for every nine held, with 1 December 2026 set as the record date. Shareholders approved the proposal unanimously. The stock has surged over the past year, while second-quarter FY27 revenue rose 21.9% year on year and net profit increased 12.5%.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:43 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dividend, rights issue, Stock Split: Last chance to buy ahead of record date Nov 27 - Varvee, JTL Defence, Fusion CX", "full_content": "Varvee Global, JTL Defence and Fusion CX have set November 27, 2026, as the record date for upcoming corporate actions. Varvee Global plans a share split, JTL Defence is preparing a rights issue worth up to \u20b924.58 crore, and Fusion CX has proposed a final dividend of \u20b90.75 per share.", "source": "LiveMint Markets", "pub_date_str": "26 Nov 2026, 11:24 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Paws, premiums, and the OPD puzzle: pet insurance offerings and gaps", "full_content": "Pet insurance is gaining ground as veterinary costs rise, but OPD exclusions, confusing fine print and patchy clinic infrastructure leave pet parents paying much of the bill themselves.", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 11:24 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold prices slipped 2% below support level before bouncing back \u2014 Here's why the precious metal remains under pressure", "full_content": "Gold prices fell after strong US economic growth and persistent inflation reinforced expectations of Federal Reserve rate increases. Despite a partial rebound, analysts expect the precious metal to remain under pressure. Here's why\u2026&nbsp;", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 11:19 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI brings 60 tonnes of gold home from overseas vaults in six months amid falling global prices: What numbers tell us", "full_content": "The RBI held 880.52 tonnes of gold at the end of September, shifting 60.08 tonnes from overseas vaults to domestic storage over six months. However, gold\u2019s share of forex reserves fell as international gold prices eased.&nbsp;", "source": "LiveMint Money", "pub_date_str": "26 Nov 2026, 11:09 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Beware higher correlation but nab high U.S. credit yields, fund managers say", "full_content": "The AI boom could trigger a recession, but data centers remain an attractive investment opportunity, a hedge fund manager said.", "source": "CNBC World Economy", "pub_date_str": "26 Nov 2026, 11:06 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Rupee falls 20 paise to 92.40 against US dollar in early trade", "full_content": "The rupee fell 20 paise to 92.40 against the US dollar in early trade. Higher crude oil prices and proposed tariffs by the US administration increased dollar demand. Foreign fund inflows supported the rupee but it faced pressure from rising crude prices. The US proposed 25 percent tariffs on imports from India, which raised inflation concerns. India rejected these allegations and expressed commitment to finalize a bilateral trade deal.", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 10:54 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India bonds tumble as Brent tops $95 per barrel, RBI flags food inflation risks", "full_content": "Indian government bonds fell as oil prices surged, raising concerns about inflation and economic stability. The Reserve Bank of India highlighted rising food inflation pressures, indicating widespread price increases. Higher oil prices may widen the current account deficit and impact the rupee negatively. Investors are anticipating the monetary policy decision scheduled for December 4, with rate hikes expected. The overall economic situation reveals significant inflation challenges ahead for the country.", "source": "Economic Times Markets", "pub_date_str": "26 Nov 2026, 10:50 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "26 Nov 2026, 03:11 PM IST", "total_stories": 313};

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
