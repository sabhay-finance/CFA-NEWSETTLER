    const allData = {"general": [{"title": "Samsara\u2019s chief accounting officer sells $92,120 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:45 AM IST", "pub_date_relative": "17m ago"}, {"title": "Shares to buy or sell: Chandan Taparia of Motilal Oswal recommends three stocks to buy today - 18 September 2026", "full_content": "The Indian stock market is expected to open flat on Friday, 18 September tracking mixed global cues. The trends on Gift Nifty also indicate a muted start for the Indian benchmark indices, Nifty 50 and Sensex today.\n\nThe Gift Nifty was trading around 23,337 level, a premium of nearly 4 points from the Nifty futures\u2019 previous close.\n\nThe domestic equity indices ended mixed in the previous session, with the benchmark Nifty 50 closing above 24,260 level.\n\nThe Sensex lost 21.86 points, or 0.03 % , to close at 74,314.59 , while the Nifty 50 settled 53 points, or0.23%, higher at 23,270.60.\n\nOn the Nifty options front, Chandan Taparia, Head Derivatives & Technicals, Wealth Management, Motilal Oswal Financial Services Ltd, said that themaximum call OI is at 23,300 then 23,800 strike, while maximum put OI is at 23,200 then 23,000 strike.\n\n\u201cCall writing is seen at 23,300 then 23,350 strike while Put writing is seen at 23,300 then 23,250 strike. Option data suggests a broader trading range in between 22,800 to 23,600 zones while an immediate range between 23,000 to 23,400 levels,\u201d said Taparia.\n\nNifty 50 index opened on a flattish note and remained range-bound throughout the session amidst subdued momentum. The index failed to sustain higher levels, took support near 23,200, and remained in a sideways trend. It formed a bullish candle on the daily frame, indicating support-based buying at lower levels.\n\n\u201cNow till it holds below 23,300 zones weakness could extend towards 23,150 then 23,000 levels while on the upside hurdles can be seen at 23,450 then 23,550 zones,\u201d  of market strategy at TradeStation Group.\n\nThe first to feel it are freight haulers, but there will be plenty of other losers \u2014 consumers and companies \u2014 if diesel remains at record price levels.\n\nThe chief commercial officer for Norfolk Southern railroad noted at a Morgan Stanley conference on Tuesday that in California, the price of diesel was already $8.\n\nConsumers are getting a taste of what could come next in the form of already higher prices at the gas pump . What is driving up gas prices right now isn't just the price of oil, said Jeff Lenard, vice president of media and strategic communications at the National Association of Convenience Stores. It's the price of diesel. The cost to get the gas to the gas station is the driving factor behind the steady increase at the pump.\n\n\"The higher transit costs are adding several additional cents to the cost of selling fuel \u2013 as do swipe fees that are percentage based and increase as prices increase,\" Lenard said. Retailers are faced with the tough decision of whether to absorb these added increases or pass them along at the pump.\n\n\"Right now, they are absorbing the bulk of the costs, which typically happens when wholesale prices and costs increase dramatically.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 06:34 AM IST", "pub_date_relative": "28m ago"}, {"title": "Zscaler CPO Adam Geller sells $1.96 million in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:31 AM IST", "pub_date_relative": "31m ago"}, {"title": "Kratos Defense president Carrai sells $310,900 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:31 AM IST", "pub_date_relative": "31m ago"}, {"title": "Zscaler CEO Chaudhry sells $549,759 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:30 AM IST", "pub_date_relative": "32m ago"}, {"title": "Anthropic says its emium Content\n\nThe Reserve Bank of India's open market operation sale received robust investor interest. This operation aimed to absorb surplus liquidity from the banking system. The central bank accepted bonds at yields higher than prevailing market rates. This move precedes a significant weekly bond auction scheduled for Friday. Further liquidity absorption measures are planned for the coming week.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 06:29 AM IST", "pub_date_relative": "33m ago"}, {"title": "Global Market Today: Asian stocks, bonds gain as oil extends decline", "full_content": "Home Times Creators Club ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian stocks, bonds gain as oil extends decline Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian stocks, bonds gain as oil extends decline SECTIONS Global Market Today: Asian stocks, bonds gain as oil extends decline Bloomberg Last Updated: Sep 18, 2026, 06:24:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis MSCI\u2019s regional equities gauge advanced 0.3% with South Korea\u2019s Kospi index leading gains. That came after the S&P 500 Index rose 1.1% on Thursday, its biggest advance since early August. The tech-heavy Nasdaq 100 Index climbed 1.7%, while a key gauge of chipmakers jumped 3.1% as US stocks rebounded from losses triggered by the Federal Reserve\u2019s first rate hike since 2023.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Sep 2026, 06:24 AM IST", "pub_date_relative": "38m ago"}, {"title": "Stock futures are little changed after Thursday's post-Fed bounce: Live updates", "full_content": "U.S. stock futures were little changed Thursday night, after the major averages rose following Wednesday's first Federal Reserve interest rate hike in three years.\n\nDow Jones Industrial Average futures rose by 30 points, or 0.06%. S&P 500 futures and Nasdaq-100 futures dipped 0.08% and 0.15%, respectively.\n\nIn Asia, Japan's Nikkei 225 added over 1% while the Topix slipped 0.11%. South Korea's Kospi advanced 2.3% at open, while the small-cap Kosdaq gained 0.89%. Australia's benchmark S&P/ASX 200 was 0.41% higher.\n\nU.S. markets are coming off a positive session. The Dow Jones Industrial Average closed higher by 316 points, or 0.6%. The S&P 500 rallied 1.1%, while the Nasdaq Composite jumped 1.7%.\n\nStocks posted a comeback one day after the Fed's decision to raise rates by a quarter percentage point \u2014 with the suggestion of at least one more rate increase this year \u2014 drove major market averages sharply lower Wednesday.\n\nBut Thursday's rally \u2014 especially in technology stocks \u2014 implies many investors are looking past the prospect of a higher-for-longer rate, or inflation, environment, returning instead to an artificial intelligence story that should continue to bolster corporate profits.\n\n\"At some point, all cycles end,\" Brian Levitt, chief global market strategist at Invesco, told CNBC's \"Closing Bell.\" \"This one, I don't think it's going to end with the higher Fed funds rate necessarily anytime soon, or higher oil prices. It's going to end when something breaks in the AI trade, when, again, a hyperscaler pulls back on investment, or the market deems the amount of investment to be overdone compared to expected return on invested capital. But that's not the current environment that we're in.\"\n\nThe week concludes Friday with more commentary from Fed officials. Fed Governor Michelle Bowman, a permanent voting member of the policy-setting Federal Open Market Committee, and Kansas City Fed President Jeffrey Schmid, a non-voting member, are set to speak.", "source": "CNBC Top News", "pub_date_str": "18 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "Mutual funds are avoiding big trades in India's new closing auction \u2014 here's why", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMumbai: Indian mutual funds are increasing their participation in the stock market's new closing auction \u2014 but mostly in trades too small to matter, several fund managers told Mint , wary of the sharp price swings that can occur within the 15-minute window.\n\nIntroduced on 3 August, the Closing Auction Session (CAS) has struggled to attract sustained participation despite a gradual increase in trading activity. Mutual funds are limiting the trades they route through the auction, preferring transactions where an adverse execution price would have a limited impact on a scheme's net asset value (NAV).\n\nThe concern for mutual funds isn't whether the closing auction attracts enough activity \u2014 it's whether it can deliver a predictable price for large orders. A sharp swing during the 15-minute window could leave a fund buying or selling well off the prevailing market price, denting a scheme's NAV and leaving the fund manager to explain the trade to trustees. And the new system has already seen several instances of sharp price swings in the closing minutes.\n\n\"Mutual funds are avoiding CAS for trades that are substantial in value and volume, and hence important to the fund house. Trades that are not very important and do not impact P&L are being sent to CAS. This is largely because of the unexpected price swings and uncertainty during CAS,\" said a mutual fund executive, requesting anonymity.\n\nThe system's early months have shown how volatile that price can be: on the very first day, the Nifty jumped nearly 200 points in the closing minutes while the Sensex barely moved.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Fed hike tests domestic muscle. Can markets hold the line?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nDomestic institutions are outbuying foreign sellers, but Indian stocks are still sliding. With the US Federal Reserve raising interest rates for the first time in more than three years\u2014a move that would typically draw foreign money away from emerging markets\u2014the question is: how much protection can domestic money provide?\n\nAs of 16 September, domestic institutional investors (DIIs) had bought a net \u20b9 31,581 crore of equities during the month, comfortably exceeding foreign portfolio investor (FPI) withdrawals of \u20b9 17,222 crore. Yet the Nifty 50 was down 3.6% since end August.\n\nThe Fed\u2019s 25-basis-point rate hike, taking the benchmark to 3.75-4.00%, arrived after Indian markets closed that day Wednesday. September flow data, therefore, shows the backdrop to the decision, rather than the market\u2019s response to it. The rate increase was the first since July 2023.\n\nHistory shows why domestic buying offers reassurance, but little certainty about market direction.\n\nAlso read Hero Motors IPO: Can EV momentum offset muted revenue growth and capacity drag?\n\nA Mint analysis of Bloomberg data across 21 Fed rate-hike months between December 2015 and September 2026 found that DIIs bought in all 10 months when foreign investors sold. Nifty, nevertheless, declined in seven of those months.\n\nThat does not mean domestic support failed. The index could have fallen further without it. But the purchases alone were insufficient to keep the market in the positive territory.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock recommendations for 18 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Indian equities ended largely flat on Thursday as investors digested the U.S. Federal Reserve's overnight rate hike, even as broader market participation stayed strong.\n\nNifty 50 edged up 53 points, or 0.23%, to close at 23,270.60, while Sensex slipped 21.86 points, or 0.03%, to settle at 74,314.59. The Fed raised interest rates by 25bps, its first hike since 2023, and signaled the possibility of another increase later this year, keeping U.S. bond yields elevated near 5% and weighing on rate-sensitive sectors.\n\nCapital goods, healthcare, metals, and auto stocks led the gains. At the same time, banking and oil & gas names lagged, with HDFC Bank, ICICI Bank, and SBI among the notable decliners. Insurance and select consumption names also stood out on the upside.\n\nElevated crude oil prices and a crowded primary market added to the cautious undertone. Despite the muted headline move, market breadth was healthy, with 2,262 stocks advancing, 1,279 stocks declining, and 110 remaining unchanged, indicating broad-based buying interest beneath the surface even as investors stayed watchful of global rate cues.\n\nBuy: Talbros Automotive Components Limited (current price: \u20b9 435)\n\nIndian equities ended modestly higher on 17 September, with Nifty 50 gaining 53 points, or 0.23%, to 23,270.60, after trading between 23,193.65 and 23,363.55. Meanwhile, Sensex closed at 74,451.12, up 114.67 points (0.15%). The session showed stronger participation beyond the benchmarks, with 2,262 stocks advancing, 1,279 declining, and 110 remaining unchanged, translating into a healthy advance-decline ratio of about 1.77:1. On the sectoral front, healthcare and realty led the gains. Nifty Pharma (+ 1.66%, Healthcare (+1.56%), Realty (+1.45%), Auto (+0.99%), and Metal (+0.94%) led the gains. Private Bank (-0.42%), PSU Bank (-0.16%), and Oil & Gas (-0.14%) lagged.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "VVDN Technologies readies for \u20b94,000-5,000 crore IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nVVDN Technologies is weighing a \u20b9 4,000-5,000 crore fundraise through an initial public offering (IPO) , with the electronics manufacturing services company expected to begin formal pitches to investment banks over the next quarter, according to four people aware of the development.\n\nThe proposed IPO is likely to comprise a mix of fresh capital and an offer for sale (OFS), the people said on the condition of anonymity. \u201cThe company has already held informal discussions with some investment banks, with formal pitches expected over the coming quarter, following which it will appoint bankers,\u201d one of the sources quoted above said.\n\n\u201cThe company is currently focused on meeting internal revenue and profitability milestones, and details around the company\u2019s valuation and the eventual IPO structure are yet to be finalized,\u201d a second person quoted above added. Valuation discovery is still underway as the company firms up its growth plans, the person said.\n\nThe potential listing comes as India\u2019s public-market fundraising window has opened up , with IPOs, qualified institutional placements and block deals picking up simultaneously.\n\nSeveral new-age companies, including Symbiotec Pharmalab, Milky Mist, Shiprocket, Gaja Capital and Purple Style Labs, have listed in the past two months, while companies such as Billionbrains Garage Ventures, Physicswallah, Rubicon Research, Welspun Corp. and Viyash Scientific have tapped public markets through secondary transactions.\n\nVVDN has raised over $129 million in multiple private funding rounds since its inception in 2007, according to data firm Tracxn. As of June 2024, the company was valued at $274 million, according to Tracxn.\n\nThe company has two major investors, Motilal Oswal Private Equity and LV Holdings Private Family Trust, holding about 36% of the firm, Tracxn data showed.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Samsara\u2019s chief accounting officer sells $92,120 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:45 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Shares to buy or sell: Chandan Taparia of Motilal Oswal recommends three stocks to buy today - 18 September 2026", "full_content": "The Indian stock market is expected to open flat on Friday, 18 September tracking mixed global cues. The trends on Gift Nifty also indicate a muted start for the Indian benchmark indices, Nifty 50 and Sensex today.\n\nThe Gift Nifty was trading around 23,337 level, a premium of nearly 4 points from the Nifty futures\u2019 previous close.\n\nThe domestic equity indices ended mixed in the previous session, with the benchmark Nifty 50 closing above 24,260 level.\n\nThe Sensex lost 21.86 points, or 0.03 % , to close at 74,314.59 , while the Nifty 50 settled 53 points, or0.23%, higher at 23,270.60.\n\nOn the Nifty options front, Chandan Taparia, Head Derivatives & Technicals, Wealth Management, Motilal Oswal Financial Services Ltd, said that themaximum call OI is at 23,300 then 23,800 strike, while maximum put OI is at 23,200 then 23,000 strike.\n\n\u201cCall writing is seen at 23,300 then 23,350 strike while Put writing is seen at 23,300 then 23,250 strike. Option data suggests a broader trading range in between 22,800 to 23,600 zones while an immediate range between 23,000 to 23,400 levels,\u201d said Taparia.\n\nNifty 50 index opened on a flattish note and remained range-bound throughout the session amidst subdued momentum. The index failed to sustain higher levels, took support near 23,200, and remained in a sideways trend. It formed a bullish candle on the daily frame, indicating support-based buying at lower levels.\n\n\u201cNow till it holds below 23,300 zones weakness could extend towards 23,150 then 23,000 levels while on the upside hurdles can be seen at 23,450 then 23,550 zones,\u201d said Taparia.", "source": "LiveMint Markets", "pub_date_str": "18 Sep 2026, 06:43 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBA to assess if rates adequate to cool inflation, says Governor Bullock", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Sep 2026, 06:39 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US stocks rebound as oil prices fall and bond yields ease after Fed rate hike", "full_content": "Home Times Creators Club ETPrime Markets Market Data Masterclass News Ind     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
