ource": "Google News Business", "pub_date_str": "01 Sep 2026, 06:55 PM IST", "pub_date_relative": "9m ago"}, {"title": "Stocks are starting out September under pressure. Bank of America zeroes in on key level", "full_content": "September is living up to its infamous reputation, at least on day one.", "source": "CNBC Top News", "pub_date_str": "01 Sep 2026, 06:54 PM IST", "pub_date_relative": "10m ago"}, {"title": "Trump says U.S. growth could hit 20%. It\u2019s happened only once since WWII", "full_content": "President Donald Trump said Monday that the U.S. economy could grow at rates as high as 20%, while arguing that even such rapid growth should not prompt the Federal Reserve to raise interest rates .\n\n\u201cWe could have a GDP of 14, 15, 16 and 20,\u201d Trump said during an Oval Office event announcing agreements aimed at lowering prescription drug prices. \u201cSuccess in growth does not cause inflation .\u201d\n\nTrump\u2019s comments came as he continues to push for lower borrowing costs even as Federal Reserve officials contend with inflation that remains above their 2% target .\n\nThe Fed held its benchmark rate steady at 3.5% to 3.75% in July, with three policymakers dissenting in favor of a quarter-point hike. Many Fed watchers expect the Federal Open Market Committee to raise rates at its next meeting in September.\n\nBut growth anywhere close to the levels Trump floated would be virtually unprecedented in the modern U.S. economy.\n\nReal gross domestic product has grown at an annualized rate of 20% or more in just one quarter in Bureau of Economic Analysis data dating to 1947. That was the third quarter of 2020, when the economy surged at a 34.9% annualized rate as businesses reopened following widespread Covid-19 shutdowns , according to BEA data. The rebound followed a 28% annualized contraction in the previous quarter.\n\nThe next-highest quarter was the first quarter of 1950, when real GDP grew at a 16.7% annualized rate as the U.S. and world emerged from World War II and the baby boom generation was born. No other quarter in the nearly eight-decade series has reached 20%.\n\nToday\u2019s economy is growing at a fraction of those rates. Real GDP increased at a 1.5% annualized rate in the second quarter of 2026, down from 2.1% in the first quarter, according to the BEA\u2019s latest estimate.", "source": "CNBC Top News", "pub_date_str": "01 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago"}, {"title": "\u2018It\u2019s not fair\u2019: My twin brother and I were left houses by our parents. Can I make him pay his share for taxes and upkeep?", "full_content": "\u201cI am frustrated and financially exhausted from continuing to invest my own money into these properties.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "01 Sep 2026, 06:45 PM IST", "pub_date_relative": "19m ago"}, {"title": "U.K. Government Bond Yields Surge to Multiyear Highs", "full_content": "Skip to navigation Skip to main content Skip to right column U.K. Government Bond Yields Surge to Multiyear Highs Miriam Mukuru Tue, September 1, 2026 at 6:11 AM MST 3 min read Yields on 30-year U.K. government bonds soared to their highest level since 1998 on Tuesday, while 10-year yields hit their highest since 2008, mirroring trends in global bond yields due to rising inflation concerns.\n\nThe rise in borrowing costs exacerbated concerns about the weak state of the U.K.'s public finances.\n\nA Hedge-Fund Titan's Divorce Is Putting Wall Street's Staggering Wealth on Public View\n\nFTC Sues Amazon, Alleging It Deceived Advertisers and Drove Up Prices\n\nErnst & Young Is Giving $100 Million in Bonuses to Staff for 'Human' Skills\n\nSEC Presses Investment Firms to Prove They Have Access to Shares in Hot Startups\n\nThirty-year U.K. government-bond yields, also known as gilt yields, jumped as high as 5.904%, while the 10-year yields increased to 5.255%, LSEG data showed.\n\nThe moves came in tandem with a rise in U.S. 10-year Treasury yields, which hit their highest since January 2025, while yields on 10-year Japanese government bonds hit a 30-year high, and 10-year German government-bond yields reached their highest since 2011.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:41 PM IST", "pub_date_relative": "23m ago"}, {"title": "September 2026 income tax calendar: Key TDS, TCS, advance payment and audit deadlines you should know", "full_content": "September has several important income tax compliance deadlines for taxpayers, businesses, and other entities.\n\nThe month also brings a series of 30 September deadlines, mainly related to tax audits and audit reports. Taxpayers covered by these requirements should ensure that the relevant audit reports and forms are filed on time, especially where the income tax return is due on 31 October 2026.\n\nHere are the key tax deadlines to watch out for in September 2026.\n\nTax deducted or collected during August 2026 needs to be deposited with the government by 7 September.\n\nThe final day of September has several compliance requirements, largely meant for businesses, companies, trusts, specified funds, and other taxpayers subject to audit.\n\nBy 30 September, certain eligible entities must also file prescribed audit reports under the Income Tax Act, 1961, where their ITR is due on or before 31 October.\n\nDisclaimer: This is only for informational and educational purposes. Please consult a qualified expert for the latest laws and regulations.\n\nSheetal Goel is a Content Producer at Livemint, where she covers corporate developments, personal finance, business trends, markets, and SEBI-related updates. She focuses on simplifying complex financial concepts and presenting them in a clear, reader-friendly manner, thereby helping audiences better understand investment trends, personal finance, and market developments. Her writing focuses on making finance more accessible to everyday readers while maintaining clarity, accuracy, and relevance. <br><br> She holds a degree in Economics (Hons.) along with an MBA in Finance, which has helped her develop a strong foundation in financial analysis, market understanding, and business reporting. Before joining journalism, she worked with finance and broking firms, where she closely followed market developments, investment strategies, and evolving industry trends. This practical exposure strengthened her understanding of financial markets.", "source": "LiveMint Money", "pub_date_str": "01 Sep 2026, 06:38 PM IST", "pub_date_relative": "25m ago"}, {"title": "US dairy Foremost Farms to close cheese plant", "full_content": "Skip to navigation Skip to main content Skip to right column US dairy Foremost Farms to close cheese plant Simon Harvey Tue, September 1, 2026 at 6:07 AM MST 3 min read US dairy cooperative Foremost Farms is planning to shut a facility just as the industry is said to be investing $13bn in production.\n\nThe business, which represents farmers in seven states, announced it will close its Marshfield cheese manufacturing site in Wisconsin in December.\n\nForemost Farms added in a statement it will also \"discontinue production of 40lb block cheese as part of a strategic realignment of its product portfolio to meet evolving market demands\".\n\nThe co-op explained: \"The decision follows a comprehensive review of changing dairy market dynamics, including increased US cheese production capacity and shifting consumer demand.\n\n\"As Foremost Farms continues to evaluate opportunities to create long-term value for its members, customers and the cooperative, the company is focusing resources on areas that best position the business for future growth and success.\"\n\nPresident and CEO Brenda Dehart said: \"The Marshfield team has consistently demonstrated dedication, professionalism and excellence. This decision was incredibly difficult and is based solely on changing market conditions and long-term needs of our cooperative.\n\n\"We are deeply grateful for the contributions our employees have made over the years and are committed to supporting them through this transition with respect, dignity and care.\"\n\nThe closure of the plant, which dates to the 1950s, will result in the loss of 68 jobs. As well as cheese, the co-op produces butter, fresh milk and dairy ingredients. It also operates other plants in Wisconsin in Appleton, Clayton, Lancaster, Reedsburg, Middleton and at Richland Center. It also runs a facility in Greenville in Michigan, according to its website.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago"}, {"title": "Fed's Barr: If inflation doesn't moderate, the central bank should raise rates", "full_content": "Skip to navigation Skip to main content Skip to right column Fed's Barr: If inflation doesn't moderate, the central bank should raise rates Jennifer Schonberger \u00b7 Senior Reporter Tue, September 1, 2026 at 6:07 AM MST 2 min read Federal Reserve governor Michael Barr said Tuesday that if inflation doesn't come down adequately, the central bank should raise interest rates.\n\nAhead of the Fed policy meeting in just over two weeks, Barr said the outlook for inflation and the economy will top the agenda.\n\n\"If trends in the data give me some confidence that inflation is moderating on a path to 2%, then I think we can take a bit more time to assess our policy stance,\" Barr said, according to prepared remarks. \"However, if inflation appears not to be moderating sufficiently, then I think we should act decisively to raise rates.\"\n\nThe Fed will get two more readings on consumer and wholesale inflation next week before the meeting on Sept. 16. Recent inflation data has been mixed, with back-to-back cooler reports on the Consumer Price Index for June and July and one stickier report on the Fed's preferred inflation gauge, the Personal Consumption Expenditures index.\n\nStill, Barr said inflation remains too high, pointing to a series of shocks \u2014 from tariffs to the conflict in the Middle East to the rapid AI build-out \u2014 that \"pushed us off course.\"\n\n\"With inflation above target for a protracted period, there is a risk of broader price pressures taking hold, a risk I am watching closely,\" he said.\n\nBarr said he views the job market as stable, with relatively low unemployment, and the economy is solid, powered in part by the boom in AI-related business investment.\n\nLast Friday, Fed Chairman Kevin Warsh put a rate hike back on the table in his closely watched speech in Jackson Hole, Wyo., hinting that current interest rates may not be high enough. \"I would be hard-pressed to describe broad financial conditions as restrictive.\"", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago"}, {"title": "Maybe the snowbirds are right? One state dominates this list of best places to retire.", "full_content": "Access to healthcare, recreation, and low taxes lure retirees, new research says", "source": "MarketWatch Top Stories", "pub_date_str": "01 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago"}, {"title": "SB Energy IPO filing: Nvidia invests $3B, OpenAI gets warrants", "full_content": "Skip to navigation Skip to main content Skip to right column SB Energy IPO filing: Nvidia invests $3B, OpenAI gets warrants Cris Tolomia Tue, September 1, 2026 at 6:06 AM MST 2 min read NVDA 9984.T SB Energy, an AI infrastructure company majority-owned by Masayoshi Son's SoftBank, filed a registration statement with the Securities and Exchange Commission on Tuesday for a proposed initial public offering on Nasdaq under the ticker symbol SBE.\n\nThe company aims to raise between $5 billion and $7 billion in the offering, according to the Wall Street Journal . The number of shares and the price range have not yet been determined. SB Energy said it will remain a controlled company under SoftBank after the listing.\n\nNvidia has committed to invest $3 billion in SB Energy as part of the offering, according to the Wall Street Journal. The $3 billion is divided between a private placement closing concurrently with the IPO and a prepaid forward contract. SB Energy also issued 4.0 million warrants to OpenAI, which will hold a board designation right for as long as its ownership stake exceeds 5% of the company's outstanding capital stock. OpenAI has received warrants estimated to be worth $5.5 billion in SB Energy.\n\nSoftBank and OpenAI are customers at three of SB Energy's data center campuses under long-term leases, with the resulting payments projected to account for a meaningful share of the company's near-term revenue, according to the IPO filing. No data center capacity is currently operational.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:36 PM IST", "pub_date_relative": "28m ago"}, {"title": "Speculative Rally Weighed on LeMaitre Vascular (LMAT)", "full_content": "Skip to navigation Skip to main content Skip to right column Speculative Rally Weighed on LeMaitre Vascular (LMAT) Soumya Eswaran Tue, September 1, 2026 at 6:06 AM MST 3 min read LMAT ^RUT Riverwater Partners, an investment management company, released its 'Small Cap Strategy' Q2 2026 investor letter. The letter can be downloaded here . The Small Cap Strategy underperformed the Russell 2000 in the second quarter as the benchmark experienced one of its strongest risk-on rallies in recent memory, although the strategy remained ahead year-to-date. The quarter was defined by accelerating AI investment, energy market disruptions, and renewed investor appetite for higher-beta stocks, creating headwinds for the firm's quality-focused approach and healthcare positioning. Despite this, stock selection contributed positively in energy, materials, and financials, while healthcare and consumer discretionary detracted due to the fund's disciplined avoidance of speculative businesses. Looking ahead, the firm remains cautiously optimistic, focusing on opportunities created by market dislocations, including AI infrastructure enablers, select consumer companies, healthcare innovators, and energy businesses trading below intrinsic value. The strategy continues to emphasize high-quality companies with strong management teams and attractive valuations, positioning the portfolio for a potential rotation away from speculative market leadership. In addition, please check the Strategy's top five holdings to know its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Riverwater Partners Small Cap Strategy highlighted LeMaitre Vascular, Inc. (NASDAQ: LMAT ). LeMaitre Vascular, Inc. (NASDAQ:LMAT) is a medical device company focusing on the manufacturing and development of products and services for vascular surgery. On August 31, 2026, LeMaitre Vascular, Inc. (NASDAQ:LMAT) closed at $80.28 per share.LeMaitre Vascular, Inc.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:36 PM IST", "pub_date_relative": "28m ago"}, {"title": "Silver Miners ETF Outperforms Gold Fund, but Carries Double Risk", "full_content": "Skip to navigation Skip to main content Skip to right column Silver Miners ETF Outperforms Gold Fund, but Carries Double Risk Sarah Sidlow, The Motley Fool Tue, September 1, 2026 at 6:06 AM MST 5 min read GC=F GS ^GSPC The Global X-Silver Miners ETF (NYSEMKT:SIL) provides leveraged-like exposure to silver through mining companies, whereas the Goldman Sachs Physical Gold ETF (NYSEMKT:AAAU) offers direct access to the spot price of physical gold.\n\nThese two funds allow investors to gain exposure to precious metals, but they do so through entirely different mechanisms. While one tracks a basket of companies that extract silver, the other reflects the value of bullion stored in vaults. Understanding these structural differences is key to managing portfolio risk.\n\nBeta measures price volatility relative to the S&P 500; beta is calculated from monthly returns over the available fund history (up to five years). The 1-yr return represents total return over the trailing 12 months. Dividend yield is the trailing-12-month distribution yield.\n\nThe Goldman Sachs Physical Gold ETF is significantly more cost-effective for long-term holders, as its expense ratio is a fraction of the cost associated with the Global X-Silver Miners ETF. Lower overhead may help preserve capital over extended periods of time.\n\nThe Goldman Sachs Physical Gold ETF endeavors to track the market price of gold by holding 100.00% physical gold. Because it is not an equity-based fund, it does not hold individual corporate stocks. This structure is intended to mirror the performance of gold bullion after accounting for the trust's expenses. The Goldman Sachs Physical Gold ETF provides an alternative to holding physical bars or coins by representing ownership of bullion held in vaults. The fund was launched in 2018.\n\nThe Global X-Silver Miners ETF tracks the Solactive Global Silver Miners Total Return Index and holds 39 holdings.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:36 PM IST", "pub_date_relative": "28m ago"}], "cfa": [{"title": "Vanguard\u2019s S&P 500 index fund changed how we invest \u2014 but there may be a smarter way to get a piece of the market", "full_content": "When everyone indexes, what is the market?", "source": "MarketWatch Top Stories", "pub_date_str": "01 Sep 2026, 07:00 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today: Dow, Nasdaq Futures Sink as Bond Selloff Intensifies \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Dow, Nasdaq Futures Sink as Bond Selloff Intensifies \u2014 Live Updates WSJ See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "01 Sep 2026, 06:55 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump says U.S. growth could hit 20%. It\u2019s happened only once since WWII", "full_content": "President Donald Trump said Monday that the U.S. economy could grow at rates as high as 20%, while arguing that even such rapid growth should not prompt the Federal Reserve to raise interest rates .\n\n\u201cWe could have a GDP of 14, 15, 16 and 20,\u201d Trump said during an Oval Office event announcing agreements aimed at lowering prescription drug prices. \u201cSuccess in growth does not cause inflation .\u201d\n\nTrump\u2019s comments came as he continues to push for lower borrowing costs even as Federal Reserve officials contend with inflation that remains above their 2% target .\n\nThe Fed held its benchmark rate steady at 3.5% to 3.75% in July, with three policymakers dissenting in favor of a quarter-point hike. Many Fed watchers expect the Federal Open Market Committee to raise rates at its next meeting in September.\n\nBut growth anywhere close to the levels Trump floated would be virtually unprecedented in the modern U.S. economy.\n\nReal gross domestic product has grown at an annualized rate of 20% or more in just one quarter in Bureau of Economic Analysis data dating to 1947. That was the third quarter of 2020, when the economy surged at a 34.9% annualized rate as businesses reopened following widespread Covid-19 shutdowns , according to BEA data. The rebound followed a 28% annualized contraction in the previous quarter.\n\nThe next-highest quarter was the first quarter of 1950, when real GDP grew at a 16.7% annualized rate as the U.S. and world emerged from World War II and the baby boom generation was born. No other quarter in the nearly eight-decade series has reached 20%.\n\nToday\u2019s economy is growing at a fraction of those rates. Real GDP increased at a 1.5% annualized rate in the second quarter of 2026, down from 2.1% in the first quarter, according to the BEA\u2019s latest estimate.", "source": "CNBC Top News", "pub_date_str": "01 Sep 2026, 06:52 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.K. Government Bond Yields Surge to Multiyear Highs", "full_content": "Skip to navigation Skip to main content Skip to right column U.K. Government Bond Yields Surge to Multiyear Highs Miriam Mukuru Tue, September 1, 2026 at 6:11 AM MST 3 min read Yields on 30-year U.K. government bonds soared to their highest level since 1998 on Tuesday, while 10-year yields hit their highest since 2008, mirroring trends in global bond yields due to rising inflation concerns.\n\nThe rise in borrowing costs exacerbated concerns about the weak state of the U.K.'s public finances.\n\nA Hedge-Fund Titan's Divorce Is Putting Wall Street's Staggering Wealth on Public View\n\nFTC Sues Amazon, Alleging It Deceived Advertisers and Drove Up Prices\n\nErnst & Young Is Giving $100 Million in Bonuses to Staff for 'Human' Skills\n\nSEC Presses Investment Firms to Prove They Have Access to Shares in Hot Startups\n\nThirty-year U.K. government-bond yields, also known as gilt yields, jumped as high as 5.904%, while the 10-year yields increased to 5.255%, LSEG data showed.\n\nThe moves came in tandem with a rise in U.S. 10-year Treasury yields, which hit their highest since January 2025, while yields on 10-year Japanese government bonds hit a 30-year high, and 10-year German government-bond yields reached their highest since 2011.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:41 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "September 2026 income tax calendar: Key TDS, TCS, advance payment and audit deadlines you should know", "full_content": "September has several important income tax compliance deadlines for taxpayers, businesses, and other entities.\n\nThe month also brings a series of 30 September deadlines, mainly related to tax audits and audit reports. Taxpayers covered by these requirements should ensure that the relevant audit reports and forms are filed on time, especially where the income tax return is due on 31 October 2026.\n\nHere are the key tax deadlines to watch out for in September 2026.\n\nTax deducted or collected during August 2026 needs to be deposited with the government by 7 September.\n\nThe final day of September has several compliance requirements, largely meant for businesses, companies, trusts, specified funds, and other taxpayers subject to audit.\n\nBy 30 September, certain eligible entities must also file prescribed audit reports under the Income Tax Act, 1961, where their ITR is due on or before 31 October.\n\nDisclaimer: This is only for informational and educational purposes. Please consult a qualified expert for the latest laws and regulations.\n\nSheetal Goel is a Content Producer at Livemint, where she covers corporate developments, personal finance, business trends, markets, and SEBI-related updates. She focuses on simplifying complex financial concepts and presenting them in a clear, reader-friendly manner, thereby helping audiences better understand investment trends, personal finance, and market developments. Her writing focuses on making finance more accessible to everyday readers while maintaining clarity, accuracy, and relevance. <br><br> She holds a degree in Economics (Hons.) along with an MBA in Finance, which has helped her develop a strong foundation in financial analysis, market understanding, and business reporting. Before joining journalism, she worked with finance and broking firms, where she closely followed market developments, investment strategies, and evolving industry trends. This practical exposure strengthened her understanding of financial markets.", "source": "LiveMint Money", "pub_date_str": "01 Sep 2026, 06:38 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US dairy Foremost Farms to close cheese plant", "full_content": "Skip to navigation Skip to main content Skip to right column US dairy Foremost Farms to close cheese plant Simon Harvey Tue, September 1, 2026 at 6:07 AM MST 3 min read US dairy cooperative Foremost Farms is planning to shut a facility just as the industry is said to be investing $13bn in production.\n\nThe business, which represents farmers in seven states, announced it will close its Marshfield cheese manufacturing site in Wisconsin in December.\n\nForemost Farms added in a statement it will also \"discontinue production of 40lb block cheese as part of a strategic realignment of its product portfolio to meet evolving market demands\".\n\nThe co-op explained: \"The decision follows a comprehensive review of changing dairy market dynamics, including increased US cheese production capacity and shifting consumer demand.\n\n\"As Foremost Farms continues to evaluate opportunities to create long-term value for its members, customers and the cooperative, the company is focusing resources on areas that best position the business for future growth and success.\"\n\nPresident and CEO Brenda Dehart said: \"The Marshfield team has consistently demonstrated dedication, professionalism and excellence. This decision was incredibly difficult and is based solely on changing market conditions and long-term needs of our cooperative.\n\n\"We are deeply grateful for the contributions our employees have made over the years and are committed to supporting them through this transition with respect, dignity and care.\"\n\nThe closure of the plant, which dates to the 1950s, will result in the loss of 68 jobs. As well as cheese, the co-op produces butter, fresh milk and dairy ingredients. It also operates other plants in Wisconsin in Appleton, Clayton, Lancaster, Reedsburg, Middleton and at Richland Center. It also runs a facility in Greenville in Michigan, according to its website.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed's Barr: If inflation doesn't moderate, the central bank should raise rates", "full_content": "Skip to navigation Skip to main content Skip to right column Fed's Barr: If inflation doesn't moderate, the central bank should raise rates Jennifer Schonberger \u00b7 Senior Reporter Tue, September 1, 2026 at 6:07 AM MST 2 min read Federal Reserve governor Michael Barr said Tuesday that if inflation doesn't come down adequately, the central bank should raise interest rates.\n\nAhead of the Fed policy meeting in just over two weeks, Barr said the outlook for inflation and the economy will top the agenda.\n\n\"If trends in the data give me some confidence that inflation is moderating on a path to 2%, then I think we can take a bit more time to assess our policy stance,\" Barr said, according to prepared remarks. \"However, if inflation appears not to be moderating sufficiently, then I think we should act decisively to raise rates.\"\n\nThe Fed will get two more readings on consumer and wholesale inflation next week before the meeting on Sept. 16. Recent inflation data has been mixed, with back-to-back cooler reports on the Consumer Price Index for June and July and one stickier report on the Fed's preferred inflation gauge, the Personal Consumption Expenditures index.\n\nStill, Barr said inflation remains too high, pointing to a series of shocks \u2014 from tariffs to the conflict in the Middle East to the rapid AI build-out \u2014 that \"pushed us off course.\"\n\n\"With inflation above target for a protracted period, there is a risk of broader price pressures taking hold, a risk I am watching closely,\" he said.\n\nBarr said he views the job market as stable, with relatively low unemployment, and the economy is solid, powered in part by the boom in AI-related business investment.\n\nLast Friday, Fed Chairman Kevin Warsh put a rate hike back on the table in his closely watched speech in Jackson Hole, Wyo., hinting that current interest rates may not be high enough. \"I would be hard-pressed to describe broad financial conditions as restrictive.\"", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:37 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SB Energy IPO filing: Nvidia invests $3B, OpenAI gets warrants", "full_content": "Skip to navigation Skip to main content Skip to right column SB Energy IPO filing: Nvidia invests $3B, OpenAI gets warrants Cris Tolomia Tue, September 1, 2026 at 6:06 AM MST 2 min read NVDA 9984.T SB Energy, an AI infrastructure company majority-owned by Masayoshi Son's SoftBank, filed a registration statement with the Securities and Exchange Commission on Tuesday for a proposed initial public offering on Nasdaq under the ticker symbol SBE.\n\nThe company aims to raise between $5 billion and $7 billion in the offering, according to the Wall Street Journal . The number of shares and the price range have not yet been determined. SB Energy said it will remain a controlled company under SoftBank after the listing.\n\nNvidia has committed to invest $3 billion in SB Energy as part of the offering, according to the Wall Street Journal. The $3 billion is divided between a private placement closing co he other reflects the value of bullion stored in vaults. Understanding these structural differences is key to managing portfolio risk.\n\nBeta measures price volatility relative to the S&P 500; beta is calculated from monthly returns over the available fund history (up to five years). The 1-yr return represents total return over the trailing 12 months. Dividend yield is the trailing-12-month distribution yield.\n\nThe Goldman Sachs Physical Gold ETF is significantly more cost-effective for long-term holders, as its expense ratio is a fraction of the cost associated with the Global X-Silver Miners ETF. Lower overhead may help preserve capital over extended periods of time.\n\nThe Goldman Sachs Physical Gold ETF endeavors to track the market price of gold by holding 100.00% physical gold. Because it is not an equity-based fund, it does not hold individual corporate stocks. This structure is intended to mirror the performance of gold bullion after accounting for the trust's expenses. The Goldman Sachs Physical Gold ETF provides an alternative to holding physical bars or coins by representing ownership of bullion held in vaults. The fund was launched in 2018.\n\nThe Global X-Silver Miners ETF tracks the Solactive Global Silver Miners Total Return Index and holds 39 holdings.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:36 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Procter & Gamble\u2019s Quieter Dividend Outpaces Johnson & Johnson\u2019s Growth Story", "full_content": "Skip to navigation Skip to main content Skip to right column Why Procter & Gamble\u2019s Quieter Dividend Outpaces Johnson & Johnson\u2019s Growth Story Trey Thoelcke Tue, September 1, 2026 at 6:05 AM MST 4 min read JNJ PG NVDA Quick Read J&J's forward annualized dividend of $5.36 tops P&G's $4.354, but a planned mid-2027 DePuy Synthes spinoff puts its long streak at risk.\n\nP&G CEO Shailesh Jejurikar committed $10 billion in dividends and $5 billion in buybacks for fiscal 2027, shielded by $2.8 billion in productivity savings.\n\nJ&J's stock surged 28.5% YTD versus P&G's 1.3% gain, driven by pipeline strength across 28 billion-dollar platforms, not payout policy.\n\nAct now: the analyst who called NVIDIA in 2010 just named his top 10 AI stocks \u2014 and Johnson & Johnson didn't make the cut. Grab the names FREE today .\n\nJohnson & Johnson ( NYSE:JNJ ) and Procter & Gamble ( NYSE:PG ) both recently refreshed their long dividend records. J&J posted Q1 2026 revenue of $24.06 billion and P&G closed fiscal 2026 with core EPS of $6.89. One is heading into a spinoff while the other stays intact, and that structural difference defines the comparison.\n\nJ&J lifted its quarterly dividend to $1.34 per share, with an ex-date of August 25, 2026, and a September 8 payment. The trailing 12-month total is $5.28, with the forward annualized total at $5.36. Growth is doing the heavy lifting: Darzalex at $4.21 billion (+22.5%) and Tremfya at $2.05 billion (+68.3%) more than offset Stelara's revenue erosion of 55.7%.\n\nP&G paid $1.0885 per share on August 17, 2026, with forward annualized of $4.354. Fiscal 2026 organic sales grew more than 1%, and management returned over $15 billion to shareowners, including more than $10 billion in dividends. Growth, not coverage, is the concern.\n\nAct now: the analyst who called NVIDIA in 2010 just named his top 10 AI stocks \u2014 and Johnson & Johnson didn't make the cut. Grab the names FREE today .", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:35 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed Governor Barr says he'll support rate hike if inflation doesn't ease", "full_content": "Federal Reserve Governor Michael Barr said Tuesday he would be prepared to support an interest rate hike if inflation doesn't ease.\n\nSpeaking at a banking forum in Washington, the policymaker said he's concerned about \"broader price pressures taking hold\" as inflation has remained stuck above the Fed's 2% target for nearly 5\u00bd years.\n\n\"If trends in the data give me some confidence that inflation is moderating on a path to 2%, then I think we can take a bit more time to assess our policy stance,\" Barr said in prepared remarks. \"However, if inflation appears not to be moderating sufficiently, then I think we should act decisively to raise rates.\"\n\nThe comments come at a critical time for policy and the broader backdrop of elevated inflation and rising Treasury yields . As a governor, Barr is a permanent voting member on the rate-setting Federal Open Market Committee.\n\nAmid fresh worries over the precarious Middle East situation, yields jumped again Tuesday, with the benchmark 10-year note at a level not seen since mid-January 2025.\n\nAt the same time, Fed Chairman Kevin Warsh last week delivered remarks that markets widely interpreted as titled toward a rate hike, possibly as soon as the next policy meeting in two weeks. Barr supported the July decision to keep the benchmark funds rate targeted between 3.5%-3.75%, but markets Tuesday morning were pricing in about a 66% chance of an increase this month, according to the CME Group's FedWatch .\n\nBarr gave the economy good marks even with elevated inflation.\n\n\"Consumer spending to date has been largely resilient,\" he said. \"But inflation remains too high \u2014 and has been for over five years,\" he said.", "source": "CNBC Finance", "pub_date_str": "01 Sep 2026, 06:35 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "As U.S. bond prices tumble, yields are jumping from Japan to the U.K. and beyond", "full_content": "The old adage that the rest of the world sneezes when the U.S. catches a cold very much applies to bonds as well.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Sep 2026, 06:35 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Here\u2019s What Pressured Atmus Filtration Technologies (ATMU) in Q2", "full_content": "Skip to navigation Skip to main content Skip to right column Here\u2019s What Pressured Atmus Filtration Technologies (ATMU) in Q2 Soumya Eswaran Tue, September 1, 2026 at 6:04 AM MST 3 min read ATMU ^RUT Riverwater Partners, an investment management company, released its 'Small Cap Strategy' Q2 2026 investor letter. The letter can be downloaded here . The Small Cap Strategy underperformed the Russell 2000 in the second quarter as the benchmark experienced one of its strongest risk-on rallies in recent memory, although the strategy remained ahead year-to-date. The quarter was defined by accelerating AI investment, energy market disruptions, and renewed investor appetite for higher-beta stocks, creating headwinds for the firm's quality-focused approach and healthcare positioning. Despite this, stock selection contributed positively in energy, materials, and financials, while healthcare and consumer discretionary detracted due to the fund's disciplined avoidance of speculative businesses. Looking ahead, the firm remains cautiously optimistic, focusing on opportunities created by market dislocations, including AI infrastructure enablers, select consumer companies, healthcare innovators, and energy businesses trading below intrinsic value. The strategy continues to emphasize high-quality companies with strong management teams and attractive valuations, positioning the portfolio for a potential rotation away from speculative market leadership. In addition, please check the Strategy's top five holdings to know its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Riverwater Partners Small Cap Strategy highlighted Atmus Filtration Technologies Inc. (NYSE: ATMU ). Atmus Filtration Technologies Inc. (NYSE:ATMU), a US-based filtration products manufacturer, known for its Fleetguard brand, detracted from the strategy's performance this quarter. On August 31, 2026, Atmus Filtration Technologies Inc. (NYSE:ATMU) closed at $47.23 per share. Filtration Technologies Inc.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:34 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Cathie Wood's Ark Just Bought $7.6 Million of Nuclear Supplier BWX Technologies While Continuing to Dump Roblox Stock. Is Nuclear Power Ark's Next Big AI-Adjacent Bet?", "full_content": "Skip to navigation Skip to main content Skip to right column Cathie Wood's Ark Just Bought $7.6 Million of Nuclear Supplier BWX Technologies While Continuing to Dump Roblox Stock. Is Nuclear Power Ark's Next Big AI-Adjacent Bet? Keith Noonan, The Motley Fool Tue, September 1, 2026 at 6:02 AM MST 4 min read BWXT RBLX CEO Cathie Wood's Ark Invest firm is known for its focus on potentially revolutionary technologies. The firm manages multiple exchange-traded funds ( ETFs ) and publishes updates regularly when it makes trades. Wood's status as a high-profile growth investor and the easily trackable nature of the portfolio holdings of her company's ETFs mean that some investors pay close attention to trades made by Ark's investment teams.\n\nNews that Wood and her team have bought or sold a stock can even have a meaningful impact on a company's near-term valuation momentum and attract investor attention to plays surrounding longer-term trends. Ark's move to purchase roughly $7.6 million shares of BWX Technologies (NYSE: BWXT) across three of its funds on Aug. 20 generated new interest for the company as a nuclear power provider that could be poised to benefit from artificial intelligence tailwinds. Notably, Ark also sold roughly $6.5 million worth of Roblox stock the same day -- potentially reflecting a broader strategic reorientation by the firm.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nRunning high-performance AI data centers is enormously energy-intensive, and the national build-out of data center infrastructure likely remains in its infancy.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:32 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fed Chair Kevin Warsh Pushed September Rate Hike Odds Past 50%. But 1 Investor Says the Market Has It Wrong", "full_content": "Skip to navigation Skip to main content Skip to right column Fed Chair Kevin Warsh Pushed September Rate Hike Odds Past 50%. But 1 Investor Says the Market Has It Wrong Joel South Tue, September 1, 2026 at 6:00 AM MST 2 min read NVDA Quick Read NVDA guided Q3 revenue to $108B and is up 22% year to date, the highest-beta play if Warsh holds rates steady September 16.\n\nBill called the market's 55% September rate hike odds \"offsides,\" arguing Warsh softens once August CPI and PPI data roll in.\n\nDespite the 10-year yield climbing to 4.66%, the S&P 500 is up 13% year to date with corporate earnings absorbing rate pressure.\n\nDon't wait: the analyst who called NVIDIA in 2010 just revealed his top 10 AI stocks. See the full list FREE now .\n\nThree weeks before the Sept. 16 FOMC meeting, the bond market has flipped hawkish. Market-implied odds of a September rate hike jumped to roughly 55% after Kevin Warsh's Jackson Hole debut as Fed chair, up from about 40% a week earlier, even though the Fed's last move was a cut on Dec. 10, 2025 and the target has been pinned at 3.75% ever since.\n\nHis line that \"it's hard to say that Fed policy is restrictive when you look at the economy right now\" was read on CNBC as a straight hike signal. Former Fed Vice Chair Roger Ferguson said on August 28 that he expects two rate hikes and warned that standing pat would cost the Fed credibility.\n\nThe contrarian: CNBC Investment Committee member Bill called the 55% probability \"offsides,\" arguing Warsh softens once data clears.\n\nThe 10-year Treasury yield hit 4.66% on August 26, up from 4.19% in January, yet the S&P 500 tracking ETF is still up about 13% year to date. The earnings counterweight: NVIDIA ( NASDAQ:NVDA ) just posted $96.22 billion in Q2 revenue and guided Q3 to $108.0 billion, with $279 billion in supply commitments locked in.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:30 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "How one of the largest investors in student housing is playing this school year", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nStudents are heading back to school across the nation and leasing student housing at a faster clip than they were last year.\n\nFor investors, that creates new opportunities, but one leader in the field cautions that the differences in market fundamentals are widening across universities and regional markets.\n\nOn a national level, pre-leasing across the Yardi 200 \u2014 a curated set of the most important student housing markets, representing 90% of the institutional space \u2014 reached 89.1% in July ahead of fall move-ins. That is up from 88.1% in July 2025 but still below August 2025 levels of 89.9%.\n\nAccording to Yardi, 117 of the 200 markets surveyed in July were at or above their year-earlier pre-leasing levels, but there was significant variation across different markets.\n\n\"New supply is increasingly concentrated in large markets, dragging down performance at schools with the most beds and weighing more heavily on national metrics,\" wrote Tyson Huebner, director of research at Yardi Matrix, in the report.\n\nHarrison Street Asset Management is one of the largest investors and developers in the sector, with more than $24 billion allocated across 432 student housing properties since its launch in 2005. Its investments total more than 238,000 beds across 200 university markets in North America and Europe.\n\n\"Our conviction in student housing is really high, but our conviction in every student housing market is not,\" said Mike Gordon, global chief investment officer for real estate at Harrison Street. \"Frankly, I think that creates a really interesting investment environment.\"", "source": "CNBC Top News", "pub_date_str": "01 Sep 2026, 06:30 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Warby Parker (WRBY) Faces a Reality Check After an Underwhelming Glasses Launch", "full_content": "Skip to navigation Skip to main content Skip to right column Warby Parker (WRBY) Faces a Reality Check After an Underwhelming Glasses Launch Soumya Eswaran Tue, September 1, 2026 at 5:59 AM MST 3 min read WRBY Riverwater Partners, an investment management company, released its 'Small Cap Strategy' Q2 2026 investor letter. The letter can be downloaded here . The Small Cap Strategy underperformed the Russell 2000 in the second quarter as the benchmark experienced one of its strongest risk-on rallies in recent memory, although the strategy remained ahead year-to-date. The quarter was defined by accelerating AI investment, energy market disruptions, and renewed investor appetite for higher-beta stocks, creating headwinds for the firm's quality-focused approach and healthcare positioning. Despite this, stock selection contributed positively in energy, materials, and financials, while healthcare and consumer discretionary detracted due to the fund's disciplined avoidance of speculative businesses. Looking ahead, the firm remains cautiously optimistic, focusing on opportunities created by market dislocations, including AI infrastructure enablers, select consumer companies, healthcare innovators, and energy businesses trading below intrinsic value. The strategy continues to emphasize high-quality companies with strong management teams and attractive valuations, positioning the portfolio for a potential rotation away from speculative market leadership. In addition, please check the Strategy's top five holdings to know its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Riverwater Partners Small Cap Strategy highlighted Warby Parker Inc. (NYSE: WRBY ). The Fund exited its position in Warby Parker Inc. (NYSE:WRBY), a leading eyewear brand and retailer that offers eyeglasses and sunglasses, and contact lenses, during the quarter. On August 31, 2026, Warby Parker Inc. (NYSE:WRBY) closed at $24.60 per share. Warby Parker Inc.", "source": "Yahoo Finance", "pub_date_str": "01 Sep 2026, 06:29 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Tuesday", "full_content": "Robinhood lands an upgrades. And is there a path for rates to go lower?", "source": "CNBC Top News", "pub_date_str": "01 Sep 2026, 06:29 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Suddenly Wall Street is getting a bit nervous. Here are two ways to prepare for turbulence.", "full_content": "Strategists at Citadel Securities and JPMorgan both said they have turned temporarily cautious, though neither is saying the bull market is over.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Sep 2026, 06:23 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "01 Sep 2026, 07:04 PM IST", "total_stories": 374};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
