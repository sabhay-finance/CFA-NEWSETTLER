evenue of $336.6 million, a loss of $3.31 per share and an adjusted EBITDA loss of $717.7 million.\n\nThe quarterly results are the first since Lucid CEO Silvio Napoli , who started leading the company in June, announced a restructuring plan that included implementing several cost-cutting efforts and delaying the company's upcoming midsize vehicle from the end of this year until the second half of next.\n\n\"Our transformation is beginning to show progress. We are acting with urgency, strengthening the fundamentals and driving greater discipline, while continuing to invest in the priorities to deliver profitable long-term growth,\" Napoli said in a release.\n\nThe company's turnaround plan includes $1.4 billion in cash flow improvements this year as well as focusing attention on a robotaxi program with Uber and Nuro, a factory that's under construction in Saudi Arabia and the midsize vehicle.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dow surges 1,100 points, Nasdaq climbs more than 2% as tech rebounds from last week\u2019s tumult: Live updates", "full_content": "Stocks surged on Monday, boosted by a decline in oil prices as well as gains in technology shares after last week's volatility.\n\nThe Dow Jones Industrial Average popped 1,104.02 points, or 2.15%, to close at 52,389.75. The blue-chip index was supported by gains in stocks such as Goldman Sachs and Caterpillar . The S&P 500 rose 2.35% to end at 7,549.94 for its best day since April 8, while the Nasdaq Composite gained 2.74% to 25,253.14.\n\nWith Monday's rally, the Dow is now above the level it closed on Election Day. The S&P 500 and tech-heavy Nasdaq still remain slightly below, however.\n\nOil prices fell on Monday, lifting investor sentiment. U.S. West Texas Intermediate futures dropped 4.38% to settle at $86.85 per barrel. International benchmark Brent slid 5.85% to $92.57 per barrel.\n\nFriday's market partially rebounded from Thursday's brutal artificial intelligence-driven sell-off, as chip stocks recovered on renewed buying. However, concerns linger in the wake of the Democrats' strong midterm results, with investors fearing that tighter regulations on data center construction, energy use, and development costs could slow the AI infrastructure boom .\n\nThe tech sector also focused on the bombshell announcement Sunday that Nvidia's board of directors is opening an investigation into co-founder and CEO Jensen Huang's relationship with a businesswoman who U.S. intelligence agencies say is a Chinese spy. Nvidia shares closed down 4%.\n\n\"Magnificent Seven\" names were higher contrary to Nvidia. Amazon gained about 3%, while Tesla and Alphabet climbed 5.5% and 1%, respectively. Microsoft also added almost 3%.\n\nOther chip stocks advanced as well, with Broadcom popping nearly 9% and Advanced Micro Devices jumping 13%. The iShares Semiconductor ETF (SOXX) \u2014 which dropped around 13% last week \u2014 rose more than 7%.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia shares fall as it probes alleged Chinese spy scandal", "full_content": "Board of chipmaker opens investigation after chief executive Jensen Huang admits to affair", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 02:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Tokenization platform Securitize gains 10% postmarket on Q3 results, move into asset-backed finance", "full_content": "Tokenization platform Securitize climbed about 10% postmarket after reporting third quarter growth alongside increased operating expenses, and announcing an expansion into asset-backed finance through a strategic acquisition.\n\nMiami-based Securitize, which made its public market debut in July, operates in the relatively new corner of the crypto equity universe involved in institutional tokenization infrastructure. Tokenized assets on the platform grew 9% in the third quarter, to $4.8 billion, from the same period a year ago. Aggregate transaction volume rose 20% from a year ago, to $4.3 billion. Revenue of $11.5 million was up 28% from last year.\n\nThe growth came as bullish sentiment around tokenization gained traction throughout the third quarter, ahead of the Security and Exchange Commission formalizing the long awaited Innovation Exemption on Sept. 17, which created a temporary pathway for trading of certain tokenized stocks and strengthened the regulatory outlook.\n\nProfitability is still meaningfully below year-ago levels, due in part to costs associated with going public over the summer, as well as the scaling up of the tokenization business at an active time for the entire sector, Securitize CEO Carlos Domingo told CNBC in an exclusive interview.\n\nSecuritize reinforced \"certain areas of the company like finance, compliance, legal [and] cybersecurity,\" which increased corporate costs \"compared to a year ago when we were privately held,\" Domingo said. \"We're in in a very good position. The adjusted EBITDA \u2026 is improving significantly from previous quarters.\"\n\nSecuritize reported an adjusted EBITDA loss of $2 million, compared with positive adjusted EBITDA of $3.6 million a year ago, better than a $5.5 million loss in the second quarter.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 02:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The stock-market rally keeps spreading beyond Big Tech. October inflation data could put it to the test.", "full_content": "Tuesday\u2019s CPI inflation report and a heavy lineup of Federal Reserve speakers could test the rotation trade\u2019s resilience", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 02:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Top Yen Forecaster Predicts 147 Per Dollar as Rate Gap Narrows", "full_content": "(Bloomberg) -- Neil Parker has spent nearly three decades tracking the yen, through financial crises and sharp currency swings. Now, the top dollar-yen forecaster in Bloomberg\u2019s latest rankings sees the Japanese currency rallying toward 147 per dollar next year as Japan\u2019s interest-rate gap with the US narrows.\n\nHis call puts him at the bullish end of a deeply divided market. While Parker sees the yen strengthening to around 155 by year-end before appreciating further, Bloomberg\u2019s top forecaster in the previous quarter sees it weakening as far as 170 next year.\n\nAt the heart of the divergence is Japan\u2019s interest-rate outlook. Parker expects the Bank of Japan to raise its benchmark rate from 1.25% to at least 2%, potentially 2.25%, a more aggressive outlook for tightening than much of the market expects. The Federal Reserve, meanwhile, may raise interest rates once more in December before stopping at around the 4.00-4.25% range, according to Parker.\n\n\u201cJapan may prove to be an outlier in terms of the Bank of Japan actually delivering on its promise to bring interest rates into line with where inflation is,\u201d said Parker, head of economics and market strategy at foreign-exchange and payments firm TTT Moneycorp Limited.\n\nJapanese market participants are divided over whether stronger inflation prompts faster tightening by the central bank. Japan\u2019s consumer price index excluding fresh food and energy, a metric closely monitored by the BOJ as a gauge of underlying inflation, advanced 2.4% in September. Parker said that a pickup to 2.6% or higher could prompt a stronger central bank response and speed the path for tightening. He also isn\u2019t convinced the central bank will move as soon as December.\n\nThat difference in the pace of tightening underpins his yen forecast.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 02:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia's China revenue exposure: What New Street estimates", "full_content": "Nvidia is central to the AI buildout and a significant portion of sales come from China despite export controls.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia stock falls 4% as scrutiny turns to Jensen Huang\u2019s affair with alleged Chinese spy", "full_content": "Nvidia stock closed 4.27% lower on Monday after the tech giant launched an investigation into CEO Jensen Huang's relationship with a businesswoman who intelligence agencies say is a Chinese spy.\n\nU.S. intelligence agencies said Alice Huang, an executive at cloud company Megaspeed, has been passing information to Beijing, according to reports in The New York Times and the Financial Times .\n\nNvidia said its board has launched an independent investigation following the reports that Huang was the target of a \"foreign intelligence effort.\"\n\nHuang \"fully supports the review and has committed to cooperating with it,\" the company said in a Sunday statement .\n\nThe co-founder and CEO told staff in an email that he had \"fallen short\" of his responsibility to serve his colleagues, the board, partners and shareholders around the world.\n\n\"I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry,\" Huang said in the email.\n\nChina's Foreign Ministry spokesperson, Guo Jiakun, said Monday that the \"so-called Chinese spy narrative\" was unsubstantiated, Reuters reported.\n\nNvidia shares year-to-date. Nvidia leadership under scrutiny The probe has sparked questions about Huang's future as CEO of the company.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 02:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "A key report for where inflation stood in October comes out Tuesday. Here's what to expect", "full_content": "Falling gasoline prices provided some relief to consumers in October, but Federal Reserve officials are increasingly concerned that inflation pressures elsewhere in the economy are proving harder to contain.\n\nPrices at the pump declined by more than 4%, according to the Energy Information Administration, providing a respite from a surge that had added more than a dollar a gallon over the past year.\n\nHowever, the consumer price index for the month, which the Bureau of Labor Statistics will release Tuesday at 8:30 a.m., is expected to show only a slight let-up.\n\nMeanwhile, Fed officials say they are worried that inflation initially driven higher by President Donald Trump 's tariffs and the Iran war is proving more persistent than expected, with price pressures emerging in sectors beyond those directly affected by the shocks.\n\nAt a time when the central bank is increasingly confident about the state of the labor market, concerns over the cost of living are what are top of mind for the Fed.\n\n\"We've been moving up to what historically we'd consider full employment, and the big problem has all been on the inflation side. We go around, we talk to people everywhere in this district, all we hear about is affordability on the business side, the cost,\" Chicago Fed President Austan Goolsbee said Monday during an event in his home district. \"So we've got to come to terms with this cost-side and inflation-side failure.\"\n\nThe CPI reading for all items is expected to show an increase of 0.3%. Core inflation, which excludes volatile food and energy costs, is forecast to increase 0.2%, according to the Dow Jones consensus forecast. While both would be slower than the respective September monthly gains of 0.6% and 0.3%, they still represent further price pressures.\n\nThere will be no annual reading for October because of the government shutdown a year ago, which prevented the BLS from collecting some data and compiling a full index level.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Children\u2019s Place files for bankruptcy protection, seeks buyer", "full_content": "Children's clothing retailer The Children's Place has filed for chapter 11 bankruptcy protection, it said Sunday.\n\nThe company is looking to sell substantially all of its assets and is seeking offers from potential buyers by Dec. 9, with a goal to close a deal by the end of December.\n\nThe retailer, whose brands include The Children's Place and Gymboree, says it operates two digital storefronts and 514 North American stores, and has distribution in 13 countries through franchise and wholesale partners. The company's performance has taken a hit in recent years from tariff hikes and slower consumer spending, among other factors.\n\nIts stores and e-commerce sites remain open for now, and the company is planning to continue its ongoing inventory sales with court approval.\n\n\"For nearly 60 years, The Children's Place has supported growing families with apparel that customers have come to know and love. We recognize the significance of this development for our employees, customers, vendors, and other partners, and we are committed to conducting an efficient and transparent sale process,\" said Rudy Morando, co-chief restructuring officer of The Children's Place. \"In the meantime, we remain focused on serving the families who have trusted The Children's Place for generations.\"\n\nThis move comes days after interim Children's Place CEO Muhammad Asif Seemab and Chief Strategy Officer Muhammad Umair stepped down from their roles . Seemab and Umair will both remain on the company's board. CFO John Szczepanski took on the role of acting president and principal executive officer.\n\nSeemab is also managing director of Saudi-based Mithaq Capital, which took a majority stake in The Children's Place in 2024 when the company was facing financial trouble.\n\nEven with support from the investors, the company has not been able to significantly improve its financial outlook. In its bankruptcy filing , the company reported about $742 million in assets, compared to about $881 million in debts.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PepsiCo to cut about 1,000 jobs as North American business struggles", "full_content": "PepsiCo is cutting about 1,000 jobs across North America as the company tries to turn around lagging sales in its home market.\n\n\"We have a clear ambition for PepsiCo North America: to build a stronger, more future-fit business that delivers industry-leading growth,\" Ram Krishnan, CEO of PepsiCo North America, wrote in a Monday letter to employees obtained by CNBC. \"To do that, we need to be faster, more connected, and more capable, while continuing to invest in growth \u2013 behind our people, capabilities and brands.\"\n\nOver the next week, Pepsi plans to cut jobs as it says it aims to streamline its operations and better connect teams across the company's North American business. PepsiCo employs about 306,000 people worldwide, including roughly 125,000 in the United States, as of Dec. 27, according to a company filing.\n\nIn October, PepsiCo cut its full-year earnings outlook, citing the struggles in its home market. During the third quarter, its North American beverage unit saw volume shrink 2%, while its North American food division reported flat volume.\n\nWhile the company has tried to boost sales by cutting prices and investing in marketing, the turnaround is taking longer than expected, CFO Steve Schmitt said on the company's earnings conference call.\n\nShares of Pepsi rose slightly in afternoon trading. The stock is down nearly 1% this year, lagging behind the S&P 500 's gains of nearly 11% over the same period.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:11 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Viking Loses 1.2% in October After Eschewing Many Big AI Bets", "full_content": "(Bloomberg) -- Viking Global Investors\u2019 flagship hedge fund dropped 1.2% last month, faring better than many of its rivals after largely avoiding high-flying artificial-intelligence stocks.\n\nThe loss pared gains for the long-short equity fund this year to about 1%, according to people familiar with the matter, who asked not to be identified because the returns aren\u2019t public.\n\nViking co-founder Andreas Halvorsen has taken a contrarian position on AI, generally staying away from big bets on the technology because it views some companies as overvalued.\n\n\u201cAgainst the current market backdrop, we continue to exercise caution when buying stocks at valuations that, considering our forecast of revenue and earnings, offer little margin of safety,\u201d Halvorsen said in a letter to clients in July.\n\nThe hedge fund, which manages about $35 billion, sat out tech rallies in 2020 and 2021 and avoided the double-digit losses that hit rivals. While its caution didn\u2019t entirely protect Viking from October losses, many other firms lost more money in a month rocked by a broad tech selloff and geopolitical upheaval.\n\nTechnology stocks made up just 7.5% of Viking\u2019s bullish bets as of June 30, according to a regulatory filing. Still, chip giant Taiwan Semiconductor Manufacturing Co., a key player in the AI buildout, was its second-biggest long bet. AI hyperscaler Meta Platforms Inc. was its sixth-largest.\n\nBut Viking was less exposed to tech than several other so-called Tiger Cubs, firms that were also founded by alumni of Julian Robertson\u2019s Tiger Management.\n\nCoatue Management and Tiger Global Management, for example, dedicated well over 40% of their long books to tech stocks as of June 30. Lone Pine Capital, which erased a 44% gain it had through June, allocated more than 38% to tech.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 02:03 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil down more than $7 a barrel in post settlement trade as Trump signals restraint on Iran", "full_content": "LONDON, - Brent crude futures continued tumbling after settlement on Monday to lose more than $7 a barrel, hitting their lowest since late August, after US President Donald Trump downplayed the likelihood of renewed strikes on Iran.\n\nBrent crude futures settled down $5.75, or 5.85%, at $92.57 a barrel. Prices continued falling after settlement, and were last down more than $7 a barrel.\n\nUS West Texas Intermediate futures settled down $3.98, or 4.38%, to $86.85. US crude futures also continued falling, last down more than $5 in post-settlement trade.\n\nThe Brent benchmark plunged by 16% last week, its steepest weekly drop since the start of the COVID-19 pandemic.\n\nOn Sunday, Trump said he was highly unlikely to order fresh attacks on Iran as long as talks to end the conflict progressed. Still, both countries reported that shipping had been hit in or near the Strait of Hormuz.\n\n\"This seems to have encouraged sellers on the prospects for peace even while the actual fighting is not slowing down,\" TACenergy analysts said in a note.\n\nLast week, Trump had hinted at a resumption of attacks on Iran and Tehran vowed to respond by striking US and Israeli targets. But there has been no sign of a large-scale US military operation.\n\nA senior Iranian security official told the country's state media that Tehran has no plans to negotiate unless Washington takes practical steps to meet seven conditions set out in a June interim agreement.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:33 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Trump administration proposes stricter work-search rules for unemployment benefits", "full_content": "The Labor Department proposed a rule on Monday that would raise the bar for people applying for unemployment insurance by requiring them to prove they've conducted five work-search activities per week in order to qualify for benefits.\n\nIn the announcement, the Trump administration described the proposal as a way to improve the \"integrity and accountability\" of the joint federal-state unemployment insurance system. Consumer advocates said the proposed work-search baseline of five qualifying activities per week exceeded that in most states and would make it more difficult for many applicants to qualify for assistance.\n\nThere is currently no uniform requirement across the U.S. for unemployment insurance claimants regarding work-search requirements.\n\nFederal law requires all states to have a work-search requirement, but states have broad discretion to set their own eligibility. They also have ample leeway to set other parameters such as the weekly sum claimants can receive and the number of weeks they can get those funds.\n\nA qualifying work search activity might be applying to a job, creating a profile on a job-search website or attending a networking event, for example, depending on the state.\n\nCurrently, only four states require a minimum of five work searches per week, Michele Evermore, the senior director of economic security and worker transitions at the National Employment Law Project, wrote in an email.\n\nThe Labor Department proposal would require individuals claiming unemployment insurance to complete and report at least five qualifying work-search activities each week before payment is issued, according to a press release announcing the rule.\n\n\"This proposed rule helps jobseekers find work faster and ensures efficient use of taxpayer resources while improving the overall integrity of our unemployment system,\" Labor Secretary Keith Sonderling said in the release.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:29 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Millions of dollars poured into prediction markets on election night, trading on Democratic control of Congress and Texas governor's race", "full_content": "More than 87% of all election markets across Kalshi and Polymarket gave the right candidate at least a 90% chance of winning their race 24 hours before election night, a CNBC analysis found.\n\nElection night showed how traders reacted to real-time midterm results, as trading activity surged and market prices shifted to Democrats after results from Indiana began rolling in before 7 p.m. on Nov. 3. Many midterm races were uncompetitive, which boosted the overall hit rate on prediction markets.\n\n\"I'd say prediction markets did pretty well,\" said Koleman Strumpf, a professor of economics at Wake Forest University. \"But they didn't outperform the best,\" he added, referring to traditional forecast polls that tracked results that night.\n\nOdds and gambling platforms do not use methodologies used by traditional political polling, and therefore are not substitutes for political polls.\n\nAfter 8 p.m. on Nov. 3, at least $1 million was traded on a Kalshi market that incumbent Gov. Greg Abbott would be reelected. Abbott eventually lost to Democrat Gina Hinojosa by more than 700,000 votes, according to the Associated Press. A little after 11 p.m. on election night, more than $1.4 million was traded on Kalshi that Republicans would not secure control of the House of Representatives.\n\nFollowing the midterms, both Polymarket CEO Shayne Coplan and Kalshi CEO Tarek Mansour were on the social media platform X crediting prediction markets for correctly predicting races. Nate Silver, a political forecaster and founder of the Silver Bulletin newsletter, disputed the claim, arguing forecast models influenced prediction market movement. Silver joined Polymarket as an advisor in 2024.\n\n\"Prediction market probabilities strongly converged toward [our models] in individual Senate and gubernatorial races,\" Silver wrote on Silver Bulletin .", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:11 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Elizabeth Warren set to take over the Senate banking committee. Here's what she plans to do", "full_content": "Sen. Elizabeth Warren is set to take over the Senate Banking Committee . The Massachusetts Democrat is already charting the panel's course.\n\nAmong Warren's top issues for the Congress that convenes in January are addressing the cost of living, tightening export controls on advanced artificial intelligence chips to China and promulgating regulations for prediction markets, according to a Warren banking committee aide. The aide spoke on condition of anonymity to discuss the yet-to-be-announced agenda. Warren is also plotting an aggressive oversight agenda and urged tech CEOs, administration officials and Wall Street executives to preserve their documents, the aide said.\n\nDemocrats' dominant win in last week's midterm elections hands them control of committee gavels on Capitol Hill. With that comes the ability to set the legislative agenda for the House and Senate and subpoena power to compel government officials and business leaders to testify under oath. The Banking, Housing and Urban Affairs Committee has a broad remit, including jurisdiction over federal monetary policy, banks and export controls.\n\nWarren's plans to tackle affordability include capping credit card interest rates, following up her 21st Century Road to Housing Act with additional legislation to build more affordable homes and lowering medical, consumer and student debt.\n\nThe aide said Warren also intends to put constraints on AI chips going to China, while shaping rules for AI at home.\n\nWarren is also seeking to end the \"Wild West-style\" lack of oversight in the prediction market industry, the aide said. She and Utah Republican Sen. John Curtis have already written to Kalshi and Polymarket demanding information on safeguards around election-related markets.\n\nThe banking committee is also likely to be at the center of Democrats' oversight agenda, which is expected to cast a wide net into private industry.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 01:04 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Canadian dollar underperforms most G10 currencies as oil falls", "full_content": "TORONTO, Nov 9 (Reuters) - The Canadian dollar steadied against its US counterpart on Monday, while underperforming most other Group of 10 currencies, as oil prices fell and after recent domestic jobs data kept expectations for Bank of Canada interest rate hikes in check.\n\nThe loonie was barely changed at 1.4135 per US dollar, or 70.75 US cents, holding near an 18-day low it touched on Friday at 1.4137.\n\n* Among G10 currencies, only the loonie and the Swiss franc did not post gains against the greenback as easing concerns about an escalation in the Middle East conflict prompted investors to rotate back into risk assets following last week's selloff in artificial intelligence-linked stocks.\n\n* Data on Friday showed that Canadian employment fell for a third straight month in October and the jobless rate rose to a six-month high of 6.7%. Separate data showed accelerating US job growth.\n\n* \"Diverging employment data releases will likely keep USD-CAD supported above 1.40,\" strategists at TD Securities, including Jayati Bharadwaj, said in a note.\n\n* \"(The) rising unemployment rate amid falling wage growth rate in Canada also reduces the market pricing of a December BoC rate hike relative to the Fed,\" the strategists said.\n\n* Investors see a roughly 40% chance the BoC will raise interest rates in December. Chances that the Fed would tighten next month are seen at 84%.\n\n* Minutes from the Canadian central bank's October policy meeting, when it hiked for the first time in three years, are due for release on Tuesday.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:03 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This beaten-down data center stock could be worth a look, says Mike Khouw", "full_content": "I'm a firm believer in investing in what you know\u2014and what you use. During a recent visit to my parents' New Hampshire property, my brother and I tackled overdue maintenance, and having the right equipment on hand was critical to finish the work in the limited time we had.\n\nHe and I rented both a compact track loader (CTL, not pictured) and a bulldozer (pictured above) from United Rentals (NYSE: URI) to push through some of the heavier work.\n\nFor those who may not be familiar with the company, United Rentals can quickly deploy heavy equipment to a remote site. Here's why I believe it sets up well for a defined-risk, moderately bullish options trade.\n\nThe good news is that United Rentals is currently trading at a below-market forward multiple \u2014 both on a Price-to-Earnings (P/E) basis, currently ~17.3x forward estimates of ~$61.10/share, and on an Enterprise Value-to-EBITDA (EV/EBITDA) basis at ~8.8x $9.25 billion in FYE2027 EBITDA. This despite the fact that the company is compounding revenues, earnings, and EBITDA at a noticeably faster clip than the cap-weighted S&P 500. Effectively, one can buy superior, market-beating growth at a discounted market multiple.\n\nThe recent third-quarter earnings confirmed this trajectory. URI delivered a beat and raise, pointing to robust underlying demand across its end markets, and the sell-side is scrambling to catch up, revising its forward estimates upward. Improving earnings estimates is one of the most reliable, time-tested short-term investment factors. Stocks with positive estimate revisions tend to meaningfully outperform those burdened with declining estimates in the short term.\n\nThe macro backdrop provides a sturdy foundation for this growth. We are in the midst of a broader nonresidential construction recovery, which has driven an environment of improving and resilient rental rates.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 12:53 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Anthropic releases first frontier models since Amodei's call for slowdown as IPO buzz builds", "full_content": "Anthropic on Monday released two new artificial intelligence models, Claude Fable 5.2 and Claude Mythos 5.2, as the company readies for a potentially historic IPO that could take place as soon as next week.\n\nFable 5.2 and Mythos 5.2 are Anthropic's most advanced offerings, and the company said they generate outputs 30% faster than their predecessors. The models also cost 20% less than the 5.1 generation, and will be available for $8 per million input tokens and $40 per million output tokens, the company said.\n\nThe launch marks the first time that Anthropic has released so-called \"frontier\" models since its CEO, Dario Amodei , called to slow down the pace of AI development in September . Anthropic said the models went through rigorous safety and alignment testing, and that the company developed new evaluations and post-launch monitoring tools ahead of the release.\n\n\"We called for pacing, not pausing,\" Dianne Penn, Anthropic's head of product management for research, told CNBC in an interview.\n\nAnthropic has to balance its safety efforts with intense commercial and competitive pressures, a tension that the company highlighted in the extensive risk factors section of its prospectus late last month. And as executives prepare to kick off Anthropic's IPO roadshow , they'll have to convince investors that their approach is the right one.\n\nThe company is aiming for a valuation of $1 trillion to $1.5 trillion in its offering, as CNBC previously reported , down from a target of $2 trillion that had been floated in recent months.\n\nAnthropic first introduced Mythos in April, and it limited the rollout to a select group of organizations because of the model's advanced cybersecurity capabilities. The company introduced Fable , a publicly available version of Mythos with additional safeguards, two months later.\n\nThe models \u2014 particularly Mythos \u2014 captivated Wall Street and government officials alike, and they helped to fuel Anthropic's meteoric rise this year.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 12:30 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jensen Huang exit odds are low on prediction markets after Nvidia probe", "full_content": "Nvidia 's board is investigating CEO Jensen Huang , citing recent reports that he's been targeted by a \"foreign intelligence effort,\" but traders on prediction markets think it's unlikely he'll be ousted as chief.\n\nOn Sunday, Huang admitted to an extramarital affair with a woman who U.S. intelligence officials \u2014 according to The New York Times \u2013 say is a spy for China's Ministry of State Security.\n\nOn Kalshi , speculators say there's just a 17% chance Huang is gone by 2027. Those odds rise to 30% by 2028, and 35% by 2029. However, they think there is a 75% probability that Huang will depart by 2031.\n\nContracts on Huang's departure on Kalshi are resolved using information from Bloomberg.\n\nOn Polymarket , speculators place just one-in-four odds that Huang resigns or is forced out by the end of March 2027. Contracts are resolved on the platform using official statements from the company or Huang himself.\n\nShares of Nvidia were down more than 5% after the news on Monday.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Finance", "pub_date_str": "10 Nov 2026, 12:16 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Quantitative Methods", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "A massive trade in Nvidia just went off \u2013 here are the details", "full_content": "The biggest options trade on Nvidia stock Monday seems to think the controversy swirling around the chip leader and its embattled CEO is creating a buying opportunity. In a trade about an hour after the opening bell that involved more than $100 million in options premium, someone exchanged an existing call spread for a more bullish position that captures the next five months of trading in Nvidia. The core position was the purchase of 52,000 195-strike calls expiring Feb. 19 worth about $57 million \u2013 contracts the trader opened for a new long position while simultaneously selling the same number of 245-strike calls for the same expiry, lowering the cost of the trade by $10 million. The net position, a bullish call spread, needs Nvidia to trade above around $206 by expiry, or about 15% higher, to be profitable. If Nvidia stock reaches the short, 245-strike call, it would represent a nearly 40% rally and return the stock to its all-time high of $243, that was reached on October 6th. The trade was likely part of a \"roll\" down from an existing 210/255-strike call spread worth about $42 million that was closed out, according to SpotGamma analysis.\n\nNvidia, YTD \"The person got more aggressive rolling this spread down to lower strikes to get more upside exposure by getting higher delta,\" SpotGamma founder Brent Kochuba said by phone. \"They're trading the call spread here because the vol is expensive going into earnings. It's a significant increase in upside delta exposure.\" Delta is options parlance for describing how quickly an options price will react to a change in the underlying stock price. The trader's updated position, taken at lower strikes, will make money faster if Nvidia rallies. In other words, it's a higher conviction trade that the chipmaker's stock will soon rebound. The 195-strike calls they bought for $57 million was the single biggest options trade on the tape Monday, according to SpotGamma.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 12:07 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Upcoming IPO: Veritas Finance gets Sebi nod to launch public issue \u2013 Top things for investors", "full_content": "Veritas Finance Ltd, a non-deposit-taking non-banking financial company (NBFC), has received approval from the Securities and Exchange Board of India (Sebi) to launch its initial public offering ( IPO ), comprising a fresh issue of equity shares worth \u20b9 900 crore and an offer for sale (OFS) by existing shareholders.\n\nAccording to the company's latest draft red herring prospectus (DRHP), the OFS component will involve the sale of up to 1.28 crore equity shares. The proposed public issue may also include a pre-IPO placement of specified securities worth up to \u20b9 180 crore.\n\nIf the pre-IPO placement is completed, the size of the fresh issue will be reduced by the amount raised through the placement.\n\nThe company had refiled its preliminary IPO documents with Sebi in July, shortly before the regulatory approval for its earlier public issue proposal was due to expire.\n\nThe market regulator issued its final observations on October 19 after examining the revised draft papers, clearing the way for the company to proceed with its IPO.\n\nVeritas Finance had initially filed its draft IPO papers in January 2025, seeking to raise \u20b9 2,800 crore. That proposal comprised a fresh issue of shares worth \u20b9 600 crore and an OFS of \u20b9 2,200 crore. Sebi granted its approval for the earlier proposal in April 2025.\n\nThe revised issue structure significantly increases the fresh capital component while outlining a separate offer for sale by existing investors.\n\nVeritas Finance plans to utilise the net proceeds from the fresh issue to strengthen its capital base and meet future business requirements, including providing loans to customers.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:00 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Goldman CEO Solomon says AI financing remains strong despite market jitters", "full_content": "Goldman CEO David Solomon says investor appetite for AI infrastructure remains strong despite a reset in AI stocks and political uncertainty around data centers.", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 11:44 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "White House On Alert After Car Crash Near Lafayette Park. What y in turbulent market conditions.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 10:28 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "AMD stock rallies 12% as Google Cloud taps its EPYC processors for next-generation AI infrastructure", "full_content": "AMD shares rose 12.5% after the company announced its fifth-generation EPYC processors will power Google Cloud TPU 8tx systems. The partnership combines AMD CPUs and security technology with Google\u2019s AI accelerators to support confidential AI workloads, protecting sensitive data as it is processed.", "source": "LiveMint Markets", "pub_date_str": "09 Nov 2026, 10:24 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Parag Parikh Flexi Cap adds Netflix, exits Meta: What changed in its October portfolio? Check latest stock picks", "full_content": "PPFAS Flexi Cap Fund added Netflix, exited Meta Platforms and reduced Microsoft in October 2026. It also increased investments in DLF, Maruti Suzuki, M&amp;M and other Indian stocks. Here's a look at its latest portfolio and long-term rolling returns.", "source": "LiveMint Money", "pub_date_str": "09 Nov 2026, 10:07 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "US dollar dips as easing AI and Mideast worries limit its appeal", "full_content": "After a six-month high, the US dollar is now on a downward trend, largely spurred by impressive job growth figures. Investors are eagerly awaiting the upcoming consumer price index data, a key factor for Federal Reserve rate considerations. Meanwhile, the euro and other currencies are rebounding against the dollar, backed by solid economic indicators.", "source": "Economic Times Markets", "pub_date_str": "09 Nov 2026, 09:46 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Buy, Sell Or Hold: Divi's Labs, Tata Power, Kalyan Jewellers, Reliance Industries, L&T And Shriram Finance \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for an array of stocks including Divi's Labs, Tata Power, Kalyan Jewellers, Relaince and L&T.", "source": "NDTV Profit", "pub_date_str": "09 Nov 2026, 09:45 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia investigates CEO Jensen Huang's relationship with alleged Chinese spy", "full_content": "Huang told Nvidia staff in an email that he had an affair and that the company's board has opened an investigation into allegations the woman is a Chinese spy.", "source": "CNBC World Economy", "pub_date_str": "09 Nov 2026, 09:21 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}], "updated_at": "10 Nov 2026, 04:33 AM IST", "total_stories": 203};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
