    const allData = {"general": [{"title": "Trump awards Presidential Medal of Freedom to Rudy Giuliani", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:21 AM IST", "pub_date_relative": "8m ago"}, {"title": "US Army sets out measures to limit lead dust from Iowa explosives blast", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:19 AM IST", "pub_date_relative": "11m ago"}, {"title": "Bruised S&P 500 seen gaining more than 12% by end-2027", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:18 AM IST", "pub_date_relative": "11m ago"}, {"title": "Venezuela moves toward possible debt restructuring with release of economic framework", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:18 AM IST", "pub_date_relative": "11m ago"}, {"title": "Trump administration set to unveil new tariffs after probe on excess factory capacity, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:18 AM IST", "pub_date_relative": "11m ago"}, {"title": "Visiting Las Vegas is getting too expensive \u2014 but don\u2019t blame airfares", "full_content": "Analysts say Vegas hotels have gotten pricey, with customers finding better deals in other cities or on cruise ships", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 12:18 AM IST", "pub_date_relative": "12m ago"}, {"title": "Royal Gold at Renmark virtual non-deal roadshow: growth and discipline", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:16 AM IST", "pub_date_relative": "13m ago"}, {"title": "Schumer accuses Huang of violating US export law", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:16 AM IST", "pub_date_relative": "14m ago"}, {"title": "Nasdaq slides as AI trade uncertainty remains despite explosive Nvidia-led rally", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:15 AM IST", "pub_date_relative": "15m ago"}, {"title": "Oil rises $1 on Hormuz ship attacks, surplus supply outlook curbs gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:12 AM IST", "pub_date_relative": "17m ago"}, {"title": "LuqEE Reaches Milestone of 100 Bitcoin Cash Blocks Found Through Its Solo Mining Platform", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:09 AM IST", "pub_date_relative": "20m ago"}, {"title": "Kalshi daily volume of \u2018perps\u2019 trading begins to top its prediction markets", "full_content": "Kalshi is known for its prediction markets across sports , politics and culture .\n\nBut now, for the first time, perpetual futures, Kalshi's second financial product, has surpassed the notional trading volume of its event contracts on consecutive days.\n\nOn Thursday, perpetual futures \u2014 commonly known as \"perps\" \u2014 on Kalshi saw $3.4 billion in notional volume as artificial intelligence laboratory Anthropic stock debuted on public markets while the rest of the market sold off . That exceeded about $3 billion in notional volume for Kalshi's prediction markets on the same day.\n\nPerps are futures-style contracts where there is no expiration and traders do not need to own the underlying asset. Contracts instead continuously track the price of an asset, with funding payments to keep the contract price aligned with that of the market. Funding payments are made periodically between holders of short or long positions.\n\nPerps trading surpassed event contracts one day in September, but on Friday perps topped prediction markets volume for a second day. Now Kalshi expects that performance to continue as it introduces perps tied to more individual stocks. On Monday, for example, Kalshi launched contracts linked to Anthropic .\n\nKalshi was the first to debut perps in the U.S. after winning federal regulatory approval in May to list perps tied to cryptocurrencies.\n\nPerps trading volume includes any leverage that speculators acquire along with their trade, while event contracts are fully collateralized \u2014 for now .\n\nSince the original launch in May, Kalshi has received approval to introduce perps tied to metals , crude oil, stock indexes and individual stocks.", "source": "CNBC Finance", "pub_date_str": "25 Nov 2026, 12:04 AM IST", "pub_date_relative": "25m ago"}, {"title": "Consumer confidence shoots up after Democrats' midterm victories \u2014 though inflation worries persist", "full_content": "Consumers grew significantly more optimistic in November in the wake of the midterm elections , with a growing number of Americans now seeing improvement in the labor market and expecting inflation to cool.\n\nThe Conference Board survey released Tuesday showed improvement across the board, with the headline confidence index jumping to 103.3, up 11.4 points from October and much better than the Dow Jones consensus forecast for 92.2.\n\nConfidence among Democrats and independent voters improved sharply, the Conference Board said, while confidence among Republican respondents fell slightly. Still, confidence among Republicans remained the highest among the three groups.\n\nWhile respondents \"continued to express frustration with high prices and rising costs,\" they also \"cited hope for the general economy,\" said Fergus McCormick, the board's senior economist for global indicators.\n\nThe survey comes with the Federal Reserve continuing to try to bring down inflation, which has run above the central bank's 2% target for some 5\u00bd years. The Fed is expected to raise its benchmark interest rate by a quarter percentage point when it meets again in two weeks.\n\nDespite the lingering worries about the cost of living \u2014 a centerpiece issue during the midterms \u2014 the survey's present situation and expectations indexes both posted strong gains. Inflation expectations for 12 months from now fell for the second straight month but remained high at 5.7%.\n\nThe survey's closely watched gap between jobs considered \"plentiful\" versus \"hard to get\" widened to 12.4 percentage points. The \"plentiful\" side rose to 30.8% from 26.2% while \"hard to get\" fell to 18.4%, down 3 percentage points.\n\nThe survey results are the second in the past week to reveal that Americans are growing more optimistic about the economy. The University of Michigan's November survey, released Friday, showed a 7.3% increase since October, with a similar partisan split.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:04 AM IST", "pub_date_relative": "25m ago"}, {"title": "Micron\u2019s stock falls as an analyst warns about a future supply glut", "full_content": "A BNP Paribas analyst says the risk of an \u201coversupply scenario is mounting\u201d for memory chips, and that could threaten Micron\u2019s pricing power.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 12:03 AM IST", "pub_date_relative": "27m ago"}, {"title": "Katie Stockton sees a comeback ahead for this beaten-down tech stock", "full_content": "Keysight Technologies could rally toward $329 as momentum improves.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:02 AM IST", "pub_date_relative": "27m ago"}, {"title": "Nvidia shares fall 7% as Huang comeback rally cools", "full_content": "Nvidia shares fell around 7% on Tuesday, paring a massive Monday rally that was sparked by the return of Jensen Huang as CEO.\n\nOther U.S. semiconductor stocks also trended lower after posting strong increases Monday. Micron declined 10%, Marvell Technology lost 8%, Arm Holdings dropped over 7% and AMD shed around 9% in midday trading.\n\nNeoclouds also gave back some of their Monday gains, with CoreWeave losing over 12%, Iren declining nearly 13% and Nebius shedding 11%.\n\nHuang, who resigned as CEO of Nvidia earlier this month after admitting to an extramarital affair, was reinstated on Monday. The stock closed over 30% higher following the news of Huang's return.\n\nThe company's board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him.\n\nPresident Donald Trump also claimed he was personally involved in Huang's return. The president told CNBC that he spoke with the chipmaker's board before it reversed course and reinstated its co-founder.\n\n\"I made the deal,\" Trump told CNBC's Eamon Javers on Monday during an interview on \"Squawk on the Street.\"\n\nTrump said Nvidia's board asked for guarantees that Huang, who resigned less than two weeks ago, was not a threat to national security.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 12:00 AM IST", "pub_date_relative": "29m ago"}, {"title": "Nvidia live updates: Nvidia stock falls as exuberance fades after Jensen Huang's return as CEO - Yahoo Finance", "full_content": "Nvidia live updates: Nvidia stock falls as exuberance fades after Jensen Huang's return as CEO Yahoo Finance Stock Market Today: Tech Stocks Slide Back After Epic Rally WSJ Markets Slide as Tech Stocks Partly Reverse Nvidia-Sparked Rally The New York Times Nasdaq declines as Nvidia slides, giving back part of Monday\u2019s rally: Live updates CNBC Stock Market Today: Dow up 400 points, S&P 500 and Nasdaq in retreat a day after Nvidia's 31% surge; Dell results on tap: live updates MarketWatch", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 12:00 AM IST", "pub_date_relative": "29m ago"}, {"title": "Op-ed: Trump\u2019s Nvidia board intervention put a price on national security. Our adversaries will take note", "full_content": "President Donald J. Trump has accomplished something extraordinary. He directly inserted himself into the boardroom of one of America's most strategically important companies, Nvidia , helping to reverse a corporate leadership decision, and personally vouched for restored CEO Jensen Huang as having a clean bill of health regarding the national security investigations into his business activities with China.\n\nOn Monday, after Nvidia's board reinstated Huang following his resignation amid a counterintelligence controversy and allegations that Alice Huang, with whom he had an affair, is under suspicion of being a Chinese intelligence asset, Wall Street celebrated with a historic market bounce. But the market's enthusiasm should not obscure a far more consequential question circulating in Washington, D.C.: Does American national security have a price?\n\nWhat happened at Nvidia raises the frightening possibility that it does, and it fits a recent pattern that is exactly what geopolitical rivals around the world want to see. Consider the economic pressures surrounding the Iran war. Disruptions to energy markets, shipping, supply chains, and consumer prices have complicated American strategic decision-making. These are notably different circumstances, but they raise the same troubling question about the costs of defending American national security interests, and when they become economically unpalatable to those in the Trump administration.\n\nBeijing, Tehran, and Moscow are watching \u2014 as are our allies and partners \u2014 and they all may agree on one thing: America has an Achilles' heel that military and technological superiority cannot overcome. It is possible to impose sufficient economic pain to alter Washington's strategic calculation with friends and foes alike.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:00 AM IST", "pub_date_relative": "30m ago"}, {"title": "Utah drops criminal charges against Kalshi founders after company suspended operations in state", "full_content": "Utah on Tuesday dismissed criminal charges against Kalshi and its two co-founders following the decision by the prediction market platform on Monday to suspend operations in the state.\n\nThe state originally filed the 14 criminal charges against the company and founders Tarek Mansour and Luana Lopes Lara on Oct. 28, claiming that Kalshi operated an illegal gambling operation in the state.\n\nThe Commodity Futures Trading Commission \u2014 the federal regulator for prediction markets which views itself as the sole body that can develop rules over the growing industry \u2014 sued Utah the day before the state announced its charges.\n\nMansour and Lara were slated to appear in a Utah district court on Dec. 4, according to court documents.\n\nHowever, Kalshi suspended operations in Utah on Monday, citing legal uncertainty. Utah Attorney General Derek Brown celebrated the decision in a statement announcing the move to dismiss the state's charges.\n\n\"Every company in this space should take note,\" he said. \"If they promote, support, or enable gambling, we will hold them accountable.\"\n\nBrown's office noted in the statement that dismissal is without prejudice, meaning if Kalshi were to begin operations again in the state the charges could be refiled.\n\n\"Good faith jurisdictional disagreements should never be criminalized,\" Kalshi's general counsel Yaakov Roth said in a post on X . \"We stand ready to work with State AGs on reasonable interim measures until courts resolve the dispute over who regulates prediction markets.\"", "source": "CNBC Finance", "pub_date_str": "24 Nov 2026, 11:58 PM IST", "pub_date_relative": "31m ago"}, {"title": "Tesla has a \u2018legitimate multitrillion-dollar opportunity\u2019 in robotaxis, says former skeptic", "full_content": "Even for Seaport analyst Ron Jewsikow, Tesla\u2019s robotaxi progress is now \u201cimpossible to ignore.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 11:58 PM IST", "pub_date_relative": "32m ago"}, {"title": "Retail turnarounds are taking hold just in time for the holiday season", "full_content": "Once-struggling retailers are entering the holiday quarter with improved performance and sales momentum as turnaround efforts begin to resonate with shoppers.\n\nA handful of earnings reports on Tuesday pointed to a mix of factors behind the strong results, including a resilient consumer, stronger execution and demand for the right products at the right price.\n\nKohl's reported comparable sales growth of 1.2% for the period ended Oct. 31 and raised its full-year outlook as CEO Michael Bender said customers \"have remained resilient\" but are \"migrating to value with their purchases.\"\n\nHe tied improvement to the company's work on product assortment, store experience and value.\n\nBest Buy also on Tuesday posted its highest comparable sales growth in five years , at 6.1%, which prompted the electronics retailer to raise its full-year outlook.\n\n\"We have a tremendous amount of momentum,\" CEO Jason Bonfig told CNBC in an interview. \"The fact that we saw pretty much broad-based growth across almost all of our categories is a lot of momentum that we're very excited about.\"\n\nThe company also credited execution, market share gains and a compelling product cycle alongside growing customer demand.\n\nAt Dick's Sporting Goods , quarterly comparable sales rose 2.6% at the core business and 0.5% at Foot Locker. CEO Lauren Hobart said \"all income demographics grew\" and the company \"didn't see trade-down from best to better or better to good.\"", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:51 PM IST", "pub_date_relative": "38m ago"}, {"title": "Nvidia revived the AI trade, but investors still have reasons to hedge", "full_content": "How to play defense and protect your portfolio if the AI trade fizzles again.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:48 PM IST", "pub_date_relative": "41m ago"}, {"title": "As Anthropic falls below its IPO price, here's how big-money traders are reacting", "full_content": "Anthropic shares are back trading below the IPO price after a 13% sell-off Tuesday and a 1.5% drop Monday, despite a broad rally in most big-tech AI names. Trading below $76 Tuesday, the stock's now 8.5% below its IPO level and 34% below its intraday high of $115.\n\nIt took just four days for ANT to fall below its offering price, compared to 21 trading days for SpaceX, which rallied out of the gate.\n\nOptions volume on the stock is picking up as the shares drop and implied volatility jumps to 96, according to ThinkOrSwim data. Almost 500,000 options traded by noon E.T. Tuesday for a total premium of about $250 million, the sixth-most active single-stock options in the market, SpotGamma data show.\n\nAlmost 300,000 puts traded versus about 200,000 calls, but the sentiment implied by the trades was not overtly bearish, and judging by the biggest single trades of the day, traders are divided on what happens next.\n\nANT intraday chart The biggest single option trade of the day was a $7.5 million purchase of almost 11,000 75-strike puts expiring in mid-December. The trader paid above the ask, suggesting an eagerness to get the trade done at a cost of $6.85, according to SpotGamma. With Anthropic trading at $77, the position needs Anthropic to drop 11% by expiry to pay off.\n\n\"Anthropic remains bumpy as investors add risk to other names,\" said noted tech analyst Dan Ives.\n\nOnly one obvious call purchase appeared among the top 10 trades: a 3,000-lot purchase of 85-strike calls expiring Jan. 15 that cost $7.10 each, for a total of $2.2 million. That trade needs Anthropic to rally 19% within the next two months to break even.\n\nArguably the most interesting action was a string of almost a dozen put sales, ranging from $400,000 to $1.6 million each, all within moments of each other, selling the 120-strike puts expiring Dec. 18. The puts bring in $40 each, meaning the breakeven for the trade is at $80.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:47 PM IST", "pub_date_relative": "43m ago"}, {"title": "I\u2019ve been married for 58 years. It\u2019s \u2018our\u2019 money, not \u2018his\u2019 and \u2018hers.\u2019 Why do so many couples keep their finances separate?", "full_content": "\u201cMy wife stopped working outside the home in 1970.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 11:45 PM IST", "pub_date_relative": "45m ago"}, {"title": "The wealthiest 10% of Americans are pulling ahead of everyone else. This is what\u2019s making them richer.", "full_content": "The wealthiest 10% have a median net worth that is $800,000 greater than it was three years ago.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 11:44 PM IST", "pub_date_relative": "46m ago"}, {"title": "Hewlett Packard Enterprise shares crash 16%, set for biggest 1-day fall in 18 months; what went wrong?", "full_content": "Shares of Hewlett Packard Enterprise (HPE) came under heavy selling pressure in Tuesday's trade, plunging 16% to their lowest level since late May, as concerns over the company's margin outlook and prolonged supply shortages overshadowed strong fourth-quarter (Q4) earnings and upbeat guidance.\n\nOn Monday, the company reported fourth-quarter adjusted earnings of $1.43 per share, beating Wall Street estimates. Revenue rose 50.3% from a year earlier to $14.55 billion, also exceeding expectations.\n\nThe company recorded $5.7 billion in AI orders during Q4, while its AI backlog reached a record $10.5 billion.\n\nFor the first quarter of fiscal 2027, HPE expects adjusted earnings of $1.30 to $1.40 per share on sales of $14 billion to $14.6 billion. Analysts had expected earnings of $1.07 per share and revenue of $12.99 billion, respectively.\n\nFor the full year, the company expects adjusted earnings of $5.05 to $5.35 per share and revenue of $59.4 billion to $63.1 billion, compared with analyst estimates of $4.76 per share and $55.1 billion, respectively.\n\nHowever, the upbeat outlook failed to reassure investors, as Chief Financial Officer Marie Myers said gross margins could soften through fiscal 2027 as artificial intelligence systems account for a larger share of sales. She expects this product mix to lean towards the second half of the fiscal year and said synergies could help offset some of the pressure.\n\nMeanwhile, CEO Antonio Neri warned that supply constraints could persist for nearly two more years.\n\n\u201cIn fact, we continue to operate in a significantly supply-constrained environment. We expect supply of memory, NAND, and many other critical components to remain constrained to at least the second half of calendar year 2028,\u201d Neri said.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 11:42 PM IST", "pub_date_relative": "47m ago"}, {"title": "Micron Stock Is Counting on a Buyback Bounce. Why It\u2019s No Slam Dunk. - Barron's", "full_content": "Micron Stock Is Counting on a Buyback Bounce. Why It\u2019s No Slam Dunk. Barron's Jensen Huang is back at Nvidia. Should AMD be worried? Yahoo Finance Here's where we stand on AMD shares after Jensen Huang's return to Nvidia CNBC AI Bulls in Asia Get Huang Back But the Harder Questions Remain Bloomberg.com The \"bank of AI\" is back in business Axios", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 11:42 PM IST", "pub_date_relative": "48m ago"}, {"title": "A 66-year-old nurse is facing down retirement with just $500 saved. Who\u2019s to blame?", "full_content": "\u201cRetirement is a financial status, not an age.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 11:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "AG Blanche, FBI\u2019s Patel dodge questions about Jensen Huang investigation", "full_content": "Attorney General Todd Blanche and FBI Director Kash Patel on Tuesday dodged questions about the conclusions of an investigation President Donald Trump cited to push Nvidia 's board to bring back J ensen Huang as CEO.\n\nAsked by a reporter whether the Department of Justice had investigated Huang and the results of that probe, Blanche said, \"What the president said is that he talked to a lot of people going into the decision that he made to encourage the board to reinstate him.\"\n\n\"And so I'm not going to get into communications I have with the president,\" Blanche said at a news conference in Washington, D.C.\n\nHuang was reinstated as CEO of Nvidia on Monday morning, less than two weeks after resigning amid allegation had had affairs with a purported spy for China and two Nvidia employees, as well as concerns that advance semiconductor chips made by his company had been diverted to China in violation of U.S. law.\n\nIn an interview with CNBC on Monday, Trump was asked what led him to personally confirm to Nvidia's board that Huang was not a national security risk.\n\n\"We've done a very thorough investigation, and the investigation showed that he did, I mean, he had bad judgment having to do with somewhat unrelated incidents, but he did nothing wrong,\" Trump replied.\n\nTrump in a Truth Social post on Monday said the U.S. government had no reason to believe Huang's return to the company \"poses any risk to National Security,\" and that Blanche had confirmed the government \"does not possess evidence that he has engaged in any unlawful conduct.\"\n\nNvidia, in its statement Monday announcing Huang's return, said, \"The Board received input from senior levels of the United States government, and based on that input, the Board is confident that Mr. Huang's reinstatement poses no national security risk.\"", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump Account contributions from friends and family pass $1 billion mark, Treasury says", "full_content": "Families and friends have collectively contributed more than $1 billion to Trump Accounts since the July 4 launch, bringing total deposits to more than $9 billion, the U.S. Department of the Treasury said Tuesday in an announcement exclusively provided to CNBC.\n\nThe $1 billion in Trump Account deposits come from more than 3 million individuals, according to the agency. That total does not include the government's seed money or philanthropic gifts from donors such as Michael and Susan Dell .\n\n\"The American people are investing in Trump Accounts with a generosity that represents the finest instincts of our national character,\" U.S. Treasury Secretary Scott Bessent said in a written statement.\n\n\"Trump Accounts are a transformative government program for American children. It is the largest government start-up in American history,\" Internal Revenue Service CEO Frank Bisignano said in the statement.\n\nAlso known as 530A accounts, Trump Accounts are open to any U.S. child under 18 with a Social Security number.\n\nParents, guardians, grandparents and others can collectively contribute up to $5,000 per child per year in after-tax dollars up until the year before the beneficiary turns 18. The annual contribution limit is indexed for inflation after 2027.\n\nChildren born from 2025 through 2028 may receive a one-time $1,000 deposit from the Treasury. Other funds may also be available, depending on certain criteria.\n\nMost recently, Snowflake chairman Frank Slootman and his wife, Brenda, announced they would give $1,000 to every child in Montana born in 2023 and 2024.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic falls below IPO price as tech rally fades", "full_content": "Investor relief over reinstatement of Jensen Huang as Nvidia CEO subsides", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 11:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang to face DC grilling the same day Nvidia releases new products at GTC", "full_content": "Jensen Huang is back as the CEO of Nvidia , and is now tasked with selling the company's artificial intelligence vision while also defending himself in Washington.\n\nAs Nvidia employees celebrated the return of their leader to the company's headquarters, Huang told the gathered crowd, \"I'll be a better CEO the second time around.\"\n\nHuang will need to be a better CEO to head off the issues surrounding Nvidia and the broader AI industry exposed by Huang's exit. The challenges include a proliferating roster of investigations and hearings from Congress, regulators and state-level officials , as well as technical and competitive questions about how long Nvidia's currently dominant graphics processing units can remain on top.\n\n\"There's nothing prohibiting him from doing what he does on his day job,\" said Katten chair and former federal prosecutor Gil Soffer. But investigations take significant prep time, Soffer said. \"You don't just walk in cold.\"\n\nAt Nvidia's GTC conference in Washington, D.C., next week, the company will attempt to convince customers, partners and suppliers that it is developing the future of AI. At the same time, lawmakers will be pressing its newly reinstated CEO over what he knew and when about Megaspeed executive Alice Huang .\n\nHuang, before his scandals, was scheduled to give the GTC DC keynote speech on Dec. 1 to discuss new Nvidia products and the trajectory of the AI ecosystem. In the past, the two-hour speech was the highlight of the event with hordes of fans full of the Huang-inspired \"Jensanity.\"\n\n\"People will want to see that it's business as usual, which hopefully for Nvidia shareholders will mean that Jensen Huang announces some new exciting products,\" said Babson College associate professor Peter Cohan.\n\nRight now, Nvidia has Ian Buck, vice president of hyperscale and high-performance computing, filling the slot. A representative for Nvidia declined to answer multiple questions about whether Huang would appear at the company's event.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 11:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "The AI debt market isn\u2019t convinced the worst is over for investors", "full_content": "Stocks rebounded on Monday, but credit markets remain cautious.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 11:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "A Bug From July Took Down Outlook And Teams For 24 Hours. Now Microsoft Has Declared 'Code Red\u2019", "full_content": "The Code Red programme will focus on five areas, including reducing system loads, separating traffic across geographic regions and introducing faster recovery mechanisms.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 11:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "'A Joyful Face Is Always Beautiful': Sadhguru's Response To Tamannaah Bhatia Goes Viral", "full_content": "Sadhguru shared his take on beauty when Tamannaah Bhatia asked how people change with age. He said genetics plays a role, but a joyful face can always be beautiful.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 11:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic sinks 8%, falling below $83 IPO price, but analysts are still largely positive", "full_content": "Shares of Anthropic fell 8% on Tuesday, sending the stock below the artificial intelligence company's $83 IPO price.\n\nThe AI lab's stock has been sinking steadily since opening at $111.50 on the Nasdaq on Thursday, after Anthropic raised $81.3 billion in the largest offering of all time. Investors eagerly awaited Anthropic's debut in hopes that the company would revitalize the broader AI trade, which has been volatile in recent weeks over concerns about the feasibility of a multitrillion-dollar infrastructure buildout.\n\nAnthropic's initial public offering was oversubscribed, and roughly half of the institutional investors that placed orders for the stock were left empty-handed, as CNBC previously reported . But at least for now, as the market wavers, those firms don't appear to be racing to scoop up shares.\n\nChip stocks Nvidia , Advanced Micro Devices and Intel , as well as neoclouds CoreWeave , IREN and Nebius , all fell during intraday trading on Tuesday. The market is still reeling after Nvidia reinstated Jensen Huang as CEO, a dramatic reversal from his ouster earlier this month. Nvidia shares surged more than 30% on Monday, but pared those gains Tuesday.\n\nAnalysts at Canaccord Genuity said Tuesday that they're focused on Anthropic's long-term potential.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m in my 70s and buying a new BMW X1. Should I put my only son on the title?", "full_content": "\u201cGiven my age, I never make a major new purchase without thinking about the future.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Waymo says recall prompted by 11 new incidents of robotaxis entering closed freeway lanes", "full_content": "Alphabet -owned Waymo said Tuesday its new recall of nearly 4,500 self-driving vehicles in the U.S. was prompted by 11 incidents of robotaxis entering closed freeway lanes since Oct. 1, including three on a single day this month.\n\nOn Friday, Reuters first reported Waymo was issuing two recalls for its robotaxis over incidents involving closed freeway lanes and manual traffic control. Last week, Waymo said it halted operations of its vehicles on U.S. freeways \u200bafter a California regulator barred its vehicles from freeways in the state.\n\nWaymo told the National Highway Traffic Safety Administration in a filing released Tuesday that three Waymo vehicles entered freeway lanes marked with cones as closed for construction on Nov. 9, just three days after the company \"updated the approved scope of operation to reduce exposure to closed freeway lanes.\"\n\nWaymo said there were no collisions or injuries reported from the closed freeway events, adding it is still working \u200bon the recall remedy.\n\nThe California ban, \u200bwhich took effect this month, resulted from a series of incidents in which Waymo robotaxis entered active construction zones, the California Department of Motor Vehicles said.\n\nIn June, Waymo issued a similar recall for nearly 3,900 robotaxis that drove past ramp closure signs into pre-planned freeway construction zones or entered freeway lanes with active construction by driving between cones.\n\nThe \u200cmanual \u2060traffic recall is to ensure self-driving vehicles better respond to manual commands at intersections from law enforcement or other emergency personnel and follows a May 8 collision in which a Waymo followed directions from an officer, but the officer was then temporarily obstructed. That update was completed on Nov. 6.\n\nEarlier this month, NHTSA said it opened a recall query into Waymo vehicles after numerous incidents of its robotaxis passing \u200bstopped school buses.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 10:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves midday: Dick's Sporting Goods, Analog Devices, Nvidia, Pinterest & more", "full_content": "Retailers bucked the broader market decline Tuesday, with Kohl's, Dick's Sporting Goods and Abercrombie & Fitch rising on strong quarterly results and guidance.\n\nNvidia, meanwhile, fell as the chipmaker gave back some of the previous session's sharp gains. Anthropic followed Nvidia lower, dipping below its IPO price.\n\nPinterest and Kymera Therapeutics both rallied more than 10%, while Analog Devices dropped double-digits.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nMiners Freeport McMoRan and Southern Copper resumed their retreat Tuesday alongside the base metal known as \" Dr. Copper \" by economists and investors for its vital role in key parts of the economy.\n\nFreeport fell almost 6% while Southern dropped 5%. Both have fallen for four of the past five sessions. Copper itself is down another 5% Tuesday.\n\nKymera Therapeutics traded more than 10% higher after the biotech company announced an upsized secondary stock offering at $150.37 per share. The company expects to raise $1.75 billion from the sale, before fees and expenses.\n\nAnalog Devices dropped 18% even after the chipmaker reported fiscal fourth-quarter results that beat expectations. The company earned $4.06 per share, excluding certain items, on revenue of $4.37 billion. Analysts polled by FactSet expected a profit of $3.90 per share on revenue of $4.33 billion.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Chinese media hail Huang\u2019s Nvidia return with warning over \u2018witch-hunts\u2019 - The Guardian", "full_content": "Chinese media hail Huang\u2019s Nvidia return with warning over \u2018witch-hunts\u2019 The Guardian Jensen Huang went to war with Washington \u2014 and won a path to China The Washington Post China Can\u2019t Expect the Old Jensen Huang Back Bloomberg.com With Jensen Huang back at Nvidia's helm, what's next for export controls? WBUR Beyond Jensen Huang, Nvidia and Alleged Spies: Court Records Reveal How Beijing Targets US Troops Military.com", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 10:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "We're adding to our position in a tech giant that is too cheap to ignore", "full_content": "Our discipline requires us to put some money to work in these oversold conditions.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 10:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trade Setup For Nov 25: GIFT Nifty Signals Strong Rebound, Analysts See 26,000 As Key Hurdle To Cross", "full_content": "The 62,000-61,900 zone would likely to act as an immediate support area for the Bank Nifty index, as per analysts.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 10:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Is A Fresh Wave Of Tech Layoffs Coming To India? Viral Posts Point To Google, Microsoft", "full_content": "Viral posts claim Google, Microsoft and Databricks may scale back campus hiring in India in 2027, while unverified employee accounts point to fresh job cuts at Google.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 10:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Can a husband gift cash to his wife without triggering a tax demand? ITAT examines \u20b958 lakh bank deposits", "full_content": "Can a woman's bank deposits be treated as unexplained income if she claims the money came from her husband's bank withdrawals? The Income Tax Appellate Tribunal (ITAT), Delhi, has directed the tax department to verify such a claim by examining the couple's bank records, the sale of agricultural land and a gift deed.\n\nThe ruling in Sunita vs Income Tax Officer , pronounced on 18 November 2026, concerns \u20b9 58.07 lakh deposited by the woman across three bank accounts during September 2009. The assessing officer had treated the entire amount as unexplained money under Section 69A of the Income-tax Act, 1961.\n\nThe tribunal admitted additional evidence, including the land sale deed, bank statements and gift deed, and sent the matter back to the assessing officer for limited verification. It has not, however, deleted the \u20b9 58.07 lakh addition or given the taxpayer a final clean chit.\n\nThe woman maintained three bank accounts with Syndicate Bank. According to the details submitted before the tribunal, she deposited \u20b9 18 lakh on 23 September 2009 and another \u20b9 40.02 lakh on 24 September 2009. She had also deposited \u20b9 5,000 on 19 September 2009 while opening one of the accounts.\n\nThe money was subsequently used to create fixed deposits worth \u20b9 58 lakh with the bank.\n\nThe taxpayer argued that the source of the larger deposits was cash withdrawn by her husband, Mahabir, from his State Bank of India (SBI) account. He had withdrawn \u20b9 90 lakh on 23 September 2009, and his bank account was closed the following day.\n\nShe also explained the source of her husband's funds. He had sold agricultural land jointly owned with his brother at Bakkarwala village in Delhi. The land, measuring around four acres, was sold for \u20b9 11 crore through a registered sale deed dated 4 April 2008.\n\nHer husband had received \u20b9 3.21 crore as his share of the sale consideration, according to the documents submitted before the tribunal.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 10:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "My husband secretly sends his ex-wife $1,500 a month after she lost her job. We have $2.4 million saved. Has he lied by omission?", "full_content": "\u201cHe explained that he wasn\u2019t trying to hide the payment, but his former wife lost her job in a medical billing company.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 10:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fiona The Hippo To Get Special Tribute At FC Cincinnati's MLS Playoff Match", "full_content": "FC Cincinnati will honour Fiona, the beloved Cincinnati Zoo hippo, with a special tifo during its MLS playoff match against Nashville SC, while the club also plans a donation to the zoo in her memory.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 10:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018Buyers are out for blood\u2019: With home sales at a record low, buyers are calling the shots", "full_content": "The few buyers left in the market braving record-high home prices and 7% mortgage rates are starting to call the shots, real-estate agents say.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 10:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia shares tumble 9% after biggest rally in over two decades as AI-related concerns return", "full_content": "With After registering its biggest one-day gain in more than two decades, Nvidia shares retreated in Tuesday's trade on November 24, falling 9% to $150.50 apiece and giving up part of Monday's 31.48% surge.\n\nThe shares had closed at $165.05 on Monday after the company's board reinstated founder Jensen Huang as CEO. The rally added nearly $1 trillion to Nvidia's market value, bringing its market capitalisation close to $4 trillion.\n\nHowever, the stock failed to sustain the massive gains as investors reassessed the company's outlook amid concerns over returns on AI investments, regulatory uncertainty and higher borrowing costs.\n\nThe initial euphoria over Huang's reinstatement faded as investors turned their attention to the ongoing investigation by Nvidia's board into whether he was the target of a foreign spy operation and whether the episode raised any national security concerns.\n\nAlong with Nvidia, other major AI and semiconductor-linked stocks also resumed their losing streak as reports emerged that the US was preparing to raise tariffs on China and dozens of other countries, according to a Bloomberg report citing people familiar with the plans.\n\nRegulatory scrutiny, export restrictions involving China and questions over the profitability of AI infrastructure investments continue to weigh on investor sentiment.\n\nThe weakness in Nvidia coincided with a broader retreat in US equity futures. The S&P 500 Index declined 0.4% as of 10:03 a.m. in New York, following its biggest one-day gain since April 2025, while the Nasdaq 100 Index dropped 1.6%.\n\nOn Monday, the tech-heavy Nasdaq 100 surged nearly 7%, adding more than $2.5 trillion in market value, with Nvidia accounting for a significant portion of the gains.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 10:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ex-Petrofac executives accused of paying millions to win $3.4bn of contracts", "full_content": "Marwan Chedid and George Salibi are on trial for involvement in alleged bribery for UAE oil and gas deals between 2012 and 2018", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 10:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Real Madrid vs PSV Live Streaming: Likely Lineups; How To Watch Champions League Match On TV, Online?", "full_content": "Real Madrid will look to extend their winning run in the UEFA Champions League when they take on PSV at Estadio Santiago Bernab\u00e9u. Check the match date, kick-off time, likely lineups and live-streaming details in India.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 10:30 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Bruised S&P 500 seen gaining more than 12% by end-2027", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:18 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Venezuela moves toward possible debt restructuring with release of economic framework", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:18 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Royal Gold at Renmark virtual non-deal roadshow: growth and discipline", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:16 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Schumer accuses Huang of violating US export law", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:16 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nasdaq slides as AI trade uncertainty remains despite explosive Nvidia-led rally", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:15 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "LuqEE Reaches Milestone of 100 Bitcoin Cash Blocks Found Through Its Solo Mining Platform", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 12:09 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Kalshi daily volume of \u2018perps\u2019 trading begins to top its prediction markets", "full_content": "Kalshi is known for its prediction markets across sports , politics and culture .\n\nBut now, for the first time, perpetual futures, Kalshi's second financial product, has surpassed the notional trading volume of its event contracts on consecutive days.\n\nOn Thursday, perpetual futures \u2014 commonly known as \"perps\" \u2014 on Kalshi saw $3.4 billion in notional volume as artificial intelligence laboratory Anthropic stock debuted on public markets while the rest of the market sold off . That exceeded about $3 billion in notional volume for Kalshi's prediction markets on the same day.\n\nPerps are futures-style contracts where there is no expiration and traders do not need to own the underlying asset. Contracts instead continuously track the price of an asset, with funding payments to keep the contract price aligned with that of the market. Funding payments are made periodically between holders of short or long positions.\n\nPerps trading surpassed event contracts one day in September, but on Friday perps topped prediction markets volume for a second day. Now Kalshi expects that performance to continue as it introduces perps tied to more individual stocks. On Monday, for example, Kalshi launched contracts linked to Anthropic .\n\nKalshi was the first to debut perps in the U.S. after winning federal regulatory approval in May to list perps tied to cryptocurrencies.\n\nPerps trading volume includes any leverage that speculators acquire along with their trade, while event contracts are fully collateralized \u2014 for now .\n\nSince the original launch in May, Kalshi has received approval to introduce perps tied to metals , crude oil, stock indexes and individual stocks.", "source": "CNBC Finance", "pub_date_str": "25 Nov 2026, 12:04 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Consumer confidence shoots up after Democrats' midterm victories \u2014 though inflation worries persist", "full_content": "Consumers grew significantly more optimistic in November in the wake of the midterm elections , with a growing number of Americans now seeing improvement in the labor market and expecting inflation to cool.\n\nThe Conference Board survey released Tuesday showed improvement across the board, with the headline confidence index jumping to 103.3, up 11.4 points from October and much better than the Dow Jones consensus forecast for 92.2.\n\nConfidence among Democrats and independent voters improved sharply, the Conference Board said, while confidence among Republican respondents fell slightly. Still, confidence among Republicans remained the highest among the three groups.\n\nWhile respondents \"continued to express frustration with high prices and rising costs,\" they also \"cited hope for the general economy,\" said Fergus McCormick, the board's senior economist for global indicators.\n\nThe survey comes with the Federal Reserve continuing to try to bring down inflation, which has run above the central bank's 2% target for some 5\u00bd years. The Fed is expected to raise its benchmark interest rate by a quarter percentage point when it meets again in two weeks.\n\nDespite the lingering worries about the cost of living \u2014 a centerpiece issue during the midterms \u2014 the survey's present situation and expectations indexes both posted strong gains. Inflation expectations for 12 months from now fell for the second straight month but remained high at 5.7%.\n\nThe survey's closely watched gap between jobs considered \"plentiful\" versus \"hard to get\" widened to 12.4 percentage points. The \"plentiful\" side rose to 30.8% from 26.2% while \"hard to get\" fell to 18.4%, down 3 percentage points.\n\nThe survey results are the second in the past week to reveal that Americans are growing more optimistic about the economy. The University of Michigan's November survey, released Friday, showed a 7.3% increase since October, with a similar partisan split.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:04 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Katie Stockton sees a comeback ahead for this beaten-down tech stock", "full_content": "Keysight Technologies could rally toward $329 as momentum improves.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 12:02 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia shares fall 7% as Huang comeback rally cools", "full_content": "Nvidia shares fell around 7% on Tuesday, paring a massive Monday rally that was sparked by the return of Jensen Huang as CEO.\n\nOther U.S. semiconductor stocks also trended lower after posting strong increases Monday. Micron declined 10%, Marvell Technology lost 8%, Arm Holdings dropped over 7% and AMD shed around 9% in midday trading.\n\nNeoclouds also gave back some of their Monday gains, with CoreWeave losing over 12%, Iren declining nearly 13% and Nebius shedding 11%.\n\nHuang, who resigned as CEO of Nvidia earlier this month after admitting to an extramarital affair, was reinstated on Monday. The stock closed over 30% higher following the news of Huang's return.\n\nThe company's board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him.\n\nPresident Donald Trump also claimed he was personally involved in Huang's return. The president told CNBC that he spoke with the chipmaker's board before it reversed course and reinstated its co-founder.\n\n\"I made the deal,\" Trump told CNBC's Eamon Javers on Monday during an interview on \"Squawk on the Street.\"\n\nTrump said Nvidia's board asked for guarantees that Huang, who resigned less than two weeks ago, was not a threat to national security.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 12:00 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia live updates: Nvidia stock falls as exuberance fades after Jensen Huang's return as CEO - Yahoo Finance", "full_content": "Nvidia live updates: Nvidia stock falls as exuberance fades after Jensen Huang's return as CEO Yahoo Finance Stock Market Today: Tech Stocks Slide Back After Epic Rally WSJ Markets Slide as Tech Stocks Partly Reverse Nvidia-Sparked Rally The New York Times Nasdaq declines as Nvidia slides, giving back part of Monday\u2019s rally: Live updates CNBC Stock Market Today: Dow up 400 points, S&P 500 and Nasdaq in retreat a day after Nvidia's 31% surge; Dell results on tap: live updates MarketWatch", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 12:00 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Utah drops criminal charges against Kalshi founders after company suspended operations in state", "full_content": "Utah on Tuesday dismissed criminal charges against Kalshi and its two co-founders following the decision by the prediction market platform on Monday to suspend operations in the state.\n\nThe state originally filed the 14 criminal charges against the company and founders Tarek Mansour and Luana Lopes Lara on Oct. 28, claiming that Kalshi operated an illegal gambling operation in the state.\n\nThe Commodity Futures Trading Commission \u2014 the federal regulator for prediction markets which views itself as the sole body that can develop rules over the growing industry \u2014 sued Utah the day before the state announced its charges.\n\nMansour and Lara were slated to appear in a Utah district court on Dec. 4, according to court documents.\n\nHowever, Kalshi suspended operations in Utah on Monday, citing legal uncertainty. Utah Attorney General Derek Brown celebrated the decision in a statement announcing the move to dismiss the state's charges.\n\n\"Every company in this space should take note,\" he said. \"If they promote, support, or enable gambling, we will hold them accountable.\"\n\nBrown's office noted in the statement that dismissal is without prejudice, meaning if Kalshi were to begin operations again in the state the charges could be refiled.\n\n\"Good faith jurisdictional disagreements should never be criminalized,\" Kalshi's general counsel Yaakov Roth said in a post on X . \"We stand ready to work with State AGs on reasonable interim measures until courts resolve the dispute over who regulates prediction markets.\"", "source": "CNBC Finance", "pub_date_str": "24 Nov 2026, 11:58 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Retail turnarounds are taking hold just in time for the holiday season", "full_content": "Once-struggling retailers are entering the holiday quarter with improved performance and sales momentum as turnaround efforts begin to resonate with shoppers.\n\nA handful of earnings reports on Tuesday pointed to a mix of factors behind the strong results, including a resilient consumer, stronger execution and demand for the right products at the right price.\n\nKohl's reported comparable sales growth of 1.2% for the period ended Oct. 31 and raised its full-year outlook as CEO Michael Bender said customers \"have remained resilient\" but are \"migrating to value with their purchases.\"\n\nHe tied improvement to the company's work on product assortment, store experience and value.\n\nBest Buy also on Tuesday posted its highest comparable sales growth in five years , at 6.1%, which prompted the electronics retailer to raise its full-year outlook.\n\n\"We have a tremendous amount of momentum,\" CEO Jason Bonfig told CNBC in an interview. \"The fact that we saw pretty much broad-based growth across almost all of our categories is a lot of momentum that we're very excited about.\"\n\nThe company also credited execution, market share gains and a compelling product cycle alongside growing customer demand.\n\nAt Dick's Sporting Goods , quarterly comparable sales rose 2.6% at the core business and 0.5% at Foot Locker. CEO Lauren Hobart said \"all income demographics grew\" and the company \"didn't see trade-down from best to better or better to good.\"", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:51 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia revived the AI trade, but investors still have reasons to hedge", "full_content": "How to play defense and protect your portfolio if the AI trade fizzles again.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:48 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "As Anthropic falls below its IPO price, here's how big-money traders are reacting", "full_content": "Anthropic shares are back trading below the IPO price after a 13% sell-off Tuesday and a 1.5% drop Monday, despite a broad rally in most big-tech AI names. Trading below $76 Tuesday, the stock's now 8.5% below its IPO level and 34% below its intraday high of $115.\n\nIt took just four days for ANT to fall below its offering price, compared to 21 trading days for SpaceX, which rallied out of the gate.\n\nOptions volume on the stock is picking up as the shares drop and implied volatility jumps to 96, according to ThinkOrSwim data. Almost 500,000 options traded by noon E.T. Tuesday for a total premium of about $250 million, the sixth-most active single-stock options in the market, SpotGamma data show.\n\nAlmost 300,000 puts traded versus about 200,000 calls, but the sentiment implied by the trades was not overtly bearish, and judging by the biggest single trades of the day, traders are divided on what happens next.\n\nANT intraday chart The biggest single option trade of the day was a $7.5 million purchase of almost 11,000 75-strike puts expiring in mid-December. The trader paid above the ask, suggesting an eagerness to get the trade done at a cost of $6.85, according to SpotGamma. With Anthropic trading at $77, the position needs Anthropic to drop 11% by expiry to pay off.\n\n\"Anthropic remains bumpy as investors add risk to other names,\" said noted tech analyst Dan Ives.\n\nOnly one obvious call purchase appeared among the top 10 trades: a 3,000-lot purchase of 85-strike calls expiring Jan. 15 that cost $7.10 each, for a total of $2.2 million. That trade needs Anthropic to rally 19% within the next two months to break even.\n\nArguably the most interesting action was a string of almost a dozen put sales, ranging from $400,000 to $1.6 million each, all within moments of each other, selling the 120-strike puts expiring Dec. 18. The puts bring in $40 each, meaning the breakeven for the trade is at $80.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:47 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Hewlett Packard Enterprise shares crash 16%, set for biggest 1-day fall in 18 months; what went wrong?", "full_content": "Shares of Hewlett Packard Enterprise (HPE) came under heavy selling pressure in Tuesday's trade, plunging 16% to their lowest level since late May, as concerns over the company's margin outlook and prolonged supply shortages overshadowed strong fourth-quarter (Q4) earnings and upbeat guidance.\n\nOn Monday, the company reported fourth-quarter adjusted earnings of $1.43 per share, beating Wall Street estimates. Revenue rose 50.3% from a year earlier to $14.55 billion, also exceeding expectations.\n\nThe company recorded $5.7 billion in AI orders during Q4, while its AI backlog reached a record $10.5 billion.\n\nFor the first quarter of fiscal 2027, HPE expects adjusted earnings of $1.30 to $1.40 per share on sales of $14 billion to $14.6 billion. Analysts had expected earnings of $1.07 per share and revenue of $12.99 billion, respectively.\n\nFor the full year, the company expects adjusted earnings of $5.05 to $5.35 per share and revenue of $59.4 billion to $63.1 billion, compared with analyst estimates of $4.76 per share and $55.1 billion, respectively.\n\nHowever, the upbeat outlook failed to reassure investors, as Chief Financial Officer Marie Myers said gross margins could soften through fiscal 2027 as artificial intelligence systems account for a larger share of sales. She expects this product mix to lean towards the second half of the fiscal year and said synergies could help offset some of the pressure.\n\nMeanwhile, CEO Antonio Neri warned that supply constraints could persist for nearly two more years.\n\n\u201cIn fact, we continue to operate in a significantly supply-constrained environment. We expect supply of memory, NAND, and many other critical components to remain constrained to at least the second half of calendar year 2028,\u201d Neri said.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 11:42 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Micron Stock Is Counting on a Buyback Bounce. Why It\u2019s No Slam Dunk. - Barron's", "full_content": "Micron Stock Is Counting on a Buyback Bounce. Why It\u2019s No Slam Dunk. Barron's Jensen Huang is back at Nvidia. Should AMD be worried? Yahoo Finance Here's where we stand on AMD shares after Jensen Huang's return to Nvidia CNBC AI Bulls in Asia Get Huang Back But the Harder Questions Remain Bloomberg.com The \"bank of AI\" is back in business Axios", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 11:42 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "AG Blanche, FBI\u2019s Patel dodge questions about Jensen Huang investigation", "full_content": "Attorney General Todd Blanche and FBI Director Kash Patel on Tuesday dodged questions about the conclusions of an investigation President Donald Trump cited to push Nvidia 's board to bring back J ensen Huang as CEO.\n\nAsked by a reporter whether the Department of Justice had investigated Huang and the results of that probe, Blanche said, \"What the president said is that he talked to a lot of people going into the decision that he made to encourage the board to reinstate him.\"\n\n\"And so I'm not going to get into communications I have with the president,\" Blanche said at a news conference in Washington, D.C.\n\nHuang was reinstated as CEO of Nvidia on Monday morning, less than two weeks after resigning amid allegation had had affairs with a purported spy for China and two Nvidia employees, as well as concerns that advance semiconductor chips made by his company had been diverted to China in violation of U.S. law.\n\nIn an interview with CNBC on Monday, Trump was asked what led him to personally confirm to Nvidia's board that Huang was not a national security risk.\n\n\"We've done a very thorough investigation, and the investigation showed that he did, I mean, he had bad judgment having to do with somewhat unrelated incidents, but he did nothing wrong,\" Trump replied.\n\nTrump in a Truth Social post on Monday said the U.S. government had no reason to believe Huang's return to the company \"poses any risk to National Security,\" and that Blanche had confirmed the government \"does not possess evidence that he has engaged in any unlawful conduct.\"\n\nNvidia, in its statement Monday announcing Huang's return, said, \"The Board received input from senior levels of the United States government, and based on that input, the Board is confident that Mr. Huang's reinstatement poses no national security risk.\"", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Trump Account contributions from friends and family pass $1 billion mark, Treasury says", "full_content": "Families and friends have collectively contributed more than $1 billion to Trump Accounts since the July 4 launch, bringing total deposits to more than $9 billion, the U.S. Department of the Treasury said Tuesday in an announcement exclusively provided to CNBC.\n\nThe $1 billion in Trump Account deposits come from more than 3 million individuals, according to the agency. That total does not include the government's seed money or philanthropic gifts from donors such as Michael and Susan Dell .\n\n\"The American people are investing in Trump Accounts with a generosity that represents the finest instincts of our national character,\" U.S. Treasury Secretary Scott Bessent said in a written statement.\n\n\"Trump Accounts are a transformative government program for American children. It is the largest government start-up in American history,\" Internal Revenue Service CEO Frank Bisignano said in the statement.\n\nAlso known as 530A accounts, Trump Accounts are open to any U.S. child under 18 with a Social Security number.\n\nParents, guardians, grandparents and others can collectively contribute up to $5,000 per child per year in after-tax dollars up until the year before the beneficiary turns 18. The annual contribution limit is indexed for inflation after 2027.\n\nChildren born from 2025 through 2028 may receive a one-time $1,000 deposit from the Treasury. Other funds may also be available, depending on certain criteria.\n\nMost recently, Snowflake chairman Frank Slootman and his wife, Brenda, announced they would give $1,000 to every child in Montana born in 2023 and 2024.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 11:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic falls below IPO price as tech rally fades", "full_content": "Investor relief over reinstatement of Jensen Huang as Nvidia CEO subsides", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 11:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The AI debt market isn\u2019t convinced the worst is over for investors", "full_content": "Stocks rebounded on Monday, but credit markets remain cautious.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 11:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Anthropic sinks 8%, falling below $83 IPO price, but analysts are still largely positive", "full_content": "Shares of Anthropic fell 8% on Tuesday, sending the stock below the artificial intelligence company's $83 IPO price.\n\nThe AI lab's stock has been sinking steadily since opening at $111.50 on the Nasdaq on Thursday, after Anthropic raised $81.3 billion in the largest offering of all time. Investors eagerly awaited Anthropic's debut in hopes that the company would revitalize the broader AI trade, which has been volatile in recent weeks over concerns about the feasibility of a multitrillion-dollar infrastructure buildout.\n\nAnthropic's initial public offering was oversubscribed, and roughly half of the institutional investors that placed orders for the stock were left empty-handed, as CNBC previously reported . But at least for now, as the market wavers, those firms don't appear to be racing to scoop up shares.\n\nChip stocks Nvidia , Advanced Micro Devices and Intel , as well as neoclouds CoreWeave , IREN and Nebius , all fell during intraday trading on Tuesday. The market is still reeling after Nvidia reinstated Jensen Huang as CEO, a dramatic reversal from his ouster earlier this month. Nvidia shares surged more than 30% on Monday, but pared those gains Tuesday.\n\nAnalysts at Canaccord Genuity said Tuesday that they're focused on Anthropic's long-term potential.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 11:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Waymo says recall prompted by 11 new incidents of robotaxis entering closed freeway lanes", "full_content": "Alphabet -owned Waymo said Tuesday its new recall of nearly 4,500 self-driving vehicles in the U.S. was prompted by 11 incidents of robotaxis entering closed freeway lanes since Oct. 1, including three on a single day this month.\n\nOn Friday, Reuters first reported Waymo was issuing two recalls for its robotaxis over incidents involving closed freeway lanes and manual traffic control. Last week, Waymo said it halted operations of its vehicles on U.S. freeways \u200bafter a California regulator barred its vehicles from freeways in the state.\n\nWaymo told the National Highway Traffic Safety Administration in a filing released Tuesday that three Waymo vehicles entered freeway lanes marked with cones as closed for construction on Nov. 9, just three days after the company \"updated the approved scope of operation to reduce exposure to closed freeway lanes.\"\n\nWaymo said there were no collisions or injuries reported from the closed freeway events, adding it is still working \u200bon the recall remedy.\n\nThe California ban, \u200bwhich took effect this month, resulted from a series of incidents in which Waymo robotaxis entered active construction zones, the California Department of Motor Vehicles said.\n\nIn June, Waymo issued a similar recall for nearly 3,900 robotaxis that drove past ramp closure signs into pre-planned freeway construction zones or entered freeway lanes with active construction by driving between cones.\n\nThe \u200cmanual \u2060traffic recall is to ensure self-driving vehicles better respond to manual commands at intersections from law enforcement or other emergency personnel and follows a May 8 collision in which a Waymo followed directions from an officer, but the officer was then temporarily obstructed. That update was completed on Nov. 6.\n\nEarlier this month, NHTSA said it opened a recall query into Waymo vehicles after numerous incidents of its robotaxis passing \u200bstopped school buses.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 10:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks making the biggest moves midday: Dick's Sporting Goods, Analog Devices, Nvidia, Pinterest & more", "full_content": "Retailers bucked the broader market decline Tuesday, with Kohl's, Dick's Sporting Goods and Abercrombie & Fitch rising on strong quarterly results and guidance.\n\nNvidia, meanwhile, fell as the chipmaker gave back some of the previous session's sharp gains. Anthropic followed Nvidia lower, dipping below its IPO price.\n\nPinterest and Kymera Therapeutics both rallied more than 10%, while Analog Devices dropped double-digits.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nMiners Freeport McMoRan and Southern Copper resumed their retreat Tuesday alongside the base metal known as \" Dr. Copper \" by economists and investors for its vital role in key parts of the economy.\n\nFreeport fell almost 6% while Southern dropped 5%. Both have fallen for four of the past five sessions. Copper itself is down another 5% Tuesday.\n\nKymera Therapeutics traded more than 10% higher after the biotech company announced an upsized secondary stock offering at $150.37 per share. The company expects to raise $1.75 billion from the sale, before fees and expenses.\n\nAnalog Devices dropped 18% even after the chipmaker reported fiscal fourth-quarter results that beat expectations. The company earned $4.06 per share, excluding certain items, on revenue of $4.37 billion. Analysts polled by FactSet expected a profit of $3.90 per share on revenue of $4.33 billion.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 10:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chinese media hail Huang\u2019s Nvidia return with warning over \u2018witch-hunts\u2019 - The Guardian", "full_content": "Chinese media hail Huang\u2019s Nvidia return with warning over \u2018witch-hunts\u2019 The Guardian Jensen Huang went to war with Washington \u2014 and won a path to China The Washington Post China Can\u2019t Expect the Old Jensen Huang Back Bloomberg.com With Jensen Huang back at Nvidia's helm, what's next for export controls? WBUR Beyond Jensen Huang, Nvidia and Alleged Spies: Court Records Reveal How Beijing Targets US Troops Military.com", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 10:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trade Setup For Nov 25: GIFT Nifty Signals Strong Rebound, Analysts See 26,000 As Key Hurdle To Cross", "full_content": "The 62,000-61,900 zone would likely to act as an immediate support area for the Bank Nifty index, as per analysts.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 10:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia shares tumble 9% after biggest rally in over two decades as AI-related concerns return", "full_content": "With After registering its biggest one-day gain in more than two de     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
