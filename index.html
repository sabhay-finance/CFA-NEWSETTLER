<script>

    const allData = {"general": [{"title": "Kisan Vikas Patra: Want to transfer, pledge or prematurely close your account? Here's what the rules say\u2026", "full_content": "A post office investment scheme, the Kisan Vikas Patra (KVP) is a 115-month (9 years and seven months) investment, where you can deposit a lump sum amount to double over the full tenure.\n\nStarted in 1988 as an initiative to help farmers save for the long term, KVP is now available to all Indian citizens above the age of 10 years.\n\nFor minors (below 18 years of age) an adult can open the account and then transfer the same once they attain major age. The scheme has a minimum start investment of \u20b9 1,000, with no upper cap.\n\nAll deposits require Aadhaar as proof of identity; and since 2014, investments above \u20b9 50,000 require PAN Card proof, while for deposits of \u20b9 10 lakh and more investors must also show income proof.\n\nA low-risk small savings certificate guaranteed by India Post, KVP offers interest rate of 7.5% for this quarter. The money invested doubles on maturity and interest earned is taxable. There is no deduction under Section 80C , but the account can be transferred to another user and can have up to three joint holders. Further, TDS is deducted at 10% every year on the interest credited.\n\nAccording to the official website, the account may be closed prematurely at any time before maturity under the following circumstances:\n\nIn case of premature closure of account, the account holder or nominee will receive the principal amount along with simple interest calculated at the rate applicable from time to time to Post Office Savings Account for the complete months for which the account has been held.\n\nAlso, for accounts closed any time after two years and six months from the date of opening, the amount, inclusive of interest shall be payable.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:58 PM IST", "pub_date_relative": "1m ago"}, {"title": "DOJ accuses Minnesota federal judges of misconduct for NY Times immigration interviews", "full_content": "Th e Department of Justice on Wednesday filed a judicial misconduct complaint against all but one Minnesota federal judges on active status for interviews they gave to The New York Times that criticized the Trump administration's handling of immigration enforcement cases in the state.\n\nThe DOJ asked the 8th Circuit U.S. Court of Appeals to force the recusal of all seven judges who spoke with The Times from any case involving the Department of Homeland Security.\n\nThe complaint also asks the 8th Circuit, which handles cases arising from the District of Minnesota , to investigate what the DOJ called \"the judges' improper and unethical conduct\" in speaking to the newspaper.\n\nThe complaint singles out Senior Judge Patrick Schiltz and Senior Judge John Tunheim, who were quoted by name in the article, which ran under the headline \"Trump's Minnesota Surge Threatened Democracy, Judge Warns.\"\n\nSchiltz until July 1 had served as chief judge in the District of Minnesota, having succeeded Tunheim in that role in 2022.\n\nSchiltz had issued a Jan. 28 order demanding that Immigration and Customs Enforcement stop violating orders issued by Minnesota federal judges in cases related to a surge in immigration enforcement actions in the state. Schiltz told The Times that ICE's violations of the orders \"created a grave threat to the rule of law.\"\n\nTunheim was quoted by The Times after a paragraph that said the judges considered that most of the detainees whose cases they handled \"seemed to be ordinary people with homes and jobs,\" and not immigrants who DHS officials claimed were \"the worst of the worst.\"\n\n\"They weren't arresting, in my view, people who were dangerous criminals on the street,\" Tunheim said, according to The Times.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 11:54 PM IST", "pub_date_relative": "4m ago"}, {"title": "This chart shows that buying and holding stocks beats \u2018sell in May and go away\u2019 and other gimmicks", "full_content": "Followers of \u2018sell in May and go away\u2019 have lost out on a stock rally", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 11:50 PM IST", "pub_date_relative": "9m ago"}, {"title": "Crude oil exports through the Strait of Hormuz hit prewar levels, but fuel shipments remain constrained", "full_content": "Crude oil exports from the Strait of Hormuz have basically returned to levels normal before the Iran war, as U.S. military escorts have boosted shipments and pipelines have redirected flows.\n\nCrude transiting Hormuz reached a seven-day average of 13.5 million barrels per day as of Monday, which matches a prewar baseline for shipments through the strait, according to data published Wednesday by Kpler, a firm that tracks tankers and global trade flows.\n\nIran has claimed throughout the war that it controls Hormuz and has declared the closure of the strait multiple times. But Tehran is losing its influence as strong volumes pass through Hormuz, said Matt Smith, director of commodity research at Kpler.\n\nCrude oil shipments from the Middle East region, including the Persian Gulf and Red Sea, are sometimes higher than prewar levels. The region reached a seven-day average of 19.5 million bpd as of Monday, surpassing a prewar baseline of about 17 million bpd, the Kpler data showed.\n\nKpler But the recovery is uneven, said Natasha Kaneva, head of global commodities strategy at JPMorgan. The \"crude market has largely normalized even as refined product supplies remain constrained,\" Kaneva said.\n\nThe world faces a global fuel crisis as supplies from the Middle East are constrained and Ukraine pounds Russian refneries. Refined products shipped through Hormuz are at a seven-day average of 677,000 bpd as of Monday compared to 3.6 million bpd before the war, according to Kpler.\n\nCrude and product shipments together stood at a seven-day average of 14.2 million bpd which is about 80% of the Hormuz prewar baseline of about 17 million bpd, the data showed.\n\nThe global fuel supply shortfall has pushed diesel prices in the U.S. to record highs, which poses a major threat to health of the economy. President Donald Trump is considering an export ban as he faces political pressure from Republican lawmakers ahead of the midterm elections.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 11:47 PM IST", "pub_date_relative": "12m ago"}, {"title": "\u2018I\u2019d rather be on a beach in Bali\u2019: My husband resents my $8 million net worth. Should I pay for his retirement?", "full_content": "\u201cWe have an ironclad prenup.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 11:45 PM IST", "pub_date_relative": "14m ago"}, {"title": "FICO stock options flow signals bearish bets after regulatory blow", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:41 PM IST", "pub_date_relative": "18m ago"}, {"title": "Mcdonald\u2019s stock hits 52-week low at 232.05 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:37 PM IST", "pub_date_relative": "22m ago"}, {"title": "SEC clears Tesla-crafted auto-vote plan for wide use, worrying activists", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:37 PM IST", "pub_date_relative": "22m ago"}, {"title": "A pilot brawl, then a rapid descent: passengers recount chaos on flydubai flight", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:36 PM IST", "pub_date_relative": "22m ago"}, {"title": "Daines releases full text of crypto tax plan - Politico", "full_content": "Daines releases full text of crypto tax plan Politico Vault: Crypto tax bill adds momentum Punchbowl News Digital asset tax reform bill advances with broad business implications RSM ICYMI: Clarity, crypto tax and committee politics Punchbowl News", gnificant, with the index falling nearly 6% during the month. This marked the sharpest monthly decline since March 2026 and the steepest September fall since 2016.\n\nThe day\u2019s price action resulted in the formation of a small, red-bodied candle with a long upper shadow. The index opened lower and gradually moved higher during the session, touching an intraday high of 22,809.35. However, the recovery failed to sustain as selling pressure emerged at higher levels, dragging the index lower by the close.\n\nAlthough the index formed a higher high and higher low structure compared to the previous session, there is no clear confirmation of a reversal yet. The attempted hammer formation did not receive confirmation, while the long upper shadow indicates that sellers continue to remain active near higher levels.\n\nFor a meaningful reversal, the index needs to form a strong positive candle and demonstrate sustained buying interest.\n\nWith a long weekend approaching, market participation could remain subdued on Thursday. The ongoing decline is set to enter its eighth consecutive week, and since eight is a Fibonacci number, the probability of a short-term pullback cannot be ruled out.\n\nAdditionally, the index is approaching its 200-week moving average, which remains an important long-term support zone. The immediate support area for the index is placed between 22,500 and 22,600.\n\nFrom a technical perspective, the index has entered an oversold zone and is trading significantly below key averages. It is currently around 5.36 per cent below its 50-day moving average (50-DMA), while the Bollinger Bands continue to slope sharply downward, indicating that the recent decline has been stretched.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:32 PM IST", "pub_date_relative": "26m ago"}, {"title": "US trade court probes Trump\u2019s \u2019forced labor\u2019 tariffs", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:30 PM IST", "pub_date_relative": "28m ago"}, {"title": "Jobless claims, manufacturing PMI, and ISM data due Thursday", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:30 PM IST", "pub_date_relative": "28m ago"}, {"title": "Solana Company raises $15M through stock and warrant sale", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:30 PM IST", "pub_date_relative": "28m ago"}, {"title": "Stock Market Today: Nasdaq Jumps After GDP, PCE Data Point to Strength in U.S. Economy \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Jumps After GDP, PCE Data Point to Strength in U.S. Economy \u2014 Live Updates WSJ 10-year Treasury yield turns higher as traders look past inflation data, await jobs report CNBC Yield on 10-Year Treasury Surges to 24-Year High WSJ Equities end slightly lower as bond yields hold near multi-decade highs reuters.com Stock market today: Dow, S&P 500, Nasdaq wobble as 30-year Treasury yield climbs to 24-year high Yahoo Finance", "source": "Google News Business", "pub_date_str": "30 Sep 2026, 11:30 PM IST", "pub_date_relative": "29m ago"}, {"title": "NPS Swasthya: \u20b91 lakh to \u20b930 lakh \u2014 Check health insurance cover, deductibles the scheme likely provides", "full_content": "The Pension Fund Regulatory and Development Authority's new health-focused pension product, the NPS Swasthya, is expected to launch in October, as per reports. Speaking to reporters at an event in Mumbai on Thursday, 10 September, PFRDA Chairman Sivasubramanian Ramann had also told reporters the authority is likely to launch the product within 30 days \u2014 sometime in October.\n\nHe said that guidelines could be expected before the formal launch, as testing under proof of concept (PoC) received encouraging response. \u201cWe are working on it (NPS Swasthya ). The PoC worked very well\u2026 a very encouraging response that has led us to finalise the product,\u201d he stated.\n\nRamann added that the Central Recordkeeping Agencies ( CRAs ) are working on the technology required for the product and the formal launch could be expected \u201chopefully in about 30 days' time\u201d, i.e. mid-October.\n\nLast week Outlook Money cited sources to report that NPS Swasthya is due for formal launch on 1 October.\n\nDeveloped in the PFRDA's regulatory sandbox framework, the PoC tested how healthcare benefits could be integrated with the National Pension System ( NPS ) architecture.\n\nExplaining how the product would work, Ramann said payment mechanism for the proposed product would work directly between the pension account, insurer and hospital. \u201cWhat is important in the NPS Swasthya is my ability to pay money to the hospital directly. So, from the pension account, money will release and go directly to the hospital. Then the health benefit administrator, through the insurance company, will release the top-up insurance , which will go to the hospital,\u201d he explained.\n\n\u2013 First-year health insurance premium, including applicable taxes.\n\n\u2013 At least \u20b9 1,000 towards the NPS Swasthya investment account. The minimum subsequent contribution is \u20b9 10.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:22 PM IST", "pub_date_relative": "36m ago"}, {"title": "US crude oil output rose in July, while petroleum demand declined, EIA says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US crude oil output rose in July, while petroleum demand declined, EIA says Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US crude oil output rose in July, while petroleum demand declined, EIA says SECTIONS US crude oil output rose in July, while petroleum demand declined, EIA says Reuters Last Updated: Sep 30, 2026, 11:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In July, US crude oil production climbed to 13.95 million barrels per day, up from June\u2019s figures. Despite the production surge, the demand for crude oil and petroleum products dropped to 20.61 million barrels per day. Meanwhile, gross natural gas production reached a remarkable 137.0 billion cubic feet per day, with Texas's output increasing to 40.1 billion cubic feet per day, contrasting slightly with a decline in Pennsylvania.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:16 PM IST", "pub_date_relative": "42m ago"}, {"title": "Senate Democrats sink 'toothless' stock trading ban, data center bill in last act before election recess", "full_content": "Senate Democrats on Wednesday defeated a pair of bills that aimed to address data center -related affordability concerns and limit Congress members' ability to profit on the stock market while in office, arguing both were watered-down proposals.\n\nThe data center bill, dubbed the Ratepayer Protection Act failed on a vote of 57-43. A second bill, known as the Stop Insider Trading Act, which also includes a controversial voter-identification provision, was defeated on a party-line, 53-47 vote. Both bills needed 60 votes to overcome the Senate filibuster.\n\nRepublicans will likely use the votes as fodder on the campaign trail this fall, as the GOP seeks to hold narrow majorities in both chambers despite President Donald Trump 's falling approval ratings and persistent concerns about affordability. The Senate is due to recess as soon as Wednesday, as lawmakers seeking reelection will return to their home states to campaign ahead of the 2026 midterm election .\n\n\"EVERY Senate Democrat just joined 94% of House Democrats in voting AGAINST banning congressional stock trading.,\" House Majority Leader Steve Scalise, R-La., posted to X immediately following the vote. The bill, he said, provides \"the accountability the American people demand. But every Democrat blocked it from becoming law.\"\n\nThe Ratepayer Protection Act , which passed the House on a 417-3 vote earlier this month, would establish a regulatory framework that states could consider adopting to require large artificial intelligence data centers to cover their own energy costs, rather than passing them down to customers.\n\nBut Democrats have railed against the measure. Senate Minority Leader Chuck Schumer , D-N.Y., called the proposal a \"toothless messaging bill\" in a speech in the Senate on Tuesday.\n\n\"The bill is a fraud. I can sum up the shortcomings of Republicans' data center bill with one word: optional,\" Schumer said.\n\nSen.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 11:14 PM IST", "pub_date_relative": "45m ago"}, {"title": "Govt Grants Security Clearance To New Air India CEO Tewolde Gebremariam", "full_content": "Tewolde Gebremariam will formally take charge as MD and CEO of Air India.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 11:10 PM IST", "pub_date_relative": "48m ago"}, {"title": "10 Nifty 50 stocks, including Infosys and TCS, posted double-digit losses in September as market sell-off deepens", "full_content": "Bajaj Finserv , Infosys, and TCS were among 10 Nifty 50 stocks that concluded the tumultuous September with double-digit losses and contributed heavily to the market decline.\n\nIndian stocks grappled with multiple challenges last month, including elevated crude prices, persistent selling by overseas investors, and surging global bond yields, leaving little room for bulls to intervene.\n\nThe sell-off spared no sector, with tech stocks continuing to bleed heavily, followed by FMCG and auto stocks. On the flip side, primary market activity remained robust in September, with offerings by National Stock Exchange of India and SBI Funds Management.\n\nBajaj Finserv was the top laggard among Nifty 50 constituents, falling 14.35% to \u20b9 1,731, its biggest monthly drop since March. The losses have widened the company's year-to-date decline. This was followed by Infosys and TCS, which fell 13.1% and 12.4%, respectively, as per the Trendlyne data.\n\nAmong auto stocks, Mahindra & Mahindra, Eicher Motors , Tata Motors Passenger Vehicles, and Maruti Suzuki India posted losses of 11.5%, 11.3%, 11.2%, and 10.5%, respectively. In terms of year-to-date losses, M&M and TMPV have declined 21% and 22.83%, respectively.\n\nLooking at consumer goods stocks, Nestle India was the worst performer, falling 10% to \u20b9 12.46%, marking its biggest monthly drop since October 2024, when it plunged 15.87%. Other stocks such as Titan Company and Bajaj Finance , fell by 11.3% and 11.2% respectively.\n\nNifty 50 plunged 6% in September, taking its 2026 decline to 13.5% and positioning it for its biggest annual decline since 2011, when it plunged 24.62%.\n\nOver the last two decades, the index has recorded double-digit losses only twice. From 2016 to 2025, the markets enjoyed an uninterrupted bull run, closing each of those years in the green. If not for the ongoing support from domestic mutual funds, largely backed by retail investors, the losses could have been even steeper.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:09 PM IST", "pub_date_relative": "49m ago"}, {"title": "Accelevation IPO: AI Infrastructure Firm Valued At $3.9 Billion As Shares Fall On Nasdaq Debut", "full_content": "Accelevation provides power distribution, cooling, structural systems and installation services for data centres, with revenue reaching $447.8 million in 2025.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 11:08 PM IST", "pub_date_relative": "50m ago"}, {"title": "US stocks: AI infra firm Accelevation valued at $3.9 billion as shares fall in Nasdaq debut", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: AI infra firm Accelevation valued at $3.9 billion as shares fall in Nasdaq debut Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: AI infra firm Accelevation valued at $3.9 billion as shares fall in Nasdaq debut SECTIONS US stocks: AI infra firm Accelevation valued at $3.9 billion as shares fall in Nasdaq debut By Reuters Last Updated: Sep 30, 2026, 11:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Accelevation's shares began trading below the initial public offering price of $18, reflecting current market instability. The company, which focuses on data center infrastructure, successfully raised $540 million by offering around 30 million shares at a debut price of $17.55. Founded in 2017, Accelevation achieved impressive revenue growth, totaling $447.8 million by 2025 amidst an uncertain U.S. IPO landscape that is impacting this listing season.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:08 PM IST", "pub_date_relative": "51m ago"}, {"title": "These bond strategies can help you get a safe 5% return on your cash", "full_content": "With U.S. Treasury yields on the rise, financial planners say they\u2019re seeing a growing interest in bonds, especially among investors looking to secure fixed income in retirement.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 11:08 PM IST", "pub_date_relative": "51m ago"}, {"title": "Trump touts economic wins in battleground states \u2014 like a $54 billion Alaskan pipeline \u2014 as the midterms draw closer", "full_content": "President Donald Trump is spending time this week talking up big job-creating projects in battleground states.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 11:07 PM IST", "pub_date_relative": "52m ago"}, {"title": "'Strong Indications\u2019 Iran Involved In RAF Fairford Incident, Says UK PM Andy Burnham", "full_content": "Burnham said British officials had remained in contact with their US counterparts and that cooperation would continue as investigators examine the case.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 11:06 PM IST", "pub_date_relative": "53m ago"}, {"title": "Trump's latest global tariffs face trade court challenge", "full_content": "President Donald Trump 's near-global tariff policy is being challenged in federal court \u2014 again.\n\nA panel of three judges at the U.S. Court of International Trade in Manhattan heard arguments Wednesday from a group of small businesses and Democratic-led states who say Trump's sweeping \"Section 301\" tariffs overstep the law.\n\nIt's the third time in less than two years that the courts have been asked to intervene against the president's attempt to impose sweeping tariffs on the vast majority of U.S. imports.\n\nThe latest tariffs put 10% or 12.5% rates on goods from 86 countries, covering 99.4% of U.S. imports. The Trump administration said they were imposed in response to the targeted countries failing to effectively enforce bans on the trade of goods produced using forced labor practices.\n\nBut an attorney for the challengers said at the start of Wednesday's hearing that a \"constellation of factors\" show the government's justification was a \"pretext\" in pursuit of reviving Trump's worldwide tariff regime.\n\n\"We know this was not the only reason that they did this,\" the attorney, Pratik Shah, said.\n\nOne of the judges pushed back. \"So what?\" she asked, probing whether the government having additional motivations for the tariffs was enough to rule against them.\n\nShah replied that the administration's \"unprecedented\" use of Section 301 \u2014 slapping tariffs of similar size on dozens of economies in \"one fell swoop\" after a truncated investigation \u2014 does not satisfy the statute's requirements.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 11:03 PM IST", "pub_date_relative": "55m ago"}, {"title": "iPhone Duo Production Hit By Low Yields; Full Recovery Could Take Up To A Year: Report", "full_content": "Apple's first foldable iPhone is reportedly facing assembly yields just above 60%, a shortfall that could take six months to a year to fix, while scalpers move in to exploit the resulting supply shortage.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 11:01 PM IST", "pub_date_relative": "57m ago"}, {"title": "RBI\u2019s new bulk FD rules from October 1: What changes for investors? Experts explain", "full_content": "The Reserve Bank of India (RBI) is changing the rules governing interest rates on bulk fixed deposits (FDs) from October 1, bringing greater transparency to how banks disclose rates for large deposits.\n\nThe changes are unlikely to affect most individual retail investors because they apply to bulk deposits, which for scheduled commercial banks generally start at \u20b9 3 crore.\n\nThe revised framework is aimed at making bulk-FD pricing more transparent and giving large depositors clearer information about the interest rate applicable to their deposits.\n\nUnder the revised RBI framework, banks will have to publish the interest rates applicable to bulk fixed deposits on their websites on every working day.\n\nThe rates must be disclosed by 10 AM, with a 10-minute window available for updating the information.\n\nBanks will also be required to pay interest on an eligible bulk deposit based on the rate disclosed in advance.\n\nThis gives large depositors a publicly available reference point to check the applicable rate before placing their money with a bank.\n\nFor scheduled commercial banks, a bulk deposit generally refers to a single rupee term deposit of \u20b9 3 crore or more. The threshold, however, is different for certain categories of banks.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:01 PM IST", "pub_date_relative": "58m ago"}, {"title": "\u2018I have $400,000 in equity\u2019: I\u2019m 80. Should I sell my house because of dangerous stairs \u2014 or spend thousands renovating?", "full_content": "\u201cGenerally, the advice I\u2019ve read says not to sell because I have a low-interest-rate mortgage.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 11:01 PM IST", "pub_date_relative": "58m ago"}, {"title": "The hottest trade of the year so far isn't AI. It's tanker stocks", "full_content": "Tanker stocks have been on fire this year. Here's why their momentum can stand", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kalshi traders see high odds Anthropic's IPO is announced this year", "full_content": "Kalshi traders see greater odds that Anthropic will announce an initial public offering this year after several news outlets reported that the company plans to warn investors in its IPO prospectus that its models are dangerous.\n\nChances that the AI company announces an initial public offering before November jumped from 4.7% on Sept. 28 to 16% Wednesday afternoon.\n\nKalshi traders see a greater than 60% chance an IPO is announced before December and nearly 80% likelihood that it happens before January. The contract asks when the company will announce an IPO and will be verified from news outlets and the company itself, according to Kalshi website.\n\nFounded in 2021, the AI company alerted speculative investors its models are a \"catastrophic or existential risk to humanity,\" according to a Reuters report . The same report said Anthropic warned AI can \"resist shutdown,\" hide or \"manipulate information\" or exhibit behavior \"resembling blackmail.\"\n\nAnthropic confidentially filed its IPO prospectus in June and is seeking a $2 trillion valuation when it goes public. Reuters reported the company plans to spend over $500 billion on cloud computing, among other infrastructure in the coming year.\n\nEscalating concerns on how AI can devastate humanity is coming from multiple companies. Anthropic's competitor, OpenAI , cited issues on AI safety when stating the company is not expected to go public this year.\n\nAnthropic CEO Dario Amodei wrote an essay requesting that AI companies slow down the process of improving their most advanced models earlier this month. OpenAI CEO Sam Altman and SpaceX CEO Elon Musk supported the proposal.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "The market search for balance sheet cash cow 'quality' stocks is shifting with mega AI spend", "full_content": "By one recent estimate, the AI buildout will cost more than most major economic transformations in the history of the U.S. economy.\n\n\"The projected buildout would be larger relative to the economy than the major U.S. canal, railroad, electrification, highway, and telecommunications investment booms,\" wrote Columbia Business School professor Stijn Van Nieuwerburgh in a paper delivered at a Brookings Institution event last week.\n\nThat AI spending is pressuring cash flow at major technology companies, among the most profitable in the history of the world. Meanwhile, the bond market is having trouble digesting the sheer amount of AI-related debt companies want to issue, pushing more deals into junk bond territory, and with AI among factors being cited in the recent market-wide rise in yields .\n\nFor some investors, the volatile situation is leading to a more intent focus on core balance sheet metrics led by free cash flow, which measures the cash left over after expenses, interest, taxes and long-term investments. Return on equity, net debt leverage and earnings consistency have also moved to a more central location on the radar of investors, said Todd Rosenbluth, head of research and editorial at TMX VettaFi.\n\nJust how much companies are spending to generate long-term growth on AI, and which companies can actually handle that capex load, are implicit in the flight to quality mindset.\n\n\"With expectations that spending on AI is being revisited, investors are turning toward companies that they have confidence will continue to grow despite the shifting environment,\" Rosenbluth said.\n\nAt times, investors are willing to pay a premium and take more risk for future growth, such as during periods of low interest rates and high growth. That sentiment is shifting somewhat amid rising rates and tightening monetary policy, with some investors becoming more cautious.\n\nIPOs are being pulled \u2014 some deals related directly to the AI buildout are reportedly being delayed at least for now.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bond markets resume sell-off after strong US data", "full_content": "Treasury yields rise further on news that economy grew faster than previously estimated, although personal consumption expenditures inflation falls", "source": "FT Markets", "pub_date_str": "30 Sep 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Textiles Ministry Extends RoSCTL Scheme Till Dec 31 For Apparel And Made-Ups Exports", "full_content": "During 2025-26, the Scheme benefited more than 15,400 exporters across over 444 districts, with the beneficiary base comprising predominantly MSMEs.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Instagram Rolls Out AI Assistant For Creators On Its Edits App", "full_content": "Instagram says the Edits AI assistant can identify patterns in creator performance over time and combine account data with platform trends and audience behaviour.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Inside Man: How Chinese spies used lies, love and betrayal to target the Federal Reserve", "full_content": "John Harold Rogers was walking Prada, his tiny spaniel, past a school bus stop in his suburban Washington neighborhood when FBI agents surrounded him. They handcuffed the former senior Federal Reserve official and took him into custody to face charges of spying for China .\n\nAn agent took Prada's leash, and investigators from multiple federal agencies began an intensive search of Rogers' house.\n\nThe now 65-year-old economist was arrested in January 2025 , days before he was set to travel to China with his wife, a Chinese national, and their 6-year-old daughter. Investigators believed that Rogers passed information about the Fed to a Chinese government spy, who, over more than a decade, helped him with his career, his finances and his marriage to a woman 24 years his junior.\n\nRogers' descent from senior Fed official to espionage suspect appears to have been driven by his desire for female companionship. This desire was exploited by a Chinese government agent, who became increasingly entwined in Rogers' professional and personal life. Rogers' indiscretion was later exploited by online blackmail scammers, ultimately leading to his downfall.\n\n\"The facts of this case read like a spy novel,\" federal prosecutor Nicholas Hunter told the jury at Rogers' trial in 2026. \"There was sex. There was money, manipulation, secret meetings with shady characters in China, fake identities, lies, trickery, and deceit. But this was real life. The events of this case all happened.\"\n\nThe crucial question, though, was whether Rogers was a spy or a dupe for Chinese intelligence.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trade Setup For Oct 1: Nifty Near 22,600 Support; Can Oversold Conditions Trigger A Bounce?", "full_content": "Intraday market outlook remains non-directional and level-based trading would therefore be the ideal strategy for day traders.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "How Brand Japan Is Getting India Hooked, From Anime To Uniqlo", "full_content": "India's interest in Japan extends beyond cars and electronics to anime, manga, fashion, and cuisine, reflecting a growing cultural exchange and consumer engagement.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fed watchdog finds renovation failures, but no grounds for criminal referral", "full_content": "The Federal Reserve' s inspector general determined management and oversight failures contributed to major cost overruns in the central bank's headquarters renovation, but found no grounds for a criminal referral, it said in a report released Wednesday.\n\n\"At no point during our evaluation did we find reasonable grounds to believe that a violation of federal criminal law had occurred requiring a referral to the U.S. Attorney General in accordance with the Inspector General Act,\" the report from the Fed's inspector general states.\n\nThe independent watchdog's findings could defuse one line of attack against former Fed Chair Jerome Powell , whom President Donald Trump and other critics accused of mismanaging the project and misleading Congress about it.\n\nThe IG's report cedes little to Powell's critics beyond his responsibility for management of the project as head of the organization. Instead it details a renovation project of the Washington facility that ballooned in cost by roughly a billion dollars from initial estimates as the Fed struggled with design changes and other issues.\n\nSome critics have alleged Powell perjured himself in testifying to the Senate about the project in June 2025. The IG's office didn't specifically set out to assess that claim, but the report said the watchdog had reviewed materials related to Powell's testimony. The report makes no claims about any misconduct related to that testimony.\n\nThe Fed's board wasn't involved in day-to-day decisions about the project, the report notes.\n\n\"Indeed, we would expect the [board] to delegate the day-to-day management of a large construction project,\" the report says.\n\nTrump has blamed a recent interest-rate increase on what he called a \"hostile\" board at the Fed, even though the decision was supported by Trump's new appointee as Fed chair, Kevin Warsh .", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Former NFL players are nearly four times as likely to die with brain damage. Is it time to boycott football?", "full_content": "New research says the problem is worse than we thought.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 10:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Agriculture sector binds India-Argentina partnership", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Agriculture sector binds India-Argentina partnership The Economic Times daily newspaper is available online now. Read Today's Paper Agriculture sector binds India-Argentina partnership SECTIONS Agriculture sector binds India-Argentina partnership By Dipanjan Roy Chaudhury , ET Bureau Last Updated: Sep 30, 2026, 10:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Argentine Ambassador Mariano Caucino highlighted the growing economic relationship between Argentina and India during a summit in Mumbai. Agriculture, particularly edible oils, serves as a core area of cooperation between the two countries. Argentina is experiencing record supplies of edible oils, significantly contributing to India's food security. In 2025, exports of soybean oil and sunflower products to India are expected to increase substantially.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nCan Fly91\u2019s flightpath for India\u2019s smallest airline defy the doomy past?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "30 Sep 2026, 10:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Saudi Arabia Denied Entry To Israeli Rescue Planes After Flydubai Emergency Landing: Report", "full_content": "More than 170 Israelis were stranded in Saudi Arabia after a flydubai flight from Dubai to Tel Aviv made an emergency landing at Tabuk Airport in northwestern Saudi Arabia.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "The U.S. economy is defying gravity. Here\u2019s all the good news.", "full_content": "Wall Street just got a health check on the U.S. economy \u2014 and almost all the news was positive.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 10:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves midday: Rogers, United Therapeutics, Moderna, FormFactor & more", "full_content": "These are the stocks posting the largest moves midday.", "source": "CNBC Finance", "pub_date_str": "30 Sep 2026, 10:34 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Kisan Vikas Patra: Want to transfer, pledge or prematurely close your account? Here's what the rules say\u2026", "full_content": "A post office investment scheme, the Kisan Vikas Patra (KVP) is a 115-month (9 years and seven months) investment, where you can deposit a lump sum amount to double over the full tenure.\n\nStarted in 1988 as an initiative to help farmers save for the long term, KVP is now available to all Indian citizens above the age of 10 years.\n\nFor minors (below 18 years of age) an adult can open the account and then transfer the same once they attain major age. The scheme has a minimum start investment of \u20b9 1,000, with no upper cap.\n\nAll deposits require Aadhaar as proof of identity; and since 2014, investments above \u20b9 50,000 require PAN Card proof, while for deposits of \u20b9 10 lakh and more investors must also show income proof.\n\nA low-risk small savings certificate guaranteed by India Post, KVP offers interest rate of 7.5% for this quarter. The money invested doubles on maturity and interest earned is taxable. There is no deduction under Section 80C , but the account can be transferred to another user and can have up to three joint holders. Further, TDS is deducted at 10% every year on the interest credited.\n\nAccording to the official website, the account may be closed prematurely at any time before maturity under the following circumstances:\n\nIn case of premature closure of account, the account holder or nominee will receive the principal amount along with simple interest calculated at the rate applicable from time to time to Post Office Savings Account for the complete months for which the account has been held.\n\nAlso, for accounts closed any time after two years and six months from the date of opening, the amount, inclusive of interest shall be payable.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:58 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Crude oil exports through the Strait of Hormuz hit prewar levels, but fuel shipments remain constrained", "full_content": "Crude oil exports from the Strait of Hormuz have basically returned to levels normal before the Iran war, as U.S. military escorts have boosted shipments and pipelines have redirected flows.\n\nCrude transiting Hormuz reached a seven-day average of 13.5 million barrels per day as of Monday, which matches a prewar baseline for shipments through the strait, according to data published Wednesday by Kpler, a firm that tracks tankers and global trade flows.\n\nIran has claimed throughout the war that it controls Hormuz and has declared the closure of the strait multiple times. But Tehran is losing its influence as strong volumes pass through Hormuz, said Matt Smith, director of commodity research at Kpler.\n\nCrude oil shipments from the Middle East region, including the Persian Gulf and Red Sea, are sometimes higher than prewar levels. The region reached a seven-day average of 19.5 million bpd as of Monday, surpassing a prewar baseline of about 17 million bpd, the Kpler data showed.\n\nKpler But the recovery is uneven, said Natasha Kaneva, head of global commodities strategy at JPMorgan. The \"crude market has largely normalized even as refined product supplies remain constrained,\" Kaneva said.\n\nThe world faces a global fuel crisis as supplies from the Middle East are constrained and Ukraine pounds Russian refneries. Refined products shipped through Hormuz are at a seven-day average of 677,000 bpd as of Monday compared to 3.6 million bpd before the war, according to Kpler.\n\nCrude and product shipments together stood at a seven-day average of 14.2 million bpd which is about 80% of the Hormuz prewar baseline of about 17 million bpd, the data showed.\n\nThe global fuel supply shortfall has pushed diesel prices in the U.S. to record highs, which poses a major threat to health of the economy. President Donald Trump is considering an export ban as he faces political pressure from Republican lawmakers ahead of the midterm elections.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 11:47 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FICO stock options flow signals bearish bets after regulatory blow", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:41 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Daines releases full text of crypto tax plan - Politico", "full_content": "Daines releases full text of crypto tax plan Politico Vault: Crypto tax bill adds momentum Punchbowl News Digital asset tax reform bill advances with broad business implications RSM ICYMI: Clarity, crypto tax and committee politics Punchbowl News", "source": "Google News Business", "pub_date_str": "30 Sep 2026, 11:36 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Goldman Sachs pushes rate hike expectation to December", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:34 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Google, Jabil among market cap stock movers on Wednesday", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:34 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ElevenLabs' valuation doubles to $22 billion on surging AI voice-agent demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a ElevenLabs' valuation doubles to $22 billion on surging AI voice-agent demand Powered By The Economic Times daily newspaper is available online now. Read Today's Paper ElevenLabs' valuation doubles to $22 billion on surging AI voice-agent demand SECTIONS ElevenLabs' valuation doubles to $22 billion on surging AI voice-agent demand Reuters Last Updated: Sep 30, 2026, 11:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis ElevenLabs has successfully finalised a notable employee tender offer, achieving a staggering valuation of $22 billion this week. This impressive growth reflects a significant bump from its prior funding round back in February. Noteworthy investors such as Wellington, T. Rowe Price, and Andreessen Horowitz participated. The firm\u2019s voice technology facilitates over 15 million conversations weekly across diverse applications.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:33 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nifty 50 prediction today: Oversold zone raises counter-trend rally hopes | Support, resistance", "full_content": "The Indian equity market ended the final trading session of September on a weak note, with the index closing in the red after giving up more than 180 points from the day\u2019s high. This marked the third consecutive session of decline for the index.\n\nThe weakness during September was significant, with the index falling nearly 6% during the month. This marked the sharpest monthly decline since March 2026 and the steepest September fall since 2016.\n\nThe day\u2019s price action resulted in the formation of a small, red-bodied candle with a long upper shadow. The index opened lower and gradually moved higher during the session, touching an intraday high of 22,809.35. However, the recovery failed to sustain as selling pressure emerged at higher levels, dragging the index lower by the close.\n\nAlthough the index formed a higher high and higher low structure compared to the previous session, there is no clear confirmation of a reversal yet. The attempted hammer formation did not receive confirmation, while the long upper shadow indicates that sellers continue to remain active near higher levels.\n\nFor a meaningful reversal, the index needs to form a strong positive candle and demonstrate sustained buying interest.\n\nWith a long weekend approaching, market participation could remain subdued on Thursday. The ongoing decline is set to enter its eighth consecutive week, and since eight is a Fibonacci number, the probability of a short-term pullback cannot be ruled out.\n\nAdditionally, the index is approaching its 200-week moving average, which remains an important long-term support zone. The immediate support area for the index is placed between 22,500 and 22,600.\n\nFrom a technical perspective, the index has entered an oversold zone and is trading significantly below key averages. It is currently around 5.36 per cent below its 50-day moving average (50-DMA), while the Bollinger Bands continue to slope sharply downward, indicating that the recent decline has been stretched.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:32 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Jobless claims, manufacturing PMI, and ISM data due Thursday", "full_content": "", "source": "Investing.com News", "pub_date_str": "30 Sep 2026, 11:30 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Nasdaq Jumps After GDP, PCE Data Point to Strength in U.S. Economy \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Jumps After GDP, PCE Data Point to Strength in U.S. Economy \u2014 Live Updates WSJ 10-year Treasury yield turns higher as traders look past inflation data, await jobs report CNBC Yield on 10-Year Treasury Surges to 24-Year High WSJ Equities end slightly lower as bond yields hold near multi-decade highs reuters.com Stock market today: Dow, S&P 500, Nasdaq wobble as 30-year Treasury yield climbs to 24-year high Yahoo Finance", "source": "Google News Business", "pub_date_str": "30 Sep 2026, 11:30 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NPS Swasthya: \u20b91 lakh to \u20b930 lakh \u2014 Check health insurance cover, deductibles the scheme likely provides", "full_content": "The Pension Fund Regulatory and Development Authority's new health-focused pension product, the NPS Swasthya, is expected to launch in October, as per reports. Speaking to reporters at an event in Mumbai on Thursday, 10 September, PFRDA Chairman Sivasubramanian Ramann had also told reporters the authority is likely to launch the product within 30 days \u2014 sometime in October.\n\nHe said that guidelines could be expected before the formal launch, as testing under proof of concept (PoC) received encouraging response. \u201cWe are working on it (NPS Swasthya ). The PoC worked very well\u2026 a very encouraging response that has led us to finalise the product,\u201d he stated.\n\nRamann added that the Central Recordkeeping Agencies ( CRAs ) are working on the technology required for the product and the formal launch could be expected \u201chopefully in about 30 days' time\u201d, i.e. mid-October.\n\nLast week Outlook Money cited sources to report that NPS Swasthya is due for formal launch on 1 October.\n\nDeveloped in the PFRDA's regulatory sandbox framework, the PoC tested how healthcare benefits could be integrated with the National Pension System ( NPS ) architecture.\n\nExplaining how the product would work, Ramann said payment mechanism for the proposed product would work directly between the pension account, insurer and hospital. \u201cWhat is important in the NPS Swasthya is my ability to pay money to the hospital directly. So, from the pension account, money will release and go directly to the hospital. Then the health benefit administrator, through the insurance company, will release the top-up insurance , which will go to the hospital,\u201d he explained.\n\n\u2013 First-year health insurance premium, including applicable taxes.\n\n\u2013 At least \u20b9 1,000 towards the NPS Swasthya investment account. The minimum subsequent contribution is \u20b9 10.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:22 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "US crude oil output rose in July, while petroleum demand declined, EIA says", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US crude oil output rose in July, while petroleum demand declined, EIA says Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US crude oil output rose in July, while petroleum demand declined, EIA says SECTIONS US crude oil output rose in July, while petroleum demand declined, EIA says Reuters Last Updated: Sep 30, 2026, 11:16:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In July, US crude oil production climbed to 13.95 million barrels per day, up from June\u2019s figures. Despite the production surge, the demand for crude oil and petroleum products dropped to 20.61 million barrels per day. Meanwhile, gross natural gas production reached a remarkable 137.0 billion cubic feet per day, with Texas's output increasing to 40.1 billion cubic feet per day, contrasting slightly with a decline in Pennsylvania.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:16 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Senate Democrats sink 'toothless' stock trading ban, data center bill in last act before election recess", "full_content": "Senate Democrats on Wednesday defeated a pair of bills that aimed to address data center -related affordability concerns and limit Congress members' ability to profit on the stock market while in office, arguing both were watered-down proposals.\n\nThe data center bill, dubbed the Ratepayer Protection Act failed on a vote of 57-43. A second bill, known as the Stop Insider Trading Act, which also includes a controversial voter-identification provision, was defeated on a party-line, 53-47 vote. Both bills needed 60 votes to overcome the Senate filibuster.\n\nRepublicans will likely use the votes as fodder on the campaign trail this fall, as the GOP seeks to hold narrow majorities in both chambers despite President Donald Trump 's falling approval ratings and persistent concerns about affordability. The Senate is due to recess as soon as Wednesday, as lawmakers seeking reelection will return to their home states to campaign ahead of the 2026 midterm election .\n\n\"EVERY Senate Democrat just joined 94% of House Democrats in voting AGAINST banning congressional stock trading.,\" House Majority Leader Steve Scalise, R-La., posted to X immediately following the vote. The bill, he said, provides \"the accountability the American people demand. But every Democrat blocked it from becoming law.\"\n\nThe Ratepayer Protection Act , which passed the House on a 417-3 vote earlier this month, would establish a regulatory framework that states could consider adopting to require large artificial intelligence data centers to cover their own energy costs, rather than passing them down to customers.\n\nBut Democrats have railed against the measure. Senate Minority Leader Chuck Schumer , D-N.Y., called the proposal a \"toothless messaging bill\" in a speech in the Senate on Tuesday.\n\n\"The bill is a fraud. I can sum up the shortcomings of Republicans' data center bill with one word: optional,\" Schumer said.\n\nSen.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 11:14 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "10 Nifty 50 stocks, including Infosys and TCS, posted double-digit losses in September as market sell-off deepens", "full_content": "Bajaj Finserv , Infosys, and TCS were among 10 Nifty 50 stocks that concluded the tumultuous September with double-digit losses and contributed heavily to the market decline.\n\nIndian stocks grappled with multiple challenges last month, including elevated crude prices, persistent selling by overseas investors, and surging global bond yields, leaving little room for bulls to intervene.\n\nThe sell-off spared no sector, with tech stocks continuing to bleed heavily, followed by FMCG and auto stocks. On the flip side, primary market activity remained robust in September, with offerings by National Stock Exchange of India and SBI Funds Management.\n\nBajaj Finserv was the top laggard among Nifty 50 constituents, falling 14.35% to \u20b9 1,731, its biggest monthly drop since March. The losses have widened the company's year-to-date decline. This was followed by Infosys and TCS, which fell 13.1% and 12.4%, respectively, as per the Trendlyne data.\n\nAmong auto stocks, Mahindra & Mahindra, Eicher Motors , Tata Motors Passenger Vehicles, and Maruti Suzuki India posted losses of 11.5%, 11.3%, 11.2%, and 10.5%, respectively. In terms of year-to-date losses, M&M and TMPV have declined 21% and 22.83%, respectively.\n\nLooking at consumer goods stocks, Nestle India was the worst performer, falling 10% to \u20b9 12.46%, marking its biggest monthly drop since October 2024, when it plunged 15.87%. Other stocks such as Titan Company and Bajaj Finance , fell by 11.3% and 11.2% respectively.\n\nNifty 50 plunged 6% in September, taking its 2026 decline to 13.5% and positioning it for its biggest annual decline since 2011, when it plunged 24.62%.\n\nOver the last two decades, the index has recorded double-digit losses only twice. From 2016 to 2025, the markets enjoyed an uninterrupted bull run, closing each of those years in the green. If not for the ongoing support from domestic mutual funds, largely backed by retail investors, the losses could have been even steeper.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 11:09 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Accelevation IPO: AI Infrastructure Firm Valued At $3.9 Billion As Shares Fall On Nasdaq Debut", "full_content": "Accelevation provides power distribution, cooling, structural systems and installation services for data centres, with revenue reaching $447.8 million in 2025.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 11:08 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks: AI infra firm Accelevation valued at $3.9 billion as shares fall in Nasdaq debut", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: AI infra firm Accelevation valued at $3.9 billion as shares fall in Nasdaq debut Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: AI infra firm Accelevation valued at $3.9 billion as shares fall in Nasdaq debut SECTIONS US stocks: AI infra firm Accelevation valued at $3.9 billion as shares fall in Nasdaq debut By Reuters Last Updated: Sep 30, 2026, 11:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Accelevation's shares began trading below the initial public offering price of $18, reflecting current market instability. The company, which focuses on data center infrastructure, successfully raised $540 million by offering around 30 million shares at a debut price of $17.55. Founded in 2017, Accelevation achieved impressive revenue growth, totaling $447.8 million by 2025 amidst an uncertain U.S. IPO landscape that is impacting this listing season.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 11:08 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "These bond strategies can help you get a safe 5% return on your cash", "full_content": "With U.S. Treasury yields on the rise, financial planners say they\u2019re seeing a growing interest in bonds, especially among investors looking to secure fixed income in retirement.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 11:08 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Trump's latest global tariffs face trade court challenge", "full_content": "President Donald Trump 's near-global tariff policy is being challenged in federal court \u2014 again.\n\nA panel of three judges at the U.S. Court of International Trade in Manhattan heard arguments Wednesday from a group of small businesses and Democratic-led states who say Trump's sweeping \"Section 301\" tariffs overstep the law.\n\nIt's the third time in less than two years that the courts have been asked to intervene against the president's attempt to impose sweeping tariffs on the vast majority of U.S. imports.\n\nThe latest tariffs put 10% or 12.5% rates on goods from 86 countries, covering 99.4% of U.S. imports. The Trump administration said they were imposed in response to the targeted countries failing to effectively enforce bans on the trade of goods produced using forced labor practices.\n\nBut an attorney for the challengers said at the start of Wednesday's hearing that a \"constellation of factors\" show the government's justification was a \"pretext\" in pursuit of reviving Trump's worldwide tariff regime.\n\n\"We know this was not the only reason that they did this,\" the attorney, Pratik Shah, said.\n\nOne of the judges pushed back. \"So what?\" she asked, probing whether the government having additional motivations for the tariffs was enough to rule against them.\n\nShah replied that the administration's \"unprecedented\" use of Section 301 \u2014 slapping tariffs of similar size on dozens of economies in \"one fell swoop\" after a truncated investigation \u2014 does not satisfy the statute's requirements.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 11:03 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "RBI\u2019s new bulk FD rules from October 1: What changes for investors? Experts explain", "full_content": "The Reserve Bank of India (RBI) is changing the rules governing interest rates on bulk fixed deposits (FDs) from October 1, bringing greater transparency to how banks disclose rates for large deposits.\n\nThe changes are unlikely to affect most individual retail investors because they apply to bulk deposits, which for scheduled commercial banks generally start at \u20b9 3 crore.\n\nThe revised framework is aimed at making bulk-FD pricing more transparent and giving large depositors clearer information about the interest rate applicable to their deposits.\n\nUnder the revised RBI framework, banks will have to publish the interest rates applicable to bulk fixed deposits on their websites on every working day.\n\nThe rates must be disclosed by 10 AM, with a 10-minute window available for updating the information.\n\nBanks will also be required to pay interest on an eligible bulk deposit based on the rate disclosed in advance.\n\nThis gives large depositors a publicly available reference point to check the applicable rate before placing their money with a bank.\n\nFor scheduled commercial banks, a bulk deposit generally refers to a single rupee term deposit of \u20b9 3 crore or more. The threshold, however, is different for certain categories of banks.", "source": "LiveMint Money", "pub_date_str": "30 Sep 2026, 11:01 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The hottest trade of the year so far isn't AI. It's tanker stocks", "full_content": "Tanker stocks have been on fire this year. Here's why their momentum can stand", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:58 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kalshi traders see high odds Anthropic's IPO is announced this year", "full_content": "Kalshi traders see greater odds that Anthropic will announce an initial public offering this year after several news outlets reported that the company plans to warn investors in its IPO prospectus that its models are dangerous.\n\nChances that the AI company announces an initial public offering before November jumped from 4.7% on Sept. 28 to 16% Wednesday afternoon.\n\nKalshi traders see a greater than 60% chance an IPO is announced before December and nearly 80% likelihood that it happens before January. The contract asks when the company will announce an IPO and will be verified from news outlets and the company itself, according to Kalshi website.\n\nFounded in 2021, the AI company alerted speculative investors its models are a \"catastrophic or existential risk to humanity,\" according to a Reuters report . The same report said Anthropic warned AI can \"resist shutdown,\" hide or \"manipulate information\" or exhibit behavior \"resembling blackmail.\"\n\nAnthropic confidentially filed its IPO prospectus in June and is seeking a $2 trillion valuation when it goes public. Reuters reported the company plans to spend over $500 billion on cloud computing, among other infrastructure in the coming year.\n\nEscalating concerns on how AI can devastate humanity is coming from multiple companies. Anthropic's competitor, OpenAI , cited issues on AI safety when stating the company is not expected to go public this year.\n\nAnthropic CEO Dario Amodei wrote an essay requesting that AI companies slow down the process of improving their most advanced models earlier this month. OpenAI CEO Sam Altman and SpaceX CEO Elon Musk supported the proposal.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The market search for balance sheet cash cow 'quality' stocks is shifting with mega AI spend", "full_content": "By one recent estimate, the AI buildout will cost more than most major economic transformations in the history of the U.S. economy.\n\n\"The projected buildout would be larger relative to the economy than the major U.S. canal, railroad, electrification, highway, and telecommunications investment booms,\" wrote Columbia Business School professor Stijn Van Nieuwerburgh in a paper delivered at a Brookings Institution event last week.\n\nThat AI spending is pressuring cash flow at major technology companies, among the most profitable in the history of the world. Meanwhile, the bond market is having trouble digesting the sheer amount of AI-related debt companies want to issue, pushing more deals into junk bond territory, and with AI among factors being cited in the recent market-wide rise in yields .\n\nFor some investors, the volatile situation is leading to a more intent focus on core balance sheet metrics led by free cash flow, which measures the cash left over after expenses, interest, taxes and long-term investments. Return on equity, net debt leverage and earnings consistency have also moved to a more central location on the radar of investors, said Todd Rosenbluth, head of research and editorial at TMX VettaFi.\n\nJust how much companies are spending to generate long-term growth on AI, and which companies can actually handle that capex load, are implicit in the flight to quality mindset.\n\n\"With expectations that spending on AI is being revisited, investors are turning toward companies that they have confidence will continue to grow despite the shifting environment,\" Rosenbluth said.\n\nAt times, investors are willing to pay a premium and take more risk for future growth, such as during periods of low interest rates and high growth. That sentiment is shifting somewhat amid rising rates and tightening monetary policy, with some investors becoming more cautious.\n\nIPOs are being pulled \u2014 some deals related directly to the AI buildout are reportedly being delayed at least for now.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bond markets resume sell-off after strong US data", "full_content": "Treasury yields rise further on news that economy grew faster than previously estimated, although personal consumption expenditures inflation falls", "source": "FT Markets", "pub_date_str": "30 Sep 2026, 10:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Inside Man: How Chinese spies used lies, love and betrayal to target the Federal Reserve", "full_content": "John Harold Rogers was walking Prada, his tiny spaniel, past a school bus stop in his suburban Washington neighborhood when FBI agents surrounded him. They handcuffed the former senior Federal Reserve official and took him into custody to face charges of spying for China .\n\nAn agent took Prada's leash, and investigators from multiple federal agencies began an intensive search of Rogers' house.\n\nThe now 65-year-old economist was arrested in January 2025 , days before he was set to travel to China with his wife, a Chinese national, and their 6-year-old daughter. Investigators believed that Rogers passed information about the Fed to a Chinese government spy, who, over more than a decade, helped him with his career, his finances and his marriage to a woman 24 years his junior.\n\nRogers' descent from senior Fed official to espionage suspect appears to have been driven by his desire for female companionship. This desire was exploited by a Chinese government agent, who became increasingly entwined in Rogers' professional and personal life. Rogers' indiscretion was later exploited by online blackmail scammers, ultimately leading to his downfall.\n\n\"The facts of this case read like a spy novel,\" federal prosecutor Nicholas Hunter told the jury at Rogers' trial in 2026. \"There was sex. There was money, manipulation, secret meetings with shady characters in China, fake identities, lies, trickery, and deceit. But this was real life. The events of this case all happened.\"\n\nThe crucial question, though, was whether Rogers was a spy or a dupe for Chinese intelligence.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 10:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Trade Setup For Oct 1: Nifty Near 22,600 Support; Can Oversold Conditions Trigger A Bounce?", "full_content": "Intraday market outlook remains non-directional and level-based trading would therefore be the ideal strategy for day traders.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 10:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fed watchdog finds renovation failures, but no grounds for criminal referral", "full_content": "The Federal Reserve' s inspector general determined manageme
