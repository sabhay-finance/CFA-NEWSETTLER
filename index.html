sset classes and their risk-return profiles are increasingly tested."}, {"title": "IRS raises 401(k) contribution limit by $1,000 for 2027 as retirement savings caps increase - Fox Business", "full_content": "IRS raises 401(k) contribution limit by $1,000 for 2027 as retirement savings caps increase Fox Business IRS announces 2027 401(k) contribution limits, raises savings cap: What it means for your money CNBC Inflation adjustments to retirement account limits issued for 2027 Journal of Accountancy IRS announces 401(k), IRA contribution limits for 2027 NewsNation 401(k) Limits Are Rising for 2027. Which Savings Goals Come First? Barron's", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 08:02 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia Earnings To Anthropic IPO: Nasdaq Faces Two-Headed AI Stress Test After Best Week Since August", "full_content": "Nvidia shares faced a steep selloff last week triggered by controversies surrounding long-time CEO Jensen Huang's two affairs (one involving a suspected Chinese spy); despite this, many AI-linked stocks steadied in recent days.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 07:59 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank holidays next week: SBI, HDFC, ICICI branches to closed on three days from 16-22 November? Check RBI calendar", "full_content": "Bank holiday next week: Public and private sector lenders, including the State Bank of India and HDFC Bank will be closed for three days from 16-22November, according to the Reserve Bank of India's holiday calendar.\n\nAs per RBI rules, all scheduled and non-scheduled banks observe listed holidays and mandatory closure on second and fourth Saturdays and every Sunday in a month. In-branch services are shut, but digital services (online net banking, app) will remain operational.\n\nNotably, banks in India are closed for common national and gazetted holidays, weekend offs and local holidays and festivals off, as required. The central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks will be closed on 16 days this month, including state and regional holidays and weekend offs. This includes weekend offs on November 1, 8, 15, 22, 28, and 29 for Sunday; and November 14 and 28 for second and fourth Saturday holidays, respectively. Besides these are regional holidays on November 9, 10, 11, 13, 16, 20, 23, 24 and 27.\n\nNovember 16 (Monday): Banks will be closed in Patna and Ranchi on account of Chhath Puja .\n\nNovember 20 (Friday): Banks will be closed in Dehradun to observe Igas-Bagwal.\n\nNovember 22 (Sunday): Banks will be closed pan India for Sunday holiday.\n\nFor customers who face urgent requirements or for daily spends, online banking services and bank mobile apps remain operational across the country even on official holidays and the weekends. You can thus use these uninterrupted services for convenient financial transactions.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 07:38 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How to ensure that AI disruption doesn\u2019t leave workers behind", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nJay Clayton, a former U.S. attorney, is now\u2014in the president\u2019s words\u2014America\u2019s \u201cAI czar.\u201d More formally, he is head of the White House\u2019s new Super Intelligence Force. In that role, Clayton is responsible for developing \u201cplans for responding to SI-enabled threats\u201d to America.\n\nThat remit is a fine starting place for Washington, which, until very recently, been concerningly disengaged with regulating or overseeing the artificial-intelligence industry at all. Attending to concerns around AI threats to privacy, national security, and perhaps even civilization are of critical importance.\n\nBut there must be just as much attention placed on addressing the more immediate transition into the AI era\u2014things like retraining workers, making sure displaced workers are supported, and ensuring government and private businesses have a way to work together through big economic changes. A failure to meaningfully address these shorter-run, more mundane concerns may mean we never reach the promised AI era at all.\n\nOur economy is in the early stage of a large-scale transition that will disrupt and eliminate some jobs, create new ones, and necessitate skill shifts in others. We have experienced such transitions before, but they took place over decades. It is reasonable to believe this one will be much faster.\n\nTherein lies the rub. Today\u2019s business, economic, and monetary policy discussions around AI center on the durability of a tech-heavy stock market, expected productivity gains, and effects on wages and the labor market, all of which are important. But no one knows exactly how or when AI will create these huge shifts in our economy.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 07:34 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Italy fines Meta $887m for accessing Android users\u2019 photos and videos - The Guardian", "full_content": "Italy fines Meta $887m for accessing Android users\u2019 photos and videos The Guardian Meta fined $887 million in Italy over Android gallery photos and videos on Facebook ABC News - Breaking News, Latest News and Videos Italy fines Meta $887 million over Android users' data access Reuters Italy slaps Meta with \u20ac805mn fine over access to Android photos DW.com Italy fines Meta \u20ac805m over accessing users' photos BBC", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 07:32 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Bitcoin price analysis: BTC continues to decline Saturday, entering 'deep value zone' - CoinDesk", "full_content": "Bitcoin price analysis: BTC continues to decline Saturday, entering 'deep value zone' CoinDesk Bitcoin Tumbles to Three-Month Low as Liquidations Accelerate Bloomberg.com Bitcoin market outlook: extreme fear, oversold signals, and key support levels Yahoo Finance Bitcoin is falling to fresh lows today: What\u2019s causing the crypto decline? Fast Company \u2018People are chucking stuff like gold and Bitcoin\u2019 as rising inflation leads investors to seek yield Fortune", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 07:31 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018Red caviar\u2019 slips off Japan\u2019s sushi menus as roe prices soar", "full_content": "Collapse in wild salmon harvests put prized delicacy at risk as warming seas disrupt supply", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 07:30 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tesla makes major Cybercab announcement as driverless vehicle goes on sale - Fox Business", "full_content": "Tesla makes major Cybercab announcement as driverless vehicle goes on sale Fox Business Tesla Opens Sales of Autonomous Cybercab for \u2018Select\u2019 Customers WSJ Tesla: Sales Of Self-Driving Cybercab Coming Soon To Invitees: $20/hr? Forbes Tesla Cybercab ownership will come with plenty of strings attached Teslarati Tesla is inviting some people to buy a Cybercab \u2018for personal use\u2019 \u2014 but read the fine print The Verge", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 07:19 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "When overseas investing goes wrong, who answers?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nYou must have come across the story of a disaster that befell some investors who bought American stocks through an Indian app. In mid-October, nearly 30 investors reportedly found that their holdings in large, well-known US companies had been sold off and the proceeds immediately invested in a thinly traded Chinese \u2018 insurance technology\u2019 company whose stock was worth about a dollar. The stock subsequently fell about 60%. According to the investors, the aggregate loss is about \u20b9 100 crore. The platform has not put a number on it, and at this point it\u2019s hard to say.\n\nI won't get into what went wrong, because nothing has been established yet. The platform suggests the accounts may have been targeted using information exposed in another company's data breach. The US broker, according to news reports, says the unauthorised access came through the Indian app's interface. An FIR has been filed in Bengaluru naming the Indian and American entities. But my column is not about this incident (if it was indeed a hack). What interests me is that a dispute of this kind was almost inevitable.\n\nThink of the layers between an Indian investor and, say, a share of Apple bought through such an app. There is the app and the Indian company operating it, an introducing entity that brings in the customer, a US broker that executes the trades and a custodian that holds the shares. To the investor, it is just the friendly screen of one app. Behind it, however, are several companies across two countries, each with its own contracts, laws, regulators, jurisdictions and lawyers. When something goes wrong, everyone has a reasonable-sounding explanation, as the platform and broker are doing now. The Indian investor, meanwhile, has no obvious recourse beyond filing an FIR.\n\nIn theory, investors know this. The platforms' terms and disclosures do spell it out.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 07:17 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Worried about mutual fund losses? Expert shares 5 ways to reduce portfolio risk and navigate equity market volatility", "full_content": "Over the last 1 year, due to geopolitical tensions and the ongoing US-Iran dispute, which have driven elevated oil and gas prices, along with a host of other factors, the benchmark Nifty 50 index in India has delivered a negative return of -3.34%. On similar lines, the BSE Sensex has delivered a negative return of -3.95%. This has also resulted in several mutual funds in the small-, mid-, and large-cap categories not performing in line with expectations.\n\nThis data also shows that all investments in equity markets are subject to market volatility, making proper understanding of these asset classes and risk management an important part of long-term wealth creation.\n\nIt is a given that market fluctuations cannot be completely eliminated; investors can still protect their portfolios from excessive risk by following several fundamental rules of investing, such as proper asset allocation as per their risk tolerance capacity, meaningful diversification and disciplined investing.\n\nTushar Gupta, Business Head \u2013 Mutual Funds, Paisabazaar, explained how investors can manage risks in their mutual fund portfolios , stating, \"You can effectively manage risk in your mutual fund investments by following a few disciplined practices. First, allocate assets as per your goals, investment horizon and risk appetite. Second, instead of chasing recent returns, diversify across asset classes and sectors to avoid excessive exposure to any single theme or industry.\u201d\n\nHe further added, \u201cThird, stop reacting to short-term market movements. Fourth, continue Systematic Investment Plans (SIPs) during market volatility to benefit from rupee-cost averaging. Fifth, review fund performance and portfolio overlap periodically to ensure investments remain aligned with changing financial goals and risk tolerance.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 07:15 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Scene Box Office Collection Day 9: Gross Earnings Near Rs 150 Crore As Surya's Film Sees 58% Surge", "full_content": "'Scene' earned Rs 9.50 crore net in India on Day 9, taking its total domestic net collection to Rs 127.20 crore and gross to Rs 147.75 crore.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 07:11 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SCSS investment rules: 5 mistakes retirees must avoid be     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
