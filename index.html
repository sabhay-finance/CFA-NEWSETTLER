<script>

    const allData = {"general": [{"title": "Want stable returns? What experts say on public and private markets offering better prospects", "full_content": "Fund managers Renuka Ramnath and Nilesh Shah offered different takes on what investor should do during a market downturn \u2014 seek access to private markets or hunt for distressed valuations in the public markets .\n\nSpeaking at Kotak Private\u2019s 3rd edition of \u2018Take and Counter Take\u2019, the ace investors discussed public and private market strategies during market downturns. While the Ramnath stressed on the safety of directly managing cash and costs as a board member in a private company; Shah noted the unique wealth creation opportunity created by public market investors selling assets below fair value. However, both agreed investors should diversify, rather than treat markets as an either-or choice.\n\nRamnath is Founder, MD and CEO of Multiples Alternate Asset Management, and Shah is MD of Kotak Mahindra Asset Management Company ( AMC ).\n\nPrivate markets are investments not traded on public exchanges. These include private equity (PE), venture capital ( VC ), private debt, and hedge funds, according to a Linqto report. Investors can gain exposure directly by purchasing shares in private companies or indirectly through private equity funds, it added.\n\nAccording to Oisharya Das, CEO of Kotak Private Banking, growth of private markets is giving India\u2019s wealth creators a broader opportunity set, while making portfolio-allocation decisions more nuanced.\n\nOn the optimal strategy during a market crash , Ramnath asserted that private markets offer a safe haven because investors retain active operational control. Rather than helplessly watching market capitalisation evaporate in the public sphere, private equity investors can utilise affirmative clauses to dictate cash usage, accelerate or defer initiatives, and actively steer the company through severe macroeconomic blows.\n\n\u201cIn an asset bubble crash, it could be better to be in private market because you are in control, you know what you're holding and you're not nervous.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 11:35 PM IST", "pub_date_relative": "6m ago"}, {"title": "GST registration FAQs: Application process, name change and modifications recommended at 57th Council meeting", "full_content": "If you are planning to register under the Goods and Services Tax ( GST ) regime or update your existing registration details, the government has outlined the application process, documents required, and changes to the amendment procedure.\n\nIn FAQs released by the Press Information Bureau (PIB) on 9 October, the government explained how taxpayers can apply for GST registration and make changes to their business details.\n\nYou can apply for GST registration online through the official GST portal. Go to \u201cServices\u201d, select \u201cRegistration\u201d, and click on \u201cNew Registration\u201d to begin the process.\n\nThe document requirements will depend on the type of premises selected. For example, the documents required for an owned property may differ from those for rented premises. The portal is intended to display the relevant requirements based on the applicant's selection.\n\nFollowing the 56th GST Council meeting, automatic GST registration is been granted under Rule 14A of the CGST Rules, 2017, to eligible applicants who do not intend to pass on input tax credit (ITC) exceeding \u20b9 2.5 lakh per month.\n\nThe following changes were recommended at the 57th GST Council meeting:\n\nTo change the legal name of your business, add an additional place of business (APoB), or amend the principal place of business where the automatic process applies, you must submit FORM GST REG-14 on the common portal.\n\nFor a legal name change, the system will validate the PAN details provided before updating the name. For changes to business premises, applicants must submit the required supporting documents listed in FORM GST REG-01.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 11:33 PM IST", "pub_date_relative": "9m ago"}, {"title": "Onemednet CFO Robert Golden sells $55,290 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 11:31 PM IST", "pub_date_relative": "11m ago"}, {"title": "Saudi Arabia reports injuries in new attack at Riyadh airport, day after strike kills 13", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 11:30 PM IST", "pub_date_relative": "11m ago"}, {"title": "Iran rejects U.S. stance on Hormuz as Trump weighs strikes over Riyadh attacks", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 11:17 PM IST", "pub_date_relative": "24m ago"}, {"title": "Sonic Automotive director Paul Rusnak buys $1.29m in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 11:01 PM IST", "pub_date_relative": "41m ago"}, {"title": "Gold, Silver Set For Range-Bound Week As Rupee Weakness Offers Support: Analysts", "full_content": "A weaker rupee is expected to cushion domestic bullion prices, while inflation data, US rate signals and geopolitical developments set the tone for gold and silver in the week ahead.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:55 PM IST", "pub_date_relative": "46m ago"}, {"title": "Russia, Ukraine Agree To 'Energy Ceasefire', Says Donald Trump", "full_content": "US President Donald Trump announced that there would be an \"energy ceasefire\" between Russia and Ukraine.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:55 PM IST", "pub_date_relative": "47m ago"}, {"title": "Indian National Killed In Riyadh Airport Attack; Jaishankar Assures Family Of Assistance", "full_content": "The Ministry of External Affairs strongly condemned the repeated attacks on Riyadh's airport, including the October 10 incident, which resulted in casualties, injuries and damage to property.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:46 PM IST", "pub_date_relative": "55m ago"}, {"title": "Why NBFCs have become the option of choice for many first-timer borrowers \u2014 Explained", "full_content": "A higher proportion of new-to-credit (NTC) customers are choosing non-banking financial companies (NBFCs) to make their foray into the borrowing space, according to a joint report by the Finance Industry Development Council (FIDC) and TransUnion CIBIL.\n\nThe report titled \u2018Bharat Nirman: NBFC Forming the Foundation of Credit Dispersion\u2019 found that a growing number of first-time borrowers start their credit journey with consumption products and are serviced mainly by NBFCs.\n\nRaman Aggarwal, CEO of FIDC noted that the NBFC sector today is far more deeply embedded in India\u2019s credit system than it was a decade ago. \u201cIts strength has always been the ability to respond to markets that require flexibility, whether that is a household in a smaller town, a first-time borrower or a small business looking for capital. We are now seeing that capability translate into greater scale across emerging states and a stronger presence among nano and micro enterprises,\u201d he added.\n\nAccording to the report, the answer is access. \u201cNBFCs have played a pivotal role in expanding formal credit access, consistently driving growth in NTC consumer originations. As of the latest period, they bring in close to half of NTC consumers into the formal financial ecosystem,\u201d it added.\n\nAs per the data, of the lender mix data for live NTC consumers as of June 2026, as many as 74% of first-timer borrowers have only used NBFC credit, while 10% have used non-NBFC and 16% have accessed both.\n\nSmaller-ticket lending and deeper reach have helped build this scale, as per the report.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 10:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "From BJ\u2019s to Lululemon, retailers are trimming assortments to boost business", "full_content": "Retailers are trimming assortments in an effort to clean up their balance sheets.\n\nAs shoppers cut spending in the face of high gas and food prices, businesses have pulled more levers to boost profitability and appease investors. During earnings calls this year, a range of retailers have highlighted efforts to reduce the number of items they sell, commonly tracked as stock keeping units, or SKUs.\n\nIn March, Dollar General said it trimmed 1,500 SKUs. In August, Under Armour said it shrunk SKUs by 25% over the past few years and plans to cut another 25%, while BJ's Wholesale Club said it plans to reduce roughly 20% of SKUs . In September, Lululemon said it cut North America SKUs by 15%.\n\nTrimming inventory can help a business stabilize its sales or even get back to growth, and can reduce the chances a company gets stuck with unwanted inventory. But the move can also leave consumers with less choice \u2014 a trade-off many retailers have been willing to make.\n\nWhen a brand struggles to sell certain products, it can lead to discounting, which hurts profitability. Some markdowns are expected when businesses roll the dice on new products that don't end up selling well, but too many promotions can cause problems.\n\n\"If you have zero discounting, you're not taking enough fashion risk,\" said Guggenheim Securities senior retail analyst Simeon Siegel. \"But discounting needs to be fixing mistakes. It needs to be done quickly.\"\n\nUnder Armour and Lululemon are both facing repercussions from what investors see as too many markdowns.\n\nUnder Armour's operating income, which illustrates its underlying profitability, turned negative in fiscal 2025 and 2026. The company said its problems would not be solved by chasing unhealthy sales volume or short-term revenue.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 10:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stellantis bets on small affordable EVs for European comeback", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 10:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "UL Solutions president and CEO Jennifer Scanlon sells $876k in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 10:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Citroen revives the 2CV for an electric age - BBC", "full_content": "Citroen revives the 2CV for an electric age BBC CITRO\u00cbN 2 CV CONCEPT: TIME 2 MEET AGAIN Media Stellantis The deux chevaux is back! Welcome to the new Citroen 2CV... yours for \u00a312k+ Top Gear Citroen Is Finally Bringing Back The 2CV. And I\u2019m Here For It InsideEVs Citro\u00ebn's concept reimagines the 2CV as a \u20ac15,000 electric car Stock Titan", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil chiefs pull out of Riyadh energy congress after airport missile strike", "full_content": "BP and others skip World Petroleum Council meeting after 12 killed in Houthi attack", "source": "FT Markets", "pub_date_str": "11 Oct 2026, 10:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "SentinelOne CFO Sonalee Parekh sells $413,291 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 10:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Innsuites Hospitality Trust CEO Wirth sells $2.17 billion in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Arab Spring, Hong Kong protests, Greece anti-austerity unrest: How historic mass protests shook stock markets?", "full_content": "Corporate earnings, business update, dividend , stock split, bonus, or any new acquisitions, in stock markets, every corporate action can trigger reaction. But what happens to exchanges across the world when protesters hit the street?\n\nFrom the Arab Spring to Hong Kong's 2019 protests and Greece's anti-austerity movement between 2010 and 2012, history offers several examples of mass demonstrations that coincided with significant market fluctuations.\n\nArab Spring was a wave of pro-democracy protests and uprisings that took place in the Middle East and North Africa between 2010 and 2011. The wave started with protests in Tunisia, and spread to Egypt. It even led to regime change in the two countries. It also inspired similar attempts in other Arab countries too.\n\nThe protests affected the country's markets as Egypt's benchmark index recorded its biggest drop in two years on January 27, 2011, reported CNBC.\n\nThe stock market fell more than 10%. EGX 30, the primary benchmark stock market index of the Egyptian Exchange, closed down 10.5% on Jan 27, 2011. The market also fell nearly 6.25% just 15 minutes into the session. THe stock market also saw two months long suspension during the unrest.\n\nA bill, proposed in 2019, to pave the way for extradition of Hong Kong citizens to mainland China, sparked a massive protest that saw violent clashes, alleged police brutalities, and garnered global attention. The bill was later withdrawn in October, but the massive protest coincided with steep decline in the Hong Kong stock market exchanges.\n\nAccording to a Bloomberg report, Hong Kong protest coincided with nearly 12% decline in Hang Seng index between July 2 and August 14, 2019. More than $ 600 billion of stock market value was erased between July and August in the year.\n\nGreece saw huge public protest against the austerity measures implemented by the Greek government.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 10:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "AI Regulation Must Balance Safety With Innovation: Google DeepMind's Chief AI Readiness Officer", "full_content": "On AI in education, Ibrahim said the technology could enable personalised learning if it complemented teachers and not replace the learning process.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tea Board pushes for more transparent, efficient tea auctions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Tea Board pushes for more transparent, efficient tea auctions The Economic Times daily newspaper is available online now. Read Today's Paper Tea Board pushes for more transparent, efficient tea auctions SECTIONS Tea Board pushes for more transparent, efficient tea auctions By Bikash Singh , ET Bureau Last Updated: Oct 11, 2026, 10:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tea Board India held a seminar to discuss reforms for improving the Pan-India e-Auction system. It focused on enhancing transparency and efficiency in India\u2019s tea auction process. The reforms have led to increased buyer participation and higher tea auction volumes over recent years. A new web-based tea auction platform is being introduced to further streamline operations and reduce costs.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 10:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Millions of Americans will have fewer options during Medicare open enrollment this year", "full_content": "There will be no Medicare Advantage plans in 181 counties in 2027, up from 67 in 2026.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 10:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Want relief from double taxation on foreign income under DTAA? Know how to apply for residency certificate using Form 42", "full_content": "Indian residents earning income from overseas may need a Tax Residency Certificate (TRC) to claim tax benefits under a Double Taxation Avoidance Agreement ( DTAA ).\n\nUnder the Income-tax Act, 2025, applicants can apply for the certificate online through the e-filing portal using Form No. 42. Here is what taxpayers need to know about tax residency, DTAA benefits, and the application process.\n\nA Tax Residency Certificate establishes a taxpayer\u2019s residential status for tax purposes in India. It can serve as supporting documentation when an Indian resident seeks benefits available under a tax treaty between India and another country.\n\nTRC allows taxpayers to fulfill requirements for tax claims in other countries under the Double Taxation Avoidance Agreements (DTAAs).\n\nA DTAA is a tax treaty between two countries that sets out how specified categories of income will be taxed.\n\nSuppose an Indian resident earns interest from a bank deposit in another country. The foreign country may deduct tax on the interest earned, while India may also tax the income because the individual is an Indian tax resident. This can result in double taxation. The taxpayer can claim relief under the applicable DTAA.\n\nIndia has entered into DTAAs with several countries, and taxpayers may qualify for an exemption, a lower tax rate, or relief from double taxation.\n\n*Source: PwC, List of countries with which India has DTAAs, As of 12 May 2026", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 10:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump says he is 'going to look at' joining Saudi Arabia in the fight against Iran-backed Houthis after deadly airport strike", "full_content": "President Donald Trump said he is considering joining Saudi Arabia in its retaliation against Tehran-backed Houthis in Yemen after a deadly attack on Riyadh's main airport, a move that could draw the U.S. further into a second front in the Iran war .\n\n\"We may. We're going to look at it,\" Trump told reporters outside the White House on Saturday when asked if the U.S. would back Saudi Arabian strikes. \"We just found out about the recent attack. So, we'll make a decision. We move very quickly.\"\n\nTwo Saudi Arabian government officials told MS NOW that the kingdom is requesting \"urgent defense support\" from the U.S. following the attacks.\n\nThe officials, including a senior member of the Ministry of Foreign Affairs, did not want to be identified because of the matter's sensitivity. They added that the U.S. needs to intervene \"as soon as possible\" to help the Saudi-led coalition in Yemen fight the Houthis.\n\nThe White House did not immediately respond to a CNBC request for comment.\n\nOn Sunday, a projectile struck a passenger terminal at the Riyadh airport, one day after a missile struck the same terminal, the Associated Press reported. No immediate details were available about the latest strike on the King Khalid International Airport complex for terminals 3 and 4 for domestic flights, AP said.\n\nThe Saudi General Authority of Civil Aviation said Saturday's attack on King Khalid International Airport in Riyadh killed 12 people and injured 309 others, the country's official Saudi Gazette media outlet reported .\n\nColonel Turki Al-Maliki, the spokesman for the Saudi-led Coalition to Support Legitimacy in Yemen, which has been leading the fight against the Houthis, described the attack as a \"war crime.\"", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 09:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "New Steel Policy Vision 2047 Aims 600 MT Steel Output, Increased Raw Material Security, Higher Exports", "full_content": "Draft policy seeks to curb raw material imports, boost high-value steel production and steer the industry towards net-zero emissions by 2070.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 09:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Beta Technologies CEO Kyle Clark sells $612,234 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Palo Alto Networks director Bawa sells $103,070 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 09:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Publish your book for free and start earning: What is Amazon KDP? Here\u2019s how it works", "full_content": "Publishing your book does not have to start with printing bills or publisher approvals. Amazon Kindle Direct Publishing (KDP) lets writers publish without upfront publishing fees. You can offer an eBook, a paperback or a hardcover and earn royalties when readers buy copies.\n\nStart by preparing your manuscript. Read through chapters and correct spelling, grammar and unclear sentences. Use grammar tools to support your checks. Spending time on editing helps you present a polished book to readers.\n\nNext, organise the pages so your book is comfortable to read. You can upload Word documents, EPUB files and PDFs as accepted eBook formats. Amazon, however, prefers the other two formats to PDFs.\n\nFree tools such as Kindle Create help arrange chapters, contents pages and paragraph margins. For paperbacks, check page dimensions, margins and page numbers. KDP\u2019s free templates can help you prepare the layout.\n\nEnglish is the most-preferred language for Amazon KDP. Take a look at all accepted languages for books:\n\nThen, create a cover that represents your book. Make sure it remains readable as a small image on a phone screen. You can use Canva\u2019s book cover templates to design one for free. Check that the title and author name are easy to spot.\n\nOnce your files are ready, visit the official KDP website. Sign in using your Amazon account details. Complete your author profile and provide the tax information. Add your banking details so your earnings can be deposited into your account.\n\nSelect \u2018Create\u2019 and choose an eBook or paperback. Enter the book title, subtitle and author name. Write a clear description explaining what readers can expect. Treat this description like the introduction printed on a book\u2019s back cover.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 09:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "RBI's rupee defence may drain banking liquidity, ease currency pressure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI's rupee defence may drain banking liquidity, ease currency pressure The Economic Times daily newspaper is available online now. Read Today's Paper RBI's rupee defence may drain banking liquidity, ease currency pressure SECTIONS RBI's rupee defence may drain banking liquidity, ease currency pressure PTI Last Updated: Oct 11, 2026, 09:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis RBI has introduced measures to curb rupee volatility, which could ease immediate depreciation pressures in the currency market. These measures include limiting foreign exchange derivative contracts and increasing hedging costs for importers. Experts predict that these actions may lead to a reduction in USD/INR rates and forward premiums. However, external factors like crude oil prices may still pose challenges.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 09:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Thinking of retiring at 65? Here\u2019s what it could cost you. - The Washington Post", "full_content": "Thinking of retiring at 65? Here\u2019s what it could cost you. The Washington Post", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 09:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Canadian ransomware negotiator arrested on federal charges amid FBI hacking probe - Fox Business", "full_content": "Canadian ransomware negotiator arrested on federal charges amid FBI hacking probe Fox Business F.B.I. Arrests Key Suspect in ShinyHunters Hack of Its Own Agents\u2019 Data The New York Times FBI arrests cybersecurity executive in major hack on agents\u2019 data CNN FBI Arrests Executive at Ransomware Negotiation Firm Krebs on Security Suspect arrested in FBI hack that exposed employee information ABC News - Breaking News, Latest News and Videos", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 09:27 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bank FD rates in October 2026: How pre- and post-tax fixed deposit returns differ across HDFC, ICICI, SBI and PNB", "full_content": "Fixed deposits ( FDs ) offer predictable returns, but the interest earned is taxable as per the depositor\u2019s applicable income tax slab. Therefore, investors should compare both pre-tax and post-tax returns before choosing a bank or deposit tenure.\n\nAccording to FundsIndia\u2019s October 2026 report, FD interest rates across large banks vary by tenure, affecting the returns investors retain after tax. Here\u2019s what depositors need to know.\n\nInterest earned on bank FDs is taxable under \u201cIncome from Other Sources\u201d and added to the depositor\u2019s taxable income. The applicable income tax slab determines the final tax liability.\n\nBanks may deduct tax at source (TDS) when interest exceeds the applicable threshold. For bank deposits, the threshold is \u20b9 50,000 in a financial year for non-senior citizens and \u20b9 1 lakh for senior citizens. TDS is generally deducted at 10% when the depositor\u2019s PAN is furnished.\n\nHowever, TDS is not the final tax liability. Depositors may have to pay additional tax or may be eligible for a refund when filing their income tax return (ITR), depending on their actual tax liability.\n\nThe following table compares pre-tax and post-tax FD rates across HDFC Bank, ICICI Bank, State Bank of India (SBI), and Punjab National Bank (PNB) for different tenures.\n\nSource: FundsIndia October report. FD rates for deposits below \u20b9 3 crore, as of 7 October 2026. Post-tax returns are calculated assuming a 30% tax rate.\n\nSuppose an investor deposits \u20b9 5 lakh in a five-year FD at an annual interest rate of 6.40%. Assuming quarterly compounding, the deposit would grow to approximately \u20b9 6,86,822 at maturity, including \u20b9 1,86,822 in interest before tax.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 09:17 PM IST", "pub_date_relative": "2h ago"}, {"title": "Riyadh Airport Hit Again, Trump Weighs Joining Saudi Campaign", "full_content": "Saudi Arabia extends airport closure and shifts schools online after a deadly missile strike kills 12 and injures more than 300; Trump weighs military intervention.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 09:13 PM IST", "pub_date_relative": "2h ago"}, {"title": "Drishyam: The Conclusion Box Office Collection Day 10: Ajay Devgn Starrer Continues Strong Run", "full_content": "Drishyam: The Conclusion has collected Rs 25.9-crore gross on Day 10 so far.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 09:08 PM IST", "pub_date_relative": "2h ago"}, {"title": "The Walmart Deals event ends today \u2014 40+ major last-chance discounts to shop now - Yahoo", "full_content": "The Walmart Deals event ends today \u2014 40+ major last-chance discounts to shop now Yahoo It's your last chance to shop the Walmart Deals event \u2014 here are 17 editor-favorite picks Yahoo Prime Day is over, but Walmart still has massive savings on Dyson, Apple and more CNN Walmart\u2019s Massive Sale Ends Tomorrow \u2014 Best Deals We Recommend, up to 80% Off TODAY.com I'm stocking up on fall clothes on the last day of the Walmart Deals event \u2014 these are my favorite styles Yahoo", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 09:04 PM IST", "pub_date_relative": "2h ago"}, {"title": "Halloween candy prices jump 8.1% as Americans prepare to spend billions on treats - Fox Business", "full_content": "Halloween candy prices jump 8.1% as Americans prepare to spend billions on treats Fox Business Shoppers face scary, high prices this Halloween KSN.com To counteract a spooky economy, America prepares to spend on Halloween candy NBC News Halloween spending creeps up this year Retail Dive The States That Spend the Most on Halloween Candy, Ranked Mental Floss", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 08:50 PM IST", "pub_date_relative": "2h ago"}, {"title": "India's services demand outlook positive for Q3FY27, margin concerns persist: RBI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India's services demand outlook positive for Q3FY27, margin concerns persist: RBI The Economic Times daily newspaper is available online now. Read Today's Paper India's services demand outlook positive for Q3FY27, margin concerns persist: RBI SECTIONS India's services demand outlook positive for Q3FY27, margin concerns persist: RBI ANI Last Updated: Oct 11, 2026, 08:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's services sector is expected to maintain a positive demand outlook in Q3FY27, although business optimism has moderated compared with the previous quarter, with firms anticipating some easing in cost pressures but remaining less optimistic about selling prices and profit margins, according to the Reserve Bank of India's (RBI) latest Services and Infrastructure Outlook Survey.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 08:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "Adani's Kutch Copper Plans 115-Mw Renewable Energy Integration, Targets Lower Emissions", "full_content": "Beyond its manufacturing operations, the company said it is investing in community programmes focused on healthcare, education, livelihoods and social development.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 08:42 PM IST", "pub_date_relative": "2h ago"}, {"title": "Social Security announcing benefits change on Oct. 14 - AL.com", "full_content": "Social Security announcing benefits change on Oct. 14 AL.com When will 2027\u2019s Social Security COLA be announced? The Hill Social Security's Trump Bump-Driven 2027 COLA Will Likely Feature a Grim Reality for Beneficiaries Yahoo Finance Forget the COLA. Here's the Social Security increase to care about USA Today Social Security's 3.5% COLA Bump in 2027 Would Be Largest in 4 Years - But Soaring Medical Costs Could Wipe Out Every Penny 24/7 Wall St.", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 08:32 PM IST", "pub_date_relative": "3h ago"}, {"title": "Gulf Markets End Lower As Riyadh Airport Attack Fuels Tensions", "full_content": "Gulf markets come under pressure as escalating regional tensions and Strait of Hormuz shipping disruptions unsettle investors, with Qatar\u2019s benchmark index falling to its lowest level since May 2020.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 08:27 PM IST", "pub_date_relative": "3h ago"}, {"title": "Jailer 2 Day 1 Advance Bookings: Rajinikanth Starrer Sees Strong Ticket Sales Before Release", "full_content": "Jailer 2 has crossed a major milestone in advance bookings, recording Rs 10.93 crore ahead of its theatrical release on October 15, 2026.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 08:19 PM IST", "pub_date_relative": "3h ago"}, {"title": "Welcome back to earnings season: What to watch this week - Yahoo Finance", "full_content": "Welcome back to earnings season: What to watch this week Yahoo Finance 3 Big Bank Stocks Facing A Q3 Test As Treasury Yields Rise Yahoo Finance Cramer\u2019s week ahead: Earnings kick off as banks and chipmakers face big tests CNBC Wells Fargo, Bank of America, Domino\u2019s, Johnson & Johnson, Inflation Data, and More to Watch This Week Barron's Goldman Set to Lead Wall Street\u2019s $19 Billion Stock-Trading Haul Bloomberg.com", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 08:17 PM IST", "pub_date_relative": "3h ago"}, {"title": "\u201890% of the investment in 5 years goes up to double\u2026\u2019: Ekta Kapoor on real estate \u2014 key money lessons for investors", "full_content": "'In land where it hasn't appreciated more than 25 to 40% (which is like one in a hundred), 90% of the investment in 5 years goes up to double or 80%', Promoter and Joint Managing Director of Balaji Telefilms, Ektaa R Kapoor, has shared her views on wealth creation and the importance of real estate investments.\n\nIn a recent episode of The Ranveer Show (TRS) podcast, released on Saturday, Ranveer Allahbadia, also known as BeerBiceps, spoke to Ekta Kapoor about her family's real estate business and investment philosophy.\n\nFrom saving money and investing to buying property, here are the key personal finance lessons investors can take away from the discussion.\n\nAllahbadia said, \u201cOne, congrats on the real estate business.\u201d Kapoor said her father entered the real estate business at 65, demonstrating that it is possible to explore new opportunities later in life.\n\nShe said, \u201cMy dad ( Jeetendra Kapoor ) and my brother ( Tusshar Kapoor ) have done it, and what is exciting to know is my dad started this business in his 65th year. He is 84 now, and he has grown in a whole new medium, which is a big learning for young people: that you can start at any age.\u201d\n\nShe explained how her father's upbringing influenced his attitude towards money.\n\nEkta Kapoor said, \u201cMy father is a very big family man, but he came from...from a chawl. So his belief was that when money comes after a lot of struggle in life, you save it; you don't spend it.\u201d\n\n\u201cAnd his thing was that we should invest money; it was that middle-class mentality that an Indian father has, to save for the children,\u201d she added.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 08:13 PM IST", "pub_date_relative": "3h ago"}, {"title": "Buy, Sell Or Hold: SBI, Ather Energy, Suzlon, Canara Bank, Manappuram Finance, P&G Hygiene | Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 08:10 PM IST", "pub_date_relative": "3h ago"}, {"title": "Aiming to build long term wealth? Experts suggest these steps to build financial capability", "full_content": "India is set to add 10 crore long-term investors by 2035 as wealth creation expands to tier 2 and 3 cities, according to EY India's \u2018Wealth inclusion in India: Expanding investor participation beyond metros\u2019 report.\n\nIt further noted the untapped potential: India currently has over 55 crore active UPI users, compared to the 6.2 crore mutual fund investors and about 5 crore active equity market participants. \u201cThe gap indicates that while digital access has scaled rapidly, broad-based wealth participation is still at an early stage,\u201d it stated.\n\nGiven the potential, the report added that for India's wealth inclusion agenda, expanding participation could require more than creating awareness of investment products. \u201cIt could require helping investors make better decisions at every stage of their financial journey,\u201d moving from financial literacy to financial capability.\n\nThe report noted that for long, financial literacy has been viewed as the primary solution to low investor participation by governments, regulators and financial institutions. And while initiatives such as awareness campaigns, educational content and investor education programs have played an important role in expanding awareness, this has not consistently translated into participation.\n\n\u201cMany households understand the importance of investing yet delay getting started. Many investors \u2026 discontinue SIPs during periods of market volatility... The challenge therefore extends beyond knowledge,\u201d it added.\n\nAs per EY, the gap between awareness and action remains one of the most persistent barriers to wealth creation .", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 07:59 PM IST", "pub_date_relative": "3h ago"}, {"title": "Brigade Enterprises Aims 21% Rise In FY27 Pre-Sales On Strong Housing Demand: MD", "full_content": "Brigade Enterprises expects property sales to reach Rs 9,000 crore in FY27, supported by demand for mid-income and premium homes.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 07:57 PM IST", "pub_date_relative": "3h ago"}, {"title": "AI\u2019s quiet safety gatekeepers are stepping into the spotlight", "full_content": "Two months ago, independent evaluators occupied a relatively sleepy corner of the multitrillion-dollar artificial intelligence industry. Now they're being asked to come to its rescue.\n\nWhile Anthropic and OpenAI are at the heart of a fierce debate over whether they can safeguard their advanced models and grow their businesses simultaneously, they're seeking support from a handful of small third-party groups like Model Evaluation and Threat Research (METR), Apollo Research, and Transluce.\n\nThe evaluators, which mostly operate as nonprofits, are still finding their footing in an industry where capital is flowing at historic levels and new models are rolling out faster than ever. Their primary role has been to assess AI model capabilities and risks and to flag instances where the technology behaves badly.\n\nWithout a federal push for regulation, evaluators have taken on outsized importance. Anthropic CEO Dario Amodei pledged to embed independent evaluators in his company last month \u2013 a move that OpenAI CEO Sam Altman quickly endorsed . President Donald Trump supported the idea, as did most of the largest U.S. tech companies. But left unanswered are questions about how those third parties should be funded, what level of access they will have and what the reporting structure will ultimately look like.\n\n\"To a degree, the problem, as always, is money,\" Suresh Venkatasubramanian, a computer science professor at Brown University, told CNBC in an interview. \"Who is paying for these companies to do their work? How are they going to support them? You need an ecosystem, you need a viable business model for this.\"\n\nRight now, Anthropic, OpenAI and the infrastructure partners that are profiting from the AI boom are writing the rules.", "source": "CNBC World Economy", "pub_date_str": "11 Oct 2026, 07:38 PM IST", "pub_date_relative": "4h ago"}, {"title": "We\u2019re about to get a huge read on whether earnings can keep propping up the stock market", "full_content": "High hopes for third-quarter earnings are outweighing concerns around interest rates and oil prices \u2014 but one expert warns markets have gotten \u201cextremely complacent.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 07:30 PM IST", "pub_date_relative": "4h ago"}, {"title": "When Companies Stop Driving a Hard Bargain, This Fed Official Starts Worrying - WSJ", "full_content": "When Companies Stop Driving a Hard Bargain, This Fed Official Starts Worrying WSJ Nick Timiraos: Industrial buyers prioritize quality and speed over price Traders Union", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 07:30 PM IST", "pub_date_relative": "4h ago"}, {"title": "Food delivery stock to buy: Eternal shares - 36% returns in 6 months by Zomato parent | 22% more upside ahead?", "full_content": "Food delivery stock to buy: Shares of Eternal Limited have delivered nearly 36% return in six months. Continued strong growth in quick commerce, improving customer retention and better operating efficiency are likely to boost the outlook for the Zomato parent firm, according to experts.\n\nEternal share price ended marginally higher on Friday after gaining nearly 3% over the last week. As the stock has also delivered promising returns over the past six months, experts continue to remain bullish on the stock.\n\nImprovement in Blinkit sales, strong retention and growing customer base are likely to support Eternal business. Additionally, affordability is driving growth without hurting margins of Eternal, according to Joindre Capital Services Limited, which sees strong growth potential in District , Eternal\u2019s going-out app for movie tickets, live events, dining and sports-venue bookings.\n\n\u201cThe outlook remains positive, led by continued strong growth in quick commerce, improving customer retention and better operating efficiency. Management indicated that Blinkit\u2019s long-term adjusted EBITDA margin guidance has been raised to around 6% from the earlier 5\u20136% range, supported by higher capex per store, larger store formats and improving productivity,\u201d read the brokerage report.\n\nStrong competition in the quick commerce space is a key concern for Eternal growth. Growth in Blinkit\u2019s business depends on winning through density and execution rather than price.\n\nThe brokerage gave a \u2018Buy\u2019 rating for the new-age company stock with a target price of \u20b9 390 per share. \u201cWe assign a BUY rating to Eternal Ltd. with a target price of Rs. 390, implying an upside of 22.1%, based on an SOTP valuation,\u201d stated the brokerage in its report.\n\nEternal share price closed marginally higher at \u20b9 323.35 per share on BSE on Friday, October 9. Its share price value has surged 10.64% in three months, 35.92% in six months, and 14% in 2026 so far.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 07:26 PM IST", "pub_date_relative": "4h ago"}, {"title": "Ramayana Part 1 Advance Bookings To Open On Dussehra", "full_content": "Directed by Nitesh Tiwari, Ramayana: Part One stars Ranbir Kapoor as Lord Rama, Sai Pallavi as Sita and Yash as Ravana.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 07:26 PM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Want stable returns? What experts say on public and private markets offering better prospects", "full_content": "Fund managers Renuka Ramnath and Nilesh Shah offered different takes on what investor should do during a market downturn \u2014 seek access to private markets or hunt for distressed valuations in the public markets .\n\nSpeaking at Kotak Private\u2019s 3rd edition of \u2018Take and Counter Take\u2019, the ace investors discussed public and private market strategies during market downturns. While the Ramnath stressed on the safety of directly managing cash and costs as a board member in a private company; Shah noted the unique wealth creation opportunity created by public market investors selling assets below fair value. However, both agreed investors should diversify, rather than treat markets as an either-or choice.\n\nRamnath is Founder, MD and CEO of Multiples Alternate Asset Management, and Shah is MD of Kotak Mahindra Asset Management Company ( AMC ).\n\nPrivate markets are investments not traded on public exchanges. These include private equity (PE), venture capital ( VC ), private debt, and hedge funds, according to a Linqto report. Investors can gain exposure directly by purchasing shares in private companies or indirectly through private equity funds, it added.\n\nAccording to Oisharya Das, CEO of Kotak Private Banking, growth of private markets is giving India\u2019s wealth creators a broader opportunity set, while making portfolio-allocation decisions more nuanced.\n\nOn the optimal strategy during a market crash , Ramnath asserted that private markets offer a safe haven because investors retain active operational control. Rather than helplessly watching market capitalisation evaporate in the public sphere, private equity investors can utilise affirmative clauses to dictate cash usage, accelerate or defer initiatives, and actively steer the company through severe macroeconomic blows.\n\n\u201cIn an asset bubble crash, it could be better to be in private market because you are in control, you know what you're holding and you're not nervous.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 11:35 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, Silver Set For Range-Bound Week As Rupee Weakness Offers Support: Analysts", "full_content": "A weaker rupee is expected to cushion domestic bullion prices, while inflation data, US rate signals and geopolitical developments set the tone for gold and silver in the week ahead.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 10:55 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "From BJ\u2019s to Lululemon, retailers are trimming assortments to boost business", "full_content": "Retailers are trimming assortments in an effort to clean up their balance sheets.\n\nAs shoppers cut spending in the face of high gas and food prices, businesses have pulled more levers to boost profitability and appease investors. During earnings calls this year, a range of retailers have highlighted efforts to reduce the number of items they sell, commonly tracked as stock keeping units, or SKUs.\n\nIn March, Dollar General said it trimmed 1,500 SKUs. In August, Under Armour said it shrunk SKUs by 25% over the past few years and plans to cut another 25%, while BJ's Wholesale Club said it plans to reduce roughly 20% of SKUs . In September, Lululemon said it cut North America SKUs by 15%.\n\nTrimming inventory can help a business stabilize its sales or even get back to growth, and can reduce the chances a company gets stuck with unwanted inventory. But the move can also leave consumers with less choice \u2014 a trade-off many retailers have been willing to make.\n\nWhen a brand struggles to sell certain products, it can lead to discounting, which hurts profitability. Some markdowns are expected when businesses roll the dice on new products that don't end up selling well, but too many promotions can cause problems.\n\n\"If you have zero discounting, you're not taking enough fashion risk,\" said Guggenheim Securities senior retail analyst Simeon Siegel. \"But discounting needs to be fixing mistakes. It needs to be done quickly.\"\n\nUnder Armour and Lululemon are both facing repercussions from what investors see as too many markdowns.\n\nUnder Armour's operating income, which illustrates its underlying profitability, turned negative in fiscal 2025 and 2026. The company said its problems would not be solved by chasing unhealthy sales volume or short-term revenue.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 10:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Arab Spring, Hong Kong protests, Greece anti-austerity unrest: How historic mass protests shook stock markets?", "full_content": "Corporate earnings, business update, dividend , stock split, bonus, or any new acquisitions, in stock markets, every corporate action can trigger reaction. But what happens to exchanges across the world when protesters hit the street?\n\nFrom the Arab Spring to Hong Kong's 2019 protests and Greece's anti-austerity movement between 2010 and 2012, history offers several examples of mass demonstrations that coincided with significant market fluctuations.\n\nArab Spring was a wave of pro-democracy protests and uprisings that took place in the Middle East and North Africa between 2010 and 2011. The wave started with protests in Tunisia, and spread to Egypt. It even led to regime change in the two countries. It also inspired similar attempts in other Arab countries too.\n\nThe protests affected the country's markets as Egypt's benchmark index recorded its biggest drop in two years on January 27, 2011, reported CNBC.\n\nThe stock market fell more than 10%. EGX 30, the primary benchmark stock market index of the Egyptian Exchange, closed down 10.5% on Jan 27, 2011. The market also fell nearly 6.25% just 15 minutes into the session. THe stock market also saw two months long suspension during the unrest.\n\nA bill, proposed in 2019, to pave the way for extradition of Hong Kong citizens to mainland China, sparked a massive protest that saw violent clashes, alleged police brutalities, and garnered global attention. The bill was later withdrawn in October, but the massive protest coincided with steep decline in the Hong Kong stock market exchanges.\n\nAccording to a Bloomberg report, Hong Kong protest coincided with nearly 12% decline in Hang Seng index between July 2 and August 14, 2019. More than $ 600 billion of stock market value was erased between July and August in the year.\n\nGreece saw huge public protest against the austerity measures implemented by the Greek government.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 10:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tea Board pushes for more transparent, efficient tea auctions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Tea Board pushes for more transparent, efficient tea auctions The Economic Times daily newspaper is available online now. Read Today's Paper Tea Board pushes for more transparent, efficient tea auctions SECTIONS Tea Board pushes for more transparent, efficient tea auctions By Bikash Singh , ET Bureau Last Updated: Oct 11, 2026, 10:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tea Board India held a seminar to discuss reforms for improving the Pan-India e-Auction system. It focused on enhancing transparency and efficiency in India\u2019s tea auction process. The reforms have led to increased buyer participation and higher tea auction volumes over recent years. A new web-based tea auction platform is being introduced to further streamline operations and reduce costs.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 10:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Millions of Americans will have fewer options during Medicare open enrollment this year", "full_content": "There will be no Medicare Advantage plans in 181 counties in 2027, up from 67 in 2026.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 10:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Beta Technologies CEO Kyle Clark sells $612,234 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Publish your book for free and start earning: What is Amazon KDP? Here\u2019s how it works", "full_content": "Publishing your book does not have to start with printing bills or publisher approvals. Amazon Kindle Direct Publishing (KDP) lets writers publish without upfront publishing fees. You can offer an eBook, a paperback or a hardcover and earn royalties when readers buy copies.\n\nStart by preparing your manuscript. Read through chapters and correct spelling, grammar and unclear sentences. Use grammar tools to support your checks. Spending time on editing helps you present a polished book to readers.\n\nNext, organise the pages so your book is comfortable to read. You can upload Word documents, EPUB files and PDFs as accepted eBook formats. Amazon, however, prefers the other two formats to PDFs.\n\nFree tools such as Kindle Create help arrange chapters, contents pages and paragraph margins. For paperbacks, check page dimensions, margins and page numbers. KDP\u2019s free templates can help you prepare the layout.\n\nEnglish is the most-preferred language for Amazon KDP. Take a look at all accepted languages for books:\n\nThen, create a cover that represents your book. Make sure it remains readable as a small image on a phone screen. You can use Canva\u2019s book cover templates to design one for free. Check that the title and author name are easy to spot.\n\nOnce your files are ready, visit the official KDP website. Sign in using your Amazon account details. Complete your author profile and provide the tax information. Add your banking details so your earnings can be deposited into your account.\n\nSelect \u2018Create\u2019 and choose an eBook or paperback. Enter the book title, subtitle and author name. Write a clear description explaining what readers can expect. Treat this description like the introduction printed on a book\u2019s back cover.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 09:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI's rupee defence may drain banking liquidity, ease currency pressure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI's rupee defence may drain banking liquidity, ease currency pressure The Economic Times daily newspaper is available online now. Read Today's Paper RBI's rupee defence may drain banking liquidity, ease currency pressure SECTIONS RBI's rupee defence may drain banking liquidity, ease currency pressure PTI Last Updated: Oct 11, 2026, 09:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis RBI has introduced measures to curb rupee volatility, which could ease immediate depreciation pressures in the currency market. These measures include limiting foreign exchange derivative contracts and increasing hedging costs for importers. Experts predict that these actions may lead to a reduction in USD/INR rates and forward premiums. However, external factors like crude oil prices may still pose challenges.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 09:31 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank FD rates in October 2026: How pre- and post-tax fixed deposit returns differ across HDFC, ICICI, SBI and PNB", "full_content": "Fixed deposits ( FDs ) offer predictable returns, but the interest earned is taxable as per the depositor\u2019s applicable income tax slab. Therefore, investors should compare both pre-tax and post-tax returns before choosing a bank or deposit tenure.\n\nAccording to FundsIndia\u2019s October 2026 report, FD interest rates across large banks vary by tenure, affecting the returns investors retain after tax. Here\u2019s what depositors need to know.\n\nInterest earned on bank FDs is taxable under \u201cIncome from Other Sources\u201d and added to the depositor\u2019s taxable income. The applicable income tax slab determines the final tax liability.\n\nBanks may deduct tax at source (TDS) when interest exceeds the applicable threshold. For bank deposits, the threshold is \u20b9 50,000 in a financial year for non-senior citizens and \u20b9 1 lakh for senior citizens. TDS is generally deducted at 10% when the depositor\u2019s PAN is furnished.\n\nHowever, TDS is not the final tax liability. Depositors may have to pay additional tax or may be eligible for a refund when filing their income tax return (ITR), depending on their actual tax liability.\n\nThe following table compares pre-tax and post-tax FD rates across HDFC Bank, ICICI Bank, State Bank of India (SBI), and Punjab National Bank (PNB) for different tenures.\n\nSource: FundsIndia October report. FD rates for deposits below \u20b9 3 crore, as of 7 October 2026. Post-tax returns are calculated assuming a 30% tax rate.\n\nSuppose an investor deposits \u20b9 5 lakh in a five-year FD at an annual interest rate of 6.40%. Assuming quarterly compounding, the deposit would grow to approximately \u20b9 6,86,822 at maturity, including \u20b9 1,86,822 in interest before tax.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 09:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Fixed Income"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "India's services demand outlook positive for Q3FY27, margin concerns persist: RBI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India's services demand outlook positive for Q3FY27, margin concerns persist: RBI The Economic Times daily newspaper is available online now. Read Today's Paper India's services demand outlook positive for Q3FY27, margin concerns persist: RBI SECTIONS India's services demand outlook positive for Q3FY27, margin concerns persist: RBI ANI Last Updated: Oct 11, 2026, 08:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's services sector is expected to maintain a positive demand outlook in Q3FY27, although business optimism has moderated compared with the previous quarter, with firms anticipating some easing in cost pressures but remaining less optimistic about selling prices and profit margins, according to the Reserve Bank of India's (RBI) latest Services and Infrastructure Outlook Survey.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 08:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gulf Markets End Lower As Riyadh Airport Attack Fuels Tensions", "full_content": "Gulf markets come under pressure as escalating regional tensions and Strait of Hormuz shipping disruptions unsettle investors, with Qatar\u2019s benchmark index falling to its lowest level since May 2020.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 08:27 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Welcome back to earnings season: What to watch this week - Yahoo Finance", "full_content": "Welcome back to earnings season: What to watch this week Yahoo Finance 3 Big Bank Stocks Facing A Q3 Test As Treasury Yields Rise Yahoo Finance Cramer\u2019s week ahead: Earnings kick off as banks and chipmakers face big tests CNBC Wells Fargo, Bank of America, Domino\u2019s, Johnson & Johnson, Inflation Data, and More to Watch This Week Barron's Goldman Set to Lead Wall Street\u2019s $19 Billion Stock-Trading Haul Bloomberg.com", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 08:17 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Buy, Sell Or Hold: SBI, Ather Energy, Suzlon, Canara Bank, Manappuram Finance, P&G Hygiene | Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 08:10 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Aiming to build long term wealth? Experts suggest these steps to build financial capability", "full_content": "India is set to add 10 crore long-term investors by 2035 as wealth creation expands to tier 2 and 3 cities, according to EY India's \u2018Wealth inclusion in India: Expanding investor participation beyond metros\u2019 report.\n\nIt further noted the untapped potential: India currently has over 55 crore active UPI users, compared to the 6.2 crore mutual fund investors and about 5 crore active equity market participants. \u201cThe gap indicates that while digital access has scaled rapidly, broad-based wealth participation is still at an early stage,\u201d it stated.\n\nGiven the potential, the report added that for India's wealth inclusion agenda, expanding participation could require more than creating awareness of investment products. \u201cIt could require helping investors make better decisions at every stage of their financial journey,\u201d moving from financial literacy to financial capability.\n\nThe report noted that for long, financial literacy has been viewed as the primary solution to low investor participation by governments, regulators and financial institutions. And while initiatives such as awareness campaigns, educational content and investor education programs have played an important role in expanding awareness, this has not consistently translated into participation.\n\n\u201cMany households understand the importance of investing yet delay getting started. Many investors \u2026 discontinue SIPs during periods of market volatility... The challenge therefore extends beyond knowledge,\u201d it added.\n\nAs per EY, the gap between awareness and action remains one of the most persistent barriers to wealth creation .", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 07:59 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI\u2019s quiet safety gatekeepers are stepping into the spotlight", "full_content": "Two months ago, independent evaluators occupied a relatively sleepy corner of the multitrillion-dollar artificial intelligence industry. Now they're being asked to come to its rescue.\n\nWhile Anthropic and OpenAI are at the heart of a fierce debate over whether they can safeguard their advanced models and grow their businesses simultaneously, they're seeking support from a handful of small third-party groups like Model Evaluation and Threat Research (METR), Apollo Research, and Transluce.\n\nThe evaluators, which mostly operate as nonprofits, are still finding their footing in an industry where capital is flowing at historic levels and new models are rolling out faster than ever. Their primary role has been to assess AI model capabilities and risks and to flag instances where the technology behaves badly.\n\nWithout a federal push for regulation, evaluators have taken on outsized importance. Anthropic CEO Dario Amodei pledged to embed independent evaluators in his company last month \u2013 a move that OpenAI CEO Sam Altman quickly endorsed . President Donald Trump supported the idea, as did most of the largest U.S. tech companies. But left unanswered are questions about how those third parties should be funded, what level of access they will have and what the reporting structure will ultimately look like.\n\n\"To a degree, the problem, as always, is money,\" Suresh Venkatasubramanian, a computer science professor at Brown University, told CNBC in an interview. \"Who is paying for these companies to do their work? How are they going to support them? You need an ecosystem, you need a viable business model for this.\"\n\nRight now, Anthropic, OpenAI and the infrastructure partners that are profiting from the AI boom are writing the rules.", "source": "CNBC World Economy", "pub_date_str": "11 Oct 2026, 07:38 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "We\u2019re about to get a huge read on whether earnings can keep propping up the stock market", "full_content": "High hopes for third-quarter earnings are outweighing concerns around interest rates and oil prices \u2014 but one expert warns markets have gotten \u201cextremely complacent.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 07:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Food delivery stock to buy: Eternal shares - 36% returns in 6 months by Zomato parent | 22% more upside ahead?", "full_content": "Food delivery stock to buy: Shares of Eternal Limited have delivered nearly 36% return in six months. Continued strong growth in quick commerce, improving customer retention and better operating efficiency are likely to boost the outlook for the Zomato parent firm, according to experts.\n\nEternal share price ended marginally higher on Friday after gaining nearly 3% over the last week. As the stock has also delivered promising returns over the past six months, experts continue to remain bullish on the stock.\n\nImprovement in Blinkit sales, strong retention and growing customer base are likely to support Eternal business. Additionally, affordability is driving growth without hurting margins of Eternal, according to Joindre Capital Services Limited, which sees strong growth potential in District , Eternal\u2019s going-out app for movie tickets, live events, dining and sports-venue bookings.\n\n\u201cThe outlook remains positive, led by continued strong growth in quick commerce, improving customer retention and better operating efficiency. Management indicated that Blinkit\u2019s long-term adjusted EBITDA margin guidance has been raised to around 6% from the earlier 5\u20136% range, supported by higher capex per store, larger store formats and improving productivity,\u201d read the brokerage report.\n\nStrong competition in the quick commerce space is a key concern for Eternal growth. Growth in Blinkit\u2019s business depends on winning through density and execution rather than price.\n\nThe brokerage gave a \u2018Buy\u2019 rating for the new-age company stock with a target price of \u20b9 390 per share. \u201cWe assign a BUY rating to Eternal Ltd. with a target price of Rs. 390, implying an upside of 22.1%, based on an SOTP valuation,\u201d stated the brokerage in its report.\n\nEternal share price closed marginally higher at \u20b9 323.35 per share on BSE on Friday, October 9. Its share price value has surged 10.64% in three months, 35.92% in six months, and 14% in 2026 so far.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 07:26 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How much cash to hold in a savings account while waiting for a market correction?", "full_content": "I have a substantial amount sitting in my savings account because I\u2019m waiting for a better entry point in the market. How do I decide how much cash is sensible to hold and how much is simply money sitting on the sidelines?\n\nWhen markets are uncertain, holding some money in your savings account can provide a sense of security. You have the flexibility to invest if markets correct, but how do you know when the right time to invest is? Even though holding cash may feel like the safer choice, it may not always be the right one. So, where do you start?\n\nA good place to start is by setting your financial goals and looking at when you will need the money. Goals that are one to two years away need greater stability, so the money can be kept in debt. For goals that are two to five years away, you can consider a mix of equity and debt . Goals that are more than five years away give you more time to take a growth-oriented approach.\n\nOnce you have clarity on your goals, look at your overall asset allocation. For a long-term portfolio, you can consider allocating 60\u201380% to equity, with the remaining amount invested in debt-oriented products. Equity can provide the growth needed over the long run, while debt can bring stability to the portfolio. As you get closer to a goal, you can gradually move the money towards more stable investments.\n\nOnce you have decided your asset allocation, the next step is to choose the right investments within each part of the portfolio. For equity, around five funds across categories such as large cap, mid cap , small cap, flexi cap, and multi cap can be a starting point. The right combination will depend on your existing portfolio and the diversification you need. For the debt portion, options such as target maturity funds or arbitrage funds can be considered, depending on your tax bracket and liquidity needs.\n\nThere is another part of the plan that is important when you are investing for the long term.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 07:17 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "EV stock to b     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
