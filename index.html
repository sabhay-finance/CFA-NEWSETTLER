October\u2019s decorative sales growth was the highest in the past 25-30 months.\n\nTo mend margins, Berger plans more calibrated price hikes. How volumes respond amid elevated competition should be monitored.\n\nNew entrant Birla Opus \u2019 decorative paint prices are now in line with industry levels, after being nearly 5% lower, Berger said. While Berger\u2019s market share remained broadly stable at nearly 20.2% in H1FY27, competition remains a threat as Birla continues to offer higher dealer rebates.\n\nBerger is also strengthening its retail network, which exceeded 2,000 stores as of H1FY27, alongside a tinting machine network of 4,800.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mint Explainer | US AI sell-off: Are Indian AI-linked stocks next?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nA month of losses in US technology stocks has revived fears of an AI bubble. The sell-off has spread to Indian companies riding the AI buildout, from data centres to power and cooling suppliers. Though India lags in foundational AI, its listed firms are exposed to the global investment cycle. Are India's AI and IT stocks headed for a similar reckoning? Mint explores.\n\nIn September, Goldman Sachs identified 42 Indian companies outperforming global and Asian AI stocks. Of these, 34 fell an average 7% in October, a Mint analysis shows.\n\nAnant Raj, a data centre operator, and Himadri Speciality Chemical, a supplier of materials used in cooling systems, led the losses, falling 25% each. Bharti Airtel and Blue Star were among the few major gainers.\n\nThe sell-off mirrored a broader correction: the Nasdaq fell 5% in October, with Intel down 45%, Google 19%, and Meta 15%.\n\nInvestors are questioning whether generative AI can deliver returns to justify the hundreds of billions of dollars being invested in it. AI has yet to demonstrate consistent productivity gains or create higher-quality jobs to offset those displaced, while cybersecurity and sensitive enterprise data risks remain concerns.\n\nThe sell-off deepened as Amazon, Google , Microsoft and Meta pledged further data centre investments, even as some reported earnings below Street expectations. The question is no longer whether AI will grow, but whether it can generate enough revenue and profits to justify the spending.\n\nData centre infrastructure suppliers have been among the biggest beneficiaries. Goldman Sachs's September report valued the 42 identified companies at a combined $670 billion. These span power generation, transmission, electrical equipment and cooling, including Tata Power, Adani Green Energy, Cummins India and Blue Star. They stand to benefit from data centre expansion regardless of which AI platforms win.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BSE Share Price Gains Over 2% After ICICI Securities Upgrades Rating To 'Add', Raises Target", "full_content": "ICICI Securities highlighted a sharp improvement in BSE's operating performance, with quarterly EBITDA, excluding the Settlement Guarantee Fund (SGF), rising to Rs 10.9 billion in Q2FY27 from Rs 1.9 billion in Q2FY24.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why KPI Green Energy, Waaree Energies shares are rising today; over 5% jump amid post Diwali Sensex, Nifty fireworks", "full_content": "WAAREEENER Vaamanaa Sethi Published 11 Nov 2026, 11:41 AM IST Prefer Livemint on Google Indian energy stocks like KPI Green Energy and Waaree Energies jumped up to 5% in Wednesday's trading session amid strong rally in the Indian stock market after Diwali.\n\nWaaree Energies shares rallied 4.91% to hit an intraday high of \u20b9 2,613.30 apiece on Wednesday. Meanwhile, KPI Green shares advanced nearly 2% to \u20b9 347.75 per share during the trading session on November 11.\n\nMeanwhile, Indian equity benchmarks surged more than 1% on Wednesday, climbing to an eight-month high as softer crude oil prices and growing concerns over AI investments triggered foreign investor inflows, following nearly two years of sustained outflows. At 10:07 am IST, the Nifty 50 advanced 1.25% to 25,358, while the Sensex jumped 1.47% to 82,301.1. Both indices touched their highest levels since February 27.\n\nIt is worth noting that the sharp rally in KPI Green Energy shares was not backed by any specific fundamental trigger. However, the stock witnessed a significant jump in trading activity, with around 72.25 lakh shares changing hands during the intraday session on November 11.\n\nWaaree Energies is planning to invest approximately \u20b9 15,000 crore in setting up a green ammonia manufacturing facility in Andhra Pradesh's Kakinada Special Economic Zone (SEZ). The proposed plant will have an annual production capacity of 1.2 million tonnes, according to a report by The Economic Times.\n\nLocated near Kakinada Gateway Port, the project is expected to boost Andhra Pradesh's emergence as a key destination for green energy and clean fuel industries. Waaree Clean Energy has already acquired nearly 300 acres of land in the Kakinada SEZ, close to the port, for the proposed facility.\n\nAccording to the report, the company is likely to formally announce the investment at the two-day Andhra Pradesh Investment Summit scheduled to take place in Visakhapatnam this week.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI stock Nvidia crashed but Netweb Technologies shares jumped 8% today after falling 13% in 1 month? Reasons; target", "full_content": "Pranati Deva Published 11 Nov 2026, 11:30 AM IST Prefer Livemint on Google Netweb share price : While global AI heavyweight Nvidia came under pressure on Wall Street, Indian AI infrastructure company Netweb Technologies moved in the opposite direction, with its shares rallying nearly 8% in morning trade on Wednesday, November 11.\n\nWhile Nvidia shares tumbled 5.5% in overnight trading on Wall Street amid an investigation into CEO Jensen Huang's relationship with a woman suspected of being a Chinese spy, Indian AI stock Netweb Technologies moved in the opposite direction, surging nearly 8% on Wednesday, November 11.\n\nThe contrast is notable given Netweb Technologies' 15-year partnership with Nvidia, one of the world's leading AI chipmakers. Huang has acknowledged the reported relationship and apologised, while US President Donald Trump said the FBI was investigating the matter. Nvidia's independent board members have also brought in law firm Wachtell, Lipton, Rosen & Katz to assist with the probe.\n\nDespite the pressure on its global technology partner, Netweb Technologies shares attracted strong buying interest, supported by value buying following a recent correction and the company's record September-quarter earnings.\n\nIn today's deals, the stock advanced as much as 7.8% to an intra-day high of \u20b9 4141.75 per share. However, it remains around 28% below its 52-week high of \u20b9 5,810, recorded in August 2026. Its 52-week low stands at \u20b9 2,942.45, touched in December last year.\n\nThe stock had declined 13% in one month and 15% over three months before Wednesday's rally. The company's strong Q2 FY27 performance, growing AI infrastructure business and sizeable order pipeline have provided fresh triggers for investor interest.\n\nThe rebound in Netweb Technologies shares was supported by improving sentiment across technology stocks. The Nifty IT index jumped around 4%, as heavyweight IT and technology companies witnessed strong buying interest.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Investors pivot to defensive stocks as markets enter a \u2018state of alert\u2019", "full_content": "Markets are in a \"state of alert,\" according to analysts monitoring a pivot from riskier tech sector bets into defensive stocks.\n\nTechnology stocks \u2014 a key driver of rallies in recent years \u2014 have been notably volatile in 2026. Concerns about artificial intelligence \u2014 particularly when it comes to capital expenditure, cash flow, debt and circular financing \u2014 have sparked multiple bouts of volatility this year.\n\nThe Democrats' sweep of Congress in the U.S. midterm elections amplified pressure on the sector last week.\n\nWall Street's tech-heavy Nasdaq Composite Index is up by around 8.7% since the start of the year as of Nov. 9 close, but gave up some of its year-to-date gains in October when it shed 5.3% over the course of the month. The index \u2014 home to Big Tech names including Nvidia , Microsoft , Alphabet and Apple \u2014 has staged a recovery in recent days, but remains in the red for November and is down 0.7% for the month so far after dipping into correction territory last week.\n\nNasdaq Composite's performance over the past month The Nasdaq isn't the only tech-focused index to have seen big losses over the past month. South Korea's Kospi index, which is heavily exposed to the semiconductor sector, lost 16.2% in October and is down more than 8% month-to-date.\n\nThe MSCI World Information Technology index lost 7% in October, and has shed a further 4.6% so far this month. MSCI's U.S.-only IT index is down 11.5% since October.\n\nAt the same time, stocks in defensive sectors have seen broad gains.\n\nMSCI's indexes encompassing the consumer staples, healthcare and utilities sectors \u2014 widely seen as more stable assets in the equity market during times of volatility or uncertainty \u2014 have all risen significantly over the last month.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India bonds slip as Treasury rout offsets oil slide", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds slip as Treasury rout offsets oil slide Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds slip as Treasury rout offsets oil slide SECTIONS India bonds slip as Treasury rout offsets oil slide Reuters Last Updated: Nov 11, 2026, 11:09:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds declined on Wednesday as a sharp rise in US Treasury yields, triggered by hotter-than-expected inflation and hawkish signals from policymakers, overshadowed relief from lower crude oil prices. Higher US yields could erode the relative return advantage of Indian debt, dampening its appeal among foreign investors.\n\nIndian government bonds declined on Wednesday as a sharp rise in US Treasury yields, triggered by hotter-than-expected inflation and hawkish signals from policymakers, overshadowed relief from lower crude oil prices. Higher US yields could erode the relative return advantage of Indian debt, dampening its appeal among foreign investors.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 11:09 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IndiGo shares: InterGlobe Aviation stock flying 5% high, among top Nifty 50 gainers | Buy? Target price, upside", "full_content": "CURRENT Vaamanaa Sethi Published 11 Nov 2026, 10:58 AM IST Prefer Livemint on Google InterGlobe Aviation shares, the parent company of aviation giant IndiGo, rallied as much as 5% in Wednesday's trading session amid a strong bull run in the Indian stock market. The aviation stock was the top gainer on Nifty 50 on November 11.\n\nIndiGo share price opened at \u20b9 5,520 apiece on NSE today, as compared to the previous close of \u20b9 5,430 on Monday and touched an intraday high of \u20b9 5,692.30 on Wednesday.\n\nThe stock rally also came in amid falling crude oil prices on hopes for a de-escalation in the Iran war and concerns about ongoing attacks on shipping in the Strait of Hormuz.\n\nMeanwhile, Indian equity benchmarks, the Sensex and Nifty, opened Wednesday's session on a strong note, supported by foreign fund inflows, better-than-expected September-quarter earnings and a continued decline in crude oil prices. The 30-share BSE Sensex surged 1,097.33 points to 82,186.92 in early trade, while the NSE Nifty 50 advanced 274.30 points to 25,317.55.\n\nIndiGo reported a reduction in its consolidated net loss to \u20b9 1,879.1 crore in the September quarter of FY27, compared with a loss of \u20b9 2,582.1 crore in the corresponding quarter last year.\n\nThe airline's profitability remained under pressure due to elevated aviation fuel costs and rupee depreciation. However, CEO Willie Walsh said the company has multiple levers at its disposal to manage the rising operating expenses.\n\nThe country's largest airline said it would continue prioritising short-haul routes and follow a cautious capacity expansion strategy amid ongoing challenges in the aviation sector.\n\nAccording to its regulatory filing, InterGlobe Aviation's total income rose to \u20b9 24,311.9 crore in Q2 FY27 from \u20b9 19,599.5 crore in the year-ago period. However, total expenses also increased significantly to \u20b9 26,188.4 crore during the quarter.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 10:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rupee rises 7 paise to 93.70 against US dollar in early trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee rises 7 paise to 93.70 against US dollar in early trade The Economic Times daily newspaper is available online now. Read Today's Paper Rupee rises 7 paise to 93.70 against US dollar in early trade SECTIONS Rupee rises 7 paise to 93.70 against US dollar in early trade PTI Last Updated: Nov 11, 2026, 10:46:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The rupee strengthened 7 paise to 93.70 against the US dollar in early trade on Wednesday, supported by sustained foreign fund inflows, easing crude oil prices and improving geopolitical sentiment. The domestic currency has emerged as one of Asia's best performers in FY27, with traders expecting continued overseas investor participation to provide a buffer against external uncertainties.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 10:46 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "U.S., China should \u2018harbor no illusions\u2019 as they cooperate, compete on AI, Bessent says", "full_content": "The U.S. and China should \"harbor no illusions\" about their differences as they engage to contain the risks of artificial intelligence, while competing with each other at the same time, Treasury Secretary Scott Bessent said.\n\nBessent said in prepared remarks to the National Committee on U.S.-China Relations in New York Tuesday that the two governments had established a new dialogue mechanism on \"super intelligence,\" or SI, aimed at guarding against \"shared risks\" and averting any \"misunderstanding between our two systems.\"\n\nThe mechanism will see both sides exchanging \"best practices\" for testing advanced models before they are released, and \"keeping human judgement firmly in command of the technology,\" Bessent said, expecting both sides to alert each other to serious incidents involving the SI models.\n\nBessent, however, stopped short of making any commitment to limit advancement of the technology, as Beijing and Washington remain locked in an intense race to achieve global dominance in AI.\n\nThe Trump administration has largely resisted broadening restrictions on AI development over concerns of ceding a competitive edge to China, though the president has more recently signaled some openness to putting in place regulatory safeguards.\n\n\"I \u200bdon't mind guardrails,\" he said in a CBS interview released Sunday , adding that \u2060he did not want regulations to put the U.S. in \"a deep second position\" behind China, \u200bwhich he \u200bsaid \u2060had no such restrictions.\n\nChina's foreign ministry in September dismissed calls to slow down frontier models, saying that fearmongering and confrontation would only disrupt global AI governance.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 10:45 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Balmer Lawrie share price jumps 16% as stock rallies after strong Q2 results, gains 19% in two weeks | Check key levels", "full_content": "Balmer Lawrie & Company shares surged over 16% on Wednesday, 11 November, in line with positive sentiment in the broader stock market. The rally comes after the company's strong Q2 FY27 earnings, which have fuelled buying interest in the counter.\n\nThe stock has gained 13.15% over the past week following its September-quarter results, while its two-week return stands at 19.06%. It has advanced 18.38% over the past month.\n\nOn 3 November, Balmer Lawrie & Company reported a 39.56% year-on-year increase in standalone net profit to \u20b9 67.66 crore for the second quarter ended 30 September 2026, compared with \u20b9 48.48 crore in the corresponding quarter last year.\n\nThe company's total income rose 26.34% to \u20b9 818.04 crore in Q2 FY27 from \u20b9 647.48 crore a year ago. Profit before tax (PBT) increased 42.95% to \u20b9 93.63 crore, compared with \u20b9 65.50 crore in the year-ago period.\n\nFor the first half of FY27, total income stood at \u20b9 1,570.58 crore, up from \u20b9 1,332.76 crore in the corresponding period last year. PBT rose to \u20b9 172.75 crore from \u20b9 140.88 crore, while net profit increased to \u20b9 125.32 crore from \u20b9 104.41 crore.\n\nThe company's board approved the financial results at a meeting held in Hampi, Karnataka, on 2 November.\n\nBalmer Lawrie is a Miniratna-I public sector enterprise with diversified business operations.\n\nBalmer Lawrie & Company is planning a capital expenditure programme of nearly \u20b9 500 crore over the next three years, primarily to expand its railway logistics, third-party logistics (3PL) and travel businesses.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 10:43 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ashoka Buildcon shares soar 14% after new NHAI order win, still down 43% in 1 year - check contract details, performance", "full_content": "Pranati Deva Published 11 Nov 2026, 10:32 AM IST Prefer Livemint on Google Ashoka Buildcon shares rallied sharply on Wednesday, November 11, after the infrastructure company secured a fresh contract worth \u20b9 865.90 crore from the National Highways Authority of India (NHAI). The Letter of Acceptance (LoA) for the highway project marked the formal award of the contract, for which the company had submitted its bid on November 5, 2026.\n\nThe order announcement lifted investor sentiment, with the stock gaining as much as 14% during the session. However, the rally came against the backdrop of weak quarterly earnings, with the company reporting an 18.72% year-on-year decline in revenue and swinging to a net loss in the September quarter of FY27.\n\nAshoka Buildcon shares climbed 14% to touch an intra-day high of \u20b9 117.36. The stock had opened at \u20b9 108.62, compared with its previous closing price of \u20b9 103. Despite Wednesday's sharp gains, it remained significantly below its 52-week high of \u20b9 204.15, recorded in November 2025. Its 52-week low stood at \u20b9 95.40, touched in October 2026.\n\nThe latest contract involves completing the balance construction work on an eight-lane, access-controlled section of the expressway between Karvad and Jujuwa in Gujarat. The project covers a stretch of 26.6 km, extending from Km 128.0 to Km 154.6.\n\nAshoka Buildcon will execute the project under the engineering, procurement and construction (EPC) model. The contract is valued at \u20b9 865.90 crore, excluding Goods and Services Tax (GST).\n\nThe latest development follows the company's announcement earlier this month that it had emerged as the lowest bidder (L1) for the NHAI project. The receipt of the LoA now formalises the contract award, taking the project from the bidding stage to execution.\n\nThe highway order also adds to a series of recent contract wins for Ashoka Buildcon.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 10:32 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO valuation calculator: How much is it really worth?", "full_content": "As the Claude maker prepares to make its Wall Street debut, the FT\u2019s interactive valuation calculator can help readers decide whether the AI giant is worth $500bn or $4tn", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "France and Belgium fall foul of Eurozone bond market\u2019s new divide", "full_content": "Global sell-off during Iran war has prompted investors to zero in on new group of Eurozone countries facing debt challenges", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Cochin Shipyard shares crash 8%: Defence PSU stock Q2 profit drops 50% but declares \u20b93 dividend- Still a stock to buy?", "full_content": "Cochin Shipyard shares fell 8% after Q2 FY27 net profit nearly halved to \u20b953.77 crore, despite revenue rising 11.7%. Higher expenses and a loss in shipbuilding weighed on results. The company announced a \u20b93 interim dividend.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 10:08 AM IST", "pub_d week high after the company reported Q2 FY27 net profit growth of 64% to \u20b9427 crore and revenue growth of 32% to \u20b910,323 crore. Brokerages maintained Buy ratings, while the stock\u2019s gains extended across multiple timeframes.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 09:46 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dr Reddys Share Price Live Updates: Dr. Reddys News", "full_content": "", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 09:46 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "TD Power shares up 350% up in 3 years, jumps 5% today as Sensex, Nifty jump massively | More upside? target, stop loss", "full_content": "TD Power share price opened at \u20b9580.35 per share on NSE today, as compared to previous close of \u20b9571.65 on Monday and touched an intraday high of \u20b9604 on November 11.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 09:45 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Massive jump in Sensex, Nifty! \u20b94.5 lakh cr wealth added in a few mins - Reasons for bullish party", "full_content": "The Sensex and Nifty climbed more than 1% in Wednesday trading, led by gains in major stocks including IndiGo, M&amp;M and HDFC Bank. Mid- and small-cap shares also advanced as easing oil prices and improved investor sentiment buoyed markets.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 09:33 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "11 Nov 2026, 01:22 PM IST", "total_stories": 306};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
