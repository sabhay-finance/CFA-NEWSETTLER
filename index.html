e major buyers of heavier oil, have benefited from the additional supplies from Canada and Latin America, while higher shipping costs are depressing the value of barrels at their origin because they\u2019re expensive to move overseas to refiners. Flows from the Persian Gulf have also increased.\n\n\u201cIncremental supply looks to be dominated by heavier and more sour barrels, especially out of Canada, Venezuela, and the Middle East,\u201d Valero\u2019s head of crude supply Randy Hawkins said in an October earnings call.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 02:22 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018Nvidia\u2019s turmoil has me spooked\u2019: Should I sell my stocks and buy real estate \u2014 or ride out the storm?", "full_content": "Tempted to ditch stocks for property or CDs? Take a deep breath before making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:20 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Congress passes bill to protect older investors from financial fraud", "full_content": "Bipartisan legislation aimed at protecting older Americans and other vulnerable adults from financial fraud has cleared Congress , putting it on track to become law.\n\nCalled the Financial Exploitation Prevention Act of 2025 and passed by the House in June, H.R. 2478 was approved by unanimous consent in the Senate Wednesday night \u2014 meaning no senators objected to its passage.\n\nThe measure will next head to President Donald Trump 's desk. The White House did not respond to a CNBC request for comment on whether Trump plans to sign the bill into law.\n\nThe bill would generally allow mutual fund companies and their transfer agents, which handle shareholder records and transactions, to temporarily delay paying out redemption requests when they suspect an older or otherwise vulnerable investor is being financially exploited.\n\n\"Financial exploitation can have devastating consequences for victims and their families,\" said Erin Koeppel, a managing director and government relations and public policy counsel at the CFP Board, the organization that oversees the certified financial planner certification. \"This legislation fills an important regulatory gap that can help protect vulnerable investors before assets are lost.\"\n\nThe measure's congressional approval comes amid growing financial fraud among older Americans. Those age 60 or older reported losing about $3 billion to fraud in 2025, a 25% increase from $2.4 billion in 2024, according to the Federal Trade Commission's latest report to Congress on fraud among older adults , which was released in October. That amount is 400% higher than the $600 million reported lost in 2020.\n\n\"Generally, we support all legislation that aims to prevent any form of financial elder abuse,\" said Bob Blancato, national coordinator for the Elder Justice Coalition, an advocacy group.\n\nWhile just 6% of older fraud victims reported losing $100,000 or more in 2025, those losses accounted for 70% of the age group's total reported losses.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 02:06 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Kraken parent's acquisition of Tribe Capital flags new chapter in evolution of crypto exchanges", "full_content": "Payward, the owner of crypto exchange Kraken, is pushing into private markets with its latest acquisition, underscoring a broader shift in cryptocurrencies, from trading-led growth to the buildout of financial infrastructure.\n\nPayward said late Wednesday that it's buying venture capital and asset management provider Tribe Capital Management, led by Payward's co-CEO Arjun Sethi. No purchase price was disclosed.\n\nTribe, where Sethi is co-founder and chairman, invests across early- and late-stage private companies and has $2.7 billion in assets under management.\n\n\"Joining Payward gives us the opportunity to bring Tribe's investment approach to a global financial platform,\" Jonathan Hsu, another co-founder of Tribe Capital, said in a statement. \"We see a strong fit between our investment approach and Payward's infrastructure, distribution, and product-building capabilities.\"\n\nThe acquisition is novel among crypto exchanges. Unlike exchange-owned venture arms such as Coinbase Ventures or Binance Labs, Payward is looking to integrate Tribe's investment and fund-management capabilities into an existing custody, trading, collateral and tokenization infrastructure to develop private-market investment products.\n\nPayward is trying to position itself to capture value from a broader crypto-driven transformation of financial services, not use the venture vehicle to draw more capital into the crypto ecosystem.\n\nThe acquisition is another step in the evolution in the crypto exchange business model. With cryptocurrency prices continuing to decline this year, crypto exchanges have worked to move past their reliance on trading volumes and transaction fees, focusing instead on building the infrastructure connecting digital assets with traditional finance.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "A CoreWeave co-founder just made an unconventional $30 million wager on its battered bonds", "full_content": "While executives typically buy shares to signal confidence, CoreWeave co-founder Brian Venturo is turning to the bond market to calm AI jitters.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 01:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Latin America Currencies Sink on Rate Worries; Brazil Intervenes", "full_content": "(Bloomberg) -- A sell-off in Latin American currencies deepened Thursday, sending the Mexican peso to its lowest since June 2025 and forcing Brazil\u2019s central bank to step in to prop up the real, amid the mounting prospect of more rate hikes in the US.\n\nThe Colombian peso led losses across emerging markets, tumbling as much as 3.4% against the greenback. The Mexican peso traded past 19 pesos per dollar, the lowest since June 2025, after central bank minutes confirmed the institution\u2019s dovish stance. And in Brazil, the real dropped nearly 0.7% as investors shrugged off the first dollar spot auction since late 2024, which came after President Luiz In\u00e1cio Lula da Silva said he was in no rush to announce a new finance minister.\n\nThe moves weighed on MSCI\u2019s EM currency index, which fell 0.2% and is on track for a fourth week of declines \u2014 the longest such streak since March. The dollar, meanwhile, gained as traders continued to assess hawkish statements by Federal Reserve officials.\n\nThe pressure on Latin America is partly driven by domestic issues, such as fiscal worries in Brazil, a dovish central bank in Mexico, recessionary headwinds in Chile and the potential dilution of the fiscal reform in Colombia, said Benito Berber, chief Americas economist at Natixis.\n\nMore generally, \u201ctwo factors may be driving weaker currencies despite the rally in US equities: higher Treasury yields and the repricing of Fed hikes, coupled with seasonal factors as trading desks reduce risk ahead of year-end,\u201d he added.\n\nThe South African rand, a bellwether for risk, was down by more than 1% after local policymakers left interest rates unchanged at their final meeting of the year, while the Hungarian forint dropped on signs of a possible rate cut next month.\n\nSimon Quijano-Evans, head of strategy at Macro Hive Ltd.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "3-step method to influence people and win them over, from a Stanford expert: \u2018Your voice is like a muscle\u2019", "full_content": "Think back on the most memorable, inspiring speeches or presentations you've witnessed. They probably weren't delivered in a monotone, Matt Abrahams says.\n\n\"The human brain is designed to pick out and focus on things that are novel and new,\" says Abrahams, a Stanford University lecturer on strategic communication and host of the \" Think Fast, Talk Smart \" podcast. \"So anything that stays the same, like a monotonous voice or cadence, we don't pay as much attention to.\"\n\nIndeed, successful leaders often have an uncanny ability to win over a crowd: The power of persuasion lies not just in what you actually have to say, but also in how you say it, research shows . The topic has taken on new relevance this week as Nvidia interim CEO Colette Kress steps into one of the most closely watched leadership roles in corporate America.\n\nIn appearances this week, including Nvidia's quarterly earnings call and an interview with CNBC's \"Mad Money\" host Jim Cramer, Kress has discussed the company's performance. She's also addressed employees and investors in a time of leadership upheaval, following Nvidia co-founder Jensen Huang's high-profile resignation on Nov. 12.\n\nHow Kress communicates has drawn attention and, in some circles, criticism. On Wednesday, The Wall Street Journal described her public speaking style as \"slow, steady, almost monotone.\" That doesn't necessarily make it ineffective. Her situation, however, highlights a broader challenge leaders face when they need to inform, reassure and persuade large groups of people at once.\n\nGenerally speaking, anyone can stand a better chance at persuading others to follow them by honing an engaging speaking style, says Abrahams. Some people may be naturally expressive and engaging.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500 heads for 6th straight decline. Plus, J&J advances two key products", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic IPO live updates: AI lab tops $2 trillion market cap after record offering - CNBC", "full_content": "Anthropic IPO live updates: AI lab tops $2 trillion market cap after record offering CNBC Anthropic IPO live: Anthropic stock closes up 17% from initial price for $1.27T valuation in first day of trading Yahoo Finance AI giant Anthropic's shares pop in debut after blockbuster IPO NPR Anthropic begins trading in the biggest IPO on record despite the many fears surrounding AI AP News Jacob Coxon Joins Protesters Outside Anthropic\u2019s HQ WSJ", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 01:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Japanese investors sought $9.4 billion of shares in Anthropic IPO, sources say", "full_content": "TOKYO, - Japanese investors sought to buy more than 1.5 trillion yen worth of Anthropic shares at its public listing this week, two people familiar with the offer said.\n\nJapanese investors ultimately secured $2.98 billion worth of the shares, a filing showed on Thursday.\n\nAnthropic raised $81 billion in total worldwide in what became the world's largest initial public offering on record, eclipsing SpaceX, which raised $75 billion at its listing in June.\n\nMarket sentiment has turned against AI-related firms in recent months, which sparked speculation that the Claude developer's listing would struggle to win over investors.\n\nAnthropic ultimately priced its offering at $83 per share, above its initial range of $70 to $78.\n\nSome Japanese investors saw Anthropic as the frontrunner among AI firms and so justified large orders, said the people, who spoke on the condition of anonymity because they were not authorised to discuss the \u200bIPO publicly.\n\nOther investors sought smaller allocations or sat out the offering altogether, seeing greater prospective returns in semiconductor stocks that have fallen sharply, such as Nvidia and Kioxia, or in waiting for OpenAI\u2019s listing due next year, one of the people said.\n\nMore than 1,000 individuals sought allotments over 100 million yen, according to a demand survey by Mizuho Securities, part of Mizuho Financial Group, which was among the underwriters of the IPO and arranged the sale of the majority of shares sold in Japan. These applications totalled around 200 billion yen, the survey showed.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:32 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Walmart hikes outlook as CEO tells CNBC retailer aims to keep prices low despite soaring fuel costs", "full_content": "Walmart on Thursday reported earnings and revenue that narrowly topped estimates and raised its full-year outlook as it saw strong e-commerce growth ahead of the busy holiday season.\n\nWalmart said global e-commerce sales surged 17% in the fiscal third quarter, driven by store-fulfilled pickup and delivery, with Walmart U.S. up 23% and Sam's Club U.S. rising 30%. Its Walmart U.S. advertising business saw a 37% sales increase for the quarter.\n\nWalmart said it rolled back prices on nearly 8,000 products across its stores, a focus as U.S. consumers worry about the cost of living in the face of elevated food and gas prices.\n\nCEO John Furner told CNBC's Becky Quick that the company has seen higher-than-expected diesel costs, but that tariff refunds have helped the retailer to offset those inputs and maintain lower prices.\n\n\"The reality is that increases in diesel fuel and transportation, they do work their way into cost of goods,\" Furner said in an exclusive interview. \"So we're hoping to see these costs come down as soon as possible, and we'll keep prices as low as we can.\"\n\nCFO John David Rainey told CNBC that growth in online orders for Walmart and Sam's Club was driven by an emphasis on speed of delivery and reduced prices. He added that Walmart saw its largest share gains in the food category in three years during the third quarter.\n\n\"This was another really solid quarter for us, we feel good about it,\" Rainey told CNBC. \"We continue to gain share while continuing to improve the profitability of our digital businesses.\"\n\nWalmart also raised its full-year guidance, now expecting net sales to increase between 4.9% and 5.2%, compared with previous guidance of a 4% to 5% increase. Rainey said Walmart is maintaining \"flexibility\" in its guidance.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Canadian dollar steadies near 19-month low as stocks slide", "full_content": "TORONTO, Nov 19 (Reuters) - The Canadian dollar steadied near an earlier 19-month low against its US counterpart on Thursday as risk aversion rose and ahead of domestic retail sales data that could help guide expectations for Bank of Canada interest rate hikes.\n\nThe loonie was trading nearly unchanged at 1.4332 per US dollar, or 69.77 US cents, after touching its weakest intraday level since April 2025 at 1.43575.\n\n* US stock indexes tumbled after Anthropic's blockbuster market debut failed to ease concerns about the AI trade, triggering a broader market selloff.\n\n* \"You've got a little bit of risk aversion in the market - that's bullish for the US dollar,\" said Rahim Madhavji, president at Knightsbridge Foreign Exchange. \"The loonie is struggling to find catalysts that are going to help it.\"\n\n* The price of oil, one of Canada's major exports, rose 0.7% to $83.84 a barrel as investors focused on fresh reports of tanker disruptions in the Strait of Hormuz. Still, oil has pulled back sharply from its October peak.\n\n* \"The dominant themes are interest rate diversion, oil prices are a bit of a headwind, US dollar strength,\" Madhavji said.\n\n* Investors have fully discounted an interest rate hike by the Federal Reserve next month and are leaning toward further tightening in January, swap market data shows. Chances the Bank of Canada would hike in December are seen at 67%.\n\n* Canadian retail sales data for September, due on Friday, could help guide BoC rate hike expectations. Economists expect a month-over-month increase of 0.7%.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump bought Nvidia, Palantir, SpaceX in September as federal deals, White House ties grew", "full_content": "President Donald Trump's investment accounts bought shares of Nvidia , Palantir and Elon Musk 's SpaceX in September, around the time the companies secured major federal contracts and their executives met with the president, according to a newly released financial disclosure.\n\nThe 25-page filing shows 751 purchases and sales totaling between roughly $40.9 million and $148.1 million, according to a CNBC analysis. Purchases accounted for at least $29.2 million and sales at least $11.7 million. The filing reports transactions in broad dollar ranges, leaving the exact amounts and value of Trump's holdings unclear.\n\nAmong the transactions were Palantir purchases before the company received two federal contracts worth $42.5 million combined, according to contracting records, SpaceX investments shortly before and after a $946 million NASA contract expansion , and Nvidia trades as its then-CEO, Jensen Huang , cultivated a close relationship with Trump .\n\nThe trades underscore a striking feature of Trump's presidency: His personal fortune remains invested in companies whose fortunes his administration can shape. His accounts reported more than 21,000 trades in 2025 , compared with roughly 500 during his entire first term. Recent presidents have generally divested individual stocks or used blind trusts to avoid potential conflicts.\n\nThe White House has told CNBC previously Trump and his family have no control over the trades, which outside financial managers handle independently . The Trump Organization says the arrangement is designed to avoid even the appearance of a conflict. There is no evidence Trump directed the transactions or that his managers knew government decisions in advance.\n\nWhite House spokesman Davis Ingle said that Trump's portfolio is independently managed and that neither the president nor his family has any input on trades.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 01:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Brazil\u2019s central bank steps in to stem real\u2019s slide since Lula\u2019s re-election", "full_content": "Currency has slipped from R$5 to R$5.90 to the dollar following leftwinger\u2019s victory last month", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 12:55 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "We\u2019re in our 50s and terrified of a market crash. Should we put $400,000 of our $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 12:45 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "This tech stock has been nearly cut in half this year. I think Wall Street is getting it wrong", "full_content": "AppLovin's accelerating revenue growth and expansion into e-commerce make the AI advertising company an attractive investment opportunity, says analyst Paul Meeks.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 12:38 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Offshore Chinese Yuan Drops to Weakest Level in Over a Month", "full_content": "(Bloomberg) -- The offshore Chinese yuan declined to the weakest level in more than a month while the dollar rallied as risk appetite shrank.\n\nThe yuan fell as much as 0.5% to touch 6.6999 against the US dollar on Thursday, the lowest since mid-October. The Chinese currency sold off along with many other emerging market currencies, including the Colombian peso, the South African rand and the Hungarian forint. A gauge of EM currencies is down 0.1%, while the Bloomberg Dollar Spot Index is up 0.2%.\n\n\u201cThe yuan has been grinding higher for quite some time, and the market appears to have been caught off-guard today,\u201d said Alex Cohen, a strategist at the Bank of America. \u201cThe broader dollar rally is making emerging markets increasingly less attractive.\u201d\n\nBoth the offshore yuan and its onshore counterpart, which trades inside mainland China and is state managed, have advanced about 4% against the dollar this year.\n\nEarlier this week, China\u2019s central bank boosted its daily yuan reference rate to the strongest in more than four years for the onshore currency as the country hosted a key regional summit in Shenzhen. China\u2019s leader Xi Jinping met with his US and Russian counterparts Donald Trump and Vladimir Putin, respectively, amid a backdrop of war. China and the US are also in a spiraling chip battle as Washington restricted China\u2019s access to chips that are crucial to the global AI race.\n\nThe latest so-called yuan fixing shows \u201cthe government is uncomfortable\u201d with levels, according to Paresh Upadhyaya, a strategist at Pioneer Investments.\n\n\u201cThey have been verbally intervening over the last few weeks, but the fixing was the first concrete step that the appreciation was just too much,\u201d he said. \u201cI also think it was delayed reaction to the broad-based emerging markets selloff in the foreign currency market we\u2019ve seen over the last few days.\u201d\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:21 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jensen Huang's \u2014 and Nvidia's \u2014 legal exposure balloons", "full_content": "The still-unraveling scandal of former Nvidia CEO Jensen Huang 's extramarital affairs and the tech giant's potential role in its advanced semiconductor chips ending up in China present a legal minefield for Huang and Nvidia.\n\nFederal and state prosecutors and Nvidia employees may target Huang and the company in court, where some shareholders have already taken action.\n\nThat's on top of a rapidly growing pile of probes by Republicans who control Congress now and Democrats who will have majorities in both the House and Senate come January.\n\n\"It's not going to get any better for Jensen Huang; it's going to get far worse,\" said Salvatore Graziano, a New York securities litigation attorney at Bernstein, Litowitz, Berger & Grossmann. His firm is looking at shareholder lawsuit opportunities against Nvidia and Huang.\n\n[Huang] \"faces the Department of Justice, the Securities and Exchange Commission and private litigation,\" Graziano said. \"The criminal exposure is very serious. The SEC could bar him from being an officer. And the potential liability [from shareholder] lawsuits can be very large.\"\n\nHuang's and Nvidia's legal exposure stems from three issues that led up to his shock resignation Nov. 12.\n\nThere's his alleged affair with suspected Chinese spy Alice Huang, who worked for Megaspeed , a Singapore-based company under investigation for diverting advanced Nvidia semiconductor chips to China in violation of U.S. export rules. That, in turn, has raised questions about whether Huang and Nvidia were aware of any diversions.\n\nThere are Huang's two other alleged affairs with Nvidia employees.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 12:14 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil prices inch up as tanker disruptions offset surplus supply outlook", "full_content": "NEW YORK, Nov 19 (Reuters) - Oil prices inched higher on Thursday as investors focused on fresh reports of tanker disruptions in the Strait of Hormuz, helping the market recover from the previous session's selloff driven by rising US inventories and surplus forecasts.\n\nBrent crude futures rose 77 cents, or 0.8%, to $92.72 a barrel by 1:11 p.m. ET (1811 GMT). US West Texas Intermediate crude for December gained $1.08, or 1.3%, to $84.34. The December contract expires on Friday, while the more actively traded January contract advanced 91 cents, or 1.1%, to $83.21, with trading volumes nearly seven times those of the front-month contract.\n\nTwo oil tankers hit naval mines in the Strait of Hormuz on Thursday and \"exploded,\" Iran's navy said in a statement carried by state media. Reuters could not independently verify the report.\n\nThe Iran-aligned Houthi movement also fired missiles at the Saudi Arabian capital Riyadh.\n\nSaudi Arabia's civil defence said on Thursday that the attack on Riyadh's tallest skyscraper, headquarters of the Saudi sovereign wealth fund, caused material damage to several floors of the tower and nearby buildings, but no injuries were reported, state news agency SPA reported. Earlier in the day, two Western officials briefed by the Saudis said the kingdom is preparing for war against Yemen's Houthis to stretch well into next year.\n\n\"Rising Iranian attacks are weighing on Middle Eastern exports just as China ramps up crude imports, reducing oil on water and tightening the oil market,\" said UBS analyst Giovanni Staunovo.\n\nCumulative losses from the Middle East conflict have now reached 2.8 billion barrels of oil and 60 billion cubic metres of gas supply from the Gulf, the International Energy Agency said on Thursday.\n\nThe IEA, however, added that the conflict could cut world oil demand by more than 4% by 2035 if governments accelerate electrification, efficiency and fuel-switching measures in response.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:11 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "US mortgage rates rise for the first time in five weeks | CNN Business - CNN", "full_content": "US mortgage rates rise for the first time in five weeks | CNN Business CNN Mortgage demand turns lower, as interest rates shoot back up to the highest level in three weeks CNBC Freddie Mac says average rate on a 30-year mortgage rose to 7.28% this week, ending a four-week slide 10TV Hot CPI ends rate slide; budget for 3.5% drop in sales National Mortgage News Mortgage Rates Move Slightly Lower Mortgage News Daily", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 12:09 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AMD shares slide 8% as report says China links could invite US scrutiny", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Op g financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Air pollution raises respiratory illness claims: Children & senior citizens account for 58% of hospitalisations", "full_content": "Rising air pollution could mean more than just breathing discomfort for Indian households, with respiratory illnesses contributing to a growing share of hospitalisation claims. Children and senior citizens appear particularly vulnerable, accounting for 58% of respiratory-related hospitalisation claims in FY26, according to claims data shared by Care Health Insurance .\n\nThe health insurer has issued a public health advisory as air quality deteriorates across parts of India, urging people to take preventive measures and pay closer attention to vulnerable family members.\n\nDelhi's air quality, which had touched a seasonal peak of 428 on the air quality index (AQI), has eased but remains in the 'poor' category, according to the advisory. The Graded Response Action Plan (GRAP) also remains in place across Delhi-NCR, with falling temperatures and weaker winds posing a risk of further deterioration.\n\nCare Health Insurance's claims data shows that respiratory illnesses accounted for approximately 8.2% of all hospitalisation claims in FY26. The share was highest in October 2025.\n\nThe insurer also recorded an 11% increase in respiratory hospitalisation claims in both September and October 2025, marking the steepest monthly increases during FY26.\n\nChildren aged 0\u201312 accounted for 40% of respiratory hospitalisation claims during the financial year, while senior citizens aged 60 and above contributed 17%.\n\nThe concentration was even higher during the peak pollution months. Children accounted for 48% of respiratory hospitalisation claims in both September and October 2025. Together, children and senior citizens represented 63% of respiratory claims in October 2025.\n\nThe findings highlight the disproportionate burden of respiratory illnesses on vulnerable age groups during periods of deteriorating air quality.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 11:42 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO Highlights: Claude Maker Lists With 34% Gains, Surpassing Estimates", "full_content": "Follow our live blog for the latest updates on Anthropic listing, stock performance, analyst ratings and investor sentiment.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 11:31 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks making the biggest moves Thursday: Anthropic, CoreWeave, Coherent, AMD & more", "full_content": "Anthropic soared on Thursday, as the pure-play artificial intelligence company made its debut on the Nasdaq.\n\nShortly after Anthropic's IPO, the broader market sold off, and stocks tied to the artificial intelligence trade unwound earlier gains.\n\nFollow along as CNBC covers the biggest stock market moves of the day.\n\nShares of NetEase slid almost 9% after the gaming company reported weaker-than-expected earnings.\n\nNTES on Thursday The company reported 14.21 yuan in adjusted earnings per American depositary share and 27.85 billion yuan in net revenue. Analysts polled by FactSet expected 16.32 yuan in adjusted earnings per American depositary share and 30.22 billion yuan net revenue for the third quarter.\n\nShares for AST SpaceMobile popped 3% after B.Riley upgraded the company to buy from neutral. This comes despite a 60% drop in the company's shares in the last three months.\n\nASTS The firm maintained AST SpaceMobile's price target at $48, implying nearly 90% upside from Wednesday's close.\n\nU.S. traded shares of PDD Holdings rallied more than 12% in Thursday's ods and market mechanics are fundamental CFA exam areas."}, {"title": "How to analyse a mutual fund? A beginner\u2019s guide to returns, risk, costs and fund performance for better returns", "full_content": "Choosing a mutual fund requires more than checking past returns. Beginners should assess rolling returns, risk, expense ratios, portfolio quality, fund manager stability and benchmark performance to find schemes suited to their financial goals.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 10:32 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Trump administration plans further cuts at US audit regulator", "full_content": "Watchdog to scale back inspections and enforcement against accounting firms while investing in AI tools", "source": "FT Markets", "pub_date_str": "19 Nov 2026, 10:24 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "20 Nov 2026, 03:11 AM IST", "total_stories": 312};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
