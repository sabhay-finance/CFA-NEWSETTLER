r a letter issued by a foreign embassy or mission in India as address proof.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 09:07 PM IST", "pub_date_relative": "1m ago"}, {"title": "Kraft Heinz to divest its North American coffee business in $650 million deal", "full_content": "Kraft Heinz announced Wednesday that it will divest its North American coffee unit in a deal that values the business at $650 million on an enterprise basis, as it works to refocus on its core brands.\n\nThe deal with private equity firm One Rock Capital Partners includes brands such as Maxwell House and Gevalia and is expected to close in mid-2027, the company said in a news release . Kraft Heinz will retain a 30% noncontrolling equity stake in the business.\n\nKraft Heinz said it will use the $500 million of post-tax cash proceeds from the transaction to pay down its debts as it works to prioritize resources where it can accelerate growth.\n\n\"This transaction is a meaningful step in unlocking value from our portfolio and will further accelerate the momentum behind our transformation,\" Steve Cahillane, CEO of Kraft Heinz, said in the release.\n\nCahillane joined the company in January and called off plans to split the company in two, a move that would have reversed the blockbuster $46 billion merger from a decade ago. He said the problems Kraft Heinz faced were \"fixable and within our control.\"\n\nThe turnaround efforts have included a $700 million investment back into the business and a sharpened focus on some of its core brands .\n\nAlso on Wednesday, Kraft Heinz reported third-quarter earnings that beat expectations and raised its 2026 outlook. It now expects organic net sales to be down 0.5% to 1.25%, an improvement from its second-quarter report, which projected that sales could decrease as much as 2%.\n\n\"Our 2026 operating plan to turn around the U.S. business and accelerate growth internationally is on track,\" Cahillane said. \"Relative to last year, our market  IST", "pub_date_relative": "3m ago"}, {"title": "Earnings call transcript: Versigent tops Q3 2026 estimates as shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:04 PM IST", "pub_date_relative": "4m ago"}, {"title": "Midterm elections 2026 live updates: House Speaker Mike Johnson says he won't run for minority leader after Democrats flip Congress", "full_content": "Democrats scored a seismic victory in the midterm elections , flipping both chambers of Congress from Republican control and setting the stage to challenge President Donald Trump 's policy priorities from a position of strength.\n\nThe Democratic victories spanning a surprising number of House districts and Senate seats mean the party will be able to launch congressional investigations with subpoena power.\n\nDemocrats could eye the financial windfall Trump, his family members and his political allies have enjoyed since he regained the White House. They will likely examine the president's controversial, heavy-handed enforcement of immigration, his use of the Department of Justice to target people he considers enemies and favorable business dealings.\n\nAs of early Wednesday morning, Democrats were projected to win at least 250 House seats, with Republicans winning a minimum of 160 seats, according to the CNBC Election Desk.\n\nA number of Democratic candidates won in House districts that were redesigned by Republican-controlled state legislatures with the intention of easing the way for GOP candidates to win.\n\nDemocrats were on track to hold at least 54 seats in the Senate, with Republicans likely to hold at least 42 seats. The big Democratic winners on Tuesday night include James Talarico in the Texas Senate election. He overcame an unprecedented flurry of $224 million in spending by SpaceX CEO Elon Musk to boost the candidacy of Republican nominee Ken Paxton, the state's scandal-plagued attorney general.\n\nJust two uncalled Senate races left as final votes trickle in Katie Hobbs wins reelection for governor in Arizona Democrat Tina Kotek wins reelection for governor in Oregon Aaron Ford ousts Joe Lombardo in race for Nevada governor\n\nSenate Finance Committee Ranking Member Ron Wyden, D-Ore., said the committee will focus on CEO accountability, a billionaire tax, healthcare and tariffs in a statement detailing plans for the upcoming session of Congress.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 09:04 PM IST", "pub_date_relative": "4m ago"}, {"title": "ANI Pharma earnings up next: Rare disease pivot faces test", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:03 PM IST", "pub_date_relative": "4m ago"}, {"title": "Ceco Environmental stock hits 52-week low at 45.8 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:03 PM IST", "pub_date_relative": "4m ago"}, {"title": "Earnings call transcript: Flutter Entertainment posts Q3 2026 loss, cuts guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:03 PM IST", "pub_date_relative": "4m ago"}, {"title": "Ingevity set to report earnings after streamlining portfolio", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:03 PM IST", "pub_date_relative": "5m ago"}, {"title": "Depressing, but true: If you want to get ahead at work, embrace virtue signaling", "full_content": "Strategically embracing the right symbols in the office really can advance your career.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 09:03 PM IST", "pub_date_relative": "5m ago"}, {"title": "Crude Oil Inventories Decline Less Than Expected, Impacting Prices", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "Vistance Networks faces key earnings test after major sale", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "Why is Commercial Metals stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "Elon Musk\u2019s record election bet backfired. The backlash may reach beyond one billionaire", "full_content": "Democrats' sweeping midterms victory marked a major rejection of Elon Musk and the artificial-intelligence industry, as a broad backlash against U.S. President Donald Trump and his tech allies put their political influence \u2014 and the debt-fueled data center buildout \u2014 under sharper scrutiny.\n\nMusk, who spent a record of at least $474 million on the midterms, funneled $224 million, or nearly half, into Texas alone, according to a CNBC analysis of campaign finance records, only to see his favored candidates, Republican Senate nominee Ken Paxton and Gov. Greg Abbott, trounced in a Democratic wave.\n\nThe defeats rattled markets overnight, sending SpaceX and Tesla shares lower, both of which have long flourished under Abbott's business-friendly policies. Meanwhile, broader tech stocks came under pressure as Democrats secured control of Congress.\n\nAcross the country, voters pushed back against billionaire influence and the growing power of technology companies, electing critics of the AI industry and approving restrictions on data centers fueling its expansion.\n\n\"We must get big money out of our politics, so no billionaire or trillionaire can buy our elections,\" Democratic Senator-elect James Talarico said in his victory speech, without naming Musk. \"We must unrig this economic system that only benefits the top 1%.\"\n\nJ.C. Lintzenich, a visiting senior fellow at the German Marshall Fund, pointed to Musk's massive spending in Texas, telling CNBC's \"Squawk Box Europe\" on Wednesday that the results were \"clearly a rejection of the Elon Musk aspect that has found its way into the Trump orbit.\"\n\nTexas has grown to be homebase for much of Musk's Empire. Tesla operates its largest U.S.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 08:59 PM IST", "pub_date_relative": "9m ago"}, {"title": "10-year Treasury yield is little changed as traders mull over Democrats' midterm victories", "full_content": "The 10-year Treasury yield traded near the flatline on Wednesday as investors weighed big wins from Democrats in the U.S. midterm elections.\n\nThe benchmark 10-year Treasury note yield was up less than 1 basis point at 4.954%. The 30-year bond yield advanced 1 basis point to 5.334%, and the shorter-term 2-year note yield added 1 basis point to 4.627%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nDemocrats obtained majorities in both the House and Senate . Democrats flipped Senate seats from Republicans in Iowa, Kansas, North Carolina, Ohio, South Carolina, Maine and Texas. They also won key gubernatorial races in Ohio and Texas.\n\nThe resounding victory by Democrats could rein in government spending from the Trump administration, as it makes it harder for the White House to push legislation through Congress.\n\nTraders at JPMorgan said one of the issues Wall Street is focusing on after the midterms is \"reduced deficit spending.\"\n\n\"This can be achieved by asserting power over the budget and likely wading through a government shutdown,\" they said.", "source": "CNBC Finance", "pub_date_str": "04 Nov 2026, 08:58 PM IST", "pub_date_relative": "9m ago"}, {"title": "Dow rallies 1,000 points as political risk eases after resounding Democratic victory in U.S. midterms: Live updates", "full_content": "Stocks ripped higher on Wednesday as a decisive victory by Democrats in the U.S. midterm elections \u2014 and President Donald Trump's acceptance of the results \u2014 removed political uncertainty risk hanging over Wall Street.\n\nDemocrats won majorities in both the House of Representatives and Senate, and scored victories in key gubernatorial races like Texas. The Democrats will now be a check on the policies of Trump, who's enacted business-friendly tax cuts, while also pursuing tariffs and a war in Iran that's boosted inflation.\n\nThe Dow Jones Industrial Average traded 1,024 points, or 2%, higher. The S&P 500 gained 1.5%, while the Nasdaq Composite jumped 2%.\n\nTrump told The New York Times he was \"absolutely willing\" to accept the results and told The Wall Street Journal that he and Republicans would work with Democrats.\n\nThe rebound \"was in part due to the president's initial tone and reaction to the results,\" said Jay Woods, chief market strategist at Freedom Capital Markets. \"Still more uncertainty looms, but one thing is certain, there will be gridlock and historically this is good for the market.\"\n\nShares linked to the economy that could benefit from a more stable environment led the gains. Walmart added 3%, while Bank of America rose 2.5% as investors looked for stocks outside of technology.\n\nShares that could benefit directly from Democratic policies, or an end to tougher Trump actions, gained. Health insurers and hospital operators advanced, with Molina Healthcare rising 5% along with Centene and HCA Healthcare up 7%. The Invesco Solar ETF jumped 8%.\n\nHeading into the election investors worried a Democratic sweep could weigh on some areas of the market , especially stocks related to the artificial intelligence build-out. Investors feared a big Democratic win could mean more restrictions on data centers nationwide. The Texas governor win by Gina Hinojosa, who's pledged an immediate moratorium in the key data center hub, added to the fears Wednesday.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:58 PM IST", "pub_date_relative": "10m ago"}, {"title": "CVS to split off drugstore business in major breakup of healthcare giant; shares fall 10%", "full_content": "CVS Health plans to split into two separate public companies by the first half 2028 in what would be one of the largest corporate splits in history, the company announced Wednesday.\n\nThe move would reverse the company's massive $78 billion acquisition of its insurer, Aetna, and dismantle the vertically integrated healthcare conglomerate it created in 2018. The plan would specifically separate CVS' roughly 9,000 retail pharmacies from its major insurance business and pharmacy benefit manager, Caremark, one of the nation's three largest PBMs.\n\nThe decision follows a \"comprehensive strategic review\" by the company's board of directors, according to a news release. Shares of CVS fell roughly 10% on Wednesday after the announcement.\n\nIt's a stunning reversal for the healthcare powerhouse, which has spent the last two decades working to turn itself into a one-stop health destination. The move also comes as CVS' aggressive turnaround plan under CEO David Joyner shows substantial progress, with the company pursuing $2 billion in cost cuts, store closures, leadership shakeups and efforts to rein in Medicare Advantage costs.\n\n\"From a position of strength, and a focus on the long term, we plan to create two focused companies to improve consumer engagement, affordability, and care coordination,\" Joyner said in the release.\n\nCVS shares have jumped roughly 70% since Joyner took the helm in October 2024, bringing the company's market value to $117 billion.\n\nThe insurance and PBM company will retain the CVS Health name and be run by Joyner, while the other company will be called CVS Pharmacy and be led by Prem Shah, who is currently group president of CVS Health. Additional leadership positions and board members will be announced at a later date, CVS said.\n\nExisting CVS shareholders will own shares in both companies after the split. The Financial Times on Tuesday first reported the breakup plans.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:56 PM IST", "pub_date_relative": "12m ago"}, {"title": "Stock Market Today: Stock Futures Drop as Investors Weigh Democratic Gains \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Stock Futures Drop as Investors Weigh Democratic Gains \u2014 Live Updates WSJ Dow rallies 1,000 points as political risk eases after resounding Democratic victory in U.S. midterms: Live updates CNBC Stocks soar after Democrats take control of Congress CBS News Dow futures jump by 1,100 points as Democrats take control of Congress CNN Stock market after midterms: S&P 500 returns since 1950 qz.com", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 08:54 PM IST", "pub_date_relative": "14m ago"}, {"title": "Prologis CEO says warehouse demands are shifting fast. Here's how he's keeping up", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nThere will always be some need for massive, centralized warehouses, but rising demand for faster deliveries and resilient energy supplies have companies rethinking where their warehouses should be.\n\nIn fact, 91% of company leaders said retailers and logistics providers \"urgently\" need more decentralized fulfillment networks to meet delivery expectations, according to a new survey from Prologis , in partnership with the Harris Poll. Responses came from more than 1,800 business leaders in the U.S., U.K., Germany, India, China and Mexico.\n\n\"Our focus is the consumption end, so we have really narrowed our focus into being in not only the most dynamic consumption centers, most dynamic population centers around the world, but we're very specific what sub markets in those cities that we want to focus on? Because it is all about being closer to those rooftops,\" said Dan Letter, CEO of Prologis.\n\nAccording to the survey, fewer companies plan to keep their existing global footprint, with the share falling 14 percentage points from a year ago to just 36%. They are seeking faster delivery, first and foremost, as consumer expectations escalate. Same-day delivery is the goal, with the share of companies offering it doubling since 2019. Speed tops price when it comes to securing a competitive advantage, according to the survey.\n\nAs a result, companies are mixing up their relocation strategies, with more than half both diversifying and regionalizing and about a third nearshoring and reshoring.\n\n\"That's why we've been very focused on where our portfolio is.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:52 PM IST", "pub_date_relative": "15m ago"}, {"title": "Gold gains 3% as dollar slides after Democratic midterm gains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Gold gains 3% as dollar slides after Democratic midterm gains Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Gold gains 3% as dollar slides after Democratic midterm gains SECTIONS Gold gains 3% as dollar slides after Democratic midterm gains Reuters Last Updated: Nov 04, 2026, 08:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Wednesday, gold prices surged by 3%, reaching impressive new levels following the midterm elections, during which Democrats secured control of both the Senate and House. This political transformation, combined with a weaker dollar, heightened gold and precious metals demand. Investors are keenly watching for the upcoming US non-farm payrolls report, as rising interest rates and ongoing fiscal risk concerns continue to influence market sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:48 PM IST", "pub_date_relative": "19m ago"}, {"title": "Prediction markets get Democratic win right, with a few surprises", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Prediction markets get Democratic win right, with a few surprises Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Prediction markets get Democratic win right, with a few surprises SECTIONS Prediction markets get Democratic win right, with a few surprises Reuters Last Updated: Nov 04, 2026, 08:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Prediction markets provided insights during the US midterm elections, with $1.48 billion wagered on the outcomes. Democrats gained control of both the Senate and House of Representatives after delivering a rebuke to Donald Trump. Despite some accurate forecasts, notable surprises emerged, such as Annie Andrews' victory in South Carolina against expectations. Kalshi and Polymarket reflected varying probabilities, emphasizing the predictive capabilities of betting markets.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:47 PM IST", "pub_date_relative": "21m ago"}, {"title": "Micron and other chip stocks slip as election results strike at the core of data-center optimism", "full_content": "Democratic victories in Texas and other states raise long-term questions about the AI buildout, though they do not \u201cunwind projects already funded.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 08:47 PM IST", "pub_date_relative": "21m ago"}, {"title": "Datadog\u2019s stock extends steep declines in the wake of earnings", "full_content": "Datadog failed to top expectations with its revenue forecast.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 08:46 PM IST", "pub_date_relative": "22m ago"}, {"title": "Indian bonds rally most since April as oil slides after US midterm verdict", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Indian bonds rally most since April as oil slides after US midterm verdict Powered By The Economic Times dail itics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Keystone Realtors Q2 profit jumps 10-fold to Rs 101 cr Keystone Realtors Share Price Nirlon Share Price Ganesh Housing Share Price Kalpataru Share Price Puravankara Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Keystone Realtors Q2 profit jumps 10-fold to Rs 101 cr SECTIONS Keystone Realtors Q2 profit jumps 10-fold to Rs 101 cr PTI Last Updated: Nov 04, 2026, 08:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Keystone Realtors has announced a ten-fold increase in consolidated net profit for the quarter ended September. The net profit rose to Rs 100.75 crore, attributed to significant profit share from joint ventures. Total income for the quarter, however, saw a decline from the previous year. The company's pre-sales reached record levels, reflecting strong demand for luxury housing projects.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:42 PM IST", "pub_date_relative": "26m ago"}, {"title": "US Markets: Why Qualcomm shares are in top focus today with quarterly earnings, growth outlook amid AI costs concerns", "full_content": "Qualcomm shares are in focus on Wall Street on Wednesday, November 4, as the semiconductor manufacturer prepares to announce its fourth-quarter fiscal 2026 financial results after the US stock market closes. Investors will closely monitor the company's revenue, earnings and management commentary amid weakening smartphone demand, rising component costs, concerns over artificial intelligence spending, and increasing competition in the semiconductor industry.\n\nThe company's dependence on the smartphone market is emerging as a key concern. While handset chips remain Qualcomm's biggest revenue contributor, Apple's efforts to develop its own cellular modem technology and softer demand for Android smartphones are creating additional challenges for its growth prospects.\n\nThese concerns have also weighed on the company's stock performance. On Friday, October 30, Qualcomm shares plunged 11.2% following Intel's earnings announcement, which triggered broader concerns about memory shortages and weakening consumer spending in the personal computer market.\n\nOn Wednesday, Qualcomm shares were trading at $172.05, up 4.63%, or $7.62. However, the stock remained down 0.76% year to date.\n\nWall Street analysts expect Qualcomm to report revenue of approximately $10.15 billion for the fourth quarter, while adjusted earnings are projected at $2.16 per share.\n\nThese estimates indicate year-over-year declines of nearly 10% in revenue and 28% in adjusted earnings, reflecting weaker smartphone demand, reduced orders from Apple and higher semiconductor manufacturing costs.\n\nQualcomm has previously provided revenue guidance of $9.7 billion to $10.5 billion and non-GAAP diluted earnings per share of $2.05 to $2.25 for the quarter.\n\nThe company expects handset revenue to reach approximately $5.2 billion in the December quarter, representing a decline of around 25% from the corresponding period last year.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 08:41 PM IST", "pub_date_relative": "26m ago"}, {"title": "Property giant Vonovia 'concerned' over Berlin left's housing plans", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Property giant Vonovia 'concerned' over Berlin left's housing plans The Economic Times daily newspaper is available online now. Read Today's Paper Property giant Vonovia 'concerned' over Berlin left's housing plans SECTIONS Property giant Vonovia 'concerned' over Berlin left's housing plans By AFP Last Updated: Nov 04, 2026, 08:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Europe's leading corporate landlord Vonovia said Wednesday it was \"concerned\" at plans by Berlin's possible incoming far-left led city administration to expropriate apartments to tackle the city's housing crisis. \"Of course, we are concerned about plans to nationalise housing owned by private companies,\" Vonovia CEO Luka Mucic told reporters Wednesday during a conference call on the company's third-quarter results.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:40 PM IST", "pub_date_relative": "27m ago"}, {"title": "Stocks surge after Democrats\u2019 sweep", "full_content": "Wall Street shrugs off concerns of anti-AI backlash as analysts say divided government reduces policymaking risks", "source": "FT Markets", "pub_date_str": "04 Nov 2026, 08:39 PM IST", "pub_date_relative": "29m ago"}, {"title": "McDonald's stock rises as earnings beat, U.S. restaurants show improvement", "full_content": "McDonald's on Wednesday reported mixed quarterly results as traffic to its U.S. restaurants fell, leading to a slight decline in domestic same-store sales.\n\nThe fast-food giant reported a 0.2% decrease in sales at its U.S. restaurants that have been open at least 13 months. Even so, the segment performed better than the 0.5% decline that Wall Street anticipated, according to a survey of analysts by StreetAccount.\n\n\"In the U.S., we're encouraged by improvement as the quarter progressed following our intervention on value,\" McDonald's CEO Chris Kempczinski said in a statement.\n\nMcDonald's same-store sales returned to growth in September after falling in July and August, CFO Ian Borden said on the company's earnings conference call. However, in response to an analyst question, he clarified that he did not say that U.S. same-store sales would be better in the fourth quarter.\n\nKempczinski said in August that the company's U.S. business was falling short on execution, particularly on the implementation of its value offerings. Like many restaurants, McDonald's has leaned into discounts to attract budget-conscious diners over the last two years.\n\nTo reverse same-store sales declines, McDonald's focused its marketing on its Extra Value Meals and restarted regional and national promotions on its mobile app, which are important to its most frequent diners.\n\nAs McDonald's tries to regain its footing in the U.S., the chain is also testing two new value menus, one with mix and match bundles and the other with set combinations of menu items, executives said on the earnings call. The offering that resonates the most with customers and franchisees will be rolled out across the U.S. in early 2027.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:35 PM IST", "pub_date_relative": "33m ago"}, {"title": "Analysis: The Democrats have one chance to extract concessions from Trump. Markets will hate it", "full_content": "The electoral sweep by Democrats on Tuesday night injects a new, unstable dynamic into the single biggest political risk to financial markets in the coming year: the debt limit . Unless a defeated Republican Party makes a swift and unlikely show of unity to take the issue off the table in its last few weeks in power, the protracted fight that will unfold is set to be nastier than ever, adding volatility to an already shaky bond market.\n\nPast episodes of brinkmanship around the need to raise the government's borrowing limit have involved Republicans in Congress demanding budget cuts from a Democratic president as the price of their vote. This time it will almost certainly be the left seeking concessions from the right.\n\nThe debt limit is the definition of a must-pass bill, even more than issues like funding the government and the defense budget. That makes it potentially the one real chance the new Democratic majority in Congress has to extract concessions from a president who is already pledging to veto their agenda. Markets will hate the entire process, even if \u2014 as many expect \u2014 it ends in compromise.\n\nBecause it is Democrats who hold the leverage, unlike past episodes, the ultimate agreement is more likely to increase government spending than lower it. With high bond yields weighing on the economy, and Americans expecting action from a newly empowered Democratic opposition, the fight could be particularly damaging.\n\nMany in the markets are stuck on the outdated idea that Democrats are less assertive than Republicans, said Aniket Shah, head of the Washington policy team at the investment bank Jefferies.\n\n\"They have this sort of mental image of Biden-Harris 2024,\" said Shah. \"I don't think they realize how aggressively Democrats plan to take 2027.\"\n\nThe debt ceiling is a quirk of the congressional budgeting process. It stops the government from borrowing funds that Congress has already ordered federal agencies to spend.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:35 PM IST", "pub_date_relative": "33m ago"}, {"title": "Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city The Economic Times daily newspaper is available online now. Read Today's Paper Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city SECTIONS Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city PTI Last Updated: Nov 04, 2026, 08:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sunday PropTech Ltd marks a significant milestone with its inaugural acquisition of an 89-room hotel in Rajarhat. This venue will be included in its emerging mid-premium Clubhouse brand, bolstering its footprint in eastern India. Given its advantageous proximity to Netaji Subhas Chandra Bose International Airport, it appeals to business travelers. The company plans to revamp and reposition the hotel, while also identifying additional investment prospects in West Bengal.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:33 PM IST", "pub_date_relative": "34m ago"}, {"title": "Three things that explain what\u2019s changing with Obamacare in 2027", "full_content": "Affordable Care Act premiums are increasing again, and these plans have new rules.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 08:33 PM IST", "pub_date_relative": "35m ago"}, {"title": "Nasdaq jumps 2%, Dow soars over 1,000 points after US midterm election results", "full_content": "NEW YORK (AP): Most of the U.S. stock market is rallying Wednesday as Wall Street tries to sort the winners from the losers following stunning losses for President Donald Trump\u2019s party in the midterm elections.\n\nThe early winners appear to include solar-power companies, for example. Investors meanwhile see risks ahead for Trump\u2019s social-media company, the artificial-intelligence industry and businesses owned by Elon Musk, who donated heavily to Republicans. But the moves may not last, and uncertainty about what the election will mean had futures for U.S. stocks swinging from losses to gains before the U.S. market even opened.\n\nFor now, at least, the S&P 500 jumped 1.2% in early trading and was potentially on track for its best day in six weeks. The Dow Jones Industrial Average was up 1,178 points, or 2.3%, as of 9:35 a.m. Eastern time, and the Nasdaq composite was 1.1% higher.\n\nStrategists along Wall Street had been urging investors not to get swept up in the election because it may not matter much in the long term. Historically, U.S. stocks tend to do well in the six months following any midterm election, regardless of who wins. Prices for stocks depend more on where profits for companies and interest rates are heading than anything else.\n\n\u201cEarnings trump elections,\u201d according to Brian Jacobsen, chief economic strategist at Annex Wealth Management.\n\nWall Street also may have gotten a preferred political scenario with Democrats set to take control of both the Senate and the House of Representatives.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 08:32 PM IST", "pub_date_relative": "36m ago"}, {"title": "Caitlin Clark signs as first-ever brand partner with Dick's and Foot Locker", "full_content": "Caitlin Clark has signed a multiyear deal with Dick's Sporting Goods and Foot Locker. The deal marks the first time either brand has signed an individual athlete, man or woman, as a partner.\n\nAs part of the partnership with the sports retailers, Clark will work with both brands on custom promotions to support her signature footwear, apparel and product lines. She will also be involved in activations and community events.\n\nThe new deal follows the Oct. 1 global release of Nike and Clark's first signature shoe, which was the largest women's signature shoe launch in the company's history. The release also included an 18-piece apparel assortment.\n\nThe shoe has received widespread acclaim and drawn strong consumer demand, with inventory selling out within hours on Nike.com and other sneaker retail sites.\n\nClark pointed to the brands' deep roots in sport and basketball and their ability to connect with fans all over the world.\n\n\"Dick's Sporting Goods was always a stop before the start of any sports season when I was growing up,\" Clark said in a statement. \"Being the first ever brand partner for both them and Foot Locker is a really special full-circle moment. \"\n\nThe Clark partnership also marks the first joint athlete partnership between Dick's and Foot Locker under Dick's Inc. Both Dick's Sporting Goods and Foot Locker have previously worked with athletes on marketing campaigns, in-store events, and other ventures but never at the brand level.\n\nDick's CEO Ed Stack said he looks forward to building on the energy that Clark has brought to playing basketball and winning new fans.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:30 PM IST", "pub_date_relative": "38m ago"}, {"title": "Midterm elections deliver a \u2018blue wave.\u2019 The stock market sees green.", "full_content": "Wall Street finds reasons to cheer the Democrats\u2019 sweep. Plus: Microsoft\u2019s AI-era buyouts and a retiree\u2019s appetite for a \u201cfree lunch.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 08:29 PM IST", "pub_date_relative": "39m ago"}, {"title": "NPS retirement planning: Can investments in AIFs, REITs and InvITs help improve returns and diversify your portfolio?", "full_content": "The National Pension System (NPS) could offer subscribers greater exposure to alternative investments as pension fund managers look to diversify retirement portfolios beyond traditional equities, government securities and corporate bonds.\n\nInvestments in alternative investment funds (AIFs), real estate investment trusts (REITs) and infrastructure investment trusts (InvITs) could provide additional sources of income and long-term growth. However, these investments also carry risks, including lower liquidity, valuation uncertainty and the possibility of losses.\n\nPranay Ranjan Dwivedi, MD & CEO of SBI Pension Funds (SBIPF), believes a measured allocation to alternative assets could help strengthen retirement portfolios over the long term. He suggests an initial allocation of around 2-3% of a retirement portfolio to alternative investments, which could gradually increase to 5%, subject to regulatory limits and the availability of suitable investment opportunities.\n\nThe discussion comes as the Pension Fund Regulatory and Development Authority (PFRDA) reviews the NPS investment framework. The expansion of investment options could allow pension funds to tap opportunities in infrastructure, real estate and private businesses, while giving subscribers greater diversification over their long investment horizons.\n\nAlternative investments have the potential to improve risk-adjusted returns over a 10-20-year investment horizon, but the benefits are not automatic, Dwivedi said.\n\nDifferent categories serve different purposes. Private equity investments provide exposure to business growth, while private credit, real estate and infrastructure investments can generate income. Certain long-duration investments may also offer additional returns in exchange for accepting longer holding periods.\n\nReal estate and infrastructure investments can also provide some protection against inflation.", "source": "LiveMint Money", "pub_date_str": "04 Nov 2026, 08:19 PM IST", "pub_date_relative": "49m ago"}, {"title": "This energy stock is forming a classic bullish cup-and-handle pattern", "full_content": "The daily chart of ConocoPhillips presents a fairly textbook bullish cup-and-handle formation.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:15 PM IST", "pub_date_relative": "53m ago"}, {"title": "AI data center stocks and Musk's SpaceX decline as Texas governor result raises risks of a slowdown", "full_content": "AI data center stocks came under pressure as Democrats \u2014 seen as proponents of moratoriums on the buildout \u2014 won big in midterm elections and in key technology hubs like Texas.\n\nMarkets were already anticipating the Democrats to win the House of Representatives and possibly take Senate control. But the Texas governor mansion going to Democrats was a big blow, analysts said. Democrat Gina Hinojosa, who wants to enact an immediate moratorium on data centers in the state, won over incumbent Republican Gov. Greg Abbott. According to Wells Fargo, 27% of planned data center gigawatts is in the Lone Star State.\n\nThe midterm elections will slow the pace of data center buildouts across the U.S., Dan Ives, partner at Yorkville Ives & Co., said in a note on Wednesday morning.\n\n\"There is no way to sugarcoat that Democrats taking control especially over the Senate will create some major hurdles for AI and tech legislation in the Beltway over the next 2 years,\" he said.\n\nHe added that the election in Texas was the \"biggest worry\" of the night for tech investors and the AI trade because that's where around 25%-30% of data center gigawatts and capacity will come from.\n\nShares of Elon Musk 's SpaceX were down 4% after the open, and Tesla shares were down 5%. The Democrats' victory in Texas is a big setback for Musk , where he heavily backed Republican candidates, and where his companies Tesla and SpaceX are based. Musk spent a record of at least $474 million on the midterms and funneled $224 million into Texas alone, where Republican Senate nominee Ken Paxton and Gov. Greg Abbott lost to Democrats.\n\nSpaceX is currently building out multiple gigawatts of data center capacity, including projects in Texas.\n\n\"Data centers in space looking pretty appealing right now,\" Musk said in a post on X in the early hours on Wednesday, referring to his speculative plans to build AI infrastructure off-planet.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:13 PM IST", "pub_date_relative": "54m ago"}, {"title": "539% return in 5 years: GMDC share price rallies 10% - What\u2019s fuelling the PSU stock rally? Decoded", "full_content": "GMDC share price today: Shares of Gujarat Mineral Development Corporation (GMDC) rallied nearly 10.15% during Wednesday\u2019s trading session, as the PSU stock extended its two-day winning streak. With the rally, GMDC shares have delivered a 7.51% return over the past one week.\n\nThe recent uptick in GMDC share price has come after it dipped to its 52-week low levels post the announcement of the company's second quarter results for the financial year 2026-27.\n\nThe sharp rally during Wednesday\u2019s trading session came as the stock saw trading volume surge more than 17.28 times. GMDC shares saw 31,700 trades at 11:18 AM on Wednesday, according to BSE data. The PSU stock's slide to a 52-week low also coincided with a sharp 2.07-fold surge in trading volumes.\n\nGMDC share price dipped to its 52-week low levels of \u20b9 394.95 per share on November 2, 2026 after the PSU reported a decline in its net profit to \u20b9 170.79 crore in Q2FY27, 63% down from \u20b9 465.75 crore profit reported in the year-ago period.\n\nThe company\u2019s total income during the quarter under review increased to \u20b9 986.78 crore from \u20b9 635.76 crore in the year-ago period, as per its BSE filing.\n\nThe stock closed 10.15% higher at \u20b9 468.80 per share on BSE with a market capitalisation of \u20b9 14,907.84 crore on Wednesday, November 4. The stock has surged 7.5% over the past one week, and around 5.88% in two weeks. Its share price has declined 15.67% in three months, around 35.77% in six months, and 21.78% in 2026 so far. Despite its poor performance in the current calendar year, the PSU stock has delivered 31.13% over two years, 43.28% over three years, and 539% over five years.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 08:12 PM IST", "pub_date_relative": "56m ago"}, {"title": "US stocks today: Dow Jones soars 1,000 points at open as Democrats win Congress; data center stocks slide", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: Dow Jones soars 1,000 points at open as Democrats win Congress; data center stocks slide Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks today: Dow Jones soars 1,000 points at open as Democrats win Congress; data center stocks slide SECTIONS US stocks today: Dow Jones soars 1,000 points at open as Democrats win Congress; data center stocks slide Reuters Last Updated: Nov 04, 2026, 08:11:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks opened higher on Wednesday as investors bet a divided Washington after the Democrats' midterm sweep could limit sharp policy shifts, though data center-related stocks were\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 08:11 PM IST", "pub_date_relative": "56m ago"}, {"title": "Big Tech\u2019s $500 billion spending spree leaves a lot less for shareholders", "full_content": "AI is changing the bargain between large technology companies and their shareholders,", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 08:09 PM IST", "pub_date_relative": "59m ago"}, {"title": "The New York Times Adds 420,000 Digital Subscribers - The New York Times", "full_content": "The New York Times Adds 420,000 Digital Subscribers The New York Times NYT stock rises on Q3 earnings as subscriber additions accelerate Quartz New York Times Revenue Rises on Digital Subscriber Gains WSJ New York Times Co. (NYT) Q3 Earnings and Revenues Surpass Estimates Yahoo Finance The New York Times stays on track to reach 15 million subscribers by the end of 2027 Nieman Journalism Lab", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 08:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "CVS Health plans to split in two. Here\u2019s what is driving the massive healthcare breakup.", "full_content": "The healthcare giant surprised analysts with the decision to separate its business. Its stock is down.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 08:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Piyush Goyal sets March 2027 deadline for digitisation of DGFT services, aims to end physical visits", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Piyush Goyal sets March 2027 deadline for digitisation of DGFT services, aims to end physical visits The Economic Times daily newspaper is available online now. Read Today's Paper Piyush Goyal sets March 2027 deadline for digitisation of DGFT services, aims to end physical visits SECTIONS Piyush Goyal sets March 2027 deadline for digitisation of DGFT services, aims to end physical visits ANI Last Updated: Nov 04, 2026, 08:00:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Commerce Minister Piyush Goyal has set March 31, 2027, as the deadline for complete digitisation of DGFT services, including licence, permit and SCOMET approvals. From April 1, businesses will no longer need physical visits to government offices for these services. The move also includes digitising historical records and simplifying procedures.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 08:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Big Update For Teachers Eyeing Govt Jobs: NCTE Plans To Change Eligibility Tests Criteria", "full_content": "The National Council for Teacher Education has formed two expert committees to examine existing teacher recruitment qualifications and rules", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 07:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Budget Wishlist: FICCI Asks Finance Ministry To Restore LTCG Exemption On Listed Equities", "full_content": "In its recommendations, FICCI has mainly sought the restoration of the LTCG exemption on listed shares, along with a predictable capital gains tax framework for the next decade. The demand comes as businesses seek greater certainty over tax treatment and long-term investment decisions.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 07:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "AMD's data center revenue nearly doubles in Q3 and CEO Su expects growth to accelerate", "full_content": "Advanced Micro Devices reported third-quarter earnings on Tuesday that beat Wall Street's expectations, with revenue jumping 45% and data center sales nearly doubling from a year earlier. The stock was up 8% in extended trading, but later pared those gains as election results came in.\n\nHere's how the chipmaker did versus LSEG consensus estimates for the quarter:\n\nRevenue increased from $9.25 billion a year earlier, AMD said in a statement . Neoclouds like CoreWeave and Nebius rallied earlier Tuesday and remained higher after AMD reported results.\n\nCEO Lisa Su said on the earnings call that she expects server revenue to double year over year in 2027 and data center AI growth to accelerate even faster than the company had projected 90 days ago. The company expects data center to drive the majority of its revenue and earnings growth.\n\n\"We have worked across our supply chain to secure the wafers, substrates, advanced packaging, memory, and other key components needed to support much higher growth next year,\" Su said on the earnings call.\n\nAMD's report comes days after Intel disclosed similar data center growth, with revenue in that segment up 78% in the third quarter. But Intel's stock plummeted 29% on Friday over concerns about weak guidance and Intel's ability to meet demand .\n\nThe data center unit makes up the majority of AMD's business, accounting for 64% of overall revenue, up from 47% a year ago.\n\nAfter years spent chasing Nvidia in the market for artificial intelligence graphics processing units, or GPUs, AMD's central processing units, or CPUs, are experiencing a major resurgence with the rise of agentic AI apps like Meta 's Muse. AMD's server CPUs are key for agentic apps because they power virtual machines and can run for hours on their own. Demand from agentic AI boosted AMD shares to a record in October.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 07:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "How Saregama India shares turned music to the ears for investors after 13% price jump - How stock rallied in 2026?", "full_content": "A Ksheerasagar Published 4 Nov 2026, 07:46 PM IST Prefer Livemint on Google Music record company Saregama India saw its shares jump 13.3% in Wednesday's trade on November 4 to settle at \u20b9 637 apiece, as investors cheered the company's September-quarter performance, which came in ahead of Street estimates.\n\nThe company reported a 46.4% year-on-year (YoY) increase in its consolidated net profit to \u20b9 64.17 crore, led by its Music business and the expansion of its Live Events segment. The company's Music business, which includes licensing, artiste management and retail, reported revenue of \u20b9 251.3 crore in Q2 FY27, registering 35% YoY growth.\n\nThe Live Events business, which comprises concerts, devotional events, stand-up comedy and experiential offerings, reported revenue of \u20b9 44.7 crore, registering 101% YoY growth, supported by a higher number of events.\n\nThe company said it continued to strengthen its multi-format live entertainment portfolio, leveraging its artiste relationships and music intellectual property (IP) to engage audiences across geographies and create monetisation opportunities.\n\nMeanwhile, the Video business, which includes films, television, digital series and short-format content, reported revenue of \u20b9 18.3 crore, reflecting a moderation of 16% YoY.\n\nIts revenue from operations increased 36.63% to \u20b9 314.30 crore in the September quarter of FY27, compared with \u20b9 230 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 07:46 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "SEBI relaxes KYC rules for NRIs, OCIs: Can overseas investors now onboard digitally from abroad? Decoded", "full_content": "The Securities and Exchange Board of India (SEBI) has relaxed Know Your Client (KYC) requirements for Non-Resident Indians (NRIs), Overseas Citizens of India (OCIs), and foreign nationals, allowing them to complete digital onboarding while residing overseas, subject to certain conditions.\n\nIn a circular dated November 4, 2026, the market regulator said individual Persons Resident Outside India (PROIs) located in countries compliant with the Financial Action Task Force (FATF) can submit their KYC information and supporting documents digitally to intermediaries.\n\nThe move removes the earlier requirement that clients must be physically present in India while completing digital KYC, which had effectively restricted investors residing overseas from completing the onboarding process remotely.\n\nThe revised framework will come into effect from December 3, 2026, or 30 days from the date of the circular. It will apply to the onboarding of individual PROI clients, except those residing in FATF non-compliant countries.\n\nIntermediaries will collect the investor's PAN, passport, and OCI card, wherever applicable. PAN details will be verified against the Income Tax Database without requiring the original card or a physical copy.\n\nInvestors can submit KYC forms physically, through scanned copies with electronic signatures, or digitally signed forms. Proof of identity and address will also be required, with overseas addresses accepted for PROI clients.\n\nForeign nationals can provide government-issued documents or a letter from a foreign embassy or mission in India if their identity documents do not mention their address, according to SEBI circular.\n\nForeign nationals whose identity documents do not mention their address can submit a document issued by a government department in the foreign jurisdiction or a letter issued by a foreign embassy or mission in India as address proof.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 09:07 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Kraft Heinz to divest its North American coffee business in $650 million deal", "full_content": "Kraft Heinz announced Wednesday that it will divest its North American coffee unit in a deal that values the business at $650 million on an enterprise basis, as it works to refocus on its core brands.\n\nThe deal with private equity firm One Rock Capital Partners includes brands such as Maxwell House and Gevalia and is expected to close in mid-2027, the company said in a news release . Kraft Heinz will retain a 30% noncontrolling equity stake in the business.\n\nKraft Heinz said it will use the $500 million of post-tax cash proceeds from the transaction to pay down its debts as it works to prioritize resources where it can accelerate growth.\n\n\"This transaction is a meaningful step in unlocking value from our portfolio and will further accelerate the momentum behind our transformation,\" Steve Cahillane, CEO of Kraft Heinz, said in the release.\n\nCahillane joined the company in January and called off plans to split the company in two, a move that would have reversed the blockbuster $46 billion merger from a decade ago. He said the problems Kraft Heinz faced were \"fixable and within our control.\"\n\nThe turnaround efforts have included a $700 million investment back into the business and a sharpened focus on some of its core brands .\n\nAlso on Wednesday, Kraft Heinz reported third-quarter earnings that beat expectations and raised its 2026 outlook. It now expects organic net sales to be down 0.5% to 1.25%, an improvement from its second-quarter report, which projected that sales could decrease as much as 2%.\n\n\"Our 2026 operating plan to turn around the U.S. business and accelerate growth internationally is on track,\" Cahillane said. \"Relative to last year, our market share, sales, and volume trends are improving in every region. We are increasingly meeting consumers where they are, and giving them more reasons to choose our brands.\"", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 09:05 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Versigent tops Q3 2026 estimates as shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:04 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ANI Pharma earnings up next: Rare disease pivot faces test", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:03 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Flutter Entertainment posts Q3 2026 loss, cuts guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:03 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ingevity set to report earnings after streamlining portfolio", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:03 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crude Oil Inventories Decline Less Than Expected, Impacting Prices", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:02 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Vistance Networks faces key earnings test after major sale", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 09:02 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "10-year Treasury yield is little changed as traders mull over Democrats' midterm victories", "full_content": "The 10-year Treasury yield traded near the flatline on Wednesday as investors weighed big wins from Democrats in the U.S. midterm elections.\n\nThe benchmark 10-year Treasury note yield was up less than 1 basis point at 4.954%. The 30-year bond yield advanced 1 basis point to 5.334%, and the shorter-term 2-year note yield added 1 basis point to 4.627%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nDemocrats obtained majorities in both the House and Senate . Democrats flipped Senate seats from Republicans in Iowa, Kansas, North Carolina, Ohio, South Carolina, Maine and Texas. They also won key gubernatorial races in Ohio and Texas.\n\nThe resounding victory by Democrats could rein in government spending from the Trump administration, as it makes it harder for the White House to push legislation through Congress.\n\nTraders at JPMorgan said one of the issues Wall Street is focusing on after the midterms is \"reduced deficit spending.\"\n\n\"This can be achieved by asserting power over the budget and likely wading through a government shutdown,\" they said.", "source": "CNBC Finance", "pub_date_str": "04 Nov 2026, 08:58 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Dow rallies 1,000 points as political risk eases after resounding Democratic victory in U.S. midterms: Live updates", "full_content": "Stocks ripped higher on Wednesday as a decisive victory by Democrats in the U.S. midterm elections \u2014 and President Donald Trump's acceptance of the results \u2014 removed political uncertainty risk hanging over Wall Street.\n\nDemocrats won majorities in both the House of Representatives and Senate, and scored victories in key gubernatorial races like Texas. The Democrats will now be a check on the policies of Trump, who's enacted business-friendly tax cuts, while also pursuing tariffs and a war in Iran that's boosted inflation.\n\nThe Dow Jones Industrial Average traded 1,024 points, or 2%, higher. The S&P 500 gained 1.5%, while the Nasdaq Composite jumped 2%.\n\nTrump told The New York Times he was \"absolutely willing\" to accept the results and told The Wall Street Journal that he and Republicans would work with Democrats.\n\nThe rebound \"was in part due to the president's initial tone and reaction to the results,\" said Jay Woods, chief market strategist at Freedom Capital Markets. \"Still more uncertainty looms, but one thing is certain, there will be gridlock and historically this is good for the market.\"\n\nShares linked to the economy that could benefit from a more stable environment led the gains. Walmart added 3%, while Bank of America rose 2.5% as investors looked for stocks outside of technology.\n\nShares that could benefit directly from Democratic policies, or an end to tougher Trump actions, gained. Health insurers and hospital operators advanced, with Molina Healthcare rising 5% along with Centene and HCA Healthcare up 7%. The Invesco Solar ETF jumped 8%.\n\nHeading into the election investors worried a Democratic sweep could weigh on some areas of the market , especially stocks related to the artificial intelligence build-out. Investors feared a big Democratic win could mean more restrictions on data centers nationwide. The Texas governor win by Gina Hinojosa, who's pledged an immediate moratorium in the key data center hub, added to the fears Wednesday.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:58 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CVS to split off drugstore business in major breakup of healthcare giant; shares fall 10%", "full_content": "CVS Health plans to split into two separate public companies by the first half 2028 in what would be one of the largest corporate splits in history, the company announced Wednesday.\n\nThe move would reverse the company's massive $78 billion acquisition of its insurer, Aetna, and dismantle the vertically integrated healthcare conglomerate it created in 2018. The plan would specifically separate CVS' roughly 9,000 retail pharmacies from its major insurance business and pharmacy benefit manager, Caremark, one of the nation's three largest PBMs.\n\nThe decision follows a \"comprehensive strategic review\" by the company's board of directors, according to a news release. Shares of CVS fell roughly 10% on Wednesday after the announcement.\n\nIt's a stunning reversal for the healthcare powerhouse, which has spent the last two decades working to turn itself into a one-stop health destination. The move also comes as CVS' aggressive turnaround plan under CEO David Joyner shows substantial progress, with the company pursuing $2 billion in cost cuts, store closures, leadership shakeups and efforts to rein in Medicare Advantage costs.\n\n\"From a position of strength, and a focus on the long term, we plan to create two focused companies to improve consumer engagement, affordability, and care coordination,\" Joyner said in the release.\n\nCVS shares have jumped roughly 70% since Joyner took the helm in October 2024, bringing the company's market value to $117 billion.\n\nThe insurance and PBM company will retain the CVS Health name and be run by Joyner, while the other company will be called CVS Pharmacy and be led by Prem Shah, who is currently group president of CVS Health. Additional leadership positions and board members will be announced at a later date, CVS said.\n\nExisting CVS shareholders will own shares in both companies after the split. The Financial Times on Tuesday first reported the breakup plans.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:56 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market Today: Stock Futures Drop as Investors Weigh Democratic Gains \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Stock Futures Drop as Investors Weigh Democratic Gains \u2014 Live Updates WSJ Dow rallies 1,000 points as political risk eases after resounding Democratic victory in U.S. midterms: Live updates CNBC Stocks soar after Democrats take control of Congress CBS News Dow futures jump by 1,100 points as Democrats take control of Congress CNN Stock market after midterms: S&P 500 returns since 1950 qz.com", "source": "Google News Business", "pub_date_str": "04 Nov 2026, 08:54 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Prologis CEO says warehouse demands are shifting fast. Here's how he's keeping up", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nThere will always be some need for massive, centralized warehouses, but rising demand for faster deliveries and resilient energy supplies have companies rethinking where their warehouses should be.\n\nIn fact, 91% of company leaders said retailers and logistics providers \"urgently\" need more decentralized fulfillment networks to meet delivery expectations, according to a new survey from Prologis , in partnership with the Harris Poll. Responses came from more than 1,800 business leaders in the U.S., U.K., Germany, India, China and Mexico.\n\n\"Our focus is the consumption end, so we have really narrowed our focus into being in not only the most dynamic consumption centers, most dynamic population centers around the world, but we're very specific what sub markets in those cities that we want to focus on? Because it is all about being closer to those rooftops,\" said Dan Letter, CEO of Prologis.\n\nAccording to the survey, fewer companies plan to keep their existing global footprint, with the share falling 14 percentage points from a year ago to just 36%. They are seeking faster delivery, first and foremost, as consumer expectations escalate. Same-day delivery is the goal, with the share of companies offering it doubling since 2019. Speed tops price when it comes to securing a competitive advantage, according to the survey.\n\nAs a result, companies are mixing up their relocation strategies, with more than half both diversifying and regionalizing and about a third nearshoring and reshoring.\n\n\"That's why we've been very focused on where our portfolio is.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 08:52 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold gains 3% as dollar slides after Democratic midterm gains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Gold gains 3% as dollar slides after Democratic midterm gains Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Gold gains 3% as dollar slides after Democratic midterm gains SECTIONS Gold gains 3% as dollar slides after Democratic midterm gains Reuters Last Updated: Nov 04, 2026, 08:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Wednesday, gold prices surged by 3%, reaching impressive new levels following the midterm elections, during which Democrats secured control of both the Senate and House. This political transformation, combined with a weaker dollar, heightened gold and precious metals demand. Investors are keenly watching for the upcoming US non-farm payrolls report, as rising interest rates and ongoing fiscal risk concerns continue to influence market sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , S
