n another subdued growth year for Indian IT, with AIled productivity pass-throughs, pricing pressure and continued softness in discretionary spending projected to constrain reported growth. Within Tier1, we prefer TCS, TECHM and, among mid-caps, we have COFORGE and MPHASIS as our preferred investment ideas,\u201d the brokerage firm said.\n\nTCS share price have gained 0.44% over the past five trading sessions, however, the stock remained under pressure over longer periods, declining 9.90% in one month and 16% over the past six months.\n\nTCS shares have fallen 35.68% year-to-date and 30.53% over the past year, reflecting sustained weakness in the stock. The decline extends to the longer term, with shares losing 47.25% over five years. Despite the recent downturn, TCS has delivered a cumulative return of 1,625% since its listing, highlighting its long-term wealth creation history.\n\nTech Mahindra shares have delivered a mixed performance across different time frames. The stock gained 0.90% in Thursday\u2019s session, while it has declined 3.69% over the past month.\n\nOver the last six months, however, the stock has gained 6.11%, indicating some recovery over the medium term. On a year-to-date basis, Tech Mahindra remains down 4.34%, reflecting the pressure seen in the stock during the year.\n\nCoforge share price has delivered a mixed performance in the near term, gaining 2.35% over the past week but declining 7.11% over the last month.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 04:07 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Relief For Travelers? US Imposes Up To $20,000 Visa Bonds On 50 Nations; India Exempted", "full_content": "The US has introduced visa bonds of $10,000-$20,000 for eligible B1/B2 applicants from 50 countries. Travellers must use commercial air entry and exit points, while overstays or violations could result in forfeiture of the bond.", "source": "NDTV Profit", "pub_date_str": "04 Oct 2026, 03:56 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Valuations of IT stocks already capture most of AI disruption risk: Chintan Haria", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Valuations of IT stocks already capture most of AI disruption risk: Chintan Haria ICICI Prudential Asset Management Company Share Price HDFC Asset Management Company Share Price Nippon Life India Asset Management Share Price Aditya Birla Sun Life AMC Share Price UTI Asset Management Company Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Valuations of IT stocks already capture most of AI disruption risk: Chintan Haria SECTIONS Valuations of IT stocks already capture most of AI disruption risk: Chintan Haria By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 04, 2026, 03:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Nifty IT index\u2019s 25% fall in 2026 may have already priced in much of the threat from AI. Chintan Haria of ICICI Prudential AMC sees selective opportunities in companies positioned to benefit from data engineering, cloud migration, legacy modernisation and AI integration.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 03:47 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI may hike repo rate by 25 bps as inflation and oil risks mount: Sunil Sanghai", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a RBI may hike repo rate by 25 bps as inflation and oil risks mount: Sunil Sanghai The Economic Times daily newspaper is available online now. Read Today's Paper RBI may hike repo rate by 25 bps as inflation and oil risks mount: Sunil Sanghai SECTIONS RBI may hike repo rate by 25 bps as inflation and oil risks mount: Sunil Sanghai ET CONTRIBUTORS Last Updated: Oct 04, 2026, 06:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The RBI could raise the repo rate by 25 basis points in October and signal further tightening as inflation, elevated crude prices and a narrowing rate gap with the US pressure the rupee. Strong reserves and a manageable current account provide crucial buffers.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 03:10 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CAS update: Sebi gets 20k comments on Closing Auction Session, Timings, Derivates Contracts Settlement Methodologies", "full_content": "The Securities and Exchange Board of India (SEBI) has received around 20,000 responses to its consultation paper on the Closing Auction Session (CAS), market timings and settlement methods for derivative contracts. The number is significantly higher than the over 3,500 comments previously reported in some media outlets.\n\nAccording to the latest data available with the regulator, SEBI had received around 20,000 comments by 7 pm on October 3, the deadline for submitting feedback on its consultation paper. The regulator shared the figures on X. The consultation paper was released on September 12.\n\nThe number of responses is more than three times the 6,000 comments received by SEBI in 2024 on a consultation paper proposing measures to curb excessive trading in the futures and options (F&O) segment.\n\nThe latest consultation paper follows SEBI's initial experience with the Closing Auction Session ( CAS ) framework, introduced for F&O stocks from August 3, 2026. The regulator has invited feedback on seven proposals concerning derivatives settlement methods, market trading hours and certain operational aspects of the closing auction process.\n\n\"Today is the last date, and we will actually quickly look at all these comments and go ahead, because I think our proposals are quite clear,\" Sebi Chairman Tuhin Kanta Pandey was quoted as saying by PTI.\n\nIn September, Sebi proposed revisions to the Closing Auction Session (CAS) framework and the methodology used to determine settlement prices for index and stock derivatives on expiry days. The review came after the introduction of CAS in the equity cash segment and concerns emerged over its potential impact on derivatives settlement prices.\n\nThe CAS mechanism aims to determine closing prices through an auction-based process.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 03:00 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "IT Q2 Preview: Muted growth, steady margins likely; deal conversion, AI deflation in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a IT Q2 Preview: Muted growth, steady margins likely; deal conversion, AI deflation in focus Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper IT Q2 Preview: Muted growth, steady margins likely; deal conversion, AI deflation in focus SECTIONS IT Q2 Preview: Muted growth, steady margins likely; deal conversion, AI deflation in focus PTI Last Updated: Oct 04, 2026, 03:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's leading IT firms are projected to exhibit modest revenue growth and stable margins for the second quarter. Analysts anticipate that discretionary spending will remain constrained due to geopolitical issues affecting client budgets. As such, decision-making cycles are expected to prolong for upcoming quarters. Additionally, AI advancements are predicted to impact traditional services and revenue generation timelines.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 02:59 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why the IPO market is booming and busting", "full_content": "Flotations have stalled and returns from new listings have been weak", "source": "FT Markets", "pub_date_str": "04 Oct 2026, 02:59 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "RBI may increase rates by 0.25 pc in Oct policy amid inflationary pressures, experts poll shows", "full_content": "The RBI is expected to raise the repo rate by 25 basis points in its October policy review as inflation pressures build from higher crude prices, the West Asia conflict and global monetary tightening, according to a PTI poll of economists and bankers. Most also expect a hawkish tone, a higher FY27 inflation forecast and possibly further rate hikes later in the fiscal year.", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 02:57 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "GVC integration, supply chain resilience, FTAs key to boost exports, high-end manufacturing: Deloitte India", "full_content": "India needs deeper integration into global value chains, lower logistics costs and better use of free trade agreements to boost exports and move into higher-value manufacturing, according to Deloitte India. It also called for stronger supply-chain resilience, tariff rationalisation and greater support for MSMEs facing trade-finance, compliance and currency risks.", "source": "Economic Times Economy", "pub_date_str": "04 Oct 2026, 02:54 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US to receive potash shipment from Belarus as relations thaw", "full_content": "Washington has begun to ease sanctions on Minsk in exchange for the release of political prisoners", "source": "FT Markets", "pub_date_str": "04 Oct 2026, 02:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Top 3 stocks to buy: HDFC Bank, Infosys, BEL by Ganesh Dongre | Target price, stop-loss for IT, defence and bank shares", "full_content": "Ganesh Dongre of Anand Rathi believes the Nifty 50 index has moved into an oversold zone following recent stock market crashes", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 02:26 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "D-Mart Q2 business update: Multibagger Avenue Supermarts - How ace investor Damani's firm grew in revenue, store count", "full_content": "D-Mart Q2 business update: On a sequential basis, D-Mart's revenue rose 4.7% from \u20b918,343.49 crore reported in the June quarter.", "source": "LiveMint Markets", "pub_date_str": "04 Oct 2026, 02:08 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IPO bonanza: 29 companies to list this week; GMPs signal returns of up to 59%", "full_content": "After a busy fundraising period, the primary market turns its focus to 29 listings this week. Grey market trends remain mixed, with Vans Electroengineerings signalling a potential 59% gain, while several companies indicate flat debuts.", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 01:54 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "ET Alpha Wealth Summit 2.0: Date, venue, speakers, agenda and registration", "full_content": "The ET Alpha Wealth Summit 2.0 set to be held on October 8 at ITC Maratha in Mumbai. Leading investment experts will convene to discuss trends affecting capital flows and investment strategies. Keynote speeches and panel discussions will cover topics such as alternative assets, structured debt, and family office investment frameworks. The summit aims to provide insights into evolving wealth creation methodologies and the role of technology in investing.", "source": "Economic Times Markets", "pub_date_str": "04 Oct 2026, 01:52 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bajaj Finance: Why this rare Nifty outp     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
