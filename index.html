C said that the contracts are more susceptible to exploitation \"because their settlement turns on the discrete conduct of a person that may be neither independently generated nor externally verifiable.\"\n\nThe letter noted that the agency was not creating new obligations that regulated exchanges need to follow, but rather advising entities on when mention markets may be listed consistent with the Commodity Exchange Act, the law that governs the assets that the CFTC regulates.\n\nMention markets \u2014 which are made up of contracts that ask traders what specific words will be used in a speech, a corporate earnings call or during a television broadcast \u2014 have come under scrutiny by the CFTC. CNBC reported in August that the agency was conducting an internal review into the contract type, and that platform Kalshi pulled its sports-related mention markets in response to the inquiry.\n\nKalshi is one of the few U.S. regulated platforms that features mention markets. Its chief rival, Polymarket, only features them on its international exchange, which is not regulated by the CFTC.\n\n\"We've addressed this guidance based on a prior discussion with the CFTC,\" Kalshi spokesperson Elisabeth Diana said in a statement.\n\nMention markets also generated headlines in July after news reports that a longtime teleprompter operator for President Donald Trump profited off of trades on Kalshi related to contracts on mention markets that were tied to the president's statements.", "source": "CNBC Finance", "pub_date_str": "23 Sep 2026, 06:28 AM IST", "pub_date_relative": "35m ago"}, {"title": "WACR tops repo rate for first time in nearly 2 months", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a WACR tops repo rate for first time in nearly 2 months IDFC First Bank Share Price Federal Bank Share Price IndusInd Bank Sha  response to the inquiry.\n\nKalshi is one of the few U.S. regulated platforms that features mention markets. Its chief rival, Polymarket, only features them on its international exchange, which is not regulated by the CFTC.\n\n\"We've addressed this guidance based on a prior discussion with the CFTC,\" Kalshi spokesperson Elisabeth Diana said in a statement.\n\nMention markets also generated headlines in July after news reports that a longtime teleprompter operator for President Donald Trump profited off of trades on Kalshi related to contracts on mention markets that were tied to the president's statements.", "source": "CNBC Finance", "pub_date_str": "23 Sep 2026, 06:28 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "WACR tops repo rate for first time in nearly 2 months", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a WACR tops repo rate for first time in nearly 2 months IDFC First Bank Share Price Federal Bank Share Price IndusInd Bank Share Price YES Bank Share Price RBL Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper WACR tops repo rate for first time in nearly 2 months SECTIONS WACR tops repo rate for first time in nearly 2 months By ET Bureau Last Updated: Sep 23, 2026, 06:13:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Liquidity in the banking sector has contracted to below \u20b95 lakh crore, causing the weighted average call rate to rise to 5.31%. The Reserve Bank of India is undertaking actions to absorb surplus liquidity. With government expenditures and bond sales looming, analysts predict a retu ubscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rupee strengthens to 95.59 amid drop in oil prices & RBI dollar sales", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee strengthens to 95.59 amid drop in oil prices & RBI dollar sales The Economic Times daily newspaper is available online now. Read Today's Paper Rupee strengthens to 95.59 amid drop in oil prices & RBI dollar sales SECTIONS Rupee strengthens to 95.59 amid drop in oil prices & RBI dollar sales By ET Bureau Last Updated: Sep 23, 2026, 05:53:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Tuesday, the Indian rupee appreciated to 95.59, benefiting from a decrease in oil prices. The central bank's dollar sales helped mitigate pressure on the currency. The rupee fluctuated between 95.58 and 95.86 during the trading session. Corporate demand for dollars created a conflict in the market, affecting the rupee's stability. Ultimately, the central bank's intervention helped maintain the rupee's strength against the dollar.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Sep 2026, 05:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock futures are little changed after Nasdaq Composite posts fresh record: Live updates", "full_content": "U.S. equity futures were little changed late Tuesday as oil prices and bond yields eased on hopes for potential de-escalation in the war between the U.S. and Iran.\n\nFutures tied to the Dow Jones Industrial Average were down 14 points, or 0.03%. S&P 500 futures added 0.02%, and Nasdaq-100 futures climbed 0.1%.\n\nIn Tuesday's regular trading, the Dow fell 0.4%, and the Nasdaq Composite gained 0.5%, marking its fourth positive session in a row. The tech-heavy index hit a new all-time intraday high and closed at a record. The S&P 500 finished marginally lower, but remains about 0.7% off from its all-time high.\n\nIn Asia-Pacific, The Kospi added 1.79% at the open, while the small-cap Kosdaq gained 0.84%. Australia's benchmark S&P/ASX 200 was 0.34% higher. Japan's markets are closed for a holiday.\n\nBrett Ewing, chief market strategist at First Franklin Financial Services, told CNBC he thought the S&P 500 could hit 8,200 before the year is through.\n\n\"Our call at the beginning of the year was 8,000 on the S&P. We raised our target, believe it or not, in August to 8,200 by year-end,\" he said.\n\nPresident Donald Trump said Tuesday that U.S. and Iranian officials met for three hours during the annual United Nations General Assembly gathering in New York. He described it as a \"very good meeting.\"\n\nEarlier Tuesday in his address to the U.N., Trump said he has a \"big decision\" over whether to reach a deal with Tehran or \"annihilate\" the country.", "source": "CNBC Top News", "pub_date_str": "23 Sep 2026, 05:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold Steadies as Iran Talks Temper Concerns Over Fed Rate Path", "full_content": "(Bloomberg) -- Gold was steady as traders monitored progress in talks between the US and Iran for clues on how energy costs will influence the Federal Reserve\u2019s path for interest rates.\n\nBullion was trading around $4,360 an ounce, after swinging between gains and losses on Tuesday before ending the session up 0.4%. President Donald Trump said US officials had a \u201cvery good\u201d meeting with Iranian envoys in New York, reviving fragile hopes for a new diplomatic off-ramp, after he earlier threatened to annihilate the country.\n\nOil extended a decline on Trump\u2019s latest comments, as well as reports that Saudi Arabia aims to restore crude exports via its East-West pipeline in the coming days, enabling Riyadh to resume a bypass of the Strait of Hormuz. West Texas Intermediate has now fallen more than 10% since last Tuesday\u2019s close.\n\nGold has been sensitive to recent swings in oil as investors assess whether elevated energy prices will keep inflationary pressures strong enough to prompt further Fed rate increases. Higher borrowing costs typically undermine support for bullion because it doesn\u2019t pay interest.\n\nTraders are also tracking comments by Fed officials for clues on the rate path, after the central bank voted unanimously last week to hike for the first time in three years. Richmond Fed President Tom Barkin warned on Tuesday it could take time for inflationary shocks to wane and there was a risk elevated pressures could become entrenched. He stopped short of signaling whether additional tightening was needed.\n\nMeanwhile, gold imports into top consumer China have been stronger than ever this year, helped by a slump in international prices and a firmer yuan. Purchases through August topped 1,000 tons, surpassing the total for the whole of 2025, according to the latest customs data, which goes back to 2017.\n\nSpot gold rose 0.1% to $4,363.50 an ounce at 7:55 a.m. in Singapore. Silver advanced 0.5% to $67.40 an ounce, after gaining 1.6% the day before.", "source": "LiveMint Markets", "pub_date_str": "23 Sep 2026, 05:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "September sees biggest IPO rush in nearly 30 years as 30 mainboard issues raise Rs 38,785 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a September sees biggest IPO rush in nearly 30 years as 30 mainboard issues raise Rs 38,785 crore Angel One Share Price Choice International Share Price JM Financial Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price The Economic Times daily newspaper is available online now. Read Today's Paper September sees biggest IPO rush in nearly 30 years as 30 mai hing a warning sign SECTIONS Nvidia's stock is flashing a warning sign Bloomberg Last Updated: Sep 23, 2026, 05:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nvidia Corp's stock currently trades at less than 17 times its projected profit for the upcoming year, marking a notable decline from earlier values seen in 2025 and mid-2023. Despite solid fundamentals, investor confidence is wavering on the sustainability of the company's earnings. The stock's performance follows a rally in semiconductor shares amid concerns over AI models, highlighted by encouraging signals regarding chip demand from new AI advancements.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Sep 2026, 05:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump administration is examining whether a diesel export ban is feasible, Treasury Secretary says", "full_content": "The Trump administration is looking into whether implementing a diesel export ban would ease record high prices for the critical fuel, Treasury Secretary Scott Bessent said Tuesday.\n\n\"We're examining whether it's feasible in terms of the overall refining capacity and whether a full or partial ban would work,\" Bessent said at a bilateral meeting between President Donald Trump and Ukrainian President Volodymyr Zelenskyy at the United Nations.\n\nTrump said Tuesday he's advocated for a diesel export ban during internal administration deliberations. The president said a decision would quickly be made \"one way or another\" on whether to implement a ban.\n\n\"I've said let's not send out the diesel. We make a lot of diesel,\" Trump told reporters. Republican lawmakers including Sen. Chuck Grassley of Iowa have called for an export ban as high diesel prices hit farmers and truckers ahead of the November midterm elections.\n\nDiesel in the U.S. has surged to a record high $6.53 per gallon, almost $3 above the level last year, according to data from AAA. In California, diesel costs $8.44 per gallon.\n\nFuel prices have jumped as the wars in Eastern Europe and the Middle East have slashed global refining capacity.\n\nUkraine's attacks on Russian refineries have forced Moscow to implement a diesel export ban. Refineries in the Middle East have also come under attack from Iran and its Houthi allies. And product exports through the Strait of Hormuz are constrained due to Iranian threats to tankers.\n\nThe oil industry lobby group the American Petroleum Institute warned that \"restricting U.S. energy exports would only compound the problem\u2014exacerbating refining challenges and ultimately hurting consumers.\" \"The answer is more supply and more flexibility\u2014not new restrictions that risk making a difficult situation worse,\" API CEO Mike Sommers said in a statement.", "source": "CNBC Top News", "pub_date_str": "23 Sep 2026, 05:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil Extends Slump on Iran Talks Optimism, Saudi Pipeline Outlook", "full_content": "(Bloomberg) -- Oil extended losses as the US flagged progress in talks with Iran to end their war, and Saudi Arabia moved to restart a key pipeline.\n\nWest Texas Intermediate for November fell below $90 a barrel after losing about 10% over the previous five days, while Brent settled near $99 on Tuesday. President Donald Trump said officials had a \u201cvery productive\u201d meeting with Iranian envoys, even after he threatened to annihilate the Islamic Republic during a United Nations speech. More meetings are planned, he added.\n\nIn the Middle East, Saudi Arabia aims to restore oil exports via its critical East-West pipeline in the coming days, enabling Riyadh to resume a bypass of the Strait of Hormuz. The conduit \u2014 which has the capacity to transport 7 million barrels a day \u2014 was damaged in attacks earlier this month.\n\nOil has still rallied by more than 60% this year as Middle East hostilities disrupted shipments through Hormuz, the world\u2019s most critical energy chokepoint. The surge has boosted inflation, with product prices rallying even more than crude. Amid the fuels crunch, President Trump said he had encouraged his advisers to support a ban on US diesel exports.\n\nTrump said his special envoys Steve Witkoff and Jared Kushner had participated in the meeting with the Iranian envoys. The US leader was also due to meet with officials from the Persian Gulf, including members of the six-nation Gulf Cooperation Council, as well as Syria, Iraq, Jordan and Turkey.\n\nMultiple efforts to end the war between Washington and Tehran have so far proved fruitless, including an interim peace deal that was in effect for a short period. Since then, the US has been blockading the Islamic Republic\u2019s ports, limiting energy export revenues. In retaliation, Iran has been attacking ships in Hormuz, the waterway that links the Persian Gulf to global markets.\n\nAfter more than six months of conflict, the two sides remain at odds on a host of key issues, including Hormuz.", "source": "LiveMint Markets", "pub_date_str": "23 Sep 2026, 05:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Adani Group firms settle Sebi case on governance issues", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Adani Group firms settle Sebi case on governance issues The Economic Times daily newspaper is available online now. Read Today's Paper Adani Group firms settle Sebi case on governance issues SECTIONS Adani Group firms settle Sebi case on governance issues By ET Bureau Last Updated: Sep 23, 2026, 06:10:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Adani Group has settled with Sebi, with companies like Adani Enterprises and Adani Green Energy collectively paying \u20b91.5 crore over allegations concerning related party transaction disclosures and corporate governance practices. Notably, Adani Enterprises contributed \u20b976.05 lakh to the settlement, responding to criticisms raised in the Hindenburg Report about the company's compliance with audit standards and peer reviews.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Sep 2026, 05:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market News, Sept. 22, 2026: Oil Sinks Below $100, Lifting Tech Stocks - WSJ", "full_content": "Stock Market News, Sept. 22, 2026: Oil Sinks Below $100, Lifting Tech Stocks WSJ Nasdaq rises to new record; S&P 500 closes flat as oil slides for a fifth day CNBC Nasdaq sets record high, oil dips on improved crude flows reuters.com Nasdaq hits intraday record high, AI stocks rally Yahoo Finance S&P 500 Holds Near Record High as Oil Prices Ease: Markets Wrap Bloomberg.com", "source": "Google News Business", "pub_date_str": "23 Sep 2026, 05:04 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "23 Sep 2026, 07:04 AM IST", "total_stories": 389};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
