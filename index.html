shares will be in focus on Monday, 16 November, after the electrification and automation major reported its September quarter results and received a rating upgrade from Motilal Oswal Financial Services. The brokerage has upgraded the stock to 'Buy' from 'Neutral', citing improving order inflows, revenue growth prospects and a recovery in margins. It has also raised its target price to \u20b9 8,200 from its earlier estimate, implying an upside potential of around 16% from Friday's closing price.\n\nThe positive brokerage outlook comes even as the stock has witnessed some volatility in recent months. ABB India's Q3 CY26 performance, marked by record quarterly orders and a robust order backlog, has strengthened expectations of improved execution and earnings growth over the coming quarters.\n\nABB India reported an 11% year-on-year increase in net profit to \u20b9 440 crore for the September quarter, compared with \u20b9 398 crore in the corresponding period last year.\n\nRevenue from operations rose 19.4% to \u20b9 3,738 crore from \u20b9 3,130 crore a year earlier, supported by stronger business activity and demand across key industrial segments.\n\nThe company recorded total order inflows of \u20b9 4,733 crore in Q3 CY26, registering a sharp 56% year-on-year increase and marking its highest-ever quarterly order intake. Its order backlog stood at \u20b9 12,927 crore at the end of September, up 36% from the year-ago period, providing revenue visibility for the coming quarters.\n\nElectrification was the key growth driver, with orders increasing across segments.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 12:39 PM IST", "pub_date_relative": "48m ago"}, {"title": "Cape Verde votes for president with emigration in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 12:36 PM IST", "pub_date_relative": "51m ago"}, {"title": "Gold rate in this UP city sees major crash; price plunges over \u20b96,611 in just 3 days, slips below \u20b91.36 lakh mark", "full_content": "Gold price in Meerut today, 15 November: Price of the yellow metal slumped \u20b9 6,611 per 10 grams over the past three days in Meerut, as per India Bullion and Jewellers Association (IBJA), local publication Amar Ujala reported. Price of 24-carat gold in the Uttar Pradesh city reached \u20b9 1,35,809/10 grams on Saturday, it added.\n\nSpot gold price globally has crashed by 4.5% this week \u2014 the most since June, amid investor concern that the United States Federal Reserve could hike interest rates and higher oil prices could push inflation, Bloomberg reported.\n\nSpot gold moved up 0.1% at $3,879.71 per ounce as of 1905 GMT, after briefly touching a session high of $3,922.97 when the US Producer Price Index (PPI) data came out, according to Reuters. US gold futures for December delivery settled largely unchanged at $3,886.30/oz, it added.\n\nAccording to the report, gold prices in Meerut fell below the \u20b9 1.36 lakh/10 gm mark after nearly eight months. It was last recorded at \u20b9 1,35,141/10 gm in March. Over the last three days, the precious metal lost \u20b9 6,611 to reach \u20b9 1,35,809/10 gm, according to IBJA data, it added.\n\nAt the time of writing on 15 November, 24K gold bullion was trading at \u20b9 1,37,320 per 10 grams, while 999 fine silver was at \u20b9 1,77,280 per kg, data on the bullion website showed.\n\nFor Meerut, the website showed, 24K gold bullion trading at \u20b9 1,37,100/10 gm, while 999 fine silver was at \u20b9 1,77,000/kg. Further, 22K gold was trading at \u20b9 1,25,675/10 gm on 15 November, and 18K gold was trading at \u20b9 1,02,825 on Sunday.\n\nHere are gold and silver rates in key Indian cities on Sunday. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Bengaluru, Chennai, Delhi, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 15 November, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,37,070 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,25,648 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 12:31 PM IST", "pub_date_relative": "57m ago"}, {"title": "Steven Conine, Wayfair director, sells $7.13 million in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ibex chief legal officer sells $395,727 in common shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 12:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "ePlus COO Darren Raiguel disposes of $79,542 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Wayfair CEO Niraj Shah sells $7.13M in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 12:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Motors shares: 22% down in 2026, right time to buy famous auto stock? What brokerages say after loss narrows in Q2", "full_content": "VALUE BSE ALPHA Dhanya Nagasundaram Published 15 Nov 2026, 11:56 AM IST Prefer Livemint on Google Tata Motors Passenger Vehicles Ltd (TMPVL) shares will be in focus on Monday, 16 November, after the automaker reported its September quarter results, with a sharp increase in revenue and a narrowing of operational pressures but a substantial consolidated loss due to exceptional charges.\n\nThe stock has declined nearly 22% so far in 2026, raising the question of whether the recent correction offers investors an opportunity to accumulate the auto stock. However, brokerages remain divided on its prospects, with Motilal Oswal Financial Services reiterating its 'Sell' rating and setting a target price of \u20b9 240, while Nuvama Institutional Equities has maintained its 'Buy' rating, albeit with a reduced target price of \u20b9 360 from \u20b9 450.\n\nTMPVL reported a consolidated net loss of \u20b9 5,531 crore for Q2 FY27, compared with a profit of \u20b9 76,170 crore in the corresponding quarter last year. The loss included exceptional items worth \u20b9 6,738 crore, primarily comprising employee separation costs of \u20b9 3,776 crore and asset impairment charges of \u20b9 2,856 crore.\n\nDespite the reported loss, consolidated revenue from operations rose 34% year-on-year to \u20b9 96,920 crore. EBITDA margin improved by 630 basis points to 6.2% during the quarter.\n\nThe company's luxury brand Jaguar Land Rover (JLR) reported exceptional items of \u00a3530 million, largely linked to restructuring, employee separation costs and the write-down of intangible assets under development.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 11:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bouma Box Office Collection Day 3: Rejin S Babu's Gothic Thriller Sees 59% Jump In Earnings", "full_content": "Written and directed by Rejin S. Babu, the Malayalam mystery-horror thriller 'Bouma' was released in theatres on November 12, 2026.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 11:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "'God Save The King\u2019: IPL Founder Lalit Modi Announces British Citizenship, Calls UK 'Home\u2019", "full_content": "On receiving British citizenship, he said that the UK had been his home for many years and that he deeply appreciated its people, institutions, traditions and values.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Could Budapest be the next digital nomad hotspot?", "full_content": "When mechanical engineering graduate and entrepreneur Lexi Vindisch wanted to run her business from a remote location, she didn't pick a town in North America where she lived. Instead, Budapest was top of her list.\n\nWith its mix of grand sights, caf\u00e9s, cultural events and inexpensive public transportation, the Hungarian capital has become a popular place for digital nomads \u2014 people embracing the \"work from anywhere\" trend that took off during the Covid-19 pandemic.\n\nBased at co-working space Create26 in Budapest, Vindisch runs a domestic cleaning company based in Victoria, Canada, as well as overseeing Lead Machine, a marketing software firm for home service businesses.\n\nHungary ranked fifth for digital nomads on a 2025 list of countries, behind Spain, the United Arab Emirates, Montenegro and the Bahamas. The index, compiled by visa information website VisaGuide, considered factors such as taxes, income and cost of living.\n\nVindisch, who has worked in many European and North American cities, but has Hungarian roots, said Budapest feels different. \"I've been in locales that are super beautiful, well organized, great facilities, but they lacked a personality ... I've never been able to replicate the feeling that Budapest holds anywhere else,\" she said.\n\nEU citizens can work remotely from Hungary long-term if they meet certain requirements, while Hungary's White Card scheme, which provides one- or two-year residency permits for digital nomads from outside the EU, requires a net monthly income of at least 3,000 euros ($3,370).\n\nThere are around 35 co-working spots in central Budapest, according to the Coworking Hungary Association, several of which are in the bustling District VI, near the fashionable bars and restaurants of the Jewish Quarter.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Kamarajar Port picks SBI Capital, IDBI Capital and ICICI Securities for IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nChennai-based Kamarajar Port Ltd has picked three investment banks for an initial public offering (IPO) that would make it India's first listed state-backed port.\n\nThe country's first corporate major port has hired SBI Capital Markets Ltd, IDBI Capital Markets & Securities Ltd, and ICICI Securities Ltd as the book-running lead managers for the offer, two people aware of the development told Mint .\n\nThe IPO is likely to include an offer for sale of about \u20b9 1,200 crore, while a fresh issue could be decided at a later stage, a document issued by the port earlier in September showed.\n\nValuation discussions are still some time away, but the IPO is likely to be completed within calendar 2027, Mint has learnt.\n\nEmails sent to Kamarajar Port, SBI Capital, IDBI Capital and ICICI Securities on 14 November did not elicit responses until press time.\n\nMint had reported on 13 September that the Chennai Port Authority , which wholly owns Kamarajar Port, had begun the process of seeking up to three bookrunning lead managers to structure and manage the issue.\n\nIndia's public markets currently have three listed port entities: Adani Ports and Special Economic Zone Ltd (APSEZ), JSW Infrastructure Ltd and APM Terminals-backed Gujarat Pipavav Port Ltd. A successful IPO would make Kamarajar the only listed state-backed port in the country.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago"}, {"title": "Donga Naa Koduku Box Office Collection Day 2: Mouli Tanuj Prasanth Starrer Sees Growth, Mints This Amount", "full_content": "Written and directed by Sreenu Kambala, 'Donga Naa Koduku' is a Telugu comedy-crime film starring Mouli Tanuj Prasanth, Raghu Babu and Rajitha.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 11:10 AM IST", "pub_date_relative": "2h ago"}, {"title": "Could everything be broken? Grounded jets, Microsoft outage, AI chaos make some wonder - AP News", "full_content": "Could everything be broken? Grounded jets, Microsoft outage, AI chaos make some wonder AP News The Next Major Grounding Will Be Worse The Atlantic Experts explain no technology is 100% as another massive tech blackout hits KHON2 Do U.S. air traffic control and email blackouts after China AI espionage have a common answer? Fortune PODCAST: FAA issues ground stop, Nvidia and Microsoft latest, Pope returns home in Peru (Updated) Reuters", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 11:08 AM IST", "pub_date_relative": "2h ago"}, {"title": "One El Nino, India Can Handle. Two Could Break The Granary", "full_content": "India's grain stocks can absorb one bad year, but a second El Nino could drain the buffer in two to three years, economists say.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "Crypto news: Bitcoin price falls to $64,962, lowest since July as investors favour AI stocks, factor likely Fed hike", "full_content": "Bitcoin price today, 15 November 2026: The world's largest cryptocurrency slipped below the $65,000 level on Sunday, at its lowest since July, when Bitcoin slipped to $62,000 levels, according to data on CoinMarketCap.\n\nA number of factors, including concerns of AI attracting risk investors , fallout from the $6 billion Binance hack and expectations of the United States Federal Reserve hiking interest rates have impacted crypto and Binance prices.\n\nAt time of writing, Bitcoin was trading at $64,962.10, down 3.13% over the past 24 hours, with trading volume up a massive 30.73% to $50.58 billion and its market capitalisation slumped 3.16% to $1.3 trillion, it added.\n\nThe token's dominance in the overall crypto space, slipped marginally by 0.42% to comprise 59.4% of the market, followed by Ethereum , which was down 0.7% to hold 10.1% of the pie, and other token making up 30.5% of the total crypto market, up 1.13% at time of writing, data showed.\n\nThe cryptocurrency market cap has fallen to its lowest since January 2026, when it tanked to $2.04 trillion, standing now at $2.19 trillion, down 2.91% on 15 November, with 24-hour trading volume at $112.42 billion, as per CoinMarketCap data.\n\nTill trading on Friday, 13 November, crypto exchange-traded funds ( ETFs ) saw net outflow of more than $187 million, it added. The crypto fear and greed index was in the \u2018extreme fear\u2019 category at 12, close to the February 2026 level of 5.\n\nCryptocurrencies tumbled over the weekend, with Bitcoin slumping to a four-month low as leveraged long positions were liquidated, according to a Bloomberg report.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 10:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "Odisha Class 10 Board Exams 2027 to Begin on March 12; Check Timetable", "full_content": "Class 10 board exams will begin with the First Language paper on March 12, followed by General Science on March 15 and Maths on March 17", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:56 AM IST", "pub_date_relative": "2h ago"}, {"title": "Kisan Vikas Patra rules: Can you invest \u20b91 crore? Check the 7.5% rate, 115-month maturity and tax rules before investing", "full_content": "Are you an investor aiming to invest \u20b9 1 crore in a safe, predictable and easy-to-understand and manage government-backed savings scheme, without subjecting your entire portfolio to market-linked volatility?\n\nThen, Kisan Vikas Patra (KVP) can be a prudent investment scheme to consider, particularly if the objective is to conserve capital and generate a predictable return over the long term.\n\nFurthermore, before investing in a savings scheme , it is vital for aspiring investors to clearly understand and acknowledge the scheme's pros and cons, as well as its deposit limits, interest rates, maturity periods, basic eligibility, and withdrawal conditions.\n\nThe most important factor to clearly understand is that an aspiring investor can invest \u20b9 1 crore in the KVP scheme . This is because the scheme does not prescribe any maximum investment limit, either per account or across accounts held by an investor. With these core fundamentals in mind, let us now discuss the salient features and rules of the scheme as of 15 November 2026.\n\nNow it is essential to note that for the current quarter, i.e., the October to December 2026 quarter, KVP offers eligible investors 7.5% annual interest, compounded annually. This way, an investment in this scheme doubles in 115 months, i.e., about 9 years and 7 months. Therefore, \u20b9 1 crore invested this quarter is expected to grow to about \u20b9 2 crore at maturity, before taxes.\n\nThis is a decision that depends on individual investors , their current financial situation, family responsibilities and long-term objectives. Therefore, before locking in your funds in this scheme, you should conduct proper due diligence and seek guidance from a certified financial advisor. So that your investment decisions are aligned with your long-term financial objectives and guided by professional advice.\n\nFurthermore, the KVP scheme can be a prudent investment choice for investors who are seeking capital protection and predictable returns , such as senior citizens.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 10:56 AM IST", "pub_date_relative": "2h ago"}, {"title": "\u20b910,000 cr Upcoming IPOs: Latest GMP price, key dates | Crystal Crop Protection, Mahanadi Coalfields, Watrana Rentals", "full_content": "India\u2019s primary market is set to pick up pace after a relatively subdued fortnight, with the Diwali holiday period having temporarily slowed IPO activity. The upcoming week, beginning 16 November, will see three public issues worth more than Rs10,000 crore in combined proceeds enter the market, bringing fresh momentum to the IPO calendar. The lineup includes two mainboard offerings and one SME issue, led by the International Finance Corporation-backed agrochemicals and seeds company Crystal Crop Protection, the Coal India subsidiary Mahanadi Coalfields, and the SME player Watrana Rentals.\n\nThe revival comes amid continued investor interest in India's IPO market, which has seen companies across sectors tap the primary market to raise capital and provide exits to existing shareholders. The upcoming issues are expected to draw attention from investors tracking new listings, valuations and subscription trends.\n\nLet\u2019s take a closer look at each of these IPOs, covering the latest grey market premium (GMP), key dates, price bands and other important issue details.\n\nCrystal Crop Protection IPO GMP today is +27. This indicates Crystal Crop Protection share price was trading at a premium of \u20b9 27 in the grey market, according to investorgain.com.\n\nConsidering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Crystal Crop Protection share price was indicated at \u20b9 299 apiece, which is 9.93% higher than the IPO price of \u20b9 272.\n\nBased on trading activity over the last 3 sessions, today's IPO GMP trend is down, reflecting soft grey market demand. The premium has traded in the range of \u20b9 27 to \u20b9 40 over that period.\n\nCrystal Crop Protection IPO price band has been fixed at \u20b9 259\u2013272 per share, valuing it at approximately \u20b9 4,438 crore at the upper end of the price range.\n\nThe three-day Crystal Crop Protection IPO will open for subscription on 18 November and close on 20 November.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 10:50 AM IST", "pub_date_relative": "2h ago"}, {"title": "Hero Motors Q2 Results: Net Profit Surges 65%, Margin Expands", "full_content": "The company posted a consolidated bottom-line of Rs 18.2 crore, compared to 11 crore in the year-ago period.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:40 AM IST", "pub_date_relative": "2h ago"}, {"title": "'Holy Grail\u2019: Elon Musk\u2019s SpaceX Pulls Off Historic First-Ever Spaceship 'Catch\u2019 | Watch Video", "full_content": "The planned double recovery was partially successful: while the launch tower caught Starship, a propellant shortfall forced the Super Heavy booster to miss its catch and make a controlled touchdown in the Gulf of Mexico.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:36 AM IST", "pub_date_relative": "2h ago"}, {"title": "EU banking watchdog veers away from single deposit insurance scheme", "full_content": "Chair of European Banking Authority working on alternative ways to free up more cross-border lending", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "The long and winding road to Dubai\u2019s supermarket shelves", "full_content": "The United Arab Emirates\u2019 shipping woes stemming from Iran war stoke dreams of farming in the desert", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Brookfield and KKR vie over $700mn deal for Gulf retailer Eyewa", "full_content": "Private capital firms in advanced talks to acquire majority stake in eyewear chain after Middle East deal drought", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "South Africa vs Bangladesh 1st Test Live Streaming: When And Where To Watch SA vs BAN Match In India", "full_content": "The two sides will begin their World Test Championship campaign in the opening match of the series at The Wanderers Stadium.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Rs 1,000 Crore Box Office Club: Ramayana Earns Big, A Look At 11 Films To Achieve Worldwide Feat", "full_content": "'Ramayana' is now the third-fastest Indian movie to achieve this feat, after 'Pushpa 2' and 'Dhurandhar 2', both of which crossed the milestone in seven days.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:08 AM IST", "pub_date_relative": "3h ago"}, {"title": "FAA was warned for years about repair risks leading to nationwide ground stop - The Washington Post", "full_content": "FAA was warned for years about repair risks leading to nationwide ground stop The Washington Post What we know about the cause of the nationwide FAA ground stop CNN Sacramento airport travelers continue feeling effects of nationwide ground stop CBS News US aviation shutdown blamed on L3 Harris installed router Reuters Repair Of Old Copper Wiring Caused US Flight Disruption: Trump Admin Barron's", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 10:07 AM IST", "pub_date_relative": "3h ago"}, {"title": "CNG Gets Costlier In Mumbai, MMR From Nov 15 In Eighth Hike This Year: Check New Rates", "full_content": "MGL also highlighted that the price increase would partially offset higher input costs while ensuring uninterrupted CNG supplies.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:02 AM IST", "pub_date_relative": "3h ago"}, {"title": "Ashok Leyland Q2 Results: Profit Rises 12.7% To Rs 869 Crore, Dividend Declared; Check Record Date", "full_content": "Ashok Leyland Q2 Results: The multinational automobile manufacturer's revenue from operations in the second quarter of current fiscal rose 39.4% to Rs 13,364 crore, compared to Rs 9,588 crore in the year-ago period.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 09:54 AM IST", "pub_date_relative": "3h ago"}, {"title": "MCX, BSE, Bharti Airtel shares: Top 3 stocks to buy; check expected returns, ratings, target price by market expert", "full_content": "BSE BHARTIARTL Dhanya Nagasundaram Published 15 Nov 2026, 09:43 AM IST Prefer Livemint on Google Stock market news: The domestic benchmark indices, Sensex and Nifty 50, ended lower on Friday, snapping their three-session winning streak, as a sharp rise in retail inflation to 6.09% in October fuelled concerns over a possible RBI rate hike next month.\n\nThe 30-share BSE Sensex declined 318.56 points, or 0.39%, to close at 81,592.45. During the session, the index fell as much as 622.26 points, or 0.75%, to an intraday low of 81,288.75.\n\nThe Nifty 50 settled 155.05 points, or 0.61%, lower at 25,144.30.\n\nFriday's decline marked the first significant fall in both benchmark indices this month.\n\nChandan Taparia, Head of Derivatives & Technicals, Wealth Management at Motilal Oswal Financial Services, has recommended buying three stocks \u2014 MCX, BSE and Bharti Airtel.\n\nHe has set a target price of \u20b9 3,900 for MCX with a stop loss of \u20b9 3,600. For BSE, the target is \u20b9 4,170 with a stop loss of \u20b9 3,820, while Bharti Airtel has a target of \u20b9 2,230 and a stop loss of \u20b9 2,040.\n\nOn the Nifty options front, Chandan Taparia, said the maximum call OI is at 25,200 then 25,500 strike while maximum put OI is at 25,000 then 25,100 strike.\n\n\u201cCall writing is seen at 25,200 then 25,100 strike while put writing is seen at 25,100 then 25,000 strike. Option data suggests a broader trading range in between 24,800 to 25,600 zones while an immediate range between 25,000 to 25,400 levels,\u201d said Taparia.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 09:43 AM IST", "pub_date_relative": "3h ago"}, {"title": "5 money lessons from The Black Swan: The Impact of the Highly Improbable by Nassim Nicholas Taleb", "full_content": "Nassim Nicholas Taleb wrote The Black Swan to explain rare events. A Black Swan is unpredictable, has a huge impact and looks explainable afterwards. Google's rise and 9/11 are his examples. The book is not only about money. Still, it holds powerful lessons for anyone who saves or invests. Here are five.\n\nTaleb tells the story of a turkey. Every day, the turkey is fed. Each feeding makes it feel safer. Its confidence is highest just before Thanksgiving. Then the shock comes.\n\nTaleb says that past comfort can hide future danger. Do not assume your investments are safe simply because they rose over the years.\n\nMost risk measures use the bell curve. Taleb calls it a great intellectual fraud. It assumes that extreme events are almost impossible. But markets do not behave like that.\n\nHe notes that 10 days in 50 years accounted for half of the market's returns. Long-Term Capital Management trusted such models. It went bust in 1998. Do not trust one number called risk.\n\nTaleb separates two worlds. In Mediocristan, no single case changes the total. Height and weight belong here. In Extremistan, one case can dominate everything. Wealth, book sales and market moves belong here. Treat money matters as Extremistan.\n\nNassim Nicholas Taleb warns about businesses that earn small profits steadily. They hide rare, huge losses. In 1982, large American banks lost almost everything they had ever earned.\n\nYet, they called themselves conservative. Steady returns can be borrowed from destiny. Ask what could go wrong, not only what has gone right.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:40 AM IST", "pub_date_relative": "3h ago"}, {"title": "Market rally: What\u2019s fuelling gains and what are the risks?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIf the stock markets have been disappointing you over the past two years, the past few days may have come as a pleasant surprise. The Nifty and the Sensex have gained 9.1% and 9.58% in November thus far (as of 13 November), giving investors a reason to smile again and also driving home a basic stock market lesson.\n\nMarkets go through both good and difficult phases, and the best way to tide over market vagaries is through asset allocation. In the case of the recent rebound, the rally was triggered by a combination of factors, but there are also some risks still lurking that investors should be watchful of.\n\n\u201cA combination of factors seems to be favouring India right now. India-specific, the economy is healthy and corporate earnings in H1FY27 reflect good growth. On the macro front, there now seems to be a slowdown in the AI trade, which is positive for India, and the talks of de-escalation in the US-Iran, which has helped in cooling crude prices, a positive for India\u2019s BoP (balance of payments) and the currency,\u201d said Krishna Sanghavi, chief investment officer-equities, Mahindra Manulife Mutual Fund.\n\n\u201cThe trajectory of India's corporate earnings has been positive and resilient. Six quarters ago, earnings growth for the NSE 500 (ex-commodities) was about 7% over the previous year. It then rose to 9-10%, and reached 18% in the June quarter and 22% in the September quarter,\" pointed out Neelesh Surana, chief investment officer, Mirae Asset Mutual Fund.\n\nEarnings growth has made valuations look more reasonable, according to Harsha Upadhyaya, chief investment officer, Kotak Mutual Fund. \u201cWhile the headline indices have largely been range-bound over the last two years, the earnings have improved, making valuations look more reasonable.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:36 AM IST", "pub_date_relative": "3h ago"}, {"title": "Bangladesh Tour Of South Africa 2026 Schedule: Full Fixtures, Dates, Venues And Match Timings", "full_content": "Bangladesh will play two Tests, three ODIs and three T20Is during their tour of South Africa, which begins on November 15.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 09:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "8th Pay Commission pension: Check how \u20b925,000 to \u20b975,000 basic pensions may change at 2.1, 2.57 and 2.75 fitment factors", "full_content": "The 8th Pay Commission was constituted on 3 November 2025. As of today, the 3-member temporary panel headed by Justice Ranjana Prakash Desai has completed more than 12 months, with about 6 more months to go before the panel tables its final report before the central government, as per the Terms of Reference (ToR) of the 8th Pay Commission.\n\nThe decision made by the 8th Pay Commission is going to be closely tracked and monitored by eligible unions, associations, serving central government employees and pensioners. Particularly, by those who are covered under the Old Pension Scheme (OPS). This is because several prominent pensioners\u2019 organisations have submitted proposals and views seeking constructive and meaningful changes in pensions for retired central government employees.\n\nThe core aim behind these demands is to try to improve the livelihoods of pensioners, seek higher pensions for them, and focus on ways to improve family pensions and parity between existing and future retirees.\n\nStill, the fundamental question remains: how much could the existing pensions increase if the 8th Pay Commission panel considers fitment factors of 2.1, 2.57 or 2.75? This write-up discusses illustrative calculations for basic pensions running from \u20b9 25,000 to \u20b9 75,000.\n\nIn accordance with the existing pension framework, all eligible central government employees under the OPS are generally eligible to receive a basic pension calculated at 50% of their last-drawn emoluments or average emoluments of the last 10 months, whichever is more, subject to the applicable rules and regulations.\n\nFor example, an employee retiring with a last drawn basic salary of \u20b9 1,00,000, might receive a basic pension of \u20b9 50,000. Similarly, if an employee retires with a last drawn basic salary of \u20b9 40,000, they might end up receiving a basic pension of \u20b9 20,000.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:06 AM IST", "pub_date_relative": "4h ago"}, {"title": "Gold, silver prices today, 15 November: Check retail rates of 24K, 22K, 18K gold, 999 silver in Delhi, Mumbai, Bangalore", "full_content": "Gold, silver prices today, 15 November: Spot gold prices slumped by 4.5% this week \u2014 the most since June, while silver, platinum and palladium also looked on the way toward weekly declines, according to a Reuters report.\n\nGold prices have taken a hit during the week amid concern from investors that the United States Federal Reserve (Fed) seems poised to hike interest rates and higher oil prices could push inflation, Bloomberg reported.\n\nSpot gold moved up 0.1% at $3,879.71 per ounce as of 1905 GMT, after briefly touching a session high of $3,922.97 when the US Producer Price Index ( PPI ) data came out, the Reuters report stated. US gold futures for December delivery settled largely unchanged at $3,886.30/oz, it added.\n\nFurther, spot silver fell 1.9% to $49.05/oz, platinum fell 1.9% to $1,490.06, while palladium climbed 1.1% to $1,004.40, the report said, noting that all three metals were also on course to post losses for the week.\n\nAt the time of writing on 15 November, gold bullion was trading at \u20b9 1,37,320 per 10 grams, while Silver was at \u20b9 1,77,280 per kg, data on the bullion website showed.\n\nHere are gold and silver rates in key Indian cities on Sunday. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bengaluru, Chennai, Coimbatore, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 15 November, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,37,070 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,25,648 per 10 grams. On the other hand, the 18-karat gold rate in Mumbai was \u20b9 1,02,803 per 10 grams.\n\nThe silver price in Mumbai today, 15 November, was in line with the overall silver rates in India. The price of Silver 999 Fine in Mumbai was \u20b9 1,76,960 per kg.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:04 AM IST", "pub_date_relative": "4h ago"}, {"title": "Jailer 2 Vs Scene Vs Mookuthi Amman 2: How The Three Films Performing At Box Office? Check Day-Wise Earnings", "full_content": "All three films witnessed a rise in collections on November 14. 'Jailer 2' took its India net total to Rs 474.29 crore on Day 31, while 'Scene' and 'Mookuthi Amman 2' reached Rs 127.20 crore and Rs 19.25 crore, respectively, in nine days.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 08:42 AM IST", "pub_date_relative": "4h ago"}, {"title": "Toxic Air Toll: Pollution-Linked Health Insurance Claims Jump 4.3x In Three Years, Delhi Tops List", "full_content": "Delhi topped the list with 8,093 pollution-linked cases, ahead of Pune, Bengaluru, Mumbai, and Hyderabad. Heart disease led at 43.5%, followed by other respiratory illness.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 08:40 AM IST", "pub_date_relative": "4h ago"}, {"title": "Top 3 stocks to buy: Redington, Aster DM, Canara Bank by Ganesh Dongre of Anand Rathi | Targets, stop-loss, market view", "full_content": "REDINGTON Asit Manohar Published 15 Nov 2026, 08:31 AM IST Prefer Livemint on Google Stocks to buy | Shares to buy | Ganesh Dongre's stock recommendations: The key benchmark indices of the Indian stock market ended the week on a strong positive note, with the Nifty gaining nearly 0.45% to close at 25,144, while the Bank Nifty witnessed a sharp rally of 3.30%, settling at 61,034. Meanwhile, Brent crude oil prices declined towards $95 per barrel, providing significant relief to global markets. Sectoral performance remained broadly positive, with most major sectors gaining between 1% and 5%. Banking and chemicals emerged as the top-performing sectors, rallying nearly 4% during the week.\n\nOver the previous two weeks, the Nifty had witnessed a sharp recovery of more than 10%, supported by strong buying interest at lower levels. The index rebounded from the 22,200\u201322,500 support zone, recovered towards its 200-day moving average and subsequently moved above the crucial psychological mark of 25,000. The recovery gained further momentum as the Nifty surpassed its previous monthly high of 24,700 and approached its February 2026 high, indicating a significant improvement in market sentiment.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi believes the Indian stock market bias is positive untill the Nifty 50 index is above the psychological 25,000 levels. Ganesh Dongre of Anand Rathi said that 25,500\u201325,600 zone for the 50-stock index will be the next significant resistance area to watch.\n\nGanesh Dongre of Anand Rathi said the Nifty 50 index appears to be discounting the possibility of a gradual slowdown in geopolitical tensions following the US midterm election results, particularly after President Trump's party suffered electoral setbacks. Any potential de-escalation in the ongoing conflict could further ease crude oil prices, potentially pushing Brent crude towards its previous monthly lows.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 08:31 AM IST", "pub_date_relative": "4h ago"}, {"title": "Nationwide ground stop followed contractor upgrade to L3Harris telecommunication system: DOT\u2019s Duffy", "full_content": "The longest halt in flight departures to U.S. airports since 9/11 came after updates to a telecommunications system managed by contractor L3Harris Technologies , Transportation Secretary Sean Duffy said Saturday, as hundreds of thousands of travelers were stranded by lingering disruptions.\n\nThere was \"zero evidence\" that the problem was caused by something \"nefarious\" or anything related to artificial intelligence, Bryan Bedford, the head of the Federal Aviation Administration, said at a press conference with Duffy.\n\nThe upgrades at \"at least\" one remote location were part of ongoing work of switching from a copper wire system to fiber, Duffy said.\n\nA router had \"flooded\" other routers in the air traffic control system with over 1,000 connection attempts roughly every five seconds, the secretary said, creating problems with airplane communications and radar feeds.\n\nThe outage again thrust aging infrastructure that underpins U.S. air traffic control into the spotlight, along with the country's struggles to replace sections of it while operating the world's busiest airspace.\n\n\"What we're working to determine was whether we had incompetence, meaning was it user error, installator error from L3 Harris, or did they install a faulty router,\" he said.\n\nL3Harris said it is \"supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel.\"\n\nL3Harris said it has completed more than 70% of the switch from copper wiring to fiber-optic system.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 08:23 AM IST", "pub_date_relative": "5h ago"}, {"title": "IRS raises 401(k) contribution limit by $1,000 for 2027 as retirement savings caps increase - Fox Business", "full_content": "IRS raises 401(k) contribution limit by $1,000 for 2027 as retirement savings caps increase Fox Business IRS announces 2027 401(k) contribution limits, raises savings cap: What it means for your money CNBC Inflation adjustments to retirement account limits issued for 2027 Journal of Accountancy IRS announces 401(k), IRA contribution limits for 2027 NewsNation 401(k) Limits Are Rising for 2027. Which Savings Goals Come First? Barron's", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 08:02 AM IST", "pub_date_relative": "5h ago"}, {"title": "Nvidia Earnings To Anthropic IPO: Nasdaq Faces Two-Headed AI Stress Test After Best Week Since August", "full_content": "Nvidia shares faced a steep selloff last week triggered by controversies surrounding long-time CEO Jensen Huang's two affairs (one involving a suspected Chinese spy); despite this, many AI-linked stocks steadied in recent days.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 07:59 AM IST", "pub_date_relative": "5h ago"}, {"title": "One Router, Over 9,000 Canceled Flights: How An L3Harris Upgrade Paralyzed US Aviation", "full_content": "A faulty L3Harris router installed during FAA maintenance overloaded air traffic control centres, causing over 15,350 flight cancellations and 14,800 delays across major US airlines over two days.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 07:38 AM IST", "pub_date_relative": "5h ago"}, {"title": "Bank holidays next week: SBI, HDFC, ICICI branches to closed on three days from 16-22 November? Check RBI calendar", "full_content": "Bank holiday next week: Public and private sector lenders, including the State Bank of India and HDFC Bank will be closed for three days from 16-22November, according to the Reserve Bank of India's holiday calendar.\n\nAs per RBI rules, all scheduled and non-scheduled banks observe listed holidays and mandatory closure on second and fourth Saturdays and every Sunday in a month. In-branch services are shut, but digital services (online net banking, app) will remain operational.\n\nNotably, banks in India are closed for common national and gazetted holidays, weekend offs and local holidays and festivals off, as required. The central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks will be closed on 16 days this month, including state and regional holidays and weekend offs. This includes weekend offs on November 1, 8, 15, 22, 28, and 29 for Sunday; and November 14 and 28 for second and fourth Saturday holidays, respectively. Besides these are regional holidays on November 9, 10, 11, 13, 16, 20, 23, 24 and 27.\n\nNovember 16 (Monday): Banks will be closed in Patna and Ranchi on account of Chhath Puja .\n\nNovember 20 (Friday): Banks will be closed in Dehradun to observe Igas-Bagwal.\n\nNovember 22 (Sunday): Banks will be closed pan India for Sunday holiday.\n\nFor customers who face urgent requirements or for daily spends, online banking services and bank mobile apps remain operational across the country even on official holidays and the weekends. You can thus use these uninterrupted services for convenient financial transactions.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 07:38 AM IST", "pub_date_relative": "5h ago"}], "cfa": [{"title": "Small finance banks offer up to 8.25% FD interest: Compare Suryoday, Ujjivan and Utkarsh rates with large banks", "full_content": "Fixed deposits (FDs) remain a popular choice among investors seeking predictable returns and relatively low-risk savings options. The significance of this asset class increases even more in the current financial environment of immense volatility, driven by the ongoing US-Iran war, which has disrupted energy markets and resulted in weak returns in emerging-market equities.\n\nStill, while aiming to lock your investments in fixed deposits (FDs) , limiting your search to large financial institutions and banks such as SBI, HDFC Bank, and ICICI Bank could mean missing out on higher interest rates offered by other prominent small finance banks.\n\nFurthermore, as of 15 November 2026, 3 prominent small finance banks are offering FD interest rates of up to 8.25% per annum for general investors and even higher rates for senior citizens , according to data compiled by Paisabazaar. The complete details of the same are discussed below:\n\nDo note that the above-discussed rates apply to specific deposit tenures. Aspiring investors should carefully review the applicable rates, tenures, and conditions on the lending institution's official website before investing in any deposit.\n\nLarge banks generally offer lower FD rates. Kotak Mahindra Bank offers up to 6.8%, while HDFC Bank and Axis Bank offer up to 6.6%. ICICI Bank offers up to 6.55%.\n\nNow, it is important to note that large banks generally offer investors lower FD rates. For example, Kotak Mahindra Bank is offering up to 6.80% interest rate for tenures of 2 to less than 3 years. Similarly, HDFC Bank and Axis Bank offer up to 6.60% on specific tenures. ICICI Bank offers up to 6.60% for tenures of 3 years 1 day to 10 years.\n\nFurthermore, among public sector banks, Bank of India offers 6.85% on its special 500-day FD, while SBI offers up to 6.45% on select tenures.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 12:46 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ABB India shares 36% up in 2026: Time to buy? Rating upgrade boost and target price hike by Motilal Oswal - Details here", "full_content": "Dhanya Nagasundaram Published 15 Nov 2026, 12:39 PM IST Prefer Livemint on Google ABB India shares will be in focus on Monday, 16 November, after the electrification and automation major reported its September quarter results and received a rating upgrade from Motilal Oswal Financial Services. The brokerage has upgraded the stock to 'Buy' from 'Neutral', citing improving order inflows, revenue growth prospects and a recovery in margins. It has also raised its target price to \u20b9 8,200 from its earlier estimate, implying an upside potential of around 16% from Friday's closing price.\n\nThe positive brokerage outlook comes even as the stock has witnessed some volatility in recent months. ABB India's Q3 CY26 performance, marked by record quarterly orders and a robust order backlog, has strengthened expectations of improved execution and earnings growth over the coming quarters.\n\nABB India reported an 11% year-on-year increase in net profit to \u20b9 440 crore for the September quarter, compared with \u20b9 398 crore in the corresponding period last year.\n\nRevenue from operations rose 19.4% to \u20b9 3,738 crore from \u20b9 3,130 crore a year earlier, supported by stronger business activity and demand across key industrial segments.\n\nThe company recorded total order inflows of \u20b9 4,733 crore in Q3 CY26, registering a sharp 56% year-on-year increase and marking its highest-ever quarterly order intake. Its order backlog stood at \u20b9 12,927 crore at the end of September, up 36% from the year-ago period, providing revenue visibility for the coming quarters.\n\nElectrification was the key growth driver, with orders increasing across segments.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 12:39 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold rate in this UP city sees major crash; price plunges over \u20b96,611 in just 3 days, slips below \u20b91.36 lakh mark", "full_content": "Gold price in Meerut today, 15 November: Price of the yellow metal slumped \u20b9 6,611 per 10 grams over the past three days in Meerut, as per India Bullion and Jewellers Association (IBJA), local publication Amar Ujala reported. Price of 24-carat gold in the Uttar Pradesh city reached \u20b9 1,35,809/10 grams on Saturday, it added.\n\nSpot gold price globally has crashed by 4.5% this week \u2014 the most since June, amid investor concern that the United States Federal Reserve could hike interest rates and higher oil prices could push inflation, Bloomberg reported.\n\nSpot gold moved up 0.1% at $3,879.71 per ounce as of 1905 GMT, after briefly touching a session high of $3,922.97 when the US Producer Price Index (PPI) data came out, according to Reuters. US gold futures for December delivery settled largely unchanged at $3,886.30/oz, it added.\n\nAccording to the report, gold prices in Meerut fell below the \u20b9 1.36 lakh/10 gm mark after nearly eight months. It was last recorded at \u20b9 1,35,141/10 gm in March. Over the last three days, the precious metal lost \u20b9 6,611 to reach \u20b9 1,35,809/10 gm, according to IBJA data, it added.\n\nAt the time of writing on 15 November, 24K gold bullion was trading at \u20b9 1,37,320 per 10 grams, while 999 fine silver was at \u20b9 1,77,280 per kg, data on the bullion website showed.\n\nFor Meerut, the website showed, 24K gold bullion trading at \u20b9 1,37,100/10 gm, while 999 fine silver was at \u20b9 1,77,000/kg. Further, 22K gold was trading at \u20b9 1,25,675/10 gm on 15 November, and 18K gold was trading at \u20b9 1,02,825 on Sunday.\n\nHere are gold and silver rates in key Indian cities on Sunday. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Bengaluru, Chennai, Delhi, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 15 November, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,37,070 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,25,648 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 12:31 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tata Motors shares: 22% down in 2026, right time to buy famous auto stock? What brokerages say after loss narrows in Q2", "full_content": "VALUE BSE ALPHA Dhanya Nagasundaram Published 15 Nov 2026, 11:56 AM IST Prefer Livemint on Google Tata Motors Passenger Vehicles Ltd (TMPVL) shares will be in focus on Monday, 16 November, after the automaker reported its September quarter results, with a sharp increase in revenue and a narrowing of operational pressures but a substantial consolidated loss due to exceptional charges.\n\nThe stock has declined nearly 22% so far in 2026, raising the question of whether the recent correction offers investors an opportunity to accumulate the auto stock. However, brokerages remain divided on its prospects, with Motilal Oswal Financial Services reiterating its 'Sell' rating and setting a target price of \u20b9 240, while Nuvama Institutional Equities has maintained its 'Buy' rating, albeit with a reduced target price of \u20b9 360 from \u20b9 450.\n\nTMPVL reported a consolidated net loss of \u20b9 5,531 crore for Q2 FY27, compared with a profit of \u20b9 76,170 crore in the corresponding quarter last year. The loss included exceptional items worth \u20b9 6,738 crore, primarily comprising employee separation costs of \u20b9 3,776 crore and asset impairment charges of \u20b9 2,856 crore.\n\nDespite the reported loss, consolidated revenue from operations rose 34% year-on-year to \u20b9 96,920 crore. EBITDA margin improved by 630 basis points to 6.2% during the quarter.\n\nThe company's luxury brand Jaguar Land Rover (JLR) reported exceptional items of \u00a3530 million, largely linked to restructuring, employee separation costs and the write-down of intangible assets under development.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bouma Box Office Collection Day 3: Rejin S Babu's Gothic Thriller Sees 59% Jump In Earnings", "full_content": "Written and directed by Rejin S. Babu, the Malayalam mystery-horror thriller 'Bouma' was released in theatres on November 12, 2026.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 11:51 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Could Budapest be the next digital nomad hotspot?", "full_content": "When mechanical engineering graduate and entrepreneur Lexi Vindisch wanted to run her business from a remote location, she didn't pick a town in North America where she lived. Instead, Budapest was top of her list.\n\nWith its mix of grand sights, caf\u00e9s, cultural events and inexpensive public transportation, the Hungarian capital has become a popular place for digital nomads \u2014 people embracing the \"work from anywhere\" trend that took off during the Covid-19 pandemic.\n\nBased at co-working space Create26 in Budapest, Vindisch runs a domestic cleaning company based in Victoria, Canada, as well as overseeing Lead Machine, a marketing software firm for home service businesses.\n\nHungary ranked fifth for digital nomads on a 2025 list of countries, behind Spain, the United Arab Emirates, Montenegro and the Bahamas. The index, compiled by visa information website VisaGuide, considered factors such as taxes, income and cost of living.\n\nVindisch, who has worked in many European and North American cities, but has Hungarian roots, said Budapest feels different. \"I've been in locales that are super beautiful, well organized, great facilities, but they lacked a personality ... I've never been able to replicate the feeling that Budapest holds anywhere else,\" she said.\n\nEU citizens can work remotely from Hungary long-term if they meet certain requirements, while Hungary's White Card scheme, which provides one- or two-year residency permits for digital nomads from outside the EU, requires a net monthly income of at least 3,000 euros ($3,370).\n\nThere are around 35 co-working spots in central Budapest, according to the Coworking Hungary Association, several of which are in the bustling District VI, near the fashionable bars and restaurants of the Jewish Quarter.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Kamarajar Port picks SBI Capital, IDBI Capital and ICICI Securities for IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nChennai-based Kamarajar Port Ltd has picked three investment banks for an initial public offering (IPO) that would make it India's first listed state-backed port.\n\nThe country's first corporate major port has hired SBI Capital Markets Ltd, IDBI Capital Markets & Securities Ltd, and ICICI Securities Ltd as the book-running lead managers for the offer, two people aware of the development told Mint .\n\nThe IPO is likely to include an offer for sale of about \u20b9 1,200 crore, while a fresh issue could be decided at a later stage, a document issued by the port earlier in September showed.\n\nValuation discussions are still some time away, but the IPO is likely to be completed within calendar 2027, Mint has learnt.\n\nEmails sent to Kamarajar Port, SBI Capital, IDBI Capital and ICICI Securities on 14 November did not elicit responses until press time.\n\nMint had reported on 13 September that the Chennai Port Authority , which wholly owns Kamarajar Port, had begun the process of seeking up to three bookrunning lead managers to structure and manage the issue.\n\nIndia's public markets currently have three listed port entities: Adani Ports and Special Economic Zone Ltd (APSEZ), JSW Infrastructure Ltd and APM Terminals-backed Gujarat Pipavav Port Ltd. A successful IPO would make Kamarajar the only listed state-backed port in the country.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Crypto news: Bitcoin price falls to $64,962, lowest since July as investors favour AI stocks, factor likely Fed hike", "full_content": "Bitcoin price today, 15 November 2026: The world's largest cryptocurrency slipped below the $65,000 level on Sunday, at its lowest since July, when Bitcoin slipped to $62,000 levels, according to data on CoinMarketCap.\n\nA number of factors, including concerns of AI attracting risk investors , fallout from the $6 billion Binance hack and expectations of the United States Federal Reserve hiking interest rates have impacted crypto and Binance prices.\n\nAt time of writing, Bitcoin was trading at $64,962.10, down 3.13% over the past 24 hours, with trading volume up a massive 30.73% to $50.58 billion and its market capitalisation slumped 3.16% to $1.3 trillion, it added.\n\nThe token's dominance in the overall crypto space, slipped marginally by 0.42% to comprise 59.4% of the market, followed by Ethereum , which was down 0.7% to hold 10.1% of the pie, and other token making up 30.5% of the total crypto market, up 1.13% at time of writing, data showed.\n\nThe cryptocurrency market cap has fallen to its lowest since January 2026, when it tanked to $2.04 trillion, standing now at $2.19 trillion, down 2.91% on 15 November, with 24-hour trading volume at $112.42 billion, as per CoinMarketCap data.\n\nTill trading on Friday, 13 November, crypto exchange-traded funds ( ETFs ) saw net outflow of more than $187 million, it added. The crypto fear and greed index was in the \u2018extreme fear\u2019 category at 12, close to the February 2026 level of 5.\n\nCryptocurrencies tumbled over the weekend, with Bitcoin slumping to a four-month low as leveraged long positions were liquidated, according to a Bloomberg report.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 10:59 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kisan Vikas Patra rules: Can you invest \u20b91 crore? Check the 7.5% rate, 115-month maturity and tax rules before investing", "full_content": "Are you an investor aiming to invest \u20b9 1 crore in a safe, predictable and easy-to-understand and manage government-backed savings scheme, without subjecting your entire portfolio to market-linked volatility?\n\nThen, Kisan Vikas Patra (KVP) can be a prudent investment scheme to consider, particularly if the objective is to conserve capital and generate a predictable return over the long term.\n\nFurthermore, before investing in a savings scheme , it is vital for aspiring investors to clearly understand and acknowledge the scheme's pros and cons, as well as its deposit limits, interest rates, maturity periods, basic eligibility, and withdrawal conditions.\n\nThe most important factor to clearly understand is that an aspiring investor can invest \u20b9 1 crore in the KVP scheme . This is because the scheme does not prescribe any maximum investment limit, either per account or across accounts held by an investor. With these core fundamentals in mind, let us now discuss the salient features and rules of the scheme as of 15 November 2026.\n\nNow it is essential to note that for the current quarter, i.e., the October to December 2026 quarter, KVP offers eligible investors 7.5% annual interest, compounded annually. This way, an investment in this scheme doubles in 115 months, i.e., about 9 years and 7 months. Therefore, \u20b9 1 crore invested this quarter is expected to grow to about \u20b9 2 crore at maturity, before taxes.\n\nThis is a decision that depends on individual investors , their current financial situation, family responsibilities and long-term objectives. Therefore, before locking in your funds in this scheme, you should conduct proper due diligence and seek guidance from a certified financial advisor. So that your investment decisions are aligned with your long-term financial objectives and guided by professional advice.\n\nFurthermore, the KVP scheme can be a prudent investment choice for investors who are seeking capital protection and predictable returns , such as senior citizens.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 10:56 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u20b910,000 cr Upcoming IPOs: Latest GMP price, key dates | Crystal Crop Protection, Mahanadi Coalfields, Watrana Rentals", "full_content": "India\u2019s primary market is set to pick up pace after a relatively subdued fortnight, with the Diwali holiday period having temporarily slowed IPO activity. The upcoming week, beginning 16 November, will see three public issues worth more than Rs10,000 crore in combined proceeds enter the market, bringing fresh momentum to the IPO calendar. The lineup includes two mainboard offerings and one SME issue, led by the International Finance Corporation-backed agrochemicals and seeds company Crystal Crop Protection, the Coal India subsidiary Mahanadi Coalfields, and the SME player Watrana Rentals.\n\nThe revival comes amid continued investor interest in India's IPO market, which has seen companies across sectors tap the primary market to raise capital and provide exits to existing shareholders. The upcoming issues are expected to draw attention from investors tracking new listings, valuations and subscription trends.\n\nLet\u2019s take a closer look at each of these IPOs, covering the latest grey market premium (GMP), key dates, price bands and other important issue details.\n\nCrystal Crop Protection IPO GMP today is +27. This indicates Crystal Crop Protection share price was trading at a premium of \u20b9 27 in the grey market, according to investorgain.com.\n\nConsidering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Crystal Crop Protection share price was indicated at \u20b9 299 apiece, which is 9.93% higher than the IPO price of \u20b9 272.\n\nBased on trading activity over the last 3 sessions, today's IPO GMP trend is down, reflecting soft grey market demand. The premium has traded in the range of \u20b9 27 to \u20b9 40 over that period.\n\nCrystal Crop Protection IPO price band has been fixed at \u20b9 259\u2013272 per share, valuing it at approximately \u20b9 4,438 crore at the upper end of the price range.\n\nThe three-day Crystal Crop Protection IPO will open for subscription on 18 November and close on 20 November.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 10:50 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Hero Motors Q2 Results: Net Profit Surges 65%, Margin Expands", "full_content": "The company posted a consolidated bottom-line of Rs 18.2 crore, compared to 11 crore in the year-ago period.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:40 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "South Africa vs Bangladesh 1st Test Live Streaming: When And Where To Watch SA vs BAN Match In India", "full_content": "The two sides will begin their World Test Championship campaign in the opening match of the series at The Wanderers Stadium.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Ashok Leyland Q2 Results: Profit Rises 12.7% To Rs 869 Crore, Dividend Declared; Check Record Date", "full_content": "Ashok Leyland Q2 Results: The multinational automobile manufacturer's revenue from operations in the second quarter of current fiscal rose 39.4% to Rs 13,364 crore, compared to Rs 9,588 crore in the year-ago period.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 09:54 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MCX, BSE, Bharti Airtel shares: Top 3 stocks to buy; check expected returns, ratings, target price by market expert", "full_content": "BSE BHARTIARTL Dhanya Nagasundaram Published 15 Nov 2026, 09:43 AM IST Prefer Livemint on Google Stock market news: The domestic benchmark indices, Sensex and Nifty 50, ended lower on Friday, snapping their three-session winning streak, as a sharp rise in retail inflation to 6.09% in October fuelled concerns over a possible RBI rate hike next month.\n\nThe 30-share BSE Sensex declined 318.56 points, or 0.39%, to close at 81,592.45. During the session, the index fell as much as 622.26 points, or 0.75%, to an intraday low of 81,288.75.\n\nThe Nifty 50 settled 155.05 points, or 0.61%, lower at 25,144.30.\n\nFriday's decline marked the first significant fall in both benchmark indices this month.\n\nChandan Taparia, Head of Derivatives & Technicals, Wealth Management at Motilal Oswal Financial Services, has recommended buying three stocks \u2014 MCX, BSE and Bharti Airtel.\n\nHe has set a target price of \u20b9 3,900 for MCX with a stop loss of \u20b9 3,600. For BSE, the target is \u20b9 4,170 with a stop loss of \u20b9 3,820, while Bharti Airtel has a target of \u20b9 2,230 and a stop loss of \u20b9 2,040.\n\nOn the Nifty options front, Chandan Taparia, said the maximum call OI is at 25,200 then 25,500 strike while maximum put OI is at 25,000 then 25,100 strike.\n\n\u201cCall writing is seen at 25,200 then 25,100 strike while put writing is seen at 25,100 then 25,000 strike. Option data suggests a broader trading range in between 24,800 to 25,600 zones while an immediate range between 25,000 to 25,400 levels,\u201d said Taparia.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 09:43 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "5 money lessons from The Black Swan: The Impact of the Highly Improbable by Nassim Nicholas Taleb", "full_content": "Nassim Nicholas Taleb wrote The Black Swan to explain rare events. A Black Swan is unpredictable, has a huge impact and looks explainable afterwards. Google's rise and 9/11 are his examples. The book is not only about money. Still, it holds powerful lessons for anyone who saves or invests. Here are five.\n\nTaleb tells the story of a turkey. Every day, the turkey is fed. Each feeding makes it feel safer. Its confidence is highest just before Thanksgiving. Then the shock comes.\n\nTaleb says that past comfort can hide future danger. Do not assume your investments are safe simply because they rose over the years.\n\nMost risk measures use the bell curve. Taleb calls it a great intellectual fraud. It assumes that extreme events are almost impossible. But markets do not behave like that.\n\nHe notes that 10 days in 50 years accounted for half of the market's returns. Long-Term Capital Management trusted such models. It went bust in 1998. Do not trust one number called risk.\n\nTaleb separates two worlds. In Mediocristan, no single case changes the total. Height and weight belong here. In Extremistan, one case can dominate everything. Wealth, book sales and market moves belong here. Treat money matters as Extremistan.\n\nNassim Nicholas Taleb warns about businesses that earn small profits steadily. They hide rare, huge losses. In 1982, large American banks lost almost everything they had ever earned.\n\nYet, they called themselves conservative. Steady returns can be borrowed from destiny. Ask what could go wrong, not only what has gone right.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:40 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Market rally: What\u2019s fuelling gains and what are the risks?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIf the stock markets have been disappointing you over the past two years, the past few days may have come as a pleasant surprise. The Nifty and the Sensex have gained 9.1% and 9.58% in November thus far (as of 13 November), giving investors a reason to smile again and also driving home a basic stock market lesson.\n\nMarkets go through both good and difficult phases, and the best way to tide over market vagaries is through asset allocation. In the case of the recent rebound, the rally was triggered by a combination of factors, but there are also some risks still lurking that investors should be watchful of.\n\n\u201cA combination of factors seems to be favouring India right now. India-specific, the economy is healthy and corporate earnings in H1FY27 reflect good growth. On the macro front, there now seems to be a slowdown in the AI trade, which is positive for India, and the talks of de-escalation in the US-Iran, which has helped in cooling crude prices, a positive for India\u2019s BoP (balance of payments) and the currency,\u201d said Krishna Sanghavi, chief investment officer-equities, Mahindra Manulife Mutual Fund.\n\n\u201cThe trajectory of India's corporate earnings has been positive and resilient. Six quarters ago, earnings growth for the NSE 500 (ex-commodities) was about 7% over the previous year. It then rose to 9-10%, and reached 18% in the June quarter and 22% in the September quarter,\" pointed out Neelesh Surana, chief investment officer, Mirae Asset Mutual Fund.\n\nEarnings growth has made valuations look more reasonable, according to Harsha Upadhyaya, chief investment officer, Kotak Mutual Fund. \u201cWhile the headline indices have largely been range-bound over the last two years, the earnings have improved, making valuations look more reasonable.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:36 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "8th Pay Commission pension: Check how \u20b925,000 to \u20b975,000 basic pensions may change at 2.1, 2.57 and 2.75 fitment factors", "full_content": "The 8th Pay Commission was constituted on 3 November 2025. As of today, the 3-member temporary panel headed by Justice Ranjana Prakash Desai has completed more than 12 months, with about 6 more months to go before the panel tables its final report before the central government, as per the Terms of Reference (ToR) of the 8th Pay Commission.\n\nThe decision made by the 8th Pay Commission is going to be closely tracked and monitored by eligible unions, associations, serving central government employees and pensioners. Particularly, by those who are covered under the Old Pension Scheme (OPS). This is because several prominent pensioners\u2019 organisations have submitted proposals and views seeking constructive and meaningful changes in pensions for retired central government employees.\n\nThe core aim behind these demands is to try to improve the livelihoods of pensioners, seek higher pensions for them, and focus on ways to improve family pensions and parity between existing and future retirees.\n\nStill, the fundamental question remains: how much could the existing pensions increase if the 8th Pay Commission panel considers fitment factors of 2.1, 2.57 or 2.75? This write-up discusses illustrative calculations for basic pensions running from \u20b9 25,000 to \u20b9 75,000.\n\nIn accordance with the existing pension framework, all eligible central government employees under the OPS are generally eligible to receive a basic pension calculated at 50% of their last-drawn emoluments or average emoluments of the last 10 months, whichever is more, subject to the applicable rules and regulations.\n\nFor example, an employee retiring with a last drawn basic salary of \u20b9 1,00,000, might receive a basic pension of \u20b9 50,000. Similarly, if an employee retires with a last drawn basic salary of \u20b9 40,000, they might end up receiving a basic pension of \u20b9 20,000.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:06 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Gold, silver prices today, 15 November: Check retail rates of 24K, 22K, 18K gold, 999 silver in Delhi, Mumbai, Bangalore", "full_content": "Gold, silver prices today, 15 November: Spot gold prices slumped by 4.5% this week \u2014 the most since June, while silver, platinum and palladium also looked on the way toward weekly declines, according to a Reuters report.\n\nGold prices have taken a hit during the week amid concern from investors that the United States Federal Reserve (Fed) seems poised to hike interest rates and higher oil prices could push inflation, Bloomberg reported.\n\nSpot gold moved up 0.1% at $3,879.71 per ounce as of 1905 GMT, after briefly touching a session high of $3,922.97 when the US Producer Price Index ( PPI ) data came out, the Reuters report stated. US gold futures for December delivery settled largely unchanged at $3,886.30/oz, it added.\n\nFurther, spot silver fell 1.9% to $49.05/oz, platinum fell 1.9% to $1,490.06, while palladium climbed 1.1% to $1,004.40, the report said, noting that all three metals were also on course to post losses for the week.\n\nAt the time of writing on 15 November, gold bullion was trading at \u20b9 1,37,320 per 10 grams, while Silver was at \u20b9 1,77,280 per kg, data on the bullion website showed.\n\nHere are gold and silver rates in key Indian cities on Sunday. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bengaluru, Chennai, Coimbatore, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 15 November, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,37,070 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,25,648 per 10 grams. On the other hand, the 18-karat gold rate in Mumbai was \u20b9 1,02,803 per 10 grams.\n\nThe silver price in Mumbai today, 15 November, was in line with the overall silver rates in India. The price of Silver 999 Fine in Mumbai was \u20b9 1,76,960 per kg.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 09:04 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jailer 2 Vs Scene Vs Mookuthi Amman 2: How The Three Films Performing At Box Office? Check Day-Wise Earnings", "full_content": "All three films witnessed a rise in collections on November 14. 'Jailer 2' took its India net total to Rs 474.29 crore on Day 31, while 'Scene' and 'Mookuthi Amman 2' reached Rs 127.20 crore and Rs 19.25 crore, respectively, in nine days.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 08:42 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top 3 stocks to buy: Redington, Aster DM, Canara Bank by Ganesh Dongre of Anand Rathi | Targets, stop-loss, market view", "full_content": "REDINGTON Asit Manohar Published 15 Nov 2026, 08:31 AM IST Prefer Livemint on Google Stocks to buy | Shares to buy | Ganesh Dongre's stock recommendations: The key benchmark indices of the Indian stock market ended the week on a strong positive note, with the Nifty gaining nearly 0.45% to close at 25,144, while the Bank Nifty witnessed a sharp rally of 3.30%, settling at 61,034. Meanwhile, Brent crude oil prices declined towards $95 per barrel, providing significant relief to global markets. Sectoral performance remained broadly positive, with most major sectors gaining between 1% and 5%. Banking and chemicals emerged as the top-performing sectors, rallying nearly 4% during the week.\n\nOver the previous two weeks, the Nifty had witnessed a sharp recovery of more than 10%, supported by strong buying interest at lower levels. The index rebounded from the 22,200\u201322,500 support zone, recovered towards its 200-day moving average and subsequently moved above the crucial psychological mark of 25,000. The recovery gained further momentum as the Nifty surpassed its previous monthly high of 24,700 and approached its February 2026 high, indicating a significant improvement in market sentiment.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi believes the Indian stock market bias is positive untill the Nifty 50 index is above the psychological 25,000 levels. Ganesh Dongre of Anand Rathi said that 25,500\u201325,600 zone for the 50-stock index will be the next significant resistance area to watch.\n\nGanesh Dongre of Anand Rathi said the Nifty 50 index appears to be discounting the possibility of a gradual slowdown in geopolitical tensions following the US midterm election results, particularly after President Trump's party suffered electoral setbacks. Any potential de-escalation in the ongoing conflict could further ease crude oil prices, potentially pushing Brent crude towards its previous monthly lows.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 08:31 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nationwide ground stop followed contractor upgrade to L3Harris telecommunication system: DOT\u2019s Duffy", "full_content": "The longest halt in flight departures to U.S. airports since 9/11 came after updates to a telecommunications system managed by contractor L3Harris Technologies , Transportation Secretary Sean Duffy said Saturday, as hundreds of thousands of travelers were stranded by lingering disruptions.\n\nThere was \"zero evidence\" that the problem was caused by something \"nefarious\" or anything related to artificial intelligence, Bryan Bedford, the head of the Federal Aviation Administration, said at a press conference with Duffy.\n\nThe upgrades at \"at least\" one remote location were part of ongoing work of switching from a copper wire system to fiber, Duffy said.\n\nA router had \"flooded\" other routers in the air traffic control system with over 1,000 connection attempts roughly every five seconds, the secretary said, creating problems with airplane communications and radar feeds.\n\nThe outage again thrust aging infrastructure that underpins U.S. air traffic control into the spotlight, along with the country's struggles to replace sections of it while operating the world's busiest airspace.\n\n\"What we're working to determine was whether we had incompetence, meaning was it user error, installator error from L3 Harris, or did they install a faulty router,\" he said.\n\nL3Harris said it is \"supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel.\"\n\nL3Harris said it has completed more than 70% of the switch from copper wiring to fiber-optic system.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 08:23 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative a
