alam Investment & Finance Company Share Price Aditya Birla Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s IPO pipeline swells despite muted equity market SECTIONS India\u2019s IPO pipeline swells despite muted equity market By Himadri Buch , ET Bureau Last Updated: Sep 29, 2026, 06:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's primary market is thriving with a significant increase in the number of IPOs and issue amounts. In contrast, the secondary market has experienced notable declines in equity indices. While foreign investor interest in listed stocks has dwindled, they remain active in the IPO space. Several leading companies have successfully gone public, contributing to the primary market's resilience.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Sep 2026, 06:21 AM IST", "pub_date_relative": "43m ago"}], "cfa": [{"title": "Oil extends gains as Middle East supply concerns persist", "full_content": "Oil rose Tuesday, extending gains for a second day, as worries over the Mideast conflict continuing for longer take hold, even as efforts to reduce tensions are reportedly underway.\n\nFutures for international benchmark Brent crude for November delivery gained 1.22% to $106.56 a barrel. U.S. West Texas Intermediate futures advanced over 1% to $93.57 per barrel.\n\nbrent The U.S. and Iran are talking separately to mediators as part of renewed efforts to end the conflict. Citing Iranian Foreign Minister Abbas Araghchi, Al Jazeera reported that Tehran held indirect talks with the U.S. via Qatari mediators in New York.\n\nProgress in talks will be a main focus, as regional mediators push for ceasefire negotiations, said Mahmoud Mashal, senior market analyst of VT Markets Dubai, adding that any meaningful progress could drive crude lower.\n\nThat said, concerns over energy infrastructure and flows in the region continue to linger due to renewed tensions between Saudi Arabia and the Houthis, Mashal said.\n\nWTI The Strait of Hormuz, a crucial waterway that saw 20% of the world's oil supply transit through it prior to the war, remains closely watched.\n\nTrump on Saturday had rejected Tehran's conditional proposal for reopening the strait, telling aides that he expects to resume bombing Iran following the midterm elections in November.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 07:02 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Anthropic\u2019s potential $2 trillion IPO comes with the following fine print", "full_content": "Anthropic\u2019s revenue grew over 10-fold in 2025, but the cost of training and serving its models is also climbing.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Sep 2026, 07:01 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic warns AI may pose 'existential risks to humanity' in IPO filing: Reuters", "full_content": "Anthropic plans to caution potential investors in its IPO that advanced AI could pose \"catastrophic or existential risks to humanity,\" an extraordinary warning by a company seeking to profit from the same technology.\n\nThe company's IPO prospectus, reviewed by Reuters, highlights risks associated with its AI models, which it said could exhibit \"self-preserving behaviors,\" including attempts to \"resist shutdown,\" to \"conceal or manipulate information\" and behavior \"resembling blackmail.\"\n\n\"Our development of highly advanced models, platforms, and applications and expansion of use cases could further increase the risk that our models cause harm,\" Anthropic said in the filing.\n\nWhile public companies routinely outline product risks to investors, few, if any, have issued warnings suggesting their technology could cause potential human extinction. Anthropic emphasized both the transformative potential of AI on par with industrialization and electricity and the irreversible harm it could cause if mishandled.\n\nAnthropic and other AI developers, including OpenAI, have faced scrutiny after incidents where experimental systems defied constraints, including a report of an OpenAI model breaching Australia's health-system database.\n\nAnthropic safety researcher Evan Hubinger estimated a greater than 10% probability that AI could kill humans within the next decade, echoing a sentiment by a former colleague, Jacob Coxon.\n\nThe company, which has positioned itself as a safety-first AI lab, devoted roughly 80 pages of the 261-page main body of its prospectus to laying out risk factors, nearly twice the 48 pages it used to describe its business.\n\nFor comparison, SpaceX, which owns xAI, dedicated just around 38 of the 277-page main body of its prospectus to risk factors.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 06:53 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Gold steadies near seven-week low after 4% plunge as Fed hike bets rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Sep 2026, 06:51 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sensex, Nifty 50 prediction today: Stock market outlook for Tuesday, 29 Sept - GIFT Nifty, Kospi, Nikkei, Taiwan cues", "full_content": "Stock market prediction for Tuesday, 29 September, 2026 : The Indian stock market is likely to witness a muted start as GIFT Nifty was trading marginally lower on Tuesday, 29 September.\n\nMeanwhile, Asian markets opened lower on Tuesday, while US stock futures also ended in red.\n\n\u201cIndian equity markets are expected to remain under pressure as elevated crude oil prices and persistent uncertainty over the U.S.-Iran conflict weigh on market sentiment. U.S. President Donald Trump said the U.S. would win the conflict \u201cvery soon,\u201d while officials are communicating with mediators seeking to end the conflict. However, significant uncertainty remains around the negotiations, keeping concerns over potential supply disruptions through the Strait of Hormuz elevated,\u201d said Ponmudi R, CEO of Enrich Money.\n\nThe Indian stock market faced intense selling pressure on Monday, September 28, as benchmark indices breached key psychological support levels. Rising crude oil prices, elevated bond yields and concerns over further global monetary tightening continued to dampen investor sentiment.\n\nThe Nifty 50 declined 1.54% to end the session at 22,762, slipping below the crucial 23,000 mark for the first time since April. With Monday\u2019s decline, the index\u2019s year-to-date loss widened to 13%. The Sensex also fell 1.43%, closing below the 73,000 level at 72,836.\n\nGift Nifty was trading around the 22,820 level, down nearly 4 points from the Nifty futures\u2019 previous close, indicating a flat start for the Indian stock market indices.\n\nSensex closed at 72,771.72, declining 1,124.02 points (-1.52%). The index opened at 73,734.83, touched a high of 73,740.85 and slipped to an intraday low of 72,716.23.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 06:49 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Luckin Coffee, flush with investor cash, weighs entry into Middle East markets", "full_content": "SINGAPORE \u2014 Luckin Coffee is once again weighing an entry into Persian Gulf markets after securing backing from Abu Dhabi's sovereign wealth fund Mubadala.\n\nLuckin's senior management is considering expanding into the Gulf countries, Chairman David Li told CNBC in an exclusive interview on Monday. Li is the co-founder and CEO of private equity firm Centurium Capital, the controlling shareholder of China-based Luckin.\n\n\"There are other markets we are currently looking at [and] potentially entering into regions like Gulf countries,\" Li said.\n\nMubadala has become a direct investor in Luckin after a $1 billion joint investment with Centurium in early September, with neither side disclosing the respective stake size. The $385 billion sovereign fund has invested more than $20 billion in China, including into e-commerce giant Shein and real estate developer Dalian Wanda's shopping malls business.\n\nLuckin had in 2019 planned to open shops in the Middle East and India, but that never came to fruition. The company was embroiled in an accounting scandal six years ago that found its former executives had fabricated hundreds of millions of dollars in sales, leading to its filing for bankruptcy in the U.S., delisting from Nasdaq, and feeding into broadening U.S. scrutiny of Chinese companies' stock listings.\n\nThe appeal of expanding into the Gulf lies in stable, high-frequency coffee demand and a growing preference for low-sugar, health-oriented drinks, Luckin CEO Jinyi Guo told CNBC separately on Monday\n\nWith Centurium's backing, Luckin has engineered a sharp turnaround and surpassed Starbucks as China's biggest coffee chain by sales. The Beijing-based private equity firm has also been pushing further into coffee after acquiring premium coffee brand Blue Bottle Coffee in April from Nestl\u00e9 for reportedly less than $400 million .\n\nLuckin's shares, still trading over-the-counter in a less-regulated exchange, now value the company at roughly $9.6 billion.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 06:40 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why the midterm elections matter for the stock market this year", "full_content": "U.S. midterm elections are right around the corner, and they may pose a threat to the driving force behind the bull market\u2014the AI trade.\n\nIn the lead up to the midterms, which are slated for Nov. 3, the stock market has proven quite resilient. The S&P 500 has bucked the September Effect, staying positive month-to-date. This strength comes in the face of historic Treasury yields, high oil prices, and a interest-rate hike from the Federal Reserve during a relatively quiet period in between earnings seasons. And its largely driven by strength in the tech sector. The Technology Select Sector SPDR ETF has gained 4.3% this month, while the S&P 500 was roughly flat.\n\nBut these elections could prove to be a critical for continued tech strength. The sector has largely driven by optimism around artificial intelligence, but the election has the potential to stop the momentum. Anti-AI sentiment has been driving some local and state election races, and could lead to legislation that threatens the AI expansion. That would be detrimental to the S&P 500, where a few AI stocks have done the heavy lifting while a stealth bear market hides beneath the surface of an index trading near record highs.\n\nMidterms are usually not something for investors to worry about. Yes, the political noise can drives volatility, but rarely do they have a long-term impact on market direction. The Cboe Volatility Index averages above 20 in election years compared with below 19 in nonelection years, according to Dow Jones Market Data going back to 1990. Equities, though, tend to move higher regardless of the outcome of midterm elections.\n\nIn fact, the S&P 500 has averaged double-digit gains going back to 1933 whether there\u2019s a unified government, a split Congress, or a unified Congress with a president of a different party, per research from Capital Group.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 06:38 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Market rout deepens as crude surge, high US yields batter Indian equities", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market rout deepens as c eading steel producers. The company has a diversified presence across the steel value chain and serves customers across several industries.\n\nIn India, Tata Steel\u2019s product portfolio is divided into four broad segments: Automotive and Special Products; Industrial Products, Projects and Exports; Branded Products and Retail; and Services and Solutions.\n\nThe company offers a wide range of products, including hot-rolled, cold-rolled and galvanised steel, along with branded and value-added solutions for different end-use industries.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Talent crunch may hamper Sebi\u2019s PMS revamp", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Securities and Exchange Board of India\u2019s (Sebi\u2019s) decision to allow portfolio management services (PMS) companies to invest in foreign securities could unlock a new growth lever for the industry, provided they can find professionals with expertise in managing global portfolios.\n\nDemand for diversification beyond Indian markets is rising, but building teams with the expertise to invest across geographies, currencies and regulatory regimes will take time, as few Indian funds currently invest overseas.\n\n\u201cThe talent exists, but experienced professionals who combine global market knowledge with the needs of Indian PMS clients are a relatively small pool,\u201d said Anshul Sharan, co-founder and chief executive at quantitative PMS firm Ametra Investment Managers Pvt. Ltd.\n\nThe capital markets regulator, at its 24 September meeting, approved a new regulatory framework for PMS that, among other measures, allows discretionary and non-discretionary PMS firms to invest in foreign securities, such as listed equity and debt, overseas mutual funds, exchange-traded funds, index funds and so on.\n\nSharan said that to tap the opportunity, PMS firms would need people who can analyse companies across jurisdictions, navigate different accounting and regulatory frameworks, and manage currency and portfolio allocation risks.\n\nThat talent could come from across the financial services industry, including mutual fund teams with overseas mandates, global research teams at asset managers, international wealth management businesses, and professionals who have worked with asset managers in Singapore, London, or the US.\n\n\u201cThe ecosystem will need to evolve and grow. A lot of mutual fund managers handling overseas assets may decide to become PMS managers.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Goldman Sachs identifies 42 Indian stocks riding AI build-out", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Goldman Sachs identifies 42 Indian stocks riding AI build-out The Economic Times daily newspaper is available online now. Read Today's Paper Goldman Sachs identifies 42 Indian stocks riding AI build-out SECTIONS Goldman Sachs identifies 42 Indian stocks riding AI build-out By ET Bureau Last Updated: Sep 29, 2026, 06:13:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Several Indian companies are emerging as significant players in the AI infrastructure sector, according to Goldman Sachs. These 'AI Enablers' span industries such as power, data centres, and semiconductors     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
