    const allData = {"general": [{"title": "Harvest Minerals completes Scanty Mineracao acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 01:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "Japanese borrowing costs hit 30-year high as Bessent says Tokyo may intervene to boost yen", "full_content": "Japan's benchmark borrowing costs rose to their highest level in three decades on Tuesday, after U.S. Treasury Secretary Scott Bessent signaled that he expects action from Tokyo and the Bank of Japan to support the falling yen.\n\nThe Japanese 10-year yield rose 6 basis points on Tuesday to nudge above 3% for the first time since 1996, before moderating toward 2.99%. Global bonds were also under pressure, with U.S. Treasury yields broadly higher after a speech by Federal Reserve Chair Kevin Warsh was interpreted as hawkish by the market . Bond yields move inversely to prices.\n\nThe yen was last trading at 159.95 per dollar after weakening to 160 per dollar earlier in the session, a level some traders see as increasing the likelihood of further currency intervention. The U.S. and Japan conducted a rare joint intervention to support the yen in late July, but the currency has since surrendered much of its gains .\n\nU.S. dollar/Japanese yen exchange rate. U.S. Treasury Secretary Scott Bessent told CNBC in a Monday interview: \"I have information that the market doesn't have. And it's my belief that the Japanese government and that the BOJ will do the things that will lead to a stronger yen.\"\n\nA U.S. official told broadcaster NHK that Bessent emphasized the need for Japan to communicate its path toward fiscal sustainability and further rate hikes in separate meetings with Japanese Finance Minister Satsuki Katayama and Bank of Japan Governor Kazuo Ueda.\n\nKatayama told reporters at the event that the U.S. and Japan had agreed to continue their coordinated effort to achieve \"orderly\" moves in the yen to ensure global market stability, and remained ready to act in response to \"disorderly\" market moves, according to Reuters.\n\nA years-long slide in the yen is increasingly concerning to Tokyo because of the impact on consumer prices due to higher import costs.\n\nThat worries Washington, according to analysts , because of the potential for Japan \u2014 the largest foreign holder of U.S.", "source": "CNBC Top News", "pub_date_str": "01 Sep 2026, 01:01 PM IST", "pub_date_relative": "6m ago"}, {"title": "US irks G20 ministers by bringing back Russia, barring journalists", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 01:01 PM IST", "pub_date_relative": "7m ago"}, {"title": "RBC Capital initiates Revvity stock with Sector Perform rating", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 01:00 PM IST", "pub_date_relative": "7m ago"}, {"title": "Global bond rout deepens as Japan yield hits key threshold", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 01:00 PM IST", "pub_date_relative": "7m ago"}, {"title": "PineX Capital Launches MetaTrader 5 as Prop Firm Expands Trading Platform Offering", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 01:00 PM IST", "pub_date_relative": "7m ago"}, {"title": "JPMorgan initiates BlossomHill Therapeutics stock with overweight", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 01:00 PM IST", "pub_date_relative": "7m ago"}, {"title": "Hugging Face's new duck robot is selling fast. A Chinese chip powers it", "full_content": "BEIJING \u2014 A popular new programmable personal robot from a French-American company is powered by a chip from Shanghai-listed Rockchip which in turn uses British company ARM's tech, reflecting how intertwined global tech supply chains remain.\n\nThe colorful \"Microduck\" robot from Hugging Face's French subsidiary Pollen Robotics has sold more than 10,000 units since its launch on Thursday \u2014 earning over $4 million based on the $399 unit price. That's quickly delayed delivery times for new orders past the initial promise of Christmas 2026.\n\nThe duck-shaped robots contain their own set of sensors, motors and on-device computing power from Rockchip's RK3566 . The chip incorporates technology licensed from British semiconductor company ARM , according to Rockchip .\n\nThe Chinese company is a \"key vendor\" for AI that operates on devices, rather than in the cloud, said Lian Jye Su, chief analyst at Omdia. He noted the company's chips are commonly used for machine vision involving object detection and image recognition.\n\n\"While it has massive footprint, the company chips are not designed for complex edge AI devices as they lack the compute resources,\" Su said. Such computing capabilities can allow smartphones, robots and other electronic devices to run generative AI tools securely without sharing data on the internet.\n\nRockchip last month reported a 40% year-on-year increase in operating revenue in the first half of the year to 2.88 billion yuan ($428 million), while net profit excluding one-time items surged by more than 60%.\n\nThe 1.76 pound (800g) Microduck is both an interactive consumer toy and a development platform. Using open-source software, it can supposedly learn from virtual simulations and goal-driven directions.\n\nThe product is the second robot from France-based startup Pollen Robotics, which was acquired by Hugging Face last year. The first robot by Hugging Face and Pollen Robotics, launched last spring, sold more than 10,000 units, Pollen Robotics said.", "source": "CNBC World Economy", "pub_date_str": "01 Sep 2026, 01:00 PM IST", "pub_date_relative": "7m ago"}, {"title": "London stocks fall post-holiday as global bond rout and Middle East strikes weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 12:58 PM IST", "pub_date_relative": "10m ago"}, {"title": "Asian currencies mixed as dollar steadies, yen remains near 160", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 12:57 PM IST", "pub_date_relative": "11m ago"}, {"title": "LEAP India Q1 FY27 slides: 30% profit growth, shares fall 4.5%", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 12:56 PM IST", "pub_date_relative": "12m ago"}, {"title": "OMCs set for earnings recovery in Q2 despite oil market uncertainty", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nGrowth prospects for oil marketing companies (OMCs) remain rocky amid the prolonged West Asia tension and Donald Trump\u2019s recent call for sanctions against entities doing business with Iran. While the immediate market reaction was muted given that Iran exports only 0.5% of global oil output, the move adds to uncertainty in the oil market.\n\nStill, with Brent crude oil prices down 12% from their highs in the June quarter (Q1FY27), OMCs\u2014Indian Oil Corp. Ltd (IOC), Bharat Petroleum Corp. Ltd (BPCL), and Hindustan Petroleum Corp. Ltd (HPCL)\u2014are expected to post strong Q2 results. Also, the International Energy Agency has projected a surplus in oil supplies in CY27, improving the medium-term outlook for OMCs.\n\nBrent crude softened to about $72 per barrel in early July after the US and Iran signed a memorandum of understanding on 17 June. But with hostilities resuming, Brent now trades at over $90 per barrel.\n\nWhile this is higher than the average of $69 per barrel in Q2FY26, it is notably lower than Q1\u2019s peak of $105 per barrel. Also, the market remains adequately supplied, considering the special Strait of Hormuz permission given to Iraq and the increase in ship-to-ship transfer of crude oil, reducing the risk of abrupt market shortages.\n\nShip-to-ship transfer shifts risk from the shipping company to oil-producing nations. Besides, the drawdown in inventories by the US and China is helping to stabilize the market. India imported 0.69 million tonnes per day (mtpd) in July, as per the Petroleum Planning & Analysis Cell, up from 0.65 mtpd in June but marginally lower than 0.72 mtpd in February.\n\nAt current prices, integrated margins for IOC, BPCL and HPCL have improved to $11.7, $13.3 and $8.3 per barrel, respectively, as per a 25 August Nomura Global Markets Research report, brightening their outlook.\n\nIn contrast, Q1 figures were $7.3, $5.5 and negative $4.5 per barrel.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 12:53 PM IST", "pub_date_relative": "15m ago"}, {"title": "OpenAI says Apple has only itself to blame in trade-secret fight", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 12:49 PM IST", "pub_date_relative": "19m ago"}, {"title": "Jewellery stocks down: Why Kalyan Jewellers, Titan, Augmont and others are losing sheen today? What's driving the fall?", "full_content": "Most jewellery stocks, including Kalyan Jewellers, Titan, and Augmont, suffered losses in intraday trade on Tuesday, 1 September, due to profit booking amid a decline in gold prices, a day after Prime Minister Narendra Modi's appeal to avoid buying gold if not necessary.\n\nShares of Kalyan Jewellers plunged as much as 7% in intraday deals, while those of Augmont Enterprises crashed 6% on the BSE. Other jewellery stocks, such as PC Jeweller and Titan Company, declined 2% each during the sessions. However, shares of Senco Gold rebounded 3.3% from the previous close of \u20b9 348.75 to hit an intraday high of \u20b9 360.20 after opening 0.50% lower at \u20b9 346.95.\n\nIn a video message on social media platform X, PM Modi on Monday urged citizens to prioritise domestic products and consumption, avoid foreign trips, and not buy gold unless necessary.\n\nPM Modi urged people to prioritise domestic products and consumption, and said, \u201cThe mantra of Swadeshi, Vocal for Local: foreign trips, if you go for sightseeing, should not be done. If you do weddings abroad, it should not be done. One should live by the mantra of 'Wed in India'. And if it's not necessary, then gold should not be bought either.\u201d\n\nThe PM also lauded India\u2019s 7.8% real gross domestic product (GDP) growth in the first quarter of FY27, describing it as a reflection of the \"collective strength\" of the countrymen.\n\nAccording to experts, the PM's appeal could be aimed at supporting the Indian rupee and conserving foreign exchange reserves.\n\nMeanwhile, India\u2019s foreign-exchange reserves climbed to a record high in the week of 21 August after recent measures by the Reserve Bank of India (RBI) to attract capital.\n\nThe RBI\u2019s forex reserves gained by $12.4 billion to an all-time high of $729.3 billion in the said week, surpassing the previous high of $728.5 billion in February.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago"}, {"title": "How Aston Martin\u2019s latest financing sparked a bondholder revolt", "full_content": "Luxury car maker\u2019s controversial deal with BlackRock-owned credit firm HPS set up high-stakes legal battle", "source": "FT Markets", "pub_date_str": "01 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "Asian Stocks to Fall as Iran Flare-Up Boosts Oil: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks to Fall as Iran Flare-Up Boosts Oil: Markets Wrap Bloomberg.com See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "01 Sep 2026, 12:38 PM IST", "pub_date_relative": "30m ago"}, {"title": "GAIL dividend 2026: Last date to buy alert | Know amount per share and payment timeline", "full_content": "GAIL dividend 2026: GAIL (India) declared a final dividend of \u20b9 0.50 per share, with September 2 fixed as the record date for determining eligible shareholders. The company has announced 51 dividends since September 2001 and currently offers a dividend yield of 2.9%.\n\n\u201cThe Board of Directors of the Company has recommended a Final Dividend of Re.0.50 per equity share. The Company has fixed Wednesday, September 2, 2026 as the \u2018Record Date\u2019 for determining entitlement of Members to receive Final Dividend for the Financial Year ended March 31, 2026, if approved, at the AGM,\u201d the company said in the filing.\n\nAccording to the filing, the dividend will be paid within the stipulated period of 30 days of declaration.\n\nWith the record date set for September 2, investors must purchase GAIL shares by at least one trading day earlier to ensure the shares are credited to their demat accounts before the record date.\n\nUnder SEBI\u2019s T+1 settlement cycle, buying the shares within this timeframe is essential to qualify for the corporate action. Hence, September 1 is the last day for investors to buy GAIL shares and remain eligible for the dividend.\n\nDividends are generally distributed from a company\u2019s earnings, and payouts exceeding profits can raise concerns about their long-term sustainability.\n\nGAIL (India) had a relatively comfortable dividend payout ratio of 48% of its profit last year. However, its free cash flow position presents a concern, as the company distributed dividends equivalent to 162% of the free cash flow it generated during the year, indicating that the payout was significantly higher than the cash available to support it.\n\nGAIL (India) reported a robust performance for the quarter ended June, supported by strong growth across its core gas businesses.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 12:35 PM IST", "pub_date_relative": "33m ago"}, {"title": "Ace investor Ashish Dhawan picks up 35 lakh shares in Religare Enterprises; stock jumps 5%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stoc full_content": "Small-cap stock below \u20b9 50 Elitecon International share price gained 5% to hit its 5% upper circuit of \u20b9 11.17 per share on the NSE, tracking a broader recovery in the domestic equity markets.\n\nThe stock's rise came as Dalal Street gathered momentum after a weak start to the session. The Sensex climbed more than 274 points, or 0.35%, to touch its intraday high of 77,231.57. The broader Nifty 50 also advanced around 63 points, or 0.26%, to an intraday high of 24,143.15.\n\nThe market recovery followed encouraging domestic economic data, with India's GDP growing 7.8% year-on-year during the April-June quarter. The expansion exceeded forecasts, supported by stronger investment and manufacturing activity along with resilient consumer demand.\n\n\u201cThe Q1 GDP growth print at 7.8% is reassuring and indicates that we are on track to achieve 7% growth in FY27. Services and secondary sectors growing at 10% and 8.5% respectively reflect a robust economy which can deliver decent earnings growth in FY27. This has the potential to keep the market resilient, but in the near-term the global headwinds from elevated crude and excessive U.S. bond yields might impact the market negatively,\" said V K Vijayakumar, Chief Investment Strategist, Geojit Investments Limited.\n\nElitecon International shares have come under heavy selling pressure, extending their decline across multiple timeframes amid weak market sentiment.\n\nThe small-cap stock has fallen 19% in just 1 week and declined around 29% over the past month. The sell-off has been even sharper over longer periods, with the stock slipping 64% in 3 months and plunging 81% in 6 months.\n\nOver the past 1 year, Elitecon International's share price has tanked more than 96%, highlighting the sharp reversal in the stock's performance.\n\nDespite the steep recent correction, the stock's longer-term returns remain multibagger in nature. Over the past 5 years, Elitecon International has delivered returns of 965%.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 12:32 PM IST", "pub_date_relative": "36m ago"}, {"title": "Fed Chair Warsh sees global investment surge replacing savings glut", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Fed Chair Warsh sees global investment surge replacing savings glut Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Fed Chair Warsh sees global investment surge replacing savings glut SECTIONS Fed Chair Warsh sees global investment surge replacing savings glut By Anupam Nagar , ETMarkets.com Last Updated: Sep 01, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Fed Chair Kevin Warsh told G20 finance leaders that the global economy may be shifting from a savings glut toward an investment boom, driven partly by AI spending. Stronger investment and productivity could boost growth, but reduced Treasury demand, higher yields and potential inflation pressures may complicate monetary policy decisions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Sep 2026, 12:32 PM IST", "pub_date_relative": "36m ago"}], "cfa": [{"title": "Harvest Minerals completes Scanty Mineracao acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 01:02 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Japanese borrowing costs hit 30-year high as Bessent says Tokyo may intervene to boost yen", "full_content": "Japan's benchmark borrowing costs rose to their highest level in three decades on Tuesday, after U.S. Treasury Secretary Scott Bessent signaled that he expects action from Tokyo and the Bank of Japan to support the falling yen.\n\nThe Japanese 10-year yield rose 6 basis points on Tuesday to nudge above 3% for the first time since 1996, before moderating toward 2.99%. Global bonds were also under pressure, with U.S. Treasury yields broadly higher after a speech by Federal Reserve Chair Kevin Warsh was interpreted as hawkish by the market . Bond yields move inversely to prices.\n\nThe yen was last trading at 159.95 per dollar after weakening to 160 per dollar earlier in the session, a level some traders see as increasing the likelihood of further currency intervention. The U.S. and Japan conducted a rare joint intervention to support the yen in late July, but the currency has since surrendered much of its gains .\n\nU.S. dollar/Japanese yen exchange rate. U.S. Treasury Secretary Scott Bessent told CNBC in a Monday interview: \"I have information that the market doesn't have. And it's my belief that the Japanese government and that the BOJ will do the things that will lead to a stronger yen.\"\n\nA U.S. official told broadcaster NHK that Bessent emphasized the need for Japan to communicate its path toward fiscal sustainability and further rate hikes in separate meetings with Japanese Finance Minister Satsuki Katayama and Bank of Japan Governor Kazuo Ueda.\n\nKatayama told reporters at the event that the U.S. and Japan had agreed to continue their coordinated effort to achieve \"orderly\" moves in the yen to ensure global market stability, and remained ready to act in response to \"disorderly\" market moves, according to Reuters.\n\nA years-long slide in the yen is increasingly concerning to Tokyo because of the impact on consumer prices due to higher import costs.\n\nThat worries Washington, according to analysts , because of the potential for Japan \u2014 the largest foreign holder of U.S.", "source": "CNBC Top News", "pub_date_str": "01 Sep 2026, 01:01 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global bond rout deepens as Japan yield hits key threshold", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 01:00 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Hugging Face's new duck robot is selling fast. A Chinese chip powers it", "full_content": "BEIJING \u2014 A popular new programmable personal robot from a French-American company is powered by a chip from Shanghai-listed Rockchip which in turn uses British company ARM's tech, reflecting how intertwined global tech supply chains remain.\n\nThe colorful \"Microduck\" robot from Hugging Face's French subsidiary Pollen Robotics has sold more than 10,000 units since its launch on Thursday \u2014 earning over $4 million based on the $399 unit price. That's quickly delayed delivery times for new orders past the initial promise of Christmas 2026.\n\nThe duck-shaped robots contain their own set of sensors, motors and on-device computing power from Rockchip's RK3566 . The chip incorporates technology licensed from British semiconductor company ARM , according to Rockchip .\n\nThe Chinese company is a \"key vendor\" for AI that operates on devices, rather than in the cloud, said Lian Jye Su, chief analyst at Omdia. He noted the company's chips are commonly used for machine vision involving object detection and image recognition.\n\n\"While it has massive footprint, the company chips are not designed for complex edge AI devices as they lack the compute resources,\" Su said. Such computing capabilities can allow smartphones, robots and other electronic devices to run generative AI tools securely without sharing data on the internet.\n\nRockchip last month reported a 40% year-on-year increase in operating revenue in the first half of the year to 2.88 billion yuan ($428 million), while net profit excluding one-time items surged by more than 60%.\n\nThe 1.76 pound (800g) Microduck is both an interactive consumer toy and a development platform. Using open-source software, it can supposedly learn from virtual simulations and goal-driven directions.\n\nThe product is the second robot from France-based startup Pollen Robotics, which was acquired by Hugging Face last year. The first robot by Hugging Face and Pollen Robotics, launched last spring, sold more than 10,000 units, Pollen Robotics said.", "source": "CNBC World Economy", "pub_date_str": "01 Sep 2026, 01:00 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "London stocks fall post-holiday as global bond rout and Middle East strikes weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 12:58 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "LEAP India Q1 FY27 slides: 30% profit growth, shares fall 4.5%", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Sep 2026, 12:56 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OMCs set for earnings recovery in Q2 despite oil market uncertainty", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nGrowth prospects for oil marketing companies (OMCs) remain rocky amid the prolonged West Asia tension and Donald Trump\u2019s recent call for sanctions against entities doing business with Iran. While the immediate market reaction was muted given that Iran exports only 0.5% of global oil output, the move adds to uncertainty in the oil market.\n\nStill, with Brent crude oil prices down 12% from their highs in the June quarter (Q1FY27), OMCs\u2014Indian Oil Corp. Ltd (IOC), Bharat Petroleum Corp. Ltd (BPCL), and Hindustan Petroleum Corp. Ltd (HPCL)\u2014are expected to post strong Q2 results. Also, the International Energy Agency has projected a surplus in oil supplies in CY27, improving the medium-term outlook for OMCs.\n\nBrent crude softened to about $72 per barrel in early July after the US and Iran signed a memorandum of understanding on 17 June. But with hostilities resuming, Brent now trades at over $90 per barrel.\n\nWhile this is higher than the average of $69 per barrel in Q2FY26, it is notably lower than Q1\u2019s peak of $105 per barrel. Also, the market remains adequately supplied, considering the special Strait of Hormuz permission given to Iraq and the increase in ship-to-ship transfer of crude oil, reducing the risk of abrupt market shortages.\n\nShip-to-ship transfer shifts risk from the shipping company to oil-producing nations. Besides, the drawdown in inventories by the US and China is helping to stabilize the market. India imported 0.69 million tonnes per day (mtpd) in July, as per the Petroleum Planning & Analysis Cell, up from 0.65 mtpd in June but marginally lower than 0.72 mtpd in February.\n\nAt current prices, integrated margins for IOC, BPCL and HPCL have improved to $11.7, $13.3 and $8.3 per barrel, respectively, as per a 25 August Nomura Global Markets Research report, brightening their outlook.\n\nIn contrast, Q1 figures were $7.3, $5.5 and negative $4.5 per barrel.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 12:53 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jewellery stocks down: Why Kalyan Jewellers, Titan, Augmont and others are losing sheen today? What's driving the fall?", "full_content": "Most jewellery stocks, including Kalyan Jewellers, Titan, and Augmont, suffered losses in intraday trade on Tuesday, 1 September, due to profit booking amid a decline in gold prices, a day after Prime Minister Narendra Modi's appeal to avoid buying gold if not necessary.\n\nShares of Kalyan Jewellers plunged as much as 7% in intraday deals, while those of Augmont Enterprises crashed 6% on the BSE. Other jewellery stocks, such as PC Jeweller and Titan Company, declined 2% each during the sessions. However, shares of Senco Gold rebounded 3.3% from the previous close of \u20b9 348.75 to hit an intraday high of \u20b9 360.20 after opening 0.50% lower at \u20b9 346.95.\n\nIn a video message on social media platform X, PM Modi on Monday urged citizens to prioritise domestic products and consumption, avoid foreign trips, and not buy gold unless necessary.\n\nPM Modi urged people to prioritise domestic products and consumption, and said, \u201cThe mantra of Swadeshi, Vocal for Local: foreign trips, if you go for sightseeing, should not be done. If you do weddings abroad, it should not be done. One should live by the mantra of 'Wed in India'. And if it's not necessary, then gold should not be bought either.\u201d\n\nThe PM also lauded India\u2019s 7.8% real gross domestic product (GDP) growth in the first quarter of FY27, describing it as a reflection of the \"collective strength\" of the countrymen.\n\nAccording to experts, the PM's appeal could be aimed at supporting the Indian rupee and conserving foreign exchange reserves.\n\nMeanwhile, India\u2019s foreign-exchange reserves climbed to a record high in the week of 21 August after recent measures by the Reserve Bank of India (RBI) to attract capital.\n\nThe RBI\u2019s forex reserves gained by $12.4 billion to an all-time high of $729.3 billion in the said week, surpassing the previous high of $728.5 billion in February.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "GAIL dividend 2026: Last date to buy alert | Know amount per share and payment timeline", "full_content": "GAIL dividend 2026: GAIL (India) declared a final dividend of \u20b9 0.50 per share, with September 2 fixed as the record date for determining eligible shareholders. The company has announced 51 dividends since September 2001 and currently offers a dividend yield of 2.9%.\n\n\u201cThe Board of Directors of the Company has recommended a Final Dividend of Re.0.50 per equity share. The Company has fixed Wednesday, September 2, 2026 as the \u2018Record Date\u2019 for determining entitlement of Members to receive Final Dividend for the Financial Year ended March 31, 2026, if approved, at the AGM,\u201d the company said in the filing.\n\nAccording to the filing, the dividend will be paid within the stipulated period of 30 days of declaration.\n\nWith the record date set for September 2, investors must purchase GAIL shares by at least one trading day earlier to ensure the shares are credited to their demat accounts before the record date.\n\nUnder SEBI\u2019s T+1 settlement cycle, buying the shares within this timeframe is essential to qualify for the corporate action. Hence, September 1 is the last day for investors to buy GAIL shares and remain eligible for the dividend.\n\nDividends are generally distributed from a company\u2019s earnings, and payouts exceeding profits can raise concerns about their long-term sustainability.\n\nGAIL (India) had a relatively comfortable dividend payout ratio of 48% of its profit last year. However, its free cash flow position presents a concern, as the company distributed dividends equivalent to 162% of the free cash flow it generated during the year, indicating that the payout was significantly higher than the cash available to support it.\n\nGAIL (India) reported a robust performance for the quarter ended June, supported by strong growth across its core gas businesses.", "source": "LiveMint Markets", "pub_date_str": "01 Sep 2026, 12:35 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ace investor Ashish Dhawan picks up 35 lakh shares in Religare Enterprises; stock jumps 5%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ace investor Ashish Dhawan picks up 35 lakh shares in Religare Enterprises; stock jumps 5% Religare Enterprises Share Price Five-Star Business Finance Share Price Edelweiss Financial Services Share Price SBFC Finance Share Price Fedbank Financial Services Share Price The Economic Times daily newspaper is available online     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
