<script>

    const allData = {"general": [{"title": "Kalshi daily volume of \u2018perps\u2019 trading begins to top its prediction markets", "full_content": "Kalshi is known for its prediction markets across sports , politics and culture .\n\nBut now, for the first time, perpetual futures, Kalshi's second financial product, has surpassed the notional trading volume of its event contracts on consecutive days.\n\nOn Thursday, perpetual futures \u2014 commonly known as \"perps\" \u2014 on Kalshi saw $3.4 billion in notional volume as artificial intelligence laboratory Anthropic stock debuted on public markets while the rest of the market sold off . That exceeded about $3 billion in notional volume for Kalshi's prediction markets on the same day.\n\nPerps are futures-style contracts where there is no expiration and traders do not need to own the underlying asset. Contracts instead continuously track the price of an asset, with funding payments to keep the contract price aligned with that of the market. Funding payments are made periodically between holders of short or long positions.\n\nPerps trading surpassed event contracts one day in September, but on Friday perps topped prediction markets volume for a second day. Now Kalshi expects that performance to continue as it introduces perps tied to more individual stocks. On Monday, for example, Kalshi launched contracts linked to Anthropic .\n\nKalshi was the first to debut perps in the U.S. after winning federal regulatory approval in May to list perps tied to cryptocurrencies.\n\nPerps trading volume includes any leverage that speculators acquire along with their trade, while event contracts are fully collateralized \u2014 for now .\n\nSince the original launch in May, Kalshi has received approval to introduce perps tied to metals , crude oil, stock indexes and individual stocks.", "source": "CNBC Finance", "pub_date_str": "25 Nov 2026, 04:33 AM IST", "pub_date_relative": "4m ago"}, {"title": "SharonAI Holdings amends indenture for 4.75% convertible notes due 2032", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:32 AM IST", "pub_date_relative": "5m ago"}, {"title": "US Army sets out measures to limit lead dust from Iowa explosives blast", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:30 AM IST", "pub_date_relative": "7m ago"}, {"title": "US stocks slide as Nvidia rally fizzles out, dollar falls", "full_content": "NEW YORK, Nov 24 (Reuters) - Wall Street retreated on Tuesday, with tech stocks giving back some of the Monday rally sparked by Jensen Huang's surprise return to Nvidia as CEO, while the dollar slipped.\n\nInvestors cautious about further AI-driven gains and US inflation triggered profit-taking sales and a rotation into more defensive and old-economy stocks. Bond yields were little changed.\n\nAnthropic fell more than 6% to more than $1 below its IPO price of $83, a striking drop only days after the Claude developer's record-breaking market debut. [.N]\n\nNvidia's shares also dropped more than 6%, having soared 31.5% on Monday after the AI chip giant reinstated Huang as CEO under pressure from US President Donald Trump.\n\n\"After the biggest rally in months, you would expect some profit-taking. At the end of the day, one headline doesn't really resolve investor questions about the AI trade,\" said Gene Goldman, chief investment officer at Cetera Financial Group.\n\nThe Nasdaq fell 1.4%, a day after the tech-heavy index climbed by nearly 7%. The S&P 500 dropped 0.50%, while the Dow Jones Industrial Average gained 0.85%.\n\nThe pan-European STOXX 600 index fell 0.66%, weighed down by a sharp slump in miners. [.EU]\n\nAsian markets gained ground after the US rally. But gold futures declined on Tuesday, pressured by hawkish signals from Federal Reserve officials and firm expectations of a December rate hike, while investors looked ahead to US inflation data that could influence the Fed's policy path.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 04:30 AM IST", "pub_date_relative": "7m ago"}, {"title": "Plenti 1H27 slides: cash profit surges 43%, inaugural dividend declared", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:30 AM IST", "pub_date_relative": "8m ago"}, {"title": "Dell Q3 FY27 slides: revenue doubles, AI backlog hits $132B", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:29 AM IST", "pub_date_relative": "8m ago"}, {"title": "Why is Workday stock tumbling today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:28 AM IST", "pub_date_relative": "10m ago"}, {"title": "RenX Enterprises announces resignation of board member Anthony M. Cialone", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:28 AM IST", "pub_date_relative": "10m ago"}, {"title": "Why is Nutanix stock sliding today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:26 AM IST", "pub_date_relative": "11m ago"}, {"title": "New Horizon Aircraft shareholders elect director and approve auditor at annual meeting", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:24 AM IST", "pub_date_relative": "13m ago"}, {"title": "BPG H1 FY27 slides: revenue up 42%, targets Q1 FY28 profitability", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:24 AM IST", "pub_date_relative": "13m ago"}, {"title": "Stocks making the biggest moves after hours: Ambarella, Dell, Autodesk, Urban Outfitters & more", "full_content": "In extended trading, Ambarella tanked after the semiconductor design company shared fourth-quarter revenue guidance that was well below the Street's expectations.\n\nDell Technologies traded higher on top and bottom line beats in the third quarter.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nThe designer of low-power AI vision and video chips plunged 38% after the company issued fourth quarter revenue guidance of $70.0 million to $75.0 million, which fell massively short of the $112 million analysts polled by LSEG were expecting.\n\nAmbarella on Tuesday Ambarella also missed third-quarter expectations on both the top and bottom lines.\n\nThe maker of personal computers jumped nearly 5% in extended trading after Dell Technologies reported third quarter earnings and revenue that beat expectations.\n\nDell on Tuesday Texas-based Dell posted earnings of $9.45 per share, excluding one-time items, on revenue of $54.94 billion. Analysts surveyed by LSEG had estimated earnings of $6.59 per share on revenue of $49.32 billion.\n\nWorkday posted third-quarter earnings and revenue that exceeded expectations, but the enterprise software cloud stock slid 7% in after-hours trading.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 04:19 AM IST", "pub_date_relative": "18m ago"}, {"title": "Micron boosted CEO Sanjay Mehrotra\u2019s security budget by 2,000%, new filing shows", "full_content": "Steeply higher security expenses of $764,748 for Mehrotra were part of a $39.7 million total compensation package in the latest fiscal year.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 04:13 AM IST", "pub_date_relative": "25m ago"}, {"title": "Trump Account contributions from friends and family pass $1 billion mark, Treasury says", "full_content": "Families and friends have collectively contributed more than $1 billion to Trump Accounts since the July 4 launch, bringing total deposits to more than $9 billion, the U.S. Department of the Treasury said Tuesday in an announcement exclusively provided to CNBC.\n\nThe $1 billion in Trump Account deposits come from more than 3 million individuals, according to the agency. That total does not include the government's seed money or philanthropic gifts from donors such as Michael and Susan Dell .\n\n\"The American people are investing in Trump Accounts with a generosity that represents the finest instincts of our national character,\" U.S. Treasury Secretary Scott Bessent said in a written statement.\n\n\"Trump Accounts are a transformative government program for American children. It is the largest government start-up in American history,\" Internal Revenue Service CEO Frank Bisignano said in the statement.\n\nAlso known as 530A accounts, Trump Accounts are open to any U.S. child under 18 with a Social Security number.\n\nParents, guardians, grandparents and others can collectively contribute up to $5,000 per child per year in after-tax dollars up until the year before the beneficiary turns 18. The annual contribution limit is indexed for inflation after 2027.\n\nChildren born from 2025 through 2028 may receive a one-time $1,000 deposit from the Treasury. Other funds may also be available, depending on certain criteria.\n\nMost recently, Snowflake chairman Frank Slootman and his wife, Brenda, announced they would give $1,000 to every child in Montana born in 2023 and 2024.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 03:48 AM IST", "pub_date_relative": "49m ago"}, {"title": "Dell earnings beat on AI strength, company authorizes $25 billion buyback", "full_content": "Dell reported third-quarter earnings on Tuesday that topped Wall Street expectations for earnings and sales, and provided a strong guide for the fourth quarter.\n\nHere's how the chipmaker did versus LSEG consensus estimates:\n\nDell said that it expected earnings of $8.40 per share on revenue of about $56.3 billion in the current quarter. Analysts polled by LSEG were looking for $7.50 per share on $53.61 billion in revenue.\n\nThe company's overall sales more than doubled on an annual basis during the third quarter, driven by AI server demand.\n\nThe company's largest line is its infrastructure solutions group, or ISG, which makes AI servers and systems, often based around AI chips from companies like Nvidia and AMD .\n\nISG sales during the quarter were $41.97 billion, topping an LSEG estimate of $35.27 billion. Of that, $22 billion was for AI-optimized servers, up 291% on an annual basis. ISG now accounts for 85% of Dell's total revenue.\n\n\"We are now a different company, with Infrastructure Solutions Group driving the vast majority of our profit and growth,\" said Jeff Clarke, Dell's vice chairman and COO, in a statement. He said that Dell has 7,500 customers buying AI servers.\n\nIn prepared remarks, Clarke said that Dell has a competitive advantage over other computer equipment makers because it allows customers to get their computers working within hours of delivery.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 03:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "Saudi national charged in OpenAI bugging to be released on $1 million bond", "full_content": "Abdulrahman Alfozan , the Saudi national accused of bugging an OpenAI executive conference room, will be allowed to be released from jail on a $1 million bond , a San Francisco federal court judge ruled Tuesday.\n\nAlfozan, 35, is expected to be released on Wednesday and be fitted with an ankle monitor, according to his attorney, David Rizk.\n\n\"We are simply grateful that the Court made the right decision to release Mr. Alfozan and now we look forward to defending the case,\" Rizk said in a text message after a hearing before U.S. District Court Magistrate Judge Alex Tse.\n\nTse's ruled in favor of a release motion by Rizk filed last week that said prosecutors had admitted they had \"found no new evidence to support the theory that Mr. Alfozan was stealing trade secrets, or to support the speculation that he was acting as an unregistered foreign agent for Saudi Arabia.\"\n\nThe San Francisco U.S. Attorney's Office opposed the former OpenAI engineer's release, saying in its response that he remains a flight risk due to his \"considerable resources and ties to Saudi Arabia.\"\n\nAlfozan's release request \"blithely dismisses the seriousness\" of the charge he faces, and \"appears to presume, without support, that the government's investigation is complete,\" prosecutors wrote.\n\nAlfozan, who was arrested Oct. 9, is accused of concealing a recording device in the artificial intelligence company's conference room to secretly record discussions. The device was found in a USB port in a television in the room on Sept. 30, prosecutors have said.\n\nProsecutors said they have found hundreds of audio files on Alfozan's personal computer, \"including dozens of recordings of meetings or conversations that occurred at OpenAI throughout September 2026, many of which involve discussions of what may be trade secrets.\"", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 03:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "12 days of sardines and Croc charms: Are Advent calendars getting out of control?", "full_content": "Luxury Advent calendars in particular \u2014 which can run hundreds of dollars \u2014 have seen a spike in sales. Here\u2019s why.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 03:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI debt markets shudder as Nvidia's top 'banker' returns", "full_content": "AI credit markets are shuddering again with Jensen Huang back as CEO of Nvidia .\n\nFears about the massive debt being taken on to fund the artificial intelligence buildout climbed Tuesday as Wall Street weighed what Huang's return to Nvidia means for its bankrolling of the AI boom.\n\nHuang is considered one of the top financiers, or bankers, in the AI industry, spearheading deals with neoclouds like CoreWeave and other firms to buy chips, backed in some cases by Nvidia guarantees. His return to Nvidia has revived prospects for the company to continue \"circular financing\" of AI chips and data centers \u2014 raising concerns among credit investors.\n\nCoreWeave, which has become the poster child of AI debt concerns, saw its stock sink 13% and the yield on its 9.75% bond due in 2031 top 17%. Bond yields move inversely to prices.\n\nAt the same time, the spread on the neocloud company's five-year credit default swaps jumped 8.5% to over 1,200 basis points. Credit default swaps are insurance against nonpayment and are considered a barometer of perceived risks. Rising CDS spreads mean investors view the debt as riskier.\n\nHuang was reinstated as CEO on Monday after stepping down on Nov. 12 amid allegations of multiple affairs, including one with an alleged Chinese spy. His reinstatement on Monday was cheered by investors, who pushed stocks higher, yields lower and spreads on CDS tighter. However, stocks retreated, bond yields rose and CDS spreads widened on Tuesday.\n\nBen Emons, founder and chief investment officer at FedWatch Advisors, called it a waning of the \"Jensen effect.\"\n\nThe moves suggest \"markets see government intervention as 'moral suasion' that carries credit and interest-rate risks,\" he said.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 03:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ending soon: Capital One Venture welcome bonus worth $1,050 or more in travel", "full_content": "If you're looking to save on your next trip, the Capital One Venture Rewards Credit Card has an excellent limited-time welcome offer right now.\n\nThe standard welcome bonus for the Venture includes 75,000 bonus miles after you spend $4,000 on purchases within the first three months from account opening. But for a limited time, you'll also receive a $300 Capital One Travel credit that's valid for hotels and vacation rentals booked in your first cardholder year.\n\nYou can use Capital One miles to offset eligible travel purchases at 1 cent per mile. That means you can redeem this bonus to cover $1,050 in hotel or vacation rental bookings \u2014 a great return for a reasonable minimum spending requirement.\n\nLet's look at what you can do with this bonus to help you decide if it's worth applying before the promotion expires.\n\n5.0 Learn More CNBC Select Rating 5.0 Learn More Spotlight Capital One Miles transfer to a variety of valuable travel loyalty programs, making the Venture Rewards card's 2X miles everywhere even more valuable.\n\nEarn a limited-time $300 Capital One Travel stays credit, plus 75,000 miles\n\nTerms apply. Read our Capital One Venture Rewards Credit Card review .\n\nThe Capital One Venture Rewards Credit Card has a reasonable annual fee and earns flexible travel rewards, which makes it a great travel card for both beginners and frequent travelers.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 03:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang Apologizes to Nvidia Employees and Says He Is in Therapy - The New York Times", "full_content": "Jensen Huang Apologizes to Nvidia Employees and Says He Is in Therapy The New York Times Nvidia live updates: Nvidia stock falls after massive rally, Jensen Huang apologizes to employees Yahoo Finance Jensen Huang apologizes to employees, says he\u2019s in therapy CNN The Frantic White House Push to Get Jensen Huang Back WSJ Trump wanted Jensen Huang back. Now, the president is all alone in Washington CNBC", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 03:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic\u2019s stock just broke below its IPO price for the first time", "full_content": "Shares are trading below their IPO price of $83, less than a week after their debut on the Nasdaq.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 03:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "TSX ends lower as tech and mining shares fall", "full_content": "TORONTO, Nov 24 (Reuters) - Canada's main stock index gave back some of the previous day's sharp advance on Tuesday as investors weighed prospects of additional Bank of Canada interest rate hikes, with losses for mining and technology shares offsetting gains for energy.\n\nThe S&P/TSX Composite Index ended down 119.87 points, or 0.4%, at 33,962.25. On Monday, the TSX posted its biggest gain since April 2025 as it rebounded from a seven-month low.\n\n* US stocks also fell as Nvidia and other technology shares gave back some of Monday's sharp gains and investors braced for possible new US import duties on a wide range of goods\n\n* \"The market is going to be volatile going into the end of the year,\" said Michael Constantino, chief executive officer at Webull Securities Canada. \"Investors are still watching the trade tariffs with US, and another hike from the Bank of Canada could add a little bit of pressure\"\n\n* Investors see a roughly 80% chance the Bank of Canada will hike its benchmark interest rate in December after the central bank said it may need to respond forcefully to tackle supply shocks\n\n* The materials sector, which includes metal miners, declined 2.5%. Gold was down 2.2% on hawkish signals from Federal Reserve officials\n\n* US personal consumption expenditure price index figures, due on Wednesday, could help guide expectations for Fed interest rate hikes\n\n* First Quantum Minerals said a contract worker at the Kansanshi operation in Zambia has died following an accident. Shares of the company fell 10.4% to their lowest level since September 2025", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 03:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "HPE just posted its strongest growth ever \u2014 but its stock is sinking", "full_content": "HPE boosted its financial forecast on Monday in the face of strong AI demand.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 03:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Tech Stocks Slide Back After Epic Rally - WSJ", "full_content": "Stock Market Today: Tech Stocks Slide Back After Epic Rally WSJ Nasdaq slumps about 1.5% as Nvidia comeback reverses course and Anthropic breaks IPO price: Live updates CNBC Nasdaq, S&P 500 close lower, giving up some Nvidia-fueled gains NBC News Markets Slide as Tech Stocks Partly Reverse Nvidia-Sparked Rally The New York Times Tech sell-off resumes as euphoria from Jensen Huang\u2019s Nvidia return subsides The Guardian", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 03:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia Option Trader Scores 1,984% Gain After CEO Huang\u2019s Return", "full_content": "Reddit user Outrageous-Voice1459 made a lot of money on Monday.\n\nThe trader made $376,900 in profit on $19,000 worth of Nvidia Corp. call options bought on Friday. But Outrageous-Voice1459\u2019s winnings pale in comparison to that of institutional traders who had been positioning for a rebound in the chip giant\u2019s shares, even as the stock price kept sinking.\n\nWith shares dropping 39% this month through Friday, some option traders had moved bullish positions to lower strike prices, paying a premium for the chance to profit more quickly on a recovery. Others bought tens of thousands of calls and call spreads to bet on higher prices by early next year. Still others sold put options, willing to purchase shares in case of a deeper slide in Nvidia\u2019s stock.\n\nThe massive spike in shares after Nvidia reinstated Jensen Huang as chief executive officer on Monday morning finally rewarded the traders looking for a rebound. That included a buyer on Friday of January-expiry $160 calls, who sold half of their position to secure a $23.8 million gain with the stock surging 31% to $165.05.\n\nBetween irreverent memes and satirical AI videos of Nvidia\u2019s Huang, Outrageous-Voice1459 posted screenshots of his brokerage account on the subreddit r/WallStreetBets, saying he had made made \u201c10x my years salary in one trade.\u201d The trade entry details match a real block trade at the same time and price on an electronic options exchange.\n\nAnother purported trade caused a stir on social media for being suspiciously well timed \u2014 a block of $160 calls expiring Monday supposedly sold at a vast profit. But an examination of the options tape from that day shows no trace of such a trade.\n\n\u201cThere seems to be no confirmation this trade actually happened,\u201d said Daniel Roos, co-founder of options research provider VolSignals.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 03:08 AM IST", "pub_date_relative": "1h ago"}, {"title": "How much more are richest Americans spending on the holidays compared to everyone else?", "full_content": "Most households are getting \u201csqueezed by rising costs of everyday goods,\u201d according to Teneo, but upper-income households \u201care showing resilience.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 03:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "A 66-year-old nurse is facing down retirement with just $500 saved. Who\u2019s to blame?", "full_content": "\u201cRetirement is a financial status, not an age.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 03:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Micron\u2019s stock falls as an analyst warns about a future supply glut", "full_content": "A BNP Paribas analyst says the risk of an \u201coversupply scenario is mounting\u201d for memory chips, and that could threaten Micron\u2019s pricing power.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 02:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "The stock market is hardly cheap, even taking recent declines into account", "full_content": "Equities are still extremely overvalued, notwithstanding the stock market\u2019s steep declines over the past several weeks.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 02:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nasdaq slumps about 1.5% as Nvidia comeback reverses course and Anthropic breaks IPO price: Live updates", "full_content": "The Nasdaq Composite fell on Tuesday, giving back some of the sharp gains from the previous session that were sparked by Jensen Huang's return as Nvidia CEO .\n\nThe tech-heavy index was 1.48% lower, closing at 23,733.54, while the S&P 500 fell 0.5% to 7,201.09. The Dow Jones Industrial Average climbed 423.39 points, or 0.85%, to 50,018.70, bolstered by gains in stocks such as Amgen , Nike and Salesforce .\n\nNvidia shares reversed course following their 31% surge on Monday, a move that led a rally in chip stocks. The stock was down nearly 6% on Tuesday.\n\nStrategy Asset Managers CEO Tom Hulick told CNBC's \" Squawk Box Europe \" on Tuesday that Huang was probably the right person to lead Nvidia \" for now .\" But the company still has \"a lot of things to worry about\" regarding corporate governance, he said.\n\nWith Nvidia's \"outsized influence on the entire U.S. market,\" any future developments surrounding the chipmaker could determine the market's trajectory from here, along with other factors such as post-election policy shifts in Washington and the Federal Reserve possibly raising interest rates, said SimCorp's Diana Baechle.\n\n\"I think we're still going to see increased volatility in the market because there's just so many unknowns,\" the head of investment decision research at the firm told CNBC. There is \"so much going on that, to me, it's just natural for investors to take a little bit of a more risk-averse approach\" until things get \"a little bit clearer,\" she added.\n\nDays after its record-setting initial public offering, AI laboratory Anthropic shares fell more than 6%, breaking below its $83 IPO price and adding pressure to the broader market. Still, a number of analysts are bullish, with Wedbush Securities calling Anthropic a \" strong play \" on the AI buildout theme in a recent note.\n\nOther stocks linked to AI fell alongside Nvidia and Anthropic.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 02:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia shares fall more than 5% as Huang comeback rally cools", "full_content": "Nvidia shares fell 5.86% on Tuesday, paring a massive Monday rally that was sparked by the return of Jensen Huang as CEO.\n\nOther U.S. semiconductor stocks also traded lower after posting strong increases Monday. Micron declined 10.97%, Marvell Technology lost 9.10%, Arm Holdings dropped 8.55% and AMD shed 8.86%.\n\nNeoclouds gave back some of their Monday gains, with CoreWeave losing 11.84%, Iren declining 11.54% and Nebius shedding 10.74%.\n\nHuang, who resigned as CEO of Nvidia earlier this month after admitting to an extramarital affair, was reinstated on Monday. The stock closed over 30% higher following the news of Huang's return.\n\nThe company's board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him.\n\nPresident Donald Trump also claimed he was personally involved in Huang's return. The president told CNBC that he spoke with the chipmaker's board before it reversed course and reinstated its co-founder.\n\n\"I made the deal,\" Trump told CNBC's Eamon Javers on Monday during an interview on \"Squawk on the Street.\"\n\nTrump said Nvidia's board asked for guarantees that Huang, who resigned less than two weeks ago, was not a threat to national security.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019ve been married for 58 years. It\u2019s \u2018our\u2019 money, not \u2018his\u2019 and \u2018hers.\u2019 Why do so many couples keep their finances separate?", "full_content": "\u201cMy wife stopped working outside the home in 1970.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 02:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s stock drops as these major questions loom over Jensen Huang\u2019s return", "full_content": "Huang\u2019s reinstatement as CEO doesn\u2019t fix regulatory issues or the investigation into his relationship with a former Megaspeed executive.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 02:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump wanted Jensen Huang back. Now, the president is all alone in Washington", "full_content": "President Donald Trump wanted Jensen Huang back at the helm of Nvidia . Now that the chip mogul is reinstated, Trump is cheering alone in Washington.\n\nTrump celebrated and claimed credit after Huang was reinstated by the Nvidia board on Monday, a stunning return to power for the embattled CEO. In a nearly hourlong phone call with CNBC , the president went as far as saying he \"made the deal\" to bring Huang back.\n\nBut Trump's jubilation stands in stark contrast to the reaction from even his staunchest allies on Capitol Hill , who recoiled after the reinstatement and vowed to continue their investigations into Huang \u2014 whose relationship with a potential Chinese intelligence asset they fear may have jeopardized U.S. national security.\n\n\"The risk remains that there could be information that a Chinese spy knows about a key individual in the supply chain, and that's not worth the risk,\" Sen. Kevin Cramer , R-N.D., said Tuesday on CNBC's \"Squawk Box.\" \"We might even have to put a babysitter on Jensen Huang for crying out loud ... just to make sure that he doesn't do something that's going to risk the United States.\"\n\nTrump's rare isolation from his party over Huang comes after the GOP was throttled in the midterm elections , as Democrats rode a blue tsunami to capture the Senate and the largest House majority this century. And it suggests Republicans, who have spent a decade in lockstep with the president, may have found an issue on which they can't bring themselves to take Trump's side.\n\n\"I can accept what the president has done,\" Cramer said. \"But we have to put guardrails around to protect the United States of America.\"\n\nMany midterm voters identified Silicon Valley's most visible outputs, artificial intelligence and data centers, as top concerns motivating them to cast ballots for Democrats.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic closes below IPO price as tech rally fades", "full_content": "Investor relief over reinstatement of Jensen Huang as Nvidia CEO subsides", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 02:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nasdaq, S&P 500 end lower as investors assess Jensen Huang's return to Nvidia", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Nasdaq, S&P 500 end lower as investors assess Jensen Huang's return to Nvidia Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Nasdaq, S&P 500 end lower as investors assess Jensen Huang's return to Nvidia SECTIONS Nasdaq, S&P 500 end lower as investors assess Jensen Huang's return to Nvidia Reuters Last Updated: Nov 25, 2026, 02:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Nasdaq and S&P 500 indices experienced a drop as Nvidia and other tech shares fell. Investors reacted to potential new tariffs, raising concerns about market stability. Nvidia's CEO Jensen Huang was reinstated, which had previously spurred a market rally. In contrast, the Dow Jones Industrial Average saw gains amid varied sector performances. Anticipation for the upcoming Personal Consumption Expenditures report added further uncertainty to investor sentiment.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Nov 2026, 02:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI Engineer Secretly Recorded Dozens of Meetings, Prosecutors Say - The New York Times", "full_content": "OpenAI Engineer Secretly Recorded Dozens of Meetings, Prosecutors Say The New York Times Saudi national charged in OpenAI bugging to be released on $1 million bond CNBC OpenAI Staffer Charged With Planting Bug Released on Bond Bloomberg.com OpenAI engineer possessed dozens of meeting recordings, say US prosecutors Financial Times Saudi engineer used OpenAI\u2019s vibe-coding app to more efficiently bug its office, feds say Business Insider", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 02:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Drugmaker Insmed shares rally 14% after Sanofi agrees to buy it in pharma\u2019s biggest deal in three years", "full_content": "Insmed shares rallied 14% on Tuesday after Sanofi announced it would buy the smaller drugmaker for $41 billion, marking the largest pharma deal since 2023.\n\nThe proposed acquisition includes Insmed's portfolio of two commercialized respiratory drugs as well as its pipeline of experimental candidates. Sanofi will pay $175 per share in cash.\n\nIt's a big bet by new Sanofi CEO Belen Garijo, who took up the role in May to steer the company through its upcoming patent cliff , when its blockbuster immunology drug Dupixent will face generic competition as patents expire.\n\nIf closed, the transaction will be the biggest one the industry has seen since Pfizer bought Seagen for $43 billion in December 2023.\n\nInsmed shares closed up 14.1% at $170.15 on Tuesday, while Sanofi stock closed up 10.9% in Paris.\n\nBarclays analysts called the deal a \"breath of fresh air,\" significantly improving Sanofi's Dupixent patent expiry outlook by adding Insmed's established respiratory assets Brinsupri and Arikayce, plus a late-stage pipeline offering further potential upside.\n\nThe deal is expected to close in the first half of 2027 and be accretive to earnings by the end of 2028, Sanofi said.\n\nLike much of the industry, Sanofi faces a revenue drop toward the end of the decade as top-selling drugs lose exclusivity and open up for generic drugmakers to compete.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 02:37 AM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic closes below $83 IPO price, but analysts are still largely positive", "full_content": "Shares of Anthropic closed down 6.5% on Tuesday, sending the stock below the artificial intelligence company's $83 IPO price.\n\nThe AI lab's stock has been sinking steadily since opening at $111.50 on the Nasdaq on Thursday, after Anthropic raised $81.3 billion in the largest offering of all time. Investors eagerly awaited Anthropic's debut in hopes that the company would revitalize the broader AI trade, which has been volatile in recent weeks over concerns about the feasibility of a multitrillion-dollar infrastructure buildout.\n\nAnthropic's initial public offering was oversubscribed, and roughly half of the institutional investors that placed orders for the stock were left empty-handed, as CNBC previously reported . But at least for now, as the market wavers, those firms don't appear to be racing to scoop up shares.\n\nChip stocks Nvidia , Advanced Micro Devices and Intel , as well as neoclouds CoreWeave , IREN and Nebius , all fell during intraday trading on Tuesday. The market is still reeling after Nvidia reinstated Jensen Huang as CEO, a dramatic reversal from his ouster earlier this month. Nvidia shares surged more than 30% on Monday, but pared those gains Tuesday.\n\nAnalysts at Canaccord Genuity said Tuesday that they're focused on Anthropic's long-term potential.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:34 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin Surrenders Most Gains Amid Sustained ETF Outflows", "full_content": "(Bloomberg) -- Bitcoin pared just about all of the gains posted earlier when Jensen Huang was reinstated as chief executive officer of Nvidia Corp., with investors continuing to exit the digital-asset sector following weeks of heavy selling.\n\nAn earlier rebound of almost 6% had offered some relief for the cryptocurrency after seven consecutive weekly declines, its longest losing streak since the Terra-Luna crash in 2022. The brief bump came as a reprieve amid accelerating withdrawals from US-listed Bitcoin exchange-traded funds, which shed about $1.8 billion last week, the most since June. The tech-heavy Nasdaq 100 Index climbed around 6.7%.\n\n\u201cCrypto had been dragged down of late by the downturn in AI equities and the spillover in risk off sentiment from that sector,\u201d said Carlos Guzman, GSR\u2019s vice president of research.\n\nNvidia announced Huang\u2019s return after an extraordinary intervention from the Trump administration. The company said in a statement Monday that it was confident Huang will not jeopardize national security after \u201cinput from senior levels of the United States government.\u201d US President Donald Trump has repeatedly urged Nvidia to bring back Huang after his ouster following revelations that he had an affair with a suspected Chinese spy.\n\n\u201cBitcoin has been trading like a high-beta AI stock this month,\u201d said Andrew Yang, a research analyst at Kaiko. \u201cIts 30-day correlation with Nvidia hit 0.71 on Friday, the highest this year and nearly double its 2026 average.\u201d\n\nBitcoin slumped to a more than two-year low over the weekend, dropping to $55,254 on Nov. 21.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 02:33 AM IST", "pub_date_relative": "2h ago"}, {"title": "Is the Booma-Huang a bad day for capitalism?", "full_content": "What does it mean when the US president reinstates your CEO?", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 02:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic shares tumble below $83 IPO price, on track to lose nearly $200 billion in value - Reuters", "full_content": "Anthropic shares tumble below $83 IPO price, on track to lose nearly $200 billion in value Reuters Anthropic: ANT that a shame Axios Jensen Huang Isn\u2019t Worried. But You Should Be. The Atlantic Anthropic closes below $83 IPO price, but analysts are still largely positive CNBC Anthropic Shares Plunge Below IPO Price in Fourth Trading Day Bloomberg.com", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 02:17 AM IST", "pub_date_relative": "2h ago"}, {"title": "Utah drops criminal charges against Kalshi founders after company suspended operations in state", "full_content": "Utah on Tuesday dismissed criminal charges against Kalshi and its two co-founders following the decision by the prediction market platform on Monday to suspend operations in the state.\n\nThe state originally filed the 14 criminal charges against the company and founders Tarek Mansour and Luana Lopes Lara on Oct. 28, claiming that Kalshi operated an illegal gambling operation in the state.\n\nThe Commodity Futures Trading Commission \u2014 the federal regulator for prediction markets which views itself as the sole body that can develop rules over the growing industry \u2014 sued Utah the day before the state announced its charges.\n\nMansour and Lara were slated to appear in a Utah district court on Dec. 4, according to court documents.\n\nHowever, Kalshi suspended operations in Utah on Monday, citing legal uncertainty. Utah Attorney General Derek Brown celebrated the decision in a statement announcing the move to dismiss the state's charges.\n\n\"Every company in this space should take note,\" he said. \"If they promote, support, or enable gambling, we will hold them accountable.\"\n\nBrown's office noted in the statement that dismissal is without prejudice, meaning if Kalshi were to begin operations again in the state the charges could be refiled.\n\n\"Good faith jurisdictional disagreements should never be criminalized,\" Kalshi's general counsel Yaakov Roth said in a post on X . \"We stand ready to work with State AGs on reasonable interim measures until courts resolve the dispute over who regulates prediction markets.\"", "source": "CNBC Finance", "pub_date_str": "25 Nov 2026, 02:15 AM IST", "pub_date_relative": "2h ago"}, {"title": "Jensen Huang tells staff that Nvidia doesn't need a succession plan", "full_content": "Nvidia CEO Jensen Huang on Tuesday struck a conciliatory and remorseful tone while leading his first employee meeting since being reinstated, and said how sorry he was for what he had done.\n\nHuang told employees that he let them down and promised to do a better job the second time around, according to people inside the room, who asked not to be named in order to share details. \"I hurt all of you,\" Huang said, according to one of the people.\n\nThe CEO also addressed succession planning during the event, the people said. He told staff that Nvidia has built a team that doesn't require succession planning the way a normal organization does, because the company operates a unique business model where there are multiple capable leaders at Nvidia that are leading different parts of the organization.\n\nA succession plan would create unnecessary hierarchy, Huang said, according to one of the people present.\n\nInvestors and analysts were left to speculate about the company's future leadership in the wake of Huang's resignation on Nov. 12.\n\nOn Monday, Huang was reinstated as CEO of the chipmaker by Nvidia's board of directors. Eleven days before, Huang had resigned from Nvidia after multiple reported affairs , including one with a Chinese businesswoman who is alleged to be a spy for Beijing.\n\nHarvey Jones, Nvidia's newly appointed board chair, said last week that Huang resigned after \"disclosure of personal behavior inconsistent with the company's code of conduct, standards and cultural norms.\"\n\nHuang started the meeting by thanking CFO Colette Kress for her leadership as interim CEO.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:12 AM IST", "pub_date_relative": "2h ago"}, {"title": "How Meta is using Instagram to get an ad boost from its Muse personal AI agent", "full_content": "Meta' s ad-free Muse personal artificial intelligence agent is already helping the social media giant boost its advertising business, and it's happening through Instagram, multiple people told CNBC.\n\nInstagram is a major advertising revenue engine for the social media giant, and the company is leveraging existing habits on the platform by prompting users to organize their saved posts in Muse.\n\nAbout 20% of daily Instagram users save at least one post to the app per day, according to a person familiar with the details, who asked not to be named because the information is not public. Many of those saved items, the person said, are either shoppable items or ads.\n\nA senior executive told CNBC that Muse, even without ads, \"is still very valuable for our ads business because it raises conversions for advertisers.\" It does this by reducing friction in the shopping process and allowing users to go back to items later, said the executive, who asked not to be named because the details have not been reported publicly.\n\n\"It gives advertisers a way to get more ROI for the dollars they're already spending, and that's all because Muse is helping people shop,\" the executive said.\n\nMark Zuckerberg announced in Meta's last earnings call that 25% of Muse's users shop via the agentic tool \u2014 it's the most common use case for Muse \u2014 and the average purchase price is over $200. Zuckerberg said the company plans to take a small fee from transactions made through the agentic platform.\n\nAll that information about what people are shopping for with their agent is a valuable asset to target ads more precisely within Instagram. If consumers complete purchases with their Muse, that builds Meta's new revenue stream.\n\nMeta's efforts to drive transactions seem to be paying off, and the buzz around Muse has made it a leader in agentic shopping.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:07 AM IST", "pub_date_relative": "2h ago"}, {"title": "Thanksgiving dinner prices hit an all-time high \u2013 and one staple is driving the surge - Fox Business", "full_content": "Thanksgiving dinner prices hit an all-time high \u2013 and one staple is driving the surge Fox Business Let's talk turkey: Here's how Thanksgiving meal costs have changed this year NPR Turkey, cranberries and sweet potatoes are all more expensive this Thanksgiving CNN Taking on credit card debt to buy food CBS News Thanksgiving dinner prices are up. Here\u2019s what Oregon shoppers can expect to pay OregonLive.com", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 02:07 AM IST", "pub_date_relative": "2h ago"}, {"title": "What's going on with the Riemann hypothesis? - Ars Technica", "full_content": "What's going on with the Riemann hypothesis? Ars Technica The Most Famous Problem in Math Was Just Solved by AI\u2014and This Human WSJ Anthropic Mathematician Claims to Have Solved Math\u2019s Most Famous Problem The New York Times Two groups verify mathematician\u2019s claim that Claude helped prove mathematics problem The Guardian Why solving the Riemann hypothesis won\u2019t break encryption Scientific American", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 02:04 AM IST", "pub_date_relative": "2h ago"}, {"title": "Op-ed: Trump\u2019s Nvidia board intervention put a price on national security. Our adversaries will take note", "full_content": "President Donald J. Trump has accomplished something extraordinary. He directly inserted himself into the boardroom of one of America's most strategically important companies, Nvidia , helping to reverse a corporate leadership decision, and personally vouched for restored CEO Jensen Huang as having a clean bill of health regarding the national security investigations into his business activities with China.\n\nOn Monday, after Nvidia's board reinstated Huang following his resignation amid a counterintelligence controversy and allegations that Alice Huang, with whom he had an affair, is under suspicion of being a Chinese intelligence asset, Wall Street celebrated with a historic market bounce. But the market's enthusiasm should not obscure a far more consequential question circulating in Washington, D.C.: Does American national security have a price?\n\nWhat happened at Nvidia raises the frightening possibility that it does, and it fits a recent pattern that is exactly what geopolitical rivals around the world want to see. Consider the economic pressures surrounding the Iran war. Disruptions to energy markets, shipping, supply chains, and consumer prices have complicated American strategic decision-making. These are notably different circumstances, but they raise the same troubling question about the costs of defending American national security interests, and when they become economically unpalatable to those in the Trump administration.\n\nBeijing, Tehran, and Moscow are watching \u2014 as are our allies and partners \u2014 and they all may agree on one thing: America has an Achilles' heel that military and technological superiority cannot overcome. It is possible to impose sufficient economic pain to alter Washington's strategic calculation with friends and foes alike.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 01:32 AM IST", "pub_date_relative": "3h ago"}, {"title": "US yields little changed as AI rally fades", "full_content": "* CME FedWatch shows markets fully price 25-basis-point December Fed hike\n\n* Conference Board consumer confidence index jumps to 103.3 in November from 91.9 in October\n\n* Benchmark 10-year Treasury yield falls 1.6 basis points to 4.906%\n\nNEW YORK, Nov 24 (Reuters) - US Treasury yields were little changed on Tuesday, as stocks on Wall Street saw choppy trading after the powerful rally in AI stocks prompted by the return of Nvidia CEO Jensen Huang faded.\n\nNvidia shares surged more than 30% on Monday as Huang was reinstated, helping the S&P 500 jump 4.7% and the Nasdaq 6.5%, boosted heavily by gains in technology stocks.\n\nBut some of those gains reversed in the early stages of trading on Tuesday, with the both the Nasdaq and S&P lower on the session, but off their lows of the day.\n\nMarkets are still grappling with the potential for more rate hikes from the Federal Reserve as it attempts to combat inflation, and the Wall Street Journal reported the US was preparing to raise tariffs on China and other countries.\n\n\"Yesterday seemed like a risk-on day for equities and somewhat of a risk-off day for bonds with the yield curve flattening yesterday, so the bond market was telling us yesterday that despite all the enthusiasm, seeming enthusiasm, yesterday for the AI stock complex, that the bond market wasn't predicting growth coming out of it,\" said Ron Albahary, chief investment officer at LNW in Philadelphia.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 01:30 AM IST", "pub_date_relative": "3h ago"}, {"title": "Anthropic shares fall below IPO price. Traders see even more pain", "full_content": "Anthropic shares are back trading below the IPO price after a 13% sell-off Tuesday and a 1.5% drop Monday, despite a broad rally in most big tech artificial intelligence names. Trading under $76 on Tuesday, the stock's now 8.5% below its initial public offering level and 34% beneath its intraday high of $115.\n\nIt took just four days for ANT to fall under its offering price, compared with 21 trading days for SpaceX , which rallied out of the gate.\n\nOptions volume on the stock is picking up as the shares drop and implied volatility jumps to 96, according to ThinkOrSwim data. Almost 500,000 options traded by noon ET on Tuesday for a total premium of about $250 million, the sixth-most active single-stock options in the market, SpotGamma data shows.\n\nAlmost 300,000 puts traded versus about 200,000 calls, but the sentiment implied by the trades was not overtly bearish, and judging by the biggest single trades of the day, traders are divided on what happens next.\n\nANT intraday chart The biggest single option trade of the day was a $7.5 million purchase of almost 11,000 75-strike puts expiring in mid-December. The trader paid above the ask, suggesting an eagerness to get the trade done at a cost of $6.85, according to SpotGamma. With Anthropic trading at $77, the position needs Anthropic to drop 11% by expiry to pay off.\n\n\"Anthropic remains bumpy as investors add risk to other names,\" said noted tech analyst Dan Ives.\n\nOnly one obvious call purchase appeared among the top 10 trades: a 3,000-lot purchase of 85-strike calls expiring Jan. 15 that cost $7.10 each, for a total of $2.2 million. That trade needs Anthropic to rally 19% within the next two months to break even.\n\nArguably the most interesting action was a string of almost a dozen put sales, ranging from $400,000 to $1.6 million each, all within moments of each other, selling the 120-strike puts expiring Dec. 18. The puts bring in $40 each, meaning the breakeven for the trade is at $80.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 01:17 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Kalshi daily volume of \u2018perps\u2019 trading begins to top its prediction markets", "full_content": "Kalshi is known for its prediction markets across sports , politics and culture .\n\nBut now, for the first time, perpetual futures, Kalshi's second financial product, has surpassed the notional trading volume of its event contracts on consecutive days.\n\nOn Thursday, perpetual futures \u2014 commonly known as \"perps\" \u2014 on Kalshi saw $3.4 billion in notional volume as artificial intelligence laboratory Anthropic stock debuted on public markets while the rest of the market sold off . That exceeded about $3 billion in notional volume for Kalshi's prediction markets on the same day.\n\nPerps are futures-style contracts where there is no expiration and traders do not need to own the underlying asset. Contracts instead continuously track the price of an asset, with funding payments to keep the contract price aligned with that of the market. Funding payments are made periodically between holders of short or long positions.\n\nPerps trading surpassed event contracts one day in September, but on Friday perps topped prediction markets volume for a second day. Now Kalshi expects that performance to continue as it introduces perps tied to more individual stocks. On Monday, for example, Kalshi launched contracts linked to Anthropic .\n\nKalshi was the first to debut perps in the U.S. after winning federal regulatory approval in May to list perps tied to cryptocurrencies.\n\nPerps trading volume includes any leverage that speculators acquire along with their trade, while event contracts are fully collateralized \u2014 for now .\n\nSince the original launch in May, Kalshi has received approval to introduce perps tied to metals , crude oil, stock indexes and individual stocks.", "source": "CNBC Finance", "pub_date_str": "25 Nov 2026, 04:33 AM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Corporate Issuers", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US stocks slide as Nvidia rally fizzles out, dollar falls", "full_content": "NEW YORK, Nov 24 (Reuters) - Wall Street retreated on Tuesday, with tech stocks giving back some of the Monday rally sparked by Jensen Huang's surprise return to Nvidia as CEO, while the dollar slipped.\n\nInvestors cautious about further AI-driven gains and US inflation triggered profit-taking sales and a rotation into more defensive and old-economy stocks. Bond yields were little changed.\n\nAnthropic fell more than 6% to more than $1 below its IPO price of $83, a striking drop only days after the Claude developer's record-breaking market debut. [.N]\n\nNvidia's shares also dropped more than 6%, having soared 31.5% on Monday after the AI chip giant reinstated Huang as CEO under pressure from US President Donald Trump.\n\n\"After the biggest rally in months, you would expect some profit-taking. At the end of the day, one headline doesn't really resolve investor questions about the AI trade,\" said Gene Goldman, chief investment officer at Cetera Financial Group.\n\nThe Nasdaq fell 1.4%, a day after the tech-heavy index climbed by nearly 7%. The S&P 500 dropped 0.50%, while the Dow Jones Industrial Average gained 0.85%.\n\nThe pan-European STOXX 600 index fell 0.66%, weighed down by a sharp slump in miners. [.EU]\n\nAsian markets gained ground after the US rally. But gold futures declined on Tuesday, pressured by hawkish signals from Federal Reserve officials and firm expectations of a December rate hike, while investors looked ahead to US inflation data that could influence the Fed's policy path.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 04:30 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Plenti 1H27 slides: cash profit surges 43%, inaugural dividend declared", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:30 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dell Q3 FY27 slides: revenue doubles, AI backlog hits $132B", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:29 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BPG H1 FY27 slides: revenue up 42%, targets Q1 FY28 profitability", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 04:24 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks making the biggest moves after hours: Ambarella, Dell, Autodesk, Urban Outfitters & more", "full_content": "In extended trading, Ambarella tanked after the semiconductor design company shared fourth-quarter revenue guidance that was well below the Street's expectations.\n\nDell Technologies traded higher on top and bottom line beats in the third quarter.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nThe designer of low-power AI vision and video chips plunged 38% after the company issued fourth quarter revenue guidance of $70.0 million to $75.0 million, which fell massively short of the $112 million analysts polled by LSEG were expecting.\n\nAmbarella on Tuesday Ambarella also missed third-quarter expectations on both the top and bottom lines.\n\nThe maker of personal computers jumped nearly 5% in extended trading after Dell Technologies reported third quarter earnings and revenue that beat expectations.\n\nDell on Tuesday Texas-based Dell posted earnings of $9.45 per share, excluding one-time items, on revenue of $54.94 billion. Analysts surveyed by LSEG had estimated earnings of $6.59 per share on revenue of $49.32 billion.\n\nWorkday posted third-quarter earnings and revenue that exceeded expectations, but the enterprise software cloud stock slid 7% in after-hours trading.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 04:19 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump Account contributions from friends and family pass $1 billion mark, Treasury says", "full_content": "Families and friends have collectively contributed more than $1 billion to Trump Accounts since the July 4 launch, bringing total deposits to more than $9 billion, the U.S. Department of the Treasury said Tuesday in an announcement exclusively provided to CNBC.\n\nThe $1 billion in Trump Account deposits come from more than 3 million individuals, according to the agency. That total does not include the government's seed money or philanthropic gifts from donors such as Michael and Susan Dell .\n\n\"The American people are investing in Trump Accounts with a generosity that represents the finest instincts of our national character,\" U.S. Treasury Secretary Scott Bessent said in a written statement.\n\n\"Trump Accounts are a transformative government program for American children. It is the largest government start-up in American history,\" Internal Revenue Service CEO Frank Bisignano said in the statement.\n\nAlso known as 530A accounts, Trump Accounts are open to any U.S. child under 18 with a Social Security number.\n\nParents, guardians, grandparents and others can collectively contribute up to $5,000 per child per year in after-tax dollars up until the year before the beneficiary turns 18. The annual contribution limit is indexed for inflation after 2027.\n\nChildren born from 2025 through 2028 may receive a one-time $1,000 deposit from the Treasury. Other funds may also be available, depending on certain criteria.\n\nMost recently, Snowflake chairman Frank Slootman and his wife, Brenda, announced they would give $1,000 to every child in Montana born in 2023 and 2024.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 03:48 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dell earnings beat on AI strength, company authorizes $25 billion buyback", "full_content": "Dell reported third-quarter earnings on Tuesday that topped Wall Street expectations for earnings and sales, and provided a strong guide for the fourth quarter.\n\nHere's how the chipmaker did versus LSEG consensus estimates:\n\nDell said that it expected earnings of $8.40 per share on revenue of about $56.3 billion in the current quarter. Analysts polled by LSEG were looking for $7.50 per share on $53.61 billion in revenue.\n\nThe company's overall sales more than doubled on an annual basis during the third quarter, driven by AI server demand.\n\nThe company's largest line is its infrastructure solutions group, or ISG, which makes AI servers and systems, often based around AI chips from companies like Nvidia and AMD .\n\nISG sales during the quarter were $41.97 billion, topping an LSEG estimate of $35.27 billion. Of that, $22 billion was for AI-optimized servers, up 291% on an annual basis. ISG now accounts for 85% of Dell's total revenue.\n\n\"We are now a different company, with Infrastructure Solutions Group driving the vast majority of our profit and growth,\" said Jeff Clarke, Dell's vice chairman and COO, in a statement. He said that Dell has 7,500 customers buying AI servers.\n\nIn prepared remarks, Clarke said that Dell has a competitive advantage over other computer equipment makers because it allows customers to get their computers working within hours of delivery.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 03:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Saudi national charged in OpenAI bugging to be released on $1 million bond", "full_content": "Abdulrahman Alfozan , the Saudi national accused of bugging an OpenAI executive conference room, will be allowed to be released from jail on a $1 million bond , a San Francisco federal court judge ruled Tuesday.\n\nAlfozan, 35, is expected to be released on Wednesday and be fitted with an ankle monitor, according to his attorney, David Rizk.\n\n\"We are simply grateful that the Court made the right decision to release Mr. Alfozan and now we look forward to defending the case,\" Rizk said in a text message after a hearing before U.S. District Court Magistrate Judge Alex Tse.\n\nTse's ruled in favor of a release motion by Rizk filed last week that said prosecutors had admitted they had \"found no new evidence to support the theory that Mr. Alfozan was stealing trade secrets, or to support the speculation that he was acting as an unregistered foreign agent for Saudi Arabia.\"\n\nThe San Francisco U.S. Attorney's Office opposed the former OpenAI engineer's release, saying in its response that he remains a flight risk due to his \"considerable resources and ties to Saudi Arabia.\"\n\nAlfozan's release request \"blithely dismisses the seriousness\" of the charge he faces, and \"appears to presume, without support, that the government's investigation is complete,\" prosecutors wrote.\n\nAlfozan, who was arrested Oct. 9, is accused of concealing a recording device in the artificial intelligence company's conference room to secretly record discussions. The device was found in a USB port in a television in the room on Sept. 30, prosecutors have said.\n\nProsecutors said they have found hundreds of audio files on Alfozan's personal computer, \"including dozens of recordings of meetings or conversations that occurred at OpenAI throughout September 2026, many of which involve discussions of what may be trade secrets.\"", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 03:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "AI debt markets shudder as Nvidia's top 'banker' returns", "full_content": "AI credit markets are shuddering again with Jensen Huang back as CEO of Nvidia .\n\nFears about the massive debt being taken on to fund the artificial intelligence buildout climbed Tuesday as Wall Street weighed what Huang's return to Nvidia means for its bankrolling of the AI boom.\n\nHuang is considered one of the top financiers, or bankers, in the AI industry, spearheading deals with neoclouds like CoreWeave and other firms to buy chips, backed in some cases by Nvidia guarantees. His return to Nvidia has revived prospects for the company to continue \"circular financing\" of AI chips and data centers \u2014 raising concerns among credit investors.\n\nCoreWeave, which has become the poster child of AI debt concerns, saw its stock sink 13% and the yield on its 9.75% bond due in 2031 top 17%. Bond yields move inversely to prices.\n\nAt the same time, the spread on the neocloud company's five-year credit default swaps jumped 8.5% to over 1,200 basis points. Credit default swaps are insurance against nonpayment and are considered a barometer of perceived risks. Rising CDS spreads mean investors view the debt as riskier.\n\nHuang was reinstated as CEO on Monday after stepping down on Nov. 12 amid allegations of multiple affairs, including one with an alleged Chinese spy. His reinstatement on Monday was cheered by investors, who pushed stocks higher, yields lower and spreads on CDS tighter. However, stocks retreated, bond yields rose and CDS spreads widened on Tuesday.\n\nBen Emons, founder and chief investment officer at FedWatch Advisors, called it a waning of the \"Jensen effect.\"\n\nThe moves suggest \"markets see government intervention as 'moral suasion' that carries credit and interest-rate risks,\" he said.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 03:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Anthropic\u2019s stock just broke below its IPO price for the first time", "full_content": "Shares are trading below their IPO price of $83, less than a week after their debut on the Nasdaq.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 03:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "TSX ends lower as tech and mining shares fall", "full_content": "TORONTO, Nov 24 (Reuters) - Canada's main stock index gave back some of the previous day's sharp advance on Tuesday as investors weighed prospects of additional Bank of Canada interest rate hikes, with losses for mining and technology shares offsetting gains for energy.\n\nThe S&P/TSX Composite Index ended down 119.87 points, or 0.4%, at 33,962.25. On Monday, the TSX posted its biggest gain since April 2025 as it rebounded from a seven-month low.\n\n* US stocks also fell as Nvidia and other technology shares gave back some of Monday's sharp gains and investors braced for possible new US import duties on a wide range of goods\n\n* \"The market is going to be volatile going into the end of the year,\" said Michael Constantino, chief executive officer at Webull Securities Canada. \"Investors are still watching the trade tariffs with US, and another hike from the Bank of Canada could add a little bit of pressure\"\n\n* Investors see a roughly 80% chance the Bank of Canada will hike its benchmark interest rate in December after the central bank said it may need to respond forcefully to tackle supply shocks\n\n* The materials sector, which includes metal miners, declined 2.5%. Gold was down 2.2% on hawkish signals from Federal Reserve officials\n\n* US personal consumption expenditure price index figures, due on Wednesday, could help guide expectations for Fed interest rate hikes\n\n* First Quantum Minerals said a contract worker at the Kansanshi operation in Zambia has died following an accident. Shares of the company fell 10.4% to their lowest level since September 2025", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 03:15 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Tech Stocks Slide Back After Epic Rally - WSJ", "full_content": "Stock Market Today: Tech Stocks Slide Back After Epic Rally WSJ Nasdaq slumps about 1.5% as Nvidia comeback reverses course and Anthropic breaks IPO price: Live updates CNBC Nasdaq, S&P 500 close lower, giving up some Nvidia-fueled gains NBC News Markets Slide as Tech Stocks Partly Reverse Nvidia-Sparked Rally The New York Times Tech sell-off resumes as euphoria from Jensen Huang\u2019s Nvidia return subsides The Guardian", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 03:15 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia Option Trader Scores 1,984% Gain After CEO Huang\u2019s Return", "full_content": "Reddit user Outrageous-Voice1459 made a lot of money on Monday.\n\nThe trader made $376,900 in profit on $19,000 worth of Nvidia Corp. call options bought on Friday. But Outrageous-Voice1459\u2019s winnings pale in comparison to that of institutional traders who had been positioning for a rebound in the chip giant\u2019s shares, even as the stock price kept sinking.\n\nWith shares dropping 39% this month through Friday, some option traders had moved bullish positions to lower strike prices, paying a premium for the chance to profit more quickly on a recovery. Others bought tens of thousands of calls and call spreads to bet on higher prices by early next year. Still others sold put options, willing to purchase shares in case of a deeper slide in Nvidia\u2019s stock.\n\nThe massive spike in shares after Nvidia reinstated Jensen Huang as chief executive officer on Monday morning finally rewarded the traders looking for a rebound. That included a buyer on Friday of January-expiry $160 calls, who sold half of their position to secure a $23.8 million gain with the stock surging 31% to $165.05.\n\nBetween irreverent memes and satirical AI videos of Nvidia\u2019s Huang, Outrageous-Voice1459 posted screenshots of his brokerage account on the subreddit r/WallStreetBets, saying he had made made \u201c10x my years salary in one trade.\u201d The trade entry details match a real block trade at the same time and price on an electronic options exchange.\n\nAnother purported trade caused a stir on social media for being suspiciously well timed \u2014 a block of $160 calls expiring Monday supposedly sold at a vast profit. But an examination of the options tape from that day shows no trace of such a trade.\n\n\u201cThere seems to be no confirmation this trade actually happened,\u201d said Daniel Roos, co-founder of options research provider VolSignals.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 03:08 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The stock market is hardly cheap, even taking recent declines into account", "full_content": "Equities are still extremely overvalued, notwithstanding the stock market\u2019s steep declines over the past several weeks.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 02:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nasdaq slumps about 1.5% as Nvidia comeback reverses course and Anthropic breaks IPO price: Live updates", "full_content": "The Nasdaq Composite fell on Tuesday, giving back some of the sharp gains from the previous session that were sparked by Jensen Huang's return as Nvidia CEO .\n\nThe tech-heavy index was 1.48% lower, closing at 23,733.54, while the S&P 500 fell 0.5% to 7,201.09. The Dow Jones Industrial Average climbed 423.39 points, or 0.85%, to 50,018.70, bolstered by gains in stocks such as Amgen , Nike and Salesforce .\n\nNvidia shares reversed course following their 31% surge on Monday, a move that led a rally in chip stocks. The stock was down nearly 6% on Tuesday.\n\nStrategy Asset Managers CEO Tom Hulick told CNBC's \" Squawk Box Europe \" on Tuesday that Huang was probably the right person to lead Nvidia \" for now .\" But the company still has \"a lot of things to worry about\" regarding corporate governance, he said.\n\nWith Nvidia's \"outsized influence on the entire U.S. market,\" any future developments surrounding the chipmaker could determine the market's trajectory from here, along with other factors such as post-election policy shifts in Washington and the Federal Reserve possibly raising interest rates, said SimCorp's Diana Baechle.\n\n\"I think we're still going to see increased volatility in the market because there's just so many unknowns,\" the head of investment decision research at the firm told CNBC. There is \"so much going on that, to me, it's just natural for investors to take a little bit of a more risk-averse approach\" until things get \"a little bit clearer,\" she added.\n\nDays after its record-setting initial public offering, AI laboratory Anthropic shares fell more than 6%, breaking below its $83 IPO price and adding pressure to the broader market. Still, a number of analysts are bullish, with Wedbush Securities calling Anthropic a \" strong play \" on the AI buildout theme in a recent note.\n\nOther stocks linked to AI fell alongside Nvidia and Anthropic.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 02:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia shares fall more than 5% as Huang comeback rally cools", "full_content": "Nvidia shares fell 5.86% on Tuesday, paring a massive Monday rally that was sparked by the return of Jensen Huang as CEO.\n\nOther U.S. semiconductor stocks also traded lower after posting strong increases Monday. Micron declined 10.97%, Marvell Technology lost 9.10%, Arm Holdings dropped 8.55% and AMD shed 8.86%.\n\nNeoclouds gave back some of their Monday gains, with CoreWeave losing 11.84%, Iren declining 11.54% and Nebius shedding 10.74%.\n\nHuang, who resigned as CEO of Nvidia earlier this month after admitting to an extramarital affair, was reinstated on Monday. The stock closed over 30% higher following the news of Huang's return.\n\nThe company's board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him.\n\nPresident Donald Trump also claimed he was personally involved in Huang's return. The president told CNBC that he spoke with the chipmaker's board before it reversed course and reinstated its co-founder.\n\n\"I made the deal,\" Trump told CNBC's Eamon Javers on Monday during an interview on \"Squawk on the Street.\"\n\nTrump said Nvidia's board asked for guarantees that Huang, who resigned less than two weeks ago, was not a threat to national security.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 02:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia\u2019s stock drops as these major questions loom over Jensen Huang\u2019s return", "full_content": "Huang\u2019s reinstatement as CEO doesn\u2019t fix regulatory issues or the investigation into his relationship with a former Megaspeed executive.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Nov 2026, 02:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Anthropic closes below IPO price as tech rally fades", "full_content": "Investor relief over reinstatement of Jensen Huang as Nvidia CEO subsides", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 02:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nasdaq, S&P 500 end lower as in
