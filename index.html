w when revision is allowed", "full_content": "For taxpayers required to get their accounts audited for assessment year (AY) 2026-27, the deadline to furnish the tax audit report is 30 September.\n\nTaxpayers who have already filed their tax audit report should revisit the disclosures to check for errors, omissions, or inconsistencies that may need correction.\n\nIsha Sekhri, Founder, Isha Sekhri & Associates LLP, said some of the common errors relate to basic business and tax details, as well as newly revised reporting requirements.\n\nSekhri said revision of a tax audit report should be treated as an exception rather than a routine exercise. Technically, the law does not create a separate legal category of a \u201cpre-due-date revision\u201d. If an error is discovered after the report has been filed, the report can be revised either before or after 30 September.\n\nHowever, she said a revision cannot be used to change the underlying accounting position. For instance, a change in the accounting method or the recharacterisation of income, such as changing business income into capital gains, would typically not be allowed. In general, taxpayers must ensure revisions are bona fide or genuine.\n\nYes. Sekhri said a tax audit report can be revised after 30 September and must be furnished before the end of the relevant financial year, i.e., by March 31, 2027, for FY 2025-26.\n\nShe explained that the report can be revised for the following reasons:\n\nThere is no fundamental difference in the process merely because the revision happens before or after 30 September, Sekhri noted.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 09:29 PM IST", "pub_date_relative": "15m ago"}, {"title": "Mushtaq Khan Dies At 56: Welcome, Gadar Actor Passes Away After Cancer Battle", "full_content": "Mushtaq Khan's memorable roles included Ballu in Welcome and Gul Khan in the Gadar franchise, while his filmography also featured Stree, Wanted and Oh My God!.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 09:27 PM IST", "pub_date_relative": "16m ago"}], "cfa": [{"title": "Darden Restaurants stock falls as Olive Garden reports slower growth", "full_content": "Darden Restaurants on Thursday reported quarterly earnings and revenue that narrowly missed analysts' expectations as same-store sales growth at Olive Garden slows.\n\nShares of the company fell as much as 5% in premarket trading but pared back their losses as executives reassured investors on the company's earnings conference call. The stock was down about 2% in morning trading.\n\nShort-term challenges like consumers' cyclospora concerns and the World Cup tournament weighed on Darden's same-store sales during the quarter, executives said. However, CEO Rick Cardenas said that Darden's restaurant chains are performing better in September, and costs of key commodities, like beef, are projected to improve later in the fiscal year.\n\nHere's what the company reported for the quarter ended Aug. 30 compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nDarden reported fiscal first-quarter net income of $233.4 million, or $2.04 per share, down from $257.8 million, or $2.19 per share, a year earlier.\n\nThe company's same-store sales increased 3.1% during the fiscal quarter as each of Darden's business units reported growth. But the World Cup weighed on demand for Darden's restaurants early in the quarter, dragging the company's same-store sales down by 80 basis points, or 0.8%, CFO Raj Vennam said.\n\nLongHorn Steakhouse was once again the top performer of the portfolio this quarter, as same-store sales rose 6.2%. The chain has overtaken Olive Garden to become Darden's top performer, although it still accounts for a smaller share of the company's overall revenue.\n\nOlive Garden saw its same-store sales inch up 1.1%. While it is still the company's largest chain by both number of locations and sales, Olive Garden has seen its growth weaken as diners have become more choosy about their spending.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 09:43 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Govt To Ask IBA To Ensure 0.4% MDR On UPI Is Not Passed On To Consumers: Sources", "full_content": "The government is expected to ask Indian Banks' Association to devise a mechanism to ensure that merchant discount rate charge of 0.4% is not passed on to consumers, according to official sources.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 09:38 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Stockbrokers approach Union government over proposed UPI charges", "full_content": "Stockbrokers in India have made a representation to the Union government to express their concerns over a merchant discount rate being levied on Unified Payments Interface (UPI) transactions, Securities and Exchange Board of India (Sebi) chief Tuhin Kanta Pandey said at a press conference following the regulator\u2019s board meeting on Thursday.\n\nThe merchant discount rate (MDR)\u2014a fee charged to merchants on digital payments and distributed among banks and payment service providers\u2014will apply to certain UPI transitions from 15 October, the National Payments Corporation of India (NPCI) announced on 15 September.\n\nUnder the framework, person-to-merchant (P2M) UPI transactions above \u20b9 2,000 will incur a 0.4% fee. For transfers of \u20b9 75,000 or more, the MDR is capped at \u20b9 300 per transaction. This cap also applies to capital-market transactions involving securities, mutual funds, and brokers, which will attract a reduced MDR of 0.02%.\n\nPandey noted that capital markets face distinct challenges compared to standard merchants, adding that the regulator has already gathered feedback to evaluate potential regulatory solutions and ensure these concerns are effectively represented.\n\nMint reported on 16 September that the BSE Brokers' Forum had submitted a representation asking Sebi to examine these concerns, which could significantly affect discount brokers operating on thin margins.\n\nThe upcoming rules present a challenge for stockbrokers accepting investor payments via UPI. Under Sebi mandates, all registered brokers must display and use valid UPI handles on their websites to ensure funds are transferred strictly to verified accounts. However, brokers worry that the MDR on merchant UPI transactions could exceed the brokerage fees earned from resulting trades.\n\nFund transfers into a trading account do not guarantee a trade.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 09:36 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "MGM Resorts shares sink 9% after Barry Diller's People Inc. rescinds takeover offer", "full_content": "Barry Diller's People Inc. has rescinded its proposal to buy MGM Resorts International , sending shares of the casino giant down 9% on Thursday.\n\nThe update comes nearly four months after Diller's company offered to purchase MGM Resorts for $48.30 per share. People Inc. already owns a roughly 26.1% stake in MGM.\n\nDiller, chairman of People Inc. \u2014 formerly known as IAC \u2014 attributed the decision to the complicated nature of the deal.\n\n\"There are lots of ingredients that go into a proposal of this kind on its way to completion,\" Diller said in the press release. \"We didn't feel the mix was coming together in the way we had hoped and have decided not to pursue taking the company private at this time.\"\n\nCNBC's David Faber reported Thursday that Diller backed off the deal in part because of the significant debt load it would have created for the company.\n\n\"We at People Incorporated remain open to and interested in the possibility of a strategic transaction with MGM Resorts and look forward to considering a range of alternatives,\" he said in the release.\n\nEarlier this week, shareholders of Caesars Entertainment approved an offer from billionaire Tilman Fertitta to acquire the casino company for $17.6 billion. Caesars shareholders will receive $31 per share in cash.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 09:36 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The 'Magnificent Seven' is bucking the market trend. Why the jump in Treasury yields may be helping", "full_content": "The tech giants surged to all-time highs this week, a surprising show of strength given that the group has floundered for much of this year.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 09:35 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Rs 10,000 A Month Into Crypto Vs Rs 10,000 Into Mutual Funds: What Changes Over Five Years?", "full_content": "Assuming an annualised return of 12% for a mutual fund SIP, the Rs 10,000 monthly investment over five years would grow to around Rs 8.17 lakh.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 09:34 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Top breakout stocks to buy tomorrow: ITC Hotels, RR Kabel, MCX, Texrail, UBL by Sumeet Bagadia | Targets", "full_content": "Sumeet Bagadia, Executive Director at Choice Broking, has recommended five stocks \u2014 ITC Hotels , RR Kabel, MCX , Texrail and UBL \u2014 based on their technical setups and price Momentum . His recommendations, along with stop-loss and target levels, are as follows:\n\nSumeet Bagadia said ITC Hotels has strengthened its daily-chart setup after breaking above the previous high, with a noticeable increase in volume signalling stronger participation behind the price move. The breakout indicates renewed buying interest and a potential continuation of the prevailing upward momentum. On the hourly chart, the stock is maintaining a clear sequence of higher highs and higher lows, further reinforcing the positive short-term price structure. The alignment of the daily breakout with improving hourly price action keeps the setup technically constructive. The 157 level remains the key downside marker, while continued formation of higher highs could carry the stock towards the 178 objective.\n\nOn RR Kabel , Bagadia said the stock is displaying a positive technical shift on the daily chart after breaking out from a well-defined sideways trading range, indicating renewed demand and improving price participation. The stock is also sustaining above the 21-Day EMA, which supports the developing short-term trend and strengthens the breakout structure. Momentum signals are encouraging as the RSI shows bullish divergence, suggesting underlying strength despite earlier price consolidation. This combination of range expansion, EMA support and improving momentum keeps the setup constructive. The 2,400 level should be closely monitored as the key risk zone, while sustained strength above the breakout area may extend the move towards 2,780.\n\nBagadia said MCX is demonstrating strong bullish momentum after taking firm support at its 50-Day EMA and staging a decisive breakout above a multi-month falling resistance trend line.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 09:34 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "White House blocks reporters despite judge\u2019s order to restore access", "full_content": "Secret Service officers refused to allow some journalists from three media outlets \u2014 MS NOW, CNN and Politico \u2014 to enter the White House on Thursday morning, despite a federal judge's new order temporarily lifting President Donald Trump 's ban on those outlets.\n\nOther journalists from the same outlets were allowed to enter the White House. CNBC has requested comment from the White House on the situation.\n\nJudge Timothy Kelly later Thursday ordered Trump and other defendants in a lawsuit by the outlets to respond by 12:30 pm. ET to their new court filing notifying him of non-compliance with his temporary restraining order against the president's ban .\n\nKelly issued that TRO, which will last for at least two weeks, late Wednesday night. It directed the White House to \"immediately\" restore access to the three outlets.\n\nThe outlets had been blocked from entering the White House since Saturday, a day after Trump announced his ban.\n\nThe president had initially said he was blocking the outlets from the White House because of \"cumulative stories\" that contained lies about him and his administration.\n\nThe outlets in their civil complaint said that statement by Trump, and subsequent ones, bolstered their claim that he was violating their First Amendment rights to a free press by targeting them for what they reported about him.\n\nIn his order Wednesday in U.S. District Court in Washington, Kelly said the three outlets had shown they were likely to win their lawsuit challenging Trump's ban, \"at least on their Fifth Amendment due process claim.\"", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 09:32 PM IST", "pub_date_relativ accounting method or the recharacterisation of income, such as changing business income into capital gains, would typically not be allowed. In general, taxpayers must ensure revisions are bona fide or genuine.\n\nYes. Sekhri said a tax audit report can be revised after 30 September and must be furnished before the end of the relevant financial year, i.e., by March 31, 2027, for FY 2025-26.\n\nShe explained that the report can be revised for the following reasons:\n\nThere is no fundamental difference in the process merely because the revision happens before or after 30 September, Sekhri noted.", "source": "LiveMint Money", "pub_date_str": "24 Sep 2026, 09:29 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UBS initiates five AI Infrastructure stocks, sees 36% upside", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 09:27 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trump, Xi to talk Taiwan, AI, trade and Iran as DC summit kicks off", "full_content": "President Donald Trump and Chinese Leader Xi Jinping are meeting at the White House on Thursday for high-stakes talks focusing on trade , artificial intelligence and the Iran war \u2014 in between displays of military fanfare and a lavish banquet.\n\nTrump said in an arrival ceremony speech that the two countries have been \"working to encourage a more balanced trading relationship,\" and that the leaders plan to discuss \"pressing issues\" around security, technology and AI.\n\nTreasury Secretary Scott Bessent said Wednesday evening that the countries have agreed to extend their temporary trade truce , which lowered U.S. tariffs and suspended Beijing's controls on exports of rare earths and critical minerals, among other stipulations. That agreement, which was set to expire in mid-November, will be extended by two months to Jan. 10, Bessent told Fox News.\n\n\"The decisions we make in these areas today can promote peace and prosperity for decades and decades to come,\" Trump said in Thursday's remarks.\n\nXi joined in the bonhomie. \"China and the United States, as two major countries, stand to gain from cooperation and will both lose in confrontation,\" he said in his own remarks, which were translated live.\n\n\"We do not need to avoid mentioning competition, but our competition should be a healthy one and should be kept within bounds. It should be a race of catching up with one another, not a wrestle in which one either wins or loses,\" he said.\n\nXi also engaged in the Chinese specialty of \"panda diplomacy,\" announcing that two pandas will be coming to Georgia's Zoo Atlanta in the coming days.\n\nWhile China analysts broadly predict the leaders' personal relationship and policy goals will result in a cautious summit that yields few major deliverables, their latest face-to-face nevertheless carries real geopolitical risk .", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 09:25 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Oracle sends 'force majeure' notice about data center project \u2014 stock sinks 5%", "full_content": "Oracle shares fell 5% on Thursday following news that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\n\"Project Jupiter remains on our planned schedule,\" an Oracle said in a statement to CNBC. \"We are fully committed to New Mexico and confident in our path forward.\"\n\nBloomberg was first to report the news, citing sources familiar with the matter.\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it fails to come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital , CNBC confirmed. Blue Owl also saw its shares fall on Thursday.\n\n\"This notice does not change the financial commitments to this multi-year project,\" Blue Owl Capital said in a statement to CNBC.\n\nThe New Mexico data center project, which is part of the broader Stargate artificial intelligence infrastructure buildout with President Donald Trump , has been riddled with setbacks and regulatory hurdles.\n\nThat includes local opposition to data centers ahead of the upcoming midterm elections and concerns from environmental groups.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 09:24 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Brazil central bank says 2027 slowdown key to inflation convergence", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 09:24 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "30-year Treasury yield hits highest level since 2004 as bond market rout continues", "full_content": "U.S. Treasury yields continued their upward momentum after hitting a 19-year high on Wednesday.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 09:11 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi expands bullion vaulting framework to ETFs, derivatives; vault manager net worth raised", "full_content": "Sebi expanded its vault managers framework beyond Electronic Gold Receipts to cover bullion underlying specified ETFs and derivatives, while raising vault managers\u2019 net-worth requirement to Rs 75 crore and strengthening security, segregation, compliance and governance requirements.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 09:11 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Analysis: Higher Treasury yields deliver a reality check on a hot, inflation-prone economy", "full_content": "Elevated Treasury yields will complicate both Federal Reserve policy and Treasury financing.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 09:10 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tehran-Dubai Flights Grounded As UAE Halts Iranian Airlines Under US Pressure", "full_content": "Iranian airlines have cancelled UAE flights amid US sanctions pressure, while disruptions have also affected routes to Baghdad, Muscat, Qatar, Georgia and Azerbaijan.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 08:54 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "US yields rise, 30-year bond yield hits highest since 2004", "full_content": "US Treasury yields are on the rise, driven by persistent bond market tensions and inflation worries. A surprising purchasing managers' report has intensified concerns over inflation, affecting overall market conditions. Additionally, escalating energy prices linked to the U.S.-Israeli conflict over Iran add to the bond market's challenges. Investors remain alert to upcoming seven-year note auctions for essential insights.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 08:54 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "24 Sep 2026, 09:44 PM IST", "total_stories": 401};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
