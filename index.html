d sales volume rose 13% year-on-year to 963 kilo tonnes in the September quarter (Q2FY27), as per its business update. This is a striking recovery from the 6% year-on-year drop in Q1. But the stock is down about 3% after the Q2 update.\n\nDespite the recovery, April-September (H1FY27) volume growth was barely 4%, well short of management's guidance of 15-20% for FY27. So, the steel tubes manufacturer may need to lower its growth guidance after the Q2 performance, which could make investors nervous.\n\nBesides, APL is facing headwinds from the steep rise in hot-rolled coil (HRC) prices, prompting distributors to be cautious about inventory build-up. Still, profitability may hold up with JM Financial Institutional Securities expecting Q2 Ebitda to remain broadly at \u20b9 5,500 per tonne, similar to Q1.\n\n\u201cGoing forward, the company\u2019s ability to sustain margins while navigating elevated HRC prices remains a key factor to monitor,\u201d the brokerage added. Q1 Ebitda had increased by 11% y-o-y to \u20b9 410 crore, despite lower volumes, as the management prioritised profitability over growth.\n\nNotably, UAE volumes in Q2 dropped 55%, hit by West Asia disruptions . Excluding the UAE, which contributed 6% of FY26 volumes, overall Q2 growth was 18%. APL\u2019s low-priced SG Premium brand, facing competition from unorganized players, saw 30% dip in volumes, following a more than tripling of volumes in Q1.\n\nTrue, infrastructure and construction activity should keep APL\u2019s medium-term growth outlook strong. The company is increasing its capacity to 8 million tonnes per annum (mtpa) over the next 2-3 years from 5 mtpa currently, through greenfield expansion along with debottlenecking measures.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 11:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rs 17,540 crore added to Trent mcap, but Citi stays bearish. Why Morgan Stanley disagrees", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Rs 17,540 crore added to Trent mcap, but Citi stays bearish. Why Morgan Stanley disagrees Trent Share Price V2 Retail Share Price Aditya Birla Fashion and Retail Share Price Shoppers Stop Share Price Kewal Kiran Clothing Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Rs 17,540 crore added to Trent mcap, but Citi stays bearish. Why Morgan Stanley disagrees SECTIONS Rs 17,540 crore added to Trent mcap, but Citi stays bearish. Why Morgan Stanley disagrees By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 06, 2026, 11:27:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Trent shares surged 13% after the Tata Group retailer reported strong Q2 revenue growth and crossed the 1,000-store milestone for Zudio. Morgan Stanley and HSBC remain bullish, while Citi stays cautious over margins, competition and revenue per square foot.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "America\u2019s data center fight is a preview of what's to come for the rest of the world", "full_content": "As the AI boom becomes a major part of political debate, the public backlash against data centers in the U.S. is spreading to Europe and Asia \u2014 raising risks for investors.\n\nAcross the Atlantic, negative sentiment is growing in Europe, which has more at stake due to its densely populated countries and higher electricity prices , experts told CNBC.\n\nSimilar tensions are emerging in South Korea, with growing opposition to data centers near residential areas and proposals for tighter local restrictions, even as the national government pushes to accelerate development.\n\nPublic opposition has already impacted around $42 billion of data center investments in Europe, in account delays and cancellations, according to research from STL Partners. That compares to around $77 billion in the U.S.\n\nThe pushback could be the \"straw that breaks the camel's back,\" Olivier Darmouni, associate professor at HEC Paris who specializes in the energy transition, told CNBC.\n\nMore than 70 data center projects in Europe were rejected or restricted between January and April \u2014 more than in all of 2025, according to the European Data Center Monitor. It found that pushback had snowballed from local town halls to courts, regulators and parliaments.\n\nScotland has paused planning approvals for new hyperscale data centers after campaigners called on the government to avoid the \"cautionary tale\" of Ireland, where overwhelming power demand led to a moratorium.\n\nConstraints have been rising in the Nordics, where investors were drawn to large tracts of land and renewable energy. After a surge in power applications , Denmark passed an emergency law that could see data centers at the back of the queue for grid power applications.", "source": "CNBC World Economy", "pub_date_str": "06 Oct 2026, 11:20 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Festive season bets: Analysts see upside in Lenskart, Arvind, Varun Beverages and 3 other stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Festive season bets: Analysts see upside in Lenskart, Arvind, Varun Beverages and 3 other stocks Written by Kumar Gaurav , ETMarkets.com | Oct 06, 2026, 12:04:01 PM IST 1 / 7 Expert picks D-Street investors eyeing tactical gains during the festive season may want to keep six stocks on their radar: Lenskart, Arvind, Varun Beverages, OMNI, IT BeES and Sudarshan Chemical Industries, as analysts see potential upside in these counters. Investors looking to make stock-market bets during the festive season can consider Lenskart, Arvind, Varun Beverages, OMNI, IT BeES and Sudarshan Chemical Industries, as analysts see potential upside in these six stocks based on their fundamental and technical outlook.\n\nThe festive season is expected to drive higher mall and high-street footfall and discretionary spending on fashion and sunglasses, benefiting Lenskart's mass-to-premium house-of-brands portfolio. With store payback under 10 months and store EBITDA margin above 33%, Motilal Oswal expects Lenskart to reach around 4,500 India stores by FY29, with a medium-term opportunity of 10,000-plus stores, around 29% India revenue CAGR over FY26-29E and India pre-Ind AS EBITDA margin expanding around 395 basis points to 19.4% by FY29 as commissions and incentives decline with the shift to COCO stores. Siddhartha Khemka, Head of Research, Wealth Management, Motilal Oswal Financial Services\n\nArvind enters the Diwali-wedding season with strong momentum, with denim volumes up 35% year-on-year to a 16-quarter high and woven volumes up 7%, while order visibility runs through year-end.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jefferies, Nomura and Macquarie initiate coverage on 5 stocks with up to 30% upside potential. See full list", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Jefferies, Nomura and Macquarie initiate coverage on 5 stocks with up to 30% upside potential. See full list Written by Veer Sharma , ETMarkets.com | Oct 06, 2026, 11:20:52 AM IST 1 / 6 Add to Cart! A host of domestic and global brokerages have initiated coverage on select Indian stocks across sectors such as travel and consumer discretionary. Analysts are bullish on names including Trent and IndiGo and see strong upside from current levels. Here are five stocks that recently received brokerage coverage.\n\nJefferies initiated coverage on Dhoot Transmission with a \u2018Buy\u2019 rating and a price target of Rs 1,730, implying 14% upside. The brokerage sees the auto component maker as a key beneficiary of rising two-wheeler demand, premiumisation and electrification, while its expanding product portfolio could provide another leg of growth.\n\nNomura initiated coverage on InterGlobe Aviation, the parent of IndiGo, with a \u2018Buy\u2019 rating and a target price of Rs 6,000, implying around 21% upside from its September 30 closing price of Rs 4,984. The brokerage believes IndiGo\u2019s large aircraft order book, low-cost structure and growing international network can help it emerge stronger even if elevated fuel prices persist.\n\nGlobal brokerage BofA Securities initiated coverage on Tata Group\u2019s Trent with a \u2018Buy\u2019 rating and a price target of Rs 3,075 per share, implying 19.5% upside. The brokerage cited the company\u2019s differentiated retail platform, strong growth prospects, and integrated technology and supply-chain capabilities.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "The economics of group health distribution", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nOver the past few weeks, there has been considerable discussion around the Irdai consultation paper on distribution reforms. A central premise of the paper is that insurance commissions are too high and contribute to the difficulties policyholders face.\n\nInsurance is a diverse industry, and the challenges vary across segments. Retail health, motor and credit life insurance each merit their own analysis. I write about group health insurance for company employees, a segment I know well. It is a large, growing market in which intermediaries play a significant role. But here, commission is not the central issue.\n\nBefore 2017, the commission allowed for brokers was 17.5% of premium. Subsequently, until 2023, the commission limit in employer-employee group health was reduced to 7.5%, with an additional reward on top. In 2023, specific product-level limits were done away with. Since then, commission for large and small companies has remained mostly unchanged, well under 7.5% for large companies and between 7.5% and 10% for smaller businesses. The only change was that commission and reward were merged.\n\nConsider the economics of distributing group health insurance . For a company with 100 lives, the typical annual premium is about \u20b9 6 lakh. Intermediaries will generally earn \u20b9 45,000 as commission and incur costs of about \u20b9 40,000, leaving a profit of \u20b9 5,000, or about a 10% margin.\n\nWhat are these costs that intermediaries incur? A salesperson would have engaged with 10 potential clients to successfully close one. In each of those 10 engagements, the salesperson will suggest coverages, evaluate current benefits, benchmark quotes typically from five insurers and negotiate with insurers to get the best terms. Clients, even small ones, work with multiple intermediaries to drive prices down.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 11:09 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Hong Kong stocks rise as pharma, tech shares lead gains", "full_content": "Hong Kong stocks gained on Tuesday, led by pharmaceutical and technology shares, with the Hang Seng rising 0.78% and Hang Seng Tech Index advancing 0.87%. Biotech firms WuXi Biologics and Sino Biopharmaceutical rallied over 4%. Property stocks remained weak amid residential market concerns, debt pressures and refinancing risks among developers.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:08 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Honasa Consumer share price up 60% in 6 months - What's behind the rally in shares of Mamaearth parent? What lies ahead?", "full_content": "Shares of Honasa Consumer, the parent of the personal care brand Mamaearth jumped over 11% intraday. The stock is up more than 61% over the last six months, while year-to-date, it is up over 73%.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 11:05 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "New IPO listings: Discount or premium? SRIT India vs Shah Investor's Home - Check worst and best debut", "full_content": "SRIT India shares opened at \u20b9148on the NSE, up 13.85%, and later rose 19% above the issue price. Shah Investor's Home debuted at \u20b9171, a 2.4% premium. SRIT's IPO was oversubscribed, while Shah's was moderately subscribed, reflecting differing investor sentiment.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 11:04 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "06 Oct 2026, 01:11 PM IST", "total_stories": 345};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
