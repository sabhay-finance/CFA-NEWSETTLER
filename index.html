t 2026, 11:15 AM IST", "pub_date_relative": "42m ago"}, {"title": "AI stocks rally after Anthropic IPO filing, Nvidia gains nearly 3%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a AI stocks rally after Anthropic IPO filing, Nvidia gains nearly 3% Powered By The Economic Times daily newspaper is available online now. Read Today's Paper AI stocks rally after Anthropic IPO filing, Nvidia gains nearly 3% SECTIONS AI stocks rally after Anthropic IPO filing, Nvidia gains nearly 3% By Anupam Nagar , ETMarkets.com Last Updated: Oct 27, 2026, 11:15:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis AI stocks rallied after Anthropic disclosed IPO paperwork, with Nvidia gaining nearly 3% and the Philadelphia Semiconductor Index climbing over 3%. Chipmakers, data centre operators and AI infrastructure firms also advanced. The potential listings of Anthropic and OpenAI could offer new valuation benchmarks, even as concerns over AI spending and financing costs persist.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 11:15 AM IST", "pub_date_relative": "42m ago"}, {"title": "LTCG tax on equities: Govt may restructure rates in coming weeks; how much could investors save at 10%, 5% or 2%?", "full_content": "The government is considering changes to the long-term capital gains ( LTCG ) tax on equities. A decision might be taken in the coming weeks before the Union Budget in February 2027, Moneycontrol reported on Monday, citing sources familiar with the matter, including a government official.\n\n\u201cA decision on restructuring is expected soon,\u201d an official told Moneycontrol . The official added that the government is comparing India\u2019s LTCG tax rate with those prevailing in major economies.\n\nThe report also mentioned that the government is examining whether LTCG paid by foreign investors should be calculated on gains made in dollar terms. Currently, capital gains are calculated in rupees.\n\nA reduction in the tax rate could lower investors\u2019 tax liability when they sell equity investments at a profit. Here is what investors need to know.\n\nCurrently, profits from listed equity shares and equity-oriented mutual funds are treated as long-term capital gains if held for more than 12 months.\n\nInvestors pay LTCG tax at 12.5% on eligible gains exceeding \u20b9 1.25 lakh in a financial year. Applicable cess and surcharge are levied separately.\n\nIn its Ecowrap report dated 12 October 2026, SBI Research suggested that, \u201cThe government must seriously look into anchoring hot money flows into the equity segment by extending the holding period to say 2-3 years and abolishing the long-term capital gains tax for equity.\u201d\n\nSeparately, according to a News on Air report dated 13 October, Finance Minister Nirmala Sitharaman said: \u201cThe Government is open to hearing suggestions on the removal of long-term capital gains tax during consultations for the upcoming Union Budget.\u201d She made the remarks at the Bloomberg New Economy Forum in New Delhi.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 11:15 AM IST", "pub_date_relative": "42m ago"}, {"title": "Indian bonds tick up on calm oil before Fed verdict", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Indian bonds tick up on calm oil before Fed verdict Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Indian bonds tick up on calm oil before Fed verdict SECTIONS Indian bonds tick up on calm oil before Fed verdict Reuters Last Updated: Oct 27, 2026, 11:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In early trade, Indian government bonds improved as oil prices found stability after last week's surge. Traders remained cautious ahead of a significant policy decision by the US Federal Reserve on Wednesday. India's bond yields decreased slightly, although overall demand for longer maturities has declined amid inflation concerns. The Indian rupee remained stable as fears of further rate hikes from the Reserve Bank of India persisted.\n\nIn early trade, Indian government bonds improved as oil prices found stability after last week's surge. Traders remained cautious ahead of a significant policy decision by the US Federal Reserve on Wednesday. India's bond yields decreased slightly, although overall demand for longer maturities has declined amid inflation concerns. The Indian rupee remained stable as fears of further rate hikes from the Reserve Bank of India persisted.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 11:14 AM IST", "pub_date_relative": "43m ago"}, {"title": "8th pay commission: Speculation over fitment factors of 1.83, 2, 2.57, 3.83 and 4\u2014We calculate salary increase for each", "full_content": "The 8th central pay commission (CPC) is in its consultation stage, gathering inputs from central government employees and pensioner groups, unions and stakeholders before it makes its final recommendations in May next year.\n\nFormer Supreme Court Justice Ranjana Prakash Desai is the Chair, and the panel includes Member-Secretary \u2014 Pankaj Jain, a former IAS officer, and Member of the Commission \u2014 Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister.\n\nThe panel is expected to examine and recommend changes that are desirable and feasible in the emoluments, including pay (usually includes salary structure, pay matrix), allowances (usually include DA , Dearness Relief, HRA), other facilities / benefits, in cash or kind (includes increment, promotions, etc.), having regard to rationalisation, contemporary functional requirements and specialised needs.\n\nThe decisions are set to benefit more than 1 crore people, including around 50 lakh central government employees and about 65 lakh pensioners , including personnel and retirees with the defence and railway ministries.\n\nFitment factor is a mathematical multiplier used by the pay commissions to convert an employee's pre-revised basic salary (or retirees' pension payout) into the new, revised basic salary structure. The primary formula used is as below:\n\nThus, under the 7th CPC, where a fitment factor of 2.57 was implemented, basic pay rose from \u20b9 7,000 to \u20b9 18,000 as follows: \u20b9 7,000 x 2.57 = \u20b9 18,000.\n\nThe panel closed suggestions and data submissions from employee representative groups, unions and other stakeholders in July. In their memorandums, a number of stakeholders have expressed demand for higher fitment factor.\n\nEmployee and pensioner groups, unions, representatives and stakeholders have recommended 3.83 or 4.00 as the highest possible fitment factor that could be approved.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 11:13 AM IST", "pub_date_relative": "44m ago"}, {"title": "India-Russia trade grew by 20 per cent this year: Russian State Duma Chairman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-Russia trade grew by 20 per cent this year: Russian State Duma Chairman The Economic Times daily newspaper is available online now. Read Today's Paper India-Russia trade grew by 20 per cent this year: Russian State Duma Chairman SECTIONS India-Russia trade grew by 20 per cent this year: Russian State Duma Chairman By Dipanjan Roy Chaudhury , ET Bureau Last Updated: Oct 27, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India imported $44.9 billion of Russian goods during the period, including $36 billion in crude oil. Indian exports to Russia totaled $2.8 billion, with Moscow increasing purchases of chemicals, electrical goods, medical equipment, seafood, tea, and spices.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 11:11 AM IST", "pub_date_relative": "46m ago"}, {"title": "IT stocks crash! Infosys, TCS, Wipro, HCL Tech - Nifty IT tanks over 2% today, biggest sectoral loser - What lies ahead?", "full_content": "IT stocks today : Indian IT stocks came under intense selling pressure on Tuesday, October 27, as investors reassessed the sector's growth prospects amid rising concerns over artificial intelligence (AI), global economic uncertainty and elevated valuations. Moreover, weakness on Dalal Street added to the weakness.\n\nThe sell-off pushed the Nifty IT index down 2.3%, making it the worst-performing sectoral index of the day, compared with a 0.4% decline in the Nifty 50.\n\nHeavyweights including Infosys, TCS, Wipro and HCL Technologies dragged the sector lower, raising questions about whether the latest correction is a temporary bout of profit-taking or a warning that the traditional IT services model faces a more challenging growth environment.\n\nSelling was broad-based across the IT sector, with several large-cap and mid-cap companies losing ground during intraday trade. TCS and Infosys fell as much as 3%, while Persistent Systems and Wipro declined more than 2% each. HCL Technologies, Mphasis, Tech Mahindra and Coforge shed more than 1% apiece. L&T Technology Services was the notable exception, trading around 1% higher.\n\nThe sharp decline came despite a strong recent performance in the sector. The Nifty IT index had gained 12% over the past month, 8% over three months and 9% over six months. However, the index remained down 12% over the past year, suggesting that the recent rebound has not yet erased the damage from its longer-term decline.\n\nOne of the biggest concerns weighing on IT stocks is the possibility that AI-driven automation could disrupt traditional outsourcing contracts. Investor anxiety has intensified around the rapid expansion of AI platforms, including reports highlighting Anthropic's potential $1.5 trillion valuation.\n\nFor Indian IT services companies, the challenge is more complicated than simply adopting new technology.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 11:06 AM IST", "pub_date_relative": "51m ago"}, {"title": "TCS, Infosys, other IT stocks drop up to 3% as Anthropic IPO sparks rally in global AI stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a TCS, Infosys, other IT stocks drop up to 3% as Anthropic IPO sparks rally in global AI stocks Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TCS, Infosys, other IT stocks drop up to 3% as Anthropic IPO sparks rally in global AI stocks SECTIONS TCS, Infosys, other IT stocks drop up to 3% as Anthropic IPO sparks rally in global AI stocks By Veer Sharma , ETMarkets.com Last Updated: Oct 27, 2026, 11:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian IT stocks fell amid reports that Anthropic, the maker of Claude, is preparing for an IPO that could value it at around $1.5 trillion. While the listing would open up investment opportunities in a leading AI developer, rising infrastructure costs, mounting losses and concerns over growth sustainability remain key risks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wip HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 11:01 AM IST", "pub_date_relative": "56m ago"}, {"title": "Apollo Micro Systems shares: Defence stock up 60% in 2026, soars 8% in Q2 rally - Key levels to watch \u200bnext", "full_content": "Apollo Micro Systems shares extended their post-earnings rally on Tuesday, 27 October, surging 8.5% after the defence electronics company reported strong year-on-year growth in its September quarter earnings.\n\nThe stock opened at \u20b9 415.10 apiece on the BSE and climbed to an intraday high of \u20b9 446.40, while the day's low stood at \u20b9 414. Apollo Micro Systems shares have gained around 45% over the past six months and nearly 60% so far in 2026.\n\nThe stock had rallied nearly 9% on Monday after the company reported robust Q2 FY27 results, with net profit and revenue registering strong year-on-year growth.\n\nApollo Micro Systems reported a 55.6% year-on-year increase in net profit to \u20b9 48.4 crore in the September quarter, compared with \u20b9 31 crore in the corresponding quarter last year. Revenue from operations surged 72.2% to \u20b9 388 crore from \u20b9 225.3 crore a year earlier.\n\nThe company said its Q2 revenue of \u20b9 388 crore was its highest-ever for a September quarter. EBITDA rose 87.6% year-on-year to \u20b9 111 crore from \u20b9 59.2 crore, while the EBITDA margin expanded to 28.6% from 26.3%.\n\nThe company also reported a record September-quarter profit after tax (PAT), with its order book reaching an all-time high of \u20b9 1,765 crore. Other income during the quarter stood at \u20b9 3.5 crore.\n\nApollo Micro Systems Managing Director Baddam Karunakar Reddy said the company's best-ever Q2 performance reflected strong execution, resilience and a continued focus on key priorities.\n\nBuilding on this momentum, the company plans to accelerate execution, sharpen its strategic focus and respond to the evolving needs of the defence sector, Reddy said.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 11:01 AM IST", "pub_date_relative": "56m ago"}, {"title": "HSBC announces share buyback of up to $1 billion as third-quarter profit meets estimates", "full_content": "Europe's largest bank HSBC on Tuesday announced a share buyback of up to $1 billion and reported third-quarter pretax profit that largely met analysts' estimates.\n\nRevenue at HSBC rose to $18.6 billion from $17.8 billion in the same period last year, while banking net interest income rose 6%, alongside the bank clocking higher fee income form its corporate and institutional banking and wealth business.\n\nHere are HSBC's third -quarter results compared with the consensus estimates compiled by the bank.\n\nThe bank's third-quarter profit before tax increased 32% from a year earlier to $9.6 billion, also reflecting the absence of $1.4 billion in legal provisions recorded in the same period last year. Higher revenue and lower credit losses also supported earnings.\n\nShares in HSBC, which approved a third interim divided of 10 cents per share, fell 2.95% in Hong Kong following the release of its third-quarter earnings.\n\nThe bank's net interest income rose to $9.3 billion in the third quarter, supported by deposit growth and reinvestment of its \"structural hedge at higher yields.\"\n\nMeanwhile, operating expenses decreased 12% year on year to $8.8 billion, largely due to non-recurrence of legal provisions recorded a year earlier. Excluding notable items, expenses rose amid inflation and higher spending on technology.\n\nLooking ahead, HSBC maintained its forecast for banking net interest income of at least $46 billion in 2026, while reiterating its target for return on average tangible equity \u2014 a metric for assessing profitability \u2014 of 17% or higher for 2026 through 2028, excluding notable items.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:00 AM IST", "pub_date_relative": "57m ago"}, {"title": "Anthropic\u2019s constitutional order", "full_content": "Plus, Lula\u2019s victory", "source": "FT Markets", "pub_date_str": "27 Oct 2026, 11:00 AM IST", "pub_date_relative": "57m ago"}, {"title": "South Africa Vs Australia 3rd Test Live Streaming: When And Where To Watch In India", "full_content": "Temba Bavuma's 179 and Marco Jansen's five-wicket haul helped South Africa bounce back in the second Test. Can the hosts carry that momentum into Cape Town?", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 11:00 AM IST", "pub_date_relative": "57m ago"}, {"title": "Sigma Advanced Systems shares rally 5% after securing Rs 973 crore NATO order", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sigma Advanced Systems shares rally 5% after securing Rs 973 crore NATO order Sigma Advanced Systems Share Price E2E Networks Share Price Kernex Microsystems (India) Share Price TechNVision Ventures Share Price Blue Cloud Softech Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Sigma Advanced Systems shares rally 5% after securing Rs 973 crore NATO order SECTIONS Sigma Advanced Systems shares rally 5% after securing Rs 973 crore NATO order By Surbhi Khanna , ET Online Last Updated: Oct 27, 2026, 10:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sigma Advanced Systems shares rallied after the defence manufacturer secured a Rs 973-crore order from a NATO customer for Base Bleed Units used in 155 mm artillery ammunition. The contract strengthens its push towards vertical integration and e ice Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Didn\u2019t get Jio IPO shares? Experts decode the listing-day playbook for investors SECTIONS Didn\u2019t get Jio IPO shares? Experts decode the listing-day playbook for investors By Kumar Gaurav , ETMarkets.com Last Updated: Oct 27, 2026, 11:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms\u2019 Rs 30,188-crore IPO was subscribed 22.19 times, with the final issue price set at Rs 1,119 per share. As the stock prepares to list on the NSE and BSE on October 28, investors who missed the allotment are weighing whether to buy on debut or wait for a potential correction.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 10:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global equity markets rise as AI trade regains steam", "full_content": "Asia follows Wall Street higher in wake of Anthropic\u2019s long-awaited IPO filing", "source": "FT Markets", "pub_date_str": "27 Oct 2026, 10:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dalmia Bharat, APL Apollo Among 12 Stocks Reviewed By HDFC Securities After Q2 Results; Check New Target Prices", "full_content": "For Dalmia Bharat, the brokerage continued with a Buy recommendation but reduced the target price to Rs 2,030 from Rs 2,110, citing pressure on margins and costs.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 10:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why Amazon And Flipkart Are Struggling To Beat Meesho In India's Smaller Cities", "full_content": "With 274 million users and lowest-cost logistics, Meesho is defending its value commerce crown against giants like Amazon and Flipkart.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 10:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "BlackRock\u2019s Rieder Spent All Weekend Doing Deals in AI Debt Rush - Bloomberg.com", "full_content": "BlackRock\u2019s Rieder Spent All Weekend Doing Deals in AI Debt Rush Bloomberg.com BlackRock's Rick Rieder sees 'historic' opportunity in high-quality bonds CNBC Corporate credit income eclipses rate-cut hopes: BlackRock Financial Newswire Payden & Rygel Sees Compelling Opportunity In Investment-Grade Corporates as Yields Rise The Manila Times BlackRock identifies a \"once-in-a-generation\" opportunity in bond market positioning! Could a decline in AI financing costs pave the way for a major rally in technology stocks? Moomoo", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 10:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Shah Rukh Khan's 'King' Poster Out, Releasing On THIS Day", "full_content": "Shah Rukh Khan reveals his new look from 'King' as the film gears up for a December 24 release.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 10:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bajel Projects shares surge over 12% - What's behind the stock rally? Can it rise further? Experts take", "full_content": "Bajel Projects shares surged over 12% in intraday trade on Tuesday, 27 October, a day after the company said it bagged an order worth over \u20b9 200 crore for Mumbai\u2019s critical 400 kV GIS infrastructure. Bajel Projects' share price opened at \u20b9 171.90 against its previous close of \u20b9 156.15 and jumped 12.3% to an intraday high of \u20b9 175.30.\n\nThe stock rose after the company announced on 26 October that it had received an order from Tata Power Company worth approximately \u20b9 200 crore for the engineering, procurement and construction (EPC) of 400 kV gas-insulated substations (GIS) at Dharavi and Ghatkopar in Mumbai.\n\nBajel Projects is a leading EPC and manufacturing solutions company with a strong domestic and international presence across the power transmission and new energies sectors.\n\nIn a separate exchange filing, the company said that Lakadia A Power Transmission Limited had issued multiple letters of award (LOAs) to Bajel towards the EPC work for a key transmission project in Gujarat. The combined value of these LOAs is \u20b9 1,500 crore.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, Bajel Projects has been moving in a corrective structure and is in the last stages of its corrective phase; however, this could still extend towards the previous swing lows of \u20b9 135.\n\nThukral underscored that the stock is in a downtrend with the formation of lower highs and lower lows, and every rise towards resistance is an exit opportunity for now.\n\n\"The stock price is trading with negative crossovers between its major EMAs and points towards a downtrend. If this has to change, the stock price would spend some time around current levels and form a base in order to turn the price trend bullish,\" said Thukral.\n\n\"Every rise is an exit opportunity; however, if the stock spends some weeks around current levels and forms a base, the direction could change to upside for the stock. The important resistance zone is around \u20b9 172 to \u20b9 177,\" said Thukral.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 10:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oil falls as renewed diplomatic efforts to end Mideast conflict ease supply concerns", "full_content": "Oil prices fell Tuesday as renewed diplomatic efforts to end the U.S.-Iran war raise hopes of a de-escalation in the wider regional conflict that has seen Tehran-backed Houthis target Saudi Arabia.\n\nFutures for international benchmark Brent crude for December delivery slipped 0.87% to $114.80 a barrel. U.S. West Texas Intermediate futures for June declined 0.86% to $100.88 per barrel.\n\nBrent The pullback followed talks between Saudi Arabia, Turkey, Pakistan and Iranian officials in Tehran on Monday, as they stepped up efforts to defuse tensions across the Middle East.\n\nRiyadh said the discussions were aimed at keeping diplomatic channels open and preventing another escalation in hostilities. The four countries agreed to continue to engage to advance regional peace and security, according to Iranian state media.\n\nThe diplomatic push comes as U.S. President Donald Trump said in an interview with Fox News on Sunday that he was approaching a decision on whether to strike a deal with Iran or intensify military operations, suggesting that additional attacks remained an option.\n\nRepresentatives from Qatar, which has helped mediate negotiations between Washington and Tehran, also traveled to the Iranian capital on Sunday, Reuters reported .\n\nwti Prospects of a diplomatic breakthrough have helped temper fears of further disruptions to global energy supplies, putting downward pressure on crude prices.\n\nStill, losses remained limited as the prospect of a lasting resolution appeared fragile, with Iran-backed Houthi militants continuing their attacks on Saudi Arabia over the weekend.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 10:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ather Energy shares jump 5%, extend rally to 20% in two days after Q d expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 10:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "After strong IPO listing, Tonbo Imaging shares rally for 2nd session today | Should you book profits? Target, stop loss", "full_content": "Tonbo Imaging share price continued its upward rally for second session straight on Tuesday. The stock opened at \u20b9 1,222 per share on NSE today, as compared to previous close of \u20b9 1,212.85 on Monday and surged over 4% to touch an intraday high of \u20b9 1,275 on 27 October.\n\nTonbo Imaging shares jumped over 17% during the intraday session on Monday after strong listing on Friday last week. The stock delivered a strong debut on 23 October, listing at \u20b9 1,160 on the NSE, a 65.71% premium over its issue price of \u20b9 700 per share. On the BSE, it opened at \u20b9 1,162, registering a 66% premium.\n\nThe stock has since surged nearly 90% above its IPO price, highlighting robust investor interest following its listing.\n\nAccording to Mahesh M Ojha, VP Research & Business Development at Kantilal Chhaganlal Securities, Tonbo Imaging \u2019s valuations appear to be on the higher side, which may limit near-term upside.\n\n\u201cThe company\u2019s long-term prospects look positive, supported by its growth potential. Investors with a two- to three-year investment horizon can consider buying and holding the stock, as the company appears well-positioned for growth over the long term. That said, investors should remain mindful of the elevated valuations and the risks associated with them,\u201d Ojha added.\n\nMeanwhile, Gaurav Garg, Head - Research, Lemonn, believes that Tonbo Imaging has long-term growth potential, supported by rising demand for advanced defence electronics, thermal imaging and surveillance technologies.\n\n\u201cHowever, investors should remain cautious following the stock\u2019s sharp post-listing rally. The e oil is very thick, like Ural. As the Reliance Nelson index code is attractive 21, the company is expected to get refiner work from Venezuela at a discounted price, a scenario quite similar to Ural oil refinery work coming in from Russia. Experts see Reliance shares to touch \u20b9 1250 to \u20b9 1300 in the near term due to the positive listing (as expected) of the Jio Platforms IPO.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Australia Expands Visa Biometric Checks To India: Who Needs To Submit Fingerprints And Facial Images?", "full_content": "The rules apply only to new visa applications lodged from October 26, 2026. Applications already submitted are not affected.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sugar season 2026\u201327 begins on schedule, nearly 107 mills commence operations across India: ISMA", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Sugar season 2026\u201327 begins on schedule, nearly 107 mills commence operations across India: ISMA The Economic Times daily newspaper is available online now. Read Today's Paper Sugar season 2026\u201327 begins on schedule, nearly 107 mills commence operations across India: ISMA SECTIONS Sugar season 2026\u201327 begins on schedule, nearly 107 mills commence operations across India: ISMA ET Online Last Updated: Oct 27, 2026, 10:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In Maharashtra, the country\u2019s largest sugar-producing state, close to 87 mills have commenced operations. More mills are expected to start in the coming week as cane harvesting gathers pace.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charg exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "LTCG tax on equities: Govt may restructure rates in coming weeks; how much could investors save at 10%, 5% or 2%?", "full_content": "The government is considering changes to the long-term capital gains ( LTCG ) tax on equities. A decision might be taken in the coming weeks before the Union Budget in February 2027, Moneycontrol reported on Monday, citing sources familiar with the matter, including a government official.\n\n\u201cA decision on restructuring is expected soon,\u201d an official told Moneycontrol . The official added that the government is comparing India\u2019s LTCG tax rate with those prevailing in major economies.\n\nThe report also mentioned that the government is examining whether LTCG paid by foreign investors should be calculated on gains made in dollar terms. Currently, capital gains are calculated in rupees.\n\nA reduction in the tax rate could lower investors\u2019 tax liability when they sell equity investments at a profit. Here is what investors need to know.\n\nCurrently, profits from listed equity shares and equity-oriented mutual funds are treated as long-term capital gains if held for more than 12 months.\n\nInvestors pay LTCG tax at 12.5% on eligible gains exceeding \u20b9 1.25 lakh in a financial year. Applicable cess and surcharge are levied separately.\n\nIn its Ecowrap report dated 12 October 2026, SBI Research suggested that, \u201cThe government must seriously look into anchoring hot money flows into the equity segment by extending the holding period to say 2-3 years and abolishing the long-term capital gains tax for equity.\u201d\n\nSeparately, according to a News on Air report dated 13 October, Finance Minister Nirmala Sitharaman said: \u201cThe Government is open to hearing suggestions on the removal of long-term capital gains tax during consultations for the upcoming Union Budget.\u201d She made the remarks at the arkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 11:14 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "8th pay commission: Speculation over fitment factors of 1.83, 2, 2.57, 3.83 and 4\u2014We calculate salary increase for each", "full_content": "The 8th central pay commission (CPC) is in its consultation stage, gathering inputs from central government employees and pensioner groups, unions and stakeholders before it makes its final recommendations in May next year.\n\nFormer Supreme Court Justice Ranjana Prakash Desai is the Chair, and the panel includes Member-Secretary \u2014 Pankaj Jain, a former IAS officer, and Member of the Commission \u2014 Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister.\n\nThe panel is expected to examine and recommend changes that are desirable and feasible in the emoluments, including pay (usually includes salary structure, pay matrix), allowances (usually include DA , Dearness Relief, HRA), other facilities / benefits, in cash or kind (includes increment, promotions, etc.), having regard to rationalisation, contemporary functional requirements and specialised needs.\n\nThe decisions are set to benefit more than 1 crore people, including around 50 lakh central government employees and about 65 lakh pensioners , including personnel and retirees with the defence and railway ministries.\n\nFitment factor is a mathematical multiplier used by the pay commissions to convert an employee's pre-revised basic salary (or retirees' pension payout) into the new, revised basic salary structure. The primary formula used is as below:\n\nThus, under the 7th CPC, where a fitment factor of 2.57 was implemented, basic pay rose from \u20b9 7,000 to \u20b9 18,000 as follows: \u20b9 7,000 x 2.57 = \u20b9 18,000.\n\nThe panel closed suggestions and data submissions from employee representative groups, unions and other stakeholders in July. In their memorandums, a number of stakeholders have expressed demand for higher fitment factor.\n\nEmployee and pensioner groups, unions, representatives and stakeholders have recommended 3.83 or 4.00 as the highest possible fitment factor that could be approved.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 11:13 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "India-Russia trade grew by 20 per cent this year: Russian State Duma Chairman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-Russia trade grew by 20 per cent this year: Russian State Duma Chairman The Economic Times daily newspaper is available online now. Read Today's Paper India-Russia trade grew by 20 per cent this year: Russian State Duma Chairman SECTIONS India-Russia trade grew by 20 per cent this year: Russian State Duma Chairman By Dipanjan Roy Chaudhury , ET Bureau Last Updated: Oct 27, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India imported $44.9 billion of Russian goods during the period, including $36 billion in crude oil. Indian exports to Russia totaled $2.8 billion, with Moscow increasing purchases of chemicals, electrical goods, medical equipment, seafood, tea, and spices.\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "27 Oct 2026, 11:11 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "IT stocks crash! Infosys, TCS, Wipro, HCL Tech - Nifty IT tanks over 2% today, biggest sectoral loser - What lies ahead?", "full_content": "IT stocks today : Indian IT stocks came under intense selling pressure on Tuesday, October 27, as investors reassessed the sector's growth prospects amid rising concerns over artificial intelligence (AI), global economic uncertainty and elevated valuations. Moreover, weakness on Dalal Street added to the weakness.\n\nThe sell-off pushed the Nifty IT index down 2.3%, making it the worst-performing sectoral index of the day, compared with a 0.4% decline in the Nifty 50.\n\nHeavyweights including Infosys, TCS, Wipro and HCL Technologies dragged the sector lower, raising questions about whether the latest correction is a temporary bout of profit-taking or a warning that the traditional IT services model faces a more challenging growth environment.\n\nSelling was broad-based across the IT sector, with several large-cap and mid-cap companies losing ground during intraday trade. TCS and Infosys fell as much as 3%, while Persistent Systems and Wipro declined more than 2% each. HCL Technologies, Mphasis, Tech Mahindra and Coforge shed more than 1% apiece. L&T Technology Services was the notable exception, trading around 1% higher.\n\nThe sharp decline came despite a strong recent performance in the sector. The Nifty IT index had gained 12% over the past month, 8% over three months and 9% over six months. However, the index remained down 12% over the past year, suggesting that the recent rebound has not yet erased the damage from its longer-term decline.\n\nOne of the biggest concerns weighing on IT stocks is the possibility that AI-driven automation could disrupt traditional outsourcing contracts. Investor anxiety has intensified around the rapid expansion of AI platforms, including reports highlighting Anthropic's potential $1.5 trillion valuation.\n\nFor Indian IT services companies, the challenge is more complicated than simply adopting new technology.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 11:06 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TCS, Infosys, other IT stocks drop up to 3% as Anthropic IPO sparks rally in global AI stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a TCS, Infosys, other IT stocks drop up to 3% as Anthropic IPO sparks rally in global AI stocks Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TCS, Infosys, other IT stocks drop up to 3% as Anthropic IPO sparks rally in global AI stocks SECTIONS TCS, Infosys, other IT stocks drop up to 3% as Anthropic IPO sparks rally in global AI stocks By Veer Sharma , ETMarkets.com Last Updated: Oct 27, 2026,  year-on-year growth in its September quarter earnings.\n\nThe stock opened at \u20b9 415.10 apiece on the BSE and climbed to an intraday high of \u20b9 446.40, while the day's low stood at \u20b9 414. Apollo Micro Systems shares have gained around 45% over the past six months and nearly 60% so far in 2026.\n\nThe stock had rallied nearly 9% on Monday after the company reported robust Q2 FY27 results, with net profit and revenue registering strong year-on-year growth.\n\nApollo Micro Systems reported a 55.6% year-on-year increase in net profit to \u20b9 48.4 crore in the September quarter, compared with \u20b9 31 crore in the corresponding quarter last year. Revenue from operations surged 72.2% to \u20b9 388 crore from \u20b9 225.3 crore a year earlier.\n\nThe company said its Q2 revenue of \u20b9 388 crore was its highest-ever for a September quarter. EBITDA rose 87.6% year-on-year to \u20b9 111 crore from \u20b9 59.2 crore, while the EBITDA margin expanded to 28.6% from 26.3%.\n\nThe company also reported a record September-quarter profit after tax (PAT), with its order book reaching an all-time high of \u20b9 1,765 crore. Other income during the quarter stood at \u20b9 3.5 crore.\n\nApollo Micro Systems Managing Director Baddam Karunakar Reddy said the company's best-ever Q2 performance reflected strong execution, resilience and a continued focus on key priorities.\n\nBuilding on this momentum, the company plans to accelerate execution, sharpen its strategic focus and respond to the evolving needs of the defence sector, Reddy said.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 11:01 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HSBC announces share buyback of up to $1 billion as third-quarter profit meets estimates", "full_content": "Europe's largest bank HSBC on Tuesday announced a share buyback of up to $1 billion and reported third-quarter pretax profit that largely met analysts' estimates.\n\nRevenue at HSBC rose to $18.6 billion from $17.8 billion in the same period last year, while banking net interest income rose 6%, alongside the bank clocking higher fee income form its corporate and institutional banking and wealth business.\n\nHere are HSBC's third -quarter results compared with the consensus estimates compiled by the bank.\n\nThe bank's third-quarter profit before tax increased 32% from a year earlier to $9.6 billion, also reflecting the absence of $1.4 billion in legal provisions recorded in the same period last year. Higher revenue and lower credit losses also supported earnings.\n\nShares in HSBC, which approved a third interim divided of 10 cents per share, fell 2.95% in Hong Kong following the release of its third-quarter earnings.\n\nThe bank's net interest income rose to $9.3 billion in the third quarter, supported by deposit growth and reinvestment of its \"structural hedge at higher yields.\"\n\nMeanwhile, operating expenses decreased 12% year on year to $8.8 billion, largely due to non-recurrence of legal provisions recorded a year earlier. Excluding notable items, expenses rose amid inflation and higher spending on technology.\n\nLooking ahead, HSBC maintained its forecast for banking net interest income of at least $46 billion in 2026, while reiterating its target for return on average tangible equity \u2014 a metric for assessing profitability \u2014 of 17% or higher for 2026 through 2028, excluding notable items.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 11:00 AM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "South Africa Vs Australia 3rd Test Live Streaming: When And Where To Watch In In  "full_content": "Asia follows Wall Street higher in wake of Anthropic\u2019s long-awaited IPO filing", "source": "FT Markets", "pub_date_str": "27 Oct 2026, 10:44 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "BlackRock\u2019s Rieder Spent All Weekend Doing Deals in AI Debt Rush - Bloomberg.com", "full_content": "BlackRock\u2019s Rieder Spent All Weekend Doing Deals in AI Debt Rush Bloomberg.com BlackRock's Rick Rieder sees 'historic' opportunity in high-quality bonds CNBC Corporate credit income eclipses rate-cut hopes: BlackRock Financial Newswire Payden & Rygel Sees Compelling Opportunity In Investment-Grade Corporates as Yields Rise The Manila Times BlackRock identifies a \"once-in-a-generation\" opportunity in bond market positioning! Could a decline in AI financing costs pave the way for a major rally in technology stocks? Moomoo", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 10:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Bajel Projects shares surge over 12% - What's behind the stock rally? Can it rise further? Experts take", "full_content": "Bajel Projects shares surged over 12% in intraday trade on Tuesday, 27 October, a day after the company said it bagged an order worth over \u20b9 200 crore for Mumbai\u2019s critical 400 kV GIS infrastructure. Bajel Projects' share price opened at \u20b9 171.90 against its previous close of \u20b9 156.15 and jumped 12.3% to an intraday high of \u20b9 175.30.\n\nThe stock rose after the company announced on 26 October that it had received an order from Tata Power Company worth approximately \u20b9 200 crore for the engineering, procurement and construction (EPC) of 400 kV gas-insulated substations (GIS) at Dharavi and Ghatkopar in Mumbai.\n\nBajel Projects is a leading EPC and manufacturing solutions company with a strong domestic and international presence across the power transmission and new energies sectors.\n\nIn a separate exchange filing, the company said that Lakadia A Power Transmission Limited had issued multiple letters of award (LOAs) to Bajel towards the EPC work for a key transmission project in Gujarat. The combined value of these LOAs is \u20b9 1,500 crore.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, Bajel Projects has been moving in a corrective structure and is in the last stages of its corrective phase; however, this could still extend towards the previous swing lows of \u20b9 135.\n\nThukral underscored that the stock is in a downtrend with the formation of lower highs and lower lows, and every rise towards resistance is an exit opportunity for now.\n\n\"The stock price is trading with negative crossovers between its major EMAs and points towards a downtrend. If this has to change, the stock price would spend some time around current levels and form a base in order to turn the price trend bullish,\" said Thukral.\n\n\"Every rise is an exit opportunity; however, if the stock spends some weeks around current levels and forms a base, the direction could change to upside for the stock. The important resistance zone is around \u20b9 172 to \u20b9 177,\" said Thukral.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 10:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oil falls as renewed diplomatic efforts to end Mideast conflict ease supply concerns", "full_content": "Oil prices fell Tuesday as renewed diplomatic efforts to end the U.S.-Iran war raise hopes of a de-escalation in the wider regional conflict that has seen Tehran-backed Houthis target Saudi Arabia.\n\nFutures for international benchmark Brent crude for December delivery slipped 0.87% to $114.80 a barrel. U.S. West Texas Intermediate futures for June declined 0.86% to $100.88 per barrel.\n\nBrent The pullback followed talks between Saudi Arabia, Turkey, Pakistan and Iranian officials in Tehran on Monday, as they stepped up efforts to defuse tensions across the Middle East.\n\nRiyadh said the discussions were aimed at keeping diplomatic channels open and preventing another escalation in hostilities. The four countries agreed to continue to engage to advance regional peace and security, according to Iranian state media.\n\nThe diplomatic push comes as U.S. President Donald Trump said in an interview with Fox News on Sunday that he was approaching a decision on whether to strike a deal with Iran or intensify military operations, suggesting that additional attacks remained an option.\n\nRepresentatives from Qatar, which has helped mediate negotiations between Washington and Tehran, also traveled to the Iranian capital on Sunday, Reuters reported .\n\nwti Prospects of a diplomatic breakthrough have helped temper fears of further disruptions to global energy supplies, putting downward pressure on crude prices.\n\nStill, losses remained limited as the prospect of a lasting resolution appeared fragile, with Iran-backed Houthi militants continuing their attacks on Saudi Arabia over the weekend.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 10:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Ather Energy shares jump 5%, extend rally to 20% in two days after Q2 results. Can the run continue?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stoc ment Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "After strong IPO listing, Tonbo Imaging shares rally for 2nd session today | Should you book profits? Target, stop loss", "full_content": "Tonbo Imaging share price continued its upward rally for second session straight on Tuesday. The stock opened at \u20b9 1,222 per share on NSE today, as compared to previous close of \u20b9 1,212.85 on Monday and surged over 4% to touch an intraday high of \u20b9 1,275 on 27 October.\n\nTonbo Imaging shares jumped over 17% during the intraday session on Monday after strong listing on Friday last week. The stock delivered a strong debut on 23 October, listing at \u20b9 1,160 on the NSE, a 65.71% premium over its issue price of \u20b9 700 per share. On the BSE, it opened at \u20b9 1,162, registering a 66% premium.\n\nThe stock has since surged nearly 90% above its IPO price, highlighting robust investor interest following its listing.\n\nAccording to Mahesh M Ojha, VP Research & Business Development at Kantilal Chhaganlal Securities, Tonbo Imaging \u2019s valuations appear to be on the higher side, which may limit near-term upside.\n\n\u201cThe company\u2019s long-term prospects look positive, supported by its growth potential. Investors with a two- to three-year investment horizon can consider buying and holding the stock, as the company appears well-positioned for growth over the long term. That said, investors should remain mindful of the elevated valuations and the risks associated with them,\u201d Ojha added.\n\nMeanwhile, Gaurav Garg, Head - Research, Lemonn, believes that Tonbo Imaging has long-term growth potential, supported by rising demand for advanced defence electronics, thermal imaging and surveillance technologies.\n\n\u201cHowever, investors should remain cautious following the stock\u2019s sharp post-listing rally. The view is to hold existing positions cautiously, whil ng, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Three Russian diesel tankers steam for US \u2014 including one under sanctions", "full_content": "Trump deal with Putin to ease fuel prices exposes companies to legal threats from Congress", "source": "FT Markets", "pub_date_str": "27 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Where auditors can lift their game", "full_content": "Investors hope awards for work on \u2018critical audit matters\u2019 can highlight where standards can be raised", "source": "FT Markets", "pub_date_str": "27 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank Holiday on Karwa Chauth 29 Oct 2026 Thursday: Not open! Check state, region where branches will remain closed", "full_content": "Bank Holiday on Karwa Chauth 29 Oct 2026 Thursday: Public and private lenders in one Indian state will remain closed on Thursday, 29 October, for Karwa Chauth, according to the Reserve Bank of India schedule.\n\nAs per RBI rules, all scheduled and non-scheduled banks observe listed holidays and mandatory closure on second and fourth Saturdays and every Sunday in a month. In-branch services are shut, but digital services (online net banking, app) will remain operational. Usually, in addition to the common national and gazetted holidays, or weekend offs, banks in India could have local holidays and festivals off, as required.\n\nThe central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks, including the State Bank of India (SBI), HDFC Bank, ICICI Bank, Axis Bank, Punjab National Bank (PNB), Canara Bank, Bank of Baroda and other lenders will remain closed on Thursday, 29 October for Karwa Chauth in Shimla, Himachal Pradesh, according to the official RBI holiday calendar.\n\nNotably, this will be followed by bank holidays on 31 October (Saturday) on account of Sardar Vallabhbhai Patel's Birthday, in Ahmedabad, Gujarat; and 1 November across India for Sunday weekend holiday.\n\nDuring bank holidays, online banking services remain available across the country to ensure uninterrupted access to banking services. Customers can use these services for convenient financial transactions.\n\n\u2014 An individual can use UPI or the respective bank's app to make payments and receive money from others. These services work round the clock, whether banks are open or not. Though, at times, it may be down due to scheduled maintenance during which the banks will notify you.\n\n\u2014 Additionally, fund transfer requests can be made using NEFT / RTGS transfer forms, demand draft request forms and cheque book forms.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 10:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "KFin Technologies shares: Jio Platforms IPO allotment finalisation impact or Q2 results rally? 6% jump today", "full_content": "KFin Technologies shares jumped 6% on Tuesday, October 27, as investors assessed the company's September-quarter earnings and watched the finalisation of the Jio Platforms IPO allotment. The company also announced that its Thai subsidiary had received a Foreign Business Licence from Thailand's Ministry of Commerce, marking another development in its international expansion.\n\nWith KFin Technologies serving as the registrar for the \u20b9 30,213-crore IPO, the stock attracted attention from investors tracking both its financial performance and the high-profile public issue. Investors are awaiting the listing of Jio Platforms shares on the NSE and BSE on Wednesday, October 28.\n\nThe stock jumped as much as 6% to its day's high of \u20b9 878.70. It is now 28% away from its 52-week high of \u20b9 1217.20, hit in October 2025. Meanwhile, it touched its 52-week low of \u20b9 784.10 in the previous session.\n\nIt has also been under pressure recently, with the stock down 3% in 1 month, 9% in 3 months and 10% in 6 months. Meanwhile, it shed over 26% in the last 1 year.\n\nKFin Technologies reported a 33.4% quarter-on-quarter increase in net profit to \u20b9 100.3 crore in Q2 FY27 , compared with \u20b9 75.2 crore in the preceding quarter. Revenue from operations rose 12.5% sequentially to \u20b9 402 crore from \u20b9 356.5 crore, while earnings before interest, taxes, depreciation and amortisation (EBITDA) increased 32% to \u20b9 161 crore from \u20b9 122 crore.\n\nThe EBITDA margin expanded to 40.1% in the September quarter from 34.2% in Q1 FY27. On a year-on-year basis, revenue from operations increased 29.9%, EBITDA grew 18.7% and profit after tax rose 7.5%, according to the company's October 26 press release. Diluted earnings per share stood at \u20b9 5.78, up 7.5% year-on-year.\n\nFor the first half of FY27, revenue from operations increased 30% year-on-year to \u20b9 758.3 crore. EBITDA rose 13.4% to \u20b9 283 crore, while net profit grew 2.9% to \u20b9 175.6 crore.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 10:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Asian Stocks to Gain as Anthropic Files for IPO: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks to Gain as Anthropic Files for IPO: Markets Wrap Bloomberg.com US futures and Asian stocks advance following a rally on Wall     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
