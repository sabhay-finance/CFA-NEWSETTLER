ies market regulator's board leaves out the one safeguard experts say matters most: an independent selection process.\n\nThe Securities Markets Code, 2025, proposes increasing the Securities and Exchange Board of India\u2019s (Sebi) board from nine to 15 members and raising the minimum number of whole-time members from three to five. The expansion comes as India\u2019s capital markets grow more complex, with algorithmic trading, digital investing, cross-border flows and new financial products creating additional regulatory demands.\n\nBut unlike the laws governing the Central Electricity Regulatory Commission (CERC) and the Competition Commission of India ( CCI ), the Code does not establish a selection committee in law. Instead, it leaves the manner of appointment to rules prescribed by the central government, which rather than being incorporated in law, would be dealt with at the time of implementation, according to the Ministry of Finance.\n\nAccording to the 36th report by the Standing Committee on Finance on SMC presented in July, the ministry had \u201cindicated\u201d to the committee that the existing rules for selection of Sebi chairperson and whole-time members would be adopted for the additional members too.\n\nThe Financial Sector Legislative Reforms Commission (FSLRC) recommended the formation of a selection panel with a majority of members unconnected to the government \u2014 a safeguard the Code has not yet adopted. The result, experts say, is an expansion that adds capacity without adding any check on who fills it.\n\n\"The bill leaves the appointment process to rules, not a statutory search-cum-selection committee, unlike CERC and CCI, whose committees sit in the parent Act.", "source": "LiveMint Markets", "pub_date_str": "23 Sep 2026, 01:02 PM IST", "pub_date_relative": "7m ago"}, {"title": "Rivian recalls nearly 99,000 vehicles over rearview camera display issue", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Sep 2026, 12: "}, {"title": "Shopify to Use Meta\u2019s Muse for Agentic Checkout - WSJ", "full_content": "Shopify to Use Meta\u2019s Muse for Agentic Checkout WSJ Why Shopify Stock Rocketed Higher Today Yahoo Finance Wall Street Lunch: Meta's Muse Teams With Shopify After Amazon Ban (undefined:SHOP) Seeking Alpha Meta\u2019s Muse Is a \u2018Killer Product\u2019. It Won\u2019t, However, Be the Death of Shopify. Barron's PayPal surges on Meta AI deal as tech rotation sinks financials Investing.com", "source": "Google News Business", "pub_date_str": "23 Sep 2026, 12:39 PM IST", "pub_date_relative": "29m ago"}, {"title": "Have investments across mutual funds, stocks and FDs? Here\u2019s how to ensure your family can find them after your death", "full_content": "If you have investments spread across mutual funds , stocks, bank deposits, insurance policies and multiple financial apps, your family may struggle to identify all your assets if you die unexpectedly. A simple asset inventory, kept updated and accessible to a trusted family member, can make it easier to locate these investments and begin the transmission process.\n\nInvestors should maintain a consolidated asset inventory, preferably in an Excel sheet, covering bank accounts, demat accounts, mutual funds, insurance policies, fixed deposits, investments held through various apps and other financial holdings, said Minisha Rupani, Senior Vice President, Anand Rathi Wealth.\n\nThe inventory should include relevant account details, platform names and nominee information and should be kept updated and securely accessible to the family.\n\nThe first step is to create a single record of your financial assets rather than leaving information scattered across emails, apps, bank statements and physical documents.\n\nThe inventory should identify the institutions and platforms where the investments are held, along with account or folio numbers and nominee details. This can help the family establish what the deceased owned before beginning the process of claiming or transferring those assets.\n\nFor investors using several brokerage, mutual fund and banking platforms, this becomes particularly important. An investment that is not documented can be difficult for family members to identify, particularly if they do not know which platform or institution holds it.\n\nInvestors should not assume that simply naming a nominee will settle the ownership of their assets after death.\n\n\u201cHaving only a nominee is not enough,\u201d Rupani said. According to her, a nominee across financial assets is a custodian of the assets, while investors should also have a registered will specifying the beneficiary.", "source": "LiveMint Money", "pub_date_str": "23 Sep 2026, 12:36 PM IST", "pub_date_relative": "33m ago"}, {"title": "Sugar industry rejects profiteering claims, says mills sold less than 2.5% of annual demand at August peak", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Sugar industry rejects profiteering claims, says mills sold less than 2.5% of annual demand at August peak The Economic Times daily newspaper is available online now. Read Today's Paper Sugar industry rejects profiteering claims, says mills sold less than 2.5% of annual demand at August peak SECTIONS Sugar industry rejects profiteering claims, says mills sold less than 2.5% of annual demand at August peak By Ashish Pandey , ET Online Last Updated: Sep 23, 2026, 12:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The industry bodies said the correction reflected market dynamics as well as continued government efforts.\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nGold rush on Dalal St as regional jewelle ust to 8,200 by year-end,\" he said.\n\nPresident Donald Trump said Tuesday that U.S. and Iranian officials met for three hours during the annual United Nations General Assembly gathering in New York. He described it as a \"very good meeting.\"\n\nEarlier Tuesday in his address to the U.N., Trump said he has a \"big decision\" over whether to reach a deal with Tehran or \"annihilate\" the country.", "source": "CNBC Top News", "pub_date_str": "23 Sep 2026, 01:08 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi board is set to grow. Experts say it's missing one safeguard it needs most", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMumbai: India's plan to expand its securities market regulator's board leaves out the one safeguard experts say matters most: an independent selection process.\n\nThe Securities Markets Code, 2025, proposes increasing the Securities and Exchange Board of India\u2019s (Sebi) board from nine to 15 members and raising the minimum number of whole-time members from three to five. The expansion comes as India\u2019s capital markets grow more complex, with algorithmic trading, digital investing, cross-border flows and new financial products creating additional regulatory demands.\n\nBut unlike the laws governing the Central Electricity Regulatory Commission (CERC) and the Competition Commission of India ( CCI ), the Code does not establish a selection committee in law. Instead, it leaves the manner of appointment to rules prescribed by the central government, which rather than being incorporated in law, would be dealt with at the time of implementation, according to the Ministry of Finance.\n\nAccording to the 36th report by the Standing Committee on Finance on SMC presented in July, the ministry had \u201cindicated\u201d to the committee that the existing rules for selection of Sebi chairperson and whole-time members would be adopted for the additional members too.\n\nThe Financial Sector Legislative Reforms Commission (FSLRC) recommended the formation of a selection panel with a majority of members unconnected to the government \u2014 a safeguard the Code has not yet adopted. The result, experts say, is an expansion that adds capacity without adding any check on who fills it.\n\n\"The bill leaves the appointment process to rules, not a statutory search-cum-selection committee, unlike CERC and CCI, whose committees sit in the parent Act.", "source": "LiveMint Markets", "pub_date_str": "23 Sep 2026, 01:02 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "France private sector returns to growth at fastest rate in 25 months, PMI shows", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Sep 2026, 12:54 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global Market: Singapore core inflation hits nearly two-year high in August", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Singapore core inflation hits nearly two-year high in August Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Singapore core inflation hits nearly two-year high in August SECTIONS Global Market: Singapore core inflation hits nearly two-year high in August By Anupam Nagar , ETMarkets.com Last Updated: Sep 23, 2026, 12:53:00 PM I ns backs rate hike, flags persistent inflation risks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Market: Fed\u2019s Collins backs rate hike, flags persistent inflation risks Boston Education and Software Technologies Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Market: Fed\u2019s Collins backs rate hike, flags persistent inflation risks SECTIONS US Market: Fed\u2019s Collins backs rate hike, flags persistent inflation risks By Anupam Nagar , ETMarkets.com Last Updated: Sep 23, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Boston Fed President Susan Collins backed the Fed\u2019s recent rate hike, citing persistent inflation risks and arguing that a somewhat more restrictive policy stance may be needed to bring inflation sustainably back to target.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Sep 2026, 12:44 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FTSE 100 today: Stocks rise as U.S.-Iran diplomacy eases oil fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Sep 2026, 12:43 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bitcoin pulls back from overbought highs at $86,388: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Sep 2026, 12:41 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Shopify to Use Meta\u2019s Muse for Agentic Checkout - WSJ", "full_content": "Shopify to Use Meta\u2019s Muse for Agentic Checkout WSJ Why Shopify Stock Rocketed Higher Today Yahoo Finance Wall Street Lunch: Meta's Muse Teams With Shopify After Amazon Ban (undefined:SHOP) Seeking Alpha Meta\u2019s Muse Is a \u2018Killer Product\u2019. It Won\u2019t, However, Be the Death of Shopify. Barron's PayPal surges on Meta AI deal as tech rotation sinks financials Investing.com", "source": "Google News Business", "pub_date_str": "23 Sep 2026, 12:39 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Have investments across mutual funds, stocks and FDs? Here\u2019s how to ensure your family can find them after your death", "full_content": "If you have investments spread across mutual funds , stocks, bank deposits, insurance policies and multiple financial apps, your family may struggle to identify all your assets if you die unexpectedly. A simple asset inventory, kept updated and accessible to a trusted family member, can make it easier to locate these investments and begin the transmission process.\n\nInvestors should maintain a consolidated asset inventory, preferably in an Excel sheet, covering bank accounts, demat accounts, mutual funds, insurance policies, fixed deposits, investments held through various apps and other financial holdings, said Minisha Rupani, Senior Vice President, Anand Rathi Wealth.\n\nThe inventory should include relevant account details, platform names and nominee information and should be kept updated and securely accessible to the family.\n\nThe first step is to create a single record of your financial assets rather than leaving information scattered across emails, apps, bank statements and physical documents.\n\nThe inventory should identify the institutions and platforms where the investments are held, along with account or folio numbers and nominee details. This can help the family establish what the deceased owned before beginning the process of claiming or transferring those assets.\n\nFor investors using several brokerage, mutual fund and banking platforms, this becomes particularly important. An investment that is not documented can be difficult for family members to identify, particularly if they do not know which platform or institution holds it.\n\nInvestors should not assume that simply naming a nominee will settle the ownership of their assets after death.\n\n\u201cHaving only a nominee is not enough,\u201d Rupani said. According to her, a nominee across financial assets is a custodian of the assets, while investors should also have a registered will specifying the beneficiary.", "source": "LiveMint Money", "pub_date_str": "23 Sep 2026, 12:36 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sugar industry rejects profiteering claims, says mills sold less than 2.5% of annua ate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Airtel Money launches one of London\u2019s biggest IPOs in recent years", "full_content": "African mobile payments group is seeking to raise at least $800mn at $8bn to $9bn valuation", "source": "FT Markets", "pub_date_str": "23 Sep 2026, 12:26 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Vedanta Power to join Nifty 500 index: What it means for investors? Check outlook", "full_content": "Vedanta Power share price today: Shares of Anil Agarwal-led Vedanta Power Limited rallied nearly 5% during Wednesday\u2019s intraday trading session ahead of its inclusion in the Nifty 500 and Nifty Smallcap 250 . The power stock has declined nearly 25.9% since Vedanta demerger. But could its inclusion in the two benchmark equity indices trigger a fresh rally? Experts decode.\n\nVedanta Power is set to be included in Nifty 500. Apart from Vedanta Power, Vedanta Iron and Steel , Vedanta Oil and Gas , Vedanta Aluminium Metal will also become a part of the index. Other than the Vedanta Group firms, Avanti Feeds, Azad Engineering , Bagmane Prime Office, REIT, Bharat Coking Coal , etc will also become a part of Nifty 500. The inclusion will come into effect from September 30, 2026. Vedanta Power will also become a part of Nifty Smallcap 250, Nifty Midsmallcap 400 and Nifty Smallcap 500.\n\nVedanta Power\u2019s inclusion in Nifty 500 may improve stock\u2019s visibility among institutional investors and potentially bring passive/index-linked flows, according to Khushi Mistry Research Analyst at Bonanza.\n\n\u201cHowever, the index inclusion should be viewed as a near-term sentiment and liquidity catalyst rather than a standalone fundamental trigger. The bigger question for the stock\u2019s medium-term outlook will be the company\u2019s earnings trajectory, power demand environment, capacity expansion and balance-sheet position,\u201d explained Khushi Mistry. The expert also added that sustained upside will depend on whether operational performance and profitability can support the valuation.\n\nDespite the recent rally in Vedanta Power shares, the overall trend around the stock indicates bearish momentum.\n\n\u201cStock continues to form a Lower Low\u2013Lower High structure, indicating sustained selling pressure and a weak price trend.", "source": "LiveMint Markets", "pub_date_str": "23 Sep 2026, 12:24 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India, Canada & Mexico's $8 trillion trade math looks for cover amid Trump tariff bullet", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, Canada & Mexico's $8 trillion trade math looks for cover amid Trump tariff bullet The Economic Times daily newspaper is available online now. Read Today's Paper India, Canada & Mexico's $8 trillion trade math looks for cover amid Trump tariff bullet SECTIONS India, Canada & Mexico's $8 trillion trade math looks for cover amid Trump tariff bullet ET Online Last Updated: Sep 23, 2026, 12:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is accelerating trade talks with Canada and Mexico as the three countries seek to diversify markets amid disruptions from US tariff policies. India and Canada will hold a fifth round of negotiations from October 5, with a deal potentially being signed during Prime Minister Narendra Modi\u2019s expected Canada visit in December.\n\nBi ensioners' Welfare.\n\nThe demand follows a 16 September judgment of the Himachal Pradesh High Court inBal Dev & Others v. State of Himachal Pradesh & Others. The court did not reduce the existing 15-year period but called for the issue to be examined rationally and objectively in light of changing actuarial and economic conditions.\n\nUnder the existing rules, eligible central government pensioners covered by the Old Pension Scheme (OPS) can commute up to 40% of their basic pension as a lump-sum payment at retirement . The commuted portion is then deducted from their monthly pension and restored after 15 years.\n\nBPS and other pensioner organisations argue that the actuarial assumptions underlying pension commutation date back several years. Furthermore, the current central government commutation table came into effect on 1 January 2006.\n\nBPS has highlighted changes in commutation factors, interest and discount rates, as well as rising life expectancy and changing mortality patterns.", "source": "LiveMint Money", "pub_date_str": "23 Sep 2026, 12:22 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Inside Ari Emanuel's Earliest Days in Hollywood: Memoir Excerpt - hollywoodreporter.com", "full_content": "Inside Ari Emanuel's Earliest Days in Hollywood: Memoir Excerpt hollywoodreporter.com Ari Emanuel, Hollywood\u2019s raging super agent, shares his playbook The Economist Ari Emanuel On His New Memoir, Nikki Finke, Talking To Trump, AI\u2019s Upside & The Hollywood Exec He Hates The Most deadline.com Ari Emanuel Dishes on His Hollywood Career, Paramount Merger and Relationship With Elon Musk Bloomberg.com Why Hollywood\u2019s most notorious agent really needs to shut up telegraph.co.uk", "source": "Google News Business", "pub_date_str": "23 Sep 2026, 12:21 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "LG Electronics India share price target: BOB Capital sees 20% upside | What\u2019s driving the call?", "full_content": "BOB Capital Markets has initiated coverage on LG Electronics India with a \u2018Buy\u2019 rating and a target price of \u20b9 1,980 per share, implying an upside potential of around 20%. The brokerage has valued the company at 50 times the September 2028 estimated earnings per share (EPS).\n\nAccording to BOB Capital Markets, LG Electronics India\u2019s nearly three-decade presence in the country has helped it establish a strong position across key consumer appliance categories, including inverter air conditioners, automatic washing machines, refrigerators and televisions.\n\nThe brokerage expects LG\u2019s market leadership to remain intact over the next three years, supported by strong brand recall, premiumisation, an expanding distribution network and a steady pipeline of new products across premium as well as value segments.\n\nLG\u2019s deeper reach into smaller markets and continued product launches are also expected to help the company outperform overall industry growth, the brokerage said.\n\nBOB Capital Markets expects increasing localisation and backward integration to provide structural support to LG Electronics India\u2019s margins.\n\nThe brokerage highlighted the company\u2019s manufacturing scale and upcoming Sri City facility, which could enable deeper in-house production of key components such as compressors. This is expected to improve control over input costs and provide some cushion against higher copper and aluminium prices and currency volatility.\n\nThe brokerage also expects greater localisation to position LG favourably as quality control order (QCO) norms become more stringent.\n\nWhile domestic sales of products such as air conditioners and refrigerators remain seasonal, BOB Capital Markets expects exports and B2B businesses to provide additional growth engines.", "source": "LiveMint Markets", "pub_date_str": "23 Sep 2026, 12:19 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BlueStone Jewellery share price falls 52-week low today | What's behind the plunge?", "full_content": "BlueStone Jewellery and Lifestyle share price fell over 8.39%, hitting 52-week low on NSE in Wednesday's trading session, defying broader market sentiment, amid higher trading volume.\n\nBlueStone Jewellery shares opened at \u20b9 941.65 apiece today, as compared to previous close of \u20b9 930.40 on Tuesday. The jewellery stock touched a new 52-week low of \u20b9 969.90 on 23 September.\n\nMeanwhile, benchmark indices Sensex and Nifty opened higher on Wednesday. The 30-share BSE Sensex gained 283.66 points to reach 74,812.74 in early trade, while the 50-share NSE Nifty advanced 85.55 points to 23,414.\n\nThe stock witnessed a downward rally as investors rushed to book profits amid market rally. According to data available on NSE, around 41.32 lakhs shares changed hands during the intraday session on Wednesday.\n\nBlueStone reported an adjusted net profit of \u20b9 14 crore in the June quarter, compared with an adjusted net loss of \u20b9 21 crore in the same quarter last year.\n\nRetail sales grew 49% year-on-year, while revenue increased to \u20b9 733 crore, driven by a broader product portfolio and improving consumer demand.\n\nThe growth was supported by strong same-store sales growth (SSSG) across customer cohorts. The company\u2019s consumer base expanded 21% year-on-year, while repeat customers continued to contribute to higher average order values (AOV).\n\nBlueStone recorded SSSG of 39% during the quarter, surpassing the growth reported in Q4FY26 despite the increase in customs duty on gold from 6% to 15%.", "source": "LiveMint Markets", "pub_date_str": "23 Sep 2026, 12:19 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "23 Sep 2026, 01:09 PM IST", "total_stories": 398};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
