<script>

    const allData = {"general": [{"title": "Loan interest rates, EMIs to rise? Two back-to-back 25 bps repo rate hike from RBI soon?", "full_content": "The Reserve Bank of India (RBI) is likely to raise the benchmark interest rate by 25 basis points next month and again in December as a countermeasure to rising crude prices, persistent external shocks and signs of broader inflationary pressures, SBI Research said its Ecowrap report published on Friday.\n\n\u201cWe strongly advocate a 25-bps rate hike in the upcoming October policy (followed by another in December in quick succession),\u201d the report said.\n\nIn August, the apex bank kept the repo rate unchanged at 5.25% for the fourth consecutive review. The next meeting of the Monetary Policy Committee ( MPC ), the RBI's rate-setting panel, is scheduled for October 5-7, 2026.\n\nThe SBI report also noted that the expected repo rate hikes would be driven by evolving economic risks, rather than being linked to any potential action by the US Federal Reserve. It cited the RBI's approach in 2022 as a precedent.\n\nThe central bank's decision to raise interest rates usually has a direct bearing on millions of borrowers and depositors.\n\nThe relationship between repo rates and fixed deposit (FD) rates is closely linked. When the repo rate rises, financial institutions often increase FD rates. If the repo rate rises over the next three months as anticipated, investors will have an opportunity to lock in higher interest rates on their deposits\n\nFor example, during the Covid-19 pandemic, the RBI slashed the repo rate by as much as 115 basis points to 4% over several policy reviews, which led to lower FD rates. However, as inflationary pressures increased, the RBI raised the repo rate, leading to an improvement in FD rates.\n\nSimilarly, the repo rate also indirectly affects interest rates on loans since it is the cost at which banks borrow from the central bank. When the policy rate in increased, banks may adjust lending rates to align with the revised borrowing costs. This can result in changes to loan interest rates or EMIs , particularly for borrowers with floating-rate loans.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 12:51 PM IST", "pub_date_relative": "17m ago"}, {"title": "AI staff 'genuinely frightened' for humanity's future, ex-Anthropic researcher tells BBC - BBC", "full_content": "AI staff 'genuinely frightened' for humanity's future, ex-Anthropic researcher tells BBC BBC We Must Pace the Frontier darioamodei.com Exclusive | Anthropic Researcher Quits Over \u2018Out-of-Control\u2019 AI Fears WSJ One of AI\u2019s Fiercest Critics Says All the Doom Talk Is \u2018Meant to Distract Us\u2019 WIRED Anthropic C.E.O. Dario Amodei Calls for A.I. Slowdown The New York Times", "source": "Google News Business", "pub_date_str": "13 Sep 2026, 12:36 PM IST", "pub_date_relative": "31m ago"}, {"title": "Obama voices caution on AI, urges Democrats to tackle it, NYT says", "full_content": "Former U.S. President Barack Obama has warned that artificial intelligence could be \"dangerous\" if not properly managed, and urged Democrats to frame policy and governance agendas to tackle the issue, the New York Times said on Sunday.\n\nThe remarks at a recent private fundraising event come as growing numbers of U.S. lawmakers call for tougher rules on AI systems after dire warnings from two Anthropic researchers that rapid industry progress risks extinction of the human race .\n\n\"This is something that is moving very fast in private hands, and if we don't get on top of it, I think can be dangerous,\" the newspaper quoted Obama as saying on Thursday.\n\nCiting a partial transcript of remarks from Obama's office, the paper said he encouraged House Minority Leader Hakeem Jeffries to help shape a public conversation on AI policy if Democrats regained the House in midterm elections on November 3.\n\n\"Once you are speaker, I would strongly urge that the Democrats put together a framework for a very public conversation,\" Obama told Jeffries, the paper added.\n\nHe also called for candidates in the 2028 presidential race to make AI one of their central agendas, with a very clear plan to tackle the surrounding safety and economic concerns, the paper said.\n\nObama's office did not immediately respond to a Reuters request for comment.\n\nThe extinction concerns were spurred by cases of AI agents going rogue to hack external systems and AI safety researchers quitting their companies concerned about the technology's risks.", "source": "CNBC Top News", "pub_date_str": "13 Sep 2026, 12:31 PM IST", "pub_date_relative": "36m ago"}, {"title": "Early Warning System To Incubator Network \u2014 Three Top Takeaways From PM Modi's Day 2 Address", "full_content": "The prime minister emphasised that the BRICS must work in unity to address challenges facing the Global South. The Global South's confidence in BRICS has increased, he stressed", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 12:18 PM IST", "pub_date_relative": "49m ago"}, {"title": "BRICS Summit 2026: Chinese President Xi Jinping Skips Gala Dinner On Day 1 \u2014 Here's Why", "full_content": "Xi's absence was notable as he visited India for the first time in seven years, skipping PM Modi's gala dinner for BRICS leaders in New Delhi.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 12:11 PM IST", "pub_date_relative": "56m ago"}, {"title": "Why it\u2019s getting harder for Tata Sons to resist an IPO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Why it\u2019s getting harder for Tata Sons to resist an IPO Tata Capital Share Price Shriram Finance Share Price Cholamandalam Investment & Finance Company Share Price Jio Financial Services Share Price Aditya Birla Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Why it\u2019s getting harder for Tata Sons to resist an IPO SECTIONS Why it\u2019s getting harder for Tata Sons to resist an IPO Bloomberg Last Updated: Sep 13, 2026, 12:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The RBI reportedly rejected Tata Sons\u2019 request for exemption from rules requiring upper-layer NBFCs to list publicly. The decision could intensify pressure on the Tata Group holding company to launch an IPO, despite its efforts to remain private.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Sep 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Top stocks to buy: BHEL, Hindustan Petroleum, Shriram Finance - Check stop-loss, target by Ganesh Dongre of Anand Rathi", "full_content": "Indian stock market : Indian equity markets extended their losing streak for a fifth straight week, weighed down by elevated crude oil prices, rising global bond yields and persistent concerns over US inflation.\n\nThe benchmarks opened the week on a weak footing and remained under pressure for most of the trading sessions. The Sensex declined 2.27% to end at 74,781.76, while the Nifty slipped 2.09% to 23,398.10. Broader markets also faced selling pressure, with the midcap index falling 1.40% and the smallcap index declining 0.88%.\n\nGeopolitical tensions and high crude oil prices continued to dominate investor sentiment. Rising tensions between the US and Iran fuelled concerns about disruptions to global energy supplies, while Brent crude\u2019s return to the US$110-per-barrel level heightened worries over imported inflation, the current account deficit, corporate margins and the rupee.\n\n\u201cThe Indian equity benchmarks ended the week on a negative note, with the Nifty 50 declining nearly 2% to close at 23,398, while the Bank Nifty declined 1.33% during the week. Sectoral performance remained under pressure, with Cement, Metals, Technology and Realty witnessing profit booking and declining nearly 3\u20135%. From a macro perspective, geopolitical uncertainties remain elevated, particularly around the US\u2013Iran tensions and broader developments in the Middle East. Movements in crude oil prices and global market cues are likely to remain important factors for the domestic market in the coming week. Brent crude oil prices surged nearly 8% during the week and closed around $104 per barrel, raising concerns over inflation and global risk sentiment,\u201d said Ganesh Dongre, Senior Manager of Technical Research at Anand Rathi.\n\nAccording to Dongre, the key event to watch in the coming week will be the US Federal Reserve's interest-rate decision.\n\nMarket participants will closely monitor the Fed's stance, guidance and commentary on inflation and future monetary policy.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil Chokepoint Hit: Tanker Strike In Strait Of Hormuz Stokes Global Supply Fears", "full_content": "The latest maritime incident comes as Iran and Gulf states prepare for talks in Oman over regional issues including the future of the Strait of Hormuz.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 11:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "Iranian President Pezeshkian Distances Himself From Houthi Actions, Says We Are Not At War'", "full_content": "Pezeshkian proposed cooperation between Iran, Saudi Arabia, Turkey, Pakistan and other countries on regional security, while stating that individual countries could retain their identities and national interests.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 11:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "8 midcap stocks clock up to 245% EBITDA growth in June quarter. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 8 midcap stocks clock up to 245% EBITDA growth in June quarter. Do you own any? Written by Ritesh Presswala , ETMarkets.com | Sep 13, 2026, 11:42:16 AM IST 1 / 9 Profit Power Quarterly EBITDA growth indicates an increase in earnings before interest, taxes, depreciation, and amortisation, providing an indicator of changes in profitability and operational performance. Within the NSE mid-cap segment, eight stocks reported EBITDA growth of more than 80% in the June 2026 quarter compared with the same period last year (excluding banking and financial stocks), according to StockEdge profitability data.\n\nLloyds Metals & Energy recorded 245% year-on-year EBITDA growth to Rs 2,781 crore in June \u201926, up from Rs 806 crore a year earlier.\n\nRail Vikas Nigam posted a 232% year-on-year jump in EBITDA to Rs 185 crore in June \u201926, compared with Rs 56 crore in the corresponding quarter last year.\n\nOil India reported a 146% year-on-year increase in quarterly EBITDA to Rs 5,793 crore in June '26, up from Rs 2,351 crore in the same quarter last year.\n\nHindustan Copper\u2019s quarterly EBITDA rose 139% year-on-year to Rs 508 crore in June \u201926, compared with Rs 212 crore a year earlier.\n\nOracle Financial Services Software recorded a 122% year-on-year increase in EBITDA to Rs 1,877 crore, versus Rs 846 crore in the corresponding quarter last year.\n\nLodha Developers reported a 95% year-on-year rise in quarterly EBITDA to Rs 1,922 crore in June '26, compared with Rs 984 crore in June \u201925.\n\nCoforge posted an 83% year-on-year increase in EBITDA to Rs 1,058 crore for June \u201926, up from Rs 577 crore in the same quarter last year.", "source": "Economic Times Markets", "pub_date_str": "13 Sep 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Top stocks to buy under \u20b9100 by Sumeet Bagadia: Inox Wind, South Indian Bank, Paisalo Digital; check stop-loss, target", "full_content": "Stocks to buy: Benchmark indices Sensex and Nifty pared most of their early losses to end slightly lower on Friday, supported by a decline in crude oil prices and late-session buying in IT stocks and private sector lender HDFC Bank.\n\nThe 30-share BSE Sensex fell 120.83 points, or 0.16%, to close at 74,781.76. The index had declined as much as 742.43 points, or 0.99%, during the session to hit an intraday low of 74,160.16.\n\nThe 50-share NSE Nifty ended 79.70 points, or 0.34%, lower at 23,398.10. It slipped as much as 246.4 points, or 1.04%, during the day to touch 23,231.40.\n\nNifty 50 witnessed a sharp gap-down opening at 23,270.30, falling 207 points initially, before finding a strong base around the 23,250 zone. The index touched a low of 23,231.40 and later recovered towards 23,448.10, finally closing at 23,398.10, down 79.70 points (-0.34%). Strong buying emerged from the day's lower levels, with short covering visible after the recent decline. Nifty formed a strong bullish candle, although it remained below the previous day's close. RSI stands at 27.22, indicating an oversold zone, while PCR was at 1.02. India VIX rose 4.15% to 12.28, reflecting higher volatility.\n\nOn the Nifty 50 outlook, Sumeet Bagadia, Executive Director at Choice Broking, said that from a technical perspective, Nifty is likely to maintain a Sideways bias, with the 23,250\u201323,300 zone acting as the immediate support area. Resistance is placed at 23,500\u201323,600, and a sustained move above 23,600 could support further recovery, particularly if short covering continues.\n\n\u201cOn the downside, a decisive break below 23,250 may resume the broader selling pressure. The expected trading range for the next session is 23,250\u201323,600. Sector-wise, Nifty IT Services, Private Bank and Media were among the key gainers, while Realty, Metal and Chemical remained the major laggards.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 11:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bitcoin slips to $77,200 as rate pressure clashes with diversification case", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Sep 2026, 11:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "Mumbai businessman\u2019s \u20b96.42 lakh work travel claim denied as he used his wife\u2019s credit card; here\u2019s what ITAT ruled", "full_content": "A Mumbai businessman's claim for \u20b9 6.42 lakh in business travel expenses was rejected by the income tax department after he paid these bills using his wife's credit card. The department questioned the deduction despite the expenses being incurred for business purposes.\n\nThis case concerns a resident of Kanjur Village Road in Mumbai who travelled to Paris, Russia and other countries for professional requirements, according to a news report by The Economic Times .\n\nAccording to the submissions before the tribunal, he incurred total travel expenses of \u20b9 20.32 lakh. Of this amount, he paid \u20b9 6.42 lakh using his wife's credit card, which was reimbursed by him after returning to India.\n\nHowever, the income tax department was not convinced by his explanation. It argued that the \u20b9 6.42 lakh remains unexplained, as his wife had no connection with his business travel, and the expenses in questions were made using her credit card. The income tax assessing officer (AO) consequently disallowed the expenditure from the assessee's business income.\n\nThe income tax officer also examined the other travel expenses claimed by the businessman. He found that \u20b9 1.49 lakh had been paid in cash and disallowed 20% of the amount, citing difficulties in fully verifying the expenses.\n\nHe also made a further disallowance of 20% on the remaining foreign travel expenditure of \u20b9 12.4 lakh due to the businessman's failure to furnish details of the foreign travel expenses , including the particulars of the persons who travelled, and the services rendered by them.\n\nAnother issue was the mismatch between the income disclosed by the businessman in his books of accounts and income reflected in his Form 26AS. While it showed income of \u20b9 79.87 lakh, the taxpayer had reported \u20b9 75.51 lakh in his books.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 11:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "How vulnerable are European stocks to natural gas price shocks?", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Sep 2026, 11:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "New report of attack on Strait of Hormuz shipping fans fears of threats to oil supplies", "full_content": "", "source": "Investing.com News", "pub_date_str": "13 Sep 2026, 11:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Indonesian Ship Carrying Over 240 Passengers Loses Contact, Search Underway", "full_content": "Indonesia launched a search for Virgo Transport 8 carrying 241 people after contact was lost in bad weather. Separately, ferry Mutiara Sentosa 2 caught fire, killing five, while 225 were rescued and 41 remained missing.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 11:11 AM IST", "pub_date_relative": "1h ago"}, e": "2h ago"}, {"title": "IPO Bonanza: NSE, Hero Motors Among 11 Issues To Open For Subscription This Week", "full_content": "Five of the 11 issues are mainboard, namely: NSE IPO, Hero Motors IPO, and offerings from SS Retail, Sonaselection India and Jindal Supreme which are cumulatively eyeing a Rs 24,328.02 crore fundraise.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 11:06 AM IST", "pub_date_relative": "2h ago"}, {"title": "FPIs withdraw Rs 13,138 crore from equities in September so far amid global uncertainty", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FPIs withdraw Rs 13,138 crore from equities in September so far amid global uncertainty Central Depository Services (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper FPIs withdraw Rs 13,138 crore from equities in September so far amid global uncertainty SECTIONS FPIs withdraw Rs 13,138 crore from equities in September so far amid global uncertainty PTI Last Updated: Sep 13, 2026, 11:05:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During the first week of September, a massive outflow of Rs 13,138 crore from Indian equities occurred, marking a stark reversal after foreign investors had previously engaged in net buying during July and August. The pullback can be attributed to global uncertainties, climbing crude oil costs, and rising US bond yields.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "13 Sep 2026, 11:05 AM IST", "pub_date_relative": "2h ago"}, {"title": "South Africa vs Namibia Live Streaming: When And Where To Watch SA vs NAM 3rd T20I Online", "full_content": "South Africa face Namibia in the 3rd ODI on Sept. 13, aiming to seal the series after taking an unassailable 2-0 lead with a 157-run win in the second match.", "source": "NDTV Profit", "pub_date_str": "13 Sep 2026, 11:05 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Loan interest rates, EMIs to rise? Two back-to-back 25 bps repo rate hike from RBI soon?", "full_content": "The Reserve Bank of India (RBI) is likely to raise the benchmark interest rate by 25 basis points next month and again in December as a countermeasure to rising crude prices, persistent external shocks and signs of broader inflationary pressures, SBI Research said its Ecowrap report published on Friday.\n\n\u201cWe strongly advocate a 25-bps rate hike in the upcoming October policy (followed by another in December in quick succession),\u201d the report said.\n\nIn August, the apex bank kept the repo rate unchanged at 5.25% for the fourth consecutive review. The next meeting of the Monetary Policy Committee ( MPC ), the RBI's rate-setting panel, is scheduled for October 5-7, 2026.\n\nThe SBI report also noted that the expected repo rate hikes would be driven by evolving economic risks, rather than being linked to any potential action by the US Federal Reserve. It cited the RBI's approach in 2022 as a precedent.\n\nThe central bank's decision to raise interest rates usually has a direct bearing on millions of borrowers and depositors.\n\nThe relationship between repo rates and fixed deposit (FD) rates is closely linked. When the repo rate rises, financial institutions often increase FD rates. If the repo rate rises over the next three months as anticipated, investors will have an opportunity to lock in higher interest rates on their deposits\n\nFor example, during the Covid-19 pandemic, the RBI slashed the repo rate by as much as 115 basis points to 4% over several policy reviews, which led to lower FD rates. However, as inflationary pressures increased, the RBI raised the repo rate, leading to an improvement in FD rates.\n\nSimilarly, the repo rate also indirectly affects interest rates on loans since it is the cost at which banks borrow from the central bank. When the policy rate in increased, banks may adjust lending rates to align with the revised borrowing costs. This can result in changes to loan interest rates or EMIs , particularly for borrowers with floating-rate loans.", "source": "LiveMint Money", "pub_date_str": "13 Sep 2026, 12:51 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why it\u2019s getting harder for Tata Sons to resist an IPO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Why it\u2019s getting harder for Tata Sons to resist an IPO Tata Capital Share Price Shriram Finance Share Price Cholamandalam Investment & Finance Company Share Price Jio Financial Services Share Price Aditya Birla Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Why it\u2019s getting harder for Tata Sons to resist an IPO SECTIONS Why it\u2019s getting harder for Tata Sons to resist an eclined 2.27% to end at 74,781.76, while the Nifty slipped 2.09% to 23,398.10. Broader markets also faced selling pressure, with the midcap index falling 1.40% and the smallcap index declining 0.88%.\n\nGeopolitical tensions and high crude oil prices continued to dominate investor sentiment. Rising tensions between the US and Iran fuelled concerns about disruptions to global energy supplies, while Brent crude\u2019s return to the US$110-per-barrel level heightened worries over imported inflation, the current account deficit, corporate margins and the rupee.\n\n\u201cThe Indian equity benchmarks ended the week on a negative note, with the Nifty 50 declining nearly 2% to close at 23,398, while the Bank Nifty declined 1.33% during the week. Sectoral performance remained under pressure, with Cement, Metals, Technology and Realty witnessing profit booking and declining nearly 3\u20135%. From a macro perspective, geopolitical uncertainties remain elevated, particularly around the US\u2013Iran tensions and broader developments in the Middle East. Movements in crude oil prices and global market cues are likely to remain important factors for the domestic market in the coming week. Brent crude oil prices surged nearly 8% during the week and closed around $104 per barrel, raising concerns over inflation and global risk sentiment,\u201d said Ganesh Dongre, Senior Manager of Technical Research at Anand Rathi.\n\nAccording to Dongre, the key event to watch in the coming week will be the US Federal Reserve's interest-rate decision.\n\nMarket participants will closely monitor the Fed's stance, guidance and commentary on inflation and future monetary policy.", "source": "LiveMint Markets", "pub_date_str": "13 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "8 midcap stocks clock up to 245% EBITDA growth in June quarter. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 8 midcap stocks clock up to 245% EBITDA growth in June quarter. Do you own any? Written by Ritesh Presswala , ETMarkets.com | Sep 13, 2026, 11:42:16 AM IST 1 / 9 Profit Power Quarterly EBITDA growth indicates an increase in earnings before interest, taxes, depreciation, and amortisation, providing an indicator of changes in profitability and operational performance. Within the NSE mid-cap segment, eight stocks reported EBITDA growth of more than 80% in the June 2026 quarter compared with the same period last year (excluding banking and financial stocks), according to StockEdge profitability data.\n\nLloyds Metals & Energy recorded 245% year-on-year EBITDA growth to Rs 2,781 crore in June \u201926, up from Rs 806 crore a year earlier.\n\nRail Vikas Nigam posted a 232% year-on-year jump in EBITDA to Rs 185 crore in June \u201926, compared with Rs 56 crore in the corresponding quarter last year.\n\nOil India reported a 146% year-on-year increase in quarterly EBITDA to Rs 5,793 crore in June '26, up from Rs 2,351 crore in the same quarter last year.\n\nHindustan Copper\u2019s quarterly EBITDA rose 139% year-on-year to Rs 508 crore in June \u201926, compared with Rs 212 crore a year earlier.\n\nOracle Financial Services Software recorded a 122% year-on-year increase in EBITDA to Rs 1,877 crore, versus Rs 846 crore in the corresponding quarter last year.\n\nLodha Developers reported a 95% year-on-year rise in quarterly EBITDA to Rs 1,922 crore in June '26, compared with Rs 984 crore in June \u201925.\n\nCoforge posted an 83% year-on-year increase in EBITDA to Rs 1,058 crore for June \u201926, up from Rs 577 crore in the same quarter last year.", "sourc     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
