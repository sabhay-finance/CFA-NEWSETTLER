"Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Global Markets | Japan's Nikkei retreats from 6-week high as investors lock in gains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Markets | Japan's Nikkei retreats from 6-week high as investors lock in gains Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Markets | Japan's Nikkei retreats from 6-week high as investors lock in gains SECTIONS Global Markets | Japan's Nikkei retreats from 6-week high as investors lock in gains Reuters Last Updated: Oct 02, 2026, 11:43:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese rubber futures saw a minor decline amid a slight pullback in Tokyo equities, yet they continue to show prospects for growth. The Osaka Exchange's rubber contract dropped due to concerns over interest rates and geopolitical instability. With natural rubber production declining alongside consumption, the market faces ongoing supply challenges.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 11:43 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bajaj Finance to raise Rs 17,500 cr via QIP, pref issue", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bajaj Finance to raise Rs 17,500 cr via QIP, pref issue Bajaj Finserv Share Price Shriram Finance Share Price Jio Financial Services Share Price Tata Capital Share Price Cholamandalam Investment & Finance Company Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bajaj Finance to raise Rs 17,500 cr via QIP, pref issue SECTIONS Bajaj Finance to raise Rs 17,500 cr via QIP, pref issue By Joel Rebello , ET Bureau Last Updated: Oct 02, 2026, 11:35:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bajaj Finance plans to raise up to Rs 17,500 crore through a Rs 11,700-crore QIP and Rs 5,800 crore warrant issue to promoter Bajaj Finserv. The fundraising requires shareholder approval; institutional investors will receive QIP shares while promoter warrants could help maintain Bajaj Finserv\u2019s stake and limit dilution.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 11:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bitget 'not expecting to recover a lot' from $388 million hack, CEO tells CNBC", "full_content": "Approximately $1.1 million of the nearly $388 million stolen from crypto exchange Bitget in last week\u2019s cyberattack has been frozen, as the platform continues efforts to trace and recover the assets.\n\nFrozen assets had not necessarily been returned to the exchange, CEO Gracy Chen told CNBC in an email interview. She did not disclose how much had been recovered.\n\nSpeaking on CNBC\u2019s \u201cSquawk Box Europe\u201d on Wednesday, Chen said she was \u201cnot expecting to recover a lot of funds,\u201d citing the limited recovery from previous cryptocurrency exchange hacks. However, \u201cexchanges have a responsibility to demonstrate how they protect users, particularly when something goes wrong,\u201d she said.\n\nThe exchange valued its protection fund at more than $464 million before the theft. It was drawn down to below $200 million following the hack, according to Bloomberg's calculation of the fund's disclosed wallet addresses, before being restored to more than $300 million. Chen said the replenished fund remained publicly verifiable on-chain and was separate from the reserves backing customer balances.\n\nBitget\u2019s latest Proof of Reserves , based on a Sept. 29 snapshot, showed a self-reported overall reserve ratio of 131%, with all 19 covered assets backed above 100%.\n\n\u201cWe restored the Fund using Bitget\u2019s own capital,\u201d Chen said. \u201cThe financial impact is being absorbed by Bitget rather than passed on to our users.\u201d\n\nInvestigation reports released Sept. 30 by Mandiant , part of Google Cloud, and blockchain security firm SlowMist found that the attackers compromised two third-party security products before gaining access to Bitget\u2019s production wallet systems.\n\nSlowMist traced the earliest malicious activity in available logs to Aug. 31, when a previously unknown, or zero-day, vulnerability was exploited in one of the products.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "FCNR inflows cushion rupee, BoP; FII flows crucial for sustained external stability: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a FCNR inflows cushion rupee, BoP; FII flows crucial for sustained external stability: Report The Economic Times daily newspaper is available online now. Read Today's Paper FCNR inflows cushion rupee, BoP; FII flows crucial for sustained external stability: Report SECTIONS FCNR inflows cushion rupee, BoP; FII flows crucial for sustained external stability: Report ANI Last Updated: Oct 02, 2026, 11:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign currency non-resident inflows have significantly bolstered rupee stability and India's balance of payments. However, the current support from these inflows may not suffice for long-term external stability. Foreign institutional investor flows are crucial for maintaining economic balance as the support from FCNR is absorbed. India's goods deficit has reached a decade-high despite continuous support from services exports and remittances.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "02 Oct 2026, 11:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India goes FTA shopping at G20 as Piyush Goyal works the room with a cart full of trade deals", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India goes FTA shopping at G20 as Piyush Goyal works the room with a cart full of trade deals The Economic Times daily newspaper is available online now. Read Today's Paper India goes FTA shopping at G20 as Piyush Goyal works the room with a cart full of trade deals SECTIONS India goes FTA shopping at G20 as Piyush Goyal works the room with a cart full of trade deals ET Online Last Updated: Oct 02, 2026, 11:24:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's Commerce Minister Piyush Goyal is actively engaged in negotiations for several trade agreements at the G20 meeting. Talks with the US include an interim pact and finalizing issues for a broader agreement. Discussions with Canada aim to conclude a Comprehensive Economic Partnership Agreement by the end of 2026. Existing trade agreements with the UK and Australia are also under review for their implementation and effectiveness.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "02 Oct 2026, 11:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Coal India shares | Nuvama upgrades to Buy, hikes target price on higher e-auction premium", "full_content": "Coal India continued to see strong growth in both volumes and e-auction premiums, supported by higher thermal power generation, lower coal inventories at power plants and elevated imported coal prices, Nuvama Institutional Equities said. The brokerage noted that Coal India\u2019s offtake rose 12.5% year-on-year to 61.2 million tonnes in September 2026, marking the fifth consecutive month of volume growth. Q2 FY27 and H1 FY27 volumes increased 12% and 7.6%, respectively.\n\nFactoring in higher volumes and e-auction prices, Nuvama raised its FY27/FY28 EBITDA estimates by 6%/4%. The brokerage upgraded Coal India to \u2018Buy\u2019 from \u2018Hold\u2019 and raised its target price to \u20b9 501 from \u20b9 454, including DPS of \u20b9 26.5. Nuvama noted that the stock trades at around 4.1x FY28E EV/EBITDA and offers an estimated 6% dividend yield.\n\nNuvama said strong power demand and critically low coal inventories at power plants position Coal India favourably for continued volume growth in the second half of FY27. The brokerage now factors in 7% YoY volume growth to 796 million tonnes in FY27, followed by 4.5% growth to 832 million tonnes in FY28.\n\nCoal India\u2019s average e-auction premium over the notified price rose sharply to 94% in September from 59% in August and 34% a year earlier, Nuvama noted. The increase was driven by coal shortages in India and higher imported coal prices.\n\nThe proportion of offered coal allocated through e-auctions also increased to 72% in September from 40% in H1 FY27, signalling stronger customer demand. Nuvama expects e-auction prices to remain relatively firm in Q3 FY27 amid elevated global coal prices and robust domestic demand.\n\nThe brokerage has raised its FY27 average e-auction premium assumption to 60% from 51%, while estimating premiums of 60% and 49% for FY27 and FY28, respectively, compared with 42% in FY26.\n\nNuvama also highlighted the proposed listing of Coal India\u2019s subsidiary Mahanadi Coalfields Ltd (MCL) as a potential value-unlocking trigger.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 11:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brazil votes in high-stakes election as U.S.-China rivalry and debt loom large", "full_content": "Brazil will hold a knife-edge vote on Sunday as its presidential race kicks off \u2014 but the election's outcome is likely to be felt far beyond the country's borders. Voters will head to the polls to decide whether incumbent Luiz In\u00e1cio Lula da Silva \u2014 known colloquially as Lula \u2014 should remain in office or be replaced by one of 12 alternative candidates. If no \u200bcandidate wins more than 50% of votes \u200bin Sunday's first round, the two candidates with the most support \u2060will progress to a final runoff vote on Oct. 25. Polls point to a tight race, with frontrunners Lula and Fl\u00e1vio Bolsonaro effectively tied for support among voters. A win for left-leaning Lula would mark his fourth presidential term, while victory for Bolsonaro is expected to mark a shift back to his father's right-wing movement.\n\nLula's center-left Workers Party (PT) has been a pioneer of social programs aimed at lifting millions of people out of poverty \u2014 but it has been stained by corruption scandals. Lula himself spent 18 months in prison after receiving a coastal property from an engineering firm involved in the so-called Car Wash corruption investigation. Former president Dilma Rousseff, who succeeded Lula in 2010, was impeached in 2016, having been accused of budget manipulation. Fl\u00e1vio Bolsonaro is a senator and son of former president Jair Bolsonaro, who is currently under house arrest. Jair Bolsonaro was sentenced to 27 years in prison for plotting a coup after losing the 2022 presidential election to Lula.\n\nBolsonaro is widely viewed as the political heir to his father, with his policy mix favoring privatization, spending cuts and close alignment with the U.S. \u2014 policies that have had recent successes across Latin America, with Bolivia, Chile, Colombia and Peru all inaugurating conservative leaders in the last 12 months.\n\nLula, meanwhile, has put Brazilian sovereignty at the center of his campaign.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 11:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Asian Games 2026: Indian Boxer Lovlina Borgohain Wins Women's 75kg Gold", "full_content": "Indian boxer Lovlina Borgohain won the women's 75kg gold at Asian Games with win over Ziyi Bao of China on Friday.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 11:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US bond yields: Trump may disappoint stocks, gold investors with these 2 steps to resolve debt crisis | Experts' view", "full_content": "Amid soaring US bond yields , a section of stocks and gold investors across the world is convinced that the Trump administration can't afford this for long, as it is heightening the American debt crisis . They get an extra booster dose when Chris Wood , Head of Equity Research at Jefferies, started to predict at various news platforms that the evidence of the US bond yields suppression, as it has crossed $40 trillion in August 2026, is available and sooner or later the US Treasury Department would either suppress the US Treasury yields or in an extreme condition, the Donald Trump administration may fix the US bond yields, as the Japanese did in the year 2016.\n\nThose stocks and gold investors who believe in this school of thought may face a major disappointment, as the Trump administration has two more options. According to experts, the US President Donald Trump is facing a debt crisis due to the soaring US bond yields. The US is facing this crisis because it hasn't found a new buyer for its debt. They said that those who believe in US bond-yield suppression may be disappointed, as the Trump administration has other options available. The Trump administration just needs to find a new buyer for its debt, experts said.\n\n\u201cI completely agree with this school of thought that rising bond yields, especially the US 10-year bond yield , are throwing tantrums at the Trump administration. However, one must remember that other options are available. On exercising those options, the Trump administration may surprise and disappoint stocks and gold investors, because it would further put these assets under pressure,\u201d said Avinash Gorakshkar, Founder of Avinash Mentor Research.\n\nGorakshkar said that the Trump administration has various other options.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 11:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Down 10% in a month; Bajaj Finance approves \u20b911,700 cr QIP, \u20b95,800 cr warrants to Bajaj Finserv - Share value impact", "full_content": "Bajaj Finance is gearing up for one of its biggest capital-raising exercises, with the company\u2019s board approving a QIP of up to \u20b9 11,700 crore alongside a \u20b9 5,800 crore preferential issue of warrants to promoter and holding company Bajaj Finserv . The move comes as the NBFC looks to strengthen its capital base, with the proposed transactions together amounting to as much as \u20b9 17,500 crore.\n\nThe announcements came after the boards of both companies met on October 1, with the proposed fundraise subject to applicable regulatory and statutory approvals, including shareholder approval. Bajaj Finance said it would seek shareholder approval for both the QIP and preferential issue through an Extra Ordinary General Meeting.\n\nThe Bajaj Finance board approved raising up to \u20b9 11,700 crore through a Qualified Institutions Placement of equity shares with a face value of Re. 1 each. The issue will be made to Qualified Institutional Buyers under Chapter VI of the SEBI ICDR Regulations.\n\n\u201cRaising of capital through a Qualified Institutions Placement (\"QIP\") for an aggregate amount not exceeding Rs. 11,700 Crore (Rupees Eleven Thousand Seven Hundred Crore only) by the issue of equity shares of face value of Re. 1 each,\u201d Bajaj Finance said in its exchange filing.\n\nAlongside the QIP, the company approved a preferential issue of warrants convertible into an equivalent number of equity shares for an aggregate amount of up to \u20b9 5,800 crore. The warrants will be allotted to Bajaj Finserv, which is the promoter and holding company of Bajaj Finance.\n\nThe issue price for the warrants will be determined at a later stage in accordance with applicable law. Bajaj Finance said the price would be determined by its board or a duly constituted committee and would not be below the applicable floor price under the SEBI ICDR Regulations, subject to required pricing adjustments.\n\nThe warrant issue will involve one investor \u2014 Bajaj Finserv.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Up 45% in 1 year, down 7% YTD: Is this multibagger NBFC stock a buying opportunity now?", "full_content": "Even as Nifty 50 is down almost 10% over the last one year, some of its components have surged up to 45% in this period- one of them is a multibagger NBGC stock that has seen profit booking this year, raising questions if it is a stock to buy now at the current juncture.\n\nThe stock we are discussing is Shriram Finance - the heavyweight non-banking financial company (NBFC) stock, with a market capitalisation of \u20b9 2,22,363 crore on the NSE as of 2 October.\n\nWhile year-to-date, Shriram Finance share price is down 7.33% compared to a 14.25% decline in the Nifty 50, the stock has delivered a strong return of 45.68% in the last 1 year.\n\nOn a monthly scale, the stock shed 11.5% in September, snapping its five-month winning streak.\n\nOn longer timeframes of three and five years, the stock has surged 146% and 265%, respectively, delivering multibagger returns on the NSE.\n\nShriram Finance shares hit a 52-week high of 6 August this year and a 52-week low of \u20b9 611.15 on 30 September last year.\n\nLooking at the fundamentals, experts and brokerage firms find the stock a buying opportunity for the long term, citing the company's diversified franchise, resilient asset quality, and strong underlying demand as key positives for it.\n\nDomestic brokerage firm Motilal Oswal Financial Services has a buy call on the stock with a target price of \u20b9 1,220, which implies a 29% upside from the stock's 1 October close of \u20b9 945 on the NSE.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 10:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jefferies is bullish on 6 healthcare stocks with upside potential of up to 46%. Own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Jefferies is bullish on 6 healthcare stocks with upside potential of up to 46%. Own any? Written by Veer Sharma , ETMarkets.com | Oct 02, 2026, 10:48:54 AM IST 1 / 7 Hospital stocks in focus Hospital stocks including Fortis Healthcare, Dr Agarwal\u2019s, Manipal, Apollo Hospitals and Medanta extended their losses for a second straight session on Thursday, after falling as much as 10% in the previous session, as the Supreme Court questioned steep markups on cancer drugs and asked the government to examine allegations that hospitals require patients to purchase medicines from their own or designated pharmacies. However, Jefferies sees this as an excellent entry point to buy these 6 stocks.\n\nJefferies has a Buy rating on Apollo Hospitals with a target price of Rs 10,350, implying 27% upside, while its FY26E-29E EBITDA CAGR is estimated at 20%.\n\nJefferies has a Buy rating on Dr Agarwal\u2019s Healthcare with a target price of Rs 600, implying 25% upside, while its FY26E-29E EBITDA CAGR is estimated at 23%.\n\nJefferies has a Buy rating on Fortis Healthcare with a target price of Rs 1,125, implying 46% upside, while its FY26E-29E EBITDA CAGR is estimated at 17%.\n\nJefferies has a Buy rating on Max Healthcare with a target price of Rs 1,260, implying 36% upside, while its FY26E-29E EBITDA CAGR is estimated at 18%.\n\nJefferies has a Buy rating on Manipal Health Enterprises with a target price of Rs 870, implying 23% upside, while its FY26E-29E EBITDA CAGR is estimated at 19%.\n\nJefferies has a Buy rating on Medanta with a target price of Rs 1,660, implying 22% upside, while its FY26E-29E EBITDA CAGR is estimated at 22%.\n\nDisclaimer: This article has been written by Veer Sharma, who is not a SEBI-registered Research Analyst or an Investment Adviser.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 10:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "EPFO enrolment campaign for workers left out of PF coverage: Will they lose interest on past contributions?", "full_content": "Salaried workers who were eligible for provident fund (PF) coverage but remained outside the formal system between April 1, 2009 and March 31, 2026, can now be enrolled under a one-time special EPFO campaign.\n\nThe Employees\u2019 Enrolment Campaign ( EEC ) 2026, open until October 31, 2026, allows employers to voluntarily bring eligible employees under the coverage of benefits such as PF, pension and insurance.\n\nHowever, to avail of the relief, the employee must be alive and still employed with the establishment when the employer makes the declaration.\n\nThe campaign provides employers a simplified route to regularise past PF coverage by paying a nominal fee of and meeting other prescribed requirements, instead of facing potential higher costs and consequences later.\n\nA key relief under the campaign is that the employee\u2019s share of EPF contributions will be waived if it was not deducted from wages at the time. This means employees who received their full salary without PF deductions in earlier years will not have to pay those contributions now.\n\nThe employer, however, will have to deposit its PF share from the employee\u2019s declared date of joining, along with applicable interest for the past period, administrative charges, and a lump-sum damage of \u20b9 100.\n\nSo, employees who were not covered by the Employees Provident Fund Organisation (EPFO) during the prescribed 17-year window will neither lose the contributions, nor the interest that would have accrued otherwise.\n\nEmployees who had already exited the establishment before the date of declaration cannot be declared under the campaign.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 10:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Global bond market steadies after sharp sell-off", "full_content": "Heavy selling this week pushed 10-year US Treasury yields to their highest level since 2002", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 10:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "A Brexit reversal is on the table 10 years on from the vote that changed Britain. Here\u2019s what\u2019s at stake", "full_content": "U.K. Prime Minister Andy Burnham suggested this week that British voters could be given the chance to reverse Brexit, the country's highly contentious departure from the European Union a decade ago.\n\nBurnham, who became prime minister over the summer, told the BBC on Wednesday it was \"possible\" a referendum on rejoining the EU could be included in a future election manifesto.\n\nA U.K. general election is not currently expected before 2029. Prime ministers are able to trigger an early snap election with the backing of parliament, but Burnham \u2014 who replaced predecessor Keir Starmer without a public vote \u2014 has ruled out such a move.\n\nIn his interview with the BBC, the prime minister said a referendum \"wouldn't be the right thing to do right now,\" but added that the U.K. must \"consider the options\" for its relationship with the EU, arguing that \"where we are isn't good enough.\"\n\nAsked whether an in-out referendum in a future election manifesto was a possibility, Burnham said: \"yes, things are possible.\"\n\nDuring the previous general election \u2014 which saw Starmer lead the governing Labour party to a landslide victory and end 14 years of Conservative rule \u2014 Burnham was serving as Mayor of Manchester. As he prepared to challenge Starmer's leadership, Burnham pledged not to \"re-run\" arguments over Brexit.\n\nIn a separate interview with the BBC's Today program, Burnham said he wanted to \"look at the options\" for resetting U.K.-EU relations.\n\n\"We could stay as we are. That's definitely an option, if people think this is the right place to stay,\" he said, when asked if he wanted Britain to rejoin the union. \"We could look at what [former finance minister] George Osborne has said about a customs union, we could look at\u2026 the single market or we could go all the way.\"", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Accenture Hiring To Slow In FY27 As AI Boosts Revenue Per Employee", "full_content": "Speaking during Accenture's fourth-quarter fiscal 2026 earnings call, CEO Julie Sweet said the company expects to hire in every market next year, while the pace of hiring will be lower than in fiscal 2026.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 10:29 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI is making cyberattacks faster and harder to detect, Interpol warns. Here\u2019s what companies should watch", "full_content": "Artificial intelligence enables cyber threats by enhancing existing criminal tactics such as scams and fraud, according to Interpol.\n\nAI is enhancing existing criminal techniques rather than revolutionizing them, Bjorn R. Watne, global chief information security officer at Interpol, told CNBC on the sidelines of Tech Week Singapore on Thursday. Scam operators can use AI to target multiple victims simultaneously, while improved translation and digital identities are making it increasingly difficult to distinguish fraudulent interactions from real ones.\n\n\"It's an evolution and not a revolution,\" Watne said, adding that AI is primarily increasing the \"speed and scale\" of existing techniques.\n\nAs cyber threats evolve, companies should prioritize protective actions, according to Watne.\n\nInstead, businesses should first identify their \"crown jewels,\" the assets most critical to keeping their operations running, and determine who would be most interested in stealing or disrupting them.\n\nThey can then use threat intelligence to understand the tactics and technologies used by those adversaries and tailor their defenses accordingly.\n\n\"There is no need for everyone to try and protect against everything all at once when they're not being targeted by it,\" he said. The defenses needed can vary depending on whether a company faces opportunistic criminals or advanced persistent threat actors, he added.\n\nCompanies are also often hampered by a disconnect between senior management and their cybersecurity strategy, he said.", "source": "CNBC World Economy", "pub_date_str": "02 Oct 2026, 10:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Market crash wipes out Rs 26 lakh cr in 8 weeks! Why soaring bond yields may hurt Sensex, Nifty more than elevated oil prices", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market crash wipes out Rs 26 lakh cr in 8 weeks! Why soaring bond yields may hurt Sensex, Nifty more than elevated oil prices Angel One Share Price Choice International Share Price JM Financial Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market crash wipes out Rs 26 lakh cr in 8 weeks! Why soaring bond yields may hurt Sensex, Nifty more than elevated oil prices SECTIONS Market crash wipes out Rs 26 lakh cr in 8 weeks! Why soaring bond yields may hurt Sensex, Nifty more than elevated oil prices By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 02, 2026, 10:22:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Sensex and Nifty have fallen for eight straight weeks, wiping out more than Rs 26 lakh crore in market capitalisation. While elevated oil prices have pressured equities, soaring bond yields, foreign outflows, a stronger dollar and tighter liquidity are adding to the selling pressure and weighing on investor sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 10:22 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Buy ONGC, Sell Oil India| Kotak raises FY27 oil price assumption to $90", "full_content": "Kotak Institutional Equities maintains a BUY on ONGC with a fair value of \u20b9 355 and a SELL on Oil India with a fair value of \u20b9 360. The brokerage raised its FY27 crude oil price assumption to $90 per barrel from $85, while retaining its FY28 and long-term assumptions at $75 per barrel. Kotak prefers ONGC over Oil India, citing a stronger medium-term production outlook, better realisations, rising contribution from new fields and relatively inexpensive valuations.\n\nKotak Institutional Equities said the West Asia conflict has resulted in one of the largest oil supply disruptions in recent history, with the disruption persisting for seven months and limited visibility on a return to normalcy. However, the brokerage noted that global oil markets have remained resilient and largely well managed.\n\nThe brokerage said crude flows through the Strait of Hormuz have improved, reaching around 13 million barrels per day in September 2026, the highest level since the conflict began. While Brent crude averaged nearly $100 a barrel in the first half of FY27, Kotak expects prices to ease in the second half, assuming hostilities do not intensify and supply flows continue to normalise.\n\nAgainst this backdrop, Kotak raised its FY27 Brent crude assumption to $90 a barrel from $85, while retaining its FY28 and long-term assumption at $75 a barrel.\n\nKotak said ONGC remains its preferred upstream play, despite recent production weakness and challenges at KG-98/2. The brokerage expects the company's outlook to improve, supported by rising gas production from new fields and higher gas realisations from NWG.\n\nMore importantly, Kotak highlighted ONGC's technical service provider (TSP) agreement with BP for its Western Offshore assets, which account for around 70% of production. The agreement is expected to strengthen ONGC's medium-term production outlook.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 10:12 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ESDS, Lumino, Purple Style Labs: 18 IPO stocks facing anchor lock-in expiry in October - Check full list", "full_content": "The October IPO calendar is set to bring another important event for investors tracking recently listed stocks, with shares allotted to anchor investors in 18 companies becoming eligible for trading during the month.\n\nAccording to a fortnightly review by PL Research, these lock-in expiries cover 14 companies under the 30-day period and four companies under the 90-day period between October 5 and October 16, 2026.\n\nAnchor investors typically receive shares before an IPO opens to the broader public, but those shares remain locked for a specified period. Once the lock-in expires, the shares become eligible for trading. This does not necessarily mean that investors will sell the shares, but the additional tradable supply can become an important factor for market participants, particularly when a stock has delivered strong gains since listing.\n\nAs per the report, among the 14 companies approaching their 30-day lock-in expiry, Purple Style Labs and Manipal Payment & Identity Solutions have the highest proportion of shares becoming eligible for trading, at around 22% of their respective total shares. Rays of Belief follows with around 20%.\n\nLumino Industries, ESDS Software Solution , Priority Jewels, Deepa Jewellers, Glass Wall Systems, Prasol Chemicals, Kanohar Electricals, Rentomojo, Asset Reconstruction Co. (India) and Steamhouse India each have approximately 15% of their total shares becoming eligible for trading. Pranav Constructions has the lowest proportion among this group at around 12%.\n\nThe individual lock-in data shows that Purple Style Labs has 26,60,869 shares, or 22%, becoming eligible on the 30-day expiry, while Manipal Payment & Identity Solutions has 53,42,916 shares, also representing 22%. Rays of Belief has 10,46,095 shares, or 20%, becoming eligible.\n\nFor investors, the scale of the potential supply is particularly relevant when compared with the company's total outstanding shares and recent price performance.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 09:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold price today: Precious metal slips ahead of US Jobs data; MCX closed for Gandhi Jayanti", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Gold price today: Precious metal slips ahead of US Jobs data; MCX closed for Gandhi Jayanti The Economic Times daily newspaper is available online now. Read Today's Paper Gold price today: Precious metal slips ahead of US Jobs data; MCX closed for Gandhi Jayanti SECTIONS Gold price today: Precious metal slips ahead of US Jobs data; MCX closed for Gandhi Jayanti By Kumar Gaurav , ETMarkets.com Last Updated: Oct 02, 2026, 0 kets", "pub_date_str": "02 Oct 2026, 09:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Emerging markets outperform developed markets as bond rout deepens", "full_content": "Fiscal discipline, institutional strength and a willingness to fight inflation have shielded developing countries so far", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 09:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EG Group delays IPO plans and draws takeover interest", "full_content": "Petrol station empire had filed for New York listing aiming to raise about $1bn at $9bn valuation", "source": "FT Markets", "pub_date_str": "02 Oct 2026, 09:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Top 2 stocks to buy or sell for short-term: Laurus Labs, Canara Bank by Chandan Taparia - Check stop-loss, targets", "full_content": "Domestic markets will close on October 2 for Gandhi Jayanti, resuming trading on October 5. The BSE Sensex and NSE indices fell for a record eighth week, impacted by foreign selling and rising oil prices. The Indian rupee weakened to \u20b996.3150 against the dollar.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 09:23 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI winners and losers are emerging in Indian IT, says BNP\u2019s Kumar Rakesh", "full_content": "AI-driven revenue deflation and weak tech spending are reshaping India\u2019s IT sector, with some mid-cap firms better placed than larger peers to navigate the shift.", "source": "LiveMint Markets", "pub_date_str": "02 Oct 2026, 09:11 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty valuations near post-Covid lows. Alchemy Capital\u2019s Alok Agarwal explains what investors should buy now", "full_content": "Nifty valuations have reset sharply from 2024 levels and are now near post-Covid lows, says Alchemy Capital\u2019s Alok Agarwal. He sees the next phase of market growth broadening beyond large caps. Mid- and small-caps, AI infrastructure, healthcare, manufacturing and select defence companies offer opportunities, while global yields and FPI flows remain key.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 09:08 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India growth may slow to 5.5-6% in H2FY27 as capex moderates: Report", "full_content": "India's economic growth is projected to slow to 5.5-6% in the second half of 2026-27. This slowdown follows a robust growth of 7-7.5% in the first half of the financial year. Combined capital expenditure growth is expected to moderate significantly from 13.2% to around 4% in the latter months. Additionally, the central government's capital expenditure growth will weaken due to a declining fiscal position.", "source": "Economic Times Economy", "pub_date_str": "02 Oct 2026, 08:53 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Treasury yield hits the highest since 2002 at 5.34%", "full_content": "The yield on the 10-year Treasury note has surged past its 2007 high, now sitting at 5.34%. At the same time, 30-year US bonds have hit a 24-year peak this week. The rise in global sovereign debt is primarily driven by escalating oil prices amid the ongoing Middle Eastern conflict. Investors are now bracing for potentially further interest rate hikes from central banks.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 08:47 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "D-Street logs longest spell of week slump in 25 years", "full_content": "Indian equity markets faced significant pressure as US bond yields surged, leading to a record selloff. The Sensex and Nifty experienced prolonged declines, surpassing previous downturns witnessed during the Covid pandemic. Foreign investors continued to withdraw their investments amidst rising crude oil prices, negatively impacting the rupee's value. Analysts suggest selective stock opportunities may arise despite challenging macroeconomic conditions.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 08:45 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sri Lotus shares rally 29% in a month. Can luxury and redevelopment sustain the momentum?", "full_content": "Sri Lotus Developers & Realty has seen a remarkable 29% increase in shares, significantly outpacing the wider market. This boost is attributed to the anticipation surrounding their luxury initiatives and redevelopment projects, which promise robust pre-sales and profit margins. With 22 projects planned, the anticipated gross development value ranges from \u20b917,500 to \u20b918,000 crore. Furthermore, collections have surged year-over-year, suggesting a bright growth trajectory for the current fiscal year.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 08:43 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic Targets Mega IPO As Soon As November, Eyes Pre-Thanksgiving Debut", "full_content": "Anthropic had a net loss of almost $42 billion in 2025, a roughly fivefold increase from about $8.3 billion the year before, Bloomberg News reported in August.", "source": "NDTV Profit", "pub_date_str": "02 Oct 2026, 08:39 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FPIs pull record Rs 3 lakh crore from Indian equities in 9 months. More pain ahead?", "full_content": "In an unprecedented turn of events, foreign portfolio investors have divested a staggering amount exceeding \u20b93 lakh crore from Indian equities within the initial nine months of 2026. This marks a record outflow, largely driven by rising US bond yields and ongoing geopolitical conflicts, which diminish India's appeal for international investors.", "source": "Economic Times Markets", "pub_date_str": "02 Oct 2026, 08:36 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "India, Bulgaria review bilateral ties; push for early India-EU FTA", "full_content": "India and Bulgaria have called for early implementation of the India-EU free trad     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
