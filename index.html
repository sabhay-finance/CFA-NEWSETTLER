<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Jensen Huang affair puts Nvidia's future at risk, with no clear successor to the renowned CEO", "full_content": "Nvidia CEO Jensen Huang 's admission of an affair with a purported Chinese spy has raised questions about his future at the company, and what happens if the 63-year-old co-founder, who built the chipmaker into one of the most valuable businesses on the planet, is forced out.\n\nShares of Nvidia sank more than 4% on Monday, even as the broader market rallied sharply, after Huang acknowledged the affair in a message to staff on Sunday, and said that the board was launching an investigation into whether he was targeted by a foreign intelligence agency. The board said it has \"confidence in Jensen,\" and that it has \"no reason to believe that either national security or Nvidia secrets were compromised.\"\n\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\n\nWhile Nvidia says Huang will continue to lead the company during the probe, pressure is rapidly mounting on the chipmaker, whose technology has powered the first four years of the generative artificial intelligence boom. Leaders from both parties are calling for briefings, and Democrats poised to take control of both houses of Congress are calling for investigations and new legislation \"to stop advanced AI chips from fueling China's military,\" Sen. Elizabeth Warren of Massachusetts wrote in a post on X on Monday.\n\nHuang has outsized influence over Nvidia, and is the sole face of the company with no clear second-in-command.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 04:26 AM IST", "pub_date_relative": "6m ago"}, {"title": "Skydance outlines its $6 billion in planned cost savings. Here's the breakdown", "full_content": "Skydance is pulling back the curtain on how it plans to achieve at least $6 billion in cost savings in the next three years.\n\n\"By combining two global streaming services, two film and TV studio groups, two television portfolios, and overlapping corporate functions, we can reduce duplicative spend across an expense base of more than $50 billion,\" the company wrote in a letter to shareholders Monday as part of Paramount Skydance's third-quarter earnings release.\n\nSkydance, the newly formed combination of Paramount Skydance and Warner Bros. Discovery, said it projects at least $2.2 billion in cost reductions from eliminating \"redundant back-office and corporate functions,\" including eliminating management layers and ramping the use of artificial intelligence. Those savings also account for \"rationalizing\" its office footprint.\n\nSkydance expects at least $1 billion in savings from streamlining marketing and promotional spending. And around $1.4 billion in savings will come from unifying its streaming businesses and broadcast architecture and integrating back-end technology.\n\nA final $1.4 billion in savings will be tied to \"optimizing third-party spend,\" eliminating overlapping expenses, and consolidating purchasing decisions to one centralized group, Skydance said.\n\n\"We are confident in achieving these savings, drawing on our playbook from Paramount,\" the company wrote. \"That program is on track to achieve over $2.7 billion in run-rate efficiencies by the end of 2026.\"\n\nLast month, Skydance began offering voluntary buyouts to employees ahead of official layoffs. At the same time, the company adopted a five-day-per-week in-office policy. Additionally, last week saw the departure of eight executives \u2014 four from Warner Bros. and four from Paramount.\n\nThe company has previously said it plans to eventually merge the Paramount+ and HBO Max streaming services into a single platform.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 04:25 AM IST", "pub_date_relative": "7m ago"}, {"title": "Earnings call transcript: American Public Education tops Q3 2026 estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:25 AM IST", "pub_date_relative": "8m ago"}, {"title": "Earnings call transcript: Exodus posts q3 2026 revenue beat as shares swing lower", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:24 AM IST", "pub_date_relative": "8m ago"}, {"title": "Helus Pharma at Guggenheim: phase iii data, cash runway in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:24 AM IST", "pub_date_relative": "9m ago"}, {"title": "Surgery Partners Inc earnings beat by $0.04, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:23 AM IST", "pub_date_relative": "9m ago"}, {"title": "Rani Therapeutics Holdings earnings beat by $0.01, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:23 AM IST", "pub_date_relative": "9m ago"}, {"title": "Earnings call transcript: Zeta Global tops Q3 2026 forecasts, shares slip after hours", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:22 AM IST", "pub_date_relative": "10m ago"}, {"title": "Graphano Energy closes first tranche of private placement", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:22 AM IST", "pub_date_relative": "10m ago"}, {"title": "Take-Two Q2 FY2027 slides: mixed results, GTA VI pre-orders soar", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:21 AM IST", "pub_date_relative": "11m ago"}, {"title": "Earnings call transcript: Coincheck Group posts wider loss in Q2 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:20 AM IST", "pub_date_relative": "12m ago"}, {"title": "Earnings call transcript: Archer Aviation posts revenue beat in Q3 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:20 AM IST", "pub_date_relative": "13m ago"}, {"title": "Rocket Lab shares dip after the company\u2019s \u2018defining\u2019 quarter misses the mark", "full_content": "The rocket-launch company just posted a steeper loss than analysts were expecting.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 04:19 AM IST", "pub_date_relative": "14m ago"}, {"title": "Here\u2019s how Bernie Sanders wants to keep Social Security solvent \u2018for generations\u2019", "full_content": "The Vermont senator aims to eliminate the taxable maximum, making the wealthy pay more in taxes", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 04:19 AM IST", "pub_date_relative": "14m ago"}, {"title": "Hegseth impeachment articles introduced by Rep. Massie", "full_content": "Rep. Thomas Massie , R-Ky., on Monday introduced articles of impeachment against Defense Secretary Pete Hegseth , triggering a vote in the House of Representatives as early as this week.\n\nThe unusual impeachment push against Hegseth by a member of his own party comes after Democrats swept to majorities in both the House and Senate during last week's midterm elections . Many Republicans, including Vice President JD Vance , have cited the Iran war Hegseth has led as a reason for the electoral bludgeoning.\n\nMassie, who lost his reelection bid in a Republican primary in May, introduced eight articles of impeachment against Hegseth. They include waging war in contravention of war powers resolutions Congress passed to limit war, extrajudicial killings tied to boat strikes in the Caribbean that purported to target drug smugglers and suppressing free speech by targeting Sen. Mark Kelly, D-Ariz., a veteran.\n\n\"Wherefore, Secretary of Defense Peter Hegseth, by such conduct, has demonstrated that he will remain a threat to the Constitution if allowed to remain in office, and has acted in a manner grossly incompatible with his duties and the rule of law,\" the articles, which Massie read from the House floor, read. \"Peter Brian Hegseth thus warrants impeachment and trial, removal from office, and disqualification to hold and enjoy any office of honor, trust, or profit under the United States.\"\n\nMassie's resolution will force House Republican leaders to put the measure up for a vote by the end of this week. Impeachment resolutions are privileged, meaning the House must act on them, table them or vote to refer them to committee within two legislative days.\n\nPresident Donald Trump once again defended Hegseth later Monday, telling reporters at the White House he will stand by the secretary even if he is impeached.\n\n\"He won two wars.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 04:11 AM IST", "pub_date_relative": "22m ago"}, {"title": "Trump questions midterm election results, revives voting-machine conspiracy", "full_content": "President Donald Trump on Monday questioned the legitimacy of the midterm election results, resurrecting his pattern of raising doubts about electoral losses for himself and other Republicans .\n\nTrump's social media post raising questions about the election came six days after his fellow Republicans suffered historic defeats at the polls nationwide, including in several GOP strongholds like Texas and South Carolina .\n\n\"Does anybody really believe that this 'Election' was honest,\" Trump wrote on Truth Social.\n\n\"How could the Polls be so wrong??? Some early voting 'dumps' were so large that it was impossible to win, no matter how many people went to vote,\" the president said. \"It's all about the machines, which are far more important than the voter!\"\n\nTrump's post was a sharp pivot from what has been a conciliatory tone after last Tuesday's thumping of Republican candidates, which resulted in Democrats regaining majorities in both the Senate and House of Representatives.\n\nOn Election Night, Trump told The New York Times that he was \"absolutely willing\" to accept the results of the midterms, and that he was willing to work with Democrats.\n\n\"We'll, you know, look forward to working with them,\" Trump told The Times. \"We'll probably work something out.\"\n\nThe next day, Trump said, \"I'll get along probably with the Democrats unless they want to be destructive.\"", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 04:10 AM IST", "pub_date_relative": "23m ago"}, {"title": "Nvidia\u2019s Trump ties draw scrutiny after reports Huang was targeted by Chinese intelligence", "full_content": "Nvidia CEO Jensen Huang has spent the last two years cultivating an unparalleled relationship with President Donald Trump , gaining extraordinary access and influence over federal artificial intelligence policy as his company has pushed for looser restrictions on selling advanced chips to China .\n\nNow, revelations about Huang's affair with a suspected Chinese spy are putting that carefully built alliance under scrutiny \u2013 along with the millions of dollars Huang and other Nvidia executives have spent expanding its political influence in Washington.\n\nThe chipmaker is nearly inseparable from its co-founder and CEO Huang, who has over Trump's second term gone from being nearly unknown to the president to being part of a small cadre of executives accompanying him on Air Force One.\n\nNvidia has committed at least $26 million to Trump's pet projects, including $25 million toward his White House ballroom and $1 million to his 2025 inaugural fund . The company initially sought to keep its ballroom contribution anonymous, according to documents obtained by The Washington Post . Its ballroom pledge was tied with Apple's for the largest disclosed corporate contribution, the Post reported.\n\nThose ties are drawing renewed scrutiny from congressional Democrats including Sen. Richard Blumenthal , D-Conn., who pressed Huang in November 2025 about Nvidia's ballroom donation and White House contacts. Blumenthal re-upped his warning on Thursday, while expected incoming House oversight Chairman Robert Garcia , D-Calif., vowed to investigate corporate corruption when Democrats take control in January.\n\nTrump continued to defend Huang on Sunday, calling him an \"honorable guy\" and saying he had heard nothing suggesting wrongdoing. The president was briefed about the suspected Chinese intelligence operation in October 2025 but chose not to act, according to The New York Times .", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 04:10 AM IST", "pub_date_relative": "23m ago"}, {"title": "3 unexpected reasons the October jobs report was so strong", "full_content": "A little-noticed category in Friday's blockbuster jobs report is challenging the consensus view about job losses caused by artificial intelligence.\n\nAt least for now, the data suggests the U.S. is gaining jobs as a result of the AI boom, not losing them.\n\nAnd another category suggests the strong jobs numbers could have some staying power.\n\nNonfarm payrolls grew by 165,000 jobs in October, according to the Friday report from the Bureau of Labor Statistics. It was a surprising surge in hiring that blew way past Wall Street's expectations. Economists polled by Dow Jones had forecast growth of just 59,000 for the month.\n\nHere are three surprising things you might have missed from the report.\n\nHiring for consultants surged in the month, sending the profession's total head count to a fresh record.\n\nThe labor force for management, scientific and technical consultants expanded by 17,300 jobs between September and October, the largest month-over-month increase in nearly two years. This category is a subset of the professional and business services sector tracked by BLS and accounted for 25% of the entire sector's gains for the month.\n\nWhat's more, this workforce has grown by more than 45,000 jobs over the past year. That gain pushed the total employee base for these types of workers past 1.9 million for the first time on record, according to BLS data.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 03:53 AM IST", "pub_date_relative": "39m ago"}, {"title": "Stocks making the biggest moves after hours: Trade Desk, Sanmina, Securitize & more \u2014 Live updates", "full_content": "Traders closely watched quarterly results rolling in from entertainment giant Skydance and electronic manufacturing firm Sanmina after the market close.\n\nBoth names diverged sharply, with Skydance skidding on a newly announced plan to cut $6 billion in costs. Sanmina, however, jumped on a rosy outlook.\n\nThe stock market wrapped up Monday's trading on a strong note, with the S&P 500 rising more than 2% for its best session since April.\n\nThe action comes after a losing week that was largely led by declines in tech. The sector saw a rebound to begin this week, but Nvidia sat out Monday's rally after CEO Jensen Huang admitted to having a relationship with an alleged Chinese spy.\n\nFollow below as CNBC breaks down the biggest stock market moves of the day:\n\nShares for the Trade Desk jumped over 19% after the company reported better-than-expected third-quarter results.\n\nThe global advertising technology company earned 33 cents a share on an adjusted basis and notched revenue of $736 million. That's higher than the 25 cents per share and $650 million anticipated by analysts polled by LSEG.\n\nTrade Desk in the past day The company also sees fourth-quarter revenue of at least $755 million, trouncing the $650 million estimate. Guidance for adjusted EBITDA in the current quarter also came in sharply above estimates.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 03:43 AM IST", "pub_date_relative": "49m ago"}, {"title": "JPMorgan Weighs Big Discount to Lure Lenders for Software Debt", "full_content": "(Bloomberg) -- Banks led by JPMorgan Chase & Co. could offer one of the year\u2019s biggest discounts to sell some of the $5 billion in debt for software firm Qualtrics International Inc. that the underwriters were stuck holding a few months ago.\n\nBankers have scheduled meetings with investors this week to discuss the sale of nearly $2 billion of debt in the high-yield bond market, according to people with knowledge of the matter. Initial indications are that the debt could be marketed at a coupon of at least 8% and a discounted rate of about 85 cents on the dollar, said the people, requesting anonymity as the talks are private.\n\nIf a deal was struck at that price, it would represent one of the biggest new-issue discounts for a debt sale in the US high-yield market this year, according to data compiled by Bloomberg. A number of software companies have had to pay high borrowing costs and boost protections to lock in lenders in recent months, as concerns about AI-disruption to their businesses have intensified.\n\nA debt sale for Qualtrics could come as soon as next week and price before the Thanksgiving holiday, the people said. Representatives for JPMorgan and private equity firm Silver Lake, which owns Qualtrics, declined to comment. A representative for Qualtrics didn\u2019t respond to a request for comment.\n\nQualtrics, which makes online survey tools, agreed to buy data analytics firm Press Ganey Forsta more than a year ago in a deal valued at $6.75 billion. Eleven banks committed about $5.3 billion in debt financing for the transaction, and the group started preliminary discussions with investors earlier this year to sell that down.\n\nBut they were forced to pause those talks in March after the company became caught up in a wider software selloff, prompted by worries that advances in artificial intelligence could render some businesses obsolete.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 03:43 AM IST", "pub_date_relative": "50m ago"}, {"title": "EIB\u2019s Calvino Says US Turmoil Is Driving Capital to Europe", "full_content": "Europe is set to benefit from recent market turmoil in the US as investors seek a safe haven, according to European Investment Bank President Nadia Calvino.\n\n\u201cTurbulence in the US is making capital flow to Europe,\u201d she told Bloomberg TV in an interview on Monday. \u201cI expect that to continue.\u201d\n\nCalvino said she doesn\u2019t see any negative impact on investment in Europe at the moment, adding that there had been very strong demand for EIB bond issuance and that she expects more of the same in January.\n\n\u201cRight now we\u2019re confronted with turbulence and instability in the financial markets, so it\u2019s of the utmost importance that we preserve Europe as a safe haven in this context,\u201d she said.\n\nCalvino, who heads the Luxembourg-based institution that is effectively the lending arm of the European Union, was speaking as euro-area finance ministers meet in Brussels for the first time since nominations closed for candidates to replace European Central Bank President Christine Lagarde.\n\nShe expects her successor to \u201ccontinue her policies and approach,\u201d she said. \u201cIt is critical we preserve independence in decision making\u201d at the ECB, she added.\n\nDutchman Klaas Knot and Spain\u2019s Pablo Hernandez de Cos are the two official candidates to succeed Lagarde, who is stepping down almost nine months early. Calvino described both as \u201cvery strong technically.\u201d\n\nSpeaking ahead of Monday\u2019s meeting, Kyriakos Pierrakakis, president of the Eurogroup, said that the gathering would be an \u201cinformation point\u201d in the process of selecting a candidate.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 03:40 AM IST", "pub_date_relative": "53m ago"}, {"title": "As Nvidia\u2019s stock falls, here\u2019s what Wall Street has to say about the Jensen Huang scandal", "full_content": "The fallout from the board\u2019s new investigation could become \u201ca longer-lasting problem for the company,\u201d analysts say.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 03:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "As Nvidia probes Jensen Huang affair, here's the board member likely to play a big role", "full_content": "Nvidia CEO Jensen Huang is facing an internal investigation after admitting to an affair with a Chinese businesswoman who U.S. intelligence agencies believe is a Chinese spy.\n\nWhile the company has not yet named specific investigators, that probe is being helmed by the board with help from outside counsel, according to Nvidia. Lawyer Stephen Neal is the board's lead independent director and head of corporate governance, likely making him a key figure in the investigation.\n\nIn a statement , Nvidia's board said it has \"no reason to believe that either national security or Nvidia secrets were compromised,\" though it will examine all evidence. China has dismissed the espionage claims. Huang, one of the most powerful businessmen in the artificial intelligence boom, said he would \"cooperate fully\" with the process.\n\nYet the probe has sparked uncertainty around Huang's future at the chipmaker and raised concerns of broader ripple effects to companies in the tech sector that are exposed to the AI build-out.\n\nIn a Monday note, Citi analysts wrote that one of the key issues for investors moving forward will be \"potential governance implications\" and \"increased regulatory scrutiny\" as the company navigates the investigation.\n\nNvidia's board has 10 independent members, including a former president of Taco Bell , a former Eli Lilly executive and a former vice chairman from Goldman Sachs . Neal, who joined Nvidia's board of directors in 2019, is a chairman emeritus and senior counsel of the law firm Cooley LLP, where he also served as CEO from 2001 to 2008.\n\nIt won't be his first corporate governance probe. According to Cooley , Neal has litigated cases across securities, bankruptcies, antitrust, takeovers and more. And he's conducted several investigations for multiple boards of directors, including at General Motors , where he advised the company in disputes with Ross Perot.\n\nHe also guided Walter Hewlett and the Hewlett Trust to stop a merger between Hewlett-Packard Co.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 03:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dow sees its third 1,000-point swing in four days. Why the volatility isn\u2019t over yet.", "full_content": "\u201cIt took one election and a poor Nvidia headline to go from D.C. being a tailwind to D.C. as a potential headwind,\u201d says strategist.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 03:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018We had the worst fight\u2019: I want my husband to retire at 65, but I don\u2019t want to lose his $280,000 salary. Is that unreasonable?", "full_content": "\u201cWe have $2.6 million, most of it in his 401(k) and IRAs, plus $450,000 in a brokerage account.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 03:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Are AMD and Broadcom the real winners of the Nvidia spy scandal?", "full_content": "The chip makers\u2019 shares were posting big gains Monday \u2014 but those companies could also be subject to greater scrutiny over their sales practices, analysts say.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 03:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Lucid misses Wall Street\u2019s earnings expectations, expands loan from Saudi Arabia fund", "full_content": "Lucid Group missed Wall Street's third-quarter expectations as the embattled electric vehicle maker continues an \"operational reset\" aimed at cutting costs and narrowing losses.\n\nThe company on Monday also announced a $1.75 billion increase in a delayed draw term loan from Saudi Arabia's Public Investment Fund, the company's largest shareholder.\n\nHere's how Lucid performed in the third quarter compared with average estimates compiled by LSEG:\n\nDespite the top- and bottom-line misses, the company's adjusted earnings before interest, taxes, depreciation and amortization of a loss $726 million beat Wall Street's expectations of a loss of $611 million for the third quarter. Its net loss for the quarter was $830.9 million, down from a loss of $978.4 million a year earlier.\n\nLucid's 2025 third quarter included revenue of $336.6 million, a loss of $3.31 per share and an adjusted EBITDA loss of $717.7 million.\n\nThe quarterly results are the first since Lucid CEO Silvio Napoli , who started leading the company in June, announced a restructuring plan that included implementing several cost-cutting efforts and delaying the company's upcoming midsize vehicle from the end of this year until the second half of next.\n\n\"Our transformation is beginning to show progress. We are acting with urgency, strengthening the fundamentals and driving greater discipline, while continuing to invest in the priorities to deliver profitable long-term growth,\" Napoli said in a release.\n\nThe company's turnaround plan includes $1.4 billion in cash flow improvements this year as well as focusing attention on a robotaxi program with Uber and Nuro, a factory that's under construction in Saudi Arabia and the midsize vehicle.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:57 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dow surges 1,100 points, Nasdaq climbs more than 2% as tech rebounds from last week\u2019s tumult: Live updates", "full_content": "Stocks surged on Monday, boosted by a decline in oil prices as well as gains in technology shares after last week's volatility.\n\nThe Dow Jones Industrial Average popped 1,104.02 points, or 2.15%, to close at 52,389.75. The blue-chip index was supported by gains in stocks such as Goldman Sachs and Caterpillar . The S&P 500 rose 2.35% to end at 7,549.94 for its best day since April 8, while the Nasdaq Composite gained 2.74% to 25,253.14.\n\nWith Monday's rally, the Dow is now above the level it closed on Election Day. The S&P 500 and tech-heavy Nasdaq still remain slightly below, however.\n\nOil prices fell on Monday, lifting investor sentiment. U.S. West Texas Intermediate futures dropped 4.38% to settle at $86.85 per barrel. International benchmark Brent slid 5.85% to $92.57 per barrel.\n\nFriday's market partially rebounded from Thursday's brutal artificial intelligence-driven sell-off, as chip stocks recovered on renewed buying. However, concerns linger in the wake of the Democrats' strong midterm results, with investors fearing that tighter regulations on data center construction, energy use, and development costs could slow the AI infrastructure boom .\n\nThe tech sector also focused on the bombshell announcement Sunday that Nvidia's board of directors is opening an investigation into co-founder and CEO Jensen Huang's relationship with a businesswoman who U.S. intelligence agencies say is a Chinese spy. Nvidia shares closed down 4%.\n\n\"Magnificent Seven\" names were higher contrary to Nvidia. Amazon gained about 3%, while Tesla and Alphabet climbed 5.5% and 1%, respectively. Microsoft also added almost 3%.\n\nOther chip stocks advanced as well, with Broadcom popping nearly 9% and Advanced Micro Devices jumping 13%. The iShares Semiconductor ETF (SOXX) \u2014 which dropped around 13% last week \u2014 rose more than 7%.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia shares fall as it probes alleged Chinese spy scandal", "full_content": "Board of chipmaker opens investigation after chief executive Jensen Huang admits to affair", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 02:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Tokenization platform Securitize gains 10% postmarket on Q3 results, move into asset-backed finance", "full_content": "Tokenization platform Securitize climbed about 10% postmarket after reporting third quarter growth alongside increased operating expenses, and announcing an expansion into asset-backed finance through a strategic acquisition.\n\nMiami-based Securitize, which made its public market debut in July, operates in the relatively new corner of the crypto equity universe involved in institutional tokenization infrastructure. Tokenized assets on the platform grew 9% in the third quarter, to $4.8 billion, from the same period a year ago. Aggregate transaction volume rose 20% from a year ago, to $4.3 billion. Revenue of $11.5 million was up 28% from last year.\n\nThe growth came as bullish sentiment around tokenization gained traction throughout the third quarter, ahead of the Security and Exchange Commission formalizing the long awaited Innovation Exemption on Sept. 17, which created a temporary pathway for trading of certain tokenized stocks and strengthened the regulatory outlook.\n\nProfitability is still meaningfully below year-ago levels, due in part to costs associated with going public over the summer, as well as the scaling up of the tokenization business at an active time for the entire sector, Securitize CEO Carlos Domingo told CNBC in an exclusive interview.\n\nSecuritize reinforced \"certain areas of the company like finance, compliance, legal [and] cybersecurity,\" which increased corporate costs \"compared to a year ago when we were privately held,\" Domingo said. \"We're in in a very good position. The adjusted EBITDA \u2026 is improving significantly from previous quarters.\"\n\nSecuritize reported an adjusted EBITDA loss of $2 million, compared with positive adjusted EBITDA of $3.6 million a year ago, better than a $5.5 million loss in the second quarter.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 02:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "The stock-market rally keeps spreading beyond Big Tech. October inflation data could put it to the test.", "full_content": "Tuesday\u2019s CPI inflation report and a heavy lineup of Federal Reserve speakers could test the rotation trade\u2019s resilience", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 02:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "Top Yen Forecaster Predicts 147 Per Dollar as Rate Gap Narrows", "full_content": "(Bloomberg) -- Neil Parker has spent nearly three decades tracking the yen, through financial crises and sharp currency swings. Now, the top dollar-yen forecaster in Bloomberg\u2019s latest rankings sees the Japanese currency rallying toward 147 per dollar next year as Japan\u2019s interest-rate gap with the US narrows.\n\nHis call puts him at the bullish end of a deeply divided market. While Parker sees the yen strengthening to around 155 by year-end before appreciating further, Bloomberg\u2019s top forecaster in the previous quarter sees it weakening as far as 170 next year.\n\nAt the heart of the divergence is Japan\u2019s interest-rate outlook. Parker expects the Bank of Japan to raise its benchmark rate from 1.25% to at least 2%, potentially 2.25%, a more aggressive outlook for tightening than much of the market expects. The Federal Reserve, meanwhile, may raise interest rates once more in December before stopping at around the 4.00-4.25% range, according to Parker.\n\n\u201cJapan may prove to be an outlier in terms of the Bank of Japan actually delivering on its promise to bring interest rates into line with where inflation is,\u201d said Parker, head of economics and market strategy at foreign-exchange and payments firm TTT Moneycorp Limited.\n\nJapanese market participants are divided over whether stronger inflation prompts faster tightening by the central bank. Japan\u2019s consumer price index excluding fresh food and energy, a metric closely monitored by the BOJ as a gauge of underlying inflation, advanced 2.4% in September. Parker said that a pickup to 2.6% or higher could prompt a stronger central bank response and speed the path for tightening. He also isn\u2019t convinced the central bank will move as soon as December.\n\nThat difference in the pace of tightening underpins his yen forecast.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 02:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "A failed trial for a heart drug casts shadow over rivals developing similar therapies", "full_content": "The full data from the closely watched clinical trial showed that the drug had no cardiovascular benefit even though it reduced Lp(a) levels.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 02:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks rebound after AI rout", "full_content": "Lower oil prices help equity indices shrug off fall in Nvidia shares", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 02:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why prediction markets and Wall Street pros so often fail to see what\u2019s coming", "full_content": "The probabilities make it almost certain that macro forecasts will be wrong far more often than right.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 02:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia's China revenue exposure: What New Street estimates", "full_content": "Nvidia is central to the AI buildout and a significant portion of sales come from China despite export controls.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia stock falls 4% as scrutiny turns to Jensen Huang\u2019s affair with alleged Chinese spy", "full_content": "Nvidia stock closed 4.27% lower on Monday after the tech giant launched an investigation into CEO Jensen Huang's relationship with a businesswoman who intelligence agencies say is a Chinese spy.\n\nU.S. intelligence agencies said Alice Huang, an executive at cloud company Megaspeed, has been passing information to Beijing, according to reports in The New York Times and the Financial Times .\n\nNvidia said its board has launched an independent investigation following the reports that Huang was the target of a \"foreign intelligence effort.\"\n\nHuang \"fully supports the review and has committed to cooperating with it,\" the company said in a Sunday statement .\n\nThe co-founder and CEO told staff in an email that he had \"fallen short\" of his responsibility to serve his colleagues, the board, partners and shareholders around the world.\n\n\"I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry,\" Huang said in the email.\n\nChina's Foreign Ministry spokesperson, Guo Jiakun, said Monday that the \"so-called Chinese spy narrative\" was unsubstantiated, Reuters reported.\n\nNvidia shares year-to-date. Nvidia leadership under scrutiny The probe has sparked questions about Huang's future as CEO of the company.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 02:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "A key report for where inflation stood in October comes out Tuesday. Here's what to expect", "full_content": "Falling gasoline prices provided some relief to consumers in October, but Federal Reserve officials are increasingly concerned that inflation pressures elsewhere in the economy are proving harder to contain.\n\nPrices at the pump declined by more than 4%, according to the Energy Information Administration, providing a respite from a surge that had added more than a dollar a gallon over the past year.\n\nHowever, the consumer price index for the month, which the Bureau of Labor Statistics will release Tuesday at 8:30 a.m., is expected to show only a slight let-up.\n\nMeanwhile, Fed officials say they are worried that inflation initially driven higher by President Donald Trump 's tariffs and the Iran war is proving more persistent than expected, with price pressures emerging in sectors beyond those directly affected by the shocks.\n\nAt a time when the central bank is increasingly confident about the state of the labor market, concerns over the cost of living are what are top of mind for the Fed.\n\n\"We've been moving up to what historically we'd consider full employment, and the big problem has all been on the inflation side. We go around, we talk to people everywhere in this district, all we hear about is affordability on the business side, the cost,\" Chicago Fed President Austan Goolsbee said Monday during an event in his home district. \"So we've got to come to terms with this cost-side and inflation-side failure.\"\n\nThe CPI reading for all items is expected to show an increase of 0.3%. Core inflation, which excludes volatile food and energy costs, is forecast to increase 0.2%, according to the Dow Jones consensus forecast. While both would be slower than the respective September monthly gains of 0.6% and 0.3%, they still represent further price pressures.\n\nThere will be no annual reading for October because of the government shutdown a year ago, which prevented the BLS from collecting some data and compiling a full index level.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m 53 and not sure how to handle merging finances with my long-term partner.", "full_content": "The \u2018split\u2019 you discuss should be more about estate planning than contemplating a future divorce", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 02:32 AM IST", "pub_date_relative": "2h ago"}, {"title": "Federal Reserve Board announces approval of two applications by Mutual Federal Bancorp, MHC, and MFB Bancorp, Inc.", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 4:00 p.m. EST Share --> --> --> --> --> --> The Federal Reserve Board on Monday announced its approval of two applications by Mutual Federal Bancorp, MHC, and MFB Bancorp, Inc., both of Chicago, Illinois.\n\nThese approvals allow the banking organization to have a new top-tier holding company, MFB Bancorp, Inc., which would become a savings and loan holding company by acquiring Mutual Federal Bank, of Chicago, Illinois.\n\nFor media inquiries, please email [email protected] or call (202) 452-2955.", "source": "Federal Reserve", "pub_date_str": "10 Nov 2026, 02:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Children\u2019s Place files for bankruptcy protection, seeks buyer", "full_content": "Children's clothing retailer The Children's Place has filed for chapter 11 bankruptcy protection, it said Sunday.\n\nThe company is looking to sell substantially all of its assets and is seeking offers from potential buyers by Dec. 9, with a goal to close a deal by the end of December.\n\nThe retailer, whose brands include The Children's Place and Gymboree, says it operates two digital storefronts and 514 North American stores, and has distribution in 13 countries through franchise and wholesale partners. The company's performance has taken a hit in recent years from tariff hikes and slower consumer spending, among other factors.\n\nIts stores and e-commerce sites remain open for now, and the company is planning to continue its ongoing inventory sales with court approval.\n\n\"For nearly 60 years, The Children's Place has supported growing families with apparel that customers have come to know and love. We recognize the significance of this development for our employees, customers, vendors, and other partners, and we are committed to conducting an efficient and transparent sale process,\" said Rudy Morando, co-chief restructuring officer of The Children's Place. \"In the meantime, we remain focused on serving the families who have trusted The Children's Place for generations.\"\n\nThis move comes days after interim Children's Place CEO Muhammad Asif Seemab and Chief Strategy Officer Muhammad Umair stepped down from their roles . Seemab and Umair will both remain on the company's board. CFO John Szczepanski took on the role of acting president and principal executive officer.\n\nSeemab is also managing director of Saudi-based Mithaq Capital, which took a majority stake in The Children's Place in 2024 when the company was facing financial trouble.\n\nEven with support from the investors, the company has not been able to significantly improve its financial outlook. In its bankruptcy filing , the company reported about $742 million in assets, compared to about $881 million in debts.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:27 AM IST", "pub_date_relative": "2h ago"}, {"title": "PepsiCo to cut about 1,000 jobs as North American business struggles", "full_content": "PepsiCo is cutting about 1,000 jobs across North America as the company tries to turn around lagging sales in its home market.\n\n\"We have a clear ambition for PepsiCo North America: to build a stronger, more future-fit business that delivers industry-leading growth,\" Ram Krishnan, CEO of PepsiCo North America, wrote in a Monday letter to employees obtained by CNBC. \"To do that, we need to be faster, more connected, and more capable, while continuing to invest in growth \u2013 behind our people, capabilities and brands.\"\n\nOver the next week, Pepsi plans to cut jobs as it says it aims to streamline its operations and better connect teams across the company's North American business. PepsiCo employs about 306,000 people worldwide, including roughly 125,000 in the United States, as of Dec. 27, according to a company filing.\n\nIn October, PepsiCo cut its full-year earnings outlook, citing the struggles in its home market. During the third quarter, its North American beverage unit saw volume shrink 2%, while its North American food division reported flat volume.\n\nWhile the company has tried to boost sales by cutting prices and investing in marketing, the turnaround is taking longer than expected, CFO Steve Schmitt said on the company's earnings conference call.\n\nShares of Pepsi rose slightly in afternoon trading. The stock is down nearly 1% this year, lagging behind the S&P 500 's gains of nearly 11% over the same period.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 02:11 AM IST", "pub_date_relative": "2h ago"}, {"title": "Viking Loses 1.2% in October After Eschewing Many Big AI Bets", "full_content": "(Bloomberg) -- Viking Global Investors\u2019 flagship hedge fund dropped 1.2% last month, faring better than many of its rivals after largely avoiding high-flying artificial-intelligence stocks.\n\nThe loss pared gains for the long-short equity fund this year to about 1%, according to people familiar with the matter, who asked not to be identified because the returns aren\u2019t public.\n\nViking co-founder Andreas Halvorsen has taken a contrarian position on AI, generally staying away from big bets on the technology because it views some companies as overvalued.\n\n\u201cAgainst the current market backdrop, we continue to exercise caution when buying stocks at valuations that, considering our forecast of revenue and earnings, offer little margin of safety,\u201d Halvorsen said in a letter to clients in July.\n\nThe hedge fund, which manages about $35 billion, sat out tech rallies in 2020 and 2021 and avoided the double-digit losses that hit rivals. While its caution didn\u2019t entirely protect Viking from October losses, many other firms lost more money in a month rocked by a broad tech selloff and geopolitical upheaval.\n\nTechnology stocks made up just 7.5% of Viking\u2019s bullish bets as of June 30, according to a regulatory filing. Still, chip giant Taiwan Semiconductor Manufacturing Co., a key player in the AI buildout, was its second-biggest long bet. AI hyperscaler Meta Platforms Inc. was its sixth-largest.\n\nBut Viking was less exposed to tech than several other so-called Tiger Cubs, firms that were also founded by alumni of Julian Robertson\u2019s Tiger Management.\n\nCoatue Management and Tiger Global Management, for example, dedicated well over 40% of their long books to tech stocks as of June 30. Lone Pine Capital, which erased a 44% gain it had through June, allocated more than 38% to tech.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 02:03 AM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia's CEO turmoil gives newly empowered Democrats fresh ammunition in pursuit of oversight", "full_content": "Nvidia CEO Jensen Huang's close ties to the U.S. government were already poised to loosen with Democrats winning control of Congress and promising far more oversight of AI development than what the chip giant has experienced under Republican leadership.\n\nThat was before he admitted on Sunday to having an extramarital affair .\n\nThe CEO was romantically involved with Alice Huang, according to The Financial Times , who U.S. intelligence officials believe is a spy for China's Ministry of State Security, The New York Times reported. Alice Huang is also affiliated with an Nvidia customer called Megaspeed that's been accused of helping restricted Chinese companies acquire Nvidia's artificial intelligence chips.\n\nHuang apologized to staffers in a note on Sunday for being \"unfaithful to my wife,\" and said the company's board was investigating any related national security concerns. Nvidia's board said it has \"confidence in Jensen,\" who co-founded the company in 1993 and has led it ever since, building a net worth of more than $150 billion in the process.\n\nEven before last week's midterm elections , which saw Democrats win sweeping majorities in the House and Senate, vocal party leaders wanted answers from Huang about China's access to advanced Nvidia chips and his company's lobbying for favorable legislation. Sen. Elizabeth Warren of Massachusetts said days before the election, when the spy story was first surfacing , that \"we must pass bipartisan legislation to keep our advanced AI technology out of China's hands.\" Months before that, in June, Huang declined an invitation from Warren to testify before the Senate Banking Committee.\n\nDemocratic House leader Hakeem Jeffries of New York, who is the presumed speaker of the House in the new Congress, told CBS News on Monday that it is \"a significant issue of concern.\"\n\nJeffries said there is a classified briefing with White House officials later Monday, and he expects the Nvidia CEO's affair to be discussed.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 01:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "The wait is almost over for this blockbuster video game. I see 35% upside in the stock", "full_content": "Grand Theft Auto VI is almost here, and investor Paul Meeks says Wall Street is underestimating just how big it could be for Take-Two Interactive.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:37 AM IST", "pub_date_relative": "2h ago"}, {"title": "Oil down more than $7 a barrel in post settlement trade as Trump signals restraint on Iran", "full_content": "LONDON, - Brent crude futures continued tumbling after settlement on Monday to lose more than $7 a barrel, hitting their lowest since late August, after US President Donald Trump downplayed the likelihood of renewed strikes on Iran.\n\nBrent crude futures settled down $5.75, or 5.85%, at $92.57 a barrel. Prices continued falling after settlement, and were last down more than $7 a barrel.\n\nUS West Texas Intermediate futures settled down $3.98, or 4.38%, to $86.85. US crude futures also continued falling, last down more than $5 in post-settlement trade.\n\nThe Brent benchmark plunged by 16% last week, its steepest weekly drop since the start of the COVID-19 pandemic.\n\nOn Sunday, Trump said he was highly unlikely to order fresh attacks on Iran as long as talks to end the conflict progressed. Still, both countries reported that shipping had been hit in or near the Strait of Hormuz.\n\n\"This seems to have encouraged sellers on the prospects for peace even while the actual fighting is not slowing down,\" TACenergy analysts said in a note.\n\nLast week, Trump had hinted at a resumption of attacks on Iran and Tehran vowed to respond by striking US and Israeli targets. But there has been no sign of a large-scale US military operation.\n\nA senior Iranian security official told the country's state media that Tehran has no plans to negotiate unless Washington takes practical steps to meet seven conditions set out in a June interim agreement.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:33 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump administration proposes stricter work-search rules for unemployment benefits", "full_content": "The Labor Department proposed a rule on Monday that would raise the bar for people applying for unemployment insurance by requiring them to prove they've conducted five work-search activities per week in order to qualify for benefits.\n\nIn the announcement, the Trump administration described the proposal as a way to improve the \"integrity and accountability\" of the joint federal-state unemployment insurance system. Consumer advocates said the proposed work-search baseline of five qualifying activities per week exceeded that in most states and would make it more difficult for many applicants to qualify for assistance.\n\nThere is currently no uniform requirement across the U.S. for unemployment insurance claimants regarding work-search requirements.\n\nFederal law requires all states to have a work-search requirement, but states have broad discretion to set their own eligibility. They also have ample leeway to set other parameters such as the weekly sum claimants can receive and the number of weeks they can get those funds.\n\nA qualifying work search activity might be applying to a job, creating a profile on a job-search website or attending a networking event, for example, depending on the state.\n\nCurrently, only four states require a minimum of five work searches per week, Michele Evermore, the senior director of economic security and worker transitions at the National Employment Law Project, wrote in an email.\n\nThe Labor Department proposal would require individuals claiming unemployment insurance to complete and report at least five qualifying work-search activities each week before payment is issued, according to a press release announcing the rule.\n\n\"This proposed rule helps jobseekers find work faster and ensures efficient use of taxpayer resources while improving the overall integrity of our unemployment system,\" Labor Secretary Keith Sonderling said in the release.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:29 AM IST", "pub_date_relative": "3h ago"}, {"title": "Oil prices hit 10-week low after Trump says strikes on Iran \u2018highly unlikely\u2019", "full_content": "Brent crude extended last week\u2019s losses that followed Republicans\u2019 historic midterms defeat", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 01:26 AM IST", "pub_date_relative": "3h ago"}, {"title": "Millions of dollars poured into prediction markets on election night, trading on Democratic control of Congress and Texas governor's race", "full_content": "More than 87% of all election markets across Kalshi and Polymarket gave the right candidate at least a 90% chance of winning their race 24 hours before election night, a CNBC analysis found.\n\nElection night showed how traders reacted to real-time midterm results, as trading activity surged and market prices shifted to Democrats after results from Indiana began rolling in before 7 p.m. on Nov. 3. Many midterm races were uncompetitive, which boosted the overall hit rate on prediction markets.\n\n\"I'd say prediction markets did pretty well,\" said Koleman Strumpf, a professor of economics at Wake Forest University. \"But they didn't outperform the best,\" he added, referring to traditional forecast polls that tracked results that night.\n\nOdds and gambling platforms do not use methodologies used by traditional political polling, and therefore are not substitutes for political polls.\n\nAfter 8 p.m. on Nov. 3, at least $1 million was traded on a Kalshi market that incumbent Gov. Greg Abbott would be reelected. Abbott eventually lost to Democrat Gina Hinojosa by more than 700,000 votes, according to the Associated Press. A little after 11 p.m. on election night, more than $1.4 million was traded on Kalshi that Republicans would not secure control of the House of Representatives.\n\nFollowing the midterms, both Polymarket CEO Shayne Coplan and Kalshi CEO Tarek Mansour were on the social media platform X crediting prediction markets for correctly predicting races. Nate Silver, a political forecaster and founder of the Silver Bulletin newsletter, disputed the claim, arguing forecast models influenced prediction market movement. Silver joined Polymarket as an advisor in 2024.\n\n\"Prediction market probabilities strongly converged toward [our models] in individual Senate and gubernatorial races,\" Silver wrote on Silver Bulletin .", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:11 AM IST", "pub_date_relative": "3h ago"}, {"title": "Boeing to cut 5% of commercial airplane workers as production increase takes longer than expected", "full_content": "Boeing said Monday that it plans to cut 5% of its commercial airplane workforce as its production ramp-up is moving at a slower pace than the company expected.\n\nThe cuts will be through a combination of attrition and layoffs, Stephanie Pope, head of the commercial aircraft unit, said in a memo to staff.\n\nPope reiterated that the company is still working to stabilize production rates of its bestselling 737 Max planes, which are made outside of Seattle.\n\nCEO Kelly Ortberg told investors last month that the company won't significantly increase production of the Max aircraft until the second half of next year. He said the company's wing production has been slower than expected.\n\n\"Adjusting our production schedules and reducing aircraft output puts us in an overstaffed position,\" Pope said in her note Monday. \"Unfortunately, that means we need to align our staffing levels to our revised business plan, resulting in a reduction of approximately 5% through a combination of attrition and involuntary layoffs, with notifications beginning in December.\"\n\nBoeing is targeting a production rate of 52 planes a month in the second half of 2027. Ortberg said the company has been trying to stabilize output at a rate of about 47 of its 737 Max planes a month.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:05 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Jensen Huang affair puts Nvidia's future at risk, with no clear successor to the renowned CEO", "full_content": "Nvidia CEO Jensen Huang 's admission of an affair with a purported Chinese spy has raised questions about his future at the company, and what happens if the 63-year-old co-founder, who built the chipmaker into one of the most valuable businesses on the planet, is forced out.\n\nShares of Nvidia sank more than 4% on Monday, even as the broader market rallied sharply, after Huang acknowledged the affair in a message to staff on Sunday, and said that the board was launching an investigation into whether he was targeted by a foreign intelligence agency. The board said it has \"confidence in Jensen,\" and that it has \"no reason to believe that either national security or Nvidia secrets were compromised.\"\n\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\n\nWhile Nvidia says Huang will continue to lead the company during the probe, pressure is rapidly mounting on the chipmaker, whose technology has powered the first four years of the generative artificial intelligence boom. Leaders from both parties are calling for briefings, and Democrats poised to take control of both houses of Congress are calling for investigations and new legislation \"to stop advanced AI chips from fueling China's military,\" Sen. Elizabeth Warren of Massachusetts wrote in a post on X on Monday.\n\nHuang has outsized influence over Nvidia, and is the sole face of the company with no clear second-in-command.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 04:26 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Skydance outlines its $6 billion in planned cost savings. Here's the breakdown", "full_content": "Skydance is pulling back the curtain on how it plans to achieve at least $6 billion in cost savings in the next three years.\n\n\"By combining two global streaming services, two film and TV studio groups, two television portfolios, and overlapping corporate functions, we can reduce duplicative spend across an expense base of more than $50 billion,\" the company wrote in a letter to shareholders Monday as part of Paramount Skydance's third-quarter earnings release.\n\nSkydance, the newly formed combination of Paramount Skydance and Warner Bros. Discovery, said it projects at least $2.2 billion in cost reductions from eliminating \"redundant back-office and corporate functions,\" including eliminating management layers and ramping the use of artificial intelligence. Those savings also account for \"rationalizing\" its office footprint.\n\nSkydance expects at least $1 billion in savings from streamlining marketing and promotional spending. And around $1.4 billion in savings will come from unifying its streaming businesses and broadcast architecture and integrating back-end technology.\n\nA final $1.4 billion in savings will be tied to \"optimizing third-party spend,\" eliminating overlapping expenses, and consolidating purchasing decisions to one centralized group, Skydance said.\n\n\"We are confident in achieving these savings, drawing on our playbook from Paramount,\" the company wrote. \"That program is on track to achieve over $2.7 billion in run-rate efficiencies by the end of 2026.\"\n\nLast month, Skydance began offering voluntary buyouts to employees ahead of official layoffs. At the same time, the company adopted a five-day-per-week in-office policy. Additionally, last week saw the departure of eight executives \u2014 four from Warner Bros. and four from Paramount.\n\nThe company has previously said it plans to eventually merge the Paramount+ and HBO Max streaming services into a single platform.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 04:25 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: American Public Education tops Q3 2026 estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:25 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Exodus posts q3 2026 revenue beat as shares swing lower", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:24 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Surgery Partners Inc earnings beat by $0.04, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:23 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rani Therapeutics Holdings earnings beat by $0.01, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:23 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Zeta Global tops Q3 2026 forecasts, shares slip after hours", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:22 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Coincheck Group posts wider loss in Q2 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:20 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Archer Aviation posts revenue beat in Q3 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 04:20 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rocket Lab shares dip after the company\u2019s \u2018defining\u2019 quarter misses the mark", "full_content": "The rocket-launch company just posted a steeper loss than analysts were expecting.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 04:19 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hegseth impeachment articles introduced by Rep. Massie", "full_content": "Rep. Thomas Massie , R-Ky., on Monday introduced articles of impeachment against Defense Secretary Pete Hegseth , triggering a vote in the House of Representatives as early as this week.\n\nThe unusual impeachment push against Hegseth by a member of his own party comes after Democrats swept to majorities in both the House and Senate during last week's midterm elections . Many Republicans, including Vice President JD Vance , have cited the Iran war Hegseth has led as a reason for the electoral bludgeoning.\n\nMassie, who lost his reelection bid in a Republican primary in May, introduced eight articles of impeachment against Hegseth. They include waging war in contravention of war powers resolutions Congress passed to limit war, extrajudicial killings tied to boat strikes in the Caribbean that purported to target drug smugglers and suppressing free speech by targeting Sen. Mark Kelly, D-Ariz., a veteran.\n\n\"Wherefore, Secretary of Defense Peter Hegseth, by such conduct, has demonstrated that he will remain a threat to the Constitution if allowed to remain in office, and has acted in a manner grossly incompatible with his duties and the rule of law,\" the articles, which Massie read from the House floor, read. \"Peter Brian Hegseth thus warrants impeachment and trial, removal from office, and disqualification to hold and enjoy any office of honor, trust, or profit under the United States.\"\n\nMassie's resolution will force House Republican leaders to put the measure up for a vote by the end of this week. Impeachment resolutions are privileged, meaning the House must act on them, table them or vote to refer them to committee within two legislative days.\n\nPresident Donald Trump once again defended Hegseth later Monday, telling reporters at the White House he will stand by the secretary even if he is impeached.\n\n\"He won two wars.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 04:11 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump questions midterm election results, revives voting-machine conspiracy", "full_content": "President Donald Trump on Monday questioned the legitimacy of the midterm election results, resurrecting his pattern of raising doubts about electoral losses for himself and other Republicans .\n\nTrump's social media post raising questions about the election came six days after his fellow Republicans suffered historic defeats at the polls nationwide, including in several GOP strongholds like Texas and South Carolina .\n\n\"Does anybody really believe that this 'Election' was honest,\" Trump wrote on Truth Social.\n\n\"How could the Polls be so wrong??? Some early voting 'dumps' were so large that it was impossible to win, no matter how many people went to vote,\" the president said. \"It's all about the machines, which are far more important than the voter!\"\n\nTrump's post was a sharp pivot from what has been a conciliatory tone after last Tuesday's thumping of Republican candidates, which resulted in Democrats regaining majorities in both the Senate and House of Representatives.\n\nOn Election Night, Trump told The New York Times that he was \"absolutely willing\" to accept the results of the midterms, and that he was willing to work with Democrats.\n\n\"We'll, you know, look forward to working with them,\" Trump told The Times. \"We'll probably work something out.\"\n\nThe next day, Trump said, \"I'll get along probably with the Democrats unless they want to be destructive.\"", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 04:10 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "3 unexpected reasons the October jobs report was so strong", "full_content": "A little-noticed category in Friday's blockbuster jobs report is challenging the consensus view about job losses caused by artificial intelligence.\n\nAt least for now, the data suggests the U.S. is gaining jobs as a result of the AI boom, not losing them.\n\nAnd another category suggests the strong jobs numbers could have some staying power.\n\nNonfarm payrolls grew by 165,000 jobs in October, according to the Friday report from the Bureau of Labor Statistics. It was a surprising surge in hiring that blew way past Wall Street's expectations. Economists polled by Dow Jones had forecast growth of just 59,000 for the month.\n\nHere are three surprising things you might have missed from the report.\n\nHiring for consultants surged in the month, sending the profession's total head count to a fresh record.\n\nThe labor force for management, scientific and technical consultants expanded by 17,300 jobs between September and October, the largest month-over-month increase in nearly two years. This category is a subset of the professional and business services sector tracked by BLS and accounted for 25% of the entire sector's gains for the month.\n\nWhat's more, this workforce has grown by more than 45,000 jobs over the past year. That gain pushed the total employee base for these types of workers past 1.9 million for the first time on record, according to BLS data.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 03:53 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks making the biggest moves after hours: Trade Desk, Sanmina, Securitize & more \u2014 Live updates", "full_content": "Traders closely watched quarterly results rolling in from entertainment giant Skydance and electronic manufacturing firm Sanmina after the market close.\n\nBoth names diverged sharply, with Skydance skidding on a newly announced plan to cut $6 billion in costs. Sanmina, however, jumped on a rosy outlook.\n\nThe stock market wrapped up Monday's trading on a strong note, with the S&P 500 rising more than 2% for its best session since April.\n\nThe action comes after a losing week that was largely led by declines in tech. The sector saw a rebound to begin this week, but Nvidia sat out Monday's rally after CEO Jensen Huang admitted to having a relationship with an alleged Chinese spy.\n\nFollow below as CNBC breaks down the biggest stock market moves of the day:\n\nShares for the Trade Desk jumped over 19% after the company reported better-than-expected third-quarter results.\n\nThe global advertising technology company earned 33 cents a share on an adjusted basis and notched revenue of $736 million. That's higher than the 25 cents per share and $650 million anticipated by analysts polled by LSEG.\n\nTrade Desk in the past day The company also sees fourth-quarter revenue of at least $755 million, trouncing the $650 million estimate. Guidance for adjusted EBITDA in the current quarter also came in sharply above estimates.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 03:43 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "JPMorgan Weighs Big Discount to Lure Lenders for Software Debt", "full_content": "(Bloomberg) -- Banks led by JPMorgan Chase & Co. could offer one of the year\u2019s biggest discounts to sell some of the $5 billion in debt for software firm Qualtrics International Inc. that the underwriters were stuck holding a few months ago.\n\nBankers have scheduled meetings with investors this week to discuss the sale of nearly $2 billion of debt in the high-yield bond market, according to people with knowledge of the matter. Initial indications are that the debt could be marketed at a coupon of at least 8% and a discounted rate of about 85 cents on the dollar, said the people, requesting anonymity as the talks are private.\n\nIf a deal was struck at that price, it would represent one of the biggest new-issue discounts for a debt sale in the US high-yield market this year, according to data compiled by Bloomberg. A number of software companies have had to pay high borrowing costs and boost protections to lock in lenders in recent months, as concerns about AI-disruption to their businesses have intensified.\n\nA debt sale for Qualtrics could come as soon as next week and price before the Thanksgiving holiday, the people said. Representatives for JPMorgan and private equity firm Silver Lake, which owns Qualtrics, declined to comment. A representative for Qualtrics didn\u2019t respond to a request for comment.\n\nQualtrics, which makes online survey tools, agreed to buy data analytics firm Press Ganey Forsta more than a year ago in a deal valued at $6.75 billion. Eleven banks committed about $5.3 billion in debt financing for the transaction, and the group started preliminary discussions with investors earlier this year to sell that down.\n\nBut they were forced to pause those talks in March after the company became caught up in a wider software selloff, prompted by worries that advances in artificial intelligence could render some businesses obsolete.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 03:43 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "EIB\u2019s Calvino Says US Turmoil Is Driving Capital to Europe", "full_content": "Europe is set to benefit from recent market turmoil in the US as investors seek a safe haven, according to European Investment Bank President Nadia Calvino.\n\n\u201cTurbulence in the US is making capital flow to Europe,\u201d she told Bloomberg TV in an interview on Monday. \u201cI expect that to continue.\u201d\n\nCalvino said she doesn\u2019t see any negative impact on investment in Europe at the moment, adding that there had been very strong demand for EIB bond issuance and that she expects more of the same in January.\n\n\u201cRight now we\u2019re confronted with turbulence and instability in the financial markets, so it\u2019s of the utmost importance that we preserve Europe as a safe haven in this context,\u201d she said.\n\nCalvino, who heads the Luxembourg-based institution that is effectively the lending arm of the European Union, was speaking as euro-area finance ministers meet in Brussels for the first time since nominations closed for candidates to replace European Central Bank President Christine Lagarde.\n\nShe expects her successor to \u201ccontinue her policies and approach,\u201d she said. \u201cIt is critical we preserve independence in decision making\u201d at the ECB, she added.\n\nDutchman Klaas Knot and Spain\u2019s Pablo Hernandez de Cos are the two official candidates to succeed Lagarde, who is stepping down almost nine months early. Calvino described both as \u201cvery strong technically.\u201d\n\nSpeaking ahead of Monday\u2019s meeting, Kyriakos Pierrakakis, president of the Eurogroup, said that the gathering would be an \u201cinformation point\u201d in the process of selecting a candidate.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 03:40 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "As Nvidia\u2019s stock falls, here\u2019s what Wall Street has to say about the Jensen Huang scandal", "full_content": "The fallout from the board\u2019s new investigation could become \u201ca longer-lasting problem for the company,\u201d analysts say.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 03:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "As Nvidia probes Jensen Huang affair, here's the board member likely to play a big role", "full_content": "Nvidia CEO Jensen Huang is facing an internal investigation after admitting to an affair with a Chinese businesswoman who U.S. intelligence agencies believe is a Chinese spy.\n\nWhile the company has not yet named specific investigators, that probe is being helmed by the board with help from outside counsel, according to Nvidia. Lawyer Stephen Neal is the board's lead independent director and head of corporate governance, likely making him a key figure in the investigation.\n\nIn a statement , Nvidia's board said it has \"no reason to believe that either national security or Nvidia secrets were compromised,\" though it will examine all evidence. China has dismissed the espionage claims. Huang, one of the most powerful businessmen in the artificial intelligence boom, said he would \"cooperate fully\" with the process.\n\nYet the probe has sparked uncertainty around Huang's future at the chipmaker and raised concerns of broader ripple effects to companies in the tech sector that are exposed to the AI build-out.\n\nIn a Monday note, Citi analysts wrote that one of the key issues for investors moving forward will be \"potential governance implications\" and \"increased regulatory scrutiny\" as the company navigates the investigation.\n\nNvidia's board has 10 independent members, including a former president of Taco Bell , a former Eli Lilly executive and a former vice chairman from Goldman Sachs . Neal, who joined Nvidia's board of directors in 2019, is a chairman emeritus and senior counsel of the law firm Cooley LLP, where he also served as CEO from 2001 to 2008.\n\nIt won't be his first corporate governance probe. According to Cooley , Neal has litigated cases across securities, bankruptcies, antitrust, takeovers and more. And he's conducted several investigations for multiple boards of directors, including at General Motors , where he advised the company in disputes with Ross Perot.\n\nHe also guided Walter Hewlett and the Hewlett Trust to stop a merger between Hewlett-Packard Co.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 03:24 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Lucid misses Wall Street\u2019s earnings expectations, expands loan from Saudi Arabia fund", "full_content": "Lucid Group missed Wall Street's third-quarter expectations as the embattled electric vehicle maker continues an \"operational reset\" aimed at cutting costs and narrowing losses.\n\nThe company on Monday also announced a $1.75 billion increase in a delayed draw term loan from Saudi Arabia's Public Investment Fund, the company's largest shareholder.\n\nHere's how Lucid performed in the third quarter compared with average estimates compiled by LSEG:\n\nDespite the top- and bottom-line misses, the company's adjusted earnings before interest, taxes, depreciation and amortization of a loss $726 million beat Wall Street's expectations of a loss of $611 million for the third quarter. Its net loss for the quarter was $830.9 million, down from a loss of $978.4 million a year earlier.\n\nLucid's 2025 third quarter included r
