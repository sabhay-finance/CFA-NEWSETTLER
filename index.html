s , Adani Total Gas , and Adani Power have scheduled their Q2FY27 results in the coming week.\n\nAs investors prepare for the coming week, here are all the details to know about the four Adani group forms declaring their Q2 results 2026.\n\nAdani Energy Solutions Limited\u2019s board of directors meeting will be held on Thursday, October 22, to consider and announce the quarterly result for second quarter of FY27, and half-yearly result of FY27. Post Q2 results announcement, the company will hold investors\u2019 call conference on Friday, October 23.\n\nAdani Energy Solutions share price closed 0.54% lower at \u20b9 1360 per share on BSE with an Mcap of \u20b9 1,66,321.81 crore on Friday, October 16. Its share price value has surged 43.6% in one year, 31.64% in two years and around 75.55% in three years.\n\nAdani Green Energy Limited\u2019s board of directors is scheduled to meet on Wednesday, October 21, to consider and approve unaudited financial results for Q2FY27 and H1FY27. THe investors call will be held on Thursday, October 22.\n\nAdani Green Energy stock closed 0.46% lower at \u20b9 1300 per share on BSE with an MCap of \u20b9 2,14,132.90 crore. The green energy stock has surged 22.64% in one year, but declined 25.78% in two years.\n\nThe board of directors of Adani Total Gas is scheduled to meet on Thursday, October 22, to consider and approve quarterly results and half yearly results. Adani Total Gas\u2019 investors call is scheduled to be held on Friday, October 23.\n\nAdani Total Gas stock closed 0.40% higher at \u20b9 579.55 per share on BSE with a market capitalisation of \u20b9 63,739.49 crore. Its share price value has declined 6.79% in one year, 22.36% in two years, and around 2.63% in three years.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 03:25 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bajaj Finance Q2 preview: Profit may jump 29%, NII 24% as strong loan growth lifts earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Bajaj Finance Q2 preview: Profit may jump 29%, NII 24% as strong loan growth lifts earnings Bajaj Finance Share Price Mahindra & Mahindra Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bajaj Finance Q2 preview: Profit may jump 29%, NII 24% as strong loan growth lifts earnings SECTIONS Bajaj Finance Q2 preview: Profit may jump 29%, NII 24% as strong loan growth lifts earnings By Akash Podishetti , ETMarkets.com Last Updated: Oct 18, 2026, 03:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bajaj Finance is projecting a remarkable 29% increase in net profit for the July-September quarter, driven by robust loan demand and a boost in interest income. With a significant rise in assets under management, the demand for its lending products appears strong. Yet, analysts caution about potential pressure on lending margins owing to escalating borrowing costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 03:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cyient DLM shares crash 12% despite Q2 profit growth: 3 reasons, brokerages set targets; should you buy?", "full_content": "Cyient DLM share price plunged 12.24% on Friday, 16 October, even as the electronics manufacturing services company reported double-digit revenue growth, higher normalised profit and a record order book for the September quarter. The sell-off came amid concerns over margin pressure, continued growth investments and mixed brokerage views on the stock's valuation and earnings outlook.\n\nThe stock's sharp decline followed its Q2 FY27 results, with investors appearing to focus on the pressure on operating margins despite healthy business momentum. While Motilal Oswal remained bullish on the stock, PL Capital maintained a 'Reduce' rating, highlighting the differing views on its growth prospects and valuation.\n\nDespite Friday's sharp correction, Cyient DLM has delivered strong returns over the longer term. The stock has gained 53.41% over three months and 167.12% over six months, while its year-to-date return stands at 117.53%.\n\nCyient DLM reported revenue of \u20b9 393.1 crore in Q2 FY27, up 26.5% year on year. EBITDA increased 9.5% to \u20b9 34.2 crore, but the EBITDA margin contracted by around 130 basis points year on year to 8.7%.\n\nThe slower growth in operating profit compared with revenue points to cost pressures even as the business expands. PL Capital attributed the margin contraction primarily to higher sales and marketing expenses and continued investments in product development.\n\nMotilal Oswal also flagged gross margin compression due to the expensing of product development costs. The brokerage expects upfront growth investments to keep FY27 EBITDA margins in the 9\u201310% range, with operating leverage and double-digit margins expected from FY28.\n\nCyient DLM's reported profit after tax rose to \u20b9 34 crore in Q2 FY27, including a one-off gain of \u20b9 18.2 crore from an earnout reversal.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 03:06 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Multi-cap vs multi-asset allocation mutual funds returns race: Key differences, 1, 3 and 5-year returns compared here", "full_content": "Multi-cap funds and multi-asset allocation funds may sound similar, but they belong to different mutual fund categories and follow distinct investment strategies.\n\nWhile multi-cap funds invest primarily in equities across companies of different market capitalisations, multi-asset allocation funds spread investments across multiple asset classes, including equities and debt.\n\nHere is what investors need to know about the two mutual fund categories and how their returns compare.\n\nMulti-cap funds: They are open-ended equity schemes that invest across large-cap, mid-cap, and small-cap stocks.\n\nUnder Securities and Exchange Board of India ( SEBI ) rules, these funds must invest at least 75% of their total assets in equity and equity-related instruments. They must allocate at least 25% of total assets each to large-cap, mid-cap and small-cap stocks.\n\nThis structure requires multi-cap funds to maintain exposure to all three market-capitalisation segments, rather than concentrating only on large-cap stocks. Their performance is therefore linked primarily to equity-market movements across these segments.\n\nMulti-asset allocation funds: These are hybrid mutual fund schemes that invest across at least three asset classes, with a minimum allocation of 10% to each. Depending on the scheme's mandate, these asset classes may include equities, debt instruments, and commodities such as gold and silver, including through their exchange-traded funds (ETFs), REITs, etc.\n\nUnlike multi-cap funds, which focus on equities across market capitalisations, multi-asset allocation funds diversify investments across asset classes. Their returns depend on the performance of these assets and the scheme's allocation to each of them.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 02:58 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u2018Rarest of rare\u2019 bets on Reliance ahead of Jio Platforms\u2019 biggest-ever IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMumbai: Two traders have built large leveraged positions in Reliance Industries Ltd (RIL), an unusual development that analysts have termed \u201crarest of rare\u201d, ahead of the initial public offering (IPO) of its subsidiary Jio Platforms Ltd, set to be the biggest IPO in the country.\n\nExchange data shows that both have built positions exceeding 3% each of Reliance\u2019s marketwide position limit (MWPL) since early October. Both raised their positions over the past fortnight, trimming only marginally towards the end of last week.\n\nThe scale of the bets is virtually without precedent in Reliance\u2019s derivatives counter. Analysts say they cannot recall a single client holding more than 3% of the stock\u2019s MWPL\u2014not even during Meta\u2019s investment in Jio Platforms in 2020 or the pandemic-triggered global market meltdown.\n\nWhile the rationale behind the bets remains unclear, analysts believe the sharp fall in Reliance shares to fresh lows may have prompted traders to position for a rebound. The stock has underperformed the Nifty amid persistent foreign investor selling, rising oil prices and a weakening rupee. The bets come ahead of the \u20b9 30,213 crore IPO of Jio Platforms, which opens on Wednesday and runs through Friday.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 02:47 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "84 Percent Stocks In Correction, Yet S&P 500 Nears Record High: What's Behind The 'Bull-Bear' Market?", "full_content": "The index looks bullish, but market breadth tells a very different story.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 02:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "No ITR filed, but ITAT Jaipur still quashed the 200% income tax penalty: Here's what the taxpayer did to win the case", "full_content": "Suppose you did not file an income tax return ( ITR ) in the first place, received an income tax notice, and faced a penalty of 200% \u2014 but still managed to get relief from the Income Tax Appellate Tribunal (ITAT). Sounds impossible?\n\nThis is exactly what happened in a case from Sikar, Rajasthan, where ITAT Jaipur quashed a \u20b9 3.99 lakh penalty imposed on a taxpayer , as reported by Economic Times.\n\nThe Income Tax Appellate Tribunal (ITAT), Jaipur, ruled in favour of a taxpayer on 23 September 2026, quashing a penalty of \u20b9 3.99 lakh imposed under Section 270A of the Income-tax Act, 1961. Here is what happened, why he won relief, and what taxpayers should know about the law.\n\nAccording to the ET report, Sharma, a resident of Sikar, had not initially filed an income tax return. After the Income Tax Department issued a notice, he filed an ITR declaring an income of \u20b9 12.9 lakh for assessment year (AY) 2018-19.\n\nHowever, the Assessing Officer (AO) believed that Sharma's income would have escaped tax net if the department had not issued the notice. The AO consequently initiated penalty proceedings under Section 270A of the Income-tax Act, 1961.\n\nThe tax payable on the income in question was calculated at \u20b9 1.99 lakh. The AO imposed a penalty of \u20b9 3.99 lakh, equivalent to approximately 200% of the tax payable on that income.\n\nThe Commissioner of Income Tax (Appeals), or CIT(A), upheld the penalty. Sharma then approached the ITAT Jaipur through advocates Shafi Mohammad Chouhan and Sahil Shafi Chouhan.\n\nSection 270A deals with penalties for under-reporting and misreporting of income. The penalty depends on the nature of the default established by the tax authorities. Under Section 270A(7), the penalty for under-reporting income is generally 50% of the tax payable on the under-reported income.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 02:32 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Bajaj Finance Q2 results 2026: Date, time, preview, expectations, share price outlook | Target, stop-loss, rationale", "full_content": "Bajaj Finance Q2 results 2026: The subsidiary company of Bajaj Finserv Ltd , Bajaj Finance , is set to declare its Q2 results 2026 on 19 October 2026 i.e., on Monday this week. The NBFC company has already declared the Bajaj Finance Q2 results 2026 date at the beginning of this month through an exchange filing. The Q2 earnings announcement will be followed by the guidance call at 6:00 PM.\n\nBajaj Finance declared Q2 results 2026 date in an exchange filing, saying, \u201cPursuant to the aforementioned Regulations, it is hereby informed that a meeting of the Board of Directors of the Company will be held on Monday, 19 October 2026, inter alia, to consider and approve the unaudited standalone and consolidated financial results of the Company for the quarter and half year ended 30 September 2026.\u201d\n\nBajaj Finance has also announced the date and time for the guidance call in regard to its Q2 results 2026, saying, \u201cPursuant to Regulation 30 of the SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015, this is to inform you that a conference call will be held on Monday, 19 October 2026 at 6.00 p.m. IST in respect of financial results of the Company for the quarter ended 30 September 2026. Dial in and other details of the call are enclosed herewith.\u201d\n\nThe subsidiary of Bajaj Finserv also made it clear that the Trading Window for dealing in the securities of the Company is closed from Thursday, 1 October 2026 till Wednesday, 21 October 2026 (both days inclusive), for designated persons and their immediate relatives/dependents. The same has been intimated to stock exchanges vide letter dated 28 September 2026.\n\nHighlighting the market expectations from the Bajaj Finance Q2 results 2026, Mahesh M Ojjha, VP \u2014 Research and Business Development, said, \u201cAfter the strong provisional July\u2013September 2026 business update, the market expects a big YoY leap in AUM and loan book growth.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 02:17 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How Did China Build The World's Factory? One City's $500 Million Gamble Offers A Clue", "full_content": "Over the decade to 2023, its roughly $25 billion in public investments generated reported earnings approaching $9 billion.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 02:02 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock split, bonus, dividend, buyback record date in 19-25Oct week: Angel One, JSW, IRFC, Tech Mahindra, Modison, others", "full_content": "Stock split, bonus, dividend, buyback record dates this week: Shares of Angel One, JSW Dulux, IRFC, Tech Mahindra, Modison, VRL Logistics , will remain in focus next week due to their upcoming corporate actions, including stock split, bonus shares, dividend, buyback, etc.\n\nNearly 15 companies have fixed record dates for dividend corporate action next week, i.e. between October 19 and October 25. Additionally, more than five companies have fixed record dates in the coming week for stock split, bonus, and buyback.\n\nICICI Prudential Asset Management Company (AMC), Mangalore Refinery and Petrochemicals Limited, Angel One, Tips Music , HDB Financial Services , Indian Railway Finance Corporation (IRFC), LTM, Modison, etc have fixed record dates in the coming week.\n\nJattashankar Industries Limited, Azad India Mobility and JSW Dulux have fixed record dates for stock splits. Jattashankar and JSW Dulux have announced a stock split from \u20b9 10 to Re 1. Meanwhile, Azad India Mobility has fixed stock split from \u20b9 10 to \u20b9 2.\n\nTitan Biotech has announced bonus share issuance and has fixed record date for the coming week. Meanwhile, VRL Logistics has announced buy back of shares and has fixed October 22 as the record date.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 01:43 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FPI selling crosses Rs 52,000 crore in October as Nifty defies foreign exodus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a FPI selling crosses Rs 52,000 crore in October as Nifty defies foreign exodus The Economic Times daily newspaper is available online now. Read Today's Paper FPI selling crosses Rs 52,000 crore in October as Nifty defies foreign exodus SECTIONS FPI selling crosses Rs 52,000 crore in October as Nifty defies foreign exodus By Akash Podishetti , ETMarkets.com Last Updated: Oct 18, 2026, 01:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign portfolio investors pulled out over Rs 52,000 crore from Indian equities in October, surpassing September outflows. Despite persistent FPI selling driven by rising US Treasury yields and elevated crude oil prices, benchmark indices Nifty and Sensex rebounded sharply, supported by robust domestic institutional buying and IT sector gains.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and e content": "Snabbit and Urban Co\u2019s InstaHelp business reported rapid growth in Q2 FY27, with about 6.2\u20136.4 million jobs or orders each. Both platforms remain loss-making, though they reported lower losses per job or order. Competition, expansion costs and pricing pressure continue to challenge profitability.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 01:01 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Income Tax New TDS Form 141: How it simplifies tax deduction at source compliance for property transactions, rent, etc", "full_content": "The Income Tax Department has introduced Form 141 to simplify tax deducted at source (TDS) compliance. The new form replaces Forms 26QB, 26QC, 26QD and 26QE, covering property transfers, rent, contractor payments, professional fees and virtual digital asset transactions.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 12:56 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Trump's Russia diesel deal may offer Putin more than money \u2014 and spell trouble for Ukraine", "full_content": "Trump's diesel deal may do little for Russia's finances, but it raises bigger questions about Ukraine's leverage, U.S. support and Putin's next moves.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 12:52 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Senior citizen home hunt: Seeking house for aged parent? Below \u20b970 lakh, healthcare bring Kochi, Nashik, Haridwar on top", "full_content": "Senior citizen home hunt: Seeking house fo nd ratios is the largest CFA L1 topic by weight."}, {"title": "Axis Bank Q2 profit up 38% on loan growth", "full_content": "Axis Bank has showcased impressive results with a 38% surge in net profit for the quarter ending in September. This significant growth stems from strong loan demand and enhanced asset quality. The bank's net interest income increased by 11.8% year-on-year, totaling 15,371 crore, while overall advances rose by 23% compared to the previous year. The stability in the bank's net interest margin emphasizes its positive financial trajectory.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 09:59 AM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Central Bank of India\u2019s Q2 profit jumps 21% YoY to Rs 1,469 crore", "full_content": "In September 2026, Central Bank of India reported an impressive net profit hike of 21%, totaling 1,469 crore. This boost was largely attributed to strong loan growth, even as other income declined. The bank's net interest income surged by 26% to 4,146 crore. Additionally, total income rose by 15% to reach 11,737 crore, with the cost-to-income ratio improving to 58.95% from 62.42% a year prior.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 09:56 AM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "YES Bank Q2 profit rises 65%; AT1 hit may risk 5,217 cr loss", "full_content": "YES Bank's net profit increased by 65% to 1,080 crore in the second quarter, driven by higher income. However, factoring in a Supreme Court judgment could lead to a post-tax loss of 5,217 crore. The court upheld a ruling concerning the bank's AT1 bonds, impacting its financial report     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
