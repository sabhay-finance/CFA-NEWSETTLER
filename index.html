reasury yields continued their upward march Thursday as investors sought to price in a variety of factors: inflation still hovering well above the Fed's 2% goal, another bump up in energy prices and the impact of a global hyperscaler financial arms race and accompanying debt issuance.\n\nIn the past, policymakers have been willing to look through inflation spurts from temporary shocks like high energy prices and tariffs. And the narrative not so long ago was that the artificial intelligence investing boom was a story that would last a year or two and ultimately prove disinflationary.\n\nBut now Fed officials are rethinking the impact of those factors and seeing the danger of more durable inflation.\n\nAt the same time, markets are grappling with a central bank that suddenly has no interest in telegraphing its next moves, leaving an uncertain calculus on who is calling the shots \u2014 policymakers or market players.\n\n\"The time of looking through the initial supply shock has come to an end,\" said Joseph Brusuelas, chief economist at RSM. \"The bias has to be towards restoring price stability, and they should take what's going on seriously.\"\n\nMarkets expect the central bank will indeed take a firmer hand on inflation.\n\nOver the past day or so, traders raised the odds of a rate hike in October, which would come only a month or so after last week's quarter percentage point increase . They also see a third increase either late this year or early in 2027, with additional hikes possible in subsequent months.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 03:10 AM IST", "pub_date_relative": "32m ago"}, {"title": "S&P Global raises Western Digital outlook to positive on surging AI demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 03:08 AM IST", "pub_date_relative": "34m ago"}, {"title": "Why investors aren\u2019t buying yet another attempt by the Treasury to calm the rattled bond market", "full_content": "Back-to-back weak auctions for Treasury notes show that government repurchases haven\u2019t spurred demand for bonds.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:53 AM IST", "pub_date_relative": "49m ago"}, {"title": "Hedge Fund With 235% Return Says Gold Price Decline Is Temporary", "full_content": "(Bloomberg) -- Australian hedge fund manager Raphael Lamm, whose long-short gold fund has delivered a net return of more than 200% to investors since its launch last year, sees the recent decline in bullion as temporary, arguing that the key forces underpinning its long-term rally remain intact.\n\nThe \u201cunsustainability of fiscal situations in key markets,\u201d particularly US government debt of more than $40 trillion, as well as the growing central-bank allocations will support gold over the medium to long term, said Lamm, who co-manages the A$1.5 billion ($1.1 billion) L1 Gold Fund with Mark Landau. In the near term, prices are set to be driven by developments in the US-Iran war, real interest rates and inflation data, he said.\n\nGold has been under pressure since hitting a record in January, as surging energy prices and bets on Federal Reserve rate hikes weigh on the non-yielding metal. It is down about 16% since the US-Iran war erupted in late February.\n\n\u201cWhile there\u2019s been some headwinds to gold markets and the gold price since the Iran war, we think they\u2019re very temporary in nature,\u201d Lamm said in an interview. \u201cMost of the key drivers of demand for gold are going to remain intact or even strengthen over the medium term.\u201d\n\nBullion traded at $4,286.01 an ounce on Thursday evening in Sydney.\n\nLamm\u2019s fund, which pairs long positions in gold-related stocks with a short position in gold futures as a hedge, has returned a net 235% through August since its launch in February last year, according to a spokesperson. That compares with a gain of about 148% for VanEck Gold Miners ETF and 55% advance in physical gold prices over the same period.\n\nPart of the Melbourne-based L1 Group Ltd., which manages about $14 billion in assets, the L1 Gold Fund is using the decline in bullion to add to its long gold equity positions. Most of its holdings are in companies with market value of at least $5 billion, Lamm said.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 02:52 AM IST", "pub_date_relative": "50m ago"}, {"title": "Meta gets to consumer AI device market before OpenAI, but Zuckerberg's strategy remains unproven", "full_content": "Meta CEO Mark Zuckerberg has long been set on owning the hardware that consumers use to access his company's apps. As he pushes to make the Muse AI agent the \"centerpiece\" of Meta's AI strategy, he's counting on a slew of forthcoming devices to turn his dream into reality.\n\nAt Meta's annual Connect conference, which landed a week before OpenAI's big event for developers, the company said that by the end of 2026, \"there will be over 100 styles of AI glasses,\" and Zuckerberg on Wednesday revealed a pendant called the Muse Charm, though he didn't offer a price.\n\nMeta was late to the generative AI game, badly trailing OpenAI , Anthropic and Google , which all have popular AI models and a host of services used by consumers and businesses. Zuckerberg is trying to make up for lost time with Muse, an app that can act as a personal assistant, responding to emails, booking travel and shopping on a user's behalf.\n\nInvestors are buying in, lifting the stock 4.5% on Thursday and more than 25% since Meta announced Muse earlier this month. They're betting that, while Zuckerberg never found a big market for virtual reality after changing his company's name to Meta five years ago and shifting its strategy to the metaverse, he's now on the right track.\n\n\"Meta Connect 2026 more explicitly attached Muse AI as a killer app fused deeply into the hardware strategy, from AR glasses and extending into Muse Charm, a dedicated keychain-like device providing rapid access to Muse,\" wrote analysts at Mizuho, in a report on Thursday. The firm, which recommends buying the stock, said Meta's AI advancements will continue \"to drive multiple expansion in Meta shares.\"\n\nThe Muse Charm resembles a cross between a kid's Tamagotchi keychain and a wearable medical buzzer.", "source": "CNBC World Economy", "pub_date_str": "25 Sep 2026, 02:47 AM IST", "pub_date_relative": "55m ago"}, {"title": "Oil jump sends 30-year yields to two-decade high", "full_content": "NEW YORK, Sept 24 (Reuters) - Bond markets came under renewed pressure on Thursday with US 30-year bond yields hitting a more than 20-year high as rising oil prices reignited concerns about higher inflation and more Federal Reserve interest rate hikes.\n\nOil prices climbed about 3% to a one-week high after a Houthi missile attack on Saudi Arabia revived fears of supply disruptions, but trade was volatile and prices came off session highs after reports the US and Iran discussed reopening the Strait of Hormuz.\n\nThe interest-rate-sensitive US 2-year note rose 2.51 basis points to 4.92%.\n\nThe yield on benchmark US 10-year notes increased 8.17 basis points to 5.196%, the highest since 2007.\n\nThe 30-year bond yield gained 7.96 basis points to 5.4816%, the highest since 2004.\n\n\"The move higher in Treasury yields has likely been driven by a combination of rising Fed hike expectations, higher growth expectations, higher oil prices, fiscal concerns, and hyperscaler issuance,\" said Gennadiy Goldberg, head of US rates strategy at TD Securities. \"The sharp rise in rates this week was likely exacerbated by investor positioning amid a rapid resurgence of oil prices.\"\n\nElsewhere, the yield gap between French and German 10-year debt widened to its broadest level since Mario Draghi's 2012 \"Whatever it Takes\" speech.\n\nThursday's move follows a sharp selloff on Wednesday when benchmark 10-year yields posted their largest daily increase since the April 2025 tariff turmoil. That was driven in part by stronger-than-expected US business activity data, which showed prices paid surged to a nearly four-year high this month.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 02:37 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Trump, Xi to attend state dinner after White House meeting", "full_content": "President Donald Trump and Chinese Leader Xi Jinping are meeting at the White House on Thursday for high-stakes talks focusing on trade , artificial intelligence and the Iran war \u2014 in between displays of military fanfare and a lavish banquet.\n\nTrump said in an arrival ceremony speech that the two countries have been \"working to encourage a more balanced trading relationship,\" and that the leaders plan to discuss \"pressing issues\" around security, technology and AI.\n\nTreasury Secretary Scott Bessent said Wednesday evening that the countries have agreed to extend their temporary trade truce , which lowered U.S. tariffs and suspended Beijing's controls on exports of rare earths and critical minerals, among other stipulations. That agreement, which was set to expire in mid-November, will be extended by two months to Jan. 10, Bessent told Fox News.\n\n\"The decisions we make in these areas today can promote peace and prosperity for decades and decades to come,\" Trump said in Thursday's remarks.\n\nXi joined in the bonhomie. \"China and the United States, as two major countries, stand to gain from cooperation and will both lose in confrontation,\" he said in his own remarks, which were translated live.\n\n\"We do not need to avoid mentioning competition, but our competition should be a healthy one and should be kept within bounds. It should be a race of catching up with one another, not a wrestle in which one either wins or loses,\" he said.\n\nXi also engaged in the Chinese specialty of \"panda diplomacy,\" announcing that two pandas will be coming to Georgia's Zoo Atlanta in the coming days.\n\nWhile China analysts broadly predict the leaders' personal relationship and policy goals will result in a cautious summit that yields few major deliverables, their latest face-to-face nevertheless carries real geopolitical risk .", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 03:39 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "8% mortgage rates are \u2018not an impossibility\u2019 as the 30-year fixed rate surges", "full_content": "With the 10-year Treasury up sharply and the outlook for the U.S. economy looking unclear, some say 8% mortgage rates are back on the table.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 03:33 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Shale oil magnate says Exxon chief \u2018threw me under the bus\u2019 after $60bn takeover", "full_content": "Scott Sheffield says supermajor launched \u2018smear campaign\u2019 to stop him joining company\u2019s board", "source": "FT Markets", "pub_date_str": "25 Sep 2026, 03:27 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bluerock Acquisition Corp. II prices $150M IPO on Nasdaq", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 03:19 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Pete Hegseth reports at least $3.1 million in cash, investments and bitcoin", "full_content": "Defense Secretary Pete Hegseth reported at least $3.1 million in cash, retirement investments and bitcoin in his newly released 2025 annual financial disclosure , including more than $1 million in cash held in a single bank account.\n\nThe Office of Government Ethics filing provides the latest look at the finances of the former firebrand Fox News host, who was confirmed as Defense secretary in January 2025. Hegseth is facing calls to be impeached from members of his own party related to his handling of the war with Iran .\n\nThe disclosure lists five retirement accounts containing investments worth roughly $2.05 million to $4.35 million. Hegseth's three accounts accounted for about $500,000 to $1.25 million of that total, while his wife, Jennifer Hegseth, reported roughly $1.55 million to $3.1 million in two rollover individual retirement accounts.\n\nThe household also reported three cash accounts, including one worth more than $1 million, and bitcoin valued at between roughly $16,000 and $65,000.\n\nBecause financial disclosures report assets in broad ranges rather than exact amounts, it is not possible to determine whether Hegseth\u2019s total wealth increased or decreased from a year earlier. His December 2024 nominee disclosure listed roughly $1.4 million to $3.4 million in financial assets. His new filing shows at least $3.1 million, but no comparable upper limit because one bank account is reported only as \"worth more than $1 million.\"\n\nThe clearest change is in cash. In Hegseth's 2024 filing, an account listed as \"U.S. bank #2\" held between $15,001 and $50,000.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 03:16 AM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Drug developer City Therapeutics files for US IPO as biotech listings surge", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 03:13 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "S&P Global upgrades AZZ to \u2019BB\u2019 on rapid debt reduction and improving leverage", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 03:11 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Surging Treasury yields pose a brand new problem for Kevin Warsh and the Fed", "full_content": "The bond market is yelling at the Federal Reserve, but the messages are coming from different directions and pose a dilemma for policymakers as they seek to strike a balance that won't tank the economy.\n\nTreasury yields continued their upward march Thursday as investors sought to price in a variety of factors: inflation still hovering well above the Fed's 2% goal, another bump up in energy prices and the impact of a global hyperscaler financial arms race and accompanying debt issuance.\n\nIn the past, policymakers have been willing to look through inflation spurts from temporary shocks like high energy prices and tariffs. And the narrative not so long ago was that the artificial intelligence investing boom was a story that would last a year or two and ultimately prove disinflationary.\n\nBut now Fed officials are rethinking the impact of those factors and seeing the danger of more durable inflation.\n\nAt the same time, markets are grappling with a central bank that suddenly has no interest in telegraphing its next moves, leaving an uncertain calculus on who is calling the shots \u2014 policymakers or market players.\n\n\"The time of looking through the initial supply shock has come to an end,\" said Joseph Brusuelas, chief economist at RSM. \"The bias has to be towards restoring price stability, and they should take what's going on seriously.\"\n\nMarkets expect the central bank will indeed take a firmer hand on inflation.\n\nOver the past day or so, traders raised the odds of a rate hike in October, which would come only a month or so after last week's quarter percentage point increase . They also see a third increase either late this year or early in 2027, with additional hikes possible in subsequent months.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 03:10 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why investors aren\u2019t buying yet another attempt by the Treasury to calm the rattled bond market", "full_content": "Back-to-back weak auctions for Treasury notes show that government repurchases haven\u2019t spurred demand for bonds.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:53 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Hedge Fund With 235% Return Says Gold Price Decline Is Temporary", "full_content": "(Bloomberg) -- Australian hedge fund manager Raphael Lamm, whose long-short gold fund has delivered a net return of more than 200% to investors since its launch last year, sees the recent decline in bullion as temporary, arguing that the key forces underpinning its long-term rally remain intact.\n\nThe \u201cunsustainability of fiscal situations in key markets,\u201d particularly US government debt of more than $40 trillion, as well as the growing central-bank allocations will support gold over the medium to long term, said Lamm, who co-manages the A$1.5 billion ($1.1 billion) L1 Gold Fund with Mark Landau. In the near term, prices are set to be driven by developments in the US-Iran war, real interest rates and inflation data, he said.\n\nGold has been under pressure since hitting a record in January, as surging energy prices and bets on Federal Reserve rate hikes weigh on the non-yielding metal. It is down about 16% since the US-Iran war erupted in late February.\n\n\u201cWhile there\u2019s been some headwinds to gold markets and the gold price since the Iran war, we think they\u2019re very temporary in nature,\u201d Lamm said in an interview. \u201cMost of the key drivers of demand for gold are going to remain intact or even strengthen over the medium term.\u201d\n\nBullion traded at $4,286.01 an ounce on Thursday evening in Sydney.\n\nLamm\u2019s fund, which pairs long positions in gold-related stocks with a short position in gold futures as a hedge, has returned a net 235% through August since its launch in February last year, according to a spokesperson. That compares with a gain of about 148% for VanEck Gold Miners ETF and 55% advance in physical gold prices over the same period.\n\nPart of the Melbourne-based L1 Group Ltd., which manages about $14 billion in assets, the L1 Gold Fund is using the decline in bullion to add to its long gold equity positions. Most of its holdings are in companies with market value of at least $5 billion, Lamm said.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 02:52 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil jump sends 30-year yields to two-decade high", "full_content": "NEW YORK, Sept 24 (Reuters) - Bond markets came under renewed pressure on Thursday with US 30-year bond yields hitting a more than 20-year high as rising oil prices reignited concerns about higher inflation and more Federal Reserve interest rate hikes.\n\nOil prices climbed about 3% to a one-week high after a Houthi missile attack on Saudi Arabia revived fears of supply disruptions, but trade was volatile and prices came off session highs after reports the US and Iran discussed reopening the Strait of Hormuz.\n\nThe interest-rate-sensitive US 2-year note rose 2.51 basis points to 4.92%.\n\nThe yield on benchmark US 10-year notes increased 8.17 basis points to 5.196%, the highest since 2007.\n\nThe 30-year bond yield gained 7.96 basis points to 5.4816%, the highest since 2004.\n\n\"The move higher in Treasury yields has likely been driven by a combination of rising Fed hike expectations, higher growth expectations, higher oil prices, fiscal concerns, and hyperscaler issuance,\" said Gennadiy Goldberg, head of US rates strategy at TD Securities. \"The sharp rise in rates this week was likely exacerbated by investor positioning amid a rapid resurgence of oil prices.\"\n\nElsewhere, the yield gap between French and German 10-year debt widened to its broadest level since Mario Draghi's 2012 \"Whatever it Takes\" speech.\n\nThursday's move follows a sharp selloff on Wednesday when benchmark 10-year yields posted their largest daily increase since the April 2025 tariff turmoil. That was driven in part by stronger-than-expected US business activity data, which showed prices paid surged to a nearly four-year high this month.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 02:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "History shows financial calamities occur when rates rise rapidly like this: 'Something always breaks'", "full_content": "The yield on the 10-year Treasury note is rising to levels not seen in years. But it's not necessarily the outright level that's most concerning for those on Wall Street, it's the speed of the move.\n\nWhen rates climb at such a rapid pace, history tells them something bad tends to happen.\n\nThe 10-year yield saw its most rapid one-day increase since April 7, 2025, on Wednesday, rising further on Thursday to top 5.17%, quite a move considering two weeks ago it was below 4.8% and at one point in August, it was below 4.6%.\n\n\"Something always breaks,\" proclaimed a recent note from John Roque, head of technical analysis at 22V Research.\n\nU.S. 10-year Treasury yield, 3 months Roque pointed out on a chart of the 10-year Treasury yield going back the last five decades 16 instances where it experienced a rapid advance like it is now. During each and every move, some sort of financial calamity resulted. While the scale of the crises varied in their market impact (from the jarring-but-short-lived Silicon Valley Bank failure of 2023 to the 1987 stock market crash), the jump in yields almost always led to some sort of disruption to financial markets that weighed on risk assets.\n\n\"As sure as day follows night, when the 10-year Treasury yield rises, something gets knocked out,\" Roque remarked to CNBC. \"It just pays to be cautious.\"\n\nThe 10-year Treasury yield is a benchmark for borrowing costs across the economy. Everything from mortgage rates to sophisticated hedge fund trades can become contingent on a stable 10-year yield. When it soars quickly, it can unravel risky plans by companies or investors that were counting on a stable borrowing rate.\n\nWhat will crack this time around? It's usually not evident until it is too late and it is not always directly related to borrowing costs on the surface. The Dotcom Bubble burst was because of a multitude of reasons, mostly unrealistic valuations for many tech businesses earning zero profits. But higher rates played their part.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 02:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Costco earnings beat expectations, thanks to tariff refunds", "full_content": "Tariff refunds helped deliver a profit beat during Costco\u2019s fourth quarter.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:24 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Here\u2019s how to position your portfolio for the next AI wave, according to Morgan Stanley", "full_content": "There\u2019s still room for AI hardware stocks to rise, but analysts at Morgan Stanley say it\u2019s time to diversify into a wide variety of industries that are starting to realize AI benefits.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 02:20 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Global bond selloff deepens, as US 30-year yields hit highest since 2004 - Reuters", "full_content": "Global bond selloff deepens, as US 30-year yields hit highest since 2004 Reuters Surging Treasury yields pose a brand new problem for Kevin Warsh and the Fed CNBC US 30-year bond yield rises to highest since 2004 as selloff deepens MSN Bond Markets Are Volatile and Oil Prices Rise The New York Times Stock Market on Sept. 24, 2026: S&P 500, Nasdaq end nearly flat as Big Tech stocks provide support; Dow falls for a 3rd straight day as Treasury yields and oil prices rise MarketWatch", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 02:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dow falls for a third day as bond yields hit fresh highs: Live updates", "full_content": "The Dow Jones Industrial Average fell for a third straight session on Thursday, as Treasury yields at multidecade highs continued to weigh on the most cyclical parts of the market.\n\nThe 30-stock index slid 161.61 points, or 0.31%, to 51,349.98. The S&P 500 ticked lower by 0.02% to 7,704.13. The Nasdaq Composite eked out a 0.01% gain to 26,939.37\n\nStocks came off their session lows after Reuters, citing sources, reported that U.S. and Iranian negotiators in New York are considering a deal that would bring a phased end to the conflict in the Middle East, whereby Iran would reopen the Strait of Hormuz and the U.S. would lift its economic blockade on Tehran.\n\nBut oil prices and bond yields remained elevated. Brent crude , the international benchmark, rose more than 3% to close above $106 per barrel. U.S. West Texas Intermediate futures climbed 2.7% to close at $94.61 per barrel.\n\nThe 30-year Treasury bond yield hit a high of 5.501%, a level not seen since June 2004. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to 5.223%, at levels not reached since June 2007. The 2-year note yield rose to 4.941%.\n\nAs yields surged, so did the market's anticipation of further rate hikes from central bank policymakers. Fed funds futures trading suggests a nearly 71% likelihood that the Federal Reserve lifts its key rate once more in October, per the CME FedWatch tool . That compares to a roughly 55% probability just a week ago.\n\nHigher bond yields tend to squeeze consumers' finances as they face rising borrowing costs at a time when they're already paying more in fuel costs.\n\nYet, Wednesday's readings from S&P Global's manufacturing and services purchasing managers' indexes suggested that U.S. businesses are continuing to boom.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 02:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "30-year Treasury yield hits highest level since 2004 as bond market rout continues", "full_content": "Treasury yields were trading at multidecade highs on Thursday, as investor bets on another rate hike from the Federal Reserve mounted.\n\nThe 30-year Treasury bond yield was last about 10 basis points higher, hitting a high of 5.501%, a level not seen since June 2004. The benchmark 10-year Treasury note yield, which is tied to rates on mortgages, surged more than 10 basis points to 5.223%, to levels not reached since June 2007. The 2-year note yield rose more than 4 basis points to 4.941%.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nGlobal bonds also sold off. Japan's 10-year JGB yield rose its highest since August 1996. U.K. Gilts and German Bunds also moved higher, with yields on various European bonds hitting fresh multi-year highs.\n\nThursday's moves build on a U.S. Treasury rout that took place Wednesday. The 10-year Treasury yield had its biggest one-day jump since April 7, 2025 as traders reacted to stronger-than-expected U.S. economic data, hawkish commentary from a Federal Reserve official and high oil prices.\n\n\"The combination of fiscal, economic, geopolitical, and supply-side inflation pressures converging has bond markets in less familiar territory. The recent rise in yields can no longer be attributed simply to concerns over the deficit,\" said from Mike Sanders, head of fixed income at Madison Investments.\n\nThe data drove expectations of more rate hikes, with traders last pricing in a more-than-75 % chance that the Federal Open Market Committee will increase rates again at its October meeting, per the CME Group's FedWatch tool . That compares to a roughly 49% probability just a week ago.\n\n\"With markets pricing in four rate hikes through next year, the Fed is being pushed toward tighter policy at a time when the risk of a policy mistake is rising,\" he added.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Stop trying to beat the market: Even the richest Americans can\u2019t do it consistently", "full_content": "The 400 richest Americans would collectively have performed better over the past 12 months had they invested their net worths in an S&P 500 index fund.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 01:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Costco Wholesale Corporation Reports Fourth Quarter and Fiscal Year 2026 Operating Results - Costco Investor Relations", "full_content": "Costco Wholesale Corporation Reports Fourth Quarter and Fiscal Year 2026 Operating Results Costco Investor Relations Costco tops Q4 estimates: Revenue hits $95.7B on massive e-commerce surge Yahoo Finance Costco Wholesale Beats Estimates. Its Stock Is Flat. Barron's Costco beats sales and profit expectations as comparable sales continue to surge (COST:NASDAQ) Seeking Alpha Costco earnings beat expectations, thanks to tariff refunds MarketWatch", "source": "Google News Business", "pub_date_str": "25 Sep 2026, 01:49 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "MGM Resorts shares sink 11% after Barry Diller's People Inc. rescinds takeover offer", "full_content": "Barry Diller's People Inc. has rescinded its offer to buy the remaining public shares of MGM Resorts.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 01:41 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "25 Sep 2026, 03:42 AM IST", "total_stories": 384};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
