d."}, {"title": "Paytm shares cross \u20b91,955 IPO listing-day high after five years; what's boosting investor confidence?", "full_content": "Paytm shares climbed nearly 2% to \u20b91,960, surpassing their IPO listing-day high for the first time. The rise followed preliminary RBI approval for subsidiary PPSL to issue prepaid payment instruments, including digital wallets.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 07:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why market timing is a fool\u2019s game (note to self)", "full_content": "Recent gyrations in stock and bond prices are a timely reminder to do nothing", "source": "FT Markets", "pub_date_str": "13 Nov 2026, 07:01 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "CFTC Chair Selig tells CNBC crypto industry is embracing agency rules as legislation hopes fade", "full_content": "The top U.S. commodities regulator in October announced proposed crypto rules to assert its jurisdiction over the asset class.", "source": "CNBC World Economy", "pub_date_str": "13 Nov 2026, 06:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nasdaq, S&P 500 edge lower as Nvidia turmoil rattles AI trade: Stock Market Live Updates", "full_content": "", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 06:41 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US Treasuries set for worst week since Trump\u2019s \u2018liberation day\u2019", "full_content": "Higher than expected inflation and hawkish remarks by Fed officials have stung investors who bet a global bond rout was over", "source": "FT Markets", "pub_date_str": "13 Nov 2026, 06:26 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "German yields set for biggest weekly rise in two months", "full_content": "As traders ramp up their expectations for European Central Bank interest rate hikes, yields on German government bonds are climbing steadily. This shift follows US inflation figures that were unexpectedly high, disrupting the bond market landscape. Meanwhile, global stock indices are witnessing a downturn, impacting the demand for traditionally safe assets.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 06:22 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India 10-year bond yield reverses half of last week's drop on elevated inflation", "full_content": "Indian government bonds fell for a third consecutive session, driven by inflation and interest-rate outlook concerns. The benchmark yield increased to 7.3079%, reversing much of last week's gains. Retail inflation in India accelerated, surpassing the Reserve Bank of India's target range, which raises rate hike expectations. In the US, rising Treasury yields and inflation data led to altered rate hike projections.", "source": "Economic Times Markets", "pub_date_str": "13 Nov 2026, 06:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How US reet keeps an eye on Nvidia, Microsoft and producer prices AP News Asia\u2019s Stock Rebound Fades as Nvidia Uncertainty Lingers WSJ", "source": "Google News Business", "pub_date_str": "13 Nov 2026, 05:45 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ideaForge Technology shares: Drone stock gains 53% in a year, but should you buy now? Check targets, support, stop loss", "full_content": "ideaForge returned to profitability in Q2 FY27, posting a net profit of \u20b96.5 crore as revenue rose 124% year-on-year to \u20b991 crore. Analysts gave mixed technical views: some cited potential gains toward \u20b9900, while others advised caution until the stock clears resistance near \u20b9728\u2013735.", "source": "LiveMint Markets", "pub_date_str": "13 Nov 2026, 05:39 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "13 Nov 2026, 09:04 PM IST", "total_stories": 305};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
