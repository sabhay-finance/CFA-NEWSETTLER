28% to \u20b9 1,054 crore from \u20b9 825 crore in the year-ago quarter, driven by continued consumer demand during the festive and wedding season.\n\nAt the operating level, the company\u2019s EBITDA stood at \u20b9 309 crore, up from \u20b9 178 crore a year earlier, while its EBITDA margin improved to 29.3% from 21.5% in the year-ago quarter, reflecting improved operational efficiency and robust sales growth, according to the company\u2019s Q2 earnings filing.\n\nBalram Garg, Managing Director of PC Jeweller, said, \u201cBacked by healthy consumer demand, the company's strong performance continued in Q2FY27 as well. During Q2FY27, the company delivered consolidated revenue growth of 28% YoY, consolidated operating EBITDA growth of 74% and consolidated operating PBT growth of 116%.\u201d\n\nDuring the quarter, the company s achieved debt-free status after repaying its outstanding dues to all 14 consortium banks ahead of schedule.\n\nThe company has received no-objection, no-dues and release letters from all the banks. All mortgaged assets, charges, securities, guarantees (both personal and corporate) and undertakings provided by the company and its personal and corporate guarantors have also been fully released.\n\nFurther, the company received remittances of approximately \u20b9 142 crore during the quarter from its outstanding export debtors.\n\nThe company plans to open up to 100 large-format showrooms across Tier I, Tier II and Tier III cities over the next 12\u201318 months, through a mix of company-owned outlets and an asset-light franchise model.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 10:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trade Setup For Oct. 22: Nifty Support Slips To 22,700, Analysts Flag Sideways Drift Till 23,000", "full_content": "Nifty's immediate support has now shifted lower to the 22,650-22,700 zone from 22,800 in the previous session, making this range crucial for the index to hold in the coming session, according to analysts.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 10:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Meta and Tesla bulls get confidence boost after SpaceX earnings", "full_content": "A big rally in SpaceX after earnings is giving hope to Meta and Tesla bulls ahead of their reports due Wednesday afternoon.\n\nOptions trading in both stocks leaned bullish after the open Wednesday, with Meta options looking particularly one-sided as traders bought more calls than puts and more put trades likely initiated by sellers than buyers. More than 30,000 calls traded at or above the ask, suggesting they were bought, versus under 17,000 puts, Cboe LiveVol data shows.\n\nMeta options have generally been bullish since the stock's March low, when the put/call ratio of open contracts plunged to 0.5, meaning two calls open for every one put contract, and that hasn't budged much since, Barchart data show. Almost $22 million of trades were done with a bullish intent on Wednesday, compared to $7.5 million looking for downside.\n\nMeta, Tesla in past three months Market-makers are pricing a 6.5% swing for Meta after earnings, a little under the 9% average the past four quarters. The most popular contract to buy on Wednesday was the 800 strike call expiring Friday that costs $1.40 and needs Meta to rally 14% into the weekend, SpotGamma data shows.\n\nIn Tesla, the flows also lean bullish, but with less conviction. The put/call ratio of open contracts is 0.75, compared to Meta's 0.5, though more calls did trade Wednesday morning than puts.\n\nOf the 520,000 contracts traded in Tesla, 315,000 were calls, as traders bought 88,000 calls and 65,000 puts, according to Cboe LiveVol data. There was also notable call-selling, with 83,000 call contracts likely sold and seven of the top 10 trades by dollar-amount call sales.\n\nStill, traders spent more money buying calls than they did puts, with call-buying premiums amounting to over $200 million, compared to $84 million in puts, according to SpotGamma's analysis.\n\nMarket-makers are pricing a 5.5% swing in Tesla after its report, above the four-quarter median of 3.5%.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 10:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "France\u2019s borrowing costs hit 5% for first time since 2002", "full_content": "Concerns over public finances and political stability have helped push up 10-year bond yields from 3.2% in late February", "source": "FT Markets", "pub_date_str": "21 Oct 2026, 10:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "NaBFID gets Finance Ministry, RBI nod for national infrastructure project repository", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a NaBFID gets Finance Ministry, RBI nod for national infrastructure project repository The Economic Times daily newspaper is available online now. Read Today's Paper NaBFID gets Finance Ministry, RBI nod for national infrastructure project repository SECTIONS NaBFID gets Finance Ministry, RBI nod for national infrastructure project repository By Joel Rebello , ET Bureau Last Updated: Oct 21, 2026, 09:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NaBFID has obtained approvals from the finance ministry and the Reserve Bank of India to establish a national repository. This repository will offer consolidated information on infrastructure projects for lenders and investors. The platform aims to facilitate access to data sourced from various government agencies like NHAI and others. NaBFID is considering partnerships with financial institutions to enhance the repository's effectiveness.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "21 Oct 2026, 09:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Stock Market Today: Nasdaq Opens Higher; SpaceX Shares Surge on Tesla Deal Talks \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Opens Higher; SpaceX Shares Surge on Tesla Deal Talks \u2014 Live Updates WSJ Dow Jones Top Markets Headlines at 11 AM ET: Stocks Higher as SpaceX Hints at Tesla Deal Talks | NYSE ... Moomoo Nasdaq climbs over 1% as SpaceX, Super Micro improve AI sentiment Reuters SpaceX\u2019s AI Surprise Is More Fragile Than It Looks Bloomberg.com SpaceX stock jumps 10% after earnings beat and Musk hints at Tesla tie-up CNBC", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 09:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Upcoming IPO: Edelweiss unit EAAA India Alternatives' \u20b91,200 cr public issue to open on Oct 26 - Top things to know", "full_content": "EAAA India Alternatives Ltd, an alternative investment platform backed by Edelweiss Financial Services , has fixed the price band for its \u20b9 1,200-crore initial public offering ( IPO ) at \u20b9 1,585-1,665 per share.\n\nThe public issue will open for subscription on October 26 and close on October 28, according to an announcement issued on Wednesday. The bidding window for anchor investors will open on October 23.\n\nAt the upper end of the price band, EAAA India Alternatives will command an implied market capitalisation of \u20b9 10,765 crore. At the lower end, the company's valuation stands at \u20b9 10,248 crore.\n\nThe IPO price band was approved by the company's IPO Committee at a meeting held on October 20.\n\nInvestors can bid for a minimum of nine equity shares and in multiples of nine thereafter. At the upper end of the price band, retail investors will need to invest at least \u20b9 14,985 to subscribe to one lot.\n\nThe issue is entirely an offer for sale (OFS) by the Edelweiss Group, with no fresh issue of shares. Consequently, EAAA India Alternatives will not receive any proceeds from the IPO, as the entire amount raised will go to the selling shareholder.\n\nThe issue size has been reduced to \u20b9 1,200 crore from the \u20b9 1,500 crore proposed in the draft red herring prospectus (DRHP) filed with the Securities and Exchange Board of India (SEBI) in January.\n\nUnder the proposed allocation, 50% of the offer has been reserved for qualified institutional buyers (QIBs), 15% for non-institutional investors (NIIs) and 35% for retail investors.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Earnings season is in full swing. These are Morgan Stanley's highest conviction plays", "full_content": "Morgan Stanley expects a handful of stocks that are reporting quarterly results soon to see big gains. Here's the list", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 09:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Government websites in Europe and elsewhere go dark as software flaw sparks security scramble", "full_content": "Government websites in Europe and elsewhere went offline on Wednesday after the disclosure of critical vulnerabilities in a widely used programming language sent website operators scrambling to protect their systems.\n\nDevelopers of the PHP programming language said Tuesday they had identified two critical vulnerabilities and urged users to update their sites as soon as a fix was released. They said around 1345 GMT on Wednesday that a new version fixing the vulnerabilities was live.\n\nBut with reports that hackers were exploiting the flaws to break into websites, government agencies in the Netherlands and Finland were among those that took sites offline ahead of the fix as a precaution.\n\nPHP underpins large parts of the internet, raising concerns that a significant number of websites could be vulnerable to attack.\n\n\"PHP is everywhere. It quietly powers WordPress, Drupal, Joomla, and Magento sites, shared hosting platforms, control panels, and an awful lot of software that doesn't even advertise that it runs PHP under the hood,\" cybersecurity company Huntress said in a blog post.\n\nDane Knecht, the chief technology officer of Web and cloud security firm Cloudflare , said that attacks were emerging and Cloudflare was updating its firewall rules as a stopgap measure.\n\n\"We are seeing early attacks emerging and are updating mitigations as new vectors show up. This is a STOPGAP only. Patch as soon as PHP releases the update,\" he said on X.\n\nWordfence, a security plugin that protects WordPress websites, said all WordPress sites run on a PHP-installed server. It warned that automatic updates would not apply the fix and advised site owners to find out who is responsible for updating PHP on their sites.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 09:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why the stock market\u2019s fragile calm faces a major test starting Friday", "full_content": "A bevy of upcoming catalysts will put this fragile pause to the test.", "source": "CNBC Top News", "pub_date_str": "21 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SpaceX stock jumps 10% after earnings beat and Musk hints at Tesla tie-up", "full_content": "SpaceX stock jumped 10% Wednesday after the company reported surging revenue growth in its third quarter, and owner Elon Musk floated a potential SpaceX- Tesla merger.\n\nThe space company, which made its debut on the Nasdaq in the biggest initial public offering ever in June, reported third-quarter revenue on Tuesday of $14.6 billion, up 161% from the previous year, and beating LSEG consensus estimates of $12.72 billion.\n\nMeanwhile, its operating income came in at $2.8 billion, with net income of $4.4 billion, after reporting a net loss of $1.05 billion in the same period a year earlier.\n\nOn an earnings call, Musk said he's considering a combination with Tesla \u2014 which would mark the largest merger in history \u2014 and that the boards of both companies have created specific committees to discuss a consolidation.\n\n\"I do think there's a lot of merit to combining the companies as we are pretty much in the superintelligence singularity, and there's a lot to be gained from cooperating,\" Musk said on the call. Tesla is set to report third-quarter earnings after the closing bell on Wednesday.\n\nSpaceX shares since its debut on the Nasdaq. Shares of other space stocks, including Rocket Lab , Intuitive Machines and AST SpaceMobile climbed on Wednesday.\n\nSpaceX forecasts first-quarter 2027 revenue between $33 billion and $37 billion, beating the average analyst estimate of $22.2 billion, according to LSEG.\n\n\"We delivered another strong quarter in Q3. Revenue grew an impressive 161% year-over-year, fueled by continued momentum in Connectivity and a clear inflection in our Super Intelligence business,\" SpaceX's chief financial officer, Bret Johnsen, said in the earnings release.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 09:38 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meta earnings live updates: AI spending, ad revenue and stock reaction - CNBC", "full_content": "Meta earnings live updates: AI spending, ad revenue and stock reaction CNBC Meta earnings live: Meta Q3 earnings to test Wall Street's stomach for AI spending Yahoo Finance Meta Earnings Will Provide a Gut Check for Struggling AI Trade Bloomberg.com If There\u2019s a Market Bubble to Pop, Meta Earnings Hold the Pin Barron's Meta Stock Is Up 9% This Year. Is It Still a Buy Ahead of Earnings? Morningstar", "source": "Google News Business", "pub_date_str": "21 Oct 2026, 09:38 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Spotify Cracks Down On Family Plan Sharing: Miss This Check, Face A 12-Month Ban", "full_content": "Users who fail Spotify's household verification process may need to switch subscriptions and could face a 12-month restriction on joining another shared plan.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:36 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks, gold or crypto? The last 3 years\u2019 returns have a surprising answer", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Crypto \u203a Crypto News \u203a Stocks, gold or crypto? The last 3 years\u2019 returns have a surprising answer The Economic Times daily newspaper is available online now. Read Today's Paper Stocks, gold or crypto? The last 3 years\u2019 returns have a surprising answer SECTIONS Stocks, gold or crypto? The last 3 years\u2019 returns have a surprising answer By Kumar Gaurav , ETMarkets.com Last Updated: Oct 21, 2026, 09:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bitcoin delivered nearly 234% returns over three years, outperforming silver, gold and equities. However, precious metals led over one year as cryptocurrencies declined. CoinDCX data also shows Bitcoin topping hypothetical one-year SIP values, highlighting the importance of investment horizons and risk management.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Oct 2026, 09:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jio IPO has a flying start, shares subscribed over three times", "full_content": "India's largest initial public offering (IPO) got off to a flying start with Jio Platforms Ltd scoring the highest first-day subscription for any mega share sale, as investors jostled for a pie of the country's largest telecom company.\n\nInvestors bid for as much as 3.16 times of Jio Platforms shares on offer on Wednesday, compared to Hyundai Motors India Ltd 's 0.42 times and the National Stock Exchange's (NSE) 0.72 times subscription on the first day of the share sale. While Hyundai Motors and NSE raised \u20b9 27,858 crore and \u20b9 22,562 crore respectively, Jio will raise \u20b9 30,213 crore at the upper end of the price band. The early interest underlines strong interest in the long-awaited IPO, which closes for subscription on 23 October.\n\nThe company, which is selling 19.75 crore shares to the public (excluding shares sold to anchor investors) received bids for 62.36 crore shares totalling \u20b9 69,763 crore, BSE data showed, or \u20b9 47,660 crore more than expected. The deal was fully subscribed within 100 minutes, a rare feat for a mega offering in India.\n\nQualified institutional buyers (QIBs) such as foreign institutions and mutual funds led from the front, bidding for 9.42 times the number of shares reserved for them, and making up 74% of the total demand for shares. Except retail investors who bid for 73% of their quota, all categories were oversubscribed on Day One.\n\nThe strong institutional participation came on a weak market day, when the Nifty 50 index fell 0.34%.\n\n\u201cJio Platforms was already India's largest IPO in terms of issue size. It has now also received the highest first-day bid value among mega-IPOs.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The 'Second EMI' That Never Ends: A Gurugram Homebuyer's Reality Check", "full_content": "The maintenance goes up every single year, because the guards' salaries go up, the gardeners' and plumbers' wages go up, the power bill and the diesel for the backup generators go up, and inflation sits on top of all of it.", "source": "NDTV Profit", "pub_date_str": "21 Oct 2026, 09:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IPO GMP race: Reliance Jio Platforms IPO vs Paras Healthcare IPO - Check grey market winner", "full_content": "IPO GMP race: Jio Platforms initial public offering (IPO) witnessed robust demand on Day 1, garnering 3.04 times subscription on Wednesday, October 21. Its latest grey market premium today (GMP) indicated potential listing gains of around 22%.\n\nIn contrast, Paras Healthcare, which also opened for subscription on the same day, saw a muted response, with its GMP pointing to estimated listing gains of 4.04%. For primary market investors, here is a complete comparison of Reliance Jio IPO GMP and Paras Healthcare IPO GMP.\n\nMukesh Ambani \u2019s Reliance Industries Limited (RIL)-backed Jio Platforms\u2019s IPO GMP stood at \u20b9 249. Considering its grey market premium and upper price band, the Jio IPO is likely to be listed at \u20b9 1368 per share (which is the sum of IPO GMP and upper price band), which hints at 22.25% of expected listing gain.\n\nThe Jio IPO was subscribed around 3.16 times on day 1, which included 9.42 times subscription in the QIB category, 0.73 times in the retail investors category, and 1.68 times in the NII category. The Jio IPO has a fixed price band at \u20b9 1,065 per share to \u20b9 1,119 per share. A retail investor is required to put \u20b9 13,428 per share to apply for the IPO.\n\nParas Healthcare IPO grey market premium (GMP) was recorded at \u20b9 30, as per media reports at 8 pm on October 21. With an upper price band of \u20b9 693, the estimated listing price for Paras Healthcare IPO is \u20b9 723 (which is the sum of upper price band and latest grey market premium). The IPO is expected to be listed with 4.04% gain.\n\nParas Healthcare IPO was subscribed 0.15 times. The issue was subscribed 0.73 times in the retail category, 0.08 times in the NII category with no participation in the QIB (ex-anchor). The IPO has a fixed price band at \u20b9 660 to \u20b9 693 per share.", "source": "LiveMint Markets", "pub_date_str": "21 Oct 2026, 09:32 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Tesla earnings loom after Musk calls SpaceX merger a 'good idea'", "full_content": "On SpaceX's earnings call late Tuesday, CEO Elon Musk , who also runs Tesla , took a break from talking about financial results to tell investors that it would be a \"good idea\" to merge his two companies, and said the boards at both have formed special committees to discuss a possible tie-up.\n\nMusk will be back in public after market close on Wednesday, this time to discuss Tesla earnings.\n\nHere's what Wall Street is expecting, according to estimates from analysts polled by LSEG:\n\nShould Tesla fail to top expectations, the company would see a slight decrease in revenue from $28.1 billion a year earlier. Tesla has recorded double-digit growth in each of the two prior quarters, but revenue dropped in three of four quarters in 2025, as Chinese EV makers such as BYD and Xiaomi gained popularity in Asia and Europe with affordable and innovative EVs. Tesla was also hit last year by the end of a federal EV tax credit.\n\nEarlier this month, Tesla reported vehicle deliveries for the third quarter of 486,532, about 2% below the year-ago number. Deliveries are the closest approximation of sales reported by Tesla but are not precisely defined in its shareholder communications.\n\nWhile Tesla still counts on auto sales for the bulk of its revenue, Musk sees the company's future in robotaxis and humanoid robots. That's putting the focus on capital expenditures, which are expected to top $25 billion this year, based on a prior forecast, up from about $8.5 billion in 2025.\n\nOne of Tesla's big investments is in a semiconductor factory that it's building with SpaceX and Intel in Grimes County, Texas.", "source": "CNBC World Economy", "pub_date_str": "21 Oct 2026, 09:31 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Thursday", "full_content": "Sensex and Nifty ended above pre-closing auction session levels after extreme volatility, despite an Rs 8 lakh crore market selloff. Elevated crude prices, foreign investor outflows and weak market breadth kept sentime     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
