<script>

    const allData = {"general": [{"title": "Data center electricity use could double by 2030, IEA says", "full_content": "Global electricity use by data centers could double by 2030 and stretch power grids, potentially delaying new projects, the International Energy Agency warned.\n\nData centers could consume around 1,000 terawatt-hours of electricity a year by 2030, according to the IEA, which added that tight supply chains, local opposition and limited grid capacity could slow construction.\n\nThe warning is part of the IEA's Stated Policies Scenario , in which the agency forecasts are based on measures that have been put forward but have not yet been adopted.\n\nThe IEA cites large data center project pipelines in Texas, Virginia, Finland and the U.K. In several regions, the combined capacity of data centers waiting to connect exceeds current peak demand.\n\nWithout grid upgrades, power networks could become more congested and less reliable, the IEA said.\n\nNew projects could face longer waits to connect, while generators could be forced to cut output when the grid cannot meet demand.\n\nPeak electricity demand is projected to rise 40% to 50% by 2035, according to the IEA. Under the Stated Policies Scenario, grids should be expanded by 26 million kilometers of new lines by 2035, while about 16 million kilometers of existing lines need to be replaced or refurbished. Supplies of copper, cables and transformers are already tight, the IEA said.\n\nUnder the Current Policies Scenario, which is based on energy policies and regulations already in place, grid spending is projected to rise 75% over the next decade. The agency says power networks are \"one of the biggest energy investment stories of the next decade.\"", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:04 PM IST", "pub_date_relative": "9m ago"}, {"title": "Christine Lagarde: Acting in time", "full_content": "It is a pleasure to be back at this congress. This is the eighth time I have spoken here as President of the ECB, and it will sadly be the last.\n\nIn preparing for today, I reread those speeches. The topics have varied, from growth and inflation to capital markets and the Single Market.\n\nBut one concern runs through all of them: how to make Europe stronger, so that its prosperity is driven by its own strengths and less exposed to decisions taken elsewhere.\n\nFor many years, the challenges we discussed here were old ones. We had fallen short of our ambitions for the Single Market. Our growth relied too heavily on external demand for an economy of our size, and our competitiveness was slowly eroding.\n\nThose challenges have not gone away. But in recent years, new ones have been layered on top. Dependencies that we once saw as a normal part of an open economy, from critical raw materials to technology, can now be used against us. That has made economic sovereignty a challenge in its own right.\n\nThe old challenges and the new ones have something in common.\n\nFive centuries ago, Machiavelli compared the problems of states to a fever that, at the start, is \u201ceasy to cure but difficult to detect\u201d and, in time, becomes \u201ceasy to detect but difficult to cure\u201d.\n\nBoth kinds of challenge are of this sort. By the time everyone can see the need to act, the best time to act has usually passed.", "source": "ECB Press", "pub_date_str": "20 Nov 2026, 02:00 PM IST", "pub_date_relative": "13m ago"}, {"title": "FTSE 100 today: Stocks fall on tech, metals rout despite UK retail beat", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:54 PM IST", "pub_date_relative": "19m ago"}, {"title": "Nestle teams up with Microsoft and Boston Dynamics to expand AI use", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:53 PM IST", "pub_date_relative": "19m ago"}, {"title": "Benefit Systems surges 7.5% on strong nine-month results", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:50 PM IST", "pub_date_relative": "22m ago"}, {"title": "Nasdaq futures fall after Anthropic fails to lift market sentiment: Live updates", "full_content": "Stock futures pulled back early Friday, following a horrid session on Wall Street as the much-anticipated Anthropic public market debut failed to boost the artificial intelligence trade.\n\nS&P 500 futures slipped 0.57%, and Nasdaq-100 futures shed 1.08%. Dow Jones Industrial Average futures fell 0.23%.\n\nIn Asia, major indexes tumbled on Friday. Japan's Nikkei 225 plunged 5.06% to close at 56,436.65. South Korea's Kospi sank 5.21% to close at 4,869.96. Mainland China's CSI 300 slipped 0.76% to 3,954.57, while Hong Kong's Hang Seng Index was down 2.24% in its final hour of trading. Australia's S&P/ASX 200 closed at 8,592.6.\n\nThe major U.S. averages fell more than 2% each in regular trading, with the Dow closing below the key 50,000 level for the first time since June.\n\nThose steep declines came despite a strong start to the session. The Nasdaq Composite at one point traded 2.1% higher, and the S&P 500 was up as much as 1.3% on the day, as traders braced for Anthropic's first trade. But almost immediately after the Claude AI company began trading, stocks tumbled \u2014 adding to this week's already sharp losses.\n\nWeek to date, the Dow has fallen 6.2%, putting it on pace for its worst weekly performance since April 2025. The S&P 500 and Nasdaq are down 5% each, also headed for their largest one-week pullbacks in more than a year.\n\nYet, Deutsche Bank strategist Binky Chadha thinks the market is now \"very oversold,\" as growth and earnings remain strong.\n\n\"The broader market, whether you look at positioning, whether you look at valuation .. we are sort of completely washed out,\" he told CNBC's \" Closing Bell: Overtime .\" \"It all started with a big rotation out of tech. \u2026 As the cycle has happened, we've unfortunately also gotten a lot of negative catalysts.\"", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:48 PM IST", "pub_date_relative": "24m ago"}, {"title": "Venture Global general counsel Keith Larson sells $9.6M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:46 PM IST", "pub_date_relative": "27m ago"}, {"title": "Trisalus Life Sciences CEO buys $160,205 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:46 PM IST", "pub_date_relative": "27m ago"}, {"title": "Acrivon Therapeutics chief development officer sells $603 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:46 PM IST", "pub_date_relative": "27m ago"}, {"title": "SBI alerts pensioners to fake PPO update messages; warns against clicking suspicious links and sharing personal details", "full_content": "The State Bank of India (SBI) warned pensioners about a rapidly evolving cyber fraud tactic in which fraudsters impersonate pension officials, build trust and send fake messages urging them to share personal information under the pretext of updating their \u2018Pension Payment Orders\u2019 (PPOs).\n\nIn a post on its official X handle on 18 November, SBI shared how fraudsters may target and exploit pensioners\u2019 concerns about their pension payments, taking advantage of their advancing age to trick them into clicking suspicious links and sharing confidential information.\n\nThe banking institution elaborated upon the warning through its cyber safety campaign featuring 'Captain Y \u2013 Your Cyber Rakshak'.\n\n\"Cyber fraudsters may impersonate pension officials and send fake messages with suspicious links, urging individuals to share their personal details for Pension Payment Order (PPO) updation.\"\n\n\u201cBut don\u2019t worry! Captain Y \u2013 Your Cyber Rakshak from SBI \u2013 is here to guide you and remind you: Never click on suspicious links or share your personal information with anyone. Before you act, Hamesha Poochho Why? Stay alert. Stay safe!\u201d\n\nThe post also includes a detailed 1-minute 34-second video that explains exactly how the scam works, urging pensioners to be vigilant and to keep their personal data, OTPs, ATM PIN details and other critical information safe.\n\nThe message illustrates a common engineering tactic utilized by scamsters posing as government or banking officials to create urgency and persuade unsuspecting individuals to discuss and disclose confidential information.\n\nThis warning from SBI highlights that pensioners should be extremely cautious and vigilant about unsolicited SMS messages, WhatsApp communications, phone calls or emails claiming that their PPO details need urgent updating.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 01:45 PM IST", "pub_date_relative": "27m ago"}, {"title": "Earnings call transcript: Paxman posts strong Q3 2026 growth as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:42 PM IST", "pub_date_relative": "30m ago"}, {"title": "Working in Maharashtra? Check latest wage rules on 48-hour workweek, double overtime pay, salary deduction cap and more", "full_content": "Employees working in Maharashtra will have a defined framework for working hours, weekly rest, overtime payments, and wage deductions under the Maharashtra Wage Rules, 2026.\n\nThe state's Labour Department notified the rules on 5 November 2026. The rules came into force on the same day, upon publication in the Official Gazette.\n\nFor salaried employees, the provisions are relevant to working schedules and take-home pay. They prescribe a maximum 48-hour working week for employees whose wage period is not calculated daily, provide for additional payment when employees work on weekly rest days under specified conditions, and cap permissible wage deductions.\n\nThe rules extend across Maharashtra and replace the state's Minimum Wages Rules, 1963, and Payment of Wages Rules, 1963.\n\nThe notification states that the rules extend to the entire state of Maharashtra. It refers to employees across different wage-period arrangements.\n\nHowever, there is an important distinction for government employees. Rule 3 expressly states that the state government will not fix minimum wage rates for Maharashtra government employees under this Code.\n\nThis exclusion relates to minimum- wage fixation; the notification does not establish a blanket exemption for every other provision for all government employees.\n\nUnder Rule 5, an employee whose wage period is calculated daily will have a normal working day of eight hours. For employees paid on a basis other than daily wages, the total weekly working hours cannot exceed 48.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 01:40 PM IST", "pub_date_relative": "33m ago"}, {"title": "Gold price crash: Muthoot Finance, Manappuram shares lose sheen, down up to 5% | Is gold heading for deeper correction?", "full_content": "MUTHOOTFIN A Ksheerasagar Published 20 Nov 2026, 01:39 PM IST Prefer Livemint on Google Gold loan NBFC stocks witnessed renewed selling pressure in Friday's trade, November 20, as the sell-off in gold prices showed no signs of easing. The yellow metal fell to its lowest level in a year amid rising expectations of an interest rate hike by the US Federal Reserve.\n\nShares of Manappuram Finance dropped 5% to \u20b9 270 apiece, hitting their lowest level since April, while its peer Muthoot Finance tumbled 3% to touch an intraday low of \u20b9 2,480 apiece.\n\nThese stocks, which emerged among the top performers in 2025 on the back of a record-breaking rally in gold prices, are now caught in a bearish phase and struggling to regain momentum amid a sharp reversal in the bullion rally.\n\nMCX gold futures dropped another \u20b9 6,028 per 10 grams to hit a one-year low of \u20b9 1,21,424 per 10 grams. The decline was driven by a stronger US dollar and growing expectations of higher US interest rates. The metal has now lost around 10% in 2026 and retreated nearly \u20b9 60,000 from its peak of \u20b9 1,80,779 per 10 grams, based on Friday's intraday low.\n\nMCX silver futures also slipped around 5% to \u20b9 10,560 per kg, falling to their lowest level since late October 2025 during the session.\n\nBoth precious metals have come under intense selling pressure in recent sessions amid a sharp appreciation in the US dollar, making dollar-denominated commodities more expensive for holders of other currencies.\n\nThe US dollar index climbed towards 104 on Friday, reaching its strongest level since April 2025 and heading for a fourth consecutive weekly advance. An AI-driven sell-off in global equities has also boosted safe-haven demand for the greenback.\n\nIn addition, demand for the US dollar has been supported by growing expectations of an interest rate hike by the Federal Reserve at its December meeting.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:39 PM IST", "pub_date_relative": "34m ago"}, {"title": "Goldman cuts Var Energi on longer-term downside risk to gas prices, shares dip", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:38 PM IST", "pub_date_relative": "34m ago"}, {"title": "Bybit\u2019s Global User Base Surpasses 90 Million as Company Expands Into Traditional Finance", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:38 PM IST", "pub_date_relative": "34m ago"}, {"title": "CROO Launches CROO Skill, Opening Its AI Agent Network to Claude Code and Codex Users", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:38 PM IST", "pub_date_relative": "34m ago"}, {"title": "Anthropic IPO live: Anthropic stock closes up 17% from initial price for $1.27T valuation in first day of trading - Yahoo Finance", "full_content": "Anthropic IPO live: Anthropic stock closes up 17% from initial price for $1.27T valuation in first day of trading Yahoo Finance Anthropic just set an IPO record nobody\u2019s bragging about: $20 billion left on the table Fortune Almost all of Anthropic\u2019s employees are now millionaires CNN Asian shares head for worst week since 2020 as AI rout deepens Reuters How Much Anthropic Are You About to Own? The New York Times", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 01:30 PM IST", "pub_date_relative": "42m ago"}, {"title": "Urban Company shares dip 4% after \u20b92,500 crore fundraising; opportunity to buy on the dip? Target, stop-loss", "full_content": "Dhanya Nagasundaram Published 20 Nov 2026, 01:29 PM IST Prefer Livemint on Google Urban Company shares declined over 4% on Friday, 20 November, even as the home services platform announced the successful completion of its \u20b9 2,500 crore qualified institutional placement (QIP), which attracted bids worth more than \u20b9 15,000 crore.\n\nThe fundraise, which received demand of over six times the issue size, drew participation from more than 60 investors. The company said the proceeds would be used to strengthen the supply ecosystem for its InstaHelp platform, expand marketing initiatives, invest in technology and training infrastructure, and explore potential acquisitions.\n\nIn a regulatory filing, Urban Company said its QIP opened on 16 November and closed on 19 November 2026. The board's fundraising committee approved the allotment of 16,02,56,410 equity shares, each with a face value of \u20b9 1, at an issue price of \u20b9 156 per share on 19 November.\n\nThe issue price was fixed at a 3.1% discount to the floor price of \u20b9 161.03 per share, determined in accordance with Chapter VI of the SEBI (Issue of Capital and Disclosure Requirements) Regulations, 2018.\n\nThe placement saw participation from a diverse pool of institutional investors. Of the total shares allotted, mutual funds received more than 50% of the issue, with allocations spread across 13 fund houses.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:29 PM IST", "pub_date_relative": "43m ago"}, {"title": "FM Sitharaman holds eighth pre-Budget consultation with labour, employment sector stakeholders", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a FM Sitharaman holds eighth pre-Budget consultation with labour, employment sector stakeholders The Economic Times daily newspaper is available online now. Read Today's Paper FM Sitharaman holds eighth pre-Budget consultation with labour, employment sector stakeholders SECTIONS FM Sitharaman holds eighth pre-Budget consultation with labour, employment sector stakeholders ANI Last Updated: Nov 20, 2026, 01:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Finance Minister Nirmala Sitharaman chaired the eighth pre-Budget consultation with employment and labour sector stakeholders on Friday, seeking inputs for the Union Budget 2027-28. The meeting follows consultations with infrastructure, energy, IT, banking and other sectors as the government prepares its annual Budget, scheduled to be presented on February 1, 2027.\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Nov 2026, 01:17 PM IST", "pub_date_relative": "55m ago"}, {"title": "Gold price crash today: Rates below \u20b91.25 lakh/10 gm on MCX | 3 reasons why? \u20b91 lakh or \u20b91.5 lakh - What's next?", "full_content": "Gold, silver prices : Gold prices have witnessed a sharp correction, with the precious metal heading for its worst weekly performance in eight months as a stronger US dollar, rising bond yields and hawkish signals from Federal Reserve triggered selling across the bullion market.\n\nOn the Multi Commodity Exchange (MCX), gold futures for December delivery fell 3.84%, or \u20b9 4,891, to \u20b9 1,22,561 per 10 grams, compared with the previous close of \u20b9 1,27,452. The yellow metal touched its lowest level since August 2025.\n\nSilver futures for December delivery dropped 5.99%, or \u20b9 9,432, to \u20b9 1,48,050 per kg, against the previous close of \u20b9 1,57,482. The white metal hit its lowest level since September 2025.\n\nMeanwhile, in the international market, spot gold dropped 2.7% to $3,525.25 per ounce and was down around 9.2% for the week, marking its steepest weekly decline since March 20.\n\nExpectations of tighter US monetary policy have weighed on precious metals after Federal Reserve officials signalled that further interest-rate hikes could be considered to contain persistent inflation .\n\nChicago Federal Reserve President Austan Goolsbee said on Thursday that he would consider all options to tackle persistent US inflation. His comments echoed signals from other central bank officials who have kept the possibility of further rate increases on the table.\n\nThe prospect of higher interest rates has dampened demand for gold, which does not offer any interest income. As a result, investors tend to favour interest-bearing assets when borrowing costs and yields rise.\n\nExpectations of tighter monetary policy have also kept US Treasury yields elevated, adding to the pressure on precious metals.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Can Physicswallah deliver on its ambitious growth blueprint?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nPhysicswallah Ltd\u2019s first Investor Day appears to have given investors what they were looking for. The stock gained 6% on Thursday, taking its 2026 return into positive territory, as management outlined its future growth plans.\n\nThe company is targeting revenue of \u20b9 9,000-10,000 crore by FY30, up from \u20b9 3,900 crore in FY26. This implies annual growth of about 25% over FY27-30. It also aims for Ebitda margins of over 20%, compared with 7.7% in FY26. The common theme underpinning its growth blueprint is a conscious shift from aggressive expansion towards better utilization of existing assets, deeper monetization of its online platform and capital-efficient growth.\n\nPhysicswallah\u2019s online business is a profitable growth engine. Online revenue grew 29.3% year-on-year to \u20b9 1,242 crore in H1FY27. The offline business grew at a much slower 11.6% to \u20b9 1,031 crore. Importantly, offline operations logged a pre-Ind AS Ebitda loss of \u20b9 108 crore, against a profit of \u20b9 187 crore for the online business.\n\nOnline education remains underpenetrated in India, with 20% penetration in flagship categories such as JEE and NEET, but less than 1% in newer segments. Management plans to expand beyond JEE and NEET preparation into K-12 , foundation courses, state boards, vernacular education, skilling and postgraduate test preparation.\n\nPre-foundation enrolments have already grown around 50% annually over the past two years. State-board enrolments are targeted to reach 1 million by FY28, up from 3.5 lakh in FY26. The aim is to increase student lifetime value rather than rely on just a couple of examination cycles.\n\nWith deeper digital penetration, the company\u2019s distribution advantage, built on 170 million social-media followers and 4.1 million daily app users, should help amplify growth.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Urban Company Raises Rs 2,500 Crore Via QIP; Draws Over Rs 15,000 Crore Demand", "full_content": "Domestic insurers such as HDFC Life, Bajaj Life Insurance and Edelweiss Life, as well as domestic institutional investor Premji Invest, also participated in the placement.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 01:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "On top lane! Highway Infrastructure shares on cusp of breakout after rising 55% in one month; should you buy? Target, SL", "full_content": "Asit Manohar Published 20 Nov 2026, 01:04 PM IST Prefer Livemint on Google Stock to buy | Share to buy: Shares of Highway Infrastructure Ltd have been on top lane for the last six months. Highway Infrastructure shares have risen from \u20b9 54.32 to \u20b9 85 per share in one month, logging more than 56% rise in this time. In the last six months, the small-cap stock under \u20b9 100 has rallied from \u20b9 47.50 to \u20b9 85, delivering more than 75% returns to its shareholders, who remained invested in this infra stock throughout this period.\n\nHighway Infrastructure share price today opened lower at \u20b9 83.80 per share on the NSE, but soon gathered momentum and climbed to a new 52-week high of \u20b9 85. According to stock market experts, Highway Infrastructure shares have given a technical breakout at \u20b9 79 and it is on the cusp of giving another technical breakout at \u20b9 88. They said that strong order book and fresh receipt of orders are the major reason for the continuous rally in Highway Infrastructure shares. After the fresh breakout, we can expect the stock to toucn \u20b9 95 soon, experts said.\n\nSpeaking on the reasons that are fueling Highway Infrastructure shares, Anuj Gupta, a SEBI-registered market expert, said, \u201cThe stock is looking strong from both fundamental and technical perspective. The stock is rising after the recent receipt of fresh orders and a strong order book of the company. The company has received three projects in one day, which amounts to around \u20b9 630 crore. The company recently acquired 51% controling stake in Indore-based real estate company.\u201d\n\nDecoding the technical chart pattern of Highway Infrastructure shares, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cThe stock has receintly given a trechnical breakout at \u20b9 79, and it is looking positive on the technial chart pattern. The stock is on the cusp of giving a fresh breakout at \u20b9 88.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Indian finance hub eyes dual share model to kickstart public offers: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Indian finance hub eyes dual share model to kickstart public offers: Report The Economic Times daily newspaper is available online now. Read Today's Paper Indian finance hub eyes dual share model to kickstart public offers: Report SECTIONS Indian finance hub eyes dual share model to kickstart public offers: Report Reuters Last Updated: Nov 20, 2026, 01:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian regulators are currently assessing a new proposal that would allow companies to introduce dual-class shares for listings in both domestic markets and GIFT City. This initiative seeks to invigorate equity market activity in GIFT City, which has faced challenges regarding limited primary market participation. One class of shares would be traded in rupees, while the other would be dollar-denominated, granting foreign investors easier access alongside reduced tax implications.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Nov 2026, 01:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "IPO GMP race: Mahanadi Coalfields vs Crystal Crop Protection vs Watrana Rentals - Check grey market winner | Key dates", "full_content": "With three IPOs currently open for subscription, investor attention is gradually shifting towards their potential listing-day performance. One of the key indicators investors tracks to gauge the likely debut of a public issue is the grey market premium (GMP), which offers an early indication of the demand for shares ahead of their stock market listing.\n\nWhile the subscription process is still open for all of the issues, investors are closely tracking their respective GMPs to assess potential listing gains.\n\nAlthough the GMP provides an indication of the likely listing price, it does not guarantee the actual listing price, as it fluctuates daily depending on market sentiment and demand. Moreover, the grey market is unofficial and unregulated, and the GMP should be viewed only as an early indicator rather than the sole basis for investment decisions.\n\nAmong the three IPOs, Watrana Rentals is commanding the highest GMP at \u20b9 67 per share, indicating a potential listing premium of 27.35% over its upper issue price of \u20b9 245 per share.\n\nMeanwhile, Crystal Crop Protection is trading at a GMP of \u20b9 17 per share, suggesting a potential listing premium of 6.25% over its upper issue price of \u20b9 272 per share.\n\nMahanadi Coalfields is indicating a relatively muted debut, with its GMP standing at \u20b9 2 per share, implying a potential listing premium of 1.47% over its upper issue price of \u20b9 136 per share.\n\nWatrana Rentals Ltd, a provider of material handling equipment (MHE) and aerial work platform (AWP) rental solutions, received a strong response from investors, with its IPO fully subscribed on the opening day on Thursday. The issue attracted subscriptions of 7.13 times the shares on offer.\n\nThe non-institutional investors (NII) portion was oversubscribed 11 times, while the retail investors' portion was subscribed 9.58 times. The qualified institutional buyers (QIB) segment has not yet opened for bidding.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tech stocks fall as Anthropic IPO fails to reignite AI trade", "full_content": "Markets in Europe and Asia follow Wall Street lower despite Claude AI maker\u2019s record listing", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "From wrapping rotis to storing \u20b910\u2013 \u20b9500 notes: How aluminium foil can help you preserve emergency cash at home", "full_content": "Just as you wrap rotis in aluminium foil for your office tiffin, a habit our mothers have followed while packing our school lunches for years, this everyday kitchen essential can also come in handy when storing cash set aside for emergencies.\n\nKeeping some money at home can be useful when you need immediate access to funds for an unexpected expense, particularly when digital payment services are temporarily unavailable.\n\nFor instance, a household may set aside \u20b9 5,000, \u20b9 10,000, or more as an emergency fund . Keeping this money wrapped and stored separately can also reduce the temptation to dip into it for non-essential purchases or impulsive spending, ensuring it remains available when an actual emergency arises.\n\nAluminium foil is made primarily of aluminium, with small quantities of other metals, such as iron, silicon and magnesium, added depending on its grade. When exposed to oxygen in the air, aluminium naturally develops a thin protective coating of aluminium oxide (Al\u2082O\u2083) on its surface, which helps prevent the metal from corroding.\n\nIndian currency notes, meanwhile, are made from cotton-based paper rather than ordinary wood-pulp paper. This gives them the strength and durability needed to withstand regular handling.\n\nWhen currency notes are wrapped in aluminium foil, the covering can act as an additional barrier against dust and moisture, provided it is properly folded and sealed.\n\nAluminium foil acts as a moisture barrier and limits exposure of currency notes to dust and other external contaminants. This makes it an additional protective layer for people who prefer to keep some cash at home for several months or longer.\n\nAnother advantage is discreet storage. Keeping foil-wrapped cash in a designated household space, such as a kitchen cabinet, may make it less noticeable than storing currency notes in an obvious cash box or locker, particularly in the event of a theft or burglary.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pristine Logistics & Infraprojects Gets SEBI's Nod To Float IPO", "full_content": "Its operations are centred on long-haul rail transportation, supported by first- and last-mile road connectivity and a network of strategically located logistics terminals across domestic and export-import (EXIM) corridors.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Did Ramayana Producer Namit Malhotra Lost 90% Of His Wealth During The Financial Crisis In 2008?", "full_content": "Namit Malhotra, the producer of Ranbir Kapoor, Sai Pallavi and Yash-starrer Ramayana, once lost nearly 90% of his wealth during the 2008 financial crisis. Today, his estimated net worth stands at over Rs 9,204 crore.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "SoftBank suffers worst day in over two years as AI sell-off hits Asian tech stocks", "full_content": "Shares in Japan's SoftBank Group closed 14.48% lower on Friday, marking their worst day since August 2024, as a broader sell-off swept through Asian technology stocks following the highly anticipated market debut of artificial intelligence startup Anthropic .\n\nThe sharp decline underscores growing investor concerns over SoftBank's aggressive bets on artificial intelligence, particularly its exposure to OpenAI, as markets question whether massive investments in AI infrastructure will generate sufficient returns.\n\nThe group is one of the biggest backers of OpenAI, Anthropic's rival, having invested a total of $64.6 billion in the ChatGPT maker.\n\nShares of SoftBank on 20 Nov. SoftBank's heavy exposure to OpenAI as well as its ownership of chip designer Arm has made its shares particularly sensitive to shifts in sentiment toward the AI sector. The stock lost 30% in October and is down 31% so far this month.\n\nJapanese semiconductor stocks also tumbled, with Tokyo Electron closing 7.06% lower, Lasertec shedding 9.21% and Renesas Electronics losing 7.02%.\n\nThe sell-off extended to South Korea, where Nvidia suppliers SK Hynix and Samsung Electronics fell 5.92% and 7.01%, respectively, pressuring the benchmark Kospi, which ended 5.21% lower.\n\nElsewhere in the region, Taiwan Semiconductor Manufacturing Co , or TSMC, closed 4.76% lower in Taiwan.\n\nAs of the last hour of trading, Chinese tech giant Tencent was down 2.01%, while memory chipmaker CXMT fell 5.31% to a fresh record low, while Baidu dropped 4.79%. AI chipmaker Enflame , dubbed as one of China's \" four little dragons \" fell 7.16%.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 12:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank Of Baroda Manager Arrested For Seeking Rs 9 Lakh To Sanction Rs 1.8 Crore Loan", "full_content": "The accused demanded a bribe of 5% of a proposed Rs 1.8 crore loan amount, or about Rs 9 lakh, in return for securing its sanction and disbursal.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "India\u2019s \u2018no AI play\u2019 remains a bother for fund managers even as foreign investors return", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nForeign portfolio investors\u2019 (FPI) interest in Indian equities is reigniting. After two consecutive months of heavy selling, foreign investors bought Indian equities worth over \u20b9 1 trillion so far in November, data from NSDL showed.\n\nThere seems to be a loss of conviction in the artificial intelligence (AI) theme globally, which may be prompting a rotation of foreign funds into India, a market previously shunned for its limited AI exposure. Stocks of AI-focused companies in the US and Asia have corrected amid rising concerns over potential regulation of AI-related spending in the US and a lack of visibility on the revenue-generating potential of AI projects.\n\nDespite this, the absence of an AI play remains a key concern for Indian equities, according to the latest Asia Fund Managers Survey by BofA Securities. About 29% of those surveyed saw the dearth of direct AI-linked investment opportunities in India as a dampener. This was followed by a lack of reforms (19%), depreciation of the Indian rupee (14%) and high valuations of Indian equities (10%).\n\nThe October BofA Asia Fund Manager Survey had shown that 15% of respondents were worried about weak growth. However, this concern did not feature in the November list, even as downside risks to economic growth are mounting.\n\nIndia\u2019s gross domestic product (GDP) growth data for the July-September quarter (Q2FY27) is due later this month. Given the adverse impact of the West Asia war and El Ni\u00f1o conditions, Bank of Baroda estimates growth to moderate to 7.4% from 8.1% in Q2FY26.\n\nAmong key components, the agriculture and trade and services sectors are expected to face headwinds amid a deficient south-west monsoon, which could affect the early harvest. The main kharif harvest takes place in Q3, it added.\n\nThe repercussions of the West Asia war and El Ni\u00f1o have started pushing retail inflation higher.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why Stock Market Is Rising Today? Sensex Rebounds 1,300 Points From Day's Low; Nifty Above 25,700 | Three Reasons Explained", "full_content": "The recovery in domestic equities was led by strong buying in IT and banking stocks, while selling pressure in metal, pharmaceutical and energy stocks capped the upside.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Talking Points This Week: Nvidia's Exit, Anthropic's Test and Money Returning Home", "full_content": "From Nvidia's leadership shake-up and Anthropic's IPO to returning FII flows and Asia's shifting growth outlook, markets are reassessing where the next leg of returns will come from, Niraj Shah writes.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018More than just a game\u2019: How GTA VI\u2019s blockbuster launch fuels a booming content economy", "full_content": "Grand Theft Auto VI has exploded out of the gate after a 13-year wait, drawing millions of buyers while fueling a parallel economy of livestreams, clips and other content built around people watching the game as much as playing it.\n\nGTA VI has delivered a blockbuster debut , with about 19.1 million copies sold \u2014 including preorders \u2014 by Thursday morning, representing roughly $1.84 billion in sales, according to Sensor Tower. The GTA franchise itself has sold more than 470 million units worldwide.\n\nTake-Two Interactive , which owns the studio behind the game, has not yet disclosed a profit figure for the title.\n\nRoss Gerber, president and CEO of Gerber Kawasaki Wealth & Investment Management, told CNBC's \"Squawk Box Asia\" that he sees further upside for Take-Two, which his firm holds in its portfolio.\n\n\"It's crazy good. I've never seen anything like it,\" Gerber said, hailing the title as \"more than just a game\" and pointing to the franchise's potential to expand into film and television.\n\nBut that launch is also spawning a second economy around the enormous global hype and demand for GTA VI content.\n\nViewers watched 125.5 million hours of the title's content in its first 24 hours across platforms including Twitch, YouTube and Kick, according to Streams Charts.\n\nYouTube creator Darren \" IShowSpeed \" Watkins Jr. led streamers with 4.47 million hours viewed across YouTube and Twitch. Separately, Twitch tracker CastAccord recorded about two million hours watched over roughly 36 hours of streamer Kai Cenat 's launch broadcast.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 12:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "PC Jeweller, Kalyan Jewellers to Senco Gold: Jewellery stocks fall 5% as gold prices slips below \u20b91.25 lakh;buy or sell?", "full_content": "SENCO Dhanya Nagasundaram Published 20 Nov 2026, 12:37 PM IST Prefer Livemint on Google Jewellery stocks came under pressure on Friday, 20 November, as a sharp correction in gold prices weighed on investor sentiment. PC Jeweller share price fell nearly 5%, Kalyan Jewellers slumped around 7%, while Senco Gold declined about 2%, tracking the weakness in bullion prices.\n\nOn the Multi Commodity Exchange (MCX), gold prices slipped below the crucial \u20b9 1.25 lakh-per-10-gram mark. MCX gold opened sharply lower at \u20b9 1,23,629 and extended losses to hit an intraday low of \u20b9 1,21,424, reflecting the sharp selloff in the precious metal.\n\nThe weakness in domestic bullion prices mirrored a broader global selloff. International gold prices fell for a fifth consecutive session on Friday, putting the metal on course for its steepest weekly decline since March. Spot gold dropped 1.9% to $3,551.68 per ounce by 0257 GMT, after touching its lowest level since September 2025 earlier in the session. Bullion was down nearly 8.9% for the week, its sharpest weekly fall since the week of 20 March. US gold futures for December delivery declined 3.6% to $3,551.90, Reuters reported.\n\nThe pressure on gold has intensified amid growing expectations of further US interest-rate hikes, with the Federal Reserve signalling a hawkish stance against the backdrop of persistent inflation.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Sensex Jumps 600 Points, Nifty 50 Hits 25,700, Bank Nifty Above 64,000 For First Time", "full_content": "Nifty IT emerged as the top gainer with over 2% rally, followed by Nifty Realty, Nifty Private Bank and Nifty Auto indices. Selling was seen in Nifty Metals, Nifty PSU Bank, Nifty Oil & Gas, Nifty Pharma and Nifty FMCG indices.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "iPhone Users In USA And Canada Targeted, 17 From Fake Gurugram Call Centre Arrested", "full_content": "Police arrested 17 people in Gurugram for running a fake call centre targeting Apple users in the US and Canada with cyber fraud.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "India A vs Nepal Live Streaming: When And Where To Watch Rising Stars Asia Cup On TV, Online?", "full_content": "India A face Nepal in the Rising Stars Asia Cup 2026 on November 20. Check match timings, full squads, TV telecast and online live streaming details.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, silver ETFs crash up to 7.5%: Why the bullion sell-off is deepening on Fed rate-hike fears", "full_content": "The gold and silver exchange-traded funds (ETFs) came under heavy selling pressure in trading today, 20 November, with several prominent schemes declining between 5% and 7.5%. The decline followed a sharp correction in international bullion prices as expectations of further US Federal Reserve rate hikes weighed on precious metals.\n\nSilver ETFs, on the other hand, recorded steeper losses than gold ETFs, whereas international gold prices headed towards their biggest weekly decline since March. The sell-off also dragged domestic gold and silver futures sharply on the MCX in early trading today.\n\nSubsequently, MCX gold futures prices slumped 3.91% lower at \u20b9 1,23,120 per 10 grams, while MCX silver futures crashed by around 6.06% to \u20b9 1,48,730 per kg in early trading today.\n\nSilver ETFs suffered the most amid today's brutal sell-off, with the Nippon India Silver ETF declining by 7.47%. SBI Silver ETF, ICICI Prudential Silver ETF, and Tata Silver ETF also registered losses exceeding 7%.\n\nGold ETFs were also not spared, with several schemes falling more than 5%. Keeping in view the weak market sentiment in the bullion market:\n\nGold prices dropped for a 5th consecutive session today in the international market, declining 2.3% to $3,543.19 per ounce at about 10:20 am Singapore time. The yellow metal was on track to lose nearly 9% during the week, marking its steepest weekly rout since March. Silver prices also corrected by 2.3% to $41.98 per ounce, taking their weekly losses to around 14%.\n\nThe core reason behind these significant losses has been the growing expectation of further US interest rate hikes amid persistently high and sticky inflation.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Who is Roaring Kitty? The man behind GameStop's meme rally", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Who is Roaring Kitty? The man behind GameStop's meme rally Written by Anupam Nagar , ETMarkets.com | Nov 20, 2026, 12:58:39 PM IST 1 / 6 Roaring Kitty's surprise return sends GameStop shares higher GameStop shares gain after Keith Gill, popularly known as Roaring Kitty, makes his first social media post in nearly two years. Gill shares a mysterious image of Cat Mario on X on Thursday, November 19, sending GameStop stock higher by around 3% and drawing fresh attention from retail investors. His return revives memories of the 2021 meme-stock rally. (Sources: Yahoo Finance, Barron's)\n\nKeith Gill became a prominent figure in the GameStop meme-stock frenzy of 2020-21. His bullish commentary and online posts helped attract retail investors to the company's shares, triggering a historic buying frenzy and a short squeeze that put pressure on hedge funds betting against the stock. His latest post comes after an extended social media absence, with his previous post dating back to January 2025.\n\nGill's latest post features Cat Mario, a power-up character from Nintendo's Super Mario 3D World. The image carries no caption or explanation, leaving investors guessing about its significance. The mysterious post coincides with the launch of Grand Theft Auto VI, adding to the excitement around gaming stocks and raising speculation about whether Gill's return could reignite retail interest in GameStop.\n\nThe launch of Grand Theft Auto VI is generating significant excitement across the gaming industry. The blockbuster release could bring more customers to GameStop stores for gaming consoles and accessories.", "source": "Economic Times Markets", "pub_date_str": "20 Nov 2026, 12:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Hindustan Zinc vs Tata Steel vs JSW Steel: Which metal stock to buy amid big fall in the metal stocks | Targets", "full_content": "TATASTEEL JSWSTEEL Pranati Deva Published 20 Nov 2026, 12:15 PM IST Prefer Livemint on Google Metal stocks to buy : Indian metal stocks witnessed heavy selling on Friday, November 20, with the Nifty Metal index falling nearly 3% intraday as a stronger US dollar and a sharp correction in global base metal prices weighed on investor sentiment. With 14 of the 15 index constituents trading in the red, investors are assessing whether the correction offers a buying opportunity in stocks such as Hindustan Zinc , Tata Steel and JSW Steel .\n\nWhile all three companies reported strong year-on-year earnings growth in Q2FY27, their technical structures differ considerably. Mayank Jain, Market Analyst at PhonePe Invest, and Deepesh Sarawagi, Technical Research Analyst at Choice Broking, favour JSW Steel over the other two counters based on its stronger technical positioning.\n\nThe Nifty Metal index declined around 2.59% intraday to 11,980. APL Apollo Tubes led the losses, falling over 5% to \u20b9 2,040, while Vedanta Aluminium Metal and Tata Steel declined around 3% each. Hindustan Zinc, JSW Steel, Hindustan Copper and SAIL dropped between 1.5% and 2%.\n\nHindustan Zinc has lost 3% in one month and 7% in six months, although it remains up 10% over one year. Tata Steel gained 2% in one month but declined 3% in three months and 14% in six months. It is up 3% over one year. JSW Steel outperformed, gaining 6% in one month, 1% in three months, 3% in six months and 12% in one year.\n\nTheir Q2FY27 financial performances were strong. JSW Steel reported revenue of \u20b9 54,486 crore, up 20.67% year-on-year, while EBITDA increased 42.23% to \u20b9 10,120 crore. Net profit surged 225.58% to \u20b9 5,359 crore.\n\nTata Steel reported revenue of \u20b9 65,436.24 crore, up 11.5%, and EBITDA of \u20b9 10,665 crore, an increase of 17.1%. Consolidated net profit rose 16.2% to \u20b9 3,699.59 crore.\n\nHindustan Zinc reported its highest-ever quarterly revenue of \u20b9 15,093 crore, up 76.5%.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty Bank Crosses New Milestone With 15% November Rally. Is The Rally Just Getting Started?", "full_content": "The banking index has outperformed the Nifty this month, with public sector and private lenders contributing to the gains.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:12 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold prices near \u20b91.2 lakh, down 32% from peak: 3 in 4 years ended with positive returns since 1980. Will 2026 follow?", "full_content": "Gold prices have declined in 2026 amid a stronger US dollar, uncertainty over the US Federal Reserve 's interest-rate outlook and heightened selling pressure in global bullion markets.\n\nGold prices in the Indian market stood at \u20b9 1.22 lakh per 10 grams on 20 November, down nearly 32% from their January 2026 peak of around \u20b9 1.80 lakh, according to bullions.co.in .\n\nHowever, sharp corrections are not unusual for gold. FundsIndia's November 2026 Wealth Conversations report found that gold witnessed temporary declines of 10-15% almost every year since 1980. Yet, it ended the calendar year with positive returns 78% of the time, despite these intra-year corrections.\n\nAn intra-year drawdown measures the maximum decline in gold prices from an earlier peak within a given year. Calendar-year returns, on the other hand, capture the overall price change between the beginning and end of that year.\n\n*Source: FundsIndia Wealth Conversations Report \u2013 November 2026\n\nThe data show that a sharp temporary correction does not automatically mean gold will deliver negative returns for the year. For instance, in 2008, gold fell 20% during the year but eventually delivered a 29% calendar-year return. Similarly, in 2020, despite a 15% drawdown, it ended the year with a 28% gain.\n\nHowever, the pattern is not guaranteed. In 2013, a 24% drawdown was accompanied by an 18% annual loss.\n\nIn 2025, yellow metal witnessed an intra-year drawdown of 8% but still delivered the highest calendar-year return of 76%. In 2026, gold has already witnessed a 25% correction and was down 5% on a calendar-year basis as of 31 October.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 12:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "Dhanush Says Sons Yatra And Linga Will Be '10 Times Bigger' Than Him, Reveals What Motivates Him", "full_content": "Dhanush recently opened up about how his sons motivate him and why making them proud is one of his biggest priorities.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "A bubble in . . . defensive stocks?", "full_content": "Plus, crypto and desperation", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 12:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Crude Oil Volatility To Stay High, Citi Says; Diesel Cracks Key For Refiners", "full_content": "The analyst said refining margins had remained strong, although some moderation was visible in gasoline cracks. Diesel cracks had held up better.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 12:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Regulation Alone Cannot Ensure Good Corporate Governance, Says SEBI Chairman Tuhin Kanta Pandey", "full_content": "Pandey says boards, auditors and other governance gatekeepers must exercise independent judgement, as SEBI seeks to balance tighter oversight with simpler compliance.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 11:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "India's wheat area set for steepest decline in 26 years as farmers switch crops", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a India's wheat area set for steepest decline in 26 years as farmers switch crops The Economic Times daily newspaper is available online now. Read Today's Paper India's wheat area set for steepest decline in 26 years as farmers switch crops SECTIONS India's wheat area set for steepest decline in 26 years as farmers switch crops Reuters Last Updated: Nov 20, 2026, 11:54:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India is experiencing its most severe decline in wheat acreage in 26 years due to insufficient monsoon rains. Farmers are shifting to less water-intensive crops like chickpeas and rapeseed, which promise better returns. The government's minimal increase in wheat procurement prices has also discouraged wheat planting among farmers. As a result, wheat acreage is expected to drop to its lowest level in four years.\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Nov 2026, 11:54 AM IST", "pub_date_relative": "2h ago"}, {"title": "Domestic Investors Helped Cushion Record FPI Outflows, Says SEBI's Whole-Time Director KVR Murty", "full_content": "Murty says retail and domestic institutional investors helped offset foreign selling as India's equity market capitalisation crossed $5 trillion.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 11:52 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Christine Lagarde: Acting in time", "full_content": "It is a pleasure to be back at this congress. This is the eighth time I have spoken here as President of the ECB, and it will sadly be the last.\n\nIn preparing for today, I reread those speeches. The topics have varied, from growth and inflation to capital markets and the Single Market.\n\nBut one concern runs through all of them: how to make Europe stronger, so that its prosperity is driven by its own strengths and less exposed to decisions taken elsewhere.\n\nFor many years, the challenges we discussed here were old ones. We had fallen short of our ambitions for the Single Market. Our growth relied too heavily on external demand for an economy of our size, and our competitiveness was slowly eroding.\n\nThose challenges have not gone away. But in recent years, new ones have been layered on top. Dependencies that we once saw as a normal part of an open economy, from critical raw materials to technology, can now be used against us. That has made economic sovereignty a challenge in its own right.\n\nThe old challenges and the new ones have something in common.\n\nFive centuries ago, Machiavelli compared the problems of states to a fever that, at the start, is \u201ceasy to cure but difficult to detect\u201d and, in time, becomes \u201ceasy to detect but difficult to cure\u201d.\n\nBoth kinds of challenge are of this sort. By the time everyone can see the need to act, the best time to act has usually passed.", "source": "ECB Press", "pub_date_str": "20 Nov 2026, 02:00 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FTSE 100 today: Stocks fall on tech, metals rout despite UK retail beat", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:54 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nasdaq futures fall after Anthropic fails to lift market sentiment: Live updates", "full_content": "Stock futures pulled back early Friday, following a horrid session on Wall Street as the much-anticipated Anthropic public market debut failed to boost the artificial intelligence trade.\n\nS&P 500 futures slipped 0.57%, and Nasdaq-100 futures shed 1.08%. Dow Jones Industrial Average futures fell 0.23%.\n\nIn Asia, major indexes tumbled on Friday. Japan's Nikkei 225 plunged 5.06% to close at 56,436.65. South Korea's Kospi sank 5.21% to close at 4,869.96. Mainland China's CSI 300 slipped 0.76% to 3,954.57, while Hong Kong's Hang Seng Index was down 2.24% in its final hour of trading. Australia's S&P/ASX 200 closed at 8,592.6.\n\nThe major U.S. averages fell more than 2% each in regular trading, with the Dow closing below the key 50,000 level for the first time since June.\n\nThose steep declines came despite a strong start to the session. The Nasdaq Composite at one point traded 2.1% higher, and the S&P 500 was up as much as 1.3% on the day, as traders braced for Anthropic's first trade. But almost immediately after the Claude AI company began trading, stocks tumbled \u2014 adding to this week's already sharp losses.\n\nWeek to date, the Dow has fallen 6.2%, putting it on pace for its worst weekly performance since April 2025. The S&P 500 and Nasdaq are down 5% each, also headed for their largest one-week pullbacks in more than a year.\n\nYet, Deutsche Bank strategist Binky Chadha thinks the market is now \"very oversold,\" as growth and earnings remain strong.\n\n\"The broader market, whether you look at positioning, whether you look at valuation .. we are sort of completely washed out,\" he told CNBC's \" Closing Bell: Overtime .\" \"It all started with a big rotation out of tech. \u2026 As the cycle has happened, we've unfortunately also gotten a lot of negative catalysts.\"", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:48 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SBI alerts pensioners to fake PPO update messages; warns against clicking suspicious links and sharing personal details", "full_content": "The State Bank of India (SBI) warned pensioners about a rapidly evolving cyber fraud tactic in which fraudsters impersonate pension officials, build trust and send fake messages urging them to share personal information under the pretext of updating their \u2018Pension Payment Orders\u2019 (PPOs).\n\nIn a post on its official X handle on 18 November, SBI shared how fraudsters may target and exploit pensioners\u2019 concerns about their pension payments, taking advantage of their advancing age to trick them into clicking suspicious links and sharing confidential information.\n\nThe banking institution elaborated upon the warning through its cyber safety campaign featuring 'Captain Y \u2013 Your Cyber Rakshak'.\n\n\"Cyber fraudsters may impersonate pension officials and send fake messages with suspicious links, urging individuals to share their personal details for Pension Payment Order (PPO) updation.\"\n\n\u201cBut don\u2019t worry! Captain Y \u2013 Your Cyber Rakshak from SBI \u2013 is here to guide you and remind you: Never click on suspicious links or share your personal information with anyone. Before you act, Hamesha Poochho Why? Stay alert. Stay safe!\u201d\n\nThe post also includes a detailed 1-minute 34-second video that explains exactly how the scam works, urging pensioners to be vigilant and to keep their personal data, OTPs, ATM PIN details and other critical information safe.\n\nThe message illustrates a common engineering tactic utilized by scamsters posing as government or banking officials to create urgency and persuade unsuspecting individuals to discuss and disclose confidential information.\n\nThis warning from SBI highlights that pensioners should be extremely cautious and vigilant about unsolicited SMS messages, WhatsApp communications, phone calls or emails claiming that their PPO details need urgent updating.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 01:45 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Earnings call transcript: Paxman posts strong Q3 2026 growth as stock slips", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 01:42 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Working in Maharashtra? Check latest wage rules on 48-hour workweek, double overtime pay, salary deduction cap and more", "full_content": "Employees working in Maharashtra will have a defined framework for working hours, weekly rest, overtime payments, and wage deductions under the Maharashtra Wage Rules, 2026.\n\nThe state's Labour Department notified the rules on 5 November 2026. The rules came into force on the same day, upon publication in the Official Gazette.\n\nFor salaried employees, the provisions are relevant to working schedules and take-home pay. They prescribe a maximum 48-hour working week for employees whose wage period is not calculated daily, provide for additional payment when employees work on weekly rest days under specified conditions, and cap permissible wage deductions.\n\nThe rules extend across Maharashtra and replace the state's Minimum Wages Rules, 1963, and Payment of Wages Rules, 1963.\n\nThe notification states that the rules extend to the entire state of Maharashtra. It refers to employees across different wage-period arrangements.\n\nHowever, there is an important distinction for government employees. Rule 3 expressly states that the state government will not fix minimum wage rates for Maharashtra government employees under this Code.\n\nThis exclusion relates to minimum- wage fixation; the notification does not establish a blanket exemption for every other provision for all government employees.\n\nUnder Rule 5, an employee whose wage period is calculated daily will have a normal working day of eight hours. For employees paid on a basis other than daily wages, the total weekly working hours cannot exceed 48.", "source": "LiveMint Money", "pub_date_str": "20 Nov 2026, 01:40 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold price crash: Muthoot Finance, Manappuram shares lose sheen, down up to 5% | Is gold heading for deeper correction?", "full_content": "MUTHOOTFIN A Ksheerasagar Published 20 Nov 2026, 01:39 PM IST Prefer Livemint on Google Gold loan NBFC stocks witnessed renewed selling pressure in Friday's trade, November 20, as the sell-off in gold prices showed no signs of easing. The yellow metal fell to its lowest level in a year amid rising expectations of an interest rate hike by the US Federal Reserve.\n\nShares of Manappuram Finance dropped 5% to \u20b9 270 apiece, hitting their lowest level since April, while its peer Muthoot Finance tumbled 3% to touch an intraday low of \u20b9 2,480 apiece.\n\nThese stocks, which emerged among the top performers in 2025 on the back of a record-breaking rally in gold prices, are now caught in a bearish phase and struggling to regain momentum amid a sharp reversal in the bullion rally.\n\nMCX gold futures dropped another \u20b9 6,028 per 10 grams to hit a one-year low of \u20b9 1,21,424 per 10 grams. The decline was driven by a stronger US dollar and growing expectations of higher US interest rates. The metal has now lost around 10% in 2026 and retreated nearly \u20b9 60,000 from its peak of \u20b9 1,80,779 per 10 grams, based on Friday's intraday low.\n\nMCX silver futures also slipped around 5% to \u20b9 10,560 per kg, falling to their lowest level since late October 2025 during the session.\n\nBoth precious metals have come under intense selling pressure in recent sessions amid a sharp appreciation in the US dollar, making dollar-denominated commodities more expensive for holders of other currencies.\n\nThe US dollar index climbed towards 104 on Friday, reaching its strongest level since April 2025 and heading for a fourth consecutive weekly advance. An AI-driven sell-off in global equities has also boosted safe-haven demand for the greenback.\n\nIn addition, demand for the US dollar has been supported by growing expectations of an interest rate hike by the Federal Reserve at its December meeting.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:39 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic IPO live: Anthropic stock closes up 17% from initial price for $1.27T valuation in first day of trading - Yahoo Finance", "full_content": "Anthropic IPO live: Anthropic stock closes up 17% from initial price for $1.27T valuation in first day of trading Yahoo Finance Anthropic just set an IPO record nobody\u2019s bragging about: $20 billion left on the table Fortune Almost all of Anthropic\u2019s employees are now millionaires CNN Asian shares head for worst week since 2020 as AI rout deepens Reuters How Much Anthropic Are You About to Own? The New York Times", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 01:30 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Urban Company shares dip 4% after \u20b92,500 crore fundraising; opportunity to buy on the dip? Target, stop-loss", "full_content": "Dhanya Nagasundaram Published 20 Nov 2026, 01:29 PM IST Prefer Livemint on Google Urban Company shares declined over 4% on Friday, 20 November, even as the home services platform announced the successful completion of its \u20b9 2,500 crore qualified institutional placement (QIP), which attracted bids worth more than \u20b9 15,000 crore.\n\nThe fundraise, which received demand of over six times the issue size, drew participation from more than 60 investors. The company said the proceeds would be used to strengthen the supply ecosystem for its InstaHelp platform, expand marketing initiatives, invest in technology and training infrastructure, and explore potential acquisitions.\n\nIn a regulatory filing, Urban Company said its QIP opened on 16 November and closed on 19 November 2026. The board's fundraising committee approved the allotment of 16,02,56,410 equity shares, each with a face value of \u20b9 1, at an issue price of \u20b9 156 per share on 19 November.\n\nThe issue price was fixed at a 3.1% discount to the floor price of \u20b9 161.03 per share, determined in accordance with Chapter VI of the SEBI (Issue of Capital and Disclosure Requirements) Regulations, 2018.\n\nThe placement saw participation from a diverse pool of institutional investors. Of the total shares allotted, mutual funds received more than 50% of the issue, with allocations spread across 13 fund houses.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:29 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FM Sitharaman holds eighth pre-Budget consultation with labour, employment sector stakeholders", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a FM Sitharaman holds eighth pre-Budget consultation with labour, employment sector stakeholders The Economic Times daily newspaper is available online now. Read Today's Paper FM Sitharaman holds eighth pre-Budget consultation with labour, employment sector stakeholders SECTIONS FM Sitharaman holds eighth pre-Budget consultation with labour, employment sector stakeholders ANI Last Updated: Nov 20, 2026, 01:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Finance Minister Nirmala Sitharaman chaired the eighth pre-Budget consultation with employment and labour sector stakeholders on Friday, seeking inputs for the Union Budget 2027-28. The meeting follows consultations with infrastructure, energy, IT, banking and other sectors as the government prepares its annual Budget, scheduled to be presented on February 1, 2027.\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Nov 2026, 01:17 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold price crash today: Rates below \u20b91.25 lakh/10 gm on MCX | 3 reasons why? \u20b91 lakh or \u20b91.5 lakh - What's next?", "full_content": "Gold, silver prices : Gold prices have witnessed a sharp correction, with the precious metal heading for its worst weekly performance in eight months as a stronger US dollar, rising bond yields and hawkish signals from Federal Reserve triggered selling across the bullion market.\n\nOn the Multi Commodity Exchange (MCX), gold futures for December delivery fell 3.84%, or \u20b9 4,891, to \u20b9 1,22,561 per 10 grams, compared with the previous close of \u20b9 1,27,452. The yellow metal touched its lowest level since August 2025.\n\nSilver futures for December delivery dropped 5.99%, or \u20b9 9,432, to \u20b9 1,48,050 per kg, against the previous close of \u20b9 1,57,482. The white metal hit its lowest level since September 2025.\n\nMeanwhile, in the international market, spot gold dropped 2.7% to $3,525.25 per ounce and was down around 9.2% for the week, marking its steepest weekly decline since March 20.\n\nExpectations of tighter US monetary policy have weighed on precious metals after Federal Reserve officials signalled that further interest-rate hikes could be considered to contain persistent inflation .\n\nChicago Federal Reserve President Austan Goolsbee said on Thursday that he would consider all options to tackle persistent US inflation. His comments echoed signals from other central bank officials who have kept the possibility of further rate increases on the table.\n\nThe prospect of higher interest rates has dampened demand for gold, which does not offer any interest income. As a result, investors tend to favour interest-bearing assets when borrowing costs and yields rise.\n\nExpectations of tighter monetary policy have also kept US Treasury yields elevated, adding to the pressure on precious metals.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Can Physicswallah deliver on its ambitious growth blueprint?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nPhysicswallah Ltd\u2019s first Investor Day appears to have given investors what they were looking for. The stock gained 6% on Thursday, taking its 2026 return into positive territory, as management outlined its future growth plans.\n\nThe company is targeting revenue of \u20b9 9,000-10,000 crore by FY30, up from \u20b9 3,900 crore in FY26. This implies annual growth of about 25% over FY27-30. It also aims for Ebitda margins of over 20%, compared with 7.7% in FY26. The common theme underpinning its growth blueprint is a conscious shift from aggressive expansion towards better utilization of existing assets, deeper monetization of its online platform and capital-efficient growth.\n\nPhysicswallah\u2019s online business is a profitable growth engine. Online revenue grew 29.3% year-on-year to \u20b9 1,242 crore in H1FY27. The offline business grew at a much slower 11.6% to \u20b9 1,031 crore. Importantly, offline operations logged a pre-Ind AS Ebitda loss of \u20b9 108 crore, against a profit of \u20b9 187 crore for the online business.\n\nOnline education remains underpenetrated in India, with 20% penetration in flagship categories such as JEE and NEET, but less than 1% in newer segments. Management plans to expand beyond JEE and NEET preparation into K-12 , foundation courses, state boards, vernacular education, skilling and postgraduate test preparation.\n\nPre-foundation enrolments have already grown around 50% annually over the past two years. State-board enrolments are targeted to reach 1 million by FY28, up from 3.5 lakh in FY26. The aim is to increase student lifetime value rather than rely on just a couple of examination cycles.\n\nWith deeper digital penetration, the company\u2019s distribution advantage, built on 170 million social-media followers and 4.1 million daily app users, should help amplify growth.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "On top lane! Highway Infrastructure shares on cusp of breakout after rising 55% in one month; should you buy? Target, SL", "full_content": "Asit Manohar Published 20 Nov 2026, 01:04 PM IST Prefer Livemint on Google Stock to buy | Share to buy: Shares of Highway Infrastructure Ltd have been on top lane for the last six months. Highway Infrastructure shares have risen from \u20b9 54.32 to \u20b9 85 per share in one month, logging more than 56% rise in this time. In the last six months, the small-cap stock under \u20b9 100 has rallied from \u20b9 47.50 to \u20b9 85, delivering more than 75% returns to its shareholders, who remained invested in this infra stock throughout this period.\n\nHighway Infrastructure share price today opened lower at \u20b9 83.80 per share on the NSE, but soon gathered momentum and climbed to a new 52-week high of \u20b9 85. According to stock market experts, Highway Infrastructure shares have given a technical breakout at \u20b9 79 and it is on the cusp of giving another technical breakout at \u20b9 88. They said that strong order book and fresh receipt of orders are the major reason for the continuous rally in Highway Infrastructure shares. After the fresh breakout, we can expect the stock to toucn \u20b9 95 soon, experts said.\n\nSpeaking on the reasons that are fueling Highway Infrastructure shares, Anuj Gupta, a SEBI-registered market expert, said, \u201cThe stock is looking strong from both fundamental and technical perspective. The stock is rising after the recent receipt of fresh orders and a strong order book of the company. The company has received three projects in one day, which amounts to around \u20b9 630 crore. The company recently acquired 51% controling stake in Indore-based real estate company.\u201d\n\nDecoding the technical chart pattern of Highway Infrastructure shares, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cThe stock has receintly given a trechnical breakout at \u20b9 79, and it is looking positive on the technial chart pattern. The stock is on the cusp of giving a fresh breakout at \u20b9 88.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Indian finance hub eyes dual share model to kickstart public offers: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics
