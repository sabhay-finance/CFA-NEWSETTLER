Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 07:13 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks today: S&P 500, Nasdaq open higher as SK Hynix lifts chips; Fed meet in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: S&P 500, Nasdaq open higher as SK Hynix lifts chips; Fed meet in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks today: S&P 500, Nasdaq open higher as SK Hynix lifts chips; Fed meet in focus SECTIONS US stocks today: S&P 500, Nasdaq open higher as SK Hynix lifts chips; Fed meet in focus Reuters Last Updated: Oct 28, 2026, 07:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Wednesday, the S&P 500 and Nasdaq opened higher after positive results from memory-chip firms like SK Hynix. Investors are now focused on upcoming key corporate earnings, seen as a test for AI trade. Meanwhile, the Dow Jones Industrial Average experienced a slight decline of 42.1 points at the open. The S&P 500 gained 13.0 points, bolstered by positive market sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 07:09 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock market today: Dow wavers, S&P 500 and Nasdaq climb ahead of Fed decision, Big Tech earnings - Yahoo Finance", "full_content": "Stock market today: Dow wavers, S&P 500 and Nasdaq climb ahead of Fed decision, Big Tech earnings Yahoo Finance Stocks are little changed ahead of Fed decision: Live updates CNBC Stock Market Today: Stock Markets Mostly Higher Ahead of Fed Rate Decision WSJ Wall Street ends higher on revived AI momentum Reuters U.S. stocks edge higher ahead of Federal Reserve decision on interest rates Pittsburgh Post-Gazette", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 07:08 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ramky Infrastructure shares surge over 17% to \u20b9300 despite a 46% yearly fall; what explains the sharp rebound?", "full_content": "Shares of Ramky Infrastructure , the flagship company of the Ramky Group, surged 17.4% in Wednesday\u2019s trade, settling at \u20b9 300 apiece and recording their biggest single-day gain since August 2022. The sharp rally offered some relief to shareholders after the stock had been under sustained selling pressure since April.\n\nAlthough there were no major fundamental triggers behind the sharp rise in Ramky Infrastructure\u2019s share price, trading volumes witnessed a significant spike, with nearly 7 million shares changing hands on the NSE and BSE during the session. This was nearly five times the stock\u2019s average weekly trading volume, according to Trendlyne data.\n\nThe rally helped the stock recover all its October losses and turn positive, with a gain of 7.6% so far this month. If the momentum sustains through the end of October, it would mark the stock\u2019s first monthly gain after five consecutive months of losses.\n\nDespite the recent recovery, the stock remains down 46% so far in 2026, extending its decline to around 70% from its record high of \u20b9 1,009 apiece. The prolonged sell-off has weighed heavily on retail shareholders, who collectively held a 27.6% stake in the company at the end of the September quarter.\n\nLast week, Ramky Infrastructure announced that it had entered into an \u20b9 588.57 crore contract with Rail Vikas Nigam Ltd (RVNL) for the construction of residential towers comprising 670 housing units, a Type-VII bungalow, a shopping complex, a cafeteria, and associated external development and infrastructure works at the existing NMDC township in Bacheli, Chhattisgarh.\n\nThe project will be executed on an engineering, procurement, and construction (EPC) basis, with completion scheduled within 30 months from the appointed date.\n\nFor the June-ending quarter, the company had reported a 47% decline in consolidated net profit at \u20b9 39.3 crore for the quarter ended June 30, 2026.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 06:57 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Want guaranteed income in retirement without an annuity? Try laddering I bonds.", "full_content": "The new I-bond interest rate could be 5.5% or 5.4%, but that shouldn\u2019t change your strategy.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:57 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FEC campaign finance system offline days before midterms after hackers reportedly target site", "full_content": "The Federal Election Commission said Tuesday night that it identified the issue affecting its electronic filing system and was implementing a fix, after reports that a hacker or hackers had targeted the agency's systems days before the midterm elections .\n\nBut the system remained offline early Wednesday, cutting off a key window into campaign money just as late-election spending surges.\n\nAn FEC electronic filings official told campaign compliance firms Monday night that a \"bad actor\" was attempting to breach the agency's systems and that public-facing services had been shut down, according to an email obtained by Reuters . The filing system has been offline since around 10 p.m. ET Monday.\n\nThe FEC has not said who was behind the reported breach attempt, whether anyone gained access to its systems or whether any data was compromised. Previously filed reports remain searchable.\n\nThe FEC told CNBC that the agency's IT staff is working to restore the service.\n\nIn the final 20 days before an election, candidate committees must report certain contributions or loans of $1,000 or more within 48 hours , while political committees and outside groups must disclose certain spending within 24 hours .\n\nThose rules are designed to give voters a near-real-time view of the money flooding into races when it matters most.\n\nFor example, Elon Musk 's America PAC reported nearly $6.8 million in independent expenditures for communications disseminated Oct. 20, according to a CNBC analysis of FEC filings.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 06:50 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why China is desperate to ship cars outside of the country", "full_content": "To understand why China is desperate to ship cars overseas, visit a dealership in Beijing.\n\nAutumn has traditionally been the peak time to buy vehicles in the country, but this year many showrooms are empty or shut.\n\nCar salesman Li Ke said that other than the Covid-19 pandemic, the 2026 \"golden September and silver October\" season, as it's known, is the slowest he's seen in his 26 years on the job.\n\n\"In past years, customers would come to the showrooms nonstop,\" he told CNBC during an interview in his deserted showroom at a complex of dealerships on the outskirts of the Chinese capital. \"We would have deals to sign every day. But nowadays we see only two to three deals a week. It's a dramatic drop.\"\n\nMany people in China aren't buying cars because an unstable job market and a continued slide in property prices have undercut consumer confidence. The government has also scaled back incentives such as cash-for-clunkers subsidies and tax breaks to go electric, car salespeople said.\n\nPassenger car retail sales for 2026 in China totaled 13.33 million units through September, falling 21.7% from a year ago, according to the China Passenger Car Association. For the full year 2026, China's domestic passenger car retail sales are set to drop 22% to 18.5 million vehicles, the association said \u2014 under the level recorded in the first year of the pandemic.\n\nEven electric vehicles, which were once a bright spot, are down. Gasoline car sales have been declining in China because of the country's transition to electric vehicles, but sales in China of new-energy vehicles \u2014 which includes EVs \u2014 dropped by 12.8% from January through September, according to the association.\n\n\"Customers are watching every penny,\" Li said. \"When looking at all the new functions on all these new models, they are weighing what is most practical, economic and worth their money over the long term. We don't see impulse buying. Because of the bad economy, people are taking more time to replace their cars.\"", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 06:47 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sebi signs MoU with Bank of England to strengthen oversight of clearing corporations", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi signs MoU with Bank of England to strengthen oversight of clearing corporations The Economic Times daily newspaper is available online now. Read Today's Paper Sebi signs MoU with Bank of England to strengthen oversight of clearing corporations SECTIONS Sebi signs MoU with Bank of England to strengthen oversight of clearing corporations By Kumar Gaurav , ETMarkets.com Last Updated: Oct 28, 2026, 06:45:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis SEBI and the Bank of England signed an MoU to strengthen regulatory cooperation and information sharing on clearing corporations. The framework supports cross-border supervision, enables reliance on SEBI\u2019s oversight, and reinforces financial stability.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 06:45 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The 'Magnificent Seven' is no more. Time to pick winners and losers as group's correlation breaks down", "full_content": "The \"Magnificent Seven\" doesn't trade as a monolith anymore, challenging investors to be more discerning when picking through the market's biggest stocks rather than viewing them as a single trade.\n\nCNBC calculated the rolling 60-day correlation of daily returns for each of the 21 unique pairs among the Magnificent Seven \u2014 which comprises Alphabet , Amazon , Apple , Meta Platforms , Microsoft , Nvidia and Tesla .\n\nThe average of those correlations recently fell to its lowest level in more than a decade, suggesting the group is trading less like a cohesive block than it has historically. This marks a departure for a group that's often discussed together because of its size and influence over the broader market.\n\nThe companies \"all have different exposures to AI,\" said Gil Luria, analyst at D.A. Davidson. \"This requires a much more granular approach to which of the largest mega-caps an investor wants to own as opposed to just owning them wholesale,\" he added.\n\nThe dislocation has led the group as a whole to lag the broader market. The Roundhill Magnificent Seven ETF (MAGS) is up 7% year to date, while the S&P 500 has gained 12%. Tesla and Meta are the two names in the cohort down in 2026, while Nvidia and Apple are the only ones outperforming the S&P 500.\n\nMicrosoft and Alphabet report results after the bell Wednesday. Amazon will post earnings after the close on Thursday.\n\nThe growing divergence among the Magnificent Seven reflects investors' deeper focus on companies' \"independent fundamental growth drivers,\" said Thomas DiFazio, ETF strategist at Roundhill Investments. \"They have varying levels of success, when you put them in the totem pole of AI winners and losers.\"\n\nHe added that \"investors are focusing on the micro factors,\" such as company-specific news that can signal whether the business can flourish in the AI world.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 06:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Auto biggies Q2 result compared: Bajaj Auto vs Maruti Suzuki - Who wins the earnings race? Profit, revenue, target price", "full_content": "Bajaj Auto vs Maruti Suzuki: Shares of Bajaj Auto and Maruti Suzuki ended in green on Wednesday, a day after the two auto majors announced their second quarter results for the financial year 2026-27.\n\nBajaj Auto reported upbeat earnings with a 35.2% annual jump in its consolidated net profit. Whereas, Maruti Suzuki India reported mix set of numbers as its profit fell by 26.4%, but revenue surged by 26% annually.\n\nBajaj Auto reported a 35% annual jump in its standalone profit after tax (PAT) to \u20b9 3,354 crore in the three months to September compared to the corresponding quarter of the last financial year.\n\nCar market leader Maruti Suzuki India saw 26.36% decline in its consolidated net profit for the second quarter of FY27. The car maker\u2019s net profit declined to \u20b9 2,466.1 crore, due to higher input costs resulting from the West-Asia conflict even as the revenue surged sharply, driven by record quarterly vehicle sales volume. Its net profit stood at \u20b9 2,480 crore in the same quarter of previous financial year.\n\nMaruti Suzuki\u2019s total revenue from operations increased to \u20b9 53,355.5 crore as against \u20b9 42,344.2 crore in the same period of 2025-26 fiscal.\n\nThe company\u2019s total expenses in July-September also shot up to \u20b9 50,619 crore as compared to \u20b9 39,018.4 crore in the year-ago period, the company said. Bajaj Auto\u2019s revenue from operations stood at \u20b9 20,003, up 34% on an annual basis from \u20b9 14,922 crore reported in the year-ago period.\n\nHealthy launch pipeline, recovery in domestic passenger vehicle demand, lean channel inventory, and capacity ramp-up at new facilities are likely to boost Maruti Suzuki performance in the financial year 2026-27, highlighted Motilal Oswal Financial Services .\n\nThe brokerage maintained a \u2018Buy\u2019 rating with a target price of \u20b9 14,800 per share. \u201cWe expect MSIL to deliver a 11% earnings CAGR over FY26\u201328E. Reiterate BUY with a TP of INR14,800, valuing the stock at 26x FY28E EPS.\u201d", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 06:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "11 bargain-priced stocks of companies that have huge growth potential over the next two years", "full_content": "These stocks trade at low price/earnings valuations, and the companies are projected to achieve very high revenue growth rates through 2028.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "IndiaMART management expects profitable growth despite macro headwinds; AI could drive the next phase", "full_content": "Despite macroeconomic uncertainties and the rapid evolution of artificial intelligence (AI), Dinesh Agarwal, Chief Executive Officer, IndiaMART, remains optimistic and expects IndiaMART InterMESH to continue growing profitably in the foreseeable future.\n\nIn an interaction with Mint on Wednesday, 28 October, the CEO of one of India's leading business-to-business (B2B) online marketplaces discussed the factors weighing on revenue growth, its strategy to navigate competition from AI-powered information platforms, and the opportunities it sees in technology-led improvements.\n\nWhile subscriber volumes in IndiaMART's standalone business have remained stagnant, the company has managed to increase the value generated per subscriber.\n\nAgarwal believes these factors, along with investments in technology, customer acquisition and category-level pricing, can help the company sustain profitable growth.\n\nExplaining the factors behind the company's revenue growth, Agarwal said performance depends on two key variables: the number of paying subscribers and the value generated per subscriber.\n\nAlthough subscriber volumes have not increased, IndiaMART has recorded an approximately 8% increase in value per subscriber in its standalone business.\n\nThe company's consolidated performance is also benefiting from Busy, which has reported revenue growth of around 26\u201327%, according to Agarwal.\n\nLooking ahead to the second half of the financial year, Agarwal identified several developments that could influence the business environment. These include geopolitical tensions, elevated inflation, high oil prices and an upward interest-rate cycle.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 06:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Vertiv earnings just sent an upbeat signal about AI ahead of Big Tech results", "full_content": "Vertiv\u2019s big sales beat affirms that the AI buildout is accelerating.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Oct 2026, 06:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India bonds end flat as oil woes come up against short covering", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds end flat as oil woes come up against short covering Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds end flat as oil woes come up against short covering SECTIONS India bonds end flat as oil woes come up against short covering Reuters Last Updated: Oct 28, 2026, 06:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds faced volatility as oil price hikes raised inflation concerns and affected market sentiment. The 6.94% 2036 bond yield fluctuated but ended slightly unchanged as traders reacted to market conditions. Elevated crude prices have increased worries about inflation, a wider fiscal deficit, and slower economic growth for India. The rupee weakened further against the dollar, prompting fears of aggressive policy tightening by the Reserve Bank of India.\n\nIndian government bonds experienced a significant decline after a prior rally due to rising oil prices. Brent crude oil prices increased following concerns over supply disruptions in Saudi Arabia. The US 10-year Treasury yield also rose, affecting the attractiveness of Indian debt. Markets are anticipating the Federal Reserve's policy decision and rate outlook, impacting investor sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 06:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SK Hynix Stock Jumps On Q3 Earnings Beat - Investor's Business Daily", "full_content": "SK Hynix Stock Jumps On Q3 Earnings Beat Investor's Business Daily SK Hynix Plans $75 Billion in Shareholder Returns After Blockbuster Earnings WSJ SK Hynix's earnings smash sends AI chip stocks up as investors cheer strong demand Business Insider SK Hynix Jumps 7%, Micron Rises 3% on Memory Shortage Call Through 2030 While Seagate Slips Despite Upbeat Guidance Yahoo Finance SK hynix Announces 3Q26 Financial Results SK hynix", "source": "Google News Business", "pub_date_str": "28 Oct 2026, 06:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bandhan Bank Q2 profit jumps 5.6 times as asset quality improves", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI ide Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1", "source": "Economic Times Economy", "pub_date_str": "28 Oct 2026, 05:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Israeli bonds, shekel fall as election leaves Netanyahu and others far short of majorities", "full_content": "Israeli assets sold off Wednesday as the country's election produced no clear winner.\n\nPartial results showed Prime Minister Benjamin Netanyahu's party has 20.8% of the votes counted and challenger Gadi Eisenkot's has 16.4%. The count from Israel's Central Elections Committee does not indicate how many seats each party will have in the 120-seat Knesset.\n\nPolls suggested that Arab-led parties, which belong to neither camp, earned about 18 seats.\n\nEisenkot, a former military chief of staff, earlier in the day had declared victory and said the preliminary result \u2014 which had his bloc slightly ahead \u2014 should give him the first right to try to form a government. \"The initial exit poll results indicate a complete lack of confidence in Netanyahu and his October 7 government,\" he said in a statement on X .\n\nExit polls are not the official results, which are published on Nov. \u200b4. Around 77.7% of eligible voters turned out to cast their ballots, the highest in a Knesset election in 27 years , according to the Central Elections Committee.\n\nThe Israeli shekel fell 2% against the U.S. dollar while the Tel Aviv 35 stock index traded 2.3% lower.\n\nUSD/Israeli shekel Meanwhile, Israeli government bonds came under pressure, with yields rising across the curve. The yield on the 2-year bond added 6 basis points, while the benchmark 10-year government bond's yield rose by 8 basis points. Longer-maturity 30-year bond yields gained 6 basis points.\n\nThe vote came as Israel's first national election since Hamas's Oct. 7, 2023 attack and the subsequent wars in Gaza, Lebanon and Iran, and was widely seen as a referendum on Netanyahu's dominance of Israeli politics since 2009.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 05:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trump says Iran war will end 'when I want it to' as costs reportedly balloon to $47 billion", "full_content": "U.S. President Donald Trump has reiterated his claim that the Iran war will end \"whenever I want it to,\" but insists that Tehran cannot have a nuclear weapon.\n\nSpeaking at a rally in Lubbock, Texas, Trump said \"Somebody asked me before, 'When will the war in Iran end?' I said, 'Whenever I want it to end.'\"\n\nTrump said it \"would be very quick, but we have to have an end properly ,\" with a \"total statement\" that Iran would never have a nuclear weapon.\n\nHis statement comes as the president grapples with poll numbers that are near a record low due to rising energy costs and affordability issues as the U.S. heads into the midterm elections on Nov. 3.\n\nCurrently, Trump's approval ratings stand at 32%, according to a Reuters/Ipsos poll on Monday.\n\nMark Zandi, chief economist at Moody's Analytics, said on Oct. 12 that the war was costing American families an average of $2,000 so far, where $1,100 comes from higher energy costs, $540 from heightened interest rate costs and $360 due to increased military spending.\n\nThe Iran conflict shows no sign of winding down, with Trump saying that he will soon decide whether to \"make a deal\" with Iran or \"finish it off.\"\n\nEarlier in the month, the U.S. had evacuated diplomats from Saudi Arabia, as The New York Times reported that U.S. and Israeli militaries have drawn up specific plans for a \"short but intensive\" operation for strikes on Iran after the midterm elections.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 05:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Robinhood to rally on prediction markets and new offerings, Bernstein says", "full_content": "Robinhood Markets is poised to see considerable upside due to its deepening push into crypto and prediction markets, among other offerings, per Bernstein.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 05:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "India, Mexico begin talks for trade pact; aim to boost commerce, investments", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India, Mexico begin talks for trade pact; aim to boost commerce, investments The Economic Times daily newspaper is available online now. Read Today's Paper India, Mexico begin talks for trade pact; aim to boost commerce, investments SECTIONS India, Mexico begin talks for trade pact; aim to boost commerce, investments PTI Last Updated: Oct 28, 2026, 05:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India and Mexico have initiated negotiations for a preferential trade agreement to enhance bilateral trade and investmen     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
