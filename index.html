": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "International mutual funds: Check fresh SIP and lump sum investment options; one PGIM scheme to reopen on October 8", "full_content": "International mutual fund investors are seeing a familiar pattern: funds open for fresh investments and then close again within days.\n\nAccording to Value Research, Invesco Mutual Fund reopened three international funds on 28 September, but stopped accepting lump-sum investments again from 29 September.\n\nAditya Birla Sun Life Mutual Fund had also reopened three funds on 24 September, only to close them at the end of the same business day. In other words, investors had just one day to make an investment.\n\nHowever, Invesco's restriction is limited to lump-sum investments and switch-ins. It continues to accept new SIP registrations in all three funds, subject to a \u20b9 10 lakh per-day limit per PAN.\n\nAccording to the latest data from Value Research, only 1 of 60 international funds is accepting lump-sum investments\u2014Baroda BNP Paribas Aqua FoF. Meanwhile, 4 funds are accepting new SIPs, while one more fund is set to reopen for lump-sum investments from 8 October. Here\u2019s what mutual fund investors need to know.\n\nBaroda BNP Paribas Aqua FoF is open for both lump-sum investments and new SIPs, while the three Invesco funds continue to accept new SIPs but not lump-sum investments.\n\nFor the Invesco funds, the \u20b9 10 lakh daily limit applies to each PAN and covers the combined SIP instalments due across the three funds on that day. If the total crosses \u20b9 10 lakh, all instalments due that day are rejected.\n\nPGIM India Global Select Real Estate Securities FoF is scheduled to reopen for lump-sum investments on 8 October, but new SIP registrations will remain closed. Existing SIPs can continue.", "source": "LiveMint Money", "pub_date_str": "02 Oct 2026, 09:47 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "1.7 million skilled trade jobs will open annually through 2035, report says\u2014experts don't know who will fill them", "full_content": "Skilled trade workers are already in high demand, and researchers say the industry will continue to see steady job growth in the decade to come.\n\nThe State of America's Skilled Trades report , published Wednesday, found that 1.7 million skilled trade jobs will open each year through 2035. Jobs for the Future and The Burning Glass Institute, nonprofits dedicated to expanding economic opportunities for the American public, are the two research leads on the report.\n\nResearchers anticipate that more than 600,000 net new jobs in the skilled trades will open until the end of 2035. Electricians, plumbers, maintenance workers and carpenters are just a few of the high-demand jobs researchers say the industry is struggling to fill.\n\nInfrastructure demand across the country is a major driver of net job creation in the trades. President of the Burning Glass Institute Matt Sigelman tells CNBC Make It that \"big infrastructure projects like AI data centers\" and \"growing parts of the country,\" which require new housing developments, commercial buildouts and power grid expansion, are stimulating job growth in the sector. So, while the overall unemployment rate in September 2026 grew to 4.2% and nonfarm payrolls rose below expectations, according to data from the US Bureau of Labor Statistics, skilled trades opportunities continue to crop up.\n\nHowever, net job creation fails to account for the need to replace retiring workers, Sigelman says.\n\nNearly a quarter of skilled trades workers across the 124 job titles included in the report are 55 or older, while workers under 25 make up only 11% of the workforce. In the broader labor market, the workforce participation rate by those 55 and older has been on the decline since 2024.\n\n\"One in 12 trade jobs needs to be replaced in just the next five years,\" Sigelman says of the projected changes in the skilled trades workforce.", "source": "CNBC Top News", "pub_date_str": "02 Oct 2026, 09:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Goyal at G20: India opposes making MFN conditional on WTO obligations", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Goyal at G20: India opposes making MFN conditional on WTO obligations The Economic Times daily newspaper is available online now. Read Today's Paper Goyal at G20: India opposes making MFN conditional on WTO obligations SECTIONS Goyal at G20: India opposes making MFN conditional on WTO obligations ET Online Last Updated: Oct 02, 2026, 09:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Union Minister Piyush Goyal represented India at the G20 Trade Ministers' Meeting, emphasizing the importance of the Most-Favoured-Nation principle. He stated that equal trading terms are essential for both large and small traders. Goyal expressed India's commitment to addressing trade distortions through WTO-compliant measures and preserving developing countries' policy space for industrialization. India's position on forced labor in global supply chains was reiterated during the discussions.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nCho     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
