    const allData = {"general": [{"title": "Missile strikes passenger terminal at Riyadh airport and many are wounded, official says", "full_content": "The airport in Saudi Arabia's capital, Riyadh, was attacked again on Saturday and evacuated, two regional officials said, just days after three Saudi citizens, including a pilot, were killed as the kingdom faces an extraordinary series of assaults on the new front in the Iran war.\n\nPresident Donald Trump told reporters he was evaluating whether the U.S. should join Saudi strikes against the Iran-backed Houthi rebels in neighboring Yemen who have claimed this week's attacks on King Khalid International Airport as well as other Saudi airports, military facilities and oil infrastructure.\n\n\"We may. We're going to look at it,\" Trump said. \"We just found out about the recent attack. So we'll make a decision. We move very quickly.\"\n\nIn the latest attack, a missile struck a complex housing terminals 3 and 4 for domestic flights at the Riyadh airport, and many people were wounded, one of the regional officials said. They spoke on condition of anonymity because they weren't authorized to speak to the media. Ambulances were seen rushing there.\n\nThe surge in attacks has come in the week since a Saudi-led coalition launched a major military offensive against the Houthis. The Houthis made no immediate statement on Saturday.\n\nSaudi civil aviation authorities said operations at the airport had been suspended and that they were assessing the number of wounded and the damage. Police were heavily present at the airport, with all entrances blocked and lights around the complex dimmed.\n\nFlights diverted elsewhere, the Flightradar24 tracker said. Countries including the United States, Britain, Germany, Australia and Canada warned citizens to avoid the airport.\n\nThe attacks on airports, military facilities and oil infrastructure in Saudi Arabia, the world's top oil exporter, have rattled markets and the region.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 11:10 PM IST", "pub_date_relative": "14m ago"}, {"title": "Everpure director Mallun Yen sells $1.75m in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 11:01 PM IST", "pub_date_relative": "24m ago"}, {"title": "Rapport Therapeutics CEO Abraham Ceesay sells $143,272 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 11:01 PM IST", "pub_date_relative": "24m ago"}, {"title": "Pacific Biosciences CFO reports $2.05m stock sale", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 11:01 PM IST", "pub_date_relative": "24m ago"}, {"title": "Want to retire early? Here's how F.I.R.E strategy can help \u2014 We calculate corpus you will need", "full_content": "Retiring early is an ever-growing dream for a number of young professionals in India and around the world, as the \u2018Financial Independence, Retire Early\u2019 or FIRE method has evolved from a niche movement to more mainstream mass appeal.\n\nThe recent Bharosa Talks: India Retirement Index Study 6.0 (IRIS 6.0) report noted that as many as 7 in 10 urban Indians said they would exit the workforce early if money were no concern. However, only 11% of those surveyed were confident their retirement savings would actually last them a lifetime.\n\nA movement among millennial , Gen Z, and younger workforce, FIRE is a financial movement that calls for reducing expenditure in order to enable extreme savings (up to 75% of income) and investments with the goal of building enough corpus to retire at a younger age.\n\nThe most basic FIRE calculation is where you multiply the current annual expense by 25 and assume that number as the goal needed to retire comfortably. Once retired, most withdraw 3-4% of their savings annually to cover expenses.\n\nHowever, there are other iterations of the FIRE philosophy that have been developed as people look to tailor their savings to fit their goals. Here's a look at the other paths apart from the traditional FIRE strategy:\n\nUsing the common \u201825\u00d7 rule\u2019, here's how much you will need to accumulate to retire comfortably, at below illustrated income and lifestyle levels:\n\nDepending on your financial needs and goals, you can focus more on cutting spend or maximising income. This can be done through bank fixed deposits , equity investments, SIPs, mutual funds, government savings schemes and other assets.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 10:44 PM IST", "pub_date_relative": "41m ago"}, {"title": "Analog devices director Ray Stata sells $1.17 million in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 10:31 PM IST", "pub_date_relative": "53m ago"}, {"title": "Pimco high income fund director David Flattum buys $249,245 stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 10:31 PM IST", "pub_date_relative": "54m ago"}, {"title": "EU-China trade relations hit crunch time as Brussels pushes for rebalancing", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 10:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Elon Musk is now richer than any American ever \u2014 and it\u2019s not even close", "full_content": "Musk\u2019s trillioniare status means he\u2019s wealthier than his next three contemporaries combined \u2014 and also worth more than historical tycoons like John D. Rockefeller.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 10:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Super Micro Contractor Pleads Guilty In $2.5 Billion AI Chip Diversion Case Linked To China", "full_content": "Ting-Wei \u201cWilly\u201d Sun pleaded guilty to four counts, including conspiracies to violate US export controls, smuggle goods and obstruct justice. Prosecutors alleged the scheme involved around $2.5 billion worth of US AI technology destined for China.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ranveer Singh Adds BMW i7 Luxury Electric Sedan To His Car Collection", "full_content": "BMW India recently launched the 7 Series with both petrol and electric powertrains and named Singh as its new brand ambassador.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "This Sister-Duo Left Stable Corporate Jobs. They Now Run A Rs 73.5 Crore 'Suta\u2019 Business", "full_content": "The sisters started the business in 2016 after leaving their stable corporate jobs, choosing to build the brand through a bootstrapped approach.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "DMart Q2 results: Avenue Supermarts Net Profit Rises 8% to Rs 804 Crore, Misses Estimates", "full_content": "The DMart operator's revenue from operations rose 18.4% to Rs 19,206 crore for the quarter ended on September 30, 2026, against Rs 16,219 crore in the same quarter the previous year.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft's Satya Nadella Calls For AI Accountability, Timely Disclosure Of System Failures", "full_content": "Microsoft CEO Satya Nadella calls for stronger AI safeguards, timely disclosure when systems fail and tools to trace agent behaviour to specific code paths as businesses embrace autonomous AI.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Abbas postpones Palestinian elections, sets presidential poll for September 2027", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 10:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ronaldo Provisionally Suspended By Portugal After Walk Out And Jesus Dispute", "full_content": "The Portuguese Football Federation is examining Ronaldo's camp exit, with the forward reportedly unhappy over assurances concerning his playing time under Jorge Jesus.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mueller Water Products director Healy buys $29,927 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 10:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "CJP Protests: Supreme Court To Hold Special Hearing Tomorrow Over Delhi Metro Closures", "full_content": "The contempt plea names senior officials, including the Union Home Secretary and Delhi Police Commissioner, over alleged violations of the Supreme Court's public transport directions.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 09:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "No more tax relief for importing gold, silver and platinum: What does it mean? Will buyers pay more?", "full_content": "The government has ended tax relief for banks importing gold, silver and platinum. Banks must now pay 3% Integrated Goods and Services Tax, or IGST, upfront.\n\nAccording to Revenue Secretary Arvind Shrivastava, banks have paid this tax since 1 April 2026. The government informed the GST Council about the change on 8 October.\n\n\"This is done to ensure parity of taxes imposed on imports of gold and other metals through different routes,\" Reuters quoted Shrivastava as saying.\n\nThe exemption covered gold imports in 2017. It was later extended to other precious metals. Under this relief, banks could import these metals without paying IGST upfront. The exemption for banks and nominated agencies has now expired.\n\nBank imports, therefore, attract the 3% levy when shipments clear customs. This changes when importers must arrange money for tax payments.\n\nThe government wants different import routes to be subject to similar tax rules. Earlier, bank channels enjoyed an upfront tax advantage over alternative routes.\n\nEnding the waiver puts bank imports alongside shipments through organised trading platforms. One such platform is the India International Bullion Exchange in Gujarat\u2019s GIFT City.\n\nThe aim is to prevent tax rules from favouring a particular import route. Importers can then choose routes without that earlier tax advantage.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Iran MP Mocks Pakistan's America-Iran Mediation, Says Even Shehbaz Sharif's Tweet Was US-Written", "full_content": "The Iranian lawmaker's remarks followed scrutiny of Sharif's X post, which initially carried the word \"Draft\" before it was removed in a subsequent edit.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 09:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Real Madrid Vs Villarreal Live Streaming: Likely Lineups; Where To Watch LaLiga Match On TV, Online?", "full_content": "Mourinho's Real Madrid face Villarreal at the Bernab\u00e9u. Check team news, lineups and how to watch the La Liga match live in India.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "A friend in her 80s fell down her basement stairs. Is this a hidden danger lurking in people\u2019s home?", "full_content": "\u201cShe developed pleural effusion \u2014 fluid between the lungs and ribs \u2014 compressing her lungs and making it hard for her to breathe.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 09:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "India-US Trade Pact To Be Finalised Keeping Changed Circumstances In Mind: Piyush Goyal", "full_content": "The US and India announced in February that they had reached a framework for an interim trade agreement, but circumstances have changed, and the pact will be finalised accordingly, Commerce and Industry Minister Piyush Goyal said.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 09:22 PM IST", "pub_date_relative": "2h ago"}, {"title": "Drishyam 3: The Conclusion Box Office Collection Day 9: Ajay Devgn Starrer Continues Its Strong Run", "full_content": "The film is written by Aamil Keeyan Khan and Parveez Shaikh and produced by Alok Jain, Ajit Andhare, Kumar Mangat Pathak and Abhishek Pathak. It is presented by Star Studio18.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 09:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "908 devices CFO Joseph Griffith sells $65,150 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 09:16 PM IST", "pub_date_relative": "2h ago"}, {"title": "Riyadh Airport Hit Again, Evacuated; Air Traffic Halted: Report", "full_content": "Riyadh's King Khalid International Airport was evacuated after another reported attack, with air traffic halted, as Saudi Arabia faces escalating assaults amid the widening Iran war.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 09:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "Signature Global Sales Bookings Down 9% To Rs 1,830 Crore In July-Sept Quarter", "full_content": "Signature Global said its sales bookings declined 18 per cent to Rs 3,800 crore in the first six months of this fiscal from Rs 4,660 crore in the corresponding period of the preceding year.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 09:10 PM IST", "pub_date_relative": "2h ago"}, {"title": "Stocks saw new highs and big declines: How the volatile AI trade moved last week's market", "full_content": "Looking to balance out our AI exposure, we put more of our sizable cash pile to work.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018I have no children\u2019: My aunt gave me $50,000 for a down payment. Now she wants me to leave my home to her two children.", "full_content": "\u201cThe house cost $385,000. With my savings, her $50,000 and a small mortgage, I was able to close.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Targetting \u20b91.5 crore retirement corpus? Here's how to calculate how much you really need", "full_content": "HDFC Pension Fund Management's 2nd edition of the National Pension System Preference Index Study 2026 looked at consumer outlook on retirement planning and the NPS.\n\nIt found that preference for NPS among Indians has risen to 57 (out of 100), up three points from the inaugural 2023 reading of 54; and surveyed Indians preferred it as an instrument for retirement planning.\n\nThe study surveyed 1,812 consumers aged between 30-55 years, to understand their outlook towards retirement and financial preparedness at key life stages and track the change in preference for NPS over the last three years.\n\nAs per the report, emergency preparedness is gaining ground, though medical costs continue to lead; and retirement competes with health and children's education as top concerns. Meanwhile, rising healthcare costs and medical concerns continue to be the primary post-retirement worries\n\nFinancial adequacy forms a persistent second layer of concern\n\nThe ideal retirement corpus, though growing, still remains below recommended levels, it added. \u201cThe estimated retirement corpus continues to be underestimated. \u20b9 1.5 crore is the ideal retirement corpus savers now target, up from \u20b9 I.34 crore in 2023, still under 10x annual income,\u201d the report said.\n\nAs per the report, health concerns drive planning while complacency delays it, but most believe they're already provided for \u2014 the barrier isn't fear, it's a false sense of readiness, not anxiety.\n\nWhen it comes to saving for retirement, the study noted that surveyed consumers targetted \u20b9 1.5 crore as the ideal retirement corpus but added that this blanket number may not be the correct amount needed by all. It stated that your ideal retirement savings , must be at least 10x your current annual income.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 08:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "SEBI To Issue CAS Guidelines Within A Week, Introduce Tiered Framework For AI, Machine Learning", "full_content": "SEBI's proposed AI and machine learning guidelines will include tiered oversight, data controls, kill switches and human accountability, aligned with the IOSCO Supervisory Toolkit.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 08:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018I feel like a loser\u2019: My stock portfolio is swinging wildly. Is it finally time to worry?", "full_content": "\u201cI presume these are sophisticated investors taking a profit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 08:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "JPMorgan makes bullish call in fixed income space, suggests it's a once in a generation opportunity", "full_content": "J.P. Morgan Asset Management is making a bullish call on an underinvested market group: high-quality fixed income.\n\nPriya Misra, a portfolio manager at the firm, sees a once in a generation opportunity for investors.\n\n\"You can actually take credit risk in the highest quality companies and still get [a] 6.5% [yield], Misra told CNBC's \"ETF Edge\" this week. \"So, you actually don't have to go down in credit [quality].\"\n\nShe suggested the strategy is particularly well suited for investors concerned about having too much exposure to artificial intelligence stocks.\n\n\"There's a huge AI exposure,\" Misra said. \"What fixed income gives you is this diversified set of returns. It's not just an AI trade or a tech trade. You have the Treasury trade. You have credit outside of AI.\"\n\nMisra co-manages the JPMorgan Core Plus Bond Fund ETF (JCPB) . The fund has almost $16 billion in assets under management, with just over three-quarters of its holdings in BBB-rated debt and above, according to the firm's website as of Aug. 31.\n\n\"We've actually been increasing some of the double-B [and] single-B exposure because there has been a widening in high yield spread,\" she said. \"We like some investment grade. And now, we've started in the last few days to increase some duration as well, thinking we may be nearing the end of that rate move.\"\n\nThe JPMorgan Core Plus Bond Fund ETF is down more than 5% so far this year as of Friday's close, according to FactSet.", "source": "CNBC Finance", "pub_date_str": "10 Oct 2026, 08:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Adani Defence & Aerospace Wins SIDM Champion Award For Defence Export Performance", "full_content": "Defence Minister Rajnath Singh presented the award in the presence of Defence Secretary Rajesh Kumar Singh and Director General (Acquisition) A. Anbarasu.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 08:17 PM IST", "pub_date_relative": "3h ago"}, {"title": "WWE Money in the Bank Live Streaming: Match Card, When, Where To Watch MITB 2026 Online In India?", "full_content": "The men's ladder match will feature Bron Breakker, Je'Von Evans, Trick Williams, Penta, CM Punk and Kevin Owens.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 08:00 PM IST", "pub_date_relative": "3h ago"}, {"title": "Sonam Wangchuk Issues Hunger Strike Warning After CJP Leaders\u2019 Detention In Delhi", "full_content": "Wangchuk cited his work on artificial glaciers and glacial lake outburst flood risks in Ladakh as the reason for missing the protest, before backing demonstrators after the detentions.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 07:59 PM IST", "pub_date_relative": "3h ago"}, {"title": "Jailer 2 Day 1 Advance Booking: Rajinikanth Film Sees 100 Housefull Shows Ahead Of Release", "full_content": "Jailer 2 is scheduled to release in theatres on October 15, 2026, in Tamil, Hindi, Telugu and Kannada.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 07:58 PM IST", "pub_date_relative": "3h ago"}, {"title": "Tanishaa Mukerji Says Some Paparazzi Deliberately Poke Jaya Bachchan: \"Don't Trouble Her\"", "full_content": "Tanishaa Mukerji claimed that some paps deliberately provoke Jaya Bachchan to elicit a reaction from her", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 07:57 PM IST", "pub_date_relative": "3h ago"}, {"title": "Vance says Microsoft replaced laid-off workers with foreign hires. Here\u2019s what the visa data shows", "full_content": "As the Trump administration announced Thursday that it suspended eight tech companies from sponsoring foreign workers for green cards, Vice President JD Vance singled out Microsoft , claiming it replaced the 6,000 workers it laid off in 2025 with people on H-1B work visas.\n\nThe suspension of the Labor Department's PERM program for green cards, which grant permanent residency to immigrants, doesn't affect H-1Bs, which are temporary work permits, but H-1B approval data shows how heavily these companies rely on foreign workers.\n\nData from the U.S. Citizenship and Immigration Services' H-1B Employer Data Hub also shows that Amazon and Meta were the biggest sponsors of H-1B visas, and neither was suspended.\n\nThe crackdown went beyond tech. At the same news conference Thursday, the Labor Department's inspector general, Anthony D'Esposito, announced an investigation into alleged J-1 visa fraud involving nine major American universities. Trump supporters have long argued that these programs undercut American workers by incentivizing employers to hire from abroad.\n\nAll eight suspended companies rank among the nation's top 50 H-1B sponsors. Most are IT services and consulting firms. Adobe is the smallest, at No. 45.\n\nAmazon, with 19,178 H-1B approvals in fiscal 2025, and Meta, with 6,294, were the top two sponsors, and neither was suspended. Microsoft was a close third with 6,258, according to the USCIS data hub. Microsoft out-sponsored Amazon for years. Amazon passed Microsoft in 2017 and now gets about three times as many approvals.\n\nThe numbers cut both ways. Microsoft did receive more than 6,000 H-1B approvals last year, as Vance said. But 2 in 3 went to people already working there. Amazon, which brought in nearly four times as many H-1B workers new to the company, was not on the suspension list.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 07:52 PM IST", "pub_date_relative": "3h ago"}, {"title": "300-member Canadian trade delegation heads to India as countries look to firm up ties", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 300-member Canadian trade delegation heads to India as countries look to firm up ties The Economic Times daily newspaper is available online now. Read Today's Paper 300-member Canadian trade delegation heads to India as countries look to firm up ties SECTIONS 300-member Canadian trade delegation heads to India as countries look to firm up ties ET Online Last Updated: Oct 10, 2026, 07:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Canada is preparing to send a significant trade delegation to India, aiming to enhance commercial relationships. Led by Minister Maninder Sidhu, the mission will focus on expanding partnerships in aerospace, agri-food, and clean technology. This event will coincide with ongoing negotiations for a Comprehensive Economic Partnership Agreement aimed at elevating bilateral trade. Canadian businesses hope to connect with Indian leaders and boost employability in Canada.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "10 Oct 2026, 07:46 PM IST", "pub_date_relative": "3h ago"}, {"title": "How de-extincting dire wolves and woolly mammoths may extend human life", "full_content": "Colossal Biosciences' efforts to bring back extinct animals like the woolly mammoth and dire wolves have drawn comparisons to Jurassic Park.\n\nCEO and co-founder Ben Lamm told CNBC's Julia Boorstin at the CNBC AI Forum last week that he understands those comparisons.\n\n\"I think anyone that saw Jurassic Park in the 90s and didn't say it was cool, like I don't think they're probably very fun at parties,\" Lamm joked. \"But yes, I saw the movies. I love them. They entertained us. They scared us.\"\n\nHowever, Lamm said, \"I constantly have to remind people on X that, you know, they were movies,\" he said. \"I don't think Jurassic Park had any conservation or general human benefit models to it, so we've tried to take a slightly different perspective.\"\n\nSince viable dinosaur DNA is no longer available, bringing back dinosaurs is, in fact, impossible. But what is underway at Colossal, besides the dire wolf and woolly mammoth projects, is work to genetically engineer the dodo bird, the Tasmanian tiger, and a giant bird called a moa, among others.\n\n\"It's highly likely in the next coming year or two, people will continue to see us deliver extinct species back to Earth, and we could even have more dire wolves, too,\" Lamm told Boorstin.\n\nThe process of creating the wolf pups involved taking genetic material from a skull and a tooth that were tens of hundreds of years old. Using AI models, Colossal used the ancient DNA to reconstruct the dire wolf genome and map it to its closest living relative, the gray wolf. The team then created embryos by editing the cells of modern gray wolves.\n\nThree pups, named Romulus, Remus, and Khaleesi, have been born to domestic dogs used as surrogate mothers.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 07:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Sebi\u2019s CAS guidelines likely within a week, says chief Tuhin Kanta Pandey", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi\u2019s CAS guidelines likely within a week, says chief Tuhin Kanta Pandey The Economic Times daily newspaper is available online now. Read Today's Paper Sebi\u2019s CAS guidelines likely within a week, says chief Tuhin Kanta Pandey SECTIONS Sebi\u2019s CAS guidelines likely within a week, says chief Tuhin Kanta Pandey By Kumar Gaurav , ETMarkets.com Last Updated: Oct 10, 2026, 07:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi chairman Tuhin Kanta Pandey said the regulator expects to issue guidelines on the settlement-price mechanism for derivatives on expiry days within a week. The move follows a review of the Closing Auction Session. Sebi is also working on simpler regulations, easier market access, lower compliance costs and stronger technological resilience.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 07:28 PM IST", "pub_date_relative": "3h ago"}, {"title": "The Walmart Deals event ends soon \u2014 40+ major last-chance discounts to shop now - Yahoo", "full_content": "The Walmart Deals event ends soon \u2014 40+ major last-chance discounts to shop now Yahoo I'm stocking up on fall clothes during the Walmart Deals event \u2014 these are my favorite styles Yahoo The 30 Best Deals From Walmart\u2019s Fall Sales Event The New York Times Walmart\u2019s Massive Sale Ends Tomorrow \u2014 Best Deals We Recommend, up to 80% Off TODAY.com 37+ deals actually worth shopping during the Walmart Deals event NBC News", "source": "Google News Business", "pub_date_str": "10 Oct 2026, 07:14 PM IST", "pub_date_relative": "4h ago"}, {"title": "Putin relayed Iran war proposal to Trump, Kremlin says", "full_content": "Russian President Vladimir Putin conveyed Tehran's vision for a possible end to the war in Iran to U.S. President Donald Trump , Russian state media reported Saturday.\n\nThe report comes a day after Trump said Russia will supply diesel to the global market amid a surge in energy prices caused by the wars in Iran and Ukraine.\n\nRussia's Interfax news agency quoted Kremlin spokesman Dmitry Peskov as saying Putin sent the message to Trump \"in agreement with Iranian President Masoud Pezeshkian,\" according to a Google translation.\n\nOther Russian media reports said Putin spoke to Trump by phone after the Russian leader met Pezeshkian on the sidelines of a summit in Turkmenistan.\n\nInterfax didn't elaborate on the specifics of how Iran sees the war \u2014 which began on Feb. 28 with U.S. and Israeli airstrikes on Iranian targets \u2014 coming to an end.\n\nThe White House didn't immediately respond to CNBC's emailed request to confirm the reported conversation between Putin and Trump.\n\nTrump said Friday that Russia will supply more than 4 million tons of diesel to the global market under an arrangement the U.S. president said he agreed with Putin during a phone call.\n\nRussia will immediately supply more than 300,000 tons of diesel, followed by 500,000 tons in November, and 1 million tons immediately thereafter, Trump said in a post on Truth Social . Moscow will then deliver another 3 million tons of diesel based on the condition of Russia's refineries, Trump said.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 07:12 PM IST", "pub_date_relative": "4h ago"}, {"title": "TCS senior employees miss quarterly variable pay as AI revenue rises nearly 20%; juniors get full payouts", "full_content": "Senior employees at Tata Consultancy Services (TCS) will not receive quarterly bonuses after the I-T giant failed to meet performance targets, Reuters reported citing an internal memo. This is the first time in at least two years all variable pay was withheld for some workers, it added.\n\n\"This decision was taken after careful consideration as our performance for the quarter fell short of internal targets,\u201d said chief human resource officer Sudeep Kunnumal in the memo.\n\nEmployees told Reuters the tech company usually gives 50-100% of variable pay . It cited them say that this is the first time in at least two years that the company has explicitly said no bonuses shall be awarded.\n\nNotably, TCS reported its weakest September-quarter sequential revenue growth \u200cin three years, signaling continued pressure on traditional IT services demand even as artificial intelligence ( AI )-related revenue jumped nearly 20%, the report said.\n\nThe uptick in AI revenue, however, was cheered by investors on Friday, 9 October, as the stock rose as much as 6.2%.\n\nIndia's $315 billion IT sector is also facing uncertainty after United States President Donald Trump 's administration suspended major IT outsourcers including TCS, Infosys, and HCLTech among others from a key green-card program on Thursday, 9 October, widening a crackdown it says targets fraud and protects American\u200c jobs.\n\nTCS on Friday reported a 15% jump in July-September quarter net profit to \u20b9 13,884 crore and pointed to continued growth momentum going forward, as per a PTI report.\n\nTCS posted a net profit of \u20b9 12,075 crore in the year-ago period and \u20b9 13,349 crore in the preceding June quarter. The company said its revenue from operations rose 11.22% to \u20b9 73,188 crore in the July-September period from \u20b9 65,799 crore in the year-ago period. In the June quarter, its topline stood at \u20b9 72,275 crore.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 07:08 PM IST", "pub_date_relative": "4h ago"}, {"title": "Pok\u00e9mon card values are soaring. What collectors should know before buying or selling", "full_content": "In 2022, a rare Topps 1952 Mickey Mantle baseball card \u2014 one of sports-card collectors' holiest grails \u2014 sold for $12.6 million. Wow, you say, that's a lot of dough for a thin piece of cardboard, slab of bubblegum not included.\n\nWell, what do you say about a 1998 Pikachu Illustrator Pok\u00e9mon card going for $16.5 million earlier this year? If you're pro wrestler and social media influencer Logan Paul, seller of the item, you say, Not a bad return on the $5.3 million (plus a trade) I paid for it in 2021.\n\nThose are extreme examples, but a vivid illustration of how TCGs \u2014 shorthand for competitive trading card games, led by Pok\u00e9mon, Magic: The Gathering and Yu-Gi-Oh! \u2014 are encroaching on an over-saturated sports-card market as an enticing investment opportunity. Throw in vintage and modern-day non-sports trading cards, depicting historical events and fictional characters ranging from the Civil War to Luke Skywalker, and it's a whole new ballgame.\n\nThe record $16.5 million Pok\u00e9mon card sale is drawing fresh attention to a collectibles market where grading, scarcity and authentication can determine whether a card is worth dollars or hundreds of thousands.\n\n\"It is one of our fastest-growing categories that we've seen and one of the largest contributors to [our] growth over the last number of quarters,\" said Adam Ireland, vice president and general manager of collectibles at online marketplace eBay , which also provides authentication and price guides for TCGs and non-sports cards. \"From an investment point of view, you start with Pok\u00e9mon,\" he said. \"It was the most searchable term within the eBay collectibles environment through the first half of the year.\"\n\nHeritage Auctions, which deals in art, jewelry, coins and many other collectibles, launched a dedicated TCG department six years ago. \"Now it's a $50-million category,\" said executive vice president Joe Maddalena. \"That's just TCGs.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 07:00 PM IST", "pub_date_relative": "4h ago"}, {"title": "NYC Costco worker sues company over female boss\u2019 alleged sexual harassment: \u2018You\u2019re a very busty woman!\u2019 - New York Post", "full_content": "NYC Costco worker sues company over female boss\u2019 alleged sexual harassment: \u2018You\u2019re a very busty woman!\u2019 New York Post", "source": "Google News Business", "pub_date_str": "10 Oct 2026, 06:51 PM IST", "pub_date_relative": "4h ago"}, {"title": "Flu season is already here. Here\u2019s what to know about this year\u2019s flu shots.", "full_content": "This year\u2019s flu season has arrived about seven weeks earlier than in 2025 or 2024.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:49 PM IST", "pub_date_relative": "4h ago"}, {"title": "\u2018People in the U.S. need to wake up\u2019: As a mortgage loan officer, I rejected applications from wealthy couples. Here\u2019s why.", "full_content": "\u201cPeople in the U.S. need to wake up.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:45 PM IST", "pub_date_relative": "4h ago"}, {"title": "SpaceX spectrum acquisition ripples through telecom stocks - Axios", "full_content": "SpaceX spectrum acquisition ripples through telecom stocks Axios SpaceX snaps up the 800 MHz spectrum T-Mobile dumped for $2.9 billion \u2014 and T-Mobile, Verizon, AT&T stocks are sliding Yahoo Finance Verizon posts worst day since 2002 as SpaceX U.S. network plans whack cell provider stocks CNBC SpaceX Makes Big Play to Become a Wireless Carrier WSJ Elon Musk\u2019s growing SpaceX empire sends AT&T, Verizon and T-Mobile shares plunging NBC News", "source": "Google News Business", "pub_date_str": "10 Oct 2026, 06:36 PM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Missile strikes passenger terminal at Riyadh airport and many are wounded, official says", "full_content": "The airport in Saudi Arabia's capital, Riyadh, was attacked again on Saturday and evacuated, two regional officials said, just days after three Saudi citizens, including a pilot, were killed as the kingdom faces an extraordinary series of assaults on the new front in the Iran war.\n\nPresident Donald Trump told reporters he was evaluating whether the U.S. should join Saudi strikes against the Iran-backed Houthi rebels in neighboring Yemen who have claimed this week's attacks on King Khalid International Airport as well as other Saudi airports, military facilities and oil infrastructure.\n\n\"We may. We're going to look at it,\" Trump said. \"We just found out about the recent attack. So we'll make a decision. We move very quickly.\"\n\nIn the latest attack, a missile struck a complex housing terminals 3 and 4 for domestic flights at the Riyadh airport, and many people were wounded, one of the regional officials said. They spoke on condition of anonymity because they weren't authorized to speak to the media. Ambulances were seen rushing there.\n\nThe surge in attacks has come in the week since a Saudi-led coalition launched a major military offensive against the Houthis. The Houthis made no immediate statement on Saturday.\n\nSaudi civil aviation authorities said operations at the airport had been suspended and that they were assessing the number of wounded and the damage. Police were heavily present at the airport, with all entrances blocked and lights around the complex dimmed.\n\nFlights diverted elsewhere, the Flightradar24 tracker said. Countries including the United States, Britain, Germany, Australia and Canada warned citizens to avoid the airport.\n\nThe attacks on airports, military facilities and oil infrastructure in Saudi Arabia, the world's top oil exporter, have rattled markets and the region.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 11:10 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Want to retire early? Here's how F.I.R.E strategy can help \u2014 We calculate corpus you will need", "full_content": "Retiring early is an ever-growing dream for a number of young professionals in India and around the world, as the \u2018Financial Independence, Retire Early\u2019 or FIRE method has evolved from a niche movement to more mainstream mass appeal.\n\nThe recent Bharosa Talks: India Retirement Index Study 6.0 (IRIS 6.0) report noted that as many as 7 in 10 urban Indians said they would exit the workforce early if money were no concern. However, only 11% of those surveyed were confident their retirement savings would actually last them a lifetime.\n\nA movement among millennial , Gen Z, and younger workforce, FIRE is a financial movement that calls for reducing expenditure in order to enable extreme savings (up to 75% of income) and investments with the goal of building enough corpus to retire at a younger age.\n\nThe most basic FIRE calculation is where you multiply the current annual expense by 25 and assume that number as the goal needed to retire comfortably. Once retired, most withdraw 3-4% of their savings annually to cover expenses.\n\nHowever, there are other iterations of the FIRE philosophy that have been developed as people look to tailor their savings to fit their goals. Here's a look at the other paths apart from the traditional FIRE strategy:\n\nUsing the common \u201825\u00d7 rule\u2019, here's how much you will need to accumulate to retire comfortably, at below illustrated income and lifestyle levels:\n\nDepending on your financial needs and goals, you can focus more on cutting spend or maximising income. This can be done through bank fixed deposits , equity investments, SIPs, mutual funds, government savings schemes and other assets.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 10:44 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EU-China trade relations hit crunch time as Brussels pushes for rebalancing", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 10:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Super Micro Contractor Pleads Guilty In $2.5 Billion AI Chip Diversion Case Linked To China", "full_content": "Ting-Wei \u201cWilly\u201d Sun pleaded guilty to four counts, including conspiracies to violate US export controls, smuggle goods and obstruct justice. Prosecutors alleged the scheme involved around $2.5 billion worth of US AI technology destined for China.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "DMart Q2 results: Avenue Supermarts Net Profit Rises 8% to Rs 804 Crore, Misses Estimates", "full_content": "The DMart operator's revenue from operations rose 18.4% to Rs 19,206 crore for the quarter ended on September 30, 2026, against Rs 16,219 crore in the same quarter the previous year.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Microsoft's Satya Nadella Calls For AI Accountability, Timely Disclosure Of System Failures", "full_content": "Microsoft CEO Satya Nadella calls for stronger AI safeguards, timely disclosure when systems fail and tools to trace agent behaviour to specific code paths as businesses embrace autonomous AI.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "No more tax relief for importing gold, silver and platinum: What does it mean? Will buyers pay more?", "full_content": "The government has ended tax relief for banks importing gold, silver and platinum. Banks must now pay 3% Integrated Goods and Services Tax, or IGST, upfront.\n\nAccording to Revenue Secretary Arvind Shrivastava, banks have paid this tax since 1 April 2026. The government informed the GST Council about the change on 8 October.\n\n\"This is done to ensure parity of taxes imposed on imports of gold and other metals through different routes,\" Reuters quoted Shrivastava as saying.\n\nThe exemption covered gold imports in 2017. It was later extended to other precious metals. Under this relief, banks could import these metals without paying IGST upfront. The exemption for banks and nominated agencies has now expired.\n\nBank imports, therefore, attract the 3% levy when shipments clear customs. This changes when importers must arrange money for tax payments.\n\nThe government wants different import routes to be subject to similar tax rules. Earlier, bank channels enjoyed an upfront tax advantage over alternative routes.\n\nEnding the waiver puts bank imports alongside shipments through organised trading platforms. One such platform is the India International Bullion Exchange in Gujarat\u2019s GIFT City.\n\nThe aim is to prevent tax rules from favouring a particular import route. Importers can then choose routes without that earlier tax advantage.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 09:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Targetting \u20b91.5 crore retirement corpus? Here's how to calculate how much you really need", "full_content": "HDFC Pension Fund Management's 2nd edition of the National Pension System Preference Index Study 2026 looked at consumer outlook on retirement planning and the NPS.\n\nIt found that preference for NPS among Indians has risen to 57 (out of 100), up three points from the inaugural 2023 reading of 54; and surveyed Indians preferred it as an instrument for retirement planning.\n\nThe study surveyed 1,812 consumers aged between 30-55 years, to understand their outlook towards retirement and financial preparedness at key life stages and track the change in preference for NPS over the last three years.\n\nAs per the report, emergency preparedness is gaining ground, though medical costs continue to lead; and retirement competes with health and children's education as top concerns. Meanwhile, rising healthcare costs and medical concerns continue to be the primary post-retirement worries\n\nFinancial adequacy forms a persistent second layer of concern\n\nThe ideal retirement corpus, though growing, still remains below recommended levels, it added. \u201cThe estimated retirement corpus continues to be underestimated. \u20b9 1.5 crore is the ideal retirement corpus savers now target, up from \u20b9 I.34 crore in 2023, still under 10x annual income,\u201d the report said.\n\nAs per the report, health concerns drive planning while complacency delays it, but most believe they're already provided for \u2014 the barrier isn't fear, it's a false sense of readiness, not anxiety.\n\nWhen it comes to saving for retirement, the study noted that surveyed consumers targetted \u20b9 1.5 crore as the ideal retirement corpus but added that this blanket number may not be the correct amount needed by all. It stated that your ideal retirement savings , must be at least 10x your current annual income.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 08:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "\u2018I feel like a loser\u2019: My stock portfolio is swinging wildly. Is it finally time to worry?", "full_content": "\u201cI presume these are sophisticated investors taking a profit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 08:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "JPMorgan makes bullish call in fixed income space, suggests it's a once in a generation opportunity", "full_content": "J.P. Morgan Asset Management is making a bullish call on an underinvested market group: high-quality fixed income.\n\nPriya Misra, a portfolio manager at the firm, sees a once in a generation opportunity for investors.\n\n\"You can actually take credit risk in the highest quality companies and still get [a] 6.5% [yield], Misra told CNBC's \"ETF Edge\" this week. \"So, you actually don't have to go down in credit [quality].\"\n\nShe suggested the strategy is particularly well suited for investors concerned about having too much exposure to artificial intelligence stocks.\n\n\"There's a huge AI exposure,\" Misra said. \"What fixed income gives you is this diversified set of returns. It's not just an AI trade or a tech trade. You have the Treasury trade. You have credit outside of AI.\"\n\nMisra co-manages the JPMorgan Core Plus Bond Fund ETF (JCPB) . The fund has almost $16 billion in assets under management, with just over three-quarters of its holdings in BBB-rated debt and above, according to the firm's website as of Aug. 31.\n\n\"We've actually been increasing some of the double-B [and] single-B exposure because there has been a widening in high yield spread,\" she said. \"We like some investment grade. And now, we've started in the last few days to increase some duration as well, thinking we may be nearing the end of that rate move.\"\n\nThe JPMorgan Core Plus Bond Fund ETF is down more than 5% so far this year as of Friday's close, according to FactSet.", "source": "CNBC Finance", "pub_date_str": "10 Oct 2026, 08:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Portfolio Management"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Adani Defence & Aerospace Wins SIDM Champion Award For Defence Export Performance", "full_content": "Defence Minister Rajnath Singh presented the award in the presence of Defence Secretary Rajesh Kumar Singh and Director General (Acquisition) A. Anbarasu.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 08:17 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Vance says Microsoft replaced laid-off workers with foreign hires. Here\u2019s what the visa data shows", "full_content": "As the Trump administration announced Thursday that it suspended eight tech companies from sponsoring foreign workers for green cards, Vice President JD Vance singled out Microsoft , claiming it replaced the 6,000 workers it laid off in 2025 with people on H-1B work visas.\n\nThe suspension of the Labor Department's PERM program for green cards, which grant permanent residency to immigrants, doesn't affect H-1Bs, which are temporary work permits, but H-1B approval data shows how heavily these companies rely on foreign workers.\n\nData from the U.S. Citizenship and Immigration Services' H-1B Employer Data Hub also shows that Amazon and Meta were the biggest sponsors of H-1B visas, and neither was suspended.\n\nThe crackdown went beyond tech. At the same news conference Thursday, the Labor Department's inspector general, Anthony D'Esposito, announced an investigation into alleged J-1 visa fraud involving nine major American universities. Trump supporters have long argued that these programs undercut American workers by incentivizing employers to hire from abroad.\n\nAll eight suspended companies rank among the nation's top 50 H-1B sponsors. Most are IT services and consulting firms. Adobe is the smallest, at No. 45.\n\nAmazon, with 19,178 H-1B approvals in fiscal 2025, and Meta, with 6,294, were the top two sponsors, and neither was suspended. Microsoft was a close third with 6,258, according to the USCIS data hub. Microsoft out-sponsored Amazon for years. Amazon passed Microsoft in 2017 and now gets about three times as many approvals.\n\nThe numbers cut both ways. Microsoft did receive more than 6,000 H-1B approvals last year, as Vance said. But 2 in 3 went to people already working there. Amazon, which brought in nearly four times as many H-1B workers new to the company, was not on the suspension list.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 07:52 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "300-member Canadian trade delegation heads to India as countries look to firm up ties", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 300-member Canadian trade delegation heads to India as countries look to firm up ties The Economic Times daily newspaper is available online now. Read Today's Paper 300-member Canadian trade delegation heads to India as countries look to firm up ties SECTIONS 300-member Canadian trade delegation heads to India as countries look to firm up ties ET Online Last Updated: Oct 10, 2026, 07:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Canada is preparing to send a significant trade delegation to India, aiming to enhance commercial relationships. Led by Minister Maninder Sidhu, the mission will focus on expanding partnerships in aerospace, agri-food, and clean technology. This event will coincide with ongoing negotiations for a Comprehensive Economic Partnership Agreement aimed at elevating bilateral trade. Canadian businesses hope to connect with Indian leaders and boost employability in Canada.\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "10 Oct 2026, 07:46 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sebi\u2019s CAS guidelines likely within a week, says chief Tuhin Kanta Pandey", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi\u2019s CAS guidelines likely within a week, says chief Tuhin Kanta Pandey The Economic Times daily newspaper is available online now. Read Today's Paper Sebi\u2019s CAS guidelines likely within a week, says chief Tuhin Kanta Pandey SECTIONS Sebi\u2019s CAS guidelines likely within a week, says chief Tuhin Kanta Pandey By Kumar Gaurav , ETMarkets.com Last Updated: Oct 10, 2026, 07:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi chairman Tuhin Kanta Pandey said the regulator expects to issue guidelines on the settlement-price mechanism for derivatives on expiry days within a week. The move follows a review of the Closing Auction Session. Sebi is also working on simpler regulations, easier market access, lower compliance costs and stronger technological resilience.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 07:28 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "TCS senior employees miss quarterly variable pay as AI revenue rises nearly 20%; juniors get full payouts", "full_content": "Senior employees at Tata Consultancy Services (TCS) will not receive quarterly bonuses after the I-T giant failed to meet performance targets, Reuters reported citing an internal memo. This is the first time in at least two years all variable pay was withheld for some workers, it added.\n\n\"This decision was taken after careful consideration as our performance for the quarter fell short of internal targets,\u201d said chief human resource officer Sudeep Kunnumal in the memo.\n\nEmployees told Reuters the tech company usually gives 50-100% of variable pay . It cited them say that this is the first time in at least two years that the company has explicitly said no bonuses shall be awarded.\n\nNotably, TCS reported its weakest September-quarter sequential revenue growth \u200cin three years, signaling continued pressure on traditional IT services demand even as artificial intelligence ( AI )-related revenue jumped nearly 20%, the report said.\n\nThe uptick in AI revenue, however, was cheered by investors on Friday, 9 October, as the stock rose as much as 6.2%.\n\nIndia's $315 billion IT sector is also facing uncertainty after United States President Donald Trump 's administration suspended major IT outsourcers including TCS, Infosys, and HCLTech among others from a key green-card program on Thursday, 9 October, widening a crackdown it says targets fraud and protects American\u200c jobs.\n\nTCS on Friday reported a 15% jump in July-September quarter net profit to \u20b9 13,884 crore and pointed to continued growth momentum going forward, as per a PTI report.\n\nTCS posted a net profit of \u20b9 12,075 crore in the year-ago period and \u20b9 13,349 crore in the preceding June quarter. The company said its revenue from operations rose 11.22% to \u20b9 73,188 crore in the July-September period from \u20b9 65,799 crore in the year-ago period. In the June quarter, its topline stood at \u20b9 72,275 crore.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 07:08 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpaceX spectrum acquisition ripples through telecom stocks - Axios", "full_content": "SpaceX spectrum acquisition ripples through telecom stocks Axios SpaceX snaps up the 800 MHz spectrum T-Mobile dumped for $2.9 billion \u2014 and T-Mobile, Verizon, AT&T stocks are sliding Yahoo Finance Verizon posts worst day since 2002 as SpaceX U.S. network plans whack cell provider stocks CNBC SpaceX Makes Big Play to Become a Wireless Carrier WSJ Elon Musk\u2019s growing SpaceX empire sends AT&T, Verizon and T-Mobile shares plunging NBC News", "source": "Google News Business", "pub_date_str": "10 Oct 2026, 06:36 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How Supreme Court justices are leaning in major 401(k) case over private funds and underperformance", "full_content": "The Supreme Court heard a major case this week concerning an Intel retirement plan which could result in a decision that influences employers' appetite for private investments in 401(k)s.\n\nMany plan sponsors are in limbo, awaiting the Supreme Court decision and finalized Labor Department rules covering alternative investments before changing their 401(k) menu, even as the asset management industry is gearing up with new products.\n\n\"I think companies want to know what's going to happen with the proposal and what's going to happen with the Supreme Court case before they go rushing in to change their investment strategies,\" said Elizabeth Hopkins, principal at Hopkins ERISA Law and a former senior trial attorney with the Labor Department, who filed an amicus brief in the Supreme Court case on behalf of former high-ranking DOL officials.\n\nHere's what employers and employees need to know about forces influencing the market for private investments in 401(k) plans.\n\nEmployers have been whipsawed for the past several years by changing government policies on alternative investments in 401(k) plans and a high-profile lawsuit filed in 2019 by a former Intel employee. That case, Anderson v. Intel Corp. Investment Policy Committee, which the Supreme Court heard oral arguments on Tuesday, Oct. 6, concerns private investments in a defined contribution plan like a 401(k) and the circumstances under which these investments are appropriate.\n\nThe case is not challenging whether alternative assets like hedge funds and private equity can be used in a 401(k) plan alongside stocks and bonds. Rather, the question before the court is whether a retirement plan underperformance claim requires alleging a \"meaningful benchmark.\" The heart of the dispute is how to handle claims by employees that plan sponsors have invested their retirement funds imprudently.\n\nEmployees contend that the relatively low returns on Intel's plans reflect a breach of fiduciary duty. The lower courts disagreed.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 06:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "5 personal finance lessons from international bestseller \u2018Die with Zero\u2019 by Bill Perkins", "full_content": "Most of us learn to save as much money as possible. Bill Perkins offers a different view in \u2018Die with Zero\u2019. The American hedge fund manager says money should help us enjoy meaningful experiences. A large bank balance at death can mean missed chances to live fully.\n\nA bigger bank balance should not become your only goal. Perkins says money should support a full and happy life. Think about the experiences you want, then spend time with that purpose.\n\nHe also questions working for too many years. Extra earnings may buy things you do not need. You cannot get those years of your life back.\n\nGood experiences keep giving you happiness through memories. Bill Perkins calls these benefits \u201cmemory dividends\u201d. A family holiday or concert can leave stories you share for years. Such memories can also bring you closer to loved ones.\n\nAn experience enjoyed earlier gives you more years to remember it. Perkins encourages readers to build memories while they can enjoy them. Think about a trip that still makes you smile today.\n\nSome activities are easier at certain stages of life. Trekking, for example, is easier at thirty than at eighty. Health and energy can decline as you grow older.\n\nPerkins suggests listing things you want to do. Then, place them into suitable age groups, or \u201ctime buckets\u201d.\n\nThis helps you avoid delaying experiences until they become difficult. Looking after your health also keeps more choices open for longer.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 06:25 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why Nvidia\u2019s stock is dodging the AI credit scare that is crushing Broadcom and Oracle", "full_content": "The P/E ratios have contracted and the CDS spreads have widened in all three cases, but Nvidia appears unscathed", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 06:00 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Hollywood takes on Zuckerberg, Musk and Altman amid widespread anxiety over AI", "full_content": "This weekend marks the kickoff of a slew of films centered on some of the biggest figures in technology and artificial intelligence , as public concern about the industry grows.\n\nSony Pictures' \" The Social Reckoning \" is expected to open to around $7 million domestically this weekend. The scripted film is a follow-up to Aaron Sorkin's \"The Social Network\" from 2010, which went on to win three Academy Awards. While Sorkin's first \"Social\" film focused on Meta CEO Mark Zuckerberg 's founding of the company, \"The Social Reckoning\" follows the 2021 leak by Facebook whistleblower Frances Haugen, who exposed internal documents from the tech giant.\n\n\"It brought back really warm memories for me,\" Haugen told CNBC recently about the film. \"And so I felt it captured the spirit of that time period.\"\n\nThe box office this weekend will also see a limited release of Alex Gibney's nearly four-hour Elon Musk documentary, called \"Musk.\" Early showings have drawn critical acclaim, but it's also been criticized by Musk himself on X, saying the film has zero integrity.\n\n\"You Can See Everything,\" the documentary about disgraced Theranos founder Elizabeth Holmes by Nathan Fielder and Lance Oppenheim via A24 Films, releases on Oct. 16.\n\nChristmas brings \"Artificial\" from Neon to theaters. The scripted film depicts OpenAI CEO Sam Altman and his brief firing from the role in 2023.\n\n\"It looks like an awful movie, but I appreciate people's creativity, and I really do support that,\" Altman recently told CNBC. \"I get why people have anxiety. And also if they need to, like, project that anxiety onto someone or have a little bit of relief and poke fun at me, it doesn't bother me.\"\n\nNetflix is also joining in. The streamer's latest installment of its \"Instadocs\" series will premiere on Monday, highlighting the Hugging Face incident, in which a swarm of OpenAI agents escaped a testing environment and autonomously hacked into the company's infrastructure.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 05:30 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u2018What you don\u2019t know is greater than anything you do know\u2019: How Ray Dalio would build a portfolio to withstand a popping AI bubble", "full_content": "Look for inflation protection and unappreciated players in artificial intelligence, says the famed hedge-fund founder.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Oct 2026, 05:30 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India\u2019s central bank tries to shore up rupee as it nears record lows", "full_content": "Rise in energy costs due to US-Israel war on Iran has put downward pressure on the currency of the world\u2019s fastest-growing major economy", "source": "FT Markets", "pub_date_str": "10 Oct 2026, 0     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
