"11m ago"}, {"title": "Bessent warns Zelenskyy to 'be very careful' about claims U.S. is throttling Starlink", "full_content": "U.S. Treasury Secretary Scott Bessent warned Ukrainian President Volodymyr Zelenskyy on Sunday to \"be careful\" in public statements about U.S. support for Ukraine .\n\nU.S.-provided Starlink internet was recently restricted in Ukraine, hindering the war-torn country's ability to respond to Russian assaults. Ukraine uses Starshield, the military and government-controlled version of the commercial Starlink, to conduct military operations.\n\nIn an earlier interview on NBC's \"Meet the Press,\" Zelenskyy said he believed the U.S. government was responsible for the slowdown, and that Ukraine was \"blocked\" from U.S. intelligence for a period of time. Zelenskyy said Starshield-linked vehicles and drones are still being restricted in speed.\n\n\"President [Donald] Trump and Secretary [Marco] Rubio have categorically said that no one under the Trump administration did that, and I think it is very reckless for President Zelenskyy to make such a charge,\" Bessent said on \"Meet the Press.\"\n\n\"President Zelenskyy should be very careful about making statements like this that aren't true,\" he added.\n\nStarlink, high-speed satellite internet provided by Elon Musk's SpaceX , is critical to Ukraine's defense. Musk himself said in a post on X last week that the U.S. government and President Donald Trump are \"ultimately\" responsible for any slowdowns to the military version of Starlink known as Starshield .\n\n\"Starshield systems are owned and controlled by the US government,\" Musk wrote. \"Any limits on speed or usage are decided by the US military and ultimately POTUS.\"\n\nReuters reported last week that the White House ordered the technology restrictions, but Trump has denied responsibility for the slowdown.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 09:50 PM IST", "pub_date_relative": "17m ago"}, {"title": "\u2018Some people did everything right\u2019: I lost my home in the Great Recession. I rent in my 50s. Why is that judged as failure?", "full_content": "\u201dI earn $110,000 a year.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 09:45 PM IST", "pub_date_relative": "23m ago"}, {"title": "NRI's \u20b93.41 crore FCNR deposits flagged as unexplained money after tax officer mistook yen for rupees, ITAT gives relief", "full_content": "The Jaipur tribunal deleted the addition after finding that bank records established the source of two foreign-currency deposits and the tax department had accepted the explanation in the woman's husband's case.\n\nA Dubai-based non-resident Indian (NRI) has won relief from a \u20b9 3.41 crore income tax addition after the Income Tax Appellate Tribunal (ITAT), Jaipur, found that the assessing officer had mistaken Japanese yen figures for Indian rupees while examining two foreign currency deposits.\n\nIn its order dated 22 September 2026 in Deputy Commissioner of Income Tax v. Kavita Khanwani (ITA No. 867/JPR/2025, assessment year 2018-19), the tribunal upheld the Commissioner of Income Tax (Appeals)' decision to delete the addition made under Section 69A of the Income-tax Act, 1961, which deals with unexplained money.\n\nThe tribunal found that the deposits were funded through a joint Non-Resident External (NRE) savings account, with bank records tracing the money to transfers made through banking channels. It also noted that the tax department had accepted the explanation for the same deposits in the woman's husband's assessment.\n\nKhanwani, who lives in Dubai, held two Foreign Currency Non-Resident (FCNR) term deposits jointly with her husband, Kishan Chand. He was the first holder of both deposits, while she was the second holder.\n\nThe deposits were denominated in Japanese yen. The first, opened on 14 October 2017, had a principal of 1.726 crore yen, while the second, opened on 21 February 2018, had a principal of 1.658 crore yen.\n\nHowever, the assessing officer treated the foreign-currency figures as rupee amounts and added \u20b9 3.41 crore to Khanwani's income as unexplained money for assessment year 2018-19.\n\nThe tribunal found that the principal of the two deposits was approximately 3.38 crore yen, while the actual rupee amount invested was about \u20b9 2 crore.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 09:35 PM IST", "pub_date_relative": "33m ago"}, {"title": "Tiger Shroff Assassination Attempt: Fadnavis Seeks Swift Probe; 15 Teams To Investigate", "full_content": "Fadnavis told the police commisioner to take strict action against the assailants who targeted Tiger Shroff and to undertake a speedy investigation.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:33 PM IST", "pub_date_relative": "34m ago"}, {"title": "Pepsi was a small town\u2019s biggest employer. Layoffs left it blindsided. - The Washington Post", "full_content": "Pepsi was a small town\u2019s biggest employer. Layoffs left it blindsided. The Washington Post", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 09:32 PM IST", "pub_date_relative": "35m ago"}, {"title": "Real Madrid Vs Sevilla Live Streaming: Likely Lineups; Where To Watch LaLiga Match On TV, Online In India?", "full_content": "Real Madrid have collected 18 points from eight matches and sit fourth in the standings. Sevilla are fifth with 14 points from the same number of games.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:30 PM IST", "pub_date_relative": "37m ago"}, {"title": "My sister moved in with our mother, 78, and says she deserves the $925,000 family home. Is she right?", "full_content": "\u201cThe house is worth $925,000 and mom owns it outright. She also has $480,000 in investments.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 09:30 PM IST", "pub_date_relative": "38m ago"}, {"title": "Tiger Shroff Firing Sparks Alarm In Mumbai; Bishnoi Gang Issues Salman Khan Threat", "full_content": "Tiger Shroff escaped injury in the Juhu firing incident, while an audio message attributed to the Bishnoi gang claims the attack and makes references to Salman Khan.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:27 PM IST", "pub_date_relative": "40m ago"}, {"title": "What\u2019s next for IDBI Bank stock after Q2 net profit slumps 39%, massive Fairfax deal? Key factors investors should watch", "full_content": "IDBI Bank shares are likely to remain in focus on Monday, October 19, after the lender reported a 39% year-on-year decline in standalone net profit for the September quarter of FY27, largely reflecting the absence of a one-time gain recorded in the year-ago period.\n\nInvestors will assess the bank's earnings performance alongside the proposed Fairfax acquisition deal when trading resumes on Monday.\n\nIDBI Bank stock rose 0.80%, or \u20b9 0.67, to close at \u20b9 84.12 on Friday. However, it remains down 18.98% year to date.\n\nThe Life Insurance Corporation of India (LIC)-controlled lender reported a net profit of \u20b9 2,205 crore for the second quarter ended September 2026, compared with \u20b9 3,627 crore in the corresponding period last year.\n\nThe year-ago profit included a one-time gain of \u20b9 1,698.96 crore from the sale of the bank's strategic investment in National Securities Depository Ltd (NSDL). IDBI Bank had offered more than 2.22 crore equity shares, representing an 11.11% stake in NSDL, in its initial public offering at an issue price of \u20b9 799.87 per share.\n\nIDBI Bank's total income increased to \u20b9 9,865 crore in the September quarter from \u20b9 9,594 crore a year earlier, according to its regulatory filing.\n\nInterest income rose to \u20b9 8,512 crore from \u20b9 7,104 crore in the year-ago quarter. Net interest income (NII), which represents the difference between interest earned and interest paid, increased 29% to \u20b9 4,228 crore from \u20b9 3,285 crore.\n\nHowever, non-interest income declined 46% to \u20b9 1,353 crore from \u20b9 2,489 crore in the corresponding quarter last year. Operating profit consequently fell to \u20b9 2,893 crore from \u20b9 3,523 crore.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 09:27 PM IST", "pub_date_relative": "40m ago"}, {"title": "Tiger Shroff Assassination Attempt: Bishnoi Gang Claim, Salman Khan Threat \u2014 What We Know", "full_content": "Tiger Shroff escaped injury after motorcycle-borne assailants opened fire near his car in Mumbai's Juhu area. His driver was injured, while an audio message claiming responsibility surfaced online and renewed concerns over threats directed at Bollywood personalities.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:22 PM IST", "pub_date_relative": "45m ago"}, {"title": "Trump endorses Israeli Prime Minister Netanyahu for reelection amid Iran war", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 09:20 PM IST", "pub_date_relative": "47m ago"}, {"title": "Dow Jones Futures Loom After S&P 500, Nasdaq Break Support; Will Meta Save AI? - Investor's Business Daily", "full_content": "Dow Jones Futures Loom After S&P 500, Nasdaq Break Support; Will Meta Save AI? Investor's Business Daily 'Just another scare': Wall Street sees the AI trade strong despite tech's latest rout Yahoo Finance Nasdaq sinks more than 2% as investors raise questions about AI debt CNN Tech stocks erase $1 trillion of wealth as oil surges to $110 for the first time since May NBC News AI Fears Are Rocking Markets. The Brave Should Buy the Dips. Barron's", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 09:20 PM IST", "pub_date_relative": "48m ago"}, {"title": "Dental floss is shedding potentially harmful chemicals - The Washington Post", "full_content": "Dental floss is shedding potentially harmful chemicals The Washington Post", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 09:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil Rally Lifts Saudi Stocks, While Qatar And Egypt Markets Tumble", "full_content": "Saudi Aramco shares rose 2.1% as Brent crude settled at $109.86 a barrel, while Qatar's benchmark hit its lowest closing level since April 2020.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here are the 3 big things we're watching in the stock market this week", "full_content": "Meta and Capital One are set to report earnings. We'll also hear from plenty of important companies outside the Club portfolio.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 08:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Maharashtra Drought Crisis: IAS, IPS Officers To Donate One Day\u2019s Salary To Aid Farmers", "full_content": "Maharashtra IAS and IPS officers will donate one day's October salary to aid drought-hit farmers across 305 talukas. The state has announced loan relief, land revenue exemptions and education fee waivers to support affected families.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 08:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m 64 with two sons, but only one works in the family business. Is it ethical to leave him 70% of the company?", "full_content": "\u201cI have some reservations about the long-term stability of my younger son\u2019s marriage.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 08:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Want to retire early? How to split \u20b91 lakh in monthly investments between short-term goals and FIRE, expert explains", "full_content": "For someone looking to retire early, deciding how much to invest towards financial independence and early retirement (FIRE) versus short-term financial goals can be a balancing act. While investing more today can help build a retirement corpus faster, goals such as buying a car, making a house down payment or funding other planned expenses also require money within a specific timeframe. Diverting too much towards either could mean delaying other goals or falling short of the retirement corpus needed to sustain a longer retirement.\n\nThe key is to calculate how much each goal requires and how soon the money will be needed, rather than follow a fixed allocation, says Jasmeet Singh, executive director at Anand Rathi Wealth.\n\nFor someone investing \u20b9 70,000 or \u20b9 1 lakh a month, the split between short-term goals and FIRE will depend on these requirements, as well as the time available to build the retirement corpus.\n\nConsider someone investing \u20b9 70,000 a month who wants to buy a car worth \u20b9 9.6 lakh in two years. If they have no existing savings for the purchase and do not account for investment returns, they would need to set aside \u20b9 40,000 every month towards the car. The remaining \u20b9 30,000 could go towards FIRE .\n\nFor someone investing \u20b9 1 lakh a month, the allocation would depend on the cost and timeline of their other goals. Investors should first calculate the monthly contribution required for each goal and then divide their available savings accordingly, rather than follow a predetermined percentage.\n\nThe investment choice should also reflect when the money will be needed. Money earmarked for a goal within two years should ideally be kept in low-risk debt instruments, Singh says. This reduces the risk of market volatility affecting funds needed by a specific deadline.\n\nFor FIRE, investors with a long investment horizon and suitable risk appetite can consider an allocation of 80% equity and 20% debt.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 08:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m 63 and diagnosed with lymphoma. Should I take my Social Security next year?", "full_content": "\u201cMy plan is to continue working as long as I\u2019m able to do so and invest my Social Security benefits while I\u2019m still earning a paycheck.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Midterms: UBS assigns a 50% probability to a Democratic sweep", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 08:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Maha Navami 2026: Is It On October 19 Or 20? Date, Tithi Timings, Puja Vidhi And Fasting Rules", "full_content": "Maha Navami 2026 will be observed on October 19, with Bengali Durga Puja marking it on October 20. Check the Navami Tithi timings, puja rituals, fasting rules and Sandhi Puja details.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 08:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "India's exports rise across geographies; Africa, ASEAN lead growth in Apr-Aug", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India's exports rise across geographies; Africa, ASEAN lead growth in Apr-Aug The Economic Times daily newspaper is available online now. Read Today's Paper India's exports rise across geographies; Africa, ASEAN lead growth in Apr-Aug SECTIONS India's exports rise across geographies; Africa, ASEAN lead growth in Apr-Aug ET Online Last Updated: Oct 18, 2026, 08:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's merchandise exports increased significantly across different regions from April to August this fiscal year. Exports to Africa saw a notable rise of 47 percent, reaching USD 26.19 billion. The ASEAN region also experienced a substantial growth of 56 percent in exports, totaling USD 23.08 billion. Furthermore, shipments to North-East Asia rose by 37 percent, amounting to USD 21.03 billion. Overall, India's total merchandise exports rose by 18.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "18 Oct 2026, 08:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "JPMorgan raises ICICI Bank stock price target on strong earnings", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 08:05 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nestle Says Nescafe Drinks Are Safe After FSSAI Flags Labelling Issues", "full_content": "FSSAI has questioned the classification of Nescaf\u00e9 Intense Caf\u00e9 Cappuccino, Choco Mocha and Chilled Latte, citing differences in packaging labels and online listings.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 08:04 PM IST", "pub_date_relative": "2h ago"}, {"title": "Kolkata Durga Puja Stampede: 7 Accused Sent To 10-Day Police Custody", "full_content": "The accused were given 10 days of police custody by a local court on Sunday.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "FD maturity mistake: Fixed deposit matured but you forgot to withdraw money? What happens to your amount? Renew or not?", "full_content": "A fixed deposit offers predictable returns over a specified tenure, making it a preferred investment option for traditional or risk-averse investors. However depositors may sometimes fail to claim their maturity proceeds on time if they overlook bank notifications or do not receive them at all.\n\nIn such cases, the accumulated corpus does not simply disappear but the returns on the amount after maturity may differ from the original FD rate, depending on the bank's rules and whether the deposit was set up for automatic renewal.\n\nA matured fixed deposit may be repaid to the depositor or renewed depending on the instructions recorded for the deposit. Here's what happens to your money in different scenarios if you do not take any action post maturity:\n\nIf no action is taken within 10 years from the FD's date of maturity, it is classified as an \u201cunclaimed deposit\u201d and is transferred out of the bank.\n\nTherefore, as per RBI rules, on the last working day of the month following the month in which the 10-year period is completed, the bank calculates the total outstanding amount and transfers it to the depositor education and awareness (DEA) fund maintained by the central bank.\n\nThis does not mean the money is gone. The RBI simply serves as the custodian of these unclaimed deposits, and the depositor continues to have the right to claim the principal along with the applicable interest rate determined by the central bank until they or their legal heir claims it.\n\nIn case of the depositor's demise, the nominee or legal heir must provide evidence of the person's death along with their identification documents. The financial institution then facilitates the transfer of the fixed deposit amount to the nominee, ensuring a seamless transition of the investment.\n\nYou can choose to renew your their fixed deposit if you do not need the money in the near future and want to continue earning returns.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 07:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Grok Bot Wants To Be In Your Chats, Contracts, And Shopping Cart. Amazon Is In Its Way", "full_content": "Grok Bot is now three times faster at computer tasks, with quicker replies, improved voice calls and X DM integration. Updates also include a redesigned interface, email aliases and connections to services like Coinbase, Trello and Robinhood.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "4 red flags \u2013 and 1 truth \u2013 amid the peptide hype - USA Today", "full_content": "4 red flags \u2013 and 1 truth \u2013 amid the peptide hype USA Today The [almost] unbelievable relationship between \u201cbig pharma\u201d and gray-market peptides Peter Attia MD Peptides Are Everywhere\u2014Here\u2019s What Doctors Want You to Know Before Trying Them Real Simple Some who have taken hyped, unregulated peptides have regrets Yahoo People say these peptides hurt them. Their stories are muffled in MAHA\u2019s push for medical freedom CNN", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 07:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "France Struggles To Contain Fallout From Nationwide Protests", "full_content": "The clashes come at a critical time for the country, with a presidential election looming in April.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "Best-performing SIFs: Quant leads hybrid long-short funds with 25.5% returns in 6 months; check how peers performed", "full_content": "Quant Mutual Fund\u2019s QSIF Hybrid Long-Short Fund delivered a 25.5% return over six months, outperforming six other hybrid long-short Specialised Investment Funds (SIFs) with available data for the period. Aditya Birla Sun Life Mutual Fund\u2019s Apex Hybrid Long-Short Fund ranked second, with a return of 6.78%, according to the SIF360 tracker.\n\nQSIF\u2019s lead extends to shorter and longer periods. The fund returned 20.58% over three months and 28.82% since inception, ahead of its peers on both measures. Most of the funds with available six-month data returned less than 5% over the period. However, these schemes have relatively short track records, making it important for investors to assess their investment strategies, portfolio risks and performance over time rather than rely on returns alone.\n\nQuant's six-month return exceeded Apex's by 19.22 percentage points. None of the other six funds with available data crossed 7%, while four delivered less than 5%.\n\nQuant's QSIF returned 20.58% over three months, compared with 4.06% for Apex, the second-ranked fund over that period. Since inception, QSIF has gained 28.82%, while Edelweiss Mutual Fund's Altiva Hybrid Long-Short Fund ranked second with a 9.54% return.\n\nUnlike a conventional equity mutual fund that primarily invests in stocks, Quant's strategy combines equity, debt and money market instruments with exposure to real estate investment trusts (REITs) and infrastructure investment trusts (InvITs). It can adjust allocations according to market conditions and its economic outlook.\n\nUnder the stated investment framework, equity and equity-related instruments can account for 25-75% of the portfolio, while debt and money market instruments can also account for 25-75%. REITs and InvITs have an allocation range of 0-20%.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 07:32 PM IST", "pub_date_relative": "2h ago"}, {"title": "Romanian F-16 fighter jets shoot down two drones over Romanian territorial waters", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 07:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "The bloated workweek is coming for Sundays\u2014as some embrace flexibility, others worry about job security", "full_content": "Alessia Montanaro is just about to close her second busy season of the year. Since September she's been logging up to 60 hours of work per week, sometimes going as late as 11 p.m., and making a habit of working Sundays from her home office.\n\nThe 30-year-old works in public accounting in Austin, Texas, and has gotten used to these sprints around tax season. She's not the only weekend work warrior.\n\nFor many office workers, Sundays have become the unofficial new start to their workweek: Nearly half of workers often clock in on Sundays, according to a recent report from Owl Labs , the video-conferencing technology company, which surveyed 2,000 people in July with a margin of error of 2%. Some 21% of people surveyed say they work the whole or nearly the whole day, and another 24% say they often do a few hours of work.\n\nOf the remaining set of workers, 11% say they quickly check messages but don't really work, 18% say they rarely do any work on Sundays, and 26% say they never do.\n\nIt's been six years since work for many moved home during the Covid-19 pandemic, opening the possibilities of logging hours anytime and anywhere there's Wi-Fi. While some people deprioritized work and put up strict boundaries to protect their personal time, tech use data shows that many years later, working time has bled into every hour of every day. Chat messages sent outside of the standard Monday through Friday 9 a.m. to 5 p.m. workweek rose 15% year-over-year, now up to an average 58 messages per user, according to Microsoft's 2025 research on what it calls the rise of the \" infinite workday .\"\n\nAmong those working on the weekends, nearly 20% check their email before noon on a Saturday and Sunday, and over 5% are in their inboxes on Sunday nights, per Microsoft.\n\nAs far as these online habits show, the sanctity of Sundays off may be vanishing as an always-on work culture takes over.\n\nSome Sunday workers say working weekends or after hours is the only way to get focused work done.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 07:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "These surprising stocks could be some of the biggest drivers of S&P 500 earnings growth", "full_content": "Boeing, Meta and EchoStar recorded steep charges and expenses a year ago, which are expected to make this latest quarter\u2019s results look especially strong by comparison.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 07:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Reliance Jio IPO buzz reaches crypto market! Bitget launches Jio pre-IPO futures ahead of launch - Details for investors", "full_content": "Jio Platforms IPO buzz reaches crypto market: The initial public offering (IPO) of Jio Platforms Limited is set to open for subscription this week, but its IPO buzz has already reached the cryptocurrency market. Crypto exchange Bitget listed Jio pre-IPO perpetual futures contract last week.\n\nKnown as the JIOUSDT contract,the crypto-based futures contract would let traders speculate on Jio Platforms\u2019 pre-IPO price movements. They can participate in it without actually owning its shares.\n\nJIOUSDT is a pre-IPO perpetual futures contract. It lets traders use a speculative financial instrument tied to the company\u2019s anticipated market valuation. As per Bitget website, it can be traded 24x7, year-round and are settled directly in USDT. Jio pre-IPO perpetual futures will offer up to 20x leverage, with funding fees settled every eight hours.\n\nThe contract has traded around the clock since its launch on Wednesday, October 14, with its price hovering near $ 11.9. Perpetual futures contracts have no expiry, with periodic funding payments between longs and shorts that help keep prices aligned with the underlying market.\n\nTraders can participate in JIOUSDT by making positions on market expectations for Jio valuation. The financial instrument would let traders capture speculation around event-driven moves related to Jio IPO, subscription demand, and grey market premium (GMP).\n\nJio IPO GMP today was recorded at \u20b9 250, as per media reports at 7 pm on Sunday, October 18. Its IPO grey market premium increased on Sunday compared to its level recorded yesterday.\n\nWith this, Jio IPO is expected to be listed at \u20b9 1369 (which is the sum of latest GMP and upper price band, i.e. \u20b9 1369). Considering its latest grey market premium, Jio IPO is expected to be listed with 22.34% gain.\n\nJio Platforms Limited is a leading technology platform combining panIndia digital connectivity with digital services to drive India\u2019s digital transformation.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 07:29 PM IST", "pub_date_relative": "2h ago"}, {"title": "Iran says it has a 'new operational plan' if the U.S. resumes attacks, as shipping vessels report strikes", "full_content": "A senior Iranian security official warned Sunday that Tehran has prepared a new response plan for any renewed U.S.-Israeli attack, as maritime authorities reported several separate attacks on commercial vessels around the Arabian Peninsula.\n\n\"Iran's armed forces have prepared a response to any new act of adventurism that would be far more devastating than the 12-day and 40-day wars,\" Mohsen Rezaei, secretary of Iran's Supreme National Security Council, said in a post on X, referring to attacks by Israel in June 2025, and the conflict triggered by the U.S. and Israel in February.\n\n\"Iran's new operational plan will not follow the rules with which they are familiar,\" Rezaei said in comments translated by Google.\n\nPresident Donald Trump said last week that he does not intend to use nuclear weapons against Iran or foresee deploying ground troops in the country.\n\nSpeaking in an interview with Newsmax, broadcast Thursday evening, he said: \"I wouldn't use nuclear. We don't have to. We're the greatest nuclear power in the world.\"\n\nThe right-wing cable outlet asked Trump about reports that Washington was considering using the GBU-43/B Massive Ordnance Air Blast, or MOAB, widely known as the \"Mother of All Bombs.\"\n\nIranian state media agency IRNA quoted Foreign Minister Abbas Araghchi as saying that while Iran would not surrender its sovereign rights under pressure, it remains ready for dialogue.\n\nMeanwhile, shipping vessels operating in waters around the Arabian Peninsula reported coming under fire in recent days.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 07:22 PM IST", "pub_date_relative": "2h ago"}, {"title": "Ranabaali Box Office Collection Day 3: Vijay Deverakonda Starrer Continues To Draw Audiences", "full_content": "Ranabaali collects Rs 5.51 crore on Day 3, taking its India gross to Rs 21.76 crore. The Vijay Deverakonda starrer records 48.4% occupancy across 1,973 shows so far.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:19 PM IST", "pub_date_relative": "2h ago"}, {"title": "JSW Jetour T2: Features, Launch Date, Interior & Engine Options", "full_content": "JSW Motors is preparing to enter India's passenger vehicle market with a rugged five seater SUV based on the Chery Jetour T2. Here's what reports suggest about its launch, features and expected price.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:18 PM IST", "pub_date_relative": "2h ago"}, {"title": "Announcement Before Deadly Kolkata Stampede Caught On Video: 'Open The Gates', 'Pandal Is Collapsing'", "full_content": "Videos from Kolkata's Chorbagan Durga Puja pandal show panic after an announcement warned, \"Pandal is collapsing\", before a stampede killed 19 people and injured 25.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:17 PM IST", "pub_date_relative": "2h ago"}, {"title": "Prahaar Box Office Collection Day 3: Rajkummar Rao Starrer Sees A Rise In Weekend Collections, Check Earnings", "full_content": "Directed by Avinash Arun, Prahaar: The Untold Story of Ujjwal Nikam follows public prosecutor Ujjwal Nikam and his journey through high-profile criminal cases, including the 1993 Bombay blasts and 2008 Mumbai train attacks.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "I've studied over 200 kids\u2014parents who raise resilient, successful children teach them these 6 lessons early on", "full_content": "When we talk about raising successful kids, we tend to talk about what they can do.\n\nAre they getting good grades? Are they going to basketball practices and winning games? Did they clean their rooms and set the table? Are they motivated? Responsible? Social? Can they solve problems, make good choices and eventually become independent adults?\n\nBut after years spent working with more than 200 families, I've seen that some of the most important lessons children need to live successful, happy and fulfilling lives \u2014 and to build healthy relationships \u2014 have very little to do with action or achievement.\n\nChildren absorb crucial messages in ordinary moments based on how we respond when they struggle, fail, disagree with us, disappoint us or simply become someone different from who we imagined they would be.\n\nIn my experience, there are six things parents of the most successful, confident, resilient and well-adjusted kids teach them early on that have nothing to do with accomplishments.\n\nChildren notice what happens between you when something goes wrong. They see your face when the grade comes back. They notice whether you seem prouder after the win and more distant after the loss.\n\nA child should be able to fail without feeling they have fallen in your eyes. For example, instead of immediately asking \"Why didn't you study more?\" try \"I know you wanted a different result. How are you feeling about it?\"\n\nWhen children know a bad result won't change how we see them, they don't have to be so afraid of getting things wrong. Failure can become something they learn from instead of something they feel they need to hide.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 07:07 PM IST", "pub_date_relative": "3h ago"}, {"title": "Microsoft pulls plug on Nscale data centre deal - Financial Times", "full_content": "Microsoft pulls plug on Nscale data centre deal Financial Times Microsoft pulls out of UK data center deal with Nscale, Telegraph reports Reuters Microsoft pulls out of AI datacentre project in Essex over power supply concerns The Guardian Microsoft axes AI deal in setback for UK data centre pioneer Yahoo Finance Nscale eyes $35B IPO as flagship Arctic data centre runs six months late Dealroom", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 07:06 PM IST", "pub_date_relative": "3h ago"}, {"title": "Spyre presents clinical data on IBD antibody therapies", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 07:06 PM IST", "pub_date_relative": "3h ago"}, {"title": "Analysis-Carney\u2019s pipeline push is unlikely to bring back Canada\u2019s oil jobs boom", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 07:06 PM IST", "pub_date_relative": "3h ago"}, {"title": "MetroCity Bankshares earnings in spotlight after Q2 miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 07:05 PM IST", "pub_date_relative": "3h ago"}, {"title": "World Businesses for Sale Expands Confidential Seller Support for Owners Seeking Buyers", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 07:02 PM IST", "pub_date_relative": "3h ago"}, {"title": "Mid Penn Bancorp director Robert Abel buys $495 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 07:01 PM IST", "pub_date_relative": "3h ago"}, {"title": "Roth conversions: When the \u2018juice isn't really worth the squeeze,\u2019 according to a top-ranked advisor", "full_content": "Roth individual retirement account conversions can potentially reduce lifetime taxes . But the strategy isn't right for everyone, and the choice is now more complex amid updates from President Donald Trump 's \"big beautiful bill\" and other changes.\n\nRoth conversions transfer pretax or nondeductible IRA funds into a Roth IRA, which kick-starts tax-free growth. The trade-off is that they can trigger more income in the year of the conversion.\n\nThe move can be attractive if you have large pretax retirement balances and you expect higher tax rates when it's time to withdraw the funds , experts say.\n\nAt year-end 2025, IRA-owning households in the U.S. had $15.9 trillion in assets in traditional IRAs, compared with $2.4 trillion in after-tax Roth IRAs, according to a 2026 report from the Investment Company Institute, an investing trade organization.\n\nRead coverage of CNBC's 2026 Financial Advisor 100 list, including stories featuring ranked firms and their advisors:\n\nWeighing Roth conversions, or partial Roth conversions, is \"a strategy that continues to be very popular year-over-year,\" said Charissa Anderson, a certified financial planner who is an executive vice president at Ferguson Wellman Capital Management in Portland, Oregon. Her firm ranked No. 52 on CNBC's Financial Advisor 100 list for 2026.\n\nAs of March 31, Roth conversions were up 41% this year compared with the same period in 2025, according to the latest Fidelity data , based on an analysis of 19.6 million IRA accounts.\n\n\"There are just so many variables\" when analyzing a possible Roth conversion, said Tommy Lucas, a CFP at Moisand Fitzgerald Tamayo in Orlando, Florida. His firm is ranked No. 44 on CNBC's Financial Advisor 100 list for 2026.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 07:00 PM IST", "pub_date_relative": "3h ago"}, {"title": "What are self-replicating \u2018AI worms\u2019, and why is Anthropic worried about them? - The Guardian", "full_content": "What are self-replicating \u2018AI worms\u2019, and why is Anthropic worried about them? The Guardian Anthropic warns small AI models could self-replicate through IoT devices Ars Technica Anthropic\u2019s AI worm research raises new fears about smart device security Scientific American AI could self-replicate on home devices within \u2018months\u2019, Anthropic says Al Jazeera Anthropic warns AI models may soon self-replicate and could wreak havoc on the web Reuters", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 07:00 PM IST", "pub_date_relative": "3h ago"}, {"title": "TSA quietly reverses benefit for travelers at some US airports \u2014 here\u2019s what to know - The Independent", "full_content": "TSA quietly reverses benefit for travelers at some US airports \u2014 here\u2019s what to know The Independent TSA scales back PreCheck benefit announced just weeks ago CNN TSA rolls back program allowing visitors at airport gates without a ticket USA Today TSA removes Denver International Airport from gate pass program KDVR TSA Suddenly Reverses Major Change at Hundreds of Airports Men's Journal", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 06:50 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Bessent warns Zelenskyy to 'be very careful' about claims U.S. is throttling Starlink", "full_content": "U.S. Treasury Secretary Scott Bessent warned Ukrainian President Volodymyr Zelenskyy on Sunday to \"be careful\" in public statements about U.S. support for Ukraine .\n\nU.S.-provided Starlink internet was recently restricted in Ukraine, hindering the war-torn country's ability to respond to Russian assaults. Ukraine uses Starshield, the military and government-controlled version of the commercial Starlink, to conduct military operations.\n\nIn an earlier interview on NBC's \"Meet the Press,\" Zelenskyy said he believed the U.S. government was responsible for the slowdown, and that Ukraine was \"blocked\" from U.S. intelligence for a period of time. Zelenskyy said Starshield-linked vehicles and drones are still being restricted in speed.\n\n\"President [Donald] Trump and Secretary [Marco] Rubio have categorically said that no one under the Trump administration did that, and I think it is very reckless for President Zelenskyy to make such a charge,\" Bessent said on \"Meet the Press.\"\n\n\"President Zelenskyy should be very careful about making statements like this that aren't true,\" he added.\n\nStarlink, high-speed satellite internet provided by Elon Musk's SpaceX , is critical to Ukraine's defense. Musk himself said in a post on X last week that the U.S. government and President Donald Trump are \"ultimately\" responsible for any slowdowns to the military version of Starlink known as Starshield .\n\n\"Starshield systems are owned and controlled by the US government,\" Musk wrote. \"Any limits on speed or usage are decided by the US military and ultimately POTUS.\"\n\nReuters reported last week that the White House ordered the technology restrictions, but Trump has denied responsibility for the slowdown.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 09:50 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "\u2018Some people did everything right\u2019: I lost my home in the Great Recession. I rent in my 50s. Why is that judged as failure?", "full_content": "\u201dI earn $110,000 a year.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 09:45 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tiger Shroff Assassination Attempt: Fadnavis Seeks Swift Probe; 15 Teams To Investigate", "full_content": "Fadnavis told the police commisioner to take strict action against the assailants who targeted Tiger Shroff and to undertake a speedy investigation.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:33 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "What\u2019s next for IDBI Bank stock after Q2 net profit slumps 39%, massive Fairfax deal? Key factors investors should watch", "full_content": "IDBI Bank shares are likely to remain in focus on Monday, October 19, after the lender reported a 39% year-on-year decline in standalone net profit for the September quarter of FY27, largely reflecting the absence of a one-time gain recorded in the year-ago period.\n\nInvestors will assess the bank's earnings performance alongside the proposed Fairfax acquisition deal when trading resumes on Monday.\n\nIDBI Bank stock rose 0.80%, or \u20b9 0.67, to close at \u20b9 84.12 on Friday. However, it remains down 18.98% year to date.\n\nThe Life Insurance Corporation of India (LIC)-controlled lender reported a net profit of \u20b9 2,205 crore for the second quarter ended September 2026, compared with \u20b9 3,627 crore in the corresponding period last year.\n\nThe year-ago profit included a one-time gain of \u20b9 1,698.96 crore from the sale of the bank's strategic investment in National Securities Depository Ltd (NSDL). IDBI Bank had offered more than 2.22 crore equity shares, representing an 11.11% stake in NSDL, in its initial public offering at an issue price of \u20b9 799.87 per share.\n\nIDBI Bank's total income increased to \u20b9 9,865 crore in the September quarter from \u20b9 9,594 crore a year earlier, according to its regulatory filing.\n\nInterest income rose to \u20b9 8,512 crore from \u20b9 7,104 crore in the year-ago quarter. Net interest income (NII), which represents the difference between interest earned and interest paid, increased 29% to \u20b9 4,228 crore from \u20b9 3,285 crore.\n\nHowever, non-interest income declined 46% to \u20b9 1,353 crore from \u20b9 2,489 crore in the corresponding quarter last year. Operating profit consequently fell to \u20b9 2,893 crore from \u20b9 3,523 crore.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 09:27 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dow Jones Futures Loom After S&P 500, Nasdaq Break Support; Will Meta Save AI? - Investor's Business Daily", "full_content": "Dow Jones Futures Loom After S&P 500, Nasdaq Break Support; Will Meta Save AI? Investor's Business Daily 'Just another scare': Wall Street sees the AI trade strong despite tech's latest rout Yahoo Finance Nasdaq sinks more than 2% as investors raise questions about AI debt CNN Tech stocks erase $1 trillion of wealth as oil surges to $110 for the first time since May NBC News AI Fears Are Rocking Markets. The Brave Should Buy the Dips. Barron's", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 09:20 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oil Rally Lifts Saudi Stocks, While Qatar And Egypt Markets Tumble", "full_content": "Saudi Aramco shares rose 2.1% as Brent crude settled at $109.86 a barrel, while Qatar's benchmark hit its lowest closing level since April 2020.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 09:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Here are the 3 big things we're watching in the stock market this week", "full_content": "Meta and Capital One are set to report earnings. We'll also hear from plenty of important companies outside the Club portfolio.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 08:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Maharashtra Drought Crisis: IAS, IPS Officers To Donate One Day\u2019s Salary To Aid Farmers", "full_content": "Maharashtra IAS and IPS officers will donate one day's October salary to aid drought-hit farmers across 305 talukas. The state has announced loan relief, land revenue exemptions and education fee waivers to support affected families.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 08:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Want to retire early? How to split \u20b91 lakh in monthly investments between short-term goals and FIRE, expert explains", "full_content": "For someone looking to retire early, deciding how much to invest towards financial independence and early retirement (FIRE) versus short-term financial goals can be a balancing act. While investing more today can help build a retirement corpus faster, goals such as buying a car, making a house down payment or funding other planned expenses also require money within a specific timeframe. Diverting too much towards either could mean delaying other goals or falling short of the retirement corpus needed to sustain a longer retirement.\n\nThe key is to calculate how much each goal requires and how soon the money will be needed, rather than follow a fixed allocation, says Jasmeet Singh, executive director at Anand Rathi Wealth.\n\nFor someone investing \u20b9 70,000 or \u20b9 1 lakh a month, the split between short-term goals and FIRE will depend on these requirements, as well as the time available to build the retirement corpus.\n\nConsider someone investing \u20b9 70,000 a month who wants to buy a car worth \u20b9 9.6 lakh in two years. If they have no existing savings for the purchase and do not account for investment returns, they would need to set aside \u20b9 40,000 every month towards the car. The remaining \u20b9 30,000 could go towards FIRE .\n\nFor someone investing \u20b9 1 lakh a month, the allocation would depend on the cost and timeline of their other goals. Investors should first calculate the monthly contribution required for each goal and then divide their available savings accordingly, rather than follow a predetermined percentage.\n\nThe investment choice should also reflect when the money will be needed. Money earmarked for a goal within two years should ideally be kept in low-risk debt instruments, Singh says. This reduces the risk of market volatility affecting funds needed by a specific deadline.\n\nFor FIRE, investors with a long investment horizon and suitable risk appetite can consider an allocation of 80% equity and 20% debt.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 08:35 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Midterms: UBS assigns a 50% probability to a Democratic sweep", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 08:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "JPMorgan raises ICICI Bank stock price target on strong earnings", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 08:05 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FD maturity mistake: Fixed deposit matured but you forgot to withdraw money? What happens to your amount? Renew or not?", "full_content": "A fixed deposit offers predictable returns over a specified tenure, making it a preferred investment option for traditional or risk-averse investors. However depositors may sometimes fail to claim their maturity proceeds on time if they overlook bank notifications or do not receive them at all.\n\nIn such cases, the accumulated corpus does not simply disappear but the returns on the amount after maturity may differ from the original FD rate, depending on the bank's rules and whether the deposit was set up for automatic renewal.\n\nA matured fixed deposit may be repaid to the depositor or renewed depending on the instructions recorded for the deposit. Here's what happens to your money in different scenarios if you do not take any action post maturity:\n\nIf no action is taken within 10 years from the FD's date of maturity, it is classified as an \u201cunclaimed deposit\u201d and is transferred out of the bank.\n\nTherefore, as per RBI rules, on the last working day of the month following the month in which the 10-year period is completed, the bank calculates the total outstanding amount and transfers it to the depositor education and awareness (DEA) fund maintained by the central bank.\n\nThis does not mean the money is gone. The RBI simply serves as the custodian of these unclaimed deposits, and the depositor continues to have the right to claim the principal along with the applicable interest rate determined by the central bank until they or their legal heir claims it.\n\nIn case of the depositor's demise, the nominee or legal heir must provide evidence of the person's death along with their identification documents. The financial institution then facilitates the transfer of the fixed deposit amount to the nominee, ensuring a seamless transition of the investment.\n\nYou can choose to renew your their fixed deposit if you do not need the money in the near future and want to continue earning returns.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 07:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Best-performing SIFs: Quant leads hybrid long-short funds with 25.5% returns in 6 months; check how peers performed", "full_content": "Quant Mutual Fund\u2019s QSIF Hybrid Long-Short Fund delivered a 25.5% return over six months, outperforming six other hybrid long-short Specialised Investment Funds (SIFs) with available data for the period. Aditya Birla Sun Life Mutual Fund\u2019s Apex Hybrid Long-Short Fund ranked second, with a return of 6.78%, according to the SIF360 tracker.\n\nQSIF\u2019s lead extends to shorter and longer periods. The fund returned 20.58% over three months and 28.82% since inception, ahead of its peers on both measures. Most of the funds with available six-month data returned less than 5% over the period. However, these schemes have relatively short track records, making it important for investors to assess their investment strategies, portfolio risks and performance over time rather than rely on returns alone.\n\nQuant's six-month return exceeded Apex's by 19.22 percentage points. None of the other six funds with available data crossed 7%, while four delivered less than 5%.\n\nQuant's QSIF returned 20.58% over three months, compared with 4.06% for Apex, the second-ranked fund over that period. Since inception, QSIF has gained 28.82%, while Edelweiss Mutual Fund's Altiva Hybrid Long-Short Fund ranked second with a 9.54% return.\n\nUnlike a conventional equity mutual fund that primarily invests in stocks, Quant's strategy combines equity, debt and money market instruments with exposure to real estate investment trusts (REITs) and infrastructure investment trusts (InvITs). It can adjust allocations according to market conditions and its economic outlook.\n\nUnder the stated investment framework, equity and equity-related instruments can account for 25-75% of the portfolio, while debt and money market instruments can also account for 25-75%. REITs and InvITs have an allocation range of 0-20%.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 07:32 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "The bloated workweek is coming for Sundays\u2014as some embrace flexibility, others worry about job security", "full_content": "Alessia Montanaro is just about to close her second busy season of the year. Since September she's been logging up to 60 hours of work per week, sometimes going as late as 11 p.m., and making a habit of working Sundays from her home office.\n\nThe 30-year-old works in public accounting in Austin, Texas, and has gotten used to these sprints around tax season. She's not the only weekend work warrior.\n\nFor many office workers, Sundays have become the unofficial new start to their workweek: Nearly half of workers often clock in on Sundays, according to a recent report from Owl Labs , the video-conferencing technology company, which surveyed 2,000 people in July with a margin of error of 2%. Some 21% of people surveyed say they work the whole or nearly the whole day, and another 24% say they often do a few hours of work.\n\nOf the remaining set of workers, 11% say they quickly check messages but don't really work, 18% say they rarely do any work on Sundays, and 26% say they never do.\n\nIt's been six years since work for many moved home during the Covid-19 pandemic, opening the possibilities of logging hours anytime and anywhere there's Wi-Fi. While some people deprioritized work and put up strict boundaries to protect their personal time, tech use data shows that many years later, working time has bled into every hour of every day. Chat messages sent outside of the standard Monday through Friday 9 a.m. to 5 p.m. workweek rose 15% year-over-year, now up to an average 58 messages per user, according to Microsoft's 2025 research on what it calls the rise of the \" infinite workday .\"\n\nAmong those working on the weekends, nearly 20% check their email before noon on a Saturday and Sunday, and over 5% are in their inboxes on Sunday nights, per Microsoft.\n\nAs far as these online habits show, the sanctity of Sundays off may be vanishing as an always-on work culture takes over.\n\nSome Sunday workers say working weekends or after hours is the only way to get focused work done.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 07:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "These surprising stocks could be some of the biggest drivers of S&P 500 earnings growth", "full_content": "Boeing, Meta and EchoStar recorded steep charges and expenses a year ago, which are expected to make this latest quarter\u2019s results look especially strong by comparison.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 07:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Reliance Jio IPO buzz reaches crypto market! Bitget launches Jio pre-IPO futures ahead of launch - Details for investors", "full_content": "Jio Platforms IPO buzz reaches crypto market: The initial public offering (IPO) of Jio Platforms Limited is set to open for subscription this week, but its IPO buzz has already reached the cryptocurrency market. Crypto exchange Bitget listed Jio pre-IPO perpetual futures contract last week.\n\nKnown as the JIOUSDT contract,the crypto-based futures contract would let traders speculate on Jio Platforms\u2019 pre-IPO price movements. They can participate in it without actually owning its shares.\n\nJIOUSDT is a pre-IPO perpetual futures contract. It lets traders use a speculative financial instrument tied to the company\u2019s anticipated market valuation. As per Bitget website, it can be traded 24x7, year-round and are settled directly in USDT. Jio pre-IPO perpetual futures will offer up to 20x leverage, with funding fees settled every eight hours.\n\nThe contract has traded around the clock since its launch on Wednesday, October 14, with its price hovering near $ 11.9. Perpetual futures contracts have no expiry, with periodic funding payments between longs and shorts that help keep prices aligned with the underlying market.\n\nTraders can participate in JIOUSDT by making positions on market expectations for Jio valuation. The financial instrument would let traders capture speculation around event-driven moves related to Jio IPO, subscription demand, and grey market premium (GMP).\n\nJio IPO GMP today was recorded at \u20b9 250, as per media reports at 7 pm on Sunday, October 18. Its IPO grey market premium increased on Sunday compared to its level recorded yesterday.\n\nWith this, Jio IPO is expected to be listed at \u20b9 1369 (which is the sum of latest GMP and upper price band, i.e. \u20b9 1369). Considering its latest grey market premium, Jio IPO is expected to be listed with 22.34% gain.\n\nJio Platforms Limited is a leading technology platform combining panIndia digital connectivity with digital services to drive India\u2019s digital transformation.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 07:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "JSW Jetour T2: Features, Launch Date, Interior & Engine Options", "full_content": "JSW Motors is preparing to enter India's passenger vehicle market with a rugged five seater SUV based on the Chery Jetour T2. Here's what reports suggest about its launch, features and expected price.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:18 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Prahaar Box Office Collection Day 3: Rajkummar Rao Starrer Sees A Rise In Weekend Collections, Check Earnings", "full_content": "Directed by Avinash Arun, Prahaar: The Untold Story of Ujjwal Nikam follows public prosecutor Ujjwal Nikam and his journey through high-profile criminal cases, including the 1993 Bombay blasts and 2008 Mumbai train attacks.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 07:11 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "I've studied over 200 kids\u2014parents who raise resilient, successful children teach them these 6 lessons early on", "full_content": "When we talk about raising successful kids, we tend to talk about what they can do.\n\nAre they getting good grades? Are they going to basketball practices and winning games? Did they clean their rooms and set the table? Are they motivated? Responsible? Social? Can they solve problems, make good choices and eventually become independent adults?\n\nBut after years spent working with more than 200 families, I've seen that some of the most important lessons children need to live successful, happy and fulfilling lives \u2014 and to build healthy relationships \u2014 have very little to do with action or achievement.\n\nChildren absorb crucial messages in ordinary moments based on how we respond when they struggle, fail, disagree with us, disappoint us or simply become someone different from who we imagined they would be.\n\nIn my experience, there are six things parents of the most successful, confident, resilient and well-adjusted kids teach them early on that have nothing to do with accomplishments.\n\nChildren notice what happens between you when something goes wrong. They see your face when the grade comes back. They notice whether you seem prouder after the win and more distant after the loss.\n\nA child should be able to fail without feeling they have fallen in your eyes. For example, instead of immediately asking \"Why didn't you study more?\" try \"I know you wanted a different result. How are you feeling about it?\"\n\nWhen children know a bad result won't change how we see them, they don't have to be so afraid of getting things wrong. Failure can become something they learn from instead of something they feel they need to hide.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 07:07 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Microsoft pulls plug on Nscale data centre deal - Financial Times", "full_content": "Microsoft pulls plug on Nscale data centre deal Financial Times Microsoft pulls out of UK data center deal with Nscale, Telegraph reports Reuters Microsoft pulls out of AI datacentre project in Essex over power supply concerns The Guardian Microsoft axes AI deal in setback for UK data centre pioneer Yahoo Finance Nscale eyes $35B IPO as flagship Arctic data centre runs six months late Dealroom", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 07:06 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "MetroCity Bankshares earnings in spotlight after Q2 miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 07:05 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Boomers are buying into the promise of monthly income from options ETFs, but there's a tax catch", "full_content": "Covered call ETFs have gained a following for their ability to generate monthly cash flow. But a tax surprise could be lurking for many investors.\n\nThese actively managed funds have different underlying assets and strategies. But the premise is generally the same. Covered call funds hold equities and sell call options or use related derivatives to generate income. Investors receive attractive income yields in exchange for limited capital upside. The tax piece is more complicated, however.\n\nA fund that realizes option premiums, short-term gains or other income still has taxable amounts to distribute. The tax hit can be easy \u2014 and costly \u2014 for investors to miss, especially since ETFs are typically understood to be tax-efficient investment vehicles, and especially since most investors aren't looking at the tax implications until they receive a 1099-DIV at tax time, the IRS tax document issued by financial services companies to report dividends and related distributions paid to investors during a tax year.\n\nEven if a fund has good returns and a favorable 30-day SEC yield \u2014 which measures the net investment income of bond funds or equity funds and is annualized to reflect the yield an investor would expect to earn over the course of a full year \u2014 investors need to look under the hood and understand the tax implications of covered call ETFs. \"The after-tax net total return might fall below your expectations,\" said Matthew Smart, chief investment officer at WWM Investments in Chicago.\n\nHere's what investors need to know about covered call ETFs and taxes:\n\nDistributions from covered call funds come in several forms: dividends, capital gain distributions, or non-dividend distributions. The distribution mix can vary by fund and change year to year. Non-dividend distributions are commonly known as return of capital \u2014 payment or distribution from a portion of an investor's original principal rather than an economic profit, capital gain, or dividend earnings.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 06:40 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Accenture Explores $1.5 Billion China Business Sale, Hires JPMorgan For Strategic Review: Report", "full_content": "Accenture has hired JPMorgan to review options for its Greater China business, which could be valued at up to $1.5 billion. The process follows unsolicited buyer interest, although a transaction is not guaranteed.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 06:33 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stocks are heading for a high-stakes showdown, as strong earnings collide with rising borrowing costs", "full_content": "The idea that the AI trade has been mostly immune to rising bond yields isn\u2019t quite right, one strategist notes.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 06:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meta Platforms and Tesla are among the companies set to report next week. What to expect", "full_content": "Meta, General Motors, major airlines and more companies will report earnings this week. Here's what analysts forecast and what's happened in the past.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 06:11 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock market this week with top 7 factors for Sensex, Nifty: Reliance Jio IPO, crude volatility, FII selling, Q2 results", "full_content": "Stock market this week: The Indian stock market saw a sharp rally last week as Nifty 50 and Sensex ended with more than 2.4% of weekly gains. With this, the benchmark indices recorded their biggest weekly gain since April this year. In the coming week, a host of incidents, including the Jio Platforms IPO, crude oil price volatility, corporate earnings, will define market sentiments.\n\nAs investors prepare for the coming week, let\u2019s understand key incidents and factors that will impact the stock market mood between Monday, October 19 and Friday, October 23.\n\nThe second quarter earnings season has gained momentum with IT heavyweights announcing results largely in-line with estimates. The Indian stock market this week will be driven by lots of Q2 results specific movements.\n\nInfosys, Eternal, Swiggy, Kotak Mahindra Bank , UltraTech Cement , Adani Energy, Adani Green Energy , Adani Total Gas , Adani Power, Tata Motors and HPCL are among key companies that are set to announce their earnings for the quarter ended September, 2026.\n\nApart from corporate earnings, Mukesh Ambani\u2019s Reliance Industries Limited-backed Jio Platforms is set to make waves in India\u2019s primary market. Jio IPO will open for subscription on Wednesday , October 21 and conclude on Friday, October 23.\n\nIts anchor bidding is scheduled for Monday, October 19. Bound to become India's biggest ever IPO, Jio Platforms IPO, is a fresh issue of up to 27 crore shares with a face value of \u20b9 10 each, with no offer-for-sale component. Jio IPO price band is fixed at \u20b9 1,065 to \u20b9 1,119 per share.\n\nWhile cooling US Treasury yields and positive start to Q2 results reacted in favour of Nifty and Sensex, foreign institutional investors (FIIs) contin     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
