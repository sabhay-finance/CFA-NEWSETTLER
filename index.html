offset concerns over persistent inflation and the possibility of further Federal Reserve rate hikes. In the domestic market, the rupee's weakness near record lows provided additional support to bullion prices by making dollar-denominated commodities more expensive.\n\nThe near-term direction of gold and silver will depend on whether the dollar and global bond yields continue to ease. A further decline in yields could support prices, while persistent inflation and expectations of additional rate hikes may limit gains. Geopolitical developments in the Middle East and movements in the rupee will also remain important drivers for domestic bullion.\n\nAccording to Ponmudi R, CEO of Enrich Money, a SEBI-registered online trading and wealthtech firm, both metals have shown signs of recovery after finding buying interest at lower levels.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 05:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bank earnings to shed the first light on how higher yields are affecting the economy", "full_content": "The big banks kick off earnings season on Tuesday, to provide a first read on the health of the economy in a rising-yield environment.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 05:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tokenized Stocks Bring \u2018Radical Change\u2019 to Markets, Cuomo Says - WSJ", "full_content": "Tokenized Stocks Bring \u2018Radical Change\u2019 to Markets, Cuomo Says WSJ OKX joint venture files with SEC to launch tokenized trading platform Reuters NYSE\u2019s Parent Just Filed to Tokenize 63 US Stocks on a Crypto-Native Exchange \u2014 And the SEC Already Gave It Permission Yahoo Finance Nvidia (NVDA), Tesla (TSLA) and Apple (APPL) are going onchain. Here\u2019s how OKX and ICE\u2019s new market will work CoinDesk Tokenized Trading in Company Stock: What Public Companies Need to Know Latham & Watkins LLP", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 05:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "DA news: DA for pensioners explained, who is eligible, impact of revision, pay structure and other details", "full_content": "Pensioners are retired central and state government employees, who are eligible for individual or family pension from the government. This is in continuance of their salaries and comprises a dedicated percentage towards inflation. This component is known as Dearness Allowance (DA) for employees, and Dearness Relief (DR) for pension.\n\nDR is often paid to retired central and state government employees , railways and defence personnel, public sector staff, and bank employees across the country. The beneficiaries include close to 65 lakh pensioners across various pay scales.\n\nNotably, in India, DA and DR are provided only to public sector employees and retirees. The private sector does not offer the same for employees or pensioners.\n\nAs a component of the monthly salary, DA is revised biannually based on the 12-month average of the All-India Consumer Price Index (AICPI), with announcements in early March and October, followed by rollouts in January and July. Notably, each time DA is adjusted or revised by the pay commission, a similar change is reflected in DR accordingly.\n\nDR impacts the in-hand pension payout for retired central government staff who receive an individual or family pension from the government. Under the 7th CPC, there have been 10 hikes since 2021, with the highest at 11% in July 2021. The past two hikes were 2% and 3%, respectively, for January and July 2025.\n\nThe National Council \u2014 Joint Consultative Machinery (NC-JCM), Maharashtra Old Pension Organisation and All India Defence Employees Federation ( AIDEF ) have made detailed submissions to the commission.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 05:22 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Need to look at cost of doing business to boost manufacturing; cut statutory liquidity ratio: Amitabh Kant", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Need to look at cost of doing business to boost manufacturing; cut statutory liquidity ratio: Amitabh Kant The Economic Times daily newspaper is available online now. Read Today's Paper Need to look at cost of doing business to boost manufacturing; cut statutory liquidity ratio: Amitabh Kant SECTIONS Need to look at cost of doing business to boost manufacturing; cut statutory liquidity ratio: Amitabh Kant PTI Last Updated: Oct 11, 2026, 05:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Amitabh Kant has advocated for reducing the statutory liquidity ratio to promote job-intensive manufacturing in India. He emphasized that cutting SLR could lower the cost of credit for businesses. Kant highlighted the importance of adequate credit in supporting the growth of startups in new-age sectors. Additionally, he addressed the need for easier land acquisition and better power availability for manufacturers.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 05:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Kotak Mahindra Life, Ashish Kacholia, Others Invest Rs 120 Crore In Fusion Cx Ahead Of IPO", "full_content": "The IPO comprises a fresh issue of shares worth up to Rs 500 crore and an offer for sale of shares aggregating up to Rs 202 crore by promoter selling shareholders.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "JPMorgan Chase, Goldman and other big banks report earnings this week. What to expect", "full_content": "The biggest banks in the U.S. are due to report third-quarter results this week, setting the tone for the rest of the reporting period.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 05:16 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This Chinese memory chip maker has global potential and is poised to outperform", "full_content": "The stakes are rising for China's memory chip maker CXMT ahead of its earnings release, expected Oct. 31.", "source": "CNBC Finance", "pub_date_str": "11 Oct 2026, 05:09 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trade Setup For Oct 12: Nifty Bulls Break 8-Week Slide; Will The Relief Really Sustain?", "full_content": "Despite the recent recovery, the market needs confirmation through sustained buying before the rebound can be considered durable.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hitachi Energy vs CG Power vs Siemens Energy: Which power stock offers best returns? Check target prices", "full_content": "Hitachi Energy vs CG Power vs Siemens Energy: Hitachi Energy India, Siemens Energy India, CG Power and Industrial Solutions Limited are likely to be among beneficiaries in the power transmission and distribution market because of capex investment. Themes like urbanisation, industrialisation, electrification and automation, are likely to support the demand in the segment, according to InCred Equities report.\n\nFor investors who are planning to add power transmission and distribution theme stocks in their portfolio, here is a comparison of growth projections and stock outlook of Hitachi Energy, CG Power and Siemens Energy.\n\nHitachi Energy share price closed 0.89% lower at \u20b9 30,669.25 per share on BSE with an Mcap of \u20b9 1,36,700.09 crore on Friday, October 9. Its return on equity (ROE) stood at 82.02%. Its share price value was 73% in one year, 110% in two years, 678% in three years.\n\nCG Power and Industrial Solutions share price closed 0.63% lower at \u20b9 856.60 per share, with an Mcap of \u20b9 1,34,954.62 crore. The stock\u2019s return on equity (ROE) stood at 37.41%. The stock has delivered nearly 12.56% return in one year, 6.75% return in two years and around 107% return in three years.\n\nSiemens Energy India share price closed 2.78% lower at \u20b9 3101.45 per share on BSE with an MCap of \u20b9 1,10,448.99 crore. The stock has declined 4.30% in one year.\n\nHitachi Energy is likely to report a 17.0% EBITDA margin in the second quarter of financial year 2026-27. Its net profit margin is likely to remain at 13.4%, and earnings per share (EPS) at \u20b9 77.2, as per InCred Equities report.\n\nCG Power\u2019s profit after tax (PAT) is likely to grow 28.6% on a year-on-year (YoY) basis in the quarter ending in September. Revenue from operation may increase 24.4% on a yearly basis, as per the brokerage report.\n\nSiemens Energy\u2019s profit after tax (PAT) may increase 44.7% on a yearly basis, and revenue may surge 46.0% on YoY basis.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 04:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ahead of Market: 10 things that will decide D-Street action on Monday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide D-Street action on Monday HDFC Bank Share Price ICICI Bank Share Price Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide D-Street action on Monday SECTIONS Ahead of Market: 10 things that will decide D-Street action on Monday By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 11, 2026, 05:24:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sensex and Nifty snapped their eight-week losing streak on Friday, surging over 1% as IT stocks rallied and crude prices eased. The rebound added more than Rs 4 lakh crore to BSE-listed companies\u2019 market capitalisation, while positive market breadth favoured bulls.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Oct 2026, 04:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "All 22 Indian Crew Members Rescued After Incident Involving Tanker Off UAE Coast", "full_content": "All 22 Indian crew members aboard crude oil tanker MT GEM No. 2 were rescued after an incident off Ras Al Khaimah, UAE. India\u2019s Dubai consulate confirmed their safety and said it was coordinating with UAE authorities.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 04:44 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Market strategy: Where are Nifty 50, Sensex, Bank Nifty headed this week? Top things investors should watch?", "full_content": "Indian equity benchmarks ended higher on Friday, 9 October, breaking an eight-week losing streak, although the recovery remained modest amid concerns over elevated crude oil prices and tighter monetary conditions.\n\nThe Nifty 50 rose 1.3% to close at 22,520.45, while the BSE Sensex advanced 1.23% to 72,472.33. IT stocks led gains after Tata Consultancy Services' quarterly earnings highlighted growing contributions from artificial intelligence and robust international business growth.\n\nFor the week, the Nifty 50 gained 0.44%, while the Sensex rose 0.78%. However, the rebound came after a prolonged correction, with the two indices losing 8.7% and 8.4%, respectively, over the preceding eight weeks.\n\nThe key question for investors is whether the latest gains can develop into a meaningful recovery. Technical indicators are showing early signs of stabilisation, but the indices continue to face resistance from key moving averages. The coming sessions will be important in determining whether buying momentum can strengthen or selling pressure will return.\n\nThe Nifty 50 has snapped its eight-week losing streak, but technical analysts remain divided on whether the rebound signals a sustained trend reversal or a temporary pullback. While early signs of stabilisation have emerged, the index needs to overcome key resistance levels to strengthen the recovery outlook.\n\nSudeep Shah, Head of Technical and Derivatives Research at SBI Securities, said the Nifty formed a Doji candlestick on the weekly chart and a bullish Harami pattern on the daily chart, both near a crucial support confluence comprising the 200-week exponential moving average (EMA) and the lower trendline of a rising channel. Bullish crossovers in the daily RSI and Stochastic indicators suggest that immediate downside pressure could remain limited.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 04:40 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FPIs Pull Rs 44,166 Crore from Indian Equities in October: When Will the Tide Turn?", "full_content": "The market has remained on a downward trajectory over the past two months, with persistently high crude oil prices and elevated US Treasury yields.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 04:32 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Q2 Results, Inflation Data, Crude Oil Prices To Drive Stock Markets This Week, Say Analysts", "full_content": "The September-quarter earnings season is expected to drive stock-specific movements, with HCL Technologies, Wipro and Tech Mahindra among the major information technology companies scheduled to announce results.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 04:31 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Crude Oil Futures Brace For Volatility Amid Geopolitical Uncertainties, Say Analysts", "full_content": "Crude prices face competing pressures from US-Iran diplomacy, Strait of Hormuz disruptions and global supply risks, with OPEC and IEA reports in focus next week.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 04:09 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation qu     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
