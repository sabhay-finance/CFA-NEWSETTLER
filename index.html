title": "UPS beats quarterly expectations, raises full-year guidance again", "full_content": "United Parcel Service on Tuesday reported third-quarter results that beat Wall Street expectations and raised its full-year guidance.\n\nThe guidance raise comes after the company already upped its outlook last quarter . UPS now said it's projecting full-year consolidated revenue of approximately $92.6 billion, up from its previous expectations of $91.2 billion, as well as fourth-quarter revenue of $25.7 billion.\n\nHere's how the company performed in its third quarter, compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nFor the quarter ended Sept. 30, UPS reported net income of $1.16 billion, or $1.37 per share, down slightly from net income of $1.31 billion, or $1.55, the year prior. Adjusting for one-time expenses, UPS reported earnings per share of $1.69. Revenue rose 6.7% to $22.9 billion.\n\nIn its domestic segment, the company said it saw a 4.5% increase in revenue, while its international segment had a 7.1% rise in revenue. Its supply chain solutions business saw an 18.2% revenue increase, which UPS said was primarily driven to growth in forwarding and logistics, including healthcare . On a call with analysts, CEO Carol Tom\u00e9 said healthcare revenue exceeded $3 billion for the third consecutive quarter.\n\nThe company had previously said it expected its third-quarter domestic revenue to be flat and for domestic average daily volume to fall due to seasonal declines and the glide down with Amazon .\n\n\"We're driving more premium growth, improving revenue quality and mix, and creating greater operating leverage through a more efficient network,\" Tom\u00e9 said on the call. \"All of this is strengthening the underlying performance of our business.\"\n\nUPS has been in the midst of a turnaround under Tom\u00e9's leadership, working to create a leaner business model and leveraging automation to position the company for growth.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:34 PM IST", "pub_date_relative": "24m ago"}, {"title": "Diwali 2026: Buying gold this Dhanteras? How to avoid fake jewellery scams and check purity", "full_content": "With Diwali approaching, gold purchases are expected to gain momentum as families prepare to celebrate Dhanteras, an auspicious occasion traditionally associated with buying precious metals. Many households save throughout the year for this annual purchase, viewing g old as a symbol of prosperity, wealth and good fortune.\n\nHowever, rising demand for gold also makes it important for buyers to remain alert to counterfeit jewellery and purity-related fraud. Attractive discounts and deals can sometimes conceal jewellery with lower gold content than advertised, potentially causing financial losses for unsuspecting customers.\n\nBuyers can reduce these risks by checking the Bureau of Indian Standards (BIS) hallmark and verifying the Hallmark Unique Identification (HUID) number before completing a purchase.\n\nThe BIS hallmark is a certification that indicates the purity of hallmarked gold jewellery. It helps consumers establish whether the gold meets the declared fineness standards.\n\nBuyers should check for the following details on hallmarked gold jewellery:\n\nThese markings are generally engraved on the jewellery and may be small enough to require a magnifying glass to read clearly.\n\nConsumers should inspect the markings carefully before making a purchase. However, checking the engraving alone may not be sufficient; buyers should also verify the HUID through the official BIS Care application.\n\nThe BIS Care app provides a facility for consumers to check the details associated with a jewellery item's HUID number.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 06:30 PM IST", "pub_date_relative": "27m ago"}, {"title": "Meta, SpaceX, Anthropic stoke the AI funding frenzy. What it means for our stocks", "full_content": "", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:28 PM IST", "pub_date_relative": "29m ago"}, {"title": "Stock futures rise as chip stocks gain for a second day, oil prices ease: Live updates", "full_content": "Stock futures rose on Tuesday as enthusiasm surrounding chipmakers led traders to move into the names for another day. Traders also monitored a slide in oil prices and parsed through a slew of corporate earnings as the Federal Reserve began its two-day policy meeting.\n\nS&P 500 futures were up 0.3%, while Dow Jones Industrial Average futures climbed 132 points, or 0.3%. Nasdaq-100 futures gained 0.5%.\n\nShares of Broadcom climbed more than 2% on the heels of a coalition of banks \u2014 namely, Bank of America , Citi and Morgan Stanley \u2014 and Blackstone announcing $63 billion in financing for the purchase of Broadcom's technology for Anthropic. Other chipmakers rose in sympathy. Micron Technology was up more than 2%, while Advanced Micro Devices and Nvidia advanced nearly 2% and around 1%, respectively.\n\nThe latest moves in those stocks add to their gains from the prior trading day, which saw the major averages record a winning session , thanks in part to a boost in artificial intelligence-related stocks after Anthropic filed to go public at the Nasdaq. This would mark another major tech IPO for 2026, following SpaceX's blockbuster listing in June.\n\nA decline in oil prices also supported sentiment Tuesday, as investors were hopeful for a de-escalation in the regional conflict. U.S. West Texas Intermediate futures shed nearly 1% to around $101 per barrel, while global benchmark Brent crude futures shed about 1% to roughly $114 a barrel.\n\nMeanwhile, UPS shares added more than 1% after the delivery giant reported better-than-expected results for the third quarter. JetBlue jumped more than 11% despite the airline posting a larger-than-expected third-quarter loss, as the company said it expects to see further margin expansion in the fourth quarter. On the flip side, Whirlpool shed 7% after posting a surprise quarterly loss.\n\nThe Fed is set to kick off its latest monetary policy meeting Tuesday.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:27 PM IST", "pub_date_relative": "30m ago"}, {"title": "Credit score above 750? Your loan can still be rejected. Here are 3 credit score myths every borrower should know", "full_content": "A good credit score can improve your chances of getting a home loan, personal loan or credit card at competitive interest rates. However, several misconceptions about how credit scores work can lead borrowers to make mistakes that affect their financial health.\n\nMany people believe that checking their credit score frequently can lower it, while others assume that a higher salary automatically translates into a better score. Some also believe that having an excellent credit score guarantees loan approval. Understanding how credit scores actually work can help borrowers make better financial decisions.\n\nA credit score typically ranges from 300 to 900, with a higher score generally indicating stronger creditworthiness. While a score of 750 or above is often considered favourable by lenders, it is not the only factor determining loan eligibility.\n\nHere are three common credit score myths borrowers should know before applying for a loan.\n\nOne of the most common misconceptions is that checking your credit score multiple times can negatively affect it.\n\nHowever, checking your own credit score does not lower it. Such checks are classified as soft enquiries and have no impact on your credit score, regardless of how frequently you check.\n\nA soft enquiry occurs when an individual checks their own credit report. A hard enquiry generally occurs when a bank or financial institution accesses a borrower's credit report while evaluating a loan or credit card application.\n\nMultiple hard enquiries within a short period may negatively affect a credit score, particularly when they indicate frequent applications for new credit. For example, checking your credit score every month will not reduce it. However, applying for five personal loans or credit cards within a short period could affect your credit profile.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 06:22 PM IST", "pub_date_relative": "35m ago"}, {"title": "Jim Cramer's top 10 things to watch in the stock market Tuesday", "full_content": "Broadcom arranged chip financing for Anthropic, and Meta upsized its secondary stock sale.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:21 PM IST", "pub_date_relative": "36m ago"}, {"title": "World Bank's Banga: Availability of capital 'not really an issue' as AI demand drives up borrowing costs", "full_content": "World Bank President Ajay Banga said on Tuesday that capital remained available despite concerns of artificial intelligence sending interest rates higher.\n\n\"It's not really an issue,\" Banga said in an interview on CNBC's \"Squawk Box.\"\n\nBanga said the World Bank mobilized $112 billion last year, around three times higher than the amount recorded three years prior.\n\nHe said investors may be concerned about circular financing and the business model tied to AI.\n\nBut Banga told CNBC that emerging markets are not running into the same hesitancy because the investments focus more on infrastructure like bridges and roads.\n\nThese countries also look at smaller-scale uses of AI, according to Banga. Banga said developed counterparts look to funding to support large use cases, which he described as the \"exact opposite\" need.\n\nThe World Bank leader also said that the private capital it oversees does not go to governments. As a result, the organization can avoid fears of looming debt crises and challenges related to rising bond yields within some countries.\n\n\"In general, I still believe that AI is going to be transformative and profitable,\" Banga said. \"But everybody sees bumps in the road from here to there, and no one knows when the next bump will come.\"", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:20 PM IST", "pub_date_relative": "37m ago"}, {"title": "Apple responds to user reports of broken iPhone Duo screens on new foldable phone", "full_content": "Apple's first foldable phone, the iPhone Duo, hit store shelves on Friday to considerable lines and long wait times for preorders.\n\nBut some customers who were lucky enough to get the $1,999-and-up phone on its first weekend have been reporting a pretty big problem: The inner screen of the phone can break, showing horizontal bright lines emanating from the phone's hinge.\n\nApple on Monday said that it was aware of the issue, which it said affected a \"small number\" of phones, and that it would replace the devices under its AppleCare warranty.\n\n\"We are aware of an issue impacting the inner display on a small number of iPhone Duo units,\" an Apple representative told CNBC. \"If users experience issues with their iPhone Duo display, they should contact AppleCare for a replacement.\"\n\nApple says on its website that an inner-screen repair will be $999 for iPhone Duos that are out of warranty.\n\nMost of the reports are from anonymous customers on online forums such as Reddit and X , and there are fake images online as well. But well-respected device repair firm iFixit weighed in on Sunday, after tearing down the new device and testing its resistance to dust, and theorized the issues may have to do with Apple's hinge design.\n\n\"Many of these damage reports describe folding or unfolding the phone, hearing a crunch, and pushing past it,\" said iFixit technician Shahram Mokhtari in its teardown video . \"Right where the damage is happening, the hinge is shaped a little differently.\"\n\n\"The hinge is actually dozens of parts, with ludicrous precision,\" iFixit CEO Kyle Wiens posted on X. \"A manufacturing variance or grain of sand can kill the fragile display panel it protects.\"", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 06:11 PM IST", "pub_date_relative": "46m ago"}, {"title": "Column | I saw the future of driving in Mexico. It\u2019s off-limits to Americans. - The Washington Post", "full_content": "Column | I saw the future of driving in Mexico. It\u2019s off-limits to Americans. The Washington Post Caught between the US and China Financial Times Chinese Automakers Make Mexico Their First Stronghold in North America MEXICONOW Op-Ed: US Automakers Are Making a Bad Bet Newser Mexico: Walking a tightrope under mounting US pressure Credendo", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 06:06 PM IST", "pub_date_relative": "51m ago"}, {"title": "Santoli: We are nearing a now-or-never moment for the AI trade to rebound", "full_content": "Get Mike Santoli's Market Memo in your inbox first. SUBSCRIBE HERE\n\nThe difference between a restorative rest and unhealthy stagnation is time. Distinguishing between resilience and fatigue isn't always easy.\n\nThe S&P 500 has been sideways for months, last week dipping to levels first reached on June 1. It has spent nearly all of the last three months within the range the index traveled during a peppy two-day rally Aug. 3-4.\n\nAlong the way, the former leaders of the AI trade, captured in the iShares AI Innovation ETF, have collapsed by 35 percentage points relative to the equal-weight S&P 500, then regained half the loss, then gave up most of that bounce.\n\nAside from giving all of us plenty of time and room for overthinking it, this process of constant churn and testing and positioning shocks has done some good, in a tactical sense.\n\nIt has created short-term washout conditions in semiconductors and other former momentum AI-hardware plays. Meantime, the cyclical pockets of the market \u2013 from consumer discretionary to industrials to banks - have undergone double-digit setbacks as higher bond yields and elevated oil prices restrain growth expectations.\n\nEquity investors have shown a clear preference for quality and defense, as the debt markets have begun rationing growth capital more stringently, raising hurdle rates for the more marginal AI-data-center borrowers.\n\nAlong the way, some familiar intermarket relationships have been scrambled: Treasury yields have stopped moving closely with oil, yields retreating well off their highs as crude stays above $100 a barrel. And the S&P 500's former inverse correlation with Treasury yields has loosened, as the bond market bid seems more tied to hiccups in the AI buildout, which has stymied the Big Tech players.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:03 PM IST", "pub_date_relative": "54m ago"}, {"title": "Ola Electric shares surge 16%, biggest 1-day gain since April; why is the stock rallying despite brokerage downgrades?", "full_content": "Shares of Ola Electric surged on Tuesday, October 27, rising 16.3% to close at \u20b9 34.80 apiece. The rally marked the stock\u2019s biggest single-day gain since April.\n\nAlthough there was no immediate fundamental trigger behind the rebound, a sharp spike in trading volumes helped the stock recover from its recent weakness. Around 345 million shares changed hands across the BSE and NSE during the session, nearly 3.2 times the stock\u2019s weekly average volume.\n\nA broader rebound in auto stocks, along with better-than-expected performance by peer Ather Energy, also supported investor sentiment.\n\nDespite Tuesday\u2019s recovery, Ola Electric shares remain down around 4% for the month. Earlier in October, the stock slipped to a five-month low after receiving back-to-back downgrades from global brokerage firms.\n\nGlobal investment bank Goldman Sachs downgraded Ola Electric Mobility to \u2018Sell\u2019 from \u2018Neutral\u2019 earlier this week and cut its target price to \u20b9 23 per share from \u20b9 39.28. The brokerage cited a challenging path to free cash flow amid high interest costs, capital expenditure requirements, and prolonged operating losses.\n\nGoldman Sachs said Ola Electric would need to scale up its revenue to 3.6 times to 7.1 times its FY26 level by FY28\u2013FY30 to cover its current capital expenditure and interest-servicing requirements. This comes after the company\u2019s revenue declined 55% in FY26 compared with FY24.\n\nThe brokerage also cut its FY27\u2013FY29 revenue estimates for Ola Electric by up to 10%, citing a challenging market-share environment relative to its two-wheeler peers.\n\nEarlier this month, HSBC assigned a \u2018Reduce\u2019 rating to the stock with a target price of \u20b9 23.57 per share. Investec\u2019s also maintained a \u2018Hold\u2019 rating with a target price of \u20b9 34.37.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 06:03 PM IST", "pub_date_relative": "54m ago"}, {"title": "My wife cried when I found out she had only $80,000 in her 401(k). I have $2.2 million. Am I wrong to be shocked?", "full_content": "\u201cWhen I brought up retiring last spring, she said she was ready whenever I was, and I took that to mean we were in good shape.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 06:00 PM IST", "pub_date_relative": "58m ago"}, {"title": "Market wrap: Bharti Airtel, Tata Consumer, Asian Paints, Coal India top gainers and losers on Nifty and Sensex on Tuesday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Bharti Airtel, Tata Consumer, Asian Paints, Coal India top gainers and losers on Nifty and Sensex on Tuesday LKP Securities Share Price AK Capital Services Share Price Prime Securities Share Price Master Trust Share Price Dolat Algotech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Bharti Airtel, Tata Consumer, Asian Paints, Coal India top gainers and losers on Nifty and Sensex on Tuesday SECTIONS Market wrap: Bharti Airtel, Tata Consumer, Asian Paints, Coal India top gainers and losers on Nifty and Sensex on Tuesday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 27, 2026, 05:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity benchmarks ended nearly flat on Tuesday, with the Nifty 50 slipping 0.02% and the Sensex falling 8 points amid elevated crude prices and caution ahead of the US Fed decision. Tata Consumer and Bharti Airtel led gainers, while Asian Paints and Coal India topped the losers\u2019 list.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:58 PM IST", "pub_date_relative": "59m ago"}, {"title": "Israel election puts Netanyahu\u2019s wartime leadership on the line as Trump urges voters to return him to power", "full_content": "Israeli voters will head to the polls Tuesday in an election with implications beyond the country\u2019s borders.\n\nIt is Israel\u2019s first election since Hamas\u2019 Oct. 7, 2023, attacks, which killed around 1,200 people and saw more than 250 abducted. The Palestinian Ministry of Health says Israel\u2019s subsequent military campaign in Gaza has killed more than 74,500 people . It is also the first vote since the U.S. and Israel began their joint war against Iran in February.\n\nWith defense at the forefront of the debate for all the main contenders, tens of thousands of Israeli citizens are believed to have flown home to cast their votes in what is expected to be a tight-knit race.\n\nIsraelis vote for parties rather than directly electing a prime minister, with the Knesset\u2019s 120 seats allocated through proportional representation. Parties must win at least 3.25% of the national vote to enter parliament.\n\nBecause outright majorities are rare, parties typically form coalitions. The president asks a Knesset member \u2014 usually the leader best placed to assemble a 61-seat majority \u2014 to form a government. If repeated attempts fail, another election can be called.\n\nPrime Minister Benjamin Netanyahu , who leads the right-wing Likud party, returned to power in late 2022 with a coalition including far-right and ultra-Orthodox parties. The alliance has since been strained by disputes over a Gaza ceasefire and the conscription of ultra-Orthodox men.\n\nRecent polls put both Netanyahu's bloc and the main opposition bloc, led by centrist former military chief Gadi Eisenkot, short of the 61 seats needed to govern, making smaller parties potentially decisive.\n\nArab parties are also in the running, but most of the main Jewish parties have ruled out alliances with them. More than 20% of Israel's population is Arab, but Arab parties have rarely joined governing coalitions.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:58 PM IST", "pub_date_relative": "59m ago"}, {"title": "Can a video recording protect your will from future disputes?", "full_content": "Videographing the execution of a will can strengthen the evidentiary record by helping establish that the testator understood what they were signing, appeared mentally capable, acted voluntarily and executed the Will in the presence of the relevant witnesses. Indian courts have also recognised such recordings as relevant supporting evidence when examining the genuineness of a Will and the circumstances surrounding its execution.\n\nA video, however, cannot substitute for proper execution, attesting witnesses or compliance with the legal requirements governing a will. Its real value lies in preserving the circumstances in which the will was executed, long after the testator is no longer available to explain them.\n\nThat value, however, depends heavily on how the recording is made. To serve its purpose, a well-made recording should be clear, credible and leave as little room for doubt as possible.\n\nThe testator should be clearly identifiable and confirm, in their own words, that they understand the document, its broad effect and that it reflects their wishes. The will should be visible on camera, with the recording making it clear that the document shown is the same one being signed and attested. The attesting witnesses and, where appropriate, others present should also be identifiable. Taken together, the footage should establish what document was executed, by whom and in what circumstances.\n\nEqually important, the recording should demonstrate that the will was the testator\u2019s voluntary act, free from undue influence or excessive involvement by anyone who stands to benefit from it.\n\nContinuity matters. A single, uninterrupted recording is generally preferable to multiple takes or edited clips, which may raise questions about what occurred off camera. An overly staged or poorly executed recording can create as many doubts as it seeks to dispel. The original file should therefore be preserved securely, along with its metadata and date and time information.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 05:58 PM IST", "pub_date_relative": "59m ago"}, {"title": "Here are Tuesday's biggest analyst calls: SpaceX, Apple, Broadcom, CoreWeave, Palantir, Intel & more", "full_content": "Here are the biggest calls on Wall Street on Tuesday.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why SoFi\u2019s stock is soaring after earnings", "full_content": "SoFi\u2019s early 2027 forecast is impressing Wall Street after a tough stretch for the stock.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 05:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Frozen housing market sends remodelers mixed messages", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nHome remodelers have always served two different markets, but the current state of housing is now pulling them opposite directions. First, people tend to remodel when they move, but high interest rates, high home prices and weak consumer sentiment have put the housing market in a deep freeze. Homeowners also tend to renovate when they are unable or don't want to sell. So which way will the remodeling market shift?\n\nAnnual spending on home improvements and repairs is expected to remain relatively flat through late 2027, according to the latest Leading Indicator of Remodeling Activity (LIRA) from the Remodeling Futures Program at the Joint Center for Housing Studies of Harvard University. It puts spending growth on renovation and repairs at just 1.5% year-over-year by the third quarter. \"Retail spending on building products has been flat to negative, and remodeling permits have stagnated, which points to continued sluggish renovation activity,\" said Rachel Bogardus Drew, director of the remodeling futures program at the Center, in a release. \"We expect annual spending to hover around $525 billion through the third quarter of next year.\"\n\nThe U.S. Census Bureau's monthly read on single-family housing starts for September came in well below expectations, as did building permits, an indicator of future construction.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio IPO GMP hints at 22% listing-day pop for a market cap second only to Reliance Industries", "full_content": "For investors lucky enough to land shares in Jio Platforms Ltd.\u2019s $3.1 billion IPO, trading on the unofficial market is fuelling hopes of a big debut pop.\n\nBillionaire Mukesh Ambani\u2019s digital and telecommunications giant has attracted stellar demand across investor categories ahead of its 28 October market debut. Investors who got their allocations on Tuesday are now closely watching Jio\u2019s gray-market pricing for clues about how the first day might unfold. The premium over the IPO price has hovered at about 22% for roughly 10 days, unusually resilient for an offering of this size, according to the ipowatch.in and investorgain.com platforms.\n\nGMPs are unregulated and provide no guarantee of where a stock will actually trade once it hits the exchange. Still, they are widely tracked in India as a barometer of demand and listing-day sentiment.\n\nIf the pattern holds into the listing, it would make Jio Platforms India\u2019s second-most valuable company after parent Reliance Industries Ltd., pushing rival Bharti Airtel Ltd. into third place. That prospect is adding to the excitement around an IPO that\u2019s already rewritten records in India\u2019s capital markets. Jio Platforms attracted more than $78 billion in bids and nearly 14 million applications in one of the country\u2019s most anticipated listings.\n\nSo far, Jio has been able to defy the usual trend of gray market premiums cooling after an IPO closes, as the initial rush of bidding fades and investors shift their focus to allotments and the eventual listing. After National Stock Exchange of India Ltd.\u2019s $2.4 billion IPO, the premium gradually eroded from about 15% to 3% in two weeks and the shares ultimately made a relatively muted debut.\n\nThe optimism is backed by blockbuster subscription numbers. Jio\u2019s IPO was subscribed more than 22 times, with qualified institutional buyers bidding for 71 times the shares reserved for them. Wealthy investors subscribed 14 times their allocation, while the retail portion was covered 2.7 times.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Capital Q2 Results: Profit jumps 51% to Rs 1,660 crore; NII up 23%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Tata Capital Q2 Results: Profit jumps 51% to Rs 1,660 crore; NII up 23% Tata Capital Share Price Shriram Finance Share Price Jio Financial Services Share Price Cholamandalam Investment & Finance Company Share Price Aditya Birla Capital Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Tata Capital Q2 Results: Profit jumps 51% to Rs 1,660 crore; NII up 23% SECTIONS Tata Capital Q2 Results: Profit jumps 51% to Rs 1,660 crore; NII up 23% By Akash Podishetti , ETMarkets.com Last Updated: Oct 27, 2026, 05:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tata Capital\u2019s September-quarter net profit surged 51% year-on-year to Rs 1,660 crore, driven by loan growth, higher interest income and lower provisions. Its loan book crossed Rs 3 lakh crore, while improving margins and asset quality strengthened profitability.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Coca-Cola hikes earnings outlook, even as it sees lackluster demand in North America", "full_content": "Coca-Cola on Tuesday raised its full-year outlook for the third straight quarter, despite lackluster demand in its home market.\n\nFor the full year, Coke now expects comparable earnings per share to grow at least 11%, up from its prior forecast of an increase in the range of 9% to 10%. The beverage giant also anticipates that its organic revenue will climb at least 5%, a slight increase from its previous outlook of approximately 5% growth.\n\nHere's what the company reported compared with what Wall Street analysts surveyed by LSEG were expecting:\n\nCoke reported third-quarter net income attributable to shareholders of $4.01 billion, or 93 cents per share, up from $3.7 billion, or 86 cents per share, a year earlier.\n\nExcluding transaction gains and other items, Coke earned 91 cents per share.\n\nNet sales rose 7% to $13.4 billion. Coke's organic revenue, which strips out acquisitions, divestitures and foreign currency, also rose 7% in the quarter.\n\nFor the second straight quarter, the company's unit case volume increased 5%, helped by higher demand outside of North America.\n\nCoke's home market reported flat volume. However, the company's North American business would have reported volume growth if not for the timing of the Fourth of July holiday and the months-long shortage of Topo Chico, a sparkling water brand Coke owns, CFO John Murphy told CNBC.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "India benchmark yield falls most in 3 months on value buying", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India benchmark yield falls most in 3 months on value buying Jana Small Finance Bank Share Price Au Small Finance Bank Share Price Ujjivan Small Finance Bank Share Price Equitas Small Finance Bank Share Price Utkarsh Small Finance Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India benchmark yield falls most in 3 months on value buying SECTIONS India benchmark yield falls most in 3 months on value buying Reuters Last Updated: Oct 27, 2026, 05:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds are witnessing a resurgence despite previous instability, as the benchmark 10-year yield has notably decreased. Brent crude prices varied between $114.40 and $117 a barrel during Asian trading. These fluctuations within the debt market have uplifted investor sentiments, and the Indian rupee appears to be stabilizing, contributing positively.\n\nIndian government bonds are witnessing a resurgence despite previous instability, as the benchmark 10-year yield has notably decreased. Brent crude prices varied between $114.40 and $117 a barrel during Asian trading. These fluctuations within the debt market have uplifted investor sentiments, and the Indian rupee appears to be stabilizing, contributing positively.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Vedanta Iron Q2 Results: Loss narrows to Rs 324 crore, revenue declines 2% YoY", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Vedanta Iron Q2 Results: Loss narrows to Rs 324 crore, revenue declines 2% YoY National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Vedanta Iron Q2 Results: Loss narrows to Rs 324 crore, revenue declines 2% YoY SECTIONS Vedanta Iron Q2 Results: Loss narrows to Rs 324 crore, revenue declines 2% YoY By Kumar Gaurav , ETMarkets.com Last Updated: Oct 27, 2026, 05:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vedanta Iron and Steel narrowed its Q2 FY27 loss to Rs 324 crore from Rs 477 crore a year earlier, while revenue declined 1.7% to Rs 2,742 crore. EBITDA rose 56% to Rs 83 crore, supported by improved steel realisations and efficiency gains. The company also reported record half-yearly pig iron production.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Inherited IRAs can boost wealth \u2014 and trigger a tax bill. Here's how to reduce it", "full_content": "An inherited individual retirement account can be a sizable windfall for some investors \u2014 but taxes can take a chunk without proper planning, experts say.\n\nOn average, heirs receive inherited IRAs at age 59, and the mean balance of those accounts is $128,000, according to a recent Vanguard report that analyzed nearly 83,000 accounts in 2024.\n\n\"Most people inherit an IRA in their 50s, right at the peak of their earning years, and then have to empty it within 10 years,\" said certified financial planner Michael Walstedt, founding advisor of Reliant Wealth Advisory in Hoboken, New Jersey.\n\nSince 2020, a \"10-year rule\" applies to some inherited accounts, requiring certain heirs, including adult children, to generally empty the balance by the 10th year after the original account owner's death.\n\nIf it's a pretax inherited IRA, the 10-year withdrawal timeline can boost adjusted gross income, potentially triggering higher taxes and reducing eligibility for other tax breaks, experts say.\n\nInherited IRA planning will continue to be important amid the so-called \"great wealth transfer,\" with baby boomers expected to pass trillions of dollars to Gen Xers and millennials in the coming decades.\n\nOver the next 20 to 25 years, total transfers between generations could be an estimated $74 trillion , according to a 2025 report from financial services firm UBS.\n\nWhether you're preparing to leave a future gift or to inherit an IRA, there are some key tax moves to consider, financial experts say.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "India vs Bangladesh Live Streaming: When And Where To Watch Asian Champions Trophy Hockey Match", "full_content": "Harmanpreet Singh-led India will look to make a winning start to their Asian Champions Trophy 2026 campaign on home soil.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "L&T Q2 Print: Net Profit, Revenue Beat Estimates; Orderbook Jumps 28%", "full_content": "The company's net profit rose 33% to Rs 5,202 crore in the second quarter of the current financial year.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "The One About Matthew Perry Reviews: 'Intimate, Sincere' To 'Just Not It For Me' \u2014 Check Reactions", "full_content": "Emmy winner Mary Robertson directed the documentary and said it aims to show the person behind Matthew Perry\u2019s public image through those who knew and loved him.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Stock Market Live Updates: US stock futures rise as oil falls ahead of Fed decision", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Stock Market Live Updates: US stock futures rise as oil falls ahead of Fed decision Powered By LIVE BLOG US Stock Market Live Updates: US stock futures rise as oil falls ahead of Fed decision 27 Oct 2026 | 06:09:17 PM IST Stock Market Today Live Synopsis Dow Jones | Nasdaq | Stock Market Live: US stock futures rise as oil prices extend their decline ahead of the Federal Reserve\u2019s rate decision. Investors focus on major earnings from Alphabet, Microsoft and Amazon, while concerns over AI spending remain. Tesla gains, Royal Caribbean rises after upbeat results and Whirlpool falls.\n\n- Brian Mulberry, chief market strategist at Zacks Investment Management\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Top stocks to buy in F&O segment: CDSL, Zydus Lifesciences, Sun Pharma by Jay Thakkar for near-term | Check targets", "full_content": "Indian equity benchmarks ended largely flat on Tuesday, 27 October as elevated crude oil prices kept investor sentiment cautious, with market participants awaiting the US Federal Reserve\u2019s policy decision later this week.\n\nThe Nifty 50 declined 0.02% to close at 22,749.75, while the Sensex slipped 0.01% to settle at 73,598.67.\n\nBrent crude traded near $116 per barrel, hovering at six-month highs, as attacks on Saudi Arabia dampened hopes of an immediate easing of tensions in the Middle East.\n\nAmid the range-bound market, Jay Thakkar of ICICI Securities recommends buying CDSL futures at \u20b9 1,210\u2013 \u20b9 1,230, with targets of \u20b9 1,300\u2013 \u20b9 1,350 and a stop-loss below \u20b9 1,150.\n\nFor Zydus Lifesciences futures, he suggests an entry range of \u20b9 1,170\u2013 \u20b9 1,180, with targets of \u20b9 1,250\u2013 \u20b9 1,300 and a stop-loss below \u20b9 1,130. He also recommends buying Sun Pharmaceutical Industries futures at \u20b9 1,760\u2013 \u20b9 1,770, with targets of \u20b9 1,840\u2013 \u20b9 1,880 and a stop-loss below \u20b9 1,730.\n\nJay Thakkar, Vice President and Head of Derivatives and Quantitative Research at ICICI Securities, said the Nifty 50 closed almost flat on monthly expiry day after facing selling pressure at higher levels. The index attempted to move above 22,800 towards 23,000 but failed to sustain the gains. It also briefly slipped below 22,700, reflecting intraday volatility. However, India VIX declined nearly 5%, indicating that volatility remained relatively contained.\n\nThakkar said the market has been trading in a range ahead of key global and domestic events, including the Federal Reserve\u2019s policy decision, GDP data and geopolitical developments. He noted that the Nifty 50\u2019s immediate trading range is 22,000\u201323,000, with a decisive breakout on either side likely to determine the next directional move. Until then, the index is expected to remain range-bound, with India VIX likely to trade between 15 and 20.\n\nOn the Bank Nifty, Thakkar said the index has underperformed the Nifty 50 in recent sessions.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 05:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bessent dines at Cheesecake Factory, slams Obama over Trump joke", "full_content": "Treasury Secretary Scott Bessent on Monday became the latest right-wing critic to accuse former President Barack Obama of elitism for mockingly comparing President Donald Trump 's ostentatious White House renovations to the Cheesecake Factory .\n\nBut Bessent, a former hedge fund manager whose net worth has been estimated at around $600 million , put his money where his mouth is \u2014 dining at the chain restaurant and praising its food before giving the Democratic ex-president a slice of his mind.\n\n\"This is the man who built the museum [that] looks like Darth Vader's tomb,\" Bessent told a Fox Business reporter who asked about Obama's remark as he left the restaurant near the White House. Bessent was apparently referring to the Obama Presidential Center , a monolithic structure that opened in June .\n\n\"I had a great meal, always have a great meal, and I would just tell the Martha's Vineyard set to give it a try,\" Bessent said. Obama vacationed on Martha's Vineyard as president, and he and his wife Michelle now own an estate on the exclusive island.\n\nBessent said he ordered \"what I always have: the French Dip Cheeseburger.\"\n\nThat's a \"Charbroiled Cheeseburger Served on a Toasted Brioche Roll with Grilled Onions, Sriracha Mayo and Au Jus for Dipping,\" one of the \"Glamburgers\" on Cheesecake Factory's famously sprawling menu . The burger, which comes with french fries or a green salad, currently costs $22.95 at the restaurant's downtown Washington location.\n\n\"I recommend the Cheeseburger Spring Rolls,\" Bessent added in a follow-up post on X directed at Obama.\n\nBessent's biting comment followed those of other Trump allies who claim Obama sneered at working-class Americans when he tore into Trump over his extensive White House construction and decoration projects.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "TVS Succession Dispute Escalates As Both Camps File Caveats Across Courts", "full_content": "Venu and Sudarshan's camp maintains that the agreements have already settled the ownership question. Under their interpretation, TVS Holdings and other substantial parts of the business were allocated to Sudarshan, while Sundaram-Clayton and smaller businesses were allocated to Lakshmi.", "source": "NDTV Profit", "pub_date_str": "27 Oct 2026, 05:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tech's relief rally extends as attention turns to tough decisions for the Fed", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHello, this is Leonie Kidd with today's edition of Morning Squawk.\n\nThe Anthropic effect is lifting the Nasdaq for a second day, after providing a boost to global technology stocks overnight.\n\nThe Fed is also in focus, as predictions of a hawkish hold at its meeting this week will almost certainly pave the way for a hike in December.\n\nInvestors look set to get a second day of gains from the tech sector, as the optimism around Anthropic's game-changing IPO announcement continues to support the sector. This comes after the announcement helped fuel a rally across AI-related stocks in Asia and Europe.\n\nIts blockbuster listing on the Nasdaq next month will test investors' appetite following the most significant moment of buyer's remorse for the AI space, after the debt-fueled capex super cycle triggered a rout in the AI darlings over the last few weeks.\n\nDay one of the two-day meeting gets underway later today, with the policy decision due on Wednesday at 2 p.m. ET.\n\nThere are relatively muted premarket moves across Wall Street this morning, but some volatility across European stocks.", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 05:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Larsen & Toubro Q2 Results: Profit surges 33% YoY to Rs 5,202 crore, revenue grows 16%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Larsen & Toubro Q2 Results: Profit surges 33% YoY to Rs 5,202 crore, revenue grows 16% The Economic Times daily newspaper is available online now. Read Today's Paper Larsen & Toubro Q2 Results: Profit surges 33% YoY to Rs 5,202 crore, revenue grows 16% SECTIONS Larsen & Toubro Q2 Results: Profit surges 33% YoY to Rs 5,202 crore, revenue grows 16% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 27, 2026, 05:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis L&T Q2 Results: Larsen & Toubro announced significant financial results for the quarter ended September 30, 2026. The company reported a 33% increase in consolidated profit after tax compared to the previous year. Consolidated revenue also grew by 16%, driven by strong performance across various sectors. Additionally, L&T achieved its highest quarterly order inflow and saw substantial international participation in its orders.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:39 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Boeing narrows third-quarter loss as defense sales rise, but focus remains on 737 Max production", "full_content": "Boeing narrowed its loss in the third quarter after defense sales rose, but CEO Kelly Ortberg told staff that the manufacturer has \"more work to do.\"\n\nHere's what Boeing reported for the third quarter compared with what Wall Street analysts expected, according to consensus estimates from LSEG:\n\nFor the three months ended Sept. 30, Boeing reported a net loss of $116 million, or 26 cents a share, compared with a $5.34 billion loss, or $7.14 per share, a year earlier. Adjusting for one-time items, the company posted a loss of 34 cents a share. A year earlier, Boeing had taken a nearly $5 billion charge on its long-delayed 777X aircraft program.\n\nRevenue climbed 4% on the year to $24.19 billion. Free cash flow rose to $464 million from $238 million in the third quarter of 2025.\n\nThe company's defense unit revenue jumped 15% in the third quarter from a year earlier to $7.94 billion.\n\nBoeing delivered 161 commercial airplanes in the third quarter, one more jet than a year earlier.\n\nRevenue in the all-important commercial aircraft business fell 3% to $10.72 billion. The unit had a negative operating margin of 6.5% because of a \"less favorable delivery mix, higher projected costs associated with future production rate adjustments and higher estimated supply chain costs,\" Boeing said.\n\nThe plane manufacturer's executives are set to update investors on how quickly it can increase aircraft production in the coming months when it holds a quarterly earnings call on Tuesday at 10:30 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:55 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ripple strikes deal with Robinhood to expand its RLSUD digital dollar", "full_content": "Ripple has struck a deal with Robinhood to expand the reach of its digital dollar, RLUSD , strengthening trading and financing links between their institutional businesses and improving Robinhood's internal money management.\n\nThe partnership involves using RLUSD to settle institutional trades, automate Robinhood's treasury operations and expand access to digital asset trading and financing through Ripple Prime and Bitstamp, the global crypto exchange acquired by Robinhood last year .\n\nIt also helps meet Robinhood's ambition of becoming a global financial super-app, centralizing its customers' financial lives while expanding the underlying infrastructure that can serve both retail and institutional clients.\n\n\"Utility is what moves stablecoins forward. Working with Ripple, Bitstamp and Robinhood will have access to RLUSD for institutional settlement, Ripple Treasury for our operations and Ripple Prime for financing,\" Robinhood Crypto general manager Johann Kerbrat said in a statement shared with CNBC. \"That is what a connected, global financial system looks like.\"\n\nStablecoins have long been a workhorse of the crypto world, giving traders a way to move money among exchanges, buy and sell crypto assets, and park funds between trades without having to convert back into traditional currency. But as the crypto industry evolves beyond trading and markets move toward 24/7 liquidity, stablecoins are becoming essential financial infrastructure because of their ability to enable near-instant settlement and move dollar-denominated value at any time, regardless of traditional banking hours.\n\nAs firms look to do more with stablecoins beyond simply listing them on exchanges, stablecoin issuers are betting they'll favor a one-stop-shop approach that bundles the technology and services needed to move money, settle trades and manage cash.\n\n\"Stablecoins have evolved from a crypto trading tool into a critical piece of financial infrastructure,\" Ripple President Monica Long told CNBC.", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 06:53 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Tech stocks gain as AI trade revives", "full_content": "Asia follows Wall Street higher in wake of Anthropic\u2019s long-awaited IPO filing", "source": "FT Markets", "pub_date_str": "27 Oct 2026, 06:52 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "What gave this city its \u2018best place to retire\u2019 crown? You can actually afford to live there.", "full_content": "Low cost of living, high quality of life and favorable taxes for retirees, for the win.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 06:51 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Terrestrial Energy stock surges on $25M buyback program", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 06:45 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Daqo Q3 2026 slides: loss narrows on cost cuts, sales rebound", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 06:43 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "aTyr Pharma announces 1-for-40 reverse stock split effective October 28", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 06:42 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Baldwin Group reports Q3 revenue up 31% to $480.3 million", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Oct 2026, 06:42 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Oil Ticks Higher With Mideast in Focus, Dow Futures Edge Up \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Oil Ticks Higher With Mideast in Focus, Dow Futures Edge Up \u2014 Live Updates WSJ Oil rises as hopes for diplomacy offset impact of renewed Houthi attacks Yahoo Finance Oil prices seesaw amid renewed diplomatic efforts to end Mideast conflict CNBC Oil Declines as Diplomacy Offers Hope of Mideast Deescalation Bloomberg.com Oil settles lower on peace hopes, Saudi attacks limit losses Reuters", "source": "Google News Business", "pub_date_str": "27 Oct 2026, 06:37 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "UPS beats quarterly expectations, raises full-year guidance again", "full_content": "United Parcel Service on Tuesday reported third-quarter results that beat Wall Street expectations and raised its full-year guidance.\n\nThe guidance raise comes after the company already upped its outlook last quarter . UPS now said it's projecting full-year consolidated revenue of approximately $92.6 billion, up from its previous expectations of $91.2 billion, as well as fourth-quarter revenue of $25.7 billion.\n\nHere's how the company performed in its third quarter, compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nFor the quarter ended Sept. 30, UPS reported net income of $1.16 billion, or $1.37 per share, down slightly from net income of $1.31 billion, or $1.55, the year prior. Adjusting for one-time expenses, UPS reported earnings per share of $1.69. Revenue rose 6.7% to $22.9 billion.\n\nIn its domestic segment, the company said it saw a 4.5% increase in revenue, while its international segment had a 7.1% rise in revenue. Its supply chain solutions business saw an 18.2% revenue increase, which UPS said was primarily driven to growth in forwarding and logistics, including healthcare . On a call with analysts, CEO Carol Tom\u00e9 said healthcare revenue exceeded $3 billion for the third consecutive quarter.\n\nThe company had previously said it expected its third-quarter domestic revenue to be flat and for domestic average daily volume to fall due to seasonal declines and the glide down with Amazon .\n\n\"We're driving more premium growth, improving revenue quality and mix, and creating greater operating leverage through a more efficient network,\" Tom\u00e9 said on the call. \"All of this is strengthening the underlying performance of our business.\"\n\nUPS has been in the midst of a turnaround under Tom\u00e9's leadership, working to create a leaner business model and leveraging automation to position the company for growth.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:34 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Diwali 2026: Buying gold this Dhanteras? How to avoid fake jewellery scams and check purity", "full_content": "With Diwali approaching, gold purchases are expected to gain momentum as families prepare to celebrate Dhanteras, an auspicious occasion traditionally associated with buying precious metals. Many households save throughout the year for this annual purchase, viewing g old as a symbol of prosperity, wealth and good fortune.\n\nHowever, rising demand for gold also makes it important for buyers to remain alert to counterfeit jewellery and purity-related fraud. Attractive discounts and deals can sometimes conceal jewellery with lower gold content than advertised, potentially causing financial losses for unsuspecting customers.\n\nBuyers can reduce these risks by checking the Bureau of Indian Standards (BIS) hallmark and verifying the Hallmark Unique Identification (HUID) number before completing a purchase.\n\nThe BIS hallmark is a certification that indicates the purity of hallmarked gold jewellery. It helps consumers establish whether the gold meets the declared fineness standards.\n\nBuyers should check for the following details on hallmarked gold jewellery:\n\nThese markings are generally engraved on the jewellery and may be small enough to require a magnifying glass to read clearly.\n\nConsumers should inspect the markings carefully before making a purchase. However, checking the engraving alone may not be sufficient; buyers should also verify the HUID through the official BIS Care application.\n\nThe BIS Care app provides a facility for consumers to check the details associated with a jewellery item's HUID number.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 06:30 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock futures rise as chip stocks gain for a second day, oil prices ease: Live updates", "full_content": "Stock futures rose on Tuesday as enthusiasm surrounding chipmakers led traders to move into the names for another day. Traders also monitored a slide in oil prices and parsed through a slew of corporate earnings as the Federal Reserve began its two-day policy meeting.\n\nS&P 500 futures were up 0.3%, while Dow Jones Industrial Average futures climbed 132 points, or 0.3%. Nasdaq-100 futures gained 0.5%.\n\nShares of Broadcom climbed more than 2% on the heels of a coalition of banks \u2014 namely, Bank of America , Citi and Morgan Stanley \u2014 and Blackstone announcing $63 billion in financing for the purchase of Broadcom's technology for Anthropic. Other chipmakers rose in sympathy. Micron Technology was up more than 2%, while Advanced Micro Devices and Nvidia advanced nearly 2% and around 1%, respectively.\n\nThe latest moves in those stocks add to their gains from the prior trading day, which saw the major averages record a winning session , thanks in part to a boost in artificial intelligence-related stocks after Anthropic filed to go public at the Nasdaq. This would mark another major tech IPO for 2026, following SpaceX's blockbuster listing in June.\n\nA decline in oil prices also supported sentiment Tuesday, as investors were hopeful for a de-escalation in the regional conflict. U.S. West Texas Intermediate futures shed nearly 1% to around $101 per barrel, while global benchmark Brent crude futures shed about 1% to roughly $114 a barrel.\n\nMeanwhile, UPS shares added more than 1% after the delivery giant reported better-than-expected results for the third quarter. JetBlue jumped more than 11% despite the airline posting a larger-than-expected third-quarter loss, as the company said it expects to see further margin expansion in the fourth quarter. On the flip side, Whirlpool shed 7% after posting a surprise quarterly loss.\n\nThe Fed is set to kick off its latest monetary policy meeting Tuesday.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:27 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Tuesday", "full_content": "Broadcom arranged chip financing for Anthropic, and Meta upsized its secondary stock sale.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:21 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "World Bank's Banga: Availability of capital 'not really an issue' as AI demand drives up borrowing costs", "full_content": "World Bank President Ajay Banga said on Tuesday that capital remained available despite concerns of artificial intelligence sending interest rates higher.\n\n\"It's not really an issue,\" Banga said in an interview on CNBC's \"Squawk Box.\"\n\nBanga said the World Bank mobilized $112 billion last year, around three times higher than the amount recorded three years prior.\n\nHe said investors may be concerned about circular financing and the business model tied to AI.\n\nBut Banga told CNBC that emerging markets are not running into the same hesitancy because the investments focus more on infrastructure like bridges and roads.\n\nThese countries also look at smaller-scale uses of AI, according to Banga. Banga said developed counterparts look to funding to support large use cases, which he described as the \"exact opposite\" need.\n\nThe World Bank leader also said that the private capital it oversees does not go to governments. As a result, the organization can avoid fears of looming debt crises and challenges related to rising bond yields within some countries.\n\n\"In general, I still believe that AI is going to be transformative and profitable,\" Banga said. \"But everybody sees bumps in the road from here to there, and no one knows when the next bump will come.\"", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:20 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Apple responds to user reports of broken iPhone Duo screens on new foldable phone", "full_content": "Apple's first foldable phone, the iPhone Duo, hit store shelves on Friday to considerable lines and long wait times for preorders.\n\nBut some customers who were lucky enough to get the $1,999-and-up phone on its first weekend have been reporting a pretty big problem: The inner screen of the phone can break, showing horizontal bright lines emanating from the phone's hinge.\n\nApple on Monday said that it was aware of the issue, which it said affected a \"small number\" of phones, and that it would replace the devices under its AppleCare warranty.\n\n\"We are aware of an issue impacting the inner display on a small number of iPhone Duo units,\" an Apple representative told CNBC. \"If users experience issues with their iPhone Duo display, they should contact AppleCare for a replacement.\"\n\nApple says on its website that an inner-screen repair will be $999 for iPhone Duos that are out of warranty.\n\nMost of the reports are from anonymous customers on online forums such as Reddit and X , and there are fake images online as well. But well-respected device repair firm iFixit weighed in on Sunday, after tearing down the new device and testing its resistance to dust, and theorized the issues may have to do with Apple's hinge design.\n\n\"Many of these damage reports describe folding or unfolding the phone, hearing a crunch, and pushing past it,\" said iFixit technician Shahram Mokhtari in its teardown video . \"Right where the damage is happening, the hinge is shaped a little differently.\"\n\n\"The hinge is actually dozens of parts, with ludicrous precision,\" iFixit CEO Kyle Wiens posted on X. \"A manufacturing variance or grain of sand can kill the fragile display panel it protects.\"", "source": "CNBC World Economy", "pub_date_str": "27 Oct 2026, 06:11 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Santoli: We are nearing a now-or-never moment for the AI trade to rebound", "full_content": "Get Mike Santoli's Market Memo in your inbox first. SUBSCRIBE HERE\n\nThe difference between a restorative rest and unhealthy stagnation is time. Distinguishing between resilience and fatigue isn't always easy.\n\nThe S&P 500 has been sideways for months, last week dipping to levels first reached on June 1. It has spent nearly all of the last three months within the range the index traveled during a peppy two-day rally Aug. 3-4.\n\nAlong the way, the former leaders of the AI trade, captured in the iShares AI Innovation ETF, have collapsed by 35 percentage points relative to the equal-weight S&P 500, then regained half the loss, then gave up most of that bounce.\n\nAside from giving all of us plenty of time and room for overthinking it, this process of constant churn and testing and positioning shocks has done some good, in a tactical sense.\n\nIt has created short-term washout conditions in semiconductors and other former momentum AI-hardware plays. Meantime, the cyclical pockets of the market \u2013 from consumer discretionary to industrials to banks - have undergone double-digit setbacks as higher bond yields and elevated oil prices restrain growth expectations.\n\nEquity investors have shown a clear preference for quality and defense, as the debt markets have begun rationing growth capital more stringently, raising hurdle rates for the more marginal AI-data-center borrowers.\n\nAlong the way, some familiar intermarket relationships have been scrambled: Treasury yields have stopped moving closely with oil, yields retreating well off their highs as crude stays above $100 a barrel. And the S&P 500's former inverse correlation with Treasury yields has loosened, as the bond market bid seems more tied to hiccups in the AI buildout, which has stymied the Big Tech players.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 06:03 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Ola Electric shares surge 16%, biggest 1-day gain since April; why is the stock rallying despite brokerage downgrades?", "full_content": "Shares of Ola Electric surged on Tuesday, October 27, rising 16.3% to close at \u20b9 34.80 apiece. The rally marked the stock\u2019s biggest single-day gain since April.\n\nAlthough there was no immediate fundamental trigger behind the rebound, a sharp spike in trading volumes helped the stock recover from its recent weakness. Around 345 million shares changed hands across the BSE and NSE during the session, nearly 3.2 times the stock\u2019s weekly average volume.\n\nA broader rebound in auto stocks, along with better-than-expected performance by peer Ather Energy, also supported investor sentiment.\n\nDespite Tuesday\u2019s recovery, Ola Electric shares remain down around 4% for the month. Earlier in October, the stock slipped to a five-month low after receiving back-to-back downgrades from global brokerage firms.\n\nGlobal investment bank Goldman Sachs downgraded Ola Electric Mobility to \u2018Sell\u2019 from \u2018Neutral\u2019 earlier this week and cut its target price to \u20b9 23 per share from \u20b9 39.28. The brokerage cited a challenging path to free cash flow amid high interest costs, capital expenditure requirements, and prolonged operating losses.\n\nGoldman Sachs said Ola Electric would need to scale up its revenue to 3.6 times to 7.1 times its FY26 level by FY28\u2013FY30 to cover its current capital expenditure and interest-servicing requirements. This comes after the company\u2019s revenue declined 55% in FY26 compared with FY24.\n\nThe brokerage also cut its FY27\u2013FY29 revenue estimates for Ola Electric by up to 10%, citing a challenging market-share environment relative to its two-wheeler peers.\n\nEarlier this month, HSBC assigned a \u2018Reduce\u2019 rating to the stock with a target price of \u20b9 23.57 per share. Investec\u2019s also maintained a \u2018Hold\u2019 rating with a target price of \u20b9 34.37.", "source": "LiveMint Markets", "pub_date_str": "27 Oct 2026, 06:03 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Market wrap: Bharti Airtel, Tata Consumer, Asian Paints, Coal India top gainers and losers on Nifty and Sensex on Tuesday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Bharti Airtel, Tata Consumer, Asian Paints, Coal India top gainers and losers on Nifty and Sensex on Tuesday LKP Securities Share Price AK Capital Services Share Price Prime Securities Share Price Master Trust Share Price Dolat Algotech Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Bharti Airtel, Tata Consumer, Asian Paints, Coal India top gainers and losers on Nifty and Sensex on Tuesday SECTIONS Market wrap: Bharti Airtel, Tata Consumer, Asian Paints, Coal India top gainers and losers on Nifty and Sensex on Tuesday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 27, 2026, 05:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity benchmarks ended nearly flat on Tuesday, with the Nifty 50 slipping 0.02% and the Sensex falling 8 points amid elevated crude prices and caution ahead of the US Fed decision. Tata Consumer and Bharti Airtel led gainers, while Asian Paints and Coal India topped the losers\u2019 list.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Oct 2026, 05:58 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Can a video recording protect your will from future disputes?", "full_content": "Videographing the execution of a will can strengthen the evidentiary record by helping establish that the testator understood what they were signing, appeared mentally capable, acted voluntarily and executed the Will in the presence of the relevant witnesses. Indian courts have also recognised such recordings as relevant supporting evidence when examining the genuineness of a Will and the circumstances surrounding its execution.\n\nA video, however, cannot substitute for proper execution, attesting witnesses or compliance with the legal requirements governing a will. Its real value lies in preserving the circumstances in which the will was executed, long after the testator is no longer available to explain them.\n\nThat value, however, depends heavily on how the recording is made. To serve its purpose, a well-made recording should be clear, credible and leave as little room for doubt as possible.\n\nThe testator should be clearly identifiable and confirm, in their own words, that they understand the document, its broad effect and that it reflects their wishes. The will should be visible on camera, with the recording making it clear that the document shown is the same one being signed and attested. The attesting witnesses and, where appropriate, others present should also be identifiable. Taken together, the footage should establish what document was executed, by whom and in what circumstances.\n\nEqually important, the recording should demonstrate that the will was the testator\u2019s voluntary act, free from undue influence or excessive involvement by anyone who stands to benefit from it.\n\nContinuity matters. A single, uninterrupted recording is generally preferable to multiple takes or edited clips, which may raise questions about what occurred off camera. An overly staged or poorly executed recording can create as many doubts as it seeks to dispel. The original file should therefore be preserved securely, along with its metadata and date and time information.", "source": "LiveMint Money", "pub_date_str": "27 Oct 2026, 05:58 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why SoFi\u2019s stock is soaring after earnings", "full_content": "SoFi\u2019s early 2027 forecast is impressing Wall Street after a tough stretch for the stock.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Oct 2026, 05:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Frozen housing market sends remodelers mixed messages", "full_content": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\n\nHome remodelers have always served two different markets, but the current state of housing is now pulling them opposite directions. First, people tend to remodel when they move, but high interest rates, high home prices and weak consumer sentiment have put the housing market in a deep freeze. Homeowners also tend to renovate when they are unable or don't want to sell. So which way will the remodeling market shift?\n\nAnnual spending on home improvements and repairs is expected to remain relatively flat through late 2027, according to the latest Leading Indicator of Remodeling Activity (LIRA) from the Remodeling Futures Program at the Joint Center for Housing Studies of Harvard University. It puts spending growth on renovation and repairs at just 1.5% year-over-year by the third quarter. \"Retail spending on building products has been flat to negative, and remodeling permits have stagnated, which points to continued sluggish renovation activity,\" said Rachel Bogardus Drew, director of the remodeling futures program at the Center, in a release. \"We expect annual spending to hover around $525 billion through the third quarter of next year.\"\n\nThe U.S. Census Bureau's monthly read on single-family housing starts for September came in well below expectations, as did building permits, an indicator of future construction.", "source": "CNBC Top News", "pub_date_str": "27 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Jio IPO GMP hints at 22% listing-day pop for a market cap second only to Reliance Industries", "full_content": "For investors lucky enough to land shares in Jio Platforms Ltd.\u2019s $3.1 billion IPO, trading on the unofficial market is fuelling hopes of a big debut pop.\n\nBillionaire Mukesh Ambani\u2019s digital and telecommunications giant has attracted stellar demand across investor categories ahead of its 28 October market debut. Investors who got their allocations on Tuesday are now closely watching Jio\u2019s gray-market pricing for clues about how the first day might unfold. The premium over the IPO price has hovered at about 22% for roughly 10 days, unusually resilient for an offering of this size, according to the ipowatch.in and investorgain.com platforms.\n\nGMPs are unregulated and provide no guarantee of where a stock will actually trade once it hits the exchange. Still, they are widely tracked in India as a barometer of demand and listing-day sentiment.\n\nIf the pattern holds into the listing, it would make Jio Pl
