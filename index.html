an's nuclear ambitions remains a critical part of U.S. demands, as efforts to reach a lasting ceasefire agreement between the two sides remain fruitless.\n\nIran indicated there have been \"no negotiations\" between Tehran and Washington over Iran's nuclear program, according to a Reuters report. The news agency cited comments by a senior Iranian official involved in indirect talks with Washington, who said U.S. ideas about the program are \"at odds\" with those of the Islamic Republic.\n\nRubio's remarks follow comments by Vice President J.D. Vance , who earlier this week said any agreement to resolve the seven-month conflict must include a commitment by Iran to a \"meaningful\" reduction in its nuclear enrichment.\n\nThe senior Iranian official said Vance's comments reflect American \"ideas and interests,\" adding, \"Iran will never give up its right to enrich, but enrichment details can be discussed later.\"\n\nPresident Donald Trump last week denied reports that he had pitched sanctions relief to Iran in exchange for nuclear concessions.\n\nBrent crude. The absence of any agreement has seen Iran ramp up attacks on tankers passing through the Strait of Hormuz in recent days, where vessels now rely on U.S. military protection to navigate the critical waterway.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:47 PM IST", "pub_date_relative": "21m ago"}, {"title": "This wearable AI stock is set to rally thanks to a broader business focus, Jefferies says", "full_content": "A maker of energy efficient computer chips is likely to soar as smart-device hardware and AI compute businesses continue to gain traction, one analyst says.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:45 PM IST", "pub_date_relative": "23m ago"}, {"title": "Gold slides to two-month low as robust dollar, yields add pressure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Bus  the stock to rise another 40% from current levels, even as it has gained 26% so far this year.\n\nIt has retained its 'buy' rating on the stock with a target price of \u20b9 1550, indicating an upside potential of 45.25% from the stock's Wednesday closing price of \u20b9 1067 apiece, as it believes the market does not fully appreciate management's execution track record, diversification benefits, and efficient operations.\n\nIn terms of valuations, the brokerage pointed out that the stock trades at 7.5x one-year forward EV/EBITDA, in line with the three-year average, leaving room for multiple expansion.\n\nIn its note, the brokerage highlighted three key reasons for its strong outlook: disciplined capital allocation, superior project execution, and efficient operations\u2014the key differentiators for a commodity company.\n\nUBS\u2019 review of completed and upcoming projects indicates that Shyam delivers capex at a lower cost and with shorter timelines than industry averages, supporting superior ROIC and faster growth.\n\nDriven by its new capex plan and increasing focus on value-added products, UBS forecasts EBITDA per tonne to improve from \u20b9 4,700 in FY26 to \u20b9 8,400 by FY31, implying a 24% EBITDA CAGR in FY26-31E, versus 12% in FY21-26.\n\nWith a faster ramp-up of new capacity and the transition to higher-value-added products, UBS has raised its FY28/FY29E EBITDA estimates by 3%/8%, which are 8%/6% above consensus, respectively.\n\nUBS now anticipates that the company can accelerate earnings growth over the next five years, citing a shift in its product mix towards higher-value segments such as stainless steel, CRM, aluminum, SBQ, and railway wagons, while reducing its dependence on low-margin intermediates.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 07:41 PM IST", "pub_date_relative": "27m ago"}, {"title": "Ola Electric board approves rights issue at 26% discount; shareholders to pay in two calls", "full_content": "Home ETPrime Mark relative": "29m ago"}, {"title": "One of the worst parts of the stock market this year is looking like a bargain, says Wolfe Research", "full_content": "Utilities have gotten the wind knocked out of them in 2026 after back-to-back annual gains.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:37 PM IST", "pub_date_relative": "30m ago"}, {"title": "Adani Enterprises gets rating upgrade from CARE Ratings to AA; Stable; shares up 21% in 2026", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Adani Enterprises gets rating upgrade from CARE Ratings to AA; Stable; shares up 21% in 2026 CARE Ratings Share Price Crisil Share Price ICRA Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Adani Enterprises gets rating upgrade from CARE Ratings to AA; Stable; shares up 21% in 2026 SECTIONS Adani Enterprises gets rating upgrade from CARE Ratings to AA; Stable; shares up 21% in 2026 By Kumar Gaurav , ETMarkets.com Last Updated: Oct 07, 2026, 07:34:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Adani Enterprises secured its highest-ever credit rating after CARE Ratings upgraded its long-term rating to CARE AA; Stable from CARE AA-; Stable. The agency cited stronger financial flexibility following a Rs 15,000 crore QIP and Adani Airports stake sale.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 07:34 PM IST", "pub_date_relative": "34m ago"}, {"title": "Best 3 stocks to buy: Balrampur Chini, Bluestone, Kotak Bank by Vaishali Parekh | Target, stop-loss, Nifty prediction", "full_content": "Stocks to buy today | Vaishali Parekh's stock recommendations for today: The key benchmark indices of the Indian stock market opened sharply lower and remained under pressure as markets witnessed a sell-off following the RBI\u2019s rate hike. The central bank raised rates by 25 basis points and shifted its stance to \u201ccalibrated tightening,\u201d triggering a negative reaction across the benchmarks. Continued weakness in the rupee further weighed on investor sentiment.\n\nThe Nifty 50 declined 0.76% to close at 22,603, while the Sensex fell 0.59% to close at 72,638.\n\nOn the sectoral front, PSU Banks and Media were the key gainers, while Metal, Realty, Auto and IT remained the major laggards. The broader market remained mixed, with the Nifty Midcap 100 declining 0.63%, while the Nifty Smallcap 100 gained 0.30%.\n\nVaishali Parekh, Vice President \u2014 Technical Research at Prabhudas Lilladher, believes the Indian stock market is biased toward caution, as the 50-stock index remains below 23,000. She said the Nifty 50 index is trading in a broader range of 22,000 to 23,000.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 07:31 PM IST", "pub_date_relative": "37m ago"}, {"title": "Loneliness and social isolation can take six years off your life", "full_content": "Loneliness and social isolation can cut almost six healthy years from your life, according to a study that quantified the impact of social problems that often plague older adults.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 07:31 PM IST", "pub_date_relative": "37m ago"}, {"title": "Micron\u2019s ridiculously cheap stock could triple from here, according to this analyst\u2019s math", "full_content": "A D.A. Davidson analyst thinks investors aren\u2019t properly appreciating the company\u2019s growth potential or the impact of an upcoming buyback program.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 07:31 PM IST", "pub_date_relative": "37m ago"}, {"title": "US stocks: US market opens lower as bond yields and oil rebound; Fed minutes in focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US market opens lower as bond yields and oil rebound; Fed minutes in focus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US market opens lower as bond yields and oil rebound; Fed minutes in focus SECTIONS US stocks: US market opens lower as bond yields and oil rebound; Fed minutes in focus Reuters Last Updated: Oct 07, 2026, 07:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Wednesday, Wall Street opened to a downturn, with the Dow Jones Industrial Average declining by 325.06 points, highlighting a sense of caution among investors. The S&P 500 and Nasdaq Composite mirrored this negativity, influenced by the spike in Treasury yields. With the release of the Federal Reserve's meeting minutes looming, investor sentiment remained cautious amid climbing Treasury yields and oil prices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 07:29 PM IST", "pub_date_relative": "38m ago"}, {"title": "Stocks made a record high. Two big bearish trades point to skepticism", "full_content": "The Nasdaq-100 is up 15% since its July low and is now 2% above its previous record from June. The S&P 500 , after a two-month-long battle with surging interest rates, is back trading at an all-time high.\n\nYou'd think that resilience would be met with some fanfare. Instead, the two biggest options trades on the tape Tuesday reeked of skepticism.\n\nIn the State Street SPDR S&P 500 ETF Trust (SPY) , about an hour after the opening bell on Tuesday, someone traded a 100,000-lot put spread that cost a net $44 million and likely included buying $61 million of 655-strike puts expiring in March and selling $17 million of 500-strike puts in the same expiry.\n\nIt's a bearish bet that is most profitable if the SPY falls to $500 \u2014 a 35% decline from its current levels.\n\nSPX year to date \"If you're trying to hedge, these March options are the cheapest they've been in 90 days,\" said Brent Kochuba of options analytics firm SpotGamma. \"The vol is fairly low.\"\n\nCboe's VIX Index did slip below 15 at one point Tuesday, meaning options generally got cheaper, but the put spread was the biggest trade in SPY on a day where options volume was more than 20% higher than the 30-day average.\n\nThe bulky trade, which starts making money if the S&P 500 drops more than 18%, was about four times bigger than the next-biggest trade, a net $11 million call spread, SpotGamma data show.\n\nAt the same time, an even bigger trade went off in options on Meta despite the social media giant rallying 20% the past month as downloads of the tech giant's personal assistant Muse soar.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:29 PM IST", "pub_date_relative": "39m ago"}, {"title": "Onion Prices Fall Across India: Govt Deploys 467 Trucks, 8 Kanda Express For Buffer Sales", "full_content": "With arrivals from these regions expected to rise in the coming weeks, overall onion availability in consuming markets is likely to improve, providing adequate supplies ahead of the upcoming festive season.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:24 PM IST", "pub_date_relative": "44m ago"}, {"title": "Longtime tech bull Dan Ives says these are his top tech plays going into 2027", "full_content": "Investors are \u201cunderestimating the scale and scope\u201d of the AI spending wave, said Dan Ives as he laid out five stocks to own.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 07:23 PM IST", "pub_date_relative": "45m ago"}, {"title": "This part of the bond market offers compelling yields with minimal risk", "full_content": "You can earn good yields with very low price risk in ultrashort bond funds.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 07:23 PM IST", "pub_date_relative": "45m ago"}, {"title": "Sebi expands debt maturity limits to help issuers manage cash flow", "full_content": "The Securities and Exchange Board of India (Sebi) has laid out a new framework for the number of debt instruments by an issuer that can mature in a given financial year. The new norms come into effect immediately.\n\nIn a circular issued on Wednesday, the market regulator increased the maximum number of International Securities Identification Numbers (ISINs) that can mature annually from 14 to 17 for privately placed debt securities. The norms were previously published for consultation in August. An ISIN is a unique 12-digit code used to identify a specific security issue globally.\n\nOf the 17 issues, entities can have up to 12 plain vanilla debt securities. Such securities can be secured or unsecured instruments. Once the total outstanding amount of plain vanilla debt maturing in a financial year touches \u20b9 15,000 crore, one additional ISIN could be permitted for every subsequent \u20b9 3,000 crore. This would allow companies with large repayment obligations to spread their redemptions more evenly through the year.\n\nAnother five ISINs would be available for structured debt, market-linked debt, floating-rate bonds, zero-coupon bonds and debt capital instruments.\n\nThe move is intended to help companies, especially non-banking financial companies (NBFCs), better manage their cash flows and prevent debt repayments from bunching up. The proposal comes after market participants told Sebi that current limits hamper liquidity management and exacerbate asset-liability mismatches.\n\nSeparately, Sebi eased listing norms for small-value debt issuers on Wednesday. Currently, issuers of debt securities or non-convertible redeemable preference shares, issued through private placement at a face value of \u20b9 10,000, are required to appoint at least one merchant banker.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 07:21 PM IST", "pub_date_relative": "46m ago"}, {"title": "Candy Crush Level 22,222! Bihar Teen Makes It Into International Book Of Records", "full_content": "Bihar teenager Shubham Kumar, 19, has entered the International Book of Records after reaching Level 22,222 in Candy Crush Saga.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:18 PM IST", "pub_date_relative": "50m ago"}, {"title": "FCNR-B deposits: Economic benefits outweigh hedging costs, says Sanjay Malhotra", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a FCNR-B deposits: Economic benefits outweigh hedging costs, says Sanjay Malhotra The Economic Times daily newspaper is available online now. Read Today's Paper FCNR-B deposits: Economic benefits outweigh hedging costs, says Sanjay Malhotra SECTIONS FCNR-B deposits: Economic benefits outweigh hedging costs, says Sanjay Malhotra ET Online Last Updated: Oct 07, 2026, 07:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The RBI had introduced the special USD-INR forex swap facility on June 8, 2026, as part of efforts to strengthen foreign exchange reserves and support balance of payments conditions. The facility allowed banks to offer higher interest rates on FCNR(B) deposits by transferring the currency hedging cost to the central bank.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 07:17 PM IST", "pub_date_relative": "51m ago"}, {"title": "Trading platform Webull's China ties create national security risk, congressional panel finds; stock drops 18%", "full_content": "Digital investment platform Webull , which counts 28 million global users , is quietly \"tied in structural ways\" to China's government, representing a national security threat to U.S. finance, according to a bipartisan congressional panel's findings shared exclusively with CNBC.\n\nThe bipartisan House Select Committee on China in its new report being released Wednesday found \"a profound gap\" between Webull's public marketing as \"an American company\" and actual control of the St. Petersburg, Florida-based firm.\n\n\"Webull's ownership architecture, technical workforce, technology infrastructure, cross-border data routing, corporate financing, and compliance frameworks are tied in structural ways to the People's Republic of China,\" the committee found.\n\nThe panel asserted that national security concerns around the company have \"escalated\" since October 2025, when Webull began carrying customer cash directly, according to a regulatory filing the panel cited. The committee alleges that creates a \"structural exposure of billions of dollars in American capital.\"\n\nThe committee said the company's corporate structure means the firm's \"software development, data pipelines, and core engineering operations\" are dependent on infrastructure subject directly to Beijing's laws. And those laws in China can compel firms to cooperate with the government in myriad ways, including data transfers.\n\nWebull took issue with the report, saying via a spokesperson, \"It is deeply disappointing that the Select Committee published a report containing significant inaccuracies and unsupported conclusions without ever seeking clarification from Webull.\" \"Webull's U.S. business is conducted from its global headquarters in St. Petersburg, Florida and its office in New York City, while U.S. customer data is stored in the U.S. and access to sensitive customer data is controlled by the U.S.,\" the spokesperson said via email.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:16 PM IST", "pub_date_relative": "52m ago"}, {"title": "\u2018He grew up wealthy\u2019: My husband inherited $3 million. He wants a vacation home. I want to save for retirement. Who\u2019s right?", "full_content": "\u201cI keep thinking about giving each child $750,000 toward a house.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 07:15 PM IST", "pub_date_relative": "53m ago"}, {"title": "Bengaluru Transformer Blasts: Five Injured In Two Separate Incidents", "full_content": "A transformer outside an Amazon office on Bagalur Main Road, Bengaluru, exploded, injuring two pedestrians and sparking safety concerns.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:12 PM IST", "pub_date_relative": "56m ago"}, {"title": "EPFO wage ceiling hiked to \u20b925,000: Likely enhancements in social security coverage \u2014 pension, insurance, explained", "full_content": "The Cabinet last month raised the wage ceiling eligibility for Employees Provident Fund (EPF) coverage by \u20b9 10,000, from the \u20b9 15,000 set in 2014, Union Information and Broadcasting Minister Ashwini Vaishnaw said.\n\nThe hike, which comes after 12 years, seeks to \u201creflect sustained wage growth, rising incomes and continued expansion of formal employment over the intervening years\u201d, the minister said.\n\nFor employees whose EPF contribution was earlier restricted to the \u20b9 15,000 ceiling, the employee contribution can increase. See illustration below:\n\nThe employer's statutory contribution in such a case would also increase from \u20b9 1,800 to \u20b9 3,000. However, the actual impact on an employee's take-home pay will depend on how the employer structures the salary and calculates PF contributions.\n\nThe wage ceiling for membership to the Employees\u2019 Provident Fund Organisation ( EPFO ) has been raised to \u20b9 25,000 per month, bringing an additional 51 lakh employees under mandatory provident fund cover, and widening social security coverage for workers.\n\nNotably, the EPFO also administers pension under the Employees\u2019 Pension Scheme (EPS) and insurance protection under the Employees\u2019 Deposit Linked Insurance Scheme (EDLI). Hence, benefits under these heads are also likely to be enhanced.\n\nThe latest EPFO data shows around 7.98 crore contributing members across about 7.68 lakh contributing establishments, while the EPS provides pension benefits to around 82 lakh pensioners.\n\nThe EPFO's pension benefit is available to all subscribers who have had an account for more than 10 years. Under this, 8.33% of the 12% employer contribution to your EPF account is directed towards your EPS account. Further, the government also contributes 1.16% (subject to wage ceiling) towards the fund.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 07:11 PM IST", "pub_date_relative": "57m ago"}, {"title": "US Stock Market Today: Dow Tumbles Over 300 Points, Nasdaq, S&P 500 In Red As Yields Climb", "full_content": "Nasdaq Composite dropped 0.54% to 27,451.32, S&P 500 declined 0.40% to 7,787.71, while Dow Jones Industrial Average traded 0.67% or 347 points lower at 51,173.8.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:11 PM IST", "pub_date_relative": "57m ago"}, {"title": "Used car prices fall in Q3, while demand for fuel-efficient vehicles grows", "full_content": "DETROIT \u2014 Used vehicle prices are forecast to fall more than previously expected this year, as high gas prices and broader inflationary costs hit Americans' pocketbooks.\n\nCox Automotive on Wednesday lowered its forecast for the company's Manheim Used Vehicle Value Index, from a 2% increase to a rise of only 0.2% for the year. That slight increase would mark the third consecutive year of relatively flat pricing after large increases and then declines during the pandemic.\n\nThe lower forecast follows a 1.95% decline in the index from July to September, including a 0.6% decline last month compared to a year earlier. September marked the first time since March 2025 that the monthly index hadn't been higher than a year earlier.\n\n\"As we enter Q4, interest rates are rising, consumer sentiment is falling, and yet a wealth effect from strong and sustained financial-asset growth is providing some offsetting cushion. Many metrics we watch are converging back toward pre-pandemic norms, but the road to get there has been anything but smooth,\" Cox Automotive's chief economist, Jeremy Robb, said in a release\n\nThe historical average for the Manheim index is about a 2.3% year-over-year gain. Non-adjusted wholesale used-vehicle prices fell 1.2% year over year in September and 1.3% from August as depreciation accelerated in the third quarter, Cox said.\n\nThe index is a closely monitored gauge for used vehicle prices that tracks the pricing of used vehicles sold at Manheim U.S. wholesale auctions. Retail prices for consumers traditionally follow changes in wholesale costs.\n\nCox noted electric vehicle sales and off-lease volume continued to grow, reshaping used-vehicle market dynamics as EVs and smaller, fuel-efficient vehicle values increased during the quarter. That compares with poor performances of large trucks and SUVs, the company said.\n\n\"The first half of the year actually showed more appreciation than usual, even in the face of higher fuel prices.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "These decisions you make in your 20s \u2014 not your income \u2014 determine whether you\u2019ll spend decades in debt or retire comfortably", "full_content": "Don\u2019t just focus on stock picks when you\u2019re thinking of building retirement wealth", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 07:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dow falls 500 points as 10-year yield rises to highest level in 24 years: Live updates - CNBC", "full_content": "Dow falls 500 points as 10-year yield rises to highest level in 24 years: Live updates CNBC Dow drops 451 points as Treasury yields hit 24-year highs Quartz Stock Market Today: Dow Futures Fall, 30-Year Treasury Yield Hits Fresh 24-Year High \u2014 Live Updates WSJ Wall St opens lower as bond yields and oil rebound; Fed minutes in focus Reuters U.S. equities tumble while Treasury yields push higher Seeking Alpha", "source": "Google News Business", "pub_date_str": "07 Oct 2026, 07:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "RBI Removes Paytm Payments Bank From List Of Scheduled Banks", "full_content": "The RBI has formally removed Paytm Payments Bank from the list of scheduled banks after cancelling its banking licence over regulatory non-compliance.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "NSE cautions investors over pricey overseas ETFs as demand surges", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a NSE cautions investors over pricey overseas ETFs as demand surges National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper NSE cautions investors over pricey overseas ETFs as demand surges SECTIONS NSE cautions investors over pricey overseas ETFs as demand surges Reuters Last Updated: Oct 07, 2026, 07:05:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The NSE has cautioned investors about the escalating hazards linked to international exchange-traded funds as they experience steep premiums. While certain ETF prices have risen dramatically, their underlying net asset values stay constant. This disparity is primarily due to supply limitations and new regulations impacting ETF units. Investors should proceed cautiously; purchasing at inflated prices may result in sudden declines.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 07:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mikel Arteta Signs New Arsenal Deal: Spaniard To Stay At Gunners Until 2030", "full_content": "Arteta has overseen 361 matches for Arsenal and boasts a 62.05% win percentage.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Thella Kaagitham Box Collection Office Day 5: Harsh Roshan-Nakshatra Film Holds Ground With Slight Rise", "full_content": "Thella Kaagitham saw a marginal rise on Day 5, earning Rs 72.16 lakh at the box office. The Harsh Roshan-Nakshatra starrer has collected Rs 4.58 crore in five days.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "5 money lessons from international bestseller \u2018I Will Teach You to Be Rich\u2019 by Ramit Sethi", "full_content": "Managing money should help you enjoy life while building a secure future. Ramit Sethi explains this approach in I Will Teach You to Be Rich. His message is simple: build useful systems and spend according to your priorities. These 5 lessons explain how to put that thinking into practice.\n\nThe first lesson is to focus on big financial gains. Constantly worrying about small things can drain your energy without making much difference. Instead, work towards a better salary, lower investment charges and regular savings.\n\nChoosing suitable home loans and using credit card rewards wisely also matter. These decisions can improve your finances more than repeatedly giving up small pleasures. Your attention should go towards choices that create lasting financial progress.\n\nThe second lesson is to make money management automatic. Arrange transfers as soon as your salary reaches your bank account. Set aside money for rent, bills, savings, and investments before planning personal spending.\n\nThis reduces your dependence on memory, motivation and monthly effort. Automatic transfers help you stay consistent, even when work or daily responsibilities become demanding. A working system makes financial progress part of your routine.\n\nThe third lesson is to spend consciously and enjoy your choices. Cut spending on things that add little value to your life. Unused subscriptions and unnecessary bank charges are examples of expenses worth removing. This leaves more money for activities that matter to you.\n\nTravel, eating out or fitness can deserve space in your spending plan. Enjoyment need not create guilt when savings, investments and essential expenses are already covered. The aim is a richer life, shaped around your priorities.\n\nThe fourth lesson is to manage credit, debt and charges carefully. Pay bills on time and keep credit card usage low. Ask banks or card providers to remove unnecessary charges wherever possible. Give attention to debt carrying high interest rates.", "source": "LiveMint Money", "pub_date_str": "07 Oct 2026, 07:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Calibrated' Turn Vs Off-Cycle Shocker: How The New RBI Hike Cycle Compares To 2022", "full_content": "After a 43-month pause, the RBI has resumed rate hikes to tame inflation\u2014but economists warn this new tightening cycle carries stagflationary whispers.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Drishyam: The Conclusion Box Office Collection Day 6: Ajay Devgn Starrer Continues To Hold Audience Interest", "full_content": "Drishyam: The Conclusion, starring Ajay Devgn, follows Vijay Salgaonkar as he faces a new challenge that puts his family and carefully protected secrets at risk.", "source": "NDTV Profit", "pub_date_str": "07 Oct 2026, 07:00 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Should I put my nest egg in a 30-year Treasury bond?", "full_content": "Risk comes in many forms, even with \u201csafe\u201d investments.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Oct 2026, 08:04 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Crude oil inventories plunge, signaling strong demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 08:02 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Kenya central bank keeps main lending rate unchanged", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 08:00 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Polish central bank says fuel prices, fiscal policy are key inflation risks", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Oct 2026, 07:55 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India has a 1% GDP opportunity. It\u2019s hiding in plain sight", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India has a 1% GDP opportunity. It\u2019s hiding in plain sight The Economic Times daily newspaper is available online now. Read Today's Paper India has a 1% GDP opportunity. It\u2019s hiding in plain sight SECTIONS India has a 1% GDP opportunity. It\u2019s hiding in plain sight ET Online Last Updated: Oct 07, 2026, 07:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India could unlock a 1% GDP opportunity by reducing productivity losses from equipment breakdowns, unplanned downtime and inefficient assets, industry leaders said at MRAM Expo 2026. With 88% of Indian industrial businesses reporting monthly unplanned outages, experts are pushing predictive, data-driven maintenance to improve output and extend asset life.\n\nThe NBFC saga - Part 1: How RBI moved from protecting depositors to policing systemic risk\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nThe world is witnessing a bond rout. Why should it matter to you?\n\nQ2 earnings season: Will it settle or add to confusion in the stock market?\n\nHow Sebi busted Growpital\u2019s \u2018assured\u2019 returns, LLPs and money trail\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "07 Oct 2026, 07:53 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global bond sell-off resumes as 30-year Treasury yield hits highest since 2002", "full_content": "French, Italian and UK government bonds also come under pressure in volatile trading", "source": "FT Markets", "pub_date_str": "07 Oct 2026, 07:52 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Porsche braces for lower sales era, seeks lifeline from luxury", "full_content": "Porsche is steeling itself for persistently lower \u200bsales, the Volkswagen brand said \u200bon Wednesday, pitching \u200ba turnaround plan to investors that aims to boost margins with a focus on top-end models.\n\nThe sports car maker, which like parent Volkswagen is undergoing restructuring to address weak demand \u2060and \u200chigh costs, said it would lower its future \u2060break-even point to fewer than 200,000 units, compared with total deliveries last year of 279,449.\n\nPorsche has already seen deliveries slump by almost 10% globally since the year of its blockbuster listing in 2022, as plunging \u200cdemand in China and tariff woes in the United States hit two of the brand's most important markets.\n\nDuring a capital markets day \u200bat the company's development center in Weissach, CEO Michael Leiters will seek to assure investors that a focus on high-end sports cars like the 911 and luxury SUVs will put the carmaker back on track.\n\nIts profit margin \u2060collapsed last year to 1.1%, a fraction of the double-digit, Ferrari-style margins targeted when the Stuttgart-based \u200ccarmaker went public four years ago under Oliver Blume, \u200cLeiters' predecessor.\n\nBlume remains CEO of Volkswagen, where he is battling with unions to push through a drastic overhaul of the German auto group, including some 100,000 layoffs worldwide and the closure of \u2060up to four German plants.\n\nPorsche for its part is cutting 9,000 \u2060positions by 2035, reducing its total workforce by a fifth, as \u2060job losses mount in the German automotive industry under pressure from low-cost Chinese rivals.\n\nLeiters is pursuing a \"value over volume\" strategy and pivoting back to \u200bcombustion-engine models after costly missteps on EVs \u200cunder Blume.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:50 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rubio says Tehran missed 'multiple' chances for nuclear deal amid Iran stalemate", "full_content": "U.S. Secretary of State Marco Rubio said Wednesday that Iran has passed up \"multiple\" chances to reach a deal on its nuclear program, as talks between Washington and Tehran over a lasting Middle East peace agreement remain stalled.\n\n\"Iran has failed to take advantage of multiple opportunities to reach agreement with us on nuclear program,\" Rubio said during a visit to Greece.\n\nCurtailment of Iran's nuclear ambitions remains a critical part of U.S. demands, as efforts to reach a lasting ceasefire agreement between the two sides remain fruitless.\n\nIran indicated there have been \"no negotiations\" between Tehran and Washington over Iran's nuclear program, according to a Reuters report. The news agency cited comments by a senior Iranian official involved in indirect talks with Washington, who said U.S. ideas about the program are \"at odds\" with those of the Islamic Republic.\n\nRubio's remarks follow comments by Vice President J.D. Vance , who earlier this week said any agreement to resolve the seven-month conflict must include a commitment by Iran to a \"meaningful\" reduction in its nuclear enrichment.\n\nThe senior Iranian official said Vance's comments reflect American \"ideas and interests,\" adding, \"Iran will never give up its right to enrich, but enrichment details can be discussed later.\"\n\nPresident Donald Trump last week denied reports that he had pitched sanctions relief to Iran in exchange for nuclear concessions.\n\nBrent crude. The absence of any agreement has seen Iran ramp up attacks on tankers passing through the Strait of Hormuz in recent days, where vessels now rely on U.S. military protection to navigate the critical waterway.", "source": "CNBC Top News", "pub_date_str": "07 Oct 2026, 07:47 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold slides to two-month low as robust dollar, yields add pressure", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a Gold slides to two-month low as robust dollar, yields add pressure The Economic Times daily newspaper is available online now. Read Today's Paper Gold slides to two-month low as robust dollar, yields add pressure SECTIONS Gold slides to two-month low as robust dollar, yields add pressure Reuters Last Updated: Oct 07, 2026, 07:42:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold prices have fallen to a two-month low due to a strong US dollar and rising Treasury yields. Spot gold dropped 1.6% to $4,096.13 per ounce, while silver also faced significant declines. The Federal Reserve's policy decisions are anticipated to influence future interest rate hikes, affecting gold's appeal. China's central bank continued its long-term gold purchasing trend, contributing to market dynamics.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "07 Oct 2026, 07:42 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "26% returns in 2026! UBS retains 'Buy' rating on this metal stock | Target, upside and rationale", "full_content": "Global brokerage firm UBS maintained its bullish outlook on Shyam Metalics and Energy in its recent note, expecting the stock to rise another 40% from current levels, even as it has gained 26% so far this year.\n\nIt has retained its 'buy' rating on the stock with a target price of \u20b9 1550, indicating an upside potential of 45.25% from the stock's Wednesday closing price of \u20b9 1067 apiece, as it believes the market does not fully appreciate management's execution track record, diversification benefits, and efficient operations.\n\nIn terms of valuations, the brokerage pointed out that the stock trades at 7.5x one-year forward EV/EBITDA, in line with the three-year average, leaving room for multiple expansion.\n\nIn its note, the brokerage highlighted three key reasons for its strong outlook: disciplined capital allocation, superior project execution, and efficient operations\u2014the key differentiators for a commodity company.\n\nUBS\u2019 review of completed and upcoming projects indicates that Shyam delivers capex at a lower cost and with shorter timelines than industry averages, supporting superior ROIC and faster growth.\n\nDriven by its new capex plan and increasing focus on value-added products, UBS forecasts EBITDA per tonne to improve from \u20b9 4,700 in FY26 to \u20b9 8,400 by FY31, implying a 24% EBITDA CAGR in FY26-31E, versus 12% in FY21-26.\n\nWith a faster ramp-up of new capacity and the transition to higher-value-added products, UBS has raised its FY28/FY29E EBITDA estimates by 3%/8%, which are 8%/6% above consensus, respectively.\n\nUBS now anticipates that the company can accelerate earnings growth over the next five years, citing a shift in its product mix towards higher-value segments such as stainless steel, CRM, aluminum, SBQ, and railway wagons, while reducing its dependence on low-margin intermediates.", "source": "LiveMint Markets", "pub_date_str": "07 Oct 2026, 07:41 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ola Electric board approves rights issue at 26% discount; shareholders to pay in two calls", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ola Electric board approves rights issue at 26% discount; shareholders to pay in two calls The Economic Times daily newspaper is available online now. Read Today's Paper Ola Electric board approves rights issue at 26% discount; shareholders to pay in two calls SECTIONS Ola Electric board approves rights issue at 26% discount; shareholders to pay in two calls PTI Last Updated: Oct 07, 2026, 07:42:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ola Electric has announced a rights issue price of Rs 27 per share, significantly below its market value, aiming to garne
