ce\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Oil falls after Trump declares 'energy ceasefire' between Russia and Ukraine", "full_content": "Oil prices fell Monday on optimism about improved supplies after President Donald Trump said that Russia and Ukraine will not be targeting each other's energy facilities, while Iran reached out to Saudi Arabia after Houthi attacks against the kingdom.\n\nFutures for international benchmark Brent crude for December delivery dropped 0.77% to $103.91 a barrel. U.S. West Texas Intermediate futures for November declined 1.26% to $90.69 per barrel.\n\n\"Effective immediately, there is an ENERGY CEASEFIRE in the War between Russia and Ukraine. Both parties have agreed. Do not break it!\" Trump said in a social media statement Sunday stateside.\n\nUkrainian President Volodymyr Zelenskyy said in a social media post that \"Ukraine supports the ceasefire, and it is important that Russia support it as well.\"\n\nProspects of more Russian energy hitting markets after a deal with the U.S. have also risen after Trump said Friday that Moscow will supply more than 4 million tons of diesel to the global market under a deal he struck with Putin during a phone call.\n\nBrent According to the Saudi state news agency , Iran's Minister of Foreign Affairs Abbas Araghchi made a phone call to Saudi Arabia's Minister of Foreign Affairs Faisal bin Farhan bin Abdullah, to discuss about the region's recent escalation of events as well as the efforts to address it.\n\nAl Jazeera reported Araghchi had said Iran was ready to provide assistance to help with the start of dialogue between Saudi Arabia and Yemen's Houthis.\n\nwti Oil prices are expected to remain volatile in the near term as the U.S.-Iran conflict continues, while the impact of Hurricane Isaias on U.S. energy producers could also hurt supplies .", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 11:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Lenskart Solutions share price tumbles 5% today despite 47% returns in 2026 | What should investors do?", "full_content": "Lenskart block deal: Lenskart Solutions share price crashed over 5% in Monday's trading session amid reports of likely block deal by Alpha Wave Ventures. Lenskart share price opened at \u20b9 650 per share on NSE today, as compared to previous close of \u20b9 677.85 on Friday last week an touched an intraday low of \u20b9 643.75 on 12 October.\n\nAccording to CNBC TV18 report, as many as 2.93 crore shares of Lenskart Solutions , representing 1.67% of the company\u2019s equity, were traded through block deals on Monday, October 12. The transaction was valued at \u20b9 1,895 crore, with the shares changing hands at \u20b9 647 apiece. The identities of the buyers and sellers have not yet been disclosed.\n\nThe report further revealed that Alpha Wave Ventures LP was likely to sell up to a 1.6% stake in Lenskart for as much as \u20b9 1,691 crore. The proposed sale was pegged at a floor price of \u20b9 640 per share, representing a 5.2% discount to the stock\u2019s closing price on Friday.\n\nThe base offer size covered a 0.9% stake worth \u20b9 966 crore, with an option to increase the sale by another 0.7% stake valued at \u20b9 725 crore, the sources said. The sellers would be subject to a 30-day lock-in period before undertaking any further stake sale.\n\nAccording to stock exchange data, promoter entities held a 17.53% stake in Lenskart at the end of the June quarter, while public shareholders owned 82.05%. Alpha Wave Ventures LP held a 3.42% stake in the company at the time and had already sold a portion of its holding in August.\n\nOn August 28, Alpha Wave Ventures sold 2.95 crore Lenskart shares, equivalent to around 1.7% of the company\u2019s equity, for \u20b9 1,857 crore through a block deal at an average price of \u20b9 630 per share. It was the second block deal involving the company that month.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:23 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IFCI share price jumps 14% in 3 sessions - Can the stock rise further? Tech experts decode?", "full_content": "IFCI share price has been on a healthy uptrend lately, jumping almost 14% in just three consecutive sessions. On Monday, 12 October, IFCI shares jumped 8% in morning trade on the BSE to hit an intraday high of \u20b9 72.78. At this price, the stock has jumped 13.7% in just three straight sessions.\n\nThe stock has jumped nearly 35% year-to-date, compared to a 15% drop in the equity benchmark Sensex. It rose to a 52-week high of \u20b9 107.45 on 4 September this year after falling to a 52-week low of \u20b9 46.20 on 9 December last year.\n\nOn a monthly scale, the stock is up nearly 4% so far in October after an over 23% drop in the previous month.\n\nThe company's total revenue from operations in the financial year 2025-26 (FY26) rose by 7% year-on-year (YoY) to \u20b9 897.71 crore, while profit for the year jumped by 18% YoY to \u20b9 51.71 crore. Net interest margin for the year stood at (-4.94)% compared to (-9.49)% in FY25.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, IFCI stock has violated the uptrend by breaking the higher low.\n\nThukral underscored that the stock price has formed a fresh resistance zone between \u20b9 74 and \u20b9 80. Moreover, there is a negative crossover among EMAs, indicating a negative short-term trend.\n\n\"Any bounce in the stock prices towards the resistance zone is an exit opportunity. If the stock prices continue to stay above 80 for some days, then only then could the trend change; however, the chances for that to happen remain thin,\" said Thukral.\n\n\"The stock started its short-term downtrend, and every rise towards the resistance area is an exit opportunity for buyers. Only a sustained move above the EMAs could change the trend for the stock,\" said Thukral.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RIL shares: Reliance Industries stock slides 6% in a month, can Jio Platforms IPO aid the bounce back? Experts' views", "full_content": "RIL share price | Stocks to buy today | Jio Platforms IPO: Shares of Reliance Industries Ltd (RIL) have been under selling pressure ahead of the Jio Platform IPO launch. While it is throwing tantrums at the existing Reliance Industries shareholders, market experts are looking at this dip as an opportunity for the primary market investors to buy Reliance shares at a lower price, which is close to the Jio Platforms IPO price band of \u20b9 1,065 to \u20b9 1,119 apiece, and become eligible for the possible benefit of the value unlocking. However, it is not guaranteed that Jio Platforms shares will be distributed to all RIL shareholders.\n\nIrrespective of this value-unlock factor, experts believe the Jio Platforms IPO is a central factor, though not entirely negative. While news of an upcoming mega public offering usually acts as a catalyst, market sentiment has cooled because recent reports put valuations at approximately $114 billion (~ \u20b9 10.3 lakh crore), lower than earlier speculative estimates of $130 billion to $170 billion. They said Reliance shares are facing a hurdle at \u20b9 1,200. On breaking above this, we can expect the Reliance share price to scale around \u20b9 1265.\n\nReliance share price today is around \u20b9 1165, clocking around 6% dip in one month.\n\nWhether Jio Platforms IPO can bring the mojo in Reliance shares, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \u201cJio Platforms IPO is structured predominantly as a fresh capital issue of around 2.9% post-IPO equity rather than a massive offer-for-sale (OFS). This means RIL itself is not directly pocketing cash from selling its stake, though it retains a controlling ~64.5% stake while Jio uses the proceeds for debt prepayment and expansion.\u201d\n\nThe SMC Global Securities expert said that arbitrage traders and institutional desks are temporarily discounting the holding company valuation until the listing price band and post-listing trading performance establish firm market values.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:01 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Is the US economy as narrow as its stock market?", "full_content": "No*", "source": "FT Markets", "pub_date_str": "12 Oct 2026, 11:00 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Equity today, debt tomorrow: How Mirae Asset\u2019s Life Cycle Fund 2056 plans your retirement", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a Equity today, debt tomorrow ds and market mechanics are fundamental CFA exam areas."}, {"title": "Lenskart Solutions shares crack 5% after Rs 1,985-crore block deal; Alpha Wave likely sells take", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Lenskart Solutions shares crack 5% after Rs 1,985-crore block deal; Alpha Wave likely sells take Lenskart Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Lenskart Solutions shares crack 5% after Rs 1,985-crore block deal; Alpha Wave likely sells take SECTIONS Lenskart Solutions shares crack 5% after Rs 1,985-crore block deal; Alpha Wave likely sells take By Veer Sharma , ETMarkets.com Last Updated: Oct 12, 2026, 10:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Lenskart Solutions reported a 182.3% YoY jump in Q1 FY27 net profit to Rs 228 crore, while revenue rose 33.6% to Rs 2,214 crore. EBITDA margin expanded to 21.7% as product margins crossed 70% for the first time. Growth remained broad-based across India and international markets, with offerings ranging from Rs 500 glasses to premium eyewear.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 10:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Markets: 5 key triggers to watch out for this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Global Markets: 5 key triggers to watch out for this week Written by Anupam Nagar , ETMarkets.com | Oct 12, 2026, 11:03:31 AM IST 1 / 5 \u200bIMF-World Bank meetings in focus The IMF and World Bank annual meetings in Bangkok will put global growth, debt sustainability and geopolitics in focus as high energy costs and rising borrowing costs weigh on markets. The IMF's updated World Economic Outlook on Tuesday will be closely watched after the Iran war prompted two cuts to its global growth forecast. Policymakers are also expected to discuss conflicts in the Middle East and Ukraine, AI regulation and debt risks. (Source: Reuters)\n\nUS inflation data due Wednesday will offer fresh clues on the Federal Reserve's next policy move. September consumer prices are forecast to rise 0.6% month-on-month, while core CPI is expected to increase 0.2%, according to a Reuters poll. Producer prices and retail sales data due Thursday will add to the picture. A stronger-than-expected inflation reading could revive bets on another Fed rate hike later this month.\n\nMajor US banks will lead the third-quarter earnings season, with JPMorgan Chase, Goldman Sachs, Citigroup and Wells Fargo reporting on Tuesday, followed by Morgan Stanley and Bank of America on Wednesday. Earnings are expected to rise by as much as 20% from a year earlier. Investors will assess whether elevated Treasury yields are hurting lending growth, dealmaking and funding costs, amid a sharp pullback in bank stocks.\n\nChina's September trade and inflation data will help investors assess whether strong overseas demand can offset sluggish domestic consumption. Exports are forecast to rise 25.3% year-on-year in dollar terms, following 25% growth in August, according to a Reuters poll. Imports are expected to grow 23.5%.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 10:56 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "DA news: What are the types of dearness allowance, how is it calculated and revised? Here are top FAQs answered", "full_content": "Revised twice annually based on data from the All-India Consumer Price Index (AICPI), Dearness Allowance (DA) is a percentage of employees' basic salary aimed at mitigating cost-of-living impact on households of central government employees. A DA hike gives employees a higher in-hand salary and a buffer against inflation.\n\nNew announcements are usually made in March and October, with rollouts in July and January. Notably, this year, the Finance Ministry in April announced DA hike of 2% for all central government employees and pensioners (including railways and defence personnel), effective from 1 January 2026. This increased the component to 60% of basic pay from 58%.\n\nFor calculation purposes, DA is separated into two categories: industrial and variable DA.\n\nWhen calculating DA, it comprises the base index (which remains fixed for a given period) and CPI (used to calculate VDA). Even though CPI numbers are released every month, VDA only changes when the Centre revises the basic minimum wages .\n\nNotably, the 2% DA hike is calculated based on the AICPI's 12-month average data, using the method prescribed by the 7th Pay Commission. Under this CPC, there have been 10 hikes since 2021, with the highest at 11% in July 2021. The past two hikes were 2% and 3%, respectively, for January and July 2025.\n\nThe formula used to calculate DA hikes is as follows, according to Clear Tax:\n\nThus, the DA hike announced in April was calculated as follows:\n\nDA is provided by the central and state governments to its employees and retirees. The private sector in India usually does not offer this benefit.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 10:52 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u20b940 lakh home loan: How much can you save if interest rate falls from 10% to 9% over 10, 20, 30 years?", "full_content": "If you are availing a fresh home loan, even a minor reduction in the applicable interest rates can alter the repayment trajectory of your loan- it can go a long way towards helping you save money, even if the rates are reduced only slightly.\n\nThis is because even a minor one-percentage-point reduction in home loan interest rates can reduce a borrower\u2019s interest costs over different repayment periods.\n\nFor someone taking a \u20b9 40 lakh home loan, reducing the annual interest rate from 10% to 9% could save them approximately \u20b9 2.63 lakh over 10 years, \u20b9 6.27 lakh over 20 years and \u20b9 10.50 lakh over 30 years.\n\nSuch a saving also translates into lower equated monthly instalments (EMIs), thus making the home loan more affordable.\n\nHere is a breakdown of the calculations in both cases (9% and 10%), assuming the interest rate remains unchanged throughout the loan term.\n\nThe home loan EMI is calculated using the standard monthly reducing-balance formula:\n\nThis means, for a \u20b9 40 lakh loan at 10% annual interest over 20 years, the monthly interest rate is 10% \u00f7 12, and the number of instalments is 240. Applying the formula gives an EMI of approximately \u20b9 38,601.\n\nNote: Figures are approximate and calculated using unrounded EMI values. The calculations assume a constant interest rate, monthly repayments and no additional fees or prepayments.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 10:50 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India 10-year bond yield tops 7.35% as RBI's liquidity clamp down hurts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India 10-year bond yield tops 7.35% as RBI's liquidity clamp down hurts Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India 10-year bond yield tops 7.35% as RBI's liquidity clamp down hurts SECTIONS India 10-year bond yield tops 7.35% as RBI's liquidity clamp down hurts Reuters Last Updated: Oct 12, 2026, 10:49:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis On Monday, Indian government bonds experienced a significant decline due to central bank measures affecting liquidity. The benchmark 6.94% 2036 bond yield rose to its highest level in three years. The Reserve Bank of India announced it would sell 250 billion rupees of bonds to tighten liquidity. Meanwhile, the benchmark Brent crude price remained above $100 per barrel, impacting inflation.\n\nOn Monday, Indian government bonds experienced a significant decline due to central bank measures affecting liquidity. The benchmark 6.94% 2036 bond yield rose to its highest level in three years. The Reserve Bank of India announced it would sell 250 billion rupees of bonds to tighten liquidity. Meanwhile, the be     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
