<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "India is way ahead of China, UK in the number of young entrepreneurs and women founders: Hurun's U35 Rich List", "full_content": "India leads China and the UK in the number of entrepreneurs across Hurun\u2019s U35 lists. The Indian list features 180 entrepreneurs, compared with China\u2019s 101 and the UK\u2019s 62. Together, the three lists feature 343 entrepreneurs.\n\nThe comparison uses India\u2019s 2026 list, China\u2019s 2025 list and Britain\u2019s 2024 list. India accounts for more than half the combined entries. It has 79 more entrepreneurs than China and 118 more than the UK.\n\nIndia also leads in the number of women featured, with 23 entries. China follows with 21 women while the UK has 10. These figures compare entrant numbers, rather than their combined personal Wealth.\n\nThe UK has the highest share of first-generation entrepreneurs at 85%. India follows at 71%, ahead of China\u2019s 63%. In actual numbers, India has 127 such entrepreneurs. The UK has 53 while China has 64.\n\nFamily business leaders account for India\u2019s remaining 53 entries, representing 29% of its list. China has 37 such leaders, making up 37% of its entries. The UK has nine, accounting for 15%.\n\nBengaluru is India\u2019s leading headquarters city, alongside Beijing in China and London in Britain. Software products and services lead the industries represented in India and China. Apparel and accessories lead in the UK.\n\nFirst-generation entrepreneurs remain the largest group on India\u2019s 2026 list. However, their share fell from 76% in 2025 to 71% in 2026.\n\nSecond-generation leaders increased their share from 10% to 16%. Third-generation leaders accounted for 9%, down from 11% a year earlier. Fourth-generation and later leaders increased their share from 3% to 4%.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 11:24 AM IST", "pub_date_relative": "5m ago"}, {"title": "Dearness allowance hike: Cabinet skips July 2026 DA decision as railway bonus, social assistance plan get nod", "full_content": "Central government employees awaiting the next dearness allowance (DA) revision will have to wait longer. The Union Cabinet met on Wednesday, October 14, but did not announce an increase effective from July 1, 2026. It cleared two other proposals: a bonus for railway employees and continuation of a social assistance programme.\n\nDA is an inflation-linked component of pay for central government employees. Dearness relief (DR), its counterpart, is paid to eligible pensioners. Both help cushion the impact of inflation.\n\nThe government generally revises DA twice a year, with changes taking effect from January 1 and July 1. The January revision is typically announced in March or April, while the July revision is usually announced in September or October. The effective date can precede the announcement.\n\nThe last increase raised DA from 58% to 60% of basic pay, effective January 1, 2026. The decision was communicated in an official order dated April 22, 2026. A new order is needed to confirm the July revision.\n\nThe revision is linked to the All-India Consumer Price Index for Industrial Workers (AICPI-IW). It informs the allowance calculation.\n\nIn August 2026, the AICPI-IW rose by 1.2 points to 154.4. Year-on-year inflation based on the index was 4.96%, compared with 3.16% in August 2025. These figures indicate price trends but do not confirm the next hike. The government\u2019s order will specify the rate and effective date.\n\nThe Cabinet approved a productivity-linked bonus (PLB) equivalent to 78 days\u2019 wages for eligible non-gazetted railway employees. The allocation is \u20b9 2,009.61 crore and covers approximately 11.41 lakh staff members. The payment of PLB to eligible railway employees is made each year before the Durga Puja/Dusshera holidays.\n\nIt also approved continuation of the National Social Assistance Programme (NSAP) for five years, from 2026\u201327 to 2030\u201331, with an outlay of \u20b9 53,428 crore.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 11:22 AM IST", "pub_date_relative": "6m ago"}, {"title": "Shoppers Stop shares surge 15% ahead of Q2 2026 results tomorrow | What should investors watch next?", "full_content": "Shoppers Stop share price surged 15% on Thursday, 15 October, amid upbeat sentiment in the broader stock market and ahead of the company\u2019s Q2 FY27 results, scheduled for Friday, 16 October.\n\nIn an exchange filing, the company said its board of directors will meet on 16 October to consider and approve the unaudited standalone and consolidated financial results for the quarter and half-year ended 30 September 2026.\n\nAhead of the results, HDFC Securities expects Shoppers Stop\u2019s revenue to grow around 7% year-on-year to \u20b9 1,260 crore. The brokerage has built in a gross margin of 39%, down around 20 basis points year-on-year, and a pre-Ind AS EBITDA margin of 2%.\n\nInvestors will also track the management\u2019s commentary on demand trends and the company\u2019s expansion strategy for further cues on its growth outlook.\n\nShoppers Stop share price today opened at \u20b9 385.05 apiece on the BSE, the stock touched an intraday high of \u20b9 430.95 per share, and an intraday low of \u20b9 382.15 per share.\n\nRajesh Bhosale, Technical Analyst at My Advisor Alpha, said Shoppers Stop shares are witnessing strong momentum, rising more than 14% on heavy volumes. He noted that the stock has faced strong resistance around \u20b9 440 in the past. A decisive breakout above this level could trigger further gains towards \u20b9 480\u2013500, while \u20b9 400 remains a key support level.\n\nVirat Jagad, Senior Technical Research Analyst at Bonanza, said Shoppers Stop surged 14.43% to \u20b9 427.10, forming a strong bullish candle backed by a sharp spike in trading volumes. The stock has moved above its key moving averages, signalling improving bullish momentum. The RSI at 62.28 also supports the positive outlook. He placed immediate resistance at \u20b9 430\u2013440 and support at \u20b9 392\u2013395.\n\nShoppers Stop reported a narrowing of its consolidated net loss to \u20b9 14.25 crore in the April-June quarter of FY27, compared with a loss of \u20b9 15.74 crore in the corresponding period last year, according to a regulatory filing.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 11:22 AM IST", "pub_date_relative": "6m ago"}, {"title": "TCS, Infosys, HCLTech, Wipro, TechM: IT stocks gain up to 3.5% today; Nifty IT jumps 9% in 3 days; what's driving rally?", "full_content": "Indian IT stocks rallied in morning trade on Thursday, 15 October, as investors responded to strong quarterly results, improving sentiment around artificial intelligence (AI) services and a weaker rupee against the US dollar. HCLTech led the gains, while TCS, Tech Mahindra , Infosys , Wipro and other IT companies also advanced, pushing the Nifty IT index higher.\n\nThe Nifty IT index climbed 2.5% during the session, extending its rally to 9% over three trading sessions. The gains came as investors assessed the earnings reported so far in the September quarter and looked for signs that AI-related business was translating into stronger revenue growth and deal wins.\n\nHCLTech was the top gainer, rising 3.5%. Tech Mahindra and TCS advanced more than 3% each, while Infosys gained 2.5%. LTM, Wipro and Mphasis rose between 1% and 2%.\n\nStronger-than-expected earnings from major IT companies have helped lift sentiment across the sector. Better-than-expected Q2 results from TCS and HCL Tech, a slowdown in the AI trade, and the US dollar\u2019s rise against the rupee have all contributed to the upward momentum.\n\nHCL Tech reported revenue of $3.72 billion in Q2FY27, an increase of 2% quarter-on-quarter (QoQ) and 2.2% year-on-year (YoY). The figure exceeded the $3.68 billion expected by a Bloomberg poll of 34 analysts.\n\nIn rupee terms, HCL Tech\u2019s revenue rose 3% QoQ and 11.51% YoY to \u20b9 35,620 crore. Its consolidated profit increased 21.18% YoY to \u20b9 5,132 crore.\n\nThe company\u2019s total deal bookings reached $3.3 billion, up 27% YoY, taking first-half bookings to a record high. HCL Tech also raised its FY27 revenue growth guidance to 2.5\u20134% in constant currency (CC) terms, compared with its earlier range of 1\u20134%.\n\nTata Elxsi\u2019s September-quarter FY27 results also supported sentiment, with revenue and margins exceeding market estimates.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 11:11 AM IST", "pub_date_relative": "18m ago"}, {"title": "TSMC Q3 profit surges more than expected to record high on AI-fueled demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:10 AM IST", "pub_date_relative": "18m ago"}, {"title": "Cicor keeps 2026 outlook as order backlog points to strong Q4 revenue", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:10 AM IST", "pub_date_relative": "18m ago"}, {"title": "TSMC posts record profit for a sixth straight quarter, beating estimates on AI boom", "full_content": "Taiwan Semiconductor Manufacturing Co . on Thursday reported a record third-quarter profit that beat estimates, powered by an unrelenting global appetite for AI chips.\n\nHere are TSMC's third-quarter results against LSEG SmartEstimates, which are weighted toward forecasts from analysts who are more consistently accurate:\n\nThe world's largest contract chipmaker posted a record net profit for a sixth straight quarter, reporting 68.7% surge in the reported quarter from a year earlier.\n\nTSMC continues to post strong monthly sales growth amid sustained demand for advanced chips. In September, the company reported a 54.6% jump revenue from a year earlier to NT$511.86 billion.\n\nDuring its second-quarter earnings announcement in July, TSMC outlined plans to expand its U.S. manufacturing footprint, including a total planned investment of $265 billion in Arizona. The chipmaker is also reportedly considering expanding beyond Arizona, evaluating a potential investment in Texas as it looks to further strengthen its U.S. manufacturing presence.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 11:07 AM IST", "pub_date_relative": "21m ago"}, {"title": "BoE\u2019s Pill says a rate hike need not be start of long series", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:07 AM IST", "pub_date_relative": "22m ago"}, {"title": "Cost of AI default insurance spikes as data centre confidence wobbles", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:06 AM IST", "pub_date_relative": "22m ago"}, {"title": "TSMC Q3 profit jumps 69% to record, beating expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:06 AM IST", "pub_date_relative": "22m ago"}, {"title": "Who is Romita Mazumdar? Foxtale founder is only woman among Hurun\u2019s 10 youngest entrepreneurs", "full_content": "Romita Mazumdar tops the women\u2019s table in the Avendus Wealth\u2013Hurun India U35 List 2026. At 31, the Foxtale founder is the youngest woman featured in this year\u2019s list. She leads the skincare and beauty company as its founder and chief executive.\n\nRomita Mazumdar is the youngest woman on the Avendus Wealth-Hurun India U35 List 2026. The Mumbai-based Foxtale founder is among 10 youngest entrepreneurs, all aged 31.\n\nShe is among 23 women recognised, including 11 first-generation founders and 12 family business leaders. Mazumdar (5th) is the only woman among the Top 10 youngest entrepreneurs.\n\nOther women featured include Radhika Ambani, Ananya Birla, Vrushali Prasade and Minu Margaret. Mazumdar first appeared on the list in 2025. Women account for 12.8% of all entrepreneurs recognised in this edition.\n\nThe Bengali-Punjabi entrepreneur started her role at Foxtale in February 2021. The company sells skincare products directly to customers (D2C), focusing on everyday needs. Its range includes cleansers, serums and moisturisers developed for Indian consumers.\n\nIn August, Foxtale announced Shah Rukh Khan as its brand ambassador.\n\nFoxtale reaches customers through its own website and other online shopping platforms. It also sells through quick-commerce platforms, which offer rapid delivery. The business recorded revenue of \u20b9 365 crore in the financial year 2025, according to Forbes.\n\nThe company has raised $56 million, or approximately \u20b9 500 crore, in total funding. Its key investors include Z47, Panthera, Stride Ventures and Kose Corporation. Foxtale operates in the consumer goods sector, which is represented by seven entrepreneurs overall.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 11:06 AM IST", "pub_date_relative": "22m ago"}, {"title": "Pernod Ricard first quarter sales fall less-than-expected, cautious optimism on China", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:06 AM IST", "pub_date_relative": "23m ago"}, {"title": "'Big picture, big framework, big items are done': Sergio Gor says India-US trade deal very close ahead of Marco Rubio's visit", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a 'Big picture, big framework, big items are done': Sergio Gor says India-US trade deal very close ahead of Marco Rubio's visit The Economic Times daily newspaper is available online now. Read Today's Paper 'Big picture, big framework, big items are done': Sergio Gor says India-US trade deal very close ahead of Marco Rubio's visit SECTIONS 'Big picture, big framework, big items are done': Sergio Gor says India-US trade deal very close ahead of Marco Rubio's visit ET Online Last Updated: Oct 15, 2026, 11:02:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The trade agreement between India and the United States is close to fruition, with major issues largely settled. US Ambassador Sergio Gor conveyed optimism about achieving a swift conclusion as negotiations advance. For the past eighteen months, both countries have explored trade impediments and tariffs, focusing on particular products and their rates. The impending visit from US Secretary of State Marco Rubio could further facilitate this trade pact.\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nOnion inflation at 108%? Yes, but not really. What is different this time?\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "15 Oct 2026, 11:02 AM IST", "pub_date_relative": "27m ago"}, {"title": "Australia stocks lower at close of trade; S&P/ASX 200 down 0.09%", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 11:00 AM IST", "pub_date_relative": "29m ago"}, {"title": "Ashish Kacholia's portfolio stock: Up 70% in YTD | Experts see more upside \u2014 target price, stop-loss", "full_content": "Ashish Kacholia portfolio 2026 latest buy | Stocks to buy today: Ace investor Ashish Kacholia is known for picking lesser-known small-cap stocks, which tend to deliver whopping returns in a small time horizon. The \u2018Big Whale\u2019 of the Indian stock market is in the news for his portfolio these days, as his name has reappeared in the latest shareholding pattern of SG Finserve Ltd . The \u2018Czar of Small-cap Stocks\u2019 had offloaded his shareholding in this stock, which has delivered 70% YTD returns by rising from around \u20b9 406.55 to \u20b9 690 apiece levels on the NSE. In the September 2026 quarter, Ashish Kacholi bought fresh SG Finserve shares and in the shareholding pattern of the company, the ace Indian investor is shown holding 15,44,009 SG Finserve shares, which is 2.29% of the total paid-up capital of the small-cap company.\n\nSpeaking on the reasons that are fueling this Ashish Kacholia portfolio stock, Anuj Gupta, a SEBI-registered market expert, said, \u201cSG Finserve share price rally can be attributed to three major reasons: strong growth in the previous fiscal, expansion of the loan book, and strong Q1 results 2026.\u201d\n\nThe SEBI-registered market expert said Ashish Kacholia's latest buy registered strong growth in FY26, which further continued in the April to June 2026 quarter. In FY26, the company's profit grew from around \u20b9 81 crore to \u20b9 127 crore, up 58% from FY25. In FY26, the company reported around 25% growth in its loan book at around \u20b9 3,950 crore.\n\n\u201cThis growth story continued in the April to June 2026 quarter, as the company reported around 120% growth in net profit and doubled total income to \u20b9 136 crore YoY,\u201d Anuj Gupta said.\n\nExpecting the bull run to continue in Ashish Kacholia's latest buy, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cSG Finserve shares are looking positive on the technical chart. The stock has strong support placed at \u20b9 648.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 10:58 AM IST", "pub_date_relative": "31m ago"}, {"title": "Ericsson\u2019s third-quarter core profit falls less than expected", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 10:55 AM IST", "pub_date_relative": "34m ago"}, {"title": "EU leaders to tackle China exports, energy prices, budget at summit", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 10:54 AM IST", "pub_date_relative": "34m ago"}, {"title": "Taiwan president calls for Micron, workers to negotiate \u2019sincerely\u2019 ahead of possible strike", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Oct 2026, 10:54 AM IST", "pub_date_relative": "34m ago"}, {"title": "Sectoral mutual funds: Why investors should explore banking, auto, power and healthcare funds now", "full_content": "If you are looking to invest in sectoral mutual funds , it is important to check market sentiment and the factors driving it.\n\nAccording to the latest quarterly note, Quarter of Divergence: Resilient India, Restless World , by Prateek Nigudkar, Senior Fund Manager at Shriram AMC, the first half of FY27 has seen a sharp divergence between large-caps and the broader market. The Nifty 50 gave up most of its first-quarter gains, falling about 6% in September alone.\n\nThe Nifty 50 rose just 1.3% in H1FY27, while the Nifty Smallcap 250 gained 24.6%. Nigudkar attributes much of this performance gap to contrasting investment flows, noting that large-caps now offer better valuations relative to their historical averages.\n\nFor mutual fund investors, however, sectoral opportunities need to be assessed against the relevant sector benchmarks, valuations, and underlying business prospects.\n\nHere is what investors can look at, along with benchmarks they can use to compare sector-focused schemes.\n\nNigudkar is positive on banks and the life insurance segment, citing attractive valuations following the market correction. Several high-quality private banks are trading near or below their long-term average valuation multiples despite steady credit growth, stable asset quality and a strong economy.\n\nOn life insurance, he flags regulatory uncertainty around the Insurance Regulatory and Development Authority of India's (IRDAI) proposed rules on expenses of management (EoM) and distribution. However, Nigudkar expects the final regulations to be more measured, with longer implementation timelines and product-level flexibility.\n\nThis means investors can compare relevant schemes with the Nifty Bank and Nifty Financial Services indices, while recognising that these benchmarks have different sector compositions.", "source": "LiveMint Money", "pub_date_str": "15 Oct 2026, 10:52 AM IST", "pub_date_relative": "36m ago"}, {"title": "SK Hynix shares plunge 10% amid Asia tech rout as Fed rate hike fears, AI funding worries mount", "full_content": "A sell-off in global technology hardware stocks deepened Thursday, with Asian chipmakers tracking Wall Street losses as concerns over further Federal Reserve interest rate hikes, financing of artificial intelligence investments and intensifying competition weigh on sentiment.\n\nSouth Korean chip giant SK Hynix plunged more than 10%, while rival Samsung Electronics fell 8.73%. Other South Korean chip-related stocks also came under pressure. LG Innotek sank 8.95%, Seoul Semiconductor shed 9.28% and Samsung SDI declined 6.26%.\n\nIn Japan, technology investment giant SoftBank Group tumbled 7.9%. Semiconductor testing equipment maker Advantest plunged almost 14%, while chipmaking equipment supplier Tokyo Electron lost 6.45%. Renesas Electronics declined 8%.\n\nTaiwan's TSMC , the world's largest contract chipmaker, fell 1.81%.\n\nThe declines come as investors grow increasingly concerned that higher borrowing costs could weigh on the massive capital spending required to build out AI infrastructure, putting pressure on technology companies that have benefited from the AI investment boom.\n\nConcerns around global memory chip oversupply as early as 2029, as manufacturers ramp up production capacity to meet surging demand from artificial intelligence, also seem to be weighing down sentiment.\n\nChina's ChangXin Memory Technologies, or CXMT , said over the weekend that it had made a breakthrough on a new architecture that could boost memory density by packing more data into a smaller space, signaling intensifying competition in the memory space. Elon Musk in an X post said China would be making \"a LOT of RAM in 2028.\"\n\nChief executives of Broadcom and Intel, meanwhile, warned on Monday that financing could become a major headwind to the AI boom, with Broadcom's Hock Tan saying it could be bigger challenge to AI expansion than shortages of chips or electricity.", "source": "CNBC World Economy", "pub_date_str": "15 Oct 2026, 10:49 AM IST", "pub_date_relative": "40m ago"}, {"title": "Global Market: TSMC set for sixth straight record quarterly profit on AI chip boom", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: TSMC set for sixth straight record quarterly profit on AI chip boom Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: TSMC set for sixth straight record quarterly profit on AI chip boom SECTIONS Global Market: TSMC set for sixth straight record quarterly profit on AI chip boom By Anupam Nagar , ETMarkets.com Last Updated: Oct 15, 2026, 10:42:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis TSMC is expected to report its sixth consecutive quarter of record earnings, driven by surging AI chip demand and technology investments. Analysts forecast a 65% profit increase, while investors await updated guidance amid interest-rate concerns and expanding global manufacturing plans, including major US investments to strengthen semiconductor production capacity.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:42 AM IST", "pub_date_relative": "46m ago"}, {"title": "S&P 500 futures fall ahead of more U.S. economic data; South Korea's Kospi slides 7%: Live updates", "full_content": "Futures tied to the S&P 500 slid on Wednesday night, with traders looking ahead to more earnings reports and economic data following a losing session brought about by hotter-than-expected inflation data.\n\nS&P 500 futures slipped 0.51%, while Nasdaq-100 futures dropped 1.11%. Dow Jones Industrial Average futures declined 0.12%, or 61 points.\n\nThe tech-heavy Nasdaq Composite shed 1.9% during regular trading, marking its worst day since July 23 \u2014 when it dropped 2.2%. The S&P 500 dropped 1.1%, its biggest one one-day slide since July 29. The Dow was the relative outperformer, falling just 0.1%.\n\nIn Asia, South Korea's Kospi fell over 7.84%, dragged by technology heavyweights SK Hynix and Samsung Electronics. Japan's Nikkei 225 was down 4.4%, while the Hang Seng Index declined 1%. Mainland China's CSI 300 lost 1.41%. Australia's S&P/ASX 200 was down 0.85%.\n\nThere are growing concerns that the Federal Reserve could tighten monetary policy more aggressively before year-end, after new data showed consumer prices in September rose faster than expected on a year-over-year basis.\n\n\"Inflation is cooking with gas,\" said Jamie Cox, managing partner for Harris Financial Group. \"It is abundantly clear where the inflation impulse originates, but two wars need to end before we get any relief. The Federal Reserve made the mistake of calling Covid era inflation transitory, and now it appears they are set to make the same mistake in reverse on the energy supply shock.\"\n\nInvestors will get more inflation data on Thursday, with the September reading on producer prices due out at 8:30 a.m. ET. New retail sales figures and weekly jobless claims are also slated for release at that time.\n\nThe corporate earnings season continues as well, with regional banks U.S. Bancorp and PNC due to report. Charles Schwab is also scheduled to post earnings.", "source": "CNBC Top News", "pub_date_str": "15 Oct 2026, 10:38 AM IST", "pub_date_relative": "50m ago"}, {"title": "BHEL shares fall 4% despite Q2 profit jumping 119% YoY. Should you buy, sell or hold?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a BHEL shares fall 4% despite Q2 profit jumping 119% YoY. Should you buy, sell or hold? JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper BHEL shares fall 4% despite Q2 profit jumping 119% YoY. Should you buy, sell or hold? SECTIONS BHEL shares fall 4% despite Q2 profit jumping 119% YoY. Should you buy, sell or hold? By Ritesh Presswala , ETMarkets.com Last Updated: Oct 15, 2026, 10:37:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis BHEL shares fell 4.3% after rallying on strong Q2FY27 results, even as Nuvama and JM Financial retained their Buy ratings and raised target prices. Brokerages cited margin expansion, improved execution, a healthy order book and favourable thermal power prospects.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:37 AM IST", "pub_date_relative": "51m ago"}, {"title": "Global Market: IMF warns of energy shock, AI correction risks to Asia's growth outlook", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: IMF warns of energy shock, AI correction risks to Asia's growth outlook Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: IMF warns of energy shock, AI correction risks to Asia's growth outlook SECTIONS Global Market: IMF warns of energy shock, AI correction risks to Asia's growth outlook By Anupam Nagar , ETMarkets.com Last Updated: Oct 15, 2026, 10:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The IMF warned that Asia\u2019s economic growth may slow to 4.4% in 2027 amid energy price shocks, Middle East conflict, AI market correction risks and rising bond yields. It urged central banks to prioritise price stability and governments to provide targeted fiscal support while managing inflation and debt pressures.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:32 AM IST", "pub_date_relative": "56m ago"}, {"title": "Reliance Jio IPO a win-win for telecom stocks! RIL, Airtel and Vodafone Idea shares rise up to 3.6%- What should you do?", "full_content": "Telecom stocks attracted buying interest on Thursday, October 15, with Bharti Airtel leading the gains, while Vodafone Idea and Reliance Industries also traded higher.\n\nThe sector remained in focus after Reliance Industries' subsidiary, Jio Platforms, filed its Red Herring Prospectus (RHP) for its proposed initial public offering ( IPO ), bringing renewed attention to the valuation potential of India's telecom and digital services market.\n\nBharti Airtel shares rose 3.6% to an intraday high of \u20b9 1,863.85. The stock remains 14% below its 52-week high of \u20b9 2,174.70, recorded in November 2025. It touched a 52-week low of \u20b9 1,726.05 on October 1, 2026.\n\nAirtel shares have gained 1% over the past month but have declined 3.5% in three months, 0.25% in six months and 6% over the past year.\n\nVodafone Idea shares advanced 1.2% to an intraday high of \u20b9 12.85. The stock had touched a 52-week high of \u20b9 15.78 in September 2026 and a 52-week low of \u20b9 8.14 in April 2026.\n\nThe telecom stock has fallen 11% over the past month and 6% in three months. However, it has gained 36% over six months and 47% in the past year.\n\nshares rose around 1% to an intraday high of \u20b9 1,186 after Jio Platforms filed its RHP. Despite the uptick, the stock remains under pressure over longer periods.\n\nRIL shares are around 26% below their 52-week high of \u20b9 1,611.20, recorded in January 2026. The stock touched a 52-week low of \u20b9 1,152.30 in October 2026.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "'BHEL Has A 43% Downside': Top Brokerages See Frothy Valuation Hit Defence PSU Stock. Shares Fall 5%", "full_content": "CLSA believes the entry of Chinese suppliers, JSW Toshiba, L&T and Thermax into its core thermal equipment segment question its market dominance and its backlog looks to have peaked, while the stock is pricing in a lot more.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 10:22 AM IST", "pub_date_relative": "1h ago"}, {"title": "8 Nifty stocks delivered negative returns over 5 years. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 8 Nifty stocks delivered negative returns over 5 years. Do you own any? Written by Debaroti Adhikary , ETMarkets.com | Oct 15, 2026, 10:25:04 AM IST 1 / 9 Taking stock The Indian stock market has seen a sharp upturn but an equally sharp downturn over the past five years, pushing many of India\u2019s most trusted bluechip stocks sharply lower as Trump\u2019s tariff flipflops, Middle East war, falling rupee, surging bond yields and sharp FII outflows weighed. Here are 8 Nifty 50 stocks that have delivered negative returns over the past five years.\n\nInfosys has been the worst performer among the Nifty 50 stocks on a five-year basis, dropping around 37% even while the benchmark index soared more than 23%. The shares of the company have fallen over 33% in 2026 so far, as AI-related worries have pressured India\u2019s much touted IT stocks. The stock has however gained around 10% in a week as global AI selloff and strong earnings boosted sentiment.\n\nAlso read | Rs 5 lakh crore worth FII outflows since 2024 capital gains tax hike wreak havoc on Dalal Street. Is a reversal on the cards? \u200b\n\nTata Consultancy Services (TCS) accompanied its IT peer Infosys, with its stock falling more than 36% in the past five years. The shares of India's largest IT services company have fallen over 28% in 2026 so far. The stock has however gained around 11% in a week, but fell 22% in a year and 35% in three years.\n\nFMCG major Hindustan Unilever (HUL) has delivered negative returns of more than 28% in the past five years. The shares of the company have fallen more than 18% in 2026 so far, 24% in one year and over 26% in three years.\n\nAsian Paints shares have dropped nearly 29% in the past five years, with the stock delivering negative returns of nearly 26% in the past three years and 15% in 2026 so far.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago"}, {"title": "CEAT Shares Fall Nearly 4% As Q2 Profit Drops Nearly 40%", "full_content": "CEAT shares declined as the tyre maker reported lower profit and a contraction in operating margins for the September quarter. Investors will track whether revenue growth translates into improved profitability in the coming quarters.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 10:17 AM IST", "pub_date_relative": "1h ago"}, {"title": "BHEL share price crashes 5% on profit booking after Q2 results: Buy or sell? Brokerages suggest this", "full_content": "BHEL share price today: Shares of Bharat Heavy Electricals Ltd (BHEL) fell nearly 5% on Thursday, 15 October, despite the state-owned engineering major reporting a sharp rise in its September-quarter earnings. The stock had gained almost 4% in the previous session following the announcement of its Q2 results.\n\nBHEL reported a more than two-fold increase in consolidated net profit to \u20b9 820.94 crore for the July-September quarter of FY27, compared with \u20b9 374.89 crore in the corresponding quarter last year. The improvement was supported by higher revenue from its power and industry businesses.\n\nThe company's total income rose 24% year-on-year to \u20b9 9,553.01 crore in Q2, from \u20b9 7,686.11 crore in the same period of the previous financial year.\n\nRevenue from the power segment increased to \u20b9 6,637.90 crore from \u20b9 5,675.64 crore a year ago. The industry business also recorded growth, with revenue rising to \u20b9 2,662.45 crore from \u20b9 1,836.16 crore in the year-ago quarter.\n\nHowever, BHEL's expenses climbed to \u20b9 8,482.40 crore in the September quarter, compared with \u20b9 7,201.54 crore in the corresponding period last year.\n\nBHEL is India's largest engineering and manufacturing enterprise in the energy and infrastructure sector, with operations spanning power generation equipment and industrial systems.\n\nNuvama Institutional Equities retained its \u2018Buy\u2019 rating on Bharat Heavy Electricals Ltd (BHEL) and raised its target price to \u20b9 540 from \u20b9 530, citing strong execution, improving margins and earnings growth prospects. The brokerage expects execution-led EBITDA margin expansion to 13.8% by FY29 and projects a 53% compound annual growth rate (CAGR) in earnings per share (EPS) over FY26\u2013FY29.\n\nNuvama said BHEL reported a strong Q2FY27 performance, with revenue rising 24% year-on-year and EBITDA margin expanding 330 basis points to 11%, well above the consensus estimate of 8.5%.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 10:17 AM IST", "pub_date_relative": "1h ago"}, {"title": "Reliance Jio May Raise Tariffs By 12% \u2014 Here's Why", "full_content": "Centrum Broking sees rising ARPU, driven by premiumisation and higher data consumption, as a key earnings lever ahead of Reliance Jio's upcoming IPO.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 10:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Reliance Jio IPO at Rs 10 lakh crore valuation: What analysts see in the price band", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Reliance Jio IPO at Rs 10 lakh crore valuation: What analysts see in the price band Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Reliance Jio IPO at Rs 10 lakh crore valuation: What analysts see in the price band SECTIONS Reliance Jio IPO at Rs 10 lakh crore valuation: What analysts see in the price band By Akash Podishetti , ETMarkets.com Last Updated: Oct 15, 2026, 10:14:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reliance Jio has announced its IPO price range, setting it between Rs 1,065 and Rs 1,119 per share. With a massive valuation of around Rs 10.3 lakh crore, this IPO stands as the largest in Indian history. While analysts believe the valuation is reasonable, they warn that anticipated growth may already be priced in.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "15 Oct 2026, 10:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "IDBI Bank share price crashes 6% but LIC is up 1% | Prem Watsa-led \u20b952,877 crore Fairfax deal decoded for investors", "full_content": "IDBI Bank stake sale : IDBI Bank share price crashed over 6.57% in Thursday's trading session after government's decision to sell over 60.72% stake in the bank to Canada's Fairfax Financial Holdings.\n\nIDBI Bank shares opened at \u20b9 89.86 per share on NSE today, as compared to previous close of \u20b9 90.39 on Wednesday and touched an intraday low of \u20b9 83.62 on 14 October.\n\nMeanwhile, LIC share price rose nearly 1% on NSE, touching an intraday high of \u20b9 401.90 per share on Thursday.\n\nThe Cabinet Committee on Economic Affairs (CCEA) on Wednesday cleared the sale of a 60.72% stake in IDBI Bank to Fairfax Financial Holdings, founded by Indian-born Canadian billionaire Prem Watsa, for \u20b9 52,877 crore. The transaction is expected to be one of the biggest foreign investments in India\u2019s banking industry.\n\nThe proposed deal comprises the Centre\u2019s 30.48% stake in IDBI Bank and Life Insurance Corporation of India\u2019s (LIC) 30.24% holding. Following the completion of the transaction, the government is likely to retain a 15% stake in the bank, while LIC will continue to hold 19%, taking their combined shareholding to 34%.\n\nUnion Minister Ashwini Vaishnaw said the strategic partnership would bring fresh capital into IDBI Bank and create new growth opportunities for micro, small and medium enterprises (MSMEs), small businesses and aspiring entrepreneurs.\n\nFairfax has an established presence in India through Fairfax India Holdings Corporation, which reported assets worth $3.8 billion as of June 30, 2026. Its other investments in the country include non-banking financial services firm IIFL Capital and online brokerage platform 5paisa.\n\nThe proposed transaction comes at a time when the ongoing conflict in the Middle East is putting pressure on government finances, while weak foreign capital inflows have added to the pressure on the Indian rupee.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 10:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Leela Palaces Shares Jump Nearly 6% As Q2 Profit Rises 26.5%", "full_content": "Leela Palaces Hotels & Resorts shares jumped nearly 6% after the luxury hotel operator reported strong September quarter earnings. Investors will watch whether robust demand from leisure travel, weddings, and corporate bookings sustains growth in the second half of fiscal 2027.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: China stocks fall as hot US inflation data revives rate hike fears", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China stocks fall as hot US inflation data revives rate hike fears Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China stocks fall as hot US inflation data revives rate hike fears SECTIONS Global Market: China stocks fall as hot US inflation data revives rate hike fears By Anupam Nagar , ETMarkets.com Last Updated: Oct 15, 2026, 10:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chinese stocks tumbled as hotter-than-expected US inflation data revived concerns over prolonged high interest rates. Technology shares led losses across mainland China and Hong Kong markets as investors reassessed the outl  index and the BSE 250 Smallcap index dropped by 0.50% during the morning session.\n\nLet's take a look at three key factors behind the rise in the Indian stock market:\n\nInvestors are turning to blue-chip stocks as valuations become more comfortable. The shift towards large-caps also reflects their relative safety compared with mid- and small-caps, amid persistent geopolitical uncertainties that continue to cloud the market outlook.\n\nAround 10:15 AM, Bharti Airtel, ICICI Bank, HDFC Bank, Reliance, Infosys, and TCS were the top contributors to the gains in the Sensex.\n\nSouth Korea's Kospi crashed 8%, and Taiwan Weighted declined 4% as the selloff in AI-themed stocks deepened. MSCI Inc.\u2019s Asia Pacific equities declined 1.5%, heading for a fourth straight decline, reflecting growing investor concerns about a potential slowdown in artificial intelligence stocks amid stretched valuations.\n\nA lack of AI trade has been among the key factors behind the underperformance of the Indian stock market for the last one year. While key indices in Taiwan and South Korea have jumped 60% and 30% year-to-date, respectively, Nifty is down 12% in the same period.\n\nNow, the market is anticipating a reversal of the AI trade, which could drive foreign investors into the Indian market, offering alternative themes amid a resilient economy.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 10:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "HDB Financial Services Q2 Review: Motilal Oswal Trims Target Price Despite Inline Earnings \u2014 Here's Why", "full_content": "With valuations largely factoring in medium-term growth potential, the brokerage will look for clearer evidence of stronger execution on loan growth, the ability to better navigate industry, product cycles, and structural, not just cyclical improvement in return ratios.", "source": "NDTV Profit", "pub_date_str": "15 Oct 2026, 10:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Liv he 1:2 bonus shares.\n\nSpeaking on the eligibility criteria for becoming an eligible shareholder for these corpoatge rewards, Mahesh M Ojha, VP \u2014 Research and Business Development at KC Securities, said, \u201cTo become eligible for bonus shares, stock split and dividends, one needs to have the company stock(s) in one's demat account after the end of session on the record date. In the wake of \u2018T+0\u2019, \u2018T+1\u2019, etc. rules one needs to buy the stock on the ex-date of the record date announced. This ensures credit of the stock in one's demat after the end of session on the record date and makes a shareholder eligible for the corporat reward.\u201d\n\nAnand Rathi Wealth declred \u20b9 4 per share interim dividend last week while announcing the Q2 results 2026.", "source": "LiveMint Markets", "pub_date_str": "15 Oct 2026, 09:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "ETMarkets Smart Talk| Redirect fresh SIPs to largecaps if mid and smallcaps dominate your portfolio: Pradeep Gupta", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk| Redirect fresh SIPs to largecaps if mid and smallcaps dominate your portfolio: Pradeep Gupta The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk| Redirect fresh SIPs to largecaps if mid and smallcaps dominate your portfolio: Pradeep Gupta SECTIONS ETMarkets Smart Talk| Redirect fresh SIPs to largecaps if mid and smallcaps dominate your portfolio: Pradeep Gupta By Kshitij Anand , ETMarkets.com Last Updated: Oct 15, 2026, 09:49:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Pradeep Gupta, Chairman & MD, Anand Rathi Share and Stock Brokers Limited, explains why largecaps offer greater valuation comfort, how investors should rebalance their e
