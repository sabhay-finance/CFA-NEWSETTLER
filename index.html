rst week of April, according to Barchart data. The 'VIX' was last still hovering above 26. With the VIX climbing four days in a row, the volatility gauge hasn't traded under 16 since Oct. 16, arguably trending higher as the S&P 500 slips below this month's lows, trading under 7,300 for the lowest price for the benchmark equity gauge since June. Cboe's three-month volatility gauge, VIX3M, briefly touched the highest since April.\n\nCboe Volatility Index, YTD While Nvidia earnings are contributing to the uncertainty \u2013 the stock's options currently imply more than a 7% move after its report, the biggest in almost two years \u2013 volatility in the S&P 500 jumped more than in the Nasdaq 100 Tuesday, pointing to a more widespread fear among investors. \"SPX vol is expanding faster than NDX vol, as SPX vol is coming from a lower base,\" Eric Metz, CIO, SpiderRock Advisors for BlackRock, said via email. \"Today, the market is pricing acute near-term stress in large-caps broadly, but tech-specific fear is still notable. Even within the technology cohort, Tuesday's laggards took on a different tone. Software stocks declined the most ahead of Anthropic's IPO, with options volume on the iShares Expanded Tech-Software Sector ETF (IGV) surging to almost four times the 30-day average, according to Cboe LiveVol data. Salesforce was hardest hit, with put contracts outpacing calls on twice the average options volume. \"There's a lot of reasons to be risk-off,\" said Noel Smith, co-CIO of Kai Asset Management.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold is in a bear market \u2014 and hackproof in an increasingly digital world. Is now a good time to buy?", "full_content": "After the world\u2019s largest crypto hack and a spate of outages in the digital world, physical gold may be the ultimate \u201cantidigital\u201d asset.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 01:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Only two \u2018Magnificent Seven\u2019 stocks have managed to beat the S&P 500 since the start of 2025", "full_content": "Alphabet and Apple have approached artificial intelligence in ways that have resonated on Wall Street.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Nov 2026, 01:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Goldman Sachs revealed its outlook for 2027. Here\u2019s how much it sees the S&P 500 gaining", "full_content": "Chief U.S. equity strategist Ben Snider expects the bull market to continue, even if the advance isn't as explosive as it has been.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:35 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Home Depot names Richard McPhail as new CEO, beats earnings expectations", "full_content": "Home Depot on Tuesday announced its chief financial officer, Richard McPhail, will become CEO of the company, succeeding Ted Decker, effective next week.\n\nAlongside McPhail's appointment, Home Depot said Ann-Marie Campbell, currently senior executive vice president of U.S. stores and operations, will become president and chief operating officer. Jordan Broggi has been chosen as CFO to succeed McPhail.\n\nDecker, CEO since 2022, had been on temporary medical leave since August. The company said on Tuesday that Decker has returned from leave but is now stepping down from his role. He will continue to serve as chair of the board of directors, the company said.\n\n\"I'm glad to be back and grateful for the support I received,\" Decker told analysts on Tuesday. \"The board and I have agreed that now is the right time to move to the next phase of our succession plan.\"\n\nMcPhail has been with the company since 2005, holding multiple executive roles.\n\n\"We're not going to change course,\" McPhail told CNBC's Becky Quick.\n\nHe said the company will continue to lean into winning professional shoppers like contractors and using artificial intelligence tools to encourage sales. McPhail added that while the company faces more challenges now than it did at the start of the year, it is still winning share of the home improvement market.\n\nHome Depot has been pressured by a sluggish housing market, higher mortgage rates and a more cautious consumer. Still, the company has previously said it's seen resilience among its pro shoppers who are still shopping for their home improvement projects.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:31 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Memo to Nvidia interim CEO Colette Kress: Remind the world why you've been Jensen Huang's CFO for 13-plus years - Yahoo Finance", "full_content": "Memo to Nvidia interim CEO Colette Kress: Remind the world why you've been Jensen Huang's CFO for 13-plus years Yahoo Finance Meet Nvidia\u2019s Interim CEO WSJ Nvidia\u2019s interim CEO Colette Kress to make her debut at first earnings Financial Times \u2018A complete evaporation of confidence\u2019 \u2013 6 things have to go right for Nvidia post Jensen, starting with $109 billion in revenue Fortune Why this analyst says Nvidia is unlikely to cut its forecast MarketWatch", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 01:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Amex Platinum welcome bonus eligibility rules: What to know", "full_content": "The American Express Platinum Card\u00ae and The Business Platinum Card\u00ae from American Express feature two of the largest travel card welcome bonuses available. If you're approved for either card and qualify for the maximum welcome bonus, you can easily redeem the rewards for $1,500 or more in travel.\n\nThat's an incredible value that few cards can match. Before you apply, it's a good idea to familiarize yourself with the eligibility rules for Amex Platinum cards so you don't end up with a new card and miss out on the upfront rewards.\n\nYou can't beat the Amex Platinum Card's airport lounge access, which includes Amex Centurion Lounges, Delta Sky Clubs, Escape Lounges and more. (Enrollment required)\n\nYou may be eligible for as high as 175,000 Membership Rewards\u00ae points\n\nSee rates and fees , terms apply. Read our Amex Platinum Card review . The American Express Platinum Card\u00ae Welcome Offer: To view your personalized offer, you must first submit an application. If approved, you will: (1) receive your Welcome Offer details, (2) have the option to accept the Card with that offer, (3) be required to spend $12,000 on eligible purchases within the first 6 months of Card Membership, and (4) earn Membership Rewards\u00ae points. Welcome offers vary and you may not be eligible for an offer. If you're approved and accept your offer, a credit check may be conducted, which could impact your credit score. Terms apply.\n\nThe American Express Platinum Card\u00ae is a premium card loaded with annual statement credits, entertainment benefits, extensive airport lounge access, elite status perks and more. (Enrollment required for select benefits mentioned)\n\nHighlights shown here are provided by the issuer and have not been reviewed by CNBC Select's editorial staff.\n\nSenior reporter Jason Stauffer can answer your questions about how to make the most of your credit cards in his weekly Points Pro column. Submit yours here .", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 01:16 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Wall Street falters ahead of Nvidia earnings, Anthropic debut", "full_content": "NEW YORK, Nov 17 (Reuters) - US stocks extended their tech-driven slide on Tuesday as investors girded themselves for Nvidia's earnings, with scandal and controversy surrounding the chip giant fueling worries over the rapid build-out of AI infrastructure and risks associated with the nascent technology.\n\nThose jitters intensified ahead of Anthropic's mammoth IPO expected on Wednesday, which is targeted to raise as much as $1.4 trillion.\n\nThe broad selloff gathered momentum as the session progressed, sending all three major US stock indexes down more than 1%.\n\n\"Every sector in the S&P is down,\" said Oliver Pursche, senior vice president at Wealthspire Advisors, in New York. \"So clearly, it is a reflection of overall investor nervousness as opposed to being driven by a specific set of stocks, whether they're AI-related or not.\"\n\n\"It's a confluence of all of the events that are there, and it seems to be speculation-driven as opposed to fact-driven,\" Pursche added. \"It's not all about Nvidia.\"\n\nThe AI trade was already contending with popular opposition to large data centers when tech shares were rocked by Nvidia CEO Jensen Huang's ouster following revelations of his relationship with an alleged spy. Investors are also impatient to see returns on hyperscalers' massive expenditures.\n\nThe Trump administration's plans to block imports of Chinese data center equipment gained momentum in the wake of Huang's departure, despite opposition from Amazon, Alphabet , Meta and others.\n\nExpectations leading up to Nvidia's results are sky-high; the company is projected to post 90.4% year-on-year earnings growth on revenue of $109.11 billion.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 01:00 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kalshi takes down controversial Trump 'mention' markets at CFTC's request", "full_content": "Prediction market platform Kalshi quietly paused trading in a handful of \"mention\" contracts tied to President Donald Trump at the end of last week at the request of the CFTC, the company confirmed on Tuesday.\n\nMention markets are made up of contracts that ask traders what specific words will be used in a speech, a corporate earnings call or during a television broadcast. Earlier this year, a White House teleprompter operator used inside information to place trades in mention markets related to the president's comments.\n\nMarkets paused include those asking traders what nicknames Trump will say before 2027, what the president will say in November and what countries and companies Trump will say before the end of the month.\n\nThe move comes after the Commodity Futures Trading Commission , the federal agency overseeing prediction markets, said in a letter to exchanges in September that mentions contracts have a greater manipulation risk.\n\nA spokesperson for the agency told CNBC that the commission has placed holds on the certification of some of Kalshi's proposed mention markets. The spokesperson cited a Kalshi contract on hold that asked what key words would Trump say before a certain date. The contract was originally self-certified by Kalshi in February 2025.\n\n\"The CFTC stayed the certification of these contracts because they may be susceptible to manipulation, which is consistent with the staff advisory the CFTC put out two months ago,\" said Brooke Nethercott, the agency's spokesperson.\n\nIn a statement, Kalshi spokesperson Dani Lever said Kalshi is complying with the order.\n\nIn August, reports emerged that the CFTC was conducting an internal review into mention markets. The agency also requested that Kalshi, which is the only U.S.-regulated exchange that features the contract type, take down its sports-related mention markets in response to the inquiry. Kalshi complied.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 12:59 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI\u2019s New Hacking Model Found Dozens Of Holes In Apple Tech - Forbes", "full_content": "OpenAI\u2019s New Hacking Model Found Dozens Of Holes In Apple Tech Forbes Claim that OpenAI model found 948 Linux flaws runs ahead of the record Crypto Briefing OpenAI's GPT-6 Cyber found about 35 flaws in Apple's iPhone and Mac software, Forbes reports MLQ.ai OpenAI\u2019s GPT-6 Cyber Found ~35 Apple Flaws; Apple Credits 5 FourWeekMBA", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 12:50 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Kalshi halts trading on Trump's speeches - Politico", "full_content": "Kalshi halts trading on Trump's speeches Politico Exclusive: Kalshi CEO Tarek Mansour opposes CFTC decision to suspend mention markets Axios Kalshi takes down controversial Trump 'mention' markets at CFTC's request CNBC Kalshi Halts Bets That Are Based on Trump\u2019s Remarks WSJ Kalshi suspends Trump speech wagers on US regulatory order Reuters", "source": "Google News Business", "pub_date_str": "18 Nov 2026, 12:47 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold struggles to rebound from one-year low as US dollar, yields advance", "full_content": "Nov 17 - Gold was steady and struggled to recover from a one-year low on Tuesday as a resurgent US dollar and rising Treasury yields weighed on demand, while investors awaited minutes from the Federal Reserve's October meeting for clues on the scale and timing of expected rate hikes.\n\nSpot gold was down 0.07% to $3,853.36 per ounce by 2:04 p.m. ET , barely above its 13-month low of $3,830.74 hit on Monday. US gold futures for December delivery settled 0.2% higher at $3,864.2 per ounce.\n\n\"The mechanics are brutally simple: the 10-year is pinned around 5.14% and the dollar has scaled a fresh 19-month peak. A non-yielding asset cannot win an argument with a 5% risk-free coupon,\" said Terri-Leigh Bennett, COO, CMS Prime.\n\n\"Add the AI-equity unwind ... and gold gets hit twice, because in a scramble for cash, bullion is collateral first and a haven second.\"\n\nInvestors geared up for AI bellwether Nvidia's first earnings report without Jensen Huang at the helm. [MKTS/GLOB]\n\nThe dollar eased but remained near its highest in 19 months, while benchmark 10-year Treasury yields climbed on expectations of more aggressive rate hikes.\n\nMarkets are currently assigning a 96% probability of a 25-basis-point rate hike in December, according to CME's FedWatch tool, while there's also a small possibility of a larger 50-basis-point increase following hawkish comments from policymakers. [USD/] [US/]\n\nThe US Fed may need several rate hikes to bring high inflation under control and should act soon to ensure the problem doesn't get worse, St. Louis Fed President Alberto Musalem said on Tuesday.", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 12:46 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Financial Statement Analysis", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Bonds are causing trouble again \u2014 here's where to invest now", "full_content": "Rising bond yields and Federal Reserve rate hikes are making for a tricky environment for bond investors. Here's how to play it.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 12:31 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Philip R. Lane: The practice and science of monetary policy communication: the ECB experience", "full_content": "", "source": "ECB Press", "pub_date_str": "18 Nov 2026, 12:00 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Upcoming IPO: Advanced Sys-Tek gets Sebi nod for public issue \u2013 fundraising, fresh equity issue, OFS & other key facts", "full_content": "Advanced Sys-Tek plans to utilise the net proceeds from the fresh issue primarily to finance its expansion plans and meet long-term working capital requirements", "source": "LiveMint Markets", "pub_date_str": "17 Nov 2026, 11:54 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nifty 100's 10-year winning streak could end in 2026. Should you continue your mutual fund SIPs or change strategy?", "full_content": "Nifty 100's decade-long winning streak could end in 2026. Should investors continue mutual fund SIPs, increase contributions or rebalance their portfolios? Here's how to navigate market volatility and when a change in SIP strategy may actually make sense.", "source": "LiveMint Money", "pub_date_str": "17 Nov 2026, 11:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The data is very preliminary, but Vulcan failure may not be due to BE-4 engines - Ars Technica", "full_content": "The data is very preliminary, but Vulcan failure may not be due to BE-4 engines Ars Technica ULA lost a Vulcan Centaur rocket 10 minutes after launch \u2014 but the failure began just after liftoff Space Amazon loses 40 Leo satellites as Boeing-Lockheed rocket fails DW.com Vulcan failure deepens concerns over US military launch capacity Breaking Defense Stock Market Today, Nov. 16: Amazon Falls on New AI Chip Export Rule and Leo Satellite Launch Failure Yahoo Finance", "source": "Google News Business", "pub_date_str": "17 Nov 2026, 11:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Altimeter's Brad Gerstner aims to invest $5 billion in Anthropic IPO", "full_content": "Gerstner told CNBC that he's looking to put five time as much money into Anthropic as he's ever put into an IPO.", "source": "CNBC World Economy", "pub_date_str": "17 Nov 2026, 11:17 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trade Setup F     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
