estigated,\" Trump wrote.\n\nHowever, the difference between the advance estimate and the figure in the second release is far from being an all-time record. It was the largest revision since the 1.2 percentage point revision seen in the second quarter of 2020.\n\nOn an absolute basis, the latest revision was tied for 16th among all revisions from the advance estimate to the second release since 1990. It also tied four other quarters with a similar 0.9 percentage point difference \u2014 and was approximately double the average revision of 0.43 percentage points for all 147 quarters.\n\nThe upward revision shows Trump's policies are \"delivering results\" that defy expectations, White House spokesman Matthew Middleton told CNBC.\n\nRevisions to U.S. economic numbers are not out of the ordinary . Initial reports count on partial survey data and early estimates. That data is later updated with more survey responses \u2014 which sometimes leads to changes from the initial reports.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 09:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'The Traitors' ended with a $246,300 prize\u2014here's who won and what they told us about spending it", "full_content": "When Shane Beatty, a contestant on NBC's \"The Traitors: New Blood,\" deceived his fellow finalists, he walked away with the entire $246,300 prize. But the emotional toll of winning caught him by surprise.\n\n\"The second I had to reveal that I was a Traitor, everything hit me at once,\" Beatty, a 32-year-old ironworker from Staten Island, New York, tells CNBC Make It. \"I had built genuine relationships with these people, and knowing that some of them were blindsided by my decision was difficult.\"\n\nNow that he's won, Beatty has a plan for his money, starting with setting aside a sizable share for Uncle Sam. As for the rest, he's more interested in financial security than the trappings of newfound wealth.\n\nAfter winning, Beatty doesn't expect his day-to-day life to change much.\n\n\"I'm still going to get up, go to work, and continue doing what I've been doing as a Local 580 ironworker,\" he says. \"I love my career, and winning this money doesn't change that.\"\n\nBeatty plans to pay for a wedding he and his fianc\u00e9e previously struggled to afford, help his mother pay down debt and clear his own debts before saving the rest.\n\n\"What it does give me is an opportunity to take some financial pressure off, be a little more comfortable and put myself in a better position for the future,\" he says.\n\nBut before spending his winnings, Beatty is accounting for what could be his single biggest expense \u2014 taxes.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 09:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Tech Roars Back: Meta-Led 'Mag-Seven' Lifts Nasdaq; Chip Stocks Surge To Cap Volatile Week", "full_content": "Meta, Amazon and Tesla lead gains among the Magnificent Seven as US technology stocks rebound after a volatile week, while semiconductor shares rally on renewed buying in AI-linked companies.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 09:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Sebi allows FPIs to trade in physically settled non-agri commodity derivatives", "full_content": "The Securities and Exchange Board of India (Sebi) has widened the participation of foreign portfolio investors (FPIs) in exchange-traded commodity derivatives, allowing them to trade in physically settled non-agricultural contracts from 1 June 2027.\n\nIn a circular issued on Friday, the markets regulator revised its existing framework, which had restricted FPI participation in commodity derivatives to cash-settled non-agricultural contracts and indices comprising such commodities.\n\nThe move is aimed at deepening institutional participation and improving liquidity in the commodity derivatives market.\n\nUnder the revised framework, FPIs will be permitted to participate in non-agricultural commodity derivative contracts, barring options in goods. However, they will have to exit or roll over their open positions before the tender or staggered delivery period commences.\n\nFPIs are currently allowed to trade only in non-agri commodity derivatives that are cash settled, such as crude oil and natural gas contracts. Sebi opened up that segment to foreign investors in June 2022. Bullion, base metals and agri derivatives, however, are compulsorily deliverable upon contract expiry.\n\nSebi has put in place a safeguard mechanism to prevent foreign investors from getting entangled in the physical delivery process. FPIs will be free to square off or roll over their positions until the close of market hours on the day preceding the start of the tender period. If they fail to do so, their residual positions will automatically transfer to a designated trading member or trading-cum-clearing member (TM/TCM).\n\nThe regulator has also prohibited fresh trades that increase an FPI's existing position in an expiring futures contract from three trading days before the start of the tender or staggered delivery period.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 09:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Wall Street's Post-Thanksgiving Rally: Nasdaq Jumps 330 Points On AI Dip-Buying, Dow Eyes Weekly Surge", "full_content": "Nasdaq Composite rose 1.4% or 330 points to 23,916.59, S&P 500 advanced 1.15% to 7,265.55, while Dow Jones Industrial Average traded 1.03% up at 50,697.38.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 08:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Aakasamlo Oka Tara Box Office Collection Day 8: Dulquer Salmaan's Film Records Week 2 Earnings", "full_content": "Aakasamlo Oka Tara, also known as AOT, is a Telugu sci-fi drama directed by Pavan Sadineni. The film stars Dulquer Salmaan and Satvika Veeravalli in the lead, blending science fiction with an emotional story.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 08:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This week\u2019s bounce following a rapid correction may not hold, history shows", "full_content": "If history is any guide, investors should enjoy this week\u2019s surge. It\u2019s unlikely to hold.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 08:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "MCX gold prices rebound over \u20b98,300 in two sessions, set to snap 2-week losing streak; what lifted sentiment?", "full_content": "METAL MCX A Ksheerasagar Published 27 Nov 2026, 08:45 PM IST Prefer Livemint on Google MCX gold prices in India remained higher in Friday's trade, extending the previous session's late-hour recovery as technology and artificial intelligence (AI) stocks stabilised following a recent sell-off. This eased liquidity-driven pressure on precious metals and supported a rebound in gold prices.\n\nThe December futures contract on the Multi Commodity Exchange (MCX) gained nearly \u20b9 4,000 per 10 grams to hit an intraday high of \u20b9 1,26,251, extending its winning streak to a second consecutive session.\n\nMeanwhile, silver futures on MCX also regained strength by surging \u20b9 9000 per kilogram to reach the day's high of \u20b9 1,54,804.\n\nThe yellow metal has witnessed volatile moves this week as growing expectations of a US Federal Reserve rate hike at its upcoming meeting have dented the appeal of holding gold. Meanwhile, the AI-led sell-off also prompted investors to liquidate positions to cover losses in other asset classes.\n\nDuring Wednesday's trade, MCX gold slipped to its lowest level since October 2025, falling below \u20b9 1,17,906 per 10 grams before recovering sharply. Based on Friday's intraday high, the metal has rebounded by \u20b9 8,345 from Wednesday's low.\n\nDespite the roller-coaster moves, gold has turned positive for the week, putting it on track to snap a two-week losing streak during which it had cumulatively plunged 14.6%.\n\nThe latest rebound has also helped narrow gold's monthly losses to around 10%, compared with a decline of nearly 20% at the month's low.\n\nThe recovery in gold prices also coincided with a mild pullback in the US dollar after it scaled a 22-month high earlier this week. A weaker dollar makes dollar-denominated metals less expensive for holders of other currencies, supporting demand.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 08:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Top 10 things to watch in the stock market on Black Friday", "full_content": "Stocks are on pace for a record Black Friday as Anthropic tries to regain its IPO price.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 08:38 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Equity, gold or debt funds: Where should investors put their money in 2027?", "full_content": "As 2026 draws to a close, investors are reviewing their portfolios and evaluating investment options for 2027, including equities, gold and debt mutual funds. While debt funds may provide relatively stable returns, market experts believe equities and gold could play a more significant role in generating long-term wealth and protecting investments against inflation.\n\nEshaan Lazarus, founder and CEO of 021 Trade, recommends focusing on two key asset classes: equities and gold. He suggests building a well-diversified equity portfolio while allocating 10-15% of total investments to gold.\n\nFor investors who are uncomfortable with stock market volatility but need to keep some money accessible, Lazarus also recommends considering arbitrage funds for emergency requirements, according to NDTV .\n\nLazarus believes equities offer better long-term return potential than debt investments. However, he advises investors to be selective when choosing equity mutual funds.\n\nAccording to him, most actively managed mutual funds underperform their benchmark indices over a 10-year period. Investors should therefore focus on fund managers whose investment strategies and stock-selection abilities they trust .\n\nIdentifying consistently successful fund managers, however, can be challenging. For investors who lack the expertise to evaluate fund management capabilities, Lazarus suggests low-cost index funds.\n\nUnlike actively managed schemes, index funds simply track a market index rather than relying on a fund manager to identify individual stocks. This makes them a relatively straightforward and cost-effective way to participate in equity markets.\n\nLazarus argues that equities offer an important advantage over debt investments: their potential returns are not capped. Although investors risk losing their capital, successful equity investments can generate substantial returns over longer periods.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 08:34 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "EPF withdrawal rules: How retirees can generate monthly income from PF interest without dipping into their savings", "full_content": "The Employees\u2019 Provident Fund Organisation (EPFO) has approved a new withdrawal facility that could change how salaried employees access their provident fund savings after retirement. Instead of withdrawing their entire Employees\u2019 Provident Fund (EPF) corpus in one go, retirees will be able to receive periodic payouts while keeping the unwithdrawn money invested in the EPF system.\n\nThe proposed Systematic Withdrawal Plan (SWP), approved by the Central Board of Trustees (CBT) at its meeting on 19 November 2026, will offer members an option to draw income from their accumulated savings without immediately exhausting their retirement corpus.\n\nFor retirees who want a regular income but are reluctant to move their PF savings into other investment products, the facility could provide an additional option. One of the proposed choices is to withdraw only the interest earned on the remaining balance while retaining the principal.\n\nHowever, the plan is not yet operational. The necessary amendments to the EPF Scheme and the corresponding changes to the Income Tax Act are still required.\n\nUnder the proposed facility, retiring EPF members will be able to choose how they want to receive their accumulated savings instead of taking the entire corpus as a lump sum.\n\nThe unwithdrawn balance will continue to earn interest at the prevailing EPF rate. Members will also be able to discontinue the withdrawal plan and claim the remaining balance.\n\nThe facility is voluntary, which means members who prefer the existing lump-sum withdrawal option will not be forced to opt for periodic payouts. Eligible family members and beneficiaries may also be covered under the proposed framework.\n\nThe amount a retiree can withdraw will depend on the accumulated PF balance and the interest rate applicable to the account.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 08:31 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Budget airline Norse Atlantic files for bankruptcy in Europe after failing to secure funding", "full_content": "Budget carrier Norse Atlantic filed for bankruptcy Friday, saying it failed to secure funding after soaring fuel costs strained the company's operations.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 07:28 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bought gold or silver at peak? ETFs plunge up to 62% as late investors bear the brunt of sharp price correction", "full_content": "The correction has also exposed the risks of chasing assets after a sharp rally, with late investors bearing a disproportionate share of the losses.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 07:24 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Airline Norse Atlantic's Norwegian operating unit declares bankruptcy - Reuters", "full_content": "A S&P 500 into a correction. History shows that a correction doesn't always lead to a bear market, or a recession.", "source": "CNBC Finance", "pub_date_str": "27 Nov 2026, 06:51 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "South Korea's Kospi crashes 48% from record high: How the AI trade unwind is hitting investors and pension funds", "full_content": "South Korea\u2019s Kospi has fallen 48% from its record high as investors reassess AI-related investments. The downturn cut the National Pension Service\u2019s assets by 202 trillion won by the end of September, despite strong returns earlier in the year.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 06:37 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "An iPhone for 10g gold, a car for 100g: This entrepreneur wants you to rethink how you measure wealth", "full_content": "Enterprenuer Prem Soni has shared a way to measure wealth using grams of gold instead of rupees. His framework links everyday purchases, from smartphones and holidays to cars and homes, to specific amounts of gold, sparking a discussion about savings and spending.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 06:24 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why is RBI bringing its gold back to India? The big shift decoded", "full_content": "", "source": "Economic Times Economy", "pub_date_str": "27 Nov 2026, 06:23 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold prices under pressure as Russia sells 72 tonnes of reserves in 10 months. What investors should know", "full_content": "Russia has sold around 72 tonnes of gold in 10 months amid fiscal pressures, adding to selling by Turkey and Azerbaijan. However, global central banks added 321 tonnes in Q3 2026, indicating that official-sector demand remains strong.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 06:20 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US stocks edge higher as battered AI shares claw back losses: Stock Market Live Updates", "full_content": "", "source": "Economic Times Markets", "pub_date_str": "27 Nov 2026, 06:16 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "First Thing: Trump claims revised economic data shows pre-midterms figures were \u2018fake\u2019 - The Guardian", "full_content": "First Thing: Trump claims revised economic data shows pre-midterms figures were \u2018fake\u2019 The Guardian Trump demands probe into 'record setting error' after third-quarter GDP data gets massive revision higher CNBC Trump demands GDP data probe as chances of rate hike rise: What to know The Hill Trump Demands Probe Into \u2018Fake\u2019 Economic Figures Time Magazine The Economy Grew Way Faster Than First Reported: Q3 GDP Revised Up to 4.3% Yahoo Finance", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 06:08 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jaipur leads jewellery searches with 78% growth, Delhi tops gold testing c     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
