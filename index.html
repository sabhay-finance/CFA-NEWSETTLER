 "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Social Security and the blue wave: What could happen to payroll taxes and senior tax breaks", "full_content": "Congress has six years to enact changes to Social Security to prevent cuts to retirement benefits. Senators elected in the Nov. 3 midterms will be in office when the deadline arrives, and their decisions may be critical in making tax changes that can affect Social Security.\n\nDuring the midterm campaign season, tax policy surfaced in the debate over Social Security in two different ways. Many Democrats, and some Republicans, called for high earners to pay more in Social Security payroll taxes, while many Republicans touted a recently enacted tax deduction for adults 65 and older.\n\nThe diverging tactics come at a crucial moment for reform: The first could increase revenue flowing into the program. The second reduces eligible older adults' income taxes and can lower the taxes some beneficiaries pay on Social Security benefits, reducing program revenue.\n\nSocial Security trustees' latest projections show the trust fund used to pay retirement benefits may start to become depleted in 2032, when 78% of benefits would be payable.\n\nLawmakers do have some leeway \u2014 if the program's retirement and disability trust funds are combined, depletion would be pushed out to 2034, when 83% of scheduled benefits would be payable. But that's still a haircut for retirees \u2014 and it's coming soon.\n\n\"We've waited too long already, and the consequences are that the gap has grown larger,\" Shai Akabas, vice president of economic policy at the Bipartisan Policy Center, said of Social Security's shortfall.\n\nOn the campaign trail, midterm candidates largely avoided specifics on how they would reform Social Security. However, raising the payroll tax cap, also known as the taxable maximum, was a popular choice among Democratic candidates.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 08:00 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trade Setup For Nov 16: Nifty Likely To Resume Rally Despite Friday's Sell-Off; Key Levels To Watch", "full_content": "Despite Friday's dip, technical experts expect the bullish momentum to continue.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 07:53 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock to buy after Q2 Results 2026: Up 70% in YTD! Should you buy retail stock after strong guidance? Target, stop-loss", "full_content": "Sharmila Bhadoria Published 15 Nov 2026, 07:35 PM IST Prefer Livemint on Google Stock to buy after Q2 results, 2026: Shares of Baazar Style Retail Limited will remain in focus during Monday\u2019s trading session after the announcement of second quarter results over the weekend.\n\nBazaar Style Retail share price closed 5.39% higher on Friday, extending its bullish run over the past few trading sessions. Its share price value has surged 20% over the last one week.\n\nThe specialty retail stock is showcasing positive momentum on daily, weekly and monthly charts, according to Mahesh M Ojha, VP -Research and Business Development at KC Securities. The expert suggest to place support at \u20b9 442- 415, it can go up to the level of resistance near 486-503-530.\n\nThe stock closed 5.39% higher at \u20b9 468.55 per share on BSE with a market capitalisation of \u20b9 3,566.48 crore on Friday, November 13. Its share price value has surged nearly 20.08% over the last one week, 33.3% in two weeks, 22.87% in one month, 34% in three months. The stock has delivered 73% return since the beginning of the year 2026 and around 51% in one year.\n\nThe Kolkata-headquartered company\u2019s revenue from operations stood at \u20b9 47,848.31 lakh in the second quarter of financial year 2026-27, against \u20b9 53,149.66 lakh reported in the year ago period.\n\nThe value fashion retail chains expanded its network to 293 stores across 10 states. The company is on track to achieve its milestone of 300 stores. The company reported a revenue of \u20b9 965 crore in the first half of financial year 2026-27.\n\n\u201cLooking ahead, the Company expects Q3 and Q4 FY27 to be its strongest quarters. It is targeting turnover of \u20b9 2,500 Cr in FY27, with revenue guidance to achieve \u20b9 3,800 Cr in FY28 and \u20b9 5,600 Cr in FY29,\u201d read the press release.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 07:35 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission salary hike: How a 7% annual increment could take your basic pay above \u20b91 lakh in 10 years", "full_content": "A central government employee drawing a basic salary of \u20b9 29,200 could see it cross \u20b9 1 lakh in 10 years if the annual increment rate increases to 7% under the 8th Pay Commission. Interestingly, this could happen even with a lower fitment factor of 2.1. Under another scenario, where the fitment factor remains at 2.57 but the annual increment stays at 3%, the employee's basic salary could reach only \u20b9 97,915 over the same period.\n\nThe comparison highlights an important question for central government employees awaiting the next pay revision. Would a higher fitment factor, which provides a bigger initial salary increase, be more beneficial than a higher annual increment that allows basic pay to grow faster over time?\n\nEmployee organisations have submitted proposals seeking changes to both components. While several have demanded a fitment factor of 3.833, others are seeking an increase in annual increments from the existing 3% to 6-7%. Neither proposal has been approved by the government.\n\nThe fitment factor is the multiplier applied to an employee's existing basic pay to calculate the revised basic salary under a new pay commission. Under the 7th Pay Commission, the government fixed it at 2.57.\n\nFor the 8th Pay Commission, the National Council of the Joint Consultative Machinery (NC-JCM) and several other employee organisations have proposed a fitment factor of 3.833. If accepted, this would increase the minimum basic salary from \u20b9 18,000 to \u20b9 69,000.\n\nEmployees are also seeking a higher annual increment. NC-JCM, the All India Defence Employees' Federation (AIDEF) and the Federation of National Postal Organisations (FNPO) have demanded an increase to 6%. The All India New Pension Scheme Employees Federation (AINPSEF) has proposed an annual increment of 7%.\n\nUnder the existing pay structure, central government employees receive a 3% annual increment.\n\nConsider an employee in Pay Level 5, currently drawing a basic salary of \u20b9 29,200.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 07:31 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Will the Anthropic IPO create a disturbance in the broader U.S. equity market, like SpaceX did?", "full_content": "SpaceX\u2019s offering coincided with the June peak in semiconductors.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 07:30 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Judge temporarily blocks Trump from moving ahead on Washington public golf course redevelopment", "full_content": "A federal judge on Saturday ordered a two-week delay to any work at a historic Washington public golf course near the White House, blocking, for now, President Donald Trump's push to redevelop the site along the Potomac River into a championship-level venue.\n\nU.S. District Judge Ana Reyes issued the temporary restraining order before the East Potomac Golf Links was set to close for 15 months on Sunday. Trump had announced work would begin that day despite the legal challenge initiated against the project in February by the DC Preservation League and two local golfers.\n\nThe plaintiffs argue that Trump's plan would change the character of the accessible golf course and make it unaffordable, something the Republican president denies. They had sought the stop-work order, saying that closing the course and launching work on the project would \"irreparably injure plaintiffs and the public interest.\"\n\nThe president's public announcements on social media last month, outlining the closure date for East Potomac Park and linking it to the renovation of the golf course, weighed heavily in the decision. Trump said on Oct. 26 that \"We are closing the East Potomac Golf Course Site as scheduled on November 15th in order to renovate and rebuild for Competitive (with other such projects!), Safety, Modernization, and Aesthetic reasons.\" He added that the goal was to renovate and rebuild \"a World Championship Public Facility.\"\n\nReyes, in her ruling Saturday, noted that Trump's posts presented a problem for the government. \"They indicate that the Washington National Plan is final and that NPS will close the Park to implement it,\" she wrote. \"Both points favor granting Plaintiffs' motion for another temporary restraining order.\"\n\nReyes said her order \"ENJOINS the government from closing East Potomac Park and the East Potomac Golf Course during the daily hours in which they were open as of November 14, 2026. It does not order the Government to undertake any active management of either.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 07:28 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Qualcomm Engineer Who Asked To Be Laid Off Says He Will Get Nearly 15 Months' Pay", "full_content": "Qualcomm is restructuring and could cut about 7% of its global staff of around 52,000, which works out to nearly 3,600 jobs.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 07:24 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How Nvidia's scandal knocked thousands off your 401(k) - Axios", "full_content": "How Nvidia's scandal knocked thousands off your 401(k) Axios Forget Former Nvidia CEO Jensen Huang -- This Is the Real Question Investors Need to Ask About Nvidia Stock Yahoo Finance Nvidia\u2019s Scandal Is Poking Real Holes in the AI Trade. That Doesn\u2019t Mean It\u2019s Over. Barron's Nvidia closes below $4T market cap for first time since July 2025 in Huang fallout CNBC Musk says Nvidia will lose 'critical' deals without Jensen Huang Reuters", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 07:23 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Crystal Crop Protection IPO one lot profit calculator on latest GMP: How much can retail and HNI investors earn? Listing", "full_content": "Crystal Crop Protection\u2019s \u20b9455.49 crore IPO opens November 18 and closes November 20     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
