 of questioning from NYC Council Speaker Julie Menin and other members on Friday as part of a council investigation into AI safety.\n\nWhen Castillo Madrid claimed that the company had appropriate \"safeguards\" in place around its AI products, Menin immediately confronted her.\n\n\"I'm going to completely push back on that,\" Menin said. \"I mean, just this morning \u2014 myself and my team \u2014 we put our own names, my own name, into Grok, and there's absolutely a sexualized image of myself. So then, how is it that within a second, I could find a sexualized image of myself using Grok?\"\n\nCastillo Madrid responded that the company has \"strict controls\" and would have the safety team look into that specific instance.\n\nNYC Council Member Carmen De La Rosa, who leads the council's tech committee, told Castillo Madrid that \"it is disgusting\" that Grok enables users to easily \"sexualize\" images of real women without their consent.\n\n\"I just don't understand how you can say that there are these safe models,\" Menin said. \"It's just unacceptable.\"\n\nCastillo Madrid appeared in front of the council's tech committee by video.\n\nElon Musk's aerospace, defense tech and AI company originally evaded requests and a subpoena from the city council to appear alongside leaders from OpenAI , Anthropic , Google and Meta on Oct. 5. SpaceX agreed to testify earlier this week after the council threatened to have its subpoena enforced by a judge.", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 09:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "ITC Q2 Results: Date, Time, Dividend News, Earnings Call Schedule And More", "full_content": "ITC will announce its Q2 FY27 results on November 2. The company has notified stock exchanges of the board meeting to consider its September-quarter earnings, s now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 09:03 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Amid rising streaming subscription costs, here are 3 strategies CNBC staffers use to save", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nThese days, everything from your gym membership to knitting kits seems to have a monthly subscription attached to it. As such, it can become harder and harder to track your total spending \u2014 and it's made the small-but-more-frequent price increases easier to ignore.\n\nIn just the past three months, at least half a dozen streaming subscriptions hiked their prices, including Peacock, Apple TV, ESPN, Disney+, Hulu and Apple Music. Even more have increased over the past year . While these price increases only translate to roughly a few dollars each month, the annual price jumps by a larger margin.\n\nTake Peacock\u2019s Premium monthly price increase from $10.99 to $12.99, for example. That\u2019s only $2 more each month, making it easy to miss the full effect a price increase (or multiple) has on your wallet.\n\nNow, we\u2019re not telling you to cancel all your subscriptions and stare at the wall. If you need help saving on subscription costs, there are ways to be more intentional with the ones you use and ways to get access without paying directly.\n\nNo fee to open, no monthly maintenance fee, no minimum balance fees\n\nAccount funding options include mobile check deposit (HYSA only), ACH, direct deposit, etc.\n\nNo account, service or maintenance fees for SoFi Checking and Savings.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 08:58 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives ar     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
