<script>

    const allData = {"general": [{"title": "Salary earned abroad, credited to NRE account: Does that make it taxable in India? ITAT ruling explained", "full_content": "For Indians working overseas, where salary is credited can sometimes create confusion about where that income is taxable. A recent Bengaluru Income Tax Appellate Tribunal (ITAT) ruling has clarified that merely receiving foreign salary in an Indian NRE bank account cannot, by itself, be a reason to treat the salary as income accruing in India.\n\nThe ruling came in Santhoshkumar Vithal Akka vs Income Tax Officer, Ward International Taxation 1(1), Bengaluru, ITA No. 2056/Bang/2025, for assessment year 2016-17, with the order pronounced on 23 September 2026.\n\nThe taxpayer was a non-resident during the relevant assessment year and was working on a project in South Korea. His salary was fixed in US dollars and credited to his NRE account maintained with Axis Bank.\n\nThe taxpayer had originally filed his return as a non-resident. The case was subsequently reopened, and the Assessing Officer (AO) sought various details. The taxpayer eventually submitted documents including his bank statements, income computation, passport and payslips.\n\nThe AO observed that the taxpayer had received salary in US dollars in his NRE account and concluded that the salary income had not been declared in his return.\n\nThe department also noted that the taxpayer had not furnished copies of his foreign tax returns, a tax residency certificate (TRC) or proof of taxes paid abroad. The AO consequently added the salary income to his taxable income .\n\nThe taxpayer challenged the addition before the Dispute Resolution Panel (DRP), but the DRP also rejected his objections. Among other things, the DRP took the view that because the salary had been paid by the employer into a bank account in India, it was deemed to accrue or arise in India.\n\nBefore the ITAT, the taxpayer argued that he was a non-resident and had earned the salary while working outside India. Therefore, the fact that the salary was subsequently credited to his Indian NRE account should not make the foreign employment income taxable in India.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 01:32 PM IST", "pub_date_relative": "9m ago"}, {"title": "North Korea tests swarm attacks combining drones and missiles - WSJ", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 01:28 PM IST", "pub_date_relative": "13m ago"}, {"title": "'India's Defence Strategy Future-Ready In 5th Generation Of Warfare,' Says Rajnath Singh At NDTV Summit", "full_content": "Addressing India's defence capabilities, Singh said that India's defence strategy is \"future-ready\"; he added that energy resources have been diversified and stressed the importance of being war-ready if a country wants peace.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 01:13 PM IST", "pub_date_relative": "28m ago"}, {"title": "India vs West Indies Live Streaming: When And Where To Watch IND vs WI 1st ODI On TV And Online", "full_content": "India returns to ODI action against West Indies on September 27, with Rohit Sharma and Virat Kohli back in the squad. Here's where to watch the 1st ODI live.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 01:12 PM IST", "pub_date_relative": "29m ago"}, {"title": "Cochin Shipyard, Voltas, BEL, Tata Steel, Axis Bank, Vedanta Aluminium: Top stocks to buy | Target, SL by Ganesh Dongre", "full_content": "Stock recommendations by Ganesh Dongre of Anand Rathi: The key benchmark indices of the Indian stock market ended the week on a negative note, with the Nifty 50 declining nearly 0.88% to close at 23,140, while the Bank Nifty declined 1.38% to close at 55,580. Sectoral performance remained relatively mixed, although Realty, Metals and Chemicals outperformed during the week, gaining around 1\u20132%.\n\nFrom a macro perspective, geopolitical uncertainties remain elevated, particularly around the US\u2013Iran tensions and broader developments in the Middle East. Movements in crude oil prices and global market cues are likely to remain important factors for the domestic market in the coming week. Brent crude continues to sustain above the $100 per barrel mark, raising concerns over inflationary pressures and global risk sentiment.\n\nFrom a technical perspective, the Nifty 50 index has entered an oversold zone following the recent sharp decline, amid concerns about the US Federal Reserve's interest-rate outlook. The possibility of another rate increase in the coming quarters remains a key concern for global markets, while the US 10-year Treasury yield, maintaining an upward bias, could continue to influence risk appetite.\n\nGanesh Dongre, Assistant Vice President \u2014 Equity Research at Anand Rathi, believes that profit booking at higher levels remains a possibility, and the Nifty 50 index could therefore witness a period of sideways consolidation during the upcoming monthly expiry week.\n\nSpeaking on the outlook for the Nifty 50 index, Ganesh Dongre of Anand Rathi said, \u201cThe Nifty 50 index continues to face difficulty sustaining above the 23,500\u201323,600 resistance zone, which remains an important technical barrier.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 01:11 PM IST", "pub_date_relative": "30m ago"}, {"title": "Gas PSU stock to buy: After 26% returns in 6 months, Emkay Global sees further 16% upside | Target, stop-loss, rationale", "full_content": "Gas PSU stock to buy : Brokerage firm Emkay Global has upgraded gas PSU stock GAIL (India) to \u2018buy\u2019 from \u2018add\u2019, on the back of a steady core business and earnings outlook along with attractive valuations. The brokerage firm has given the target price of \u20b9 200, seeing an upside potential up to 15.6%.\n\nAccording to the firm, despite the Strait of Hormuz crisis and elevated LNG prices, India\u2019s gas demand has improved sequentially in 2QFY27, with demand in July-August 2026 declining only 2% year-on-year. Consequently, GAIL\u2019s gas transmission volumes are expected to improve quarter-on-quarter and could exceed the company\u2019s FY27 guidance of 123 mmscmd.\n\nWhile gas marketing profitability is likely to moderate sequentially as formula-based trailing averages normalize, the FY27 guidance of \u20b9 40-45 billion could still see a significant beat, supported by stable Henry Hub settlement prices and continued strength in crude oil and spot LNG prices.\n\n\u201cWe build in Brent at $85/bbl, though the 1HFY27 average is likely to be $100/bbl; hence there is a potential upside to our estimates,\u201d the firm said.\n\nIt further added that the petrochemical segment is also expected to deliver improved EBITDA sequentially, with plant utilisation likely to remain close to full capacity.\n\n\u201cWe slightly raise FY27-29E EPS by 2-3% each, updating the FY26 annual report data, and rollover to Sep-28E earnings. GAIL Gas\u2019s IPO RFP has already been released and a potential listing next year can lead to value unlocking of its wide CGD interest. We conservatively value unlisted investments at 1x PBV,\u201d it said.\n\nGAIL\u2019s medium-term outlook is stable, as gas transmission volumes will continue growing structurally, with increasing share of volumes in higher-tariff bid pipelines, the firm said.\n\nGAIL\u2019s upcoming petrochemical projects could emerge as an additional growth driver. The Mangalore PTA and Usar PDH-PP projects are expected to be commissioned over the next 1\u20131.5 years.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 01:11 PM IST", "pub_date_relative": "30m ago"}, {"title": "South Africa vs Australia Live Streaming: When And Where To Watch SA vs AUS 2nd ODI", "full_content": "Australia won the toss and chose to field in the second ODI against South Africa at Wanderers Stadium, Johannesburg", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 01:08 PM IST", "pub_date_relative": "33m ago"}, {"title": "Eva Live CEO David Boulette buys $37,510 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 01:00 PM IST", "pub_date_relative": "41m ago"}, {"title": "No Economy Is An Island | The Week In Whys", "full_content": "I have observed that even though countries celebrate self-reliance in their internal politics, they are keen to strengthen partnerships with other countries (sometimes desperately).", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 01:00 PM IST", "pub_date_relative": "41m ago"}, {"title": "Horizon Kinetics Asset Management, RENN Fund 10% owner, buys $2,305", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:45 PM IST", "pub_date_relative": "56m ago"}, {"title": "OpenAI, Anthropic CEOs called to appear at Australian AI probe", "full_content": "The CEOs of OpenAI and Anthropic have been called to appear at an Australian Senate inquiry on AI, the head of the probe said on Sunday, days after the revelation that a rogue OpenAI bot had hacked the country's health-system database.\n\nThe Medicare breach, condemned by Prime Minister Anthony Albanese, is one of the highest-profile incidents of AI agents accessing external systems outside the U.S.\n\nOpenAI's Sam Altman and Anthropic's Dario Amodei have been sent written requests to appear at the inquiry, which is to hold public hearings in the capital Canberra on Thursday, said a spokesperson for Senator Sarah Hanson-Young of the Australian Greens party, who chairs the probe.\n\nOpenAI and Anthropic did not immediately respond to requests for comment outside business hours.\n\nThe OpenAI agent's incursion on one of the country's most used government agencies may prompt Albanese's Labor government to toughen AI-specific laws it is readying for next year, adding pressure to Australia-US relations already tested by Canberra's ban on social media for teens, tech policy experts say.\n\nThe Senate inquiry is examining the potential impacts of AI and data centers on Australian communities, industries, water and energy. It is one of several state and federal probes into AI.\n\n\"There are serious questions for Sam Altman to answer about the OpenAI hack of Australian government websites,\" Hanson-Young said in a statement. Altman and Amodei \"must front up, face the Senate's questions and have an honest conversation about what effective, lasting regulation of this industry should look like\", she said.\n\nAlbanese, who revealed the June breach of Medicare on Thursday, called it \"unacceptable\", saying he had voiced \"extreme concern\" to Altman.", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 12:43 PM IST", "pub_date_relative": "58m ago"}, {"title": "'Chips To Ships \u2014 India Must Be Self-Reliant In Defence': Rajnath Singh At NDTV Summit", "full_content": "Rajnath Singh called for defence self-reliance \u201cfrom chips to ships\u201d, stressing indigenous technology, AI, drones, cyber and space capabilities to strengthen India\u2019s strategic autonomy and prepare for future warfare.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 12:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "Heart of the Beast Box Office Day 2: Brad Pitt Starrer Sees Strong Growth In India, Crosses $7.8M Worldwide", "full_content": "Brad Pitt's survival drama 'Heart of the Beast' has grossed $7.81 million worldwide and Rs 2.05 crore net in India after two days in theatres.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 12:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk| How to find India\u2019s next multibagge , 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nwpx director Keith Larson sells $102,310 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "9 midcap stocks with over 50% YoY sales growth", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News 9 midcap stocks with over 50% YoY sales growth Written by Ritesh Presswala , ETMarkets.com | Sep 27, 2026, 12:34:09 PM IST 1 / 10 Stock Watch A significant rise in quarterly sales on a year-over-year (YoY) basis indicates growth in a company\u2019s revenue during the period. Among the NSE Midcap segment, excluding banking and financial stocks, nine companies recorded sales growth of more than 50% in the June 2026 quarter compared with the same period in 2025, according to turnover scan data from StockEdge.com.\n\nJune 2026 quarter sales rose 209% YoY to Rs 7,354 crore, compared with Rs 2,384 crore in the same quarter last year.\n\nJune 2026 quarter sales increased 131% YoY to Rs 572 crore, from Rs 248 crore in June 2025.\n\nJune 2026 quarter sales grew 111% YoY to Rs 3,820 crore, compared with Rs 1,813 crore a year earlier.\n\nJune 2026 quarter sales climbed 81% YoY to Rs 937 crore, up from Rs 516 crore in June 2025.\n\nJune 2026 quarter sales increased 79% YoY to Rs 7,932 crore, compared with Rs 4,426 crore in June 2025.\n\nJune 2026 quarter sales rose 78% YoY to Rs 2,684 crore, from Rs 1,507 crore in the year-ago quarter.\n\nJune 2026 quarter sales grew 69% YoY to Rs 3,125 crore, compared with Rs 1,852 crore in June 2025.", "source": "Economic Times Markets", "pub_date_str": "27 Sep 2026, 12:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Boeing Identifies 737 Max Software Glitch That May Prompt Delays", "full_content": "\"Last month, we informed all 737 operators about a software issue where pilots may not have access to automated flight guidance during a specific landing scenario,\" Boeing said in a statement.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 12:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "26% returns in 6 months, SAIL stock final dividend 2026 record date next week; check amount per share, payment date", "full_content": "SAIL dividend 2026 : Maharatna PSU Steel Authority of India (SAIL) is set to turn ex-dividend next week, with Wednesday, 30 September 2026 fixed as the record date for its final dividend.\n\nThe company had announced a final dividend of \u20b9 2.35 per share, with a face value of \u20b9 10 at its Annual General Meeting in in May 2026.\n\nDuring its 54th Annual General Meeting (AGM) meeting, SAIL informed the exchanges, \"In continuation of the intimation mentioned above and Pursuant to Regulation 42 of SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015, it is hereby informed that the record date for determining the eligibility of the shareholders to receive the Final Dividend for the Financial Year 2025-26 has been fixed as Wednesday, 30\"' September, 2026. The Final dividend for FY 2025-26 as recommended by the Board, if approved by the Shareholders in the ensuing Annual General Meeting (AGM) shall be paid (subject to TDS) within 30 days from the date of approval by the shareholders.\"\n\nThe Board of Directors, at its meeting held on 15 May 2026, recommended a final dividend of \u20b9 2.35 per equity share of \u20b9 10 each for the financial year 2025\u201326. The dividend represents 23.50% of the company\u2019s paid-up equity share capital.\n\nSAIL final dividend offers an estimated dividend yield of 1.27%, calculated using its final dividend of \u20b9 2.35 per share and the prevailing market price of \u20b9 184.85.\n\nSAIL is set to mark the sixth consecutive year of dividend payouts to its shareholders. In 2025, the company declared a final dividend of \u20b9 1.60 per share, with 9 September 2025 fixed as the record date. In 2024, SAIL\u2019s shares traded ex-dividend on 19 September to determine the shareholders eligible for the Re 1 final dividend. The final payout followed an interim dividend of Re 1 per share, for which the stock had traded ex-dividend on 20 February 2024.\n\nThe Maharatna PSU declared dividends on two occasions in 2023.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 12:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Horizon Kinetics Asset Management buys $361 of Texas Pacific Land stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:16 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Cochin Shipyard, Voltas, BEL, Tata Steel, Axis Bank, Vedanta Aluminium: Top stocks to buy | Target, SL by Ganesh Dongre", "full_content": "Stock recommendations by Ganesh Dongre of Anand Rathi: The key benchmark indices of the Indian stock market ended the week on a negative note, with the Nifty 50 declining nearly 0.88% to close at 23,140, while the Bank Nifty declined 1.38% to close at 55,580. Sectoral performance remained relatively mixed, although Realty, Metals and Chemicals outperformed during the week, gaining around 1\u20132%.\n\nFrom a macro perspective, geopolitical uncertainties remain elevated, particularly around the US\u2013Iran tensions and broader developments in the Middle East. Movements in crude oil prices and global market cues are likely to remain important factors for the domestic market in the coming week. Brent crude continues to sustain above the $100 per barrel mark, raising concerns over inflationary pressures and global risk sentiment.\n\nFrom a technical perspective, the Nifty 50 index has entered an oversold zone following the recent sharp decline, amid concerns about the US Federal Reserve's interest-rate outlook. The possibility of another rate increase in the coming quarters remains a key concern for global markets, while the US 10-year Treasury yield, maintaining an upward bias, could continue to influence risk appetite.\n\nGanesh Dongre, Assistant Vice President \u2014 Equity Research at Anand Rathi, believes that profit booking at higher levels remains a possibility, and the Nifty 50 index could therefore witness a period of sideways consolidation during the upcoming monthly expiry week.\n\nSpeaking on the outlook for the Nifty 50 index, Ganesh Dongre of Anand Rathi said, \u201cThe Nifty 50 index continues to face difficulty sustaining above the 23,500\u201323,600 resistance zone, which remains an important technical barrier.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 01:11 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gas PSU stock to buy: After 26% returns in 6 months, Emkay Global sees further 16% upside | Target, stop-loss, rationale", "full_content": "Gas PSU stock to buy : Brokerage firm Emkay Global has upgraded gas PSU stock GAIL (India) to \u2018buy\u2019 from \u2018add\u2019, on the back of a steady core business and earnings outlook along with attractive valuations. The brokerage firm has given the target price of \u20b9 200, seeing an upside potential up to 15.6%.\n\nAccording to the firm, despite the Strait of Hormuz crisis and elevated LNG prices, India\u2019s gas demand has improved sequentially in 2QFY27, with demand in July-August 2026 declining only 2% year-on-year. Consequently, GAIL\u2019s gas transmission volumes are expected to improve quarter-on-quarter and could exceed the company\u2019s FY27 guidance of 123 mmscmd.\n\nWhile gas marketing profitability is likely to moderate sequentially as formula-based trailing averages normalize, the FY27 guidance of \u20b9 40-45 billion could still see a significant beat, supported by stable Henry Hub settlement prices and continued strength in crude oil and spot LNG prices.\n\n\u201cWe build in Brent at $85/bbl, though the 1HFY27 average is likely to be $100/bbl; hence there is a potential upside to our estimates,\u201d the firm said.\n\nIt further added that the petrochemical segment is also expected to deliver improved EBITDA sequentially, with plant utilisation likely to remain close to full capacity.\n\n\u201cWe slightly raise FY27-29E EPS by 2-3% each, updating the FY26 annual report data, and rollover to Sep-28E earnings. GAIL Gas\u2019s IPO RFP has already been released and a potential listing next year can lead to value unlocking of its wide CGD interest. We conservatively value unlisted investments at 1x PBV,\u201d it said.\n\nGAIL\u2019s medium-term outlook is stable, as gas transmission volumes will continue growing structurally, with increasing share of volumes in higher-tariff bid pipelines, the firm said.\n\nGAIL\u2019s upcoming petrochemical projects could emerge as an additional growth driver. The Mangalore PTA and Usar PDH-PP projects are expected to be commissioned over the next 1\u20131.5 years.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 01:11 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "OpenAI, Anthropic CEOs called to appear at Australian AI probe", "full_content": "The CEOs of OpenAI and Anthropic have been called to appear at an Australian Senate inquiry on AI, the head of the probe said on Sunday, days after the revelation that a rogue OpenAI bot had hacked the country's health-system database.\n\nThe Medicare breach, condemned by Prime Minister Anthony Albanese, is one of the highest-profile incidents of AI agents accessing external systems outside the U.S.\n\nOpenAI's Sam Altman and Anthropic's Dario Amodei have been sent written requests to appear at the inquiry, which is to hold public hearings in the capital Canberra on Thursday, said a spokesperson for Senator Sarah Hanson-Young of the Australian Greens party, who chairs the probe.\n\nOpenAI and Anthropic did not immediately respond to requests for comment outside business hours.\n\nThe OpenAI agent's incursion on one of the country's most used government agencies may prompt Albanese's Labor government to toughen AI-specific laws it is readying for next year, adding pressure to Australia-US relations already tested by Canberra's ban on social media for teens, tech policy experts say.\n\nThe Senate inquiry is examining the potential impacts of AI and data centers on Australian communities, industries, water and energy. It is one of several state and federal probes into AI.\n\n\"There are serious questions for Sam Altman to answer about the OpenAI hack of Australian government websites,\" Hanson-Young said in a statement. Altman and Amodei \"must front up, face the Senate's questions and have an honest conversation about what effective, lasting regulation of this industry should look like\", she said.\n\nAlbanese, who revealed the June breach of Medicare on Thursday, called it \"unacceptable\", saying he had voiced \"extreme concern\" to Altman.", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 12:43 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "ETMarkets Smart Talk| How to find India\u2019s next multibaggers? Pritam Deuskar explains his GIANTS framework", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a _relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "26% returns in 6 months, SAIL stock final dividend 2026 record date next week; check amount per share, payment date", "full_content": "SAIL dividend 2026 : Maharatna PSU Steel Authority of India (SAIL) is set to turn ex-dividend next week, with Wednesday, 30 September 2026 fixed as the record date for its final dividend.\n\nThe company had announced a final dividend of \u20b9 2.35 per share, with a face value of \u20b9 10 at its Annual General Meeting in in May 2026.\n\nDuring its 54th Annual General Meeting (AGM) meeting, SAIL informed the exchanges, \"In continuation of the intimation mentioned above and Pursuant to Regulation 42 of SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015, it is hereby informed that the record date for determining the eligibility of the shareholders to receive the Final Dividend for the Financial Year 2025-26 has been fixed as Wednesday, 30\"' September, 2026. The Final dividend for FY 2025-26 as recommended by the Board, if approved by the Shareholders in the ensuing Annual General Meeting (AGM) shall be paid (subject to TDS) within 30 days from the date of approval by the shareholders.\"\n\nThe Board of Directors, at its meeting held on 15 May 2026, recommended a final dividend of \u20b9 2.35 per equity share of \u20b9 10 each for the financial year 2025\u201326. The dividend represents 23.50% of the company\u2019s paid-up equity share capital.\n\nSAIL final dividend offers an estimated dividend yield of 1.27%, calculated using its final dividend of \u20b9 2.35 per share and the prevailing market price of \u20b9 184.85.\n\nSAIL is set to mark the sixth consecutive year of dividend payouts to its shareholders. In 2025, the company declared a final dividend of \u20b9 1.60 per share, with 9 September 2025 fixed as the record date. In 2024, SAIL\u2019s shares traded ex-dividend on 19 September to determine the shareholders eligible for the Re 1 final dividend. The final payout followed an interim dividend of Re 1 per share, for which the stock had traded ex-dividend on 20 February 2024.\n\nThe Maharatna PSU declared dividends on two occasions in 2023.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 12:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "EPF withdrawal rules: What happens if you withdraw full amount due to unemployment and later get a new job", "full_content": "Losing a job and being unable to find another one, or staying out of the workforce due to other issues for a long period can put pressure on your savings, including the money accumulated in your Employees\u2019 Provident Fund (EPF) account.\n\nFor members facing an extended spell of unemployment, withdrawing the accumulated PF balance can seem like an option to manage expenses. Salaried individuals are allowed to make partial withdrawals, known as EPF advances, for certain purposes, with eligibility conditions.\n\nAfter leaving employment, an individual can apply to the Employees' Provident Fund Organisation (EPFO) for withdrawing their PF balance.\n\nUnder the EPF Scheme, 2026 , members can withdraw up to 75% of their PF balance immediately after losing a job. The remaining 25% stays locked in until the member completes 12 months of continuous unemployment. Only then does full withdrawal open up, which includes the employee share, employer share and accumulated interest.\n\nEarlier, full withdrawal was allowed after two months of unemployment. But that changed with the introduction of the new scheme in July this year.\n\nHowever, the 12-month waiting period will not apply to female members who have resigned from their job for getting married.\n\nIf an individual finds a job after making a full withdrawal under the prescribed conditions, the person will have to qualify again for membership of the fund, and they will be treated as a fresh member, according to information available on the official website of the retirement fund body.\n\nIn simple terms, getting employed again does not reverse the earlier EPF withdrawal. Instead, the new employer will generally create or link EPF contributions to the member\u2019s existing UAN , allowing fresh contributions to accumulate under the new employment.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 12:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "East German espionage raised GDP by 7.4% in late 1980s, study finds", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 12:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Will your insurance premium get cheaper? Here\u2019s what IRDAI\u2019s proposed reforms could change", "full_content": "Insurance premiums could come under pressure if the Insurance Regulatory and Development Authority of India\u2019s (IRDAI) proposed reforms reduce distribution and operating costs, but the regulator has not said that premiums will automatically become cheaper. The consultation paper proposes changes to insurers\u2019 Expenses of Management (EoM), commission structures, sales incentives and disclosures, with the broader objective of reducing structural costs and improving value for policyholders.\n\nThe impact on premiums will depend on how insurers respond to lower costs. An industry expert, who did not wish to be named, said it would be too early to conclude that premiums will necessarily become cheaper. For term plans, mortality is a much larger pricing driver than distribution costs, while pricing is also periodically recalibrated based on experience and other underlying factors.\n\nAmit Goel, Director, Equirus Raghnall Insurance Broking, said the proposed reforms could potentially put downward pressure on premiums if lower distribution costs are passed on by insurers. However, he said insurance premiums are also driven by claims experience, reinsurance costs, risk appetite, capital costs and competition. \u201cA reduction in commission does not mechanically mean a reduction in premium,\u201d he said.\n\nIRDAI has proposed lowering Expenses of Management limits through a phased glide path. For life insurers, the proposal is to move towards a 12.5% of gross direct premium income (GDPI) company-level EoM cap. For general insurers, the proposal is to move from 30% of gross written premium to 20% of GDPI over five years. The regulator has also proposed changes to the way EoM is calculated to prevent workarounds.\n\nFor consumers, the proposal matters because IRDAI says reducing the cost of doing business should improve value for policyholders.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 12:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Will Nifty, Sensex tumble on Monday? 5 factors which will drive D-Street action this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Will Nifty, Sensex tumble on Monday? 5 factors which will drive D-Street action this week LKP Securities Share Price AK Capital Services Share Price Master Trust     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
