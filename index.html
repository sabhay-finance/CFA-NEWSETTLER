orised financial transactions as agents operate autonomously.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US 30-Year Treasury Yields Spike To 5.6%, Highest Since 2002", "full_content": "The 30-year yield rose above 5.61% amid intensifying selloff across global debt markets.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 11:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Jamie Dimon has a plan to revive the West: A 'big, beautiful' deal with Europe", "full_content": "JPMorgan Chase boss Jamie Dimon is pitching his vision for the Western world's future \u2014 and it hinges on Europe rebooting its sluggish economy and strengthening its defense capabilities.\n\n\"I believe the U.S. should offer Europe a major inducement: If it executes meaningful economic and military reforms, including everything that we consider crucial for security and resiliency, the U.S. will negotiate one big, beautiful economic and free-trade agreement with Europe,\" Dimon wrote in an opinion piece in The Wall Street Journal published Monday .\n\n\"Many of the current disputes between Europe and the U.S. are minor compared with this agreement's size and benefits. This pact could be extended to friendly democracies including Canada, Mexico, Japan, South Korea, Australia and the Philippines,\" Dimon said.\n\nSeamless trade ties would be a \"game changer\" for the U.S. and its allies, allowing them to \"set the global rules on trade\" and binding them together \"in the face of autocratic pressure,\" he added.\n\nThe free trade approach advocated by Dimon stands in contrast to the more protectionist policies currently pursued by the Trump administration.\n\nWashington's relationship with some of its biggest trade partners, including the European Union and Canada , have soured amid President Donald Trump 's rollout of tariffs and combative negotiating tactics.\n\nDimon's Journal op-ed singled out the European Union's need to complete its long-awaited Capital Markets Union and Banking Union in order to boost its competitiveness; fulfilling the recommendations of the Draghi report ; and ensuring the bloc's defense, manufacturing and energy independence.\n\n\"A Europe that can mobilize capital, scale innovative companies, consolidate defense production, reduce strategic dependencies and generate stronger growth would be a more capable security partner, a more resilient economic partner and a stronger counterweight to Beijing's economic power,\" he said.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 11:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty 50 down 13.5% in 2026, set for worst year in 15 years: Key factors weighing on market sentiment", "full_content": "The year 2026 is shaping up to be the worst for domestic equities in more than a decade, as a combination of weak global and domestic factors has added persistent downward pressure on Dalal Street, pushing the market into double-digit losses.\n\nBulls had hoped that this year could be another record-breaking year for equities, as recent economic reforms and higher capex spending could fuel the rally. However, those expectations soon faded after the US launched attacks on Iran in February, which completely changed the domestic equity backdrop for the worse.\n\nDomestic conditions were also challenging for bulls, as a falling rupee, limited exposure to AI, weakening agricultural conditions, and sustained selling by overseas investors have put the Nifty 50 on track for its first annual decline in a decade.\n\nIn the current year, the index has crashed 13.5% so far, positioning it for its biggest annual decline since 2011, when it plunged 24.62%. Major contributors to the index's decline were tech stocks, including Infosys, Wipro, and TCS. They were followed by Reliance Industries and ITC.\n\nOver the last two decades, the index has logged double-digit losses only twice. From 2016 to 2025, the markets enjoyed an uninterrupted bull run, closing each of those years in the green.\n\nIf not for the ongoing support from domestic mutual funds, largely backed by retail investors, the losses could have been even steeper.", "source": "LiveMint Markets", "pub_date_str": "29 Sep 2026, 11:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NPS Vatsalya: Who can make gift contributions to a child's account? Explained", "full_content": "The National Pension Scheme's spin-off for children, known as the NPS Vatsalya Scheme, allows parents to open and operate an account for their minor child, till such time that the sole beneficiary attains majority at 18 years of age.\n\nLaunched in September 2024, it is regulated and administered by the Pension Fund Regulatory Authority of India ( PFRDA ) and allows parents to secure their child's financial future.\n\n\u2013 Contributions under the scheme can be made by the guardian or the subscriber through various modes of contribution as stipulated by PFRDA from time to time.\n\n\u2013 The minimum contribution for account opening and annual contribution shall be \u20b9 1,000. However, as the objective of the scheme is to obtain a compounding effect for the long-term savings, it is advisable to contribute as much as possible, depending on the capacity to pay or contribute.\n\n\u2013 The parent or guardian needs to exercise the following choices at the time of opening of the account:\n\nAccording to an NPS circular, in addition to the child's parents or guardians, their relatives and friends may also make \u201cgift contributions\u201d to a subscriber by remitting the contributions to the NPS Vatsalya account.\n\nParents, guardians, relatives and friends may contribute through any of the following modes:\n\nDisclaimer: This story is for educational purposes only. We advise investors to check with certified experts before making any investment decisions.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 11:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Corporate Issuers", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "El Pollo Loco to open first New York restaurant as it aims to become national chicken chain", "full_content": "El Pollo Loco will open its first New York City restaurant next year as the California chain looks to become a national player.\n\nEl Pollo Loco has closed three development agreements for a total of 15 restaurants in the New York area over the next five years, the company announced on Tuesday. The first location will open in Queens in mid-2027.\n\nFounded in Mexico in 1975, El Pollo Loco opened its first U.S. restaurant in Los Angeles. The majority of its locations are still concentrated in California, but its footprint has grown to more than 500 restaurants across 10 states. It is best known for its bone-in grilled chicken, although its menu has grown.\n\nCEO Liz Williams wants to make El Pollo Loco into a national chain. To expand outside its Southwestern stronghold, El Pollo Loco will open restaurants on the East Coast and then move its way back to the West, she said.\n\nTo succeed in new markets, the chain will have to build its brand awareness in a crowded space where consumers are watching their budgets.\n\n\"Being a 50-year-old brand, people have seen it over the years and have always had that curiosity, but we have our work cut out,\" Williams said.\n\nUnder Williams' leadership, El Pollo Loco has embarked on a turnaround focused on modernizing its restaurants and expanding its menu into more convenient options, like wraps and chicken tenders. The efforts have started to pay off for the chain, which has reported three straight quarters of same-store sales growth.\n\n\"In the current quarter, we've expanded margins, and the business model is healthy overall,\" Williams said. \"The brand has gotten even stronger and healthier.\"", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 10:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "US 30-year Treasury yield hits highest since 2002", "full_content": "Government debt extends decline as inflation and surging oil prices weigh on market", "source": "FT Markets", "pub_date_str": "29 Sep 2026, 10:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trade Setup For Sept 30: Nifty Support Slips To 22,600 As Weakness Persists", "full_content": "However, a decisive break below 22,600 could intensify selling pressure. Chouhan expects the index to potentially slip towards 22,50022,400 if the support gives way.", "source": "NDTV Profit", "pub_date_str": "29 Sep 2026, 10:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NPS for small traders: Is \u20b93,000 monthly pension after 60 enough for retirement? Experts highlight harsh reality", "full_content": "Under the National Pension Scheme ( NPS ) for Traders, shopkeepers, retail traders, and self-employed people get an assured pension of \u20b9 3,000 a month after attaining 60 years.\n\nThis voluntary scheme covers Vyaparis such as shop owners, retail traders, rice and oil mill owners, workshop owners, commission agents, real estate brokers, and owners of small hotels and restaurants, among others, with an annual turnover of up to \u20b9 1.5 crore.\n\nIf the beneficiary dies, the spouse is entitled to 50% of the pension as family pension. But is \u20b9 3,000 a month enough for retirement , and can traders depend on this scheme alone? Here\u2019s what experts have to say.\n\nNo. The pension is inadequate on its own because it is a fixed amount with no inflation adjustment, said Vijay Kuppa, CEO, InCred Money.\n\n\u201cIt barely covers groceries, utilities, rent, healthcare and emergencies that a retirement income should cover,\u201d he added.\n\nManish P. Hingar, Founder and Chief Executive Officer of Fintoo, said this NPS scheme should be viewed as a small base for retirement planning. The \u20b9 3,000 pension does not increase with inflation. At 6% inflation, \u20b9 3,000 received 25 years from now would be worth only about \u20b9 700 in today's money.\n\nThere is also no lump-sum payout at 60. If the member dies, the spouse receives 50% of the pension, or \u20b9 1,500 a month. Children are not covered in this scheme, Hingar said.\n\nThis NPS scheme can be considered by people with irregular incomes or those who struggle to save regularly. It is aimed at small traders and self-employed people in the unorganised sector who are not income-tax assessees, Kuppa mentioned.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 10:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "White House looking to Europe to release diesel from strategic reserves - Politico", "full_content": "White House looking to Europe to release diesel from strategic reserves Politico These Republicans Have Called on Trump to Ban U.S. Diesel Exports The New York Times President Donald Trump Has Floated the Idea of a Partial or Full Ban on Diesel Exports, but the Unintended Consequences of Such Actions Would Be Catastrophic Yahoo Finance Trump \u2018very seriously\u2019 considering diesel export ban as global supply crunch worsens CNBC Diesel export ban: will Trump push global energy prices even higher? - The Latest The Guardian", "source": "Google News Business", "pub_date_str": "29 Sep 2026, 10:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Paid off your personal loan? Why your credit score might not jump right away", "full_content": "Clearing the final Equated Monthly Instalment (EMI) on a personal loan marks an important financial milestone, but borrowers should not expect their CIBIL Score to increase immediately after the loan is fully repaid.\n\nA closed loan continues to appear on your credit report because it forms part of your credit history and records your past repayment behaviour. In some cases, closing an active instalment loan may even result in a small, temporary decline in the score, particularly for borrowers with a limited credit history or fewer active credit accounts. This can happen because closing the loan changes the overall composition of the borrower's credit profile .\n\nLoan closure is not just about making the final payment. Borrowers should also complete the necessary documentation and ensure that the lender updates the account correctly.\n\nAfter repaying the loan, obtain and preserve the loan closure letter or No Dues Certificate issued by the lender. It is also advisable to check the credit report after allowing sufficient time for the lender to report the closure.\n\nCIBIL says lenders generally provide account information within 30\u201345 days. Therefore, checking the report immediately after making the final EMI payment may still show the previous outstanding balance or an active account status.\n\nIf the loan continues to appear as active, shows an incorrect outstanding balance or is incorrectly reported as \u201csettled\u201d despite the borrower making full repayment, the borrower should first approach the lender for correction.\n\nIf the issue remains unresolved, a dispute can be raised with CIBIL. However, the credit bureau cannot independently alter information reported by a lender without confirmation from the concerned financial institution.\n\nThe status assigned to a loan account can have important implications for how lenders view a borrower's credit profile.", "source": "LiveMint Money", "pub_date_str": "29 Sep 2026, 10:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "New AI-powered government website uses Gemini, Grok, Trump official Gebbia says", "full_content": "The Trump administration's new chatbot aimed at helping Americans navigate official government websites is powered by artificial intelligence from Google 's Gemini and Elon Musk 's Grok, U.S. Chief Design Officer Joe Gebbia said Tuesday.\n\n\"We have great partners behind the scenes,\" Gebbia told CNBC's \" Squawk Box \" shortly before the site, America.gov , went live around 10 a.m. ET.\n\nA Google spokesperson referred CNBC to a company blog post published Tuesday morning, which said, \"Google is proud to be named a technology partner in this vital initiative, leveraging Gemini to help more than 100 million people access critical public resources with greater speed and ease.\"\n\n\"By supporting the administration's vision for digital modernization, we are committed to making these everyday public services seamless, accessible, and responsive for all Americans,\" the post read.\n\nGrok developer xAI, which was acquired by SpaceX and renamed SpaceXAI, did not respond to CNBC's request for comment. Gebbia sits on the board of directors of Tesla, which is led by Musk, owns a piece of SpaceXAI and uses Grok in its vehicles.\n\n\"Every day, 40 million people interact with a government website trying to get something done. And I think we could all agree that we wish it was better,\" Gebbia told CNBC.\n\nThe AI tool interacts with all of the roughly 29,000 government websites to respond to user questions with up-to-date information, Gebbia said.\n\n\"You come to America.gov and you ask for what you need, and in a chat interface, we go off on the back end and scan across all those tens of thousands of websites to pull in any information that is specific to whatever your request is, and give you a personalized response that's only from official sources,\" he said. \"So there's no chance of getting outdated or inaccurate information like you might on third-party websites.\"", "source": "CNBC World Economy", "pub_date_str": "29 Sep 2026, 10:25 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Consumer optimism slides to lowest since 2014 as fears escalate over rising prices and jobs", "full_content": "Consumer sentiment fell to its lowest level since 2014 in September as an inflation-weary public took a dimmer view on the labor market and the impact higher prices would have on their finances, the Conference Board reported Tuesday.\n\nThe board's Consumer Confidence Index tumbled to 81.9, a decline of 6.7 points and a reading well below the Dow Jones consensus forecast for 89.\n\nRespondents cited concerns over inflation and the jobs outlook. For the first time in the four-year history of the survey question, more respondents said their personal finances were bad as opposed to good.\n\n\"Consumer appraisals of current business conditions became negative for the first time since September 2024,\" said Dana Peterson, the Conference Board's chief economist.\n\n\"Consumers' write-in responses regarding factors affecting the economy were mostly pessimistic in September,\" she added. \"References to prices, the high cost of goods and services, and oil and gas prices in particular, rose to new heights, reflecting September's surge in fuel costs.\"\n\nOther readings showed similar deterioration: The board's Present Situation Index fell 7.9 points to 109.3, while the Expectations Index, a six-month outlook window, slipped 5.9 points to 63.6.\n\nOn the labor front, the differential between those saying jobs are \"plentiful\" against \"hard to get,\" a closely watched barometer of labor market health, eroded further, down 2.5 percentage points to just 1.7%.\n\nThose results came against rising inflation expectations, pushed by continued uncertainty over the Iran war, which has been reflected in financial markets by surging Treasury yields and mortgage rates.", "source": "CNBC Top News", "pub_date_str": "29 Sep 2026, 10:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Treasury Will Auto-Enroll 60 Million Children in Trump Accounts - WSJ", "full_content": "Treasury Will Auto-Enroll 60 Million Children in Trump Accounts WSJ Trump Accounts will auto-enroll children, potentially adding 60 million accounts: Treasury CNBC Technical Analysis of Treasury Decision 10056 and Proposed Regulations CC-00226466-26: The New Regulatory Framework for Trump Accounts Current Federal Tax Developments How New IRS Guidance May Affect Real Estate Benefit     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
