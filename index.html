    const allData = {"general": [{"title": "Rahul Gandhi's November 1 Rally: Delhi Traders Fear Rs 10,000 Crore Business Impact", "full_content": "Trade bodies cite losses from earlier protests and road closures, warning that fresh traffic diversions could affect markets near Ramlila Maidan.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:55 PM IST", "pub_date_relative": "19m ago"}, {"title": "Walmart, Best Buy and other stores now use digital price tags. Critics say they could lead to different prices for different shoppers.", "full_content": "Store aisles are getting a digital makeover.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 09:48 PM IST", "pub_date_relative": "26m ago"}, {"title": "413% returns in 1 year: Gold jewellery stock offers bonus shares - Do you own? Check Ratio, record date", "full_content": "Shares of Utssav CZ Gold Jewels Limited will remain in focus next week as the SME jewellery stock announced issuance of bonus shares in the ratio of 1:1. The SME jewellery stock has delivered close to 55% return in one month, and 354% return in 2026 so far.\n\nThe company\u2019s board of directors, on Friday, approved the proposal of issuance of bonus issue in the ratio of 1:1.\n\n\u201cAt its meeting on October 23, the company\u2019s board of directors approved the proposed issuance of one bonus share of face value Rs. 10 for every existing share held by eligible shareholders. The record date for determining eligibility for the bonus shares will be announced after the requisite approvals are obtained,\u201d stated the company in its BSE filing released on Friday.\n\nThe proposed bonus shares corporate action will lead to the issuance of 2,49,98,000 bonus shares of Rs. 10 each. If the corporate action will be approved, the company\u2019s total paid-up equity share capital will increase from \u20b9 24.998 crore to \u20b9 49.996 crore, with the number of shares rising from 2,49,98,000 to 4,99,96,000.\n\nThe board will fix and announce the record date in the coming days. There is no clear information about the record date so far.\n\nApart from bonus share, the board has also approved the proposal to increase the company's authorised share capital from \u20b9 24.998 crore to \u20b9 60 crore, divided into six crore shares of \u20b9 10 each. The increase in share capital is aimed to improve the proposed expansion of the paid-up share capital.\n\nThe stock closed marginally lower at \u20b9 1013 per share on NSE on Friday, October 23. Its share price value has surged 55.07% in one month, 354.46% year to date (YTD), and 412.91% in one year.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 09:47 PM IST", "pub_date_relative": "27m ago"}, {"title": "AI funding fears rattle Wall Street. Here's how we're adjusting our portfolio", "full_content": "The rotation out of AI stocks benefited several defensive Club stocks.", "source": "CNBC World Economy", "pub_date_str": "24 Oct 2026, 09:44 PM IST", "pub_date_relative": "30m ago"}, {"title": "Jamia Millia Islamia Tensions Rise As Student Protest Continues, Classes Go Online", "full_content": "Jamia students are demanding the restoration of the JMISU, disbanded in 2006, while the registrar and Congress MPs trade allegations over campus tensions.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:40 PM IST", "pub_date_relative": "34m ago"}, {"title": "Iran has ramped up efforts to target US personnel, intelligence memo warns", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 09:36 PM IST", "pub_date_relative": "38m ago"}, {"title": "ED Arrests Advocate At Mumbai Airport In Pan-india Cyber Fraud Case; Total Arrests Reach 7", "full_content": "A team from the Enforcement Directorate's (ED) Panaji unit intercepted Rashesh Upadhyay alias Rashesh Shah at a boarding gate inside the Chhatrapati Shivaji Maharaj International Airport when he was about to take a flight to Delhi.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:36 PM IST", "pub_date_relative": "38m ago"}, {"title": "Nilgiris Landslides: 1 Dead, Students Rescued As Heavy Rain Disrupts Ooty Travel", "full_content": "Heavy rain has also affected Kodaikanal, another popular hill station. The IMD has issued a red alert for Theni, Dindigul and Madurai districts for Sunday.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:36 PM IST", "pub_date_relative": "38m ago"}, {"title": "Retire on 8% a year with little or no risk? How to use annuities the right way.", "full_content": "Market turmoil has created a remarkable opportunity in recent weeks for retirees and those seeking secure, stable income for life.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 09:34 PM IST", "pub_date_relative": "40m ago"}, {"title": "My partner of 17 years left me his $1 million home. His children are crying foul. Am I obliged to split it with them?", "full_content": "\u201cI never paid rent, although I put about $45,000 toward a new kitchen and a roof.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 09:30 PM IST", "pub_date_relative": "44m ago"}, {"title": "Royal Carribean cruise to the Bahamas went to Canada instead - New York Post", "full_content": "Royal Carribean cruise to the Bahamas went to Canada instead New York Post Cruise passengers unexpectedly end up in Canada, even though their destination was the Bahamas WKYT Thousands packed for the Bahamas \u2026 but ended up in Canada. Now they\u2019re having a blast CTV News Royal Caribbean reroutes another warm-weather cruise to Canada after threatening weather system shifts Royal Caribbean Blog 'Is this a joke?': Cruise ship heading for the Bahamas rerouted to Nova Scotia instead National Post", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 09:23 PM IST", "pub_date_relative": "51m ago"}, {"title": "American Express Is Cutting 3,500 Jobs Globally; Here's Why", "full_content": "American Express will cut 3,500 jobs globally despite a 28% jump in quarterly profit, as it streamlines operations, boosts efficiency and prepares for wider AI adoption.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:22 PM IST", "pub_date_relative": "52m ago"}, {"title": "FDA Crackdown Continues: Mumbai's Ottoman Cafe, Bharat Canteen Among Seven Restaurants That Face Suspension", "full_content": "The licenses were suspended following serious hygiene failures such as unclean kitchens, mixed storage of veg/non-veg food, unauthorized colours, and a lack of worker medical certificates.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:20 PM IST", "pub_date_relative": "53m ago"}, {"title": "Reliance Jio IPO listing on Oct 28: Will Mukesh Ambani's firm be in top 5 m-cap? RIL to hold top spot", "full_content": "As Jio Platforms Initial Public Offering (IPO) closed with bumper subscription, investors are now eagerly awaiting the share allotment results ahead of its scheduled listing next week.\n\nBacked by Mukesh Ambani\u2019s Reliance Industries Limited (RIL), the IPO generated huge buzz during its subscription period. But where could the telecom giant be bound to stand post listing in terms of market capitalisation? Let\u2019s find out.\n\nBased on the IPO\u2019s upper price band and post-issue share count, Jio Platforms is estimated to hold post issue market capitalisation of \u20b9 10.30 lakh crore. With this, Jio can comfortably stand in the list of top five companies in terms of market capitalisation on BSE. Investors must note that market capitalisation of companies fluctuate, and Jio Platforms\u2019 actual ranking would depend on listing price and other stocks\u2019 price.\n\nAs per BSE data (as on October 23), Reliance Industries Limited (RIL) has a market capitalisation of \u20b9 16.10 lakh crore, Bharti Airtel has an Mcap of \u20b9 11.79 lakh crore, HDFC Bank has an Mcap of \u20b9 10.67 lakh crore, ICICI Bank\u2019s Mcap stood at \u20b9 10 lakh crore, TCS\u2019s MCap stood at \u20b9 9 lakh crore.\n\nPost Jio IPO listing, Reliance Industries Group will also become India\u2019s largest listed business group by aggregate listed MCap.\n\nJio IPO was subscribed 22.19 x on the final day of its subscription. The total subscription consisted of 70.55 times subscription in the qualified institutional buyers (QIB) category, 14x subscription in non institutional investors (NII) category, 2.72x subscription in the retail investors segment, 2.93 x bidding in employee reserved quota, and 7.60x subscription in the reservation portion shareholder.\n\nThe issue opened for subscription on Wednesday, October 21 and concluded on Friday, October 23. Its allotment is likely to be finalised on Monday, October 26. The issue is likely to be listed on NSE and BSE on October 28.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 09:19 PM IST", "pub_date_relative": "55m ago"}, {"title": "IRDAI extends window for feedback on proposed insurance distribution reforms \u2014 check new deadline", "full_content": "The Insurance Regulatory and Development Authority of India (IRDAI has extended the deadline for submitting feedback on its consultation paper on insurance distribution reforms to October 31, 2026.\n\nThe regulator had earlier set October 25, 2026, as the deadline for stakeholders to submit their comments on the proposed changes.\n\n\u201cThe consultation has received an encouraging response, with over 650 comments received so far. In view of the significant interest and to facilitate wider participation, the last date for submission of comments has been extended till 31st October 2026, providing additional time to stakeholders and members of the public to submit their feedback and suggestions,\u201d the official release read.\n\nThe Insurance Brokers Association of India ( IBAI ) had previously raised a request for an extension of the deadline until the end of December to submit its recommendations, citing the need of more time to examine the proposals.\n\nIRDAI released a two-part consultation paper on the proposed distribution reforms, titled \u2018Recalibrating Economics of Insurance Distribution\u2019 on September 23, inviting comments and suggestions from the public, policyholders, insurers, intermediaries and other stakeholders.\n\nThe insurance regulator's consultation paper outlines a series of reforms to streamline insurance distribution in India and improve how policies are sold to customers. The proposals also aim to simplify the distribution framework while bringing greater oversight to commissions and selling practices.\n\nKey proposals include tighter expenses of management (EoM) limits, a return to product-level commission caps, a ban on compulsory bundling of insurance with loans by banks and non-banking financial companies (NBFCs), and changes to motor insurance distribution. Expenses of management are the costs an insurance company incurs to run the business.\n\nThe draft reforms focus on areas where the regulator believes there are unnecessary distribution costs.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 09:18 PM IST", "pub_date_relative": "56m ago"}, {"title": "Volvo Plans 2,500 More Job Cuts After 3,000 Layoffs, Targets $500 Million Savings", "full_content": "Volvo Cars plans to eliminate another 2,500 jobs after cutting 3,000 roles earlier this year, as the Swedish automaker seeks $500 million in savings amid mounting pressure from Chinese rivals, weak demand and tariff-related headwinds.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:16 PM IST", "pub_date_relative": "58m ago"}, {"title": "American embassies tighten security as Iran threat warnings intensify ahead of U.S. midterm elections", "full_content": "U.S. embassy officials were on heightened alert around the Middle East as new reports said Iran is in the \"advanced stages\" of planning attacks against Americans Friday.\n\nA memo from Director of National Intelligence Jay Clayton said agencies received intelligence that Iran has \"substantially increased efforts to target U.S. personnel\" in the region, according to a New York Times report , and that the threats applied to \"certain other countries\" as well.\n\nThe warnings come after the U.S. ordered non-emergency government employees to leave Saudi Arabia this week, as attacks from the Iran-backed Houthis have worsened and the broader war between the U.S. and Tehran nears its eighth month.\n\nThe Saudi-led coalition fighting the Houthis said it destroyed two ballistic missiles fired by the group Saturday, aimed towards Taif and Yanbu.\n\nThe Trump administration has vowed to put off military strikes on Iran after the midterm elections on Nov. 3, as the fallout from the war in Iran has caused a major disruption in the U.S. economy \u2014 with inflation and affordability the top concerns for voters who will decide control of Congress early next month.\n\nRising Middle East tensions sent oil prices soaring this week. Benchmark Brent crude futures topped $116 a barrel, a six-month high . U.S. West Texas Intermediate rose 3.8% to settle over $103 a barrel.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 09:14 PM IST", "pub_date_relative": "59m ago"}, {"title": "Money-saving habits to cope with higher prices \u2014 from our readers", "full_content": "I asked people what they\u2019re doing to make life more affordable today. I\u2019ll definitely be trying some of these.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 08:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pfizer reports phase 2 data for 25-valent pneumococcal vaccine", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 08:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mumbai AQI Today: Smog Shrouds City, Suburbs Skyline As Residents Flag Poor Air Quality", "full_content": "According to data from the Central Pollution Control Board's Sameer app, Mumbai's average AQI stood at 121 on Saturday.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why popular airplanes are getting scrapped years early", "full_content": "GOODYEAR, Ariz. \u2014 An Airbus A320neo, one of the world's most popular planes, rolled off the Mobile, Alabama, factory line in July 2022, painted bright yellow for its next destination: Spirit Airlines.\n\nIt was built to fly for decades. But this May, less than four years later, it was stripped for parts worth millions and crushed, the steel teeth of an excavator tearing through its fuselage at a facility on the outskirts of Phoenix.\n\nMore aircraft are getting dismantled years, if not decades, earlier than expected, industry executives told CNBC. It is the result of a shortage of parts, none more precious and expensive than aircraft engines, that has exasperated airlines and driven up costs for years .\n\nEven after the engines are removed, firms are looking for parts as varied as landing gear and antennae to sell.\n\n\"It's the first time in my career that involved purchasing an aircraft that's less than five years since date of manufacture,\" said Bill Thompson, vice president who leads aircraft and engine acquisition for the Americas at aviation asset management and trading firm EirTrade Aviation, which bought the less than 4-year-old Airbus A320neo earlier this year.\n\nHe said the company paid \"single-digit\" millions each for that airplane and a similarly aged one, and it expects to make a profit from selling the more than 1,000 parts it took off them before they were crushed.\n\n\"I don't know if you're going to sell the coffee makers but you never know. Sometimes you do,\" he said.\n\nTwenty-one newest-generation aircraft were torn down from June 2025 through this past August, according to aviation data and advisory firm IBA Group. The scrapped planes were 6.4 years old on average, and included mostly Airbus but also some Boeing planes. That compares with an average retirement age for narrow-body airplanes of 21.7 years, IBA said.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 08:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Co-founder Alexis Ohanian Shares Story Behind Reddit's Name, Says Everyone Hated It", "full_content": "Reddit's official X account revived the wordplay behind its name with a joke about having \"already Reddit\". Co-founder Alexis Ohanian responded that the pun reflected the idea he had in mind when naming the platform in 2005.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "UPI Merchant Charges: Know Your Rights As A Consumer Before Heading For Diwali Shopping", "full_content": "UPI payments remain free for consumers, even as a new merchant discount rate (MDR) framework is expected to introduce charges on certain high-value transactions.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Is getting a wedding band from Quince a bad idea? It\u2019s a third of the price of a local jeweler.", "full_content": "\u201cI am slightly anxious about purchasing something so big\u201d from an online retailer known for cut-price duplicates of popular clothes and accessories.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 08:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "This US Startup Claims Its 'AI-Generated Viruses' Have Been Used On A Human Patient", "full_content": "The company called Radical Numerics has published details of the project on its website, revealing that they have trialed an AI-engineered viral treatment on a human subject.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "US Banks Blocking AI Agents' Access To Customer Accounts: Risks Of Letting AI Manage Your Finances", "full_content": "Many major banks in the United States are blocking third-party AI agents from operating inside customer accounts and making transactions.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ramayana Advance Booking: Ranbir Kapoor Starrer Crosses Rs 10 Crore Mark In India Ahead Of Release", "full_content": "Directed by Nitesh Tiwari, Ramayana is set to release in theatres on November 5, 2026.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "Retail investors are not more sophisticated than 30 years ago, says former hedge fund manager", "full_content": "Retail investors who are trying to beat the market by buying individual stocks and complex exchange-traded funds may be better off with broad market index funds, according to Elm Wealth's Victor Haghani.\n\n\"I'm not sure that investors are that much more sophisticated than they were 30 years ago,\" the firm's founder and chief investment officer told CNBC's \"ETF Edge\" this week. \"We still are human beings and we're subject to certain kinds of biases \u2014 particularly extrapolation bias where whatever has happened recently in the past we tend to believe that it's going to continue into the future.\"\n\nHaghani, who was a founding partner at hedge fund Long-Term Capital Management, emphasizes cost-effective investment strategies as a priority at his current firm.\n\n\"It's an environment that continues to be tough for individual non-professionals to generate alpha,\" he said. \"[Retail investors are] just very well served by having some exposure to broader index funds overall.\"\n\nAccording to Haghani, access to elaborate strategies doesn't necessarily provide advantages.\n\n\"Whether it's Citadel or Jane Street or Hudson River Trading, they're just minting money every single day. So, it's an opportunity-rich environment \u2014 if you happen to have a billion dollars to spend on tech each year,\" he said. \"If you're a retail investor sitting at home and trying to find opportunities, you have to realize that probably on the other side of your trades is [Citadel CEO] Ken Griffin or whoever, and it's probably not going to end all that well.\"\n\nHowever, RBC Capital Markets' Valerie Grimba sees sophisticated funds playing a strategic role in retail investors' portfolios.\n\n\"More choice is ultimately a good thing,\" the firm's director of global ETF strategy said in the same interview.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 08:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft Is Winding Down The Garage After 17 Years: What It Means For Employees", "full_content": "Microsoft says experimentation is becoming part of everyday work, while the future of its Global Hackathon and Garage locations remains unclear.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Maharashtra vs FSSAI: Why The State Has Moved Bombay HC Over Food Safety Rules", "full_content": "Maharashtra has challenged FSSAI rules in the Bombay High Court, alleging that the central regulator's enforcement framework curtails the state's authority to inspect food businesses.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "IDFC First Bank Q2 FY27 slides: profit crosses Rs. 1,000 Cr milestone", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 08:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "KBC 18: Ranbir Kapoor, Sai Pallavi And Ravi Dubey To Join Amitabh BachchanFor Diwali Special Episode", "full_content": "The actors will join Amitabh Bachchan on the quiz show to promote Ramayana, featuring Ranbir as Ram and Sai Pallavi as Sita.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "EPS-95 Pension: What The Bombay High Court Ruling Means For Private-Sector Employees", "full_content": "The Bombay High Court set aside the EPFO orders rejecting the employees' applications and directed the authorities to process and allow their joint options for a higher pension within eight weeks.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:13 PM IST", "pub_date_relative": "2h ago"}, {"title": "Big action! Who is Avadhut Sathe? Why SEBI ordered Avadhut Sathe Trading Academy to refund \u20b9546 cr - What he did?", "full_content": "The Securities and Exchange Board of India (SEBI) took action against Indian stock markets and options trader, Avadhut Sathe, and his trading academy, for running an unregistered investment advisory and research analyst business.\n\nThe markets regulator, on Friday, directed Avadhut Sathe Trading Academy Private Limited (ASTAPL) and its founder to refund \u20b9 546.17 crore collected from participants for providing unregistered investment advisory and research analyst services, along with interest of \u20b9 67.87 crore.\n\nAvadhut Sathe started trading and investment in 1991. As per his trading academy\u2019s official website, Sathe regularly conducts seminars in stock market trading since February 2008.\n\nHis academy branches are located in multiple cities including Mumbai, Delhi, Navi Mumbai, Pune Hyderabad, Indore, Nashik, etc . The ASTAPL academy runs multiple programmes linked to stock market investment and trading, including eye opener sessions, Geo Program, SMM, PAPA, etc.\n\nSEBI has imposed a total penalty of \u20b9 11.5 crore on the academy, Sathe and Gouri Avadhut Sathe for violations of securities market regulations. As per SEBI\u2019s 171-page final order, Sathe has been fined \u20b9 4 crore, while Gouri Avadhut Sathe has been penalised \u20b9 1.5 crore.\n\nSEBI has barred the academy and Avadhut Sathe from accessing the securities market for two years, or until they fulfil the direction to initiate all refunds.\n\nThe regulator found that the academy and Sathe provided investment advice and research recommendations through paid programmes, sessions and WhatsApp groups without obtaining the required registration.\n\nIt also found that misleading promotional representations about returns were used to attract participants and that investment advice was provided without assessing the suitability of recommendations for recipients.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 08:11 PM IST", "pub_date_relative": "2h ago"}, {"title": "Looking for AI stocks that are still cheap? Consider these two under-the-radar picks.", "full_content": "Simon King of Saturna Capital names two stocks tied to base metals, for investors who want to look beyond the beaten path for AI-related trades.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 08:10 PM IST", "pub_date_relative": "2h ago"}, {"title": "I quit my marketing job to walk dogs for 4 months: It's 'one of the most valuable professional experiences I've ever had'", "full_content": "One early morning in 2022, I found myself watching a dog walker on TikTok and thinking: I want her job.\n\nIt felt ridiculous. I was finishing up my MBA and navigating the next chapter of my career with a focus on prestige and financial success.\n\nBut soon after relocating from Kentucky to California in October 2021, I burned out. I had transitioned into a remote healthcare marketing role, living on the West Coast but still working East Coast hours and completing my second year of business school from afar. While everyone around me seemed to be heading to the beach and enjoying the sunshine, I spent my days inside, glued to a computer screen.\n\nThe dog walker I followed online seemed to have everything I was craving: fresh air, movement, flexibility and a job that didn't revolve around emails and Zoom meetings.\n\nDuring a long drive, I joked with my husband, \"I think I'm going to quit my job and walk dogs.\" The joke quickly became a plan.\n\nWithin the span of just a few weeks in the spring of 2022, I quit my job, graduated from business school, traveled to Europe for an old roommate's wedding and then flew to Texas to speak at the Latino Franchise Symposium . While I was there, I created my Rover profile. I highlighted my experience volunteering at animal shelters in college, pet sitting for friends and caring for animals throughout my life.\n\nBefore I even made it back home to California, I had my first meet-and-greet scheduled with a potential client. Shortly after, I landed my first booking. I was thrilled.\n\nAt first, I intentionally priced my services below what seemed typical in my area to build reviews, charging about $15 for a drop-in visit and about $17 for a 30-minute walk. Some days I had just one client. I was able to start small because I had savings to tide me over, along with a partner whose job provided steady income and benefits.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 08:06 PM IST", "pub_date_relative": "2h ago"}, {"title": "Uber Passenger Alleges 'Scam' After Driver Shows 'Fake Screenshot' Of Fare; Takes To Reddit", "full_content": "The Reddit user also questioned whether a spoofing app was involved, but the post did not establish how the disputed fare screenshot was generated.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:05 PM IST", "pub_date_relative": "2h ago"}, {"title": "Jailer 2 Box Office Collection Day 10: Rajinikanth Film Continues Strong Run", "full_content": "Directed by Nelson Dilipkumar, Jailer 2 is a Tamil action drama starring Rajinikanth as retired jailer Tiger Muthuvel Pandian.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:01 PM IST", "pub_date_relative": "2h ago"}, {"title": "Couche-Tard proposes up to $8 billion offer for Cumberland Farms, The Times reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 08:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Amgen says drug combo cuts risk of death by 58% in patients with aggressive lung cancer", "full_content": "A drug from Amgen could give patients with a notoriously aggressive form of lung cancer significantly more time to live when added to an immunotherapy from AstraZeneca , a study found.\n\nFull results from a late-stage trial released Saturday show that adding Amgen's immunotherapy Imdelltra to AstraZeneca's Imfinzi drug slashed the risk of death by 58% in patients with extensive-stage small cell lung cancer, a fast-growing disease that has spread beyond the lung where it began.\n\nThe drug combination extended their median overall survival to 21.1 months compared with 12.7 months with AstraZeneca's drug alone, the trial found.\n\nThat means half of patients in the group that took the combination regimen were alive for at least roughly 21 months. The trial tested the combo as a maintenance therapy in patients who received initial treatment with Imfinzi and chemotherapy, and whose cancer had not progressed.\n\n\"I think there are moments in medicine when you see a piece of data that is so profound that it's going to transform the standard of care for patients, and I think, honestly, we're at that moment,\" said Dr. Paul Burton, Amgen's chief medical officer, in an interview.\n\nThe combination \"has the potential to take on one of the most aggressive cancers that we deal with today, and almost convert it into a chronic disease,\" he said, adding that \"these data say that's a possibility.\"\n\nThe results also suggest a greater commercial opportunity for Imdelltra, which posted $288 million in sales during the second quarter, up 115% year over year. The drug already generated $627 million in global sales in 2025 and appears to be on its way to becoming a blockbuster medicine, or hitting the $1 billion sales threshold.\n\nSmall cell lung cancer remains difficult to treat because, even if chemotherapy initially works well for most patients, the disease often returns or progresses within months, said lead trial investigator Dr.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 08:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "'The transit world is where innovation goes to die' \u2014 The U.S. lags far behind on using driverless trains, but new projects could open the floodgates - Fortune", "full_content": "'The transit world is where innovation goes to die' \u2014 The U.S. lags far behind on using driverless trains, but new projects could open the floodgates Fortune See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 08:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Earnings call transcript: IDFC First Bank posts strong Q2 2026 profit growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 07:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Everyone\u2019s talking about Roth conversions, but here\u2019s how few people really do them \u2014 and why you shouldn\u2019t have FOMO about it", "full_content": "You have to do the math to figure out your best tax strategy in retirement, and converting might not be for you.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 07:54 PM IST", "pub_date_relative": "2h ago"}, {"title": "Fire devastates former Nazi guest house 'Eagle's Nest' in Germany", "full_content": "Firefighters battled for hours to contain a blaze that engulfed the former Nazi guest house known as \"The Eagle's Nest\" in southern Germany, while police investigated the cause after detaining a man near the scene, authorities said on Saturday.\n\nAround 200 firefighters and emergency workers near Berchtesgaden in Bavaria were battling the flames after the building, known as the Kehlsteinhaus, caught fire on Friday, police said.\n\nBuilt in 1938 as a guest house for Nazi officials and their guests, the building sits in a spectacular Alpine setting above Berchtesgaden. Adolf Hitler used it occasionally, earning it the nickname \"Hitler's Tea House.\" It is separate from his nearby summer residence, the Berghof.\n\nBild newspaper quoted a police spokesperson as saying the building, preserved after World War II as a historical monument linked to the Nazi era, had been so badly damaged that it \"could probably not be saved\".\n\nPolice said earlier they had detained a man near the site but had not yet established the cause of the fire.\n\n\"Whether the person is linked to the fire is currently the subject of a criminal investigation,\" Bavarian police said in a statement.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 07:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "Young Americans are giving up on car ownership. It\u2019s a path to financial freedom for some.", "full_content": "With vehicle prices soaring and ownership increasingly out of reach, some young adults are discovering that life without a car leaves them with breathing room to spend on other things.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 07:36 PM IST", "pub_date_relative": "2h ago"}, {"title": "New GST Rules 2026: From November 1, reforms to be rolled out in phases - What CBIC confirmed", "full_content": "Goods and Services Tax ( GST ) reforms designed to lighten the compliance load on businesses are set to begin in phases from November 1, 2026. Changes that need amendments to the GST laws are targeted for April 1, 2027, according to Sanjay Mangal, Member (GST) at the Central Board of Indirect Taxes and Customs (CBIC).\n\nThe decisions stem from the 57th GST Council meeting held on October 8, 2026, in New Delhi under the chairmanship of Union Finance and Corporate Affairs Minister Nirmala Sitharaman . Mangal explained that the meeting concentrated on process and structural reforms to cut taxpayer compliance burden, smooth the flow of input tax credit (ITC), and speed up refunds.\n\n\"Wherever Act amendments are not required, they will be implemented as soon as possible. Tentatively, these reforms will start from November 1, 2026,\" Sanjay Mangal said during a media interaction. The rollout will happen in stages based on the system upgrades needed.\n\nAutomated sanctioning of refunds will begin after November 1, where applicable. This applies only to future refund claims, not to those already pending. The focus is on faster processing once the systems are ready.\n\nMeasures that require amendments to the Central and state GST laws will take effect after the necessary legislative steps. Notably, the Council has set April 1, 2027, as the target date. These include changes to arrest provisions, rationalisation of prosecution thresholds, modifications to e-way bill rules, and a minimum threshold of \u20b9 10,000 for issuing show-cause notices.\n\nMangal clarified that arrests already made will not be affected by the new rules. The Council has decided to remove certain arrest provisions from the law, but these changes will apply only from April 1, 2027.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 07:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "Less EMI tip: Can you switch your home loan lenders multiple times? What it costs to do so, when you should consider it?", "full_content": "A home loan balance transfer facility allows borrowers to move their loan to another lender before the loan tenure ends, usually to secure a lower interest rate. The new lender evaluates the application as a fresh loan and if approved, repays the outstanding amount to the existing lender.\n\nOnce the transfer process is done, you begin repaying the remaining loan amount to the new lender at the revised interest rate.\n\nHowever, a balance transfer is not necessarily a one-time option. Borrowers may consider switching lenders again if another lender offers a more competitive interest rate or more favourable terms.\n\nYes, there is no fixed legal limit on the number of times you can transfer a home loan. Borrowers can switch lenders multiple times, provided they meet the new lender\u2019s eligibility criteria and the loan is approved by the new lender.\n\nAs mentioned earlier, most borrowers shift their loans to another lender when they are being offered lower interest rates.\n\nFor example, if you got a home loan of \u20b9 25 lakh at a 7% interest rate for 20 years. The approximate total interest due for payment will be \u20b9 21.5 lakh. However, if another lender offers a reduced interest rate of 6%, your total interest amount would be almost \u20b9 18 lakh, saving an amount of \u20b9 3.5 lakh.\n\nApart from a lower interest rate, refinancing your home loan can offer other benefits, such as restructuring the repayment tenure to arrive at a more manageable EMI . Some lenders may also offer additional facilities, including top-up loans, doorstep services and better customer support.\n\nHowever, transferring your home loan multiple times may not always be financially beneficial. According to a blog post by Kotak Mahindra Bank , borrowers should consider the following factors first:", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 07:33 PM IST", "pub_date_relative": "2h ago"}, {"title": "Buying two flats and joining them? ITAT ruling clarifies when you can claim capital gains tax exemption", "full_content": "Homebuyers who reinvest capital gains in two adjoining flats may be eligible for a tax exemption if the properties are physically connected and function as a single residential home, according to a recent ruling by the Mumbai bench of the Income Tax Appellate Tribunal (ITAT).\n\nAccording to Research Lawsathi, the tribunal held that the tax department cannot reject an exemption claim under Section 54F of the Income-tax Act merely because the two flats have separate registration deeds, individual flat numbers or separate parking spaces. The absence of formal municipal or RERA approval to amalgamate the units is also not, by itself, sufficient grounds to deny the benefit.\n\nHowever, taxpayers cannot assume that buying two flats automatically qualifies them for the exemption. The ruling makes the relief subject to physical verification by the jurisdictional assessing officer to establish whether the properties are interconnected and are actually used as one residential house.\n\nThe tribunal has directed the tax officer to examine the physical layout and use of the properties before deciding whether they constitute a single residential dwelling.\n\nPhysical connection: Whether the two flats are linked and function as one composite home.\n\nCommon access and facilities: Whether they have internal access or a common passage, share a kitchen and are used for a single residential purpose.\n\nSupporting evidence: Whether the actual layout is consistent with photographs, architectural documents, a housing society letter, confirmation from the previous owner and other evidence submitted by the taxpayer.\n\nActual use: Whether the two portions are maintained and occupied as one home rather than as separate, independent residential units.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 07:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "An ex-bookkeeper spent $375 to launch a sewing business: 'I hadn't felt so sure about something like that in a long time'", "full_content": "Eric Lugo didn't know that when he launched his sewing workshop business, Stitch Lab ATX , as a side project in May 2025, it'd become his full-time focus within weeks.\n\nLugo also couldn't have predicted it'd become so successful within two years that offerings would grow fivefold, classes would regularly sell out and he'd start getting requests to host private events.\n\nThe idea came to him a few years ago: Lugo learned to sew from his grandma when he was 5 and got serious about it as a teen, eventually launching his fashion brand, Casa Amir\u00e9 , and becoming his friends' go-to guy for tailoring and alterations help . Dresses needed hemming, jeans needed shortening. Lugo was happy to lend his talents, though the requests piled up.\n\nSo one day, in April 2024, he thought: What if he taught his friends how to fix their clothes themselves?\n\n\"It really made me think: Wow, this is \u2014 I think \u2014 a pretty important skill that a lot of people don't know how to do,\" Lugo, 29, of Austin, Texas, tells CNBC Make It. He could fill that gap. \"I think I have enough knowledge after you know 14 [or] 15 years to be able to teach other people, and so I went from there.\"\n\nFor months, while in between jobs and selling wares from his fashion brand, Lugo couldn't stop thinking about launching a sewing workshop. Around August 2024, he got a bookkeeping job for a local PR firm and shelved the idea. But by the beginning of 2025, it was back on his mind. He mapped out the classes he'd offer and how he'd get the word out.\n\nBy April, Lugo put money into it. He spent $375 to buy eight sewing machines, sourced second-hand from Facebook Marketplace, and set up shop in a friend's warehouse space that wasn't in use outside of business hours.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 07:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "My father-in-law, 81, sold his $75,000 home to pay his daughter\u2019s $50,000 debt. How can I keep him from becoming destitute?", "full_content": "\u201cNothing has been set aside for his needs.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 07:30 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "413% returns in 1 year: Gold jewellery stock offers bonus shares - Do you own? Check Ratio, record date", "full_content": "Shares of Utssav CZ Gold Jewels Limited will remain in focus next week as the SME jewellery stock announced issuance of bonus shares in the ratio of 1:1. The SME jewellery stock has delivered close to 55% return in one month, and 354% return in 2026 so far.\n\nThe company\u2019s board of directors, on Friday, approved the proposal of issuance of bonus issue in the ratio of 1:1.\n\n\u201cAt its meeting on October 23, the company\u2019s board of directors approved the proposed issuance of one bonus share of face value Rs. 10 for every existing share held by eligible shareholders. The record date for determining eligibility for the bonus shares will be announced after the requisite approvals are obtained,\u201d stated the company in its BSE filing released on Friday.\n\nThe proposed bonus shares corporate action will lead to the issuance of 2,49,98,000 bonus shares of Rs. 10 each. If the corporate action will be approved, the company\u2019s total paid-up equity share capital will increase from \u20b9 24.998 crore to \u20b9 49.996 crore, with the number of shares rising from 2,49,98,000 to 4,99,96,000.\n\nThe board will fix and announce the record date in the coming days. There is no clear information about the record date so far.\n\nApart from bonus share, the board has also approved the proposal to increase the company's authorised share capital from \u20b9 24.998 crore to \u20b9 60 crore, divided into six crore shares of \u20b9 10 each. The increase in share capital is aimed to improve the proposed expansion of the paid-up share capital.\n\nThe stock closed marginally lower at \u20b9 1013 per share on NSE on Friday, October 23. Its share price value has surged 55.07% in one month, 354.46% year to date (YTD), and 412.91% in one year.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 09:47 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "AI funding fears rattle Wall Street. Here's how we're adjusting our portfolio", "full_content": "The rotation out of AI stocks benefited several defensive Club stocks.", "source": "CNBC World Economy", "pub_date_str": "24 Oct 2026, 09:44 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "ED Arrests Advocate At Mumbai Airport In Pan-india Cyber Fraud Case; Total Arrests Reach 7", "full_content": "A team from the Enforcement Directorate's (ED) Panaji unit intercepted Rashesh Upadhyay alias Rashesh Shah at a boarding gate inside the Chhatrapati Shivaji Maharaj International Airport when he was about to take a flight to Delhi.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:36 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "American Express Is Cutting 3,500 Jobs Globally; Here's Why", "full_content": "American Express will cut 3,500 jobs globally despite a 28% jump in quarterly profit, as it streamlines operations, boosts efficiency and prepares for wider AI adoption.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:22 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Reliance Jio IPO listing on Oct 28: Will Mukesh Ambani's firm be in top 5 m-cap? RIL to hold top spot", "full_content": "As Jio Platforms Initial Public Offering (IPO) closed with bumper subscription, investors are now eagerly awaiting the share allotment results ahead of its scheduled listing next week.\n\nBacked by Mukesh Ambani\u2019s Reliance Industries Limited (RIL), the IPO generated huge buzz during its subscription period. But where could the telecom giant be bound to stand post listing in terms of market capitalisation? Let\u2019s find out.\n\nBased on the IPO\u2019s upper price band and post-issue share count, Jio Platforms is estimated to hold post issue market capitalisation of \u20b9 10.30 lakh crore. With this, Jio can comfortably stand in the list of top five companies in terms of market capitalisation on BSE. Investors must note that market capitalisation of companies fluctuate, and Jio Platforms\u2019 actual ranking would depend on listing price and other stocks\u2019 price.\n\nAs per BSE data (as on October 23), Reliance Industries Limited (RIL) has a market capitalisation of \u20b9 16.10 lakh crore, Bharti Airtel has an Mcap of \u20b9 11.79 lakh crore, HDFC Bank has an Mcap of \u20b9 10.67 lakh crore, ICICI Bank\u2019s Mcap stood at \u20b9 10 lakh crore, TCS\u2019s MCap stood at \u20b9 9 lakh crore.\n\nPost Jio IPO listing, Reliance Industries Group will also become India\u2019s largest listed business group by aggregate listed MCap.\n\nJio IPO was subscribed 22.19 x on the final day of its subscription. The total subscription consisted of 70.55 times subscription in the qualified institutional buyers (QIB) category, 14x subscription in non institutional investors (NII) category, 2.72x subscription in the retail investors segment, 2.93 x bidding in employee reserved quota, and 7.60x subscription in the reservation portion shareholder.\n\nThe issue opened for subscription on Wednesday, October 21 and concluded on Friday, October 23. Its allotment is likely to be finalised on Monday, October 26. The issue is likely to be listed on NSE and BSE on October 28.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 09:19 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IRDAI extends window for feedback on proposed insurance distribution reforms \u2014 check new deadline", "full_content": "The Insurance Regulatory and Development Authority of India (IRDAI has extended the deadline for submitting feedback on its consultation paper on insurance distribution reforms to October 31, 2026.\n\nThe regulator had earlier set October 25, 2026, as the deadline for stakeholders to submit their comments on the proposed changes.\n\n\u201cThe consultation has received an encouraging response, with over 650 comments received so far. In view of the significant interest and to facilitate wider participation, the last date for submission of comments has been extended till 31st October 2026, providing additional time to stakeholders and members of the public to submit their feedback and suggestions,\u201d the official release read.\n\nThe Insurance Brokers Association of India ( IBAI ) had previously raised a request for an extension of the deadline until the end of December to submit its recommendations, citing the need of more time to examine the proposals.\n\nIRDAI released a two-part consultation paper on the proposed distribution reforms, titled \u2018Recalibrating Economics of Insurance Distribution\u2019 on September 23, inviting comments and suggestions from the public, policyholders, insurers, intermediaries and other stakeholders.\n\nThe insurance regulator's consultation paper outlines a series of reforms to streamline insurance distribution in India and improve how policies are sold to customers. The proposals also aim to simplify the distribution framework while bringing greater oversight to commissions and selling practices.\n\nKey proposals include tighter expenses of management (EoM) limits, a return to product-level commission caps, a ban on compulsory bundling of insurance with loans by banks and non-banking financial companies (NBFCs), and changes to motor insurance distribution. Expenses of management are the costs an insurance company incurs to run the business.\n\nThe draft reforms focus on areas where the regulator believes there are unnecessary distribution costs.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 09:18 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Volvo Plans 2,500 More Job Cuts After 3,000 Layoffs, Targets $500 Million Savings", "full_content": "Volvo Cars plans to eliminate another 2,500 jobs after cutting 3,000 roles earlier this year, as the Swedish automaker seeks $500 million in savings amid mounting pressure from Chinese rivals, weak demand and tariff-related headwinds.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:16 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "American embassies tighten security as Iran threat warnings intensify ahead of U.S. midterm elections", "full_content": "U.S. embassy officials were on heightened alert around the Middle East as new reports said Iran is in the \"advanced stages\" of planning attacks against Americans Friday.\n\nA memo from Director of National Intelligence Jay Clayton said agencies received intelligence that Iran has \"substantially increased efforts to target U.S. personnel\" in the region, according to a New York Times report , and that the threats applied to \"certain other countries\" as well.\n\nThe warnings come after the U.S. ordered non-emergency government employees to leave Saudi Arabia this week, as attacks from the Iran-backed Houthis have worsened and the broader war between the U.S. and Tehran nears its eighth month.\n\nThe Saudi-led coalition fighting the Houthis said it destroyed two ballistic missiles fired by the group Saturday, aimed towards Taif and Yanbu.\n\nThe Trump administration has vowed to put off military strikes on Iran after the midterm elections on Nov. 3, as the fallout from the war in Iran has caused a major disruption in the U.S. economy \u2014 with inflation and affordability the top concerns for voters who will decide control of Congress early next month.\n\nRising Middle East tensions sent oil prices soaring this week. Benchmark Brent crude futures topped $116 a barrel, a six-month high . U.S. West Texas Intermediate rose 3.8% to settle over $103 a barrel.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 09:14 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why popular airplanes are getting scrapped years early", "full_content": "GOODYEAR, Ariz. \u2014 An Airbus A320neo, one of the world's most popular planes, rolled off the Mobile, Alabama, factory line in July 2022, painted bright yellow for its next destination: Spirit Airlines.\n\nIt was built to fly for decades. But this May, less than four years later, it was stripped for parts worth millions and crushed, the steel teeth of an excavator tearing through its fuselage at a facility on the outskirts of Phoenix.\n\nMore aircraft are getting dismantled years, if not decades, earlier than expected, industry executives told CNBC. It is the result of a shortage of parts, none more precious and expensive than aircraft engines, that has exasperated airlines and driven up costs for years .\n\nEven after the engines are removed, firms are looking for parts as varied as landing gear and antennae to sell.\n\n\"It's the first time in my career that involved purchasing an aircraft that's less than five years since date of manufacture,\" said Bill Thompson, vice president who leads aircraft and engine acquisition for the Americas at aviation asset management and trading firm EirTrade Aviation, which bought the less than 4-year-old Airbus A320neo earlier this year.\n\nHe said the company paid \"single-digit\" millions each for that airplane and a similarly aged one, and it expects to make a profit from selling the more than 1,000 parts it took off them before they were crushed.\n\n\"I don't know if you're going to sell the coffee makers but you never know. Sometimes you do,\" he said.\n\nTwenty-one newest-generation aircraft were torn down from June 2025 through this past August, according to aviation data and advisory firm IBA Group. The scrapped planes were 6.4 years old on average, and included mostly Airbus but also some Boeing planes. That compares with an average retirement age for narrow-body airplanes of 21.7 years, IBA said.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 08:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UPI Merchant Charges: Know Your Rights As A Consumer Before Heading For Diwali Shopping", "full_content": "UPI payments remain free for consumers, even as a new merchant discount rate (MDR) framework is expected to introduce charges on certain high-value transactions.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Retail investors are not more sophisticated than 30 years ago, says former hedge fund manager", "full_content": "Retail investors who are trying to beat the market by buying individual stocks and complex exchange-traded funds may be better off with broad market index funds, according to Elm Wealth's Victor Haghani.\n\n\"I'm not sure that investors are that much more sophisticated than they were 30 years ago,\" the firm's founder and chief investment officer told CNBC's \"ETF Edge\" this week. \"We still are human beings and we're subject to certain kinds of biases \u2014 particularly extrapolation bias where whatever has happened recently in the past we tend to believe that it's going to continue into the future.\"\n\nHaghani, who was a founding partner at hedge fund Long-Term Capital Management, emphasizes cost-effective investment strategies as a priority at his current firm.\n\n\"It's an environment that continues to be tough for individual non-professionals to generate alpha,\" he said. \"[Retail investors are] just very well served by having some exposure to broader index funds overall.\"\n\nAccording to Haghani, access to elaborate strategies doesn't necessarily provide advantages.\n\n\"Whether it's Citadel or Jane Street or Hudson River Trading, they're just minting money every single day. So, it's an opportunity-rich environment \u2014 if you happen to have a billion dollars to spend on tech each year,\" he said. \"If you're a retail investor sitting at home and trying to find opportunities, you have to realize that probably on the other side of your trades is [Citadel CEO] Ken Griffin or whoever, and it's probably not going to end all that well.\"\n\nHowever, RBC Capital Markets' Valerie Grimba sees sophisticated funds playing a strategic role in retail investors' portfolios.\n\n\"More choice is ultimately a good thing,\" the firm's director of global ETF strategy said in the same interview.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 08:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IDFC First Bank Q2 FY27 slides: profit crosses Rs. 1,000 Cr milestone", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 08:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "EPS-95 Pension: What The Bombay High Court Ruling Means For Private-Sector Employees", "full_content": "The Bombay High Court set aside the EPFO orders rejecting the employees' applications and directed the authorities to process and allow their joint options for a higher pension within eight weeks.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:13 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Big action! Who is Avadhut Sathe? Why SEBI ordered Avadhut Sathe Trading Academy to refund \u20b9546 cr - What he did?", "full_content": "The Securities and Exchange Board of India (SEBI) took action against Indian stock markets and options trader, Avadhut Sathe, and his trading academy, for running an unregistered investment advisory and research analyst business.\n\nThe markets regulator, on Friday, directed Avadhut Sathe Trading Academy Private Limited (ASTAPL) and its founder to refund \u20b9 546.17 crore collected from participants for providing unregistered investment advisory and research analyst services, along with interest of \u20b9 67.87 crore.\n\nAvadhut Sathe started trading and investment in 1991. As per his trading academy\u2019s official website, Sathe regularly conducts seminars in stock market trading since February 2008.\n\nHis academy branches are located in multiple cities including Mumbai, Delhi, Navi Mumbai, Pune Hyderabad, Indore, Nashik, etc . The ASTAPL academy runs multiple programmes linked to stock market investment and trading, including eye opener sessions, Geo Program, SMM, PAPA, etc.\n\nSEBI has imposed a total penalty of \u20b9 11.5 crore on the academy, Sathe and Gouri Avadhut Sathe for violations of securities market regulations. As per SEBI\u2019s 171-page final order, Sathe has been fined \u20b9 4 crore, while Gouri Avadhut Sathe has been penalised \u20b9 1.5 crore.\n\nSEBI has barred the academy and Avadhut Sathe from accessing the securities market for two years, or until they fulfil the direction to initiate all refunds.\n\nThe regulator found that the academy and Sathe provided investment advice and research recommendations through paid programmes, sessions and WhatsApp groups without obtaining the required registration.\n\nIt also found that misleading promotional representations about returns were used to attract participants and that investment advice was provided without assessing the suitability of recommendations for recipients.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 08:11 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: IDFC First Bank posts strong Q2 2026 profit growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 07:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fire devastates former Nazi guest house 'Eagle's Nest' in Germany", "full_content": "Firefighters battled for hours to contain a blaze that engulfed the former Nazi guest house known as \"The Eagle's Nest\" in southern Germany, while police investigated the cause after detaining a man near the scene, authorities said on Saturday.\n\nAround 200 firefighters and emergency workers near Berchtesgaden in Bavaria were battling the flames after the building, known as the Kehlsteinhaus, caught fire on Friday, police said.\n\nBuilt in 1938 as a guest house for Nazi officials and their guests, the building sits in a spectacular Alpine setting above Berchtesgaden. Adolf Hitler used it occasionally, earning it the nickname \"Hitler's Tea House.\" It is separate from his nearby summer residence, the Berghof.\n\nBild newspaper quoted a police spokesperson as saying the building, preserved after World War II as a historical monument linked to the Nazi era, had been so badly damaged that it \"could probably not be saved\".\n\nPolice said earlier they had detained a man near the site but had not yet established the cause of the fire.\n\n\"Whether the person is linked to the fire is currently the subject of a criminal investigation,\" Bavarian police said in a statement.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 07:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "New GST Rules 2026: From November 1, reforms to be rolled out in phases - What CBIC confirmed", "full_content": "Goods and Services Tax ( GST ) reforms designed to lighten the compliance load on businesses are set to begin in phases from November 1, 2026. Changes that need amendments to the GST laws are targeted for April 1, 2027, according to Sanjay Mangal, Member (GST) at the Central Board of Indirect Taxes and Customs (CBIC).\n\nThe decisions stem from the 57th GST Council meeting held on October 8, 2026, in New Delhi under the chairmanship of Union Finance and Corporate Affairs Minister Nirmala Sitharaman . Mangal explained that the meeting concentrated on process and structural reforms to cut taxpayer compliance burden, smooth the flow of input tax credit (ITC), and speed up refunds.\n\n\"Wherever Act amendments are not required, they will be implemented as soon as possible. Tentatively, these reforms will start from November 1, 2026,\" Sanjay Mangal said during a media interaction. The rollout will happen in stages based on the system upgrades needed.\n\nAutomated sanctioning of refunds will begin after November 1, where applicable. This applies only to future refund claims, not to those already pending. The focus is on faster processing once the systems are ready.\n\nMeasures that require amendments to the Central and state GST laws will take effect after the necessary legislative steps. Notably, the Council has set April 1, 2027, as the target date. These include changes to arrest provisions, rationalisation of prosecution thresholds, modifications to e-way bill rules, and a minimum threshold of \u20b9 10,000 for issuing show-cause notices.\n\nMangal clarified that arrests already made will not be affected by the new rules. The Council has decided to remove certain arrest provisions from the law, but these changes will apply only from April 1, 2027.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 07:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Less EMI tip: Can you switch your home loan lenders multiple times? What it costs to do so, when you should consider it?", "full_content": "A home loan balance transfer facility allows borrowers to move their loan to another lender before the loan tenure ends, usually to secure a lower interest rate. The new lender evaluates the application as a fresh loan and if approved, repays the outstanding amount to the existing lender.\n\nOnce the transfer process is done, you begin repaying the remaining loan amount to the new lender at the revised interest rate.\n\nHowever, a balance transfer is not necessarily a one-time option. Borrowers may consider switching lenders again if another lender offers a more competitive interest rate or more favourable terms.\n\nYes, there is no fixed legal limit on the number of times you can transfer a home loan. Borrowers can switch lenders multiple times, provided they meet the new lender\u2019s eligibility criteria and the loan is approved by the new lender.\n\nAs mentioned earlier, most borrowers shift their loans to another lender when they are being offered lower interest rates.\n\nFor example, if you got a home loan of \u20b9 25 lakh at a 7% interest rate for 20 years. The approximate total interest due for payment will be \u20b9 21.5 lakh. However, if another lender offers a reduced interest rate of 6%, your total interest amount would be almost \u20b9 18 lakh, saving an amount of \u20b9 3.5 lakh.\n\nApart from a lower interest rate, refinancing your home loan can offer other benefits, such as restructuring the repayment tenure to arrive at a more manageable EMI . Some lenders may also offer additional facilities, including top-up loans, doorstep services and better customer support.\n\nHowever, transferring your home loan multiple times may not always be financially beneficial. According to a blog post by Kotak Mahindra Bank , borrowers should consider the following factors first:", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 07:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China urges US to halt proposed expansion of outbound investment curbs - Reuters", "full_content": "China urges US to halt proposed expansion of outbound investment curbs Reuters US Proposes Curbs on Investment in Chinese Biotech Firms Bloomberg US Treasury proposes a rule to crack down on high-tech investments in China, other adversaries AP News US Treasury proposes tighter rules on investing in sensitive Chinese tech Financial Times Treasury sweeps biotech into proposed COINS Act restrictions, but spares Big Pharma\u2019s China licensing deals Fierce Biotech", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 07:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Halloween candy sales are off to a slow start amid high chocolate prices and affordability concerns - AP News", "full_content": "Halloween candy sales are off to a slow start amid high chocolate prices and affordability concerns AP News Video Cost saving tips as Halloween candy prices rise ABC News - Breaking News, Latest News and Videos Why candy prices are scary high ahead of Halloween Food Dive Erie shoppers turn to other options as Halloween prices increase WJET/WFXP/YourErie.com Halloween candy sales drop as cost of living crisis bites American households The Independent", "source": "Google News Business", "pub_date_str": "24 Oct 2026, 07:12 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Investors\u2019 recent money moves show a preference for lowering risks over boosting rewards", "full_content": "Investors have been steadily pouring money into the Invesco S&P 500 Quality ETF this year.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Oct 2026, 07:07 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Reliance Jio Platforms IPO GMP, listing date and time, share price prediction for NSE, BSE debut - Details", "full_content": "Reliance Jio Platforms: Jio Platforms initial public offering (IPO) concluded with massive subscription on Friday and all eyes are now on the listing of the mega IPO next week. Backed by Mukesh Ambani\u2019s Reliance Industries Limited (RIL), the issue broke multiple records whether it was securing record fundraising, or anchor investor demand or achieving full subscription within just 100 minutes of opening for bidding.\n\nAs investors closely await details of Reliance Jio IPO allotment status, here are all the details about Reliance Jio IPO grey market premium (GMP) and share price prediction, listing date and time, and other details.\n\nReliance Jio IPO GMP stood at \u20b9 248 per equity share, as per media reports at 5 pm on Saturday, October 24. Considering its upper price band, which is fixed at \u20b9 1119 per share, the issue is estimated to be listed at \u20b9 1367 per share (sum of price band and latest GMP). The IPO GMP hints at 22.16% listing gain.\n\nReliance Jio Platforms IPO will list on NSE and BSE with a tentative listing date fixed as October 28, 2026. Reliance Jio IPO will be listed on exchanges at 10 am.\n\nThe IPO listing process begins with a special pre-open session (SPOS) between 9 am and 9:45 am. The special session will open for order entry, modification, and cancellation. It will be followed by order matching, trade confirmation and opening price determination session between 9:45 am and 9:55 am. Next is a five minute buffer and transition period followed by listing at 10 am.\n\nJio IPO was subscribed 22.19 x on day 3, which included a massive 70.55 times subscription in the qualified institutional buyers (QIB) category, 14x subscription in non institutional investors (NII) category, 2.72x subscription in the retail investors segment, 2.93 x bidding in employee reserved quota, and 7.60x subscription in the reservation portion shareholder.\n\nThe IPO price band was fixed at \u20b9 1,065 per share to \u20b9 1,119 per share. The lot size for an application is 12 shares.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 07:01 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Income Tax Department highlights key TDS deadlines in October, November 2026: Check the list of new TDS forms", "full_content": "If you are responsible for deducting tax at source ( TDS ), meeting your compliance obligations involves more than deducting tax from payments. You must also deposit the tax with the government, file the applicable TDS statement, and issue certificates to the recipients within the prescribed deadlines.\n\nIn an X post on Saturday, the Income Tax Department reminded deductors that \u201cDeducting TDS is just the first step. Timely deposit and filing of TDS returns are equally important!\u201d\n\nThe department highlighted two upcoming deadlines: October 31, 2026, for filing quarterly TDS statements for the July-September quarter, and November 15, 2026, for issuing TDS certificates (Form 131). Here's what you need to know.\n\nThe July-September quarter is the second quarter (Q2) of Tax Year 2026-27 under the Income-tax Act, 2025, which came into effect on April 1, 2026. The applicable forms have been renumbered under the new IT Act. The key quarterly TDS statements due on October 31 are:\n\nThese forms correspond broadly to Forms 24Q, 26Q, 27Q, and 27QE under the earlier tax framework. The applicable form depends on the nature of the payment and the reporting obligation.\n\nHowever, this should not be confused with Form 141 . It is a consolidated challan-cum-statement for TDS on specified transactions, including certain rent payments, property transfers, payments to contractors or professionals by individuals and HUFs, and virtual digital asset transfers.\n\nIt follows a separate process and is due within one month from the end of the month in which tax is deducted, rather than the quarterly deadline.\n\nForm 131 is the TDS certificate for payments other than salary, corresponding to Form 16A under the earlier Income-tax Act, 1961. Under Section 395(4)(a) of the Income-tax Act, 2025, it records details of tax deducted and helps recipients claim the applicable TDS credit while filing their income-tax returns ( ITR s).", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 06:51 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Biotech stocks are surging. How investors can play the new drug innovation boom", "full_content": "Biotech stocks are rallying as clinical wins, M&A and new drug technologies revive the sector. Here are the ETFs and stocks analysts favor.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 06:40 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Fact vs. fiction: Doctors share whether peptides are safe and effective", "full_content": "From YouTube influencers to Reddit threads, the health and wellness side of the internet is full of talk about peptides.\n\nThe term refers to a class of chemical compounds made up of short chains of amino acids. In the wellness market, synthetic peptides are often sold to consumers as injectables, which some health influencers say can bring a wide range of health benefits from muscle recovery and longevity to improved sexual function. Some peptides, including GLP-1 drugs commonly used for weight loss or diabetes, are heavily researched and federally approved for medical use. Many other forms of peptides are not.\n\nYet even some lightly researched peptides may be on their way to pharmacy shelves. The Department of Health and Human Services is reportedly planning to allow specialty pharmacies to compound certain synthetic peptides that have the support of Health Secretary Robert F. Kennedy Jr., who told podcaster Joe Rogan that he is a \"big fan\" of the injectables in a February 2026 interview. As reported, the move would be an interim access policy covering some specific peptides not currently approved by the U.S. Food and Drug Administration.\n\nSuch a move would be controversial from a regulatory point of view: Multiple peptides, including one of the compounds reportedly included in the health department's proposal, appear on an FDA list of injectables that \"may present significant safety risks.\" That compound, known as BPC-157, has shown potential anti-inflammatory effects in some animal and lab studies but has not yet been subject to large-scale human testing for safety or effectiveness.\n\n\"There are a few reasons why, but one of the main ones is the absence of evidence,\" including robust human studies on safety and effectiveness, says Dr. Caleb Alexander , a professor of epidemiology and medicine at the Johns Hopkins Bloomberg School of Public Health.\n\nYet consumer interest and regulatory momentum for peptides are growing.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 06:35 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AU Small Finance Bank Q2\u2019FY27 slides: 53% profit surge, AI gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 06:27 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Goldman says these top tech stocks have plenty of upside ahead of earnings", "full_content": "Goldman Sachs said this week there are plenty of top tech companies to buy heading into their quarterly results.", "source": "CNBC Top News", "pub_date_str": "24 Oct 2026, 06:21 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financia
