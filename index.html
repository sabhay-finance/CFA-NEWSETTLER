<script>

    const allData = {"general": [{"title": "U.S. oil rises above $100, Brent at five-month high as Iran says it\u2019s prepared for warfare", "full_content": "Crude oil futures rose Friday with global benchmark Brent crude hovering at a five-month high.\n\nFront-month Brent crude oil futures were 1.4% higher at $114.72 per barrel. U.S. West Texas Intermediate crude futures were up 1.7% to trade at $101.11 a barrel.\n\nCrude oil futures Brent futures were on track for a weekly rise of 4.4%, putting the contracts on course for their third consecutive week of gains. They were also trading at their highest since early May.\n\nWTI futures were on track for a weekly decline of 0.2%, putting the contracts on course to snap two consecutive weeks of gains.\n\nTraders are continuing to monitor developments in the Middle East.\n\nOn Thursday, U.S. President Donald Trump accused Iran of lying about attacks on ships transiting the Strait of Hormuz.\n\n\"Iran is doing everything they can to drive up the price of Oil prior to the U.S. Midterm Election,\" he wrote on Truth Social. \"They are even making up fake hits, mines, and everything else, because more Oil is coming through the Hormuz Strait now than it did even prior to the beginning of the Conflict.\"\n\nIran's Islamic Revolution Guards Corps said Thursday that four vessels had been struck and caught fire in the Persian Gulf, according to the Iranian state-affiliated Tasnim news agency, while a further three had struck mines in the Strait of Hormuz.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 06:13 PM IST", "pub_date_relative": "1m ago"}, {"title": "OpenAI nears up to $30 billion funding round at $1.25 trillion valuation led by UAE investors", "full_content": "OpenAI is closing in on a funding round that could value the artificial intelligence giant at more than $1 trillion ahead of a potential initial public offering .\n\nThe San Francisco-based AI company is raising up to $30 billion at a $1.25 trillion valuation, according to people familiar with the deal, who asked not to be named because the details were confidential. That valuation does not include new capital raised.\n\nInvestors from the United Arab Emirates are leading the round alongside Coatue, according to the people. The financing is being positioned as an \"opportunistic\" bridge ahead of a potential IPO.\n\nOpenAI kickstarted discussions for a new funding round after investors approached the company with proposals in September, as CNBC previously reported. OpenAI told investors on Thursday that it is aiming to secure signatures by the end of next week, but the final size of the round is still being determined, the people said.\n\nAlongside the new investment, OpenAI is negotiating a commercial deal that would secure more computing capacity from the UAE, according to one person. OpenAI told investors in February that it's targeting roughly $600 billion in total compute spend by 2030.\n\nThe company confidentially filed its prospectus with the Securities and Exchange Commission in June, but it has not disclosed exactly when it plans to debut.\n\nOpenAI CFO Sarah Friar told employees in August that the AI lab \"will be a public company in 2027.\" The following month, CEO Sam Altman said that \"right now would be an ill-advised moment to go public.\"\n\nAnthropic, OpenAI's chief rival, is also gearing up for what is widely expected to be a massive IPO. The company confidentially filed its prospectus with regulators in June and is actively engaging in meetings with prospective investors, as CNBC previously reported.", "source": "CNBC World Economy", "pub_date_str": "23 Oct 2026, 06:09 PM IST", "pub_date_relative": "5m ago"}, {"title": "NBFC stock crashes 25% in month, but ICICI Securities sees a potential 50% rally - Do you own it? Check target price", "full_content": "Shares of Aye Finance ended higher on Friday, after seeing sharp 12% decline over the week. Despite the sharp decline, ICICI Securities, sees 50% upside potential in the NBFC stock on the back of its sustained profitability through superior execution.\n\nAye Finance share price 25.56% in one month. As the Gurugram-headquartered NBFC recently announced its earnings for the second quarter of financial year 2026-27, here\u2019s experts\u2019 take on stock outlook.\n\nStrong market positioning, execution capability and resilient asset quality have presented a strong case for Aye Finance growth outlook. The NBFC delivered a strong Q2FY27 quarter which underscores the strength of its market positioning in the INR 0.15mn\u2013 0.5mn ticket size segment.\n\n\u201cAye is also effectively utilising its differentiated underwriting models (cluster & AI-ML led) and execution capability to navigate the macroeconomic headwinds. Despite a rising rate cycle, Aye\u2019s cost of borrowing fell 20bps to 10.6%, with incremental costs moderating further to 10% in Q2FY27,\u201d highlighted ICICI Securities in its report.\n\nThe brokerage gave \u2018Buy\u2019 rating to the stock with a revised target price of \u20b9 200 per share, indicating a 50% upside potential in Aye Finance stock. Earlier, ICICI Securities had set a target price of \u20b9 285 per share. \u201cMaintain BUY with a revised TP of INR 200 (vs. INR 285 earlier), as we lower the valuation multiple to 1.4x on FY28E BVPS (2x earlier) to factor in near-term volatility,\u201d read the brokerage report.\n\nThe stock closed 1.01% higher at \u20b9 134.55 per share on BSE with a market capitalisation of \u20b9 3,320.53 crore on Friday, October 23. With a return on equity (ROE) of 10.75%, Aye Finance share price value has declined 14.54% in two weeks and around 25.56% in one month.\n\nDisclaimer: This story is for educational and informational purposes only. The views and recommendations above are those of individual analysts or broking companies, not Mint.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 06:04 PM IST", "pub_date_relative": "10m ago"}, {"title": "Stock futures remain under pressure amid AI trade worries, gain in oil above $100: Live updates - CNBC", "full_content": "Stock futures remain under pressure amid AI trade worries, gain in oil above $100: Live updates CNBC A Tech Rotation Roils the Markets, Again The New York Times World shares are mixed after Wall Street\u2019s AI-related losses, while oil prices jump AP News Stock market today: Dow, S&P 500, Nasdaq wobble after sharp tech sell-off Yahoo Finance Futures Slip as Big Tech Falters, Oil Extends Relentless Advance Bloomberg.com", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 06:03 PM IST", "pub_date_relative": "10m ago"}, {"title": "Stock Market Today: Nasdaq Futures Steady After Selloff; Oil Prices Hit 5-Month High \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Futures Steady After Selloff; Oil Prices Hit 5-Month High \u2014 Live Updates WSJ U.S. oil rises above $100, Brent at five-month high as Iran says it\u2019s prepared for warfare CNBC Brent crude hits more than five-month high on concern over Middle East escalation Reuters Oil hits five-month high amid fears US will renew strikes on Iran The Guardian Are global oil reserves sufficient to withstand renewed US-Iran war? Al Jazeera", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 06:03 PM IST", "pub_date_relative": "11m ago"}, {"title": "UBS acquires 4.8% stake in 360 ONE WAM: What the warrant conversion means for India's wealth market - Decoded", "full_content": "360 ONE WAM , one of India\u2019s largest independent wealth and asset management firms, announced on Thursday that Swiss banking major UBS had acquired a 4.8% stake in the company through the conversion of warrants.\n\nUBS AG had subscribed to 20,502,939 warrants on a preferential basis under an agreement with 360 ONE. The warrants were allotted on July 21, 2025, with 25% of the exercise price paid at the time of allotment. UBS AG has now exercised all the warrants and paid the remaining 75% of the exercise price.\n\n\u201cPursuant to this, 360 ONE has allotted 2,05,02,939 equity shares to UBS AG, representing approximately a 4.8% equity stake in 360 ONE WAM Ltd,\u201d the company said in a regulatory filing.\n\nThe move comes as global private banks face increasing competition from domestic players, including Kotak Mahindra Bank\u2019s private banking arm and 360 ONE. India is among the world\u2019s fastest-growing wealth markets, with nearly a million millionaires and at least 211 billionaires, according to UBS estimates.\n\nIn April 2025, the companies announced a partnership under which UBS agreed to sell its Indian onshore wealth management business to 360 ONE for around $32 million, while acquiring warrants representing a 4.95% stake in the Indian firm.\n\n360 ONE WAM is among India\u2019s leading wealth and asset management firms, managing assets worth more than \u20b9 9 lakh crore ($94.1 billion) and serving over 9,000 families and corporate clients. Last month, the company announced that Jefferies India head Aashish Agarwal would take over as its chief executive officer in February.\n\nThe company aims to capture a larger share of the market for managing the wealth of India\u2019s richest families over the next few years, as demand for asset management services in this segment continues to grow.\n\nIndia\u2019s largest independent wealth manager currently commands nearly 10% of the ultra-high-net-worth market and aims to increase its share to 12%-13%, Co-founder Yatin Shah told Bloomberg in an interview in August.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 06:02 PM IST", "pub_date_relative": "11m ago"}, {"title": "Senior Citizen FD rates Oct 2026: Earn up to 8.5% interest | Public, private banks and SFB fixed deposit rates compared", "full_content": "Senior citizens looking to earn higher returns on their fixed deposits (FDs) may find better rates at banks revising their deposit rates in October 2026. The latest bank FD rate changes come amid shifting interest rate expectations following the Reserve Bank of India\u2019s ( RBI ) 25-basis-point repo rate hike on October 7, which raised the policy rate from 5.25% to 5.50%.\n\nIndian Bank has revised rates on select tenures of its domestic retail term deposits of less than \u20b9 3 crore, effective October 23, 2026.\n\nIts IND Grow (555-day) deposit rate has increased by 15 basis points to 6.80% from 6.65%, while the IND Prosper (777-day) deposit rate has risen by 15 basis points to 6.75% from 6.60%. Senior citizens can earn up to 7.30% and 7.25%, respectively, on these special-tenure deposits.\n\nShriram Finance has also hiked its fixed deposit rates from October 11, including rates for senior citizens and women.\n\nHowever, comparing rates at individual banks may not provide the complete picture. Here is a look at the FD interest rates offered to senior citizens aged 60 and above by leading public sector, private, and small-finance banks in October 2026.\n\nIn October 2026, the highest slab FD rate is 7.45% per annum at Bank of India, followed by 7.35% at Punjab & Sind Bank. The highest slab means the maximum interest rate a bank offers on any eligible FD tenure for senior citizens, not necessarily for a 1-year, 3-year, or 5-year deposit.\n\n*Source: paisabazaar; Interest rates as of 21 October 2026; Deposits below \u20b9 3 crores\n\nSBM Bank offers the highest slab rate of 8.15% per annum, followed by DCB Bank at 8% and Bandhan Bank at 7.95%.", "source": "LiveMint Money", "pub_date_str": "23 Oct 2026, 06:02 PM IST", "pub_date_relative": "12m ago"}, {"title": "Smart financial advisers are dropping ROI, NAV and QCD for plain English when talking to clients", "full_content": "Not everyone is familiar with the ABCs of financial planning", "source": "MarketWatch Top Stories", "pub_date_str": "23 Oct 2026, 06:00 PM IST", "pub_date_relative": "14m ago"}, {"title": "It\u2019s been a painful month for hedge funds. To turn it around, they are shorting U.S. stocks.", "full_content": "In response to losses on popular trades, hedge funds are now shorting U.S. stocks aggressively to try and win back some performance.", "source": "MarketWatch Top Stories", "pub_date_str": "23 Oct 2026, 05:53 PM IST", "pub_date_relative": "21m ago"}, {"title": "Silicon Valley Democrats demand investigation into Starlink restrictions in Ukraine", "full_content": "A group of Silicon Valley U.S. House Democrats on Friday demanded the White House investigate recent interruptions of Elon Musk 's Starlink internet service in Ukraine in a letter to White House chief of staff Susie Wiles .\n\nThe letter, shared exclusively with CNBC and led by California Democratic Reps. Sam Liccardo , Ro Khanna and Jimmy Panetta , comes after Starshield, the military-grade version of SpaceX's Starlink, was restricted in Ukraine for a period of time, limiting the besieged country's military capabilities.\n\nUkrainian officials told CNN on Friday that restrictions remained in place, despite President Donald Trump's claim Thursday that Musk had restored access. The officials said the restrictions were disrupting high-speed military drones, hampering Ukraine's ability to intercept Russian attacks and conduct operations along the front line.\n\nThe lawmakers in their letter to Wiles demanded an \"immediate, government-wide investigation into the decision to restrict SpaceX's Starshield satellite-based intelligence and military support services in Ukraine.\" The letter indicates Democrats will make investigating the Starlink interruption a top priority if they win the House in the Nov. 3 midterm election.\n\n\"We will ensure that the 120th Congress will closely scrutinize federal funding awarded to Mr.", "source": "CNBC World Economy", "pub_date_str": "23 Oct 2026, 05:52 PM IST", "pub_date_relative": "22m ago"}, {"title": "Perfect Corp. completes going-private merger, delists from NYSE", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:50 PM IST", "pub_date_relative": "23m ago"}, {"title": "Yes Bank AT1 bonds: Supreme Court overturns write-off, but will investors get coupon payments? What's the entire matter", "full_content": "Yes Bank is unlikely to pay coupons due this year on its Additional Tier-1 (AT-1) bonds despite a Supreme Court ruling overturning their write-off during the lender\u2019s 2020 rescue, Reuters reported, citing two people familiar with the matter.\n\nThe bank is preparing to seek a review of the ruling, the report said, citing one of the sources, while bondholders are pressing for payment of coupons that have remained unpaid since Yes Bank wrote off the bonds six years ago.\n\nRetail investors holding the bonds said on Thursday that they had not received coupon payments due on October 18, three days after the Supreme Court ruling, according to the report.\n\nIn a letter to Axis Trustee Services Ltd, reviewed by Reuters, investors sought clarity on the status of the coupon payments and urged the debenture trustee to intervene.\n\n\u201cWe call upon the Trustee to obtain immediate written confirmation from Yes Bank as to whether this coupon has been paid, cancelled, or remains outstanding,\u201d the bondholders said.\n\nThe sources, however, said the bond documentation gives the bank discretion over coupon payments and that the issue can only be considered once the AT-1 bonds are reinstated on the bank\u2019s balance sheet.\n\nLast week, the Supreme Court upheld the Bombay High Court judgment against the write-down of Additional Tier-1 (AT-1) bonds worth \u20b9 8,415 crore, undertaken in March 2020 as part of the bank\u2019s reconstruction.\n\nThe verdict marks a significant victory for bondholders whose investments were cancelled during the bank\u2019s rescue six years ago.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 05:47 PM IST", "pub_date_relative": "26m ago"}, {"title": "Lyft and Baidu to launch driverless taxi service in London in 2027", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:47 PM IST", "pub_date_relative": "27m ago"}, {"title": "Oil hits $115 for first time since May as global stocks knocked by AI fears", "full_content": "Markets face twin threats of surging crude prices and concern over durability of AI boom", "source": "FT Markets", "pub_date_str": "23 Oct 2026, 05:46 PM IST", "pub_date_relative": "28m ago"}, {"title": "My spouse was awarded $90,000 from my 401(k) in our divorce. How is that fair?", "full_content": "\u201cI retired in 2020 and subsequently went through a divorce a few years later.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "23 Oct 2026, 05:46 PM IST", "pub_date_relative": "28m ago"}, {"title": "Here are Friday's biggest analyst calls: Nvidia, SpaceX, CoreWeave, Deckers, Unusual Machines & more", "full_content": "Here are the biggest calls on Wall Street on Friday.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 05:45 PM IST", "pub_date_relative": "28m ago"}, {"title": "Why is LKQ stock crashing today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:45 PM IST", "pub_date_relative": "28m ago"}, {"title": "Higher interest rates have made family offices pickier about investing in real estate", "full_content": "A version of this article appeared in CNBC's Inside Wealth newsletter, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions, straight to your inbox.\n\nHigher interest rates have made family offices more selective about investing in real estate, with many focusing on highly discounted properties and assets with strong pricing power, chief investment officers told CNBC.\n\nRob Haugen of Michels Family Office said uncertainty over where interest rates are headed has made the firm pickier about investing in the asset class. Haugen oversees private capital investments, mergers and acquisitions at the family office and is also the chief investment officer of its spinout firm River1 Asset Management.\n\n\"Honestly, until we have really strong conviction that rates are headed back down, it's difficult for us to want to do anything except the really special project,\" he said.\n\nHaugen said he typically targets opportunities with potential yields on cost in the high single-digit or double-digits. This is possible with buying an office building at a heavy discount with a known tenant that will occupy a lot of the real estate, he said. Another opportunistic avenue is big-box retail spaces, he said. About a year and a half ago, the family office bought a Kohl's near Milwaukee with an investor consortium, according to Haugen.\n\nJoel Houck, chief investment officer of HB Wealth, said that he has seen an uptick in interest from large family offices in real estate and real assets more broadly, such as industrial warehouses, farmland and timberland. Certain types of real estate and real assets offer protection against inflation, he said, which is a top concern for many family offices.\n\nInvestors can also get more bang for their buck as these assets are tax-efficient, according to Houck.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 05:45 PM IST", "pub_date_relative": "29m ago"}, {"title": "First Hawaiian stock dips 2% on third-quarter earnings miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:44 PM IST", "pub_date_relative": "29m ago"}, {"title": "First Hawaiian earnings missed by $0.07, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:44 PM IST", "pub_date_relative": "30m ago"}, {"title": "Is Netflix stock a buy at 52-week lows?", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:43 PM IST", "pub_date_relative": "30m ago"}, {"title": "Westlife Foodworld Q2 FY27 slides: double-digit growth returns", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:43 PM IST", "pub_date_relative": "30m ago"}, {"title": "BofA Names Preferred Picks Among European Chipmakers Ahead of Earnings", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:43 PM IST", "pub_date_relative": "31m ago"}, {"title": "Brazil consumer prices rise 0.32% in mid-October", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:43 PM IST", "pub_date_relative": "31m ago"}, {"title": "Click Holdings reports 62% revenue jump to HK$135.2 million", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Oct 2026, 05:42 PM IST", "pub_date_relative": "31m ago"}, {"title": "10-year Treasury yield drops back to 5% this week as investors seek cover from AI worries", "full_content": "Investors ran for cover this week as artificial intelligence fears hit stocks, driving the 10-year Treasury below 5%.\n\nThe benchmark yield stayed below 5% on Friday, after falling beneath that level Thursday for the first time in a month as investors continued to express misgivings over the massive debt being taken on by technology companies to finance their build out of AI networks. Tech stocks sank, bond yields on outstanding tech debt rose and spreads on credit default swaps widened in a host of AI companies.\n\n\"The selloff in tech stocks drove the flight-to-quality bid, compounded by continued weakness in the French sovereign market,\" BMO's credit strategy team said in a note Friday. \"Interestingly, the focus on weakness in the equity market ... [has] overshadowed the move in the energy market, with Treasuries rallying despite WTI crude oil testing $100/bbl.\"\n\nOn Friday, yields on 10-year U.S. Treasurys \u2014 used to price mortgages, auto loans and credit card debt \u2014 rose by 4 basis points to 4.997%.\n\nThe yield on the 2-year Treasury note, which more closely follows short-term Federal Reserve policy, increased by 5 basis points to 4.692%. Yields on longer-dated 30-year U.S. Treasurys \u2014 which react to geopolitical developments \u2014 were up 3 basis points to 5.31%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nWith the Federal Reserve's interest rate decision due next week, traders will also look to Friday's flash S&P Global PMI readings on manufacturing and services for a fresh view on U.S. growth and inflation.\n\nWest Texas Intermediate futures for December delivery advanced 1.16% to $100.61 a barrel on Friday, while Brent crude , the international oil benchmark, traded 0.79% higher, at at $114.06 a barrel.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 05:42 PM IST", "pub_date_relative": "32m ago"}, {"title": "Fewer people are flying as airfare soars. Here's why airlines aren't worried", "full_content": "Fewer people are flying this year, but with airfare this high and climbing , airline executives say that's just fine.\n\nThe number of people screened at U.S. checkpoints is on track for its first annual decline since 2020. Major U.S. carriers have said capturing higher fares is more important than fully filling their planes or flying record numbers of travelers.\n\n\"We're actively prioritizing yield versus load factor and really happy as we see it. It fits right in with the premium investments that we're making,\" American Airlines Chief Commercial Officer Nat Pieper said on the company's earnings call Thursday.\n\nAmerican's load factor, a gauge of how full planes are flying, fell to 83.4% in the third quarter from 86% in the same quarter of 2025.\n\nThe price of plane tickets has skyrocketed as airlines grapple with a spike in jet fuel prices, their biggest expense after labor, and pass more of those costs on to customers.\n\nFares in September were up more than 22% from a year earlier, according to the latest inflation read. Fare tracker Hopper said it expects this holiday season to come with the most expensive ticket prices in years.\n\nThe average Southwest Airlines fare in the third quarter, for example, was $231.69, up close to $50 from a year earlier. That doesn't include Southwest's new fees, like its extra charges for checked bags or a seat closer to the front of the plane.\n\nThe airline's count of revenue passengers, however, fell 3.2% from a year ago, to about 33.5 million people.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 05:41 PM IST", "pub_date_relative": "32m ago"}, {"title": "US Stock Market Live Updates: US stocks future edge lower after AI selloff, telecom slide", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Stock Market Live Updates: US stocks future edge lower after AI selloff, telecom slide Powered By LIVE BLOG US Stock Market Live Updates: US stocks future edge lower after AI selloff, telecom slide 23 Oct 2026 | 05:51:20 PM IST Stock Market Today Live Synopsis Dow Jones | Nasdaq | Stock Market Live: Wall Street futures edge lower as concerns over AI spending weigh on technology stocks, while telecom shares slide on fears of increased competition from SpaceX. Investors focus on upcoming earnings from Microsoft, Alphabet and Amazon, while rising oil prices add to inflation concerns.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 05:39 PM IST", "pub_date_relative": "34m ago"}, {"title": "On the ground at Nvidia's AI showpiece: Jensen-mania, robot ducks and neocloud distress", "full_content": "This report is from this week's The Tech Download newsletter. Like what you see? You can subscribe here.\n\nNvidia's GTC in Berlin was the grand finale of a week-and-a-half whistle stop European tour. Huang met with world leaders \u2014 including U.K. Prime Minister Andy Burnham, French President Emmanuel Macron and German Chancellor Friedrich Merz \u2014 announced new products and even spent time talking to small robot ducks on stage.\n\nThe Nvidia chief must be tired. At a media Q&A on Thursday morning, he gave reporters an insight into his mantra. Talking about bringing data centers online faster, Huang said: \"Try less sleep, which is what I do.\"\n\nAnd the trip's not over for Huang. Today, he's in Kazakhstan, touting the country's potential as a major AI hub.\n\nAmid all the activity in Germany, I spent two days in Berlin running around meeting with neocloud execs, investors and data center builders and suppliers.\n\nThe final day of the conference came amid a selloff among public neocloud stocks. CoreWeave ended the day down 10% and Nebius dropped 7% by market close.\n\nIt continued a tumultuous period for companies leasing AI compute, with many of their stocks plummeting on concerns over heavy borrowing .\n\nHuang \u2014 perhaps unsurprisingly considering Nvidia's sizeable stakes in many of those companies \u2014 was more bullish.", "source": "CNBC World Economy", "pub_date_str": "23 Oct 2026, 05:38 PM IST", "pub_date_relative": "36m ago"}, {"title": "India's 10-year bond falls for 10th week in record slump", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India's 10-year bond falls for 10th week in record slump Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India's 10-year bond falls for 10th week in record slump SECTIONS India's 10-year bond falls for 10th week in record slump Reuters Last Updated: Oct 23, 2026, 05:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds have experienced their worst decline in thirty years, falling consecutively for ten weeks. Rising crude oil prices and a hawkish central bank stance have impacted the market negatively. The benchmark repo rate was recently raised to 5.5%, with further increases expected. The 2036 bond yield rose to 7.4740%, indicating a broader trend of increasing yields. These developments may significantly affect India's import bill and inflation outlook.\n\nIndian government bonds have experienced their worst decline in thirty years, falling consecutively for ten weeks. Rising crude oil prices and a hawkish central bank stance have impacted the market negatively. The benchmark repo rate was recently raised to 5.5%, with further increases expected. The 2036 bond yield rose to 7.4740%, indicating a broader trend of increasing yields. These developments may significantly affect India's import bill and inflation outlook.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 05:36 PM IST", "pub_date_relative": "38m ago"}, {"title": "Despite global tensions, India\u2019s business sentiment rebounds in Q2 FY27: NCAER", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Despite global tensions, India\u2019s business sentiment rebounds in Q2 FY27: NCAER The Economic Times daily newspaper is available online now. Read Today's Paper Despite global tensions, India\u2019s business sentiment rebounds in Q2 FY27: NCAER SECTIONS Despite global tensions, India\u2019s business sentiment rebounds in Q2 FY27: NCAER ET Online Last Updated: Oct 23, 2026, 05:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's Business Confidence Index has risen to 107.8 in the second quarter of this fiscal year. The survey included 502 companies across six major cities, reflecting both large firms and MSMEs. All four key parameters evaluated by the index showed gains when compared to the previous quarter. NCAER indicated that confidence improved in expectations of economic conditions and financial health.\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "23 Oct 2026, 05:35 PM IST", "pub_date_relative": "38m ago"}, {"title": "Infosys ADRs crash 6% after Q2 results as revenue guidance cut spooks investors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Infosys ADRs crash 6% after Q2 results as revenue guidance cut spooks investors Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Infosys ADRs crash 6% after Q2 results as revenue guidance cut spooks investors SECTIONS Infosys ADRs crash 6% after Q2 results as revenue guidance cut spooks investors By Akash Podishetti , ETMarkets.com Last Updated: Oct 23, 2026, 05:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Infosys ADRs fell 6.3% after the company lowered FY27 revenue growth guidance to 1-2%, despite September-quarter revenue beating estimates. Profit missed expectations, while large deal wins and AI revenue growth offered support amid cautious technology spending.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 05:33 PM IST", "pub_date_relative": "40m ago"}, {"title": "KKR founders back Valencia in deal valuing football club at \u20ac1.25bn", "full_content": "Family offices of KKR co-founders George Roberts and Henry Kravis are part of consortium that has agreed to take 42% stake in Spanish team", "source": "FT Markets", "pub_date_str": "23 Oct 2026, 05:32 PM IST", "pub_date_relative": "42m ago"}, {"title": "FMCG stocks to buy: Anand Rathi names Marico, GCPL, Asian Paints, Mrs Bector Food - check ratings and target prices", "full_content": "Indian FMCG stocks could see an improvement in earnings growth over the next two financial years, according to Anand Rathi Research, which has identified Marico, Godrej Consumer Products (GCPL), Mrs Bector Food and Asian Paints as its preferred picks across the staples and discretionary segments.\n\nThe brokerage expects its coverage universe of 16 companies to deliver around 10% revenue compound annual growth rate (CAGR) and 15% earnings CAGR over FY26-28, signalling an improvement from the subdued growth recorded in FY25 and FY26.\n\n\u201cWe expect our coverage universe, consisting of 16 companies, to clock ~10% revenue CAGR over FY26-28e driving ~15% earnings CAGR (vs. 4/7% YoY revenue growth and -3/5% earnings growth in FY25/26),\u201d Anand Rathi Research said in its report.\n\nThe brokerage\u2019s preferred picks cover consumer staples and discretionary businesses. Its recommendations come amid mixed trends in the sector, with several stocks facing pressure even as the brokerage anticipates stronger earnings growth over FY26-28.\n\nThe brokerage projected earnings per share (EPS) of \u20b9 17.3 for FY27 and \u20b9 19.8 for FY28. Its estimated price-to-earnings (P/E) multiple stood at 44.6 times FY27 earnings and 38.9 times FY28 earnings.\n\nAnand Rathi estimated EPS of \u20b9 24.3 for FY27 and \u20b9 28.9 for FY28, with its forward P/E multiple expected to decline from 35.3 times to 29.7 times.\n\nIts EPS was projected at \u20b9 55.6 for FY27 and \u20b9 63.6 for FY28. The corresponding estimated P/E multiples were 41.8 times and 36.5 times.\n\nThe brokerage forecast EPS of \u20b9 5.8 for FY27 and \u20b9 7.1 for FY28, with the P/E multiple expected to ease from 35 times to 28.5 times.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 05:32 PM IST", "pub_date_relative": "42m ago"}, {"title": "Jetmaker Bombardier doubles down on US investment in deal touted by Trump - Fox Business", "full_content": "Jetmaker Bombardier doubles down on US investment in deal touted by Trump Fox Business See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "23 Oct 2026, 05:31 PM IST", "pub_date_relative": "43m ago"}, {"title": "Market wrap: Eternal, Apollo Hospital, Shriram Finance, Adani Enterprises among top gainers and losers on Nifty and Sensex on Friday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Market wrap: Eternal, Apollo Hospital, Shriram Finance, Adani Enterprises among top gainers and losers on Nifty and Sensex on Friday Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Market wrap: Eternal, Apollo Hospital, Shriram Finance, Adani Enterprises among top gainers and losers on Nifty and Sensex on Friday SECTIONS Market wrap: Eternal, Apollo Hospital, Shriram Finance, Adani Enterprises among top gainers and losers on Nifty and Sensex on Friday By Kumar Gaurav , ETMarkets.com Last Updated: Oct 23, 2026, 05:30:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity markets fell for a fourth consecutive session, with the Nifty 50 closing at 22,600 and Sensex at 73,123.83. Small-cap, mid-cap and metal stocks slumped as bearish technical signals heightened concerns about further selling pressure.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 05:30 PM IST", "pub_date_relative": "43m ago"}, {"title": "Volvo Cars plunges 26% as CEO says China sales slump came 'faster than we thought'", "full_content": "Volvo Cars said Friday it plans to cut 2,500 jobs after a sharp decline in its Chinese market weighed on third-quarter earnings.\n\nThe Swedish automaker reported an operating loss of 5.6 billion Swedish kronor ($563.7 million) in the third quarter, down from an operating profit of 6.4 billion Swedish kronor in the previous period.\n\nThe company, which is owned by China's Geely Holding, cited a deteriorating environment led by \"tougher\" market conditions in China and the U.S., which \"negatively affected free cash flow.\"\n\n\"It's really a lot about the Chinese market, of course, where the change has come faster than we thought, and really now we can see that selling global cars developed in Europe and China will not work, and then this is affecting all the Western players in China,\" Volvo Cars CEO H\u00e5kan Samuelsson told CNBC on \"Squawk Box Europe,\" on Friday.\n\nChinese consumers are now looking for \"domestic alternatives,\" which have become stronger and more competitive, the CEO said. \"We need a new strategy in China... it has to be a more regional structure, a more empowered region, and we need regionally adapted cars.\"\n\nHe added that costs must be competitive and that Volvo Cars needs to share some platforms with its Chinese parent company Geely, and develop key software in China that includes infotainment and driver-assistance systems. \"If you don't have that, I think you cannot sell cars in China.\"\n\nVolvo Cars' revenues in China fell almost 50% year-on-year as premium brands faced \"hypercompetition\" from new Chinese rivals, which also put severe pressure on pricing, the company said.\n\nMeanwhile, in the U.S., the automaker cited negative effects from tariffs and fewer customer incentives to buy electric cars, putting pressure on profit margins.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 05:28 PM IST", "pub_date_relative": "45m ago"}, {"title": "Stocks making the biggest moves premarket: AT&T, SpaceX, Moderna, Deckers, Bloom Energy and more", "full_content": "These are the stocks posting the largest moves in early trading.", "source": "CNBC Top News", "pub_date_str": "23 Oct 2026, 05:28 PM IST", "pub_date_relative": "46m ago"}, {"title": "Jio IPO becomes first public issue globally to cross 1 crore applications; record puts spotlight on depth of India\u2019s retail investor base", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio IPO becomes first public issue globally to cross 1 crore applications; record puts spotlight on depth of India\u2019s retail investor base Bharat Coking Coal Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO becomes first public issue globally to cross 1 crore applications; record puts spotlight on depth of India\u2019s retail investor base SECTIONS Jio IPO becomes first public issue globally to cross 1 crore applications; record puts spotlight on depth of India\u2019s retail investor base ET Special Last Updated: Oct 23, 2026, 05:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms has achieved a remarkable milestone, garnering over one crore applications for its upcoming initial public offering. This surge signifies a burgeoning interest from India's retail investors in technology sectors. With the IPO set to debut on October 28, maintaining this enthusiasm is crucial. The communication strategies employed mirror those found in consumer marketing, urging potential investors to evaluate their financial objectives carefully before engaging with the IPO.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Oct 2026, 05:26 PM IST", "pub_date_relative": "47m ago"}, {"title": "Small-cap stock under \u20b950 with 1:5 stock split, 1:1 bonus share history: Rights issue announced for \u20b9160 crore value", "full_content": "1:5 Stock split | 1:1 Bonus shares | Rights issue: Small-cap stock under \u20b9 50 Kelton Tech Solutions Ltd, which traded 1:5 stok split last year, has declared rights issue not exceeding \u20b9 160 crore. The AI-led digital transformation and technology consulting company is yet to declare a record date for the same, but the company board has approved the Draft Letter of Rights Offer. The company announced last week in an exchange filing that it would disclose the rights issue record date, entitlement ratio, and other details in due course. Shares of the company are available at \u20b9 11 per share.\n\nAs mentioned above, the AI-led digital transformation and technology consulting company informed the Indian exchanges about the rights issue size but reserved the announcement of record date and other details, saying, \"The Board of Directors have also approved the Draft Letter of Offer. Further, the Board of Directors will, inter alia, decide the terms and conditions of the Rights Issue, including but not limited to the determination of the issue price, rights entitlement ratio, record date, timing of the Rights Issue and terms of payment and other related matters.\u201d\n\nThis means the company has decided the size of the Kelltton Tech Solutions rights issue won't exceed \u20b9 160 crore. The rest of the information, such as the rights issue record date, subscription date, entitlement ratio and eligibility, and the purpose of the issue, will be decided and communicated later.\n\nAccording to information available on the official BSE website, Kelton Tech Solutions shares traded ex-date on 25 July 2025 to finalise the list of eligible shareholders for the stock subdivision. The company's board declared a 1:5 stock split, and the record date was set for 25 July 2025.\n\nAccording to information available on the official BSE website, Kelton Tech Solutions shares traded ex-date on 27 March 2018 to finalise the list of eligible shareholders for the issuance of bonus shares.", "source": "LiveMint Markets", "pub_date_str": "23 Oct 2026, 05:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "Insurance regulation: Reform must strengthen the market, not weaken its foundations", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nProposals to restructure commissions paid to insurance intermediaries raise a fundamental question: will reform strengthen insurance, or weaken the system that makes protection accessible?\n\nBefore liberalization, insurance operated largely under public ownership. Competition, innovation and awareness were limited, penetration was low, and distribution infrastructure struggled to reach India\u2019s diverse population.\n\nInsurance is built on trust: policyholders pay today for a promise that may be fulfilled years later. Benefits and exclusions require explanation. Agents became central to life insurance, while general insurance focused more on commercial and compulsory requirements.\n\nPrivate participation aimed to create a competitive, professionally managed and financially sound market. Since competitors would also benefit from greater public awareness, no insurer could bear that cost alone. Development therefore became part of the regulator\u2019s mandate.\n\nLiberalization strengthened agency through training, licensing and supervision, and introduced brokers to assess risks, compare products and secure suitable protection. Agents represented insurers; brokers were conceived as independent professionals representing policyholders, though paid by insurers. Their distinct roles justified different regulatory requirements.\n\nThis distinction supported a policyholder-oriented market. Equal treatment should apply to equivalent risks, not erase differences in independence and accountability.\n\nThe proposals assume that lower commissions and management expenses will make insurance more affordable and improve penetration. That requires evidence. Distribution expenditure is not automatically wasteful: it funds customer acquisition, advice, renewals and claims assistance , especially for small businesses, rural households and first-time buyers.", "source": "LiveMint Money", "pub_date_str": "23 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "India\u2019s forex reserves fall $5 billion to $721.02 billion as of October 16", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India\u2019s forex reserves fall $5 billion to $721.02 billion as of October 16 The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s forex reserves fall $5 billion to $721.02 billion as of October 16 SECTIONS India\u2019s forex reserves fall $5 billion to $721.02 billion as of October 16 ET Online Last Updated: Oct 23, 2026, 05:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's foreign exchange reserves fell by $5 billion to reach $721.02 billion for the week ending October 16. Previously, reserves declined by $8.578 billion to an amount of $726.027 billion. The decline in reserves reflects ongoing economic conditions impacting forex stability within the country. This trend indicates a
