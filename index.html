<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Wall Street Boom! US stocks attract massive $2.1 trillion inflows since 2020; Asia, Europe lag behind - Kobeissi Letter", "full_content": "The Kobeissi Letter : Global investors have continued to favour US equities, with American stock funds attracting an unprecedented $2.1 trillion in inflows since 2020, highlighting Wall Street's enduring appeal as an investment destination.\n\nThe flow of money has accelerated in recent years, with investors allocating $1.5 trillion to US equity funds since the beginning of 2024 alone, according to market commentary shared by The Kobeissi Letter.\n\nThe scale of these investments has significantly outpaced flows into other major regions. US equity funds have attracted 4.5 times the inflows recorded by emerging market Asia equity funds over the same period, while European equity funds have witnessed substantial withdrawals. The trend points to a pronounced preference for US stocks among global investors, even as equity markets across regions compete for capital.\n\nEmerging market Asia equity funds attracted $470 billion in inflows, considerably lower than the amount received by US-focused funds. The difference underlined the extent to which global investors have favoured American equities over emerging market Asian stocks.\n\nEuropean equity funds, meanwhile, recorded outflows worth $246 billion, with investors withdrawing capital rather than adding to their allocations.\n\n\u201cAt the same time, European equity funds have posted -$426 billion in outflows. Meanwhile, global equity funds attracted +$89 billion last week, bringing 4-week inflows to a record +$266 billion,\u201d it said.\n\nThe divergence in fund flows illustrated how investment preferences have remained concentrated on the US market. While emerging market Asia continued to attract fresh money, its inflows were substantially smaller than those into American equities. Europe, in contrast, faced net withdrawals over the period highlighted.\n\nThe trend also suggested that the preference for US stocks was not limited to a short-term burst of buying.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:57 PM IST", "pub_date_relative": "3m ago"}, {"title": "FPIs return to India stock markets with \u20b953.7k cr inflows in Nov so far - Attraction point for investors? What's next?", "full_content": "Foreign portfolio investors (FPIs) have made a strong comeback to Indian equity markets in November, pumping in \u20b9 53,739 crore so far, according to the latest NSDL data. The inflows mark a sharp turnaround after sustained selling pressure through much of 2026, with FPIs remaining net sellers in eight of the first ten months of the year.\n\nThe latest buying has helped narrow the cumulative net outflows from Indian equities to \u20b9 2.41 lakh crore in 2026. FPIs had withdrawn \u20b9 35,962 crore in January, followed by net inflows of \u20b9 22,615 crore in February. However, selling intensified in March, with outflows of \u20b9 1.18 lakh crore, and continued through June. July and August briefly brought some relief, with inflows of \u20b9 20,200 crore and \u20b9 29,631 crore, respectively, before foreign investors returned to selling in September and October.\n\nNovember's strong inflows raise the question of whether foreign investors are turning more positive on Indian equities after a prolonged period of caution.\n\nDr V K Vijayakumar, Chief Investment Strategist at Geojit Investments Limited, said Indian equities witnessed a sharp reversal in institutional activity last week, with foreign portfolio investors (FPIs) turning aggressive buyers while domestic institutional investors (DIIs) emerged as net sellers on all trading days.\n\nThe aggressive FPI buying triggered a short squeeze, pushing the Nifty up 7.58% in a week, he said.\n\nAccording to Vijayakumar, the sudden shift in FPI sentiment was partly driven by the sell-off in artificial intelligence (AI)-related stocks in the US and other markets, including South Korea, Taiwan and Japan. Concerns over spending on data centres in the US contributed to the sell-off, while political developments following the US midterm elections added to uncertainty around future AI investments.\n\n\u201cThe AI sell-off has made India, which is widely regarded as a non-AI trade, attractive for FPIs.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:55 PM IST", "pub_date_relative": "5m ago"}, {"title": "FDA warns of vision loss risk linked to popular GLP-1 drugs like Wegovy, Zepbound", "full_content": "The U.S. Food and Drug Administration is requiring new safety warnings on all GLP-1 drugs after finding evidence of a potential increased risk of a rare eye condition, the agency said on Monday.\n\nThe condition, which can cause sudden vision loss, known as nonarteritic anterior ischemic optic neuropathy (NAION), is rare, and a causal relationship has not been established.\n\nThe FDA is requiring the makers of all GLP-1 medications to add a warning about the potential increased risk of NAION associated with use of these medications, it said.\n\nNAION is a condition that can result in sudden decreased vision, including permanent vision loss. It is caused by decreased blood flow to the front part of the \u200boptic nerve \u2014 the underlying cause is not completely understood, however.\n\nNAION cases have been reported for all currently marketed GLP-1 products, the FDA said.\n\nCNBC has reached out to Ozempic and Wegovy maker Novo Nordisk and Eli Lilly, the company behind Mounjaro, Zepbound and Foundayo, for comment.\n\nThe FDA decision follows a review of clinical trials, real-world patient data, and published studies.\n\nAn analysis of 126 trials involving more than 134,000 patients found 6.4 cases of NAION per 100,000 patient-years among GLP-1 users, compared with 3.8 among patients receiving other treatments or placebos.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:52 PM IST", "pub_date_relative": "8m ago"}, {"title": "Q2 Results Live: Hind Rectifiers Profit Falls 54%, MRF Profit Slips 28%; Kalyan Jewellers, Cochin Shipyard Also In Focus", "full_content": "Kalyan Jewellers India, MRF, Cochin Shipyard, and Avanti Feeds are among the 44 companies scheduled to announce their Q2 FY27 results. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:45 PM IST", "pub_date_relative": "15m ago"}, {"title": "S&P 500 futures rise as traders brace for crucial consumer inflation report: Live updates", "full_content": "U.S. stock futures were largely higher early Tuesday as traders awaited a pivotal consumer inflation report.\n\nS&P 500 futures added 0.23%, while futures tied to the Dow Jones Industrial Average were up 258 points, or 0.49%. Nasdaq-100 futures hovered just above the flatline.\n\nIn Asia, South Korea's Kospi surged 4.3%, while Japan's Nikkei 225 added 2.89%. Hong Kong's Hang Seng Index rose 0.42%, and mainland China's CSI 300 added 0.26%. Australia's S&P/ASX 200 gained 1.27%\n\nDuring the regular U.S. trading day, the Dow Industrials gained 1,104 points, or 2.2%, while the S&P 500 popped about 2.4%. The Nasdaq Composite rose 2.7%. Monday's rally came after a rocky week for markets, in which traders grew concerned about the potential for a slowdown in data center buildouts after Democrats posted big victories in the midterm elections.\n\nWhile the tech sector rebounded in Monday's regular trading, Nvidia sat out the rally.\n\nShares of the chipmaker slid 4% after Nvidia CEO Jensen Huang admitted on Sunday to having an affair with a woman who U.S. intelligence officials, according to The New York Times, say is a spy for China's Ministry of State Security. The company's board of directors also launched an independent internal investigation , pointing to recent reporting that Huang \"has been the target of a foreign intelligence effort.\"\n\nOil prices also fell on Monday, lending the market support. The U.S. West Texas Intermediate futures settled down more than 4%, while Brent crude futures slid more than 5%.\n\nInvestors are awaiting the October consumer price index report due on Tuesday. Economists polled by Dow Jones see headline CPI growing at a rate of 0.3% and core CPI, which excludes volatile food and energy costs, rising 0.2% from the prior month.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:43 PM IST", "pub_date_relative": "17m ago"}, {"title": "FIIs Sold Almost Everything In India. These Sectors Still Made The Cut", "full_content": "FIIs sold $2.2 billion worth of Indian equities in October, following the sharp sell-off in September. However, the pace of outflows was lower than the previous month, with FII activity recovering in the second half of October.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:42 PM IST", "pub_date_relative": "19m ago"}, {"title": "SoftBank swings to $7 billion net loss in second quarter as tech selloff weighs on results", "full_content": "SoftBank reported a fiscal second-quarter net loss of 1.12 trillion yen ($7 billion) on Tuesday, as investment losses and higher financing costs weighed on earnings.\n\nThe Japanese investment giant also recorded a 597.2 billion yen loss in the six-month period due to changes in procurement plans for power generation equipment for AI data center projects in the U.S.\n\nRevenue rose 13.3% in the six months ended Sept. 30, supported by growth in telecommunications and AI computing businesses. The company said its SoftBank segment recorded higher sales across all businesses, while revenue at its AI computing segment increased.\n\nThe company's Vision Fund segment swung to a loss of 81.58 billion yen in the fiscal second quarter, compared with a profit of 2.38 trillion yen a year earlier. Vision Fund 1 recorded an investment loss of $20 million in the quarter, despite a $1.3 billion gain on ByteDance, as shares of publicly traded portfolio companies, including Coupang and Grab, declined.\n\nThe Vision Funds segment recorded investment gains of 85.45 billion yen, down sharply from 2.81 trillion yen in the year-earlier period. Vision Fund 2 posted investment gains of 89.26 billion yen, while Vision Fund 1 recorded a loss of 3.86 billion yen on its investments.\n\nAs of the end of September, SoftBank's cumulative investment in OpenAI stood at $54.6 billion, with a fair value of $99.6 billion and a cumulative investment gain of $45 billion, according to the company.\n\nShares of the Japanese investment giant closed 13.9% higher on Tuesday. The gains came as Asian technology stocks, including Samsung Electronics and SK Hynix, rose following an overnight rebound on Wall Street.\n\nSoftBank shares this year Ahead of its earnings release, SoftBank Group announced on Monday plans with Grab and Malaysia's PETROS to commit a combined $1.85 billion in initial capital to develop AI infrastructure in Malaysia, with a long-term target of at least five gigawatts of AI computing capacity.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 01:41 PM IST", "pub_date_relative": "19m ago"}, {"title": "NICL AO Prelims Admit Card For 2026 Released; Exam To Be Held On November 17", "full_content": "The preliminary examination of National Insurance Company Limited for Administrative Officer will be held on November 17, 2026.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:40 PM IST", "pub_date_relative": "20m ago"}, {"title": "Earnings call transcript: Premier posts strong H1 2026 results as stock rises 5.8%", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:40 PM IST", "pub_date_relative": "20m ago"}, {"title": "Scandic Hotels\u2019 Q3 profit rises 22% on Dalata fees", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:36 PM IST", "pub_date_relative": "24m ago"}, {"title": "US consumer prices expected to have risen at slower pace in October", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:36 PM IST", "pub_date_relative": "24m ago"}, {"title": "SoftBank Group shares surge 14% as Asian tech stocks track Wall Street rebound", "full_content": "Asian technology stocks surged Tuesday, tracking a rebound on Wall Street overnight as a sharp decline in oil prices lifted sentiment while renewed buying in chip names spilled over into Asia, following last week's bruising sell-off.\n\nJapan's technology investment giant SoftBank Group rose 13.88%, while chip-testing equipment maker Advantest gained 4.63%.\n\nSemiconductor equipment maker Tokyo Electron rose over 6.05%, while Lasertec and Disco advanced 7.73% and 6.81%, respectively.\n\nStock performance so far this year South Korean chipmaker SK Hynix jumped 6.69%, while Samsung Electronics rose 4.74%. Samsung SDI climbed 9.88%. Taiwan's TSMC added 2.24%.\n\nThe gains followed a strong session on Wall Street, where the tech-heavy Nasdaq Composite climbed 2.74%, while the S&P 500 rose 2.35% to clock its best day since April 8.\n\nThe recovery came after a steep sell-off in global technology stocks last week, fueled by concerns that Democrats' sweeping victory in the U.S. midterm elections could lead to tighter restrictions on data-center development, potentially impacting demand for artificial intelligence chips and infrastructure.\n\n\"This is not to suggest that the tech sell-off is done and dusted. While there is some evidence that investors are taking advantage of last week's plunge to increase their exposure to chip and other AI-adjacent stocks, there's a danger that it may be a little bit premature to load up and 'buy the dip,'\" said David Morrison, senior market analyst at Trade Nation.\n\nBeyond the political uncertainty surrounding potential restrictions on data-center development, investors have also grown increasingly wary of the enormous capital expenditures required to build out AI infrastructure. Questions over how quickly those investments will translate into meaningful profits have weighed on sentiment toward companies across the semiconductor supply chain.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:36 PM IST", "pub_date_relative": "24m ago"}, {"title": "Oil falls as Trump downplays prospect of escalation with Iran", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:36 PM IST", "pub_date_relative": "24m ago"}, {"title": "Earnings call transcript: Infineon jumps on upbeat Q4 2026 outlook and AI demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:34 PM IST", "pub_date_relative": "26m ago"}, {"title": "M&S plans to double dividend, targets mid-to-high single-digit sales growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:34 PM IST", "pub_date_relative": "26m ago"}, {"title": "Mitsui Chemicals to Acquire JSR With Development Bank of Japan for $8.8 Billion - WSJ", "full_content": "Mitsui Chemicals to Acquire JSR With Development Bank of Japan for $8.8 Billion WSJ Mitsui Chemicals to buy chip materials firm JSR for $11.6 billion Reuters Mitsui Chemicals to Take Over Chip Linchpin JSR for $12 Billion Bloomberg.com Semiconductor Materials Market to Reach US$115.6 Billion openPR.com Mitsui Chemical Says It Will Sell Shares Worth Up To 150 Billion Yen To Help Finance Jsr Acquisition TradingView", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 01:33 PM IST", "pub_date_relative": "27m ago"}, {"title": "Why Gokaldas Exports shares will be in top focus tomorrow; what it said in exchange filing? Stock down over 5% in 5 days", "full_content": "Gokaldas Exports shares will remain in focus in Wednesday's trading session after disclosing that one of the customers of its step-down subsidiary has filed for bankruptcy protection under US laws.\n\nGokaldas Exports share price ended Monday's session on a weaker note, closing the day 3% down at \u20b9 678 per share.\n\nIn an exchange filing, the company said The Children's Place Inc., a customer of Atraco Industrial Enterprise FZE, a step-down subsidiary of Gokaldas Exports, has sought protection under Chapter 11 of the US Bankruptcy Code.\n\n\"We wish to inform that \u2018The Children's Place, Inc.\u2019, one of the customers of Atraco Industrial Enterprise FZE, a step-down subsidiary of Gokaldas Exports Limited (\"the Company\"), has filed for protection under Chapter 11 of the U.S. Bankruptcy Code in the United States,\" the company said in the filing.\n\nGokaldas Exports said Atraco Industrial Enterprise FZE had outstanding receivables of $4.11 million from The Children's Place as of the date of the disclosure. The company added that it is closely monitoring the developments and assessing the potential impact on its business operations and financials. It will take appropriate steps to address the matter.\n\n\u201cAs of the date of this disclosure, Atraco Industrial Enterprise FZE has an outstanding receivable of USD 4.11 Mn from The Children's Place, Inc. The Company is closely monitoring developments in this matter and is assessing the potential impact on its business and financials and will address it suitably,\u201d it added.\n\nAccording to a report by CNBC TV-18, Gokaldas Exports said it expects stronger growth in FY28, driven by its African operations and a higher contribution from acquired businesses.\n\nManaging Director and Vice-Chairman Sivaramkrishnan Ganapati said the restoration of duty-free access for African operations to the US has provided greater clarity to the business and triggered a sharp increase in customer enquiries, particularly for its Kenya operations.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:28 PM IST", "pub_date_relative": "32m ago"}, {"title": "Honda raises full-year outlook despite second-quarter profit slump", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:27 PM IST", "pub_date_relative": "33m ago"}, {"title": "Watches of Switzerland lifts outlook floor as US, UK demand stays strong", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:24 PM IST", "pub_date_relative": "36m ago"}, {"title": "Watches of Switzerland ups annual outlook on strong U.S., U.K. demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:24 PM IST", "pub_date_relative": "36m ago"}, {"title": "Dividend Stocks Record Date Alert 12 Nov Thursday: Bayer CropScience, HUL, ONGC, more; full list | Amount, key dates", "full_content": "GODFRYPHLP GPPL HINDUNILVR BAYERCROP Pranati Deva Published 10 Nov 2026, 01:22 PM IST Prefer Livemint on Google Dividend Stocks : Investors looking to earn dividend income have one final opportunity to buy shares of 13 companies that are set to trade ex-dividend on Thursday, November 12, 2026. Tomorrow, Wednesday, November 11, is the last day to buy these dividend stocks to become eligible for the upcoming payouts. The companies have announced dividends ranging from \u20b9 0.05 to \u20b9 90 per share, with several payments scheduled to reach eligible shareholders before the end of November or in early December.\n\nThe upcoming dividend payouts cover companies across multiple sectors, including FMCG, agrochemicals, energy, infrastructure and healthcare. Under India's T+1 settlement cycle, investors must purchase shares by November 11 to qualify for the dividends, as November 12 is the record date. Shareholders whose names appear in the company's records on the specified date will be eligible to receive the declared payouts.\n\nHere is a look at the dividend announcements, indicative yields, record dates, payment timelines and previous payout history of the companies.\n\nBayer CropScience has declared an interim dividend of \u20b9 90 per equity share for FY27, equivalent to a 900% payout on its \u20b9 10 face value. At the reference share price of \u20b9 3,246, the indicative dividend yield works out to approximately 2.77%. The record date is November 12, while the dividend is scheduled to be paid on or before November 30, 2026. The company had distributed \u20b9 150 per share in FY26 and \u20b9 125 in FY25.\n\nGodfrey Phillips India has announced an interim dividend of \u20b9 10 per share for FY27. At a reference price of \u20b9 1,772, the indicative yield is approximately 0.56%. The record date is November 12, with payment scheduled on or before December 4, 2026. The company has maintained a dividend-paying record for 20 consecutive years, distributing \u20b9 50 per share in FY26.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:22 PM IST", "pub_date_relative": "38m ago"}, {"title": "Fujiyama Q2 FY2027 slides: revenue doubles, solar cell expansion underway", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:20 PM IST", "pub_date_relative": "40m ago"}, {"title": "MRF Q2 Results: Net Profit Falls 28% To Rs 369 Crore, Declares Dividend; Check Record Date", "full_content": "Revenue from operations or top line surged 17.6% annually to Rs 8,524 crore in the September quarter of FY27, from Rs 7,250 crore a year ago.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:18 PM IST", "pub_date_relative": "42m ago"}, {"title": "8th Pay Commission: What Maruti 800, Zen And WagonR Tell Us About The Next Spending Cycle", "full_content": "Nilesh Shah of Kotak Mahindra AMC expects the pay revision to support premium consumption, with around 20 million government employees and pensioners potentially receiving salary arrears and higher pay.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:17 PM IST", "pub_date_relative": "44m ago"}, {"title": "Ramayana: Yash's Ravana Costumes Weighed Up To 33 Kg, Crown Alone Weighed 1.8 Kg", "full_content": "Yash\u2019s costumes as Ravana in Nitesh Tiwari\u2019s Ramayana weighed between 16 kg and 20 kg, with some outfits weighing up to 33 kg.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:16 PM IST", "pub_date_relative": "44m ago"}, {"title": "Vivo X500 Series India Launch: Expected Price, Features, Battery, Camera And Other Details", "full_content": "Vivo is set to launch its X500 series in India by late November 2026 with a notable price rise over the X300 series.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:07 PM IST", "pub_date_relative": "53m ago"}, {"title": "The Liver Doc Doubles Down On Deepinder Goyal Over Temple Device: 'No More Scientific Updates'", "full_content": "The Liver Doc, Dr Cyriac Abby Philips, questioned the science behind Deepinder Goyal's Temple wearable in an X post, raising doubts about its brain blood flow claims.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:05 PM IST", "pub_date_relative": "55m ago"}, {"title": "Bengaluru: CCB Raids Illegal Diwali Pool Party In Marathahalli Villa, Three Organisers Arrested", "full_content": "CCB police raided an illegal Diwali pool party in Bengaluru, arresting three organisers and seizing drugs, liquor, and prohibited hookah equipment.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:04 PM IST", "pub_date_relative": "57m ago"}, {"title": "Wrong details in PF account can delay your money; EPFO explains how to correct them online in 5 easy steps", "full_content": "Errors in your Employees\u2019 Provident Fund (EPF) account may create hurdles when you want to withdraw your provident fund savings, transfer your balance, or settle a claim.\n\nEven a minor mismatch in personal or employment-related information, such as your name, date of birth (DOB), gender, or other details, can lead to additional verification and delay the processing of your request.\n\nTo help members keep their records accurate, the Employees\u2019 Provident Fund Organisation (EPF) has highlighted its online Joint Declaration facility.\n\nIn a post shared on X on 9 November, EPFO mentioned that \u201cIncorrect details in your EPF records? Get them corrected easily in 5 simple steps through the Joint Declaration facility on the EPFO Member Portal. Update your details. Keep your EPF records accurate!\u201d\n\nThe facility allows members to initiate requests for correcting eligible information in their EPF records, including their name, date of birth, gender, and other personal or employment-related details by following five easy steps.\n\nEPF members can follow these five steps to submit their correction requests online:\n\nVisit the EPFO Unified Member Portal and log in using your Universal Account Number (UAN) and password. Ensure that you are accessing the official portal linked to your EPF account.\n\nAfter logging in, navigate to the Joint Declaration facility available on the member portal. This is the online facility through which members can initiate requests to rectify discrepancies in their EPF records.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Retail investors shed stocks, but crowd into Reliance, HDFC Bank", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSmall investors are becoming pickier about the stocks they own. In the September quarter, they reduced their stakes in nearly half of listed companies, even as Reliance Industries , HDFC Bank and PC Jeweller drew more retail shareholders.\n\nA Mint analysis of 4,729 BSE-listed companies showed retail ownership (those holding up to \u20b9 1 lakh in equity) declined in 49.4% of companies in Q2FY27, up from 47.5% in Q1FY27. The proportion recording an increase slipped to 42.4% from 43.2%, while 8.2% saw no change, according to ACE Equity data.\n\nVedant Gupte, co-founder and chief executive officer (CEO) of investment platform Trackk, interprets the divergence as portfolio pruning. \u201cWe read the September-quarter data as a clean-up of portfolios, not a loss of faith,\u201d he said.\n\nHe sees two strands of buying: established businesses at more attractive valuations, and riskier momentum or turnaround bets. The disclosures, however, do not establish whether the same investors moved money between these groups.\n\nFour companies together recorded more than a million net retail shareholder additions in the September quarter. Reliance led with 401,762, followed by HDFC Bank with 273,525, PC Jeweller with 242,298 and Cupid with 173,458. The additions may include investors holding multiple companies.\n\nBSE added 161,456 retail shareholders, while Coal India added 151,579. Elsewhere, Bajaj Auto lost 353,533, IDFC First Bank 138,832 and Wipro 103,653.\n\nGupte described BSE as a momentum bet and PC Jeweller as a turnaround opportunity, alongside investors buying established businesses after a correction.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Data Patterns shares surge 55% in 2026: Should you buy stock after Q2 results? What brokerages say: check target price", "full_content": "Dhanya Nagasundaram Published 10 Nov 2026, 12:50 PM IST Prefer Livemint on Google Data Patterns shares have surged nearly 55% in 2026 so far, with the defence electronics stock surging over 9% on Monday, 9 November, despite reporting a weak set of Q2 FY27 results. Strong order inflows and management's confidence in a better second half appear to have supported the stock's rally.\n\nThe company reported a 57% year-on-year drop in revenue to \u20b9 133 crore for the September quarter, while net profit declined 55% to \u20b9 22 crore. EBITDA margin, however, remained relatively stable at 23.3%.\n\nThe decline in revenue and profit was largely due to subdued execution during the quarter. However, a sharp increase in fresh orders provided some support. Data Patterns secured orders worth \u20b9 929.1 crore in Q2 FY27, marking a 475% jump from the corresponding period last year.\n\nThe company's order book stood at \u20b9 2,698 crore, with services accounting for 21%, development orders for 36% and production orders for the remaining 43%. While the robust order inflows have improved revenue visibility, execution will be key to converting this pipeline into growth.\n\nAccording to news reports, during its earnings call, Data Patterns' management expressed confidence in delivering a stronger performance in the second half of FY27, citing its healthy order book and expectations of improved execution.\n\nThe company has retained its FY27 guidance of 20\u201325% revenue growth and 35\u201340% EBITDA margins. This comes even as revenue declined 31% year-on-year in the first half of FY27 and EBITDA margin stood at 25%.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia, CEO Jensen Huang Face Shareholder Lawsuit Over Alleged China Spy Connection", "full_content": "Nvidia shares fell 4.3% on Monday, wiping out approximately $190 billion in market value, as the chipmaker faced a shareholder lawsuit over allegations involving CEO Jensen Huang.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 12:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Recovering From Burn Injury? Here's Why Proper Wound Care Is Essential", "full_content": "Burn injuries from fireworks require immediate cooling with clean water and prompt medical care to prevent complications and infections.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 12:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sensex, Nifty 50 rise over 6% in past 5 sessions: More rally from tomorrow or profit booking will dent returns hopes?", "full_content": "Sensex, Nifty 50 outlook : The Indian stock market is heading into Wednesday's trading session on a strong note, with the Sensex and Nifty 50 having surged over 6% in the past five trading sessions, raising hopes of further gains on Dalal Street. The benchmark indices have reclaimed crucial levels and climbed to their highest closing levels in more than eight months, supported by falling crude oil prices, renewed foreign investor buying and improving global sentiment.\n\nHowever, after a sharp rally, investors are now questioning whether the market can extend its gains or if profit booking will emerge at higher levels. The immediate trading direction will be closely linked to global market cues, crude oil movements, foreign institutional investor (FII) flows and upcoming inflation data.\n\nOn Monday, November 9, the Sensex advanced 107.25 points, or 0.13%, to close at 81,106.65, while the Nifty 50 gained 58.25 points, or 0.23%, to settle at 25,044.65. Both benchmarks ended at their highest closing levels since February 27, 2026. The Indian stock market remained closed on Tuesday, November 10, on account of Diwali-Balipratipada. Trading will resume on Wednesday, November 11.\n\nSeveral domestic and global factors have supported the recent recovery in Indian equities, helping benchmark indices register their strongest weekly performance.\n\nThe decline in international crude oil prices has emerged as one of the biggest catalysts for the Indian stock market rally. Brent crude prices fell nearly 14% last week to around $99 per barrel, easing concerns over India's import bill, inflation and corporate input costs.\n\nForeign investor buying has provided another major boost to domestic equities. Foreign investors have purchased Indian shares worth more than $4.1 billion so far in November, marking their biggest monthly inflows since September 2024.\n\nThe ongoing September-quarter earnings season has also supported investor sentiment.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Too big to fire", "full_content": "Should Jensen Huang stay or go?", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "LG Electronics is moving beyond its two-track strategy", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nLG Electronics India's September quarter (Q2FY27) performance has strengthened its growth narrative, even as the road ahead opens up new avenues.\n\nRevenue grew almost 20% year-on-year to \u20b9 7,380 crore, while Ebitda margin expanded 63 basis points to 9.5%. A richer product mix and operating leverage more than offset elevated commodity prices and higher go-to-market investments.\n\nLG\u2019s two-track strategy of premiumization and mass-premium penetration continued to deliver broad-based growth. Home appliances and air solutions revenue grew 21% to \u20b9 4,772 crore, with double-digit growth across washing machines, refrigerators and air conditioners. Home entertainment revenue grew 17% to \u20b9 2,608 crore, marking its third consecutive quarter of double-digit growth. Televisions larger than 55 inches led the segment, contributing over half of TV revenue.\n\nPremiumization through products such as French-door refrigerators and large-capacity washing machines can improve the product mix, even as LG\u2019s Essential series strengthens volume growth, helps capture first-time buyers, creates an upgrade pipeline for premium products and enables expansion into international markets.\n\nThe company\u2019s global presence has expanded to 68 countries, while its information display business has opened up B2B opportunities across corporate offices, retail, hospitality and public spaces.\n\nIts entry into vehicle solutions, spanning telematics, automotive displays, digital cockpits and connectivity solutions, opens up another B2B opportunity. Manufacturing at its Sri City facility can leverage LG\u2019s established global technology and manufacturing ecosystem.\n\nBut much depends on sustaining margins. Raw material costs have increased 20% from a year ago, leading to a 52-basis-point contraction in gross margin.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Trump says Iran war to end 'fairly soon,' plays down prospects of new strikes", "full_content": "U.S. President Donald Trump said on Monday that the war with Iran could end \"fairly soon,\" adding that Tehran was \"talking very politely\" with Washington.\n\nTrump told reporters in the White House Monday, after a meeting with Qatari Prime Minister Sheikh Mohammed bin Abdulrahman Al Thani, that \"We're seeing momentum toward the end of this conflict. I think it's going to be ending fairly soon.\"\n\n\"Iran militarily is effectively over,\" Trump said, citing the destruction of its navy and surging inflation that he said has hollowed out its economy.\n\nQatar, Saudi Arabia, UAE, Bahrain, Kuwait would \"prefer the status quo\" which involves maintaining the naval blockade against Iran and \"Operation Iron Gate\" \u2014 a task force announced on Saturday aimed at preventing Iran from using ground routes to transport advanced weapons and other materials \u2014 Trump said in a Truth Social post.\n\nHe reiterated that Iran would not be allowed to have a nuclear weapon and kept the door open for potentially resuming strikes should circumstances change. \"America is 'docked and loaded' and ready to go,\" he said, though caveating that new strikes were \"quite unlikely.\"\n\nThe conflict, now in its ninth month, has driven a surge in fuel prices, hitting nearly every sector of the global economy.\n\nThe U.S. had reportedly planned for a potential increase in naval forces in the Middle East in the run-up to the midterm elections, with Trump hinting at escalating the conflict after the results.\n\nThe administration has since toned down the war rhetoric after bruising midterm election results that saw Republicans lose both chambers of Congress as voters expressed frustration with soaring living costs stemming from the war.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 12:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asian Stocks to Rally on US Tech Surge, Oil Slump: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks to Rally on US Tech Surge, Oil Slump: Markets Wrap Bloomberg.com S&P 500 futures rise as traders brace for crucial consumer inflation report: Live updates CNBC Stock market today: Nasdaq surges despite Nvidia stock slide, Dow and S&P 500 rally as AI tech trade rises Yahoo Finance Nvidia, AMD, CoreWeave, Coherent, First Solar, Trade Desk, and More Stocks That Explain Today\u2019s Market Barron's Wall St jumps as oil slide cools inflation worries; Nvidia slumps Reuters", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 12:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "First Job, First Salary: Seven Money Decisions That Can Shape Your Financial Future", "full_content": "The convenience of a credit card can make it tempting to spend beyond your immediate means, particularly when you have just started earning.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 12:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anirudh Ravichander And Kavya Maran's Net Worth: A Look At Their Wealth and Careers Amid Wedding Reports", "full_content": "Anirudh Ravichander and Kavya Maran are reportedly set to tie the knot in Greece on November 10 and 11. Take a look at their estimated net worth.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 12:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "UPI charges after Diwali: Will customers pay extra on payments above \u20b92,000? NPCI's MDR rollout likely in Nov", "full_content": "With Diwali celebrations over and Bhai Dooj falling tomorrow, 11 November, attention is now turning to when the Merchant Discount Rate (MDR) on person-to-merchant (P2M) UPI transactions will come into effect.\n\nThe National Payments Corporation of India ( NPCI ) had earlier deferred the implementation beyond its original 15 October start date.\n\nIn an official statement issued on 13 October, NPCI said the revised charges would be implemented immediately after Diwali, with the effective date to be announced separately.\n\nHowever, the festive period is now drawing to a close, and merchants and customers are awaiting clarity on when the new MDR rules will take effect.\n\nNPCI, in its 13 October statement, said that the UPI and Services Steering Committee had decided to defer the rollout to avoid introducing additional transaction costs during the festive season.\n\nNPCI said, \u201cKeeping in mind the festive season, Merchant Discount Rate (MDR) on select Person-to-Merchant (P2M) UPI transactions, shall be implemented immediately post Diwali at a date to be notified separately.\u201d\n\nAccording to NPCI's FAQs released on 15 September, an MDR of 0.4% will apply to eligible P2M UPI transactions exceeding \u20b9 2,000. However, the charge will be capped at \u20b9 300 for transactions of \u20b9 75,000 and above.\n\nFor example, a merchant receiving a UPI payment of \u20b9 1 lakh would otherwise incur a 0.4% charge of \u20b9 400. However, with the prescribed cap, the MDR would be limited to \u20b9 300.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 12:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jensen Huang affair puts Nvidia's future at risk, with no clear successor to the renowned CEO", "full_content": "Nvidia CEO Jensen Huang 's admission of an affair with a purported Chinese spy has raised questions about his future at the company, and what happens if the 63-year-old co-founder, who built the chipmaker into one of the most valuable businesses on the planet, is forced out.\n\nShares of Nvidia sank more than 4% on Monday, even as the broader market rallied sharply, after Huang acknowledged the affair in a message to staff on Sunday, and said that the board was launching an investigation into whether he was targeted by a foreign intelligence agency. The board said it has \"confidence in Jensen,\" and that it has \"no reason to believe that either national security or Nvidia secrets were compromised.\"\n\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\n\nWhile Nvidia says Huang will continue to lead the company during the probe, pressure is rapidly mounting on the chipmaker, whose technology has powered the first four years of the generative artificial intelligence boom. Leaders from both parties are calling for briefings, and Democrats poised to take control of both houses of Congress are calling for investigations and new legislation \"to stop advanced AI chips from fueling China's military,\" Sen. Elizabeth Warren of Massachusetts wrote in a post on X on Monday.\n\nHuang has outsized influence over Nvidia, and is the sole face of the company with no clear second-in-command.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 12:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "CLAT 2027 Mock Test Goes Live Today; Check Official Link, Login Process", "full_content": "The mock tests are only for practice and self-assessment, the structure should not be treated as a prediction of the final CLAT 2027 question paper.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 12:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asian stocks ride tech rally higher as oil falls", "full_content": "Asian stocks were on course for their biggest two-day advance in more than three months as a resurgent tech rally and falling oil prices lifted sentiment.\n\nMSCI Inc.\u2019s gauge of regional equities climbed 1.8%. That\u2019s after US benchmarks capped their best session in about seven months on Monday, as dip buyers stepped in following last week\u2019s technology-led selloff. South Korea\u2019s Kospi Index jumped 4% to be the top performer in Asia on Tuesday, followed by benchmarks in Japan and Taiwan. Futures for the S&P 500 Index edged up 0.1%, while those for the Nasdaq 100 fell 0.2%.\n\nElsewhere, Brent crude slipped further to trade below $92 a barrel after slumping almost 6% on Monday to close at its lowest since August. President Donald Trump said further strikes on Iran wouldn\u2019t be necessary, an indication that he\u2019s winding down the conflict after the US midterm results underscored its unpopularity.\n\nThe Nasdaq 100 climbed 3.4% on Monday and a gauge of chip stocks in the US surged nearly 7%. That\u2019s even as Nvidia Corp. slid 4.3% amid a probe into Chief Executive Officer Jensen Huang after his admission of an affair with a woman identified in a series of reports as a suspected Chinese spy.\n\nThe rally in global tech stocks follows a tumultuous week that saw chipmakers bear the brunt of a selloff sparked by worries that the Democrats\u2019 sweep of Congress in the US midterms may lead to tougher oversight of the AI sector. The durability of the rebound remains in question, with regulatory risks now layered on top of concerns that were weighing on the sector\u2014stretched valuations, soaring capital spending and uncertainty over the payoff from massive AI investments.\n\n\u201cThe sharp drop in oil prices has given markets some much-needed breathing room. It\u2019s eased some of the inflation pressure,\u201d said Dilin Wu, a strategist at Pepperstone Group. \u201cWe still need to see whether buying interest can hold up.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "India Win Two Gold Medals At Junior Astronomy Olympiad, Grab 5 In Total", "full_content": "Overall 104 students from 25 countries, and 53 team leaders participated in the 5th International Olympiad on Astronomy and Astrophysics for Juniors 2026", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 11:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "TCPL Packaging shares: High-conviction stock! 60% returns in 6 months, InCred sees 18% more gain | Check target price", "full_content": "Brokerage firm InCred Equities has retained its high-conviction 'ADD' rating on TCPL Packaging shares, with a revised target price of \u20b9 5,270, implying an upside potential of nearly 18% from the stock's latest closing price of \u20b9 4,471 on November 9. The brokerage's positive outlook comes on the back of improving core business momentum, strong September-quarter performance and the company's planned entry into the lithium-ion battery separator film business.\n\nIn its latest research report, InCred Equities said TCPL Packaging's growth momentum has improved across its paperboard and flexible packaging segments, supported by healthy customer demand, better sales mix and price hikes. The brokerage also sees the company's new battery separator film venture as a potential long-term growth driver, with opportunities arising from India's expanding electric vehicle and energy storage ecosystem.\n\nTCPL Packaging reported a strong performance for the September quarter of FY27, with consolidated sales growing 21.8% year-on-year and 13.8% sequentially to \u20b9 560 crore. The revenue figure was 8% higher than InCred Equities' estimates. Revenue growth for the first half of FY27 stood at 19.1%.\n\nAccording to InCred Equities, this marked a significant acceleration from the 16.1% growth recorded in the June quarter and the subdued performance during Q2 and Q3 FY26, when exports were affected by geopolitical tensions.\n\nThe brokerage attributed the improvement to stable domestic FMCG demand, a recovery in exports on a lower base, better sales mix and price hikes that supported realisations. Management also highlighted healthy demand across both paperboard (folding cartons) and flexible packaging businesses.\n\nMeanwhile, the company's consolidated EBITDA stood at \u20b9 100.1 crore in Q2 FY27, with an EBITDA margin of 17.7%.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 11:54 AM IST", "pub_date_relative": "2h ago"}, {"title": "Malayalam Cinematographer Shaji Kumar Dies At 57 In Alappuzha While Shooting For Dileep' Next Film", "full_content": "Shaji Kumar passed away after developing health complications during the shoot of an upcoming Dileep-starrer in Alappuzha.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 11:53 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump\u2019s C-SPAN call marks latest surprise post-midterm appearance", "full_content": "President Donald Trump made an unexpected call into C-SPAN's evening broadcast Monday, extending a series of surprise appearances after Republicans' midterm election defeat.\n\n\"It looks like we've got a call from the White House,\" host Mimi Geerges told viewers as Trump joined the debut of \"Washington Journal Primetime.\"\n\nTrump congratulated Geerges on the launch before taking questions on immigration, Defense Secretary Pete Hegseth and the Iran war.\n\nAsked what he watches on C-SPAN, Trump said he follows viewer call-ins to gauge public sentiment.\n\n\"I like to watch the call-ins because it gives me a little of an indication of where we are,\" he said.\n\nThe unannounced, eight-minute call followed another unexpected appearance earlier Monday, when Trump entered the White House briefing room alongside UFC CEO Dana White. Reporters were summoned so quickly that aides did not have time to attach the presidential seal to the podium, according to Reuters.\n\nIt was Trump's first briefing room appearance in 198 days, according to a White House pool report. With the press secretary post vacant, Trump joked about offering White the job, to which the UFC chief declined.\n\nTrump said he had been having \"a very bad press day,\" as he floated White as his next press secretary.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 11:49 AM IST", "pub_date_relative": "2h ago"}, {"title": "Why Rocket Lab shares fell despite record revenue and booming Neutron demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Why Rocket Lab shares fell despite record revenue and booming Neutron demand Written by Anupam Nagar , ETMarkets.com | Nov 10, 2026, 12:29:02 PM IST 1 / 9 Rocket Lab shares tumble after Q3 earnings Rocket Lab shares fell more than 6% in after-hours trading on November 9 after the space company reported a wider-than-expected quarterly loss. The decline came despite record revenue, a growing order backlog and rising demand for its upcoming Neutron rocket. (Sources: Asianet Newsable, TradingKey)\n\nRocket Lab reported third-quarter revenue of $267.83 million, up 73% from a year earlier and above analysts' estimates of around $257 million. It marked the company's sixth consecutive quarter of record revenue, reflecting growth across its launch and space systems businesses.\n\nThe company reported an adjusted loss of 12 cents per share, wider than analysts' expectations of a 7-cent loss. Higher research and development and operating expenses weighed on profitability, raising concerns among investors about the cost of scaling its business.\n\nRocket Lab's backlog increased 52% sequentially to approximately $3.57 billion at the end of the September quarter. The company expects around $1.17 billion of this amount to convert into revenue over the next 12 months, providing visibility into future business.\n\nRocket Lab secured more than $515 million in Neutron launch contracts during the quarter, covering eight missions. The company raised the rocket's base launch price to $70 million from $55 million for several missions, reflecting strong demand and tightening launch capacity.\n\nNeutron's launch backlog has reached 16 missions even before its maiden flight.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 11:47 AM IST", "pub_date_relative": "2h ago"}, {"title": "IPO Lock-in Expiry: $35 billion in shares set to unlock across 116 companies; Jio, NSE, Zetwerk in focus", "full_content": "SHIPROCKET MILKYMIST SBIFUNDS null Dhanya Nagasundaram Published 10 Nov 2026, 11:47 AM IST Prefer Livemint on Google The upcoming IPO lock-in expiries could put nearly $35 billion worth of shares on investors' radar over the next few months, as pre-listing shareholder lock-in periods across 116 companies are set to end between 9 November 2026 and 26 February 2027.\n\nThe list includes several prominent recent listings, such as Jio Platforms , Zetwerk Manufacturing Business, Shiprocket , Milky Mist Dairy Food , SBI Funds Management and the National Stock Exchange of India (NSE). However, unlocking shares does not necessarily mean they will be sold in the market. A substantial portion of the shares is held by promoters and their groups, who may continue to hold their stakes.\n\nAccording to an analysis by Nuvama Institutional Equities, the aggregate value of shares becoming eligible for trading during this period is estimated at around $35 billion. The brokerage has analysed promoter and non-promoter shareholdings across companies listed up to 5 November 2026.\n\nHere's a closer look at the upcoming IPO lock-in expiries, the companies in focus and the shareholding blocks set to unlock.\n\nIPO lock-in periods prevent certain shareholders, including promoters, anchor investors and pre-listing investors, from selling their shares for a specified period after a company's listing. Once the restriction ends, these shareholders become eligible to sell their holdings, potentially increasing the supply of shares in the market.\n\nNuvama Institutional Equities has identified 116 companies whose pre-listing shareholder lock-ins are scheduled to expire between 9 November 2026 and 26 February 2027. The aggregate value of these shares is estimated at around $35 billion.\n\nHowever, the brokerage cautioned that the entire unlocked shareholding should not be viewed as potential selling pressure, as a significant portion is held by promoters and promoter groups.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 11:47 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "FPIs return to India stock markets with \u20b953.7k cr inflows in Nov so far - Attraction point for investors? What's next?", "full_content": "Foreign portfolio investors (FPIs) have made a strong comeback to Indian equity markets in November, pumping in \u20b9 53,739 crore so far, according to the latest NSDL data. The inflows mark a sharp turnaround after sustained selling pressure through much of 2026, with FPIs remaining net sellers in eight of the first ten months of the year.\n\nThe latest buying has helped narrow the cumulative net outflows from Indian equities to \u20b9 2.41 lakh crore in 2026. FPIs had withdrawn \u20b9 35,962 crore in January, followed by net inflows of \u20b9 22,615 crore in February. However, selling intensified in March, with outflows of \u20b9 1.18 lakh crore, and continued through June. July and August briefly brought some relief, with inflows of \u20b9 20,200 crore and \u20b9 29,631 crore, respectively, before foreign investors returned to selling in September and October.\n\nNovember's strong inflows raise the question of whether foreign investors are turning more positive on Indian equities after a prolonged period of caution.\n\nDr V K Vijayakumar, Chief Investment Strategist at Geojit Investments Limited, said Indian equities witnessed a sharp reversal in institutional activity last week, with foreign portfolio investors (FPIs) turning aggressive buyers while domestic institutional investors (DIIs) emerged as net sellers on all trading days.\n\nThe aggressive FPI buying triggered a short squeeze, pushing the Nifty up 7.58% in a week, he said.\n\nAccording to Vijayakumar, the sudden shift in FPI sentiment was partly driven by the sell-off in artificial intelligence (AI)-related stocks in the US and other markets, including South Korea, Taiwan and Japan. Concerns over spending on data centres in the US contributed to the sell-off, while political developments following the US midterm elections added to uncertainty around future AI investments.\n\n\u201cThe AI sell-off has made India, which is widely regarded as a non-AI trade, attractive for FPIs.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:55 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "FDA warns of vision loss risk linked to popular GLP-1 drugs like Wegovy, Zepbound", "full_content": "The U.S. Food and Drug Administration is requiring new safety warnings on all GLP-1 drugs after finding evidence of a potential increased risk of a rare eye condition, the agency said on Monday.\n\nThe condition, which can cause sudden vision loss, known as nonarteritic anterior ischemic optic neuropathy (NAION), is rare, and a causal relationship has not been established.\n\nThe FDA is requiring the makers of all GLP-1 medications to add a warning about the potential increased risk of NAION associated with use of these medications, it said.\n\nNAION is a condition that can result in sudden decreased vision, including permanent vision loss. It is caused by decreased blood flow to the front part of the \u200boptic nerve \u2014 the underlying cause is not completely understood, however.\n\nNAION cases have been reported for all currently marketed GLP-1 products, the FDA said.\n\nCNBC has reached out to Ozempic and Wegovy maker Novo Nordisk and Eli Lilly, the company behind Mounjaro, Zepbound and Foundayo, for comment.\n\nThe FDA decision follows a review of clinical trials, real-world patient data, and published studies.\n\nAn analysis of 126 trials involving more than 134,000 patients found 6.4 cases of NAION per 100,000 patient-years among GLP-1 users, compared with 3.8 among patients receiving other treatments or placebos.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:52 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live: Hind Rectifiers Profit Falls 54%, MRF Profit Slips 28%; Kalyan Jewellers, Cochin Shipyard Also In Focus", "full_content": "Kalyan Jewellers India, MRF, Cochin Shipyard, and Avanti Feeds are among the 44 companies scheduled to announce their Q2 FY27 results. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:45 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500 futures rise as traders brace for crucial consumer inflation report: Live updates", "full_content": "U.S. stock futures were largely higher early Tuesday as traders awaited a pivotal consumer inflation report.\n\nS&P 500 futures added 0.23%, while futures tied to the Dow Jones Industrial Average were up 258 points, or 0.49%. Nasdaq-100 futures hovered just above the flatline.\n\nIn Asia, South Korea's Kospi surged 4.3%, while Japan's Nikkei 225 added 2.89%. Hong Kong's Hang Seng Index rose 0.42%, and mainland China's CSI 300 added 0.26%. Australia's S&P/ASX 200 gained 1.27%\n\nDuring the regular U.S. trading day, the Dow Industrials gained 1,104 points, or 2.2%, while the S&P 500 popped about 2.4%. The Nasdaq Composite rose 2.7%. Monday's rally came after a rocky week for markets, in which traders grew concerned about the potential for a slowdown in data center buildouts after Democrats posted big victories in the midterm elections.\n\nWhile the tech sector rebounded in Monday's regular trading, Nvidia sat out the rally.\n\nShares of the chipmaker slid 4% after Nvidia CEO Jensen Huang admitted on Sunday to having an affair with a woman who U.S. intelligence officials, according to The New York Times, say is a spy for China's Ministry of State Security. The company's board of directors also launched an independent internal investigation , pointing to recent reporting that Huang \"has been the target of a foreign intelligence effort.\"\n\nOil prices also fell on Monday, lending the market support. The U.S. West Texas Intermediate futures settled down more than 4%, while Brent crude futures slid more than 5%.\n\nInvestors are awaiting the October consumer price index report due on Tuesday. Economists polled by Dow Jones see headline CPI growing at a rate of 0.3% and core CPI, which excludes volatile food and energy costs, rising 0.2% from the prior month.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:43 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SoftBank swings to $7 billion net loss in second quarter as tech selloff weighs on results", "full_content": "SoftBank reported a fiscal second-quarter net loss of 1.12 trillion yen ($7 billion) on Tuesday, as investment losses and higher financing costs weighed on earnings.\n\nThe Japanese investment giant also recorded a 597.2 billion yen loss in the six-month period due to changes in procurement plans for power generation equipment for AI data center projects in the U.S.\n\nRevenue rose 13.3% in the six months ended Sept. 30, supported by growth in telecommunications and AI computing businesses. The company said its SoftBank segment recorded higher sales across all businesses, while revenue at its AI computing segment increased.\n\nThe company's Vision Fund segment swung to a loss of 81.58 billion yen in the fiscal second quarter, compared with a profit of 2.38 trillion yen a year earlier. Vision Fund 1 recorded an investment loss of $20 million in the quarter, despite a $1.3 billion gain on ByteDance, as shares of publicly traded portfolio companies, including Coupang and Grab, declined.\n\nThe Vision Funds segment recorded investment gains of 85.45 billion yen, down sharply from 2.81 trillion yen in the year-earlier period. Vision Fund 2 posted investment gains of 89.26 billion yen, while Vision Fund 1 recorded a loss of 3.86 billion yen on its investments.\n\nAs of the end of September, SoftBank's cumulative investment in OpenAI stood at $54.6 billion, with a fair value of $99.6 billion and a cumulative investment gain of $45 billion, according to the company.\n\nShares of the Japanese investment giant closed 13.9% higher on Tuesday. The gains came as Asian technology stocks, including Samsung Electronics and SK Hynix, rose following an overnight rebound on Wall Street.\n\nSoftBank shares this year Ahead of its earnings release, SoftBank Group announced on Monday plans with Grab and Malaysia's PETROS to commit a combined $1.85 billion in initial capital to develop AI infrastructure in Malaysia, with a long-term target of at least five gigawatts of AI computing capacity.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 01:41 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Premier posts strong H1 2026 results as stock rises 5.8%", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:40 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Scandic Hotels\u2019 Q3 profit rises 22% on Dalata fees", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:36 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SoftBank Group shares surge 14% as Asian tech stocks track Wall Street rebound", "full_content": "Asian technology stocks surged Tuesday, tracking a rebound on Wall Street overnight as a sharp decline in oil prices lifted sentiment while renewed buying in chip names spilled over into Asia, following last week's bruising sell-off.\n\nJapan's technology investment giant SoftBank Group rose 13.88%, while chip-testing equipment maker Advantest gained 4.63%.\n\nSemiconductor equipment maker Tokyo Electron rose over 6.05%, while Lasertec and Disco advanced 7.73% and 6.81%, respectively.\n\nStock performance so far this year South Korean chipmaker SK Hynix jumped 6.69%, while Samsung Electronics rose 4.74%. Samsung SDI climbed 9.88%. Taiwan's TSMC added 2.24%.\n\nThe gains followed a strong session on Wall Street, where the tech-heavy Nasdaq Composite climbed 2.74%, while the S&P 500 rose 2.35% to clock its best day since April 8.\n\nThe recovery came after a steep sell-off in global technology stocks last week, fueled by concerns that Democrats' sweeping victory in the U.S. midterm elections could lead to tighter restrictions on data-center development, potentially impacting demand for artificial intelligence chips and infrastructure.\n\n\"This is not to suggest that the tech sell-off is done and dusted. While there is some evidence that investors are taking advantage of last week's plunge to increase their exposure to chip and other AI-adjacent stocks, there's a danger that it may be a little bit premature to load up and 'buy the dip,'\" said David Morrison, senior market analyst at Trade Nation.\n\nBeyond the political uncertainty surrounding potential restrictions on data-center development, investors have also grown increasingly wary of the enormous capital expenditures required to build out AI infrastructure. Questions over how quickly those investments will translate into meaningful profits have weighed on sentiment toward companies across the semiconductor supply chain.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 01:36 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Earnings call transcript: Infineon jumps on upbeat Q4 2026 outlook and AI demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:34 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "M&S plans to double dividend, targets mid-to-high single-digit sales growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:34 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mitsui Chemicals to Acquire JSR With Development Bank of Japan for $8.8 Billion - WSJ", "full_content": "Mitsui Chemicals to Acquire JSR With Development Bank of Japan for $8.8 Billion WSJ Mitsui Chemicals to buy chip materials firm JSR for $11.6 billion Reuters Mitsui Chemicals to Take Over Chip Linchpin JSR for $12 Billion Bloomberg.com Semiconductor Materials Market to Reach US$115.6 Billion openPR.com Mitsui Chemical Says It Will Sell Shares Worth Up To 150 Billion Yen To Help Finance Jsr Acquisition TradingView", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 01:33 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why Gokaldas Exports shares will be in top focus tomorrow; what it said in exchange filing? Stock down over 5% in 5 days", "full_content": "Gokaldas Exports shares will remain in focus in Wednesday's trading session after disclosing that one of the customers of its step-down subsidiary has filed for bankruptcy protection under US laws.\n\nGokaldas Exports share price ended Monday's session on a weaker note, closing the day 3% down at \u20b9 678 per share.\n\nIn an exchange filing, the company said The Children's Place Inc., a customer of Atraco Industrial Enterprise FZE, a step-down subsidiary of Gokaldas Exports, has sought protection under Chapter 11 of the US Bankruptcy Code.\n\n\"We wish to inform that \u2018The Children's Place, Inc.\u2019, one of the customers of Atraco Industrial Enterprise FZE, a step-down subsidiary of Gokaldas Exports Limited (\"the Company\"), has filed for protection under Chapter 11 of the U.S. Bankruptcy Code in the United States,\" the company said in the filing.\n\nGokaldas Exports said Atraco Industrial Enterprise FZE had outstanding receivables of $4.11 million from The Children's Place as of the date of the disclosure. The company added that it is closely monitoring the developments and assessing the potential impact on its business operations and financials. It will take appropriate steps to address the matter.\n\n\u201cAs of the date of this disclosure, Atraco Industrial Enterprise FZE has an outstanding receivable of USD 4.11 Mn from The Children's Place, Inc. The Company is closely monitoring developments in this matter and is assessing the potential impact on its business and financials and will address it suitably,\u201d it added.\n\nAccording to a report by CNBC TV-18, Gokaldas Exports said it expects stronger growth in FY28, driven by its African operations and a higher contribution from acquired businesses.\n\nManaging Director and Vice-Chairman Sivaramkrishnan Ganapati said the restoration of duty-free access for African operations to the US has provided greater clarity to the business and triggered a sharp increase in customer enquiries, particularly for its Kenya operations.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:28 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Honda raises full-year outlook despite second-quarter profit slump", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:27 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dividend Stocks Record Date Alert 12 Nov Thursday: Bayer CropScience, HUL, ONGC, more; full list | Amount, key dates", "full_content": "GODFRYPHLP GPPL HINDUNILVR BAYERCROP Pranati Deva Published 10 Nov 2026, 01:22 PM IST Prefer Livemint on Google Dividend Stocks : Investors looking to earn dividend income have one final opportunity to buy shares of 13 companies that are set to trade ex-dividend on Thursday, November 12, 2026. Tomorrow, Wednesday, November 11, is the last day to buy these dividend stocks to become eligible for the upcoming payouts. The companies have announced dividends ranging from \u20b9 0.05 to \u20b9 90 per share, with several payments scheduled to reach eligible shareholders before the end of November or in early December.\n\nThe upcoming dividend payouts cover companies across multiple sectors, including FMCG, agrochemicals, energy, infrastructure and healthcare. Under India's T+1 settlement cycle, investors must purchase shares by November 11 to qualify for the dividends, as November 12 is the record date. Shareholders whose names appear in the company's records on the specified date will be eligible to receive the declared payouts.\n\nHere is a look at the dividend announcements, indicative yields, record dates, payment timelines and previous payout history of the companies.\n\nBayer CropScience has declared an interim dividend of \u20b9 90 per equity share for FY27, equivalent to a 900% payout on its \u20b9 10 face value. At the reference share price of \u20b9 3,246, the indicative dividend yield works out to approximately 2.77%. The record date is November 12, while the dividend is scheduled to be paid on or before November 30, 2026. The company had distributed \u20b9 150 per share in FY26 and \u20b9 125 in FY25.\n\nGodfrey Phillips India has announced an interim dividend of \u20b9 10 per share for FY27. At a reference price of \u20b9 1,772, the indicative yield is approximately 0.56%. The record date is November 12, with payment scheduled on or before December 4, 2026. The company has maintained a dividend-paying record for 20 consecutive years, distributing \u20b9 50 per share in FY26.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 01:22 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Fujiyama Q2 FY2027 slides: revenue doubles, solar cell expansion underway", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Nov 2026, 01:20 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MRF Q2 Results: Net Profit Falls 28% To Rs 369 Crore, Declares Dividend; Check Record Date", "full_content": "Revenue from operations or top line surged 17.6% annually to Rs 8,524 crore in the September quarter of FY27, from Rs 7,250 crore a year ago.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 01:18 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wrong details in PF account can delay your money; EPFO explains how to correct them online in 5 easy steps", "full_content": "Errors in your Employees\u2019 Provident Fund (EPF) account may create hurdles when you want to withdraw your provident fund savings, transfer your balance, or settle a claim.\n\nEven a minor mismatch in personal or employment-related information, such as your name, date of birth (DOB), gender, or other details, can lead to additional verification and delay the processing of your request.\n\nTo help members keep their records accurate, the Employees\u2019 Provident Fund Organisation (EPF) has highlighted its online Joint Declaration facility.\n\nIn a post shared on X on 9 November, EPFO mentioned that \u201cIncorrect details in your EPF records? Get them corrected easily in 5 simple steps through the Joint Declaration facility on the EPFO Member Portal. Update your details. Keep your EPF records accurate!\u201d\n\nThe facility allows members to initiate requests for correcting eligible information in their EPF records, including their name, date of birth, gender, and other personal or employment-related details by following five easy steps.\n\nEPF members can follow these five steps to submit their correction requests online:\n\nVisit the EPFO Unified Member Portal and log in using your Universal Account Number (UAN) and password. Ensure that you are accessing the official portal linked to your EPF account.\n\nAfter logging in, navigate to the Joint Declaration facility available on the member portal. This is the online facility through which members can initiate requests to rectify discrepancies in their EPF records.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Retail investors shed stocks, but crowd into Reliance, HDFC Bank", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nSmall investors are becoming pickier about the stocks they own. In the September quarter, they reduced their stakes in nearly half of listed companies, even as Reliance Industries , HDFC Bank and PC Jeweller drew more retail shareholders.\n\nA Mint analysis of 4,729 BSE-listed companies showed retail ownership (those holding up to \u20b9 1 lakh in equity) declined in 49.4% of companies in Q2FY27, up from 47.5% in Q1FY27. The proportion recording an increase slipped to 42.4% from 43.2%, while 8.2% saw no change, according to ACE Equity data.\n\nVedant Gupte, co-founder and chief executive officer (CEO) of investment platform Trackk, interprets the divergence as portfolio pruning. \u201cWe read the September-quarter data as a clean-up of portfolios, not a loss of faith,\u201d he said.\n\nHe sees two strands of buying: established businesses at more attractive valuations, and riskier momentum or turnaround bets. The disclosures, however, do not establish whether the same investors moved money between these groups.\n\nFour companies together recorded more than a million net retail shareholder additions in the September quarter. Reliance led with 401,762, followed by HDFC Bank with 273,525, PC Jeweller with 242,298 and Cupid with 173,458. The additions may include investors holding multiple companies.\n\nBSE added 161,456 retail shareholders, while Coal India added 151,579. Elsewhere, Bajaj Auto lost 353,533, IDFC First Bank 138,832 and Wipro 103,653.\n\nGupte described BSE as a momentum bet and PC Jeweller as a turnaround opportunity, alongside investors buying established businesses after a correction.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 12:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Data Patterns shares surge 55% in 2026: Should you buy stock after Q2 results? What brokerages say: check target price", "full_content": "Dhanya Nagasundaram Published 10 Nov 2026, 12:50 PM IST Prefer Livemint on Google Data Patterns shares have surged nearly 55% in 2026 so far, with the defence electronics stock surging over 9% on Monday, 9 November, despite reporting a weak set of Q2 FY27 results. Strong order inflows and management's confidence in a better second half appear to have supported the stock's rally.\n\nThe company reported a 57% year-on-year drop in revenue to \u20b9 133 crore for the September quarter, while net profit declined 55% to \u20b9 22 crore. EBITDA margin, however, remained relatively stable at 23.3%.\n\nThe decline in revenue and profit was largely due to subdued execution during the quarter. However, a sharp increase in fresh orders provided some support. Data Patterns secured orders worth \u20b9 929.1 crore in Q2 FY27, marking a 475% jump from the corresponding period last year.\n\nThe company's order book stood at \u20b9 2,698 crore, with services accounting for 21%, development orders for 36% and production orders for the remaining 43%. While the robust order inflows have improved revenue visibility, execution wil
