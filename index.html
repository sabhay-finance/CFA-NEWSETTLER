s."}, {"title": "Digital arrest: When your bank has to compensate cyber fraud losses", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIt begins with an official-sounding call. The caller says your Aadhaar is linked to a money-laundering case. Within minutes, you're on a video call with an \u201cofficer\u201d in uniform who sends a stamped notice and tells you not to hang up, not to tell your family, and not to leave the screen. You are under \"digital arrest\" and the only way out, you're told, is to move your savings into a \u201csafe\u201d government account until you are cleared.\n\nThe government has clarified that there is no such thing as digital arrest under Indian law. Still, a status report filed by the home ministry and the Indian Cyber Crime Coordination Centre (I4C) in the Supreme Court on 7 October showed 21,928 complaints on the National Cyber Crime Reporting Portal between January and August 2026, with reported losses above \u20b9 647 crore.\n\nDigital arrest is one part of a wider, increasingly artificial intelligence-aided surge in cyber fraud to which Indians reported \u20b9 55,659 crore in losses across 6.59 million complaints between 2021 and 2025, I4C data showed.\n\nA September study by IIT-Madras even challenged the assumption that cyber fraud primarily targets people with low digital literacy or financial greed. Its findings showed that even highly educated, digitally experienced professionals are vulnerable. Based on interviews with 33 victims of fake investment schemes, task scams, pay-per-click work, digital payment fraud and digital arrest, it found that scammers exploit periods of personal stress and disruption, triggering an \u201cengineered brain freeze\".\n\nRitesh Bhatia, a cybercrime investigator and founder of V4WEB Cybersecurity, also calls cyber fraud a psychological crime. Scammers work on emotions using personal data that can be easily accessed these days: the fear of a digital arrest, a cloned relative's voice asking for emergency money, the greed of an investment scheme or a card offer on social media.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 12:12 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "HFCL vs Sterlite Technologies: Both multibagger stocks hit 5% lower circuit again - Which one should you buy?", "full_content": "HFCL Pranati Deva Published 25 Nov 2026, 12:10 PM IST Prefer Livemint on Google HFCL vs Sterlite Technologies : Shares of telecom equipment and optical fibre cable manufacturers HFCL and Sterlite Technologies extended their sharp correction on Wednesday, November 25, with both stocks hitting their respective 5% lower circuits for the second time this week. The selloff comes after a spectacular rally in both stocks earlier this year, raising questions about whether the recent decline presents a buying opportunity or signals further downside.\n\nHFCL shares hit the 5% lower circuit at \u20b9 169.10 on the BSE, while Sterlite Technologies fell to its lower circuit limit of \u20b9 561.85. Both stocks had also declined 5% each on Monday.\n\nThe companies had benefited from rising global demand for optical fibre cables, increasing telecom infrastructure investments and the growing need for high-speed connectivity to support artificial intelligence (AI) and hyperscale data centres. Strong Q2 FY27 earnings and sizeable order books had further supported their growth prospects.\n\nHowever, the recent correction has significantly eroded their market value.\n\nHFCL has declined 14% in a week, 29% in a month and 29% over three months, although it remains up 140% over one year. Sterlite Technologies has fallen 17% in a week, 32% in a month and 14% over three months, despite gaining 431% over one year.\n\nBoth stocks had touched their respective 52-week highs in October 2026. HFCL peaked at \u20b9 282.10, while Sterlite Technologies touched \u20b9 1,054.45. Their 52-week lows stood at \u20b9 59.83 and \u20b9 84.65, respectively, in January 2026.\n\nBoth stocks are witnessing sharp corrections after their phenomenal rallies, but their technical outlooks remain weak. HFCL appears relatively better positioned, with its long-term support zone offering a potential stabilisation point. Sterlite Technologies, meanwhile, faces the risk of further downside if it fails to hold its crucial support.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 12:10 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI debt worries grow as Nvidia rebound masks Big Tech spending squeeze", "full_content": "Big Tech could find it increasingly tough to secure funding from debt markets critical to the AI build-out, as lenders become pickier over corporate bonds.\n\nJensen Huang 's reinstatement as Nvidia CEO on Monday gave an already-rising stock market a further lift, with tech shares leading a broad rebound on Wall Street after last week's sharp sell-off as Anthropic 's landmark IPO failed to lift the broader sector.\n\nBut investors are now starting to ask harder questions about the bill for the AI build-out \u2014 and demanding evidence that the huge spending is actually adding value for shareholders, according to Dan Taylor, deputy chief investment officer and CIO equities, systematic at Man Group .\n\nAnthropic. \"As investors get choosier about where all this capital is going and when it might pay off, we think the market is likely to fragment well beyond the simple 'buy chipmakers, sell software' trade of the past two years,\" Taylor said.\n\n\"Anthropic may have got its IPO out the door just in time, but for the rest of the AI trade, the era of spending first and asking questions later seems to be over.\"\n\nAnthropic \u2014 which went public Nov. 19 in the largest ever stock market debut \u2014 is already bringing in cash from its business, Taylor noted, and is close to breaking even on free cash flow.\n\nIn contrast, heavy spenders and debt issuers \u2014 such as Oracle , Google owner Alphabet and certain chipmakers \u2014 plunged by 25-45% between their June peak and the market close on Friday, according to Man analysis. By comparison, Apple , which has sat out the AI spending arms race, was up almost 20%, Taylor observed in a Man Group note Tuesday.\n\nNvidia. Nvidia closed about 5.9% lower on Tuesday. Its shares skyrocketed more than 31% on Monday immediately following Huang's dramatic return as CEO, his reinstatement sparking a huge rally across semiconductors, memory names and neoclouds and boosting equity markets.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 11:59 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Sharp drop in gold prices triggers margin calls on loans by banks and NBFCs - what customers should know about LTV", "full_content": "Gold prices in India continue to drop on Wednesday, with the average price of 24K gold hovering between \u20b9 12,458 and \u20b9 12,632 per gram on November 25. Gold prices have fallen roughly 30% to 35% from their January 2026 record highs in both domestic Indian and global markets. While the fall in gold prices is good news for buyers and investors, it is becoming a concern for those who have taken loans against their gold.\n\nAccording to reports, banks and gold loan NBFCs have accelerated the issuance of notices and reminders to customers, asking them to provide additional security or repay a portion of their existing gold loans.\n\nThat is because the market value of pledged gold has fallen below the Loan-to-Value (LTV) ratio set by the Reserve Bank of India. As per the RBI, the maximum Loan-to-Value (LTV) limits for gold loans are:\n\nSaurabh Sood, owner of Shimal-based Savitri Jewellers told ANI that lenders could face considerable pressure as the value of collateral had declined sharply.\n\n\u201cLending companies and authorised jewellers who provide loans against gold will suffer substantial losses because they have given loans against an asset whose value has now fallen considerably. Their portfolios will also come under tremendous pressure,\u201d he said.\n\nThe fall in gold prices has also been driven by loan defaults . According to TransUnion CIBIL, gold loan NPA rose to 0.3% at the end of August, up from 0.16% as of March 31, 2026. It also added that borrowers having multiple gold loan accounts are more prone to delay loan payments.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 11:55 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "EXCLUSIVE: Alice Huang-linked firms listed $270 million in AI servers in China, records show - Reuters", "full_content": "EXCLUSIVE: Alice Huang-linked firms listed $270 million in AI servers in China, records show Reuters Trump Administration Imposes Sanctions on Megaspeed, Singaporean Firm at Center of Nvidia Scandal The New York Times U.S. Blacklists Alibaba-Owned Company Over Chip Curbs WSJ Malaysia Minister Vows Compliance With US Rules for Nvidia Issue Bloomberg.com US to blacklist Asian AI firm Megaspeed after Nvidia scandal BBC", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 11:43 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Crypto talent will return \u2018when AI implodes,\u2019 Arthur Hayes says", "full_content": "Startup talent that has concentrated in artificial intelligence will return to the crypto industry \"when AI implodes,\" according to Arthur Hayes, chief investment officer at Maelstrom Fund.\n\n\"A lot of talent has gone into the AI space, so I definitely think there'll be a resurgence in good founder talent coming back to crypto,\" Hayes said in an online interview with CNBC on Tuesday.\n\nHe added that some founders may also return once they \"recognize\" that their products could eventually be \"usurped by Anthropic or OpenAI .\"\n\nThe scale and capabilities of the largest frontier AI labs have made it difficult to \"build a real AI business,\" Hayes said, arguing that \"most\" founders simply \"raise a bunch of money and then light it on fire.\"\n\nHe expects the AI trade to face \"serious headwinds\" in the second half of 2027, when leading labs begin confronting sizable bills tied to compute leases and other non-cancelable commitments.\n\nAnthropic expects about $451.6 billion in compute and infrastructure obligations through the end of 2030, with roughly $70.7 billion due by the end of September 2027, according to its prospectus.\n\n\"Do they have the money? We're going to find out,\" Hayes said.\n\nBroader enthusiasm around the AI trade has also cooled amid questions about future infrastructure spending. Even exuberance from Jensen Huang's return as Nvidia CEO on Monday proved short-lived, with the shares falling 5.9% on Tuesday and Anthropic dropping below its IPO price four days after its debut.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 11:39 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "\u2018Anflopic\u2019 bodes badly for OpenAI\u2019s IPO prospects", "full_content": "By pushing its listing to the limit, the Claude maker has made itself a hard act to follow", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 11:30 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Despite stock market up today, why SG Mart shares hit 20% lower circuit; up 117% in 2026 | What lies ahead? Key levels", "full_content": "TATASTEEL Dhanya Nagasundaram Published 25 Nov 2026, 11:29 AM IST Prefer Livemint on Google SG Mart shares hit the 20% lower circuit on Wednesday, 25 November, ahead of a board meeting scheduled for 26 November to consider raising funds through equity shares and convertible securities.\n\nThe proposed fundraising options include a preferential issue, a rights issue and a qualified institutional placement (QIP). Despite Wednesday\u2019s sharp decline, the stock has rallied nearly 200% since the beginning of 2026.\n\nThe development comes days after Tata Steel approved the acquisition of a 26.38% stake in APL Apollo Tubes for approximately \u20b9 15,510.6 crore, along with an open offer to acquire an additional 26% stake. The Sanjay Gupta-led family promotes both SG Mart and APL Apollo Tubes.\n\nFollowing the latest developments, APL Apollo Tubes crashed 15% in Wednesday's trading session.\n\nTata Steel\u2019s proposed acquisition of a 26.38% stake in APL Apollo Tubes is part of its strategy to expand downstream operations and strengthen its presence in value-added steel products. The deal will be completed in three tranches.\n\nIn the first tranche, Tata Steel acquired 2.77 crore shares, or 9.91%, through an on-market block deal on 23 November at \u20b9 2,100 apiece. For the remaining stake, it has signed a share purchase agreement with S Gupta Holding, a member of APL Apollo\u2019s promoter group.\n\nThe second tranche involves 3.33 crore shares (11.90%) through an off-market transfer, while the third     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
