<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Jim Cramer's top 10 things to watch in the stock market Thursday", "full_content": "Stocks tumble as oil tops $100.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago"}, {"title": "U.S. crude oil tops $100 again \u2013 last seen in May \u2013 as market braces for prolonged Iran war", "full_content": "Crude oil prices jumped 4% on Thursday as the market braces for a prolonged war in the Persian Gulf after fighting between the U.S. and Iran sharply escalated this week.\n\nU.S. West Texas Intermediate futures were up 4.3% to $100.19 per barrel by 9:14 a.m. ET, the highest level since May. Brent crude , the international benchmark, traded 4% higher to $105.28 a barrel.\n\nTop White House advisors have discussed with President Donald Trump the possibility that the Iran war could drag on past Inauguration Day in January 2029, U.S. officials told The Wall Street Journal .\n\nThe report contradicts Trump's claim Wednesday that the war would end immediately after the midterm elections. He has asserted for months the conflict was drawing to a close, only for fighting to escalate.\n\nTrump claimed to reporters Wednesday that oil and gasoline prices would fall after the midterms. Pump prices hit a Labor Day record Monday and diesel is expected to cross $6 per gallon for the first time ever in the coming days.\n\nTrump said Iran was \"desperate to try and affect the election, so that we can get a nice weak group of people in there, and leave them alone and let them have their nuclear weapon.\"\n\nFighting between the Washington and Tehran has erupted this month after a period of relative calm in August. Iran has tried to attack American warships several times while the U.S. military has destroyed at least eight Iranian tankers since Saturday in retaliation.\n\nIran's Houthi allies in Yemen attacked several energy facilities and other targets in Saudi Arabia this week, injuring more than 70 civilians and raising concerns that the war was broadening.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago"}, {"title": "Wholesale prices rose 0.4% in August, as expected", "full_content": "U.S. wholesale prices rose in August, according to a report Thursday that could play a key role in the Federal Reserve's upcoming interest rate decision.\n\nThe producer price index , a measure of final demand costs for goods and services, increased a seasonally adjusted 0.4% for the month, in line with the Dow Jones consensus, the Bureau of Labor Statistics reported.\n\nOn an annual basis, that put the PPI at 5.4%, still well above the Fed's 2% inflation target and 0.1 percentage point higher than expected. The PPI rose 0.1% in July, a slight upward revision from the original estimate of no change.\n\nExcluding food and energy, the core PPI accelerated by 0.2%, against the forecast for a 0.3% increase. Core less trade services, another volatile category, was up 0.3%, in line with estimates.\n\nStock market futures were negative following the report, the release of which coincided with U.S. crude oil prices topping $100 a barrel. Treasury yields moved sharply higher, with the 10-year note hitting its highest since November 2023.\n\n\"Net, net, today's PPI inflation report does nothing to turn down the warnings about the inflation threats the economy faces, especially if you are an inflation hawk with an itchy trigger finger at the Federal Reserve,\" wrote Chris Rupkey, chief economist at Fwdbonds.\n\nEnergy prices in particular and goods prices overall were responsible for most of the PPI increase. Final demand energy prices rose 4.2%, pushed largely by soaring diesel, which surged 24.1%. Goods prices broadly increased 1.1%.\n\nServices prices were up just 0.1%, with a 2.3% increase in transportation and warehousing accounting for much of that move.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:53 PM IST", "pub_date_relative": "11m ago"}, {"title": "India's BRICS trade deficit likely to remain key challenge as imports outpace exports: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India's BRICS trade deficit likely to remain key challenge as imports outpace exports: Report The Economic Times daily newspaper is available online now. Read Today's Paper India's BRICS trade deficit likely to remain key challenge as imports outpace exports: Report SECTIONS India's BRICS trade deficit likely to remain key challenge as imports outpace exports: Report ANI Last Updated: Sep 10, 2026, 06:51:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's trade relationship with BRICS nations is set to experience a notable increase in its trade deficit, driven largely by rapidly rising imports. While exports to these countries are gradually improving, the pace is not enough to offset the imports, particularly from major players like China and Russia. India aims to enhance its export capacity within the BRICS framework as a strategic priority.\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "10 Sep 2026, 06:51 PM IST", "pub_date_relative": "14m ago"}, {"title": "European Central Bank hikes interest rates to 2.5% as policymakers see risk of higher inflation, weaker growth", "full_content": "The European Central Bank has voted to raise its key deposit rate by 25 basis points to 2.5% from 2.25% in a move widely expected by investors.\n\nBut uncertainty around the U.S.-Iran war continues to cloud the outlook for the ECB's longer-term policy path, market watchers say, and investors will be watching closely for signals in policymakers' remarks later on Thursday.\n\nThe ECB expects baseline inflation, excluding energy and food, to reach 2.5% in 2026, 2.6% in 2027 and 2.3% in 2028.\n\nECB president Christine Lagarde warned that the conflict in the Middle East and recent developments in Russia's war on Ukraine will keep headline inflation \"well above target\" the bank's 2% target for an extended period.\n\nLagarde said in a press conference immediately following the rate hike that despite the \"greater-than-expected resilience\" shown by the euro zone economy, the energy price shock, as well as global trade tensions, remain a risk to growth.\n\n\"The outlook remains highly uncertain, with risks to the upside for inflation and to the downside for economic growth,\" the ECB's Governing Council said, acknowledging a \"broad range of outcomes\" around growth and inflation as a result of the energy shock, including duration and second-round effects.\n\nMarkets priced in a 100% chance of the 25 basis points hike ahead of Thursday's meeting, according to LSEG data.\n\nECB officials have said since the U.S.-Iran war broke out that they would take a meeting-by-meeting approach to monetary policy. The central bank's rates-setting Governing Council will hold a press conference in Berlin, scheduled for 8:45 a.m. E.T., following the decision.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago"}, {"title": "Mint Money app adds bill payments, loans at Global Fintech Fest 2026", "full_content": "Mumbai: Mint Money, the fintech app from the Hindustan Times Group, has been unveiled with bill payment services at the 7th Global Fintech Fest 2026 in Mumbai. The app is powered by Bharat Connect, part of the Bharat Bill Payment System (BBPS) run by NPCI Bharat BillPay Ltd.\n\nThe platform combines financial information with borrowing options. Users can check their credit score , understand the factors shaping it, and receive personalised guidance to improve their credit health. Based on their profile, they can explore personal loan offers ranging from \u20b9 5,000 to \u20b9 20 lakh, compare interest rates, and calculate equated monthly instalments (EMI) through an in-app tool. Loans are offered digitally, without collateral or paperwork, through partners such as Stashfin, Aditya Birla Finance, Kissht, Credit Saison, SMFG India Credit and Fibe.\n\nThe launch comes amid a surge in digital borrowing. A Redseer report estimates the digital lending market expanded from \u20b9 15,000 crore in fiscal year 2021 (FY21) to \u20b9 2.2 trillion in FY26, and is set to grow 26-27% annually until FY31\u2014outpacing traditional lending. Nearly 69% of borrowers have taken more than one digital loan, underscoring the importance of repeat borrowing for lenders.\n\nPuneet Jain, chief executive officer of HT Digital, said the app aims to merge \u2018the news, the numbers and the action\u2019. He explained, \u201cTypically, users will read this on Mint in the morning. Then they will go to a bunch of YouTube videos and figure out how it impacts them. For spending time sifting through which financial content is actually credible.\u201d\n\nThe app also introduces an artificial intelligence ( AI ) coach, Money Guru, which explains changes in credit scores and suggests ways to improve them.\n\nJain said the broader goal is to make financial management habitual.", "source": "LiveMint Money", "pub_date_str": "10 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago"}, {"title": "Jim Cramer Said Stay Away From This Drone Stock a Week Before Its Biggest Earnings Beat in Years", "full_content": "Skip to navigation Skip to main content Skip to right column Jim Cramer Said Stay Away From This Drone Stock a Week Before Its Biggest Earnings Beat in Years Jeremy Phillips Thu, September 10, 2026 at 6:18 AM PDT 4 min read AVAV Quick Read AVAV's fiscal Q1 2027 adjusted EPS of $0.59 crushed the $0.25 consensus by 138%, with funded backlog hitting a record $1.5 billion, up 37% year over year.\n\nAeroVironment secured a $464 million LOCUST contract, which represents the first U.S. military production deal for directed energy systems, with shot costs under $10 per firing.\n\nDespite the beat, GAAP net income stayed negative, free cash flow hit -$36 million, and management reaffirmed rather than raised full-year guidance.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and AeroVironment didn't make the cut. Enter your email to see the names that beat AVAV. The report is free. Enter your email and see if any of your stocks made the cut.\n\nOn September 2, Jim Cramer told Mad Money viewers he was saying \"not yet, not now\" on AeroVironment ( NASDAQ:AVAV ) because competition in its corner of defense was too strong. Seven days later, the drone and laser maker posted the biggest earnings beat it has produced in years.\n\nI have been following defense-tech names for a while, and this is the kind of setup that punishes conviction on both sides. Shares walked into the report down 5% on the day and are down 39% year to date. Then the numbers hit.\n\nFiscal Q1 2027 adjusted EPS came in at $0.59 versus the $0.2479 consensus, a 138% surprise. Revenue of $480.49 million topped the $456.09 million estimate and grew 5.7% year over year. Bookings landed at roughly $700 million for a 1.4x book-to-bill, and funded backlog hit a record $1.50 billion, up 37% year over year.\n\nCEO Wahid Nawabi said: \"AV's fiscal year 2027 is off to a strong start, with record first-quarter revenue and funded backlog and landmark strategic wins.\"", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago"}, {"title": "Macy\u2019s Sinks 5% Despite Raised Full-Year Outlook, Kohl\u2019s and TJX Barely Budge", "full_content": "Skip to navigation Skip to main content Skip to right column Macy\u2019s Sinks 5% Despite Raised Full-Year Outlook, Kohl\u2019s and TJX Barely Budge David Moadel Thu, September 10, 2026 at 6:18 AM PDT 5 min read M TJX KSS SPY XRT Quick Read Macy's dropped 5% despite nearly doubling the $0.36 EPS consensus, as investors discounted a raised outlook that includes a 5-cent tariff refund benefit.\n\nKohl's (KSS) slipped under 1% and TJX held flat, confirming the selloff is Macy's-specific rather than a broader retail repricing.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and TJX Companies didn't make the cut. Enter your email to see the names that beat TJX. The report is free. Enter your email and see if any of your stocks made the cut.\n\nShares of Macy's, Inc. ( NYSE:M ) are down 5% to $20.45 in early Thursday trading. The slide arrives despite a fiscal second-quarter beat and a raised full-year outlook that the company delivered before the open.\n\nThe reaction looks company-specific, since retail peers are barely moving on the same session. That locates the response inside Macy's own numbers and the composition of its raised guidance rather than in any broader repricing of department stores or off-price retail.\n\nMacy's came into today's report carrying momentum. Macy's stock was up 23% over the trailing year through Wednesday's close, though it entered the session already down 18% over the past month.\n\nMacy's said overall comparable sales rose 2.7% across its three nameplates in the quarter, extending a five-quarter stretch of positive comps. Adjusted EPS came in at $0.63 against a $0.36 consensus, and revenue of $5.06 billion beat the $4.80 billion Street mark. Gross margin expanded 180 basis points to 41.5%, aided by tariff repayments landing in cost of goods sold.\n\nThe higher-end brands carried the mix.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago"}, {"title": "Coinbase partners with Moov to boost community bank stablecoin capabilities before Clarity vote", "full_content": "Coinbase is partnering with financial services provider Moov to increase access to stablecoin capabilities such as acceptance, settlement and real-time funding for community banks and credit unions ahead of a key vote on crypto legislation in the U.S. Senate next week.\n\nThe partnership, shared exclusively with CNBC, comes just days before a crucial preliminary vote on the Senate floor to advance the Clarity Act . The bill, which has languished in Senate limbo for months , would set up a first-of-its-kind regulatory framework for cryptocurrencies and other types of digital assets.\n\nCoinbase and other parts of the crypto industry have pushed hard for the Senate to pass the bill. But the Clarity Act has run into opposition from banks, which are opposed to interest-like rewards offered on crypto exchanges and warn they could cause deposit flight from community banks and credit unions. The new partnership may help bridge the divide between community banks and crypto.\n\nIndependent Community Bankers of America, the trade association for community banks, has been part of a broader coalition of banking groups that has opposed the Clarity Act, including the latest version, over concerns about stablecoin yields.\n\nUnder the new agreement, Coinbase will provide digital asset infrastructure while Moov will connect that infrastructure to its payment systems that financial institutions and their customers already use \u2014 delivering stablecoin capabilities and payment rails to community banks. Moov already services more than 1,000 community banks and credit unions across the U.S., according to a press release announcing the partnership, connecting them to card acquiring and issuing and real-time payment rails.\n\n\"Community banks and credit unions have witnessed their customers use digital assets for years,\" said Ryan VanGrack, vice chair and head of corporate affairs at Coinbase.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:47 PM IST", "pub_date_relative": "17m ago"}, {"title": "Canara Bank plans to raise Rs 4,500 crore through AT-1 bonds next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Canara Bank plans to raise Rs 4,500 crore through AT-1 bonds next week Canara Bank Share Price Union Bank of India Share Price Punjab National Bank Share Price Bank of Baroda Share Price Indian Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Canara Bank plans to raise Rs 4,500 crore through AT-1 bonds next week SECTIONS Canara Bank plans to raise Rs 4,500 crore through AT-1 bonds next week By Atmadip Ray , ET Bureau Last Updated: Sep 10, 2026, 06:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Canara Bank plans to raise up to Rs 4,500 crore through Basel III-compliant AT-1 bonds next week at an expected 7.85%-7.90% coupon. The issue is part of its Rs 8,500 crore fiscal capital plan, with Tier 2 bonds planned later.\n\nOn Wednesday, Indian government bonds showed some fluctuations but still managed to outperform their global counterparts. Rising oil prices and increased concerns regarding supply chains pushed international bond yields higher. However, India's banking system's surplus liquidity helped stabilize local debt. Market participants are now closely monitoring upcoming inflation figures and central bankers' policy moves, with the Reserve Bank of India potentially using liquidity-reducing measures to keep the market in check.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago"}, {"title": "Motor insurance pitfalls: Why claims get rejected \u2014 6 key points policyholders should keep in mind", "full_content": "A motor insurance policy seems simple on the surface: secure third-party coverage, include own-damage protection, and submit a claim whenever an accident occurs. However, real-world claim rejections usually stem from small, easily overlooked details\u2014ranging from an expired driving licence and undisclosed pre-existing scratches to inaccurate disclosures and missing policy add-ons.\n\nFailing to meet basic regulatory compliance is a primary reason claims fall through. Additionally, widespread misconceptions about policy features frequently lead to avoidable disputes between policyholders and insurers.\n\nHere are six important points policyholders should keep in mind.\n\nWhile purchasing or renewing a motor insurance policy, policyholders should provide accurate information about previous claims, no-claim bonus (NCB), vehicle ownership, usage, modifications and other relevant details.\n\nMisrepresentation or incorrect disclosure can become a major issue when a claim is filed. Information that may appear insignificant at the time of buying a policy could become relevant during claim assessment.\n\nPolicyholders should also inform their insurer about important changes during the policy period, including a transfer of ownership, change in vehicle usage, significant modifications or any previously supplied incorrect information.\n\nUnder a standard motor insurance policy, depreciation is generally deducted from the value of various vehicle parts, including plastic, rubber, nylon and certain metallic components, depending on the vehicle's age.\n\nA zero-depreciation or zero-dep add-on reduces or eliminates depreciation deductions for eligible parts following an accident.", "source": "LiveMint Money", "pub_date_str": "10 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago"}, {"title": "Stock futures tumble as U.S. oil prices jump over $100 a barrel: Live updates - CNBC", "full_content": "Stock futures tumble as U.S. oil prices jump over $100 a barrel: Live updates CNBC Stock Market Today: Dow Barely Up Ahead Of Inflation Data; Nvidia Chipmaker Falls On Sales (Live Coverage) Investor's Business Daily Stock market today: Nasdaq futures sink, Dow and S&P 500 look to snap 3-day losing streak ahead of inflation data Yahoo Finance US Stocks Eke Out Gains Before PPI, Tech Earnings: Markets Wrap Bloomberg.com S&P 500, Nasdaq futures extend losses slightly after August PPI data TradingView", "source": "Google News Business", "pub_date_str": "10 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago"}, {"title": "AMD Stock\u2019s 10-Year, 6,800% Rally Was Just the Beginning. Here\u2019s Where AMD Could Be Headed Next", "full_content": "Skip to navigation Skip to main content Skip to right column AMD Stock\u2019s 10-Year, 6,800% Rally Was Just the Beginning. Here\u2019s Where AMD Could Be Headed Next Vandita Jadeja Thu, September 10, 2026 at 6:15 AM PDT 6 min read AMD META ORCL Quick Read AMD's Data Center revenue doubled year-over-year to $6.7B in Q2 2026, with shares up 143% YTD and a credible path toward $800 per share by 2028.\n\nLisa Su guided revenue growth substantially above 35% and EPS exceeding $20, backed by anchor GPU commitments from OpenAI, Meta, Anthropic, and Oracle.\n\nReaching $800 hinges on Helios ramping on schedule, FY2027 EPS landing near $19.96, and the AI capex cycle holding, though tariff escalation or a China ban could derail it.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and AMD didn't make the cut. Enter your email to see the names that beat AMD. The report is free. Enter your email and see if any of your stocks made the cut.\n\nAMD ( NASDAQ:AMD ) has become the second horse in the AI infrastructure race, and the market is finally pricing it that way. Data Center revenue more than doubled year-over-year to a record $6.7 billion in Q2 2026, Helios racks are shipping, and Anthropic just committed to up to 2 GW of MI450 Series GPUs.\n\nShares are up 143.32% year to date. The real question is whether this stock can push to $800 by 2028. Here is my read on the path.\n\nNothing in the price action screams \"stuck.\" Shares are up 14.01% in the last week and 10.98% over the past month. The problem is the setup. AMD trades at a beta of 2.476, meaning any pullback in the AI trade hits this name twice as hard.\n\nTwo overhangs matter. First, the Gaming segment shrank 31% year-over-year in Q2, a reminder that not every line is inflecting. Second, the tariff narrative is back in headlines, and semiconductor imports are squarely in scope.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "\u2018I\u2019m the executor\u2019: My two siblings and I inherited an IRA. Can we just cash it out?", "full_content": "\u201cAm I required to create three new inherited IRAs so that the firm can divide it equally?\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "10 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago"}, {"title": "Copper, FCX Stock Plunge On Tariff Report, Surging Yields; Silver, Gold Also Fall", "full_content": "Store Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Stocks On The Move New Highs Stock Spotlight Stocks Near Buy Zone RS Line At New High Rising Profit Estimates Stocks Funds Are Buying Your Weekly Review Breakout Stocks Index IBD ETF Indexes IBD Data Tables IBD Digital: 2 Months for $20 New? Start Here Research STOCK RESEARCH IBD Stock Checkup Stock Of The Day Screen Of The Day IBD Charts Stock Screener Swing Trading Options Investing Action Plan Earnings Preview Earnings Calendar IBD Industry Themes The New America Best ETFs Best Mutual Funds The Income Investor IBD Stock Analysis Industry Snapshot IBD 50 Stocks To Watch IBD Data Stories IBD Digital: 2 Months for $20 News NEWS eIBD Technology Magnificent Seven Stocks Personal Finance Special Reports Cryptocurrency Retirement Management ECONOMY Economic Calendar Economic News IBD Digital: 2 Months for $20 Videos VIDEOS & PODCASTS IBD Live How To Invest Videos Options Videos Investing With IBD Podcast Growth Stories Podcast Webinars Online Courses IBD Digital: 2 Months for $20 Learn HOW TO INVEST How To Invest In Stocks Stock Investing Keys Stock Market Timing Track Market Trends How To Read Stock Charts How To Buy Stocks When To Sell Stocks Short Selling Swing Trading What Is Crypto EDUCATIONAL RESOURCES New to IBD Investor's Corner Investing With IBD Podcast Events & Webinars IBD Moneyworks 12 Days Of Learning Investing Infographics Premium Online Courses Premium Workshops Store My .", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago"}, {"title": "Sweet trouble: Sugar prices surge to 17-month high as govt warns mills against festival hoarding", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Sweet trouble: Sugar prices surge to 17-month high as govt warns mills against festival hoarding The Economic Times daily newspaper is available online now. Read Today's Paper Sweet trouble: Sugar prices surge to 17-month high as govt warns mills against festival hoarding SECTIONS Sweet trouble: Sugar prices surge to 17-month high as govt warns mills against festival hoarding ET Online Last Updated: Sep 10, 2026, 06:43:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Raw sugar futures have reached their highest level since March 2025. Strong Indian import demand and Brazilian supply disruptions are driving these gains. India has opened a tax-free import quota to meet domestic needs. The government warns mills against unjustified price increases during festivals. El Ni\u00f1o and oil prices also influence the global sugar market.\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "10 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago"}, {"title": "Apple makes biggest change to iPhone release cadence in 7 years in Ternus' first showcase as CEO", "full_content": "In John Ternus' debut showcase as CEO, Apple unveiled a swarm of new products, including its first foldable phone called the iPhone Duo, as well as the iPhone 18 Pro and Pro Max with a larger screen.\n\nBut the biggest news for investors from Wednesday's event may be the absence of an iPhone 18 without the Pro moniker.\n\nAnalysts in recent months have largely expected this shift in Apple's annual cadence, and foresee Apple releasing its mainline iPhone at an event in the spring, when the company has previously announced new low-cost models, including the iPhone SE and iPhone 16e.\n\nThe least expensive new iPhone announced on Wednesday was the iPhone 18 Pro, which starts at $1,199 in the U.S., representing a $100 price increase. Prior to the event, the iPhone 17 cost $799, but was listed at $899 afterwards. Apple raised prices of Macs and iPads in June in response to a global shortage in memory and other components that former CEO Tim Cook called \"unsustainable\" in an interview with the Wall Street Journal.\n\nTernus replaced Cook at the helm on Sept. 1, becoming just the second Apple CEO since Steve Jobs resigned in 2011 shortly before his death. Cook has warned that supply constraints will persist, and the company noted during its earnings call in July that it would become an even bigger issue for the company during the September quarter.\n\nHolding the mainstream iPhones until the spring is a new tactic for Apple. Industry analysts said on Wednesday that the company has been looking to smooth out its revenue from quarter to quarter, and could potentially achieve that with the split-launch strategy.\n\nHistorically, Apple's biggest quarter has been its first fiscal quarter, which is the first full quarter of iPhone sales and also includes Christmas. The two quarters that follow are typically much slower.\n\nA big iPhone launch in March or April with a lower-priced device would do a lot to smooth out Apple's sales during its slower season, analysts said .", "source": "CNBC World Economy", "pub_date_str": "10 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago"}, {"title": "La-Z-Boy Director Janet Kerr Sells 3,653 Shares for $116,000", "full_content": "Skip to navigation Skip to main content Skip to right column La-Z-Boy Director Janet Kerr Sells 3,653 Shares for $116,000 John Ballard, The Motley Fool Thu, September 10, 2026 at 6:13 AM PDT 4 min read LZB Director Janet Kerr sold 3,653 shares of La-Z-Boy Incorporated (NYSE:LZB) on Sept. 8, 2026, according to a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($31.75); post-transaction value based on September 08, 2026, market close ($31.67).\n\nWhat was the structural framework for this transaction? The sale was conducted under a Rule 10b5-1 trading plan, which Janet Kerr adopted on March 12, 2026. These plans allow corporate insiders to set a predetermined schedule for selling stock to avoid concerns about possessing non-public information.\n\nHow does the execution price compare to recent market valuation? The shares were sold at a weighted average price of $31.7545 per share, slightly above the $31.67 market close on the day of the transaction. The stock was priced at $31.37 as of the Sept. 9, 2026, market close, representing a minor decrease from the execution level.\n\nWhat is the insider's remaining direct equity exposure? After completing the sale of 3,653 shares, the director retains direct ownership of 4,125 shares. This remaining position represents an estimated 0.0103% of the company's total shares outstanding.\n\nWhat is the company's current operational footprint? La-Z-Boy Incorporated is a furniture company engaged in the manufacturing, distribution, and retail sales of upholstered furniture and case goods.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:43 PM IST", "pub_date_relative": "22m ago"}, {"title": "'Buy' Nephrocare Health Services for 16% upside, says ICICI Securities; check share price target", "full_content": "A healthcare stock has been on a bull run of late, defying weak stock market sentiment. Still, ICICI Securities believes it has more steam left. The brokerage firm has upgraded the stock to a 'buy' from an 'add' and raised the target price.\n\nThe stock we are discussing is Nephrocare Health Services. The stock has jumped 64% year-to-date compared to a 12% drop in equity benchmark Sensex.\n\nOn a monthly scale, Nephrocare Health Services share price has been in the green since April this year. So far in September, it has clocked a gain of nearly 10%.\n\nNephrocare Health shares hit a 52-week high of \u20b9 767.95 on 12 June this year after hitting a 52-week low of \u20b9 445 on 19 December last year.\n\nOn Thursday, 10 September, the stock ended 1.94% higher at \u20b9 747.35 on the BSE.\n\nIn an 8 September report, ICICI Securities upgraded recommendation on the stock to a 'buy' from an 'add' earlier, increasing the target price to \u20b9 825 from \u20b9 725 earlier, valuing the company at 33 times FY28E earnings compared to 30 times earlier.\n\nAccording to ICICI Securities, the stock currently trades at valuations of 37.5 times FY27E and 28.4 times FY28E earnings, and EV/EBITDA multiples of 22 times FY27E and 16.8 times FY28E.\n\nICICI Securities expects Nephrocare's revenue, EBITDA, and PAT CAGRs of nearly 21.7%, 27.6%, and 43.4%, respectively, over FY26\u201329E, with operating leverage driving a 356 basis points jump in the EBITDA margin to 26.5% in FY29E.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 06:42 PM IST", "pub_date_relative": "22m ago"}, {"title": "I\u2019m Buying Apple\u2019s Dip For Its Unbeatable Two-Way Game", "full_content": "Skip to navigation Skip to main content Skip to right column I\u2019m Buying Apple\u2019s Dip For Its Unbeatable Two-Way Game Alex Sirois Thu, September 10, 2026 at 6:12 AM PDT 5 min read AAPL MSFT Quick Read Apple's 2.5 billion active devices funnel customers into a Services business earning 75.6% gross margins, backing nine straight EPS beats.\n\nUnlike Microsoft's cloud-first model, Apple owns an unmatched hardware distribution channel that no competitor can replicate at scale.\n\nTim Cook called memory pricing a '100-year flood,' yet Apple guided gross margins to 47%-48%, showing its pricing power holds under pressure.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Apple didn't make the cut. Enter your email to see the names that beat AAPL. The report is free. Enter your email and see if any of your stocks made the cut.\n\nI keep hitting the buy button on Apple ( NASDAQ:AAPL ) every time the market hands me a discount, and this week it did. Shares are down 2.96% over the past week to $315.34, and I added again. The setup is simple. Apple runs a two-way game almost nobody else can match: it sells the most defensible piece of hardware on the planet, then keeps that customer for life through a Services business that compounds at software economics.\n\nEvery quarter I open the segment table and see the same story get better. In the June quarter, iPhone revenue rose to $54.25B from $44.58B a year earlier, and Services climbed to $30.74B from $27.42B. That Services line carried a 75.6% gross margin against a company-wide 50.1%. Selling an iPhone is good business. Renting the App Store, iCloud, Apple TV, AppleCare, and payments to the same customer for a decade is a better one.\n\nThe scale is what makes the moat defensive. Apple's installed base topped 2.5 billion active devices, and paid subscriptions surpassed 1.5 billion.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:42 PM IST", "pub_date_relative": "22m ago"}], "cfa": [{"title": "Jim Cramer's top 10 things to watch in the stock market Thursday", "full_content": "Stocks tumble as oil tops $100.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "U.S. crude oil tops $100 again \u2013 last seen in May \u2013 as market braces for prolonged Iran war", "full_content": "Crude oil prices jumped 4% on Thursday as the market braces for a prolonged war in the Persian Gulf after fighting between the U.S. and Iran sharply escalated this week.\n\nU.S. West Texas Intermediate futures were up 4.3% to $100.19 per barrel by 9:14 a.m. ET, the highest level since May. Brent crude , the international benchmark, traded 4% higher to $105.28 a barrel.\n\nTop White House advisors have discussed with President Donald Trump the possibility that the Iran war could drag on past Inauguration Day in January 2029, U.S. officials told The Wall Street Journal .\n\nThe report contradicts Trump's claim Wednesday that the war would end immediately after the midterm elections. He has asserted for months the conflict was drawing to a close, only for fighting to escalate.\n\nTrump claimed to reporters Wednesday that oil and gasoline prices would fall after the midterms. Pump prices hit a Labor Day record Monday and diesel is expected to cross $6 per gallon for the first time ever in the coming days.\n\nTrump said Iran was \"desperate to try and affect the election, so that we can get a nice weak group of people in there, and leave them alone and let them have their nuclear weapon.\"\n\nFighting between the Washington and Tehran has erupted this month after a period of relative calm in August. Iran has tried to attack American warships several times while the U.S. military has destroyed at least eight Iranian tankers since Saturday in retaliation.\n\nIran's Houthi allies in Yemen attacked several energy facilities and other targets in Saudi Arabia this week, injuring more than 70 civilians and raising concerns that the war was broadening.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:56 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Wholesale prices rose 0.4% in August, as expected", "full_content": "U.S. wholesale prices rose in August, according to a report Thursday that could play a key role in the Federal Reserve's upcoming interest rate decision.\n\nThe producer price index , a measure of final demand costs for goods and services, increased a seasonally adjusted 0.4% for the month, in line with the Dow Jones consensus, the Bureau of Labor Statistics reported.\n\nOn an annual basis, that put the PPI at 5.4%, still well above the Fed's 2% inflation target and 0.1 percentage point higher than expected. The PPI rose 0.1% in July, a slight upward revision from the original estimate of no change.\n\nExcluding food and energy, the core PPI accelerated by 0.2%, against the forecast for a 0.3% increase. Core less trade services, another volatile category, was up 0.3%, in line with estimates.\n\nStock market futures were negative following the report, the release of which coincided with U.S. crude oil prices topping $100 a barrel. Treasury yields moved sharply higher, with the 10-year note hitting its highest since November 2023.\n\n\"Net, net, today's PPI inflation report does nothing to turn down the warnings about the inflation threats the economy faces, especially if you are an inflation hawk with an itchy trigger finger at the Federal Reserve,\" wrote Chris Rupkey, chief economist at Fwdbonds.\n\nEnergy prices in particular and goods prices overall were responsible for most of the PPI increase. Final demand energy prices rose 4.2%, pushed largely by soaring diesel, which surged 24.1%. Goods prices broadly increased 1.1%.\n\nServices prices were up just 0.1%, with a 2.3% increase in transportation and warehousing accounting for much of that move.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:53 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India's BRICS trade deficit likely to remain key challenge as imports outpace exports: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India's BRICS trade deficit likely to remain key challenge as imports outpace exports: Report The Economic Times daily newspaper is available online now. Read Today's Paper India's BRICS trade deficit likely to remain key challenge as imports outpace exports: Report SECTIONS India's BRICS trade deficit likely to remain key challenge as imports outpace exports: Report ANI Last Updated: Sep 10, 2026, 06:51:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's trade relationship with BRICS nations is set to experience a notable increase in its trade deficit, driven largely by rapidly rising imports. While exports to these countries are gradually improving, the pace is not enough to offset the imports, particularly from major players like China and Russia. India aims to enhance its export capacity within the BRICS framework as a strategic priority.\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "10 Sep 2026, 06:51 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "European Central Bank hikes interest rates to 2.5% as policymakers see risk of higher inflation, weaker growth", "full_content": "The European Central Bank has voted to raise its key deposit rate by 25 basis points to 2.5% from 2.25% in a move widely expected by investors.\n\nBut uncertainty around the U.S.-Iran war continues to cloud the outlook for the ECB's longer-term policy path, market watchers say, and investors will be watching closely for signals in policymakers' remarks later on Thursday.\n\nThe ECB expects baseline inflation, excluding energy and food, to reach 2.5% in 2026, 2.6% in 2027 and 2.3% in 2028.\n\nECB president Christine Lagarde warned that the conflict in the Middle East and recent developments in Russia's war on Ukraine will keep headline inflation \"well above target\" the bank's 2% target for an extended period.\n\nLagarde said in a press conference immediately following the rate hike that despite the \"greater-than-expected resilience\" shown by the euro zone economy, the energy price shock, as well as global trade tensions, remain a risk to growth.\n\n\"The outlook remains highly uncertain, with risks to the upside for inflation and to the downside for economic growth,\" the ECB's Governing Council said, acknowledging a \"broad range of outcomes\" around growth and inflation as a result of the energy shock, including duration and second-round effects.\n\nMarkets priced in a 100% chance of the 25 basis points hike ahead of Thursday's meeting, according to LSEG data.\n\nECB officials have said since the U.S.-Iran war broke out that they would take a meeting-by-meeting approach to monetary policy. The central bank's rates-setting Governing Council will hold a press conference in Berlin, scheduled for 8:45 a.m. E.T., following the decision.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mint Money app adds bill payments, loans at Global Fintech Fest 2026", "full_content": "Mumbai: Mint Money, the fintech app from the Hindustan Times Group, has been unveiled with bill payment services at the 7th Global Fintech Fest 2026 in Mumbai. The app is powered by Bharat Connect, part of the Bharat Bill Payment System (BBPS) run by NPCI Bharat BillPay Ltd.\n\nThe platform combines financial information with borrowing options. Users can check their credit score , understand the factors shaping it, and receive personalised guidance to improve their credit health. Based on their profile, they can explore personal loan offers ranging from \u20b9 5,000 to \u20b9 20 lakh, compare interest rates, and calculate equated monthly instalments (EMI) through an in-app tool. Loans are offered digitally, without collateral or paperwork, through partners such as Stashfin, Aditya Birla Finance, Kissht, Credit Saison, SMFG India Credit and Fibe.\n\nThe launch comes amid a surge in digital borrowing. A Redseer report estimates the digital lending market expanded from \u20b9 15,000 crore in fiscal year 2021 (FY21) to \u20b9 2.2 trillion in FY26, and is set to grow 26-27% annually until FY31\u2014outpacing traditional lending. Nearly 69% of borrowers have taken more than one digital loan, underscoring the importance of repeat borrowing for lenders.\n\nPuneet Jain, chief executive officer of HT Digital, said the app aims to merge \u2018the news, the numbers and the action\u2019. He explained, \u201cTypically, users will read this on Mint in the morning. Then they will go to a bunch of YouTube videos and figure out how it impacts them. For spending time sifting through which financial content is actually credible.\u201d\n\nThe app also introduces an artificial intelligence ( AI ) coach, Money Guru, which explains changes in credit scores and suggests ways to improve them.\n\nJain said the broader goal is to make financial management habitual.", "source": "LiveMint Money", "pub_date_str": "10 Sep 2026, 06:49 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Jim Cramer Said Stay Away From This Drone Stock a Week Before Its Biggest Earnings Beat in Years", "full_content": "Skip to navigation Skip to main content Skip to right column Jim Cramer Said Stay Away From This Drone Stock a Week Before Its Biggest Earnings Beat in Years Jeremy Phillips Thu, September 10, 2026 at 6:18 AM PDT 4 min read AVAV Quick Read AVAV's fiscal Q1 2027 adjusted EPS of $0.59 crushed the $0.25 consensus by 138%, with funded backlog hitting a record $1.5 billion, up 37% year over year.\n\nAeroVironment secured a $464 million LOCUST contract, which represents the first U.S. military production deal for directed energy systems, with shot costs under $10 per firing.\n\nDespite the beat, GAAP net income stayed negative, free cash flow hit -$36 million, and management reaffirmed rather than raised full-year guidance.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and AeroVironment didn't make the cut. Enter your email to see the names that beat AVAV. The report is free. Enter your email and see if any of your stocks made the cut.\n\nOn September 2, Jim Cramer told Mad Money viewers he was saying \"not yet, not now\" on AeroVironment ( NASDAQ:AVAV ) because competition in its corner of defense was too strong. Seven days later, the drone and laser maker posted the biggest earnings beat it has produced in years.\n\nI have been following defense-tech names for a while, and this is the kind of setup that punishes conviction on both sides. Shares walked into the report down 5% on the day and are down 39% year to date. Then the numbers hit.\n\nFiscal Q1 2027 adjusted EPS came in at $0.59 versus the $0.2479 consensus, a 138% surprise. Revenue of $480.49 million topped the $456.09 million estimate and grew 5.7% year over year. Bookings landed at roughly $700 million for a 1.4x book-to-bill, and funded backlog hit a record $1.50 billion, up 37% year over year.\n\nCEO Wahid Nawabi said: \"AV's fiscal year 2027 is off to a strong start, with record first-quarter revenue and funded backlog and landmark strategic wins.\"", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Macy\u2019s Sinks 5% Despite Raised Full-Year Outlook, Kohl\u2019s and TJX Barely Budge", "full_content": "Skip to navigation Skip to main content Skip to right column Macy\u2019s Sinks 5% Despite Raised Full-Year Outlook, Kohl\u2019s and TJX Barely Budge David Moadel Thu, September 10, 2026 at 6:18 AM PDT 5 min read M TJX KSS SPY XRT Quick Read Macy's dropped 5% despite nearly doubling the $0.36 EPS consensus, as investors discounted a raised outlook that includes a 5-cent tariff refund benefit.\n\nKohl's (KSS) slipped under 1% and TJX held flat, confirming the selloff is Macy's-specific rather than a broader retail repricing.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and TJX Companies didn't make the cut. Enter your email to see the names that beat TJX. The report is free. Enter your email and see if any of your stocks made the cut.\n\nShares of Macy's, Inc. ( NYSE:M ) are down 5% to $20.45 in early Thursday trading. The slide arrives despite a fiscal second-quarter beat and a raised full-year outlook that the company delivered before the open.\n\nThe reaction looks company-specific, since retail peers are barely moving on the same session. That locates the response inside Macy's own numbers and the composition of its raised guidance rather than in any broader repricing of department stores or off-price retail.\n\nMacy's came into today's report carrying momentum. Macy's stock was up 23% over the trailing year through Wednesday's close, though it entered the session already down 18% over the past month.\n\nMacy's said overall comparable sales rose 2.7% across its three nameplates in the quarter, extending a five-quarter stretch of positive comps. Adjusted EPS came in at $0.63 against a $0.36 consensus, and revenue of $5.06 billion beat the $4.80 billion Street mark. Gross margin expanded 180 basis points to 41.5%, aided by tariff repayments landing in cost of goods sold.\n\nThe higher-end brands carried the mix.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:48 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Coinbase partners with Moov to boost community bank stablecoin capabilities before Clarity vote", "full_content": "Coinbase is partnering with financial services provider Moov to increase access to stablecoin capabilities such as acceptance, settlement and real-time funding for community banks and credit unions ahead of a key vote on crypto legislation in the U.S. Senate next week.\n\nThe partnership, shared exclusively with CNBC, comes just days before a crucial preliminary vote on the Senate floor to advance the Clarity Act . The bill, which has languished in Senate limbo for months , would set up a first-of-its-kind regulatory framework for cryptocurrencies and other types of digital assets.\n\nCoinbase and other parts of the crypto industry have pushed hard for the Senate to pass the bill. But the Clarity Act has run into opposition from banks, which are opposed to interest-like rewards offered on crypto exchanges and warn they could cause deposit flight from community banks and credit unions. The new partnership may help bridge the divide between community banks and crypto.\n\nIndependent Community Bankers of America, the trade association for community banks, has been part of a broader coalition of banking groups that has opposed the Clarity Act, including the latest version, over concerns about stablecoin yields.\n\nUnder the new agreement, Coinbase will provide digital asset infrastructure while Moov will connect that infrastructure to its payment systems that financial institutions and their customers already use \u2014 delivering stablecoin capabilities and payment rails to community banks. Moov already services more than 1,000 community banks and credit unions across the U.S., according to a press release announcing the partnership, connecting them to card acquiring and issuing and real-time payment rails.\n\n\"Community banks and credit unions have witnessed their customers use digital assets for years,\" said Ryan VanGrack, vice chair and head of corporate affairs at Coinbase.", "source": "CNBC Top News", "pub_date_str": "10 Sep 2026, 06:47 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Canara Bank plans to raise Rs 4,500 crore through AT-1 bonds next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Canara Bank plans to raise Rs 4,500 crore through AT-1 bonds next week Canara Bank Share Price Union Bank of India Share Price Punjab National Bank Share Price Bank of Baroda Share Price Indian Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Canara Bank plans to raise Rs 4,500 crore through AT-1 bonds next week SECTIONS Canara Bank plans to raise Rs 4,500 crore through AT-1 bonds next week By Atmadip Ray , ET Bureau Last Updated: Sep 10, 2026, 06:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Canara Bank plans to raise up to Rs 4,500 crore through Basel III-compliant AT-1 bonds next week at an expected 7.85%-7.90% coupon. The issue is part of its Rs 8,500 crore fiscal capital plan, with Tier 2 bonds planned later.\n\nOn Wednesday, Indian government bonds showed some fluctuations but still managed to outperform their global counterparts. Rising oil prices and increased concerns regarding supply chains pushed international bond yields higher. However, India's banking system's surplus liquidity helped stabilize local debt. Market participants are now closely monitoring upcoming inflation figures and central bankers' policy moves, with the Reserve Bank of India potentially using liquidity-reducing measures to keep the market in check.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Motor insurance pitfalls: Why claims get rejected \u2014 6 key points policyholders should keep in mind", "full_content": "A motor insurance policy seems simple on the surface: secure third-party coverage, include own-damage protection, and submit a claim whenever an accident occurs. However, real-world claim rejections usually stem from small, easily overlooked details\u2014ranging from an expired driving licence and undisclosed pre-existing scratches to inaccurate disclosures and missing policy add-ons.\n\nFailing to meet basic regulatory compliance is a primary reason claims fall through. Additionally, widespread misconceptions about policy features frequently lead to avoidable disputes between policyholders and insurers.\n\nHere are six important points policyholders should keep in mind.\n\nWhile purchasing or renewing a motor insurance policy, policyholders should provide accurate information about previous claims, no-claim bonus (NCB), vehicle ownership, usage, modifications and other relevant details.\n\nMisrepresentation or incorrect disclosure can become a major issue when a claim is filed. Information that may appear insignificant at the time of buying a policy could become relevant during claim assessment.\n\nPolicyholders should also inform their insurer about important changes during the policy period, including a transfer of ownership, change in vehicle usage, significant modifications or any previously supplied incorrect information.\n\nUnder a standard motor insurance policy, depreciation is generally deducted from the value of various vehicle parts, including plastic, rubber, nylon and certain metallic components, depending on the vehicle's age.\n\nA zero-depreciation or zero-dep add-on reduces or eliminates depreciation deductions for eligible parts following an accident.", "source": "LiveMint Money", "pub_date_str": "10 Sep 2026, 06:47 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures tumble as U.S. oil prices jump over $100 a barrel: Live updates - CNBC", "full_content": "Stock futures tumble as U.S. oil prices jump over $100 a barrel: Live updates CNBC Stock Market Today: Dow Barely Up Ahead Of Inflation Data; Nvidia Chipmaker Falls On Sales (Live Coverage) Investor's Business Daily Stock market today: Nasdaq futures sink, Dow and S&P 500 look to snap 3-day losing streak ahead of inflation data Yahoo Finance US Stocks Eke Out Gains Before PPI, Tech Earnings: Markets Wrap Bloomberg.com S&P 500, Nasdaq futures extend losses slightly after August PPI data TradingView", "source": "Google News Business", "pub_date_str": "10 Sep 2026, 06:46 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AMD Stock\u2019s 10-Year, 6,800% Rally Was Just the Beginning. Here\u2019s Where AMD Could Be Headed Next", "full_content": "Skip to navigation Skip to main content Skip to right column AMD Stock\u2019s 10-Year, 6,800% Rally Was Just the Beginning. Here\u2019s Where AMD Could Be Headed Next Vandita Jadeja Thu, September 10, 2026 at 6:15 AM PDT 6 min read AMD META ORCL Quick Read AMD's Data Center revenue doubled year-over-year to $6.7B in Q2 2026, with shares up 143% YTD and a credible path toward $800 per share by 2028.\n\nLisa Su guided revenue growth substantially above 35% and EPS exceeding $20, backed by anchor GPU commitments from OpenAI, Meta, Anthropic, and Oracle.\n\nReaching $800 hinges on Helios ramping on schedule, FY2027 EPS landing near $19.96, and the AI capex cycle holding, though tariff escalation or a China ban could derail it.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and AMD didn't make the cut. Enter your email to see the names that beat AMD. The report is free. Enter your email and see if any of your stocks made the cut.\n\nAMD ( NASDAQ:AMD ) has become the second horse in the AI infrastructure race, and the market is finally pricing it that way. Data Center revenue more than doubled year-over-year to a record $6.7 billion in Q2 2026, Helios racks are shipping, and Anthropic just committed to up to 2 GW of MI450 Series GPUs.\n\nShares are up 143.32% year to date. The real question is whether this stock can push to $800 by 2028. Here is my read on the path.\n\nNothing in the price action screams \"stuck.\" Shares are up 14.01% in the last week and 10.98% over the past month. The problem is the setup. AMD trades at a beta of 2.476, meaning any pullback in the AI trade hits this name twice as hard.\n\nTwo overhangs matter. First, the Gaming segment shrank 31% year-over-year in Q2, a reminder that not every line is inflecting. Second, the tariff narrative is back in headlines, and semiconductor imports are squarely in scope.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:45 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Copper, FCX Stock Plunge On Tariff Report, Surging Yields; Silver, Gold Also Fall", "full_content": "Store Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Stocks On The Move New Highs Stock Spotlight Stocks Near Buy Zone RS Line At New High Rising Profit Estimates Stocks Funds Are Buying Your Weekly Review Breakout Stocks Index IBD ETF Indexes IBD Data Tables IBD Digital: 2 Months for $20 New? Start Here Research STOCK RESEARCH IBD Stock Checkup Stock Of The Day Screen Of The Day IBD Charts Stock Screener Swing Trading Options Investing Action Plan Earnings Preview Earnings Calendar IBD Industry Themes The New America Best ETFs Best Mutual Funds The Income Investor IBD Stock Analysis Industry Snapshot IBD 50 Stocks To Watch IBD Data Stories IBD Digital: 2 Months for $20 News NEWS eIBD Technology Magnificent Seven Stocks Personal Finance Special Reports Cryptocurrency Retirement Management ECONOMY Economic Calendar Economic News IBD Digital: 2 Months for $20 Videos VIDEOS & PODCASTS IBD Live How To Invest Videos Options Videos Investing With IBD Podcast Growth Stories Podcast Webinars Online Courses IBD Digital: 2 Months for $20 Learn HOW TO INVEST How To Invest In Stocks Stock Investing Keys Stock Market Timing Track Market Trends How To Read Stock Charts How To Buy Stocks When To Sell Stocks Short Selling Swing Trading What Is Crypto EDUCATIONAL RESOURCES New to IBD Investor's Corner Investing With IBD Podcast Events & Webinars IBD Moneyworks 12 Days Of Learning Investing Infographics Premium Online Courses Premium Workshops Store My .", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sweet trouble: Sugar prices surge to 17-month high as govt warns mills against festival hoarding", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Sweet trouble: Sugar prices surge to 17-month high as govt warns mills against festival hoarding The Economic Times daily newspaper is available online now. Read Today's Paper Sweet trouble: Sugar prices surge to 17-month high as govt warns mills against festival hoarding SECTIONS Sweet trouble: Sugar prices surge to 17-month high as govt warns mills against festival hoarding ET Online Last Updated: Sep 10, 2026, 06:43:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Raw sugar futures have reached their highest level since March 2025. Strong Indian import demand and Brazilian supply disruptions are driving these gains. India has opened a tax-free import quota to meet domestic needs. The government warns mills against unjustified price increases during festivals. El Ni\u00f1o and oil prices also influence the global sugar market.\n\nBigger or Better: One order from Power Grid Corp added $1 billion to the market cap of a company \u2013 Final part\n\nBanks have received a flood of money. Now comes the real test\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "10 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Apple makes biggest change to iPhone release cadence in 7 years in Ternus' first showcase as CEO", "full_content": "In John Ternus' debut showcase as CEO, Apple unveiled a swarm of new products, including its first foldable phone called the iPhone Duo, as well as the iPhone 18 Pro and Pro Max with a larger screen.\n\nBut the biggest news for investors from Wednesday's event may be the absence of an iPhone 18 without the Pro moniker.\n\nAnalysts in recent months have largely expected this shift in Apple's annual cadence, and foresee Apple releasing its mainline iPhone at an event in the spring, when the company has previously announced new low-cost models, including the iPhone SE and iPhone 16e.\n\nThe least expensive new iPhone announced on Wednesday was the iPhone 18 Pro, which starts at $1,199 in the U.S., representing a $100 price increase. Prior to the event, the iPhone 17 cost $799, but was listed at $899 afterwards. Apple raised prices of Macs and iPads in June in response to a global shortage in memory and other components that former CEO Tim Cook called \"unsustainable\" in an interview with the Wall Street Journal.\n\nTernus replaced Cook at the helm on Sept. 1, becoming just the second Apple CEO since Steve Jobs resigned in 2011 shortly before his death. Cook has warned that supply constraints will persist, and the company noted during its earnings call in July that it would become an even bigger issue for the company during the September quarter.\n\nHolding the mainstream iPhones until the spring is a new tactic for Apple. Industry analysts said on Wednesday that the company has been looking to smooth out its revenue from quarter to quarter, and could potentially achieve that with the split-launch strategy.\n\nHistorically, Apple's biggest quarter has been its first fiscal quarter, which is the first full quarter of iPhone sales and also includes Christmas. The two quarters that follow are typically much slower.\n\nA big iPhone launch in March or April with a lower-priced device would do a lot to smooth out Apple's sales during its slower season, analysts said .", "source": "CNBC World Economy", "pub_date_str": "10 Sep 2026, 06:43 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "La-Z-Boy Director Janet Kerr Sells 3,653 Shares for $116,000", "full_content": "Skip to navigation Skip to main content Skip to right column La-Z-Boy Director Janet Kerr Sells 3,653 Shares for $116,000 John Ballard, The Motley Fool Thu, September 10, 2026 at 6:13 AM PDT 4 min read LZB Director Janet Kerr sold 3,653 shares of La-Z-Boy Incorporated (NYSE:LZB) on Sept. 8, 2026, according to a recent SEC Form 4 filing .\n\nTransaction value based on SEC Form 4 weighted average sale price ($31.75); post-transaction value based on September 08, 2026, market close ($31.67).\n\nWhat was the structural framework for this transaction? The sale was conducted under a Rule 10b5-1 trading plan, which Janet Kerr adopted on March 12, 2026. These plans allow corporate insiders to set a predetermined schedule for selling stock to avoid concerns about possessing non-public information.\n\nHow does the execution price compare to recent market valuation? The shares were sold at a weighted average price of $31.7545 per share, slightly above the $31.67 market close on the day of the transaction. The stock was priced at $31.37 as of the Sept. 9, 2026, market close, representing a minor decrease from the execution level.\n\nWhat is the insider's remaining direct equity exposure? After completing the sale of 3,653 shares, the director retains direct ownership of 4,125 shares. This remaining position represents an estimated 0.0103% of the company's total shares outstanding.\n\nWhat is the company's current operational footprint? La-Z-Boy Incorporated is a furniture company engaged in the manufacturing, distribution, and retail sales of upholstered furniture and case goods.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:43 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "'Buy' Nephrocare Health Services for 16% upside, says ICICI Securities; check share price target", "full_content": "A healthcare stock has been on a bull run of late, defying weak stock market sentiment. Still, ICICI Securities believes it has more steam left. The brokerage firm has upgraded the stock to a 'buy' from an 'add' and raised the target price.\n\nThe stock we are discussing is Nephrocare Health Services. The stock has jumped 64% year-to-date compared to a 12% drop in equity benchmark Sensex.\n\nOn a monthly scale, Nephrocare Health Services share price has been in the green since April this year. So far in September, it has clocked a gain of nearly 10%.\n\nNephrocare Health shares hit a 52-week high of \u20b9 767.95 on 12 June this year after hitting a 52-week low of \u20b9 445 on 19 December last year.\n\nOn Thursday, 10 September, the stock ended 1.94% higher at \u20b9 747.35 on the BSE.\n\nIn an 8 September report, ICICI Securities upgraded recommendation on the stock to a 'buy' from an 'add' earlier, increasing the target price to \u20b9 825 from \u20b9 725 earlier, valuing the company at 33 times FY28E earnings compared to 30 times earlier.\n\nAccording to ICICI Securities, the stock currently trades at valuations of 37.5 times FY27E and 28.4 times FY28E earnings, and EV/EBITDA multiples of 22 times FY27E and 16.8 times FY28E.\n\nICICI Securities expects Nephrocare's revenue, EBITDA, and PAT CAGRs of nearly 21.7%, 27.6%, and 43.4%, respectively, over FY26\u201329E, with operating leverage driving a 356 basis points jump in the EBITDA margin to 26.5% in FY29E.", "source": "LiveMint Markets", "pub_date_str": "10 Sep 2026, 06:42 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "I\u2019m Buying Apple\u2019s Dip For Its Unbeatable Two-Way Game", "full_content": "Skip to navigation Skip to main content Skip to right column I\u2019m Buying Apple\u2019s Dip For Its Unbeatable Two-Way Game Alex Sirois Thu, September 10, 2026 at 6:12 AM PDT 5 min read AAPL MSFT Quick Read Apple's 2.5 billion active devices funnel customers into a Services business earning 75.6% gross margins, backing nine straight EPS beats.\n\nUnlike Microsoft's cloud-first model, Apple owns an unmatched hardware distribution channel that no competitor can replicate at scale.\n\nTim Cook called memory pricing a '100-year flood,' yet Apple guided gross margins to 47%-48%, showing its pricing power holds under pressure.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now, and Apple didn't make the cut. Enter your email to see the names that beat AAPL. The report is free. Enter your email and see if any of your stocks made the cut.\n\nI keep hitting the buy button on Apple ( NASDAQ:AAPL ) every time the market hands me a discount, and this week it did. Shares are down 2.96% over the past week to $315.34, and I added again. The setup is simple. Apple runs a two-way game almost nobody else can match: it sells the most defensible piece of hardware on the planet, then keeps that customer for life through a Services business that compounds at software economics.\n\nEvery quarter I open the segment table and see the same story get better. In the June quarter, iPhone revenue rose to $54.25B from $44.58B a year earlier, and Services climbed to $30.74B from $27.42B. That Services line carried a 75.6% gross margin against a company-wide 50.1%. Selling an iPhone is good business. Renting the App Store, iCloud, Apple TV, AppleCare, and payments to the same customer for a decade is a better one.\n\nThe scale is what makes the moat defensive. Apple's installed base topped 2.5 billion active devices, and paid subscriptions surpassed 1.5 billion.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:42 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How SiTime\u2019s (SITM) Silicon Timing Devices Power AI Data Centers", "full_content": "Skip to navigation Skip to main content Skip to right column How SiTime\u2019s (SITM) Silicon Timing Devices Power AI Data Centers Soumya Eswaran Thu, September 10, 2026 at 6:12 AM PDT 3 min read SITM Barometer Capital Management , an independent asset and wealth management firm, released its second-quarter 2026 investor letter. The letter can be downloaded here . The second quarter experienced significant volatility driven by macro and headline risks. Concurrently, an upcoming Federal Reserve leadership transition contributed to policy uncertainty, and rising inflation concerns re-emerged, resulting in choppy, headline-driven price movements throughout the period. During the quarter, the firm adopted defensive postures in response to rising risks; however, the market showed resilience, absorbing shocks without following a clear downward trend. Although volatility challenged strategies aimed at capturing durable trends, emerging leadership in specific sectors provided hope. The Barometer Tactical Equity Pool reflected strength in Industrials, IT, and Financials, encouraging a patient approach aligned with robust areas. Industrials and Financials were the leading contributors to the Barometer Tactical Balanced Pool. The Barometer Global Macro Pool struggled in a challenging, non-trending environment, where gains in international equities were outweighed by losses in precious metals and the Pool's short position. Despite ongoing risks such as inflation and geopolitical tensions, the outlook is cautiously optimistic, with readiness to capitalize on clearer trends as they develop. Also, check the fund's top five holdings to see its best picks in 2026.\n\nIn its second-quarter 2026 investor letter, Barometer Capital Management highlighted SiTime Corporation (NASDAQ: SITM ). SiTime Corporation (NASDAQ:SITM) designs and develops solutions for silicon timing systems. On September 09, 2026, SiTime Corporation (NASDAQ:SITM) closed at $589.87 per share.", "source": "Yahoo Finance", "pub_date_str": "10 Sep 2026, 06:42 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "10 Sep 2026, 07:05 PM IST", "total_stories": 411};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
