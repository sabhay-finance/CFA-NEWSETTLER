ices. This will enhance the company's capacity to generate energy & power.\n\nIn the last six months, Suzlon's share price has risen by around 5.50%, but in the YTD, it has delivered zero returns, logging an over 16% dip.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 01:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "Gold rebounds toward $4,350 after sharp drop as Fed hike bets stay elevated", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 12:56 PM IST", "pub_date_relative": "12m ago"}, {"title": "Bethlehem Kudumba Unit Box Office Collection 21: Malayalam Romantic Comedy Maintains Strong Momentum", "full_content": "Directed by Girish AD, Bethlehem Kudumba Unit stars Nivin Pauly and Mamitha Baiju in the lead roles.", "source": "NDTV Profit", "pub_date_str": "11 Sep 2026, 12:55 PM IST", "pub_date_relative": "13m ago"}, {"title": "UK economy grows at fastest pace since February 2025 on possible AI boost", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 12:55 PM IST", "pub_date_relative": "14m ago"}, {"title": "FTSE 100 today: Stocks flat as UK GDP beat offsets Hormuz fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 12:53 PM IST", "pub_date_relative": "15m ago"}, {"title": "Saudi Arabia's Vital East-West Oil Pipeline Hit? Satellite Images Show Huge Smoke Plumes", "full_content": "Satellite imagery and NASA thermal data suggest a possible Houthi strike near Saudi Arabia's 1,200-km Petroline, raising fears over oil exports as Hormuz and Bab al-Mandeb face mounting disruption.", "source": "NDTV Profit", "pub_date_str": "11 Sep 2026, 12:53 PM IST", "pub_date_relative": "15m ago"}, {"title": "Market is down but this 1925 company stock is soaring; surges 20% amid fall of Sensex, Nifty 50", "full_content": "Raymond share price jumped nearly 20% to hit a fresh 52-week high on Friday, 11 September. The stock\u2019s intraday peak was 8.33% above Thursday\u2019s close of \u20b9 853.85 and 6.44% higher than the \u20b9 869 lifetime high recorded earlier this week.\n\nThe sharp rally comes after Raymond completed the demerger of its lifestyle and real estate businesses into independent listed entities, while its aerospace and defence business continues to scale up.\n\nThe remaining Raymond is now focused on two engineering businesses \u2014 Aerospace & Defence and Precision Technology & Auto Components.\n\nAccording to the filing, Raymond\u2019s Aerospace & Defence business reported revenue of \u20b9 123 crore in Q1 FY27, up 40.4% from \u20b9 87 crore in the year-ago quarter. EBITDA rose 25.4% to \u20b9 26 crore, with the segment delivering an EBITDA margin of 21.2%.\n\nThe segment contributed around 19.6% of Raymond\u2019s consolidated total income of \u20b9 628 crore during the quarter.\n\nRaymond\u2019s Q1 FY27 exchange presentation showed an aerospace order book of more than \u20b9 5,960 crore, spread across a 10-year contract horizon. The company also has an active request-for-quotation pipeline worth \u20b9 1,632 crore, more than 2,000 active drawings and the capacity to introduce over 100 new engine SKUs annually.\n\nThe aerospace platform manufactures more than 1,300 aero-engine components, including over 350 parts for the CFM LEAP engine family, and serves more than 25 aerospace customers.\n\nRaymond is also looking to move up the value chain from build-to-print components to complex assemblies, specialised processes and design-to-build solutions.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 12:49 PM IST", "pub_date_relative": "20m ago"}, {"title": "Traditional portfolio diversification isn\u2019t cutting it anymore. Here\u2019s where to pivot, says this $624 billion fund manager.", "full_content": "For Allspring Global Investments, investors should be looking at how they can adapt their strategies to incorporate more liquid alternatives.", "source": "MarketWatch Top Stories", "pub_date_s part of the project, the company will install 64 of its flagship S144 wind turbines. The firm will also execute the project through its comprehensive EPC offering, covering land acquisition, turbine supply, balance of plant, pooling substation, extra-high-voltage line, commissioning, and operations & maintenance services. This will enhance the company's capacity to generate energy & power.\n\nIn the last six months, Suzlon's share price has risen by around 5.50%, but in the YTD, it has delivered zero returns, logging an over 16% dip.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 01:02 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold rebounds toward $4,350 after sharp drop as Fed hike bets stay elevated", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 12:56 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bethlehem Kudumba Unit Box Office Collection 21: Malayalam Romantic Comedy Maintains Strong Momentum", "full_content": "Directed by Girish AD, Bethlehem Kudumba Unit stars Nivin Pauly and Mamitha Baiju in the lead roles.", "source": "NDTV Profit", "pub_date_str": "11 Sep 2026, 12:55 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "FTSE 100 today: Stocks flat as UK GDP beat offsets Hormuz fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 12:53 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Market is down but this 1925 company stock is soaring; surges 20% amid fall of Sensex, Nifty 50", "full_content": "Raymond share price jumped nearly 20% to hit a fresh 52-week high on Friday, 11 September. The stock\u2019s intraday peak was 8.33% above Thursday\u2019s close of \u20b9 853.85 and 6.44% higher than the \u20b9 869 lifetime high recorded earlier this week.\n\nThe sharp rally comes after Raymond completed the demerger of its lifestyle and real estate businesses into independent listed entities, while its aerospace and defence business continues to scale up.\n\nThe remaining Raymond is now focused on two engineering businesses \u2014 Aerospace & Defence and Precision Technology & Auto Components.\n\nAccording to the filing, Raymond\u2019s Aerospace & Defence business reported revenue of \u20b9 123 crore in Q1 FY27, up 40.4% from \u20b9 87 crore in the year-ago quarter. EBITDA rose 25.4% to \u20b9 26 crore, with the segment delivering an EBITDA margin of 21.2%.\n\nThe segment contributed around 19.6% of Raymond\u2019s consolidated total income of \u20b9 628 crore during the quarter.\n\nRaymond\u2019s Q1 FY27 exchange presentation showed an aerospace order book of more than \u20b9 5,960 crore, spread across a 10-year contract horizon. The company also has an active request-for-quotation pipeline worth \u20b9 1,632 crore, more than 2,000 active drawings and the capacity to introduce over 100 new engine SKUs annually.\n\nThe aerospace platform manufactures more than 1,300 aero-engine components, including over 350 parts for the CFM LEAP engine family, and serves more than 25 aerospace customers.\n\nRaymond is also looking to move up the value chain from build-to-print components to complex assemblies, specialised processes and design-to-build solutions.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 12:49 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Traditional portfolio diversification isn\u2019t cutting it anymore. Here\u2019s where to pivot, says this $624 billion fund manager.", "full_content": "For Allspring Global Investments, investors should be looking at how they can adapt their strategies to incorporate more liquid alternatives.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Sep 2026, 12:49 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Stock Market Bloodbath! Sensex, Nifty fall 1% as crude hits $108: Should investors buy the dip or stay away?", "full_content": "Indian stock markets are facing a fresh bout of selling pressure as a combination of geopolitical tensions, soaring crude oil prices, rising US bond yields and cautious global sentiment weighs heavily on investor confidence.\n\nThe Sensex and Nifty are now heading towards their sixth consecutive week of losses, with the weakness spreading across the broader market rather than remaining confined to a few pockets.\n\nIn Friday's trading session on September 11, Indian benchmark indices came under heavy pressure, mirroring weak global cues. The Sensex crashed more than 740 points, or 1%, to 74,160, while the Nifty 50 plunged around 250 points, or 1%, to an intraday low of 23,231.\n\nThe latest market decline came as Brent crude reclaimed the $108-per-barrel mark after fighting between Yemen-based Houthi militants and Saudi-backed forces intensified.\n\nHareesh V, Head of Commodity Research at Geojit Investments Limited, warned that a sustained rise in oil prices can fuel imported inflation, increase transportation and manufacturing costs, widen the current account deficit, and exert pressure on the rupee.\n\n\u201cThe sustainability of crude oil above $100 per barrel will largely depend on how geopolitical tensions in the Middle East, particularly between the US and Iran, evolve in the coming weeks,\u201d Hareesh V, Head of Commodity Research, Geojit Investments added.\n\nThe pressure on equities is not coming from oil alone. Rising US Treasury yields have emerged as another major factor behind the global stock-market decline. The US 10-year bond yield touched 4.98% on Friday, amid concerns surrounding inflation and increasing US debt.\n\nWith markets already witnessing a significant correction, investors may be tempted to use the decline to accumulate stocks. However, analysts believe the current environment calls for selectivity rather than aggressive buying across the board.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 12:48 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This multibagger SME stock rises 4% to hit a 52-week high after this business update | Do you own?", "full_content": "A multibagger SME stock jumped 4% to hit its 52-week high in intraday deals on the NSE on Friday, 11 September, in a weak market. Shares of Monolithisch India, which have delivered solid multibagger returns year-to-date, opened at \u20b9 1,490 on the NSE SME against its previous close of \u20b9 1,446.40 and rose by 4% to a 52-week high of \u20b9 1,505, looking set to extend gains for the fifth consecutive session.\n\nThe SME stock has jumped over 190% year-to-date, while in the last one year, it has surged more than 205%, delivering multibagger returns, according to NSE data.\n\nIn an exchange filing on 10 September, Monolithisch India said it had successfully secured a quartzite stone block in Nawada District, Bihar, through an e-auction conducted by the Mines and Geology Department, Government of Bihar.\n\nThis stone block has been allocated to the company for a period of 5 years at a winning bid of \u20b9 157 crore. Commercial operations are expected to commence from February or March 2027, said the company.\n\nAccording to the exchange filing, this acquisition is the company\u2019s largest strategic milestone since its inception.\n\nThe Government of Bihar auctioned this block with a mining capacity of 7,10,000 MT per annum, a cumulative capacity of 35,50,000 MT over the 5-year lease term.\n\n\"This capacity will strengthen our raw material security and hedge raw material rates for 5 years, at a time when the Company is significantly expanding its silica ramming mass manufacturing capacity, with consolidated group capacity expected to reach 5,76,000 MTPA,\" said the company.\n\n\"This strategic move will significantly strengthen our competitiveness in quality and cost in the coming years. It is very encouraging that this development coincides with the commencement timeline of our greenfield project. This milestone is expected to help the company achieve optimum capacity utilisation at its greenfield project ahead of schedule,\" said Harsh Tekriwal, Managing Director of Monolithisch India.", "source": "LiveMint Markets", "pub_date_str": "11 Sep 2026, 12:46 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures edge higher as key consumer inflation report looms ahead: Live updates", "full_content": "Stock futures edged higher early Friday as traders looked ahead to August's consumer price index report.\n\nS&P 500 futures were marginally higher, climbing 0.19% while futures linked to the Dow Jones Industrial Average were up 151 points. The Nasdaq 100 futures were up less than 0.1%.\n\nIn the regular trading day, the Dow fell more than 300 points, or 0. o $664 billion, while customer prepayments helped fund capital expenditure. Oracle shares rose 4% after market as investors gained confidence in its AI growth strategy.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Sep 2026, 12:25 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China's wealthy brace for a widening tax net as Beijing closes in", "full_content": "Beijing's recent push to tax the offshore wealth of its citizens may be only the opening phase of a broader campaign for income from the holdings of China's rich families, according to analysts.\n\nYingke Zhou, director at Barclays, views the recent campaign to tax Chinese offshore assets as \"potentially the first steps\" toward tighter oversight of cross-border wealth, as Beijing works to ease fiscal strains and replenish capital to fund strategic technology industries.\n\n\"Policymakers could consider expanding scrutiny to areas such as exporter earnings held offshore, overseas investment [and] employment income, and over the longer term, estate or inheritance taxation,\" Zhou said in a recent report.\n\nUnlike the U.S., U.K., Japan and major European economies, China levies no real estate, inheritance, or gift tax, and draws a comparatively small share of revenue from personal income, capital, and wealth-related levies, according to Bank of America Research.\n\nBofA analysts see a similar path, saying wealthier households face \"offshore interest income, salary and property gains potentially next in scope\" for greater taxation.\n\nZhou expects authorities to widen the tax net to capture returns on overseas real estate, equities, fixed income and precious metals. Such a shift would bring China's practices closer to those of other major economies, he said.\n\nHong Kong and Singapore have been favored havens for wealthy Chinese relocating their fortunes, with the former having built up a substantial trust industry dependent on the mainland's wealth.\n\nRyan Lin, director at Singapore-based Bayfront Law, said cross-border Chinese clients must \"absolutely brace for a permanent, structural tightening as Beijing shifts from passive oversight to a worldwide taxation model akin to the U.S. regime.\"", "source": "CNBC Top News", "pub_date_str": "11 Sep 2026, 12:23 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: China, Hong Kong stocks fall as rate hike fears weigh on sentiment", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China, Hong Kong stocks fall as rate hike fears weigh on sentiment Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China, Hong Kong stocks fall as rate hike fears weigh on sentiment SECTIONS Global Market: China, Hong     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
