    const allData = {"general": [{"title": "China's Xi urges U.S. to cooperate on AI", "full_content": "BEIJING \u2014 Chinese President Xi Jinping told U.S. President Donald Trump that there is more opportunity for cooperation than competition on artificial intelligence.\n\nThat's according to a state media readout of the two leaders' meeting in the White House Oval Office Thursday local time.\n\n\"The two sides can continue AI dialogue, exchange views on risks and benefits, and together guard against the misuse or malicious use of AI,\" Xi said in Chinese, according to a CNBC translation of the state media readout.\n\nHe noted AI is important to both the U.S. and China. \"Both sides have competition. Cooperation, even more so,\" he said.\n\nXi also emphasized that humans should maintain control of the technology, and that AI should support human progress.\n\nThe U.S. has restricted China's ability to access advanced semiconductors for training AI models, and criticized Chinese companies for allegedly taking part in illicit distillation of American AI capabilities.\n\nRecent incidents have raised fears that increasingly autonomous AI models could make attacks faster and harder to contain.\n\nFollowing a meeting with Chinese negotiators in New York, U.S. Treasury Secretary Scott Bessent said earlier this week the two sides had discussed setting up a \"U.S.-China AI Dialogue.\" He said the U.S. proposed introducing an alert system for AI incidents.", "source": "CNBC Finance", "pub_date_str": "25 Sep 2026, 06:52 AM IST", "pub_date_relative": "10m ago"}, {"title": "Tesla poised to scale production of heavy-duty Semi trucks with opening of Nevada factory", "full_content": "Tesla opened its first factory for high-volume production of the Semi, a heavy-duty electric truck, in Sparks, Nevada, on Thursday, as CEO Elon Musk aims to push into big rigs.\n\nThe company first unveiled its Semi in 2017, and started selling the trucks in very limited quantities to early customers, including anchor client PepsiCo ., in 2022. A livestream of the ribbon-cutting event aired Thursday evening.\n\nMusk wasn't at the opening, but he showed up by video recording for the audience, and called the Semi a \"breakthrough product for heavy shipping.\"\n\n\"It's almost like a sports car in truck form,\" said Musk, who is attending a state dinner in Washington, D.C., with President Donald Trump and Chinese Leader Xi Jinping.\n\nThe factory opening comes as Tesla's core business of electric vehicles faces increased competition across the globe, and as soaring diesel costs present a potential opening for a transition to EVs in commercial trucking.\n\nTesla has struggled to gain much traction with its angular steel Cybertruck, a smaller pickup that it first delivered to customers in 2023 .\n\nOn Tuesday, industry coalition ZET SCALE said it \"selected Tesla as its primary original equipment manufacturer\" for an initial order of 2,500 trucks, with the aim of ordering more than 10,000 electric trucks from an array of providers.\n\nTrucking firm Einride also recently said it agreed to order 500 Tesla Semi trucks for its fleet with some deployments planned this month.", "source": "CNBC World Economy", "pub_date_str": "25 Sep 2026, 06:48 AM IST", "pub_date_relative": "14m ago"}, {"title": "Sensex, Nifty 50 prediction today: Stock market outlook for 25 Sept 2026 | GIFT Nifty, Nikkei, Taiwan cues to watch", "full_content": "Stock market prediction on Friday, 25 September, 2026 : Indian equities were set for a muted opening on Friday, September 25, with GIFT Nifty indicating a subdued start as investors remained cautious amid developments in the Middle East. Reuters reported that US and Iranian negotiators were exploring a phased route towards ending the war, while elevated bond yields and crude oil prices continued to weigh on sentiment.\n\nAsian markets traded mixed in early deals, while US stock futures edged lower on Friday, adding to the cautious tone across global markets.\n\nSiddhartha Khemka, Head of Research, Wealth Management, Motilal Oswal Financial Services , said Indian equities could remain under pressure in the near term as uncertainty around a potential resolution to the US-Iran conflict persists, alongside elevated crude oil prices and rising global bond yields.\n\nHe noted that hopes of an early US-Iran deal had weakened after US President Donald Trump indicated that any potential agreement with Iran could come only after the November US midterm elections.\n\nMeanwhile, renewed Houthi activity in the Red Sea and tensions involving Saudi Arabia have added to concerns over global supply disruptions, further increasing inflationary pressures.\n\nThe Indian stock market endured a sharp sell-off on Thursday, September 24, with benchmark indices falling more than 1.5%, wiping out recent gains and slipping below key psychological levels. Rising global bond yields and crude oil volatility weighed heavily on sentiment.\n\nThe Nifty 50 plunged 1.64% to 25,169.50, while the Sensex declined 1.67% to 73,580.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:45 AM IST", "pub_date_relative": "17m ago"}, {"title": "Oil prices fall as markets look to Iran truce, but remain wary of attacks on oil facilities", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:42 AM IST", "pub_date_relative": "20m ago"}, {"title": "Atlanta is getting pandas: China's Xi revives a longtime diplomatic strategy at summit with U.S.", "full_content": "Chinese leader Xi Jinping promised two giant pandas to Zoo Atlanta, reviving Beijing's decades-old charm offensive on the opening day of his first state visit to the U.S. in more than a decade.\n\nTwo giant pandas, Ping Ping and Fu Shuang, from a research base in Chengdu will arrive at the Georgia zoo \"in the coming days,\" Xi said. They would be Zoo Atlanta's first pandas since its previous four returned to China in November 2024, when it became the last U.S. zoo to lose its bears.\n\nThe Chinese president made the announcement at the start of his state visit in Washington, where he and President Donald Trump are meeting through Friday on an agenda spanning artificial intelligence, tariffs, critical minerals, Taiwan and the Iran war.\n\n\"The giant panda has been an envoy of friendship between the Chinese and Americans,\" he said at a White House ceremony.\n\nChina has used pandas as a diplomatic barometer since Mao Zedong sent a pair to Washington's National Zoo following Richard Nixon's 1972 visit, a gift so anticipated that more than a million people came to see the animals in their first year.\n\nBeijing shifted from gifting pandas outright to leasing them in 1984, and the loans have since tracked the temperature of the relationship \u2014 thinning as trade and Taiwan tensions rose, then resuming as San Diego and the Washington DC National Zoo took in new pairs in 2024.\n\nPandas on loan to the U.S. have bred 17 cubs, including six in San Diego, four in Washington and seven in Atlanta, according to Chinese state media .\n\n\"Panda diplomacy conveys a message of friendship and goodwill from China,\" said Wu Xinbo, director of the Center for American Studies at Fudan University. \"Americans may not like China, but they will certainly like pandas.\"", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:42 AM IST", "pub_date_relative": "20m ago"}, {"title": "Gold edges lower, set for weekly loss as oil fuels Fed hike bets", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:42 AM IST", "pub_date_relative": "20m ago"}, {"title": "Can Runwal Enterprises IPO deliver long-term growth for high-risk investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Can Runwal Enterprises IPO deliver long-term growth for high-risk investors arterly dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:34 AM IST", "pub_date_relative": "28m ago"}, {"title": "Nikkei 225 trapped in Ichimoku cloud range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:32 AM IST", "pub_date_relative": "30m ago"}, {"title": "Here's who is attending the Trump-Xi state dinner", "full_content": "U.S. government officials, business leaders and their spouses dominated a list of more than 100 people who will attend a state dinner Thursday, according to a White House press release.\n\nOn the Chinese side, the delegation consisted primarily of government officials, accompanying Chinese President Xi Jinping and U.S. President Donald Trump and their wives.\n\nTalks with Trump have \"added new substance\" to U.S.-China relations, Xi said in a toast, according to an official translation. Trump gave Xi a statue of a bald eagle.\n\nThe U.S. and Chinese presidential couples were seated with Apple 's Tim Cook, Nvidia 's Jensen Huang and his wife, Elon Musk and AMD's Lisa Su.\n\nMeta and OpenAI were among the other major U.S. tech companies represented. Anthropic was not on the list.\n\nThe two-course menu included a silky yellow squash velout\u00e9 with crispy pancetta, sesame-crusted sea bass served over braised baby bok choy, and a fruit-shaped vanilla cremeux with ice cream made with White House honey.\n\nOther attendees included members of Trump's extended family, including Melania's father Viktor Knavs.\n\nChinese business leaders were previously expected to attend the dinner . Earlier, CNBC reported that someone briefed about the preparations but who wasn't authorized to speak on the record said they weren't aware of any Chinese companies who have been invited to join Xi on his trip.", "source": "CNBC Finance", "pub_date_str": "25 Sep 2026, 06:32 AM IST", "pub_date_relative": "30m ago"}, {"title": "OpenAI to preview GPT-6 Cyber in coming weeks,  hike in October, according to the CME FedWatch tool .\n\nThe 30-year fixed rate mortgage , which tracks the 10-year note, rose to 7.45%, the highest level since 2024, as borrowing costs for consumers looked poised to increase ahead of the midterm elections.\n\n\"Even before the moves of the past few days, the declines in credit card [annual percentage rates] and auto loan rates that occurred from mid- 2024 through the start of 2026 had stalled, and mortgage rates reaccelerated,\" Heather Berger, economist at Morgan Stanley, wrote in a note to clients.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:26 AM IST", "pub_date_relative": "36m ago"}, {"title": "U.S. stock futures drift lower as soaring yields, oil prices weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:23 AM IST", "pub_date_relative": "39m ago"}, {"title": "Chile\u2019s Escondida mine gradually resumes operations after fatal accident", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:18 AM IST", "pub_date_relative": "44m ago"}, {"title": "Stock recommendations for 25 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: The Indian stock market selloff intensified on Thursday as a toxic mix of surging bond yields, elevated crude oil prices, a weaker rupee and growing expectations of higher US interest rates rattled investors. The pressure was compounded by aggressive selling in banking, financial services and insurance stocks after the regulator proposed changes to insurance commission rules.\n\nThe Sensex tumbled 1,264 points, or 1.54%, to an intraday low of 73,563.92, while the Nifty 50 fell 369 points, or 1.57%, to 23,046.15. The Sensex ended 1,248 points, or 1.67%, lower at 73,580.54, while the broader Nifty 50 settled 383.70 points, or 1.6%, lower at 23,063.10.\n\nThe broad-based selloff also wiped out nearly \u20b9 5 trillion of investor wealth in a single session. The total market capitalization of companies listed on the BSE fell to \u20b9 480.99 trillion from \u20b9 485 trillion in the previous session.\n\nMost sectoral indices traded sharply lower, with pharma the only exception. Banking and financial services stocks were the biggest drags on the benchmarks after the Insurance Regulatory and Development Authority of India (Irdai) questioned the economics of bank-led insurance distribution , particularly the remuneration paid to banks under multiple tie-up arrangements.\n\nIndian equities ended sharply lower, with Nifty 50 closing at 23,063.10, down 383.70 points or 1.64%, near the session low of 23,046.15, indicating sustained selling pressure through the day.\n\nSensex also suffered a steep decline. Risk sentiment was hurt by Brent crude moving above $102/bbl and elevating U.S. Treasury yields, while weakness in financial and insurance stocks added to the pressure.\n\nThe sell-off was broad-based.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:05 AM IST", "pub_date_relative": "57m ago"}], "cfa": [{"title": "China's Xi urges U.S. to cooperate on AI", "full_content": "BEIJING \u2014 Chinese President Xi Jinping told U.S. President Donald Trump that there is more opportunity for cooperation than competition on artificial intelligence.\n\nThat's according to a state media readout of the two leaders' meeting in the White House Oval Office Thursday local time.\n\n\"The two sides can continue AI dialogue, exchange views on risks and benefits, and together guard against the misuse or malicious use of AI,\" Xi said in Chinese, according to a CNBC translation of the state media readout.\n\nHe noted AI is important to both the U.S. and China. \"Both sides have competition. Cooperation, even more so,\" he said.\n\nXi also emphasized that humans should maintain control of the technology, and that AI should support human progress.\n\nThe U.S. has restricted China's ability to access advanced semiconductors for training AI models, and criticized Chinese companies for allegedly taking part in illicit distillation of American AI capabilities.\n\nRecent incidents have raised fears that increasingly autonomous AI models could make attacks faster and harder to contain.\n\nFollowing a meeting with Chinese negotiators in New York, U.S. Treasury Secretary Scott Bessent said earlier this week the two sides had discussed setting up a \"U.S.-China AI Dialogue.\" He said the U.S. proposed introducing an alert system for AI incidents.", "source": "CNBC Finance", "pub_date_str": "25 Sep 2026, 06:52 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Sensex, Nifty 50 prediction today: Stock market outlook for 25 Sept 2026 | GIFT Nifty, Nikkei, Taiwan cues to watch", "full_content": "Stock market prediction on Friday, 25 September, 2026 : Indian equities were set for a muted opening on Friday, September 25, with GIFT Nifty indicating a subdued start as investors remained cautious amid developments in the Middle East. Reuters reported that US and Iranian negotiators were exploring a phased route towards ending the war, while elevated bond yields and crude oil prices continued to weigh on sentiment.\n\nAsian markets traded mixed in early deals, while US stock futures edged lower on Friday, adding to the cautious tone across global markets.\n\nSiddhartha Khemka, Head of Research, Wealth Management, Motilal Oswal Financial Services , said Indian equities could remain under pressure in the near term as uncertainty around a potential resolution to the US-Iran conflict persists, alongside elevated crude oil prices and rising global bond yields.\n\nHe noted that hopes of an early US-Iran deal had weakened after US President Donald Trump indicated that any potential agreement with Iran could come only after the November US midterm elections.\n\nMeanwhile, renewed Houthi activity in the Red Sea and tensions involving Saudi Arabia have added to concerns over global supply disruptions, further increasing inflationary pressures.\n\nThe Indian stock market endured a sharp sell-off on Thursday, September 24, with benchmark indices falling more than 1.5%, wiping out recent gains and slipping below key psychological levels. Rising global bond yields and crude oil volatility weighed heavily on sentiment.\n\nThe Nifty 50 plunged 1.64% to 25,169.50, while the Sensex declined 1.67% to 73,580.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:45 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Atlanta is getting pandas: China's Xi revives a longtime diplomatic strategy at summit with U.S.", "full_content": "Chinese leader Xi Jinping promised two giant pandas to Zoo Atlanta, reviving Beijing's decades-old charm offensive on the opening day of his first state visit to the U.S. in more than a decade.\n\nTwo giant pandas, Ping Ping and Fu Shuang, from a research base in Chengdu will arrive at the Georgia zoo \"in the coming days,\" Xi said. They would be Zoo Atlanta's first pandas since its previous four returned to China in November 2024, when it became the last U.S. zoo to lose its bears.\n\nThe Chinese president made the announcement at the start of his state visit in Washington, where he and President Donald Trump are meeting through Friday on an agenda spanning artificial intelligence, tariffs, critical minerals, Taiwan and the Iran war.\n\n\"The giant panda has been an envoy of friendship between the Chinese and Americans,\" he said at a White House ceremony.\n\nChina has used pandas as a diplomatic barometer since Mao Zedong sent a pair to Washington's National Zoo following Richard Nixon's 1972 visit, a gift so anticipated that more than a million people came to see the animals in their first year.\n\nBeijing shifted from gifting pandas outright to leasing them in 1984, and the loans have since tracked the temperature of the relationship \u2014 thinning as trade and Taiwan tensions rose, then resuming as San Diego and the Washington DC National Zoo took in new pairs in 2024.\n\nPandas on loan to the U.S. have bred 17 cubs, including six in San Diego, four in Washington and seven in Atlanta, according to Chinese state media .\n\n\"Panda diplomacy conveys a message of friendship and goodwill from China,\" said Wu Xinbo, director of the Center for American Studies at Fudan University. \"Americans may not like China, but they will certainly like pandas.\"", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:42 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold edges lower, set for weekly loss as oil fuels Fed hike bets", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:42 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Can Runwal Enterprises IPO deliver long-term growth for high-risk investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Can Runwal Enterprises IPO deliver long-term growth for high-risk investors? Keystone Realtors Share Price Kalpataru Share Price Nirlon Share Price Valor Estate Share Price Puravankara Share Price The Economic Times daily newspaper is available online now. Read Today's re participation.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:32 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market Today: Asian stocks edge up amid bond selloff, surging oil and Yen concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian stocks edge up amid bond selloff, surging oil and Yen concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian stocks edge up amid bond selloff, surging oil and Yen concerns SECTIONS Global Market Today: Asian stocks edge up amid bond selloff, surging oil and Yen concerns Bloomberg Last Updated: Sep 25, 2026, 06:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Australian and New Zealand 10-year government bonds slipped in early Asian trading. The yield on a global bond index hit 4% for the first time since 2007.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com i - Gold was set to end to the week lower as elevated energy prices continued to fuel expectations the Federal Reserve will need to raise interest rates further to combat inflation.\n\nBullion was trading around $4,270 an ounce, down more than 2% since last Friday. Oil steadied after surging on Thursday as the US and Iran remained at an impasse on restoring energy flows through the Strait of Hormuz. Negotiators were said to be exploring a phased deal that would see Tehran reopen the critical waterway and Washington lift a port blockade.\n\nThe impact of persistently high energy costs on the Fed\u2019s rate path has dictated gold\u2019s trajectory in recent weeks as investors gauge whether this will keep inflationary pressures strong enough to prompt more increases, after the first hike in three years last week. Higher borrowing costs are typically negative for bullion as it pays no interest.\n\nLosses in the US Treasuries market intensified Thursday amid inflation fears stemming from the day\u2019s spike in oil prices, as well as concerns about government debt. Yields on 30-year US bonds rose to just shy of 5.5%, the highest in more than two decades. Wall Street is starting to consider that higher yields might be here to stay.\n\nStill, Australian hedge fund manager Raphael Lamm, whose long-short gold fund has delivered a net return of more than 200% to investors since its launch last year, sees the decline in gold prices as temporary, arguing that the key forces underpinning its long-term rally remain intact.\n\nSpot gold fell 0.1% to $4,271.54 an ounce at 7:50 a.m. in Singapore. Silver was down 0.2% at $63.68 an ounce and on track to end the week almost 4% lower. Platinum and palladium were little changed. The Bloomberg Dollar Spot Index, a gauge of the US currency, was steady after five days of gains.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
