ngside increased institutional shareholding and the stock reaching a fresh 52-week high.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Can LTM\u2019s pivot towards shorter-tenure AI deals accelerate revenue growth in H2?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nLTM had promised a growth uptick from the September quarter (Q2FY27), but the 1.1% sequential constant currency (CC) revenue improvement was unsatisfactory. The drag came from seasonality in the technology and services vertical and its Saudi Arabian joint ventures, which reduced sequential growth by 60-70 basis points (bps).\n\nThe company has strategically shifted the deal mix towards shorter-tenure artificial intelligence (AI) projects as it aspires for a better H2FY27. H2 is poised to be buoyed by AI-led deals, recovery in client accounts and the Randstad Technology and Consulting Services acquisition (approvals on track for Q3FY27).\n\nAI deals have six-12 months duration and enable faster revenue conversion than traditional large IT deals with long transition periods. The former are also gross-margin accretive.\n\nLTM eyes CC year-on-year growth of 5.3% in FY27\u2014similar to FY26. But order inflow fell 25% sequentially and 21% year-on-year in Q2 to a multi-quarter low of $1.26 billion, clouding near-term revenue visibility.\n\nLTM attributed this drop to a change in mix. AI revenue grew 40% year-on-year to 13.4% of Q2 revenue. A significant portion of the orders comprised annual contract value (ACV)-based deals.\n\nThe pipeline is healthy, but LTM hasn\u2019t shared the ACV-total contract value (TCV) split. ACV measures the average revenue generated by a single contract over a 12-month period, while TCV gauges total revenue over the entire contract duration.\n\nThe absence of a disclosed ACV versus traditional TCV split makes it difficult to assess the quality and revenue visibility of bookings, said Nirmal Bang Institutional Equities. LTM may provide an ACV split from the next quarter.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 10:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Holiday 2026: Are NSE, BSE closed on October 20 for Dussehra? Check remaining holidays for the year", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Stock Market Holiday 2026: Are NSE, BSE closed on October 20 for Dussehra? Check remaining holidays for the year BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Stock Market Holiday 2026: Are NSE, BSE closed on Oct vice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Suzlon shares crash over 20% in six months but experts predict a strong rebound - here's why | Target price, stop-loss", "full_content": "Suzlon share price target | Stocks to buy today: Shares of Suzlon Energy Ltd witnessed selling pressure during the early morning dealings on Monday. Suzlon share price today opened with a downside gap at \u20b9 41.58 per share on the NSE and touched an intraday low of \u20b9 40.83 apiece within a few minutes of the Opening Bell, clocking around 3% dip on Monday. Even though Suzlon shares are among the beaten-down stocks on Dalal Street, having shed over 20% in six months, market experts are predicting a re-rating in the stock, provided the green energy stock controls its expenses and provides some extra breathing room for profit margins.\n\nAccording to stock market experts, Suzlon Energy shares witnessed a re-rating when it exited the group of loss-making companies and became profitable. Now, the market is waiting for a sharp improvement in the company's margins. They said that it can become possible once the company controls its higher expenses. Experts believe that Suzlon Energy Ltd is expected to contain its expenses, which would trigger a re-rating in the stock. They advised long-term investors to make the most of these dips and accumulate Suzon shares in one's portfolio. They predicted limited downside in Suzlon shares as the average weighted price of Suzlon shares fell to the \u20b9 38- \u20b9 40 band.\n\nHighlighting the reasons that are dragging Suzlon Energy's share price, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \"Suzlon Energy shares witnessed the first round of re-rating when it became a profitable company, snapping the tag of a loss-making company. This event has been discounted, and the market is waiting for the next round of re-rating, because a company's margins improve once it becomes a profit-making company, leaving the losses in the balance sheet far behind.\u201d\n\nThe SMCC Global expert said the market expects Suzlon to contain its expenses, giving some extra room for its profit margin.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 10:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ixigo shares jump 13% on Q2 profit turnaround, but why does Motilal Oswal retain its Neutral rating?", "full_content": "Le Travenues Technology shares, which operate under the ixigo brand, jumped over 13% on Monday, 19 October, after the company reported its September quarter results, posting a consolidated net profit of \u20b9 63.42 crore for Q2 FY27, compared with a net loss in the year-ago period. The profit was aided by the partial sale of its stake in Freshbus and strong growth in hotel bookings.\n\nThe travel and ticket-booking platform had reported a consolidated net loss of \u20b9 3.46 crore in the July-September quarter of the previous financial year, according to a regulatory filing.\n\nHotels emerged as ixigo\u2019s fastest-growing business segment by gross transaction value (GTV), with the metric rising 159% year-on-year to \u20b9 111.34 crore. The company reported hotels as a separate business segment for the first time.\n\nIxigo\u2019s revenue from operations rose 13% year-on-year to \u20b9 320.96 crore in the second quarter of FY27, compared with \u20b9 284.23 crore in the corresponding period last year. However, total expenses increased to \u20b9 309.51 crore from \u20b9 291.89 crore.\n\nIn a joint statement, ixigo Group CEO Aloke Bajpai, Group Co-CEO Rajnish Kumar and Group CFO Saurabh Devendra Singh said the company recorded a quarterly GTV of \u20b9 5,304 crore in Q2 FY27, marking a 22% increase year-on-year. Revenue from operations stood at \u20b9 321 crore, up 13% from a year earlier.\n\nThe executives said the company\u2019s profit after tax (PAT) reached an all-time high, supported by the partial sale of its stake in Freshbus.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 10:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: Japan bond yields fall as US tech selloff fuels safe-haven demand", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan bond yields fall as US tech selloff fuels safe-haven demand Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan bond yields fall as US tech selloff fuels safe-haven demand SECTIONS Global Market: Japan bond yields fall as US tech selloff fuels safe-haven demand By Anupam Nagar , ETMarkets.com Last Updated: Oct 19, 2026, 10:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese government bond yields fell as a selloff in US technology stocks triggered demand for safer assets. Prime Minister Sanae Takaichi\u2019s pledge to control debt issuance also supported sentiment, while Bank of Japan rate expectations remained in focus.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "PNB Q2 Review: Nirmal Bang Upgrades Rating, Sees 1% ROA Sustaining In FY27; Check Revised Target Price", "full_content": "The brokerage believes PNB's valuation remains attractive at 0.73 times forward book value, while an improving net interest margin (NIM) profile and healthy loan growth provide support to its return ratios.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:19 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "India\u2019s Finance Minister says easy exits and excess liquidity fuel equity market's underperformance", "full_content": "Excess liquidity in India's equity market has contributed to underperformance and may continue to do so, according to Finance Minister Nirmala Sitharaman.\n\n\"Because of the ease of liquidity, ease of availability, people are even exiting easily\" from equities, Sitharaman told CNBC in an exclusive interview on the sidelines of the IMF-World Bank meetings in Bangkok on Friday. However, the fundamentals of the Indian economy are \"fine,\" she said.\n\nSince January, India's key benchmark indexes have slipped nearly 12%, as per LSEG data, even though the country's economic growth has been resilient amid trade uncertainty and geopolitical shocks. India has been hit with record outflows by foreign investors from its equity markets, and Sitharaman said that continued capital outflows are one of the biggest risks for India in 2027.\n\nStill, domestic capital continues to flood the market. Indian equity mutual funds have recorded net inflows every month since March 2021, according to data released by industry body Association of Mutual Funds in India earlier this month.\n\nMultinational companies, private equity funds and foreign investors have been able to make partial or full exits from their investments at a premium. Between 2021 and 2025, Indian initial public offerings collectively raised $60.4 billion, of which \"a staggering\" $37.7 billion, or 63% of total proceeds, went to existing holders who sold their shares to the public, an EY report in August said.\n\nForeign portfolio investors have sold direct Indian equities of over $33 billion so far this year, as per Indian depository firm NSDL.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 10:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sugar Stocks Fall Up To 6%; Bajaj Hindusthan, Dwarikesh Lead Losses; Here's Why", "full_content": "The move is expected to push oil marketing companies towards alternative feedstocks, including maize, while raising concerns over the loss of an important revenue stream for sugar mills with distillery businesses.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tech picks: Indian Hotels among 5 stocks to buy for healthy returns in short term", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Tech picks: Indian Hotels among 5 stocks to buy for healthy returns in short term Written by Akash Podishetti , ETMarkets.com | Oct 19, 2026, 10:13:35 AM IST 1 / 6 Taking stock Indian equities extended their recovery, led by sustained buying in IT stocks, as strong quarterly results and upbeat management commentary reinforced confidence in the sector\u2019s earnings outlook. While rupee appreciation and easing crude prices provide near-term support, analysts say global inflationary and geopolitical risks warrant caution. Sustaining the recovery will require broader earnings growth beyond IT, supported by an improvement in domestic demand and easing margin pressures.\n\nLemon Tree continues to find support in the Rs 102-100 band, which is a sacrosanct support cluster for the stock. A formation of a bullish anchor column from the same support band, and a follow through Double top buy on its Daily 0.25% P&F charts, indicates towards the presence of strong buyers are lower levels, and a shift in control towards buyers. At the same time, a bullish crossover of the 20DEMA, over its 50 DEMA, points towards improving momentum in the stock.\n\nHitesh Rathi, Technical Analyst - Equity & Derivatives, Angel One\n\nThe Rs 3,290-3,200 band is a very strong cushion for the stock, and the stock continues to attract buying in the zone, validated by the formation of a bullish anchor column from the same band.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China's third-quarter economic growth quickens to 4.5% as exports surge, beating estimates", "full_content": "China's economic growth accelerated to 4.5% in the third quarter from a year earlier, as robust foreign demand for the country's technological goods largely offset drags from a deepening property slump and sluggish consumer demand.\n\nThird-quarter growth beat Reuters-polled economists' expectation of a 4.4% expansion, and was also higher than the three-year low of 4.3% in the second quarter .\n\n\"The rebound in September salvaged the lukewarm performance in July and August,\" said Tianchen Xu, senior economist at Economist Intelligence Unit, attributing the recovery to improved government investment that helped arrest the consistent worsening in fixed asset investment, an \"ever-strong\" external sector and a weak base. China's monthly trade surplus reached a record high of $133.5 billion .\n\nMomentum from the three forces will likely extend into the fourth quarter, Xu said, forecasting a full-year growth rate of 4.7%.\n\nThe data shows an economy still leaning on factories and overseas buyers while households and private investors hold back, with growth through the first nine months averaging 4.6%, broadly in line with Beijing's official target range of 4.5% to 5%.\n\nIn September, retail sales eked out a 1.1% growth, exceeding analysts' forecast for 0.6% increase, while industrial output grew 5.5% from a year earlier, in line with the forecast of 5.5% growth. The urban unemployment rate stood at 5.2% in September.\n\nFor the first nine months this year, fixed asset investment in urban areas declined 7.2% from the same period a year earlier, compared with a 7.3% drop estimated in a Reuters poll.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 10:06 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bulls retreat as Sensex falls over 400 points, Nifty slips below 23,100. What's next for D-Street?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Bulls retreat as Sensex falls over 500 points, Nifty tests 23,000. What's next for D-Street? Hindustan Unilever Share Price Marico Share Price Godrej Consumer Products Share Price Dabur India Share Price Colgate-Palmolive (India) Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bulls retreat as Sensex falls over 500 points, Nifty tests 23,000. What's next for D-Street? SECTIONS Bulls retreat as Sensex falls over 500 points, Nifty tests 23,000. What's next for D-Street? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 19, 2026, 11:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian stock market took a hit on Monday after a considerable rise the previous week. Both Sensex and Nifty struggled, with Axis Bank and HDFC Bank suffering significant losses. Nevertheless, firms like SBI and UltraTech Cement managed to post gains. Th "19 Oct 2026, 10:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Urban Company shares crash over 8% after Q2 results - Should investors buy, sell, or hold the stock? Experts explain", "full_content": "Urban Company shares crashed over 8% in morning trade on the BSE on Monday, 19 October, after the home services platform's September quarter (Q2FY27) results. Urban Company share price opened at \u20b9 148.15 against its previous close of \u20b9 158.30 and crashed 8.5% to an intraday low of \u20b9 144.85.\n\nAfter market hours on Friday, 16 October, Urban Company said its consolidated net transaction value (NTV) during Q2FY27 grew 39% year-on-year (YoY) to \u20b9 1,432 crore and revenue from operations rose by 41% YoY to \u20b9 537 crore. Orders delivered reached 1.51 crore, up 103% YoY, and annual transacting users reached nearly 1 crore, up 35% YoY.\n\nAdjusted EBITDA for the quarter was - \u20b9 144 crore due to a deliberate \u20b9 174 crore investment in InstaHelp. Excluding InstaHelp, Adjusted EBITDA was \u20b9 30 crore, up 213% YoY, said the company.\n\nThe Company closed the quarter with \u20b9 1,901 crore in cash and treasury investments.\n\nMeanwhile, its board has approved a fresh capital raise of up to \u20b9 2,500 crore, subject to shareholder approval.\n\nBrokerage firm Emkay Global Financial Services has maintained a \"buy\" recommendation on the stock and raised the 12-month target price to \u20b9 200.\n\nEmkay said the company's low core penetration, tier 2 expansion, improving International profitability, and approaching KSA breakeven support the outlook. Native offers further growth opportunities, while InstaHelp drives higher engagement.\n\nHowever, pricing recovery and unit economics remain key monitorables, the brokerage firm added.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 09:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Yes Bank shares rise as Q2 profit beats estimates, but AT1 bond verdict hit pegged at Rs 5,217 crore. What lies ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Yes Bank shares rise as Q2 profit beats estimates, but AT1 bond verdict hit pegged at Rs 5,217 crore. What lies ahead? YES Bank Share Price Federal Bank Share Price IndusInd Bank Share Price IDFC First Bank Share Price RBL Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Yes Bank shares rise as Q2 profit beats estimates, but AT1 bond verdict hit pegged at Rs 5,217 crore. What lies ahead? SECTIONS Yes Bank shares rise as Q2 profit beats estimates, but AT1 bond verdict hit pegged at Rs 5,217 crore. What lies ahead? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 19, 2026, 09:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Yes Bank shares rose after falling 17% over two sessions, following a 65% year-on-year jump in Q2 net profit to Rs 1,080 crore. However, the lender cautioned that the reported earnings exclude the potential impact of the Supreme Court\u2019s AT1 bond ruling.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 09:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Up 38% in a month! PC Jeweller share price rallies 13% despite weak trend on D-Street | Check target price, stop loss", "full_content": "PC Jeweller share price jumped over 13%, touching an intraday high of \u20b9 18.63 per share on NSE, in Monday's trading session defying the muted trend in the Indian stock market.\n\nPC Jeweller stock opened at \u20b9 16.91 per share today, as compared to previous close of \u20b9 16.28 on Friday.\n\nMeanwhile, Indian equity benchmarks opened nearly flat on Monday as investors assessed the quarterly results of major private sector lenders HDFC Bank and ICICI Bank, while elevated crude oil prices dampened market sentiment. The Nifty 50 slipped 0.02% to 23,140.5, while the BSE Sensex declined 0.05% to 74,691.38.\n\nPC Jeweller share price witnessed a spurt in its trading volume on Monday. According to data available on NSE, around 5,336.92 shares changed hands during the intraday session on 19 October.\n\nPC Jeweller is attracting significant investor interest days after announcing that it has achieved debt-free status. In a recent bulk deal, Cupid Chairman and Managing Director Aditya Kumar Halwasiya acquired 5.10 crore shares of the jewellery company for approximately \u20b9 73.59 crore.\n\nAccording to data available on the NSE website, Halwasiya purchased the shares at an average price of \u20b9 14.43 apiece through the bulk deal.\n\nAditya Halwasiya, Chairman and Managing Director of Cupid Limited, is a third-generation entrepreneur who has emerged as India's fastest wealth creator in percentage terms.\n\nLast month, PC Jeweller announced that it had repaid its outstanding dues to all 14 consortium banks, marking a major milestone in its debt-reduction efforts. The New Delhi-based jewellery manufacturer had previously carried total debt of around \u20b9 3,000 crore before opting for a one-time settlement (OTS) of its outstanding bank liabilities in September 2024.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 09:57 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HDFC Bank shares fall 2% after Q2 results. What are Jefferies, Motilal Oswal analysts saying?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a HDFC Bank shares fall 2% after Q2 results. What are Jefferies, Motilal Oswal analysts saying? The Economic Times daily newspaper is available online now. Read Today's Paper HDFC Bank shares fall 2% after Q2 results. What are Jefferies, Motilal Oswal analysts saying? SECTIONS HDFC Bank shares fall 2% after Q2 results. What are Jefferies, Motilal Oswal analysts saying? By Veer Sharma , ETMarkets.com Last Updated: Oct 19, 2026, 09:56:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis HDFC Bank shares fell up to 2% after the lender reported a 4.6% year-on-year rise in Q2 FY27 net profit to Rs 19,510 crore. Jefferies, Motilal Oswal, Systematix and Emkay retained positive ratings, citing margin recovery potential and leadership transition.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Putin Proposes Summit With US, China On Ukraine, WSJ Reports", "full_content": "Trump's recent overtures to Putin, including a deal on diesel exports and a decision to waive a new sanctions law, have been widely criticized by Ukraine and its allies in Europe and Washington.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 09:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Anthropics IPO Dreams May Be Eclipsed By the Cloud", "full_content": "(Bloomberg Opinion) -- Call it the nerd mindset. Silicon Valley has spent the last few years believing that whoever built the smartest artificial-intelligence system would rule the industry. Today, that calculation is starting to look misguided.\n\nThe cost of building AI models is going up, and the price of using them is going down. AI companies\u2019 revenue growth has been impressive, but it\u2019s also slowing. That doesn\u2019t necessarily mean a bursting bubble, but it does look like the real power increasingly lies with the companies that distribute and power the technology: cloud giants like Microsoft Corp., Alphabet Inc. and Amazon.com Inc.\n\nThis trio of the Big Tech establishment, whose shares have risen an average of 10% since the start of 2026, controls the infrastructure, customer relationships and distribution channels through which AI is sold. They can profit whether a business uses Claude, or an older version of ChatGPT, or a cheaper open-weight model from China. That\u2019s not the case for OpenAI or Anthropic.\n\nThe latter is on the runway to an initial public offering in November; it\u2019s aiming for a $2 trillion valuation in what will be the biggest test of continued investor appetite for the AI boom. The problem: Anthropic recently told investors that its third-quarter revenue was $16.8 billion, a quarter-on-quarter growth rate of around 50%, compared with 140% earlier this year.\n\nGo on X and you\u2019ll find hysteria over this news. A popular financial commenter calls Anthropic\u2019s numbers a \u201ccrazy sharp\u201d deceleration. \u201cIt\u2019s over,\u201d they add, ominously.\n\nActually, it\u2019s hardly a disaster. At 50% quarterly growth, sales would increase roughly five times in a year and 130 times in three years. The hard part is sustaining it, as each additional quarter requires billions more in new revenue.\n\nCompounding the problem is the fact that the most powerful frontier models cost a fortune to build.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 09:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"ti     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
