pic Shares Fall 10% Pre-Market After Historic Nasdaq Debut: What It Means For AI Stocks", "full_content": "Anthropic shares had advanced up to 39% from its IPO price on Thursday and erased more than half of the gains, closing 17% higher.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic shares tumble 10% after blockbuster IPO, erase debut gains; why are investors turning cautious on AI?", "full_content": "Shares of Anthropic PBC, the maker of the Claude chatbot, fell 10% at the opening bell on Friday, sliding to around $87.54 per share and slipping below their lowest level during Thursday's debut.\n\nAnthropic, described as the world's first publicly traded frontier AI company, had opened 34% above the IPO price of $83. However, the stock pared its gains and closed at $97.17, up 17% from its IPO price.\n\nWithin just a few hours of trading, Anthropic's stock appeared to reflect investor uncertainty over the direction of the artificial intelligence (AI) industry. The shares initially surged to $111.53, taking the company's market valuation close to $2 trillion, before retreating to $965 billion.\n\nThe stock's decline also coincided with the exercise of the so-called over-allotment option, commonly known as a greenshoe option, which allows underwriting banks to sell additional shares after trading begins.\n\nThe over-allotment option takes the total amount raised by Anthropic and the co-founders' selling shares in the offering to $119.5 billion, comprising $93.5 billion through the IPO and $26 billion through a concurrent private placement, Reuters reported.\n\nAnthropic's IPO attracted global demand amounting to seven times the shares available for sale. Competition was so intense that more than half of the institutional investors bidding for shares were left empty-handed, Bloomberg reported on Thursday.\n\nThe listing has done little to ease broader concerns surrounding the AI trade, as investors question whether the returns will justify the enormous sums being spent and borrowed to finance the boom, which has helped equities worldwide scale record highs.\n\nDeteriorating sentiment towards equities has driven investors towards the safety of bonds, with the yield on the benchmark 10-year US Treasury note slipping two basis points to 5.02%. A Bloomberg gauge of the dollar remained near its highest level since April 2025, while emerging-market currencies weakened.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 08:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic raises $93.5 billion total as underwriters scoop up \u2018greenshoe\u2019 overallotment", "full_content": "Anthropic underwriters have officially exercised their overallotment of shares in the historic initial public offering , bringing the total raised to $93.5 billion, according to a release Friday.\n\nThe artificial intelligence company raised $81.3 billion on Wednesday and netted an additional $12.2 billion through the overallotment, surpassing SpaceX , which held a record IPO in June.\n\nAnthropic said it sold an aggregate of 1,127,000,000 shares of its Class A common stock at $83 per share in the offering. It sold 980 million shares on Wednesday and its underwriters had the option to purchase up to an additional 147 million shares by Friday as part of the overallotment, which is commonly referred to as the \"greenshoe.\"\n\nShares of the Claude maker opened trading at $111.50 on the Nasdaq on Thursday, but slid throughout the day and closed at $97.17. The stock sank 12% in premarket trading on Friday during a broad tech sell-off.\n\nIn addition to the sale of its Class A common stock, Anthropic closed a concurrent sale of its Class N common stock after a group of tech companies, including Advanced Micro Devices , Google , Microsoft , Nvidia and others, agreed to participate in a $26 billion private placement at the IPO price. Anthropic said Friday that aggregate gross proceeds from its IPO, including the private placement, totaled $119.5 billion, before deducting offering expenses.\n\nAnthropic dodged an unforgiving series of obstacles on its road to the Nasdaq on Thursday, as investors brooded over Jensen Huang's shocking ouster at Nvidia, voters' stinging rebuke of the tech during the midterms and whether rising interest rates would stymie industry plans for a multitrillion-dollar AI infrastructure buildout .\n\nCEO Dario Amodei co-founded the company in 2021 after he and a handful of other researchers, including his sister Daniela, quit their jobs at OpenAI , now Anthropic's chief rival.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 08:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nasdaq falls 1% at open as Anthropic fails to steady AI trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Nasdaq tumbles 2% as Anthropic retreat deepens AI trade concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Nasdaq tumbles 2% as Anthropic retreat deepens AI trade concerns SECTIONS Nasdaq tumbles 2% as Anthropic retreat deepens AI trade concerns ETMarkets.com Last Updated: Nov 20, 2026, 09:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Following a rocky market debut, Anthropic\u2019s stock price plunge led to a notable drop in the Nasdaq Composite index. The AI sector faces growing skepticism amidst high valuations and investment risks, putting pressure on major U.S. stock indexes. Despite some companies reporting strong earnings, investor anxiety persists over potential interest rate hikes by the Federal Reserve.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Nov 2026, 08:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "StockGro expert explains: WeWork India share price target - should investors buy, sell or hold?", "full_content": "Sachin Kapoor Published 20 Nov 2026, 08:26 PM IST Prefer Livemint on Google India's office market is being reshaped by enterprises that want speed, flexibility and quality in how they take up space. Global capability centres (GCCs), large corporates and fast-growing businesses increasingly prefer managed, branded flexible offices over long, capital-heavy conventional leases.\n\nThat shift has put flexible workspace operators at the centre of the commercial real estate stocks conversation. WeWork India Management Ltd, the exclusive licensee of the WeWork brand in India and promoted by the Embassy Group, is the segment's premium, enterprise-focused player. The Bengaluru-headquartered company runs 85 centres across eight cities, spanning about 9.8 million sq ft and 145,300 desks as of September 2026.\n\nIts listed coworking peers include Smartworks Coworking Spaces, Awfis Space Solutions and IndiQube Spaces. WeWork India shares currently trade at \u20b9 685, about 13.8% below the 52-week high of \u20b9 794.50, after a sharp rally from the 52-week low of \u20b9 420.\n\nWhy it's recommended: A premium brand with an enterprise-heavy member base (enterprises contribute about 77% of core revenue and GCCs about 41%), a pipeline of about 47,000 incremental desks under signed leases or LOIs, high operating leverage, and fast-growing value-added and digital revenue support scalable earnings growth.\n\nWeWork India reported Q2 FY27 revenue of \u20b9 768.7 crore, up 31.6% year-on-year and 10.1% quarter-on-quarter. Growth came from record capacity additions, a 32.5% rise in members to about 121,700, and strong enterprise and GCC demand.\n\nEBITDA rose 37.6% to \u20b9 162.9 crore and the margin expanded 92 bps to 21.2%, reflecting operating leverage and cost discipline. PAT grew 67.4% to \u20b9 65.8 crore on a management basis, while reported Ind AS PAT was \u20b9 20.4 crore.\n\nNote: EBITDA and PAT are on the company's management (rent-adjusted, pre-Ind AS 116) basis.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 08:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sebi proposes easing disclosure rules for foreign funds", "full_content": "The Securities and Exchange Board of India (Sebi) has proposed eliminating a key disclosure requirement for foreign portfolio investors (FPIs), saying the rules may be discouraging overseas funds from investing in India.\n\nIn a consultation paper issued on Friday, the markets regulator said that the granular disclosure norms are unique to India and have acted as an entry barrier. Under the Additional Disclosure Framework (ADF), FPIs holding over 50% of their Indian equity assets in a single corporate group, or over \u20b9 50,000 crore in Indian equities, must disclose all underlying investors, regardless of threshold.\n\n\u201cSuch disclosure requirements have to be weighed against the prevailing requirements in our own jurisdiction as well as other jurisdictions competing for the same pool of global monies. Disclosure requirements that are not in line with globally accepted practices could potentially place India at a competitive disadvantage vis-\u00e0-vis peer jurisdictions,\u201d the market regulator said in its draft paper.\n\nThe move comes amid sustained foreign outflows that have pressured the rupee. Between October 2024 and October 2026, FPIs pulled out more than \u20b9 5.61 trillion from Indian equities.\n\nCurrently, to prevent money laundering, India has mandated that foreign funds disclose their Beneficial Owners (BOs), who are anyone who owns 10% or 15% or more of the fund. The ADF framework sits over these norms as an additional level of safety.\n\nMarket participants had flagged that the rules forced global funds to set up separate India-dedicated vehicles, driving up operational costs.\n\nComplex structures like hedge funds and fund-of-funds struggled to trace ownership across multiple layers amid frequent investor subscriptions and redemptions. Foreign investors were also often reluctant to share personal details beyond what their home jurisdictions required.\n\nThe market regulator also said that the BO norms require review.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 08:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Bitcoin's regulation bull case is played out. What could drive crypto gains moving forward", "full_content": "Crypto investors are hunting for the next positive catalyst after U.S. crypto regulation \u2014 a long-time market driver \u2014 fizzled in 2026.\n\nBitcoin traded around $61,500 on Friday, a more than 50% decline from its all-time high above $126,000 reached in October 2025. The broader digital asset market has struggled after the Clarity Act, a crypto market structure bill, failed to advance in the Senate in September.\n\nInvestors now see Wall Street's embrace of blockchain technology \u2014 particularly tokenization \u2014 as the next trend to give bitcoin a boost.\n\n\"Every single traditional firm is now looking at digital assets,\" BitGo CEO Mike Belshe told CNBC last week in an exclusive interview from the fintech-focused Cantor Convergence conference in Miami Beach. That includes BlackRock , the world's largest asset manager.\n\nHe pointed to statements from the asset management giant's CEO, Larry Fink, who said the next major evolution in global finance is the creation of digital representations of every stock, bond, fund and real-world asset onto a shared blockchain ledger.\n\n\"I think the biggest catalyst we're seeing right now is actually very much in motion and it's happening, which is capital markets are moving onchain,\" eToro CEO Yoni Assia told CNBC in an exclusive interview from the conference. He pointed to the SpaceX IPO as an example, which had derivatives trading on eToro before the IPO.\n\n\"First day of trading, we distributed it to our retail clients, and it started trading 24/7, and that's all because capital markets are now copying crypto markets and are sitting on the same rails,\" Assia said. \"Crypto markets have always been 24/7, they never sleep, and now what we're seeing is that capital markets are copying crypto markets using the same technology so stocks are moving onchain, they're being tokenized.\"\n\nAssia said that supportive regulation in the U.S.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 08:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "SEBI Approves Arohan Financial Services, Pristine Logistics To Float IPOs: Check Issue Details", "full_content": "SEBI has issued observations to Arohan Financial Services and Pristine Logistics, allowing both companies to advance their IPO preparations.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 08:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "How Jensen Huang Made Humiliation Routine at Nvidia - The New York Times", "full_content": "How Jensen Huang Made Humiliation Routine at Nvidia The New York Times Opinion | Jensen Huang Hopes You Get Flu and Die WSJ Exclusive | How ex-Nvidia CEO Jensen Huang threw tantrums in the office, dressed down tech execs: 'I hope you die' New York Post Wine Parties, Office Put-Downs And \"Royal Family\" Culture: Inside Jensen Huang's Nvidia NDTV Nvidia\u2019s Jensen Huang reportedly used humiliation to motivate staff who got too rich Crypto Briefing", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 08:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "No FAST-DS declaration needed for foreign bank a/c up to Rs 20 lakh with disclosed funds: I-T dept", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a No FAST-DS declaration needed for foreign bank a/c up to Rs 20 lakh with disclosed funds: I-T dept The Economic Times daily newspaper is available online now. Read Today's Paper No FAST-DS declaration needed for foreign bank a/c up to Rs 20 lakh with disclosed funds: I-T dept SECTIONS No FAST-DS declaration needed for foreign bank a/c up to Rs 20 lakh with disclosed funds: I-T dept By ET Online Last Updated: Nov 20, 2026, 08:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Income Tax Department has announced exemptions for individuals with foreign bank accounts under FAST-DS. Individuals with balances up to Rs 20 lakh from disclosed sources do not need to file declarations. This exemption applies as long as the accounts contain no undisclosed income or unaccounted deposits. The scheme provides a one-time opportunity to disclose foreign assets and income by December 31.\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Nov 2026, 08:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin suffered identical sell-off pattern ahead of Anthropic, SpaceX IPOs \u2014 what happens next?", "full_content": "Bitcoin has suffered nearly identical sell-offs ahead of two of the biggest public offerings this year, leaving investors wondering if competing demand for investor capital could be weighing on the cryptocurrency and perhaps delaying its recovery.\n\nThe price of the bitcoin dropped 22.7% in the 30 days before Anthropic's IPO and fell 22.3% in the month leading up to SpaceX's June 12 listing. Ether declined 25.3% in the 30 days preceding Anthropic's debut, and 28% in the same window ahead of SpaceX.\n\n\"Liquidity events can elevate correlations across asset classes quickly,\" Matthew Sheffield, chief investment officer at the ether treasury firm Sharplink , told CNBC. \"The first 15 min of [Thursday's] Anthropic IPO put that on full display. Tech stocks, value stocks, oil, gold, crypto all sold off as traders sold assets to buy shares in the secondary market.\"\n\n\"Stores of value function as such over long horizons, but in the short term are still liquidity driven,\" Sheffield said. \"We saw this in early Covid when the market fled to cash. Stock, bonds, commodities ... it didn't matter, you were being sold for cash.\"\n\nWhile investors appear to be rotating capital out of crypto to make room for history-making IPO investments, that can't be said with precise certainty. Crypto has also been under pressure from ETF outflows, leverage, macro uncertainty and broader risk-off sentiment.\n\nStill, the post-IPO price action may offer a data point in understanding where bitcoin's price goes next. With Anthropic now public, investors are watching to see whether bitcoin and ether find a floor, and if institutional demand returns.\n\n\"[After] the SpaceX IPO, bitcoin didn't truly find its final bottom until after the IPO was completed, and it didn't actually reverse the downtrend until 70 days later,\" said Matt Cole, CEO and chairman of Strive Asset Management , a bitcoin treasury firm.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 08:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "I\u2019m terrified of a market crash. Should I put $400,000 of my $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 08:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold Extends Nine-Day Loss: Should You Buy The Dip? 'Don't Catch A Falling Knife', Warn Experts", "full_content": "Gold has fallen for nine consecutive sessions, with domestic prices plunging Rs 5,200 on Friday. Experts advise investors to wait for signs of a bottom before buying the dip.", "source": "NDTV Profit", "pub_date_str": "20 Nov 2026, 07:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "MCX Gold Sinks 40% From All-Time High: Analysts Flag The One Level Traders Must Watch", "full_content": "Precious metals declined following hawkish signals from the US Federal Reserve, higher Treasury yields a     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
