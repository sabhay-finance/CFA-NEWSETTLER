ought to curb.\n\nArrangements involving third-party securities to support proprietary trading positions would need to be examined carefully against the applicable collateral and risk-management framework, Moin Ladha, Partner at Khaitan & Co said.\n\n\"The key regulatory question is whether, in substance, the structure results in leverage being obtained in a manner that aligns with the intent of the underlying funding restrictions set by the RBI,\" Ladha added.\n\nFor example, a proprietary trader may approach an acquaintance holding \u20b9 10 crore worth of blue-chip shares and offer to generate an additional return from the idle holdings. The trader may pitch a strategy backed by historical data showing annual returns of 7-8%, promising the investor a share of the earnings.\n\nOnce the arrangement is agreed, the trader pledges these shares with the broker and uses it as margin for trades . Margin is the amount a trader must put up against the total value of a position.", "source": "LiveMint Markets", "pub_date_str": "05 Sep 2026, 06:20 AM IST", "pub_date_relative": "41m ago"}, {"title": "NMI Holdings CEO Adam Pollitzer sells $7.75m in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Sep 2026, 06:15 AM IST", "pub_date_relative": "46m ago"}, {"title": "AI hiring boom could turn into a surprise tailwind for software: Bernstein", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Sep 2026, 06:07 AM IST", "pub_date_relative": "55m ago"}, {"title": "Crowdstrike CEO George Kurtz sells $4.16m in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Sep 2026, 06:04 AM IST", "pub_date_relative": "57m ago"}, {"title": "StubHub president Nayaab Islam sells $899k of Stub shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Warner Bros. Discovery director Lowe reports $5.67m stock sale", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Neostellar Capital director Lott sells $50,646 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Forex reserves hit record $740.8 billion, lift rupee", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a Forex reserves hit record $740.8 billion, lift rupee The Economic Times daily newspaper is available online now. Read Today's Paper Forex reserves hit record $740.8 billion, lift rupee SECTIONS Forex reserves hit record $740.8 billion, lift rupee By ET Bureau Last Updated: Sep 05, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis By the end of August, India recorded an unprecedented $740.8 billion in foreign-exchange reserves, which has significantly fortified the value of the Indian rupee against the dollar. This development enhances public sector banks' lending potential through enhanced liquidity coverage. Despite this, state-run banks are lagging behind private ones in deposit growth, facing pressures that necessitate higher borrowings as loans continue to exceed deposits.\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nQ1 investment numbers look stellar, but are we celebrating too early?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "05 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "A living room unlike any other\u2014how to gather and connect like Gloria Steinem, says expert", "full_content": "I can't stop thinking about Gloria Steinem's living room . For years, Steinem gathered people in her New York City brownstone and asked them to sit together, without a head of the table, without hierarchy. She called them \"Talking Circles.\"\n\nShe said the practice was inspired in part by Indigenous traditions of gathering in a circle, something Steinem wrote about in her 2015 memoir \" My Life on the Road .\" As a journalist and author focused on human connection and social health, that part of the book always stayed with me.\n\n\"I was struck by how open and accessible she was,\" Ann Shoket , CEO of a community of women and nonbinary leaders called TheLi.st , wrote in a LinkedIn post on Wednesday after finding out the feminist icon had died at 92 . \"She was also deeply real,\" said Shoket, who tells me she mingled in Steinem's living room twice at events held in recent months. \"She made us all dream bigger.\"\n\nThe conversations that took place in those circles would change lives in ways large and small. It's where plans for Ms. Magazine and the nonprofit Women's Media Center started to take shape. And frequently, it was the space Steinem offered to organizations like Third Wave, Equality Now and Direct Impact Africa to plan their next steps, marking \" turning points \" in their work, according to Gloria's Foundation.\n\nMuch of the power of Steinem's living room was that it cracked open opportunities to lend support, let ideas flow and build trust face-to-face. It fostered moments of welcome connection for decades, most recently in an era when nearly three-quarters of adults spend time with people they care about only twice a month or less, and about two-th am, strategist at CIBC Capital Markets.\n\n\u201cThe next trend move in the dollar likely depends on inflation next week and its read through to the September Fed,\u201d he said.\n\nEarlier in the week, the greenback touched its weakest level since May after Fed Governor Christopher Waller pointed to progress on inflation, damping expectations for an imminent increase in borrowing costs.\n\nWaller\u2019s speech \u201cwas a little more dovish than most were expecting,\u201d said ING Groep NV\u2019s head of global markets Chris Turner.\n\nAdding to the dollar\u2019s weekly decline was a sharp rally in the yen. The Japanese currency posted its best week since July, gaining about 2.4% against the dollar, fueled by expectations that the Bank of Japan may raise its benchmark rate by a quarter point this month while leaving the door open to faster hikes thereafter.\n\nFriday\u2019s data showed job growth surged in August, while the unemployment rate held steady at 4.1%. A pivotal consumer-price report due next week has the potential to solidify expectations for the Fed\u2019s next move and, in turn, the path of the dollar.", "source": "LiveMint Markets", "pub_date_str": "05 Sep 2026, 03:29 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Campbell's cuts 13% of salaried workforce, closes plants as part of turnaround effort - Fox Business", "full_content": "Campbell's cuts 13% of salaried workforce, closes plants as part of turnaround effort Fox Business Campbell's stock plunges as food maker slashes dividend after sales, profit declines Yahoo Finance Campbell's Promises New Marketing Approach 09/04/2026 MediaPost Amid Intense Competition, Campbell's Ups the Ante on Efficiency Efforts to Juice Brand Spending Morningstar Campbell's forecasts weak year ahead on pressured consumer spending CNBC", "source": "Google News Business", "pub_date_str": "05 Sep 2026, 03:28 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bloom Energy was just named to the S&P 500. These other stocks are joining the index as well.", "full_content": "Molson Coors Beverage, Builders FirstSource and Trade Desk will be getting the boot from the benchmark index.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Sep 2026, 03:16 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks fall after a surprisingly strong jobs report raises prospects of an interest rate hike - apnews.com", "full_content": "Stocks fall after a surprisingly strong jobs report raises prospects of an interest rate hike apnews.com Stock Market News, Dec. 23, 2026: Short-Term Treasury Yields Climb After Strong Jobs Report WSJ S&P 500, Dow End Lower As Blowout Jobs Report Fans Rate Hike Fears, While Chipmaker Strength Aids Nasdaq \u2014TSLA, NFLX, BE, NVDA In Focus Yahoo Finance US Stock Futures Steady Ahead of Key August Jobs Data Bloomberg.com Stock Market Today: Dow Sinks Amid Rate Fears; Sandisk, KLA Lead Nasdaq-100 As Utilities Gain Investor's Business Daily", "source": "Google News Business", "pub_date_str": "05 Sep 2026, 02:27 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "TSX declines after US jobs data fuels rate-hike bets", "full_content": "Sept 4 - Canada's main stock index closed lower on Friday as material and oil stocks declined and stronger-than-expected U.S. jobs data prompted investors to increase bets on an interest-rate hike by the Federal Reserve this month.\n\n* Data showed U.S. job growth accelerated sharply in August while the unemployment rate held steady at 4.1%, pointing to a still stable labor market.\n\n* Traders added to bets that the Federal Reserve would hike interest rates later this month, with short-term interest-rate futures prices now implying about a 65% chance of a hike, compared with 55% before the jobs report.\n\n* \"It just reaffirms this idea that the U.S. economy, despite some concerns, is still in a very good position,\" said Mike Archibald, portfolio manager at AGF Investments. \"It will be very important in the next couple of weeks to see what happens with the data and how that evolves with respect to the expectations for market participants.\"\n\n* Meanwhile, Canada's economy lost 41,700 jobs in August, a sharp slowdown from unusually strong summer hiring.\n\n* The Bank of Canada held interest rates steady this week, but Governor Tiff Macklem said policymakers were prepared to hike multiple times if inflation remained too high.\n\n* On TSX, the materials sector was down 1.2% as miners lost ground, tracking declines in gold and silver prices.\n\n* Renewed strikes in the Middle East pushed up oil prices and bond yields earlier this week, creating an uncertain backdrop for risk assets.", "source": "LiveMint Markets", "pub_date_str": "05 Sep 2026, 02:24 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. sanctions Turkish bank accused of enabling Iran as Bessent says he 'hopes for' no further bank penalties", "full_content": "The Treasury Department on Friday announced sanctions against a small Turkish investment bank and two of its subsidiaries, which the U.S. accuses of facilitating funds for an arm of Iran's Revolutionary Guard.\n\nThe action against Golden Global Bank makes it the second financial institution to be targeted under \"Operation Economic Outcast,\" the Trump administration's attempt to isolate Tehran by sanctioning its business partners.\n\nTreasury Secretary Scott Bessent said in a statement, \"While we hope no more banks will need to be sanctioned, that ultimately depends on how quickly the international community comes to its senses and ceases support of the murderous Iranian regime.\"\n\n\"We know who you are, we know where you are, and we will continue to take action together with our allies and partners until we have buried the head of the Iranian snake,\" Bessent said.\n\nGolden Global Bank did not immediately respond to CNBC's request for comment.\n\nPresident Donald Trump has hyped the sanctions operation as an \"economic D-Day\" of unprecedented scope and intensity, but Treasury has so far taken few actions to implement the plan since its Aug. 24 launch.\n\nThe U.S. has yet to take tangible action against China, Iran's largest trading partner and its top oil buyer. While Bessent insists Beijing is not exempt from potential sanctions, he has also pushed back on the idea that the plan only works if China is on board. Some geopolitics experts are skeptical that the U.S. will risk upending its fragile relations with China , at least before Trump meets with Chinese President Xi Jinping later this month.\n\nFriday's sanctions move targets Turkey's 35th-largest bank, with 2025 assets roughly equivalent to $517 million in today's dollars, according to TheBanks.eu .", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 02:09 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Mike Khouw: Cybercabs are a game changer\u2014here's how I'm trading Tesla", "full_content": "Living in Northern California, I've seen the new Tesla Cybercabs driving around, particularly when I've been in Palo Alto (Tesla's NorCal HQ).\n\nThe futuristic cars apparently have no steering wheel and no pedals - something I didn't personally notice as I watched them driving around \u2014 but by now we're starting to get used to the idea of driverless cars between the Waymos and, before they ended the program, self-driving Chevy Bolt EV's operated by Cruise. The others, with visible sensors and cameras hanging off every corner of the vehicles, look like prototypes. The sleek Cybercab, by contrast, looks like the future is now. It's a gamechanger.\n\nIn the short term, the market is a voting machine, and most options trades are, by their nature, short-term votes. Today's vote is about whether a visible, wheel-less rollout can reprice Tesla from \"EV maker with a software story\" back toward a company that's changing the world. Shares closed near $376 after a 5.4% jump on launch day, well below the 52-week high near $499. So how to play it using options?\n\nOver the past year, the three strongest-performing technical indicators for Tesla, in order, have been MACD, DMI, and RSI. All three are bullish now, which favors buying a long call, such as the 50 delta (which traders might write \"50^\") December 390s. The issue is that those cost $32.40/contract, roughly 8.6% of the current stock price.\n\nTo be profitable at expiration, the stock needs to rise above the $390 call strike by at least the premium paid. To offset this decay (aka \"theta\"), I'm electing to sell the nearer-dated 425/330 strangle, which collects $16.80. Theta works for the trade first: the Oct 23 strangle should decay faster than the longer-dated 390 call.\n\nIf Tesla chops between roughly 330 and 425 into that Friday, the short options expire and the remaining December call is carried at a lower basis.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 01:59 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "These companies are growing their dividends and may see upside, Morgan Stanley says", "full_content": "September is typically a rough patch for stocks, but adding a few dividend payers may help smooth the ride for investors.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 01:56 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dow tumbles more than 260 points after strong jobs report reignites rate hike fears: Live updates", "full_content": "August's hotter-than-expected payrolls reading increased expectations that the Federal Reserve could raise interest rates at its next meeting.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 01:46 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "2-year yield rises to highest since January 2025 after hot jobs report boosts expectations that the Fed could raise rates", "full_content": "Treasury yields rose as the hot jobs report along with sticky inflation may give the Fed more cover to hike interest rates in September.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 01:42 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Investors zero in on August inflation data in the week ahead after yields spike to levels not seen in years", "full_content": "Next week's inflation data takes on even greater importance for investors as they try to determine where the Federal Reserve could go with interest rates.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 01:40 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US stocks today: US stocks end lower as solid jobs data fuels hawkish Fed bets", "full_content": "Wall Street closed lower on Friday as a stronger-than-expected US jobs report lifted expectations of a Federal Reserve rate hike this month. Investors now await next week's CPI and PPI data for clues on inflation and the Fed's policy path, while Lululemon and Adobe shares fell on company-specific developments.", "source": "Economic Times Markets", "pub_date_str": "05 Sep 2026, 01:34 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why Oracle\u2019s stock looks like a compelling buy ahead of earnings", "full_content": "While there are long-term debates around Oracle\u2019s stock, analysts say the company looks poised to benefit from upbeat pricing trends and more when it reports results next week.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Sep 2026, 01:29 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic close to awarding Morgan Stanley and Goldman top roles in $2tn IPO", "full_content": "AI giant on track to unveil paperwork underpinning its blockbuster Wall Street debut as soon as next week", "source": "FT Markets", "pub_date_str": "05 Sep 2026, 01:16 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Corporate Issuers"], "exam_note":     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
