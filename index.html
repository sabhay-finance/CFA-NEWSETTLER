e making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 08:45 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "I\u2019m terrified of a market crash. Should I put $400,000 of my $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "21 Nov 2026, 08:45 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kavya Maran Gifts Gold Rings, Chocolates And Wedding Invites To Sun Group Employees", "full_content": "Kaviya Maran has reportedly gifted gold rings, chocolates and wedding invitations to Sun Group employees ahead of her wedding celebrations with Anirudh Ravichander.", "source": "NDTV Profit", "pub_date_str": "21 Nov 2026, 08:39 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Tech outages are fueling a new doomsday economy", "full_content": "A spate of high-profile technology outages that grounded planes , halted email access and slowed bank transactions have left many people worried about artificial intelligence -driven cyberattacks and the state of the U.S. energy grid.\n\nGovernment officials have dismissed rumors and speculation circulating online that there could be a nefarious culprit for the series of malfunctions. Despite those assurances, consumers like Sabrina Cepeda are readying for a larger-scale technology blackout or other emergency event.\n\nIn recent days, the Houston resident has purchased propane and lighter fluid for cooking and heating equipment that can be used without electricity. The mother of three also replenished her backup stockpiles of non-perishable foods, hygiene products and allergy medicine in the event that her family is homebound for several days.\n\n\"I have a way to keep my family fed, clean, hydrated, warm and safe,\" said Cepeda, 39. \"You want to have these things and not need them, rather than need them and not have them.\"\n\nThe doomsday economy is catching a bid. Wall Street and retailers are taking note.\n\nAt least half a dozen major technology outages took place in the U.S. between Nov. 12 and Nov. 17. In that time frame, spending at brands specializing in emergency products spiked about 400% compared with the same period a year prior, according to card data analyzed exclusively for CNBC by Consumer Edge.\n\nAt Ready America, which sells products like emergency survival kits, prepackaged water and high-calorie food bars, sales through e-commerce platforms have seen a roughly five-fold increase in recent days. In addition, corporate customers who keep the Vista, California-based company's supplies in their offices in case of emergency have called in to order more.\n\nThe company has rarely seen this much demand since the Covid pandemic sent Americans into lockdown more than six years ago, said Ready America President Trevyn Reese.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 08:34 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Max Healthcare, Fortis, Apollo, Aster: Hospital stocks steal show on D-Street with up to 14% rally - Buy now or wait?", "full_content": "FORTIS Sharmila Bhadoria Published 21 Nov 2026, 08:26 PM IST Prefer Livemint on Google Shares of hospital stocks like Max Healthcare, Fortis Hospital, Aster DM Quality Care and Apollo Hospitals Enterprise rallied as much as 14% over the past five trading sessions. The sharp rally in the segment has come amid optimism around corporate earnings and strong growth visibility.\n\nShares of Apollo Hospitals, Fortis Healthcare , Max, and Aster DM closed with 5%, 2%, 3.98%, and 5.44% respectively.\n\nApollo Hospitals stock closed 5.09% higher at \u20b9 9190.05 per share on BSE with an Mcap of \u20b9 1,32,138.82 crore on Friday. The hospital stock has delivered 8.82% return in two weeks, 19.30% return in one month, and around 29% return in 2026 so far. Motilal Oswal maintained a \u2018Buy\u2019 rating for Apollo Hospitals with a target price of \u20b9 10,400 per share.\n\nShares of Fortis closed 2% higher at \u20b9 825 per share with an Mcap of \u20b9 62,284.05 crore on Friday. Its share price value has surged 7.84% in one week, 12.12% in one month. But the stock value has declined 8.18% in 2026 so far. MOFSL gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 940 per share.\n\nThe company scrip closed 5.44% higher at \u20b9 779.65 per share on BSE with a market capitalisation of \u20b9 67,959.94 crore on Friday. The stock has delivered 7.95% return in one week, 16.85% return in one month, and 28.63% return in 2026 so far. MOFSL maintained a \u2018Buy\u2019 rating with a target price of \u20b9 870.\n\nShares of Max Healthcare closed with 3.98% gain at \u20b9 1079.60 per share on BSE with an Mcap of \u20b9 1,05,080.39 crore on Friday. The stock has delivered 14% return in one week, 15.59% return in two weeks, 30.18% return in one month, and around 8% return in three months. In its latest report, MOFSL maintained a \u2018Buy\u2019 rating, with a target price of \u20b9 1085 per share.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 08:26 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Goldman Sachs admits the 'AI unwind' has spiraled into something more dangerous \u2014 and it's watching for 3 signs of bottom - Fortune", "full_content": "Goldman Sachs admits the 'AI unwind' has spiraled into something more dangerous \u2014 and it's watching for 3 signs of bottom Fortune Goldman Says Stock Selloff Has Legs as Panic Index Nears Maximum Bloomberg.com Goldman Sachs warns US stock selloff could worsen next week TradingView The scenario at the end of 2018: The Federal Reserve continued to raise interest rates, leading to a 20% plunge in U.S. stocks from their September highs, which forced the Fed to \"pivot\" in January. \u5bcc\u9014\u725b\u725b The VIX surged to its highest level since the tariff turmoil of last April, while the Goldman Sachs panic index approached its maximum reading. U.S. equities may face another round of selling exceeding $80 billion next week. Moomoo", "source": "Google News Business", "pub_date_str": "21 Nov 2026, 08:17 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin price crash: \u200bFalls to lowest level in two years - What\u2019s behind plunge of world\u2019s largest cryptocurrency", "full_content": "Bitcoin, the world's largest cryptocurrency by market capitalisation, plunged to its lowest level in more than two years on Friday as growing concerns over stretched valuations of artificial intelligence (AI) stocks triggered a broader sell-off in financial markets.\n\nBitcoin fell 5.10% to $55,830 at 11:13 p.m. ET on Friday (0413 GMT on Saturday), marking its lowest level since September 2024. The cryptocurrency had earlier declined 3.57% to $56,813.68.\n\nThe latest decline came after Bitcoin slipped below the psychologically important $60,000 threshold earlier on Friday for the first time since July. The cryptocurrency has come under sustained selling pressure as investors increasingly reduce exposure to risky assets amid growing economic and market uncertainties.\n\nAnalysts said the cryptocurrency market is experiencing a sharp deterioration in investor confidence, with market participants increasingly moving away from riskier investments.\n\nConcerns over the profitability of massive investments in AI infrastructure have weighed on technology stocks and spilled over into cryptocurrency markets. Other factors contributing to the downturn include rising borrowing costs, regulatory uncertainties following the Democrats' victory in the US midterm elections and Nvidia CEO Jensen Huang's departure.\n\nThe latest phase of Bitcoin's decline has also been driven by investors withdrawing money from Bitcoin exchange-traded funds (ETFs), reflecting weakening institutional demand.\n\nBitcoin ETFs have recorded year-to-date net outflows of more than $3 billion, adding to the pressure on the cryptocurrency.\n\nThe broader economic environment has also turned increasingly unfavourable for cryptocurrencies.", "source": "LiveMint Markets", "pub_date_str": "21 Nov 2026, 08:16 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Retirees face a looming deadline for required withdrawals \u2014 missing it could trigger a tax penalty", "full_content": "Every year, millions of Americans must take required withdrawals from retirement accounts by Dec. 31.\n\nAmid the busy holiday season, it's easy to miss the year-end deadline for required minimum distributions \u2014 a mistake that can trigger a hefty IRS penalty , experts said.\n\n\"One of the most common RMD mistakes is waiting until the last minute,\" said certified financial planner Alex Canellopoulos, director of wealth at Vista Capital Partners in Portland, Oregon.\n\nMost retirees must start RMDs from pretax accounts at age 73. The withdrawal is based on the previous year's account balances on Dec. 31, your age and an IRS \" life expectancy factor .\"\n\nThe first annual RMD deadline is April 1 of the year after you turn 73, and future withdrawals are due by Dec. 31. If you wait until April 1 for the first one, you'll need two RMDs that year.\n\nRMDs also apply to certain inherited IRAs if the original IRA owner reached RMD age before their death.\n\nIn 2023, more than 14.8 million taxpayers age 70 or older had a traditional individual retirement account, according to the latest IRS data. The average year-end market value of the accounts was about $330,000.\n\nDeferring RMDs until the last minute raises the likelihood of mistakes, such as overlooking certain retirement accounts or making withdrawal calculation errors, Canellopoulos said.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 08:00 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why Anthropic's blockbuster IPO couldn't escape the stock market correction", "full_content": "Anthropic's IPO was a big public market success for the company, but Friday's selloff shows that valuing the AI stock will remain volatile for investors.", "source": "CNBC Top News", "pub_date_str": "21 Nov 2026, 07:37 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "An \u2018illusion of glitz and glamour\u2019: Inside California\u2019s modern-day gold rush, where miners can bring in millions", "full_content": "The price of gold has sparked a modern-day gold rush in California. Small-scale min         document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
