<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Bengal enhances benefits for state cadre IPS officers: From HRA to education loans and sumptuary allowance\u2014Check details", "full_content": "The West Bengal state government this week announced a number of benefits for serving and retired Indian Police Service ( IPS ) of the state cadre, which come into immediate effect, PTI reported.\n\nIn three memorandums on Monday, the state announced education loans of \u20b9 50 lakh for children of the officers and enhanced sumptuary allowances of up to \u20b9 51,000 for IPS officers of the ranks of Inspector General of Police (IGP), Additional Director General of Police (ADGP) and Director General of Police ( DGP ), among other benefits, it added.\n\nNotably, sumptuary allowance is a special monthly fund to cover expenses incurred on entertaining official visitors or managing hospitality duties associated with the public office of high-ranking officials, as per the report.\n\nAccording to the state memoranda, the following benefits are announced:\n\nThe government said the welfare measures had been under consideration for some time.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 02:22 PM IST", "pub_date_relative": "3m ago"}, {"title": "Trump says U.S., China, Russia \u2018uniquely positioned\u2019 to discuss reducing nuclear weapons at historic meeting", "full_content": "President Donald Trump said the U.S., Russia and China are \"uniquely positioned\" to reduce the world's nuclear weapons stockpile during his historic trilateral meeting with Xi Jinping and Vladimir Putin on Thursday.\n\nTrump told Xi and Putin they were \"really making history\" with the first-ever trilateral meeting between the leaders of the three countries.\n\nHe said it was an \"honor\" to be at the meeting with Putin and Xi, whom he congratulated on a very successful APEC summit.\"\n\nChinese state media said Xi would lead the trilateral. Beijing only confirmed the closely watched meeting on Monday.\n\nThe three leaders had briefly gathered Wednesday evening as part of a welcome banquet for the APEC leaders more broadly.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 02:22 PM IST", "pub_date_relative": "3m ago"}, {"title": "LTCG vs STT: How are investors taxed on stocks, equity mutual funds and gold ETFs? Applicability and tax rules explained", "full_content": "As the Union Budget 2027 approaches, discussions around a possible reduction or removal of Long-Term Capital Gains ( LTCG ) tax and Securities Transaction Tax (STT) have gained momentum among market participants and policymakers. However, these two levies work differently and have different implications for investors.\n\nLTCG is a tax on the profit earned when an investor sells an investment after holding it for a specified period. On the other hand, STT is a tax charged on eligible buy and sell transactions on recognised stock exchanges, regardless of whether the investor makes a profit or loss.\n\nHere is how the two taxes apply to equities, mutual funds , and gold ETFs.\n\nThe tax treatment of long-term capital gains depends on the investment category and the period for which it is held.\n\nFor instance, if an investor earns \u20b9 2 lakh in LTCG from listed shares and equity mutual funds combined, \u20b9 75,000 will be taxable at 12.5%. The basic tax liability will be \u20b9 9,375, excluding cess and applicable surcharge.\n\nHowever, if the investor earns \u20b9 2 lakh in LTCG from a Gold ETF, the entire gain is taxable at 12.5%, resulting in a tax liability of \u20b9 25,000.\n\nUnlike LTCG, STT is charged on eligible transactions rather than the profits earned. According to the NSE, the applicable STT rates effective 1 April 2026 are:\n\nHowever, gold ETFs, silver ETFs, liquid ETFs, gilt ETFs, and certain international ETFs are exempt from STT.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 02:20 PM IST", "pub_date_relative": "6m ago"}, {"title": "Anthropic IPO Listing: How Indian investors can buy ANT shares and what it will really cost", "full_content": "Claude-maker Anthropic is all set to make its debut on Nasdaq on 19 November. The much-talked-about public offering has priced its shares at $83 apiece, which is above the initial indicative range of $70-78. Indian investors couldn't subscribe to the IPO because the company didn't include India in its international retail offering. Anthropic restricted its international retail offering to Australia, Canada, Japan, Switzerland, the UK and specified European countries. However, this doesn't mean Indian investors are prohibited from buying Anthropic shares. Eligible investors can invest in Anthropic (ANT), but only after it is listed on Nasdaq.\n\nIf you are looking to invest in Anthropic stock, here's what you need to know:\n\nIndian residents can buy Anthropic shares after its listing, as well as other US-listed shares, through international brokerage platforms that facilitate overseas investments under RBI's Liberalised Remittance Scheme ( LRS ). Platforms such as Interactive Brokers, Vested Finance and INDmoney offer access to international markets. Investors must first open an account, complete the required KYC formalities and remit money from their Indian bank account to the overseas brokerage account. Once the funds are credited, they can place buy or sell orders in US dollars.\n\nThe RBI's LRS allows Indian residents to invest in foreign-listed shares, including US stocks. Once Anthropic lists on a US stock exchange, Indian retail investors could buy its shares through an overseas brokerage platform, subject to the LRS, the Foreign Exchange Management Act (FEMA), and applicable tax rules.\n\nThere's a limit of $ 250,000 per financial year per resident.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 02:17 PM IST", "pub_date_relative": "8m ago"}, {"title": "Toyota to recall over 314,000 US vehicles over Takata air bag rupture risk, NHTSA says", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:12 PM IST", "pub_date_relative": "13m ago"}, {"title": "Evotec shares rise after second IND acceptance with Bristol Myers", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:10 PM IST", "pub_date_relative": "15m ago"}, {"title": "Subsea 7 shares jump over 5% as Q3 results lift 2026 revenue outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:08 PM IST", "pub_date_relative": "17m ago"}, {"title": "Arbitrage funds don't always win over liquid funds for short-term savings", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFor years, liquid funds were the go-to option for investors looking to park surplus cash for a few months or build an emergency fund. This changed in 2023, when debt fund gains became taxable at the investor's income tax slab rate, regardless of the holding period.\n\nArbitrage funds, which qualify for equity taxation, emerged as an attractive alternative, particularly for investors in higher tax brackets. They have historically delivered slightly better returns than liquid funds and a favourable tax treatment widens the gap on a post-tax basis.\n\nBut their slightly higher returns have come under stress after the securities transaction tax ( STT ) on futures was increased in April. Higher transaction costs have eaten into returns, narrowing the performance gap between arbitrage and liquid funds.\n\nAccording to Value Research data, both categories delivered average returns of 3.24% over the past six months, wiping out the arbitrage funds\u2019 lead.\n\nHowever, Dhirendra Kumar, CEO of Value Research, points out that STT is not the only reason for the narrowing gap.\n\n\u201cSpreads also move with interest rates and flows. But STT is a permanent cost,\u201d Kumar said.\n\nSpread refers to the price difference between a stock in the cash market and its futures contract. Higher interest rates and institutional buying can widen spreads, improving arbitrage returns. Foreign institutional investors have been net sellers for much of this year, while rate hikes began only this quarter. These factors may have kept spreads under pressure, weighing on returns.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 02:07 PM IST", "pub_date_relative": "18m ago"}, {"title": "Korro Bio at Jefferies Global Healthcare Conference: pipeline gains focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:06 PM IST", "pub_date_relative": "19m ago"}, {"title": "Tech stocks lead Europe\u2019s STOXX 600 higher on AI hope", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:06 PM IST", "pub_date_relative": "19m ago"}, {"title": "McBride shares tumble 25% on profit warning and margin delays", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:04 PM IST", "pub_date_relative": "22m ago"}, {"title": "Who Is Cenly Chen And Why Is Nvidia's Former Executive Jay Puri In Focus After Short-Seller Report?", "full_content": "Muddy Waters Research asks whether the woman photographed alongside Puri is the same Chen named in a lawsuit over chip diversions to China.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 02:04 PM IST", "pub_date_relative": "22m ago"}, {"title": "Saif Ali Khan Receives Threat Linked To Baba Siddique Case, Mumbai Police Probe Sender's Identity", "full_content": "Saif Ali Khan received a threat linked to Baba Siddique murder case accused Zeeshan Akhtar, Mumbai Police are investigating the authenticity.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 02:02 PM IST", "pub_date_relative": "23m ago"}, {"title": "Rs 45 LPA Without Technical Background: What Helped This Reddit User Crack The Job?", "full_content": "Some users also raised practical questions about finding founders' email addresses and identifying the right hiring managers to approach.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 02:01 PM IST", "pub_date_relative": "24m ago"}, {"title": "Solus Alternative Asset Management sells $96,304 of Bristow Group stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:01 PM IST", "pub_date_relative": "24m ago"}, {"title": "Indonesia stocks lower at close of trade; IDX Composite Index down 1.74%", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:00 PM IST", "pub_date_relative": "26m ago"}, {"title": "ADP stock surges after winning regulatory approval for contract", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 01:59 PM IST", "pub_date_relative": "26m ago"}, {"title": "Why is Johnson Matthey stock rallying today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 01:59 PM IST", "pub_date_relative": "26m ago"}, {"title": "RBI eases export reporting for freelancers. Here\u2019s what still applies", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFor India\u2019s freelancers and new-age businesses, overseas clients offer an opportunity to take Indian expertise to a wider market. Whether it is a tutor teaching students abroad, a content creator earning from international platforms or a consultant advising foreign clients, a clear compliance framework can help these opportunities grow with greater confidence.\n\nThe new RBI trade framework, effective from 1 October 2026, prompted questions about service-export reporting through the Export Declaration Form (EDF) for freelancers and new-age businesses. To address them, the RBI Governor and Deputy Governor provided oral clarifications on 7 October during a press conference, followed by a formal notification on 2 November, effective retrospectively from 1 October 2026. The Foreign Exchange Dealers\u2019 Association of India (FEDAI) has also issued implementation clarifications for authorized dealer banks.\n\nTogether, these developments streamline reporting while preserving the safeguards governing cross-border receipts. It is important to understand both the relief available and the responsibilities that remain.\n\nThe RBI deputy governor\u2019s reference to relief for individuals performing \u2018contracts of a personal nature\u2019 during the press conference initially left room for interpretation, since similar language has a narrower legal meaning.\n\nSection 2(zb) of FEMA excludes \u201ccontracts of personal service\u201d from the definition of services.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:59 PM IST", "pub_date_relative": "26m ago"}, {"title": "Coal India vs NMDC vs MOIL: Which mining PSU stock deserves a place in your portfolio for long-term gains? Check target", "full_content": "MOIL NMDC Sharmila Bhadoria Published 19 Nov 2026, 01:58 PM IST Prefer Livemint on Google MOIL vs NMDC vs Coal India : Mining capacity enhancement, improved metal demand, and higher sales volume are likely to benefit government-backed mining companies like NMDC, Coal India, and MOIL Limited.\n\nShares of MOIL and NMDC were trading marginally under pressure during Thursday\u2019s intraday trading session, whereas Coal India, managed to hold on to gains.\n\nOne of India's largest iron ore producers, NMDC will benefit from growth potential through mining capacity enhancement and better infrastructure, stated Systematix Institutional Equities.\n\n\u201cNMDC remains one of our preferred picks, supported by growth potential through mining capacity enhancement and better infrastructure. However, lower sales volumes and higher operating costs affected its quarterly performance,\u201d read the Systematix Institutional Equities report.\n\nMOIL offers a recovery opportunity, supported by improving manganese demand and production, noted the brokerage while highlighting that lower realisations and inability to meet guidance remain key concerns.\n\nCoal India earnings \u201care expected to improve with higher sales volumes. However, lower e-auction premiums and higher operating costs could limit profit growth,\u201d read the brokerage report.\n\nSystematix gave a \u2018Buy\u2019 rating to MOIL and NMDC, and maintained \u2018Hold\u2019 for Coal India. Among the three companies, MOIL has the highest upside potential, as per the brokerage report, dated November 17.\n\nCoal India share price was trading 0.83% higher at \u20b9 391.90 per share on BSE with an Mcap of \u20b9 2,41,517.32 crore at 1:40 pm on Thursday. Its share price value has declined 4.88% over the last one month, and 14% in last six months.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:58 PM IST", "pub_date_relative": "27m ago"}, {"title": "This closely-watched guru just sold everything", "full_content": "Panmure Liberum strategist and widely-followed stock-market commentator Joachim Klement has effectively had his personal retirement portfolio 100% invested in stocks for many years.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 01:55 PM IST", "pub_date_relative": "31m ago"}, {"title": "India-US Trade Deal By December? CEA Nageswaran Says Worst Of Tariff Tensions May Be Over", "full_content": "CEA Nageswaran identified geopolitical divisions, shipping disruptions, China's manufacturing strength, climate change, energy security, and AI-led job risks as key challenges for India's Viksit Bharat 2047 ambition.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:51 PM IST", "pub_date_relative": "34m ago"}, {"title": "How this hedge fund is betting on people\u2019s fears of getting old", "full_content": "Hedge fund manager Kernow sees U.K.-listed Beauty Tech Group nearly tripling in value.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:50 PM IST", "pub_date_relative": "35m ago"}, {"title": "Co-Signing Loan For Family Member? How It Can Affect Your Credit Score And Future Borrowing", "full_content": "Putting your name on someone else's loan can create obligations that extend beyond helping them get the application approved.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:50 PM IST", "pub_date_relative": "35m ago"}, {"title": "MRF faces a long road to margin recovery as costs stay high", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMRF Ltd is on a bumpy road as cost inflation hits the tyre sector, which uses crude-linked derivatives and natural rubber as key inputs. MRF\u2019s standalone gross margin dipped 470 basis points (bps) year-on-year to 31.7% in the September quarter (Q2FY27). Ebitda margin shrank 430 bps year-on-year to 10.7%. The company anticipates continued disruptions and volatility in commodity markets, which would keep raw material and logistics costs elevated.\n\nProfitability prospects for the tyre industry are heavily linked to benefits from commodity costs rather than long-term structural gains. Historically, tyre companies have been able to pass on the entire increase in raw material prices over a few quarters through steady price increases, notes Centrum Broking. While this is comforting to some extent, it points to a gradual margin recovery, as the impact of price increases comes with a lag. Motilal Oswal Financial Services has trimmed MRF\u2019s FY27 earnings estimate by 17% and now expects earnings to remain flat over FY26-28.\n\nThe MRF stock is down 15% so far in 2026 and trades at 20 times estimated FY28 earnings, Bloomberg data showed. \u201cWhile its return on capital employed has improved to 11.8% from a recent dip to 10% in FY25, it is likely to dip to 7% by FY27 given the sustained margin pressure before recovering in FY28,\u201d adds Motilal.\n\nWhile MRF isn\u2019t alone in facing inflationary pressure, its relatively lower revenue growth is discouraging. In Q2FY27, revenue grew around 18% year-on-year, aided by sustained demand from both the OEM and replacement segments. Competitors fared better: Apollo Tyres \u2019 revenue grew 26%, Ceat\u2019s 23% and JK Tyre\u2019s 27%.\n\nApollo took cumulative price hikes of 13-15% across categories during August-October. JK Tyre has implemented hikes of 11-12% so far in FY27 and plans another 4-5% increase in Q3.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:49 PM IST", "pub_date_relative": "37m ago"}, {"title": "Noida consumer forum pulls up builder for failing to provide home loan documents, orders flat handover within 30 days", "full_content": "A couple in Noida paid \u20b9 7.5 lakh to book a flat priced at \u20b9 77.35 lakh and have recently secured relief from a consumer forum after their builder cancelled the allotment over alleged non-payment, as reported by The Times of India.\n\nThe relief was provided after the district consumer disputes redressal commission instructed the builder to hand over possession, holding that its failure to provide the essential documents required for disbursing the home loan clearly amounted to a deficiency in service .\n\nManoj Kumar Bhirgu and his wife, Niranjana Sharma, residents of Sector 74, Noida, had booked a 1,595 sq ft apartment in a project developed by JSS Buildcon Pvt Ltd.\n\nThe couple made a payment of \u20b9 1 lakh on 7 July 2023, followed by another \u20b9 6.5 lakh on 28 July 2023. Subsequently, a builder-buyer agreement was entered into by both parties.\n\nAs per the details of their complaint, the couple planned to clear the pending amount through a \u20b9 64 lakh home loan from the Central Bank of India\u2019s Shalimar Bagh branch situated in Delhi.\n\nThe loan was eventually processed on 27 September 2023 through a \u2018tripartite agreement\u2019 involving the couple, the banking institution and the builder. Later, on 24 November, the bank informed the builder that the loan had been approved and requested two documents to release the funds in accordance with the terms and conditions.\n\nHowever, the builder failed to meet this requirement despite repeated requests and reminders from the buyers and the bank. Subsequently, the builder cancelled the flat\u2019s allotment, citing non-payment of the outstanding amount. The couple objected to this cancellation and sent a legal notice to the concerned builder dated 30 April 2024, but the builder did not provide a satisfactory response.\n\nAfter all other options were exhausted, the couple approached the district consumer commission on 22 June 2024. The builder and its two directors, Pratosh Kumar Sharma and Ankit Sharma, failed to appear or submit their response.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:44 PM IST", "pub_date_relative": "41m ago"}, {"title": "ABB India\u2019s margin recovery in spotlight amid record order inflow", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nABB India\u2019s record order inflow in the September quarter underscores strong demand across key segments. Order inflow surged 56% year-on-year (y-o-y) to \u20b9 4,733 crore, its highest-ever quarterly level. For the nine months ended September, order inflow grew 43% to \u20b9 13,376 crore, surpassing the orders secured in the whole of 2025. The company follows a January-December financial year, making the September quarter its third quarter (Q3CY26).\n\nYet, investors have been less enthused, with the stock down about 2% since the Q3CY26 results. The concern is margin pressure. While revenue grew a healthy 19% to \u20b9 3,738 crore, Ebitda rose slower, at nearly 14% to \u20b9 552 crore. Higher commodity costs, rupee depreciation and an adverse revenue mix drove a 141-basis-point (bps) y-o-y decline in gross margin. The figures exclude the contribution of the robotics division, which ABB divested in March.\n\nBetter operating leverage, however, limited the fall in Ebitda margin to 75 bps. Price increases implemented over the past few quarters also helped, lifting Ebitda margin by 220 bps sequentially. Even so, the 9MCY26 margin of 13.5% remains well below the 15.8% recorded in CY25.\n\n\u201cCY24 was the apex point for profitability, with a record Ebitda margin of 18.9%. And, ever since, QCO compliance costs, commodity inflation, higher logistics cost and INR depreciation have pulled the margin down,\u201d said a report by ICICI Securities.\n\nWhile higher scale and calibrated price hikes are partly offsetting these pressures, the brokerage believes a meaningful margin recovery may require external factors to turn favourable. ICICI estimates ABB\u2019s Ebitda margin to reach 16.5% by CY28, with Ebitda growing at a compound annual growth rate of 14% over CY25-28.\n\nDemand outlook, meanwhile, remains robust. ABB\u2019s order book expanded 36% y-o-y to \u20b9 12,900 crore.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:44 PM IST", "pub_date_relative": "42m ago"}, {"title": "Salman Khan's Superhero Film With Raj & DK Postponed Due To 'Monster'?", "full_content": "Salman Khan's superhero film with Raj-DK has been postponed to April 2027 as he completes 'Monster' and its Eid release commitments.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:43 PM IST", "pub_date_relative": "42m ago"}, {"title": "Indian Man Found Dead in Burning Car in Canada; Homicide Probe Underway", "full_content": "While putting out the blaze, emergency crews spotted human remains inside the car, according to the police account.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:42 PM IST", "pub_date_relative": "43m ago"}, {"title": "Russia says Putin in \u2018excellent mood\u2019 after Trump meeting, ahead of trilateral with Xi in China", "full_content": "SHENZHEN, China \u2014 U.S. President Donald Trump met with Vladimir Putin and Xi Jinping separately on Thursday, ahead of a scheduled trilateral with his Russian and Chinese counterparts, according to pool notes and Chinese state media.\n\nOn greeting the Russian president on the sidelines of the Asia-Pacific Economic Cooperation forum, Trump said he had a \"great relationship\" with Putin, adding they had known each other for a long time and expressed hope that \"a lot of wonderful things can come out of this, or at least start.\"\n\nThe two presidents were meeting for the first time since a summit in Alaska in August last year.\n\nRussian presidential aide Yuri Ushakov said the talks lasted for approximately 40 minutes, and Putin left the meeting place in \"an excellent mood,\" according to Russian state news outlet Ria Novosti.\n\nRussia's full-scale invasion of Ukraine was a key topic for the talks, Ushakov said, alongside preparations for the trilateral summit with China's Xi.\n\nEarlier on Thursday, the leaders and other members of APEC gathered for a summit . Trump and Xi entered the room side by side.\n\nXi said China would provide $20 million to support APEC cooperation, and establish a \"Center for Asia-Pacific Community Studies in Shenzhen to conduct policy research and exchanges and provide intellectual support.\"\n\nLater in the morning session, Trump said that he opposed regulating artificial intelligence as it would \"stifle\" the industry.", "source": "CNBC Finance", "pub_date_str": "19 Nov 2026, 01:41 PM IST", "pub_date_relative": "44m ago"}, {"title": "Stock Market Today: Sensex Zooms 500 Points, Nifty Above 25,350; Maruti Suzuki Rallies 6%, M&M 4%", "full_content": "Foreign Institutional Investors (FIIs) were net buyers of Indian equities worth Rs 4,553.87 crore on November 18. Domestic Institutional Investors (DIIs), meanwhile, were net sellers, offloading shares worth Rs 4,454.65 crore.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:33 PM IST", "pub_date_relative": "52m ago"}, {"title": "Mutual funds received 53% of Mahanadi Coalfields IPO anchor book: Which schemes will own Coal India subsidiary shares?", "full_content": "Coal India \u2019s wholly owned subsidiary Mahanadi Coalfields IPO opened for public subscription on 19 November and will close on 23 November 2026. The issue gives investors an opportunity to participate in the public offering of one of India\u2019s largest coal-producing companies.\n\nBefore an IPO opens for public subscription, companies complete the anchor investor allocation process. According to the basis of allotment dated 18 November 2026, Mahanadi Coalfields IPO allocated around 16.88 crore equity shares to anchor investors at \u20b9 136 per share.\n\nOf these, 8.95 crore shares, or 53.04% of the total anchor allocation, went to 11 domestic mutual funds through 29 schemes, including three specialised investment funds (SIFs).\n\nHere is a look at the mutual fund schemes that received the largest allocations and what investors should know.\n\nNippon India Small Cap Fund received the highest allocation among the mutual fund schemes, followed by Invesco India Contra Fund and Nippon India Power & Infra Fund.\n\n*Source: Mahanadi Coalfields IPO Anchor Allocation Report; Excludes SIFs; Anchor investor allocation price is \u20b9 136; Issue Price of the IPO is \u20b9 129 to \u20b9 136.\n\nNippon India Small Cap Fund received 2.99 crore shares worth \u20b9 407.41 crore, making it the largest mutual fund scheme allocation in the anchor book. The allocation represents approximately 0.53% of the fund's \u20b9 76,903 crore AUM as of October 2026.\n\nFor instance, if Mahanadi Coalfields shares list at a 10% premium to the anchor allocation price of \u20b9 136, the fund's holding would generate an unrealised gain of around \u20b9 40.74 crore. This would translate into an estimated 0.05% addition to the fund's NAV.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:28 PM IST", "pub_date_relative": "57m ago"}, {"title": "Mutual Funds, SIPs: How long should you stay invested? Expert says data shows the real truth \u2014 Check here", "full_content": "If you want to invest in mutual funds and systematic investment plans (SIPs) or you already are an investor in the space and wonder how long to stay invested to make gains, Motilal Oswal Mutual Fund, through a 21-year study, has suggested an answer.\n\nAccording to data analysed for SIP investments over 5-, 7-and 10-year periods by the Fund \u2014 the Nifty 100, Nifty Midcap 150, Nifty Smallcap 250 and Nifty 500, longer investment horizons in SIPs historically improved minimum returns and helped reduce the likelihood of negative returns.\n\nThe study covered various market cycles, including the 2008-09 financial crisis, the 2013 market downturn and the COVID-19 period.\n\nThe findings highlighted the importance of giving SIP investments time to grow.\n\nIt noted, \u201cmarket movements can influence returns over shorter periods. However, the historical data shows that the share of SIPs recording negative returns reduced as the investment period increased.\u201d\n\nThe study showed that while the pace of improvement differed across indices, the overall trend remained consistent ; and staying invested for longer periods was associated with fewer negative-return instances and better minimum outcomes across all four indices.\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:27 PM IST", "pub_date_relative": "58m ago"}, {"title": "FCNR-related costs and benefits yet to fully play out for banks: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a FCNR-related costs and benefits yet to fully play out for banks: Report The Economic Times daily newspaper is available online now. Read Today's Paper FCNR-related costs and benefits yet to fully play out for banks: Report SECTIONS FCNR-related costs and benefits yet to fully play out for banks: Report ANI Last Updated: Nov 19, 2026, 01:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign Currency Non-Resident deposits are expected to significantly influence the performance of Indian banks. The benefits and costs associated with these deposits have not fully materialized for financial institutions. Banks exhibiting a strong position in fixed-rate FCNR deposits may manage rising funding costs more effectively. Variations in loan growth and deposit composition among banks could lead to different performance outcomes.\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Nov 2026, 01:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "114 Rafales, 6 submarines! Defence stocks HAL, BEL, BDL shares jump up to 3% - Is a mega defence order boom coming?", "full_content": "BEL BDL Pranati Deva Published 19 Nov 2026, 01:23 PM IST Prefer Livemint on Google Defence stocks, including Hindustan Aeronautics Ltd (HAL), Bharat Electronics Ltd (BEL) and Bharat Dynamics Ltd (BDL), attracted buying interest on Thursday, November 19, after government officials indicated plans for a significant increase in defence capital expenditure.\n\nThe proposed 20% hike could strengthen the procurement pipeline and create opportunities for domestic manufacturers, with major acquisitions such as 114 Rafale fighter jets and six advanced conventional submarines under Project 75I potentially on the agenda.\n\nShares of defence companies rose by as much as 3% during the session. BEL, Apollo Micro Systems, HAL, BDL, Astra Microwave, Paras Defence, GRSE, Mazagon Dock, Bharat Forge and Data Patterns were among the notable gainers, with advances ranging between 1% and 3%. Investor sentiment improved after Defence Secretary Rajesh Kumar Singh said the ministry was seeking a substantial increase in capital spending, while Defence Minister Rajnath Singh highlighted the country's expanding defence manufacturing and export capabilities.\n\nDespite intermittent corrections, expectations of sustained government spending have supported the sector. The Nifty India Defence index has gained 14.5% in 2026 so far and more than 7% over one year. However, it has declined 3% in the past week, 4% over one month and over 11% in three months.\n\nThe Defence Ministry is looking for a 20% increase in capital expenditure in compounded annual growth rate (CAGR) terms for FY28, over and above the 22% increase secured in the previous year, according to Defence Secretary Rajesh Kumar Singh. The proposed increase could provide greater financial headroom for procurement programmes and support the government's efforts to expand military capabilities.\n\nIndia's defence capital expenditure allocation for FY27 stood at \u20b9 2.19 lakh crore, compared with the FY26 Budget estimate of \u20b9 1.8 lakh crore.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "FDI Ban On Tobacco Manufacturing: India Foundation Recommends Major Policy Reset", "full_content": "The FDI ban was issued on 10 May 2010, after a Cabinet Committee on Economic Affairs decision the previous month.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Van Gogh's 'Chataigniers en Fleurs' sells at auction for record $190.4 million", "full_content": "Vincent van Gogh's 1890 painting \"Chataigniers en Fleurs,\" a radiant depiction of village life unseen in public for more than 50 years, was sold to a bidder on Wednesday for $190.4 million, an auction record for the famed Post-Impressionist.\n\nSotheby's of New York, which held the auction, said the sum also marked the second-highest price paid for any work of art sold by its auction house, surpassed only by Gustav Klimt's \"Portrait of Elisabeth Lederer,\" which sold in November 2025 for $236.4 million.\n\nAnnouncing the sale in a press statement, the auction house made no mention of the buyer. But the New York Times reported the prevailing bidder was William Acquavella, a veteran art dealer and the head of Acquavella Galleries.\n\nVan Gogh painted the canvas, dominated by a lush row of flowering chestnut trees lining a village road, days after he arrived in the French hamlet of Auvers-sur-Oise, northwest of Paris, where he spent the final two months of his life. The composition features a solitary male figure in a hat, thought to possibly represent the artist himself, walking past a trio of colorfully dressed women carrying parasols in the shade of the trees.\n\nThe vibrantly worked brush strokes are said to connect the painting with other celebrated works of this period in van Gogh's career, including \"The Starry Night\" and \"The Church at Auvers-sur-Oise.\"\n\nSotheby's characterized the painting as one of the most important works from that era of van Gogh's career remaining in private hands, and \"among the most exceptional Post-Impressionist paintings ever to come to the market.\"\n\nThe van Gogh painting was part of a larger group of 12 masterpieces auctioned on Wednesday from the renowned Blaquier-Arrieta Collection of Impressionist and Modern paintings.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty's Rally Far From Over? One Analyst Sees 28,000 Ahead Amid 13% Recovery From Recent Lows", "full_content": "Singh's positive outlook is supported by mutliple factors including foreign institutional investor (FII) buying, improving corporate earnings and valuations that remain below their recent historical average.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "'Only He Was On My Mind\u2019: Sooraj Barjatya On Casting Ayushmann Khurrana As Prem In Yeh Prem Mol Liya", "full_content": "Sooraj Barjatya revealed why Ayushmann Khurrana was his first and only choice to play Prem in Yeh Prem Mol Liya.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Auto stocks hit the accelerator! Nifty Auto jumps 4%; Maruti, M&M, Hyundai lead the rally | What's behind the surge?", "full_content": "HYUNDAI TMCV Dhanya Nagasundaram Published 19 Nov 2026, 01:09 PM IST Prefer Livemint on Google Auto stocks witnessed a sharp rally on Thursday, with the Nifty Auto index surging nearly 4% as a steep correction in key industrial metals eased concerns over rising input costs for automobile manufacturers.\n\nMaruti Suzuki India led the gains, climbing 7%, while Hyundai Motor India , Eicher Motors and Mahindra & Mahindra (M&M) advanced around 5% each. Tata Motors Passenger Vehicles (TMPV) rose 4%.\n\nThe rally comes as several key commodities used in automobile manufacturing have corrected sharply. Copper prices have slipped to a seven-month low and turned flat for 2026, while aluminium has fallen to a 51-week low. Silver is trading at a 14-month low, gold at a 12-month low and tin at an eight-month low, according to reports.\n\nThe decline in base metal prices is expected to ease input cost pressures for automakers and potentially support margins. However, the benefit may not be immediate, as existing procurement cycles could delay the transmission of lower commodity prices to manufacturers. Rising domestic steel prices could also offset some of the expected savings.\n\nMarket participants will therefore be watching how quickly the correction in global commodity prices translates into lower input costs and improved margins. The extent of the benefit could also vary across vehicle segments, depending on their raw material requirements and procurement arrangements.\n\nSudeep Shah, Head \u2013 Technical and Derivatives Research at SBI Securities, said the Nifty Auto index found support near its 13-day exponential moving average (EMA) before staging a sharp rebound. The index surged nearly 4% on Thursday, forming a sizeable bullish candle on the daily chart.\n\nHe attributed the improvement in sentiment partly to the sharp correction in raw material prices, particularly copper, which declined nearly 6% in the previous session to a seven-month low.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "BL Kashyap & Sons shares surge 15%, set for biggest 1-day gain since April. What's behind the investor optimism?", "full_content": "Shares of B L Kashyap & Sons, one of India\u2019s leading engineering, procurement and construction (EPC) companies, surged 15% in Thursday\u2019s intraday trade to hit an all-time high of \u20b9 60.35 apiece. If the gains hold through the close, it would mark the stock\u2019s biggest single-day jump since April.\n\nThe rally also lifted the stock\u2019s monthly gains to 12.7% so far, marking a sharp reversal after months of heightened volatility.\n\nAlthough there was no immediate fundamental trigger for the rally, a sharp spike in trading volumes helped the stock recover from its recent weakness. Around 48 million shares had changed hands across the BSE and NSE as of noon, nearly 26 times the stock\u2019s weekly average trading volume, according to Trendlyne data.\n\nThe shares have remained on investors\u2019 radar following the September-quarter results and a series of order wins. Earlier this month, the company secured a new order worth approximately \u20b9 495.86 crore, excluding GST, from Signature Global (India) Ltd.\n\nThe contract involves civil structural and partial mechanical, electrical and plumbing (MEP) works for four towers and basements at a residential project with ancillary commercial facilities in Gurugram, Haryana. This marks the company\u2019s second order win in the city during the current quarter, reflecting continued business momentum in the region.\n\nThe company continues to expand its presence across key markets through the execution of residential, commercial and infrastructure projects.\n\nDuring the September quarter, B L Kashyap secured new orders worth \u20b9 696 crore, taking its total order wins in FY27 so far to \u20b9 1,150 crore, according to the company\u2019s earnings presentation.\n\nThe company reported its highest quarterly revenue in the last decade, with consolidated revenue rising 40.3% year-on-year to \u20b9 498.15 crore in Q2FY27, compared with \u20b9 355.13 crore in the corresponding quarter last year.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Takaichi gets chilly reception in China on first Japan leader visit since 2019", "full_content": "Japanese Prime Minister Sanae Takaichi received a subdued welcome on her first trip to China as premier, signaling Beijing's limited appetite for repairing ties strained by a simmering row over Taiwan.\n\nAt gatherings such as this week's Asia-Pacific Economic Cooperation summit in Shenzhen, protocol details \u2014 including who greets a visiting leader at the airport and where they are positioned in official photographs \u2014 often convey political messages.\n\nTakaichi was met on the tarmac Wednesday by a retired Chinese diplomat, rather than a serving official, and Japan's ambassador to China, Kenji Kanasugi.\n\nThe low-key reception contrasted sharply with the warmer welcomes given to other visiting leaders, including South Korean President Lee Jae Myung, while U.S. President Donald Trump was greeted personally by Chinese President Xi Jinping.\n\nIn the leaders' group photo, Takaichi was placed in the back row, off to the side and several places from Xi, who stood alongside Trump and Russian President Vladimir Putin.\n\n\"Beijing sought to downgrade her official status to that of a head of government rather than a head of state,\" said Jeremy Chan, senior analyst at Eurasia Group.\n\nDuring Thursday morning's greeting line, Takaichi spent several minutes trying to talk to the Chinese leader without an interpreter present, while most leaders exchanged handshakes and kept walking.\n\n\"It has become increasingly difficult for her to engage in formal or even informal conversations with Xi,\" said Kei Koga, an associate professor at Nanyang Technological University in Singapore, who sees Takaichi's intention as to still \"project the image that she could still communicate with him despite the ongoing tensions.\"", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Kerala\u2019s Senior Citizens Bill: how retirees can protect their money, property, and bank accounts", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe Kerala Legislative Assembly unanimously passed the Keralam Senior Citizens (Care and Protection of Rights) Bill, 2026, on 26 October. The comprehensive state-level legislation seeks to strengthen protections for older people. For retirees, it is useful to understand how its provisions differ from the benefits and safeguards already available to senior citizens across India.\n\nWhile pan-India rules like the Maintenance and Welfare of Parents and Senior Citizens (MWPSC) Act, 2007, which focuses on forcing negligent children to pay monthly maintenance or return gifted property, Kerala\u2019s Bill is more preventive in nature, against financial exploitation, care-home pressure, and cyber fraud. While the bill strengthens legal protection for senior citizens living in Kerala, there are only a few impactful or first-of-its-kind changes that senior citizens can benefit from.\n\nAcross India, elderly citizens already have two major financial remedies under the 2007 Central Act.\n\nThe first is monthly maintenance. Destitute seniors can approach a Maintenance Tribunal to claim support from their children or relatives, capped at \u20b9 10,000 per month under Section 9(2).\n\nThe second is protection against conditional property transfers. Under Section 23, if an elder gifts property to children on the condition that they will provide care and the recipients fail to do so, tribunals can cancel the gift deed and restore possession. This pan-India protection has also been reinforced by Supreme Court rulings.\n\nKerala\u2019s Bill preserves these measures while adding safeguards against abuse in care homes and digital banking fraud.\n\nWhile the pan-India law focuses largely on maintenance and property disputes within families, Kerala\u2019s Bill defines economic abuse and financial exploitation as cognizable offences involving a wider set of stakeholders, including care-home heads, staff and private caregivers.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "APEC final day in photos: Trump, Xi and Putin shake hands; Takaichi kept at a distance", "full_content": "World leaders including the U.S. President Donald Trump and Russia's Vladimir Putin gathered Thursday for the second day of the Asia-Pacific Economic Cooperation summit, ahead of a historic trilateral meeting between the U.S., Russia and China later in the day.\n\nInternational Monetary Fund Managing Director Kristalina Georgieva kicked off Thursday's agenda after China's President Xi Jinping's welcome note. Georgieva said that artificial intelligence and energy supply shocks had accelerated global inflation in many economies, calling for monetary policy tightening.\n\nJapanese Prime Minister Sanae Takaichi was met with another cold reception . She spent several minutes trying to talk to Xi who did not appear to respond with no interpreter present.\n\nTrump held separate bilateral meetings with Putin and Xi earlier in the day. The president praised Xi's leadership and said Washington was negotiating deals with several major APEC economies.\n\nIn their first in-person talks in over a year, Trump told Putin that \"We've known each other for a long time, and I think a lot of wonderful things can come out of this \u2014 or at least start,\" referring to Putin as a \"friend.\"\n\nThe three leaders are due to hold their first-ever trilateral meeting later Thursday, with the Middle East conflict, Russia's war in Ukraine, trade and artificial intelligence likely on the agenda. Expectations for the historic three-way meeting to yield any concrete outcome remain low.\n\nThe summit will conclude Trump's whirlwind Asia trip, after which the American president will return to Washington, D.C.\n\nHere are the highlights in photos from the second and final day of the APEC summit:", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Godzilla Minus Zero Advance Booking Crosses Rs 1 Crore In India Ahead Of Release", "full_content": "'Godzilla Minus Zero, a Japanese action-adventure thriller directed by Takashi Yamazaki, has crossed Rs 1.21 crore in advance bookings ahead of its November 20 release.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "PM Modi's Big Message At FICCI's Event: Don't Take Indians For Granted As Assured Market', Countrymen Deserve Top Quality'", "full_content": "Prime Minister Modi urged Indian businesses to improve product quality for domestic consumers and leverage free trade agreements.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "India's Role In GTA 6: How 1,600 Developers Contributed To The Blockbuster Game", "full_content": "The development also highlights Bengaluru's evolution from an IT services hub into an important contributor to the global video game industry.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "The Liver Doc Takes Dig At Deepinder Goyal As Temple Batch 01 Sold Out': No Science Yet, But Orders Are Closed'", "full_content": "Temple's official website announced that Batch 01 of its wearable device, described as the world's first precision fitness tracker with Roomdeaf AI, had sold out.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "PM Modi Joins GTA Trend, Shares How India Upgraded Between GTA V And VI | See Pics", "full_content": "Rockstar Games' Grand Theft Auto VI is scheduled to launch on 19 November 2026 for PlayStation 5 and Xbox Series X|S.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bond Market Stress To Climate Extremes: Harsh Goenka Shares 10 Trends To Watch In 2027", "full_content": "Goenka says the battle to succeed Donald Trump begins in 2027. Trump is in his second and final term, which ends in January 2029.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:40 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "LTCG vs STT: How are investors taxed on stocks, equity mutual funds and gold ETFs? Applicability and tax rules explained", "full_content": "As the Union Budget 2027 approaches, discussions around a possible reduction or removal of Long-Term Capital Gains ( LTCG ) tax and Securities Transaction Tax (STT) have gained momentum among market participants and policymakers. However, these two levies work differently and have different implications for investors.\n\nLTCG is a tax on the profit earned when an investor sells an investment after holding it for a specified period. On the other hand, STT is a tax charged on eligible buy and sell transactions on recognised stock exchanges, regardless of whether the investor makes a profit or loss.\n\nHere is how the two taxes apply to equities, mutual funds , and gold ETFs.\n\nThe tax treatment of long-term capital gains depends on the investment category and the period for which it is held.\n\nFor instance, if an investor earns \u20b9 2 lakh in LTCG from listed shares and equity mutual funds combined, \u20b9 75,000 will be taxable at 12.5%. The basic tax liability will be \u20b9 9,375, excluding cess and applicable surcharge.\n\nHowever, if the investor earns \u20b9 2 lakh in LTCG from a Gold ETF, the entire gain is taxable at 12.5%, resulting in a tax liability of \u20b9 25,000.\n\nUnlike LTCG, STT is charged on eligible transactions rather than the profits earned. According to the NSE, the applicable STT rates effective 1 April 2026 are:\n\nHowever, gold ETFs, silver ETFs, liquid ETFs, gilt ETFs, and certain international ETFs are exempt from STT.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 02:20 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO Listing: How Indian investors can buy ANT shares and what it will really cost", "full_content": "Claude-maker Anthropic is all set to make its debut on Nasdaq on 19 November. The much-talked-about public offering has priced its shares at $83 apiece, which is above the initial indicative range of $70-78. Indian investors couldn't subscribe to the IPO because the company didn't include India in its international retail offering. Anthropic restricted its international retail offering to Australia, Canada, Japan, Switzerland, the UK and specified European countries. However, this doesn't mean Indian investors are prohibited from buying Anthropic shares. Eligible investors can invest in Anthropic (ANT), but only after it is listed on Nasdaq.\n\nIf you are looking to invest in Anthropic stock, here's what you need to know:\n\nIndian residents can buy Anthropic shares after its listing, as well as other US-listed shares, through international brokerage platforms that facilitate overseas investments under RBI's Liberalised Remittance Scheme ( LRS ). Platforms such as Interactive Brokers, Vested Finance and INDmoney offer access to international markets. Investors must first open an account, complete the required KYC formalities and remit money from their Indian bank account to the overseas brokerage account. Once the funds are credited, they can place buy or sell orders in US dollars.\n\nThe RBI's LRS allows Indian residents to invest in foreign-listed shares, including US stocks. Once Anthropic lists on a US stock exchange, Indian retail investors could buy its shares through an overseas brokerage platform, subject to the LRS, the Foreign Exchange Management Act (FEMA), and applicable tax rules.\n\nThere's a limit of $ 250,000 per financial year per resident.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 02:17 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Subsea 7 shares jump over 5% as Q3 results lift 2026 revenue outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:08 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Arbitrage funds don't always win over liquid funds for short-term savings", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFor years, liquid funds were the go-to option for investors looking to park surplus cash for a few months or build an emergency fund. This changed in 2023, when debt fund gains became taxable at the investor's income tax slab rate, regardless of the holding period.\n\nArbitrage funds, which qualify for equity taxation, emerged as an attractive alternative, particularly for investors in higher tax brackets. They have historically delivered slightly better returns than liquid funds and a favourable tax treatment widens the gap on a post-tax basis.\n\nBut their slightly higher returns have come under stress after the securities transaction tax ( STT ) on futures was increased in April. Higher transaction costs have eaten into returns, narrowing the performance gap between arbitrage and liquid funds.\n\nAccording to Value Research data, both categories delivered average returns of 3.24% over the past six months, wiping out the arbitrage funds\u2019 lead.\n\nHowever, Dhirendra Kumar, CEO of Value Research, points out that STT is not the only reason for the narrowing gap.\n\n\u201cSpreads also move with interest rates and flows. But STT is a permanent cost,\u201d Kumar said.\n\nSpread refers to the price difference between a stock in the cash market and its futures contract. Higher interest rates and institutional buying can widen spreads, improving arbitrage returns. Foreign institutional investors have been net sellers for much of this year, while rate hikes began only this quarter. These factors may have kept spreads under pressure, weighing on returns.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 02:07 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "McBride shares tumble 25% on profit warning and margin delays", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:04 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Solus Alternative Asset Management sells $96,304 of Bristow Group stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 02:01 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "ADP stock surges after winning regulatory approval for contract", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Nov 2026, 01:59 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "RBI eases export reporting for freelancers. Here\u2019s what still applies", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFor India\u2019s freelancers and new-age businesses, overseas clients offer an opportunity to take Indian expertise to a wider market. Whether it is a tutor teaching students abroad, a content creator earning from international platforms or a consultant advising foreign clients, a clear compliance framework can help these opportunities grow with greater confidence.\n\nThe new RBI trade framework, effective from 1 October 2026, prompted questions about service-export reporting through the Export Declaration Form (EDF) for freelancers and new-age businesses. To address them, the RBI Governor and Deputy Governor provided oral clarifications on 7 October during a press conference, followed by a formal notification on 2 November, effective retrospectively from 1 October 2026. The Foreign Exchange Dealers\u2019 Association of India (FEDAI) has also issued implementation clarifications for authorized dealer banks.\n\nTogether, these developments streamline reporting while preserving the safeguards governing cross-border receipts. It is important to understand both the relief available and the responsibilities that remain.\n\nThe RBI deputy governor\u2019s reference to relief for individuals performing \u2018contracts of a personal nature\u2019 during the press conference initially left room for interpretation, since similar language has a narrower legal meaning.\n\nSection 2(zb) of FEMA excludes \u201ccontracts of personal service\u201d from the definition of services.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:59 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Coal India vs NMDC vs MOIL: Which mining PSU stock deserves a place in your portfolio for long-term gains? Check target", "full_content": "MOIL NMDC Sharmila Bhadoria Published 19 Nov 2026, 01:58 PM IST Prefer Livemint on Google MOIL vs NMDC vs Coal India : Mining capacity enhancement, improved metal demand, and higher sales volume are likely to benefit government-backed mining companies like NMDC, Coal India, and MOIL Limited.\n\nShares of MOIL and NMDC were trading marginally under pressure during Thursday\u2019s intraday trading session, whereas Coal India, managed to hold on to gains.\n\nOne of India's largest iron ore producers, NMDC will benefit from growth potential through mining capacity enhancement and better infrastructure, stated Systematix Institutional Equities.\n\n\u201cNMDC remains one of our preferred picks, supported by growth potential through mining capacity enhancement and better infrastructure. However, lower sales volumes and higher operating costs affected its quarterly performance,\u201d read the Systematix Institutional Equities report.\n\nMOIL offers a recovery opportunity, supported by improving manganese demand and production, noted the brokerage while highlighting that lower realisations and inability to meet guidance remain key concerns.\n\nCoal India earnings \u201care expected to improve with higher sales volumes. However, lower e-auction premiums and higher operating costs could limit profit growth,\u201d read the brokerage report.\n\nSystematix gave a \u2018Buy\u2019 rating to MOIL and NMDC, and maintained \u2018Hold\u2019 for Coal India. Among the three companies, MOIL has the highest upside potential, as per the brokerage report, dated November 17.\n\nCoal India share price was trading 0.83% higher at \u20b9 391.90 per share on BSE with an Mcap of \u20b9 2,41,517.32 crore at 1:40 pm on Thursday. Its share price value has declined 4.88% over the last one month, and 14% in last six months.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:58 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This closely-watched guru just sold everything", "full_content": "Panmure Liberum strategist and widely-followed stock-market commentator Joachim Klement has effectively had his personal retirement portfolio 100% invested in stocks for many years.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 01:55 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "India-US Trade Deal By December? CEA Nageswaran Says Worst Of Tariff Tensions May Be Over", "full_content": "CEA Nageswaran identified geopolitical divisions, shipping disruptions, China's manufacturing strength, climate change, energy security, and AI-led job risks as key challenges for India's Viksit Bharat 2047 ambition.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:51 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "How this hedge fund is betting on people\u2019s fears of getting old", "full_content": "Hedge fund manager Kernow sees U.K.-listed Beauty Tech Group nearly tripling in value.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:50 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "MRF faces a long road to margin recovery as costs stay high", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMRF Ltd is on a bumpy road as cost inflation hits the tyre sector, which uses crude-linked derivatives and natural rubber as key inputs. MRF\u2019s standalone gross margin dipped 470 basis points (bps) year-on-year to 31.7% in the September quarter (Q2FY27). Ebitda margin shrank 430 bps year-on-year to 10.7%. The company anticipates continued disruptions and volatility in commodity markets, which would keep raw material and logistics costs elevated.\n\nProfitability prospects for the tyre industry are heavily linked to benefits from commodity costs rather than long-term structural gains. Historically, tyre companies have been able to pass on the entire increase in raw material prices over a few quarters through steady price increases, notes Centrum Broking. While this is comforting to some extent, it points to a gradual margin recovery, as the impact of price increases comes with a lag. Motilal Oswal Financial Services has trimmed MRF\u2019s FY27 earnings estimate by 17% and now expects earnings to remain flat over FY26-28.\n\nThe MRF stock is down 15% so far in 2026 and trades at 20 times estimated FY28 earnings, Bloomberg data showed. \u201cWhile its return on capital employed has improved to 11.8% from a recent dip to 10% in FY25, it is likely to dip to 7% by FY27 given the sustained margin pressure before recovering in FY28,\u201d adds Motilal.\n\nWhile MRF isn\u2019t alone in facing inflationary pressure, its relatively lower revenue growth is discouraging. In Q2FY27, revenue grew around 18% year-on-year, aided by sustained demand from both the OEM and replacement segments. Competitors fared better: Apollo Tyres \u2019 revenue grew 26%, Ceat\u2019s 23% and JK Tyre\u2019s 27%.\n\nApollo took cumulative price hikes of 13-15% across categories during August-October. JK Tyre has implemented hikes of 11-12% so far in FY27 and plans another 4-5% increase in Q3.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:49 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Noida consumer forum pulls up builder for failing to provide home loan documents, orders flat handover within 30 days", "full_content": "A couple in Noida paid \u20b9 7.5 lakh to book a flat priced at \u20b9 77.35 lakh and have recently secured relief from a consumer forum after their builder cancelled the allotment over alleged non-payment, as reported by The Times of India.\n\nThe relief was provided after the district consumer disputes redressal commission instructed the builder to hand over possession, holding that its failure to provide the essential documents required for disbursing the home loan clearly amounted to a deficiency in service .\n\nManoj Kumar Bhirgu and his wife, Niranjana Sharma, residents of Sector 74, Noida, had booked a 1,595 sq ft apartment in a project developed by JSS Buildcon Pvt Ltd.\n\nThe couple made a payment of \u20b9 1 lakh on 7 July 2023, followed by another \u20b9 6.5 lakh on 28 July 2023. Subsequently, a builder-buyer agreement was entered into by both parties.\n\nAs per the details of their complaint, the couple planned to clear the pending amount through a \u20b9 64 lakh home loan from the Central Bank of India\u2019s Shalimar Bagh branch situated in Delhi.\n\nThe loan was eventually processed on 27 September 2023 through a \u2018tripartite agreement\u2019 involving the couple, the banking institution and the builder. Later, on 24 November, the bank informed the builder that the loan had been approved and requested two documents to release the funds in accordance with the terms and conditions.\n\nHowever, the builder failed to meet this requirement despite repeated requests and reminders from the buyers and the bank. Subsequently, the builder cancelled the flat\u2019s allotment, citing non-payment of the outstanding amount. The couple objected to this cancellation and sent a legal notice to the concerned builder dated 30 April 2024, but the builder did not provide a satisfactory response.\n\nAfter all other options were exhausted, the couple approached the district consumer commission on 22 June 2024. The builder and its two directors, Pratosh Kumar Sharma and Ankit Sharma, failed to appear or submit their response.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:44 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ABB India\u2019s margin recovery in spotlight amid record order inflow", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nABB India\u2019s record order inflow in the September quarter underscores strong demand across key segments. Order inflow surged 56% year-on-year (y-o-y) to \u20b9 4,733 crore, its highest-ever quarterly level. For the nine months ended September, order inflow grew 43% to \u20b9 13,376 crore, surpassing the orders secured in the whole of 2025. The company follows a January-December financial year, making the September quarter its third quarter (Q3CY26).\n\nYet, investors have been less enthused, with the stock down about 2% since the Q3CY26 results. The concern is margin pressure. While revenue grew a healthy 19% to \u20b9 3,738 crore, Ebitda rose slower, at nearly 14% to \u20b9 552 crore. Higher commodity costs, rupee depreciation and an adverse revenue mix drove a 141-basis-point (bps) y-o-y decline in gross margin. The figures exclude the contribution of the robotics division, which ABB divested in March.\n\nBetter operating leverage, however, limited the fall in Ebitda margin to 75 bps. Price increases implemented over the past few quarters also helped, lifting Ebitda margin by 220 bps sequentially. Even so, the 9MCY26 margin of 13.5% remains well below the 15.8% recorded in CY25.\n\n\u201cCY24 was the apex point for profitability, with a record Ebitda margin of 18.9%. And, ever since, QCO compliance costs, commodity inflation, higher logistics cost and INR depreciation have pulled the margin down,\u201d said a report by ICICI Securities.\n\nWhile higher scale and calibrated price hikes are partly offsetting these pressures, the brokerage believes a meaningful margin recovery may require external factors to turn favourable. ICICI estimates ABB\u2019s Ebitda margin to reach 16.5% by CY28, with Ebitda growing at a compound annual growth rate of 14% over CY25-28.\n\nDemand outlook, meanwhile, remains robust. ABB\u2019s order book expanded 36% y-o-y to \u20b9 12,900 crore.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:44 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Sensex Zooms 500 Points, Nifty Above 25,350; Maruti Suzuki Rallies 6%, M&M 4%", "full_content": "Foreign Institutional Investors (FIIs) were net buyers of Indian equities worth Rs 4,553.87 crore on November 18. Domestic Institutional Investors (DIIs), meanwhile, were net sellers, offloading shares worth Rs 4,454.65 crore.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 01:33 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mutual funds received 53% of Mahanadi Coalfields IPO anchor book: Which schemes will own Coal India subsidiary shares?", "full_content": "Coal India \u2019s wholly owned subsidiary Mahanadi Coalfields IPO opened for public subscription on 19 November and will close on 23 November 2026. The issue gives investors an opportunity to participate in the public offering of one of India\u2019s largest coal-producing companies.\n\nBefore an IPO opens for public subscription, companies complete the anchor investor allocation process. According to the basis of allotment dated 18 November 2026, Mahanadi Coalfields IPO allocated around 16.88 crore equity shares to anchor investors at \u20b9 136 per share.\n\nOf these, 8.95 crore shares, or 53.04% of the total anchor allocation, went to 11 domestic mutual funds through 29 schemes, including three specialised investment funds (SIFs).\n\nHere is a look at the mutual fund schemes that received the largest allocations and what investors should know.\n\nNippon India Small Cap Fund received the highest allocation among the mutual fund schemes, followed by Invesco India Contra Fund and Nippon India Power & Infra Fund.\n\n*Source: Mahanadi Coalfields IPO Anchor Allocation Report; Excludes SIFs; Anchor investor allocation price is \u20b9 136; Issue Price of the IPO is \u20b9 129 to \u20b9 136.\n\nNippon India Small Cap Fund received 2.99 crore shares worth \u20b9 407.41 crore, making it the largest mutual fund scheme allocation in the anchor book. The allocation represents approximately 0.53% of the fund's \u20b9 76,903 crore AUM as of October 2026.\n\nFor instance, if Mahanadi Coalfields shares list at a 10% premium to the anchor allocation price of \u20b9 136, the fund's holding would generate an unrealised gain of around \u20b9 40.74 crore. This would translate into an estimated 0.05% addition to the fund's NAV.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:28 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mutual Funds, SIPs: How long should you stay invested? Expert says data shows the real truth \u2014 Check here", "full_content": "If you want to invest in mutual funds and systematic investment plans (SIPs) or you already are an investor in the space and wonder how long to stay invested to make gains, Motilal Oswal Mutual Fund, through a 21-year study, has suggested an answer.\n\nAccording to data analysed for SIP investments over 5-, 7-and 10-year periods by the Fund \u2014 the Nifty 100, Nifty Midcap 150, Nifty Smallcap 250 and Nifty 500, longer investment horizons in SIPs historically improved minimum returns and helped reduce the likelihood of negative returns.\n\nThe study covered various market cycles, including the 2008-09 financial crisis, the 2013 market downturn and the COVID-19 period.\n\nThe findings highlighted the importance of giving SIP investments time to grow.\n\nIt noted, \u201cmarket movements can influence returns over shorter periods. However, the historical data shows that the share of SIPs recording negative returns reduced as the investment period increased.\u201d\n\nThe study showed that while the pace of improvement differed across indices, the overall trend remained consistent ; and staying invested for longer periods was associated with fewer negative-return instances and better minimum outcomes across all four indices.\n\nDisclaimer: This story is for educational purposes only. The views and recommendations made above are those of individual analysts or broking companies, and not of Mint.", "source": "LiveMint Money", "pub_date_str": "19 Nov 2026, 01:27 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "FCNR-related costs and benefits yet to fully play out for banks: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a FCNR-related costs and benefits yet to fully play out for banks: Report The Economic Times daily newspaper is available online now. Read Today's Paper FCNR-related costs and benefits yet to fully play out for banks: Report SECTIONS FCNR-related costs and benefits yet to fully play out for banks: Report ANI Last Updated: Nov 19, 2026, 01:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign Currency Non-Resident deposits are expected to significantly influence the performance of Indian banks. The benefits and costs associated with these deposits have not fully materialized for financial institutions. Banks exhibiting a strong position in fixed-rate FCNR deposits may manage rising funding costs more effectively. Variations in loan growth and deposit composition among banks could lead to different performance outcomes.\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nKYC and KYB: Pidilite\u2019s business has more tailwinds than headwinds, but a continuous test called raw material prices \u2013 Concluding part\n\nTariffs, supply snags and a war: 6 sectors that pulled it off through all of the trouble\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Nov 2026, 01:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "114 Rafales, 6 submarines! Defence stocks HAL, BEL, BDL shares jump up to 3% - Is a mega defence order boom coming?", "full_content": "BEL BDL Pranati Deva Published 19 Nov 2026, 01:23 PM IST Prefer Livemint on Google Defence stocks, including Hindustan Aeronautics Ltd (HAL), Bharat Electronics Ltd (BEL) and Bharat Dynamics Ltd (BDL), attracted buying inte
