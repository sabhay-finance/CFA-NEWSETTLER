 are among those rare stocks that have delivered a whopping return to their shareholders despite sell-off stress in the key benchmark indices Nifty 50, Sensex and Bank Nifty. This Gautam Adani-owned stock has risen 16% over the past six months and around 23%YTD. Global investment bank Jefferies sees more upside in the Adani Green Energy share price. The latest Jefferies India report has predicted 35% upside, with an Adani Green Energy share price target of \u20b9 1,695. Adani Green Energy's share price today is oscillating around \u20b9 1,260.\n\nOn why Jefferies is bullish on this Gautam Adani-owned stock, the global investment bank said, \u201cAdani Green\u2019s (AGEL) stock price has corrected 22% from its peak and now trades at 20x 1Y forward EBITDA, which appears attractive given its 30% FY26-30E EBITDA CAGR. We see industry-level triggers for strong power demand and improved utilisation driven by higher temperatures. These should largely offset potential higher interest costs from RBI rate hikes and ease investor concerns.\u201d\n\nThe global investment bank believes recent news reports suggest that El Ni\u00f1o could persist into CY27, implying the CY26 peak deficit could recur. Coal stocks are at critical levels of less than 7 days. State Electricity Boards (SEBs) are already discussing locking in 2027 power as shortages could reappear with rising temperatures. AGEL is swiftly ramping up its Battery Energy Storage Solutions (BESS) segment. It has an installed BESS capacity of 6.6 GWh with plans of 10 GWh+ end FY27E. This is likely to accelerate given the strong demand for power. Also, our 6.5-6.8 GW FY28E-30E annual generation capacity addition could see upside.\n\nJefferies India report said that Aani Green Energy\u2019s net debt-to-EBITDA should decline to 7.1x by FY30E vs 8.9x in FY26, on our capacity assumption of 44 GW.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 12:32 PM IST", "pub_date_relative": "29m ago"}, {"title": "Selling old gold jewellery? 7 factors that determine its resale value", "full_content": "Gold has given amazing returns over the last few years. For example, the price of 24-karat yellow metal per 10 grams has risen by 46.98% since the beginning of 2026, as per data compiled by Bankbazaar . This rise in gold prices makes selling old jewellery lucrative.\n\nThe amount an individual will receive depends on several factors in addition to the prevailing market rate. Factors such as purity, net gold weight, making charges and deductions can all impact the final value.\n\nIf planning to sell old gold jewellery, checking the prevailing gold rate is a starting point. However, the final amount offered by a jeweller may vary depending on the jewellery\u2019s purity, its actual gold content, make and terms of the transaction.\n\nNote: The factors discussed above are not exhaustive. Several other aspects might be considered on a case-by-case basis.\n\nLet us consider an. You sell 20 grams of 22K gold jewellery, of which 2 grams comprises stones and other non-gold materials. Then the net gold weight drops down to 18 grams.\n\nIf the applicable buying rate is \u20b9 10,000 per gram (for simplicity), the preliminary value is \u20b9 1,80,000 before any applicable deductions. In this case, the final amount may be lower, depending on the jeweller\u2019s valuation method and transaction terms.\n\nTo ensure you secure the best possible rates for your gold jewellery, compare quotations from different jewellers , cross-check the applicable rate and request a written breakdown of the gold purity, weight, deductions and valuation.\n\nYou can also approach a BIS-recognized assaying and hallmarking centre for gold testing.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 12:30 PM IST", "pub_date_relative": "31m ago"}, {"title": "Banks seek RBI relief, clarity on India's latest rupee-defence measures: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politi  PM IST", "pub_date_relative": "36m ago"}, {"title": "Gold prices fall Rs 1,450/10g; silver down Rs 1,400/kg despite a soft dollar ahead of US economic data. Time to sell?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Gold prices fall Rs 1,450/10g; silver down Rs 1,400/kg despite a soft dollar ahead of US economic data. Time to sell? Optimus Finance Share Price Motor & General Finance Share Price Thacker & Company Share Price BLB Share Price Inventure Growth & Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Gold prices fall Rs 1,450/10g; silver down Rs 1,400/kg despite a soft dollar ahead of US economic data. Time to sell? SECTIONS Gold prices fall Rs 1,450/10g; silver down Rs 1,400/kg despite a soft dollar ahead of US economic data. Time to sell? By Veer Sharma , ETMarkets.com Last Updated: Oct 12, 2026, 12:18:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold and silver prices opened lower on MCX despite a weaker US dollar and falling oil prices, as investors awaited US inflation data for clues on the Federal Reserve\u2019s next policy move. Analysts recommend buying on dips while monitoring key support levels.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 12:18 PM IST", "pub_date_relative": "43m ago"}, {"title": "IPO: Who really owns Jio Platforms? Reliance doesn't own 100%; Meta, Google, 7 others are major shareholders | DRHP data", "full_content": "Reliance Jio IPO major shareholders, shareholdings data: The stage is set for Jio Platforms Ltd (JPL) IPO - touted to be as India's largest-ever initial public offering, expected to be around \u20b9 37,700 crore ($3.8 billion to $4 billion). According to a recent report by Bloomberg, Jio Platforms is set to price its IPO at \u20b9 1,065-1,119 per share, according to people familiar with the matter of the initial public offering preparations.\n\nThe mammoth IPO will comprise up to 27 crore fresh equity shares (representing roughly 2.9% post-issue equity) and is expected to come without an offer-for-sale (OFS) as current investors are not exiting or diluting holdings.\n\nHowever, it is from the house of conglomerate of Billionaire business tycoon Mukesh Dhirubhai Ambani-led Reliance Industries Limited (RIL) but Reliance is not the 100% owner of Jio Platforms. Jio has shareholders like social media giant Meta, IT giant Google and others.\n\n- As on the date of this Draft Red Herring Prospectus, the Company has 105 Shareholders\n\n- Below are details of the Shareholders holding 1.00% or more of the paid-up share capital of the Company (Top 10 shareholders):-\n\n(ii) Jaadhu Holdings, LLC (an affiliate of Meta Platforms, Inc. (formerly known as Facebook, Inc.)) 9.98%\n\n(iv) The Public Investment Fund (a sovereign wealth fund of the Kingdom of Saudi Arabia) 2.31%\n\n(v) Omicron Asia Holdings II Pte. Ltd. (an affiliate of funds, vehicles and/ or entities managed and/ or advised by Kohlberg Kravis Roberts & Co. L.P., an indirect subsidiary of KKR & Co. Inc.) 2.31%", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 12:16 PM IST", "pub_date_relative": "45m ago"}, {"title": "Zee Entertainment shares extend gains for second session, rises 7% today | Check stock performance", "full_content": "Zee Entertainment share price surged as much as 7% in Monday's trading session, extending gains for second consecutive session despite volatility in the Indian stock market.\n\nZee Entertainment shares opened at \u20b9 70.20 per share today, as compared to previous close of \u20b9 69.97 on Friday last week and touched an intraday high of \u20b9 74.90 on 12 October.\n\nThe rally in the stock came in after the share price witnessed spurt in trading volume. According to data available on NSE, around 169.84 lakhs shares changed hands during the intraday session on Monday.\n\nMeanwhile, Indian benchmark indices pared their early gains and traded lower on Monday as investors assessed the impact of central bank measures aimed at supporting the rupee. A decline in oil prices, however, helped ease some concerns. The Nifty 50 was down 0.13% at 22,493.25, while the BSE Sensex slipped 0.26% to 72,277.23. Both indices had opened the session with gains of around 0.5%.\n\nIn an exchange filing on 6 October, the company said it received a notice from the Ministry of Corporate Affairs (MCA) on October 5, seeking certain information as part of an ongoing inspection under the Companies Act, 2013.\n\nThe company has already submitted the required information and will provide any further details or explanations sought by the ministry.\n\n\u201cWe wish to inform you that the Company has received a notice from the Ministry of Corporate Affairs (MCA) on October 5, 2026 under Section 210(1)(a) & (c) of the Companies Act, 2013 seeking certain information about the Company, in continuation to the ongoing inspection under Section 206(5) of the Companies Act, 2013,\u201d the firm said in the filing.\n\nLast month, the National Company Law Tribunal (NCLT) approved a repayment plan proposed by Essel Group founder Subhash Chandra, under which creditors were set to recover around \u20b9 6.5 crore against admitted claims of \u20b9 22,006.57 crore. This translates into a steep 99.97% haircut on the admitted claims.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 12:06 PM IST", "pub_date_relative": "55m ago"}, {"title": "TCS shares after 6% rally in 2 sessions after Q2 results. What are technical\u2019s indicating for the IT major?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a TCS shares after 6% rally in 2 sessions after Q2 results. What are technical\u2019s indicating for the IT major? Tata Consultancy Services Share Price Infosys Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TCS shares after 6% rally in 2 sessions after Q2 results. What are technical\u2019s indicating for the IT major? SECTIONS TCS shares after 6% rally in 2 sessions after Q2 results. What are technical\u2019s indicating for the IT major? By Veer Sharma , ETMarkets.com Last Updated: Oct 12, 2026, 12:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis TCS reported a 15% year-on-year rise in consolidated net profit to Rs 13,884 crore and declared an interim dividend of Rs 12 per share.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Pri ial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 11:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "8th pay commission: Assam pay commission to revise employees' salaries, submit report, says CM \u2014 What we know", "full_content": "Giving an update on the state's 8th pay commission, Assam Chief Minister Himanta Biswa Sarma said that the new panel has begun its work, adding that salaries of state government employees would be revised after the committee submits its report, PTI reported.\n\n\u201cThe new Pay Commission has begun its work, and employees' salaries would be revised after it submits its report,\u201d the chief minister said while speaking at a state government programme in Guwahati on Sunday, 11 October.\n\nNotably, Assam in January, became the first among state and Union Territories (UTs) to set up its 8th state CPC, after the Centre commissioned and set up its panel last year, Sarma said in a post on social media platform X (formerly known as Twitter).\n\nHe also named Assam\u2019s former Additional Chief Secretary Subhas Das as Chairman of the commission.\n\nNotably, the state panel is expected to submit recommendations within 18 months and is expected to decide on allowances, service conditions, pay and pension, as per a report by the Financial Express. It said revised pay scales could be implemented in 2027 or 2028, with arrears likely to be paid from 1 January 2026. However, no announcement is expected before the Centre's commission has made suggestions.\n\nJocelyn Fernandes is a journalist and editor with nearly 13 years of experience covering the business, corporate, economy and markets beats in news.<br> As chief content producer for around three years at Livemint (Hindustan Times), Jocelyn publishes breaking stories, explainers, features and live blogs on a range of business and economy topics, including the Budget, corporate developments, stock markets, income tax, money and personal finance, cryptocurrency, government policy, impact of US tariffs, international developments and more.<br> Jocelyn's writing philosophy is focused on delivering news in an accurate and accessible format for readers.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 11:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Aeroflex Industries shares rally 13% ahead of key board meeting on expansion plans", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Aeroflex Industries shares rally 13% ahead of key board meeting on expansion plans Aeroflex Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Aeroflex Industries shares rally 13% ahead of key board meeting on expansion plans SECTIONS Aeroflex Industries shares rally 13% ahead of key board meeting on expansion plans By Sakshi Kumari , ETMarkets.com Last Updated: Oct 12, 2026, 12:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Aeroflex Industries shares surged nearly 13% as investors awaited the October 14 board meeting to discuss expansion plans and capacity enhancements. The stock has gained over 200% in 2026, with the company\u2019s market capitalisation at around Rs 7,715 crore.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 11:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Suzlon Energy shares jump 5% after Motilal Oswal reiterates bullish view, sees 73% upside; Technicals signal caution", "full_content": "Suzlon Energy share price jumped nearly 5% on Monday, 12 October, after Motilal Oswal Financial Services reiterated its \u2018Buy\u2019 rating on the stock, with a target price of \u20b9 65, implying an upside potential of around 73% from its current market price of \u20b9 38. The brokerage expects earnings momentum to strengthen in the second half of FY27, supported by a strong order book, higher deliveries and rising wind power installations in India.\n\nIn its latest report, Motilal Oswal said Suzlon Energy's stock has corrected 31% over the past three months and is currently trading at 17.5 times its estimated FY28 earnings. This represents a 20% discount to its one-year forward price-to-earnings average of 22 times at minus one standard deviation, making the valuation attractive, according to the brokerage.\n\nMotilal Oswal has retained its \u2018Buy\u2019 rating on Suzlon Energy with a target price of \u20b9 65, based on 30 times its estimated FY28 earnings per share (EPS). The valuation multiple is slightly above the company's historical average two-year forward price-to-earnings ratio of 27 times.\n\nThe brokerage expects Suzlon's earnings to improve in the second half of FY27, as the wind energy business typically generates 60\u201365% of its annual EBITDA during the second half. It estimates deliveries will rise to 2.1 GW in the second half, up from 1.2 GW in the first half.\n\nFor FY27, Motilal Oswal projects total deliveries of 3.3 GW, representing 35% year-on-year growth, followed by 3.8 GW in FY28. The brokerage expects EBITDA to grow at a compound annual growth rate (CAGR) of 22% between FY26 and FY28, supported by improving execution and delivery visibility.\n\nSuzlon Energy's order book stood at 5.9 GW at the end of the first quarter of FY27, with the company securing around 1.3 GW of order inflows in FY27 so far, according to Motilal Oswal.\n\nThe brokerage believes the existing order book provides complete visibility for its estimated deliveries through the third quarter of FY28.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "Inflation could hit 7%, forcing RBI to hike rates by 150 bps further: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Inflation could hit 7%, forcing RBI to hike rates by 150 bps further: Report The Economic Times daily newspaper is available online now. Read Today's Paper Inflation could hit 7%, forcing RBI to hike rates by 150 bps further: Report SECTIONS Inflation could hit 7%, forcing RBI to hike rates by 150 bps further: Report By ANI Last Updated: Oct 12, 2026, 11:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's inflation is projected to reach 6-7% due to increasing price pressures and consumer expectations. The Reserve Bank of India has acknowledged risks stemming from rising input costs and resilient domestic demand. Recent trends show that household inflation expectations are significantly higher than headline inflation rates. The RBI has raised its GDP growth projection while revising inflation forecasts upwards to 6% for the upcoming quarter.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Oct 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "Swan Defence shares rise 4% to hit 52-week high on Rs 1,897 crore tanker order prospect", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Swan Defence shares rise 4% to hit 52-week high on Rs 1,897 crore tanker order prospect The Economic Times daily newspaper is available online now. Read Today's Paper Swan Defence shares rise 4% to hit 52-week high on Rs 1,897 crore tanker order prospect SECTIONS Swan Defence shares rise 4% to hit 52-week high on Rs 1,897 crore tanker order prospect By Sakshi Kumari , ETMarkets.com Last Updated: Oct 12, 2026, 12:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Swan Defence and Heavy Industries shares rose after the company emerged as the lowest bidder for a Rs 1,897 crore order to build four medium-range product tankers. The proposed contract could strengthen its order book amid India's push to revive domestic shipbuilding.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "AI may change the price of your Big Mac and groceries \u2014 what this means for shoppers", "full_content": "Fast-food giants and supermarkets are rolling out a range of AI tools that could affect the prices shoppers pay, but experts warn the spread of data-driven tools could make personalized pricing easier to deploy.\n\nJust this week, a federal antitrust lawsuit filed against McDonald's alleged the fast food giant uses an AI-powered \"pricing engine\" to set menu prices across U.S. locations and overcharge customers for Big Macs and fries.\n\nMcDonald's has denied that it's using AI to determine what individual customers are willing to pay and said it provides its franchisees with \"tools, resources, research and recommendations to help them make informed decisions.\"\n\nEven so, food businesses globally are increasingly digitizing operations with AI. Earlier this year, American grocery chain Kroger said it's using an AI platform called FlashFood to mark down perishables nearing the end of their shelf life and marketing them to shoppers via an app.\n\nMeanwhile, electronic shelf labels (ESLs), which display prices on digital screens, are becoming increasingly popular at supermarkets like Kroger, Walmart , and Amazon Fresh.\n\nWhole Foods Market spokesperson Rachel Malish said the supermarket chain \"does not use dynamic pricing\" in a statement to CNBC. Malish said that digital shelf labels \"simplify the price tag change process for our employees [and] reduce paper waste from traditional tags.\"\n\nThe technology is also gaining traction among U.K. supermarkets such as Tesco , Morrisons, and Asda.\n\nMorrisons declined to comment to CNBC on its ESLs . The British Retail Consortium's director of food & sustainability, Andrew Opie, has said that supermarkets have \"no intention to use dynamic or surge pricing in their stores,\" and that digital pricing is instead a way of updating and checking prices quickly.", "source": "CNBC World Economy", "pub_date_str": "12 Oct 2026, 11:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why is market falling today? Sensex sinks 1,000 pts from day\u2019s high, Nifty below 22,400. 5 key triggers behind selloff", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Why is market falling today? Sensex sinks 1,000 pts from day\u2019s high, Nifty below 22,400. 5 key triggers behind selloff The Economic Times daily newspaper is available online now. Read Today's Paper Why is market falling today? Sensex sinks 1,000 pts from day\u2019s high, Nifty below 22,400. 5 key triggers behind selloff SECTIONS Why is market falling today? Sensex sinks 1,000 pts from day\u2019s high, Nifty below 22,400. 5 key triggers behind selloff By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 12, 2026, 12:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian stock market saw a downturn as both Sensex and Nifty lost previously gained ground. Market confidence was shaken by ongoing FII selling and increasing bond yields. Tech Mahindra experienced the most significant drop, with shares down nearly 4%. Conversely, the broader market segments like Nifty Midcap 100 and Nifty Smallcap 100 performed well, showcasing resilience amidst the decline in major companies.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oil falls after Trump declares 'energy ceasefire' between Russia and Ukraine", "full_content": "Oil prices fell Monday on optimism about improved supplies after President Donald Trump said that Russia and Ukraine will not be targeting each other's energy facilities, while Iran reached out to Saudi Arabia after Houthi attacks against the kingdom.\n\nFutures for international benchmark Brent crude for December delivery dropped 0.77% to $103.91 a barrel. U.S. West Texas Intermediate futures for November declined 1.26% to $90.69 per barrel.\n\n\"Effective immediately, there is an ENERGY CEASEFIRE in the War between Russia and Ukraine. Both parties have agreed. Do not break it!\" Trump said in a social media statement Sunday stateside.\n\nUkrainian President Volodymyr Zelenskyy said in a social media post that \"Ukraine supports the ceasefire, and it is important that Russia support it as well.\"\n\nProspects of more Russian energy hitting markets after a deal with the U.S. have also risen after Trump said Friday that Moscow will supply more than 4 million tons of diesel to the global market under a deal he struck with Putin during a phone call.\n\nBrent According to the Saudi state news agency , Iran's Minister of Foreign Affairs Abbas Araghchi made a phone call to Saudi Arabia's Minister of Foreign Affairs Faisal bin Farhan bin Abdullah, to discuss about the region's recent escalation of events as well as the efforts to address it.\n\nAl Jazeera reported Araghchi had said Iran was ready to provide assistance to help with the start of dialogue between Saudi Arabia and Yemen's Houthis.\n\nwti Oil prices are expected to remain volatile in the near term as the U.S.-Iran conflict continues, while the impact of Hurricane Isaias on U.S. energy producers could also hurt supplies .", "source": "CNBC Top News", "pub_date_str": "12 Oct 2026, 11:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "Lenskart Solutions share price tumbles 5% today despite 47% returns in 2026 | What should investors do?", "full_content": "Lenskart block deal: Lenskart Solutions share price crashed over 5% in Monday's trading session amid reports of likely block deal by Alpha Wave Ventures. Lenskart share price opened at \u20b9 650 per share on NSE today, as compared to previous close of \u20b9 677.85 on Friday last week an touched an intraday low of \u20b9 643.75 on 12 October.\n\nAccording to CNBC TV18 report, as many as 2.93 crore shares of Lenskart Solutions , representing 1.67% of the company\u2019s equity, were traded through block deals on Monday, October 12. The transaction was valued at \u20b9 1,895 crore, with the shares changing hands at \u20b9 647 apiece. The identities of the buyers and sellers have not yet been disclosed.\n\nThe report further revealed that Alpha Wave Ventures LP was likely to sell up to a 1.6% stake in Lenskart for as much as \u20b9 1,691 crore. The proposed sale was pegged at a floor price of \u20b9 640 per share, representing a 5.2% discount to the stock\u2019s closing price on Friday.\n\nThe base offer size covered a 0.9% stake worth \u20b9 966 crore, with an option to increase the sale by another 0.7% stake valued at \u20b9 725 crore, the sources said. The sellers would be subject to a 30-day lock-in period before undertaking any further stake sale.\n\nAccording to stock exchange data, promoter entities held a 17.53% stake in Lenskart at the end of the June quarter, while public shareholders owned 82.05%. Alpha Wave Ventures LP held a 3.42% stake in the company at the time and had already sold a portion of its holding in August.\n\nOn August 28, Alpha Wave Ventures sold 2.95 crore Lenskart shares, equivalent to around 1.7% of the company\u2019s equity, for \u20b9 1,857 crore through a block deal at an average price of \u20b9 630 per share. It was the second block deal involving the company that month.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "IFCI share price jumps 14% in 3 sessions - Can the stock rise further? Tech experts decode?", "full_content": "IFCI share price has been on a healthy uptrend lately, jumping almost 14% in just three consecutive sessions. On Monday, 12 October, IFCI shares jumped 8% in morning trade on the BSE to hit an intraday high of \u20b9 72.78. At this price, the stock has jumped 13.7% in just three straight sessions.\n\nThe stock has jumped nearly 35% year-to-date, compared to a 15% drop in the equity benchmark Sensex. It rose to a 52-week high of \u20b9 107.45 on 4 September this year after falling to a 52-week low of \u20b9 46.20 on 9 December last year.\n\nOn a monthly scale, the stock is up nearly 4% so far in October after an over 23% drop in the previous month.\n\nThe company's total revenue from operations in the financial year 2025-26 (FY26) rose by 7% year-on-year (YoY) to \u20b9 897.71 crore, while profit for the year jumped by 18% YoY to \u20b9 51.71 crore. Net interest margin for the year stood at (-4.94)% compared to (-9.49)% in FY25.\n\nAccording to Aditya Thukral, founder and analyst at AT Research and Risk Managers, IFCI stock has violated the uptrend by breaking the higher low.\n\nThukral underscored that the stock price has formed a fresh resistance zone between \u20b9 74 and \u20b9 80. Moreover, there is a negative crossover among EMAs, indicating a negative short-term trend.\n\n\"Any bounce in the stock prices towards the resistance zone is an exit opportunity. If the stock prices continue to stay above 80 for some days, then only then could the trend change; however, the chances for that to happen remain thin,\" said Thukral.\n\n\"The stock started its short-term downtrend, and every rise towards the resistance area is an exit opportunity for buyers. Only a sustained move above the EMAs could change the trend for the stock,\" said Thukral.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "RIL shares: Reliance Industries stock slides 6% in a month, can Jio Platforms IPO aid the bounce back? Experts' views", "full_content": "RIL share price | Stocks to buy today | Jio Platforms IPO: Shares of Reliance Industries Ltd (RIL) have been under selling pressure ahead of the Jio Platform IPO launch. While it is throwing tantrums at the existing Reliance Industries shareholders, market experts are looking at this dip as an opportunity for the primary market investors to buy Reliance shares at a lower price, which is close to the Jio Platforms IPO price band of \u20b9 1,065 to \u20b9 1,119 apiece, and become eligible for the possible benefit of the value unlocking. However, it is not guaranteed that Jio Platforms shares will be distributed to all RIL shareholders.\n\nIrrespective of this value-unlock factor, experts believe the Jio Platforms IPO is a central factor, though not entirely negative. While news of an upcoming mega public offering usually acts as a catalyst, market sentiment has cooled because recent reports put valuations at approximately $114 billion (~ \u20b9 10.3 lakh crore), lower than earlier speculative estimates of $130 billion to $170 billion. They said Reliance shares are facing a hurdle at \u20b9 1,200. On breaking above this, we can expect the Reliance share price to scale around \u20b9 1265.\n\nReliance share price today is around \u20b9 1165, clocking around 6% dip in one month.\n\nWhether Jio Platforms IPO can bring the mojo in Reliance shares, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \u201cJio Platforms IPO is structured predominantly as a fresh capital issue of around 2.9% post-IPO equity rather than a massive offer-for-sale (OFS). This means RIL itself is not directly pocketing cash from selling its stake, though it retains a controlling ~64.5% stake while Jio uses the proceeds for debt prepayment and expansion.\u201d\n\nThe SMC Global Securities expert said that arbitrage traders and institutional desks are temporarily discounting the holding company valuation until the listing price band and post-listing trading performance establish firm market values.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:01 AM IST", "pub_date_relative": "2h ago"}, {"title": "Is the US economy as narrow as its stock market?", "full_content": "No*", "source": "FT Markets", "pub_date_str": "12 Oct 2026, 11:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "Equity today, debt tomorrow: How Mirae Asset\u2019s Life Cycle Fund 2056 plans your retirement", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a Equity today, debt tomorrow: How Mirae Asset\u2019s Life Cycle Fund 2056 plans your retirement The Economic Times daily newspaper is available online now. Read Today's Paper Equity today, debt tomorrow: How Mirae Asset\u2019s Life Cycle Fund 2056 plans your retirement SECTIONS Equity today, debt tomorrow: How Mirae Asset\u2019s Life Cycle Fund 2056 plans your retirement By Nikhil Agarwal , ETMarkets.com Last Updated: Oct 12, 2026, 11:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Mirae Asset Life Cycle Fund 2056 seeks to address gap through an automatic 30-year glide path that gradually shifts the portfolio from equity towards debt, arbitrage and gold. The fund moves through five stages, reducing net equity exposure from 70\u201390% in its early years to 10\u201325% as 2056 approaches, allowing investors to pursue long-term growth while progressively protecting their retirement corpus\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 11:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "Lenskart Solutions shares crack 5% after Rs 1,985-crore block deal; Alpha Wave likely sells take", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Lenskart Solutions shares crack 5% after Rs 1,985-crore block deal; Alpha Wave likely sells take Lenskart Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Lenskart Solutions shares crack 5% after Rs 1,985-crore block deal; Alpha Wave likely sells take SECTIONS Lenskart Solutions shares crack 5% after Rs 1,985-crore block deal; Alpha Wave likely sells take By Veer Sharma , ETMarkets.com Last Updated: Oct 12, 2026, 10:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Lenskart Solutions reported a 182.3% YoY jump in Q1 FY27 net profit to Rs 228 crore, while revenue rose 33.6% to Rs 2,214 crore. EBITDA margin expanded to 21.7% as product margins crossed 70% for the first time. Growth remained broad-based across India and international markets, with offerings ranging from Rs 500 glasses to premium eyewear.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 10:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "Global Markets: 5 key triggers to watch out for this week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Global Markets: 5 key triggers to watch out for this week Written by Anupam Nagar , ETMarkets.com | Oct 12, 2026, 11:03:31 AM IST 1 / 5 \u200bIMF-World Bank meetings in focus The IMF and World Bank annual meetings in Bangkok will put global growth, debt sustainability and geopolitics in focus as high energy costs and rising borrowing costs weigh on markets. The IMF's updated World Economic Outlook on Tuesday will be closely watched after the Iran war prompted two cuts to its global growth forecast. Policymakers are also expected to discuss conflicts in the Middle East and Ukraine, AI regulation and debt risks. (Source: Reuters)\n\nUS inflation data due Wednesday will offer fresh clues on the Federal Reserve's next policy move. September consumer prices are forecast to rise 0.6% month-on-month, while core CPI is expected to increase 0.2%, according to a Reuters poll. Producer prices and retail sales data due Thursday will add to the picture. A stronger-than-expected inflation reading could revive bets on another Fed rate hike later this month.\n\nMajor US banks will lead the third-quarter earnings season, with JPMorgan Chase, Goldman Sachs, Citigroup and Wells Fargo reporting on Tuesday, followed by Morgan Stanley and Bank of America on Wednesday. Earnings are expected to rise by as much as 20% from a year earlier. Investors will assess whether elevated Treasury yields are hurting lending growth, dealmaking and funding costs, amid a sharp pullback in bank stocks.\n\nChina's September trade and inflation data will help investors assess whether strong overseas demand can offset sluggish domestic consumption. Exports are forecast to rise 25.3% year-on-year in dollar terms, following 25% growth in August, according to a Reuters poll. Imports are expected to grow 23.5%.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 10:56 AM IST", "pub_date_relative": "2h ago"}, {"title": "DA news: What are the types of dearness allowance, how is it calculated and revised? Here are top FAQs answered", "full_content": "Revised twice annually based on data from the All-India Consumer Price Index (AICPI), Dearness Allowance (DA) is a percentage of employees' basic salary aimed at mitigating cost-of-living impact on households of central government employees. A DA hike gives employees a higher in-hand salary and a buffer against inflation.\n\nNew announcements are usually made in March and October, with rollouts in July and January. Notably, this year, the Finance Ministry in April announced DA hike of 2% for all central government employees and pensioners (including railways and defence personnel), effective from 1 January 2026. This increased the component to 60% of basic pay from 58%.\n\nFor calculation purposes, DA is separated into two categories: industrial and variable DA.\n\nWhen calculating DA, it comprises the base index (which remains fixed for a given period) and CPI (used to calculate VDA). Even though CPI numbers are released every month, VDA only changes when the Centre revises the basic minimum wages .\n\nNotably, the 2% DA hike is calculated based on the AICPI's 12-month average data, using the method prescribed by the 7th Pay Commission. Under this CPC, there have been 10 hikes since 2021, with the highest at 11% in July 2021. The past two hikes were 2% and 3%, respectively, for January and July 2025.\n\nThe formula used to calculate DA hikes is as follows, according to Clear Tax:\n\nThus, the DA hike announced in April was calculated as follows:\n\nDA is provided by the central and state governments to its employees and retirees. The private sector in India usually does not offer this benefit.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 10:52 AM IST", "pub_date_relative": "2h ago"}, {"title": "\u20b940 lakh home loan: How much can you save if interest rate falls from 10% to 9% over 10, 20, 30 years?", "full_content": "If you are availing a fresh home loan, even a minor reduction in the applicable interest rates can alter the repayment trajectory of your loan- it can go a long way towards helping you save money, even if the rates are reduced only slightly.\n\nThis is because even a minor one-percentage-point reduction in home loan interest rates can reduce a borrower\u2019s interest costs over different repayment periods.\n\nFor someone taking a \u20b9 40 lakh home loan, reducing the annual interest rate from 10% to 9% could save them approximately \u20b9 2.63 lakh over 10 years, \u20b9 6.27 lakh over 20 years and \u20b9 10.50 lakh over 30 years.\n\nSuch a saving also translates into lower equated monthly instalments (EMIs), thus making the home loan more affordable.\n\nHere is a breakdown of the calculations in both cases (9% and 10%), assuming the interest rate remains unchanged throughout the loan term.\n\nThe home loan EMI is calculated using the standard monthly reducing-balance formula:\n\nThis means, for a \u20b9 40 lakh loan at 10% annual interest over 20 years, the monthly interest rate is 10% \u00f7 12, and the number of instalments is 240. Applying the formula gives an EMI of approximately \u20b9 38,601.\n\nNote: Figures are approximate and calculated using unrounded EMI values. The calculations assume a constant interest rate, monthly repayments and no additional fees or prepayments.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 10:50 AM IST", "pub_date_relative": "2h ago"}, {"title": "India 10-year bond yield tops 7.35% as RBI's li Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India\u2019s Rs 34,284-crore Basmati trade gets a logistics boost with Iraq shipping plan The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s Rs 34,284-crore Basmati trade gets a logistics boost with Iraq shipping plan SECTIONS India\u2019s Rs 34,284-crore Basmati trade gets a logistics boost with Iraq shipping plan ANI Last Updated: Oct 12, 2026, 10:49:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis IREF has introduced a bulk-shipping initiative aimed at cutting freight costs for Basmati rice exports to Iraq. This initiative will lower costs from USD 350 to USD 90 per tonne, significantly improving competitiveness in the Middle East market. The collaboration with Eximwala Solutions Pte. Ltd. involves bulk shipments totaling 1,02,210 metric tonnes. The initiative is part of efforts to strengthen India\u2019s position in global rice exports.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "12 Oct 2026, 10:49 AM IST", "pub_date_relative": "2h ago"}, {"title": "Lifestyle Inflation: Are Weekly Dineout Plans Hurting Your Wallets More Than Big Splurges?", "full_content": "With almost everything available at just a few clicks, it is easy to lose track of your spending, but this can be an expensive habit.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 10:47 AM IST", "pub_date_relative": "2h ago"}, {"title": "63 Moons Technologies shares rally 9% as subsidiary raises FY27 revenue guidance to Rs 600 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a 63 Moons Technologies shares rally 9% as subsidiary raises FY27 revenue guidance to Rs 600 crore The Economic Times daily newspaper is available online now. Read Today's Paper 63 Moons Technologies shares rally 9% as subsidiary raises FY27 revenue guidance to Rs 600 crore SECTIONS 63 Moons Technologies shares rally 9% as subsidiary raises FY27 revenue guidance to Rs 600 crore By Ritesh Presswala , ETMarkets.com Last Updated: Oct 12, 2026, 10:44:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Shares of 63 Moons Technologies rallied after subsidiary 63SATS Cybertech reported Rs 218 crore in first-half FY27 billings and raised its full-year billed revenue guidance to Rs 600 crore from Rs 350 crore, citing strong execution and a growing business pipeline.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 10:44 AM IST", "pub_date_relative": "2h ago"}, {"title": "US Judge Halts Taxpayer-Funded TV Ads Lauding Trump For Now", "full_content": "The Justice Department told Rochon earlier in the weekend that the contested ads would stop running after Sunday and that the Department of Homeland Security \"has no plans\" to buy more media spots with the current vendor or to use money appropriated by Congress \"on any similar contracts.\"", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 10:43 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Having health insurance is not the same as being adequately protected", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nHealth insurance is an important part of financial planning, helping individuals and families manage healthcare expenses without putting undue pressure on their savings. As more people recognize the value of having health cover, the next step is to assess whether that protection continues to meet their needs.\n\nHealthcare and financial needs change over time. A policy that was appropriate when first purchased may need to support different circumstances as income, family responsibilities, savings and healthcare needs evolve. Alongside asking, \u201cDo I have health insurance?\u201d, it is equally important to ask, \u201cIs the protection I have adequate for my needs today?\u201d\n\nThere is no single sum insured that works for everyone. Consider two people who each have \u20b9 20 lakh of cover. One may also have employer-provided insurance and enough savings to comfortably manage smaller medical expenses. The other may depend largely on that one policy, support ageing parents and have less room to absorb an unexpected healthcare cost. Their sum insured is identical, but their overall financial protection is not.\n\nThe goal, therefore, should not simply be to maximize the sum insured, but to match protection to risk. A higher sum insured can be useful, but it is only one part of the picture. Consumers also need to consider the healthcare expenses they could realistically face, what their insurance would cover and how much they could pay out of pocket without disrupting other financial priorities. They should also account for the wider impact of a serious health event, particularly if it affects their ability to work or requires a family member to take time off to provide care.\n\nIt helps to look at health protection as a whole rather than viewing one policy in isolation. Employer-provided insurance may meet part of the need and personal health insurance another.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 12:54 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "JPMorgan upgrades Manila Electric stock rating on tariff award", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 12:48 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jefferies initiates Beta Bionics stock coverage with buy rating", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 12:48 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "FTSE 100 today: Stocks rise as oil slips despite Riyadh airport attacks", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Oct 2026, 12:48 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jio IPO may be  Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets .", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 12:44 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Aeroflex Industries shares hit a record high, up over 100% in 6 months - Why is the stock rising? Should investors buy?", "full_content": "Aeroflex Industries shares jumped as much as 15% in intraday trade on the BSE on Monday, 12 October, to hit a record high of \u20b9 599.70. Aeroflex Industries share price opened at \u20b9 530.60 compared to its previous close of \u20b9 520.45 and surged 15.2% to hit an all-time high level, looking set to snap its two-day losing run.\n\nThe stock witnessed strong buying interest a day after the company announced that a meeting of its board of directors is scheduled to be held on Wednesday, 14 October, to consider and approve its expansion plans, including further capacity enhancements.\n\nAeroflex manufactures and exports stainless steel flexible flow solutions, specialising in high-quality hoses, assemblies, and engineered products. It serves industries such as data centres, oil and gas, pharmaceuticals, chemicals, power, etc.\n\nIn Q1FY27, the company clocked the highest-ever revenue of \u20b9 145.97 crore, rising 72.41% year-on-year (YoY), while profit after tax (PAT) jumped 162.22% YoY to \u20b9 18.79 crore.\n\nEBITDA for the quarter registered a strong 116.38% YoY growth to \u20b9 33.49 crore, while EBITDA margin jumped 468 basis points YoY to 23.04% in the June quarter of the current financial year (Q1FY27).\n\nThe stock has delivered a multibagger return of over 100% in the last six months, while year-to-date, it is up almost 200%. Over the last one year, the stock has soared 230%.\n\nJigar S. Patel, Senior Manager of Equity Technical Research at Anand Rathi Share and Stock Brokers, highlighted that the Aeroflex share price is currently exhibiting a strong bullish trend, characterised by the formation of higher highs and higher lows, indicating sustained buying interest.\n\nPatel said the stock is trading above all key moving averages, further reinforcing its positive price structure across multiple timeframes. Additionally, the Relative Strength Index (RSI) on the daily, weekly, and monthly charts is above the 60 mark, highlighting strong momentum and the dominance of bullish sentiment.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 12:41 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Cupid\u2019s skyrocketing rally hits a speed bump as shares fall 3%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Cupid\u2019s skyrocketing rally hits a speed bump as shares fall 3% Cupid Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Cupid\u2019s skyrocketing rally hits a speed bump as shares fall 3% SECTIONS Cupid\u2019s skyrocketing rally hits a speed bump as shares fall 3% By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 12, 2026, 12:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Cupid shares fell on Monday after hitting a fresh lifetime high, as investors appeared to book profits following a sharp rally. Despite the pullback, the multibagger stock is up around 245% in 2026 so far, with returns of 630% over one year, 7,485% over three years and 15,000% over five years.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 12:36 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "S&P 500 futures rise as big banks set to kick off earnings season: Live updates - CNBC", "full_content": "S&P 500 futures rise as big banks set to kick off earnings season: Live updates CNBC S&P 500 Futures Rise in Premarket Trading; Lennar, Humana Lead Barron's Stock Market Midday, Oct. 9: Stocks Edge Higher, Humana jumps 13% The Globe and Mail Wall Street Futures Rise; Humana (HUM) Shares Surge 12.88% Amid Market Rebound GuruFocus U.S. Stock Futures Rise Ahead of Busy Week of Bank Earnings and Inflation Data TipRanks", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 12:34 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Adani Green Energy shares up 16% in 6 months, Jefferies sees 35% more upside in Gautam Adani-owned stock | Target price", "full_content": "Stock to buy today | Jefferies India stock recommendations: Adani Green Energy shares are among those rare stocks that have delivered a whopping return to their shareholders despite sell-off stress in the key benchmark indices Nifty 50, Sensex and Bank Nifty. This Gautam Adani-owned stock has risen 16% over the past six months and around 23%YTD. Global investment bank Jefferies sees more upside in the Adani Green Energy share price. The latest Jefferies India report has predicted 35% upside, with an Adani Green Energy share price target of \u20b9 1,695. Adani Green Energy's share price today is oscillating around \u20b9 1,260.\n\nOn why Jefferies is bullish on this Gautam Adani-owned stock, the global investment bank said, \u201cAdani Green\u2019s (AGEL) stock price has corrected 22% from its peak and now trades at 20x 1Y forward EBITDA, which appears attractive given its 30% FY26-30E EBITDA CAGR. We see industry-level triggers for strong power demand and improved utilisation driven by higher temperatures. These should largely offset potential higher interest costs from RBI rate hikes and ease investor concerns.\u201d\n\nThe global investment bank believes recent news reports suggest that El Ni\u00f1o could persist into CY27, implying the CY26 peak deficit could recur. Coal stocks are at critical levels of less than 7 days. State Electricity Boards (SEBs) are already discussing locking in 2027 power as shortages could reappear with rising temperatures. AGEL is swiftly ramping up its Battery Energy Storage Solutions (BESS) segment. It has an installed BESS capacity of 6.6 GWh with plans of 10 GWh+ end FY27E. This is likely to accelerate given the strong demand for power. Also, our 6.5-6.8 GW FY28E-30E annual generation capacity addition could see upside.\n\nJefferies India report said that Aani Green Energy\u2019s net debt-to-EBITDA should decline to 7.1x by FY30E vs 8.9x in FY26, on our capacity assumption of 44 GW.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 12:32 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Selling old gold jewellery? 7 factors that determine its resale value", "full_content": "Gold has given amazing returns over the last few years. For example, the price of 24-karat yellow metal per 10 grams has risen by 46.98% since the beginning of 2026, as per data compiled by Bankbazaar . This rise in gold prices makes selling old jewellery lucrative.\n\nThe amount an individual will receive depends on several factors in addition to the prevailing market rate. Factors such as purity, net gold weight, making charges and deductions can all impact the final value.\n\nIf planning to sell old gold jewellery, checking the prevailing gold rate is a starting point. However, the final amount offered by a jeweller may vary depending on the jewellery\u2019s purity, its actual gold content, make and terms of the transaction.\n\nNote: The factors discussed above are not exhaustive. Several other aspects might be considered on a case-by-case basis.\n\nLet us consider an. You sell 20 grams of 22K gold jewellery, of which 2 grams comprises stones and other non-gold materials. Then the net gold weight drops down to 18 grams.\n\nIf the applicable buying rate is \u20b9 10,000 per gram (for simplicity), the preliminary value is \u20b9 1,80,000 before any applicable deductions. In this case, the final amount may be lower, depending on the jeweller\u2019s valuation method and transaction terms.\n\nTo ensure you secure the best possible rates for your gold jewellery, compare quotations from different jewellers , cross-check the applicable rate and request a written breakdown of the gold purity, weight, deductions and valuation.\n\nYou can also approach a BIS-recognized assaying and hallmarking centre for gold testing.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 12:30 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Banks seek RBI relief, clarity on India's latest rupee-defence measures: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Banks seek RBI relief, clarity on India's latest rupee-defence measures: Report The Economic Times daily newspaper is available online now. Read Today's Paper Banks seek RBI relief, clarity on India's latest rupee-defence measures: Report SECTIONS Banks seek RBI relief, clarity on India's latest rupee-defence measures: Report Reuters Last Updated: Oct 12, 2026, 12:29:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Banks have approached the Reserve Bank of India to request changes to the 20% cash deposit mandate. They propose that a flat charge replaces the deposit requirement for current-account hedging. This change could improve liquidity while ensuring cost transparency for businesses. Lenders also highlighted concerns over the $2 million threshold, which complicates hedge tracking. Clarity is needed regarding the deposit requirement for hedges related to interest payments on foreign loans.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Sha fer-for-sale (OFS) as current investors are not exiting or diluting holdings.\n\nHowever, it is from the house of conglomerate of Billionaire business tycoon Mukesh Dhirubhai Ambani-led Reliance Industries Limited (RIL) but Reliance is not the 100% owner of Jio Platforms. Jio has shareholders like social media giant Meta, IT giant Google and others.\n\n- As on the date of this Draft Red Herring Prospectus, the Company has 105 Shareholders\n\n- Below are details of the Shareholders holding 1.00% or more of the paid-up share capital of the Company (Top 10 shareholders):-\n\n(ii) Jaadhu Holdings, LLC (an affiliate of Meta Platforms, Inc. (formerly known as Facebook, Inc.)) 9.98%\n\n(iv) The Public Investment Fund (a sovereign wealth fund of the Kingdom of Saudi Arabia) 2.31%\n\n(v) Omicron Asia Holdings II Pte. Ltd. (an affiliate of funds, vehicles and/ or entities managed and/ or advised by Kohlberg Kravis Roberts & Co. L.P., an indirect subsidiary of KKR & Co. Inc.) 2.31%", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 12:16 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Zee Entertainment shares extend gains for second session, rises 7% today | Check stock performance", "full_content": "Zee Entertainment share price surged as much as 7% in Monday's trading session, extending gains for second consecutive session despite volatility in the Indian stock market.\n\nZee Entertainment shares opened at \u20b9 70.20 per share today, as compared to previous close of \u20b9 69.97 on Friday last week and touched an intraday high of \u20b9 74.90 on 12 October.\n\nThe rally in the stock came in after the share price witnessed spurt in trading volume. According to data available on NSE, around 169.84 lakhs shares changed hands during the intraday session on Monday.\n\nMeanwhile, Indian benchmark indices pared their early gains and traded lower on Monday as investors assessed the impact of central bank measures aimed at supporting the rupee. A decline in oil prices, however, helped ease some concerns. The Nifty 50 was down 0.13% at 22,493.25, while the BSE Sensex slipped 0.26% to 72,277.23. Both indices had opened the session with gains of around 0.5%.\n\nIn an exchange filing on 6 October, the company said it received a notice from the Ministry of Corporate Affairs (MCA) on October 5, seeking certain information as part of an ongoing inspection under the Companies Act, 2013.\n\nThe company has already submitted the required information and will provide any further details or explanations sought by the ministry.\n\n\u201cWe wish to inform you that the Company has received a notice from the Ministry of Corporate Affairs (MCA) on October 5, 2026 under Section 210(1)(a) & (c) of the Companies Act, 2013 seeking certain information about the Company, in continuation to the ongoing inspection under Section 206(5) of the Companies Act, 2013,\u201d the firm said in the filing.\n\nLast month, the National Company Law Tribunal (NCLT) approved a repayment plan proposed by Essel Group founder Subhash Chandra, under which creditors were set to recover around \u20b9 6.5 crore against admitted claims of \u20b9 22,006.57 crore. This translates into a steep 99.97% haircut on the admitted claims.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 12:06 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "TCS shares after 6% rally in 2 sessions after Q2 results. What are technical\u2019s indicating for the IT major?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business N  to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 11:54 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "8th pay commission: Assam pay commission to revise employees' salaries, submit report, says CM \u2014 What we know", "full_content": "Giving an update on the state's 8th pay commission, Assam Chief Minister Himanta Biswa Sarma said that the new panel has begun its work, adding that salaries of state government employees would be revised after the committee submits its report, PTI reported.\n\n\u201cThe new Pay Commission has begun its work, and employees' salaries would be revised after it submits its report,\u201d the chief minister said while speaking at a state government programme in Guwahati on Sunday, 11 October.\n\nNotably, Assam in January, became the first among state and Union Territories (UTs) to set up its 8th state CPC, after the Centre commissioned and set up its panel last year, Sarma said in a post on social media platform X (formerly known as Twitter).\n\nHe also named Assam\u2019s former Additional Chief Secretary Subhas Das as Chairman of the commission.\n\nNotably, the state panel is expected to submit recommendations within 18 months and is expected to decide on allowances, service conditions, pay and pension, as per a report by the Financial Express. It said revised pay scales could be implemented in 2027 or 2028, with arrears likely to be paid from 1 January 2026. However, no announcement is expected before the Centre's commission has made suggestions.\n\nJocelyn Fernandes is a journalist and editor with nearly 13 years of experience covering the business, corporate, economy and markets beats in news.<br> As chief content producer for around three years at Livemint (Hindustan Times), Jocelyn publishes breaking stories, explainers, features and live blogs on a range of business and economy topics, including the Budget, corporate developments, stock markets, income tax, money and personal finance, cryptocurrency, government policy, impact of US tariffs, international developments and more.<br> Jocelyn's writing philosophy is focused on delivering news in an accurate and accessible format for readers.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 11:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments", "Portfolio Management"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Aeroflex Industries shares rally 13% ahead of key board meeting on expansion plans", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Aeroflex Industries shares rally 13% ahead of key board meeting on expansion plans Aeroflex Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Aeroflex Industries shares rally 13% ahead of key board meeting on expansion plans SECTIONS Aeroflex Industries shares rally 13% ahead of key board meeting on expansion plans By Sakshi Kumari , ETMarkets.com Last Updated: Oct 12, 2026, 12:03:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Aeroflex Industries shares surged nearly 13% as investors awaited the October 14 board meeting to discuss expansion plans and capacity enhancements. The stock has gained over 200% in 2026, with the company\u2019s market capitalisation at around Rs 7,715 crore.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 11:53 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Suzlon Energy shares jump 5% after Motilal Oswal reiterates bullish view, sees 73% upside; Technicals signal caution", "full_content": "Suzlon Energy share price jumped nearly 5% on Monday, 12 October, after Motilal Oswal Financial Services reiterated its \u2018Buy\u2019 rating on the stock, with a target price of \u20b9 65, implying an upside potential of around 73% from its current market price of \u20b9 38. The brokerage expects earnings momentum to strengthen in the second half of FY27, supported by a strong order book, higher deliveries and rising wind power installations in India.\n\nIn its latest report, Motilal Oswal said Suzlon Energy's stock has corrected 31% over the past three months and is currently trading at 17.5 times its estimated FY28 earnings. This represents a 20% discount to its one-year forward price-to-earnings average of 22 times at minus one standard deviation, making the valuation attractive, according to the brokerage.\n\nMotilal Oswal has retained its \u2018Buy\u2019 rating on Suzlon Energy with a target price of \u20b9 65, based on 30 times its estimated FY28 earnings per share (EPS). The valuation multiple is slightly above the company's historical average two-year forward price-to-earnings ratio of 27 times.\n\nThe brokerage expects Suzlon's earnings to improve in the second half of FY27, as the wind energy business typically generates 60\u201365% of its annual EBITDA during the second half. It estimates deliveries will rise to 2.1 GW in the second half, up from 1.2 GW in the first half.\n\nFor FY27, Motilal Oswal projects total deliveries of 3.3 GW, representing 35% year-on-year growth, followed by 3.8 GW in FY28. The brokerage expects EBITDA to grow at a compound annual growth rate (CAGR) of 22% between FY26 and FY28, supported by improving execution and delivery visibility.\n\nSuzlon Energy's order book stood at 5.9 GW at the end of the first quarter of FY27, with the company securing around 1.3 GW of order inflows in FY27 so far, according to Motilal Oswal.\n\nThe brokerage believes the existing order book provides complete visibility for its estimated deliveries through the third quarter of FY28.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 11:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Inflation could hit 7%, forcing RBI to hike rates by 150 bps further: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Econom
