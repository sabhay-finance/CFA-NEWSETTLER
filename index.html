<script>

    const allData = {"general": [{"title": "Oil Steadies After Rally as Trump Sees Short-Lived Iran Strikes", "full_content": "Oil steadied after a three-day rally as President Donald Trump said renewed attacks on Iran would be short-lived, while US officials signaled robust energy flows through the Strait of Hormuz.\n\nBrent traded near $95 a barrel after surging more than 8% over the past three sessions, while West Texas Intermediate was below $91. Asked how long the US bombing campaign could continue, Trump said \u201cI don\u2019t think too long,\u201d although the president added that \u201cwe\u2019re prepared to do another one.\u201d\n\nThe renewed US strikes followed weeks of relative calm, with Iran retaliating by firing drones and missiles at American bases across the Middle East, in line with a pattern used throughout the six-month war. The American military escorted 40 vessels through the waterway on Tuesday carrying 18 million barrels of oil, according to CNN, which cited two officials familiar with the matter.\n\n\u201cThe latest escalation should keep support under the market, however, keep in mind both the US and Iran are looking for off-ramps here,\u201d said Dennis Kissler, senior vice president for trading at BOK Financial Securities Inc. \u201cMore peace talks could deflate prices quickly.\u201d\n\nStill, neither the US nor Iran has shown a willingness to come to the negotiating table since the collapse of an interim peace accord agreed in June. Crude prices are almost 60% higher this year, with refined products such as diesel rallying even harder due to the Middle East conflict and the Russia-Ukraine war.\n\nUS officials continue to point to consistent crude shipments exiting the Persian Gulf, despite persistent threats to shipping. This week, Energy Secretary Chris Wright said 17 million barrels of oil exited the waterway on Monday, with flows averaging about 8 million barrels a day.\n\nThe global oil market is returning closer to balance as supplies continue to exit the Persian Gulf, although risks remain, Chevron Corp. Chief Executive Officer Mike Wirth said in an interview in Caracas.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 07:03 AM IST", "pub_date_relative": "2m ago"}, {"title": "Oil prices edge lower on US-Iran war uncertainty; Brent at $95/bbl", "full_content": "US-Iran war: Oil prices slipped on Thursday as investors assessed the uncertainty surrounding renewed military strikes between the U.S. and Iran, raising concerns over potential disruptions to crude supplies from the Middle East.\n\nBrent crude futures declined 43 cents, or 0.45%, to $95.20 a barrel, while US West Texas Intermediate (WTI) crude futures fell 24 cents, or 0.26%, to $90.77 a barrel.\n\nBrent and WTI prices fluctuated sharply in the previous trading session, moving between gains of up to $2 a barrel and losses of around $1. The intraday highs for both benchmarks marked their highest levels since July 24.\n\nThe latest attacks marked the most significant exchange of fire between the US and Iran since July, as the conflict enters its seventh month.\n\nUS President Donald Trump said on Wednesday that the renewed American military campaign against Iran would not last \u201ctoo long\u201d. He added that US forces had struck Iran\u2019s radar and missile systems.\n\n\"We took out all of the new equipment that they tried to build along the Strait of Hormuz - some defensive, some offensive ... It was a very heavy attack last night, and we're prepared to do another one any time we want,\" Trump said.\n\nMeanwhile, four commodity vessels passed through the Strait of Hormuz , well below the 10-day average of around 13 vessels, according to preliminary shipping data from Kpler released on Wednesday.\n\nIran has also expanded its list of vessels considered non-compliant, warning that ships attempting to navigate the strait could face fines, confiscation or detention.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 07:02 AM IST", "pub_date_relative": "2m ago"}, {"title": "US judge bars EPA effort to send California vehicle emissions rules to Congress", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Sep 2026, 06:54 AM IST", "pub_date_relative": "11m ago"}, {"title": "Lumino Industries IPO listing today: GMP at \u20b939.5; Share price prediction ahead of NSE, BSE debut", "full_content": "Lumino Industries IPO listing date has been scheduled for today (Thursday, 3 September) on the bourses at 10:00 IST. Lumino Industries IPO allotment was finalised on Tuesday, 1 September. According to details on the BSE website, Lumino Industries share price will list in a special pre-open session on both the BSE and NSE during Thursday's trades. Lumino Industries share price today will be available for trade from 10:00 IST.\n\nAccording to a BSE notice, the equity shares of Lumino Industries Limited will be listed and admitted for trading on the exchange in the \u2018B\u2019 Group of Securities, effective Thursday, 3 September 2026.\n\nLumino Industries IPO GMP today, or grey market premium, is +39.5. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Lumino Industries share price was indicated at \u20b9 121.5 apiece, which is 48.17% higher than the IPO price of \u20b9 82.\n\nAnalysing grey market trends over the past 14 sessions, the present GMP stands at \u20b9 39.5, suggesting pessimistic sentiment. Throughout this timeframe, the GMP fluctuated, ranging from a minimum of \u20b9 38.00 to a maximum of \u20b9 63, as per expert analysis.\n\nMahesh M. Ojha, Vice President \u2013 Research & Business Development at Kantilal Chhaganlal Securities Pvt. Ltd., said Lumino Industries has delivered a strong 20% revenue CAGR during FY24\u2013FY26, supported by a robust order book of around \u20b9 3,150 crore as of March 2026. This provides healthy revenue visibility across its EPC and manufacturing segments.\n\nAccording to Ojha, the company operates an integrated power-sector platform spanning cables, conductors and EPC execution, backed by an annual manufacturing capacity of 40,000 MT across two facilities in Howrah.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 06:52 AM IST", "pub_date_relative": "13m ago"}, {"title": "Insmed director Sharoky sells $637,650 of Insmed stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Sep 2026, 06:46 AM IST", "pub_date_relative": "19m ago"}, {"title": "PBF Energy director sells $8.97m in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Sep 2026, 06:46 AM IST", "pub_date_relative": "19m ago"}, {"title": "Castle Biosciences CCO Tobin Juvenal sells $51,190 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Sep 2026, 06:46 AM IST", "pub_date_relative": "19m ago"}, {"title": "Marathon Petroleum legal chief Molly Benson sells $6.1m stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Sep 2026, 06:45 AM IST", "pub_date_relative": "19m ago"}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20143 September 2026", "full_content": "Buy or sell stocks : The Indian stock market remained under pressure for the third straight session on Wednesday, September 2, as benchmark indices slipped below key support levels. Renewed clashes in the Middle East drove oil prices higher, raising concerns over inflation and fuelling expectations of tighter monetary policy.\n\nThe Nifty 50 ended 0.59% lower at 23,914 after hitting an intraday low of 23,786. However, late-session buying helped the index recover a significant portion of its losses. The Sensex declined 0.62% to close at 76,469 after touching a one-month low during the trading session.\n\nNifty 50 witnessed strong selling pressure on 2nd September 2026 and settled at 23,914.45, down 141.35 points or 0.59%. The index e Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 06:22 AM IST", "pub_date_relative": "43m ago"}, {"title": "Nifty stages recovery from lows; Can bulls push the index back above 24,000?", "full_content": "The Nifty 50 began Wednesday\u2019s session with a gap down below the crucial psychological mark of 24,000. After remaining largely confined to the range formed during the first hour of trade, the index witnessed further weakness before finding buying support at lower levels.\n\nFrom the intraday low, the index recovered 127.65 points and closed at 23,914.45. However, the index failed to fill the opening gap and ended the session below the 24,000 mark, keeping the short-term outlook cautious.\n\nThe day\u2019s trading activity led to the formation of a green-bodied candle with a lower shadow. The lower shadow highlights buying interest emerging from lower levels, while the green body indicates that the index managed to close above its opening price.\n\nThe recovery was seen near a significant support zone, where multiple technical factors came together. The index took support near the 38.2% Fibonacci retracement level of the recent upmove from the April 2 low, along with the July 29 gap area. It also bounced from the previous parallel lows, making Wednesday\u2019s low of 23,786 an important level to watch.\n\nA decisive break below 23,786 could bring renewed selling pressure and may drag the index towards the July swing low near the 23,600 zone.\n\nDespite the recovery, the overall technical structure remains weak. The Nifty continues to trade below its 20-DMA, 50-DMA, 100-DMA, and 200-DMA, indicating that the broader trend is yet to improve.\n\nThe 20-DMA continues to move lower, while the 50-DMA has flattened, reflecting a lack of  Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Sep 2026, 06:03 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Oil prices edge lower on US-Iran war uncertainty; Brent at $95/bbl", "full_content": "US-Iran war: Oil prices slipped on Thursday as investors assessed the uncertainty surrounding renewed military strikes between the U.S. and Iran, raising concerns over potential disruptions to crude supplies from the Middle East.\n\nBrent crude futures declined 43 cents, or 0.45%, to $95.20 a barrel, while US West Texas Intermediate (WTI) crude futures fell 24 cents, or 0.26%, to $90.77 a barrel.\n\nBrent and WTI prices fluctuated sharply in the previous trading session, moving between gains of up to $2 a barrel and losses of around $1. The intraday highs for both benchmarks marked their highest levels since July 24.\n\nThe latest attacks marked the most significant exchange of fire between the US and Iran since July, as the conflict enters its seventh month.\n\nUS President Donald Trump said on Wednesday that the renewed American military campaign against Iran would not last \u201ctoo long\u201d. He added that US forces had struck Iran\u2019s radar and missile systems.\n\n\"We took out all of the new equipment that they tried to build along the Strait of Hormuz - some defensive, some offensive ... It was a very heavy attack last night, and we're prepared to do another one any time we want,\" Trump said.\n\nMeanwhile, four commodity vessels passed through the Strait of Hormuz , well below the 10-day average of around 13 vessels, according to preliminary shipping data from Kpler released on Wednesday.\n\nIran has also expanded its list of vessels considered non-compliant, warning that ships attempting to navigate the strait could face fines, confiscation or detention.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 07:02 AM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Lumino Industries IPO listing today: GMP at \u20b939.5; Share price prediction ahead of NSE, BSE debut", "full_content": "Lumino Industries IPO listing date has been scheduled for today (Thursday, 3 September) on the bourses at 10:00 IST. Lumino Industries IPO allotment was finalised on Tuesday, 1 September. According to details on the BSE website, Lumino Industries share price will list in a special pre-open session on both the BSE and NSE during Thursday's trades. Lumino Industries share price today will be available for trade from 10:00 IST.\n\nAccording to a BSE notice, the equity shares of Lumino Industries Limited will be listed and admitted for trading on the exchange in the \u2018B\u2019 Group of Securities, effective Thursday, 3 September 2026.\n\nLumino Industries IPO GMP today, or grey market premium, is +39.5. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Lumino Industries share price was indicated at \u20b9 121.5 apiece, which is 48.17% higher than the IPO price of \u20b9 82.\n\nAnalysing grey market trends over the past 14 sessions, the present GMP stands at \u20b9 39.5, suggesting pessimistic sentiment. Throughout this timeframe, the GMP fluctuated, ranging from a minimum of \u20b9 38.00 to a maximum of \u20b9 63, as per expert analysis.\n\nMahesh M. Ojha, Vice President \u2013 Research & Business Development at Kantilal Chhaganlal Securities Pvt. Ltd., said Lumino Industries has delivered a strong 20% revenue CAGR during FY24\u2013FY26, supported by a robust order book of around \u20b9 3,150 crore as of March 2026. This provides healthy revenue visibility across its EPC and manufacturing segments.\n\nAccording to Ojha, the company operates an integrated power-sector platform spanning cables, conductors and EPC execution, backed by an annual manufacturing capacity of 40,000 MT across two facilities in Howrah.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 06:52 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Breakout stocks to buy or sell: Sumeet Bagadia recommends five shares to buy today \u20143 September 2026", "full_content": "Buy or sell stocks : The Indian stock market remained under pressure for the third straight session on Wednesday, September 2, as benchmark indices slipped below key support levels. Renewed clashes in the Middle East drove oil prices higher, raising concerns over inflation and fuelling expectations of tighter monetary policy.\n\nThe Nifty 50 ended 0.59% lower at 23,914 after hitting an intraday low of 23,786. However, late-session buying helped the index recover a significant portion of its losses. The Sensex declined 0.62% to close at 76,469 after touching a one-month low during the trading session.\n\nNifty 50 witnessed strong selling pressure on 2nd September 2026 and settled at 23,914.45, down 141.35 points or 0.59%. The index formed a bearish candlestick pattern on the daily timeframe, indicating renewed weakness after repeated rejection from the 24,150\u201324,000 region. The short-term structure remains cautious as the index continues to face selling pressure near higher levels.\n\n\u201cFrom a technical perspective, immediate support is placed at 23,800, followed by the crucial 23,606 zone. A decisive break below 23,800 could extend the correction towards 23,606. On the upside, resistance is seen at 24,050\u201324,100, followed by the broader hurdle at 24,200. Sustained trading above 24,100\u201324,200 would be required to revive bullish momentum. India VIX rose over 3% to 11.59, indicating increased volatility and caution. Overall, the near-term bias remains cautious to bearish, with 23,800 acting as the key level to defend,\u201d said Sumeet Bagadia, Executive Director at Choice Broking.\n\nBank Nifty remained under pressure on 2nd September 2026 and closed at 57,172, down 237.60 points or 0.41%. The index traded between 56,823.20 and 57,221.10 during the session and continued its corrective structure after slipping below the previous close of 57,409.60.", "source": "LiveMint Markets", "pub_date_str": "03 Sep 2026, 06:41 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India's banking system liquidity surplus hits over 4.5-year high at Rs 7.76 lakh crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a India's banking system liquidity surplus hits over 4.5-year high at Rs 7.76 lakh crore The Economic Times daily newspaper is available online now. Read Today's Paper India's banking system liquidity surplus hits over 4.5-year high at Rs 7.76 lakh crore SECTIONS India's banking system liquidity surplus hits over 4.5-year high at Rs 7.76 lakh crore By Rozebud Gonsalves , ET Bureau Last Updated: Sep 03, 2026, 06:36:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's banking system liquidity surplus has reached its highest point in over four years. This surge is attributed to record forex-     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
