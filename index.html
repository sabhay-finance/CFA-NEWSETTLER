market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 12:37 PM IST", "pub_date_relative": "10m ago"}, {"title": "Adidas achieves record Q3 profit, raises full-year outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:34 PM IST", "pub_date_relative": "13m ago"}, {"title": "Global Market: ECB rate decision in focus as Lagarde exit speculation grows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: ECB rate decision in focus as Lagarde exit speculation grows Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: ECB rate decision in focus as Lagarde exit speculation grows SECTIONS Global Market: ECB rate decision in focus as Lagarde exit speculation grows By Anupam Nagar , ETMarkets.com Last Updated: Oct 29, 2026, 12:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The European Central Bank is expected to hold interest rates steady as oil-driven inflation risks, rising French borrowing costs and uncertainty over President Christine Lagarde's future complicate the central bank's monetary policy outlook.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 12:33 PM IST", "pub_date_relative": "13m ago"}, {"title": "Tencent, Visa deepen payments push in China after regulatory green light", "full_content": "Tencent and Visa are expanding their partnership in cross-border payments and AI-powered commerce, the companies said Thursday, deepening their push into China\u2019s payments market.\n\nThe agreement follows fresh regulatory approvals for U.S. financial firms in China, with Visa and Citi receiving the green light this month to expand their operations in the world\u2019s second-largest economy.\n\nUnder the memorandum of understanding, Tencent and Visa will explore ways to make payments easier for travelers entering and leaving China while expanding their cross-border money transfer partnership.\n\nThe companies also plan to develop payment solutions that would allow travelers to pay participating merchants through Tencent\u2019s Weixin Pay and Visa networks, subject to regulatory requirements.\n\nThey also aim to expand their collaboration through Visa Direct, Visa\u2019s money transfer service, making it easier for overseas users to send funds into the Weixin Pay ecosystem.\n\nThe partnership will also extend to agentic commerce, an emerging form of online shopping in which AI agents can help consumers find, select and purchase products or services.\n\nDowson Tong, Tencent's senior executive vice president and CEO of its Cloud and Smart Industries Group, said the partnership would combine Tencent's AI capabilities with Visa's global network to improve cross-border payments.\n\n\"We hope to create more seamless commerce experiences for consumers and new opportunities for businesses, both in China and internationally,\" he said.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:31 PM IST", "pub_date_relative": "15m ago"}, {"title": "\u20b91000 SIP, 10 years, top equity mutual funds calculator: How do regular plans reduce your final corpus vs direct plans?", "full_content": "Direct and regular mutual fund plans invest in the same portfolio and are managed by the same fund manager. However, their returns can differ because of how investors purchase them and the costs involved.\n\nYou may find both plans on the same platforms, but direct plans are routed directly through the asset management company (AMC), while regular plans are bought through intermediaries such as brokers or mutual fund distributors.\n\nSince regular plans include distribution-related costs, they have a higher expense ratio, which can reduce investors\u2019 returns over time.\n\nTo improve transparency around these costs, Securities and Exchange Board of India ( SEBI ) Chairman Tuhin Kanta Pandey said in his address at NDTV Profit IGNITE, released on Wednesday, \u201cFrom November 1, Direct Plans will be the default option on digital platforms of AMCs. Investors choosing Regular Plans must be informed about their higher expense ratio.\u201d\n\nThe total expense ratio (TER) covers the costs of running and managing a mutual fund scheme and is expressed as a percentage of its average net asset value (NAV). These expenses are deducted before the daily NAV is disclosed, affecting the returns investors ultimately receive.\n\nBut how much difference can choosing a regular plan over a direct plan of the same equity mutual fund make to your final corpus over 10 years? Here's what the numbers show.\n\nThe table below compares the 10-year SIP returns of the top five equity funds based on direct-plan performance, alongside the corresponding regular-plan returns and the final corpus from a \u20b9 1,000 monthly SIP.\n\n*Source: Value Research; Returns as on 28 October 2026; 10-year XIRR returns", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 12:31 PM IST", "pub_date_relative": "15m ago"}, {"title": "Hyundai Motor lowers sales outlook as strikes hit Q3 deliveries", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "Volkswagen loss widens more than expected in Q3, raising restructuring stakes", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:30 PM IST", "pub_date_relative": "16m ago"}, {"title": "Adidas confirms preliminary results, raises guidance", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:30 PM IST", "pub_date_relative": "17m ago"}, {"title": "Japan stocks higher at close of trade; Nikkei 225 up 1.00%", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:30 PM IST", "pub_date_relative": "17m ago"}, {"title": "Asian currencies mixed as dollar steadies after Fed hold, PCE eyed", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:29 PM IST", "pub_date_relative": "18m ago"}, {"title": "Hyundai Motor India shares gain 5% despite profit slump; Why brokerages remain bullish | Check target prices", "full_content": "Dhanya Nagasundaram Published 29 Oct 2026, 12:28 PM IST Prefer Livemint on Google Hyundai Motor India shares jumped over 5% on Thursday, 29 October, following the automaker\u2019s Q2 FY27 results, despite a year-on-year decline in quarterly profit due to elevated input costs.\n\nThe company reported a 23.9% year-on-year drop in consolidated net profit to \u20b9 1,196.16 crore for the quarter ended September, compared with \u20b9 1,572.25 crore in the corresponding period last year.\n\nHowever, Hyundai Motor India Ltd (HMIL) recorded its highest-ever quarterly sales of 2,19,072 units during the quarter, marking growth of 15% year-on-year and 23% sequentially. Revenue from operations rose to \u20b9 20,696.05 crore in Q2 FY27 from \u20b9 17,460.82 crore a year earlier, according to a regulatory filing.\n\nTotal expenses increased to \u20b9 19,302.18 crore from \u20b9 15,566.06 crore in the year-ago quarter, driven by higher material costs, which weighed on profitability.\n\nCommenting on the performance, Tarun Garg, Managing Director and Chief Executive Officer of HMIL, said Q2 FY27 was a milestone quarter for the company, with record sales volumes and quarterly revenue crossing \u20b9 20,000 crore for the first time since its inception. However, he noted that elevated commodity costs had affected profitability.\n\nLooking ahead, Garg said the company expects momentum to accelerate in the second half of FY27. He added that the launch of the Bayon marks the beginning of Hyundai\u2019s product cycle, while the company is preparing to introduce a dedicated mass-market electric vehicle in Q4 FY27.\n\nMotilal Oswal Financial Services reiterated its \u2018Buy\u2019 rating on Hyundai Motor India, with a target price of \u20b9 2,300, implying an upside of around 23% from the current market price of \u20b9 1,875.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:28 PM IST", "pub_date_relative": "19m ago"}, {"title": "Diwali fire hazards: how home insurance can protect your house and belongings", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nDiwali is a festival of lights, but diyas, firecrackers and flowing garments can also increase the risk of fire accidents. While most households prioritize health and life insurance, home insurance often gets overlooked. Yet a fire can damage not just the structure of a house but also furniture, electronics, appliances, clothing and valuables, leaving families with a substantial financial burden.\n\nHome insurance can protect against such losses. It can cover damage caused by fire and smoke, lightning, storms, hail and other specified events. Add-on covers can provide protection against risks such as burglary, personal accidents, third-party liability and the cost of temporary accommodation if the house becomes uninhabitable.\n\nHomeowners must understand how home insurance works, how much cover they need and what the policy excludes.\n\nHome insurance typically has two components: the building and its contents. Homeowners can insure either or both, depending on their requirements. Building cover protects the structure, including walls, roofs, floors and permanent fixtures. Contents cover protects movable possessions such as furniture, electronics, appliances and clothing.\n\n\"To calculate the insured value of the building, you need to consider the reconstruction cost per square foot and multiply it by the built-up area of the house. Insurers can help homeowners estimate the applicable construction cost,\" said Gaurav Arora, chief of commercial lines & motor (underwriting & claims) at ICICI Lombard .\n\n\"For contents, homeowners should estimate the replacement cost or applicable insured value of their possessions and declare them under the relevant categories, such as electronics, appliances and clothing. The amount should reflect the value of the items being insured rather than an arbitrary figure,\" he added.\n\nExpensive possessions need particular attention.", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 12:25 PM IST", "pub_date_relative": "22m ago"}, {"title": "Budweiser brewer AB InBev hits profit forecasts, but costs on the rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:24 PM IST", "pub_date_relative": "23m ago"}, {"title": "Samsung Electronics shares slid despite record profit in the third-quarter", "full_content": "South Korean tech giant Samsung Electronics closed 4.13% lower on Thursday, paring earlier losses of as much as 5%, after the company reported third-quarter operating profit broadly in line with analysts' estimates.\n\nHere are Samsung's third-quarter results compared with LSEG SmartEstimates, which are weighted toward forecasts from analysts who are more consistently accurate:\n\nSamsung's revenue rose 126.88% year-on-year and 13.85% from the previous quarter, while operating profit rose 783.11% from a year earlier.\n\nThe company also announced 30 trillion won in cash dividends for the third quarter, equivalent to 4,601 won per common and preferred share.\n\nThe company plans to return another 55 trillion to 75 trillion won to shareholders this year through dividends and share buybacks, as the board will finalize the total shareholder returns and specific execution plans at a meeting scheduled for late January 2027.\n\nSamsung said it became the first global technology company to top 100 trillion won in quarterly operating profit, while posting record revenue and profit for a fourth straight quarter.\n\nIts semiconductor business reported 147.1 trillion won in revenue and 106.5 trillion won in operating profit, driven by strong demand for AI-related memory chips.\n\nFurthermore, its memory business also achieved record quarterly revenue and operating profit, supported by a significant ramp-up in HBM4 sales and growing demand for server solid-state drives.", "source": "CNBC World Economy", "pub_date_str": "29 Oct 2026, 12:23 PM IST", "pub_date_relative": "24m ago"}, {"title": "Sweco beats profit estimates with record third quarter margin", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:22 PM IST", "pub_date_relative": "25m ago"}, {"title": "STT hikes backfire? Zerodha's Nithin Kamath says traders are moving to \u2018riskier options trades\u2019", "full_content": "Zerodha co-founder Nithin Kamath, in his latest tweet, warned how higher securities transaction tax ( STT ) and other measures intended to curb futures and options (F&O) speculation may have led traders towards riskier trading behaviour.\n\n\u201cOne of the unintended consequences of increasing STT and all the other measures to curb F&O speculation is that they may have pushed traders toward even riskier trading behaviour,\u201d Kamath said in a post on X,\n\nKamath shared that approximately 50% of individual futures traders and 40% of option sellers on Zerodha were profitable, compared with just 10% of option buyers. He added that it was too early to assess the profitability of margin trading facility (MTF), given that it was a relatively new product.\n\nAccording to Kamath, Indian markets had evolved significantly and called for careful consideration of the broader effects of regulatory and taxation changes.\n\n\"Indian markets are no longer a backwater, the recent bear phase notwithstanding. We need careful thinking about second- and third-order effects, and thoughtful regulatory design and calibration,\" he noted.\n\nKamath highlighted the difference in profitability across trading segments, pointing to the relatively low proportion of profitable option buyers compared with futures traders and option sellers.\n\n\"Across Zerodha, here\u2019s roughly the percentage of individual traders who are profitable: Futures: \u224850%; Option sellers: \u224840%; Option buyers: \u224810%; MTF: too early to tell, considering it\u2019s a new product,\" he said.\n\nHe explained that although losses from buying options were limited to the premium paid, repeated options buying could result in greater cumulative losses over time compared with trading futures or selling options.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:21 PM IST", "pub_date_relative": "25m ago"}, {"title": "Satin Creditcare H1 FY27 slides: PAT nears full-year FY26 in 6 months", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:21 PM IST", "pub_date_relative": "26m ago"}, {"title": "AB InBev beats Q3 revenue and profit expectations on premium brands", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:20 PM IST", "pub_date_relative": "27m ago"}, {"title": "Jupiter Wagons share price rises fourth session straight; jumps 9% today; here's why | Check target, rationale", "full_content": "Jupiter Wagons share price surged over 9% to hit an intraday high of \u20b9 198 apiece on Thursday, October 29, after the company secured a major order worth \u20b9 1,140 crore from the Ministry of Railways.\n\nJupiter Wagons shares opened at \u20b9 186.24 on NSE today, as compared to previous close of \u20b9 181.05 on Wednesday\n\nIn an exchange filing on Thursday, Jupiter Wagons said the order was awarded by the Ministry of Railways (Railway Board). The order valued at \u20b9 1,140 crore.\n\nJupiter Wagons highlighted the diversity of its order book across public and private sector customers. Alongside its business with Indian Railways, the company continues to see strong demand from private freight operators and wagon leasing companies, supporting its private sector order book.\n\nThe latest railway order is expected to strengthen the company's order visibility and reinforce its presence in India's rail freight and mobility infrastructure segment.\n\n\u201cThe receipt of this order further reinforces the company's position as a key player in the railway rolling stock manufacturing sector and reflects its continued contribution towards meeting the Indian Railways\u2019 rolling stock requirements,\u201d said the company in a filing.\n\nLooking ahead, Jupiter Wagons expects incremental order inflows of approximately \u20b9 2,000 crore in the fourth quarter of the financial year 2026-27 (Q4 FY27).\n\nThe expected order inflows could provide further visibility into the company's future business prospects, with demand from both public sector railway projects and private freight operators remaining important growth drivers.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:19 PM IST", "pub_date_relative": "28m ago"}, {"title": "8th Pay Commission: 3 key union proposals on DA for employees and pensioners", "full_content": "The 8th Pay Commission was constituted on 3 November 2025 as a three-member temporary panel headed by Justice Ranjana Prakash Desai. Under its Terms of Reference (ToR), it has 18 months from its constitution to submit its final report to the central government, after hearing the views and grievances of eligible unions, associations and other stakeholders.\n\nOver the past few months, the commission has held meetings in several states and union territories, including Delhi, West Bengal, Ladakh and Uttar Pradesh. At these meetings, central government employee bodies have revived three long-pending demands on dearness allowance (DA) ahead of the final report: quarterly revisions instead of half-yearly hikes, merging DA with basic pay once it crosses 25%, and exempting DA from income tax.\n\nThese demands were recorded in the 6th Pay Commission\u2019s 2008 report and have now resurfaced in submissions to the 8th Pay Commission . The Bharat Pensioners Samaj (BPS), for example, seeks quarterly revisions to DA and dearness relief (DR), while the Federation of National Postal Organisations (FNPO) wants DA merged with basic pay, and DR with basic pension, once the rate crosses 25%.\n\nThese are currently only proposals, not approved changes. Employees and pensioners will know whether they have been accepted only after the commission tables its final report and the central government decides which recommendations to implement. Here is a closer look at each proposal and how it could affect future pay and allowances.\n\nAt present, the DA is revised twice a year, with changes taking effect on 1 January and 1 July, based on the latest inflation data. On 28 October, for instance, the Union Cabinet approved a 3% hike in DA for central government employees and DR for pensioners, effective 1 July 2026, according to a Press Information Bureau release.\n\nEmployee bodies now want revisions every three months to help salaries keep pace with rising living costs.", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 12:18 PM IST", "pub_date_relative": "29m ago"}, {"title": "India isn't out of the AI race as private equity investors see promise", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndia has largely been on the sidelines of the global artificial intelligence (AI) investment boom, with the US, China and Taiwan commanding greater attention. The market narrative suggests India could benefit if the AI trade loses steam elsewhere. Yet, private equity (PE) investors appear to see an opportunity in India's AI ecosystem, even as public-market investors have few sizeable listed companies through which to play the theme.\n\nIn its 19 October report, investment bank Goldman Sachs estimated that prospective initial public offerings (IPOs) over the next 2-5 years could add $50-$100 billion in incremental market capitalization to India's listed AI complex.\n\nDoes the growing interest of private equity investors in Indian AI companies suggest that equity market investors are underestimating India's role in the global AI value chain?\n\n\u201cIt\u2019s not about \u2018underestimating\u2019, but availability of paper,\u201d said Somnath Mukherjee, managing partner and chief investment officer, ASK Wealth Advisors.\n\nThere aren't many AI companies listed in India today, leaving equity market investors with few options to invest in the theme. The stocks that offer exposure to AI are also few in number, and most are too small to support investments at scale, he explained.\n\nHowever, the pipeline of AI companies that could eventually go public appears to be growing, as private investments help them scale up. PE investment in Indian AI startups tripled in 2025 to approximately $5 billion, from $1.6 billion in 2024, according to the Goldman Sachs report. Investment has gathered pace in 2026, with Indian AI startups already raising around $5 billion in the first eight to nine months, putting the sector on track to surpass last year's record for the full year.\n\nThe share of total PE funding for Indian AI startups has also quadrupled, rising from roughly 5% in 2024 to around 20% in 2026, the report highlighted.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:17 PM IST", "pub_date_relative": "29m ago"}, {"title": "AI Watchdogs, Cheaper MF Plans, IPO Checks: SEBI Chief's 10 Big Messages At NDTV Profit Ignite", "full_content": "Tuhin Kanta Pandey set out SEBI's priorities, from direct-plan defaults and IPO scrutiny to AI-led surveillance and easier entry for foreign investors.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 12:16 PM IST", "pub_date_relative": "31m ago"}, {"title": "Vedanta Aluminium more than doubles profit; cost cuts in focus to drive earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Vedanta Aluminium more than doubles profit; cost cuts in focus to drive earnings Vedanta Aluminium Metal Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Vedanta Aluminium more than doubles profit; cost cuts in focus to drive earnings SECTIONS Vedanta Aluminium more than doubles profit; cost cuts in focus to drive earnings By Nikita Periwal , ET Bureau Last Updated: Oct 29, 2026, 12:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vedanta Aluminium\u2019s September-quarter net profit more than doubled, while revenue rose 41% and EBITDA surged 83% year-on-year. The company expects higher production volumes and lower costs to support earnings despite declining aluminium prices. Production costs could fall 6% by year-end, aided by increased captive bauxite availability and operational efficiencies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips rnings stood at $4.89 per share, beating Wall Street expectations as strong demand for cloud computing and artificial intelligence supported growth across its business. (Sources: CNBC, BBC News, Microsoft Investor Relations, Reuters)\n\nMicrosoft's Azure cloud business recorded 48% year-on-year growth, with revenue reaching approximately $33.2 billion. The performance highlighted rising demand for cloud infrastructure required to train and run AI systems, reinforcing Azure's position as a key driver of Microsoft's expansion.\n\nMicrosoft cloud revenue climbed 30% year-on-year to $63.9 billion, supported by strong performance in Azure and Microsoft 365 commercial cloud services. Growing adoption of AI-powered offerings is strengthening Microsoft's recurring revenue base and expanding opportunities to monetise its investments in artificial intelligence.\n\nMicrosoft spent $45.2 billion on capital expenditure during the quarter, below the roughly $50 billion previously projected. The company also lowered its capital expenditure forecast for 2026 to $170 billion from $175 billion, partly reflecting delays in third-party computing capacity. Investors remain focused on whether the company's substantial AI infrastructure investments will generate sufficient returns.\n\nMicrosoft's net income rose 32% to $36.6 billion on a reported basis, while free cash flow reached $18.6 billion.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 11:53 AM IST", "pub_date_relative": "53m ago"}, {"title": "'2026 resembles 1991': CEA Nageswaran says India is at a critical economic inflection point", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a '2026 resembles 1991': CEA Nageswaran says India is at a critical economic inflection point The Economic Times daily newspaper is available online now. Read Today's Paper '2026 resembles 1991': CEA Nageswaran says India is at a critical economic inflection point SECTIONS '2026 resembles 1991': CEA Nageswaran says India is at a critical economic inflection point ET Online Last Updated: Oct 29, 2026, 12:13:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Chief Economic Advisor V Anantha Nageswaran emphasized that 2025-26 could be a significant inflection point for India's economy. He mentioned the challenges posed by global shocks and supply-side disruptions in recent years. The reliance on imported crude oil adds to India's vulnerability to fluctuating international energy prices. Strengthening resilience to external disruptions is crucial for managing such risks effectively.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nVIDEO | Delhi: 2026 resembles 1991, not in terms of balance of payment crisis, it was an inflection point then, 2025-26 should also be deemed as inflection point; very important inflection point for India right now, says V. Anantha Nageswaran, Chief Economic Advisor.(Full video available on PTI Videos - https://t.co/bIyFWTfmBd)\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding", "source": "Economic Times Economy", "pub_date_str": "29 Oct 2026, 11:53 AM IST", "pub_date_relative": "53m ago"}, {"title": "Janhvi Kapoor's Advice To Veer Pahariya Takes A Dig At THIS Actress: 'Never Take Her To Concerts'", "full_content": "Veer Pahariya and Tara Sutaria reportedly broke up in January 2026, a few weeks after the duo attended singer AP Dhillon's concert in Mumbai in December 2025.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:49 AM IST", "pub_date_relative": "57m ago"}, {"title": "Jefferies initiates coverage on NSE with \u2018Buy\u2019; here\u2019s why it sees fresh growth potential", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Jefferies initiates coverage on NSE with \u2018Buy\u2019; here\u2019s why it sees fresh growth potential BSE Share Price Multi Commodity Exchange of India Share Price Indian Energy Exchange Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jefferies initiates coverage on NSE with \u2018Buy\u2019; here\u2019s why it sees fresh growth potential SECTIONS Jefferies initiates coverage on NSE with \u2018Buy\u2019; here\u2019s why it sees fresh growth potential By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 29, 2026, 11:47:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jefferies has initiated coverage on NSE with a \u2018Buy\u2019 rating and a target price of Rs 2,085, indicating over 17% upside. The brokerage expects structural growth, market leadership, diversification and new businesses to drive a 15% revenue CAGR over FY27\u201329 and support margin expansion.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Sha "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Indian People Are Like F****Animals': Anita Ramaswamy Calls Out Spanish Traveller Over Alleged Racism On Flight", "full_content": "Indian American columnist Anita Ramaswamy alleges a Spanish traveller made a racist remark about Indians while boarding a Kathmandu to Delhi flight.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "HUL Q2 Review: Resilient Demand Trends Despite Inflation Keep Brokerages Bullish; HSBC Hikes Price Target", "full_content": "The sales growth was healthy at 15% along with the volume growth at 7%, HSBC underlined while maintaining a 'buy' rating.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 11:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sanofi Consumer share price jumps 11% after strong Q3 results | Is it time to book profits? Check target, rationale", "full_content": "Vaamanaa Sethi Published 29 Oct 2026, 11:34 AM IST Prefer Livemint on Google Sanofi Consumer Healthcare share price surged as much as 11% in Thursday's trading session after the company reported strong set of numbers during the September quarter FY27.\n\nSanofi Consumer shares opened at \u20b9 3,502.20 on NSE today, as compared to previous close of \u20b9 3,322.80 on Wednesday and touched an intraday high of \u20b9 3,771.90 on 29 October.\n\nSanofi Consumer Healthcare India reported a 22.2% year-on-year rise in consolidated profit to \u20b9 77 crore in the September quarter of calendar year 2026, compared with \u20b9 63 crore in the corresponding period last year.\n\nRevenue from operations increased 12.4% year-on-year to \u20b9 263 crore from \u20b9 234 crore. EBITDA rose to \u20b9 102 crore from \u20b9 85 crore, while the EBITDA margin improved to 38.7% from 36.4%. Meanwhile, total expenses climbed to \u20b9 164.8 crore from \u20b9 152.8 crore in the year-ago quarter.\n\nThe company reported 19% year-on-year growth in domestic sales. For the nine months ended September 2026, revenue from operations grew 16% to \u20b9 728 crore from \u20b9 627.4 crore in the corresponding period last year. Domestic sales increased 15%, supported by product relaunches, while exports recorded 19% growth.\n\nCommenting on the performance, Himanshu Bakshi, managing director of Sanofi Consumer Healthcare India, said the September-quarter results reflected the effective execution of the company's strategy and the strength of its product portfolio.\n\nHe added that growth was supported by higher volumes and market share gains across key brands. Continued investments in brand building, expanding distribution networks and engaging with healthcare professionals were also helping the company strengthen its reach among consumers.\n\nSanofi share price has gained 5.40% over the past week, indicating a recent recovery after sustained selling pressure. However, the stock has declined 11.07% over the past month and 24.60% year-to-date.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 11:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft stock jumps 4% as cloud growth drives earnings and revenue beat", "full_content": "Microsoft shares rose 4% in extended trading on Wednesday after the company reported better-than-expected quarterly results, driven by 48% growth in its Azure cloud infrastructure business.\n\nMicrosoft's revenue grew 19% year over year in the quarter, which ended on Sept. 30, according to a statement , with Azure now its biggest single business.\n\nThe software giant has been rapidly building out data center infrastructure to meet artificial intelligence demand, while also maintaining positive free cash flow unlike its fellow hyperscalers. Microsoft reported $45.2 billion worth of capital expenditures and finance leases during the quarter, up about 30% from a year earlier. Analysts surveyed by StreetAccount had projected $50.67 billion.\n\nWith respect to guidance, Microsoft called for $96 billion to $97.1 billion in fiscal second-quarter revenue, which works out to 18.8% growth at the middle of the range. Analysts polled by LSEG had predicted $95.60 billion in revenue.\n\nFor Azure, Microsoft's finance chief, Amy Hood, said on a conference call with analysts that she anticipates 49% to 50% growth at constant currency for the fiscal second quarter, compared with the 45.1% StreetAccount consensus.\n\nDuring the fiscal first quarter, Microsoft flagged a higher growth rate for cash paid for property and equipment than overall capital expenditures, which include finance leases. \"Some third-party capacity deliveries we expected in Q1 were delayed,\" Hood said.\n\nAround 75% of capital expenditures are now tied to short-lived assets such as Intel chips and Nvidia graphics processing units, up from about 66% in the past three quarters and half in the year-ago quarter.", "source": "CNBC World Economy", "pub_date_str": "29 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "City Union Bank shares rally 7% after Q2 net profit grows 27% YoY to Rs 416 Crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a City Union Bank shares rally 7% after Q2 net profit grows 27% YoY to Rs 416 Crore City Union Bank Share Price YES Bank Share Price Karur Vysya Bank Share Price Bandhan Bank Share Price South Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper City Union Bank shares rally 7% after Q2 net profit grows 27% YoY to Rs 416 Crore SECTIONS City Union Bank shares rally 7% after Q2 net profit grows 27% YoY to Rs 416 Crore By Surbhi Khanna , ET Online Last Updated: Oct 29, 2026, 11:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Ci buy?", "full_content": "Pranati Deva Published 29 Oct 2026, 11:23 AM IST Prefer Livemint on Google Hero Motors share price : Hero Motors shares have surged 46% from their IPO issue price of \u20b9 84, with the stock hitting its third consecutive 5% upper circuit on October 29.\n\nThe sharp rally has put the recently listed stock back on investors\u2019 radar, supported by strong September-quarter earnings and improving operating performance.\n\nHero Motors shares were locked in a 5% upper circuit at \u20b9 122.40 in intraday trade on Thursday, October 29, marking the third consecutive session in which the stock hit its upper price band. The stock opened at \u20b9 120 apiece on the BSE before climbing to its upper circuit level.\n\nThe shares have gained nearly 16% over the past three trading sessions and are now up approximately 46% from their IPO issue price of \u20b9 84. However, the stock's recent momentum comes against a mixed short-term performance: it has declined around 12% over the past month while gaining approximately 5% in a week.\n\nHero Motors made its stock market debut on September 23, 2026, listing at a discount to its IPO price. The shares opened at \u20b9 82.10 on the BSE, down 2.26% from the issue price of \u20b9 84, before recovering sharply to close at \u20b9 98.51, representing a gain of 17.27% over the IPO price.\n\nThe company's strong quarterly performance has provided a fundamental trigger for investor interest. On October 13, Hero Motors reported a 115.6% year-on-year increase in net profit to \u20b9 10.2 crore for the quarter ended September 2026, compared with \u20b9 4.73 crore in the corresponding quarter of the previous year.\n\nRevenue from operations rose 24.9% year-on-year to \u20b9 319.3 crore from \u20b9 255.7 crore. Operating performance improved even more sharply, with earnings before interest, tax, depreciation and amortisation (EBITDA) climbing 92% to \u20b9 35.9 crore from \u20b9 18.7 crore a year earlier.\n\nThe EBITDA margin expanded to 11.3% from 7.3%, marking an improvement of approximately 400 basis points.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 11:23 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "HUL shares rise 3% after Q2 results. Jefferies, Nomura cut target price but forecast 29% upside potential", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a HUL shares rise 3% after Q2 results. Jefferies, Nomura cut target price but forecast 29% upside potential JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper HUL shares rise 3% after Q2 results. Jefferies, Nomura cut target price but forecast 29% upside potential SECTIONS HUL shares rise 3% after Q2 results. Jefferies, Nomura cut target price but forecast 29% upside potential By Veer Sharma , ETMarkets.com Last Updated: Oct 29, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Hindustan Unilever shares rose on Thursday after the FMCG major reported a 4% year-on-year increase in Q2 FY27 net profit to Rs 2,790 crore and 15% revenue growth to Rs 18,226 crore. Jefferies, Nomura and JM Financial cut their target prices but continue to see upside potential of up to 29%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI ing large bond sale and a weak rupee limited the extent of the gains observed. The benchmark 6.94% 2036 bond yield fell slightly below the significant 7.40% level during early trading hours. Meanwhile, the Reserve Bank of India previously raised the repo rate amid ongoing inflation concerns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 12:37 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Adidas achieves record Q3 profit, raises full-year outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:34 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global Market: ECB rate decision in focus as Lagarde exit speculation grows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: ECB rate decision in focus as Lagarde exit speculation grows Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: ECB rate decision in focus as Lagarde exit speculation grows SECTIONS Global Market: ECB rate decision in focus as Lagarde exit speculation grows By Anupam Nagar , ETMarkets.com Last Updated: Oct 29, 2026, 12:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The European Central Bank is expected to hold interest rates steady as oil-driven inflation risks, rising French borrowing costs and uncertainty over President Christine Lagarde's future complicate the central bank's monetary policy outlook.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 12:33 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tencent, Visa deepen payments push in China after regulatory green light", "full_content": "Tencent and Visa are expanding their partnership in cross-border payments and AI-powered commerce, the companies said Thursday, deepening their push into China\u2019s payments market.\n\nThe agreement follows fresh regulatory approvals for U.S. financial firms in China, with Visa and Citi receiving the green light this month to expand their operations in the world\u2019s second-largest economy.\n\nUnder the memorandum of understanding, Tencent and Visa will explore ways to make payments easier for travelers entering and leaving China while expanding their cross-border money transfer partnership.\n\nThe companies also plan to develop payment solutions that would allow travelers to pay participating merchants through Tencent\u2019s Weixin Pay and Visa networks, subject to regulatory requirements.\n\nThey also aim to expand their collaboration through Visa Direct, Visa\u2019s money transfer service, making it easier for overseas users to send funds into the Weixin Pay ecosystem.\n\nThe partnership will also extend to agentic commerce, an emerging form of online shopping in which AI agents can help consumers find, select and purchase products or services.\n\nDowson Tong, Tencent's senior executive vice president and CEO of its Cloud and Smart Industries Group, said the partnership would combine Tencent's AI capabilities with Visa's global network to improve cross-border payments.\n\n\"We hope to create more seamless commerce experiences for consumers and new opportunities for businesses, both in China and internationally,\" he said.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 12:31 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "\u20b91000 SIP, 10 years, top equity mutual funds calculator: How do regular plans reduce your final corpus vs direct plans?", "full_content": "Direct and regular mutual fund plans invest in the same portfolio and are managed by the same fund manager. However, their returns can differ because of how investors purchase them and the costs involved.\n\nYou may find both plans on the same platforms, but direct plans are routed directly through the asset management company (AMC), while regular plans are bought through intermediaries such as brokers or mutual fund distributors.\n\nSince regular plans include distribution-related costs, they have a higher expense ratio, which can reduce investors\u2019 returns over time.\n\nTo improve transparency around these costs, Securities and Exchange Board of India ( SEBI ) Chairman Tuhin Kanta Pandey said in his address at NDTV Profit IGNITE, released on Wednesday, \u201cFrom November 1, Direct Plans will be the default option on digital platforms of AMCs. Investors choosing Regular Plans must be informed about their higher expense ratio.\u201d\n\nThe total expense ratio (TER) covers the costs of running and managing a mutual fund scheme and is expressed as a percentage of its average net asset value (NAV). These expenses are deducted before the daily NAV is disclosed, affecting the returns investors ultimately receive.\n\nBut how much difference can choosing a regular plan over a direct plan of the same equity mutual fund make to your final corpus over 10 years? Here's what the numbers show.\n\nThe table below compares the 10-year SIP returns of the top five equity funds based on direct-plan performance, alongside the corresponding regular-plan returns and the final corpus from a \u20b9 1,000 monthly SIP.\n\n*Source: Value Research; Returns as on 28 October 2026; 10-year XIRR returns", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 12:31 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Volkswagen loss widens more than expected in Q3, raising restructuring stakes", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:30 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hyundai Motor India shares gain 5% despite profit slump; Why brokerages remain bullish | Check target prices", "full_content": "Dhanya Nagasundaram Published 29 Oct 2026, 12:28 PM IST Prefer Livemint on Google Hyundai Motor India shares jumped over 5% on Thursday, 29 October, following the automaker\u2019s Q2 FY27 results, despite a year-on-year decline in quarterly profit due to elevated input costs.\n\nThe company reported a 23.9% year-on-year drop in consolidated net profit to \u20b9 1,196.16 crore for the quarter ended September, compared with \u20b9 1,572.25 crore in the corresponding period last year.\n\nHowever, Hyundai Motor India Ltd (HMIL) recorded its highest-ever quarterly sales of 2,19,072 units during the quarter, marking growth of 15% year-on-year and 23% sequentially. Revenue from operations rose to \u20b9 20,696.05 crore in Q2 FY27 from \u20b9 17,460.82 crore a year earlier, according to a regulatory filing.\n\nTotal expenses increased to \u20b9 19,302.18 crore from \u20b9 15,566.06 crore in the year-ago quarter, driven by higher material costs, which weighed on profitability.\n\nCommenting on the performance, Tarun Garg, Managing Director and Chief Executive Officer of HMIL, said Q2 FY27 was a milestone quarter for the company, with record sales volumes and quarterly revenue crossing \u20b9 20,000 crore for the first time since its inception. However, he noted that elevated commodity costs had affected profitability.\n\nLooking ahead, Garg said the company expects momentum to accelerate in the second half of FY27. He added that the launch of the Bayon marks the beginning of Hyundai\u2019s product cycle, while the company is preparing to introduce a dedicated mass-market electric vehicle in Q4 FY27.\n\nMotilal Oswal Financial Services reiterated its \u2018Buy\u2019 rating on Hyundai Motor India, with a target price of \u20b9 2,300, implying an upside of around 23% from the current market price of \u20b9 1,875.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:28 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Budweiser brewer AB InBev hits profit forecasts, but costs on the rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:24 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Samsung Electronics shares slid despite record profit in the third-quarter", "full_content": "South Korean tech giant Samsung Electronics closed 4.13% lower on Thursday, paring earlier losses of as much as 5%, after the company reported third-quarter operating profit broadly in line with analysts' estimates.\n\nHere are Samsung's third-quarter results compared with LSEG SmartEstimates, which are weighted toward forecasts from analysts who are more consistently accurate:\n\nSamsung's revenue rose 126.88% year-on-year and 13.85% from the previous quarter, while operating profit rose 783.11% from a year earlier.\n\nThe company also announced 30 trillion won in cash dividends for the third quarter, equivalent to 4,601 won per common and preferred share.\n\nThe company plans to return another 55 trillion to 75 trillion won to shareholders this year through dividends and share buybacks, as the board will finalize the total shareholder returns and specific execution plans at a meeting scheduled for late January 2027.\n\nSamsung said it became the first global technology company to top 100 trillion won in quarterly operating profit, while posting record revenue and profit for a fourth straight quarter.\n\nIts semiconductor business reported 147.1 trillion won in revenue and 106.5 trillion won in operating profit, driven by strong demand for AI-related memory chips.\n\nFurthermore, its memory business also achieved record quarterly revenue and operating profit, supported by a significant ramp-up in HBM4 sales and growing demand for server solid-state drives.", "source": "CNBC World Economy", "pub_date_str": "29 Oct 2026, 12:23 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sweco beats profit estimates with record third quarter margin", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:22 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "STT hikes backfire? Zerodha's Nithin Kamath says traders are moving to \u2018riskier options trades\u2019", "full_content": "Zerodha co-founder Nithin Kamath, in his latest tweet, warned how higher securities transaction tax ( STT ) and other measures intended to curb futures and options (F&O) speculation may have led traders towards riskier trading behaviour.\n\n\u201cOne of the unintended consequences of increasing STT and all the other measures to curb F&O speculation is that they may have pushed traders toward even riskier trading behaviour,\u201d Kamath said in a post on X,\n\nKamath shared that approximately 50% of individual futures traders and 40% of option sellers on Zerodha were profitable, compared with just 10% of option buyers. He added that it was too early to assess the profitability of margin trading facility (MTF), given that it was a relatively new product.\n\nAccording to Kamath, Indian markets had evolved significantly and called for careful consideration of the broader effects of regulatory and taxation changes.\n\n\"Indian markets are no longer a backwater, the recent bear phase notwithstanding. We need careful thinking about second- and third-order effects, and thoughtful regulatory design and calibration,\" he noted.\n\nKamath highlighted the difference in profitability across trading segments, pointing to the relatively low proportion of profitable option buyers compared with futures traders and option sellers.\n\n\"Across Zerodha, here\u2019s roughly the percentage of individual traders who are profitable: Futures: \u224850%; Option sellers: \u224840%; Option buyers: \u224810%; MTF: too early to tell, considering it\u2019s a new product,\" he said.\n\nHe explained that although losses from buying options were limited to the premium paid, repeated options buying could result in greater cumulative losses over time compared with trading futures or selling options.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:21 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "AB InBev beats Q3 revenue and profit expectations on premium brands", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 12:20 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jupiter Wagons share price rises fourth session straight; jumps 9% today; here's why | Check target, rationale", "full_content": "Jupiter Wagons share price surged over 9% to hit an intraday high of \u20b9 198 apiece on Thursday, October 29, after the company secured a major order worth \u20b9 1,140 crore from the Ministry of Railways.\n\nJupiter Wagons shares opened at \u20b9 186.24 on NSE today, as compared to previous close of \u20b9 181.05 on Wednesday\n\nIn an exchange filing on Thursday, Jupiter Wagons said the order was awarded by the Ministry of Railways (Railway Board). The order valued at \u20b9 1,140 crore.\n\nJupiter Wagons highlighted the diversity of its order book across public and private sector customers. Alongside its business with Indian Railways, the company continues to see strong demand from private freight operators and wagon leasing companies, supporting its private sector order book.\n\nThe latest railway order is expected to strengthen the company's order visibility and reinforce its presence in India's rail freight and mobility infrastructure segment.\n\n\u201cThe receipt of this order further reinforces the company's position as a key player in the railway rolling stock manufacturing sector and reflects its continued contribution towards meeting the Indian Railways\u2019 rolling stock requirements,\u201d said the company in a filing.\n\nLooking ahead, Jupiter Wagons expects incremental order inflows of approximately \u20b9 2,000 crore in the fourth quarter of the financial year 2026-27 (Q4 FY27).\n\nThe expected order inflows could provide further visibility into the company's future business prospects, with demand from both public sector railway projects and private freight operators remaining important growth drivers.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:19 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "8th Pay Commission: 3 key union proposals on DA for employees and pensioners", "full_content": "The 8th Pay Commission was constituted on 3 November 2025 as a three-member temporary panel headed by Justice Ranjana Prakash Desai. Under its Terms of Reference (ToR), it has 18 months from its constitution to submit its final report to the central government, after hearing the views and grievances of eligible unions, associations and other stakeholders.\n\nOver the past few months, the commission has held meetings in several states and union territories, including Delhi, West Bengal, Ladakh and Uttar Pradesh. At these meetings, central government employee bodies have revived three long-pending demands on dearness allowance (DA) ahead of the final report: quarterly revisions instead of half-yearly hikes, merging DA with basic pay once it crosses 25%, and exempting DA from income tax.\n\nThese demands were recorded in the 6th Pay Commission\u2019s 2008 report and have now resurfaced in submissions to the 8th Pay Commission . The Bharat Pensioners Samaj (BPS), for example, seeks quarterly revisions to DA and dearness relief (DR), while the Federation of National Postal Organisations (FNPO) wants DA merged with basic pay, and DR with basic pension, once the rate crosses 25%.\n\nThese are currently only proposals, not approved changes. Employees and pensioners will know whether they have been accepted only after the commission tables its final report and the central government decides which recommendations to implement. Here is a closer look at each proposal and how it could affect future pay and allowances.\n\nAt present, the DA is revised twice a year, with changes taking effect on 1 January and 1 July, based on the latest inflation data. On 28 October, for instance, the Union Cabinet approved a 3% hike in DA for central government employees and DR for pensioners, effective 1 July 2026, according to a Press Information Bureau release.\n\nEmployee bodies now want revisions every three months to help salaries keep pace with rising living costs.", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 12:18 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India isn't out of the AI race as private equity investors see promise", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndia has largely been on the sidelines of the global artificial intelligence (AI) investment boom, with the US, China and Taiwan commanding greater attention. The market narrative suggests India could benefit if the AI trade loses steam elsewhere. Yet, private equity (PE) investors appear to see an opportunity in India's AI ecosystem, even as public-market investors have few sizeable listed companies through which to play the theme.\n\nIn its 19 October report, investment bank Goldman Sachs estimated that prospective initial public offerings (IPOs) over the next 2-5 years could add $50-$100 billion in incremental market capitalization to India's listed AI complex.\n\nDoes the growing interest of private equity investors in Indian AI companies suggest that equity market investors are underestimating India's role in the global AI value chain?\n\n\u201cIt\u2019s not about \u2018underestimating\u2019, but availability of paper,\u201d said Somnath Mukherjee, managing partner and chief investment officer, ASK Wealth Advisors.\n\nThere aren't many AI companies listed in India today, leaving equity market investors with few options to invest in the theme. The stocks that offer exposure to AI are also few in number, and most are too small to support investments at scale, he explained.\n\nHowever, the pipeline of AI companies that could eventually go public appears to be growing, as private investments help them scale up. PE investment in Indian AI startups tripled in 2025 to approximately $5 billion, from $1.6 billion in 2024, according to the Goldman Sachs report. Investment has gathered pace in 2026, with Indian AI startups already raising around $5 billion in the first eight to nine months, putting the sector on track to surpass last year's record for the full year.\n\nThe share of total PE funding for Indian AI startups has also quadrupled, rising from roughly 5% in 2024 to around 20% in 2026, the report highlighted.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 12:17 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI Watchdogs, Cheaper MF Plans, IPO Checks: SEBI Chief's 10 Big Messages At NDTV Profit Ignite", "full_content": "Tuhin Kanta Pandey set out SEBI's priorities, from direct-plan defaults and IPO scrutiny to AI-led surveillance and easier entry for foreign investors.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 12:16 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Vedanta Aluminium more than doubles profit; cost cuts in focus to drive earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Vedanta Aluminium more than doubles profit; cost cuts in focus to drive earnings Vedanta Aluminium Metal Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Vedanta Aluminium more than doubles profit; cost cuts in focus to drive earnings SECTIONS Vedanta Aluminium more than doubles profit; cost cuts in focus to drive earnings By Nikita Periwal , ET Bureau Last Updated: Oct 29, 2026, 12:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vedanta Aluminium\u2019s September-quarter net profit more than doubled, while revenue rose 41% and EBITDA surged 83% year-on-year. The company expects higher production volumes and lower costs to support earnings despite declining aluminium prices. Production costs could fall 6% by year-end, aided by increased captive bauxite availability and operational efficiencies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now its business. (Sources: CNBC, BBC News, Microsoft Investor Relations, Reuters)\n\nMicrosoft's Azure cloud business recorded 48% year-on-year growth, with revenue reaching approximately $33.2 billion. The performance highlighted rising demand for cloud infrastructure required to train and run AI systems, reinforcing Azure's position as a key driver of Microsoft's expansion.\n\nMicrosoft cloud revenue climbed 30% year-on-year to $63.9 billion, supported by strong performance in Azure and Microsoft 365 commercial cloud services. Growing adoption of AI-powered offerings is strengthening Microsoft's recurring revenue base and expanding opportunities to monetise its investments in artificial intelligence.\n\nMicrosoft spent $45.2 billion on capital expenditure during the quarter, below the roughly $50 billion previously projected. The company also lowered its capital expenditure forecast for 2026 to $170 billion from $175 billion, partly reflecting delays in third-party computing capacity. Investors remain focused on whether the company's substantial AI infrastructure investments will generate sufficient returns.\n\nMicrosoft's net income rose 32% to $36.6 billion on a reported basis, while free cash flow reached $18.6 billion.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 11:53 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'2026 resembles 1991': CEA Nageswaran says India is at a critical economic inflection point", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a '2026 resembles 1991': CEA Nageswaran says India is at a critical economic inflection point The Economic Times daily newspaper is avail wth.\n\nCommenting on the performance, Himanshu Bakshi, managing director of Sanofi Consumer Healthcare India, said the September-quarter results reflected the effective execution of the company's strategy and the strength of its product portfolio.\n\nHe added that growth was supported by higher volumes and market share gains across key brands. Continued investments in brand building, expanding distribution networks and engaging with healthcare professionals were also helping the company strengthen its reach among consumers.\n\nSanofi share price has gained 5.40% over the past week, indicating a recent recovery after sustained selling pressure. However, the stock has declined 11.07% over the past month and 24.60% year-to-date.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 11:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Microsoft stock jumps 4% as cloud growth drives earnings and revenue beat", "full_content": "Microsoft shares rose 4% in extended trading on Wednesday after the company reported better-than-expected quarterly results, driven by 48% growth in its Azure cloud infrastructure business.\n\nMicrosoft's revenue grew 19% year over year in the quarter, which ended on Sept. 30, according to a statement , with Azure now its biggest single business.\n\nThe software giant has been rapidly building out data center infrastructure to meet artificial intelligence demand, while also maintaining positive free cash flow unlike its fellow hyperscalers. Microsoft reported $45.2 billion worth of capital expenditures and finance leases during the quarter, up about 30% from a year earlier. Analysts surveyed by StreetAccount had projected $50.67 billion.\n\nWith respect to guidance, Microsoft called for $96 billion to $97.1 billion in fiscal second-quarter revenue, which works out to 18.8% growth at the middle of the range. Analysts polled by LSEG had predicted $95.60 billion in revenue.\n\nFor Azure, Microsoft's finance chief, Amy Hood, said on a conference call with analysts that she anticipates 49% to 50% growth at constant currency for the fiscal second quarter, compared with the 45.1% StreetAccount consensus.\n\nDuring the fiscal first quarter, Microsoft flagged a higher growth rate for cash paid for property and equipment than overall capital expenditures, which include finance leases. \"Some third-party capacity deliveries we expected in Q1 were delayed,\" Hood said.\n\nAround 75% of capital expenditures are now tied to short-lived assets such as Intel chips and Nvidia graphics processing units, up from about 66% in the past three quarters and half in the year-ago quarter.", "source": "CNBC World Economy", "pub_date_str": "29 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "City Union Bank shares rally 7% after Q2 net profit grows 27% YoY to Rs 416 Crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a City Union Bank shares rally 7% after Q2 net profit grows 27% YoY to Rs 416 Crore City Union Bank Share Price YES Bank Share Price Karur Vysya Bank Share Price Bandhan Bank Share Price South Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper City Union Bank shares rally 7% after Q2 net profit grows 27% YoY to Rs 416 Crore SECTIONS City Union Bank shares rally 7% after Q2 net profit grows 27% YoY to Rs 416 Crore By Surbhi Khanna , ET Online Last Updated: Oct 29, 2026, 11:31:00 AM IST Rate Story Follow us Share Font Size Abc Sma     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
