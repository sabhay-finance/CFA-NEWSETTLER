lysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US' Russia sanction waiver a relief for India's exporters, energy security: Experts", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a US' Russia sanction waiver a relief for India's exporters, energy security: Experts The Economic Times daily newspaper is available online now. Read Today's Paper US' Russia sanction waiver a relief for India's exporters, energy security: Experts SECTIONS US' Russia sanction waiver a relief for India's exporters, energy security: Experts PTI Last Updated: Oct 17, 2026, 06:10:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The waiver of sanctions under the Sanctioning Russia and Iran Act provides relief for India's energy security. Experts believe that continued access to Russian crude will support economic growth and ease inflationary pressures. While the waiver offers temporary relief, uncertainty remains regarding future contracts and investments. Trade organizations express hope for improving bilateral trade relations and advancing discussions between India and the US.\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nThe ABCD of the US mid-term elections \u2013 Part 1: Why it matters across the globe\n\nCurbing rupee bets: What the RBI\u2019s new rules mean for the hedge-now-or-wait question\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nThe NBFC saga - Part 3: How one default in 2018 changed the way RBI reads risk\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "17 Oct 2026, 06:10 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Silver\u2019s recent 50% drop from a record high hints that an economic slowdown looms", "full_content": "There\u2019s a relatively off-the-radar commodity that can provide hints on where the economy is headed \u2014 and it\u2019s seen its value drop more than 50% from a record high earlier this year.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 06:00 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Central Bank of India Q2 profit rises 21% as loans grow 30%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Central Bank of India Q2 profit rises 21% as loans grow 30% Central Bank of India Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price Canara Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Central Bank of India Q2 profit rises 21% as loans grow 30% SECTIONS Central Bank of India Q2 profit rises 21% as loans grow 30% By Joel Rebello , ET Bureau Last Updated: Oct 17, 2026, 05:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Central Bank of India reported a 21% rise in September 2026 quarterly net profit to Rs 1,469 crore, supported by 26% net interest income growth and 30% loan expansion. Asset quality improved, with net NPA declining to 0.31%, while operating efficiency strengthened.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 05:44 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Microsoft, Shopify and 3 more AI stocks that are favorite Wall Street earnings plays", "full_content": "As earnings season kicks off, select tech companies have the opportunity to deliver big positive surprises for investors.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 05:31 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Southwest's seismic shift, a huge Delta sweet spot, downgrading premium cards, and more (Week in Review) - Frequent Miler", "full_content": "Southwest's seismic shift, a huge Delta sweet spot, downgrading premium cards, and more (Week in Review) Frequent Miler Southwest just updated Rapid Rewards: What to know about the new elite status tiers Yahoo Finance Southwest is overhauling its frequent flyer program. Here's what's changing CNBC Early Look: Inside Southwest\u2019s Upcoming Lounges NerdWallet Southwest unveils new perks for flyers in rewards program shake-up Fox Business", "source": "Google News Business", "pub_date_str": "17 Oct 2026, 05:29 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nifty soars 2.8% this week: What lies ahead for Dalal Street? - Experts decode 5 triggers, key levels for next week", "full_content": "Stock Market Outlook : Indian equities staged a strong comeback this week, with the Nifty 50 rising 2.77% and the Sensex surging 3.11%, as renewed buying in information technology (IT) stocks, easing global bond-yield pressures and resilient domestic institutional inflows lifted investor sentiment.\n\nBoth benchmarks also extended their gains for a second consecutive session on Friday, strengthening hopes of a recovery after the recent market correction.\n\nOn Friday, the Sensex climbed 413.66 points, or 0.56%, to close at 74,729.27 on Friday, while the Nifty advanced 148.80 points, or 0.65%, to settle at 23,146.15. For the week, the Sensex gained 2,256.94 points, while the Nifty added 625.7 points.\n\nHowever, the rally faces several tests, including whether earnings growth broadens beyond IT, foreign investor selling eases further and the Nifty breaks through immediate resistance. Market experts believe investors should remain selective as global macroeconomic uncertainty and domestic inflation concerns persist.\n\nThe September-quarter earnings season will remain a major driver of market sentiment. Investors will assess whether companies can deliver stronger revenue growth and margins across banking, consumption and industrials, rather than relying primarily on IT stocks to sustain the recovery.\n\nVinod Nair, Head of Research at Geojit Investments Limited, said, \u201cThe sustainability of the recovery will hinge on earnings growth broadening beyond IT, with revenue and margin delivery across financials, consumption and industrials under close scrutiny.\u201d\n\nForeign institutional investor (FII) flows remain a key variable for the market.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 05:04 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold FoFs halt fresh investments, but silver mutual funds remain open: Experts decode the reasons and explain what to do", "full_content": "Investors can gain exposure to gold and silver through exchange-traded funds (ETFs), fund of funds (FoFs), and FOFs combining both metals. While ETFs trade on stock exchanges like shares and are backed by physical metal, FoFs invest in underlying ETFs and are priced at the end of the day.\n\nFollowing notices issued on 15 October 2026, several mutual fund houses have restricted fresh investments in gold FoFs and gold-silver FoFs , while gold ETFs, silver ETFs and FoFs remain open. Existing registered SIP s and STPs generally continue, while redemptions remain available.\n\nThe experts suggest that the move aims to curb gold imports and explain what investors should do.\n\nHarsh Vardhan Dawar, ACA, CFA, FRM, Founder of Wealth Cafe, said the restrictions align with the government's efforts to discourage gold investment and to offset some of the excess demand for physical gold as a result of the current festive season of Dussehra and Diwali, which also marks the wedding season of the year.\n\nEshaan Lazarus, Founder and CEO of 021 Trade, said gold has a greater impact on India's import bill. In FY2025-26, gold imports stood at about $72 billion against $12 billion for silver. During April-September 2026, gold imports were $19.27 billion and silver imports $2.40 billion, both lower year-on-year, partly following the May increase in import duty from 6% to 15%.\n\nHarsh Soni, Founder of NYVO Money, pointed to additional pressures, including rupee depreciation and Brent crude prices remaining above $105 a barrel. While oil imports are essential, gold imports can be curbed to ease pressure on the country's external balances.\n\n\u201cRestricting silver imports would hit manufacturing demand, not just investment demand. Silver has no cultural buying surge comparable to gold's Dhanteras peak,\u201d Soni added.\n\n\u201cIf silver inflows swell sharply, the same logic could be applied.", "source": "LiveMint Money", "pub_date_str": "17 Oct 2026, 05:00 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "It was another great week for the average stock as market leadership shifts away from tech", "full_content": "The S&P 500\u2019s tech sector just had its worst week in a year and a half, while an equal-weighted version of the index cemented a second-straight weekly advance.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 05:00 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Best 3 stocks to buy under \u20b9100: Equitas SFB, UCO Bank, Suzlon by Mehul Kothari of Anand Rathi \u2014 Target, stop-loss", "full_content": "Stocks to buy under \u20b9 100 | Mehul Kothari's stock recommendations: The Indian stock market recorded its strongest weekly gains in nearly six months for the week ended October 16, 2026, with the Sensex rising 3.11% to 74,729 and the Nifty 50 index gaining 2.8% to 23,146, marking their second consecutive weekly advance.\n\nThe rally was led by a spectacular 11.7% surge in the Nifty IT index, its biggest weekly gain in nearly 18 years, supported by strong Q2 results 2026 and a global rotation towards traditional technology stocks.\n\nHighlighting the major triggers, which fueled buying in Sensex, Nifty and other index-listed stocks, Mehul Kothari, Deputy Vice President \u2014 Technical Research at Anand Rathi, said, \u201cA stronger Indian Rupee, softer crude oil prices, domestic institutional buying and optimism around a potential India-US trade deal further supported sentiment. However, the rally remained concentrated in large caps, with midcaps posting modest gains while smallcaps largely lagged, alongside weakness in FMCG and pharma stocks.\u201d\n\nSpeaking on the outlook for the Nifty 50 index, Mehul Kothari said, the 50-stock index has staged a remarkable recovery, rallying nearly 1,000 points from its recent low of around 22,150 to a high near 23,150 in a short span. This validates our earlier stance of not panicking during the breakdown near 22,200, as highlighted by the \u2018Triple Bullish Divergence\u2019 on RSI across NIFTY 50, NIFTY 500, NIFTY MIDCAP 100 and NIFTY MIDCAP 150.\n\n\u201cWith selling pressure easing and momentum improving, we now maintain our BUY ON DIPS stance. The crucial support has shifted to 22,600, and holding above this level will keep bullish confidence intact. On the upside, 23,200 remains the immediate hurdle, and a sustained breakout above it could open the door towards 23,600 in the coming week.", "source": "LiveMint Markets", "pub_date_str": "17 Oct 2026, 04:58 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rising borrowing costs signal funding risks for global AI expansion: Jefferies report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politic amental CFA exam areas."}, {"title": "AI race may depend more on access to power, infrastructure than chip supply: Morgan Stanley", "full_content": "According to Morgan Stanley's latest analysis, the burgeoning AI infrastructure market is on track to experience a dire electricity shortfall by 2028. This impending shortage poses a serious risk for smaller enterprises striving to keep pace with their larger counterparts. A predicted 32-gigawatt power deficit threatens data-center development and chip deployment. While global strategies might be an option for some, the internal power dilemmas in the U.S. will persist.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 04:32 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Fed interest-rate decision this month is a closer call than markets think", "full_content": "Here are some of the arguments against a Fed rate hike \u2014 and why some economists disagree with them.", "source": "MarketWatch Top Stories", "pub_date_str": "17 Oct 2026, 04:30 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ixigo Q2 profit at Rs 63 cr on robust show in hotel booking biz", "full_content": "Ixigo reported a remarkable turnaround with a consolidated net profit of Rs 63.42 crore for the September quarter, bouncing back from a net loss of Rs 3.46 crore from last year. The surge in hotel bookings played a key role in this financial upswing, leading to operational revenue of Rs 320.96 crore.", "source": "Economic Times Markets", "pub_date_str": "17 Oct 2026, 04:21 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 top     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
