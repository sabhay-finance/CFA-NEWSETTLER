aints and foreign exchange headwinds.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 03:47 AM IST", "pub_date_relative": "6m ago"}, {"title": "Pampa Energia ADR earnings missed by $2.40, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:46 AM IST", "pub_date_relative": "6m ago"}, {"title": "PodcastOne director Ramin Arani resigns from board and committees", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:46 AM IST", "pub_date_relative": "7m ago"}, {"title": "Saba Capital Management sells $707,288 of PIMCO Dynamic Income Strategy Fund shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:46 AM IST", "pub_date_relative": "7m ago"}, {"title": "Hillman Solutions earnings beat by $0.01, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:44 AM IST", "pub_date_relative": "8m ago"}, {"title": "Earnings call transcript: Bioventus Q3 2026 revenue miss sparks sharp selloff", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:43 AM IST", "pub_date_relative": "10m ago"}, {"title": "Apple results beat Wall Street expectations on strong iPhone sales", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:43 AM IST", "pub_date_relative": "10m ago"}, {"title": "Earnings call transcript: Offerpad misses Q3 2026 estimates as housing pressure deepens", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:42 AM IST", "pub_date_relative": "10m ago"}, {"title": "Stocks making the biggest moves after hours: Fabrinet, Clorox, Apple, Palantir & more", "full_content": "Here are some of the companies making headlines in extended trading.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 03:37 AM IST", "pub_date_relative": "16m ago"}, {"title": "Traders rushing into a leveraged ETF to make a bullish bet on the Nasdaq-100 just got burned", "full_content": "Some investors appeared a little too eager to buy the dip in technology stocks last month.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 03:33 AM IST", "pub_date_relative": "20m ago"}, {"title": "Treasury Yields Extend Past Month\u2019s Slide as Oil Prices Drop", "full_content": "(Bloomberg) -- Treasuries rose, building on their biggest monthly advance in more than two years, as tumbling oil prices eased concern about inflation pressure leading to additional Federal Reserve interest-rate hikes.\n\nTen- to 30-year maturities led gains, with yields for those tenors declining about four basis points to touch the lowest levels since September.\n\nShorter-dated debt rose less as lower oil prices helped stabilize US stocks. Equities weakness concentrated in large technology company shares benefited the Treasury market last month as investors piled into lower-risk assets.\n\n\u201cThe historical negative correlation between bonds and equities seems to have returned over the past month, and the gains today could be related to investors looking to protect further downside in equities,\u201d said Steven Zeng, an interest-rate strategist at Deutsche Bank. The oil price slide \u201calso supports Treasury yields to move lower.\u201d\n\nThe US 10-year yield declined as much as six basis points to under 4.87%, the lowest level since Sept. 10.\n\nWest Texas Intermediate futures slid 7.4% to settle near $96.50 a barrel after Washington and Tehran signaled openness to talks to resolve the months-long conflict roiling Middle East energy supplies.\n\nFed policymakers raised rates in September for the first time since 2023 after rising oil prices caused inflation to accelerate. Traders continue to price in at least two more quarter-point hikes by the end of next year, however the cumulative amount of expected tightening has declined over the past month.\n\nShort-term Treasury yields falling less than longer-term ones \u201cis likely a consequence of the sharp post-FOMC steepening move\u201d following last week\u2019s decision to leave rates unchanged, said Dhiraj Narula, US rates strategist at HSBC\u2019s US investment bank.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 03:30 AM IST", "pub_date_relative": "23m ago"}, {"title": "Intel foundry push faces critical test after stock's 45% plunge in October", "full_content": "As Intel comes off its steepest stock drop since the 1970s due to a worsening outlook for the PC market, the chipmaker is facing intensifying pressure to get its flailing foundry business off the ground.\n\nIt's been an elusive task for Intel. The company has spent half a decade, and a good chunk of its $108 billion in capital expenditures over that stretch, trying to challenge Taiwan Semiconductor Manufacturing Co. But it still has no marquee customer for its most advanced chips and is primarily manufacturing chips for its own products.\n\nWall Street is losing patience. After the U.S. government took a 10% stake in Intel in August 2025, and Nvidia followed with a $5 billion investment, the stock started to shoot up, ultimately rising sixfold over 10 months before peaking in June. Intel was finally finding its niche in the artificial intelligence boom, delivering central processors used for agentic AI, while optimism simultaneously grew over its fab aspirations.\n\nIntel's story took a dramatic turn for the worse on Thursday, when the company said revenue this quarter will be between $1 billion and $2 billion shy of analysts' estimates as the PC market continues to suffer from soaring costs for memory and other components. Intel still counts on its PC segment for roughly half of its revenue, and consumers are increasingly choosing not to upgrade.\n\nThe stock plummeted 29% on Friday, its worst day since the 1970s, capping off a 45% plunge in October, the steepest monthly drop on record, according to firm WSP Global up 5.4%.\n\n* Heavily weighted financials were up 1%, while the interest rate sensitive real estate sector ended 2.6% higher.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 03:09 AM IST", "pub_date_relative": "43m ago"}, {"title": "U.S. judge dismisses Trump administration's Harvard admissions probe case", "full_content": "A federal judge dismissed on Monday a lawsuit by President Donald Trump's administration seeking to force Harvard University to turn over records for an investigation into whether it continues to consider race in its student admissions process.\n\nUS District Judge Myong Joun in Boston rejected the US Department of Justice's lawsuit, which Harvard contends was filed as part of a broader campaign by the Republican president's administration against the Ivy League school.\n\nThe judge stressed that his decision rested on narrow, procedural grounds and did not resolve whether the Justice Department and US Department of Education could ultimately seek data on thousands of high school students who sought admission at Harvard.\n\nBut Joun, an appointee of Democratic President Joe Biden, agreed with Harvard that the Justice Department sued without taking all legally required steps aimed at securing the university's voluntary compliance with its demands for applicant-level data.\n\n\"For example, the complaint does not allege that DOJ informed Harvard of the action it would take \u2014 namely, litigation \u2014 should Harvard fail to comply, nor does the complaint allege the specific failure identified,\" Joun wrote.\n\nThe Justice Department and Harvard did not immediately respond to requests for comment.\n\nHarvard has been a top target of the administration's effort to leverage federal funding and government power to force changes at universities that Trump says are dominated by \"radical left\" ideologies.\n\nThe Cambridge, Massachusetts-based university has already secured rulings from other judges rejecting the administration's efforts to terminate over $2 billion in grants, block the school from hosting international students and sue it for allegedly failing to protect Jewish and Israeli students from harassment.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 03:07 AM IST", "pub_date_relative": "45m ago"}, {"title": "Kimberly-Clark closes its acquisition of Tylenol maker Kenvue. What to expect next", "full_content": "Kimberly-Clark has a plan improve growth and earnings following its acquisition of Kenvue", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 03:05 AM IST", "pub_date_relative": "48m ago"}, {"title": "Want to help your adult kids and grandkids? Give them money while you\u2019re still alive.", "full_content": "How to manage \u201cgiving while living\u201d without endangering your own retirement.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 03:05 AM IST", "pub_date_relative": "48m ago"}, {"title": "LIVESTOCK-CME hogs set contract lows on big supply, weak demand", "full_content": "CHICAGO, Nov 2 (Reuters) - Chicago Mercantile Exchange lean hog futures set life-of-contract lows on Monday as plentiful supplies and weak demand continued to weigh on prices.\n\nThe market has tumbled since July because of poor cash prices for hogs and slumping wholesale pork prices, analysts said. Futures are oversold due to the losses, though it is not clear when they will begin to recover, they said.\n\nCME December lean hog futures ended down 0.70 cent at 58.175 cents per pound and set a contract low of 57.775 cents. April 2027 futures also set a contract low.\n\nAnalysts said domestic and export demand for pork was struggling. China, the world's biggest pork consumer, is grappling with an oversupply of hogs that is hurting US pork exports.\n\n\"It's hard for them to import pork from the US or from most suppliers and turn a profit on it, with so much low-priced domestic product in the market,\" said Joe Schuele, spokesman for the industry group US Meat Export Federation.\n\nUS beef also still faces regulatory barriers for export to China, despite Beijing renewing export licences in May for more than 400 US beef plants.\n\nIn the US cattle market, CME December live cattle futures closed down 1.250 cents at 219.700 cents per pound and touched the lowest price since October 5. January feeder cattle futures finished up 0.900 cent at 332.675 cents per pound after falling earlier to the lowest price since October 9.\n\nCattle traded in the cash market on Friday fell to between $224 and $225 in the southern US, down about $5 to $6 from a week earlier, brokers said.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 03:00 AM IST", "pub_date_relative": "53m ago"}, {"title": "\u2018She\u2019s a Type A personality\u2019: My stepmother wants me to repay my late father\u2019s $40,000 wedding gift. Should I oblige?", "full_content": "\u201cAbout two months after his funeral, my stepmother called and said she wanted the money back.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 03:00 AM IST", "pub_date_relative": "53m ago"}, {"title": "The stock market has gone nowhere for the past 5 months. It\u2019s now looking like a bargain.", "full_content": "The S&P 500\u2019s forward price-to-earnings ratio is below its five-year and 10-year averages.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 02:59 AM IST", "pub_date_relative": "54m ago"}, {"title": "US stocks today: Nasdaq ends over 1% lower as AI worries persist", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: Nasdaq ends over 1% lower as AI worries persist Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks today: Nasdaq ends over 1% lower as AI worries persist SECTIONS US stocks today: Nasdaq ends over 1% lower as AI worries persist ETMarkets.com Last Updated: Nov 03, 2026, 02:50:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks ended mixed on Monday, with the S&P 500 and Nasdaq closing lower as Apple shares slipped ahead of earnings and Oracle fell over plans to raise $20 billion. Falling oil prices amid US-Iran peace hopes offered some relief, while concerns over Big Tech's AI spending persisted.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 02:50 AM IST", "pub_date_relative": "1h ago"}, {"title": "US Tech Stocks Enter Correction on AI and Midterm Election Risks - Bloomberg.com", "full_content": "US Tech Stocks Enter Correction on AI and Midterm Election Risks Bloomberg.com Nasdaq 100 Enters Correction as Megacap Results Amplify AI Fears Bloomberg.com The Nasdaq Just Flashed a Signal Investors Can't Afford to Ignore. History Says the Stock Market Will Do This Next. The Motley Fool NASDAQ indices have given up their gains. Trade in negative territory investingLive Nasdaq Inches Closer to a Correction WSJ", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump focuses on Reflecting Pool in final public speech before midterms", "full_content": "President Donald Trump began his final scheduled in-person speech before Tuesday's Election Day with a lengthy disquisition about his efforts to renovate the Lincoln Memorial Reflecting Pool and other sites in Washington .\n\n\"Today I'm thrilled to announce the official opening of the Lincoln Memorial Reflecting Pool,\" Trump said Monday afternoon in front of the water feature, which was fenced off for months amid a problem-plagued renovation the president had ordered.\n\nThe speech, which lasted nearly an hour, was expected to serve as Trump's \"closing argument\" on the midterms before millions of voters head to the polls to determine which party will control the House and Senate in the next Congress.\n\nBut Trump kicked off his remarks with more than 20 minutes of commentary that focused largely on the Reflecting Pool, along with his administration's work on refurbishing other Washington-area monuments and cracking down on crime in the nation's capital.\n\n\"The pool is now better and more beautiful than it's ever been before, and we're very proud of it,\" Trump said, before repeating unfounded claims that vandals were responsible for damaging the pool and delaying repairs.\n\nU.S. Attorney for the District of Columbia Jeanine Pirro told a court July 31 that the damage was caused by a contractor's botched installation. Trump lashed out at Pirro over the admission and has continued to claim vandals were to blame.\n\nTrump's first explicit reference to the midterms came around the 23-minute mark.\n\n\"As you know, this is the last day before the midterm elections, the most important midterm, I believe, in our lifetime,\" Trump said.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:45 AM IST", "pub_date_relative": "1h ago"}, {"title": "Texas governor race tightens in prediction markets, but Abbott remains favored", "full_content": "Political observers are watching the Texas gubernatorial election for signs of an artificial intelligence data center backlash in the 2026 U.S. midterm elections on Tuesday, and prediction market traders see growing odds of the Democratic candidate pulling off an upset.\n\nGov. Greg Abbott , a Republican seeking a fourth term, has a 60% chance of beating Democratic state Rep. Gina Hinojosa on Tuesday, according to speculators on platform Kalshi.\n\nHinojosa's odds to win have jumped from 8% in mid-July to 40% on Monday, with many of those gains coming in recent weeks as a series of polls have shown the race to be tightening . On Polymarket, Hinojosa has seen her odds jump from as low as 5% in late July to 39% on Monday.\n\nContracts are resolved using data from the Texas Secretary of State's office.\n\nOdds and gambling platforms do not use methodologies used by traditional political polling, and therefore are not substitutes for political polls.\n\nHinojosa is seeking to be the first Democratic governor in Texas in more than 30 years. She has used Abbott's previous support for data center development in the state as an attack against the incumbent .\n\nIn November 2025, Abbott touted a $40 billion investment by Google \u2014 which included bringing three new data center campuses to the state \u2014 by saying that Texas will be the \"epicenter of AI development.\" But Abbott has changed his tune as voters' opinion of data centers has soured over the past year.\n\nAbbott in August ordered an audit of data centers that sought to connect to the state's grid, and then in September he halted the approval of all data center-related permits until an audit of the existing waitlist is conducted.", "source": "CNBC Finance", "pub_date_str": "03 Nov 2026, 02:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oil tumbles on hopes for US-Iran talks", "full_content": "Prices extend decline after Iran\u2019s president says supreme leader has given officials certain authority over talks", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 02:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Last chance: Earn up to 200,000 bonus SkyMiles with these Delta credit card offers", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nDelta and American Express have introduced new limited-time welcome bonuses for the top Delta SkyMiles credit cards . These offers include more than just bonus SkyMiles \u2014 you can also earn flight certificates and statement credits.\n\nThe biggest of these bonuses is for 200,000 miles, an incredible deal for a co-branded airline card . If you're interested in applying, you'll need to act fast \u2014 these six welcome bonuses end on Nov. 4, 2026.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nEarn a limited-time $300 Capital One Travel stays credit, plus earn 75,000 bonus miles\n\nEarn a bonus of 20,000 miles once you spend $500 on purchases within three months from account opening, equal to $200 in travel\n\nWelcome offer: Earn as high as 80,000 bonus miles plus a $250 statement credit after spending $3,000 in purchases in the first six months of card membership. Apply to find out your offer. Terms apply. Offer ends Nov. 4, 2026.\n\nSee rates and fees , terms apply. Read our Amex Delta Gold review . The Delta SkyMiles\u00ae Gold American Express Card Welcome Offer: To view your personalized offer, you must first submit an application. If approved, you will: (1) receive your Welcome Offer details, (2) have the option to accept the Card with that offer, (3) be required to spend $3,000 on eligible purchases within the first 6 months of Card Membership, and (4) earn Membership Rewards\u00ae points. Welcome offers vary and you may not be eligible for an offer. If you're approved and accept your offer, a credit check may be conducted, which could impact your credit score. Terms apply.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oracle files to sell $20 billion in new stock, bonds to finance AI buildout", "full_content": "Oracle filed plans on Monday to issue new stock and more debt to finance its artificial intelligence buildout.\n\nThe hyperscaler will sell $10 billion in common stock and $10 billion in senior notes, according to filings with the Securities and Exchange Commission. While the fundraising was already outlined at an investor day last week , shares tumbled 8.8% Monday.\n\n\"This seems to be exactly what they previewed,\" said Rob Oliver, senior research analyst at Baird. \"So I'm not sure why the market is freaking about it.\"\n\nOracle said it plans to use the proceeds for general corporate purposes, which may include capital expenditures, repayments of debt and future investments.\n\nOracle's one-day performance The hyperscaler's stock initially bounced after last Wednesday's investor day, when Oracle also issued a revenue forecast of at least $225 billion for fiscal 2030. At the time Oracle also said it was limiting its additional capital market funding for the fiscal 2027 to 2030 investment cycle to that $20 billion.\n\n\"This is a major relief given concerns about the state of debt markets and the cost of capital (although UBS has argued that these debt market concerns have been over-stated),\" UBS analyst Karl Keirstead said in a note on Thursday.\n\nOracle plans to turn to vendor financing, customer-provided hardware and customer prepayments to help it transition to positive free cash flow, which it expects to reach in the second half of 2028.\n\nStock and bonds in Oracle, co-founded by former CEO Larry Ellison, have been under pressure amid growing investor concerns about the massive amount of debt being taken on to fund AI infrastructure.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Palantir raises full-year revenue outlook as US commercial sales top US government revenue for the first time - Yahoo Finance", "full_content": "Palantir raises full-year revenue outlook as US commercial sales top US government revenue for the first time Yahoo Finance Palantir reports booming U.S. commercial revenue growth, topping government for first time CNBC Palantir Boosts 2026 Revenue Outlook on Strong Commercial Sales Bloomberg.com Palantir\u2019s revenue rises 96% to $2.3 billion as investors\u2019 patience rests on a hair trigger Fortune Here\u2019s How Much Traders Expect Palantir Stock to Move After Earnings Investopedia", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Palantir earnings reveal a major AI turning point", "full_content": "The U.S. commercial business brought in more money than the U.S. government segment in the third quarter.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 02:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Lumentum CEO touts 'enormous' opportunity in massive AI connectivity deal with Marvell", "full_content": "Marvell Technology 's deal for optical components maker Lumentum will create an \"enormous\" opportunity to address growing connectivity demands from the artificial intelligence infrastructure buildout, Lumentum CEO Michael Hurlston told CNBC on Monday.\n\n\"You need scale-up technology that needs semiconductors and optical working seamlessly together,\" Marvell CEO Matt Murphy told CNBC's \"Squawk on the Street.\" \"We are going to create a new category of company here.\"\n\nSince the tie-up is a fixed-ratio deal with no cash, the value will depend on the price of Marvell shares. The company said the transaction has an implied enterprise value of $115 billion for Lumentum, in a release.\n\nMarvell shares slumped 13% in trading Monday, while Lumentum's stock sank nearly 19%. But both stocks have been huge winners in the artificial intelligence boom, with Marvell more than doubling in the past year, prior to Monday's sell-off, and Lumentum quadrupling over that stretch.\n\nThrough the acquisition, Marvell said it can combine electrical and optical technologies to meet accelerating and shifting AI connectivity demands across regions and systems. Companies are increasingly relying on optical connections to piece together chips used to run and train large language models.\n\n\"We're actually going to create solutions around those that are highly sticky, and the reason that they're sold out is because the demand is exploding, and we don't see that changing anytime soon,\" Murphy said.\n\nLumentum shareholders will receive 4.5 Marvell shares for each Lumentum share under the agreement. The deal is expected to close during the first half of 2028.\n\nMarvell's takeover marks one of the most significant bets on AI in 2026 and comes despite recent concerns over the long-term sustainability of infrastructure spending.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 02:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018It seems bizarre\u2019: We\u2019re in our 80s with $950,000 in traditional IRAs. Why is our adviser pushing Roth conversions?", "full_content": "\u201cOur basic living expenses are covered by $110,000 in annual pensions and Social Security.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 02:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "I bonds now pay 5.51% \u2014 but there are trade-offs. What to know before buying", "full_content": "Now that Series I bonds pay higher interest , the government-backed, nearly risk-free asset could be more attractive for certain investors. But I bonds have downsides, and there are alternatives to consider.\n\nNewly purchased I bonds currently pay 5.51% annual interest through April 30, up from the 4.26% yield offered on purchases made through October.\n\nAmid rising inflation , the variable part of I bond interest rose to 4.08%, while the fixed part increased to 1.40%, the highest since 2006. Combined, the 5.51% composite rate is the biggest yield since November 2022.\n\nThe new I bond rate is \"very attractive,\" according to Ken Tumin, founder of DepositQuest.com, a blog that tracks I bond rates, among other deposit accounts.\n\nThe variable part of I bond interest resets every six months, based on the consumer price index. For the next six months after purchase, I bonds look \"very competitive\" compared to other shorter-term options for cash, such as savings accounts or certificates of deposit, according to Tumin.\n\nMeanwhile, the I bond's 1.4% fixed rate stays the same for as long as you own it, which could appeal to longer-term investors, he said.\n\nBut I bonds aren't right for everyone. Here are some key things to know before purchasing.\n\nInvestors can buy $10,000 of electronic I bonds per person per calendar year via their TreasuryDirect account . You can open additional TreasuryDirect accounts for other family members or businesses to buy more.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "US petrol prices dip ahead of midterms as voters eye costs - Al Jazeera", "full_content": "US petrol prices dip ahead of midterms as voters eye costs Al Jazeera Gas prices are set to be highest for any Election Day in U.S. history The Washington Post Petrol prices set to hit record high under Trump on eve of US elections Financial Times Why Trump\u2019s Hail Mary on Fuel Prices Fell Short Foreign Policy Welcome to the gas price election NBC News", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "Prediction market traders now see nearly 75% chance of Democrats winning the Senate", "full_content": "Momentum for Democrats is building on Kalshi, with traders on Monday seeing a 74% chance of the party winning control of the U.S. Senate \u2014 the highest odds seen for the party on the platform since the market first opened.\n\nThe higher odds come after The New York Times reported Sunday that a poll it conducted with Siena University found Democrats are leading in several battleground states, strengthening Democrats' path to a possible Senate majority.\n\nThe contract asks \"Who will control the Senate?\" and will be verified by the Library of Congress after Tuesday's vote.\n\nSince it opened in 2024, Republicans dominated the market for Senate control in 2026. The gap between the parties' odds narrowed shortly after the U.S. and Israel first launched strikes on Iran on Feb. 28, though the chances for Republican control jumped up to 60% in July before reversing in mid-September.\n\nMarkets on separate Senate races have also seen major movement in favor of Democratic candidates in the last 24 hours. Traders on Kalshi now see a 74% chance of Democrats winning the Senate race in Texas, up from 68.4%, over the past 24 hours. The market on the Senate race in Iowa jumped to 50% from 42% on Polymarket in favor of Democrats.\n\nIn Kansas, which has not elected a Democratic U.S. senator since 1932, odds of Democratic candidate Adam Hamilton winning over Republican Roger Marshall are up to 63% from 52%.\n\nOdds and gambling platforms do not use methodologies used by traditional political polling, and therefore are not substitutes for political polls.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "Feeling isolated? Half of in-office workers describe their jobs as 'remote,' NY Fed survey finds", "full_content": "Many workers across the U.S. are now back in-office a majority of the time, and they are feeling more isolated than ever.\n\nA recent survey from researchers at the New York Fed finds that roughly half of workers based in-office don't describe a daily experience on the job that matches the goal many corporate employers stated in upping in-person mandates.\n\nWhether three-, four- or five-day mandates , companies have cited the importance of creative collaboration for business productivity and growth, as well as mentorship opportunities. Yet workers surveyed by the NY Fed describe endless Zoom calls and Slacks, and little actual face time.\n\n\"Days in the office often lack human contact,\" the researchers write. Specifically, 48.8% of survey respondents said they had no in-person meetings, either with teammates or non-teammates, on the days they were most recently in the office.\n\nThere are a variety of reasons for the disconnect between in-office work mandates and actual experience.\n\nRoughly one in four workers are now fully remote, according to U.S. Bureau of Labor Statistics data cited by the NY Fed, but they say that alone likely \"understates the explosion in the experience of remoteness from colleagues.\"\n\nWith teams being spread across more offices \u2014 an effect they say has become more pronounced in the post-Covid organization structure \u2014 many workers \"no-showing\" on mandates, and employers not enforcing mandates strictly, the result for in-office workers, according to the researcher, is that \"they commute in just to take Zoom calls and answer Slack messages from their cubicles.\"\n\nThe NY Fed paper, by NY Fed research economist Natalia Emanuel and University of Virginia economics professor Emma Harrington, concludes that \"a staggering share of the workforce experiences this form of in-office remote work.\"", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 02:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "Apple earnings live updates: New CEO John Ternus faces first Wall Street test - CNBC", "full_content": "Apple earnings live updates: New CEO John Ternus faces first Wall Street test CNBC Apple Q4 earnings live: iPhone 18 sales in the spotlight Yahoo Finance Apple earnings: iPhone sales lead revenue upward Axios Stock Market Today: Nasdaq Falls 1%; Dow Rises After Friday's Selloff WSJ Apple Fourth-Quarter Earnings Live Coverage Bloomberg.com", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "Oil Futures Slump As Iran Peace Efforts Ease Supply Fears - WSJ", "full_content": "Oil Futures Slump As Iran Peace Efforts Ease Supply Fears WSJ Oil prices slide in biggest drop since July on hope for more Iran talks NBC News Oil price falls amid hope of a breakthrough to end Iran war The Guardian Crude prices slide as investors brace for a big week CNBC Gulf Arab Oil Giants Are Exporting Crude at Pre-War Rates Again Bloomberg.com", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "The Intel stock collapse is getting worse \u2014 and the $3.5 trillion chip rout is spreading - Yahoo Finance", "full_content": "The Intel stock collapse is getting worse \u2014 and the $3.5 trillion chip rout is spreading Yahoo Finance Intel foundry push faces critical test after stock's 45% plunge in October CNBC Intel: The Panic Buying Opportunity Is Finally Here (NASDAQ:INTC) Seeking Alpha Intel Is Still \u2018Too-Strategic-To-Fail\u2019 Forbes Intel Stock Is Cratering After Trump Poured Taxpayer Money Into the Chipmaker Futurism", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Chip stocks are suffering from a \u2018crisis of confidence\u2019 \u2014 but things aren\u2019t as gloomy as they seem", "full_content": "Investors are worried about whether there will be sustained demand for chips, but one analyst notes that large tech companies are still spending heavily.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 02:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Markets News, Nov. 2, 2026: Nasdaq Slides as Tech Sell-Off Resumes; Oil Prices Plunge Amid Hopes for U.S.-Iran Diplomacy - Investopedia", "full_content": "Markets News, Nov. 2, 2026: Nasdaq Slides as Tech Sell-Off Resumes; Oil Prices Plunge Amid Hopes for U.S.-Iran Diplomacy Investopedia See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 01:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "The midterms are here. How JPMorgan expects the market to react", "full_content": "History shows elections are positive for stocks. But a blue wave, Republicans holding on or a split Congress carry different implications for the market.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 01:50 AM IST", "pub_date_relative": "2h ago"}, {"title": "Crude oil prices sell off more than 7% on Iran peace talk hopes ahead of U.S. midterms", "full_content": "Crude oil prices fell sharply Monday as the presidents of the U.S. and Iran signalled they are open to a diplomatic solution to the conflict that has disrupted energy markets for eight months.\n\nU.S. West Texas Intermediate futures shed 7.4% to close at $96.46 a barrel, the biggest daily loss since July 27. Brent crude , the international benchmark, lost 7.6% to settle at $104.77 a barrel.\n\nPresident Donald Trump told reporters Monday that Iran wants to \"make a deal and that could happen.\" U.S. Secretary of State Marco Rubio said over the weekend that Trump prefers not to use military force against Iran and would like to resolve the conflict diplomatically.\n\nTrump has previously said that he will not attack Iran before the U.S. midterms. But the oil market had priced in the risk of a major military escalation after the elections, gaining more than 10% in October.\n\nThe oil market has sold off during previous phases of the war on rumors of a possible settlement, only for the conflict to subsequently escalate and spike prices again.\n\nBrent Trump \"hasn't made a decision\" on whether to strike Iran again, Rubio told reporters.\n\n\"What the president expresses to you is incredible confidence that if we needed to do something militarily, we would have the ability to do it,\" the secretary of State said. \"But we would prefer to do it peacefully.\"\n\nIran's President Masoud Pezeshkian said Tehran is seeking to resolve problems through dialogue, according to state-owned Islamic Republic News Agency . Iran's Supreme Leader Ayatollah Mojtaba Khamenei has granted the government certain authorities to do this, Pezeshkian said.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 01:49 AM IST", "pub_date_relative": "2h ago"}, {"title": "Wall Street Braces for Biggest Treasury Sales Overhaul in Years - Bloomberg.com", "full_content": "Wall Street Braces for Biggest Treasury Sales Overhaul in Years Bloomberg.com See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 01:40 AM IST", "pub_date_relative": "2h ago"}, {"title": "Snap settles with two teens during trial testing claims social media caused depression, eating disorders - NBC News", "full_content": "Snap settles with two teens during trial testing claims social media caused depression, eating disorders NBC News Snap reaches settlement in social media addiction lawsuit ahead of trial CBS News Meta settles with teen during trial testing claims social media caused depression, eating disorders Reuters Snap settles lawsuit accusing platform of fueling teen depression and eating disorders TechCrunch Snap settles kids online safety case right before trial. The Verge", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 01:37 AM IST", "pub_date_relative": "2h ago"}, {"title": "El Nino could add to US inflation pressures in 2027, San Francisco Fed paper warns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a El Nino could add to US inflation pressures in 2027, San Francisco Fed paper warns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper El Nino could add to US inflation pressures in 2027, San Francisco Fed paper warns SECTIONS El Nino could add to US inflation pressures in 2027, San Francisco Fed paper warns ETMarkets.com Last Updated: Nov 03, 2026, 01:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A San Francisco Fed study warns the current strong El Ni\u00f1o could drive US inflation up by 1 percentage point in 2027, despite temporarily boosting jobs. With inflation already above the 2% target, the climate shock adds further pressure on the Fed to raise interest rates.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 01:31 AM IST", "pub_date_relative": "2h ago"}, {"title": "Stocks making the biggest moves midday: Oracle, SpaceX, Tempus AI, Rivian & more", "full_content": "These are some of the stocks posting the largest moves midday.", "source": "CNBC Finance", "pub_date_str": "03 Nov 2026, 01:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump Account holders to receive SpaceX stock from Gwynne Shotwell in December", "full_content": "Eligible Trump Account holders will begin receiving donated shares of SpaceX stock next month, according to an X post on Friday.\n\n\"Robert and I are thrilled that our gift of over 2 million shares of SpaceX stock will be distributed to children's Trump accounts in December!\" President and COO Gwynne Shotwell wrote in the post.\n\nThe gift from Shotwell and her husband will provide a share apiece to around 2 million Trump Accounts holders ages 11 to 17 who live in ZIP codes with median family incomes of $57,000 or less, or in ZIP codes with too few residents for a median family income to be reported by the U.S. Census Bureau. These families should receive a notice by Monday, Shotwell wrote on X.\n\n\"In a few weeks, an additional gift will be finalized for eligible 11 to 17-year-old children in military families serving overseas, children in foster care, and more children whose MFI is $90,000 or less living in counties near our home in the great state of Texas,\" she also wrote.\n\nParents or guardians can check eligibility for the donation through Invest America, a nonprofit advocacy group, and track account activity with the Trump Accounts app .\n\nTrump Accounts, also known as 530A accounts, are open to any U.S. child under 18 with a Social Security number.\n\nChildren born from 2025 through 2028 may also receive a one-time $1,000 deposit from the U.S. Department of the Treasury.\n\nOther funds may also be available, depending on certain criteria. In a separate funding announcement in October, Elon Musk wrote in an X post that he plans to give every kid in America a share of SpaceX sometime in 2027, which may also come via Trump Accounts .", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 01:16 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Palantir reports booming U.S. commercial revenue growth, topping government for first time", "full_content": "Palantir beat Wall Street's third-quarter estimates after the bell on Monday, with U.S. commercial revenue topping government for the first time as businesses adopt more of the company's artificial intelligence tools.\n\nRevenue nearly doubled from a year ago and blew past $2 billion for the first time ever, Palantir said. Net income more than doubled to $1.13 billion, or 44 cents per share, from about $476 million, or 18 cents per share.\n\n\"I don't believe anyone's had consistent results like this in the history of software AI, ever,\" CEO Alex Karp told CNBC's Seema Mody in an interview, adding that the business is succeeding without salespeople.\n\nPalantir has long been known for its strength in the government sector, but its commercial segment caught up in Q3.\n\nU.S. commercial revenue jumped 148% to $984 million, surpassing U.S. government revenue of $953 million, which was up 96%. The company's U.S. commercial revenue has more than quintupled over the last two years.\n\nPalantir lifted its guidance, saying it now expects U.S. commercial revenue \"in excess of\" $3.56 billion for the full year. Last quarter, the company boosted its forecast to $3.42 billion. The company projects about $2.65 billion in revenue for the fourth quarter and about $8.53 billion for full-year 2026.\n\nKarp has openly supported the use of open-weight models and criticized leading AI labs, which he told CNBC earlier this year are forcing businesses to sell their data sovereignty. Karp, on Monday, also reiterated recent calls to nationalize AI labs, calling it the \"only realistic way\" to manage liability.\n\nIn September, Karp joined major tech CEOs at the White House as calls for regulation mounted following claims from AI researchers that the technology has a more than 10% of killing humanity .", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 03:52 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "iSpecimen shareholders approve reverse stock split at special meeting", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:49 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Apple beats on quarterly revenue in CEO John Ternus' first earnings report: Live updates", "full_content": "Apple reported better-than-expected revenue but came up short of estimates on iPad sales for the fiscal fourth quarter. The stock was little changed in extended trading on Monday.\n\nHere's how the company did compared to analysts' estimates, according to LSEG.\n\nIt's Apple's first earnings report since CEO John Ternus took the helm on Sept. 1, succeeding Tim Cook .\n\nApple will provide an outlook for the current quarter on a call with analysts as well as discuss memory supply .\n\nRevenue increased 12% from $102.5 billion a year earlier, Apple said in a statement on Monday. Apple's iPhone revenue in the quarter only included eight days of new Phone 18 Pro sales. And Apple's new flagship device, the iPhone Duo, didn't hit store shelves until the period was over.\n\nMonday's report includes a full quarter of higher-priced Apple products, as the company raised prices across the board in June after it signaled challenges with memory supply and other parts. Apple increased prices on iPhones by $100.\n\nThe iPhone maker is reckoning with a global memory crunch and a rush for computer components. Apple said on Monday that its memory costs were higher this quarter than in the June period.\n\nStill, Ternus said in a statement that Apple had just capped off its \"best fiscal year ever.\" Ternus told CNBC's MacKenzie Sigalos that Apple's growth came in spite of supply constraints and foreign exchange headwinds.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 03:47 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Pampa Energia ADR earnings missed by $2.40, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:46 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hillman Solutions earnings beat by $0.01, revenue fell short of estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:44 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Bioventus Q3 2026 revenue miss sparks sharp selloff", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:43 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Offerpad misses Q3 2026 estimates as housing pressure deepens", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 03:42 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Traders rushing into a leveraged ETF to make a bullish bet on the Nasdaq-100 just got burned", "full_content": "Some investors appeared a little too eager to buy the dip in technology stocks last month.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 03:33 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Treasury Yields Extend Past Month\u2019s Slide as Oil Prices Drop", "full_content": "(Bloomberg) -- Treasuries rose, building on their biggest monthly advance in more than two years, as tumbling oil prices eased concern about inflation pressure leading to additional Federal Reserve interest-rate hikes.\n\nTen- to 30-year maturities led gains, with yields for those tenors declining about four basis points to touch the lowest levels since September.\n\nShorter-dated debt rose less as lower oil prices helped stabilize US stocks. Equities weakness concentrated in large technology company shares benefited the Treasury market last month as investors piled into lower-risk assets.\n\n\u201cThe historical negative correlation between bonds and equities seems to have returned over the past month, and the gains today could be related to investors looking to protect further downside in equities,\u201d said Steven Zeng, an interest-rate strategist at Deutsche Bank. The oil price slide \u201calso supports Treasury yields to move lower.\u201d\n\nThe US 10-year yield declined as much as six basis points to under 4.87%, the lowest level since Sept. 10.\n\nWest Texas Intermediate futures slid 7.4% to settle near $96.50 a barrel after Washington and Tehran signaled openness to talks to resolve the months-long conflict roiling Middle East energy supplies.\n\nFed policymakers raised rates in September for the first time since 2023 after rising oil prices caused inflation to accelerate. Traders continue to price in at least two more quarter-point hikes by the end of next year, however the cumulative amount of expected tightening has declined over the past month.\n\nShort-term Treasury yields falling less than longer-term ones \u201cis likely a consequence of the sharp post-FOMC steepening move\u201d following last week\u2019s decision to leave rates unchanged, said Dhiraj Narula, US rates strategist at HSBC\u2019s US investment bank.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 03:30 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Fixed Income", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Intel foundry push faces critical test after stock's 45% plunge in October", "full_content": "As Intel comes off its steepest stock drop since the 1970s due to a worsening outlook for the PC market, the chipmaker is facing intensifying pressure to get its flailing foundry business off the ground.\n\nIt's been an elusive task for Intel. The company has spent half a decade, and a good chunk of its $108 billion in capital expenditures over that stretch, trying to challenge Taiwan Semiconductor Manufacturing Co. But it still has no marquee customer for its most advanced chips and is primarily manufacturing chips for its own products.\n\nWall Street is losing patience. After the U.S. government took a 10% stake in Intel in August 2025, and Nvidia followed with a $5 billion investment, the stock started to shoot up, ultimately rising sixfold over 10 months before peaking in June. Intel was finally finding its niche in the artificial intelligence boom, delivering central processors used for agentic AI, while optimism simultaneously grew over its fab aspirations.\n\nIntel's story took a dramatic turn for the worse on Thursday, when the company said revenue this quarter will be between $1 billion and $2 billion shy of analysts' estimates as the PC market continues to suffer from soaring costs for memory and other components. Intel still counts on its PC segment for roughly half of its revenue, and consumers are increasingly choosing not to upgrade.\n\nThe stock plummeted 29% on Friday, its worst day since the 1970s, capping off a 45% plunge in October, the steepest monthly drop on record, according to FactSet. It's down another 8% in Monday trading.\n\nIntel vs. Nasdaq since start of October Intel's investments in the future are supposed to be paying off. CEO Lip-Bu Tan said he sees the global market for server processors increasing as much as five times over the next five years to about $200 billion.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 03:29 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street\u2019s most hated stocks are faring far better than its favorites", "full_content": "The thrashing that Wall Street\u2019s artificial-intelligence darlings have taken over the past few months has led to an unusual situation in the U.S. stock market.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 03:15 AM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "TSX rebounds as oil pullback boosts industrials, mining shares", "full_content": "TORONTO, Nov 2 (Reuters) - Canada's main stock index rallied on Monday as a sharp drop in oil prices boosted investor sentiment at the start of a new month, with industrial and metal mining shares leading broad-based gains.\n\nThe S&P/TSX Composite Index ended up 181.06 points, or 0.5%, at 35,801.09, recouping some of Friday's steep decline.\n\n* \"It's more repositioning for the new month, along with support from oil and developments in the Middle East,\" said Michael Dehal, a senior portfolio manager at Dehal Investment Partners at Raymond James.\n\n* US crude oil futures settled 7.4% lower at $96.46 a barrel as talks between Iranian and Qatari officials lifted hopes for an end to the US-Israeli war with Iran and stabilization of Middle East crude supply.\n\n* The price of gold rebounded from a one-year low hit in the previous session, rising 1.8%, as the pullback in oil prices tempered inflation worries.\n\n* The materials group, which includes metal mining shares, rose 2.3% after tumbling 13.1% in October.\n\n* Industrials added 2.5%, with shares of construction and engineering firm WSP Global up 5.4%.\n\n* Heavily weighted financials were up 1%, while the interest rate sensitive real estate sector ended 2.6% higher.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 03:09 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. judge dismisses Trump administration's Harvard admissions probe case", "full_content": "A federal judge dismissed on Monday a lawsuit by President Donald Trump's administration seeking to force Harvard University to turn over records for an investigation into whether it continues to consider race in its student admissions process.\n\nUS District Judge Myong Joun in Boston rejected the US Department of Justice's lawsuit, which Harvard contends was filed as part of a broader campaign by the Republican president's administration against the Ivy League school.\n\nThe judge stressed that his decision rested on narrow, procedural grounds and did not resolve whether the Justice Department and US Department of Education could ultimately seek data on thousands of high school students who sought admission at Harvard.\n\nBut Joun, an appointee of Democratic President Joe Biden, agreed with Harvard that the Justice Department sued without taking all legally required steps aimed at securing the university's voluntary compliance with its demands for applicant-level data.\n\n\"For example, the complaint does not allege that DOJ informed Harvard of the action it would take \u2014 namely, litigation \u2014 should Harvard fail to comply, nor does the complaint allege the specific failure identified,\" Joun wrote.\n\nThe Justice Department and Harvard did not immediately respond to requests for comment.\n\nHarvard has been a top target of the administration's effort to leverage federal funding and government power to force changes at universities that Trump says are dominated by \"radical left\" ideologies.\n\nThe Cambridge, Massachusetts-based university has already secured rulings from other judges rejecting the administration's efforts to terminate over $2 billion in grants, block the school from hosting international students and sue it for allegedly failing to protect Jewish and Israeli students from harassment.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 03:07 AM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Kimberly-Clark closes its acquisition of Tylenol maker Kenvue. What to expect next", "full_content": "Kimberly-Clark has a plan improve growth and earnings following its acquisition of Kenvue", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 03:05 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "LIVESTOCK-CME hogs set contract lows on big supply, weak demand", "full_content": "CHICAGO, Nov 2 (Reuters) - Chicago Mercantile Exchange lean hog futures set life-of-contract lows on Monday as plentiful supplies and weak demand continued to weigh on prices.\n\nThe market has tumbled since July because of poor cash prices for hogs and slumping wholesale pork prices, analysts said. Futures are oversold due to the losses, though it is not clear when they will begin to recover, they said.\n\nCME December lean hog futures ended down 0.70 cent at 58.175 cents per pound and set a contract low of 57.775 cents. April 2027 futures also set a contract low.\n\nAnalysts said domestic and export demand for pork was struggling. China, the world's biggest pork consumer, is grappling with an oversupply of hogs that is hurting US pork exports.\n\n\"It's hard for them to import pork from the US or from most suppliers and turn a profit on it, with so much low-priced domestic product in the market,\" said Joe Schuele, spokesman for the industry group US Meat Export Federation.\n\nUS beef also still faces regulatory barriers for export to China, despite Beijing renewing export licences in May for more than 400 US beef plants.\n\nIn the US cattle market, CME December live cattle futures closed down 1.250 cents at 219.700 cents per pound and touched the lowest price since October 5. January feeder cattle futures finished up 0.900 cent at 332.675 cents per pound after falling earlier to the lowest price since October 9.\n\nCattle traded in the cash market on Friday fell to between $224 and $225 in the southern US, down about $5 to $6 from a week earlier, brokers said.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 03:00 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The stock market has gone nowhere for the past 5 months. It\u2019s now looking like a bargain.", "full_content": "The S&P 500\u2019s forward price-to-earnings ratio is below its five-year and 10-year averages.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 02:59 AM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks today: Nasdaq ends over 1% lower as AI worries persist", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: Nasdaq ends over 1% lower as AI worries persist Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks today: Nasdaq ends over 1% lower as AI worries persist SECTIONS US stocks today: Nasdaq ends over 1% lower as AI worries persist ETMarkets.com Last Updated: Nov 03, 2026, 02:50:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US stocks ended mixed on Monday, with the S&P 500 and Nasdaq closing lower as Apple shares slipped ahead of earnings and Oracle fell over plans to raise $20 billion. Falling oil prices amid US-Iran peace hopes offered some relief, while concerns over Big Tech's AI spending persisted.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 02:50 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Tech Stocks Enter Correction on AI and Midterm Election Risks - Bloomberg.com", "full_content": "US Tech Stocks Enter Correction on AI and Midterm Election Risks Bloomberg.com Nasdaq 100 Enters Correction as Megacap Results Amplify AI Fears Bloomberg.com The Nasdaq Just Flashed a Signal Investors Can't Afford to Ignore. History Says the Stock Market Will Do This Next. The Motley Fool NASDAQ indices have given up their gains. Trade in negative territory investingLive Nasdaq Inches Closer to a Correction WSJ", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:45 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Texas governor race tightens in prediction markets, but Abbott remains favored", "full_content": "Political observers are watching the Texas gubernatorial election for signs of an artificial intelligence data center backlash in the 2026 U.S. midterm elections on Tuesday, and prediction market traders see growing odds of the Democratic candidate pulling off an upset.\n\nGov. Greg Abbott , a Republican seeking a fourth term, has a 60% chance of beating Democratic state Rep. Gina Hinojosa on Tuesday, according to speculators on platform Kalshi.\n\nHinojosa's odds to win have jumped from 8% in mid-July to 40% on Monday, with many of those gains coming in recent weeks as a series of polls have shown the race to be tightening . On Polymarket, Hinojosa has seen her odds jump from as low as 5% in late July to 39% on Monday.\n\nContracts are resolved using data from the Texas Secretary of State's office.\n\nOdds and gambling platforms do not use methodologies used by traditional political polling, and therefore are not substitutes for political polls.\n\nHinojosa is seeking to be the first Democratic governor in Texas in more than 30 years. She has used Abbott's previous support for data center development in the state as an attack against the incumbent .\n\nIn November 2025, Abbott touted a $40 billion investment by Google \u2014 which included bringing three new data center campuses to the state \u2014 by saying that Texas will be the \"epicenter of AI development.\" But Abbott has changed his tune as voters' opinion of data centers has soured over the past year.\n\nAbbott in August ordered an audit of data centers that sought to connect to the state's grid, and then in September he halted the approval of all data center-related permits until an audit of the existing waitlist is conducted.", "source": "CNBC Finance", "pub_date_str": "03 Nov 2026, 02:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Last chance: Earn up to 200,000 bonus SkyMiles with these Delta credit card offers", "full_content": "Terms apply to American Express benefits and offers. Visit americanexpress.com to learn more.\n\nDelta and American Express have introduced new limited-time welcome bonuses for the top Delta SkyMiles credit cards . These offers include more than just bonus SkyMiles \u2014 you can also earn flight certificates and statement credits.\n\nThe biggest of these bonuses is for 200,000 miles, an incredible deal for a co-branded airline card . If you're interested in applying, you'll need to act fast \u2014 these six welcome bonuses end on Nov. 4, 2026.\n\nOffers in this section are from affiliate partners and selected based on a combination of engagement, product relevance, compensation, and consistent availability.\n\nEarn a limited-time $300 Capital One Travel stays credit, plus earn 75,000 bonus miles\n\nEarn a bonus of 20,000 miles once you spend $500 on purchases within three months from account opening, equal to $200 in travel\n\nWelcome offer: Earn as high as 80,000 bonus miles plus a $250 statement credit after spending $3,000 in purchases in the first six months of card membership. Apply to find out your offer. Terms apply. Offer ends Nov. 4, 2026.\n\nSee rates and fees , terms apply. Read our Amex Delta Gold review . The Delta SkyMiles\u00ae Gold American Express Card Welcome Offer: To view your personalized offer, you must first submit an application. If approved, you will: (1) receive your Welcome Offer details, (2) have the option to accept the Card with that offer, (3) be required to spend $3,000 on eligible purchases within the first 6 months of Card Membership, and (4) earn Membership Rewards\u00ae points. Welcome offers vary and you may not be eligible for an offer. If you're approved and accept your offer, a credit check may be conducted, which could impact your credit score. Terms apply.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Oracle files to sell $20 billion in new stock, bonds to finance AI buildout", "full_content": "Oracle filed plans on Monday to issue new stock and more debt to finance its artificial intelligence buildout.\n\nThe hyperscaler will sell $10 billion in common stock and $10 billion in senior notes, according to filings with the Securities and Exchange Commission. While the fundraising was already outlined at an investor day last week , shares tumbled 8.8% Monday.\n\n\"This seems to be exactly what they previewed,\" said Rob Oliver, senior research analyst at Baird. \"So I'm not sure why the market is freaking about it.\"\n\nOracle said it plans to use the proceeds for general corporate purposes, which may include capital expenditures, repayments of debt and future investments.\n\nOracle's one-day performance The hyperscaler's stock initially bounced after last Wednesday's investor day, when Oracle also issued a revenue forecast of at least $225 billion for fiscal 2030. At the time Oracle also said it was limiting its additional capital market funding for the fiscal 2027 to 2030 investment cycle to that $20 billion.\n\n\"This is a major relief given concerns about the state of debt markets and the cost of capital (although UBS has argued that these debt market concerns have been over-stated),\" UBS analyst Karl Keirstead said in a note on Thursday.\n\nOracle plans to turn to vendor financing, customer-provided hardware and customer prepayments to help it transition to positive free cash flow, which it expects to reach in the second half of 2028.\n\nStock and bonds in Oracle, co-founded by former CEO Larry Ellison, have been under pressure amid growing investor concerns about the massive amount of debt being taken on to fund AI infrastructure.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Palantir raises full-year revenue outlook as US commercial sales top US government revenue for the first time - Yahoo Finance", "full_content": "Palantir raises full-year revenue outlook as US commercial sales top US government revenue for the first time Yahoo Finance Palantir reports booming U.S. commercial revenue growth, topping government for first time CNBC Palantir Boosts 2026 Revenue Outlook on Strong Commercial Sales Bloomberg.com Palantir\u2019s revenue rises 96% to $2.3 billion as investors\u2019 patience rests on a hair trigger Fortune Here\u2019s How Much Traders Expect Palantir Stock to Move After Earnings Investopedia", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Palantir earnings reveal a major AI turning point", "full_content": "The U.S. commercial business brought in more money than the U.S. government segment in the third quarter.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 02:39 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lumentum CEO touts 'enormous' opportunity in massive AI connectivity deal with Marvell", "full_content": "Marvell Technology 's deal for optical components maker Lumentum will create an \"enormous\" opportunity to address growing connectivity demands from the artificial intelligence infrastructure buildout, Lumentum CEO Michael Hurlston told CNBC on Monday.\n\n\"You need scale-up technology that needs semiconductors and optical working seamlessly together,\" Marvell CEO Matt Murphy told CNBC's \"Squawk on the Street.\" \"We are going to create a new category of company here.\"\n\nSince the tie-up is a fixed-ratio deal with no cash, the value will depend on the price of Marvell shares. The company said the transaction has an implied enterprise value of $115 billion for Lumentum, in a release.\n\nMarvell shares slumped 13% in trading Monday, while Lumentum's stock sank nearly 19%. But both stocks have been huge winners in the artificial intelligence boom, with Marvell more than doubling in the past year, prior to Monday's sell-off, and Lumentum quadrupling over that stretch.\n\nThrough the acquisition, Marvell said it can combine electrical and optical technologies to meet accelerating and shifting AI connectivity demands across regions and systems. Companies are increasingly relying on optical connections to piece together chips used to run and train large language models.\n\n\"We're actually going to create solutions around those that are highly sticky, and the reason that they're sold out is because the demand is exploding, and we don't see that changing anytime soon,\" Murphy said.\n\nLumentum shareholders will receive 4.5 Marvell shares for each Lumentum share under the agreement. The deal is expected to close during the first half of 2028.\n\nMarvell's takeover marks one of the most significant bets on AI in 2026 and comes despite recent concerns over the long-term sustainability of infrastructure spending.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 02:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "I bonds now pay 5.51% \u2014 but there are trade-offs. What to know before buying", "full_content": "Now that Series I bonds pay higher interest , the government-backed, nearly risk-free asset could be more attractive for certain investors. But I bonds have downsides, and there are alternatives to consider.\n\nNewly purchased I bonds currently pay 5.51% annual interest through April 30, up from the 4.26% yield offered on purchases made through October.\n\nAmid rising inflation , the variable part of I bond interest rose to 4.08%, while the fixed part increased to 1.40%, the highest since 2006. Combined, the 5.51% composite rate is the biggest yield since November 2022.\n\nThe new I bond rate is \"very attractive,\" according to Ken Tumin, founder of DepositQuest.com, a blog that tracks I bond rates, among other deposit accounts.\n\nThe variable part of I bond interest resets every six months, based on the consumer price index. For the next six months after purchase, I bonds look \"very competitive\" compared to other shorter-term options for cash, such as savings accounts or certificates of deposit, according to Tumin.\n\nMeanwhile, the I bond's 1.4% fixed rate stays the same for as long as you own it, which could appeal to longer-term investors, he said.\n\nBut I bonds aren't right for everyone. Here are some key things to know before purchasing.\n\nInvestors can buy $10,000 of electronic I bonds per person per calendar year via their TreasuryDirect account . You can open additional TreasuryDirect accounts for other family members or businesses to buy more.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Prediction market traders now see nearly 75% chance of Democrats winning the Senate", "full_content": "Momentum for Democrats is building on Kalshi, with traders on Monday seeing a 74% chance of the party winning control of the U.S. Senate \u2014 the highest odds seen for the party on the platform since the market first opened.\n\nThe higher odds come after The New York Times reported Sunday that a poll it conducted with Siena University found Democrats are leading in several battleground states, strengthening Democrats' path to a possible Senate majority.\n\nThe contract asks \"Who will control the Senate?\" and will be verified by the Library of Congress after Tuesday's vote.\n\nSince it opened in 2024, Republicans dominated the market for Senate control in 2026. The gap between the parties' odds narrowed shortly after the U.S. and Israel first launched strikes on Iran on Feb. 28, though the chances for Republican control jumped up to 60% in July before reversing in mid-September.\n\nMarkets on separate Senate races have also seen major movement in favor of Democratic candidates in the last 24 hours. Traders on Kalshi now see a 74% chance of Democrats winning the Senate race in Texas, up from 68.4%, over the past 24 hours. The market on the Senate race in Iowa jumped to 50% from 42% on Polymarket in favor of Democrats.\n\nIn Kansas, which has not elected a Democratic U.S. senator since 1932, odds of Democratic candidate Adam Hamilton winning over Republican Roger Marshall are up to 63% from 52%.\n\nOdds and gambling platforms do not use methodologies used by traditional political polling, and therefore are not substitutes for political polls.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 02:18 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Apple earnings live updates: New CEO John Ternus faces first Wall Street test - CNBC", "full_content": "Apple earnings live updates: New CEO John Ternus faces first Wall Street test CNBC Apple Q4 earnings live: iPhone 18 sales in the spotlight Yahoo Finance Apple earnings: iPhone sales lead revenue upward Axios Stock Market Today: Nasdaq Falls 1%; Dow Rises After Friday's Selloff WSJ Apple Fourth-Quarter Earnings Live Coverage Bloomberg.com", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Oil Futures Slump As Iran Peace Efforts Ease Supply Fears - WSJ", "full_content": "Oil Futures Slump As Iran Peace Efforts Ease Supply Fears WSJ Oil prices slide in biggest drop since July on hope for more Iran talks NBC News Oil price falls amid hope of a breakthrough to end Iran war The Guardian Crude prices slide as investors brace for a big week CNBC Gulf Arab Oil Giants Are Exporting Crude at Pre-War Rates Again Bloomberg.com", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "The Intel stock collapse is getting worse \u2014 and the $3.5 trillion chip rout is spreading - Yahoo Finance", "full_content": "The Intel stock collapse is getting worse \u2014 and the $3.5 trillion chip rout is spreading Yahoo Finance Intel foundry push faces critical test after stock's 45% plunge in October CNBC Intel: The Panic Buying Opportunity Is Finally Here (NASDAQ:INTC) Seeking Alpha Intel Is Still \u2018Too-Strategic-To-Fail\u2019 Forbes Intel Stock Is Cratering After Trump Poured Taxpayer Money Into the Chipmaker Futurism", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 02:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Markets News, Nov. 2, 2026: Nasdaq Slides as Tech Sell-Off Resumes; Oil Prices Plunge Amid Hopes for U.S.-Iran Diplomacy - Investopedia", "full_content": "Markets News, Nov. 2, 2026: Nasdaq Slides as Tech Sell-Off Resumes; Oil Prices Plunge Amid Hopes for U.S.-Iran Diplomacy Investopedia See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 01:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Crude oil prices sell off more than 7% on Iran peace talk hopes ahead of U.S. midterms", "full_content": "Crude oil prices fell sharply Monday as the presidents of the U.S. and Iran signalled they are op
