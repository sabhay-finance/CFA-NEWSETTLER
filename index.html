ews", "pub_date_str": "29 Aug 2026, 12:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "DST Global Advisors sells $38.6 million of Chime Financial shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Aug 2026, 12:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Randy Shefman, Royal Gold SVP, sells $131,400 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Aug 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "8th Pay Commission delay could cost lower-ranked staff up to \u20b93.45 lakh in lost HRA and transport allowance", "full_content": "The 8th Pay Commission panel is tentatively expected to submit its final report to the central government by May-June 2027. Once the final report is submitted, the government will decide on pay revisions, allowances, and pension reforms for serving and retired government servants.\n\nNow, in case the 8th Pay Commission\u2019s rollout drags on, the central government employees are going to brace for a financial hit. While they are tentatively set to be paid from January 1, 2026, history shows that these are generally confined to basic pay alone.\n\nProminent allowances such as dearness allowance (DA), house rent allowance (HRA), and transport allowance (TPTA) rarely get backdated. This is an important distinction, as for lower and mid-level working staff, these allowances make up a meaningful chunk of their monthly earnings.\n\nThis is because the dearness allowance (DA) is revised every six months to help serving employees cope with rising inflation and lifestyle costs, regardless of whether a pay commission is active. That is why there is no \u2018gap\u2019 left to compensate for.\n\nHRAs pegged at 24%, 16%, and 8% of basic pay, primarily depending on the city category, rise only once DA crosses certain thresholds, as it did in January 2024. TPTA, on the other hand, is a fixed sum tied to DA and gets revised with every new pay commission. money he initially invested in this Bermuda fund came entirely from his Singapore salary and that no Indian funds were involved. But the tax officer wasn\u2019t convinced.\n\nBhowmick also tried to use the revised India-Singapore Double Tax Avoidance Treaty (DTAA) to support his case. But the tax officer dismissed this argument too, Economic Times reported.\n\nTax officers reportedly claimed that Bhowmick\u2019s case does not come under the India-Singapore DTAA as the Bermuda-focused fund\u2019s company was registered as a public limited company in India, and for FY 2015-16, Bhowmick was not a resident of Singapore.", "source": "LiveMint Money", "pub_date_str": "29 Aug 2026, 01:15 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Rays of Belief IPO opens 1 September: GMP hints 12% listing pop; Check 10 key things to know", "full_content": "The Rays of Belief IPO is set to open for subscription on Tuesday, 1 September. The Rays of Belief IPO GMP today, or grey market premium, stands at \u20b9 29, indicating positive sentiment in the unofficial market.\n\nFounded in 2017, Rays of Belief Ltd. is a for-profit social enterprise that provides customised intervention programmes for children with Neurodevelopmental Disorders (NDDs). Its services cater to children with conditions including Autism Spectrum Disorder (ASD), ADHD, Down Syndrome, Cerebral Palsy, Intellectual Disability, Learning Disabilities and Global Developmental Delays.\n\nThe company recorded strong revenue growth in FY26, with consolidated revenue from operations more than doubling to \u20b9 81.66 crore from \u20b9 36.42 crore in FY25. However, profitability declined, with profit for the year falling to \u20b9 4.96 crore in FY26 from \u20b9 5.88 crore in the previous fiscal.\n\nRays of Belief IPO GMP today: Rays of Belief IPO GMP today or grey market premium is +29. Considering the upper end of the IPO price band and the current premium in the grey market, the estimated listing price of Rays of Belief share price was indicated at \u20b9 268 apiece, which is 12.13% higher than the IPO price of \u20b9 239.\n\nRays of Belief IPO date: The IPO opens for subscription on Tuesday, 1 September, and closes on Thursday, 3 September.\n\nRays of Belief IPO price band: The IPO price band has been fixed in the range of \u20b9 227 to \u20b9 239 per equity share of face value of \u20b9 10.\n\nRays of Belief IPO lot size: The IPO lot size is 62 equity shares and in multiples of 62 equity shares thereafter.\n\nAnchor investors: The allocation to anchor investors for Rays of Belief IPO is scheduled to take place on Monday, 31 August.", "source": "LiveMint Markets", "pub_date_str": "29 Aug 2026, 01:03 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China\u2019s massive oil reserves give Beijing leverage during Iran war", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Aug 2026, 12:53 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Will Dalal Street see record Rs 70,000 crore IPOs in September? Jio and NSE buzz raises stakes", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Will Dalal Street see record Rs 70,000 crore IPOs in September? Jio and NSE buzz raises stakes The Economic Times daily newspaper is available online now. Read Today's Paper Will Dalal Street see record Rs 70,000 crore IPOs in September? Jio and NSE buzz ra s", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Expert view: FPIs turn positive on India | OmniScience Capital CEO sees non-AI diversification boosting inflows", "full_content": "Expert view: As foreign portfolio investors (FPIs) have turned net buyers of Indian equities since July this year, Vikas Gupta, CEO and Strategist at OmniScience Capital, believes non-AI diversification could drive more FPI inflows to India. In an interview with Mint, Gupta said a spike in inflation will prompt the US Federal Reserve to hike rates, but the most likely course for the US Fed is to hold rates steady, given the balance between job growth and inflation. Edited excerpts:\n\nBased on the consistent July and August inflows, it looks like the beginning of a sentiment turnaround for FPIs . Most likely, this could be an initial exploration of allocating to the non-AI assets to balance or hedge their portfolios.\n\nIn the emerging market index, Taiwan and South Korea have higher allocations compared to their long-term weights. Even if that continues, India is likely to start getting more allocations from the non-AI diversification allocations.\n\nIf inflation spikes in the US, the interest rates are bound to increase. However, it is not a given. CPI/PCE seem to be stabilising, but remains above 3%, significantly above the Fed's 2% mandate.\n\nThe jobs data also show a decline in payrolls, which biases the market towards a rate cut. Given the balancing between job growth and inflation, the most likely course for the Fed is to hold the rates steady.\n\nThe Japanese central bank has to raise interest rates to safeguard and bolster the currency and avoid further import-driven inflation from oil and food imports.\n\nThe US is also trying to cooperate with Japan in its endeavour. However, the global energy, commodities, and food situation appears inflationary in the near term due to the various wars disrupting global trade.\n\nFurther, the huge AI capex also seems to be boosting the cost of capital. Finally, the pace of US Government debt at $1 trillion per quarter, which is pushing it toward $40 trillion, is also alarming bond markets.", "source": "LiveMint Markets", "pub_date_str": "29 Aug 2026, 11:10 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks to buy under \u20b9100: Vaishali Parekh recommends three stocks to buy or sell", "full_content": "Stocks to buy under \u20b9 100: The key benchmark of the Indian stock market remained volatile during the week and continued to trade within a broadly range-bound structure. The Nifty 50 extended its losing streak to three consecutive weeks. Market sentiment remained cautious amid elevated geopolitical uncertainty, fluctuations in crude oil prices and concerns surrounding the US monetary policy outlook. Although the IT sector provided strong support towards the end of the week following robust Nvidia earnings, weakness in several large-cap stocks limited the broader recovery.\n\nInstitutional flows remained mixed during the week, with FIIs turning aggressive sellers on Friday and recording net outflows of around \u20b9 5,040 crore. However, the selling pressure was largely countered by strong DII participation, with domestic institutions recording purchases of approximately \u20b9 5,184 crore, providing a cushion to the market.\n\nOn a month-to-date (MTD) basis, FIIs continue to remain marginal net buyers at around \u20b9 454 crore, marking a notable shift after several months of sustained foreign selling. Meanwhile, DIIs have maintained strong buying momentum, with MTD inflows of approximately \u20b9 79,620 crore. The continued strength in domestic institutional     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
