<script>

    const allData = {"general": [{"title": "Intuit to sell Mailchimp to Bending Spoons for $3.68 billion", "full_content": "Tax software maker Intuit said Thursday that it has agreed to sell marketing subsidiary Mailchimp to Italian technology consolidator Bending Spoons for $3.68 billion in cash and stock. The deal is set to close in early 2027, according to a statement .\n\nThe sale is a costly retreat for Intuit, which paid $12 billion for Mailchimp in 2021 in a push beyond its core tax and accounting businesses. Five years later, the software maker is unloading the email-marketing company for less than one-third of that price after Mailchimp became a drag on its overall revenue growth.\n\nThe deal is the latest instance of Bending Spoons picking up a once promising technology asset. The company bought productivity software startup Airtable in September for 10% of what it was once worth.\n\nThe Bending Spoons portfolio also contains AOL, Brightcove, Eventbrite, Evernote, Meetup, Vimeo, and WeTransfer.\n\nIn August Intuit started running Mailchimp as a distinct operating segment . The move was meant to give investors more transparency as the company tried to manage the unit for profitability, Sandeep Aujla, Intuit's finance chief, said at a September company briefing.\n\nAlso on Thursday, Intuit announced stronger-than-expected earnings and revenue for its fiscal first quarter, which ended on Oct. 31. The company reported $2.91 in adjusted earnings per share on $4.35 billion in revenue. Analysts polled by LSEG were looking for $2.70 per share and $4.31 billion in revenue.\n\nWhile Intuit's revenue increased 12% year over year, Mailchimp revenue declined 1% to $313 million. Analysts polled by StreetAccount had expected $314.4 million.\n\nManagement called for $22.88 to $23.12 in adjusted earnings per share for the 2027 fiscal year, with $23.081 billion to $23.365 billion in revenue. Analysts polled by LSEG had predicted $23.62 in adjusted earnings per share on $23.43 billion in revenue. Intuit shares tumbled 15% in extended trading.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 03:10 AM IST", "pub_date_relative": "1m ago"}, {"title": "What Ron Johnson's 'Ponzi scheme' label gets wrong about Social Security, experts say", "full_content": "A new Senate budget committee hearing on Wednesday reignited an old Social Security question: Is the program, which provides monthly benefits to millions of Americans, a Ponzi scheme?\n\nSenate Budget Committee Chairman Ron Johnson, a Republican representing Wisconsin, called Social Security \"a legal Ponzi scheme\" in his opening remarks. But experts say his comments overlook how Social Security works and the real dilemma for lawmakers over its looming funding shortfall.\n\nA Ponzi scheme is an investment fraud that uses funds from new investors to pay existing investors, according to the Securities and Exchange Commission, Johnson wrote in his chairman's hearing memo . He said that Social Security fits the description if you remove the word \"fraud.\"\n\nJohnson's comments followed his Wednesday morning interview on Fox Business , where he said, \"At this point, there's really no way to fix Social Security.\"\n\n\"You can't fix it, you just shut it down and then hope that you can recover some of your money,\" Johnson said during the Fox Business interview.\n\n\"As far as I can tell, this is the first time in decades that a senior senator, chairman of the budget committee, said he would rather shut down Social Security than fix it,\" Sen. Ron Wyden, D-Ore., said during the hearing.\n\nAt the Senate hearing, Johnson said his comments during the TV interview were \"imprecise\" and that he was talking broadly about Ponzi schemes, not Social Security, that need to be shut down.\n\nJohnson said he wants lawmakers to pass a law to ensure seniors' Social Security benefits are not reduced, \"then roll up our sleeves and fix the real problem, which is $24 trillion of 10-year deficits.\"", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 03:05 AM IST", "pub_date_relative": "6m ago"}, {"title": "Commerce approved sales of more than 879,000 AI chips to Chinese companies, Rep. Mast says", "full_content": "The subagency of the Commerce Department that regulates and enforces exports approved the sale of more than 879,000 AI chips to Chinese companies including Alibaba and Tencent as of May 2026, according to documents released Thursday by the House Foreign Affairs Committee.\n\nSome of those approvals, made by Commerce's Bureau of Industry and Security, included sales to companies designated by the Department of Defense as \"Chinese Military Companies,\" according to the documents. As of May, there had been 3.4 million requested sales of U.S. AI chips to China, the committee reported, citing those made by Nvidia and Advanced Micro Devices .\n\n\"Over the past month, the administration's handling of chip export controls has put our national security and technology edge at risk. The Bureau of Industry and Security has failed to enforce the rules, and Congress must now conduct rigorous oversight of the administration's policies,\" Rep. Gregory Meeks, D-N.Y., the top Democrat on the House Foreign Affairs Committee, said at a meeting of the panel Thursday at which members voted to release the documents.\n\nThe Commerce Department, AMD and Nvidia did not immediately respond to requests for comment.\n\n\"The license information we are disclosing today will help inform the American public about how BIS has handled licenses for Nvidia H200 and equivalent AMD chips to China.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:57 AM IST", "pub_date_relative": "14m ago"}, {"title": "Why Micron, Broadcom and other AI stocks gave up their gains Thursday", "full_content": "The Anthropic enthusiasm has faded while China concerns have intensified.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:57 AM IST", "pub_date_relative": "14m ago"}, {"title": "Gap cuts annual forecasts, flags weak apparel demand ahead of holidays", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:54 AM IST", "pub_date_relative": "17m ago"}, {"title": "Duke Energy completes $875 million senior notes offering due 2036", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:54 AM IST", "pub_date_relative": "17m ago"}, {"title": "US court ruling jeopardizes Sentinel Midstream\u2019s license for deepwater oil export project", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:54 AM IST", "pub_date_relative": "17m ago"}, {"title": "Elastic shares tumble on disappointing revenue outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:54 AM IST", "pub_date_relative": "17m ago"}, {"title": "Jefferies cuts Futu stock price target on soft market conditions", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:52 AM IST", "pub_date_relative": "19m ago"}, {"title": "Retail Investors Dive Into Both Sides of the Anthropic Trade", "full_content": "(Bloomberg) -- Retail traders rushed to buy \u2014 and sell \u2014 Anthropic PBC shares in one of the busiest market debuts on record Thursday.\n\nNon-professional investors\u2019 net buying of Anthropic shares was on track to reach between $80 million and $90 million by the end of the day, according to Vanda Research. That would make it the third-biggest listing day on record, trailing SpaceX\u2019s $118 million earlier this year and Coinbase Global Inc.\u2019s $92 million in 2021, Vanda\u2019s Viraj Patel wrote in a note. Total turnover by retail traders \u2014 including buying and selling \u2014 was poised to reach $1.4 billion, some three times as much as SpaceX\u2019s turnover and a \u201crecord for a listing day by a wide margin.\u201d\n\n\u201cRetail are trading the stock hard,\u201d Patel said. He noted traders were \u201ctaking both sides rather than a one-way bid.\u201d\n\nThose investors sold single stocks to pay for Anthropic purchases, Patel added. The sales spanned the entire \u201cAI complex,\u201d led by Advanced Micro Devices Inc., which slid after Hunterbrook Capital said it shorted the stock on potentially risky business in China. Meantime, bids for shares of perennial retail favorite Nvidia Corp. \u201cdried up,\u201d Patel said.\n\nRetail investors wanted \u201cway more\u201d of an allocation to the Anthropic offering than they got, according to Steven Quirk, chief broking officer at Robinhood Markets Inc. Robinhood, the largest retail broker in the US, got a \u201cgood allocation,\u201d but the first day of trading on the platform was dominated by institutional investors, he said.\n\nNevertheless, every customer who wanted Anthropic stock got at least a share, Quirk said on the sidelines of the Bloomberg ETFs in Depth conference Thursday.\n\nAnthropic shares soared 21% above their IPO price after the AI lab\u2019s blockbuster $107.3 billion debut broke SpaceX\u2019s record for the biggest-ever offering.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 02:52 AM IST", "pub_date_relative": "19m ago"}, {"title": "UnitedHealth\u2019s stock tumbles after government signals crackdown on Medicare Advantage fraud", "full_content": "UnitedHealth Group\u2019s stock fell again on Thursday amid a tough week in which the government pledged to crack down on Medicare Advantage fraud and lawmakers renewed calls for Medicare for All.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:52 AM IST", "pub_date_relative": "19m ago"}, {"title": "Diversified Energy closes $1.8 billion Permian Basin acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:50 AM IST", "pub_date_relative": "21m ago"}, {"title": "Endava receives NYSE non-compliance notice over delayed filing", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:50 AM IST", "pub_date_relative": "21m ago"}, {"title": "Stifel reports client assets rise 5% in October", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:50 AM IST", "pub_date_relative": "21m ago"}, {"title": "Natural Grocers declares $0.15 quarterly dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:50 AM IST", "pub_date_relative": "21m ago"}, {"title": "Anthropic IPO: Investors who flip the stock may face brokerage penalty", "full_content": "Retail investors with access to Anthropic's initial public offering who sell the stock quickly after buying could get penalized by their brokerage firm.\n\nAnthropic said in an IPO prospectus that it expected to make shares available to retail investors through various brokerages, including Charles Schwab , Fidelity, Robinhood , SoFi , E*Trade and some of their respective affiliates.\n\nFollow CNBC' s live coverage of Anthropic's IPO and Nasdaq debut\n\nThese broker-dealers have different \"anti-flipping\" policies meant to discourage investors who purchase IPO shares \u2014 including those of Anthropic \u2014 from dumping them quickly. Charles Schwab is the only one that doesn't have such a policy in place.\n\n\"One purpose is to discourage 'flippers' who are just buying with the hope of making a quick profit,\" Jay Ritter, director of The IPO Initiative at the University of Florida, said in an email. \"Their selling could put downward pressure on the price once trading starts.\"\n\nInvestors who run afoul of anti-flipping rules may be prohibited from accessing future IPOs, perhaps for several months or even more than a year for repeat offenders. In the worst case, the brokerage may bar them from all future IPOs.\n\nThese policies apply only to retail investors who place an order with their brokerage firm to buy the Anthropic IPO at its offering price \u2014 something many investors don't have access to.\n\nFor example, Fidelity customers are eligible to participate in the Anthropic IPO if they have at least $25,000 in certain assets, the firm said . Even then, customers are \"evaluated and ranked\" based on factors like account assets to determine who can access limited shares that may be available, it said .", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 02:46 AM IST", "pub_date_relative": "25m ago"}, {"title": "AMD dives on short-seller report of alleged China exposure", "full_content": "Shares of chipmaker Advanced Micro Devices close down 7.72% to $489.19 Thursday after investment firm Hunterbrook Media issued a report alleging that the company \"has its own China problem.\"\n\nHunterbrook disclosed that it had taken a short position in AMD.\n\nThe report claims that \"after the U.S. blacklisted Chinese server maker IEIT Systems, the company kept getting newer AMD firmware, which enables AMD chips to run in servers.\"\n\nHunterbrook also said that new export rules in Washington could \"tighten restrictions on AMD's foreign business,\" alleging that AMD \"bills over 20% of its revenue to customers in China and Hong Kong,\" and \"depends on a Chinese partner to finish most of its chips.\"\n\nAMD, 1-day The allegations come amid investigations of rival chipmaker Nvidia over its sales to companies in Asia with ties to China. AMD has been viewed as a beneficiary of the uncertainty surrounding Nvidia.\n\n\"The claims misrepresent AMD's business practices and relationships,\" an AMD spokesperson said in a statement. \"AMD complies with applicable US export control laws and regulations and maintains rigorous processes to ensure compliance across our global operations. We remain focused on serving our customers and upholding the highest standards of integrity.\"\n\nLisa Su, CEO of AMD, told investors on the company's recent earnings call that China is an \"important\" market and that the semiconductor giant wants to be fully compliant with U.S. export controls.\n\nAMD continued to slide after-hours, trading down 0.45% to $487 shortly after 4 p.m.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:44 AM IST", "pub_date_relative": "27m ago"}, {"title": "Anthropic closes first day at $97.17 per share in landmark moment for AI: IPO live updates", "full_content": "Anthropic jumped 17% in its Nasdaq debut on Thursday in a seminal moment for artificial intelligence, after the company completed the biggest initial public offering on record, topping SpaceX' s historic debut in June. The stock closed at $97.17 per share. The Claude creator, trading under the ticker \"ANT,\" opened at $111.50, after the company raised $81.3 billion in the IPO. Anthropic sold 980 million shares at $83 a piece on Wednesday, lifting the size and price of its offering.\n\nAt Thursday's close, Anthropic had a fully diluted market cap of $1.75 trillion. More than 846 million shares changed hands, surpassing the 522 million shares that were traded on SpaceX's opening day.\n\nThe 5-year-old company captivated the corporate world with its Claude AI models and products, which have fueled its meteoric rise this year. Anthropic said in its prospectus that it generated $33.24 billion in revenue for the nine months ended Sept. 30, up a staggering 1,200% from the same period last year.\n\nAnthropic CEO Dario Amodei co-founded the company in 2021 after he and a small group of researchers defected from OpenAI , now its chief rival. Anthropic has faced sharp criticism over its positions on safety, regulation and national security, including by President Donald Trump and other senior government officials.\n\nCNBC's reporters are covering Anthropic's IPO live on air and online from our bureaus in San Francisco and Englewood Cliffs, New Jersey, and from the Nasdaq in New York City.\n\nAnthropic investors Amazon and Google own roughly 28% of the company's outstanding capital stock following the offering.\n\nThe company said Amazon owns 14.7%, while Google owns 13.7%, according to its prospectus.\n\nGoogle initially invested in Anthropic in late 2022, not long before the company first launched its Claude chatbot in 2023. Amazon announced its initial investment in Anthropic in September of 2023.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:44 AM IST", "pub_date_relative": "27m ago"}, {"title": "Why Walmart is making a bigger bet on fast-food delivery", "full_content": "The retail giant says around 90% of spending at fast-food chains occurs within a few miles from a Walmart.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:43 AM IST", "pub_date_relative": "28m ago"}, {"title": "Stock market today: Dow sinks 1,100 points, S&P 500 and Nasdaq tank 2% as Anthropic IPO grabs spotlight - Yahoo Finance", "full_content": "Stock market today: Dow sinks 1,100 points, S&P 500 and Nasdaq tank 2% as Anthropic IPO grabs spotlight Yahoo Finance Stocks plunge as investors take cover amid growing uncertainty CBS News UnitedHealth Is Behind Nearly Half the Dow's Drop Barron's Dow Drops 475 Points On Losses For UnitedHealth, Chevron Shares Moomoo Dow ends down 560 points as stocks finish mostly lower ahead of Anthropic's IPO MarketWatch", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 02:36 AM IST", "pub_date_relative": "35m ago"}, {"title": "\u2018I felt so seen\u2019: Why families across America are laughing \u2014 and crying \u2014 over SNL\u2019s \u2018Sister\u2019 sketch", "full_content": "The late-night comedy sketch does the impossible by making female caregivers feel seen.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:36 AM IST", "pub_date_relative": "35m ago"}, {"title": "Rising healthcare costs push Medicare Part B premiums higher", "full_content": "The premiums will increase by $6.50, to $209.40 a month.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:35 AM IST", "pub_date_relative": "36m ago"}, {"title": "Anthropic shares jump 17% after record Wall Street listing", "full_content": "AI group led by Dario Amodei raises $81bn in upsized public offering", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 02:32 AM IST", "pub_date_relative": "39m ago"}, {"title": "Palo Alto stock jumps on earnings beat and company's big bet on securing open-weight models", "full_content": "Palo Alto Networks shares rose 6% on Thursday as businesses boosted spending on cybersecurity products and investors cheered the company's acquisition of a startup that pushes it into securing open-weight artificial intelligence models.\n\nThe company beat Wall Street's estimates for the fiscal first quarter. Revenue jumped 39% from a year ago and Palo Alto lifted its guidance for the year.\n\nRecent outages at Microsoft , banks and the Federal Aviation Administration have left businesses reeling. While U.S. officials haven't detected any malicious activity, the disruptions raise concerns over aging equipment and infrastructure. Many businesses are scrambling to patch vulnerabilities at a faster clip than ever before to keep pace with the growing risks of AI-powered cyberattacks.\n\nThose fears have led more businesses to consolidate platforms, which is fueling growth in areas like firewall and AI security, Palo Alto Networks CEO Nikesh Arora told CNBC's \" Mad Money \" on Wednesday.\n\n\"They're going to have to make sure they get the best players in the market to come support them because this is no longer child's play,\" Arora said.\n\nAlongside earnings, Palo Alto announced a $4.5 billion deal to buy Applied Compute, a startup that helps train customized open-weight models. It's one of several recent deals in Arora's aggressive acquisition spree and marks a significant shift beyond cybersecurity.\n\n\"Rather than being one player out of 10 in the industry serving compute, we want to be the one player with Palo Alto that delivers secure compute and security capability,\" Arora told CNBC.\n\nPalo Alto expects the deal to add more than $1 billion in annual recurring revenue to its next-generation security business by the 2029 fiscal year.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:30 AM IST", "pub_date_relative": "40m ago"}, {"title": "US Sour Crude\u2019s War Premium Vanishes as Supply Surges", "full_content": "The price of US sour oil has plunged, as a surge of oil from Venezuela, Canada and the Middle East gives refiners ample barrels to choose from.\n\nUS medium sour export grade Mars, which is pumped from deepwater wells in the Gulf of Mexico and is similar to Middle Eastern crude, traded at a record premium to benchmark West Texas Intermediate futures in the early days of the Iran war as buyers hunted for alternate supplies to those disrupted by the closed Strait of Hormuz.\n\nNow, as oil markets begin to settle after a volatile year, Mars has fallen to a steep discount, making it cheaper for US refiners built to process heavier crude.\n\nMars has dropped from a $10 premium to a $4 discount to WTI futures in less than a month. That\u2019s the steepest discount since late September.\n\nAt the peak of Middle Eastern oil supply disruptions in March and April, it notched a record $17.50 premium even as futures traded for over $100 a barrel. At the start of the year, before the US and Israel launched their war in Iran in late February, Mars largely traded at a discount.\n\nRising production of heavy-sour crude in Venezuela and Canada has pushed global prices lower in recent weeks. US refiners, whose Gulf Coast and Midwest plants are major buyers of heavier oil, have benefited from the additional supplies from Canada and Latin America, while higher shipping costs are depressing the value of barrels at their origin because they\u2019re expensive to move overseas to refiners. Flows from the Persian Gulf have also increased.\n\n\u201cIncremental supply looks to be dominated by heavier and more sour barrels, especially out of Canada, Venezuela, and the Middle East,\u201d Valero\u2019s head of crude supply Randy Hawkins said in an October earnings call.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 02:22 AM IST", "pub_date_relative": "49m ago"}, {"title": "\u2018Nvidia\u2019s turmoil has me spooked\u2019: Should I sell my stocks and buy real estate \u2014 or ride out the storm?", "full_content": "Tempted to ditch stocks for property or CDs? Take a deep breath before making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:20 AM IST", "pub_date_relative": "51m ago"}, {"title": "Amazon app warns New York of higher costs if Mamdani delivery law passes", "full_content": "Amazon is taking its fight against a New York City delivery bill, which has been backed by Mayor Zohran Mamdani , to its shopping website and app.\n\nSome users who open the company's shopping app or website report being served with pop-ups and banners warning that the New York City Council \"could add up to $5 per order\" if it passes Intro 518, or the Delivery Protection Act.\n\nThe bill would require Amazon to employ its army of third-party delivery companies directly, disrupting the contractor model it has relied on since 2018. Amazon uses a network of thousands of small companies, which often work solely for Amazon, to handle the last-mile portion of shipments, in an effort to speed up deliveries and control more of its logistics operations.\n\n\"If this legislation passes, we'd no longer be able to work with them, and we'd be forced to consider moving our operations outside of the city,\" Amazon's in-app message states. \"That would likely mean slower and more expensive delivery for millions of customers in New York City, while also threatening small businesses and their thousands of employees.\"\n\nThe proposed legislation was introduced in February and is awaiting review by City Council Speaker Julie Menin.\n\nAmazon also posted a statement on its company website where it often publishes its policy positions . But rarely has the company used its valuable e-commerce site and app real estate to push its perspectives. Other tech companies including Uber and Lyft have similarly used their apps to advocate for or against legislation in the past.\n\nAmazon's pop-up notices and a stationary banner on its store homepage direct users to a form where they can \"contact your council member to oppose Intro 518.\"\n\nAccording to Amazon, 20,000 customers sent emails to city council members in the first six hours that the pop-up appeared.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:16 AM IST", "pub_date_relative": "55m ago"}, {"title": "Congress passes bill to protect older investors from financial fraud", "full_content": "Bipartisan legislation aimed at protecting older Americans and other vulnerable adults from financial fraud has cleared Congress , putting it on track to become law.\n\nCalled the Financial Exploitation Prevention Act of 2025 and passed by the House in June, H.R. 2478 was approved by unanimous consent in the Senate Wednesday night \u2014 meaning no senators objected to its passage.\n\nThe measure will next head to President Donald Trump 's desk. The White House did not respond to a CNBC request for comment on whether Trump plans to sign the bill into law.\n\nThe bill would generally allow mutual fund companies and their transfer agents, which handle shareholder records and transactions, to temporarily delay paying out redemption requests when they suspect an older or otherwise vulnerable investor is being financially exploited.\n\n\"Financial exploitation can have devastating consequences for victims and their families,\" said Erin Koeppel, a managing director and government relations and public policy counsel at the CFP Board, the organization that oversees the certified financial planner certification. \"This legislation fills an important regulatory gap that can help protect vulnerable investors before assets are lost.\"\n\nThe measure's congressional approval comes amid growing financial fraud among older Americans. Those age 60 or older reported losing about $3 billion to fraud in 2025, a 25% increase from $2.4 billion in 2024, according to the Federal Trade Commission's latest report to Congress on fraud among older adults , which was released in October. That amount is 400% higher than the $600 million reported lost in 2020.\n\n\"Generally, we support all legislation that aims to prevent any form of financial elder abuse,\" said Bob Blancato, national coordinator for the Elder Justice Coalition, an advocacy group.\n\nWhile just 6% of older fraud victims reported losing $100,000 or more in 2025, those losses accounted for 70% of the age group's total reported losses.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 02:06 AM IST", "pub_date_relative": "1h ago"}, {"title": "Kraken parent's acquisition of Tribe Capital flags new chapter in evolution of crypto exchanges", "full_content": "Payward, the owner of crypto exchange Kraken, is pushing into private markets with its latest acquisition, underscoring a broader shift in cryptocurrencies, from trading-led growth to the buildout of financial infrastructure.\n\nPayward said late Wednesday that it's buying venture capital and asset management provider Tribe Capital Management, led by Payward's co-CEO Arjun Sethi. No purchase price was disclosed.\n\nTribe, where Sethi is co-founder and chairman, invests across early- and late-stage private companies and has $2.7 billion in assets under management.\n\n\"Joining Payward gives us the opportunity to bring Tribe's investment approach to a global financial platform,\" Jonathan Hsu, another co-founder of Tribe Capital, said in a statement. \"We see a strong fit between our investment approach and Payward's infrastructure, distribution, and product-building capabilities.\"\n\nThe acquisition is novel among crypto exchanges. Unlike exchange-owned venture arms such as Coinbase Ventures or Binance Labs, Payward is looking to integrate Tribe's investment and fund-management capabilities into an existing custody, trading, collateral and tokenization infrastructure to develop private-market investment products.\n\nPayward is trying to position itself to capture value from a broader crypto-driven transformation of financial services, not use the venture vehicle to draw more capital into the crypto ecosystem.\n\nThe acquisition is another step in the evolution in the crypto exchange business model. With cryptocurrency prices continuing to decline this year, crypto exchanges have worked to move past their reliance on trading volumes and transaction fees, focusing instead on building the infrastructure connecting digital assets with traditional finance.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia\u2019s stock falls further. It has lost $611 billion in six trading days.", "full_content": "There are only 23 companies in the world with a market capitalization of $611 billion or higher", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "A CoreWeave co-founder just made an unconventional $30 million wager on its battered bonds", "full_content": "While executives typically buy shares to signal confidence, CoreWeave co-founder Brian Venturo is turning to the bond market to calm AI jitters.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 01:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Latin America Currencies Sink on Rate Worries; Brazil Intervenes", "full_content": "(Bloomberg) -- A sell-off in Latin American currencies deepened Thursday, sending the Mexican peso to its lowest since June 2025 and forcing Brazil\u2019s central bank to step in to prop up the real, amid the mounting prospect of more rate hikes in the US.\n\nThe Colombian peso led losses across emerging markets, tumbling as much as 3.4% against the greenback. The Mexican peso traded past 19 pesos per dollar, the lowest since June 2025, after central bank minutes confirmed the institution\u2019s dovish stance. And in Brazil, the real dropped nearly 0.7% as investors shrugged off the first dollar spot auction since late 2024, which came after President Luiz In\u00e1cio Lula da Silva said he was in no rush to announce a new finance minister.\n\nThe moves weighed on MSCI\u2019s EM currency index, which fell 0.2% and is on track for a fourth week of declines \u2014 the longest such streak since March. The dollar, meanwhile, gained as traders continued to assess hawkish statements by Federal Reserve officials.\n\nThe pressure on Latin America is partly driven by domestic issues, such as fiscal worries in Brazil, a dovish central bank in Mexico, recessionary headwinds in Chile and the potential dilution of the fiscal reform in Colombia, said Benito Berber, chief Americas economist at Natixis.\n\nMore generally, \u201ctwo factors may be driving weaker currencies despite the rally in US equities: higher Treasury yields and the repricing of Fed hikes, coupled with seasonal factors as trading desks reduce risk ahead of year-end,\u201d he added.\n\nThe South African rand, a bellwether for risk, was down by more than 1% after local policymakers left interest rates unchanged at their final meeting of the year, while the Hungarian forint dropped on signs of a possible rate cut next month.\n\nSimon Quijano-Evans, head of strategy at Macro Hive Ltd.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "3-step method to influence people and win them over, from a Stanford expert: \u2018Your voice is like a muscle\u2019", "full_content": "Think back on the most memorable, inspiring speeches or presentations you've witnessed. They probably weren't delivered in a monotone, Matt Abrahams says.\n\n\"The human brain is designed to pick out and focus on things that are novel and new,\" says Abrahams, a Stanford University lecturer on strategic communication and host of the \" Think Fast, Talk Smart \" podcast. \"So anything that stays the same, like a monotonous voice or cadence, we don't pay as much attention to.\"\n\nIndeed, successful leaders often have an uncanny ability to win over a crowd: The power of persuasion lies not just in what you actually have to say, but also in how you say it, research shows . The topic has taken on new relevance this week as Nvidia interim CEO Colette Kress steps into one of the most closely watched leadership roles in corporate America.\n\nIn appearances this week, including Nvidia's quarterly earnings call and an interview with CNBC's \"Mad Money\" host Jim Cramer, Kress has discussed the company's performance. She's also addressed employees and investors in a time of leadership upheaval, following Nvidia co-founder Jensen Huang's high-profile resignation on Nov. 12.\n\nHow Kress communicates has drawn attention and, in some circles, criticism. On Wednesday, The Wall Street Journal described her public speaking style as \"slow, steady, almost monotone.\" That doesn't necessarily make it ineffective. Her situation, however, highlights a broader challenge leaders face when they need to inform, reassure and persuade large groups of people at once.\n\nGenerally speaking, anyone can stand a better chance at persuading others to follow them by honing an engaging speaking style, says Abrahams. Some people may be naturally expressive and engaging.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "These 51+ Amazon Black Friday deals are even better than Prime Day - NBC News", "full_content": "These 51+ Amazon Black Friday deals are even better than Prime Day NBC News Amazon\u2019s annual Black Friday sale is officially live with 12 days of the year\u2019s best deals CNN Amazon Black Friday Deals 2026: 50 Products Discounted 50% or More Rolling Stone My Group Chat Wants to Know What\u2019s in My Cart for Black Friday \u2014 I\u2019m Sending These 13 Early Amazon Deals from $6 People.com Thanksgiving Isn\u2019t Until Next Week, but Amazon\u2019s Black Friday Sale Is Already Live\u2014With Deals Up to 76% Off Allrecipes", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 01:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "S&P 500 heads for 6th straight decline. Plus, J&J advances two key products", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic IPO live updates: AI lab tops $2 trillion market cap after record offering - CNBC", "full_content": "Anthropic IPO live updates: AI lab tops $2 trillion market cap after record offering CNBC Anthropic IPO live: Anthropic stock closes up 17% from initial price for $1.27T valuation in first day of trading Yahoo Finance AI giant Anthropic's shares pop in debut after blockbuster IPO NPR Anthropic begins trading in the biggest IPO on record despite the many fears surrounding AI AP News Jacob Coxon Joins Protesters Outside Anthropic\u2019s HQ WSJ", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 01:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Japanese investors sought $9.4 billion of shares in Anthropic IPO, sources say", "full_content": "TOKYO, - Japanese investors sought to buy more than 1.5 trillion yen worth of Anthropic shares at its public listing this week, two people familiar with the offer said.\n\nJapanese investors ultimately secured $2.98 billion worth of the shares, a filing showed on Thursday.\n\nAnthropic raised $81 billion in total worldwide in what became the world's largest initial public offering on record, eclipsing SpaceX, which raised $75 billion at its listing in June.\n\nMarket sentiment has turned against AI-related firms in recent months, which sparked speculation that the Claude developer's listing would struggle to win over investors.\n\nAnthropic ultimately priced its offering at $83 per share, above its initial range of $70 to $78.\n\nSome Japanese investors saw Anthropic as the frontrunner among AI firms and so justified large orders, said the people, who spoke on the condition of anonymity because they were not authorised to discuss the \u200bIPO publicly.\n\nOther investors sought smaller allocations or sat out the offering altogether, seeing greater prospective returns in semiconductor stocks that have fallen sharply, such as Nvidia and Kioxia, or in waiting for OpenAI\u2019s listing due next year, one of the people said.\n\nMore than 1,000 individuals sought allotments over 100 million yen, according to a demand survey by Mizuho Securities, part of Mizuho Financial Group, which was among the underwriters of the IPO and arranged the sale of the majority of shares sold in Japan. These applications totalled around 200 billion yen, the survey showed.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:32 AM IST", "pub_date_relative": "1h ago"}, {"title": "Walmart hikes outlook as CEO tells CNBC retailer aims to keep prices low despite soaring fuel costs", "full_content": "Walmart on Thursday reported earnings and revenue that narrowly topped estimates and raised its full-year outlook as it saw strong e-commerce growth ahead of the busy holiday season.\n\nWalmart said global e-commerce sales surged 17% in the fiscal third quarter, driven by store-fulfilled pickup and delivery, with Walmart U.S. up 23% and Sam's Club U.S. rising 30%. Its Walmart U.S. advertising business saw a 37% sales increase for the quarter.\n\nWalmart said it rolled back prices on nearly 8,000 products across its stores, a focus as U.S. consumers worry about the cost of living in the face of elevated food and gas prices.\n\nCEO John Furner told CNBC's Becky Quick that the company has seen higher-than-expected diesel costs, but that tariff refunds have helped the retailer to offset those inputs and maintain lower prices.\n\n\"The reality is that increases in diesel fuel and transportation, they do work their way into cost of goods,\" Furner said in an exclusive interview. \"So we're hoping to see these costs come down as soon as possible, and we'll keep prices as low as we can.\"\n\nCFO John David Rainey told CNBC that growth in online orders for Walmart and Sam's Club was driven by an emphasis on speed of delivery and reduced prices. He added that Walmart saw its largest share gains in the food category in three years during the third quarter.\n\n\"This was another really solid quarter for us, we feel good about it,\" Rainey told CNBC. \"We continue to gain share while continuing to improve the profitability of our digital businesses.\"\n\nWalmart also raised its full-year guidance, now expecting net sales to increase between 4.9% and 5.2%, compared with previous guidance of a 4% to 5% increase. Rainey said Walmart is maintaining \"flexibility\" in its guidance.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "Canadian dollar steadies near 19-month low as stocks slide", "full_content": "TORONTO, Nov 19 (Reuters) - The Canadian dollar steadied near an earlier 19-month low against its US counterpart on Thursday as risk aversion rose and ahead of domestic retail sales data that could help guide expectations for Bank of Canada interest rate hikes.\n\nThe loonie was trading nearly unchanged at 1.4332 per US dollar, or 69.77 US cents, after touching its weakest intraday level since April 2025 at 1.43575.\n\n* US stock indexes tumbled after Anthropic's blockbuster market debut failed to ease concerns about the AI trade, triggering a broader market selloff.\n\n* \"You've got a little bit of risk aversion in the market - that's bullish for the US dollar,\" said Rahim Madhavji, president at Knightsbridge Foreign Exchange. \"The loonie is struggling to find catalysts that are going to help it.\"\n\n* The price of oil, one of Canada's major exports, rose 0.7% to $83.84 a barrel as investors focused on fresh reports of tanker disruptions in the Strait of Hormuz. Still, oil has pulled back sharply from its October peak.\n\n* \"The dominant themes are interest rate diversion, oil prices are a bit of a headwind, US dollar strength,\" Madhavji said.\n\n* Investors have fully discounted an interest rate hike by the Federal Reserve next month and are leaning toward further tightening in January, swap market data shows. Chances the Bank of Canada would hike in December are seen at 67%.\n\n* Canadian retail sales data for September, due on Friday, could help guide BoC rate hike expectations. Economists expect a month-over-month increase of 0.7%.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 01:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump bought Nvidia, Palantir, SpaceX in September as federal deals, White House ties grew", "full_content": "President Donald Trump's investment accounts bought shares of Nvidia , Palantir and Elon Musk 's SpaceX in September, around the time the companies secured major federal contracts and their executives met with the president, according to a newly released financial disclosure.\n\nThe 25-page filing shows 751 purchases and sales totaling between roughly $40.9 million and $148.1 million, according to a CNBC analysis. Purchases accounted for at least $29.2 million and sales at least $11.7 million. The filing reports transactions in broad dollar ranges, leaving the exact amounts and value of Trump's holdings unclear.\n\nAmong the transactions were Palantir purchases before the company received two federal contracts worth $42.5 million combined, according to contracting records, SpaceX investments shortly before and after a $946 million NASA contract expansion , and Nvidia trades as its then-CEO, Jensen Huang , cultivated a close relationship with Trump .\n\nThe trades underscore a striking feature of Trump's presidency: His personal fortune remains invested in companies whose fortunes his administration can shape. His accounts reported more than 21,000 trades in 2025 , compared with roughly 500 during his entire first term. Recent presidents have generally divested individual stocks or used blind trusts to avoid potential conflicts.\n\nThe White House has told CNBC previously Trump and his family have no control over the trades, which outside financial managers handle independently . The Trump Organization says the arrangement is designed to avoid even the appearance of a conflict. There is no evidence Trump directed the transactions or that his managers knew government decisions in advance.\n\nWhite House spokesman Davis Ingle said that Trump's portfolio is independently managed and that neither the president nor his family has any input on trades.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 01:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "As Sanofi's Pompe drug shortage drags on, some patients struggle to access treatments", "full_content": "The French drugmaker Sanofi told her that a shipping delay had interrupted supply of the drug that she relies on to manage her rare muscle-wasting disease. Her next infusion was canceled. Griffin, who is 51 and uses a wheelchair due to Pompe disease, fears what will happen if the shortage isn't resolved soon.\n\n\"You're basically letting the disease take over again,\" she said. \"It's terrifying.\"\n\nMore than three months after initial reports of supply problems with treatments for Pompe disease, the disruption drags on, with more patients learning their infusions have been canceled. Sanofi said it has made progress restoring the supply to patients in some countries, but added that shipping delays could interrupt infusions for some U.S. patients through the end of November.\n\nFor more stories like this, sign up for the CNBC Cures newsletter .\n\nA Sanofi spokesperson said there were no issues with drug quality and the company is \"committed to ensuring that the most vulnerable patients receive treatment first during this period.\" The company added that patients should speak with a health professional before taking another treatment, adding, \"these medicines are not interchangeable.\"\n\nIn a statement, the Food and Drug Administration said \"patient access to these treatments is a priority for the agency and we have offered our assistance to Sanofi on anything needed to help ensure all patient needs are met.\"\n\nAbout one in every 19,000 babies is born with Pompe disease, which is named after the Dutch pathologist who discovered the condition nearly a century ago.\n\nPatients lack an enzyme for breaking down a complex sugar, causing a toxic buildup of glycogen inside their cells. Their muscles weaken and their heart can become enlarged. They have trouble breathing and eating. Left untreated, the disease is often fatal.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 01:08 AM IST", "pub_date_relative": "2h ago"}, {"title": "Brazil\u2019s central bank steps in to stem real\u2019s slide since Lula\u2019s re-election", "full_content": "Currency has slipped from R$5 to R$5.90 to the dollar following leftwinger\u2019s victory last month", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 12:55 AM IST", "pub_date_relative": "2h ago"}, {"title": "We\u2019re in our 50s and terrified of a market crash. Should we put $400,000 of our $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 12:45 AM IST", "pub_date_relative": "2h ago"}, {"title": "The surprising reason the U.S. economy is speeding up \u2014 and might have more room to run", "full_content": "The main engine of U.S. growth is in overdrive.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 12:43 AM IST", "pub_date_relative": "2h ago"}, {"title": "This tech stock has been nearly cut in half this year. I think Wall Street is getting it wrong", "full_content": "AppLovin's accelerating revenue growth and expansion into e-commerce make the AI advertising company an attractive investment opportunity, says analyst Paul Meeks.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 12:38 AM IST", "pub_date_relative": "2h ago"}, {"title": "Amid recent banking outages, should you start carrying cash again? Top advisors weigh in", "full_content": "For years, Americans have moved away from using physical U.S. currency in favor of credit, debit and digital payments. But amid the recent outages affecting some consumer banking services , experts say it's wise to revisit cash .\n\nJPMorgan Chase on Monday reported a technical issue that disrupted some consumer banking services, with ripple effects extending to several major U.S. banks and the peer-to-peer payments network Zelle. A day later, a separate outage affected Apple , temporarily disrupting Apple Pay and iCloud, the service that keeps data available across various Apple devices.\n\nThose reports came on the heels of separate, widespread issues with Microsoft Outlook and communication systems used by air traffic control centers .\n\nAs technology outages expose vulnerabilities across parts of the U.S. economy, some top advisors say consumers should reconsider keeping physical money on hand.\n\n\"This is about preparedness, not panic,\" said David La Placa, CEO of Intellectus Partners in San Francisco, which ranked No. 92 on CNBC's Financial Advisor 100 list for 2026. \"I think keeping some cash at home is a reasonable starting point for many households.\"\n\nLa Placa advises consumers to \"build redundancy\" into their financial lives.\n\n\"Maintain access to at least a second financial institution, keep a backup credit card from a different issuer and make sure you have more than one way to access liquidity,\" he said.\n\nA client's cash management should be diversified, said Seth Fierston, a certified financial planner and co-president of Fierston Financial Group in West Hartford, Connecticut. The firm ranked No. 22 on CNBC's Financial Advisor 100 list .", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 12:36 AM IST", "pub_date_relative": "2h ago"}, {"title": "Offshore Chinese Yuan Drops to Weakest Level in Over a Month", "full_content": "(Bloomberg) -- The offshore Chinese yuan declined to the weakest level in more than a month while the dollar rallied as risk appetite shrank.\n\nThe yuan fell as much as 0.5% to touch 6.6999 against the US dollar on Thursday, the lowest since mid-October. The Chinese currency sold off along with many other emerging market currencies, including the Colombian peso, the South African rand and the Hungarian forint. A gauge of EM currencies is down 0.1%, while the Bloomberg Dollar Spot Index is up 0.2%.\n\n\u201cThe yuan has been grinding higher for quite some time, and the market appears to have been caught off-guard today,\u201d said Alex Cohen, a strategist at the Bank of America. \u201cThe broader dollar rally is making emerging markets increasingly less attractive.\u201d\n\nBoth the offshore yuan and its onshore counterpart, which trades inside mainland China and is state managed, have advanced about 4% against the dollar this year.\n\nEarlier this week, China\u2019s central bank boosted its daily yuan reference rate to the strongest in more than four years for the onshore currency as the country hosted a key regional summit in Shenzhen. China\u2019s leader Xi Jinping met with his US and Russian counterparts Donald Trump and Vladimir Putin, respectively, amid a backdrop of war. China and the US are also in a spiraling chip battle as Washington restricted China\u2019s access to chips that are crucial to the global AI race.\n\nThe latest so-called yuan fixing shows \u201cthe government is uncomfortable\u201d with levels, according to Paresh Upadhyaya, a strategist at Pioneer Investments.\n\n\u201cThey have been verbally intervening over the last few weeks, but the fixing was the first concrete step that the appreciation was just too much,\u201d he said. \u201cI also think it was delayed reaction to the broad-based emerging markets selloff in the foreign currency market we\u2019ve seen over the last few days.\u201d\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:21 AM IST", "pub_date_relative": "2h ago"}, {"title": "Jensen Huang's \u2014 and Nvidia's \u2014 legal exposure balloons", "full_content": "The still-unraveling scandal of former Nvidia CEO Jensen Huang 's extramarital affairs and the tech giant's potential role in its advanced semiconductor chips ending up in China present a legal minefield for Huang and Nvidia.\n\nFederal and state prosecutors and Nvidia employees may target Huang and the company in court, where some shareholders have already taken action.\n\nThat's on top of a rapidly growing pile of probes by Republicans who control Congress now and Democrats who will have majorities in both the House and Senate come January.\n\n\"It's not going to get any better for Jensen Huang; it's going to get far worse,\" said Salvatore Graziano, a New York securities litigation attorney at Bernstein, Litowitz, Berger & Grossmann. His firm is looking at shareholder lawsuit opportunities against Nvidia and Huang.\n\n[Huang] \"faces the Department of Justice, the Securities and Exchange Commission and private litigation,\" Graziano said. \"The criminal exposure is very serious. The SEC could bar him from being an officer. And the potential liability [from shareholder] lawsuits can be very large.\"\n\nHuang's and Nvidia's legal exposure stems from three issues that led up to his shock resignation Nov. 12.\n\nThere's his alleged affair with suspected Chinese spy Alice Huang, who worked for Megaspeed , a Singapore-based company under investigation for diverting advanced Nvidia semiconductor chips to China in violation of U.S. export rules. That, in turn, has raised questions about whether Huang and Nvidia were aware of any diversions.\n\nThere are Huang's two other alleged affairs with Nvidia employees.", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 12:14 AM IST", "pub_date_relative": "2h ago"}, {"title": "Oil prices inch up as tanker disruptions offset surplus supply outlook", "full_content": "NEW YORK, Nov 19 (Reuters) - Oil prices inched higher on Thursday as investors focused on fresh reports of tanker disruptions in the Strait of Hormuz, helping the market recover from the previous session's selloff driven by rising US inventories and surplus forecasts.\n\nBrent crude futures rose 77 cents, or 0.8%, to $92.72 a barrel by 1:11 p.m. ET (1811 GMT). US West Texas Intermediate crude for December gained $1.08, or 1.3%, to $84.34. The December contract expires on Friday, while the more actively traded January contract advanced 91 cents, or 1.1%, to $83.21, with trading volumes nearly seven times those of the front-month contract.\n\nTwo oil tankers hit naval mines in the Strait of Hormuz on Thursday and \"exploded,\" Iran's navy said in a statement carried by state media. Reuters could not independently verify the report.\n\nThe Iran-aligned Houthi movement also fired missiles at the Saudi Arabian capital Riyadh.\n\nSaudi Arabia's civil defence said on Thursday that the attack on Riyadh's tallest skyscraper, headquarters of the Saudi sovereign wealth fund, caused material damage to several floors of the tower and nearby buildings, but no injuries were reported, state news agency SPA reported. Earlier in the day, two Western officials briefed by the Saudis said the kingdom is preparing for war against Yemen's Houthis to stretch well into next year.\n\n\"Rising Iranian attacks are weighing on Middle Eastern exports just as China ramps up crude imports, reducing oil on water and tightening the oil market,\" said UBS analyst Giovanni Staunovo.\n\nCumulative losses from the Middle East conflict have now reached 2.8 billion barrels of oil and 60 billion cubic metres of gas supply from the Gulf, the International Energy Agency said on Thursday.\n\nThe IEA, however, added that the conflict could cut world oil demand by more than 4% by 2035 if governments accelerate electrification, efficiency and fuel-switching measures in response.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 12:11 AM IST", "pub_date_relative": "3h ago"}, {"title": "TSMC tightens China AI chip curbs as new US rules close manufacturing loophole, sources say - Reuters", "full_content": "TSMC tightens China AI chip curbs as new US rules close manufacturing loophole, sources say Reuters Commerce approved sales of more than 879,000 AI chips to Chinese companies, Rep. Mast says CNBC Opinion | The Jensen Huang doctrine loses in Washington The Washington Post America must get serious about Chinese chip spying The Economist How Nvidia Chips Ended Up Within Reach of China\u2019s Military The New York Times", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 12:09 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Intuit to sell Mailchimp to Bending Spoons for $3.68 billion", "full_content": "Tax software maker Intuit said Thursday that it has agreed to sell marketing subsidiary Mailchimp to Italian technology consolidator Bending Spoons for $3.68 billion in cash and stock. The deal is set to close in early 2027, according to a statement .\n\nThe sale is a costly retreat for Intuit, which paid $12 billion for Mailchimp in 2021 in a push beyond its core tax and accounting businesses. Five years later, the software maker is unloading the email-marketing company for less than one-third of that price after Mailchimp became a drag on its overall revenue growth.\n\nThe deal is the latest instance of Bending Spoons picking up a once promising technology asset. The company bought productivity software startup Airtable in September for 10% of what it was once worth.\n\nThe Bending Spoons portfolio also contains AOL, Brightcove, Eventbrite, Evernote, Meetup, Vimeo, and WeTransfer.\n\nIn August Intuit started running Mailchimp as a distinct operating segment . The move was meant to give investors more transparency as the company tried to manage the unit for profitability, Sandeep Aujla, Intuit's finance chief, said at a September company briefing.\n\nAlso on Thursday, Intuit announced stronger-than-expected earnings and revenue for its fiscal first quarter, which ended on Oct. 31. The company reported $2.91 in adjusted earnings per share on $4.35 billion in revenue. Analysts polled by LSEG were looking for $2.70 per share and $4.31 billion in revenue.\n\nWhile Intuit's revenue increased 12% year over year, Mailchimp revenue declined 1% to $313 million. Analysts polled by StreetAccount had expected $314.4 million.\n\nManagement called for $22.88 to $23.12 in adjusted earnings per share for the 2027 fiscal year, with $23.081 billion to $23.365 billion in revenue. Analysts polled by LSEG had predicted $23.62 in adjusted earnings per share on $23.43 billion in revenue. Intuit shares tumbled 15% in extended trading.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 03:10 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What Ron Johnson's 'Ponzi scheme' label gets wrong about Social Security, experts say", "full_content": "A new Senate budget committee hearing on Wednesday reignited an old Social Security question: Is the program, which provides monthly benefits to millions of Americans, a Ponzi scheme?\n\nSenate Budget Committee Chairman Ron Johnson, a Republican representing Wisconsin, called Social Security \"a legal Ponzi scheme\" in his opening remarks. But experts say his comments overlook how Social Security works and the real dilemma for lawmakers over its looming funding shortfall.\n\nA Ponzi scheme is an investment fraud that uses funds from new investors to pay existing investors, according to the Securities and Exchange Commission, Johnson wrote in his chairman's hearing memo . He said that Social Security fits the description if you remove the word \"fraud.\"\n\nJohnson's comments followed his Wednesday morning interview on Fox Business , where he said, \"At this point, there's really no way to fix Social Security.\"\n\n\"You can't fix it, you just shut it down and then hope that you can recover some of your money,\" Johnson said during the Fox Business interview.\n\n\"As far as I can tell, this is the first time in decades that a senior senator, chairman of the budget committee, said he would rather shut down Social Security than fix it,\" Sen. Ron Wyden, D-Ore., said during the hearing.\n\nAt the Senate hearing, Johnson said his comments during the TV interview were \"imprecise\" and that he was talking broadly about Ponzi schemes, not Social Security, that need to be shut down.\n\nJohnson said he wants lawmakers to pass a law to ensure seniors' Social Security benefits are not reduced, \"then roll up our sleeves and fix the real problem, which is $24 trillion of 10-year deficits.\"", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 03:05 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Commerce approved sales of more than 879,000 AI chips to Chinese companies, Rep. Mast says", "full_content": "The subagency of the Commerce Department that regulates and enforces exports approved the sale of more than 879,000 AI chips to Chinese companies including Alibaba and Tencent as of May 2026, according to documents released Thursday by the House Foreign Affairs Committee.\n\nSome of those approvals, made by Commerce's Bureau of Industry and Security, included sales to companies designated by the Department of Defense as \"Chinese Military Companies,\" according to the documents. As of May, there had been 3.4 million requested sales of U.S. AI chips to China, the committee reported, citing those made by Nvidia and Advanced Micro Devices .\n\n\"Over the past month, the administration's handling of chip export controls has put our national security and technology edge at risk. The Bureau of Industry and Security has failed to enforce the rules, and Congress must now conduct rigorous oversight of the administration's policies,\" Rep. Gregory Meeks, D-N.Y., the top Democrat on the House Foreign Affairs Committee, said at a meeting of the panel Thursday at which members voted to release the documents.\n\nThe Commerce Department, AMD and Nvidia did not immediately respond to requests for comment.\n\n\"The license information we are disclosing today will help inform the American public about how BIS has handled licenses for Nvidia H200 and equivalent AMD chips to China.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:57 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US court ruling jeopardizes Sentinel Midstream\u2019s license for deepwater oil export project", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:54 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Elastic shares tumble on disappointing revenue outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:54 AM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Retail Investors Dive Into Both Sides of the Anthropic Trade", "full_content": "(Bloomberg) -- Retail traders rushed to buy \u2014 and sell \u2014 Anthropic PBC shares in one of the busiest market debuts on record Thursday.\n\nNon-professional investors\u2019 net buying of Anthropic shares was on track to reach between $80 million and $90 million by the end of the day, according to Vanda Research. That would make it the third-biggest listing day on record, trailing SpaceX\u2019s $118 million earlier this year and Coinbase Global Inc.\u2019s $92 million in 2021, Vanda\u2019s Viraj Patel wrote in a note. Total turnover by retail traders \u2014 including buying and selling \u2014 was poised to reach $1.4 billion, some three times as much as SpaceX\u2019s turnover and a \u201crecord for a listing day by a wide margin.\u201d\n\n\u201cRetail are trading the stock hard,\u201d Patel said. He noted traders were \u201ctaking both sides rather than a one-way bid.\u201d\n\nThose investors sold single stocks to pay for Anthropic purchases, Patel added. The sales spanned the entire \u201cAI complex,\u201d led by Advanced Micro Devices Inc., which slid after Hunterbrook Capital said it shorted the stock on potentially risky business in China. Meantime, bids for shares of perennial retail favorite Nvidia Corp. \u201cdried up,\u201d Patel said.\n\nRetail investors wanted \u201cway more\u201d of an allocation to the Anthropic offering than they got, according to Steven Quirk, chief broking officer at Robinhood Markets Inc. Robinhood, the largest retail broker in the US, got a \u201cgood allocation,\u201d but the first day of trading on the platform was dominated by institutional investors, he said.\n\nNevertheless, every customer who wanted Anthropic stock got at least a share, Quirk said on the sidelines of the Bloomberg ETFs in Depth conference Thursday.\n\nAnthropic shares soared 21% above their IPO price after the AI lab\u2019s blockbuster $107.3 billion debut broke SpaceX\u2019s record for the biggest-ever offering.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "20 Nov 2026, 02:52 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "UnitedHealth\u2019s stock tumbles after government signals crackdown on Medicare Advantage fraud", "full_content": "UnitedHealth Group\u2019s stock fell again on Thursday amid a tough week in which the government pledged to crack down on Medicare Advantage fraud and lawmakers renewed calls for Medicare for All.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Nov 2026, 02:52 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Diversified Energy closes $1.8 billion Permian Basin acquisition", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:50 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Endava receives NYSE non-compliance notice over delayed filing", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:50 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Natural Grocers declares $0.15 quarterly dividend", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Nov 2026, 02:50 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic IPO: Investors who flip the stock may face brokerage penalty", "full_content": "Retail investors with access to Anthropic's initial public offering who sell the stock quickly after buying could get penalized by their brokerage firm.\n\nAnthropic said in an IPO prospectus that it expected to make shares available to retail investors through various brokerages, including Charles Schwab , Fidelity, Robinhood , SoFi , E*Trade and some of their respective affiliates.\n\nFollow CNBC' s live coverage of Anthropic's IPO and Nasdaq debut\n\nThese broker-dealers have different \"anti-flipping\" policies meant to discourage investors who purchase IPO shares \u2014 including those of Anthropic \u2014 from dumping them quickly. Charles Schwab is the only one that doesn't have such a policy in place.\n\n\"One purpose is to discourage 'flippers' who are just buying with the hope of making a quick profit,\" Jay Ritter, director of The IPO Initiative at the University of Florida, said in an email. \"Their selling could put downward pressure on the price once trading starts.\"\n\nInvestors who run afoul of anti-flipping rules may be prohibited from accessing future IPOs, perhaps for several months or even more than a year for repeat offenders. In the worst case, the brokerage may bar them from all future IPOs.\n\nThese policies apply only to retail investors who place an order with their brokerage firm to buy the Anthropic IPO at its offering price \u2014 something many investors don't have access to.\n\nFor example, Fidelity customers are eligible to participate in the Anthropic IPO if they have at least $25,000 in certain assets, the firm said . Even then, customers are \"evaluated and ranked\" based on factors like account assets to determine who can access limited shares that may be available, it said .", "source": "CNBC Top News", "pub_date_str": "20 Nov 2026, 02:46 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AMD dives on short-seller report of alleged China exposure", "full_content": "Shares of chipmaker Advanced Micro Devices close down 7.72% to $489.19 Thursday after investment firm Hunterbrook Media issued a report alleging that the company \"has its own China problem.\"\n\nHunterbrook disclosed that it had taken a short position in AMD.\n\nThe report claims that \"after the U.S. blacklisted Chinese server maker IEIT Systems, the company kept getting newer AMD firmware, which enables AMD chips to run in servers.\"\n\nHunterbrook also said that new export rules in Washington could \"tighten restrictions on AMD's foreign business,\" alleging that AMD \"bills over 20% of its revenue to customers in China and Hong Kong,\" and \"depends on a Chinese partner to finish most of its chips.\"\n\nAMD, 1-day The allegations come amid investigations of rival chipmaker Nvidia over its sales to companies in Asia with ties to China. AMD has been viewed as a beneficiary of the uncertainty surrounding Nvidia.\n\n\"The claims misrepresent AMD's business practices and relationships,\" an AMD spokesperson said in a statement. \"AMD complies with applicable US export control laws and regulations and maintains rigorous processes to ensure compliance across our global operations. We remain focused on serving our customers and upholding the highest standards of integrity.\"\n\nLisa Su, CEO of AMD, told investors on the company's recent earnings call that China is an \"important\" market and that the semiconductor giant wants to be fully compliant with U.S. export controls.\n\nAMD continued to slide after-hours, trading down 0.45% to $487 shortly after 4 p.m.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:44 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic closes first day at $97.17 per share in landmark moment for AI: IPO live updates", "full_content": "Anthropic jumped 17% in its Nasdaq debut on Thursday in a seminal moment for artificial intelligence, after the company completed the biggest initial public offering on record, topping SpaceX' s historic debut in June. The stock closed at $97.17 per share. The Claude creator, trading under the ticker \"ANT,\" opened at $111.50, after the company raised $81.3 billion in the IPO. Anthropic sold 980 million shares at $83 a piece on Wednesday, lifting the size and price of its offering.\n\nAt Thursday's close, Anthropic had a fully diluted market cap of $1.75 trillion. More than 846 million shares changed hands, surpassing the 522 million shares that were traded on SpaceX's opening day.\n\nThe 5-year-old company captivated the corporate world with its Claude AI models and products, which have fueled its meteoric rise this year. Anthropic said in its prospectus that it generated $33.24 billion in revenue for the nine months ended Sept. 30, up a staggering 1,200% from the same period last year.\n\nAnthropic CEO Dario Amodei co-founded the company in 2021 after he and a small group of researchers defected from OpenAI , now its chief rival. Anthropic has faced sharp criticism over its positions on safety, regulation and national security, including by President Donald Trump and other senior government officials.\n\nCNBC's reporters are covering Anthropic's IPO live on air and online from our bureaus in San Francisco and Englewood Cliffs, New Jersey, and from the Nasdaq in New York City.\n\nAnthropic investors Amazon and Google own roughly 28% of the company's outstanding capital stock following the offering.\n\nThe company said Amazon owns 14.7%, while Google owns 13.7%, according to its prospectus.\n\nGoogle initially invested in Anthropic in late 2022, not long before the company first launched its Claude chatbot in 2023. Amazon announced its initial investment in Anthropic in September of 2023.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:44 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock market today: Dow sinks 1,100 points, S&P 500 and Nasdaq tank 2% as Anthropic IPO grabs spotlight - Yahoo Finance", "full_content": "Stock market today: Dow sinks 1,100 points, S&P 500 and Nasdaq tank 2% as Anthropic IPO grabs spotlight Yahoo Finance Stocks plunge as investors take cover amid growing uncertainty CBS News UnitedHealth Is Behind Nearly Half the Dow's Drop Barron's Dow Drops 475 Points On Losses For UnitedHealth, Chevron Shares Moomoo Dow ends down 560 points as stocks finish mostly lower ahead of Anthropic's IPO MarketWatch", "source": "Google News Business", "pub_date_str": "20 Nov 2026, 02:36 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic shares jump 17% after record Wall Street listing", "full_content": "AI group led by Dario Amodei raises $81bn in upsized public offering", "source": "FT Markets", "pub_date_str": "20 Nov 2026, 02:32 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Palo Alto stock jumps on earnings beat and company's big bet on securing open-weight models", "full_content": "Palo Alto Networks shares rose 6% on Thursday as businesses boosted spending on cybersecurity products and investors cheered the company's acquisition of a startup that pushes it into securing open-weight artificial intelligence models.\n\nThe company beat Wall Street's estimates for the fiscal first quarter. Revenue jumped 39% from a year ago and Palo Alto lifted its guidance for the year.\n\nRecent outages at Microsoft , banks and the Federal Aviation Administration have left businesses reeling. While U.S. officials haven't detected any malicious activity, the disruptions raise concerns over aging equipment and infrastructure. Many businesses are scrambling to patch vulnerabilities at a faster clip than ever before to keep pace with the growing risks of AI-powered cyberattacks.\n\nThose fears have led more businesses to consolidate platforms, which is fueling growth in areas like firewall and AI security, Palo Alto Networks CEO Nikesh Arora told CNBC's \" Mad Money \" on Wednesday.\n\n\"They're going to have to make sure they get the best players in the market to come support them because this is no longer child's play,\" Arora said.\n\nAlongside earnings, Palo Alto announced a $4.5 billion deal to buy Applied Compute, a startup that helps train customized open-weight models. It's one of several recent deals in Arora's aggressive acquisition spree and marks a significant shift beyond cybersecurity.\n\n\"Rather than being one player out of 10 in the industry serving compute, we want to be the one player with Palo Alto that delivers secure compute and security capability,\" Arora told CNBC.\n\nPalo Alto expects the deal to add more than $1 billion in annual recurring revenue to its next-generation security business by the 2029 fiscal year.", "source": "CNBC World Economy", "pub_date_str": "20 Nov 2026, 02:30 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Sour Crude\u2019s War Premium Vanishes as Supply Surges", "full_content": "The price of US sour oil has plunged, as a surge of oil from Venezuela, Canada and the Middle East gives refiners ample barrels to choose from.\n\nUS medium sour export grade Mars, which is pumped from deepwater wells in the Gulf of Mexico and is similar to Middle Eastern crude, traded at a record premium to benchmark West Texas Intermediate futures in the early days of the Iran war as buyers hunted for alternate supplies to those disrupted by the closed Strait of Hormuz.\n\nNow, as oil markets begin to settle after a volatile year, Mars has fallen to a steep discount, making it cheaper for US refiners built to process heavier crude.\n\nMars has dropped from a $10 premium to a $4 discount to WTI futures in less than a month. That\u2019s the steepest discount since late September.\n\nAt the peak of Middle Eastern oil supply disruptions in March and April, it notched a record $17.50 premium even as futures traded for over $100 a barrel. At the start of the year, before the US and Israel launched their war in Iran in late February, Mars largely traded at a discount.\n\nRising production of heavy-sour crude in Venezuela and Canada has pushed global prices lower in recent weeks. US refiners, whose Gulf Coast and Midwest plants ar
