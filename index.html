<script>

    const allData = {"general": [{"title": "Best Buy launches new gaming hub ahead of 'Zelda' and 'Grand Theft Auto VI'", "full_content": "Best Buy is tapping further into a growing customer cohort: gamers.\n\nChief Revenue Officer Patrick McGinnis told CNBC exclusively that the electronics retailer is launching a new experience Tuesday for customers featuring gaming content, new technology and special offers, among other features. The online destination is called Best Buy Gamers and is launching in a beta version.\n\n\"Gamers are a customer that are really like no other in terms of their passion for not just the tech, the titles, but also how they want to work with each other as a community,\" McGinnis said. \"So for us, being relevant for that customer wherever and whenever they want to interact with the thing that they love is really important.\"\n\nBest Buy says millions of gamers shop at the retailer each year, including trying out games in the store and seeking advice from in-store experts. The new gaming experience, created in partnership with video game website IGN, will offer members gaming articles and reviews, live Best Buy event updates for launches and deals on new technology.\n\nThe announcement comes ahead of some of the biggest launches in gaming this year, including the Nov. 5 release of \"The Legend of Zelda: Ocarina of Time,\" a remake from Nintendo , and the Nov. 19 launch of Take-Two Interactive 's highly anticipated \"Grand Theft Auto VI.\"\n\nMcGinnis said the timing of the rollout is \"pretty perfect\" given the slate of new video games over the next month, though Best Buy has been developing the new platform for over a year.\n\n\"We want to be relevant for our gaming customers, not just during the important, big tentpole periods of the calendar, like when we have these big gaming launches coming up, but really every day,\" he said. \"We want to be there when they discover new titles and connect with the community, and not just when they're buying a big console or a new gaming title.\"\n\nBest Buy has been leaning into gaming as it sees growing demand from its customers.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 06:15 PM IST", "pub_date_relative": "5m ago"}, {"title": "General Motors beats Wall Street's Q3 earnings expectations, narrows full-year guidance", "full_content": "DETROIT \u2014 General Motors narrowed its 2026 earnings guidance and raised its free cash flow expectations after beating Wall Street's third-quarter expectations.\n\nThe Detroit automaker also announced a new multiyear stock buyback of $20 billion after GM completed a $6 billion share repurchase program that was announced in January. GM did not disclose a specific time to complete the program.\n\nHere's how GM performed in the third quarter, compared with average estimates compiled by LSEG:\n\nThe new guidance includes adjusted earnings before interest and taxes of between $14.5 billion and $15.5 billion, or $12.75 to $13.75 adjusted earnings per share, and adjusted automotive free cash flow of between $11.5 billion and $12.5 billion.\n\nThat compares with its raised guidance from July that included adjusted EBIT of between $14 billion and $16 billion, or $12 to $14 adjusted EPS, and adjusted automotive free cash flow of $9.5 billion to $11.5 billion.\n\n\"I think the market's been pretty consistent from what we've said all year,\" GM CFO Paul Jacobson told CNBC's Phil LeBeau . \"Our fourth quarter's going to be down sequentially. ... I think the fact that we're able to hold our guidance in the face of that late inflationary pressure in the year is another sign of the GM team executing really well.\"\n\nGM stock was off roughly 7% during premarket trading despite the earnings beats.\n\nWall Street analysts were mixed before the report on whether GM would raise its guidance Tuesday amid concerns of slowing sales and rising commodity costs.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 06:14 PM IST", "pub_date_relative": "6m ago"}, {"title": "US single-family housing starts, building permits tumble in September", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:12 PM IST", "pub_date_relative": "7m ago"}, {"title": "Kartoon Studios to launch Hundred Acre Wood products on Walmart Marketplace", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:12 PM IST", "pub_date_relative": "7m ago"}, {"title": "Stifel cuts Almonty Industries stock price target on shipment delays", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:10 PM IST", "pub_date_relative": "9m ago"}, {"title": "Stifel cuts Pool Corp stock price target on margin concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:10 PM IST", "pub_date_relative": "9m ago"}, {"title": "Jefferies maintains Underperform on On Holding stock citing margin pressures", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:10 PM IST", "pub_date_relative": "9m ago"}, {"title": "Stifel maintains Hold on DXC Technology stock amid unit sale reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:10 PM IST", "pub_date_relative": "9m ago"}, {"title": "European stocks extend slide as French unrest triggers de-risking", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:10 PM IST", "pub_date_relative": "9m ago"}, {"title": "S&P, Nasdaq 100 futures fall as AI trade faces renewed pressure, oil tops $110", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:10 PM IST", "pub_date_relative": "9m ago"}, {"title": "Data center stocks slide as Korea IPO plunges 30%, pressuring tech sentiment", "full_content": "Data center stocks struggled Tuesday following a lackluster initial public offering overnight from a South Korean cloud company that has been compared to U.S. neocloud CoreWeave.\n\nShares of Elice dropped more than 30% during their market debut overnight, as investors grow increasingly wary of artificial intelligence-dedicated computing power providers amid concerns about overcapacity.\n\nThe bearish sentiment spilled into U.S. tech equities. CoreWeave shares lost 4% in premarket trading as of 8:08 a.m. ET. Nebius shed about 5% along with Iren . Vertiv pulled back 2%.\n\nHSBC said in a Monday note that the troubles for the heavily levered CoreWeave are not going away.\n\n\"Debt market woes and moderating LLM revenues are exacerbating structural concerns for neoclouds ,\" HSBC analyst Abhishek Shukla wrote. Shukla has a reduce rating on CoreWeave with a price target of $39, implying 36.5% downside.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 06:06 PM IST", "pub_date_relative": "13m ago"}, {"title": "Olenox completes $21.7M acquisition of gas, power assets", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:06 PM IST", "pub_date_relative": "13m ago"}, {"title": "Pliant Therapeutics appoints Craig Blanchette as SVP, Research", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:06 PM IST", "pub_date_relative": "13m ago"}, {"title": "Alberta votes by large majority to remain part of Canada in boost for Carney", "full_content": "Alberta residents voted by a large majority to remain part of Canada in \u200bthe province's first-ever referendum on separation, handing \u200bPrime Minister Mark Carney a much-needed win \u200bas he attempts to unify the country amid a trade war with the US.\n\nAt 5:45 a.m. (1145 GMT) on Tuesday, with three-quarters of the votes counted, 76% of Albertans had backed the \"remain\" side versus 24% in favor of a binding vote on separation. The referendum was nonbinding.\n\n\"Albertans made a clear \u2060choice,\" \u200cCarney said in a statement. \"They chose unity, to build together, and to \u2060take care of each other.\"\n\nPollsters and analysts had dismissed the possibility of a separatist victory in Monday's vote, citing data that showed only about one-third of residents in the western energy-producing province supported a future referendum on leaving.\n\nAlberta Premier Danielle Smith, who announced the referendum in May, \u200cissued a statement saying she was \"very pleased\" that early results showed widespread support for remaining in Canada.\n\nSmith said she would address Albertans at 6:45 p.m. on Tuesday to discuss \"where our province goes from here.\"\n\nA small but vocal group of \u200bseparatists has campaigned for months for an independent Alberta, arguing that the province's energy wealth was subsidizing poorer parts of Canada and that it would be far richer freed from Ottawa bureaucracy.\n\nLast week, Carney told a rally in Calgary that voting to leave Canada would be \"a dangerous bluff that will lead to years of deep division\".", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 06:02 PM IST", "pub_date_relative": "18m ago"}, {"title": "Qualcomm to cut jobs worldwide in performance-focused layoffs, internal memo shows", "full_content": "Qualcomm will cut jobs globally in a \"performance-focused reduction\" following its annual employee reviews, CEO Cristiano Amon told staff in a memo on Monday reviewed by Reuters, with notifications set to begin in November.\n\nThe cuts are part of an effort to build \"a stronger performance culture\" and address situations where the company \"has consistently fallen short of expectations,\" Amon said.\n\nThe memo did not say how many jobs would be affected, and Reuters could not immediately determine the scale of the cuts.\n\nQualcomm did not immediately respond to a request for comment. It had about 52,000 employees globally as of September last year, most of them full-time. Its financial year typically ends in late September.\n\nOne of the world's biggest smartphone chipmakers, Qualcomm has been hit this year by a slump in consumer electronics sales as soaring memory prices weigh on demand in key markets.\n\nIts shares have risen just 1.5% in 2026, compared with gains of more than 12% for the benchmark S&P 500 and nearly 60% for the Philadelphia Semiconductor Index .\n\nIn its latest earnings report in late July, Qualcomm forecast quarterly profit below estimates and said revenue from Apple products would decline faster than expected, while signaling that growth in data-center and other non-handset businesses would more than offset the lost revenue by fiscal 2027.\n\nThe company expects the majority of its chip sales to come from businesses other than smartphones in fiscal 2027 as it expands into the fast-growing AI data-center market.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:59 PM IST", "pub_date_relative": "20m ago"}, {"title": "Apple adds U.S. titanium supplier for iPhone Duo as supply stays tight", "full_content": "Apple is adding a U.S. titanium supplier for its new iPhone Duo and expanding domestic production of camera components for the iPhone 18 Pro as part of a push to expand manufacturing in its home country.\n\nThe company said Tuesday it will commit up to $100 million over the next three years to Perryman Company, based in Houston, Pennsylvania, for the production of titanium used in Apple products, including the $1,999 foldable Duo.\n\nSince the start of President Donald Trump's second term, Apple has been vocal about its efforts to invest more in the U.S., even as the final assembly of most iPhones remains overseas. In August of last year, Apple launched the American Manufacturing Program (AMP), increasing its plan for domestic spending by $100 billion to a total of $600 billion. Tim Cook , Apple's CEO until last month, appeared at the White House for that announcement, as Trump was pushing the iPhone maker and other tech giants to bolster production in the U.S.\n\nThe latest announcement comes as Apple faces severe supply constraints for its first foldable phone, which goes on sale in stores Friday.\n\nOnline delivery estimates for some Duo models stretched to roughly 14 weeks on the first day of preorders, according to Morgan Stanley, the longest wait the firm has recorded for a new iPhone in a decade. Apple said Friday that preorder demand had been \"nothing short of extraordinary,\" but hasn't said whether it plans to increase production.\n\nJPMorgan analysts estimate Apple will ship roughly 8 million to 9 million Duo devices this year, below earlier expectations of about 10 million, because of supply constraints. Apple didn't say whether the agreement with Perryman would increase near-term capacity.\n\nPerryman will melt, forge, and roll grade 5 titanium, which Apple said will contain at least 80% recycled material.", "source": "CNBC World Economy", "pub_date_str": "20 Oct 2026, 05:59 PM IST", "pub_date_relative": "21m ago"}, {"title": "Credit markets have entered uncharted territory as the riskiest junk bonds send a warning to investors", "full_content": "Credit markets are sending unusually mixed messages to investors right now, and it\u2019s making some people nervous.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 05:59 PM IST", "pub_date_relative": "21m ago"}, {"title": "Salesforce to acquire Braze in a $5.66 billion deal", "full_content": "Salesforce said on Tuesday it would acquire customer engagement platform Braze for about $5.66 billion.\n\nThe customer relationship management platform's shares fell 2.6% in premarket trading.\n\nBraze Class A shareholders will receive $47.50 in cash per share, under the terms of the agreement.\n\nThe deal is expected to close in Salesforce's fiscal year 2028, subject to approval by Braze shareholders and regulators.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:55 PM IST", "pub_date_relative": "25m ago"}, {"title": "UK to deploy fighter jets to defend Saudi cities from Houthi attacks", "full_content": "The U.K. said it would provide defensive military support, including fighter jets, to support Saudi Arabia as attacks by Iran-backed Houthi rebels escalate.\n\nThe Houthis, a Yemeni militant group, have launched a series of strikes on Saudi targets in recent weeks. Airport attacks in the capital city of Riyadh led to multiple fatalities, flight cancellations and property damage, while facilities belonging to oil giant Saudi Aramco were targeted last week.\n\n\"The continuing attacks from the Houthis on our ally Saudi Arabia are absolutely despicable. The targeting of the airport in Riyadh in particular shows the lengths the Houthis are going to escalate the situation in the region,\" U.K. Defense Secretary Wes Streeting said in a statement on Tuesday.\n\nHe added that Royal Air Force Typhoon fighter jets will fly defensive air missions to help protect Saudi airspace from drones and missiles.\n\n\"This builds on the UK equipment and personnel we already have in the country to defend against Houthi air attacks,\" Streeting said.\n\nThe U.K. Ministry of Defence also said that the fighter jets would operate only in a defensive role and would not conduct offensive strikes against the Houthis.\n\nIt said the Royal Air Force would also provide an Airbus A400M Atlas jet \"to support the movement of defence materiel within Saudi Arabia,\" while U.K. military advisers will also give support to Saudi staff officers.\n\n\"Escalating violence in the Gulf can have a serious impact at home in the UK \u2014 driving up the cost of living, disrupting energy supplies and costs to British businesses. It is also causing devastation to the civilian population in Yemen,\" the MoD said.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:53 PM IST", "pub_date_relative": "27m ago"}, {"title": "HSBC says CoreWeave shares to drop another 30%-plus because of 'structural concerns for neoclouds'", "full_content": "The bank has a reduce rating on the cloud infrastructure stock.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:53 PM IST", "pub_date_relative": "27m ago"}, {"title": "Bajaj Finance vs IREDA vs Reliance's Jio Financial: Top financial stock to buy after Q2 results 2026 for best returns?", "full_content": "Stocks to buy after Q2 Results 2026: The earnings season is in full swing, and a good number of companies have declared their Q2 results. After about two weeks since the start of the Q2 2026 results season, investors have started comparing the quarterly numbers of their favourite stock. As Bajaj Finance is widely compared with Reliance's Jio Financial Services, and to some extent, both these financial stocks are compared with the Indian Renewable Energy Development Agency ( IREDA ), it would be prudent to compare the Q2 results of these three financial stocks.\n\nThe Bajaj Finance Q2 results show higher profit, net interest income, and assets under management, as well as an increase in new loans booked during the quarter. In the July to September 2026 quarter, Bajaj Finance reported a 29% YoY growth in consolidated PAT to \u20b9 6,367 crore. Assets under management (AUM) grew 26% to \u20b9 5.85 lakh crore.\n\nThe Bajaj Group company reported consolidated PAT of \u20b9 6,367 crore, up 29% YoY from \u20b9 4,948 crore. PBT rose 29% to \u20b9 8,537 crore, while net interest income (NII) increased 24% to \u20b9 13,335 crore. Net total income grew 23% to \u20b9 15,974 crore.\n\nAUM grew 26% to \u20b9 5,84,624 crore, with an addition of \u20b9 37,680 crore during the quarter. The company booked 13.45 million new loans and added 4.42 million customers, taking its customer franchise to 128.85 million.\n\nIREDA reported a standalone net profit of \u20b9 891.75 crore for the H1FY27, marking a 12% YoY increase from \u20b9 95.68 crore. The result significantly exceeded market consensus estimates for the quarter.\n\nThe renewable energy financier\u2019s total income expanded 14% YoY to \u20b9 4,594.29 crore on a standalone basis, supported by robust interest income growth. Interest income, the primary revenue driver, stood at \u20b9 4,514.77 crore in H1FY27, compared to \u20b9 3,938.89 crore in the corresponding period of the previous fiscal.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 05:50 PM IST", "pub_date_relative": "30m ago"}, {"title": "Earnings live updates: All eyes on Musk and Meta as Q3 earnings rev up - Yahoo Finance", "full_content": "Earnings live updates: All eyes on Musk and Meta as Q3 earnings rev up Yahoo Finance Meta, Tesla and Netflix Q3 Updates Coming This Week The Information Netflix, SpaceX, Meta, and Tesla Q3 earnings: What investors need to see from Big Tech this week Business Insider What to Expect in Markets This Week: Meta, Tesla Report; Airlines, Streaming Giants\u2019 Results Due Investopedia SpaceX and Netflix headline busy slate of earnings MarketWatch", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 05:50 PM IST", "pub_date_relative": "30m ago"}, {"title": "Here are Tuesday's biggest analyst calls: SpaceX, Nvidia, Apple, BlackRock, Alphabet, CoreWeave & more", "full_content": "Here are Tuesday's biggest calls on Wall Street.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:49 PM IST", "pub_date_relative": "31m ago"}, {"title": "My sister moved in with our mother, 78, and says she deserves the $925,000 family home. Is she right?", "full_content": "\u201cThe house is worth $925,000 and mom owns it outright. She also has $480,000 in investments.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 05:45 PM IST", "pub_date_relative": "35m ago"}, {"title": "Stock Market Today: Nasdaq Futures Slip; Dismal Data-Center IPO Weighs on Tech Investors \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Futures Slip; Dismal Data-Center IPO Weighs on Tech Investors \u2014 Live Updates WSJ AI rally fades away from Wall Street as a tiny IPO makes big waves CNBC Warning Bells for AI Stocks: Elice\u2019s IPO Crash Drags Down Data Center Peers Barron's AI data centre giant plunges 38pc in stock market debut The Telegraph Morning Bid: Korean canary in the AI coalmine Reuters", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 05:45 PM IST", "pub_date_relative": "35m ago"}, {"title": "Stock futures are mixed as chipmakers come under pressure: Live updates - CNBC", "full_content": "Stock futures are mixed as chipmakers come under pressure: Live updates CNBC US Futures Slip as Neocloud IPO Elice Flops, SpaceX Results Loom Bloomberg.com Why Are Nasdaq Futures Falling Premarket? CRWV, NBIS, TSLA, SPCX, MU, ASTS, NFLX, SLS Stocks In Focus Yahoo Finance Nasdaq futures fall as oil prices jump, key earnings loom Reuters Nasdaq Futures Slip as AI Stocks Resume Slide, Oil Jumps; SpaceX Earnings on Tap Barchart.com", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 05:43 PM IST", "pub_date_relative": "36m ago"}, {"title": "UK Woman Spends Rs 37 Lakh On Content Creation Degree, Internet Asks: 'Worth It?'", "full_content": "The debate raises a bigger question: can a university degree provide an advantage in an industry driven by creativity, personality and changing online trends?", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:42 PM IST", "pub_date_relative": "37m ago"}, {"title": "What Is Form 173A? CBDT's New Mandatory Rule For Claiming Tax Exemption On Govt Securities", "full_content": "Under the Income-tax (Seventh Amendment) Rules, 2026, eligible investors must submit the required information through Form 173A to establish their eligibility for tax benefits.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:41 PM IST", "pub_date_relative": "39m ago"}, {"title": "What happens to Wall Street if CoreWeave defaults? JPMorgan checked the math.", "full_content": "Call it a sign of the times: A JPMorgan analyst is looking into the exposure banks will have if CoreWeave defaults on its debts.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 05:40 PM IST", "pub_date_relative": "40m ago"}, {"title": "SpaceX IPO vs upcoming Anthropic IPO: Will Claude maker beat Elon Musk\u2019s $75 bn record?", "full_content": "Elon Musk\u2019s SpaceX has set a new benchmark for blockbuster stock market debuts after raising $75 billion in its June 2026 initial public offering ( IPO ), valuing the rocket, satellite and artificial intelligence company at $1.77 trillion.\n\nNow, AI startup Anthropic is preparing for a potential public listing that could challenge the record, with reports suggesting it is exploring a fundraising target of as much as $100 billion at a valuation of around $2 trillion.\n\nThe prospect of another mega IPO has intensified the competition for investor money, particularly as leading artificial intelligence companies seek billions of dollars to fund their expansion. Anthropic, the maker of Claude, is expected to make its public market debut in mid-November, although the timeline and size of the offering has not been officially declared.\n\nSpaceX has already made history in the IPO market. The company priced its shares at $135 apiece in June, raising $75 billion through the sale of approximately 555.56 million shares. The offering valued the business at $1.77 trillion and became the largest IPO on record. Its shares subsequently began trading on Nasdaq.\n\nThe company\u2019s appeal extends beyond rocket launches. SpaceX operates Starlink, its satellite internet business, and has ambitions spanning space infrastructure and artificial intelligence computing. Its combination of established operations and long-term technology projects helped attract substantial investor interest.\n\nAnthropic\u2019s proposed IPO could be even larger in terms of its targeted valuation and potential proceeds. Reports have indicated that the Claude developer has explored raising as much as $100 billion at a valuation of around $2 trillion. However, these figures represent reported ambitions, not a final offer price or confirmed fundraising amount.\n\nAnthropic\u2019s financial performance will be central to its valuation debate. The company\u2019s annualised revenue reportedly reached around $65 billion by July.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 05:33 PM IST", "pub_date_relative": "47m ago"}, {"title": "Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures slip as oil rises, AI stocks weaken ahead of earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures slip as oil rises, AI stocks weaken ahead of earnings Powered By LIVE BLOG Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures slip as oil rises, AI stocks weaken ahead of earnings 20 Oct 2026 | 06:16:11 PM IST Dow Jones Live Updates Synopsis US Market | Dow Jones Live Updates: US stock futures turn mixed as Nasdaq futures fall on renewed weakness in AI-linked stocks, while rising oil prices add pressure. Investors await key earnings from major companies, with Brent crude near a five-month high amid geopolitical supply concerns.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 05:31 PM IST", "pub_date_relative": "49m ago"}, {"title": "Titan Q2 results 2026 date: Check Rekha Jhujhunwala portfolio stock returns, target, support - Should you buy?", "full_content": "Titan Q2 Results Date 2026 : Titan Company , the Tata Group jewellery and lifestyle stock, has scheduled a board meeting for November 5 to consider and approve its September quarter results for FY27 ( Q2FY27 ) and first-half earnings (H1FY27). The company announced the meeting date in an exchange filing on Friday.\n\nThe board will review the company's unaudited standalone and consolidated financial results for the quarter and half year ended September 30, 2026. However, Titan has not announced any plans to consider a dividend at the meeting.\n\nIn its exchange filing, Titan Company said, \u201cPursuant to Regulation 29 (1)(a) of the SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015, we wish to inform you that a meeting of the Board of Directors of the Company is scheduled on Thursday, 5th November 2026 inter-alia, to consider and approve the unaudited financial results (standalone and consolidated) for the quarter and half year ended 30th September 2026.\u201d\n\nThe company also informed the exchanges that the trading window for its designated persons and their immediate relatives had been closed from September 23, 2026. The window will reopen 48 hours after the conclusion of the board meeting.\n\nThe Rekha Jhunjhunwala portfolio stock ended the previous trading session 0.67% lower at \u20b9 4,420 per share on the BSE . It was around 15% below its 52-week high of \u20b9 5,187.45, recorded in September 2026.\n\nTitan had touched its 52-week low of \u20b9 3,630.05 on October 17, 2026.\n\nThe stock has faced pressure in recent months, declining 8% over one month, 5% over three months and 2.2% over six months. However, it has gained 20% over the past year and 78% over five years.\n\nTitan Company remains the largest and most valuable holding in Rekha Jhunjhunwala's portfolio. She owns approximately 5.31% of the company, equivalent to 47,184,470 shares.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 05:30 PM IST", "pub_date_relative": "50m ago"}, {"title": "Draymond Green says he's 'not Steph Curry,' wants to play another year even if he leaves Golden State Warriors", "full_content": "Four-time NBA champion Draymond Green said he would love to retire as a member of the Golden State Warriors, but he plans to keep playing next season, even if that means joining another team.\n\nGreen was drafted by the Warriors in 2012 and has spent all 14 seasons of his career with Golden State. He signed a one-year deal with the team in July.\n\nIn an interview with CNBC Sport, Green said he plans to approach this season as though it could be his last with the Warriors.\n\n\"I would love to retire a Golden State Warrior. However, I'm also not Steph Curry, right? So I don't have every luxury that Steph Curry has, and that's okay,\" Green said. \"It's such a rare thing to be on one team your entire career. And if I can accomplish that feat, I would love to.\"\n\nCurry expressed a similar desire to stay with the franchise when he spoke with CNBC in September.\n\n\"I want to be a lifer with the Golden State Warriors,\" Curry said on CNBC's Squawk on the Street .\n\nShortly after that interview, Curry signed a two-year contract extension worth a reported $116 million that keeps him with Golden State through the 2028-29 season.\n\nBut Green acknowledged that his future with the Warriors is less certain.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:30 PM IST", "pub_date_relative": "50m ago"}, {"title": "Lloyds, HSBC And Revolut Down? Thousands Report Online Banking Login Issues", "full_content": "Users on 'X' reported facing signficant issues regarding logging in and accessing their accounts across online banking and application services.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:28 PM IST", "pub_date_relative": "51m ago"}, {"title": "Stocks making the biggest moves premarket: RTX, General Motors, Northrop Grumman, Steel Dynamics & more", "full_content": "These are the stocks posting the largest moves in early trading.", "source": "CNBC Finance", "pub_date_str": "20 Oct 2026, 05:27 PM IST", "pub_date_relative": "52m ago"}, {"title": "GM beats on Q3 results, tightens profit outlook, and unveils new $20 billion buyback - Yahoo Finance", "full_content": "GM beats on Q3 results, tightens profit outlook, and unveils new $20 billion buyback Yahoo Finance General Motors beats Wall Street's Q3 earnings expectations, narrows full-year guidance CNBC General Motors Plans $20 Billion in Buybacks to Shore Up Share Price WSJ GM shares sink as full-year profit forecast misses Wall Street estimates Reuters GM's third quarter net income surged 151% even as overall sales dipped Detroit Free Press", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 05:26 PM IST", "pub_date_relative": "53m ago"}, {"title": "Qualcomm Layoffs: Thousands Of Jobs To Be Trimmed 'Globally' Starting November, Says Report", "full_content": "Qualcomm's job cuts will reportedly be based on the employees' performance.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:26 PM IST", "pub_date_relative": "54m ago"}, {"title": "Gilt market catches up with peers as investor worries over Budget ease", "full_content": "UK bonds were initially hard hit after onset of Iran war but have since outperformed G7 economies as traders\u2019 concerns shift to France", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 05:24 PM IST", "pub_date_relative": "56m ago"}, {"title": "Is CoreWeave the Silicon Valley Bank of 2026?", "full_content": "Perhaps, but not in the way you might think", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 05:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rubio says India-US trade deal is \u2018very, very close\u2019 after Jaishankar meeting", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Rubio says India-US trade deal is \u2018very, very close\u2019 after Jaishankar meeting The Economic Times daily newspaper is available online now. Read Today's Paper Rubio says India-US trade deal is \u2018very, very close\u2019 after Jaishankar meeting SECTIONS Rubio says India-US trade deal is \u2018very, very close\u2019 after Jaishankar meeting ET Online Last Updated: Oct 20, 2026, 05:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Secretary of State Marco Rubio stated that negotiations for a trade deal with India are approaching completion. He highlighted discussions with Indian Foreign Minister Subrahmanyam Jaishankar about energy security and defense cooperation. While tensions over tariffs and energy continue to challenge negotiations, both countries aim to deepen their economic ties. Rubio\u2019s visit to India includes a tour of the Reliance Industries refinery and meetings with business leaders.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 05:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Planning A Thailand Trip? You May Soon Pay Over Rs 4,100 In New Entry And Exit Fees", "full_content": "Industry body Thai Travel Agents Association has cautioned that the proposed departure fee could hurt tourism. The added cost risks deterring budget-conscious travelers and driving them toward cheaper regional alternatives.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Galaxy S25 Edge Amazon Deal: Price, Exchange Offer, Bank Discount", "full_content": "Amazon has cut the Galaxy S25 Edge\u2019s price by Rs 42,000, and an exchange offer can lower it further. Here\u2019s how the deal works and what buyers should check first.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "Form 141 TDS filing: What changes for property buyers, tenants and taxpayers under the new Income Tax Act", "full_content": "The Income Tax Department has consolidated four tax deducted at source (TDS) forms into a single filing form, Form 141, under the Income-tax Act, 2025. The change affects individuals and Hindu undivided families (HUFs) who deduct TDS on property purchases, rent payments, payments to contractors and professionals, and transfers of virtual digital assets (VDAs).\n\nThe new form applies to transactions for which the payment or credit took place on or after 1 April 2026. For transactions where the payment or credit occurred on or before 31 March 2026, the earlier forms under the Income-tax Act, 1961, continue to apply, according to the Income Tax Department.\n\nThe consolidation is intended to simplify compliance by bringing these transactions under one form. However, taxpayers must still select the relevant schedule and provide transaction-specific information when filing.\n\nForm 141 brings together four forms that were previously used for different types of transactions.\n\nUnder the new system, these transactions are reported through Schedules A, B, C and D, respectively, of Form 141. Taxpayers need to fill only the schedule relevant to their transaction, rather than complete all four schedules.\n\nFor individuals purchasing property, Form 141's Schedule B replaces Form 26QB for transactions covered by the applicable provisions of the new Act.\n\nBuyers must provide transaction details, including the type and address of the property, agreement date and relevant payment information. The form also requires details of the seller and the tax deducted.\n\nThe consolidation does not, by itself, change the underlying TDS obligation. Buyers must still determine whether TDS applies to their transaction and comply with the applicable deduction and payment requirements.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 05:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Late-Night Navratri Outing Turns Tragic: Two Ashram School Students Die In Bike Crash, 3 Critical", "full_content": "The students were returning from a village fair when their motorcycle reportedly skidded and fell into a roadside pit.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018I don\u2019t feel sorry for myself\u2019: I\u2019m 64 and will be renting for the rest of my life \u2014 but here\u2019s why I\u2019m still hopeful", "full_content": "\u201cIll-timed circumstances can change our financial future in unexpected ways.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Oct 2026, 05:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "3M lifts annual profit forecast on cost controls, price hikes", "full_content": "Industrial conglomerate 3M lifted its full-year profit forecast on Tuesday after cost-control initiatives and higher prices supported margins, while its safety and industrial business remained resilient.\n\nThe company now expects full-year adjusted profit per share of $9.10 to $9.15, up from its prior forecast of $8.80 to $8.95.\n\nRobust U.S. industrial activity, along with rising sales of chipmaking machines and materials, has helped the company offset uneven demand in some end markets affected by inflationary pressures.\n\nUnder CEO William Brown, the company has also focused on improving customer service and operational execution to strengthen growth and profitability.\n\nIts consumer-facing businesses have continued to operate in a challenging spending environment, reflecting cautious discretionary purchases by customers.\n\n3M share price, year-to-date. At the same time, higher energy costs have raised concerns about the potential impact on manufacturing activity and broader industrial demand.\n\nWhile demand from automotive and consumer electronics customers has remained subdued, growth in data centers and semiconductor-related markets has provided a bright spot for 3M's Transportation and Electronics business, helping cushion weakness in some traditional end markets.\n\nThe Saint Paul, Minnesota-based company launched 87 new products in the third quarter. It expects to launch more than 350 products by the end of this year.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "General Motors Stock Crashes 5% Pre-Market After Earnings Release. What Spooked Investors", "full_content": "General Motors beat Wall Street's third-quarter earnings and revenue estimates, raised its free cash flow outlook and announced a $20 billion buyback, but tighter 2026 guidance and rising costs weighed on investor sentiment.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "AI rally fades away from Wall Street as a tiny IPO makes big waves", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHello, this is Leonie Kidd, with today's edition of Morning Squawk.\n\nWall Street's AI relief rally hit a wall in Asia and Europe, turning the neoclouds dark on the horizon. It puts more emphasis on earnings today, with Netflix and SpaceX in the spotlight.\n\nU.S. stock futures are giving up some of their overnight optimism following the bounceback for AI stocks on Monday, as a sharply negative session in Asia shows jitters remain around technology stocks.\n\nA negative close for CoreWeave , as well as elevated yields on Oracle debt, expose persistent credit concerns in the AI trade.\n\nInternational selling: South Korea's Kospi has led broad declines in Asia, closing in bear market territory. Meanwhile, across Europe, technology stocks pushed indices into the red during the morning session.\n\nProblematic IPO: South Korean AI data center firm, Elice, debuted as a small IPO on the country's secondary market, but shares made a big nosedive, falling over 30% in the trading debut .\n\nShares of neocloud firms are falling in premarket trade. CoreWeave remains the eye of the storm, giving up its relief rally despite an upgrade from Goldman Sachs, which described the stock as being \"toward the top of the quality rankings in the ecosystem.\" HSBC disagrees, saying late Monday the shares could drop another 36% because of rising borrowing costs and slowing revenue growth for AI models.", "source": "CNBC World Economy", "pub_date_str": "20 Oct 2026, 05:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meta's AI spending, Muse assistant adoption in focus for quarterly results", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Meta's AI spending, Muse assistant adoption in focus for quarterly results Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Meta's AI spending, Muse assistant adoption in focus for quarterly results SECTIONS Meta's AI spending, Muse assistant adoption in focus for quarterly results Reuters Last Updated: Oct 20, 2026, 05:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Meta's upcoming third-quarter results will reflect its significant investments in artificial intelligence technologies and products. The company's revenue is expected to grow by 23.8%, despite intense competition from rival firms. Analysts predict a decline in net income, estimating it at $15.44 billion for the quarter. Investor confidence has increased due to positive responses towards its Muse personal assistant and new AI models.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 05:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stunning Views Of Snow-Covered Lipa Valley Appear from Kupwara; Tourism Expected To Pick Up Pace", "full_content": "Scenic views of the mountainous regions in north India follow last week's rain and snowfall across Jammu and Kashmir. Multiple videos show tourists enjoying fresh snow at Apharwat Peak in Gulmarg and snow-capped mountains following fresh snowfall near Zojila Pass along the Srinagar-Leh National Highway, in Jammu and Kashmir.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:02 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Best Buy launches new gaming hub ahead of 'Zelda' and 'Grand Theft Auto VI'", "full_content": "Best Buy is tapping further into a growing customer cohort: gamers.\n\nChief Revenue Officer Patrick McGinnis told CNBC exclusively that the electronics retailer is launching a new experience Tuesday for customers featuring gaming content, new technology and special offers, among other features. The online destination is called Best Buy Gamers and is launching in a beta version.\n\n\"Gamers are a customer that are really like no other in terms of their passion for not just the tech, the titles, but also how they want to work with each other as a community,\" McGinnis said. \"So for us, being relevant for that customer wherever and whenever they want to interact with the thing that they love is really important.\"\n\nBest Buy says millions of gamers shop at the retailer each year, including trying out games in the store and seeking advice from in-store experts. The new gaming experience, created in partnership with video game website IGN, will offer members gaming articles and reviews, live Best Buy event updates for launches and deals on new technology.\n\nThe announcement comes ahead of some of the biggest launches in gaming this year, including the Nov. 5 release of \"The Legend of Zelda: Ocarina of Time,\" a remake from Nintendo , and the Nov. 19 launch of Take-Two Interactive 's highly anticipated \"Grand Theft Auto VI.\"\n\nMcGinnis said the timing of the rollout is \"pretty perfect\" given the slate of new video games over the next month, though Best Buy has been developing the new platform for over a year.\n\n\"We want to be relevant for our gaming customers, not just during the important, big tentpole periods of the calendar, like when we have these big gaming launches coming up, but really every day,\" he said. \"We want to be there when they discover new titles and connect with the community, and not just when they're buying a big console or a new gaming title.\"\n\nBest Buy has been leaning into gaming as it sees growing demand from its customers.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 06:15 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "General Motors beats Wall Street's Q3 earnings expectations, narrows full-year guidance", "full_content": "DETROIT \u2014 General Motors narrowed its 2026 earnings guidance and raised its free cash flow expectations after beating Wall Street's third-quarter expectations.\n\nThe Detroit automaker also announced a new multiyear stock buyback of $20 billion after GM completed a $6 billion share repurchase program that was announced in January. GM did not disclose a specific time to complete the program.\n\nHere's how GM performed in the third quarter, compared with average estimates compiled by LSEG:\n\nThe new guidance includes adjusted earnings before interest and taxes of between $14.5 billion and $15.5 billion, or $12.75 to $13.75 adjusted earnings per share, and adjusted automotive free cash flow of between $11.5 billion and $12.5 billion.\n\nThat compares with its raised guidance from July that included adjusted EBIT of between $14 billion and $16 billion, or $12 to $14 adjusted EPS, and adjusted automotive free cash flow of $9.5 billion to $11.5 billion.\n\n\"I think the market's been pretty consistent from what we've said all year,\" GM CFO Paul Jacobson told CNBC's Phil LeBeau . \"Our fourth quarter's going to be down sequentially. ... I think the fact that we're able to hold our guidance in the face of that late inflationary pressure in the year is another sign of the GM team executing really well.\"\n\nGM stock was off roughly 7% during premarket trading despite the earnings beats.\n\nWall Street analysts were mixed before the report on whether GM would raise its guidance Tuesday amid concerns of slowing sales and rising commodity costs.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 06:14 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P, Nasdaq 100 futures fall as AI trade faces renewed pressure, oil tops $110", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:10 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Data center stocks slide as Korea IPO plunges 30%, pressuring tech sentiment", "full_content": "Data center stocks struggled Tuesday following a lackluster initial public offering overnight from a South Korean cloud company that has been compared to U.S. neocloud CoreWeave.\n\nShares of Elice dropped more than 30% during their market debut overnight, as investors grow increasingly wary of artificial intelligence-dedicated computing power providers amid concerns about overcapacity.\n\nThe bearish sentiment spilled into U.S. tech equities. CoreWeave shares lost 4% in premarket trading as of 8:08 a.m. ET. Nebius shed about 5% along with Iren . Vertiv pulled back 2%.\n\nHSBC said in a Monday note that the troubles for the heavily levered CoreWeave are not going away.\n\n\"Debt market woes and moderating LLM revenues are exacerbating structural concerns for neoclouds ,\" HSBC analyst Abhishek Shukla wrote. Shukla has a reduce rating on CoreWeave with a price target of $39, implying 36.5% downside.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 06:06 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Olenox completes $21.7M acquisition of gas, power assets", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 06:06 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Qualcomm to cut jobs worldwide in performance-focused layoffs, internal memo shows", "full_content": "Qualcomm will cut jobs globally in a \"performance-focused reduction\" following its annual employee reviews, CEO Cristiano Amon told staff in a memo on Monday reviewed by Reuters, with notifications set to begin in November.\n\nThe cuts are part of an effort to build \"a stronger performance culture\" and address situations where the company \"has consistently fallen short of expectations,\" Amon said.\n\nThe memo did not say how many jobs would be affected, and Reuters could not immediately determine the scale of the cuts.\n\nQualcomm did not immediately respond to a request for comment. It had about 52,000 employees globally as of September last year, most of them full-time. Its financial year typically ends in late September.\n\nOne of the world's biggest smartphone chipmakers, Qualcomm has been hit this year by a slump in consumer electronics sales as soaring memory prices weigh on demand in key markets.\n\nIts shares have risen just 1.5% in 2026, compared with gains of more than 12% for the benchmark S&P 500 and nearly 60% for the Philadelphia Semiconductor Index .\n\nIn its latest earnings report in late July, Qualcomm forecast quarterly profit below estimates and said revenue from Apple products would decline faster than expected, while signaling that growth in data-center and other non-handset businesses would more than offset the lost revenue by fiscal 2027.\n\nThe company expects the majority of its chip sales to come from businesses other than smartphones in fiscal 2027 as it expands into the fast-growing AI data-center market.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:59 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "UK to deploy fighter jets to defend Saudi cities from Houthi attacks", "full_content": "The U.K. said it would provide defensive military support, including fighter jets, to support Saudi Arabia as attacks by Iran-backed Houthi rebels escalate.\n\nThe Houthis, a Yemeni militant group, have launched a series of strikes on Saudi targets in recent weeks. Airport attacks in the capital city of Riyadh led to multiple fatalities, flight cancellations and property damage, while facilities belonging to oil giant Saudi Aramco were targeted last week.\n\n\"The continuing attacks from the Houthis on our ally Saudi Arabia are absolutely despicable. The targeting of the airport in Riyadh in particular shows the lengths the Houthis are going to escalate the situation in the region,\" U.K. Defense Secretary Wes Streeting said in a statement on Tuesday.\n\nHe added that Royal Air Force Typhoon fighter jets will fly defensive air missions to help protect Saudi airspace from drones and missiles.\n\n\"This builds on the UK equipment and personnel we already have in the country to defend against Houthi air attacks,\" Streeting said.\n\nThe U.K. Ministry of Defence also said that the fighter jets would operate only in a defensive role and would not conduct offensive strikes against the Houthis.\n\nIt said the Royal Air Force would also provide an Airbus A400M Atlas jet \"to support the movement of defence materiel within Saudi Arabia,\" while U.K. military advisers will also give support to Saudi staff officers.\n\n\"Escalating violence in the Gulf can have a serious impact at home in the UK \u2014 driving up the cost of living, disrupting energy supplies and costs to British businesses. It is also causing devastation to the civilian population in Yemen,\" the MoD said.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:53 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "HSBC says CoreWeave shares to drop another 30%-plus because of 'structural concerns for neoclouds'", "full_content": "The bank has a reduce rating on the cloud infrastructure stock.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:53 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bajaj Finance vs IREDA vs Reliance's Jio Financial: Top financial stock to buy after Q2 results 2026 for best returns?", "full_content": "Stocks to buy after Q2 Results 2026: The earnings season is in full swing, and a good number of companies have declared their Q2 results. After about two weeks since the start of the Q2 2026 results season, investors have started comparing the quarterly numbers of their favourite stock. As Bajaj Finance is widely compared with Reliance's Jio Financial Services, and to some extent, both these financial stocks are compared with the Indian Renewable Energy Development Agency ( IREDA ), it would be prudent to compare the Q2 results of these three financial stocks.\n\nThe Bajaj Finance Q2 results show higher profit, net interest income, and assets under management, as well as an increase in new loans booked during the quarter. In the July to September 2026 quarter, Bajaj Finance reported a 29% YoY growth in consolidated PAT to \u20b9 6,367 crore. Assets under management (AUM) grew 26% to \u20b9 5.85 lakh crore.\n\nThe Bajaj Group company reported consolidated PAT of \u20b9 6,367 crore, up 29% YoY from \u20b9 4,948 crore. PBT rose 29% to \u20b9 8,537 crore, while net interest income (NII) increased 24% to \u20b9 13,335 crore. Net total income grew 23% to \u20b9 15,974 crore.\n\nAUM grew 26% to \u20b9 5,84,624 crore, with an addition of \u20b9 37,680 crore during the quarter. The company booked 13.45 million new loans and added 4.42 million customers, taking its customer franchise to 128.85 million.\n\nIREDA reported a standalone net profit of \u20b9 891.75 crore for the H1FY27, marking a 12% YoY increase from \u20b9 95.68 crore. The result significantly exceeded market consensus estimates for the quarter.\n\nThe renewable energy financier\u2019s total income expanded 14% YoY to \u20b9 4,594.29 crore on a standalone basis, supported by robust interest income growth. Interest income, the primary revenue driver, stood at \u20b9 4,514.77 crore in H1FY27, compared to \u20b9 3,938.89 crore in the corresponding period of the previous fiscal.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 05:50 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings live updates: All eyes on Musk and Meta as Q3 earnings rev up - Yahoo Finance", "full_content": "Earnings live updates: All eyes on Musk and Meta as Q3 earnings rev up Yahoo Finance Meta, Tesla and Netflix Q3 Updates Coming This Week The Information Netflix, SpaceX, Meta, and Tesla Q3 earnings: What investors need to see from Big Tech this week Business Insider What to Expect in Markets This Week: Meta, Tesla Report; Airlines, Streaming Giants\u2019 Results Due Investopedia SpaceX and Netflix headline busy slate of earnings MarketWatch", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 05:50 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Nasdaq Futures Slip; Dismal Data-Center IPO Weighs on Tech Investors \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Futures Slip; Dismal Data-Center IPO Weighs on Tech Investors \u2014 Live Updates WSJ AI rally fades away from Wall Street as a tiny IPO makes big waves CNBC Warning Bells for AI Stocks: Elice\u2019s IPO Crash Drags Down Data Center Peers Barron's AI data centre giant plunges 38pc in stock market debut The Telegraph Morning Bid: Korean canary in the AI coalmine Reuters", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 05:45 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures are mixed as chipmakers come under pressure: Live updates - CNBC", "full_content": "Stock futures are mixed as chipmakers come under pressure: Live updates CNBC US Futures Slip as Neocloud IPO Elice Flops, SpaceX Results Loom Bloomberg.com Why Are Nasdaq Futures Falling Premarket? CRWV, NBIS, TSLA, SPCX, MU, ASTS, NFLX, SLS Stocks In Focus Yahoo Finance Nasdaq futures fall as oil prices jump, key earnings loom Reuters Nasdaq Futures Slip as AI Stocks Resume Slide, Oil Jumps; SpaceX Earnings on Tap Barchart.com", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 05:43 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpaceX IPO vs upcoming Anthropic IPO: Will Claude maker beat Elon Musk\u2019s $75 bn record?", "full_content": "Elon Musk\u2019s SpaceX has set a new benchmark for blockbuster stock market debuts after raising $75 billion in its June 2026 initial public offering ( IPO ), valuing the rocket, satellite and artificial intelligence company at $1.77 trillion.\n\nNow, AI startup Anthropic is preparing for a potential public listing that could challenge the record, with reports suggesting it is exploring a fundraising target of as much as $100 billion at a valuation of around $2 trillion.\n\nThe prospect of another mega IPO has intensified the competition for investor money, particularly as leading artificial intelligence companies seek billions of dollars to fund their expansion. Anthropic, the maker of Claude, is expected to make its public market debut in mid-November, although the timeline and size of the offering has not been officially declared.\n\nSpaceX has already made history in the IPO market. The company priced its shares at $135 apiece in June, raising $75 billion through the sale of approximately 555.56 million shares. The offering valued the business at $1.77 trillion and became the largest IPO on record. Its shares subsequently began trading on Nasdaq.\n\nThe company\u2019s appeal extends beyond rocket launches. SpaceX operates Starlink, its satellite internet business, and has ambitions spanning space infrastructure and artificial intelligence computing. Its combination of established operations and long-term technology projects helped attract substantial investor interest.\n\nAnthropic\u2019s proposed IPO could be even larger in terms of its targeted valuation and potential proceeds. Reports have indicated that the Claude developer has explored raising as much as $100 billion at a valuation of around $2 trillion. However, these figures represent reported ambitions, not a final offer price or confirmed fundraising amount.\n\nAnthropic\u2019s financial performance will be central to its valuation debate. The company\u2019s annualised revenue reportedly reached around $65 billion by July.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 05:33 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures slip as oil rises, AI stocks weaken ahead of earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures slip as oil rises, AI stocks weaken ahead of earnings Powered By LIVE BLOG Dow Jones| Nasdaq | S&P 500 | US Stock Market Today |Live Updates: Nasdaq futures slip as oil rises, AI stocks weaken ahead of earnings 20 Oct 2026 | 06:16:11 PM IST Dow Jones Live Updates Synopsis US Market | Dow Jones Live Updates: US stock futures turn mixed as Nasdaq futures fall on renewed weakness in AI-linked stocks, while rising oil prices add pressure. Investors await key earnings from major companies, with Brent crude near a five-month high amid geopolitical supply concerns.\n\nComments are moderated and will be allowed if they are about the topic and not abusive.\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 05:31 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Titan Q2 results 2026 date: Check Rekha Jhujhunwala portfolio stock returns, target, support - Should you buy?", "full_content": "Titan Q2 Results Date 2026 : Titan Company , the Tata Group jewellery and lifestyle stock, has scheduled a board meeting for November 5 to consider and approve its September quarter results for FY27 ( Q2FY27 ) and first-half earnings (H1FY27). The company announced the meeting date in an exchange filing on Friday.\n\nThe board will review the company's unaudited standalone and consolidated financial results for the quarter and half year ended September 30, 2026. However, Titan has not announced any plans to consider a dividend at the meeting.\n\nIn its exchange filing, Titan Company said, \u201cPursuant to Regulation 29 (1)(a) of the SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015, we wish to inform you that a meeting of the Board of Directors of the Company is scheduled on Thursday, 5th November 2026 inter-alia, to consider and approve the unaudited financial results (standalone and consolidated) for the quarter and half year ended 30th September 2026.\u201d\n\nThe company also informed the exchanges that the trading window for its designated persons and their immediate relatives had been closed from September 23, 2026. The window will reopen 48 hours after the conclusion of the board meeting.\n\nThe Rekha Jhunjhunwala portfolio stock ended the previous trading session 0.67% lower at \u20b9 4,420 per share on the BSE . It was around 15% below its 52-week high of \u20b9 5,187.45, recorded in September 2026.\n\nTitan had touched its 52-week low of \u20b9 3,630.05 on October 17, 2026.\n\nThe stock has faced pressure in recent months, declining 8% over one month, 5% over three months and 2.2% over six months. However, it has gained 20% over the past year and 78% over five years.\n\nTitan Company remains the largest and most valuable holding in Rekha Jhunjhunwala's portfolio. She owns approximately 5.31% of the company, equivalent to 47,184,470 shares.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 05:30 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GM beats on Q3 results, tightens profit outlook, and unveils new $20 billion buyback - Yahoo Finance", "full_content": "GM beats on Q3 results, tightens profit outlook, and unveils new $20 billion buyback Yahoo Finance General Motors beats Wall Street's Q3 earnings expectations, narrows full-year guidance CNBC General Motors Plans $20 Billion in Buybacks to Shore Up Share Price WSJ GM shares sink as full-year profit forecast misses Wall Street estimates Reuters GM's third quarter net income surged 151% even as overall sales dipped Detroit Free Press", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 05:26 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gilt market catches up with peers as investor worries over Budget ease", "full_content": "UK bonds were initially hard hit after onset of Iran war but have since outperformed G7 economies as traders\u2019 concerns shift to France", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 05:24 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Rubio says India-US trade deal is \u2018very, very close\u2019 after Jaishankar meeting", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Rubio says India-US trade deal is \u2018very, very close\u2019 after Jaishankar meeting The Economic Times daily newspaper is available online now. Read Today's Paper Rubio says India-US trade deal is \u2018very, very close\u2019 after Jaishankar meeting SECTIONS Rubio says India-US trade deal is \u2018very, very close\u2019 after Jaishankar meeting ET Online Last Updated: Oct 20, 2026, 05:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Secretary of State Marco Rubio stated that negotiations for a trade deal with India are approaching completion. He highlighted discussions with Indian Foreign Minister Subrahmanyam Jaishankar about energy security and defense cooperation. While tensions over tariffs and energy continue to challenge negotiations, both countries aim to deepen their economic ties. Rubio\u2019s visit to India includes a tour of the Reliance Industries refinery and meetings with business leaders.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 05:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Form 141 TDS filing: What changes for property buyers, tenants and taxpayers under the new Income Tax Act", "full_content": "The Income Tax Department has consolidated four tax deducted at source (TDS) forms into a single filing form, Form 141, under the Income-tax Act, 2025. The change affects individuals and Hindu undivided families (HUFs) who deduct TDS on property purchases, rent payments, payments to contractors and professionals, and transfers of virtual digital assets (VDAs).\n\nThe new form applies to transactions for which the payment or credit took place on or after 1 April 2026. For transactions where the payment or credit occurred on or before 31 March 2026, the earlier forms under the Income-tax Act, 1961, continue to apply, according to the Income Tax Department.\n\nThe consolidation is intended to simplify compliance by bringing these transactions under one form. However, taxpayers must still select the relevant schedule and provide transaction-specific information when filing.\n\nForm 141 brings together four forms that were previously used for different types of transactions.\n\nUnder the new system, these transactions are reported through Schedules A, B, C and D, respectively, of Form 141. Taxpayers need to fill only the schedule relevant to their transaction, rather than complete all four schedules.\n\nFor individuals purchasing property, Form 141's Schedule B replaces Form 26QB for transactions covered by the applicable provisions of the new Act.\n\nBuyers must provide transaction details, including the type and address of the property, agreement date and relevant payment information. The form also requires details of the seller and the tax deducted.\n\nThe consolidation does not, by itself, change the underlying TDS obligation. Buyers must still determine whether TDS applies to their transaction and comply with the applicable deduction and payment requirements.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 05:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "3M lifts annual profit forecast on cost controls, price hikes", "full_content": "Industrial conglomerate 3M lifted its full-year profit forecast on Tuesday after cost-control initiatives and higher prices supported margins, while its safety and industrial business remained resilient.\n\nThe company now expects full-year adjusted profit per share of $9.10 to $9.15, up from its prior forecast of $8.80 to $8.95.\n\nRobust U.S. industrial activity, along with rising sales of chipmaking machines and materials, has helped the company offset uneven demand in some end markets affected by inflationary pressures.\n\nUnder CEO William Brown, the company has also focused on improving customer service and operational execution to strengthen growth and profitability.\n\nIts consumer-facing businesses have continued to operate in a challenging spending environment, reflecting cautious discretionary purchases by customers.\n\n3M share price, year-to-date. At the same time, higher energy costs have raised concerns about the potential impact on manufacturing activity and broader industrial demand.\n\nWhile demand from automotive and consumer electronics customers has remained subdued, growth in data centers and semiconductor-related markets has provided a bright spot for 3M's Transportation and Electronics business, helping cushion weakness in some traditional end markets.\n\nThe Saint Paul, Minnesota-based company launched 87 new products in the third quarter. It expects to launch more than 350 products by the end of this year.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 05:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "General Motors Stock Crashes 5% Pre-Market After Earnings Release. What Spooked Investors", "full_content": "General Motors beat Wall Street's third-quarter earnings and revenue estimates, raised its free cash flow outlook and announced a $20 billion buyback, but tighter 2026 guidance and rising costs weighed on investor sentiment.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 05:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI rally fades away from Wall Street as a tiny IPO makes big waves", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in yo     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
