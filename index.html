    const allData = {"general": [{"title": "The big lesson from this week's earnings: The AI buildout is not a zero-sum game", "full_content": "Salesforce, CrowdStrike, and Nvidia all faced major tests with investors and crushed expectations.", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 06:55 PM IST", "pub_date_relative": "5m ago"}, {"title": "Stock Market Week Ahead: Chips, Cybersecurity And Jobs", "full_content": "BREAKING: Major Indexes Rise For Week; Small Caps Break Support\n\nStore Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Stocks On The Move New Highs Stock Spotlight Stocks Near Buy Zone RS Line At New High Rising Profit Estimates Stocks Funds Are Buying Your Weekly Review Breakout Stocks Index IBD ETF Indexes IBD Data Tables IBD Digital: 2 Months for $20 New? Start Here Research STOCK RESEARCH IBD Stock Checkup Stock Of The Day Screen Of The Day IBD Charts Stock Screener Swing Trading Options Investing Action Plan Earnings Preview Earnings Calendar IBD Industry Themes The New America Best ETFs Best Mutual Funds The Income Investor IBD Stock Analysis Industry Snapshot IBD 50 Stocks To Watch IBD Data Stories IBD Digital: 2 Months for $20 News NEWS eIBD Technology Magnificent Seven Stocks Personal Finance Special Reports Cryptocurrency Retirement Management ECONOMY Economic Calendar Economic News IBD Digital: 2 Months for $20 Videos VIDEOS & PODCASTS IBD Live How To Invest Videos Options Videos Investing With IBD Podcast Growth Stories Podcast Webinars Online Courses IBD Digital: 2 Months for $20 Learn HOW TO INVEST How To Invest In Stocks Stock Investing Keys Stock Market Timing Track Market Trends How To Read Stock Charts How To Buy Stocks When To Sell Stocks Short Selling Swing Trading What Is Crypto EDUCATIONAL RESOURCES New to IBD Investor's Corner Investing With IBD Podcast Events & Webinars IBD Moneyworks 12 Days Of Learning Investin.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:37 PM IST", "pub_date_relative": "23m ago"}, {"title": "Gen Zers quit their jobs to start a pickle company\u2014now it\u2019s valued at $8.5 million", "full_content": "At 4 a.m. on Monday, June 1, Leah Marcus woke up to 70 missed calls from her co-founder.\n\nThe good news: A prominent influencer, Alix Earle, had posted a TikTok video about Hot Girl Pickles, the debut product sold by Marcus and co-founder Yasaman Bakhitar's Los Angeles-based startup Good Girl Snacks. The bad news: Most of the video involved Earle struggling to open the pickle jar. \"Imagine our horror,\" said Marcus, partially joking, in a response video hours later . Next came adrenaline, when hundreds of orders flooded the startup's Shopify store the following day, Marcus and Bakhitar say.\n\nTurning chaos into content is part of the recipe at Good Girl Snacks, which sells jars of Hot Girl Pickles nationwide online and in grocery stores including Whole Foods Market and Erewhon, and grab-and-go packets on its website and in smaller grocery stores. The startup declined to share revenue figures or profitability status, but was most recently valued at $8.5 million following a $3 million seed fundraising round in March, according to documents reviewed by CNBC Make It.\n\nThe co-founders tout original recipes, but at a fundamental level, they didn't invent a new method to soak cucumbers in vinegar. Instead, Marcus, 26, and Bakhitar, 27, say they've grown their startup around an aptitude for branding toward a Gen Z audience, both online and offline.\n\nEach Hot Girl Pickles product has brightly colored pink, purple or teal packaging that visually stands out against the sea of legacy brands' primary colors on grocery store condiment shelves.", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 06:35 PM IST", "pub_date_relative": "26m ago"}, {"title": "TSMC vs. ASML: Which Semiconductor Giant Is the Better Stock Buy?", "full_content": "Skip to navigation Skip to main content Skip to right column TSMC vs. ASML: Which Semiconductor Giant Is the Better Stock Buy? Keithen Drury, The Motley Fool Sat, August 29, 2026 at 9:05 AM EDT 5 min read TSM NVDA ASML Taiwan Semiconductor Manufacturing (NYSE: TSM) and ASML (NASDAQ: ASML) are two vital companies for the world economy, even if they may not be well known. Taiwan Semiconductor, or TSMC as it is also known, is by far the largest chip foundry in the world, and produces logic chips for nearly every major tech company. ASML provides machinery to produce the advanced chips that TSMC and its peers manufacture, and is the only company in the world with this technology, giving it a rare technological monopoly.\n\nBoth of these companies have seen their stocks skyrocket over the past few years, but with the AI build-out projected to last for several more years, they have more upside ahead.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nBut which of these two stocks makes for the better long-term buy at the moment? Let's take a look.\n\nASML makes extreme ultraviolet (EUV) lithography machines. These machines are massive, cost hundreds of millions of dollars, and take a very specific supply chain to deliver and install. The end product is the size of a school bus, and it helps lay the tiny electrical traces on a chip. TSMC's current most advanced chip generation is 2nm chips, which indicates 2 nanometers of spacing between electrical traces. For reference, a human hair measures between 80,000 and 100,000 nanometers wide.\n\nASML's business booms when chip production increases, as it supplies the machines critical to chip production. Right now, there is a major chip production capacity build-out going on, so ASML's business is booming.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:35 PM IST", "pub_date_relative": "26m ago"}, {"title": "Goodyear burning rubber and cash as turnaround plan continues", "full_content": "DETROIT \u2014 Goodyear Tire & Rubber Co. CEO Mark Stewart sits in the vehicle bay of a tire shop where the company is launching a new retail experience for customers.\n\nThere's a freshly painted black facade on the revamped Detroit store, with the words \"Motor City\" added in white flanking Goodyear's winged foot logo. It's been dressed up for a private event in connection to a nearby annual car festival called the Woodward Dream Cruise.\n\nBut despite the stylish touches, it's still a tire shop. The smell of rubber and oil remains in the air and the sound of workers changing tires combines with music from a DJ inside the shop's waiting room.\n\nThe scene is symbolic of Stewart's ongoing \"Goodyear Forward\" turnaround plan . He's trying to make tires \u2014 a historically dirty business \u2014 more attractive for investors and friendlier for consumers.\n\n\"We have made so much progress, and when you think about it from the standpoint of the Goodyear Forward program, it was really to get our feet back on the ground towards being the iconic company that we always were,\" Stewart, wearing an unbuttoned navy blue Goodyear technician shirt, told CNBC during an interview at the shop.\n\nBut while Goodyear is well known for burning rubber, it's also burning cash as it restructures and tries to refinance and pay down years of debt.\n\nThe company's capital expenditures were roughly $2 billion combined in 2024 and 2025, with expectations of $725 million this year. Its debt remained at more than $7 billion at the end of the second quarter.\n\nGoodyear's net loss was $453 million through the first half of the year, while its operating income was $131 million, or a 1.6% margin.", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 06:33 PM IST", "pub_date_relative": "28m ago"}, {"title": "Bank of America sends strong message to stock market investors", "full_content": "Skip to navigation Skip to main content Skip to right column Bank of America sends strong message to stock market investors Hillary Remy Sat, August 29, 2026 at 9:03 AM EDT 5 min read BAC NVDA ^GSPC Wall Street's biggest bank just delivered a message that sounds contradictory at first. Chip stocks could fall further from here, and that is not necessarily bad news, according to one of the sector's most closely watched analysts.\n\nThe call came two days before Nvidia reported earnings on Aug. 26. Nvidia beat on every key metric and guided ahead of consensus for Q3. But what Bank of America was telling investors going into that report was more nuanced than a simple read on the earnings print.\n\nBank of America analyst Vivek Arya, who ranks 229 out of more than 12,000 analysts tracked by TipRanks with a 58% success rate, sees roughly 10% further downside risk for the Philadelphia Semiconductor Index (SOX).\n\nA decline of that size would push the SOX back to its valuation discount versus the S&P 500 before ChatGPT's debut in November 2022, CNBC reported .\n\nSeveral factors are weighing on the group in the near term. Arya pointed to rising interest rates, public pushback on data center projects, geopolitical tension, worries over circular financing arrangements between AI companies, and heavy investor positioning, with chips now running about 13% overweight against the broader S&P 500.\n\nThe data center backlash has moved beyond social media. New York put a moratorium on large-scale projects. Pennsylvania started restricting approvals. Texas launched grid audits.\n\nA year ago, none of that was happening. Now it is a real variable impacting how quickly AI infrastructure actually gets built.\n\nBank of America CEO warns inflation will back Fed into a corner", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:33 PM IST", "pub_date_relative": "28m ago"}, {"title": "Interface Eyes Growth as One Interface Strategy Targets Commercial Flooring Share", "full_content": "Skip to navigation Skip to main content Skip to right column Interface Eyes Growth as One Interface Strategy Targets Commercial Flooring Share MarketBeat Sat, August 29, 2026 at 9:01 AM EDT 6 min read TILE Key Points Interested in Interface, Inc.? Here are five stocks we like better.\n\nInterface is targeting growth in commercial flooring through its \"One Interface\" global operating model, focused product portfolio and emphasis on design, performance and sustainability. The company serves more than 100 countries and generates about $1.4 billion in annual revenue, with 98% from commercial customers.\n\nThe company estimates its addressable commercial flooring market at more than $9 billion , with opportunities in carpet tile, LVT and differentiated rubber flooring. It says it is gaining share in corporate office, healthcare and education, particularly in Class A properties and facilities undergoing refresh projects.\n\nInterface is investing $25 million to support growth while continuing to expand margins through manufacturing and operating efficiencies. With net debt at just 0.5 times EBITDA, management says it can balance reinvestment, selective acquisitions, dividends and share repurchases.\n\nInterface (NASDAQ:TILE) Chief Financial Officer Bruce Hausmann told investors that the commercial flooring company is pursuing growth through a focused product portfolio, global operating model and emphasis on design, performance and sustainability.\n\nSpeaking at an investor conference, Hausmann said Interface operates three brands: Interface, nora rubber flooring and consumer-focused FLOR. The company generates about $1.4 billion in revenue, with approximately 60% coming from the Americas, 29% from Europe and 11% from Asia-Pacific, he said.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:31 PM IST", "pub_date_relative": "29m ago"}, {"title": "What Buyers and Sellers Should Expect to Pay at Closing", "full_content": "Skip to navigation Skip to main content Skip to right column What Buyers and Sellers Should Expect to Pay at Closing Christian Drerup Sat, August 29, 2026 at 9:00 AM EDT 4 min read Quick Read Sellers cover ownership-transfer costs like commissions, title insurance, and transfer taxes, while buyers handle mortgage fees, inspections, and prepaid expenses.\n\nMany closing costs are negotiable, and sellers can offer credits to offset buyer expenses, though government fees and lender requirements stay fixed.\n\nBuyers financing a home should review their Loan Estimate and Closing Disclosure to understand all costs before signing.\n\nDon't wait: the analyst who called NVIDIA in 2010 just revealed his top 10 AI stocks. See the full list FREE now .\n\nBuying or selling a house comes with dozens of costs beyond just the price of the property. These fees can be downright overwhelming, at a time when you likely already have your hands full with packing and relocating. One of the biggest things people forget about is closing costs. This assortment of fees and expenses needs to be paid before the keys change hands. Every real estate transaction can be a bit different, and many of these fees can be negotiated as part of the purchase. That being said, some costs are typically handled by either the seller or the buyer. It's good to be aware of what you will likely have to pay before showing up to sign a contract.\n\nThe seller is usually responsible for costs related to transferring ownership and cleaning the property for the new buyer moves in. Some common seller expenses include:\n\nOne of the largest costs is paying the real estate agents involved in the entire process. The way this works has changed fairly recently. The seller generally negotiates compensation with their own listing agent, while buyer-agent compensation is handled separately and can vary depending on the agreement. In some deals, the seller might agree to contribute to the buyer's agent compensation.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:30 PM IST", "pub_date_relative": "30m ago"}, {"title": "Op-ed: Salesforce just revealed the next battleground in AI \u2014 and it's not the models", "full_content": "Analysts and pundits in finance have an endless supply of clever, simplistic explanations for complex market movements. Over the years, culprits have ranged from El Ni\u00f1o and climate change to the World Trade Organization, rock 'n' roll music and the fluoridation of water. Many of these explanations proved wrong, yet commentators continue to reach for overly simple narratives to explain market moves. The latest example is the sell-off in software stocks.\n\nFor the past year, markets have vaporized roughly $2 trillion in software value by asking the wrong question about AI. The question behind the so-called \"SaaSpocalypse\" \u2014 can an AI agent do what this software does? \u2014 is misguided because it treats a software company as nothing more than a bundle of tasks waiting to be automated away.\n\nThe right question, and the clearest test we know of for separating AI's winners from its roadkill, is different: Does this company own something AI agents cannot operate without?\n\nSalesforce's recent blowout earnings show why the balance of power may be shifting away from frontier models and back toward software companies that investors had prematurely left for dead.\n\nFor months, analysts have assumed that frontier large language models will accrue an ever-greater share of the value created by AI, with the valuations of those companies soaring commensurately. But intelligence is precisely the thing being commoditized before our eyes: Frontier models now leapfrog one another every few months, growing ever more capable but also increasingly interchangeable.\n\nAI may also be approaching RSI \u2014 recursive self-improvement \u2014 which could accelerate those improvement cycles even further, while the price of raw intelligence collapses amid heated competition from well-funded rivals and increasingly capable Chinese open-source models.\n\nSo in this new world, if LLMs are the commodity, where is the moat? The answer, we believe, is data.", "source": "CNBC World Economy", "pub_date_str": "29 Aug 2026, 06:30 PM IST", "pub_date_relative": "31m ago"}, {"title": "First Phosphate eyes feasibility study after resource update and NASDAQ uplisting - ICYMI", "full_content": "Skip to navigation Skip to main content Skip to right column First Phosphate eyes feasibility study after resource update and NASDAQ uplisting - ICYMI Proactive Sat, August 29, 2026 at 9:00 AM EDT 2 min read PHOS PHOS First Phosphate Corp. (CSE:PHOS, NASDAQ:PHOS, FRA:KD0, OTCQX:FRSPF) earlier this week provided an update on the advancement of its B\u00e9gin-Lamarche property, with CEO John Passalacqua highlighting an expanded mineral resource, its NASDAQ uplisting and access to more than $50 million of capital as the company works towards its next development milestones.\n\nSpeaking to Proactive, Passalacqua said the updated NI 43-101 mineral resource estimate showed a significant increase in indicated resources and an increase in the volume of material.\n\nHe said the most important feature was the \"continuity and consistency throughout the entire resource\", adding that the update had given First Phosphate confidence to move into a feasibility study as soon as possible.\n\nThe feasibility study represents one of the company's key upcoming potential catalysts. Passalacqua said First Phosphate was targeting its release by the end of 2026 or early 2027, with permitting and an investment decision targeted by the end of 2027.\n\nFirst Phosphate's recent NASDAQ uplisting could also broaden its access to US investors. Passalacqua said the company's American depositary receipt had been uplisted to the exchange, with its management team and board subsequently taking part in the opening bell ceremony in New York.\n\nDuring accompanying roadshows, Passalacqua said he spoke with around 150 to 200 interested funds. He explained that some US funds had previously required First Phosphate to secure a listing on a major stock exchange before they could invest.\n\nPassalacqua said the company had subsequently seen significant trading volumes following the NASDAQ listing.\n\nFunding provides another important element of First Phosphate's development plans.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:30 PM IST", "pub_date_relative": "31m ago"}, {"title": "Why would someone lock up money by rolling it into a 401(k)?", "full_content": "When done right, rollovers can be a great tool.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Aug 2026, 06:30 PM IST", "pub_date_relative": "31m ago"}, {"title": "Nobody's Talking About This Energy Company, but It's Quietly Signing the Power Deals Feeding the AI Build-Out", "full_content": "Skip to navigation Skip to main content Skip to right column Nobody's Talking About This Energy Company, but It's Quietly Signing the Power Deals Feeding the AI Build-Out Matt DiLallo, The Motley Fool Sat, August 29, 2026 at 8:55 AM EDT 7 min read GOOG BE OKLO NVDA ORCL When investors want to play the AI power boom, the first names that come to mind are hot stocks in emerging energy technologies, such as advanced fuel cell maker Bloom Energy (NYSE:BE) and small modular reactor developer Oklo (NYSE:OKLO). Bloom has major AI partnerships with Oracle and Brookfield , while Oklo has deals with Meta Platforms and Switch.\n\nOne company almost no one is talking about is the high-yielding clean-power producer Clearway Energy (NYSE:CWEN). That's a mistake. Its parent (Clearway Energy Group) quietly signed a nearly 1.2-gigawatt (GW) deal to build renewable power for Alphabet (NASDAQ:GOOG)(NASDAQ:GOOGL), and it's getting paid much more for the power produced at some of its legacy assets because the new power buyer is a hyperscaler with voracious energy needs.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nThat's only the beginning. AI power is one of the catalysts that make Clearway among the top renewable energy stocks to buy .\n\nThis past January, Clearway Energy Group signed three long-term power purchase agreements (PPAs) with Alphabet's Google for nearly 1.2 GW of projects to support its data centers. They represent over $2.4 billion of investment in energy infrastructure, with the first projects expected to come online in 2027 and 2028.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:25 PM IST", "pub_date_relative": "36m ago"}, {"title": "Tom Lee's Bitmine Continues to Buy Ethereum Hand Over Fist. Should Crypto Investors Be Doing the Same?", "full_content": "Skip to navigation Skip to main content Skip to right column Tom Lee's Bitmine Continues to Buy Ethereum Hand Over Fist. Should Crypto Investors Be Doing the Same? Alex Carchidi, The Motley Fool Sat, August 29, 2026 at 8:54 AM EDT 4 min read BMNR NVDA ETH-USD Bitmine Immersion Technologies (NYSE: BMNR) is a digital asset treasury (DAT) company led by chairman Tom Lee, and it's been buying Ethereum (CRYPTO: ETH) weekly for 14 months. On Aug. 17 alone, it bought 9,926 ETH worth around $19 million, only to buy another 32,447 ETH just six days later. The coin's price is up by 28% in the 30 days ending on Aug. 27 alone, a stunning reversal after months of weakness.\n\nBut does any of this mean investors should load up on Ethereum like Tom Lee is?\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAs a digital asset treasurer, Bitmine is designed to buy and hold as much of one crypto asset as it can get its hands on. In this case, that asset is Ethereum.\n\nThe business model is to issue new shares of its stock, use that capital to buy more coins, and then rinse and repeat. As long as the stock trades above the value of the coins backing each share -- which is a very big and not at all safe assumption to make -- each new share sold buys more Ethereum than it dilutes, so that the cycle can continue.\n\nSo far, though, the company is deep in the red on its hoard, having paid $19.1 billion for Ethereum that was worth $10.9 billion as of May 31.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:24 PM IST", "pub_date_relative": "37m ago"}, {"title": "5 affordable cities to retire in the U.S. right now", "full_content": "You don\u2019t have to leave the country to find an affordable place that matches your retirement vision.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Aug 2026, 06:20 PM IST", "pub_date_relative": "41m ago"}, {"title": "Goldman draws 3 lessons from economic research on U.S. inflation expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Aug 2026, 06:17 PM IST", "pub_date_relative": "44m ago"}, {"title": "The 1 Thing Every Investor Needs to Know About Surviving a Bear Market", "full_content": "Skip to navigation Skip to main content Skip to right column The 1 Thing Every Investor Needs to Know About Surviving a Bear Market James Brumley, The Motley Fool Sat, August 29, 2026 at 8:45 AM EDT 4 min read NVDA Most investors know bear markets are just a normal part of the stock market's cyclical ebb and flow. Most of those same investors also know, however, just how devastating a bear market can be. The average one pulls stocks down by more than 30% from peak to trough, and in some cases can last for years. Never even mind the amount of time that's often required just to reclaim levels reached before the bear market began.\n\nStill, they're survivable, particularly if you can remember one thing about them when it's most difficult to do so. That one thing is, you want to be 100% invested when they end.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nThen there's the second-most important thing. That is, you have no idea when they're going to end. You only know that -- like every one so far -- the next one will eventually end as well.\n\nNumbers from mutual fund company Hartford indicate that the average of the 27 bear markets suffered since 1929 has dragged the S&P 500 (SNPINDEX: ^GSPC) 35.2% lower over the course of 289 calendar days. Based on data from CFRA, the brokerage firm Charles Schwab agrees with the scope of the typical loss but says the last 12 bear markets lasted an average of 14 months.\n\nBut that's exactly what you should do. Just not for the reason you might think.\n\nYes, staying the course is critical. Nobody's consistently good at timing the market's ebbs and flows.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:15 PM IST", "pub_date_relative": "46m ago"}, {"title": "Mutinous soldiers attack airport, presidency in Niger capital", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Aug 2026, 06:06 PM IST", "pub_date_relative": "55m ago"}, {"title": "Starting Out With $5,000? 3 Stocks That Could Pay You Income for Life.", "full_content": "Skip to navigation Skip to main content Skip to right column Starting Out With $5,000? 3 Stocks That Could Pay You Income for Life. Reuben Gregg Brewer, The Motley Fool Sat, August 29, 2026 at 8:35 AM EDT 6 min read O PEP ENB If you are just starting out as an investor and looking to generate a reliable income stream, you should begin your search with companies such as Realty Income (NYSE: O), PepsiCo (NASDAQ: PEP), and Enbridge (NYSE: ENB). In fact, these three stocks could offer new investors a highly diverse portfolio with a relatively small investment of even $5,000. Here's a look at each of these high-yield dividend stocks and why they work so well together.\n\nRealty Income is the largest net-lease real estate investment trust (REIT). That means that it owns properties and leases them to tenants, but the tenants agree to pay most property-level operating expenses. This reduces Realty Income's costs and risk because it doesn't have to handle day-to-day operations at its properties. The company owns over 15,500 properties across the retail and industrial sectors, including unique property types such as casinos and data centers. And its portfolio spans both North America and Europe.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nThe big story here, however, is Realty Income's commitment to the dividend, which has been increased annually for 31 years. It is paid monthly, which is why the company trademarked the nickname \"The Monthly Dividend Company.\" The REIT is built from the ground up to be a reliable dividend payer, with a diversified foundation that it has gradually expanded over time, building on the company's strengths to enter new markets and property niches.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:05 PM IST", "pub_date_relative": "56m ago"}, {"title": "The Fed confronts a powerful new economic force - The Washington Post", "full_content": "The Fed confronts a powerful new economic force The Washington Post Warsh Is Asking the Right Questions About AI. The Answers Will Have to Wait. Barron's The Fed doesn\u2019t know who\u2019s financing the $3 trillion AI boom Fortune Warsh says AI could turbocharge the economy. The Fed is keeping close watch. Yahoo Finance Warsh Used His First Jackson Hole Keynote to Talk About AI Tokens and the Death of Forward Guidance. He Didn\u2019t Mention Stablecoins Once. forkast.news", "source": "Google News Business", "pub_date_str": "29 Aug 2026, 06:02 PM IST", "pub_date_relative": "58m ago"}, {"title": "Tim Cook wasn\u2019t a \u2018product guy\u2019 \u2014 so he re-engineered Apple instead", "full_content": "Dismissed as \u201cnot a product guy,\u201d the outgoing CEO proved that supply-chain mastery could take Apple to new heights.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Aug 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "The big lesson from this week's earnings: The AI buildout is not a zero-sum game", "full_content": "Salesforce, CrowdStrike, and Nvidia all faced major tests with investors and crushed expectations.", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 06:55 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Week Ahead: Chips, Cybersecurity And Jobs", "full_content": "BREAKING: Major Indexes Rise For Week; Small Caps Break Support\n\nStore Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Stocks On The Move New Highs Stock Spotlight Stocks Near Buy Zone RS Line At New High Rising Profit Estimates Stocks Funds Are Buying Your Weekly Review Breakout Stocks Index IBD ETF Indexes IBD Data Tables IBD Digital: 2 Months for $20 New? Start Here Research STOCK RESEARCH IBD Stock Checkup Stock Of The Day Screen Of The Day IBD Charts Stock Screener Swing Trading Options Investing Action Plan Earnings Preview Earnings Calendar IBD Industry Themes The New America Best ETFs Best Mutual Funds The Income Investor IBD Stock Analysis Industry Snapshot IBD 50 Stocks To Watch IBD Data Stories IBD Digital: 2 Months for $20 News NEWS eIBD Technology Magnificent Seven Stocks Personal Finance Special Reports Cryptocurrency Retirement Management ECONOMY Economic Calendar Economic News IBD Digital: 2 Months for $20 Videos VIDEOS & PODCASTS IBD Live How To Invest Videos Options Videos Investing With IBD Podcast Growth Stories Podcast Webinars Online Courses IBD Digital: 2 Months for $20 Learn HOW TO INVEST How To Invest In Stocks Stock Investing Keys Stock Market Timing Track Market Trends How To Read Stock Charts How To Buy Stocks When To Sell Stocks Short Selling Swing Trading What Is Crypto EDUCATIONAL RESOURCES New to IBD Investor's Corner Investing With IBD Podcast Events & Webinars IBD Moneyworks 12 Days Of Learning Investin.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:37 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gen Zers quit their jobs to start a pickle company\u2014now it\u2019s valued at $8.5 million", "full_content": "At 4 a.m. on Monday, June 1, Leah Marcus woke up to 70 missed calls from her co-founder.\n\nThe good news: A prominent influencer, Alix Earle, had posted a TikTok video about Hot Girl Pickles, the debut product sold by Marcus and co-founder Yasaman Bakhitar's Los Angeles-based startup Good Girl Snacks. The bad news: Most of the video involved Earle struggling to open the pickle jar. \"Imagine our horror,\" said Marcus, partially joking, in a response video hours later . Next came adrenaline, when hundreds of orders flooded the startup's Shopify store the following day, Marcus and Bakhitar say.\n\nTurning chaos into content is part of the recipe at Good Girl Snacks, which sells jars of Hot Girl Pickles nationwide online and in grocery stores including Whole Foods Market and Erewhon, and grab-and-go packets on its website and in smaller grocery stores. The startup declined to share revenue figures or profitability status, but was most recently valued at $8.5 million following a $3 million seed fundraising round in March, according to documents reviewed by CNBC Make It.\n\nThe co-founders tout original recipes, but at a fundamental level, they didn't invent a new method to soak cucumbers in vinegar. Instead, Marcus, 26, and Bakhitar, 27, say they've grown their startup around an aptitude for branding toward a Gen Z audience, both online and offline.\n\nEach Hot Girl Pickles product has brightly colored pink, purple or teal packaging that visually stands out against the sea of legacy brands' primary colors on grocery store condiment shelves.", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 06:35 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "TSMC vs. ASML: Which Semiconductor Giant Is the Better Stock Buy?", "full_content": "Skip to navigation Skip to main content Skip to right column TSMC vs. ASML: Which Semiconductor Giant Is the Better Stock Buy? Keithen Drury, The Motley Fool Sat, August 29, 2026 at 9:05 AM EDT 5 min read TSM NVDA ASML Taiwan Semiconductor Manufacturing (NYSE: TSM) and ASML (NASDAQ: ASML) are two vital companies for the world economy, even if they may not be well known. Taiwan Semiconductor, or TSMC as it is also known, is by far the largest chip foundry in the world, and produces logic chips for nearly every major tech company. ASML provides machinery to produce the advanced chips that TSMC and its peers manufacture, and is the only company in the world with this technology, giving it a rare technological monopoly.\n\nBoth of these companies have seen their stocks skyrocket over the past few years, but with the AI build-out projected to last for several more years, they have more upside ahead.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nBut which of these two stocks makes for the better long-term buy at the moment? Let's take a look.\n\nASML makes extreme ultraviolet (EUV) lithography machines. These machines are massive, cost hundreds of millions of dollars, and take a very specific supply chain to deliver and install. The end product is the size of a school bus, and it helps lay the tiny electrical traces on a chip. TSMC's current most advanced chip generation is 2nm chips, which indicates 2 nanometers of spacing between electrical traces. For reference, a human hair measures between 80,000 and 100,000 nanometers wide.\n\nASML's business booms when chip production increases, as it supplies the machines critical to chip production. Right now, there is a major chip production capacity build-out going on, so ASML's business is booming.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:35 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Goodyear burning rubber and cash as turnaround plan continues", "full_content": "DETROIT \u2014 Goodyear Tire & Rubber Co. CEO Mark Stewart sits in the vehicle bay of a tire shop where the company is launching a new retail experience for customers.\n\nThere's a freshly painted black facade on the revamped Detroit store, with the words \"Motor City\" added in white flanking Goodyear's winged foot logo. It's been dressed up for a private event in connection to a nearby annual car festival called the Woodward Dream Cruise.\n\nBut despite the stylish touches, it's still a tire shop. The smell of rubber and oil remains in the air and the sound of workers changing tires combines with music from a DJ inside the shop's waiting room.\n\nThe scene is symbolic of Stewart's ongoing \"Goodyear Forward\" turnaround plan . He's trying to make tires \u2014 a historically dirty business \u2014 more attractive for investors and friendlier for consumers.\n\n\"We have made so much progress, and when you think about it from the standpoint of the Goodyear Forward program, it was really to get our feet back on the ground towards being the iconic company that we always were,\" Stewart, wearing an unbuttoned navy blue Goodyear technician shirt, told CNBC during an interview at the shop.\n\nBut while Goodyear is well known for burning rubber, it's also burning cash as it restructures and tries to refinance and pay down years of debt.\n\nThe company's capital expenditures were roughly $2 billion combined in 2024 and 2025, with expectations of $725 million this year. Its debt remained at more than $7 billion at the end of the second quarter.\n\nGoodyear's net loss was $453 million through the first half of the year, while its operating income was $131 million, or a 1.6% margin.", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 06:33 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank of America sends strong message to stock market investors", "full_content": "Skip to navigation Skip to main content Skip to right column Bank of America sends strong message to stock market investors Hillary Remy Sat, August 29, 2026 at 9:03 AM EDT 5 min read BAC NVDA ^GSPC Wall Street's biggest bank just delivered a message that sounds contradictory at first. Chip stocks could fall further from here, and that is not necessarily bad news, according to one of the sector's most closely watched analysts.\n\nThe call came two days before Nvidia reported earnings on Aug. 26. Nvidia beat on every key metric and guided ahead of consensus for Q3. But what Bank of America was telling investors going into that report was more nuanced than a simple read on the earnings print.\n\nBank of America analyst Vivek Arya, who ranks 229 out of more than 12,000 analysts tracked by TipRanks with a 58% success rate, sees roughly 10% further downside risk for the Philadelphia Semiconductor Index (SOX).\n\nA decline of that size would push the SOX back to its valuation discount versus the S&P 500 before ChatGPT's debut in November 2022, CNBC reported .\n\nSeveral factors are weighing on the group in the near term. Arya pointed to rising interest rates, public pushback on data center projects, geopolitical tension, worries over circular financing arrangements between AI companies, and heavy investor positioning, with chips now running about 13% overweight against the broader S&P 500.\n\nThe data center backlash has moved beyond social media. New York put a moratorium on large-scale projects. Pennsylvania started restricting approvals. Texas launched grid audits.\n\nA year ago, none of that was happening. Now it is a real variable impacting how quickly AI infrastructure actually gets built.\n\nBank of America CEO warns inflation will back Fed into a corner", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:33 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Interface Eyes Growth as One Interface Strategy Targets Commercial Flooring Share", "full_content": "Skip to navigation Skip to main content Skip to right column Interface Eyes Growth as One Interface Strategy Targets Commercial Flooring Share MarketBeat Sat, August 29, 2026 at 9:01 AM EDT 6 min read TILE Key Points Interested in Interface, Inc.? Here are five stocks we like better.\n\nInterface is targeting growth in commercial flooring through its \"One Interface\" global operating model, focused product portfolio and emphasis on design, performance and sustainability. The company serves more than 100 countries and generates about $1.4 billion in annual revenue, with 98% from commercial customers.\n\nThe company estimates its addressable commercial flooring market at more than $9 billion , with opportunities in carpet tile, LVT and differentiated rubber flooring. It says it is gaining share in corporate office, healthcare and education, particularly in Class A properties and facilities undergoing refresh projects.\n\nInterface is investing $25 million to support growth while continuing to expand margins through manufacturing and operating efficiencies. With net debt at just 0.5 times EBITDA, management says it can balance reinvestment, selective acquisitions, dividends and share repurchases.\n\nInterface (NASDAQ:TILE) Chief Financial Officer Bruce Hausmann told investors that the commercial flooring company is pursuing growth through a focused product portfolio, global operating model and emphasis on design, performance and sustainability.\n\nSpeaking at an investor conference, Hausmann said Interface operates three brands: Interface, nora rubber flooring and consumer-focused FLOR. The company generates about $1.4 billion in revenue, with approximately 60% coming from the Americas, 29% from Europe and 11% from Asia-Pacific, he said.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:31 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What Buyers and Sellers Should Expect to Pay at Closing", "full_content": "Skip to navigation Skip to main content Skip to right column What Buyers and Sellers Should Expect to Pay at Closing Christian Drerup Sat, August 29, 2026 at 9:00 AM EDT 4 min read Quick Read Sellers cover ownership-transfer costs like commissions, title insurance, and transfer taxes, while buyers handle mortgage fees, inspections, and prepaid expenses.\n\nMany closing costs are negotiable, and sellers can offer credits to offset buyer expenses, though government fees and lender requirements stay fixed.\n\nBuyers financing a home should review their Loan Estimate and Closing Disclosure to understand all costs before signing.\n\nDon't wait: the analyst who called NVIDIA in 2010 just revealed his top 10 AI stocks. See the full list FREE now .\n\nBuying or selling a house comes with dozens of costs beyond just the price of the property. These fees can be downright overwhelming, at a time when you likely already have your hands full with packing and relocating. One of the biggest things people forget about is closing costs. This assortment of fees and expenses needs to be paid before the keys change hands. Every real estate transaction can be a bit different, and many of these fees can be negotiated as part of the purchase. That being said, some costs are typically handled by either the seller or the buyer. It's good to be aware of what you will likely have to pay before showing up to sign a contract.\n\nThe seller is usually responsible for costs related to transferring ownership and cleaning the property for the new buyer moves in. Some common seller expenses include:\n\nOne of the largest costs is paying the real estate agents involved in the entire process. The way this works has changed fairly recently. The seller generally negotiates compensation with their own listing agent, while buyer-agent compensation is handled separately and can vary depending on the agreement. In some deals, the seller might agree to contribute to the buyer's agent compensation.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:30 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Op-ed: Salesforce just revealed the next battleground in AI \u2014 and it's not the models", "full_content": "Analysts and pundits in finance have an endless supply of clever, simplistic explanations for complex market movements. Over the years, culprits have ranged from El Ni\u00f1o and climate change to the World Trade Organization, rock 'n' roll music and the fluoridation of water. Many of these explanations proved wrong, yet commentators continue to reach for overly simple narratives to explain market moves. The latest example is the sell-off in software stocks.\n\nFor the past year, markets have vaporized roughly $2 trillion in software value by asking the wrong question about AI. The question behind the so-called \"SaaSpocalypse\" \u2014 can an AI agent do what this software does? \u2014 is misguided because it treats a software company as nothing more than a bundle of tasks waiting to be automated away.\n\nThe right question, and the clearest test we know of for separating AI's winners from its roadkill, is different: Does this company own something AI agents cannot operate without?\n\nSalesforce's recent blowout earnings show why the balance of power may be shifting away from frontier models and back toward software companies that investors had prematurely left for dead.\n\nFor months, analysts have assumed that frontier large language models will accrue an ever-greater share of the value created by AI, with the valuations of those companies soaring commensurately. But intelligence is precisely the thing being commoditized before our eyes: Frontier models now leapfrog one another every few months, growing ever more capable but also increasingly interchangeable.\n\nAI may also be approaching RSI \u2014 recursive self-improvement \u2014 which could accelerate those improvement cycles even further, while the price of raw intelligence collapses amid heated competition from well-funded rivals and increasingly capable Chinese open-source models.\n\nSo in this new world, if LLMs are the commodity, where is the moat? The answer, we believe, is data.", "source": "CNBC World Economy", "pub_date_str": "29 Aug 2026, 06:30 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "First Phosphate eyes feasibility study after resource update and NASDAQ uplisting - ICYMI", "full_content": "Skip to navigation Skip to main content Skip to right column First Phosphate eyes feasibility study after resource update and NASDAQ uplisting - ICYMI Proactive Sat, August 29, 2026 at 9:00 AM EDT 2 min read PHOS PHOS First Phosphate Corp. (CSE:PHOS, NASDAQ:PHOS, FRA:KD0, OTCQX:FRSPF) earlier this week provided an update on the advancement of its B\u00e9gin-Lamarche property, with CEO John Passalacqua highlighting an expanded mineral resource, its NASDAQ uplisting and access to more than $50 million of capital as the company works towards its next development milestones.\n\nSpeaking to Proactive, Passalacqua said the updated NI 43-101 mineral resource estimate showed a significant increase in indicated resources and an increase in the volume of material.\n\nHe said the most important feature was the \"continuity and consistency throughout the entire resource\", adding that the update had given First Phosphate confidence to move into a feasibility study as soon as possible.\n\nThe feasibility study represents one of the company's key upcoming potential catalysts. Passalacqua said First Phosphate was targeting its release by the end of 2026 or early 2027, with permitting and an investment decision targeted by the end of 2027.\n\nFirst Phosphate's recent NASDAQ uplisting could also broaden its access to US investors. Passalacqua said the company's American depositary receipt had been uplisted to the exchange, with its management team and board subsequently taking part in the opening bell ceremony in New York.\n\nDuring accompanying roadshows, Passalacqua said he spoke with around 150 to 200 interested funds. He explained that some US funds had previously required First Phosphate to secure a listing on a major stock exchange before they could invest.\n\nPassalacqua said the company had subsequently seen significant trading volumes following the NASDAQ listing.\n\nFunding provides another important element of First Phosphate's development plans.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:30 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nobody's Talking About This Energy Company, but It's Quietly Signing the Power Deals Feeding the AI Build-Out", "full_content": "Skip to navigation Skip to main content Skip to right column Nobody's Talking About This Energy Company, but It's Quietly Signing the Power Deals Feeding the AI Build-Out Matt DiLallo, The Motley Fool Sat, August 29, 2026 at 8:55 AM EDT 7 min read GOOG BE OKLO NVDA ORCL When investors want to play the AI power boom, the first names that come to mind are hot stocks in emerging energy technologies, such as advanced fuel cell maker Bloom Energy (NYSE:BE) and small modular reactor developer Oklo (NYSE:OKLO). Bloom has major AI partnerships with Oracle and Brookfield , while Oklo has deals with Meta Platforms and Switch.\n\nOne company almost no one is talking about is the high-yielding clean-power producer Clearway Energy (NYSE:CWEN). That's a mistake. Its parent (Clearway Energy Group) quietly signed a nearly 1.2-gigawatt (GW) deal to build renewable power for Alphabet (NASDAQ:GOOG)(NASDAQ:GOOGL), and it's getting paid much more for the power produced at some of its legacy assets because the new power buyer is a hyperscaler with voracious energy needs.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nThat's only the beginning. AI power is one of the catalysts that make Clearway among the top renewable energy stocks to buy .\n\nThis past January, Clearway Energy Group signed three long-term power purchase agreements (PPAs) with Alphabet's Google for nearly 1.2 GW of projects to support its data centers. They represent over $2.4 billion of investment in energy infrastructure, with the first projects expected to come online in 2027 and 2028.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:25 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tom Lee's Bitmine Continues to Buy Ethereum Hand Over Fist. Should Crypto Investors Be Doing the Same?", "full_content": "Skip to navigation Skip to main content Skip to right column Tom Lee's Bitmine Continues to Buy Ethereum Hand Over Fist. Should Crypto Investors Be Doing the Same? Alex Carchidi, The Motley Fool Sat, August 29, 2026 at 8:54 AM EDT 4 min read BMNR NVDA ETH-USD Bitmine Immersion Technologies (NYSE: BMNR) is a digital asset treasury (DAT) company led by chairman Tom Lee, and it's been buying Ethereum (CRYPTO: ETH) weekly for 14 months. On Aug. 17 alone, it bought 9,926 ETH worth around $19 million, only to buy another 32,447 ETH just six days later. The coin's price is up by 28% in the 30 days ending on Aug. 27 alone, a stunning reversal after months of weakness.\n\nBut does any of this mean investors should load up on Ethereum like Tom Lee is?\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAs a digital asset treasurer, Bitmine is designed to buy and hold as much of one crypto asset as it can get its hands on. In this case, that asset is Ethereum.\n\nThe business model is to issue new shares of its stock, use that capital to buy more coins, and then rinse and repeat. As long as the stock trades above the value of the coins backing each share -- which is a very big and not at all safe assumption to make -- each new share sold buys more Ethereum than it dilutes, so that the cycle can continue.\n\nSo far, though, the company is deep in the red on its hoard, having paid $19.1 billion for Ethereum that was worth $10.9 billion as of May 31.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:24 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Goldman draws 3 lessons from economic research on U.S. inflation expectations", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Aug 2026, 06:17 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The 1 Thing Every Investor Needs to Know About Surviving a Bear Market", "full_content": "Skip to navigation Skip to main content Skip to right column The 1 Thing Every Investor Needs to Know About Surviving a Bear Market James Brumley, The Motley Fool Sat, August 29, 2026 at 8:45 AM EDT 4 min read NVDA Most investors know bear markets are just a normal part of the stock market's cyclical ebb and flow. Most of those same investors also know, however, just how devastating a bear market can be. The average one pulls stocks down by more than 30% from peak to trough, and in some cases can last for years. Never even mind the amount of time that's often required just to reclaim levels reached before the bear market began.\n\nStill, they're survivable, particularly if you can remember one thing about them when it's most difficult to do so. That one thing is, you want to be 100% invested when they end.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nThen there's the second-most important thing. That is, you have no idea when they're going to end. You only know that -- like every one so far -- the next one will eventually end as well.\n\nNumbers from mutual fund company Hartford indicate that the average of the 27 bear markets suffered since 1929 has dragged the S&P 500 (SNPINDEX: ^GSPC) 35.2% lower over the course of 289 calendar days. Based on data from CFRA, the brokerage firm Charles Schwab agrees with the scope of the typical loss but says the last 12 bear markets lasted an average of 14 months.\n\nBut that's exactly what you should do. Just not for the reason you might think.\n\nYes, staying the course is critical. Nobody's consistently good at timing the market's ebbs and flows.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:15 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Starting Out With $5,000? 3 Stocks That Could Pay You Income for Life.", "full_content": "Skip to navigation Skip to main content Skip to right column Starting Out With $5,000? 3 Stocks That Could Pay You Income for Life. Reuben Gregg Brewer, The Motley Fool Sat, August 29, 2026 at 8:35 AM EDT 6 min read O PEP ENB If you are just starting out as an investor and looking to generate a reliable income stream, you should begin your search with companies such as Realty Income (NYSE: O), PepsiCo (NASDAQ: PEP), and Enbridge (NYSE: ENB). In fact, these three stocks could offer new investors a highly diverse portfolio with a relatively small investment of even $5,000. Here's a look at each of these high-yield dividend stocks and why they work so well together.\n\nRealty Income is the largest net-lease real estate investment trust (REIT). That means that it owns properties and leases them to tenants, but the tenants agree to pay most property-level operating expenses. This reduces Realty Income's costs and risk because it doesn't have to handle day-to-day operations at its properties. The company owns over 15,500 properties across the retail and industrial sectors, including unique property types such as casinos and data centers. And its portfolio spans both North America and Europe.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nThe big story here, however, is Realty Income's commitment to the dividend, which has been increased annually for 31 years. It is paid monthly, which is why the company trademarked the nickname \"The Monthly Dividend Company.\" The REIT is built from the ground up to be a reliable dividend payer, with a diversified foundation that it has gradually expanded over time, building on the company's strengths to enter new markets and property niches.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 06:05 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "K, C or E? Why economists can\u2019t agree on the shape of today\u2019s economy", "full_content": "Those aren't initials or Greek life letters. They're some of the terms that economists, corporate leaders and politicians are using as they attempt to define the U.S. current economic moment.\n\nEver since the recovery from the pandemic, a consensus among economists has viewed the economy as acting in a \"K\"-shape , displaying an unequal expansion for different groups and the arms of the \"K\" heading in opposite directions.\n\nNow there's a debate over whether the K-shaped recovery still exists, or if the economy instead resembles the letter \"C\" or \"E.\"\n\n\"This is some of the alphabet soup,\" said Joel Mokyr, a Nobel Prize-winning economic historian at Northwestern University.\n\nThe race to label the structure of today's economy involves more than semantics or bragging rights. In recent years, the divergence among low- and high-income consumers expressed in a K-shaped economy has been top of mind for politicians, monetary policymakers and executives of consumer companies.\n\nFor decades, letter shapes have been used to sum up the economy, especially following major downturns. The list of those that have been employed throughout history includes \"V-,\" \"L-\" and \"W-shaped.\"\n\nBut it's unusual for this type of description to have staying power among everyday Americans several years after a recession, as it does today, according to Don Rissmiller, chief economist at research firm Baird Strategas. Mounting concerns around wealth inequality may be driving heightened awareness, he said.\n\n\"During recessions and recoveries, the letters are really popular,\" Rissmiller said. \"To use a letter in the middle of a business cycle, I guess we could say that's a little new.\"", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 05:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tech backlash reaches fever pitch as AI angst collides with social media fears", "full_content": "Silicon Valley's technology leaders have long dreamed of making the world a better place. But now more than ever, Americans say they're living in a tech-induced nightmare.\n\nThe rapid rise of artificial intelligence giants like OpenAI and Anthropic has exacerbated a deep malaise toward the tech sector, especially among people who have come to associate AI with job loss and now see outsized data centers rising up in their backyards. The last generation of technology, meanwhile, ushered in a cohort of social media apps that proved so addictive that Meta agreed to fork over up to $17 billion as part of a landmark settlement this week.\n\nAt a time of stubbornly high inflation that's pushed consumer confidence to a seven-month low, Americans are looking up to see tech's trillion-dollar companies getting bigger and more powerful, all while being led by some of the wealthiest people on the planet.\n\n\"If this technology takes off in the way that you see the CEOs of AI Labs talking about, we're facing a significant impact to our economy, to people's jobs, to their sense of agency,\" Sarah Myers West, co-executive director of research firm AI Now Institute, told CNBC in an interview. \"There are lots of members of the public that don't want to see that vision roll out.\"\n\nMore than half of Americans say they're more concerned than excited about the growing use of AI in daily life, according to a recent report from the Pew Research Center. That's up from 37% in 2021. And in a poll earlier this year, the Searchlight Institute found that the overwhelming majority of voters believe social media has a negative impact on society.\n\nConfidence in AI executives is even more dismal, according to a CNBC Generation Lab survey of 18- to 34-year-olds.", "source": "CNBC World Economy", "pub_date_str": "29 Aug 2026, 05:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018You could lose 25% to 35%.\u2019 AARP warns Americans about making this 401(k) move. Here are 4 alternatives to consider", "full_content": "Skip to navigation Skip to main content Skip to right column \u2018You could lose 25% to 35%.\u2019 AARP warns Americans about making this 401(k) move. Here are 4 alternatives to consider Vishesh Raisinghani Sat, August 29, 2026 at 8:15 AM EDT 9 min read Moneywise and Yahoo Finance LLC may earn commission or revenue through links in the content below.\n\nTapping into your 401(k) early to deal with debt or emergency bills may seem like a savvy move, but two of the biggest names in retirement planning are sounding the alarm about doing so.\n\nFidelity, one of the largest 401(k) plan administrators in the country, and AARP, the nation's leading advocacy group for older Americans, are both warning workers that early withdrawals can wipe out a significant chunk of their savings overnight.\n\nJeff Bezos backs a platform that lets anyone invest in rental homes for as little as $100 \u2014 6 ways to build wealth like a landlord without actually being one\n\nJPMorgan sees gold hitting $5,000/oz by Q4 \u2014 and savvy investors are protecting their wealth with a tax-advantaged Gold IRA. Get your free guide from Priority Gold\n\nThe tax breaks in Trump's 'big beautiful bill' expire after 2028. Here are 4 moves to make before the window closes\n\n\"When you withdraw from a 401(k) before age 59-and-a-half, you may owe ordinary income taxes plus a 10 percent penalty, meaning you could lose 25 to 35 percent of what you take out,\" said BetterWallet's Marc Russell, according to AARP (1).\n\n\"Translation: A $20,000 withdrawal might net you only $12,000 to $14,000 after taxes and penalties,\" AARP added.", "source": "Yahoo Finance", "pub_date_str": "29 Aug 2026, 05:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Iran trade falls as Supreme Leader Khamenei urges less reliance on the U.S. dollar", "full_content": "Iranian trade has fallen sharply under U.S. sanctions and a naval blockade, President Masoud Pezeshkian said, as Supreme Leader Mojtaba Khamenei urged a reduction in reliance on the U.S. dollar.\n\n\"We have had a decrease of between 25% and 35%. Our exports have decreased, but imports have decreased more,\" Iranian President Masoud Pezeshkian said in an interview late Friday with state TV and according to a Google translation of a Tasnim News transcript. \"The decrease in exports is slightly less than the decrease in imports, and imports have decreased significantly.\"\n\n\"What do these statistics mean? Then some people say that sanctions have no effect at all! I really don't know what to tell these people,\" Pezeshkian was quoted as saying. \"I just want to say this, saying that sanctions have no effect is not consistent with these facts.\"\n\nMeanwhile, Supreme Leader Mojtaba Khamenei called for greater economic self-reliance in a written message Friday.\n\n\"Equally vital is giving special attention to economic growth, boosting production, gradually phasing out the US dollar from playing a pivotal role, and ultimately, making Resistance Economy the central focus,\" Mojtaba Khamenei said in a post on X late Friday.\n\nOn Monday, U.S. Treasury Secretary Scott Bessent launched \"Operation Economic Outcast,\" a sanctions campaign aimed at severing all of Iran's economic ties worldwide.\n\nIn one of its first moves, the Treasury Department on Friday proposed cutting off the UAE operations of Egyptian bank Banque Misr from correspondent banking access to U.S. financial institutions over alleged financial ties to Iran.\n\nTreasury proposed revoking Banque Misr UAE's correspondent banking access to U.S. financial institutions, the department said in a statement.", "source": "CNBC Top News", "pub_date_str": "29 Aug 2026, 05:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Subhash Chandra Case: After HDFC Bank, Union Bank, Canara Bank To Challenge NCLT's Approval of Insolvency Resolution Plan", "full_content": "The statement said Union Bank of India (UK), along with creditors including Canara Bank and LIC Housing Finance Ltd, had rejected the resolution plan and urged the NCLT not to approve it.", "source": "NDTV Profit", "pub_date_str": "29 Aug 2026, 05:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}], "updated_at": "29 Aug 2026, 07:01 PM IST", "total_stories": 385};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
