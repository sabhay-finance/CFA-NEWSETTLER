ading below their IPO price, creating an overhang on other artificial intelligence names.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 09:35 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "U.S. proposes new tariffs on 14 trading partners, including China and the EU", "full_content": "The U.S. is preparing new tariffs on 14 economies , including China, the EU, Japan and India, following investigations into what the Trump administration says are excess manufacturing practices that disadvantage U.S. commerce.\n\nThe administration launched those and other trade investigations in March , weeks after the Supreme Court unraveled a major piece of President Donald Trump 's tariff-heavy economic policy by striking down his \"liberation day\" duties. Trump has since been accused by critics of his tariffs of trying to revive the canceled duties using other legal authorities.\n\nThe latest action targets foreign economies that create, sustain or contribute to structural excess capacity and production in manufacturing sectors that the U.S. finds unreasonable and burdensome or restrictive to its commerce, a senior U.S. official told reporters Tuesday evening.\n\nThe new tariffs are \"targeted,\" not blanket rates, and will vary for each economy, and many will not exceed the rates established in previously reached trade deals, said the official, who spoke on condition of anonymity to discuss the forthcoming duties.\n\nThe rates, which mostly range from 15% to 20%, are \"not really additive\" and generally will not stack on top of existing duties, U.S. Trade Representative Jamieson Greer told CNBC's \"Squawk Box\" Wednesday morning.\n\n\"In effect, it'll look more like a top up,\" Greer said. \"When it all nets out, it really will just top up a few percentage points.\"\n\nAn exception is China, which faces a 20% rate under the new tariff policy, \"so it will go up some,\" Greer said. But at the same time, both countries are moving to remove tariffs on some of each other's goods in what Greer called \"stability-generating activity through this action.\"\n\nThe senior U.S. official said Tuesday that the 20% rate will come on top of the so-called forced technology transfer-related tariffs of roughly 25%, which were implemented during Trump's first presidential term. U.S.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 09:32 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Saudi national charged in OpenAI bugging to be released on $1 million bond", "full_content": "Abdulrahman Alfozan , the Saudi national accused of bugging an OpenAI executive conference room, will be allowed to be released from jail on a $1 million bond , a San Francisco federal court judge ruled Tuesday.\n\nAlfozan, 35, is expected to be released on Wednesday and be fitted with an ankle monitor, according to his attorney, David Rizk.\n\n\"We are simply grateful that the Court made the right decision to release Mr. Alfozan and now we look forward to defending the case,\" Rizk said in a text message after a hearing before U.S. District Court Magistrate Judge Alex Tse.\n\nTse ruled in favor of a release motion by Rizk filed last week that said prosecutors had admitted they had \"found no new evidence to support the theory that Mr. Alfozan was stealing trade secrets, or to support the speculation that he was acting as an unregistered foreign agent for Saudi Arabia.\"\n\nThe San Francisco U.S. Attorney's Office opposed the former OpenAI engineer's release, saying in its response that he remains a flight risk due to his \"considerable resources and ties to Saudi Arabia.\"\n\nAlfozan's release request \"blithely dismisses the seriousness\" of the charge he faces, and \"appears to presume, without support, that the government's investigation is complete,\" prosecutors wrote.\n\nAlfozan, who was arrested Oct. 9, is accused of concealing a recording device in the artificial intelligence company's conference room to secretly record discussions. The device was found in a USB port in a television in the room on Sept. 30, prosecutors have said.\n\nProsecutors said they have found hundreds of audio files on Alfozan's personal computer, \"including dozens of recordings of meetings or conversations that occurred at OpenAI throughout September 2026, many of which involve discussions of what may be trade secrets.\"", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 09:25 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Net FDI turns negative at USD 4.95 billion in Sep on flow moderation, higher outflows: RBI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a Net FDI turns negative at USD 4.95 billion in Sep on flow moderation, higher outflows: RBI The Economic Times daily newspaper is available online now. Read Today's Paper Net FDI turns negative at USD 4.95 billion in Sep on flow moderation, higher outflows: RBI SECTIONS Net FDI turns negative at USD 4.95 billion in Sep on flow moderation, higher outflows: RBI PTI Last Updated: Nov 25, 2026, 09:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The month of September 2026 marked a decline in net foreign direct investment in India, reaching negative USD 4.95 billion, primarily due to decreasing gross inflows and more substantial foreign investment repatriations. In contrast, outward direct investment from India rose to USD 4.41 billion. Although foreign portfolio investments faced a drop of USD 6.652 billion in October, they bounced back in November, achieving USD 12.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 09:07 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Best low-interest personal loans of December 2026", "full_content": "A lower interest rate can make a personal loan less expensive. The lowest rates vary by lender and are typically offered to borrowers with exceptional credit and for shorter repayment terms.\n\nWe've rounded up the best lenders for personal loans with low interest rates, considering features like fees, loan limits, repayment terms and funding speed. For more on how we made our picks, read our methodology .\n\nBest for joint loans: Happen Bank allows you to apply with a co-borrower, which can improve your chances if you think you may not qualify for favorable rates and terms on your own.\n\nStandout benefits: Qualifying borrowers who take out a debt consolidation loan and have Happen Bank send payments directly to their creditors may receive a Direct Pay discount of 0.75% to 8%.\n\nHappen Bank considers borrowers with FICO Scores of 600 and above, which is in the fair range (between 580 and 669).\n\nFormerly LendingClub, Happen Bank offers competitive rates on a wide range of loan amounts, with funds available in as little as 24 hours after final approval.\n\nBest for secured loans: Best Egg 's fixture-secured loan allows homeowners to use permanent fixtures as collateral, such as cabinetry, lighting and HVAC systems. It also approves vehicle equity loans for up to $100,000, double its normal loan cap. According to Best Egg, its secured loan APRs are, on average, 20% lower than its unsecured rates.\n\nStandout benefits: Minimum credit score requirements start around 600, making Best Egg a good option for borrowers with fair credit. If you use your loan to consolidate debt, Best Egg can send funds directly to up to 10 creditors.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 08:57 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty recovers Monday's losses, moves within reach of record high", "full_content": "Mumbai: Indian stocks moved closer to record highs on Wednesday, with a sharp rebound more than erasing Monday's losses. However, analysts expect the rally to face bouts of profit-taking, consolidation and volatility before the benchmarks scale fresh peaks.\n\nThe Nifty 50 surged nearly 1.9%, or 469 points, to close at 25,819.25, while the Sensex gained 1.8%, or 1,502 points, to settle at 83,938.28. The markets were closed on Tuesday for a holiday. A stronger rupee, which emerged as Asia's best-performing currency against the dollar, and a decline in Brent crude prices to below $90 a barrel also supported sentiment, although crude prices recovered later.\n\nThe Nifty 50, however, encountered selling pressure near the psychologically important 26,000 mark. It touched an intraday high of 25,951.65, just 48 points short of the level, before surrendering some of its gains. Market participation remained strong, with equity turnover on the National Stock Exchange ( NSE ) at \u20b9 1.37 trillion, well above the November average of \u20b9 1.23 trillion.\n\nIndian equities have emerged as Asia's best-performing market this month, with the Nifty 50 gaining 12% as foreign investors poured nearly $15 billion into domestic stocks. However, the sharp recovery does not necessarily signal an uninterrupted run towards a new record. After the recent surge, markets could see profit-taking and consolidation as investors reassess valuations and the sustainability of foreign inflows. This could make the final leg of the rally more volatile, even as the benchmark remains within reach of its previous peak of 26,373.2 scaled in January.\n\n\u201cWhile the Nifty 50 is attempting to move towards its all-time high, the journey is likely to involve considerable consolidation and volatility,'' said Dinesh Nagpal, a prop trader and technical expert.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 08:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What changes for your money in December 2026? SBI card fees, Aadhaar updates, and other rules consumers should know", "full_content": "December brings revised SBI credit card charges, new SEBI commodity trading margins and easier digital KYC for eligible overseas investors. Aadhaar email updates remain free until December 31, while pensioners face a November 30 life certificate deadline.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 08:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Nvidia stock loses momentum after Huang's return as CEO, down another 9%; why are investors dumping AI stocks again?", "full_content": "Nvidia shares fell 9% at Wednesday\u2019s open, extending a two-day decline to 14.5% as investors weighed rising AI infrastructure costs, higher borrowing costs, governance uncertainty and potential regulation.&nbsp;", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 08:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Carlyle pares 7.4% stake in Piramal Pharma for over Rs 2,211 crore", "full_content": "The Carlyle Group has divested 7.4 percent of its stake in Piramal Pharma through an open market deal, selling approximately 9.86 crore shares at an average rate of Rs 224.17 each. As a result, its stake decreased from 17.93 percent to 10.52 percent. Aditya Birla Sun Life Mutual Fund was the most significant buyer, acquiring over 2.12 crore shares. Subsequently, Piramal Pharma's share price dropped by 1.", "source": "Economic Times Markets", "pub_date_str": "25 Nov 2026, 08:32 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI raises share of domestically held gold reserves, data shows", "full_content": "As of September, the Reserve Bank of India has expanded its domestic gold reserves to 880.52 metric tonnes. This figure comprises 740.13 metric tonnes held in the country and 140.39 metric tonnes stored internationally. However, the proportion of gold within the overall reserves has declined to 14.38%. Currently, India's total foreign exchange reserves stand at $705.3 billion, predominantly inv     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
