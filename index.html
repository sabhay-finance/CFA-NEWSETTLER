tent": "DETROIT \u2014 General Motors is in the early stages of developing next-generation battery cells that the company believes can reduce U.S. dependence on China, while boosting domestically sourced materials.\n\n\"We're developing a supply chain such that, two years from now, three years from now, it will be domestic,\" Kurt Kelty, GM vice president of battery and sustainability, told CNBC during an exclusive interview. \"That's what we're aiming for \u2014 when we get into market, we've got a domestic source for that.\"\n\nKelty was referring mainly to battery cells that the automaker expects to use in energy storage systems, or ESS, which are stationary devices for homes and businesses, including data centers. But the company plans to similarly prioritize domestic battery cell production for its future all-electric vehicles, a spokesperson reaffirmed to CNBC.\n\nKelty's comments came days before GM's crosstown rival Ford Motor fielded criticism by the Trump administration for its ties to Chinese companies, including for domestic battery cell production.\n\nFor ESS, GM has partnered with Denver-based startup Peak Energy to develop sodium-ion battery cells. The idea is to lower the need for materials that China dominates \u2014 such as lithium and ferrous sulfate, a byproduct of titanium production \u2014 and instead, use domestic-made batteries utilizing more prevalent materials in the U.S., such as sodium from soda ash.\n\nGM is working on a variety of battery chemistries for different applications of ESS as well as its EVs. Much like baking, each ingredient and the amount put into a battery cell can change the outcome of the product. In the case of battery cells, that can mean differences in performance, cost and stability.\n\nGM expects to launch commercial production of sodium-ion battery cells with Peak around 2029.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 06:35 AM IST", "pub_date_relative": "28m ago"}, {"title": "CAS set for a rework: ncing from a floor near $4,000 an ounce in July, as traders repeatedly recalibrate the outlook for Fed policy. Despite the near-term headwinds, many investors are still betting that bullion will grind higher as it rediscovers its traditional value as a portfolio hedge.\n\nSpot gold was down 0.2% at $4,339.96 an ounce at 8:30 a.m. in Singapore. Silver fell 0.8% to $64 an ounce. Platinum and palladium also declined.", "source": "LiveMint Markets", "pub_date_str": "14 Sep 2026, 06:31 AM IST", "pub_date_relative": "32m ago"}, {"title": "Trump calls $5,000 payouts \u2019easy\u2019 to fit into federal budget", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 06:30 AM IST", "pub_date_relative": "33m ago"}, {"title": "Hartalika Teej 2026 Wishes: 50+ Heartfelt Messages, Greetings & Captions To Share With Loved Ones", "full_content": "Hartalika Teej 2026 will be celebrated on September 14. Check out heartfelt wishes, messages and social media captions to share.", "source": "NDTV Profit", "pub_date_str": "14 Sep 2026, 06:30 AM IST", "pub_date_relative": "34m ago"}, {"title": "Tata group stocks may pop after RBI decision", "full_content": "Mumbai: A short-term pop could push up the stocks of seven Tata group companies, led by Tata Chemicals, which together hold 11.92% stake in Tata Sons, the holding company (holdco) of the salt-to-software conglomerate, after RBI rejected its submission to remain private.\n\nTata Chemicals is expected to be a standout performer when the markets reopen on Tuesday, as its approximately 2.5% stake in the holdco is valued at upwards of \u20b9 17,407 crore after an estimated 40% holding company discount, were it to be listed. This is against its market capitalisation of \u20b9 15,603 crore as of Friday.\n\nTo be sure, Tata Sons receives dividend income from Tata Group companies and proceeds from listed companies. Its standalone revenue totalled \u20b9 42,366.5 crore and it reported \u20b9 31,961 crore profit in FY26. However, these standalone numbers do not include the burgeoning losses from businesses incubated under the holding company. Tata Sons\u2019s four privately held businesses include Air India, Tata Digital, Tata Electronics, and lithium-ion battery cell manufacturing for electric vehicles under Tata Agratas, which reported a combined loss of \u20b9 29,924 crore.\n\nWhen a similar listing prospect emerged in March 2024, group shares surged rapidly before gains fizzled when Tata Sons sought to surrender its registration as a core investment company. Tata Chemicals rallied 39% in less than a week during that wave, while entities like Tata Motors Ltd, Tata Power Co., and Tata Steel Ltd also posted steep short-term advances.\n\nThe continuation of the likely momentum if the listing takes place, will depend upon whether Tata Sons accedes to the regulatory directive or mounts a legal challenge.\n\nTata Sons submitted an application to surrender its registration as an upper-layer non-banking financial services (UL-NBFC) company in March 2024, which the central bank rejected on Friday.", "source": "LiveMint Markets", "pub_date_str": "14 Sep 2026, 06:30 AM IST", "pub_date_relative": "34m ago"}, {"title": "\u2018I still don\u2019t have my MRI\u2019: My health insurer canceled my plan without warning. Is that legal?", "full_content": "\u201cIt wasn\u2019t an ACA plan, but it was meaningfully cheaper than anything I could find on the ACA exchange.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "14 Sep 2026, 06:30 AM IST", "pub_date_relative": "34m ago"}, {"title": "Kennedy Center on brink of bankruptcy, could close as early as Tuesday, Washington Post reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "14 Sep 2026, 06:24 AM IST", "pub_date_relative": "39m ago"}, {"title": "Tata Sons listing to improve SP Group bond outlook; yields seen tightening", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wea ices surged again, adding inflationary pressure. Brent rose toward $107 a barrel, after rallying almost 9% last week. A meeting planned for Monday between Iran and several Gulf nations to create a temporary shipping lane through the Strait of Hormuz was postponed, leaving efforts to increase shipments through the critical waterway in limbo.\n\nGold has traded in a relatively narrow range either side of $4,400 since bouncing from a floor near $4,000 an ounce in July, as traders repeatedly recalibrate the outlook for Fed policy. Despite the near-term headwinds, many investors are still betting that bullion will grind higher as it rediscovers its traditional value as a portfolio hedge.\n\nSpot gold was down 0.2% at $4,339.96 an ounce at 8:30 a.m. in Singapore. Silver fell 0.8% to $64 an ounce. Platinum and palladium also declined.", "source": "LiveMint Markets", "pub_date_str": "14 Sep 2026, 06:31 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tata group stocks may pop after RBI decision", "full_content": "Mumbai: A short-term pop could push up the stocks of seven Tata group companies, led by Tata Chemicals, which together hold 11.92% stake in Tata Sons, the holding company (holdco) of the salt-to-software conglomerate, after RBI rejected its submission to remain private.\n\nTata Chemicals is expected to be a standout performer when the markets reopen on Tuesday, as its approximately 2.5% stake in the holdco is valued at upwards of \u20b9 17,407 crore after an estimated 40% holding company discount, were it to be listed. This is against its market capitalisation of \u20b9 15,603 crore as of Friday.\n\nTo be sure, Tata Sons receives dividend income from Tata Group companies and proceeds from listed companies. Its standalone revenue totalled \u20b9 42,366.5 cror The potential listing is expected to influence the valuation of these group entities.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Sep 2026, 06:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FII flows are returning, but durability will depend on US yields and crude price", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nWhen the yield on India's 10-year sovereign bonds rises to 7.3-7.5%, the risk-reward ratio for Indian equities would begin to deteriorate, said Jignesh Desai, chief executive officer, institutional equities, Centrum Broking. A risk premium on crude fades once tensions cool, and a blocked Strait of Hormuz does not remove the risk premium, he said, explaining why crude oil prices remain at $95 per barrel. The central bank's policy signals, the state of rabi sowing, and September quarter earnings could be key triggers in the coming months, Desai said in an interview. Edited excerpts:\n\nThe Nifty has not made a new high since early January and is roughly 10% below that level. On the surface, that looks like weak sentiment. But the picture beneath is different. The June quarter was the strongest earnings quarter in some time, with index profit growth of about 18%. Estimate upgrades also outnumbered downgrades, while the forward multiple compressed to around 17 times earnings. In effect, the market has spent eight months consolidating while earnings have continued to grow. That has brought valuations down without requiring a large fall in the index. So, the sentiment is not broken. What remains missing is sustained foreign buying at scale. That has more to do with the global cost of capital and currency returns than with investors losing confidence in India\u2019s earnings outlook.\n\nYes, higher US bond yields can put further pressure on flows into Indian equities. India cannot address it through domestic policy alone. That said, recent flow data have been better than the headlines suggest. Foreign investors net bought Indian equities for three consecutive months, with August inflows close to \u20b9 300 billion. The buying has also broadened despite the Fed\u2019s hawkish turn and the rise in crude. During the previous two years, expensive valuations and earnings downgrades weakened the equity case.", "source": "LiveMint Markets", "pub_date_str": "14 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bank holiday today: Are SBI, HDFC, ICICI branches closed on Monday, 14 September, for Ganesh Chaturthi?", "full_content": "Bank holiday today: Public and private banks in multiple cities will remain closed today, on Monday, 14 September, on account of Ganesh Chaturthi, according to the Reserve Bank of India's holiday calendar for the month.\n\nNotably, this follows the weekend offs on 12 September (second Saturday) and 13 September (Sunday) and will be an extended holiday for bank operations across a number of cities and towns in India today.\n\nAs per RBI rules, all scheduled and non-scheduled banks observe mandatory closure on all second and fourth Saturdays and every Sunday in a month. However, while access in-branch services are shut, online services (net banking and mobile app) will remain operational.\n\nUsually, in addition to the common national and gazetted holidays, or weekend offs, banks in India could have local holidays and festivals off, as required. The central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks, including the State Bank of India (SBI), HDFC Bank, ICICI Bank, Axis Bank, Punjab National Bank and other lenders in Belapur, Bengaluru, Bhubaneswar, Chennai, Hyderabad, Mumbai, Nagpur, Panaji and Vijayawada will remain closed on Monday, 14 September on account of Ganesh Chaturthi / Ganesh Puja and other regional observances.\n\nIn RBI's holiday calendar, certain days are marked as non-working days for banks under \u201cNegotiable Instruments Act\u201d and other under \u201cBanks\u2019 Closing of Accounts.\u201d\n\nIn September, private and public-sector banks were scheduled to be closed for 14 days, including weekend offs. Some of the upcoming bank closures for this month will be observed to celebrate Samvatsari, Unitarian Anniversary Day, Karma Puja , among other occasions. Here's the full list of all holidays in September 2026:\n\nDuring bank holidays, online banking services remain available across the country to ensure uninterrupted access to banking services.", "source": "LiveMint Money", "pub_date_str": "14 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a cor w on Telegram.", "source": "Economic Times Markets", "pub_date_str": "14 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SP Group weighs Rs 3,500 crore debt repayment options", "full_content": "Shapoorji Pallonji Group is exploring debt options for a \u20b93,500 crore repayment. The central bank's Tata Sons listing mandate offers investors a clear repayment path. This directive will build investor confidence in monetizing Tata group stakes. It also assures future redemption commitments for the conglomerate. The group seeks to manage its financial obligations effectively.", "source": "Economic Times Markets", "pub_date_str": "14 Sep 2026, 05:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tata Sons may be valued up to Rs 12.5 lakh cr in IPO", "full_content": "Tata Sons' potential IPO valuation is estimated between \u20b99-12.5 lakh crore., reflecting a discount on its underlying portfolio worth \u20b915-16 lakh crore. Investors will price listed stakes and unlisted businesses, applying a holding company discount. The Reserve Bank of India rejected Tata Sons' plea to remain private. This decision effectively mandates the conglomerate's public listing soon.", "source": "Economic Times Markets", "pub_date_str": "14 Sep 2026, 05:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures fall as investors weigh AI safety concerns, oil gains: Live updates", "full_content": "The three major averages are coming off a losing week.", "source": "CNBC Top News", "pub_date_str": "14 Sep 2026, 05:03 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Oil prices jump more than 2% after new strikes on Saudi, Strait of Hormuz - reuters.com", "full_content": "Oil prices jump more than 2% after new strikes on Saudi, Strait of Hormuz reuters.com Oil Prices Jump on Energy Supply Worries nytimes.com Oil's roundtrip back to $100. Why China could determine what happens next CNBC Stock market today: Dow, S&P 500, Nasdaq extend losses as bond yields jump, oil holds above $100 Yahoo Finance StanChart Warns Oil Is Now Built for Sharper, More Frequent Spikes oilprice.com", "source": "Google News Business", "pub_date_str": "14 Sep 2026, 03:53 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "14 Sep 2026, 07:04 AM IST", "total_stories": 330};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
