strategy and improving fundamentals emerging as key triggers.\n\nThe focus remains on loan and deposit growth, net interest margins, asset quality and the normalisation of the credit-deposit ratio following the HDFC merger. Can the leadership transition and a recovery in operating performance support a sustained rerating of HDFC Bank shares? Here is what analysts and technical experts expect.\n\nSunny Agrawal, Head of Fundamental Research at SBI Securities, said that with the uncertainty surrounding the bank's top-level management now addressed, the strategic roadmap of its new Managing Director and CEO will be a key monitorable.\n\nHe noted that HDFC Bank will also need to appoint a new Deputy Managing Director (DMD) and Head of Credit following Mr Bharucha's resignation. Alongside improving business metrics and realising merger-related synergies, the new leadership will have to manage senior-level attrition and build a strong management team.\n\nAgrawal expects credit growth to remain healthy in the coming quarter, supported by a sustained recovery in the retail segment, which could further aid margins.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 01:07 PM IST", "pub_date_relative": "22m ago"}, {"title": "Nintendo Switch 2 sales plunge 41% as price hikes and memory crunch bite", "full_content": "Sales of Nintendo 's flagship Switch 2 plunged in its fiscal second quarter after the Japanese gaming giant rolled out price hikes amid soaring memory costs.\n\nNintendo said it sold 2.67 million units of the Switch 2 in the three months ended Sept. 30, down 41% from the same period last year. That was also lower than the 3.82 million units sold in the prior quarter.\n\nDuring the quarter, Nintendo rolled out price increases for the Switch 2 in the U.S., Canada and Japan after hiking the cost of the device in Japan earlier in the year.\n\nMemory, a core component of Nintendo's consoles, continues to face a supply shortage and huge demand, which is driving an unprecedented price surge for the chips.\n\nStill, the Japanese gaming giant stuck to its previous Switch 2 sales forecast of 16.5 million units in the current fiscal year, which ends in March 2027.\n\nHere's how Nintendo did in its fiscal second quarter, compared with LSEG average estimates:\n\nWhile the Kyoto-headquartered firm has had some strong games this year, including \"Tomodachi Life: Living the Dream\" and \"Pok\u00e9mon Pokopia\", which became a surprise viral hit, there are no major marquee titles.\n\nInvestors hope that \"The Legend of Zelda: Ocarina of Time,\" a remake of one of Nintendo's most iconic games, could boost Switch 2 sales in the coming weeks. The game was released on Thursday.", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 01:00 PM IST", "pub_date_relative": "28m ago"}, {"title": "Worst Samvat in 15 years! Sensex, Nifty crash up to 8%: Can investors expect a bull run in Samvat 2083? What experts say", "full_content": "Samvat 2083 Outlook : Indian stock market investors are heading into Samvat 2083 after one of their most disappointing years in over a decade, with the Sensex and Nifty 50 poised to record their worst Samvat performance in 15 years. Persistent foreign investor selling, elevated crude oil prices, rising US bond yields and the prolonged geopolitical conflict in West Asia have battered domestic equities, dragging benchmark indices down nearly 8%.\n\nAccording to exchange data as of November 4, the Sensex had declined 7.9%, while the Nifty 50 had fallen 6.8% during Samvat 2082. The new Samvat will begin on November 8, coinciding with Diwali, with investors hoping for a turnaround after a prolonged period of volatility.\n\nHowever, the road to recovery may not be smooth. Analysts expect global macroeconomic pressures, geopolitical uncertainty, inflation, interest rates and slowing economic growth to remain key challenges. Yet, improving corporate earnings, moderating valuations and resilient domestic fundamentals have strengthened expectations of a potential market recovery over the next 12 months.\n\nExperts believe the correction has created opportunities for long-term investors to gradually accumulate fundamentally strong companies rather than attempt to time the market.\n\nDespite the disappointing performance in the previous Samvat, brokerages are not giving up on Indian equities. They see this correction as an important entry point for investors.\n\nICICI Direct expects the market to deliver healthy double-digit returns in Samvat 2083. ICICI Direct's optimism stems partly from the improving September-quarter earnings season.\n\nThe brokerage also believes the recent correction has also made valuations more attractive. The Nifty 50 's two-year forward price-to-earnings (P/E) multiple has dropped to 16.6 times, compared with its 10-year average of 18.2 times.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 01:00 PM IST", "pub_date_relative": "29m ago"}, {"title": "Piero Cipollone: Shaping the future of money", "full_content": "But to do this, it must be trusted. It must allow people and businesses to transact safely and efficiently. And it must evolve with geopolitical and technological developments.\n\nFor centuries, central banks have issued money and safeguarded its value. That mandate remains unchanged. But the environment in which money is used is being transformed.\n\nPeople are increasingly paying digitally. Tokenisation could reorganise the financial value chain. New solutions are being considered to enhance cross-border payments. And geopolitical fragmentation is making the resilience and governance of critical infrastructure ever more important.\n\nCentral banks must therefore ensure that the money they issue remains fit for the future.\n\nThis does not mean replacing the private sector or predicting which technology will prevail. It means providing a trusted public foundation for payments and finance on which private innovation can flourish. And it means preventing digitalisation from increasing fragmentation or creating new dependencies.\n\nThis is why the Eurosystem has adopted a comprehensive payments strategy. [ 1 ]\n\nThe strategy has four objectives: ensuring that central bank money can continue to settle retail and wholesale transactions as preferences and technologies evolve; strengthening Europe\u2019s resilience and strategic autonomy; fostering an integrated, competitive and innovative payments ecosystem; and supporting the international role of the euro.\n\nIn other words, we are seeking to comprehensively upgrade money and payments in Europe.", "source": "ECB Press", "pub_date_str": "05 Nov 2026, 01:00 PM IST", "pub_date_relative": "29m ago"}, {"title": "2011 Keenan-Reuben Murder Case: HC Reduces Life Sentence To 20 Years, Upholds Conviction For Lesser Charges Against Others", "full_content": "Bombay High Court upheld Jitendra Rana's murder conviction, reducing his life sentence to 20 years in 2011 Mumbai stabbing case.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:59 PM IST", "pub_date_relative": "30m ago"}, {"title": "Rajesh Power shares: Up 12% in one month! Will rally continue as order book expands 35% after \u20b91629 crore mega order?", "full_content": "Pranati Deva Published 5 Nov 2026, 12:57 PM IST Prefer Livemint on Google Rajesh Power Services shares have staged a strong recovery, rising over 12% in the past month and gaining more than 11% in just one week. The rally has gathered momentum following back-to-back mega order wins from Gujarat's power utilities, which has taken the company's aggregate order book to approximately \u20b9 5,400 crore, marking a 35% expansion.\n\nThe power sector stock gained another 3.5% on Thursday, November 5, touching an intraday high of \u20b9 852 per share. The latest order win has strengthened its project pipeline and improved revenue visibility, particularly as India steps up investments in power distribution infrastructure.\n\nHowever, the recent recovery comes after a prolonged period of weakness. Rajesh Power shares have declined 3% in the past three months, 11% in six months and 44% over the last year. The stock remains around 42% below its 52-week high of \u20b9 1,465, recorded in November 2025. It touched a 52-week low of \u20b9 705 in September 2026.\n\nRajesh Power's latest \u20b9 1,628.74 crore turnkey contract from DGVCL marks its second major order win from Gujarat's power utilities following an earlier \u20b9 471.92 crore order from Madhya Gujarat Vij Company Limited (MGVCL).\n\nThe fresh DGVCL contract involves converting existing 11/22kV high-tension (HT) and low-tension (LT) overhead electricity distribution networks into underground cable systems equipped with SCADA-compatible equipment across various locations in Gujarat under the SI Scheme. The project will be executed over 24 months.\n\nFollowing the latest order, the company's aggregate order book has increased to approximately \u20b9 5,400 crore from \u20b9 4,000 crore earlier, representing an expansion of around 35%.\n\nThe order wins come alongside improving business performance.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:57 PM IST", "pub_date_relative": "32m ago"}, {"title": "Oil tumbles below $100 on post-election peace hopes", "full_content": "US vice-president JD Vance blames Republicans\u2019 midterm defeat on anger over Iran war", "source": "FT Markets", "pub_date_str": "05 Nov 2026, 12:50 PM IST", "pub_date_relative": "39m ago"}, {"title": "BSE vs NSE vs MCX vs IEX shares: Which exchange stock to buy after Q2 results for good returns? Experts' views", "full_content": "null Vaamanaa Sethi Published 5 Nov 2026, 12:50 PM IST Prefer Livemint on Google BSE vs NSE vs MCX vs IEX shares : Shares of exchange companies are in focus after their September quarter results for the financial year 2026-27 (Q2 FY27), with investors assessing which exchange stock offers better earnings growth and return potential.\n\nAmong the key listed players, Multi Commodity Exchange of India (MCX), BSE, National Stock Exchange (NSE) and Indian Energy Exchange (IEX) reported varying performances during the quarter.\n\nAccording to market experts, MCX emerged as the strongest performer in terms of revenue and profit growth, BSE also delivered robust earnings, supported by growth across its derivatives and mutual fund platforms.\n\nNSE maintained strong operating margins and reported healthy profit growth, while IEX posted steady earnings expansion despite regulatory uncertainty surrounding market coupling.\n\nThe four exchange companies reported different growth trajectories in Q2 FY27, reflecting changes in trading activity, operating leverage, revenue diversification and regulatory developments.\n\nMCX delivered the strongest financial performance among the four exchanges during the September quarter.\n\nThe commodity exchange reported a 113.9% year-on-year (YoY) increase in revenue from operations to \u20b9 800 crore. EBITDA surged 145.9% to \u20b9 664 crore, while profit after tax (PAT) jumped 130.8% to \u20b9 455 crore.\n\nIts EBITDA margin stood at a robust 78%, highlighting the operating leverage in its business model.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:50 PM IST", "pub_date_relative": "39m ago"}, {"title": "US midterm election results: Impact of Trump's loss on bond yields in India, overseas markets; experts weigh in", "full_content": "The US midterm election results have impacted global bond markets, with Indian government bond yields declining sharply. The Democratic Party's victories in both chambers of Congress have dealt a major setback to US President Donald Trump and his Republican Party.\n\nAccording to Bloomberg at 9:04 am on 5 November, the benchmark Nifty 50 Index surged as much as 2%, taking its weekly gains close to 6% and putting it on course for its best weekly performance since 2021.\n\nBenchmark Indian bond yields dropped as much as 12 basis points to 7.07%, extending the weekly decline to about 35 basis points. The rupee strengthened as much as 0.3% to 94.3250 against the US dollar.\n\nHere is what experts say about the bond market outlook and what Indian investors should consider doing.\n\nAccording to the latest market data available on TradingView as of 11:50 am, the current 10-year government bond yields are as follows:\n\nNishchay Nath, Founder & CEO, BondScanner, said bond yields are falling as markets reassess two key risks: elevated oil prices and US government borrowing. Investors expect slower growth in US government borrowing following the US midterm election results, which has reduced the premium they demand on long-term Treasuries.\n\nAs a result, the 10-year Treasury yield has eased to around 4.9%, after crossing 5% last month. For India, the fall in oil prices matters most, as it eases inflation concerns and supports the rupee. The 10-year government security yield has fallen to around 7.1%, from close to 7.5% less than two weeks ago, he added.\n\nAnand K Rathi, Co-Founder of MIRA Money, said lower crude prices, improved currency sentiment and short-covering in government bonds also contributed to the decline. The movement in Japanese yields is part of the broader global bond rally, although domestic monetary policy and inflation expectations remain important drivers there as well.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 12:48 PM IST", "pub_date_relative": "41m ago"}, {"title": "'Dialling Wrong Number': CJI Tells Petitioner They Should Protest Instead of Coming to Court", "full_content": "The bench, comprising the CJI and Justices Joymalya Bagchi and V Mohana, did not accept that a grievance about long-running reservation raised a constitutional question.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:48 PM IST", "pub_date_relative": "41m ago"}, {"title": "Diwali dhamaka! Multibagger stock to consider 1:10 stock split, 4:5 bonus, 100% dividend; record date, other details", "full_content": "Sharmila Bhadoria Updated 5 Nov 2026, 01:01 PM IST Prefer Livemint on Google Shares of SC Agrotech Limited rallied nearly 5% to touch their 52-week high during Thursday\u2019s intraday trading session. The sharp uptick in the stock reflected investors\u2019 enthusiasm as the company dropped a crucial update, delivering triple delight ahead of Diwali .\n\nThe firm announced update for its upcoming board meeting, scheduled to consider bonus issues, stock split and potential dividend announcement.\n\nSC Agrotech share price was trading 4.98% higher during Thursday\u2019s intraday trading session. Its share price value has surged nearly 174% in one year.\n\nThe company\u2019s board of directors meeting is scheduled to be held on Friday, November 13. The meeting will be closely tracked by investors with strong interest in corporate actions, as it will consider dividend, stock split and bonus issue related developments for the company.\n\nIn addition to the three corporate actions, the board may also consider any \u201cincrease in authorised share capital, consequential amendments to the Memorandum and/or Articles of Association, and the convening of shareholders' approval processes.\u201d\n\nThe company\u2019s board may consider subdivision of equity shares of face value \u20b9 10 each into equity shares with a face value of Re 1 each, i.e. split in the ratio of 10:1.\n\nThe board may also review the feasibility of recommending or declaring a dividend of up to 100% of the applicable equity share face value. However, the corporate action approval will be subject to viability in terms of legally distributable profits, liquidity and other applicable requirements.\n\nSC Agrotech\u2019s board of directors may \u201cconsider an issue of fully paid-up bonus equity shares in a ratio of up to 4:5 (four bonus shares for every five existing equity shares), by capitalising eligible reserves, subject to statutory and shareholder approvals.\u201d", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:46 PM IST", "pub_date_relative": "43m ago"}, {"title": "NextDC shares soar nearly 51% after Goodman, Digital Realty stake purchases", "full_content": "Shares of Australian data center operator NextDC closed 50.84% higher Thursday after Goodman Group and U.S.-listed data center operator Digital Realty moved to acquire stakes of up to 9.9% in the company.\n\nIn a regulatory filing on the same day, NextDC said the two companies conducted an aftermarket bookbuild Wednesday, seeking shares at A$9.50 apiece.\n\nNextDC's board called the move \"opportunistic,\" noting that it came two weeks after the company disclosed a power supply delay at its M3 Melbourne data center and revised its fiscal 2027 guidance.\n\nShares of NextDC on 5 Nov. The company said it was not aware of the outcome of the share purchase. Goodman and Digital Realty told investors they had no current intention of making a takeover bid, but reserved the right to do so.\n\nNextDC's rally came against a backdrop of weakness in U.S. data center stocks overnight. Shares of CoreWeave fell about 9%, while Iren dropped roughly 11.2% on Wednesday.\n\nThe sell-off followed sweeping Democratic victories in the U.S. midterm elections , which raised expectations of tighter scrutiny and potential restrictions on data center development that could slow the AI infrastructure buildout.", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 12:45 PM IST", "pub_date_relative": "44m ago"}, {"title": "Most investors are blind to the possibility of a market crash. Here is the five-part strategy to survive one.", "full_content": "Wall Street veteran Jared Dillian says the biggest problem is many investors these days have not lived through a major downturn. He\u2019s got a portfolio that offers protection.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 12:45 PM IST", "pub_date_relative": "44m ago"}, {"title": "Up 40% in YTD! \u20b9100 Small-cap stock hits 5% upper circuit for the fourth straight session; do you own?", "full_content": "Shares of small-cap company Mold-Tek Technologies surged 5% to hit the upper circuit on Thursday, 5 November, extending their winning streak to the fourth consecutive session following the company's strong Q2 FY27 results.\n\nOn Wednesday, 4 November, Mold-Tek Technologies reported its highest-ever quarterly consolidated revenue in Q2 FY27, with revenue rising 51.2% year-on-year to \u20b9 60.81 crore.\n\nThe company's consolidated net profit (PAT) jumped 197.32% to \u20b9 9.62 crore, marking its highest-ever quarterly profit. Notably, the profit recorded in the September quarter was almost equivalent to the company's entire full-year profit for FY26, highlighting a sharp improvement in its financial performance.\n\nConsolidated EBITDA also touched a record high of \u20b9 14.58 crore during the quarter, registering a growth of 144.5% from \u20b9 5.96 crore in the corresponding quarter of the previous year.\n\nThe company's earnings per share (EPS), adjusted for the 1:1 bonus issue, increased to \u20b9 1.67 in Q2 FY27 from \u20b9 0.56 in the year-ago quarter, reflecting a growth of 197.32%.\n\nMold-Tek Technologies attributed its strong performance to the continued execution of its business strategy, which focuses on diversification, operational efficiency and expansion into higher-value engineering services. Strong project execution, improved resource utilisation and healthy business momentum contributed to growth across its business segments.\n\nThe company said its order pipeline remains encouraging across Civil and Structural Engineering as well as Mechanical Engineering. With its focus on higher-value engineering services, a strong balance sheet and operational excellence, Mold-Tek Technologies believes it is well-positioned to sustain profitable growth and create long-term shareholder value.\n\nJ.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:41 PM IST", "pub_date_relative": "48m ago"}, {"title": "Ladaku: Kartik Aaryan And Kabir Khan Reunite For Another Inspiring Real-Life Story, Film To Release Next Year", "full_content": "Ladaku also marks Kartik Aaryan's debut as a producer under his banner, Dopamine Studios.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:32 PM IST", "pub_date_relative": "56m ago"}, {"title": "Sitaram Denims India files IPO papers with Sebi", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Sitaram Denims India files IPO papers with Sebi The Economic Times daily newspaper is available online now. Read Today's Paper Sitaram Denims India files IPO papers with Sebi SECTIONS Sitaram Denims India files IPO papers with Sebi PTI Last Updated: Nov 05, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sitaram Denims India Ltd plans to launch an initial public offering with two components. The IPO includes a fresh issue of equity shares and an offer for sale by promoters. Proceeds from the fresh issue will be used for various purposes including repayment of borrowings and working capital requirements. The company aims to set up a new garment manufacturing facility in Bhilwara to expand capacity.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 12:32 PM IST", "pub_date_relative": "57m ago"}, {"title": "Price Hike Shock Before Diwali! Rates Of Paneer Hiked In Karnataka After Milk And Ghee", "full_content": "Consumers in Karnataka are now facing higher prices across several commonly used dairy products just days before the festive season begins.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asian Stocks to Rise as Oil Slides After US Vote: Markets Wrap - Bloomberg.com", "full_content": "Asian Stocks to Rise as Oil Slides After US Vote: Markets Wrap Bloomberg.com Asian shares mostly advance following US midterms, though Kospi falls on selling of chipmakers AP News Asia Markets Get Midterm Whiplash as Selloff Gives Way to Relief Rally WSJ Democratic sweep a bigger win for Asia than markets realize Asia Times investingLive Asia-Pacific market news: RBA hikes to 18-year high investingLive", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 12:25 PM IST", "pub_date_relative": "1h ago"}, {"title": "What the Democratic midterms sweep changes for U.S.-China relations", "full_content": "BEIJING \u2014 Democrats taking power from Republicans in Congress raises risks for U.S.-China tensions around Taiwan, while hardening tech competition, analysts said.\n\nThe Democrats swept this week's midterm elections , taking majorities in the House and Senate and flipping governors' offices in places like Texas, Nevada and Iowa. Most of the new election winners, however, won't begin their terms until January.\n\nBefore then, U.S. President Donald Trump and Chinese President Xi Jinping will likely maintain their fragile truce by meeting twice: in Shenzhen this month, and in Miami, Florida, next month.\n\n\"As a lame duck who is increasingly focused on his personal legacy rather than the Republican Party's success, Trump may resist increased pressure for confrontation with China and continue his pursuit of 'strategic stability,'\" Gabriel Wildau, managing director at Teneo, said in an email.\n\nHigh on the Democrats' agenda is removing Trump's tariffs , as part of a broader focus on addressing domestic inflation, CNBC has learned.\n\n\"On balance as a result of the midterms the Democrats may nudge the U.S.'s China policy in a more hawkish direction through hearings and legislation, particularly on economic security issues and Taiwan,\" said Scott Kennedy, senior advisor and trustee chair in Chinese business and economics at the Center for Strategic and International Studies.\n\nBut any efforts will \"be constrained by the executive branch's wide range of latitude and China's growing power and leverage, which can't be easily undone,\" he said.\n\nBeijing has hosted a flurry of global leaders this year, while major economies have struggled to slow a surge of imports from China . Chinese dominance in rare earths has given Beijing leverage in trade talks with the U.S. and the EU.", "source": "CNBC Finance", "pub_date_str": "05 Nov 2026, 12:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi: Two Dead, Many Feared Trapped As Three Storey Building Collapses In Chawri Bazaar", "full_content": "A fire broke out early Thursday in Mangal Bazar, Laxmi Nagar, Delhi. Firefighters controlled the blaze with no injuries reported.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold Prices On Recovery Mode: Yellow Metal Rates Jump By Rs 6,600 In Two Days To Rs 1,46,100", "full_content": "A softer interest rate outlook tends to support gold, as the precious metal does not offer interest income. A weaker dollar also makes gold more attractive to buyers holding other currencies.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mumbai's New Luxury Addresses: Why Thane, Borivali And Chembur Are Becoming Homebuyer Hotspots", "full_content": "The suburbs are gaining ground, however. In the April-June quarter, redevelopment corridors such as Goregaon East and Borivali East entered the top micro-markets by value for homes priced at Rs 5 crore and above.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bought Something On Buy Now, Pay Later? It Could Become A Loan On Your Credit Report", "full_content": "A Buy Now, Pay Later transaction can carry the same reporting implications as other forms of borrowing.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Your Debit Card May Have Rs 2 Lakh Insurance. Does Your Family Know About It?", "full_content": "Customers usually get an accidental death, permanent total disability cover among others, depending on the card variants.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Redington Gets Motilal Oswal's 'Buy' Initiation, Sees Up To 36% Upside; Check Target Price", "full_content": "Redington is well positioned to capitalise on structural growth in technology distribution, supported by established original equipment manufacturer relationships, an extensive channel network and a diversified geographic presence, believes Motilal Oswal.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "Silver To Hit Rs 2,00,000 Again Soon? Prices Jump Rs 11,200 In Two Days", "full_content": "Silver prices have surged by Rs 11,248, or 6.25% in two trading sessions. Analysts believe the white metal could reclaim the Rs 2 lakh mark in the near term.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Markets surf the blue wave", "full_content": "Clarity is good", "source": "FT Markets", "pub_date_str": "05 Nov 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dhanteras 2026: Bought gold last year? See how much your 10-gram investment is worth today despite recent dips", "full_content": "Gold remains one of the most popular investments and purchases during Dhanteras. Also known as Dhanatrayodashi, the festival marks the first day of the five-day Diwali celebrations and is observed on the 13th lunar day of the dark fortnight in the Hindu month of Kartik.\n\nTraditionally, households buy jewellery, coins and other precious metals on auspicious occasions. Those who purchased gold around Dhanteras last year still stand to gain despite a recent correction from record highs.\n\nAlthough gold prices have retreated from their peak, they remain well above their levels a year ago, delivering healthy returns for investors who bought the yellow metal during last year's festive season.\n\nHere's a look at how much gold investment made during Dhanteras 2025 is worth today and what current demand trends suggest for the precious metal.\n\nAs of 5 November, 24-carat gold is trading at around \u20b9 1,45,650 per 10 grams in New Delhi, whereas 22-carat gold is priced at around \u20b9 1,34,163 per 10 grams. These prices exclude GST and additional jewellery-making charges.\n\nDuring Dhanteras in October 2025, 24-carat gold was trading at approximately \u20b9 1,32,278 per 10 grams, with prices varying slightly by city. This signifies a rise of about 9-10% in 24K gold prices today since last year.\n\nThe price of gold was trading at \u20b9 1,23,085 per 10 grams a year ago today. This shows that 10 grams of 24K gold has appreciated by about 14.85% to 15% in Delhi over the last year.\n\nGold had touched approximately \u20b9 1.83 lakh per 10 grams in late January 2026 before correcting nearly 18 to 20% from that peak.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 11:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Olympian MM Somaya's House Burgled in Bengaluru, Rare International Hockey Medals Among Items Stolen", "full_content": "The burglary occurred at the 67-year-old Olympian's house within Indiranagar police station limits while he was away with his family in Kodagu.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 11:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "Dhanteras, Diwali 2026: Titan, Shanti Gold, Senco among top jewellery stocks to buy for long-term | Check list", "full_content": "Jewellery stocks are in focus on Thursday, 5 November, amid renewed buying interest ahead of Dhanteras, as a sharp recovery in gold prices lifts sentiment towards the sector. Gold prices have rebounded after correcting nearly 12% over the past six months, offering some relief to investors and raising expectations of a recovery in jewellery demand during the festive and upcoming wedding seasons.\n\nAccording to a Reuters report, spot gold climbed 1.9% to $4,134.83 per ounce by 0316 GMT on Thursday, hitting its highest level since 22 October. US gold futures for December delivery advanced 1.8% to $4,144.20 per ounce. The latest recovery followed a 3.4% surge in spot gold in the previous session, its biggest single-day gain since 19 August.\n\nAccording to experts, the rebound was driven by a weaker US dollar and declining US Treasury yields following the Democratic Party's strong performance in the US midterm elections. A softer dollar makes gold more affordable for overseas buyers, while lower bond yields improve the appeal of the non-interest-bearing metal.\n\nThe recovery in bullion prices comes ahead of Dhanteras, when gold purchases traditionally gather momentum. The World Gold Council (WGC), in its latest quarterly outlook, said the festive and wedding seasons are expected to support gold demand, while continued central bank purchases could provide further support to prices over the next 12 months.\n\nAgainst this backdrop, jewellery stocks such as Titan, Kalyan Jewellers, Sky Gold, P N Gadgil Jewellers , Senco Gold, Shanti Gold, Shringar House of Mangalsutra , Tribhovandas Bhimji Zaveri, Khazanchi Jewellers and Lalithaa Jewellery Mart are trading higher in Thursday's session.\n\nWith jewellery demand expected to improve during the festive and wedding seasons, market experts are selectively bullish on organised jewellers and jewellery manufacturers.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Why gamble on Blue Lagoon\u2019s IPO when a travel leader trades near a 52-week low?", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:25 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold rate today Sangli Nov 5: Check latest prices ahead of Dhanteras 2026 - Trump loss, US election results impact", "full_content": "Gold prices in Sangli saw an uptick today, (Thursday, November 5) after the yellow metal rose in international bullion markets amid the drubbing received by President Donald Trump and his Republican party in US midterm election results. The precious metal advanced as a weaker US dollar and falling US Treasury yields boosted its appeal following major Democratic gains in the elections, Reuters reported.\n\nIn Sangli, the 24-karat gold rate stood at \u20b9 1,45,270 per 10 grams on Thursday, up \u20b9 1,760, or 1.23%, from the Wednesday's \u20b9 1,43,510, according to Bullions.co.in . Silver prices also rose in Sangli, with 999 fine silver quoted at \u20b9 1,89,040 per kg, up \u20b9 1,170, or 0.62%.\n\nGold is available in different purities in the retail market in the city including 24-karat gold, often considered the purest form. Other purities like 22-karat gold, commonly used to make jewellery because of its greater durability, and lower-purity options, including 20-karat and 18-karat gold, are also available.\n\nAccording to Bullions.co.in , the latest gold rates in Sangli on 5 November are:\n\nThe rates were last updated at 12.20 pm (Indian Standard Time) on Thursday.\n\nSilver prices also rose on Thursday. According to Bullions.co.in , the latest rates in Sangli are:\n\nThe Democrats snatched the control of both House of Representatives and Senate in the US Congress after flipping several Republican held seats. The election outcome also raised hopes of reduced tensions in the Middle East and a possible de-escalation of the US war on Iran.\n\nAccording to Reuters , the yellow metal climbed to its highest level in over two weeks today, on a weaker US dollar and Treasury yields as easing oil prices helped temper inflation concerns.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 01:23 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ASOS forecasts FY27 core profit above analysts\u2019 average; cyberattack weighs", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:22 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Diwali Stock Picks 2026: Titan, BSE Kotak Mahindra Bank Among Motilal Oswal's Top 10 Bets For Samvat 2083", "full_content": "PL Capital expects Indian equities to see a recovery in earnings growth in FY27, with Nifty 50 earnings per share (EPS) forecasted to grow 16% in FY27 and 14% in FY28, compared with 5% in FY26.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 01:22 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why is OnEMI Tech stock rising today? Kissht parent firm's shares jump 7% after AUM milestone, \u20b9832 cr fundraise", "full_content": "OnEMI Tech stock rally: Shares of Kissht parent company, OnEMI Technology Solutions Limited, rallied nearly 7.40% during Thursday\u2019s intraday trading session. The massive surge in the fintech stock has come after the company announced that it has crossed \u20b9 10,000 crore asset under management (AUM) milestone.\n\nOnEMI Technology Solutions AUM milestone has come days after the company secured \u20b9 832 crore fundraise.\n\nOneEMI Technology Solutions Limited\u2019s assets under management have crossed the \u20b9 10,000 crore milestone, announced the technology-first digital lender in its press release on Wednesday after the stock market trading hours.\n\nKissht has built the scale as a full-stack digital lending platform, that would help the firm in leveraging technology, data and artificial intelligence across the lending lifecycle. The company is on track to expand its credit offerings and access to credit across India, with support of its proprietary AI-led underwriting models, technology-enabled collections infrastructure and expanding network.\n\n\u201cCrossing \u20b9 10,000 crore in AUM is a proud moment for everyone at Kissht, and a significant milestone in our journey. This growth is built on the same principles we started with: disciplined underwriting, robust collections and a scalable, technology-led platform,\u201d stated Ranvir Singh, Chairman, Director & CEO, Kissht.\n\nOnEMI Technology Solutions\u2019 board of directors raised \u20b9 832 crore via issuing equity shares by way of a preferential issue on a private placement basis. As per the BSE filing, the company had \u201capproved the allotment of 2,64,93,882 equity shares of face value of INR 1/- each, fully paid (\u201cEquity Shares\u201d), on a preferential allotment on a private placement basis.\u201d\n\nThe stock was trading 7.34% higher at \u20b9 338.60 per share on BSE with a market capitalisation of \u20b9 6,030.94 crore at 1:17 pm on Thursday. The stock had touched its 52-week high level of \u20b9 388.25 apiece on October 5, 2026.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 01:21 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "M&M Q2 Results: Profit Rises 13%, Tops Estimates; Margin Contracts Amid Higher Commodity Costs", "full_content": "M&M's automotive business drove revenue growth with a 36% increase, while farm equipment revenue rose just 1%. Higher commodity costs dragged Ebitda margin down 280 basis points to 11.6%.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 01:19 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Orsted beats Q3 earnings forecasts on higher wind speeds", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:18 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China ties more US farm imports to reciprocal tariff cuts", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:18 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Live: Sensex Zooms 1,750 Points, Nifty Atop 24,450; Mahindra & Mahindra Q2 Profit Rises 13%; Bajaj Finance Zooms 7%", "full_content": "Stock Market Live Updates, Nov 5: Among individual stocks on BSE, IndiGo topped with 6% gains, followed by Bajaj Finance and Maruti Suzuki. On the flipside, Bharti Airtel, NTPC and Power Grid were among the top drags.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 01:16 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Air France-KLM beats Q3 profit estimates but raises fuel cost forecast", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:16 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hikma Pharmaceuticals narrows profit guidance, upgrades branded unit", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:14 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures mixed after big rally following Democrats' decisive midterm wins", "full_content": "U.S. equity futures traded mixed early Thursday following a rally on the heels of a sharp decline in the price of oil and certainty around the Democrats' midterm wins .\n\nS&P 500 futures were down 0.2%, and Nasdaq-100 futures declined 1.1%. Futures tied to the Dow Jones Industrial Average rose 213 points, or 0.4%.\n\nAfter the bell on Wednesday, chipmaker Qualcomm reported earnings that beat estimates, but fell 6.5%. AppLovin , the artificial intelligence-powered advertising company, surged almost 24% after delivering better-than-expected results and issuing guidance that beat estimates.\n\nStocks on Wednesday rallied as oil prices dipped, with West Texas Intermediate crude futures falling more than 8% to settle at $88.12 a barrel. The Dow gained more than 1,500 points, or 3%, to post its best day since April 2025, while the S&P 500 advanced 1.6%.\n\nThose moves came after Vice President JD Vance blamed the Iran war for Republican losses in the midterms on Tuesday.\n\nIn Asia, Japan's Nikkei 225 gained 0.49% on Thursday, while the Topix rose over 2%. South Korea's Kospi was down 2.33%, and the tech-focused, small-cap Kosdaq fell 1.24%. Australia's S&P/ASX 200 was up 1.39%.\n\nTrading on Wednesday stateside showed investors adjusting to midterm results, which showed Democrats flipping control of the House of Representatives and Senate \u2014 securing comfortable majorities in both chambers \u2014 and a slew of governorships, too.\n\nConsumer discretionary names such as Walmart helped lead the way higher on Wednesday, with the retail giant up more than 3% in the regular session. At the same time, names linked to the data center build-out , like CoreWeave , fell on worries about a backlash to the industry in light of election results in various states. In Texas, for instance, Democrat Gina Hinojosa won the election for governor after calling for tougher restrictions on data center development.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:13 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Live Updates: Mahindra & Mahindra Profit Rises 13%, Bharat Forge Profit Slips", "full_content": "From Bharti Airtel to Abbott India, 30+ companies will report Q2 earnings today; Track live updates.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 01:07 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HDFC Bank shares witness strong buying, rise 7% in 1 month. Can new CEO, improving fundamentals drive next leg of rally?", "full_content": "Dhanya Nagasundaram Published 5 Nov 2026, 01:07 PM IST Prefer Livemint on Google HDFC Bank shares have gained 10.21% over the past week and 7.09% over the past month, signalling a pickup in buying interest. The stock has risen 8.89% over the past two weeks, but remains down 23.80% year-to-date and 23.36% over the past year, indicating that the recent recovery has yet to reverse its broader underperformance.\n\nInvestors are now assessing whether the rally can sustain, with the new CEO\u2019s strategy and improving fundamentals emerging as key triggers.\n\nThe focus remains on loan and deposit growth, net interest margins, asset quality and the normalisation of the credit-deposit ratio following the HDFC merger. Can the leadership transition and a recovery in operating performance support a sustained rerating of HDFC Bank shares? Here is what analysts and technical experts expect.\n\nSunny Agrawal, Head of Fundamental Research at SBI Securities, said that with the uncertainty surrounding the bank's top-level management now addressed, the strategic roadmap of its new Managing Director and CEO will be a key monitorable.\n\nHe noted that HDFC Bank will also need to appoint a new Deputy Managing Director (DMD) and Head of Credit following Mr Bharucha's resignation. Alongside improving business metrics and realising merger-related synergies, the new leadership will have to manage senior-level attrition and build a strong management team.\n\nAgrawal expects credit growth to remain healthy in the coming quarter, supported by a sustained recovery in the retail segment, which could further aid margins.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 01:07 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Worst Samvat in 15 years! Sensex, Nifty crash up to 8%: Can investors expect a bull run in Samvat 2083? What experts say", "full_content": "Samvat 2083 Outlook : Indian stock market investors are heading into Samvat 2083 after one of their most disappointing years in over a decade, with the Sensex and Nifty 50 poised to record their worst Samvat performance in 15 years. Persistent foreign investor selling, elevated crude oil prices, rising US bond yields and the prolonged geopolitical conflict in West Asia have battered domestic equities, dragging benchmark indices down nearly 8%.\n\nAccording to exchange data as of November 4, the Sensex had declined 7.9%, while the Nifty 50 had fallen 6.8% during Samvat 2082. The new Samvat will begin on November 8, coinciding with Diwali, with investors hoping for a turnaround after a prolonged period of volatility.\n\nHowever, the road to recovery may not be smooth. Analysts expect global macroeconomic pressures, geopolitical uncertainty, inflation, interest rates and slowing economic growth to remain key challenges. Yet, improving corporate earnings, moderating valuations and resilient domestic fundamentals have strengthened expectations of a potential market recovery over the next 12 months.\n\nExperts believe the correction has created opportunities for long-term investors to gradually accumulate fundamentally strong companies rather than attempt to time the market.\n\nDespite the disappointing performance in the previous Samvat, brokerages are not giving up on Indian equities. They see this correction as an important entry point for investors.\n\nICICI Direct expects the market to deliver healthy double-digit returns in Samvat 2083. ICICI Direct's optimism stems partly from the improving September-quarter earnings season.\n\nThe brokerage also believes the recent correction has also made valuations more attractive. The Nifty 50 's two-year forward price-to-earnings (P/E) multiple has dropped to 16.6 times, compared with its 10-year average of 18.2 times.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 01:00 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Piero Cipollone: Shaping the future of money", "full_content": "But to do this, it must be trusted. It must allow people and businesses to transact safely and efficiently. And it must evolve with geopolitical and technological developments.\n\nFor centuries, central banks have issued money and safeguarded its value. That mandate remains unchanged. But the environment in which money is used is being transformed.\n\nPeople are increasingly paying digitally. Tokenisation could reorganise the financial value chain. New solutions are being considered to enhance cross-border payments. And geopolitical fragmentation is making the resilience and governance of critical infrastructure ever more important.\n\nCentral banks must therefore ensure that the money they issue remains fit for the future.\n\nThis does not mean replacing the private sector or predicting which technology will prevail. It means providing a trusted public foundation for payments and finance on which private innovation can flourish. And it means preventing digitalisation from increasing fragmentation or creating new dependencies.\n\nThis is why the Eurosystem has adopted a comprehensive payments strategy. [ 1 ]\n\nThe strategy has four objectives: ensuring that central bank money can continue to settle retail and wholesale transactions as preferences and technologies evolve; strengthening Europe\u2019s resilience and strategic autonomy; fostering an integrated, competitive and innovative payments ecosystem; and supporting the international role of the euro.\n\nIn other words, we are seeking to comprehensively upgrade money and payments in Europe.", "source": "ECB Press", "pub_date_str": "05 Nov 2026, 01:00 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rajesh Power shares: Up 12% in one month! Will rally continue as order book expands 35% after \u20b91629 crore mega order?", "full_content": "Pranati Deva Published 5 Nov 2026, 12:57 PM IST Prefer Livemint on Google Rajesh Power Services shares have staged a strong recovery, rising over 12% in the past month and gaining more than 11% in just one week. The rally has gathered momentum following back-to-back mega order wins from Gujarat's power utilities, which has taken the company's aggregate order book to approximately \u20b9 5,400 crore, marking a 35% expansion.\n\nThe power sector stock gained another 3.5% on Thursday, November 5, touching an intraday high of \u20b9 852 per share. The latest order win has strengthened its project pipeline and improved revenue visibility, particularly as India steps up investments in power distribution infrastructure.\n\nHowever, the recent recovery comes after a prolonged period of weakness. Rajesh Power shares have declined 3% in the past three months, 11% in six months and 44% over the last year. The stock remains around 42% below its 52-week high of \u20b9 1,465, recorded in November 2025. It touched a 52-week low of \u20b9 705 in September 2026.\n\nRajesh Power's latest \u20b9 1,628.74 crore turnkey contract from DGVCL marks its second major order win from Gujarat's power utilities following an earlier \u20b9 471.92 crore order from Madhya Gujarat Vij Company Limited (MGVCL).\n\nThe fresh DGVCL contract involves converting existing 11/22kV high-tension (HT) and low-tension (LT) overhead electricity distribution networks into underground cable systems equipped with SCADA-compatible equipment across various locations in Gujarat under the SI Scheme. The project will be executed over 24 months.\n\nFollowing the latest order, the company's aggregate order book has increased to approximately \u20b9 5,400 crore from \u20b9 4,000 crore earlier, representing an expansion of around 35%.\n\nThe order wins come alongside improving business performance.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:57 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BSE vs NSE vs MCX vs IEX shares: Which exchange stock to buy after Q2 results for good returns? Experts' views", "full_content": "null Vaamanaa Sethi Published 5 Nov 2026, 12:50 PM IST Prefer Livemint on Google BSE vs NSE vs MCX vs IEX shares : Shares of exchange companies are in focus after their September quarter results for the financial year 2026-27 (Q2 FY27), with investors assessing which exchange stock offers better earnings growth and return potential.\n\nAmong the key listed players, Multi Commodity Exchange of India (MCX), BSE, National Stock Exchange (NSE) and Indian Energy Exchange (IEX) reported varying performances during the quarter.\n\nAccording to market experts, MCX emerged as the strongest performer in terms of revenue and profit growth, BSE also delivered robust earnings, supported by growth across its derivatives and mutual fund platforms.\n\nNSE maintained strong operating margins and reported healthy profit growth, while IEX posted steady earnings expansion despite regulatory uncertainty surrounding market coupling.\n\nThe four exchange companies reported different growth trajectories in Q2 FY27, reflecting changes in trading activity, operating leverage, revenue diversification and regulatory developments.\n\nMCX delivered the strongest financial performance among the four exchanges during the September quarter.\n\nThe commodity exchange reported a 113.9% year-on-year (YoY) increase in revenue from operations to \u20b9 800 crore. EBITDA surged 145.9% to \u20b9 664 crore, while profit after tax (PAT) jumped 130.8% to \u20b9 455 crore.\n\nIts EBITDA margin stood at a robust 78%, highlighting the operating leverage in its business model.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:50 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US midterm election results: Impact of Trump's loss on bond yields in India, overseas markets; experts weigh in", "full_content": "The US midterm election results have impacted global bond markets, with Indian government bond yields declining sharply. The Democratic Party's victories in both chambers of Congress have dealt a major setback to US President Donald Trump and his Republican Party.\n\nAccording to Bloomberg at 9:04 am on 5 November, the benchmark Nifty 50 Index surged as much as 2%, taking its weekly gains close to 6% and putting it on course for its best weekly performance since 2021.\n\nBenchmark Indian bond yields dropped as much as 12 basis points to 7.07%, extending the weekly decline to about 35 basis points. The rupee strengthened as much as 0.3% to 94.3250 against the US dollar.\n\nHere is what experts say about the bond market outlook and what Indian investors should consider doing.\n\nAccording to the latest market data available on TradingView as of 11:50 am, the current 10-year government bond yields are as follows:\n\nNishchay Nath, Founder & CEO, BondScanner, said bond yields are falling as markets reassess two key risks: elevated oil prices and US government borrowing. Investors expect slower growth in US government borrowing following the US midterm election results, which has reduced the premium they demand on long-term Treasuries.\n\nAs a result, the 10-year Treasury yield has eased to around 4.9%, after crossing 5% last month. For India, the fall in oil prices matters most, as it eases inflation concerns and supports the rupee. The 10-year government security yield has fallen to around 7.1%, from close to 7.5% less than two weeks ago, he added.\n\nAnand K Rathi, Co-Founder of MIRA Money, said lower crude prices, improved currency sentiment and short-covering in government bonds also contributed to the decline. The movement in Japanese yields is part of the broader global bond rally, although domestic monetary policy and inflation expectations remain important drivers there as well.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 12:48 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Diwali dhamaka! Multibagger stock to consider 1:10 stock split, 4:5 bonus, 100% dividend; record date, other details", "full_content": "Sharmila Bhadoria Updated 5 Nov 2026, 01:01 PM IST Prefer Livemint on Google Shares of SC Agrotech Limited rallied nearly 5% to touch their 52-week high during Thursday\u2019s intraday trading session. The sharp uptick in the stock reflected investors\u2019 enthusiasm as the company dropped a crucial update, delivering triple delight ahead of Diwali .\n\nThe firm announced update for its upcoming board meeting, scheduled to consider bonus issues, stock split and potential dividend announcement.\n\nSC Agrotech share price was trading 4.98% higher during Thursday\u2019s intraday trading session. Its share price value has surged nearly 174% in one year.\n\nThe company\u2019s board of directors meeting is scheduled to be held on Friday, November 13. The meeting will be closely tracked by investors with strong interest in corporate actions, as it will consider dividend, stock split and bonus issue related developments for the company.\n\nIn addition to the three corporate actions, the board may also consider any \u201cincrease in authorised share capital, consequential amendments to the Memorandum and/or Articles of Association, and the convening of shareholders' approval processes.\u201d\n\nThe company\u2019s board may consider subdivision of equity shares of face value \u20b9 10 each into equity shares with a face value of Re 1 each, i.e. split in the ratio of 10:1.\n\nThe board may also review the feasibility of recommending or declaring a dividend of up to 100% of the applicable equity share face value. However, the corporate action approval will be subject to viability in terms of legally distributable profits, liquidity and other applicable requirements.\n\nSC Agrotech\u2019s board of directors may \u201cconsider an issue of fully paid-up bonus equity shares in a ratio of up to 4:5 (four bonus shares for every five existing equity shares), by capitalising eligible reserves, subject to statutory and shareholder approvals.\u201d", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:46 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NextDC shares soar nearly 51% after Goodman, Digital Realty stake purchases", "full_content": "Shares of Australian data center operator NextDC closed 50.84% higher Thursday after Goodman Group and U.S.-listed data center operator Digital Realty moved to acquire stakes of up to 9.9% in the company.\n\nIn a regulatory filing on the same day, NextDC said the two companies conducted an aftermarket bookbuild Wednesday, seeking shares at A$9.50 apiece.\n\nNextDC's board called the move \"opportunistic,\" noting that it came two weeks after the company disclosed a power supply delay at its M3 Melbourne data center and revised its fiscal 2027 guidance.\n\nShares of NextDC on 5 Nov. The company said it was not aware of the outcome of the share purchase. Goodman and Digital Realty told investors they had no current intention of making a takeover bid, but reserved the right to do so.\n\nNextDC's rally came against a backdrop of weakness in U.S. data center stocks overnight. Shares of CoreWeave fell about 9%, while Iren dropped roughly 11.2% on Wednesday.\n\nThe sell-off followed sweeping Democratic victories in the U.S. midterm elections , which raised expectations of tighter scrutiny and potential restrictions on data center development that could slow the AI infrastructure buildout.", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 12:45 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Most investors are blind to the possibility of a market crash. Here is the five-part strategy to survive one.", "full_content": "Wall Street veteran Jared Dillian says the biggest problem is many investors these days have not lived through a major downturn. He\u2019s got a portfolio that offers protection.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 12:45 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Up 40% in YTD! \u20b9100 Small-cap stock hits 5% upper circuit for the fourth straight session; do you own?", "full_content": "Shares of small-cap company Mold-Tek Technologies surged 5% to hit the upper circuit on Thursday, 5 November, extending their winning streak to the fourth consecutive session following the company's strong Q2 FY27 results.\n\nOn Wednesday, 4 November, Mold-Tek Technologies reported its highest-ever quarterly consolidated revenue in Q2 FY27, with revenue rising 51.2% year-on-year to \u20b9 60.81 crore.\n\nThe company's consolidated net profit (PAT) jumped 197.32% to \u20b9 9.62 crore, marking its highest-ever quarterly profit. Notably, the profit recorded in the September quarter was almost equivalent to the company's entire full-year profit for FY26, highlighting a sharp improvement in its financial performance.\n\nConsolidated EBITDA also touched a record high of \u20b9 14.58 crore during the quarter, registering a growth of 144.5% from \u20b9 5.96 crore in the corresponding quarter of the previous year.\n\nThe company's earnings per share (EPS), adjusted for the 1:1 bonus issue, increased to \u20b9 1.67 in Q2 FY27 from \u20b9 0.56 in the year-ago quarter, reflecting a growth of 197.32%.\n\nMold-Tek Technologies attributed its strong performance to the continued execution of its business strategy, which focuses on diversification, operational efficiency and expansion into higher-value engineering services. Strong project execution, improved resource utilisation and healthy business momentum contributed to growth across its business segments.\n\nThe company said its order pipeline remains encouraging across Civil and Structural Engineering as well as Mechanical Engineering. With its focus on higher-value engineering services, a strong balance sheet and operational excellence, Mold-Tek Technologies believes it is well-positioned to sustain profitable growth and create long-term shareholder value.\n\nJ.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:41 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sitaram Denims India files IPO papers with Sebi", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Sitaram Denims India files IPO papers with Sebi The Economic Times daily newspaper is available online now. Read Today's Paper Sitaram Denims India files IPO papers with Sebi SECTIONS Sitaram Denims India files IPO papers with Sebi PTI Last Updated: Nov 05, 2026, 12:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sitaram Denims India Ltd plans to launch an initial public offering with two components. The IPO includes a fresh issue of equity shares and an offer for sale by promoters. Proceeds from the fresh issue will be used for various purposes including repayment of borrowings and working capital requirements. The company aims to set up a new garment manufacturing facility in Bhilwara to expand capacity.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 12:32 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What the Democratic midterms sweep changes for U.S.-China relations", "full_content": "BEIJING \u2014 Democrats taking power from Republicans in Congress raises risks for U.S.-China tensions around Taiwan, while hardening tech competition, analysts said.\n\nThe Democrats swept this week's midterm elections , taking majorities in the House and Senate and flipping governors' offices in places like Texas, Nevada and Iowa. Most of the new election winners, however, won't begin their terms until January.\n\nBefore then, U.S. President Donald Trump and Chinese President Xi Jinping will likely maintain their fragile truce by meeting twice: in Shenzhen this month, and in Miami, Florida, next month.\n\n\"As a lame duck who is increasingly focused on his personal legacy rather than the Republican Party's success, Trump may resist increased pressure for confrontation with China and continue his pursuit of 'strategic stability,'\" Gabriel Wildau, managing director at Teneo, said in an email.\n\nHigh on the Democrats' agenda is removing Trump's tariffs , as part of a broader focus on addressing domestic inflation, CNBC has learned.\n\n\"On balance as a result of the midterms the Democrats may nudge the U.S.'s China policy in a more hawkish direction through hearings and legislation, particularly on economic security issues and Taiwan,\" said Scott Kennedy, senior advisor and trustee chair in Chinese business and economics at the Center for Strategic and International Studies.\n\nBut any efforts will \"be constrained by the executive branch's wide range of latitude and China's growing power and leverage, which can't be easily undone,\" he said.\n\nBeijing has hosted a flurry of global leaders this year, while major economies have struggled to slow a surge of imports from China . Chinese dominance in rare earths has given Beijing leverage in trade talks with the U.S. and the EU.", "source": "CNBC Finance", "pub_date_str": "05 Nov 2026, 12:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold Prices On Recovery Mode: Yellow Metal Rates Jump By Rs 6,600 In Two Days To Rs 1,46,100", "full_content": "A softer interest rate outlook tends to support gold, as the precious metal does not offer interest income. A weaker dollar also makes gold more attractive to buyers holding other currencies.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:21 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Silver To Hit Rs 2,00,000 Again Soon? Prices Jump Rs 11,200 In Two Days", "full_content": "Silver prices have surged by Rs 11,248, or 6.25% in two trading sessions. Analysts believe the white metal could reclaim the Rs 2 lakh mark in the near term.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Dhanteras 2026: Bought gold last year? See how much your 10-gram investment is worth today despite recent dips", "full_content": "Gold remains one of the most popular investments and purchases during Dhanteras. Also known as Dhanatrayodashi, the festival marks the first day of the five-day Diwali celebrations and is observed on the 13th lunar day of the dark fortnight in the Hindu month of Kartik.\n\nTraditionally, households buy jewellery, coins and other precious metals on auspicious occasions. Those who purchased gold around Dhanteras last year still stand to gain despite a recent correction from record highs.\n\nAlthough gold prices have retreated from their peak, they remain well above their levels a year ago, delivering healthy returns for investors who bought the yellow metal during last year's festive season.\n\nHere's a look at how much gold investment made during Dhanteras 2025 is worth today and what current demand trends suggest for the precious metal.\n\nAs of 5 November, 24-carat gold is trading at around \u20b9 1,45,650 per 10 grams in New Delhi, whereas 22-carat gold is priced at around \u20b9 1,34,163 per 10 grams. These prices exclude GST and additional jewellery-making charges.\n\nDuring Dhanteras in October 2025, 24-carat gold was trading at approximately \u20b9 1,32,278 per 10 grams, with prices varying slightly by city. This signifies a rise of about 9-10% in 24K gold prices today since last year.\n\nThe price of gold was trading at \u20b9 1,23,085 per 10 grams a year ago today. This shows that 10 grams of 24K gold has appreciated by about 14.85% to 15% in Delhi over the last year.\n\nGold had touched approximately \u20b9 1.83 lakh per 10 grams in late January 2026 before correcting nearly 18 to 20% from that peak.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 11:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dhanteras, Diwali 2026: Titan, Shanti Gold, Senco among top jewellery stocks to buy for long-term | Check list", "full_content": "Jewellery stocks are in focus on Thursday, 5 November, amid renewed buying interest ahead of Dhanteras, as a sharp recovery in gold prices lifts sentiment towards the sector. Gold prices have rebounded after correcting nearly 12% over the past six months, offering some relief to investors and raising expectations of a recovery in jewellery demand during the festive and upcoming wedding seasons.\n\nAccording to a Reuters report, spot gold climbed 1.9% to $4,134.83 per ounce by 0316 GMT on Thursday, hitting its highest level since 22 October. US gold futures for December delivery advanced 1.8% to $4,144.20 per ounce. The latest recovery followed a 3.4% surge in spot gold in the previous session, its biggest single-day gain since 19 August.\n\nAccording to experts, the rebound was driven by a weaker US dollar and declining US Treasury yields following the Democratic Party's strong performance in the US midterm elections. A softer dollar makes gold more affordable for overseas buyers, while lower bond yields improve the appeal of the non-interest-bearing metal.\n\nThe recovery in bullion prices comes ahead of Dhanteras, when gold purchases traditionally gather momentum. The World Gold Council (WGC), in its latest quarterly outlook, said the festive and wedding seasons are expected to support gold demand, while continued central bank purchases could provide further support to prices over the next 12 months.\n\nAgainst this backdrop, jewellery stocks such as Titan, Kalyan Jewellers, Sky Gold, P N Gadgil Jewellers , Senco Gold, Shanti Gold, Shringar House of Mangalsutra , Tribhovandas Bhimji Zaveri, Khazanchi Jewellers and Lalithaa Jewellery Mart are trading higher in Thursday's session.\n\nWith jewellery demand expected to improve during the festive and wedding seasons, market experts are selectively bullish on organised jewellers and jewellery manufacturers.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 11:46 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dhanteras 2026 date and time: Is auspicious muhurat on 5 or 6 November? Check shubh muhurat, cautions for buying", "full_content": "When is Dhanteras this year? A mix-up regarding the exact date of Dhanteras has many wondering whether the festival falls on Thursday, November 5, or Friday, November 6. Because Hindu festivals are determined by the lunar calendar (tithi), dates rarely align perfectly with the Gregorian calendar.\n\nDhanteras is traditionally celebrated on Trayodashi, the thirteenth day of the waning moon in the month of Kartik.\n\nIn 2026, this specific tithi only begins on Friday morning. Thursday, November 5, is designated for Rama Ekadashi and Govatsa Dwadashi.\n\nThe calculation hinges on the evening puja window. Dwadashi runs from approximately 10:35 AM on Thursday to 10:30 AM on Friday. Trayodashi then takes over, ending at roughly 10:47 AM on Saturday, November 7.\n\nThe primary Lakshmi-Kubera puja must be performed during pradosh kaal\u2014the period immediately following sunset\u2014while Trayodashi is still active. Friday evening meets this requirement perfectly.\n\nBy sunset on Saturday, the tithi will have already transitioned to Chaturdashi. Therefore, standard Panchangs confirm Friday, November 6, as the definitive date for Dhanteras.\n\nAny purchase made after 10:30 AM on Friday qualifies as a Dhanteras buy, whether it is a coin, utensil, or jewellery. However, families often prefer to complete their shopping by late afternoon so the newly acquired items can be placed before deities during the evening puja.\n\nFrom an astrological standpoint, buyers should exercise caution with large investments this year. On Dhanteras morning, a retrograde Venus shifts into Virgo, its weakest sign. Because Venus governs gold, silver , and luxury goods, astrologers advise against massive expenditures.", "source": "LiveMint Money", "pub_date_str": "05 Nov 2026, 11:37 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why Sammaan Capital shares jumped 6% amid Sensex, Nifty Thursday rally after US midterm elections results; stock returns", "full_content": "Sammaan Capital share price jumped over 6% in Thursday's trading session amid mega rally in the Indian stock market after US midterm elections results. The stock opened at \u20b9 129 per share on NSE today, as compared to previous close of \u20b9 125.98 on Wednesday and touched an intraday high of \u20b9 136.50 on 5 November.\n\nThe stock rally came in after Indian equity markets opened Thursday's session on a strong note, with the Sensex climbing 1,609.54 points, or 2.08%, to 78,910.94, while the Nifty 50 advanced 417.45 points, or 1.74%, to 24,378.05. The sharp gains were driven by a decline in crude oil prices and renewed foreign investor buying, which boosted market sentiment.\n\nThe rally also reflected an improvement in global investor sentiment following the November 2026 US midterm elections. The Democratic Party secured control of both the Senate and the House of Representatives, marking a significant political setback for US President Donald Trump's administration.\n\nIn an exchange filing dated October 30, Sammaan Capital said that International Holding Company PJSC's (IHC) special purpose vehicle, Avenir Investment RSC, converted 8.69 crore warrants into an equivalent number of equity shares of the company, raising the promoter's stake in the company by nearly 5% points.\n\nAccording to the filing, IHC's shareholding in Sammaan Capital increased to 33.32% from 28.34% following the conversion. The company allotted 8.69 crore fully paid-up equity shares to Avenir Investment at an issue price of \u20b9 139 per share.\n\nThe conversion brought in fresh capital of \u20b9 905.86 crore, representing 75% of the warrant subscription amount. Avenir Investment had paid the remaining 25% upfront when the warrants were allotted in March 2026.\n\nThe total consideration for the 8.69 crore warrants stood at \u20b9 1,207.81 crore, with the company receiving the balance amount upon conversion.\n\nFollowing the latest conversion, Avenir Investment will continue to hold 21.98 crore outstanding warrants.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 11:27 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US Midterm Election results lift banking, financial stocks - SBI Cards, Bajaj Finance, Axis, ICICI Bank surge up to 6%", "full_content": "Banking and financial stocks rallied sharply on Thursday, November 5, outperforming the broader market as investors cheered Democrats' victory in the US midterm elections, renewed foreign investor buying and a steep decline in crude oil prices.\n\nThe election outcome raised hopes of reduced geopolitical tensions and potentially lower trade uncertainty, while Brent crude's slide to a two-month low provided additional relief to the oil-import-dependent Indian economy.\n\nThe Nifty Financial Services index surged nearly 3% intraday, while the Nifty Bank index advanced 2.2%, outperforming the Nifty 50, which gained nearly 2%. The rally reflected improving investor appetite for financial stocks amid a broader recovery in domestic equities.\n\nBuying was broad-based across banking and financial stocks, with all constituents of the Nifty Bank index trading in positive territory.\n\nAmong financial stocks, SBI Cards led the gains, rising over 6%. Shriram Finance, Cholamandalam Investment and Finance Company, Bajaj Finance and HDFC AMC also advanced over 5% each. Muthoot Finance gained 4.5%, while Bajaj Finserv, ICICI Prudential Life Insurance, REC and LIC Housing Finance rose over 2% eac
