s little guy,\" Zuckerberg said. \"So, if you're not wearing glasses, this is going to be by far the fastest way to talk to your Muse and to show it what's going on around you.\"\n\nThe Meta VR Glasses are slimmer and lighter than the company's older Quest-branded VR headsets, but they are also more expensive, costing $1,299 when they go on sale in spring 2027. They represent Meta's first VR device since 2024, when the company debuted the $299 Quest 3S. The Meta VR Glasses are powered by an external puck that houses a Qualcomm processor and battery, allowing it to function as a mini-computer that also helps reduce the glasses' overall weight and size.", "source": "CNBC World Economy", "pub_date_str": "25 Sep 2026, 04:43 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Playstudios implements 1-for-10 reverse stock split", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 05:34 AM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "3 things Micron investors need to watch as the stakes get higher", "full_content": "When Micron reports earnings next week, a Rosenblatt analyst expects to hear about additional customer agreements, rising prices and stock buybacks.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 04:58 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The S&P 500\u2019s newest tech stock is now its best performer", "full_content": "Shares of data-storage company Everpure were leading S&P 500 gainers on Thursday.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 04:56 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Costco\u2019s results beat expectations. Here\u2019s why investors are still cautious.", "full_content": "Tariff refunds helped deliver a profit beat during Costco\u2019s fourth quarter.", "source": "MarketWatch Top Stories", "pub_date_str": "25 Sep 2026, 04:53 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "30-year fixed mortgage rate jumps sharply Thursday to 7.45%", "full_content": "Mortgage rates rose sharply Thursday, as bond yields surged, with the average rate on the 30-year fixed hitting 7.45%, according to Mortgage News Daily. While other outlets, like Freddie Mac, reported Thursday morning that the rate had just crossed 7%, that report was an average of the last week.\n\nRates rose Thursday morning, when Mortgage News Daily ran its daily survey of brokers and lenders, but as the yield on the 10-year Treasury moved even higher in the afternoon, it re-ran its survey and found rates had moved even higher. Since the day before, they were up 19 basis points, from 7.26%\n\n\"In daily terms, 7% was first broken back on September 10th following inflation reports that raised the risk of the Fed rate hike seen last week,\" wrote Matthew Graham, chief operating officer at Mortgage News Daily. \"A combination of Fed comments, higher oil prices, and stronger economic data have added to the pain since then.\"\n\nCNBC's Property Play with Diana Olick covers new and evolving opportunities for the real estate investor, delivered weekly to your inbox.\n\nThe 30-year fixed sunk as low as 5.99% at the end of February, but began rising at the start of the war with Iran. Rates began moving even higher again at the start of September, especially after the Federal Reserve raised its benchmark rate. Mortgage rates loosely follow the yi     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
