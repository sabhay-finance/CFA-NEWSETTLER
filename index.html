e": "Indian Durables Market To Touch Rs 3-3.25 Lakh Crore By 2030, Create Rs 50,000-Crore Local Manufacturing Boost", "full_content": "India could increase domestic value addition in consumer durables from around 50-55% currently to 65-70% by 2030 as local component manufacturing expands.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 06:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sold house, land, shares or mutual funds? Know 9 reinvestment options to claim capital gains tax exemption", "full_content": "Selling a house, land, shares, mutual funds, or another capital asset can result in capital gains tax. However, the Income-tax Act provides certain exemptions where the capital gains or sale proceeds can be reinvested in specified assets within prescribed timelines.\n\nThere are nine key capital gains exemptions under Sections 54 to 54GB, but the rules differ depending on the asset sold and the asset in which the money is reinvested.\n\nThis exemption is available to individuals and Hindu Undivided Families (HUFs) when a property is sold after 24 months. The new house must be purchased within one year before or two years after the sale, or constructed within three years.\n\nThe exemption is limited to the amount of actual capital gains, the amount invested, or \u20b9 10 crore. A one-time option is also available to invest in two houses where the capital gain does not exceed \u20b9 2 crore.\n\nIndividuals and HUFs can claim this exemption if the original land was used for agricultural purposes for at least two years before its sale by the taxpayer, their parents, or the HUF. The new agricultural land must be purchased within two years after the transfer.\n\nThe new land or building must be purchased or constructed within three years after the compulsory acquisition.\n\nThe investment has to be made within six months of the transfer. The exemption is capped at \u20b9 50 lakh and is subject to the applicable five-year holding conditions.\n\nThe investment must generally be made within six months. The exemption is capped at \u20b9 50 lakh.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 05:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Markets This Week: Geopolitical Developments, Crude Oil To Be Key Drivers, Say Analysts", "full_content": "Markets will also track US economic indicators, including consumer confidence and JOLTS job openings, as well as September inflation data from the eurozone, for clues on the global interest-rate trajectory.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 05:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Repligen CEO Olivier Loeillot sells $976,680 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "27 Sep 2026, 05:46 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Look closer, and Wall Street\u2019s rally is showing cracks", "full_content": "Major stock indexes hovering near records are masking a market straining under elevated oil prices, rising Treasury yields and a Federal Reserve bracing for additional interest-rate hikes.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Sep 2026, 06:30 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Asian Games: Ancy Sojan Wins Silver In Long Jump; Harita Bhadra Bags Bronze In Women's 200m", "full_content": "India's Ancy Sojan celebrates after winning silver medal in the women's long jump final event at the ongoing 20th Asian Games, in Nagoya, Japan.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 06:26 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Petronet to Pay 1% Of Profit As Commission To Directors", "full_content": "Petronet LNG has sought shareholder approval to continue paying profit-linked commission to directors for another five financial years.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 06:14 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sold house, land, shares or mutual funds? Know 9 reinvestment options to claim capital gains tax exemption", "full_content": "Selling a house, land, shares, mutual funds, or another capital asset can result in capital gains tax. However, the Income-tax Act provides certain exemptions where the capital gains or sale proceeds can be reinvested in specified assets within prescribed timelines.\n\nThere are nine key capital gains exemptions under Sections 54 to 54GB, but the rules differ depending on the asset sold and the asset in which the money is reinvested.\n\nThis exemption is available to individuals and Hindu Undivided Families (HUFs) when a property is sold after 24 months. The new house must be purchased within one year before or two years after the sale, or constructed within three years.\n\nThe exemption is limited to the amount of actual capital gains, the amount invested, or \u20b9 10 crore. A one-time option is also available to invest in two houses where the capital gain does not exceed \u20b9 2 crore.\n\nIndividuals and HUFs can claim this exemption if the original land was used for agricultural purposes for at least two years before its sale by the taxpayer, their parents, or the HUF. The new agricultural land must be purchased within two years after the transfer.\n\nThe new land or building must be purchased or constructed within three years after the compulsory acquisition.\n\nThe investment has to be made within six months of the transfer. The exemption is capped at \u20b9 50 lakh and is subject to the applicable five-year holding conditions.\n\nThe investment must generally be made within six months. The exemption is capped at \u20b9 50 lakh.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 05:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Markets This Week: Geopolitical Developments, Crude Oil To Be Key Drivers, Say Analysts", "full_content": "Markets will also track US economic indicators, including consumer confidence and JOLTS job openings, as well as September inflation data from the eurozone, for clues on the global interest-rate trajectory.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 05:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India investment future: FIIs remain net sellers in Sept 2026 but these 5 factors can bring them back - Experts decode", "full_content": "Amid a sharp rise in crude oil prices and elevated US bond yields, foreign institutional investors (FIIs) remained net sellers in Indian equities for the sixth consecutive week.\n\nFIIs have offloaded a net \u20b9 18,531 crore from Indian equities so far in September, while domestic institutional investors (DIIs) have invested \u20b9 52,617 crore during the month. The data underscores the increasing role of domestic institutions in cushioning the impact of sustained foreign outflows.\n\nThis week too, the market saw a similar trend, with FIIs offloading over \u20b9 11,490 crore in equities, during 21\u201325 September.\n\n\u201cIf FII selling sustained while global headwinds are likely to keep markets volatile, though steady domestic institutional buying should continue to limit the downside. Market participants will closely monitor Brent crude oil prices, developments in US-Iran geopolitical tensions and US Q2 GDP data as key triggers for market direction in the coming week,\u201d said Pabitro Mukherjee, Deputy Vice President-Research at Bajaj Broking.\n\nRising US Treasury yields and elevated crude oil prices have led the foreign fund flows. Ponmudi R, CEO of Enrich Money, said the US 10-year Treasury yield crossed 5.10% during the week, tightening global financial conditions and making emerging-market assets relatively less attractive.\n\nPonmudi added that the sharp increase in FII selling could make a sustained recovery in domestic equities challenging unless global risk sentiment improves and foreign inflows return.\n\n\u201cOversold conditions and strong DII participation could support intermittent recovery attempts, but a durable improvement in sentiment will depend on stability in crude oil, global yields, geopolitical developments and a moderation in FII selling,\u201d he added.\n\nAccording to market experts, FIIs evaluate global emerging markets through the prism of net post-tax alpha, ease of operational execution, and macro stability.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 05:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Fortis says it is \u2018complete stranger\u2019 to Daiichi-Singh Brothers dispute after SC allows forensic audit | Shares in focus", "full_content": "Fortis Healthcare said on 27 September that it had no involvement in the ongoing legal dispute between Daiichi Sankyo and the Singh Brothers, stating that it was a \u201ccomplete stranger\u201d to the matter and played no part in the alleged diversion of the erstwhile promoters\u2019 shareholding.\n\nIn an exchange filing on Sunday, the company said it had no control over the transfer of shares by its erstwhile promoters, who owned the shares. It added that it did not receive any money or proceeds from the sale or dilution of the former promoters\u2019 shareholding.\n\nThe company further clarified that after the Singh Brothers\u2019 shareholding fell below 1% and they resigned from the Board of Directors by March 2018, institutional shareholders collectively appointed a group of reputed independent directors.\n\nIn June 2018, the newly constituted independent Board, with the support of established investment bankers and legal advisors, initiated a competitive bidding process to identify and induct a new investor into the company.\n\nSubsequently, Northern TK Venture, the company\u2019s promoter shareholder and part of the IHH Healthcare Berhad group, invested through a fresh issue of equity shares after obtaining all necessary statutory and regulatory approvals, including those from the CCI, SEBI, stock exchanges and the company\u2019s shareholders. The investment was completed in November 2018, several months after the Singh Brothers had ceased to have any association with the company, and did not involve any transfer of shares from them, it added.\n\n\u201cThe Company remains committed to the highest standards of corporate governance, transparency and regulatory compliance and continues to remain focused on its operations and the interests of all its stakeholders, after its successful turnaround since 2018 under its new Promoter shareholder viz. Northern TK Venture Pte.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 05:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trans ACNR Solutions, Eight Others File IPO Papers With SEBI", "full_content": "The filings add to a growing IPO pipeline as companies seek fresh capital for expansion, debt reduction and .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Sep 2026, 05:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trans ACNR Solutions, 8 others file IPO papers with Sebi", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Trans ACNR Solutions, 8 others file IPO papers with Sebi The Economic Times daily newspaper is available online now. Read Today's Paper Trans ACNR Solutions, 8 others file IPO papers with Sebi SECTIONS Trans ACNR Solutions, 8 others file IPO papers with Sebi PTI Last Updated: Sep 27, 2026, 05:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a significant move, Trans ACNR Solutions along with eight additional companies have recently filed for IPOs with Sebi, reflecting an ambitious drive to generate capital for various purposes like expansion and debt management. Specifically, Maharashtra Oil Extractions is looking to collect as much as Rs 370 crore through a combination of new issuing shares and an offer for sale.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "27 Sep 2026, 05:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Top Wall Street analysts like these 3 dividend stocks for steady income", "full_content": "Stock markets remain volatile as investors weigh uncertainty in the Middle East, rising interest rates and concerns about the artificial intelligence (AI) trade.\n\nGiven this volatile backdrop, investors seeking a stable income stream can enhance their portfolios with the addition of dividend stocks. In this regard, tracking recommendations of top Wall Street analysts can help shortlist attractive dividend stocks that are backed by strong financials.\n\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\n\nIntegrated oil and gas giant Chevron ( CVX ) is the first dividend pick. Earlier this month, the company paid a quarterly dividend of $1.78 per share. At an annualized dividend of $7.12 per share, CVX offers a dividend yield of about 3.5%.\n\nAfter a meeting with senior leadership, Goldman Sachs analyst Neil Mehta reiterated a buy rating on CVX and raised his price target to $240 from $225. Among the key takeaways Mehta emphasized was that Chevron is building a solid pipeline of promising international exploration projects across Latin America, the Middle East, West Africa and the Eastern Mediterranean. In particular, he mentioned the focus on Venezuela, where Chevron expects to more than double gross production to 600 kbd from about 280 kbd by 2031, using three joint ventures.\n\nMehta also noted Chevron's efforts to deploy new technologies, especially in shale and tight-oil operations. CVX is focused on boosting productivity and efficiency to maximize free cash flow, he added.\n\nInitiatives such as artificial lift optimization, AI and machine learning, and advanced chemical treatments are expected to improve recovery by about 10% in new wells. Consequently, capital spending per barrel in U.S.", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 05:03 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wall Street money takes back over from small investors as driving force of the stock market", "full_content": "Institutional investors are taking the wheel in the stock market.\n\nAfter years on a big buying streak, retail traders appear to be moving to the sidelines. At the same time, data from Vanda Research shows that big investors have held steady on stocks in the face of spiking Treasury yields.\n\n\"Institutional investors have been surprisingly resilient through this week's macro volatility,\" Viraj Patel, global market strategist at Vanda, wrote to clients on Friday.\n\nOptions flows from institutional investors are around three times higher than a typical September, the data shows.\n\nPatel said that big money's flows have turned up over the past five sessions, despite the 10-year and 30-year U.S. Treasury yields climbing to their highest levels in more than a decade. He called that a \"reasonably constructive signal for risk appetite\" among institutional investors hidden in the broader story of de-risking.\n\nPatel said that institutional traders are buying select artificial intelligence plays amid the volatility.\n\nHe pointed to Meta Platforms as a top pick in particular last week. Shares of the Facebook parent have surged almost 13% in the week following its debut of the Muse Charm device. Momentum has been building for the stock since Meta unveiled its Muse personal AI agent earlier this month.\n\n\"Macro uncertainty isn't stopping risk-taking,\" Patel said. Instead, \"it's making investors far more selective.\"", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 05:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Trade Setup For Sept 28: Nifty's Key Support Returns To 23,000 Level; Analysts Expect Market To Consolidate", "full_content": "Nifty would need to sustain above 23,600 to change the near-term bias from \"sell on rallies\" to neutral.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 05:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Invested in a top-performing mutual fund? Why strong returns may not translate into similar gains for you", "full_content": "A mutual fund can deliver strong long-term returns and yet leave its investors with much lower gains or even losses if investors enter and exit at the wrong time.\n\nA DSP Mutual Fund report highlights how the timing of investor flows can create a wide gap between a fund\u2019s reported returns and the returns actually experienced by investors.\n\nThe report uses the example of Kinetics Internet Fund in the US, a star performer during the internet boom, to explain the difference between a fund\u2019s reported returns and the returns actually earned by its investors.\n\nBetween December 1998 and December 2003, the fund generated a compounded annual return of 8.3%, while investors faced a loss of 11.9%.\n\nThe difference does not necessarily mean the fund itself failed. Instead, it shows how the timing and size of investors\u2019 cash flows, when they put money into or withdrew money from the fund, can materially affect their actual returns.\n\nThe DSP report puts it this way: \u201cThe fund was not the problem. The timing of capital was.\u201d\n\nThe fund's performance shows what happened. In 1998, the fund gave 196.1% returns, but the AUM was only $22 million at the end of the year. After this strong performance became visible, investors poured in money. In 1999, the fund attracted $731 million in net inflows, taking its year-end AUM to $1.15 billion. The fund returned another 216.4% that year.\n\nBut the fund then entered a sharp downturn. It lost 51.5% in 2000, followed by another 9.6% in 2001 and 23.5% in 2002. By the end of 2002, its AUM had fallen to $188 million.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 04:58 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "This key part of the stock market could be headed for a meaningful breakout", "full_content": "The Technology Select SPDR (XLK) has an opportunity to turn a bounce into a more meaningful breakout, says Frank Cappelleri.", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 04:57 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Your SIP Has Underperformed For Three Years: What Should You Check Before Stopping It?", "full_content": "It is recommended to periodically review your portfolio to ensure that its returns are aligned with your expectations.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 04:47 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Indian equity benchmarks Sensex and Nifty ended higher on Friday, bouncing back to close at 73,896 and 23,140.50 respectively. Geojit\u2019s Vinod Nair cited strong domestic liquidity holding Nifty above 23,000, while elevated crude prices and persistent foreign outflows continue to cap near-term market upside ahead of Monday's trade.", "source": "Economic Times Markets", "pub_date_str": "27 Sep 2026, 04:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Debt-hungry AI companies face increased risk as bond yields spike", "full_content": "The AI infrastructure buildout shows no sign of slowing, but the surge in Treasury yields means it's at least going to cost more.", "source": "CNBC World Economy", "pub_date_str": "27 Sep 2026, 04:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Why the upcoming jobs report could send 10-year and 30-year Treasury yields surging", "full_content": "Another hot jobs report could also pressure the Federal Reserve to raise interest rates again in October.", "source": "MarketWatch Top Stories", "pub_date_str": "27 Sep 2026, 04:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Big Win For Prepaid Users! Govt Mandates 30-Day Recharges, Voice-Only Packs -What It Entails", "full_content": "The Centre has mandated 30-day prepaid recharge plans and voice-and-SMS-only options, giving users, particularly those with limited data needs, greater flexibility and potentially more affordable telecom choices.", "source": "NDTV Profit", "pub_date_str": "27 Sep 2026, 04:17 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}], "updated_at": "27 Sep 2026, 07:04 PM IST", "total_stories": 241};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
