nts"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Enhanced insurance cover for West Asia exports extended to March 2027", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Enhanced insurance cover for West Asia exports extended to March 2027 The Economic Times daily newspaper is available online now. Read Today's Paper Enhanced insurance cover for West Asia exports extended to March 2027 SECTIONS Enhanced insurance cover for West Asia exports extended to March 2027 ET Online Last Updated: Sep 30, 2026, 06:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian exporters will continue to receive upgraded insurance protection against buyer payment defaults until March 31, 2027. The expanded coverage is part of an initiative to support exporters during ongoing challenges. Previously, the eligibility was set to expire after September 30, affecting shipments to West Asia.\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nCan Fly91\u2019s flightpath for India\u2019s smallest airline defy the doomy past?\n\nSmugglonomics: Geckos, dry dates, human hair \u2013 what makes something worth smuggling?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "30 Sep 2026, 06:55 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Where to invest after an asset bubble bursts? Nilesh Shah of Kotak makes the case for public markets", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Where to invest after an asset bubble bursts? Nilesh Shah of Kotak makes the case for public markets The Economic Times daily newspaper is available online now. Read Today's Paper Where to invest after an asset bubble bursts? Nilesh Shah of Kotak makes the case for public markets SECTIONS Where to invest after an asset bubble bursts? Nilesh Shah of Kotak makes the case for public markets By Kumar Gaurav , ETMarkets.com Last Updated: Sep 30, 2026, 06:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Kotak AMC\u2019s Nilesh Shah says public markets can offer opportunities after asset bubbles burst, as distressed valuations emerge. Multiples\u2019 Renuka Ramnath highlights private markets\u2019 greater control, while both stress diversification, liquidity and risk management across investment portfolios.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 06:53 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock market holidays in October 2026 from NSE calendar - Open and closed days full list other than Saturdays, Sundays", "full_content": "The Indian stock market will remain closed for a couple of days in October owing to a mix of national and regional holidays, potentially resulting in thinner trading activity on the exchanges.\n\nAs per the NSE's holiday calendar, trading in equities will remain shut on Friday, October 2, on account of Mahatma Gandhi Jayanti. The closure will give Indian equities a three-day break from trading around the weekend.\n\nInvestors will therefore have to account for global market movements during the Indian market holiday before trading resumes the following week. Following this, the next scheduled trading holiday for the Indian stock market will be Dussehra on October 20, 2026, according to the NSE's 2026 holiday calendar.\n\nThe last trading holiday was on September 14, on account of Ganesh Chaturthi.\n\nBarring October, trading activity will be halted for three more days in 2026, with two falling on Tuesdays and one on Friday. Other trading holidays later in the year include Diwali on November 10, Guru Nanak Jayanti on November 24 and Christmas on December 25.\n\nMeanwhile, Muhurat Trading for equities will be conducted on Sunday, November 8, 2026. However, the exchanges have not yet notified the trading timings and are expected to announce them through a circular.\n\nSimilar to equity trading, trading in both agricultural and non-agricultural commodities on the MCX will remain shut on October 2 for both sessions, according to the MCX holiday calendar.\n\nFor Dussehra on October 20, Diwali-Balipratipada on November 10, and Guru Nanak Jayanti on November 24, the commodity market will remain closed for the first session but will open for the evening session. Meanwhile, the MCX will remain closed for both sessions on Christmas, December 25, 2026.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 06:49 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mattel names Roger Lynch as CEO, replacing Ynon Kreiz", "full_content": "Mattel on Wednesday named Roger Lynch as its new CEO and chairman, succeeding Ynon Kreiz.\n\nLynch, who has been a member of Mattel's board since 2018, will take the reins as chairman on Oct. 2 and CEO by Nov. 2, according to the press release .\n\nLynch is currently the CEO of Cond\u00e9 Nast, a position he has held since 2019. Mike Perlis will serve as Cond\u00e9 Nast's interim CEO while the board begins it search for Lynch's successor, according to a letter from Lynch.\n\n\"I am honored by the Board's confidence in me and couldn't be more excited to lead the incredible team at Mattel,\" Lynch said in the release. \"Throughout my years on the Board, I have admired Mattel's brands, its talented people, and unique culture.\"\n\nKreiz will leave Mattel after more than eight years at the helm to take a senior leadership position at another public company.\n\nHe has led the toymaker and entertainment company through major transformations, including the release of \"Barbie,\" which became the highest-grossing domestic film release of 2023 .\n\n\"It has been a privilege to lead Mattel, with a global team dedicated to its mission and purpose, and I am proud of all we have achieved together,\" Kreiz said in a statement. \"Mattel is in a position of strength, with a world-class brand portfolio, product offering, and global capabilities.\"\n\nMattel has been working on bolstering its iconic brands, with Hot Wheels as a notable strength. The company is also attempting break into the digital games space in a bid to match rival Hasbro . It acquired full control of its Mattel163 Mobile Games Studio earlier this year.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 06:49 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Tata Group stock! BofA turns bullish on Trent, initiates coverage with Buy, pegs 17% upside", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Tata Group stock! BofA turns bullish on Trent, initiates coverage with Buy, pegs 17% upside Trent Share Price V2 Retail Share Price Aditya Birla Fashion and Retail Share Price Shoppers Stop Share Price Baazar Style Retail Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Tata Group stock! BofA turns bullish on Trent, initiates coverage with Buy, pegs 17% upside SECTIONS Tata Group stock! BofA turns bullish on Trent, initiates coverage with Buy, pegs 17% upside By Kumar Gaurav , ETMarkets.com Last Updated: Sep 30, 2026, 06:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis BofA Securities initiated coverage on Trent with a Buy rating and Rs 3,075 price target, citing its differentiated retail model, Zudio and Westside growth, integrated technology, supply chain capabilities and long-term market share opportunities.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 06:48 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dow futures gain 100 points after data shows inflation slowed last month: Live updates - CNBC", "full_content": "Dow futures gain 100 points after data shows inflation slowed last month: Live updates CNBC Inflation Cools, Economy Perks Up U.S. News & World Report Stocks Rise as US Data and Micron Pose Key Tests: Markets Wrap Bloomberg.com Inflation cooled slightly last month even as consumers stepped up spending abcnews.com Dow opens higher as traders digest a slew of economic data to gauge Fed's next move on rates MarketWatch", "source": "Google News Business", "pub_date_str": "30 Sep 2026, 06:48 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "China's inside man at the Fed, OpenAI debuts Dots, an IPO trend and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Wednesday. Citadel CEO Ken Griffin is donating $3 billion to Carnegie Mellon University, what the school called the \"largest individual gift in higher education history.\"\n\nStock futures are little changed this morning. All three major averages are coming off their second straight negative day.\n\nHere are five key things investors need to know to start the trading day:\n\nHow did John Harold Rogers go from a senior Federal Reserve official to an espionage suspect arrested by the FBI? As CNBC's Eamon Javers reports in a new investigation out this morning , it's a case that, as one federal prosecutor put it, reads \"like a spy novel.\"\n\nOpenAI rolled out a string of new products at its developer conference yesterday including Dots, its new \"always-on\" agents. The company also debuted its latest artificial intelligence model, GPT-6.1 Sol, just days after it scrapped plans to launch GPT-6.1 Astra because the model didn't meet its safety standards.\n\nOpenAI's potential IPO was also front of mind for investors and company executives in San Francisco on Tuesday. CEO Sam Altman told CNBC's Kate Rooney that he doesn't \"have a particular timeline in mind,\" adding that \"this is a time to put safety and mission first.\" Sarah Friar, the company's finance chief, said later in the day that the ChatGPT creator will go public \"when the time is right for our business.\"\n\nMeanwhile in Washington, D.C., President Donald Trump said he and a host of tech leaders signed a \"morally binding\" AI agreement following a White House luncheon. The president also said he is renaming AI to \"super intelligence\" via an executive order, an apparent attempt to rebrand the technology as public sentiment sours on AI.", "source": "CNBC World Economy", "pub_date_str": "30 Sep 2026, 06:46 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Ken Griffin pledges $3 billion to Carnegie Mellon University in 'historic' gift", "full_content": "Citadel CEO Ken Griffin announced Wednesday that he has committed $3 billion to Carnegie Mellon University, including $2 billion in funding to establish a new Miami campus.\n\nThe $3 billion pledge is the \"largest individual gift in higher education history,\" according to a statement from the university, which called the gift \"historic.\" The previous record was a $2 billion gift by Nike co-founder Phil Knight and his wife Penny to Oregon Health & Science University in August 2025.\n\nGriffin, who is worth $57.5 billion by Bloomberg's estimate , will join Carnegie Mellon's board of trustees.\n\n\"The opportunity to bring Carnegie Mellon to Miami places our city at the heart of humanistic and scientific advancement and amplifies the University's international reach and impact,\" Griffin said in a release. \"CMU Miami will cultivate the talent, knowledge, and expertise to launch new enterprises, contribute to Miami's economy and community, and advance the prosperity of our nation.\"\n\nPreviously, the hedge fund billionaire's largest donation was $300 million to Harvard University, his alma mater, in 2023. Griffin also contributed $125 million to the University of Chicago in 2017 when Citadel was still headquartered in the Windy City.\n\nSince he moved Citadel's headquarters to Miami in 2022, citing concerns about crime in Chicago, he has become a vocal Miami booster, touting Florida's business-friendly policies, low taxes, and quality of life.\n\n\"It's a state that is prospering,\" he said at a CNBC conference in 2022 . \"It's really fun to be in an environment where people are embracing the future. They're hopeful about the future.\"\n\nIn the past four years, Griffin has become a prolific philanthropist in South Florida. He's made gifts of $50 million apiece to the University of Miami's cancer center, the Baptist Health Foundation's neuroscience institute, and Success Academy, to fund the charter school network's expansion to Miami.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 06:45 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Multibagger stocks: 4 Ashish Kacholia, Mukul Agrawal portfolio stocks that nearly doubled investors\u2019 wealth in one year", "full_content": "Ace investors portfolio stocks: Yasho Industries Limited, Aeroflex Industries , Fineotex Chemicals, and ASM Technologies are among key stocks from ace investors Ashish Kacholia and Mukul Agrawal portfolio that have delivered strong returns.\n\nMost of these stocks have delivered nearly 100% return over the last one year. Yasho Industries stood out as the clear outperformer out of the five stocks with its 148% one year return.\n\nYasho Industries Limited share price closed 1.21% lower at \u20b9 4003 per share on BSE with an Mcap of \u20b9 4,827.60 crore on Wednesday. The stock has delivered 219.18% return in six months, 140% return in one year, and 101% return in two years. The Ashish Kacholia portfolio stock has delivered nearly 125% return in three years and 392% return in five years.\n\nAeroflex Industries share price closed 0.72% lower at \u20b9 536.10 per share on BSE with an Mcap of \u20b9 7,094.25 crore. The stock has delivered 13% return in 3 months, 124% return in six months. Its share price value has surged nearly 208% in one year and 200% in two years.\n\nFineotex Chemicals share price closed 0.86% lower at \u20b9 57.50 per share on BSE with an Mcap of \u20b9 6,695.88 crore on Wednesday. The stock has delivered 48% return in three months, 129% return in one year, and 41% return in two years.\n\nThe Mukul Agrawal portfolio stock closed 1.60% lower at \u20b9 6759.50 per share on BSE with an Mcap of \u20b9 9,860.22 crore on Wednesday. ASM Technologies stock has delivered 178% return in six months, 68% return in one year, and 317% return in two years.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 06:41 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "U.S. inflation rises, keeping pressure on Fed", "full_content": "The main inflation gauge used by the Federal Reserve to set U.S. interest rates rose sharply in August, underscoring why the central bank raised interest rates earlier this month for the first time in three years.", "source": "MarketWatch Top Stories", "pub_date_str": "30 Sep 2026, 06:41 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Micron earnings hit Wall Street after the bell. Here's how options traders are positioned into the report", "full_content": "In a free-wheeling press conference on the White House lawn on Tuesday, President Trump shared the microphone with at least $15 trillion worth of AI leaders including Jensen Huang, Sundar Pichai, Greg Brockman, Dario Amodei and Elon Musk, riffing on the future of what the President calls \"super intelligence,\" promising an economic boom surpassing any in history. In the near term, the market needs to get through Micron earnings. The good news is options traders think it could be a slam dunk. Market-makers are pricing a smaller 7% move for Micron Wednesday after the bell, which is slightly less than its four quarter average move of 8%.\n\nBut for a stock that hit a screeching halt just three months ago when the blow-up of hedge fund Situational Awareness sent a chill through the AI bull market, a more measured rally might be just what traders want.\n\nMicron, YTD Options flows in Micron leaned bullish Tuesday, with 61,000 calls likely bought versus 37,000 puts, and 75% of the total $1.6 billion of premium traded tied to calls, according to Cboe LiveVol and SpotGamma data. While call-selling was also prominent, it was mostly due to some big sellers of the 1,150-strike call in Micron, a bet the stock won't exceed its implied earnings move, rather than a bet against the company. About an equal number of puts and call contracts were open as of the close Monday, near a one-year low for the put-to-call ratio for Micron, according to Barchart data. \"This, unlike some of Micron's prior earnings, is a more universally bullish dealer positioning,\" said Jason DeLorenzo, owner and founder of Volland, an options market-structure analytics platform.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 06:37 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI DevDay recap: AI lab rolls out Dots agents, Altman and Friar comment on IPO", "full_content": "OpenAI held its annual DevDay developer conference on Tuesday, where the artificial intelligence company announced a flurry of new products and features .\n\nThis year's DevDay comes as OpenAI has been under intense pressure to address mounting safety concerns after it disclosed several incidents where its models behaved in unintended ways, and the startup held back its latest Astra model over safety concerns.\n\nEarlier this month, the company endorsed a call to slow down the pace of advanced AI model development in order to better address the technology's risks.\n\nCNBC's reporters are covering the OpenAI DevDay event live from San Francisco, and remotely from Englewood Cliffs, New Jersey.\n\nFriar said OpenAI wants to IPO \"when the time is right for our business,\" echoing Altman's earlier comments to CNBC. She said an IPO is \"not a destination,\" but a \"milestone on the journey\" and \"another type of fundraising.\"\n\n\"I think Sam is correct in saying we don't want to get distracted by suddenly being a public company in the midst of really making sure we drive home for customers our focus on safety and alignment,\" Friar said.\n\nOpenAI CFO Sarah Friar touted the company's latest price drop on their GPT-6.1 Sol model, and went deeper into the feedback OpenAI's been getting on their higher pricing tiers.\n\n\"When we launched our $200 SKU, people thought we'd lost our minds, [that] no one's ever going to spend that per month,\" Friar told CNBC's Kate Rooney in an interview.", "source": "CNBC World Economy", "pub_date_str": "30 Sep 2026, 06:33 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Boeing rises 3% after securing U.S. Navy deal to develop next-generation fighter jet", "full_content": "Aircraft manufacturer Boeing rose in premarket trading Wednesday after securing a deal with the U.S. Pentagon and U.S. Navy to develop the next generation of fighter jets.\n\nThe contract, worth more than $20 billion, is to build its Sixth-Generation F/A-XX Strike Fighter over a long-term phase, the defense departments said . The F/A-XX is intended to replace the service's fleet of F/A-18 Super Hornets.\n\nThe fighter will advance open mission systems architecture, advanced mission systems, and operational reach and capacity, Boeing said in a separate statement. Boeing was last up 2.7% in premarket trading.\n\nShares of Northrop Grumman Corporation , a top U.S. aerospace and defense contractor and a Boeing competitor, were down 3.6% in premarket. Boeing repeatedly beat Northrop for the government deal.\n\nBoeing shares year-to-date. \"The F/A-XX is a critical pillar in our commitment to maintaining peace through strength. F/A-XX will dominate contested airspace, extend operational reach, and deliver a decisive combat advantage for the warfighter,\" said Michael P. Duffey, Under Secretary of War for acquisition and sustainment.\n\nIt marks the company's second prestigious sixth-generation jet contract in a year after the Air Force selected it to develop its F-47 fighter in 2025.\n\nElsewhere, Boeing recently flagged a software glitch in some of its 737 Max 10 aircraft that could impact certain landing procedures, which led the Federal Aviation Administration on Monday to delay its certification of the aircraft.\n\n\"We haven't concluded whether this is a safety-of-flight issue or not, but we will be delaying the 10 ... until we're satisfied that we don't have an issue here,\" FAA Administrator Bryan Bedford said at a press conference on air traffic modernization in Washington, D.C., on Monday.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 06:33 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Federal Reserve Board finalizes changes to enhance the transparency and public accountability of its stress test and reduce volatility in its stress test-related capital requirements", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 9:00 a.m. EDT Share --> --> --> --> --> --> The Federal Reserve Board on Wednesday finalized changes to enhance the transparency and public accountability of its stress test and reduce volatility in its stress test-related capital requirements. The two final rules are largely similar to the proposed rules from 2025. The Board also requested comment on a proposal to better capture differences in banks' business models to generate fee income.\n\nThe Board conducts stress tests to ensure that large banks are sufficiently capitalized and able to lend to households and businesses even in a severe recession. In December 2024, the Board announced it would modify the test to improve its resilience.\n\n\"The stress test is an essential component of our regulatory capital framework,\" said Vice Chair for Supervision Michelle W. Bowman. \"Today's changes preserve its resilience by ensuring that it is transparent, granular, and risk-sensitive. The public will now have greater assurance that the risks banks take will be reflected appropriately in their stress test losses and their capital requirements.\"\n\nThe first final rule requires the Board to invite public input annually on the stress test scenarios and any material model changes. It also updates the framework that guides the design of the hypothetical scenarios and adopts the models that will be used for the 2027 stress test. In addition, the final rule makes several adjustments to the stress test calendar. The final rule also updates the global market shock component, which is a set of shocks to specific market components applied to banks with large trading books.", "source": "Federal Reserve", "pub_date_str": "30 Sep 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "General Mills names insider McNabb as CEO, succeeding veteran Harmening", "full_content": "General Mills said on Wednesday Chief Operating Officer Dana McNabb will succeed longtime CEO Jeff Harmening next year, tasking a company veteran with leading the Cheerios maker's efforts to ride out a difficult spending environment.\n\nThe leadership changes come as the packaged foods maker grapples with margin pressures, raising prices to offset the impact from higher input costs, including a rise in prices of raw materials affected by US import tariffs on metals such as aluminum and steel used in packaging.\n\nUnder Harmening, who joined the company in 1994 and has served as CEO since 2018, General Mills took several measures, including the divestiture of some underperforming brands.\n\nMcNabb, who has spent 27 years at General Mills, has held several senior leadership roles across general management, enterprise strategy, marketing and international operations.\n\nEarlier this month, the company beat first-quarter sales and profit estimates and reaffirmed its annual forecast as price hikes and resilient demand for packaged food helped cushion the impact of higher input costs.\n\nShares of the company were marginally up at $34.03 in premarket trading.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 06:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Treasury Yields Slip as Fed Hike Expectations Moderate \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Treasury Yields Slip as Fed Hike Expectations Moderate \u2014 Live Updates WSJ Growth, Inflation Figures Show Signs of an Economic Pickup WSJ US economy grew 2.2% this spring, more than initially estimated CNN US economy grew a solid 2.2% in the second quarter, government says, upgrading previous estimate apnews.com Gold price rockets to session highs as US economy rises 2.2% in Q2, PCE inflation rises 0.2% in August Kitco", "source": "Google News Business", "pub_date_str": "30 Sep 2026, 06:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NHAI to conduct special quality checks on 17 highway projects with bids 15% below estimate", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Infrastructure \u203a NHAI to conduct special quality checks on 17 highway projects with bids 15% below estimate The Economic Times daily newspaper is available online now. Read Today's Paper NHAI to conduct special quality checks on 17 highway projects with bids 15% below estimate SECTIONS NHAI to conduct special quality checks on 17 highway projects with bids 15% below estimate ET Online Last Updated: Sep 30, 2026, 06:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NHAI to begin special quality inspections for 17 under-construction National Highways projects due to their substantial cost discounts. These inspections are in addition to regular quality checks intended to identify construction issues early. A second round of inspections will take place after six months to verify quality and progress. The selected projects encompass various states and include significant infrastructural developments.\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nCan Fly91\u2019s flightpath for India\u2019s smallest airline defy the doomy past?\n\nSmugglonomics: Geckos, dry dates, human hair \u2013 what makes something worth smuggling?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "30 Sep 2026, 06:19 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Holiday retail sales are expected to top $1 trillion as inflation boosts growth", "full_content": "Despite macroeconomic pressures and a cautious consumer , retail sales this holiday season are expected to grow year-over-year as spending remains strong.\n\nAccording to Bain & Company's annual forecast , holiday retail sales are expected to top $1 trillion for the first time, marking a 4.5% growth. That growth is largely projected to be from in-store sales at 70%, though e-commerce is continuing to gain share.\n\nThe holiday spending is supported by higher tax refunds , which are up $43 billion this year, or 17% year over year, adding more cash to consumers' wallets. Even still, the report noted that Bank of America estimates half of that benefit has already gone to higher gas prices , which have significantly squeezed budgets.\n\nBain also noted that the headline spending increase is underscored by rising inflation, which accounts for most of the growth, making actual unit growth thinner than it appears. Categories that are most affected by inflation with unit decline include food and beverage, furniture, and health and personal care.\n\nWednesday's personal consumption expenditures report , the Federal Reserve 's primary inflation gauge, saw consumer prices post a smaller than expected increase from last year, putting the 12-month gain at 3.4%. Economists had been looking for an increase of 3.7%.\n\nThe spending forecast comes as the Conference Board reported Tuesday that consumer confidence fell to its lowest level since 2014 in September. Respondents said they were worried about inflation and the jobs outlook.\n\nStill, Deloitte forecast a similar projection to Bain, saying it expects holiday retail sales to reach $1.7 trillion this year.", "source": "CNBC Top News", "pub_date_str": "30 Sep 2026, 06:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nifty H1FY27 Review: Top gainers and losers | Can H2FY27 deliver better returns?", "full_content": "Market benchmark Nifty 50 concluded the first half of the financial year 2026-27 (H1FY27) with a nominal gain of 1.3%. The index finished at 22,620.45, down 0.42%, on Wednesday, 30 September.\n\nSuch has been the Nifty\u2019s performance over the last two years that even the meagre 1% gain over the past six months appears decent. For context, the benchmark index is down 12% over the last two years. On 30 September 2024, the index was at 25,810.85.\n\nWhile the index hit an all-time high of 26,373.20 on 5 January this year, it succumbed to pressure from higher oil prices amid the US-Iran conflict.\n\nWhile over the last two years, the market was struggling due to earnings growth-valuation mismatch and heavy foreign capital outflow, the troubles for it compounded after the US and Israel attacked Iran in February this year.\n\nContrary to the expectations that the conflict will end soon, it continues even today. The chaos in West Asia drives oil prices higher, posing a serious macroeconomic challenge for the world's third-largest oil importer, India.\n\nWhile the domestic economy has so far remained resilient, with Q1FY27 GDP growth at 7.8%, the risk of inflation has strengthened globally, triggering monetary tightening by the US Federal Reserve, the Bank of Japan, and the European Central Bank. The Reserve Bank of India (RBI) is also expected to raise rates by 25 basis points on 7 October.\n\nA fresh headwind has emerged- bond yields are rising globally. The 30-year Treasury yield in the US jumped to 5.62%, which is its highest intraday level since June 2002. Yields on the 10-year Treasury hit the level of 5.29%, its 19-year high.\n\nSeven stocks - ONGC, Infosys, NTPC, TCS, Power Grid, HDFC Life, and Reliance Industries - declined more than 10% in the first half of the year, while 16 stocks jumped more than 10% during the period.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 06:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Technopaints And Chemicals Files DRHP For Rs 500 Crore IPO; Plans To Fund New Plant, Working Capital", "full_content": "The company may also raise up to Rs 65 crore through a pre-IPO placement before filing the Red Herring Prospectus with the Registrar of Companies.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 06:15 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dividend income at risk? 8 stocks with inconsistent dividend payout: Indian Oil, Sanofi India, UTI AMC, and more", "full_content": "Dividend income stocks: High dividend-paying stocks often attract investors seeking regular income. However, inconsistent or volatile dividend payouts over the years can be a disappointment. Companies such as Indian Oil Corporation , Sanofi India and UTI AMC have witnessed significant fluctuations in their dividend payouts over the past three years.\n\nHere\u2019s a list of companies which might have offered high dividend payouts in financial year 2025-26, but their dividends might have declined over the past three years.\n\nThe company had announced an annual dividend of \u20b9 40 per share dividend in FY26 which is significantly higher than its previous two years payouts, ie Re 1 per share dividend in FY25 and Re 1 per share dividend in FY24.\n\nSanofi India dividend payout stood at \u20b9 123 per share and at \u20b9 117 per share in FY 26 and FY25, which is significantly lower than \u20b9 167 per share dividend announced in FY24. The company stock closed marginally lower at \u20b9 3054 per share on BSE on Wednesday.\n\nThe PSU\u2019s dividend payout remained highly volatile over the last three years, with \u20b9 7 paid in FY26, \u20b9 3 paid in FY25 and \u20b9 12 paid in FY24. IOCL stock closed 2.74% higher at \u20b9 134.93 per share on BSE on Wednesday.\n\nUTI AMC announced an annual dividend of \u20b9 40 per share in FY26, which is lower than the annual dividend announced in FY25 ( \u20b9 48 per share) and in FY24 ( \u20b9 47 per share). UTI AMC stock closed 0.55% higher at \u20b9 882.40 per share on NSE on Wednesday.\n\nPremco Global has announced a total of \u20b9 44 per equity share dividend in FY26, which is marginally lower than its previous financial year dividend, but higher than the total dividend amount announced in FY24. The stock closed 0.64% higher at \u20b9 400.85 per share on Wednesday.\n\nHigh dividend payout or yield in a single year doesn't guarantee sustainable payout over the years. It doesn't mean that investors can expect the same payout every year.", "source": "LiveMint Markets", "pub_date_str": "30 Sep 2026, 06:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Buy, Sell Or Hold: Fortis Healthcare, Tata Elxsi, Trent, Delhivery, Orient Electric \u2014 Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 06:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'It's a strong report': g, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "'Refurbishing is Our Soul': Rentomojo Details Operation-Heavy Model, Eyes Over 80% Occupancy Rate", "full_content": "In FY26, the company purchased \"close to about Rs 175 crore worth of inventory altogether\", Rentomojo CEO Geetansh Bamania said.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 05:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bond investors \ud83d\udc94 OATs", "full_content": "Sacr\u00e9 bleu", "source": "FT Markets", "pub_date_str": "30 Sep 2026, 05:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Royal Chain IPO: Jewellery Maker Eyes Rs 1,000 Crore Public Issue; High Debt Repayment Among Key Risks", "full_content": "Royal Chain plans to use Rs 650 crore from the fresh issue towards repayment or prepayment, in part or full, of certain outstanding loan facilities and accrued interest.", "source": "NDTV Profit", "pub_date_str": "30 Sep 2026, 05:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "ET Alpha Wealth Summit 2.0: Why next market cycle may need a new playbook", "full_content": "Market cycles can reshape sector leadership, earnings expectations and valuations. As investors navigate changing interest rates, geopolitical shifts and the rise of artificial intelligence, business quality and valuations remain key. Veteran investor Prashant Jain will share lessons from three decades of market cycles at the ET Alpha Wealth Summit 2.0.", "source": "Economic Times Markets", "pub_date_str": "30 Sep 2026, 05:33 PM IST", "pub_date_r     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
