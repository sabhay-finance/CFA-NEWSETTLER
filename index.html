    const allData = {"general": [{"title": "Nasdaq rises as tech shares rebound following sell-off: Live updates", "full_content": "The Nasdaq Composite rose on Friday following a losing session in which an underwhelming revenue report from OpenAI took some steam out of the high-flying artificial intelligence trade.\n\nThe tech-heavy Nasdaq added 0.6%. The S&P 500 climbed 0.3%, while the Dow Jones Industrial Average traded up 64 points, or 0.1%.\n\nThe State Street Technology Select Sector SPDR ETF (XLK) traded 1% higher. Tech shares broadly were led by a 2% gain in SpaceX . The Elon Musk-led space and satellite company rose on a deal to buy a nationwide spectrum portfolio. Shares of AT&T , Verizon and T-Mobile slid as investors wondered worried the agreement could drive up competition.\n\nOther tech names that advanced on Friday include Lumentum and KLA , which gained 8% and 2%, respectively.\n\nAI stocks dropped on Thursday after CNBC confirmed that OpenAI told investors that it saw $50 billion in annualized revenue at the end of September. Last month, a $68 billion figure was widely reported, though a person familiar with the matter said it also included gross revenue from partners.\n\nThe Nasdaq Composite dropped more than 1%, marking its biggest one-day loss since mid-August. Thursday marked the second down day in a row for the tech-heavy index after it climbed to fresh all-time records earlier in the week.\n\n\"The sell-off reflected extreme positioning imbalances that have further to unwind in our view, which is why the whole AI-linked tech stock complex is unlikely to simply stage a sharp, V-shaped rebound,\" wrote Adam Crisafulli of Vital Knowledge.\n\n\"When it comes to AI, the main issue isn't the gross vs. net issue with [annualized recurring revenue] but instead: 1) the fact that the standalone frontier labs are increasingly unattractive businesses ... and 2) growing signs that markets are pushing back on the tidal wave of AI-linked debt and equity being thrown at them,\" he added.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:57 PM IST", "pub_date_relative": "1m ago"}, {"title": "Trump appoints committee to investigate statements by the Fed's Lisa Cook", "full_content": "President Donald Trump formally established a \"committee of inquiry\" to investigate allegations that Federal Reserve Governor Lisa Cook made false statements related to \"one or more mortgage instruments,\" the White House announced Friday.\n\nThe extraordinary announcement is the latest development in Trump's long-running effort to fire Cook, a nominee of former President Joe Biden, from the central bank's board. Trump, who frequently urges the Fed to lower interest rates, recently said the failure to do so by his handpicked chair Kevin Warsh is the fault of a \"hostile\" board.\n\nThe committee will be three executive branch officials, including Kevin Hassett, Trump's top economic aide and a chief defender of the administration's economic record, according to a presidential memorandum posted on the White House website and shared Friday on social media.\n\nThe other two members are Keith Sonderling, acting head of the Office of Government Ethics, and Equal Employment Opportunity Commission Chair Andrea Lucas, according to the notice, which is dated Wednesday. No outside, independent arbriters are mentioned.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:55 PM IST", "pub_date_relative": "4m ago"}, {"title": "Americans' debt problems are flashing a warning not seen since the Great Recession", "full_content": "The ability of U.S. families to stay current on their debts worsened over the past three years, hitting levels not seen since the aftermath of the global financial crisis, the Federal Reserve reported Friday.\n\nIn the central bank's Survey of Consumer Finances, researchers found that while wealth disparities narrowed somewhat, the ability to meet debt payments deteriorated significantly.\n\n\"Families were more likely to be behind on their financial obligations than at any point since the 2010 survey,\" stated the survey, a data-rich document the Fed releases every three years to chronicle the nation's financial health.\n\nThe nation in 2010 was just emerging from what became known as the Great Recession, a period that ran from December 2007 to June 2009. A collapse in the subprime mortgage market resulted in contagion across the largest financial institutions in the U.S. and the world, sending unemployment at one point to 10%.\n\nAccording to the new findings, the portion of families behind on loan payments at the end of 2025 soared from about 12% in the prior survey to nearly 20%, a gain of some 67%. Those behind by two months or more also accelerated considerably, moving to more than 8% from 5% in 2022.\n\nWhile the report covered the period through 2025, concerns over financial health have persisted. A New York Fed survey released earlier this week showed that households reported their financial situations had worsened from a year ago and were likely to be weaker in the year ahead.\n\nAt the same time, the net worth of higher earners soared, with those in the top income group seeing their median net worth rise 31%.\n\nThe share of debt to income also posted a large gain. Families with payment-to-income ratios of greater than 40% jumped to 8.6%, up from 6.5% in 2022 and the highest level since 2013.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:54 PM IST", "pub_date_relative": "5m ago"}, {"title": "UPI MDR: Will ordinary consumers be charged for making online payments to friends, family, or personal contacts?", "full_content": "The government recently decided to end over six years of zero-fee Unified Payments Interface (UPI) usage by introducing a 0.4% surcharge on merchant transactions greater than \u20b9 2,000. The decision generated immediate friction among local business owners.\n\nThe UPI network powers payments for more than 500 million consumers purchasing everyday items\u2014from street tea to smartphones\u2014across Asia's third-largest market.\n\nAs public confusion mounted regarding potential fees on general consumer shopping and peer-to-peer transfers, the government issued key clarifications.\n\nAnswer: No, UPI services will continue without any cost to consumers. Consumers can continue to transact free-of-cost using UPI as they have been doing till now.\n\nConsumers making payments through UPI will not face any charges. Individual account holders can continue using UPI applications for all routine, daily expenses without worrying about any charges. The MDR policy ensures that UPI remain free and accessible for all citizens across India.\n\nAnswer: No, P2P transactions will continue to be free-of-cost for both payer as well as beneficiary. There will be no charges for any person transferring or receiving any amount to or from any other person (or even self-transfers) using UPI.\n\nWhether you are transferring money to a family member, splitting a bill with friends, or performing self-transfers across your own linked bank accounts, zero charges apply. Citizens can freely make transfers on UPI of any permitted amount without incurring any transaction fees.\n\nNow, officials are weighing a multi-month delay for the rollout on larger transactions, according to regulatory and industry sources cited by Reuters . While the National Payments Corporation of India has yet to issue its formal ruling, a verdict is anticipated shortly.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 07:53 PM IST", "pub_date_relative": "6m ago"}, {"title": "Spain records first month without Russian LNG imports in five years", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:49 PM IST", "pub_date_relative": "9m ago"}, {"title": "EU says it agrees with China to halve hybrid vehicle exports to EU", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:49 PM IST", "pub_date_relative": "10m ago"}, {"title": "Knight-Swift stock rating maintained at Buy by StoneX on pricing outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:48 PM IST", "pub_date_relative": "10m ago"}, {"title": "Piper Sandler keeps Neutral on Nike stock amid sales concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:48 PM IST", "pub_date_relative": "10m ago"}, {"title": "KeyBanc lowers RPM International stock price target on guidance concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:48 PM IST", "pub_date_relative": "10m ago"}, {"title": "Enovix stock price target lowered to $10 on slower ramp by StoneX", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:48 PM IST", "pub_date_relative": "10m ago"}, {"title": "Truist cuts Community Healthcare Trust stock price target on higher rates", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:48 PM IST", "pub_date_relative": "10m ago"}, {"title": "Truist raises Zeta Global stock price target on AI platform shift", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:48 PM IST", "pub_date_relative": "10m ago"}, {"title": "KeyBanc raises Zeta Global stock price target on product strength", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:48 PM IST", "pub_date_relative": "10m ago"}, {"title": "US consumer sentiment deteriorates further in October", "full_content": "", "source": "Investing.com News", "pub_date_str": "09 Oct 2026, 07:48 PM IST", "pub_date_relative": "10m ago"}, {"title": "AI agents like Muse can shop for you. Here's what that means for retail stocks", "full_content": "For Amazon, Costco, and TJX, the rise of AI shopping agents presents challenges \u2014 and some surprising advantages.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 07:45 PM IST", "pub_date_relative": "13m ago"}, {"title": "Hurricane Isaias disrupts U.S. oil production in Gulf of Mexico, threatens refineries", "full_content": "Hurricane Isaias is disrupting U.S. crude oil production in the Gulf of Mexico and could limit about 2% of the country's refining capacity, at a time when fuel markets are already tight around the world.\n\nIsaias is churning toward Mississippi, Alabama and the Florida panhandle as a Category 3 storm with maximum sustained winds of 120 miles per hour, according to the National Hurricane Center , and is expected to make landfall Friday night or early Saturday.\n\nAs of Thursday, oil companies had shut in about 1.3 million barrels per day, or roughly 63% of total U.S. production in the Gulf, according to the Bureau of Safety and Environmental Enforcement .\n\nThe hurricane appeared to be veering away from the dense refining region in southern Louisiana near New Orleans and Baton Rouge.\n\nBut the storm could affect Chevron's refinery in Pascagoula, Mississippi, and a Vertex Energy refinery in Saraland, Alabama. Both areas are under hurricane warnings. The facilities there can produce a combined 466,000 bpd, or 2.4% of U.S. refining capacity, said Andy Lipow, president of Lipow Oil Associates.\n\n\"Of course, losing any refinery capacity when diesel supplies are at their lowest level for this time of year since the EIA began reporting in 1982 is not a good thing,\" Lipow wrote in a Friday note, referring to the Energy Information Administration.\n\nChevron's refinery at Pascagoula remains operational, spokesperson Ross Allen said Thursday. Vertex officials weren't immediately available for comment about its Saraland refinery.\n\n\" The biggest risk to these two refineries are a loss of electricity or flooding damage,\" Lipow wrote in a note Friday. If the refineries do shut down, it would take one to two weeks to restart them if they did not sustain damage, he said.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:43 PM IST", "pub_date_relative": "15m ago"}, {"title": "NBA commissioner says league wants access to prediction market data to detect manipulation", "full_content": "The NBA wants access to prediction market data to regulate and detect for insider trading, Commissioner Adam Silver told CNBC on Friday.\n\n\"Whether it's called a prediction market, whether it's sports betting, it's the same issues for our league and I think for all the leagues, there's issues around integrity first and foremost,\" Silver told CNBC's Contessa Brewer in a \" Squawk Box \" interview. \"We want access to that data. We also want control of the market.\"\n\nSilver called it \"odd behavior\" to have contracts related to whether a coach may be fired, for example.\n\nHis comments come after the NFL filed an amicus brief to the Supreme Court on Thursday, which supported New Jersey regulators and asserted that sports contracts on prediction markets fall under gambling and not financial swaps. The latter are regulated at the federal level by the Commodity Futures Trading Commission.\n\nThe brief also cited concerns on market manipulation on contracts related to player injuries or performance.\n\nThe NFL has urged the minimum age for traders should be 21 years old, which is the benchmark several states have for sportsbooks. Silver agreed with the age limit but supported federal authority over prediction market platforms instead.\n\n\"Frankly, from at least the NBA standpoint, we have roughly 40 different jurisdictions regulating us right now. So to have a consistent policy nationally, I think would be in our best interest,\" he said.\n\nThe move from the National Football League comes as volumes on NFL prediction market contracts have soared of late, with the season starting a month ago. The brief also arrives after multiple courts have ruled in favor of states overseeing prediction market exchanges instead of the CFTC.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:42 PM IST", "pub_date_relative": "16m ago"}, {"title": "South Africa lawyer 'Navi' Pillay wins Nobel Peace Prize for efforts to prosecute war crimes, genocide", "full_content": "Former International Criminal Court Judge Navanethem \"Navi\" Pillay was awarded the Nobel Peace Prize on Friday for her work promoting peace and international law.\n\nPillay has been instrumental in ensuring that war crimes, crimes against humanity and genocide are prosecuted, said J\u00f8rgen Watne Frydnes, chair of the Norwegian Nobel Committee.\n\nBorn into a family of Indian Tamil origin under apartheid in Durban, South Africa, Pillay has served as a judge on the High Court in South Africa, the International Criminal Tribunal for Rwanda and the International Criminal Court.\n\nShe served as United Nations high commissioner for human rights from 2008 to 2014.\n\n\"Navi Pillay has been at the forefront of the development of international law for decades,\" said Frydnes as he announced this year's laureate.\n\n\"From her involvement of standing and supporting Nelson Mandela and the prisoners of Robben Island to her being a key in all the major international court cases of our time.\"\n\nFrydnes said the committee hadn't yet been able to reach \"courageous\" Pillay to notify her of the award she has been given.\n\n\"My message to her would be 'if you see a Norwegian number calling, please pick up,'\" he told reporters from Oslo.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:42 PM IST", "pub_date_relative": "16m ago"}, {"title": "This AI infrastructure stock will rise on agentic AI boom, Bank of America says", "full_content": "Penguin Solutions is likely to be a major beneficiary of the potential agentic AI boom, which should support its share growth, per Bank of America.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:37 PM IST", "pub_date_relative": "22m ago"}, {"title": "Reliance Jio IPO price band revealed! Price band fixed at \u20b91,065- \u20b91,119: Report", "full_content": "The much-awaited initial public offering (IPO) of the Indian stock market has received another update. The Jio IPO price band has been fixed at \u20b9 1,065 to \u20b9 1,119 per share, Bloomberg reported, citing sources. Jio Platforms Limited is planning to launch its IPO for subscription on october and close two days later.\n\nThe telecom and digital services arm of billionaire Mukesh Ambani\u2019s Reliance Industries Ltd is targeting a market value of as much as 10.3 trillion rupees ($107 billion). Jio is yet to announce official details including price range, valuation and timing. These details could change as deliberations are underway, reported Bloomberg.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 07:36 PM IST", "pub_date_relative": "22m ago"}, {"title": "Federal Reserve Board releases results of the 2025 Survey of Consumer Finances, which provides the public and policymakers with detailed insights into the economic condition of American families", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 10:00 a.m. EDT Share --> --> --> --> --> --> The Federal Reserve Board on Friday released the results of the 2025 Survey of Consumer Finances, which provides the public and policymakers with detailed insights into the economic condition of American families.\n\nThe data provide a representative picture of what Americans own, how and how much they borrow, and how they bank. The current version of the survey has been undertaken every three years since 1989 and provides the public with an extensive time series of thorough information on the economic conditions of American families. Alongside the survey data, the Board issued its summary report entitled Changes in U.S. Family Finances from 2022 to 2025 (PDF) , which examines changes in income, net worth, assets, debt, and financial vulnerability.\n\nIn addition to the summary report, an interactive chartbook displaying changes in these financial characteristics over time is available here . Additional data from the survey, including extensive data examining other economic conditions of American families, is made available to researchers and the public here .\n\nThe survey is conducted for the Board by NORC, a social science research organization at the University of Chicago. Participants in the study are chosen at random from 119 geographic areas, including metropolitan areas and rural counties across the United States, using scientific sampling procedures that aim to produce a sample representative of American families.\n\nFor media inquiries, please email [email protected] or call (202) 452-2955.\n\nChanges in U.S. Family Finances from 2022 to 2025 Evidence from the Survey of Consumer Finances (PDF)", "source": "Federal Reserve", "pub_date_str": "09 Oct 2026, 07:30 PM IST", "pub_date_relative": "29m ago"}, {"title": "ICE won't pause enforcement in NY after Bronx shooting, DHS's Mullin says", "full_content": "U.S. Immigration and Customs Enforcement will not pause its activities in New York after ICE agents in the Bronx shot and wounded a man while he was in a car with a five-year-old child, Homeland Security Secretary Markwayne Mullin said Friday.\n\nThe shooting Thursday afternoon prompted furious rebukes of ICE from New York City Mayor Zohran Mamdani and New York Gov. Kathy Hochul, who said she asked Mullin and President Donald Trump to immediately halt operations in her state.\n\n\"We're not putting a pause on enforcement,\" Mullin said at a press conference Friday morning, which was intended to push back on the growing criticism over the latest ICE shooting.\n\n\"I'm sorry, we're not,\" Mullin said. \"In fact, I'm not sorry. Our job is to enforce the nation's laws and go after the worst of the worst, and our men and women do a dang good job at it every single day, and we will not stop doing our job.\"\n\nA man identified as Oscar Belgal, 28, was shot in the neck after two plainclothes ICE officers approached his vehicle as it backed into a parking spot in the Marble Hill neighborhood, New York City Police Commissioner Jessica Tisch said at a press conference Thursday evening.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:29 PM IST", "pub_date_relative": "30m ago"}, {"title": "Wall Street is pitching data centers as a major real estate bet. The risks are piling up", "full_content": "Data centers have divided America. The ire of everyday citizens continues to increase against a backdrop of enthusiastic and deep-pocketed Wall Street investors betting artificial intelligence is the economic engine of the future. And as data centers that power the answers for Google's Gemini, Meta's Muse, Anthropic's Claude and OpenAI's ChatGPT spread across the U.S. landscape, the financial firms are attempting to pitch investors on AI infrastructure as part of a real estate allocation that can diversify a portfolio.\n\nFor the most part, the funds from alternative investment companies promising investors a piece of the physical infrastructure powering the AI economy remain the province of institutional investors like pension funds. But the trend has to a limited degree also dipped into the retail investor market. Alternative investments giant Blackstone has been at the forefront, creating the Blackstone Digital Infrastructure Trust , a newly formed real estate investment trust, or REIT, that trades on the NYSE, earlier this year.\n\n\"We saw this as an opportunity to capture the whole market of stabilized data centers and build a home in the public market where we think it belongs,\" CEO Nick Pell said in a CNBC \"Squawk on the Street\" interview in May.\n\nWhile many new data center projects across the U.S. remain subject to shifts in public and political opinion \u2014 and various moratoriums including in the states of New York and Texas \u2014 the Blackstone REIT is primarily focusing on data centers in already mature markets such as Northern Virginia and Dallas, where sprawling data centers have had a significant presence that predates the AI boom.\n\n\"It is the lowest risk way to play,\" Pell said, adding that Blackstone can then hand-select data centers to offer investors from what it says is a $300 billion market. The company sold 87.5 million shares at $20 apiece in its mid-May debut.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 07:29 PM IST", "pub_date_relative": "30m ago"}, {"title": "As AT&T, Verizon and T-Mobile shares fall, Wall Street assesses the growing SpaceX threat", "full_content": "SpaceX still has a ways to go before it can seriously challenge the three major wireless operators, but it\u2019s making moves to grow its capabilities.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 07:29 PM IST", "pub_date_relative": "30m ago"}, {"title": "Pulse of the Street: Eight-week slide ends, but oil and earnings test recovery", "full_content": "Indian equities broke an eight-week losing streak, but the modest rebound offered limited reassurance as crude oil climbed above $100 a barrel and the central bank took a hawkish stance after a 25-basis-point rate hike.\n\nThe Nifty 50 rose 1.30% in the Friday session to 22,520.45, while the Sensex gained 1.23% to 72,472.33. Their weekly gains were narrower, at about 0.43% and 0.78%, respectively, halting the prolonged decline without establishing a convincing recovery.\n\nTanvi Kanchan, associate director at Anand Rathi Shares & Stock Brokers, described the advance as a relief rally, with elevated oil prices, rupee weakness and high US bond yields continuing to weigh on sentiment.\n\nValuations had become more supportive, she said, with the Nifty trading around 19 times trailing earnings, below its long-term median. A sustained recovery, however, would require easing foreign selling, broader sector participation and an end to earnings downgrades.\n\nSumit Singhania, head of research at Bajaj Broking, echoed this: \u201cA combination of falling crude, easing inflation and improving foreign flows would offer the clearest signal of a transition from the current cautious phase to a sustainable recovery.\u201d\n\nThe Reserve Bank of India's (RBI) monetary policy committee unanimously raised the repo rate by 25 basis points to 5.50%, its first increase since February 2023. It also raised its FY27 growth forecast to 7.1% and its inflation projection to 5.2%.\n\nStronger growth offers support for corporate revenues, but the shift to calibrated tightening leaves businesses facing higher financing costs alongside renewed energy pressures.\n\nKanchan said the growth upgrade suggested demand was holding up, but companies\u2019 ability to pass on costs would determine their profitability. Oil marketing companies, aviation, paints, chemicals and tyres were particularly exposed, while real estate, autos, consumer durables and smaller non-bank lenders faced pressure from higher borrowing costs.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 07:27 PM IST", "pub_date_relative": "32m ago"}, {"title": "US stocks: US market opens higher as oil slips; telecoms hit by SpaceX spectrum deal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks: US market opens higher as oil slips; telecoms hit by SpaceX spectrum deal Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: US market opens higher as oil slips; telecoms hit by SpaceX spectrum deal SECTIONS US stocks: US market opens higher as oil slips; telecoms hit by SpaceX spectrum deal Reuters Last Updated: Oct 09, 2026, 07:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Wall Street opened on a positive note this Friday as oil prices dipped, easing worries over Middle Eastern supply issues. The Dow Jones Industrial Average, S&P 500, and Nasdaq Composite each experienced a rise at the open. Nonetheless, the telecom industry faced headwinds following SpaceX's spectrum purchase, sparking competitive anxiety among its players, showcasing the market's mixed responses to sector-specific events.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 07:26 PM IST", "pub_date_relative": "32m ago"}, {"title": "Kalshi traders see high odds that more than 5,100 data centers will be planned or operating before 2027", "full_content": "Public backlash is rising against the construction of data centers, but Kalshi traders see a higher likelihood that the number of data centers planned or operating before the new year will top 5,000.\n\nPrediction market platform Kalshi shows a 75% chance that there will be more than 5,100 proposed and live data centers before 2027. In just two weeks, the likelihood has jumped from 60%.\n\nThe contract's odds will be resolved and verified by Data Center Map, which plots out planned and running data centers on its website.\n\nSo far, there are more than 4,700 operating and planned data centers in the U.S., according to Data Center Map. Among states, Virginia is in the lead with more than 670 planned and on-line facilities, followed by Texas with 537 and California with more than 200, Data Center Map found.\n\nTech companies have been growing their data center footprint in states like Texas , New Mexico and Arizona . The buildout has faced backlash from communities and activists who argue such projects would raise utility costs for locals and consume significant amounts of water.\n\nLast month Bloomberg reported , citing sources familiar, that Oracle sent its developer a \"force majeure\" notice tied to its New Mexico data center project in a bid to protect itself from higher expenses in the event the project doesn't come online in 2028 as anticipated.\n\nOracle's proposed data center also hit snags this summer after New Mexico regulators turned down applications for a gas pipeline project to fuel it, Bloomberg reported .\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:23 PM IST", "pub_date_relative": "35m ago"}, {"title": "SpaceX deal to acquire spectrum license hammers shares of AT&T, Verizon and T-Mobile", "full_content": "SpaceX announced an agreement on Thursday to purchase a nationwide spectrum portfolio as it pushes its Starlink service deeper into the U.S. telecommunications market.\n\nShares of AT&T , Verizon and T-Mobile all tumbled on Friday. SpaceX stock climbed about 2%.\n\nThe deal involves the acquisition of a spectrum portfolio from Grain Management, which specializes in digital infrastructure, and is subject to approval by the Federal Communications Commission. SpaceX said in a statement that it's a \"license portfolio of up to 14 megahertz of paired spectrum in the 800 MHz band.\"\n\n\"This prime low-band spectrum addresses one of the key remaining technical gaps that will pave the way for Starlink Mobile to become a major mobile carrier in the US,\" SpaceX said.\n\nIn a post on X, SpaceX CEO Elon Musk called it a \"very big deal.\"\n\nLast week, T-Mobile, AT&T and Verizon formed a joint venture \"focused on expanding coverage in underserved areas,\" via satellite and direct-to-device (D2D) services, and Starlink was notably absent. T-Mobile has also previously removed mention of Starlink from its T-Satellite promotions.\n\nT-Mobile, Verizon and AT&T stock chart SpaceX appears determined to battle telecommunications giants in the U.S., and deliver its own services without them.\n\n\"This adds fuel to the fire in the battle between SpaceX and the mobile operators,\" said TMF Associates' Tim Farrar, an industry expert. \"But it's still a very limited amount of spectrum and to get reliable building penetration in urban areas SpaceX would have to deploy towers on the ground.\"", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 07:22 PM IST", "pub_date_relative": "36m ago"}, {"title": "Jio Platforms said to set IPO price band, listing likely in October", "full_content": "Jio Platforms Ltd. is set to price its shares at \u20b9 1,065-1,119 apiece in its planned initial public offering, according to people familiar with the matter.\n\nThe company is targeting a market value of as much as \u20b9 10.3 lakh crore, the people said, asking not to be identified because the information isn\u2019t yet public. At the upper end of the price band, the Jio IPO would raise about \u20b9 30,200 crore, according to Bloomberg calculations. That would keep it on track to become India\u2019s largest-ever IPO.\n\nThe telecom and digital services arm of billionaire Mukesh Ambani\u2019s Reliance Industries Ltd. plans to open public subscription on 21 October and close it two days later, the people said. The anchor book is scheduled to open on 19 October, with the shares expected to begin trading on 28 October, they said.\n\nDeliberations are ongoing and details including the price range, valuation and timing could still change, the people said.\n\nA Reliance Industries representative did not offer any immediate comments.\n\nThe valuation falls short of some earlier expectations, though the offering is still poised to surpass Hyundai Motor India Ltd.'s \u20b9 27,800-crore share sale in October 2024, the country\u2019s biggest. That will be a major test of investor appetite for large share sales in one of the world\u2019s busiest markets for equity fundraising.\n\nJio filed its draft prospectus in June for an offering of as many as 270 million new shares, equivalent to about 2.93% of its post-issue equity capital, according to Bloomberg calculations. The company was earlier poised to seek a valuation of about \u20b9 11 lakh crore, people familiar with the matter have said. Valuations floated earlier were even higher, in the range of $130 billion to $170 billion at one point.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 07:22 PM IST", "pub_date_relative": "37m ago"}, {"title": "Should I put my nest egg in a 30-year Treasury bond?", "full_content": "Risk comes in many forms, even with \u201csafe\u201d investments.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 07:21 PM IST", "pub_date_relative": "38m ago"}, {"title": "OpenAI and Anthropic poach Trump officials as industry fights for Washington\u2019s trust", "full_content": "This report is from this week's The Tech Download newsletter. Like what you see? You can subscribe here.\n\nAnthropic and OpenAI are poaching officials from the Trump administration for senior roles as the AI sector scrambles to strengthen ties to Washington, with frontier tech increasingly viewed as a national security issue.\n\nThis year, Anthropic has appointed at least two former Trump officials, one to its board and another as the head of its frontier compute strategy. OpenAI has hired at least three from the president\u2019s administrations to work across strategy and special projects.\n\nCompanies developing frontier AI have been racing to build relationships with the U.S. President Donald Trump\u2019s White House, amid growing calls for regulation and in the wake of a number of cybersecurity incidents caused by rogue AI systems.\n\n\"Frontier AI companies are aware that the Trump administration has a lot of levers over their business, from federal procurement and supply-chain designations to export controls and everything in between, and that it's willing to use them,\" said Michelle Nie Duncan, visiting fellow with the technology and national security program at the Center for a New American Security.\n\n\"They have learned from the Anthropic episode that it pays to be on the good side of the White House,\" she told CNBC. A U.S. appeals court upheld a Pentagon designation of Anthropic as a supply chain risk in September, after a public spat between the two parties at the start of the year.\n\nOpenAI directed CNBC to previously released statements about two of its former Trump official appointments when approached for comment. Anthropic and the White House did not respond to a request for comment.\n\nWhile Trump has called AI safety concerns a \"hoax\" and advocated for self-regulation from AI companies, he has also said the Department of Justice and other law enforcement bodies could \"rein\" in AI.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 07:19 PM IST", "pub_date_relative": "39m ago"}, {"title": "How to downsize like a pro \u2014 and free yourself from being a \u2018prisoner of your possessions\u2019", "full_content": "Seven tips for painlessly moving in retirement.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 07:17 PM IST", "pub_date_relative": "42m ago"}, {"title": "Poonawalla Fincorp Q2 Results: Profit skyrockets 407% YoY to Rs 375 crore, NII rises 81%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Poonawalla Fincorp Q2 Results: Profit skyrockets 407% YoY to Rs 375 crore, NII rises 81% Poonawalla Fincorp Share Price L&T Finance Share Price Motilal Oswal Financial Services Share Price HDB Financial Services Share Price Piramal Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Poonawalla Fincorp Q2 Results: Profit skyrockets 407% YoY to Rs 375 crore, NII rises 81% SECTIONS Poonawalla Fincorp Q2 Results: Profit skyrockets 407% YoY to Rs 375 crore, NII rises 81% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 09, 2026, 07:13:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Poonawalla Fincorp reported a 407% year-on-year surge in Q2FY27 profit to Rs 375 crore, while net interest income rose 81%. Operating profit more than doubled, supported by business growth, improving asset quality and an expanded gold loan network.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 07:13 PM IST", "pub_date_relative": "45m ago"}, {"title": "Bull market turns four next week. Rallies that make it this far usually keep going", "full_content": "With all the consternation around bond yields and energy prices, Wall Street could use some positive news.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:12 PM IST", "pub_date_relative": "47m ago"}, {"title": "Anand Rathi Wealth Q2 Results: Profit rises 22% to Rs 122 crore; co declares dividend of Rs 4 per share", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Anand Rathi Wealth Q2 Results: Profit rises 22% to Rs 122 crore; co declares dividend of Rs 4 per share Anand Rathi Wealth Share Price 360 One Wam Share Price Nuvama Wealth Management Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Anand Rathi Wealth Q2 Results: Profit rises 22% to Rs 122 crore; co declares dividend of Rs 4 per share SECTIONS Anand Rathi Wealth Q2 Results: Profit rises 22% to Rs 122 crore; co declares dividend of Rs 4 per share By Akash Podishetti , ETMarkets.com Last Updated: Oct 09, 2026, 07:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anand Rathi Wealth reported a 22% year-on-year rise in Q2 business profit to Rs 122 crore, with revenue increasing 16%. Assets under management reached Rs 1.08 lakh crore as quarterly net inflows hit a record Rs 4,186 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 07:12 PM IST", "pub_date_relative": "47m ago"}, {"title": "Delta Air Lines cuts 2026 forecast on fuel surge, but CEO says demand is still strong", "full_content": "Delta Air Lines slashed its 2026 profit outlook as high fuel prices persist, but CEO Ed Bastian said higher fares aren't turning off travelers.\n\nDelta on Friday forecast full-year earnings per share of between $5.10 and $5.60 on an adjusted basis, compared with its outlook in July, when fuel prices were lower, of $6.50 to $7.50 a share. The company's fourth-quarter guidance was below analyst estimates, too.\n\nDelta cut its free cash flow outlook for the year to $2.5 billion, from as much as $4 billion it expected in July.\n\nStill, Bastian said in an interview that fares have continued to tick up as the airline passes along much of a $6 billion increase in fuel costs this year, and that travelers keep booking. Jet fuel prices in the U.S. Gulf of Mexico region have almost doubled to $4.34 on Thursday from $2.19 a year earlier, according to FactSet.\n\n\"The consumer response continues to be quite strong. We're seeing it across all channels, all cabins of service, all geographies, business, leisure,\" he said.\n\nDelta forecast a 20% increase in revenue for the fourth quarter over the same period last year, more than the 16% rise in the third quarter, when adjusting for the airline's benefit from its refinery in Trainer, Pennsylvania, where it refines crude oil into jet fuel and other products, giving it an advantage over other carriers.\n\n\"Obviously the fuel pricing, the volatility of fuel prices have something to do with that,\" Bastian said.\n\nDelta is the country's most profitable airline and the first to report results from the third quarter, which encompasses the busy summer season.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:08 PM IST", "pub_date_relative": "51m ago"}, {"title": "Stock Market Today: Dow, S&P 500 and Nasdaq open higher as tech stocks rebound - MarketWatch", "full_content": "Stock Market Today: Dow, S&P 500 and Nasdaq open higher as tech stocks rebound MarketWatch See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 07:08 PM IST", "pub_date_relative": "51m ago"}, {"title": "GST cancellation rules FAQs: Application process, approval and changes recommended at 57th Council meeting", "full_content": "If you are a business owner registered under the Goods and Services Tax ( GST ) regime, whether running a small enterprise or a large business, you need to know how to cancel your GST registration and comply with the prescribed rules.\n\nThe Press Information Bureau (PIB) published a set of Frequently Asked Questions (FAQs) on cancellation of GST registration on Friday.\n\nThe FAQs explain the cancellation process, application deadlines, automatic acceptance and cancellation of registration, and changes recommended by the GST Council at its 57th meeting on 8 October 2026.\n\nYou can apply for cancellation if your business has been completely discontinued, closed, or transferred.\n\nOther grounds include a change in the constitution of the business resulting in a new Permanent Account Number (PAN), amalgamation, demerger or disposal of the business, or when you are no longer liable to be registered under GST.\n\nTaxpayers should apply within 30 days of the event warranting cancellation. However, this time limit does not apply when the sole proprietor dies.\n\nAccording to the PIB FAQs, taxpayers must submit FORM GST REG-16 online through the official GST portal.\n\nLog in to the official GST portal, go to Services, then Registration, and then Application for Cancellation of Registration, and provide the reason for cancellation, the date from which you want the registration to be cancelled, closing-stock details, and any associated tax liabilities.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 07:04 PM IST", "pub_date_relative": "54m ago"}, {"title": "Half of India\u2019s MTF book is in smallcaps; Nithin Kamath flags liquidity risks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Half of India\u2019s MTF book is in smallcaps; Nithin Kamath flags liquidity risks The Economic Times daily newspaper is available online now. Read Today's Paper Half of India\u2019s MTF book is in smallcaps; Nithin Kamath flags liquidity risks SECTIONS Half of India\u2019s MTF book is in smallcaps; Nithin Kamath flags liquidity risks By Kumar Gaurav , ETMarkets.com Last Updated: Oct 09, 2026, 07:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Zerodha founder Nithin Kamath warned that small and microcap stocks account for a substantial share of India\u2019s margin trading facility book. He highlighted liquidity risks during market downturns, when smaller stocks may face sharper selling pressure.\n\nMost of the growth in the industry's MTF book is in small and microcaps. These are the stocks where liquidity tends to dry up first when markets either fall or go sideways, like they are right now\ud83d\ude2c https://t.co/qH7kJ6O8ut\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 07:01 PM IST", "pub_date_relative": "57m ago"}, {"title": "Aging bull: Why this 4-year-old stock-market rally still packs a punch", "full_content": "History shows bull markets that get past their fourth year rarely throw in the towel, according to Truist Advisory Services.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 07:00 PM IST", "pub_date_relative": "59m ago"}, {"title": "Relief rally in Indian stock market; biggest weekly losing streak in 25 years snapped: What's next for Sensex, Nifty?", "full_content": "After suffering its biggest weekly loss in 25 years, the Indian stock market caught its breath as frontline indices rebounded to close the week higher, with Friday\u2019s session accounting for the bulk of the gains.\n\nThe Nifty 50 closed Friday\u2019s session 1.30% higher, recovering much of the previous day\u2019s losses. The rally also marked the index\u2019s biggest single-day gain since August, helping it post a weekly gain of 0.44%.\n\nSimilarly, the Sensex ended the week 0.78% higher. The rally was largely supported by strong gains in financial stocks as investors cheered the companies\u2019 strong quarterly business updates.\n\nIn addition, IT stocks lent much-needed support to the market, as TCS\u2019 September-quarter results boosted sentiment across the sector. Investors largely brushed aside the US government\u2019s decision to suspend some IT firms from the Permanent Labor Certification programme (PERM), instead focusing on TCS\u2019 quarterly performance.\n\nThe move is part of a broader effort by Washington to curb pathways to permanent residency for certain foreign workers.\n\nThe markets had remained under pressure amid rising crude oil prices, with Brent crude trading above $100 per barrel as tensions in West Asia persisted amid the threat of potential attacks on Iran. India is a major importer of crude oil, making higher prices a key risk for inflation and growth.\n\nHowever, in a major development, US President Donald Trump said the US would not attack Iran before the midterm elections while also citing productive discussions with Tehran.\n\nCommodity traders took note of the latest remarks, pushing Brent crude below $103 a barrel. However, risks remain elevated, as Trump has made similar announcements in the past, only to reverse course later.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 06:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anand Rathi Wealth Q2 results 2026: Dividend declared; check amount, record date, net profit, revenue and key financials", "full_content": "Anand Rathi Wealth Q2 results 2026: Anand Rathi Wealth Limited, on Friday, reported a 10.37% year-on-year (YoY) decline in its net consolidated profit in the second quarter of financial year 2026-27. Despite decline in Q2 profit, the company announced first 80% interim dividend .\n\nEarlier in the day, the stock closed 4.68% lower, after seeing selling pressure throughout the trading session.\n\nAnand Rathi\u2019s board of directors considered and approved interim dividend of \u20b9 4 per equity share, which is 80% of the stock\u2019s face value of \u20b9 5. The company had earlier announced a final dividend of \u20b9 7 per equity share in April this year.\n\nThe announced payout will be disbursed among eligible shareholders within \u201c30 days from the date of declaration as per applicable provisions of Companies Act, 2013,\u201d stated the firm in its exchange filing released on October 9.\n\nThe board has fixed Thursday, October 15, as the dividend record date to determine the eligibility of shareholders for the payout. Investors must own the stock before the record date to qualify for the corporate action. Hence, Wednesday, October 14, effectively becomes the last date for investors to buy the stock and qualify for the dividend.\n\nThe company reported a net profit (attributable to owners of the firm) of \u20b9 88.95 crore in Q2FY27, which is 10.37% lower than \u20b9 99.26 crore of profit reported in the same quarter in previous financial year. Anand Rathi\u2019s net profit stood at \u20b9 162.73 crore in Q1FY27. The company\u2019s net revenue from operations increased to \u20b9 343.98 crore in Q2FY27, against \u20b9 297.36 crore reported in Q1FY27.\n\nIn the first half of financial year 2026-27, its Asset Under Management (AUM) increased 18% annually to \u20b9 1,08,377 crore. The firm\u2019s net revenue surged 17% annually to \u20b9 693 crore in H1FY27. Earnings per share (EPS) surged 22% to \u20b9 7.3.\n\nThe stock closed 4.68% lower at \u20b9 2038.70 per share on NSE on Friday. Its share price value has surged 38.14% in one year and 331.44% in three years.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 06:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia and Micron shares bounce as investors get clarity on a key OpenAI matter", "full_content": "A new report paints OpenAI\u2019s financial picture in a more optimistic light.", "source": "MarketWatch Top Stories", "pub_date_str": "09 Oct 2026, 06:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Teva wins FDA approval for monthly schizophrenia injection Weltruza", "full_content": "Teva said on Friday it had received approval from the U.S. Food and Drug Administration for Weltruza, a once-monthly injection for adults with schizophrenia.\n\nWeltruza is the second US-approved product from Israel-based Teva's partnership with French biotech company Medincell after Uzedy, a long-acting injectable form of antipsychotic drug risperidone, which the FDA approved in 2023.\n\nTeva, which leads the development and commercialization of Weltruza, said it expected to launch the drug in the US in the coming weeks.\n\nThe product uses Medincell's long-acting injectable technology, which is designed to release medicines over extended periods.\n\nThe long-acting formulation of antipsychotic medicine olanzapine may help address treatment-adherence challenges in schizophrenia and other chronic psychiatric illnesses.\n\nMedincell may be eligible for up to $112 million in additional development and commercial milestone payments under its agreement with Teva, along with royalties on sales.\n\nShares of Teva were up 2% in Tel Aviv at 11:24 GMT; Medincell shares were suspended upon the company's request ahead of the announcement.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 06:44 PM IST", "pub_date_relative": "1h ago"}, {"title": "Treasury's Bessent hires Trump's controversial former Fed board pick, Judy Shelton, as advisor", "full_content": "Judy Shelton, whose controversial economic ideas led the Senate to block her nomination to the Federal Reserve, has been appointed a counselor to Treasury Secretary Scott Bessent.\n\nThe Treasury said Shelton will advise Bessent on currency policy, \"with a particular focus on evaluating financial conditions in China.\"\n\nShelton is not known as a China expert. She authored \"The Coming Soviet Crash\" in 1989, followed by \"Money Meltdown,\" about the need for a unified international monetary regime, in 1994. Before joining Treasury, Shelton was a senior fellow at the Independent Institute, a free market think tank, and, before that, at the Hoover Institution at Stanford University. She holds a Ph.D. in business administration from the University of Utah.\n\n\"Throughout her career, she has specialized in analyzing the internal monetary and financial conditions of nations and their impact on exchange rates,\" The Treasury said in its announcement, which will be released later Friday.\n\nA bipartisan group of senators, including all Democrats and a handful of Republicans, rejected President Donald Trump 's 2019 nomination of Shelton as a Fed governor over her views on Fed independence, her support for the gold standard and her questioning whether the U.S. needed a central bank.\n\nHer appointment comes at what looks to be a time of turmoil at the Treasury regarding high-level personnel. A recent Wall Street Journal story cataloged seven Senate-confirmed officials who have left the department through the end of August. Only one position has been filled.\n\nBessent recently named David Zervos , former chief market strategist at Jefferies, as a counselor \u2014 the same job title as Shelton. Neither Shelton nor Zervos require Senate approval.\n\nCorrection: Shelton authored \"Money Meltdown\" in 1994. An earlier version misstated the year. David Zervos is former chief market strategist at Jefferies. An earlier version misspelled the firm's name.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 06:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tech stocks' resilience has puzzled investors. The options market could hold some clues", "full_content": "The unexpected never happens when you're looking for it, which may explain why tech stocks have remained so strong in the face of surging rates and questions about the AI complex. In the options pits, traders are the most prepared for a pullback since early Summer.\n\nThe Nasdaq-100 Index declined as much as 1.8% Thursday following a report from the Financial Times that ChatGPT owner OpenAI's revenues are coming up short. As the index slid, the number of open put contracts tied to the Invesco QQQ Trust relative to calls reached 1.49, the highest since the last week of June, according to Barchart data.\n\nThe metric isn't just the result of a one-day anomaly: the ratio has been moving in favor of puts since August, despite a steady climb in big-tech stock prices that culminated in a string of all-time highs up through Tuesday. On Wednesday, the two biggest options trades of the session, one in the State Street SPDR S&P 500 ETF Trust (SPY) and another in Meta Platforms (META), were bearish. In short, options traders have been loading up on protection on fears of a pullback, whether driven by rising rates of cracks in the AI narrative.\n\nInterpreting the message from the options market at this juncture is tricky. On the one hand, the buildup in hedges seen in the put/call ratio of QQQ suggests selloffs would be met with support as hedges turn to profit. One catch: the same ratio in the State Street SPDR S&P 500 ETF Trust (SPY) and S&P 500 Index (SPX) , is near average.\n\nAnd while the number of puts on QQQ increased Thursday, the biggest trades were actually bullish.\n\nInvesco QQQ Trust, 1 month At 11 a.m. ET, in the biggest trade of the session, there was a $15 million sale of almost 5,000 740-strike puts expiring in March. Those puts are less than $8 out-of-the-money, meaning the index needs to hold or rally for them to pay off.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 06:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Living with Mom and trading on margin. The regular investor gets in on Wall Street's record stock borrowing binge", "full_content": "HOUSTON \u2014 During a late night at home in May 2021, Hy Luu, a 29-year-old engineering consultant, was researching how to obtain more capital to invest in shares of Tesla .\n\nThat's when he discovered margin investing: the act of borrowing money from a broker to buy securities such as stocks, while using existing investments as collateral. Borrowing would give him more buying power, and he could pay it back as the stock appreciated. The main risk would be a margin call, or having to deposit more money into the account, if its value fell.\n\nLuu \u2014 who lives with his mother, Kim Nguyen, in a three-bedroom, two-bathroom house in Houston \u2014 decided to get her opinion on the topic, given that she used to work as an accountant and just so happened to still be awake that evening. The 66-year-old retiree found it interesting.\n\nThat was the reassurance he needed, and it wasn't long before he started using margin to invest in Tesla for the first time. A year or so later, he had amassed more than $100,000 of margin debt .\n\n\"I went really crazy,\" he told CNBC in an interview. \"The stock was going up, and so I was like, 'There's no way I could lose.'\"\n\nAfter five years of margin investing \u2014 including a period in 2022 where he worried that further declines in Tesla could trigger a margin call \u2014 Luu is working to pay down his largest margin balance ever. In June, he exercised $165,000 on five Tesla call options and bought 500 shares at $330 per share. After accounting for the cash in his account, this drove his borrowing to more than $156,000.\n\nTesla swung from below $370 a share to more than $430 during that month.\n\nBetween his Tesla investments, his company stock and 401(k) \u2014 while subtracting his margin debt as well as other debt he's accumulated, such as his car loan and student loans \u2014 Luu's net worth has skyrocketed to more than $800,000 from negative territory seven years ago.", "source": "CNBC World Economy", "pub_date_str": "09 Oct 2026, 06:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "How to shield your portfolio if AI goes ka-boom", "full_content": "If you still wanted to own stocks, it used to be impossible to avoid the fallout. Not any more", "source": "FT Markets", "pub_date_str": "09 Oct 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Adani Power shares: GQG Partners-managed entities cut stake to 5.72% from 5.74%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Adani Power shares: GQG Partners-managed entities cut stake to 5.72% from 5.74% Adani Power Share Price NTPC Share Price JSW Energy Share Price NLC India Share Price Jaiprakash Power Ventures Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Adani Power shares: GQG Partners-managed entities cut stake to 5.72% from 5.74% SECTIONS Adani Power shares: GQG Partners-managed entities cut stake to 5.72% from 5.74% By Kumar Gaurav , ETMarkets.com Last Updated: Oct 09, 2026, 06:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis GQG Partners entities sold 50.39 lakh Adani Power shares through on-market transactions, reducing their combined stake to 5.72% from 5.74%. The disclosure comes as the stock gains 27.05% in 2026 and the company expands into Bhutanese hydropower.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "09 Oct 2026, 06:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Student loan forgiveness is a ticking tax bomb again, study warns - USA Today", "full_content": "Student loan forgiveness is a ticking tax bomb again, study warns USA Today Student Loan Repayment Plan Changes Impact 13 Million Borrowers Forbes Louisiana borrowers to face biggest \u2018tax bomb\u2019 from student loan forgiveness Louisiana Illuminator How I\u2019m Talking to Clients About the New Federal Student Loan Rules Investopedia Student loan IDR forgiveness tax bomb warning 2026 Quartz", "source": "Google News Business", "pub_date_str": "09 Oct 2026, 06:26 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Nasdaq rises as tech shares rebound following sell-off: Live updates", "full_content": "The Nasdaq Composite rose on Friday following a losing session in which an underwhelming revenue report from OpenAI took some steam out of the high-flying artificial intelligence trade.\n\nThe tech-heavy Nasdaq added 0.6%. The S&P 500 climbed 0.3%, while the Dow Jones Industrial Average traded up 64 points, or 0.1%.\n\nThe State Street Technology Select Sector SPDR ETF (XLK) traded 1% higher. Tech shares broadly were led by a 2% gain in SpaceX . The Elon Musk-led space and satellite company rose on a deal to buy a nationwide spectrum portfolio. Shares of AT&T , Verizon and T-Mobile slid as investors wondered worried the agreement could drive up competition.\n\nOther tech names that advanced on Friday include Lumentum and KLA , which gained 8% and 2%, respectively.\n\nAI stocks dropped on Thursday after CNBC confirmed that OpenAI told investors that it saw $50 billion in annualized revenue at the end of September. Last month, a $68 billion figure was widely reported, though a person familiar with the matter said it also included gross revenue from partners.\n\nThe Nasdaq Composite dropped more than 1%, marking its biggest one-day loss since mid-August. Thursday marked the second down day in a row for the tech-heavy index after it climbed to fresh all-time records earlier in the week.\n\n\"The sell-off reflected extreme positioning imbalances that have further to unwind in our view, which is why the whole AI-linked tech stock complex is unlikely to simply stage a sharp, V-shaped rebound,\" wrote Adam Crisafulli of Vital Knowledge.\n\n\"When it comes to AI, the main issue isn't the gross vs. net issue with [annualized recurring revenue] but instead: 1) the fact that the standalone frontier labs are increasingly unattractive businesses ... and 2) growing signs that markets are pushing back on the tidal wave of AI-linked debt and equity being thrown at them,\" he added.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:57 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trump appoints committee to investigate statements by the Fed's Lisa Cook", "full_content": "President Donald Trump formally established a \"committee of inquiry\" to investigate allegations that Federal Reserve Governor Lisa Cook made false statements related to \"one or more mortgage instruments,\" the White House announced Friday.\n\nThe extraordinary announcement is the latest development in Trump's long-running effort to fire Cook, a nominee of former President Joe Biden, from the central bank's board. Trump, who frequently urges the Fed to lower interest rates, recently said the failure to do so by his handpicked chair Kevin Warsh is the fault of a \"hostile\" board.\n\nThe committee will be three executive branch officials, including Kevin Hassett, Trump's top economic aide and a chief defender of the administration's economic record, according to a presidential memorandum posted on the White House website and shared Friday on social media.\n\nThe other two members are Keith Sonderling, acting head of the Office of Government Ethics, and Equal Employment Opportunity Commission Chair Andrea Lucas, according to the notice, which is dated Wednesday. No outside, independent arbriters are mentioned.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:55 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Americans' debt problems are flashing a warning not seen since the Great Recession", "full_content": "The ability of U.S. families to stay current on their debts worsened over the past three years, hitting levels not seen since the aftermath of the global financial crisis, the Federal Reserve reported Friday.\n\nIn the central bank's Survey of Consumer Finances, researchers found that while wealth disparities narrowed somewhat, the ability to meet debt payments deteriorated significantly.\n\n\"Families were more likely to be behind on their financial obligations than at any point since the 2010 survey,\" stated the survey, a data-rich document the Fed releases every three years to chronicle the nation's financial health.\n\nThe nation in 2010 was just emerging from what became known as the Great Recession, a period that ran from December 2007 to June 2009. A collapse in the subprime mortgage market resulted in contagion across the largest financial institutions in the U.S. and the world, sending unemployment at one point to 10%.\n\nAccording to the new findings, the portion of families behind on loan payments at the end of 2025 soared from about 12% in the prior survey to nearly 20%, a gain of some 67%. Those behind by two months or more also accelerated considerably, moving to more than 8% from 5% in 2022.\n\nWhile the report covered the period through 2025, concerns over financial health have persisted. A New York Fed survey released earlier this week showed that households reported their financial situations had worsened from a year ago and were likely to be weaker in the year ahead.\n\nAt the same time, the net worth of higher earners soared, with those in the top income group seeing their median net worth rise 31%.\n\nThe share of debt to income also posted a large gain. Families with payment-to-income ratios of greater than 40% jumped to 8.6%, up from 6.5% in 2022 and the highest level since 2013.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:54 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "UPI MDR: Will ordinary consumers be charged for making online payments to friends, family, or personal contacts?", "full_content": "The government recently decided to end over six years of zero-fee Unified Payments Interface (UPI) usage by introducing a 0.4% surcharge on merchant transactions greater than \u20b9 2,000. The decision generated immediate friction among local business owners.\n\nThe UPI network powers payments for more than 500 million consumers purchasing everyday items\u2014from street tea to smartphones\u2014across Asia's third-largest market.\n\nAs public confusion mounted regarding potential fees on general consumer shopping and peer-to-peer transfers, the government issued key clarifications.\n\nAnswer: No, UPI services will continue without any cost to consumers. Consumers can continue to transact free-of-cost using UPI as they have been doing till now.\n\nConsumers making payments through UPI will not face any charges. Individual account holders can continue using UPI applications for all routine, daily expenses without worrying about any charges. The MDR policy ensures that UPI remain free and accessible for all citizens across India.\n\nAnswer: No, P2P transactions will continue to be free-of-cost for both payer as well as beneficiary. There will be no charges for any person transferring or receiving any amount to or from any other person (or even self-transfers) using UPI.\n\nWhether you are transferring money to a family member, splitting a bill with friends, or performing self-transfers across your own linked bank accounts, zero charges apply. Citizens can freely make transfers on UPI of any permitted amount without incurring any transaction fees.\n\nNow, officials are weighing a multi-month delay for the rollout on larger transactions, according to regulatory and industry sources cited by Reuters . While the National Payments Corporation of India has yet to issue its formal ruling, a verdict is anticipated shortly.", "source": "LiveMint Money", "pub_date_str": "09 Oct 2026, 07:53 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Quantitative Methods", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Hurricane Isaias disrupts U.S. oil production in Gulf of Mexico, threatens refineries", "full_content": "Hurricane Isaias is disrupting U.S. crude oil production in the Gulf of Mexico and could limit about 2% of the country's refining capacity, at a time when fuel markets are already tight around the world.\n\nIsaias is churning toward Mississippi, Alabama and the Florida panhandle as a Category 3 storm with maximum sustained winds of 120 miles per hour, according to the National Hurricane Center , and is expected to make landfall Friday night or early Saturday.\n\nAs of Thursday, oil companies had shut in about 1.3 million barrels per day, or roughly 63% of total U.S. production in the Gulf, according to the Bureau of Safety and Environmental Enforcement .\n\nThe hurricane appeared to be veering away from the dense refining region in southern Louisiana near New Orleans and Baton Rouge.\n\nBut the storm could affect Chevron's refinery in Pascagoula, Mississippi, and a Vertex Energy refinery in Saraland, Alabama. Both areas are under hurricane warnings. The facilities there can produce a combined 466,000 bpd, or 2.4% of U.S. refining capacity, said Andy Lipow, president of Lipow Oil Associates.\n\n\"Of course, losing any refinery capacity when diesel supplies are at their lowest level for this time of year since the EIA began reporting in 1982 is not a good thing,\" Lipow wrote in a Friday note, referring to the Energy Information Administration.\n\nChevron's refinery at Pascagoula remains operational, spokesperson Ross Allen said Thursday. Vertex officials weren't immediately available for comment about its Saraland refinery.\n\n\" The biggest risk to these two refineries are a loss of electricity or flooding damage,\" Lipow wrote in a note Friday. If the refineries do shut down, it would take one to two weeks to restart them if they did not sustain damage, he said.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:43 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "NBA commissioner says league wants access to prediction market data to detect manipulation", "full_content": "The NBA wants access to prediction market data to regulate and detect for insider trading, Commissioner Adam Silver told CNBC on Friday.\n\n\"Whether it's called a prediction market, whether it's sports betting, it's the same issues for our league and I think for all the leagues, there's issues around integrity first and foremost,\" Silver told CNBC's Contessa Brewer in a \" Squawk Box \" interview. \"We want access to that data. We also want control of the market.\"\n\nSilver called it \"odd behavior\" to have contracts related to whether a coach may be fired, for example.\n\nHis comments come after the NFL filed an amicus brief to the Supreme Court on Thursday, which supported New Jersey regulators and asserted that sports contracts on prediction markets fall under gambling and not financial swaps. The latter are regulated at the federal level by the Commodity Futures Trading Commission.\n\nThe brief also cited concerns on market manipulation on contracts related to player injuries or performance.\n\nThe NFL has urged the minimum age for traders should be 21 years old, which is the benchmark several states have for sportsbooks. Silver agreed with the age limit but supported federal authority over prediction market platforms instead.\n\n\"Frankly, from at least the NBA standpoint, we have roughly 40 different jurisdictions regulating us right now. So to have a consistent policy nationally, I think would be in our best interest,\" he said.\n\nThe move from the National Football League comes as volumes on NFL prediction market contracts have soared of late, with the season starting a month ago. The brief also arrives after multiple courts have ruled in favor of states overseeing prediction market exchanges instead of the CFTC.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:42 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "This AI infrastructure stock will rise on agentic AI boom, Bank of America says", "full_content": "Penguin Solutions is likely to be a major beneficiary of the potential agentic AI boom, which should support its share growth, per Bank of America.", "source": "CNBC Top News", "pub_date_str": "09 Oct 2026, 07:37 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Reliance Jio IPO price band revealed! Price band fixed at \u20b91,065- \u20b91,119: Report", "full_content": "The much-awaited initial public offering (IPO) of the Indian stock market has received another update. The Jio IPO price band has been fixed at \u20b9 1,065 to \u20b9 1,119 per share, Bloomberg reported, citing sources. Jio Platforms Limited is planning to launch its IPO for subscription on october and close two days later.\n\nThe telecom and digital services arm of billionaire Mukesh Ambani\u2019s Reliance Industries Ltd is targeting a market value of as much as 10.3 trillion rupees ($107 billion). Jio is yet to announce official details including price range, valuation and timing. These details could change as deliberations are underway, reported Bloomberg.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "09 Oct 2026, 07:36 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Federal Reserve Board releases results of the 2025 Survey of Consumer Finances, which provides the public and policymakers with detailed insights into the economic condition of American families", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 10:00 a.m. EDT Share --> --> --> --> --> --> The Federal Reserve Board on Friday released the results of the 2025 Survey of Consumer Finances, which provides the public and policymakers with detailed insights into the economic condition of American families.\n\nThe data provide a representative picture of what Americans own, how and how much they borrow, and how they bank. The current version of the survey has been undertaken every three years since 1989 and provides the public with an extensive time series of thorough information on the economic conditions of American families. Alongside the survey data, the Board issued its summary report entitled Changes in U.S. Family Finances from 2022 to 2025 (PDF) , which examines changes in income, net worth, assets, debt, and financial vulnerability.\n\nIn addition to the summary report, an interactive chartbook displaying changes in these financial characteristics over time is available here . Additional data from the survey, including extensive data examining other economic conditions of American families, is made available to researchers and the public here .\n\nThe survey is conducted for the Board by NORC, a social science research organization at the University of Chicago. Participants in the study are chosen at random from 119 geographic areas, including metropolitan areas and rural counties across the United States, using scientific sampling procedures that aim to produce a sample representative of American families.\n\nFor media inquiries, please email [email protected] or call (202) 452-2955.\n\nChanges in U.S. Family Finances from 2022 to 2025 Evidence from the Survey of Consumer Finances (PDF)", "source": "Federal Reserve", "pub_date_str": "09 Oct 2026, 07:30 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Wall Street is pitching data centers as a major real estate bet. The risks are piling up", "full_content": "Data centers have divided America. The ire of everyda
