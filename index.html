<script>

    const allData = {"general": [{"title": "Trump says he is 'going to look at' joining Saudi Arabia in the fight against Iran-backed Houthis after deadly airport strike", "full_content": "President Donald Trump said he is considering joining Saudi Arabia in its retaliation against Tehran-backed Houthis in Yemen after a deadly attack on Riyadh's main airport, a move that could draw the U.S. further into a second front in the Iran war .\n\n\"We may. We're going to look at it,\" Trump told reporters outside the White House on Saturday when asked if the U.S. would back Saudi Arabian strikes. \"We just found out about the recent attack. So, we'll make a decision. We move very quickly.\"\n\nTwo Saudi Arabian government officials told MS NOW that the kingdom is requesting \"urgent defense support\" from the U.S. following the attacks.\n\nThe officials, including a senior member of the Ministry of Foreign Affairs, did not want to be identified because of the matter's sensitivity. They added that the U.S. needs to intervene \"as soon as possible\" to help the Saudi-led coalition in Yemen fight the Houthis.\n\nThe White House did not immediately respond to a CNBC request for comment.\n\nThe Saudi General Authority of Civil Aviation said the attack on King Khalid International Airport in Riyadh killed 12 people and injured 309 others, the country's official Saudi Gazette media outlet reported .\n\nColonel Turki Al-Maliki, the spokesman for the Saudi-led Coalition to Support Legitimacy in Yemen, which has been leading the fight against the Houthis, described the attack as a \"war crime.\"\n\n\"Therefore, the Joint Forces Command of the Coalition will respond decisively to this terrorist attack in accordance with the Customary International Humanitarian Law,\" Al-Maliki said in a post on X.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 07:39 PM IST", "pub_date_relative": "7m ago"}, {"title": "AI\u2019s quiet safety gatekeepers are stepping into the spotlight", "full_content": "Two months ago, independent evaluators occupied a relatively sleepy corner of the multitrillion-dollar artificial intelligence industry. Now they're being asked to come to its rescue.\n\nWhile Anthropic and OpenAI are at the heart of a fierce debate over whether they can safeguard their advanced models and grow their businesses simultaneously, they're seeking support from a handful of small third-party groups like Model Evaluation and Threat Research (METR), Apollo Research, and Transluce.\n\nThe evaluators, which mostly operate as nonprofits, are still finding their footing in an industry where capital is flowing at historic levels and new models are rolling out faster than ever. Their primary role has been to assess AI model capabilities and risks and to flag instances where the technology behaves badly.\n\nWithout a federal push for regulation, evaluators have taken on outsized importance. Anthropic CEO Dario Amodei pledged to embed independent evaluators in his company last month \u2013 a move that OpenAI CEO Sam Altman quickly endorsed . President Donald Trump supported the idea, as did most of the largest U.S. tech companies. But left unanswered are questions about how those third parties should be funded, what level of access they will have and what the reporting structure will ultimately look like.\n\n\"To a degree, the problem, as always, is money,\" Suresh Venkatasubramanian, a computer science professor at Brown University, told CNBC in an interview. \"Who is paying for these companies to do their work? How are they going to support them? You need an ecosystem, you need a viable business model for this.\"\n\nRight now, Anthropic, OpenAI and the infrastructure partners that are profiting from the AI boom are writing the rules.", "source": "CNBC World Economy", "pub_date_str": "11 Oct 2026, 07:38 PM IST", "pub_date_relative": "8m ago"}, {"title": "We\u2019re about to get a huge read on whether earnings can keep propping up the stock market", "full_content": "High hopes for third-quarter earnings are outweighing concerns around interest rates and oil prices \u2014 but one expert warns markets have gotten \u201cextremely complacent.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 07:30 PM IST", "pub_date_relative": "17m ago"}, {"title": "Food delivery stock to buy: Eternal shares - 36% returns in 6 months by Zomato parent | 22% more upside ahead?", "full_content": "Food delivery stock to buy: Shares of Eternal Limited have delivered nearly 36% return in six months. Continued strong growth in quick commerce, improving customer retention and better operating efficiency are likely to boost the outlook for the Zomato parent firm, according to experts.\n\nEternal share price ended marginally higher on Friday after gaining nearly 3% over the last week. As the stock has also delivered promising returns over the past six months, experts continue to remain bullish on the stock.\n\nImprovement in Blinkit sales, strong retention and growing customer base are likely to support Eternal business. Additionally, affordability is driving growth without hurting margins of Eternal, according to Joindre Capital Services Limited, which sees strong growth potential in District , Eternal\u2019s going-out app for movie tickets, live events, dining and sports-venue bookings.\n\n\u201cThe outlook remains positive, led by continued strong growth in quick commerce, improving customer retention and better operating efficiency. Management indicated that Blinkit\u2019s long-term adjusted EBITDA margin guidance has been raised to around 6% from the earlier 5\u20136% range, supported by higher capex per store, larger store formats and improving productivity,\u201d read the brokerage report.\n\nStrong competition in the quick commerce space is a key concern for Eternal growth. Growth in Blinkit\u2019s business depends on winning through density and execution rather than price.\n\nThe brokerage gave a \u2018Buy\u2019 rating for the new-age company stock with a target price of \u20b9 390 per share. \u201cWe assign a BUY rating to Eternal Ltd. with a target price of Rs. 390, implying an upside of 22.1%, based on an SOTP valuation,\u201d stated the brokerage in its report.\n\nEternal share price closed marginally higher at \u20b9 323.35 per share on BSE on Friday, October 9. Its share price value has surged 10.64% in three months, 35.92% in six months, and 14% in 2026 so far.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 07:26 PM IST", "pub_date_relative": "20m ago"}, {"title": "Some in Florida and Alabama without power as Isaias moves north to Appalachians and Mid-Atlantic", "full_content": "Nearly 396,000 customers across the Florida Panhandle and southern Alabama remained without power early Sunday as remnants of Isaias moved north, where widespread moderate to heavy rainfall was expected across the central Appalachians and mid-Atlantic region.\n\nHeavy rainfall was expected to be the \"primary hazard\" as the storm moves north, said Philippe Papin, a senior hurricane specialist at the National Hurricane Center in Miami. Parts of the southeastern U.S. and mid-Atlantic could see scattered power outages and downed trees and power lines. Life-threatening surf and rip current conditions were expected to continue along the Gulf and southeastern Atlantic coasts, according to the National Weather Service.\n\n\"We're expecting that heavy rainfall to continue here across the central Appalachians into the mid-Atlantic here during the day on Sunday, and we're still expecting isolated flash and urban flooding, and there may be also some residual gusty winds associated with the system as it continues to kind of move up the spine of the Appalachian mountains,\" Papin said.\n\nAt least four deaths were linked to the storm, including two people killed when trees fell onto homes in Florida and Alabama.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 07:25 PM IST", "pub_date_relative": "21m ago"}, {"title": "How much cash to hold in a savings account while waiting for a market correction?", "full_content": "I have a substantial amount sitting in my savings account because I\u2019m waiting for a better entry point in the market. How do I decide how much cash is sensible to hold and how much is simply money sitting on the sidelines?\n\nWhen markets are uncertain, holding some money in your savings account can provide a sense of security. You have the flexibility to invest if markets correct, but how do you know when the right time to invest is? Even though holding cash may feel like the safer choice, it may not always be the right one. So, where do you start?\n\nA good place to start is by setting your financial goals and looking at when you will need the money. Goals that are one to two years away need greater stability, so the money can be kept in debt. For goals that are two to five years away, you can consider a mix of equity and debt . Goals that are more than five years away give you more time to take a growth-oriented approach.\n\nOnce you have clarity on your goals, look at your overall asset allocation. For a long-term portfolio, you can consider allocating 60\u201380% to equity, with the remaining amount invested in debt-oriented products. Equity can provide the growth needed over the long run, while debt can bring stability to the portfolio. As you get closer to a goal, you can gradually move the money towards more stable investments.\n\nOnce you have decided your asset allocation, the next step is to choose the right investments within each part of the portfolio. For equity, around five funds across categories such as large cap, mid cap , small cap, flexi cap, and multi cap can be a starting point. The right combination will depend on your existing portfolio and the diversification you need. For the debt portion, options such as target maturity funds or arbitrage funds can be considered, depending on your tax bracket and liquidity needs.\n\nThere is another part of the plan that is important when you are investing for the long term.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 07:17 PM IST", "pub_date_relative": "29m ago"}, {"title": "Joby Aviation chief policy officer sells $30,645 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 07:16 PM IST", "pub_date_relative": "31m ago"}, {"title": "Renault CEO calls EU-China hybrid import deal a \u2019major milestone\u2019 - Bloomberg", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 07:14 PM IST", "pub_date_relative": "32m ago"}, {"title": "Middle East war, high debt levels to dominate IMF-World Bank meetings in Bangkok", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 07:06 PM IST", "pub_date_relative": "40m ago"}, {"title": "VinFast faces earnings test as Asia expansion meets profitability push", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 07:05 PM IST", "pub_date_relative": "42m ago"}, {"title": "Pacira BioSciences SVP Lauren Riker sells $217,920 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 07:01 PM IST", "pub_date_relative": "46m ago"}, {"title": "AI is automating coding. So why are software developer job postings on the rise?", "full_content": "U.S. software development job postings have risen since February 2025, the launch date for Anthropic's Claude Code, even as overall job postings fell, complicating predictions that AI would rapidly erase demand for developers.\n\nConcerns about the future of the software development career are well-founded, and intensified as companies adopted AI-powered coding tools, especially as those tools keep getting better. As far back as 2023, Microsoft's software development platform GitHub said that on projects where AI was available, it was close to writing half of all code.\n\nSome AI experts claim AI-written code across the entire GitHub platform has now passed the halfway mark . GitHub has not confirmed that, but in October it did report that one in three \"pull requests\" \u2014 the process in which coders that collaborate on development propose code changes for projects \u2014 now involve an AI agent. A year ago, GitHub said that number was fewer than one in 10. \"If that pace holds, within the next two years, most of the code pushed to GitHub could be written by an agent. Much of it may never be fully read by a human,\" it stated .\n\nLabor market researchers say that against this backdrop, the profession is evolving rather than disappearing. Data from Indeed Hiring Lab shows that U.S. software-development job postings have risen nearly 15% since February 2025, bucking both the overall job market and the coding data.\n\nSome economic experts are pointing to the rebound in software job postings as confirmation for a glass half-full view of AI and the job market. \"It wasn't that long ago that we were reading the headline that there will be no more need for software developers,\" Eric Kutcher, North America chair at McKinsey, said during a recent interview on CNBC's \"Squawk on the Street.\" Instead, he said, as companies are producing more code than ever before, software developers who work with AI remain in high demand.", "source": "CNBC World Economy", "pub_date_str": "11 Oct 2026, 07:00 PM IST", "pub_date_relative": "47m ago"}, {"title": "EV stock to buy: Ather Energy shares - 130% returns in a year, Bank of Baroda Caps sees 19% more upside | Target price", "full_content": "EV stock to buy: Nearly one-and-a-half years after its listing, Ather Energy has emerged as one of the newest multibagger stocks of Dalal Street. Despite its nearly 130% rally in one year, experts are still bullish on the stock. Bank of Baroda Caps sees nearly 19% more upside potential in the EV stock.\n\nAther Energy share price closed with 2% gain on Friday, after seeing sharp volatility throughout the week.\n\nAther Energy share price is likely to benefit from its business growth led by capacity boost, lower cost architecture and battery led BOM savings to aid gross margins.\n\nThe Bengaluru -headquartered EV maker is venturing into \u20b9 1-1.25 lakh segment with Konarc/EL launch. Its established premium technology-driven regional brand recognition and shift to convenience segment are likely to help spread \u201cits wings in the mass market segments\u201d, noted BOBCAPS in its report.\n\n\u201cWe value Ather at 16x Sep 2028 M-cap/Gross Block, 20% below the average valuation of TVS and BJAUT two key companies (leaders in EV segment) in the 2-W segment,\u201d read the BOBCAPS report.\n\nThe brokerage gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 1,680 per share. \u201cWe value Ather at 16x Sep 2028 M-cap/Gross Block ratio, 20% below average valuation of TVS and BJAUT, arriving at TP of Rs1,680, BUY.\u201d\n\nThe stock closed 2.01% higher on Friday at \u20b9 1431.25 per share on BSE. Its share price value has 74% in six months, and 94% in 2026 so far (YTD), as per BSE data. The EV stock has delivered a whopping 129.44% return in one year. The stock debuted on Dalal Street on May 6, 2025.\n\nAther Energy made a modest debut above its issue price, and closed lower on its first trading day.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 06:50 PM IST", "pub_date_relative": "56m ago"}, {"title": "Roblox corp chief legal officer sells $250,421 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 06:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cytokinetics EVP Fady Malik sells $214,830 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 06:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cathie Wood sells $15.8 million of popular semiconductor stock - TheStreet", "full_content": "Cathie Wood sells $15.8 million of popular semiconductor stock TheStreet", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 06:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "8th pay commission: What are the upcoming state visit dates in October? Check agenda", "full_content": "The 8th central pay commission (CPC) is in its consultation stage and has scheduled meetings in Mumbai later this month, in order to hold discussions with employee unions, representatives, groups, pensioner associations, federations, and other stakeholders, before releasing its official recommendations.\n\nEstablished by the central government every 10 years to revise the allowances, pay and pensions of its employees, the pay commission or CPC, is responsible for decisions on contributions, retirement benefits and government spending. All central government employees and retired former servicemen are impacted by the revisions.\n\nOverall, the recommendations are set to benefit over 1 crore individuals, including about 50 lakh central government employees and close to 65 lakh pensioners , including personnel and retirees with the defence and railway ministries.\n\nThe 8th CPC is chaired by former Supreme Court Justice Ranjana Prakash Desai , with Pankaj Jain, a former IAS officer as Member-Secretary, and Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister as Member of the Commission.\n\nThey are is gathering views and inputs from stakeholders such as employee unions, labour groups, ministries, pension bodies and more, which will be analysed to decide allowances, pension formula and salary structures for the relevant employee and retiree groups. The current panel is the Centre's eight since Independence. It was constituted by Prime Minister Narendra Modi last year and issued its Terms of Reference (ToR) in November.\n\nData, suggestions and feedback is also solicited before the Commission provides its final recommendations. Notably, official meetings started in March, while windows for data and suggestion submissions closed by July.\n\nMumbai \u2014 22-23 October 2026: The 8th CPC will visit Mumbai from 22-23 October (Thursday-Friday).", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 06:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "EOS Climbs 11% As Investors Gain Confidence", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 06:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Zymeworks EVP Adam Schayowitz sells $357,557 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 06:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank earnings, CPI headline busy markets week as S&P 500 hovers near records", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "The bull market is turning 4 years old \u2014 but yields could crash the party", "full_content": "For four years, tech has been the answer to almost every question about this bull market.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ola Electric \u20b91k cr rights issue: Check dates, per share price, face value, premium, record date, ratio - Details", "full_content": "Ola Electric \u20b9 1,000 crore right issue: Shares of Ola Electric Mobility will remain in focus in the coming week ahead of the record date for its right issue. The EV maker has fixed Tuesday as the crucial date to determine eligibility of shareholders.\n\nOla Electric Mobility share price closed nearly 1.83% higher during Friday\u2019s trading session after seeing steep decline in the previous trading session.\n\nThe Bhavish Agarwal-led EV manufacturer had approved the offer and issuance of partly paid-up equity shares of the company for an amount not exceeding \u20b9 1,000 crores by way of a rights issue.\n\nThe rights issue will be carried out in accordance with Companies Act, 2013, as amended and the rules made thereunder, the Securities and Exchange Board of India (Issue of Capital and Disclosure Requirements) Regulations, 2018.\n\nThe company\u2019s board has approved 37,02,72,665 rights equity shares each for an amount aggregating to \u20b9 9,99,73,61,955 (approximately \u20b9 1,000 crore). The company has fixed rights issue price at \u20b9 27 per equity share with a face value of \u20b9 10 each. The issue will also include a premium of \u20b9 17 per equity shares.\n\nThe firm has fixed Tuesday, October 13, as the record date to determine the eligibility of shareholders for the issu. Which makes Monday, October 12, as the last date for investors to purchase the stock to qualify for the corporate action.\n\nThe rights issue will open on Thursday, October 22, 2026, and is likely to remain open for nearly a week. The corporate action will close for investors on Friday, Oct 30, 2026\n\nPrior to the rights issue, company\u2019s outstanding shares stood at 4,62,84,08,313, which will increase to 4,99,86,80,978 equity shares post the corporate action, if the issue is fully subscribed in the duration.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 06:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "NBA commissioner Adam Silver says league could introduce \u2018smart ball\u2019 technology as soon as next year", "full_content": "NBA Commissioner Adam Silver says the league could begin using a new \"smart ball\" in games as soon as 2027, potentially transforming how officials make calls on the basketball court.\n\nIn an interview with CNBC's Contessa Brewer , Silver revealed that the NBA is working with official basketball manufacturer Wilson to develop a ball embedded with a tiny microchip Bluetooth sensor that can track movement, spin and changes in trajectory.\n\n\"We're experimenting with putting a small chip in the ball that weighs roughly a gram,\" Silver said.\n\nThe technology has already been tested in the NBA's G League, Summer League, and some preseason games, where players used basketballs both with and without the chip. Silver said players have been pleased with the results.\n\n\"Nobody could tell the difference. So that's a good sign,\" he said.\n\nThe chip weighs just one gram, compared with the roughly 620-gram or 1.4 pound basketball. Silver said the league wanted to ensure that even the most experienced players wouldn't notice a change in how the ball feels or bounces.\n\nSilver said the technology could help referees determine whether a player touched the ball before it went out of bounds by detecting subtle changes in its spin. It could also help identify whether a shot's trajectory was altered.\n\n\"I think you could see as soon as next year us using it for officiating in our games,\" Silver said.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 06:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "IndiGo Delhi-Chennai Flight Diverted After Power Bank Catches Fire On Board", "full_content": "An IndiGo flight travelling from Delhi to Chennai was diverted to Hyderabad after smoke was detected from a passenger's electronic device. The aircraft landed safely, and an alternate plane was arranged to take passengers to Chennai.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 06:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "I\u2019m a psychologist who studies couples: The No. 1 way to end a fight before it escalates\u2014it works \u2018almost immediately\u2019", "full_content": "You might start out talking about something real and specific. Maybe a plan that was altered without a check-in or an impulse purchase that should have been discussed. Then suddenly you've stopped talking about that thing and started talking about each other:\n\nOne minute you're trying to solve a problem together, and the next you're each trying to prove you're the more reasonable person in the room. And once an argument becomes about that, it can't really be resolved. Because now, the battlefield and ammunition are endless.\n\nAs a psychologist who studies couples, I know that, thankfully, there's a practice that can act as a guardrail for disagreements. I call it a partial yield, and it prevents this all-too-familiar detour.\n\nA partial yield is a type of phrase you use when you concede the specific piece of the argument you're genuinely responsible for, the moment it comes up, without conceding the rest of your position. It usually sounds very ordinary:\n\nSo you're not agreeing that you were wrong about everything. But you are admitting the fault that's actually yours, before your partner has to pry it out of you.\n\nWhen your partner confronts you, some part of them is preemptively braced for the effort of convincing you. It's why voices get louder and why examples start piling up. They're not trying to hurt you. They're trying to get you to believe them, and they've assumed it's going to be hard.\n\nA partial yield releases the pent-up steam that can otherwise fuel an escalation. The effect is palpable almost immediately, and it rarely feels like a defeat for either person. Your partner gets the acknowledgment they were pushing for, and you get to be honest about your part without signing away the rest.\n\nIt's also easier on you than a full apology, which matters more than you might think. Most of us don't withhold small admissions because we believe we did nothing wrong.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 06:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nana Patekar Died Of Heart Attack Caused By Blood Clot In Coronary Artery: Autopsy Report", "full_content": "The postmortem report cited the cause of death as 'acute myocardial infarction due to left main coronary artery thrombosis secondary to atherosclerotic occlusive coronary artery disease' and classified it as a natural death.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 06:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pope Leo XIV will undergo surgery to remove a nodule on his lung", "full_content": "Pope Leo XIV announced Sunday that he will undergo surgery in the coming days to remove a nodular lesion on his lung that was recently discovered during medical checks.\n\nThe 71-year-old pope said the nodule was found early and was \"circumscribed,\" or well localized. The Vatican later said Leo would undergo surgery in the first days of the week, with an expected recovery time of a week.\n\nThe American pope made the announcement during his Sunday noon blessing. He thanked the crowd for their closeness and entrusted himself to their prayers.\n\nA lung nodule is a small abnormal area measuring less than 3 centimeters (1 inch) that sometimes appears on a CT scan of the chest or abdomen, according to the American Cancer Society. Often, the scans are done to investigate trauma or a lung infection, unrelated to a lung cancer screening.\n\nLeo has no previously known health problems and is considered physically active, with weekly tennis games and swimming at the papal summer retreat in Castel Gandolfo.\n\nThe pope has a major trip planned Nov. 6-17 to Uruguay, Argentina and Peru. It's unclear whether the planned surgery and recovery would affect the itinerary, but Leo said earlier in his remarks Sunday that he planned to go.\n\nIn his remarks, delivered in Italian, Leo said during a recent medical check, \"doctors found a small, localized nodule in my lung. It was detected at a very early stage and is circumscribed. The doctors believe it's best to take action, so, following their advice, I've decided to have surgery to remove it.\"\n\n\"The surgery is already scheduled for the coming days. Thank you for your spiritual support, and I entrust myself to your prayers,\" he said.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 06:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Struggling to monetise your art? How to earn revenue with the \u20181,000 True Fans\u2019 theory", "full_content": "Making money from art can feel difficult when success seems linked to fame. Many artists believe they need millions of followers before earning a steady income. The \u20181,000 True Fans\u2019 theory offers another way to think about earning.\n\nInstead of chasing audiences, it focuses on people who value your work deeply. These supporters buy your creations and help you continue making them. For independent artists, that relationship can become the foundation of a sustainable career.\n\nKevin Kelly introduced the idea in 2008 through his essay, \u20181,000 True Fans\u2019. He was the founding executive editor of Wired magazine. His argument was simple: creators could earn without depending on companies or fame.\n\nA true fan does more than like a post or watch a video. They buy your books, attend performances, collect prints and support new releases. They also share your work and encourage others to discover it. Their support comes from a lasting interest in what you create.\n\nConsider an artist offering a subscription at \u20b9 100 per month. If 1,000 fans subscribe, the monthly revenue reaches \u20b9 1,00,000. Over 12 months, that adds up to \u20b9 12,00,000 in revenue. This calculation shows how smaller payments can add up through regular support.\n\nThe key is finding people willing to pay consistently for something they value.\n\nA writer could offer exclusive essays or stories through a monthly subscription. A musician could share special recordings while an artist could offer creative process updates. Prints, books, performance tickets and online classes provide other ways for fans to spend.\n\nThis approach changes what you measure as success. A thoughtful comment, repeat purchase or personal recommendation becomes worth your attention. You spend more energy strengthening relationships with people who are interested. You worry less about whether every post reaches a huge audience.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 06:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Liverpool Vs Man City Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online In India?", "full_content": "Manchester City return to Premier League action after the international break as their financial case remains under scrutiny ahead of a crucial trip to Anfield.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018I feel like a loser\u2019: My stock portfolio is swinging wildly. Is it finally time to worry?", "full_content": "\u201cI presume these are sophisticated investors taking a profit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dividend record date stocks this week: TCS, Vedanta, Anand Rathi Wealth shares - check dates, amount and payment details", "full_content": "Dividend record dates this week: Investors will closely track developments around Tata Consultancy Services , Vedanta Limited, and Anand Rathi Wealth Limited due to their upcoming dividends record dates.\n\nVedanta has announced an interim dividend of \u20b9 5 per equity share with a face value of Re 1 each. The company\u2019s dividend amounted to \u20b9 1,955 crore.\n\n\u201cWe wish to inform you that the Board of Directors of Vedanta Limited (the \u201cCompany\u201d), have, today i.e. October 08, 2026, approved the First Interim Dividend 2026-27 of \u20b9 5/- per equity share on face value of \u20b9 1/- per equity share for the Financial Year 2026-27 amounting to c. \u20b9 1,955 Crores,\u201d the company stated in its BSE filing.\n\nThe board has fixed Wednesday, October 14, as the record date to determine the eligibility of shareholders for the payout. Interested investors must own the stock before the record date to qualify for the dividend.\n\nVedanta stock closed 4.11% higher at \u20b9 263.50 per share on BSE on Friday. The stock has delivered 51% return in one year, 47% return in two years, and 234% return in three years.\n\nThe IT services heavyweight has announced an interim dividend of \u20b9 12 per equity share with a face value of Re 1 each. The declared dividend will be paid to eligible shareholders on Friday, October 30, 2026.\n\n\u201cThe second interim dividend shall be paid on Friday, October 30, 2026, to the equity shareholders of the Company, whose names appear on the Register of Members or in the records of the Depositories as beneficial owners of the shares as on Wednesday, October 14, 2026, which is the Record Date fixed for this purpose,\u201d stated the firm in its BSE filing.\n\nThe stock closed 4.23% higher at \u20b9 2163 per share on BSE with an Mcap of \u20b9 7,82,592.33 crore. Its share price value has declined 29% in one year, 49% in two years and 40% in three years.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nearly 1 In 4 Travellers Took Repeat Festive Trips, Bookings For 2026 Up 50%: Report", "full_content": "Travellers favour short booking windows, with Hampi, Gokarna, Varkala, Rishikesh and Jaipur emerging as popular festive-season destinations.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Amazon Great Indian Festival 2026: Best OLED TV Deals From Samsung, Sony, LG And Haier", "full_content": "Amazon's festive sale has brought price cuts on premium OLED televisions from Samsung, Sony, LG and Haier. From large screen models for home entertainment to TVs designed for gaming, here are five deals worth checking before making a purchase.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Amazon Great Indian Festival 2026: Top Gaming Phones At Big Discounts, Check Full List", "full_content": "Amazon's Great Indian Festival sale has brought discounts on smartphones with powerful processors and large batteries. From premium Samsung models to more affordable Realme and Redmi phones, here are some options for buyers looking for a gaming phone.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "Baththa Box Office Collection Day 10: Vijay Sethupathi Starrer Sees Sharp Rise", "full_content": "Vijay Sethupathi starrer Baththa earned Rs 2.99 crore net on Day 10, recording an 81.2% growth and taking its total India net collection to Rs 20.10 crore.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:41 PM IST", "pub_date_relative": "2h ago"}, {"title": "Amazon Sale 2026: Top Laptop Deals Under Rs 75,000", "full_content": "Looking to buy a new laptop without spending more than Rs 75,000? Amazon\u2019s Great Indian Festival 2026 has discounted laptops from Apple, HP, Dell, Lenovo and Asus, with additional savings available through select bank and exchange offers.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:34 PM IST", "pub_date_relative": "2h ago"}, {"title": "EPFO explains EPS eligibility after \u20b925,000 wage hike: Check which employees get pension coverage \u2014 and who don't", "full_content": "The monthly wage limit for mandatory Employees\u2019 Provident Fund Organisation ( EPFO ) coverage was increased from \u20b9 15,000 to \u20b9 25,000, effective 17 September 2026.\n\nAccording to the Ministry of Labour & Employment, the change is expected to extend statutory social security benefits to more than 51 lakh additional employees, particularly those earning between \u20b9 15,000 and \u20b9 25,000 a month who were previously outside mandatory coverage.\n\nEPF and EPS are two distinct components of the retirement benefits framework. Now, EPFO has posted on X explaining the eligibility criteria for the Employees\u2019 Pension Scheme (EPS).\n\nAccording to EPFO\u2019s post, \u201cIf your monthly salary is \u20b9 25,000 or less, EPS membership is mandatory as per eligibility. If your monthly salary is more than \u20b9 25,000, EPS membership is not mandatory.\u201d\n\nThe post highlights how monthly wages and an employee\u2019s previous EPS membership determine eligibility, as well as when contributions towards the pension scheme are required or may not be deducted.\n\nEPFO outlined two key conditions for determining EPS membership eligibility.\n\nThis distinction means that salary alone does not determine eligibility in every case. An employee\u2019s previous membership of EPS is also relevant when assessing whether they can become a member of the scheme.\n\nThe Employees\u2019 Provident Fund (EPF) and EPS are two components of the broader retirement savings framework. While EPF helps employees accumulate retirement savings, EPS provides pension benefits to eligible members.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 05:33 PM IST", "pub_date_relative": "2h ago"}, {"title": "Should investors buy or sell gold and silver this Navratri week? Commodity Outlook for precious metal traders", "full_content": "Gold and silver prices are likely to remain in focus during the Navratri week as traders track US inflation data, Treasury yields, Federal Reserve policy expectations and escalating geopolitical tensions in the Middle East. After facing pressure earlier in the week, both precious metals recovered towards Friday as the dollar and US bond yields eased, although expectations of further monetary tightening continue to pose a risk to the outlook.\n\nOn the Multi Commodity Exchange (MCX), gold futures for December delivery rose \u20b9 1,893, or 1.27%, to \u20b9 1,51,503 per 10 grams on Friday, supported by fresh positions and firm spot demand. The contract traded in a business turnover of 5,341 lots. Gold also gained around 1.3% over the week, recovering from a two-month low recorded earlier.\n\nSilver, meanwhile, traded at \u20b9 2,25,820 per kg on Friday, up \u20b9 65, or 0.03%. The metal also recovered from its early-week decline, although its overall technical trend remains weaker than gold's.\n\nThe recovery in precious metals followed easing US Treasury yields and a softer dollar, which helped offset concerns over persistent inflation and the possibility of further Federal Reserve rate hikes. In the domestic market, the rupee's weakness near record lows provided additional support to bullion prices by making dollar-denominated commodities more expensive.\n\nThe near-term direction of gold and silver will depend on whether the dollar and global bond yields continue to ease. A further decline in yields could support prices, while persistent inflation and expectations of additional rate hikes may limit gains. Geopolitical developments in the Middle East and movements in the rupee will also remain important drivers for domestic bullion.\n\nAccording to Ponmudi R, CEO of Enrich Money, a SEBI-registered online trading and wealthtech firm, both metals have shown signs of recovery after finding buying interest at lower levels.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bank earnings to shed the first light on how higher yields are affecting the economy", "full_content": "The big banks kick off earnings season on Tuesday, to provide a first read on the health of the economy in a rising-yield environment.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018I have no children\u2019: My aunt gave me $50,000 for a down payment. Now she wants me to leave my home to her two children.", "full_content": "\u201cThe house cost $385,000. With my savings, her $50,000 and a small mortgage, I was able to close.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Tokenized Stocks Bring \u2018Radical Change\u2019 to Markets, Cuomo Says - WSJ", "full_content": "Tokenized Stocks Bring \u2018Radical Change\u2019 to Markets, Cuomo Says WSJ OKX joint venture files with SEC to launch tokenized trading platform Reuters NYSE\u2019s Parent Just Filed to Tokenize 63 US Stocks on a Crypto-Native Exchange \u2014 And the SEC Already Gave It Permission Yahoo Finance Nvidia (NVDA), Tesla (TSLA) and Apple (APPL) are going onchain. Here\u2019s how OKX and ICE\u2019s new market will work CoinDesk Tokenized Trading in Company Stock: What Public Companies Need to Know Latham & Watkins LLP", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 05:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "DA news: DA for pensioners explained, who is eligible, impact of revision, pay structure and other details", "full_content": "Pensioners are retired central and state government employees, who are eligible for individual or family pension from the government. This is in continuance of their salaries and comprises a dedicated percentage towards inflation. This component is known as Dearness Allowance (DA) for employees, and Dearness Relief (DR) for pension.\n\nDR is often paid to retired central and state government employees , railways and defence personnel, public sector staff, and bank employees across the country. The beneficiaries include close to 65 lakh pensioners across various pay scales.\n\nNotably, in India, DA and DR are provided only to public sector employees and retirees. The private sector does not offer the same for employees or pensioners.\n\nAs a component of the monthly salary, DA is revised biannually based on the 12-month average of the All-India Consumer Price Index (AICPI), with announcements in early March and October, followed by rollouts in January and July. Notably, each time DA is adjusted or revised by the pay commission, a similar change is reflected in DR accordingly.\n\nDR impacts the in-hand pension payout for retired central government staff who receive an individual or family pension from the government. Under the 7th CPC, there have been 10 hikes since 2021, with the highest at 11% in July 2021. The past two hikes were 2% and 3%, respectively, for January and July 2025.\n\nThe National Council \u2014 Joint Consultative Machinery (NC-JCM), Maharashtra Old Pension Organisation and All India Defence Employees Federation ( AIDEF ) have made detailed submissions to the commission.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 05:22 PM IST", "pub_date_relative": "2h ago"}, {"title": "Powerball winning numbers, results for Saturday, Oct. 10, 2026: No jackpot winner - Detroit Free Press", "full_content": "Powerball winning numbers, results for Saturday, Oct. 10, 2026: No jackpot winner Detroit Free Press Ohio Powerball winners hit prizes worth $50K and $100K: See the winning numbers for Oct. 11 and all the prizes hit in Ohio WKYC Did anyone win Powerball's $519M jackpot? Here are the winning numbers for Oct. 10 KING5.com $500 winning Mega Millions ticket sold in Yellville KTLO Powerball Jackpot Crosses $500 Million\u2014Here\u2019s What The Winner Could Take Home Forbes", "source": "Google News Business", "pub_date_str": "11 Oct 2026, 05:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "Need to look at cost of doing business to boost manufacturing; cut statutory liquidity ratio: Amitabh Kant", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Need to look at cost of doing business to boost manufacturing; cut statutory liquidity ratio: Amitabh Kant The Economic Times daily newspaper is available online now. Read Today's Paper Need to look at cost of doing business to boost manufacturing; cut statutory liquidity ratio: Amitabh Kant SECTIONS Need to look at cost of doing business to boost manufacturing; cut statutory liquidity ratio: Amitabh Kant PTI Last Updated: Oct 11, 2026, 05:19:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Amitabh Kant has advocated for reducing the statutory liquidity ratio to promote job-intensive manufacturing in India. He emphasized that cutting SLR could lower the cost of credit for businesses. Kant highlighted the importance of adequate credit in supporting the growth of startups in new-age sectors. Additionally, he addressed the need for easier land acquisition and better power availability for manufacturers.\n\nBrinjal, buffalo, bacteria: Inside India\u2019s pay-for-nature system\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nThe NBFC saga - Part 2: Line drawn in 2006 is reason for the headlines today\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nBritannia\u2019s next big bet for young India lies beyond biscuits\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "11 Oct 2026, 05:19 PM IST", "pub_date_relative": "2h ago"}, {"title": "Kotak Mahindra Life, Ashish Kacholia, Others Invest Rs 120 Crore In Fusion Cx Ahead Of IPO", "full_content": "The IPO comprises a fresh issue of shares worth up to Rs 500 crore and an offer for sale of shares aggregating up to Rs 202 crore by promoter selling shareholders.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:17 PM IST", "pub_date_relative": "2h ago"}, {"title": "JPMorgan Chase, Goldman and other big banks report earnings this week. What to expect", "full_content": "The biggest banks in the U.S. are due to report third-quarter results this week, setting the tone for the rest of the reporting period.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 05:16 PM IST", "pub_date_relative": "2h ago"}, {"title": "This Chinese memory chip maker has global potential and is poised to outperform", "full_content": "The stakes are rising for China's memory chip maker CXMT ahead of its earnings release, expected Oct. 31.", "source": "CNBC Finance", "pub_date_str": "11 Oct 2026, 05:09 PM IST", "pub_date_relative": "2h ago"}, {"title": "Other Mommy Box Office Collection Day 2: Jessica Chastain Horror Film Shows Improvement", "full_content": "Other Mommy collected Rs 1.15 crore on Day 2, marking an 8.3% growth and taking its total gross to Rs 2.22 crore.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Trade Setup For Oct 12: Nifty Bulls Break 8-Week Slide; Will The Relief Really Sustain?", "full_content": "Despite the recent recovery, the market needs confirmation through sustained buying before the rebound can be considered durable.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Hitachi Energy vs CG Power vs Siemens Energy: Which power stock offers best returns? Check target prices", "full_content": "Hitachi Energy vs CG Power vs Siemens Energy: Hitachi Energy India, Siemens Energy India, CG Power and Industrial Solutions Limited are likely to be among beneficiaries in the power transmission and distribution market because of capex investment. Themes like urbanisation, industrialisation, electrification and automation, are likely to support the demand in the segment, according to InCred Equities report.\n\nFor investors who are planning to add power transmission and distribution theme stocks in their portfolio, here is a comparison of growth projections and stock outlook of Hitachi Energy, CG Power and Siemens Energy.\n\nHitachi Energy share price closed 0.89% lower at \u20b9 30,669.25 per share on BSE with an Mcap of \u20b9 1,36,700.09 crore on Friday, October 9. Its return on equity (ROE) stood at 82.02%. Its share price value was 73% in one year, 110% in two years, 678% in three years.\n\nCG Power and Industrial Solutions share price closed 0.63% lower at \u20b9 856.60 per share, with an Mcap of \u20b9 1,34,954.62 crore. The stock\u2019s return on equity (ROE) stood at 37.41%. The stock has delivered nearly 12.56% return in one year, 6.75% return in two years and around 107% return in three years.\n\nSiemens Energy India share price closed 2.78% lower at \u20b9 3101.45 per share on BSE with an MCap of \u20b9 1,10,448.99 crore. The stock has declined 4.30% in one year.\n\nHitachi Energy is likely to report a 17.0% EBITDA margin in the second quarter of financial year 2026-27. Its net profit margin is likely to remain at 13.4%, and earnings per share (EPS) at \u20b9 77.2, as per InCred Equities report.\n\nCG Power\u2019s profit after tax (PAT) is likely to grow 28.6% on a year-on-year (YoY) basis in the quarter ending in September. Revenue from operation may increase 24.4% on a yearly basis, as per the brokerage report.\n\nSiemens Energy\u2019s profit after tax (PAT) may increase 44.7% on a yearly basis, and revenue may surge 46.0% on YoY basis.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 04:51 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "AI\u2019s quiet safety gatekeepers are stepping into the spotlight", "full_content": "Two months ago, independent evaluators occupied a relatively sleepy corner of the multitrillion-dollar artificial intelligence industry. Now they're being asked to come to its rescue.\n\nWhile Anthropic and OpenAI are at the heart of a fierce debate over whether they can safeguard their advanced models and grow their businesses simultaneously, they're seeking support from a handful of small third-party groups like Model Evaluation and Threat Research (METR), Apollo Research, and Transluce.\n\nThe evaluators, which mostly operate as nonprofits, are still finding their footing in an industry where capital is flowing at historic levels and new models are rolling out faster than ever. Their primary role has been to assess AI model capabilities and risks and to flag instances where the technology behaves badly.\n\nWithout a federal push for regulation, evaluators have taken on outsized importance. Anthropic CEO Dario Amodei pledged to embed independent evaluators in his company last month \u2013 a move that OpenAI CEO Sam Altman quickly endorsed . President Donald Trump supported the idea, as did most of the largest U.S. tech companies. But left unanswered are questions about how those third parties should be funded, what level of access they will have and what the reporting structure will ultimately look like.\n\n\"To a degree, the problem, as always, is money,\" Suresh Venkatasubramanian, a computer science professor at Brown University, told CNBC in an interview. \"Who is paying for these companies to do their work? How are they going to support them? You need an ecosystem, you need a viable business model for this.\"\n\nRight now, Anthropic, OpenAI and the infrastructure partners that are profiting from the AI boom are writing the rules.", "source": "CNBC World Economy", "pub_date_str": "11 Oct 2026, 07:38 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "We\u2019re about to get a huge read on whether earnings can keep propping up the stock market", "full_content": "High hopes for third-quarter earnings are outweighing concerns around interest rates and oil prices \u2014 but one expert warns markets have gotten \u201cextremely complacent.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 07:30 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Food delivery stock to buy: Eternal shares - 36% returns in 6 months by Zomato parent | 22% more upside ahead?", "full_content": "Food delivery stock to buy: Shares of Eternal Limited have delivered nearly 36% return in six months. Continued strong growth in quick commerce, improving customer retention and better operating efficiency are likely to boost the outlook for the Zomato parent firm, according to experts.\n\nEternal share price ended marginally higher on Friday after gaining nearly 3% over the last week. As the stock has also delivered promising returns over the past six months, experts continue to remain bullish on the stock.\n\nImprovement in Blinkit sales, strong retention and growing customer base are likely to support Eternal business. Additionally, affordability is driving growth without hurting margins of Eternal, according to Joindre Capital Services Limited, which sees strong growth potential in District , Eternal\u2019s going-out app for movie tickets, live events, dining and sports-venue bookings.\n\n\u201cThe outlook remains positive, led by continued strong growth in quick commerce, improving customer retention and better operating efficiency. Management indicated that Blinkit\u2019s long-term adjusted EBITDA margin guidance has been raised to around 6% from the earlier 5\u20136% range, supported by higher capex per store, larger store formats and improving productivity,\u201d read the brokerage report.\n\nStrong competition in the quick commerce space is a key concern for Eternal growth. Growth in Blinkit\u2019s business depends on winning through density and execution rather than price.\n\nThe brokerage gave a \u2018Buy\u2019 rating for the new-age company stock with a target price of \u20b9 390 per share. \u201cWe assign a BUY rating to Eternal Ltd. with a target price of Rs. 390, implying an upside of 22.1%, based on an SOTP valuation,\u201d stated the brokerage in its report.\n\nEternal share price closed marginally higher at \u20b9 323.35 per share on BSE on Friday, October 9. Its share price value has surged 10.64% in three months, 35.92% in six months, and 14% in 2026 so far.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 07:26 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How much cash to hold in a savings account while waiting for a market correction?", "full_content": "I have a substantial amount sitting in my savings account because I\u2019m waiting for a better entry point in the market. How do I decide how much cash is sensible to hold and how much is simply money sitting on the sidelines?\n\nWhen markets are uncertain, holding some money in your savings account can provide a sense of security. You have the flexibility to invest if markets correct, but how do you know when the right time to invest is? Even though holding cash may feel like the safer choice, it may not always be the right one. So, where do you start?\n\nA good place to start is by setting your financial goals and looking at when you will need the money. Goals that are one to two years away need greater stability, so the money can be kept in debt. For goals that are two to five years away, you can consider a mix of equity and debt . Goals that are more than five years away give you more time to take a growth-oriented approach.\n\nOnce you have clarity on your goals, look at your overall asset allocation. For a long-term portfolio, you can consider allocating 60\u201380% to equity, with the remaining amount invested in debt-oriented products. Equity can provide the growth needed over the long run, while debt can bring stability to the portfolio. As you get closer to a goal, you can gradually move the money towards more stable investments.\n\nOnce you have decided your asset allocation, the next step is to choose the right investments within each part of the portfolio. For equity, around five funds across categories such as large cap, mid cap , small cap, flexi cap, and multi cap can be a starting point. The right combination will depend on your existing portfolio and the diversification you need. For the debt portion, options such as target maturity funds or arbitrage funds can be considered, depending on your tax bracket and liquidity needs.\n\nThere is another part of the plan that is important when you are investing for the long term.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 07:17 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "VinFast faces earnings test as Asia expansion meets profitability push", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 07:05 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "EV stock to buy: Ather Energy shares - 130% returns in a year, Bank of Baroda Caps sees 19% more upside | Target price", "full_content": "EV stock to buy: Nearly one-and-a-half years after its listing, Ather Energy has emerged as one of the newest multibagger stocks of Dalal Street. Despite its nearly 130% rally in one year, experts are still bullish on the stock. Bank of Baroda Caps sees nearly 19% more upside potential in the EV stock.\n\nAther Energy share price closed with 2% gain on Friday, after seeing sharp volatility throughout the week.\n\nAther Energy share price is likely to benefit from its business growth led by capacity boost, lower cost architecture and battery led BOM savings to aid gross margins.\n\nThe Bengaluru -headquartered EV maker is venturing into \u20b9 1-1.25 lakh segment with Konarc/EL launch. Its established premium technology-driven regional brand recognition and shift to convenience segment are likely to help spread \u201cits wings in the mass market segments\u201d, noted BOBCAPS in its report.\n\n\u201cWe value Ather at 16x Sep 2028 M-cap/Gross Block, 20% below the average valuation of TVS and BJAUT two key companies (leaders in EV segment) in the 2-W segment,\u201d read the BOBCAPS report.\n\nThe brokerage gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 1,680 per share. \u201cWe value Ather at 16x Sep 2028 M-cap/Gross Block ratio, 20% below average valuation of TVS and BJAUT, arriving at TP of Rs1,680, BUY.\u201d\n\nThe stock closed 2.01% higher on Friday at \u20b9 1431.25 per share on BSE. Its share price value has 74% in six months, and 94% in 2026 so far (YTD), as per BSE data. The EV stock has delivered a whopping 129.44% return in one year. The stock debuted on Dalal Street on May 6, 2025.\n\nAther Energy made a modest debut above its issue price, and closed lower on its first trading day.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 06:50 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "8th pay commission: What are the upcoming state visit dates in October? Check agenda", "full_content": "The 8th central pay commission (CPC) is in its consultation stage and has scheduled meetings in Mumbai later this month, in order to hold discussions with employee unions, representatives, groups, pensioner associations, federations, and other stakeholders, before releasing its official recommendations.\n\nEstablished by the central government every 10 years to revise the allowances, pay and pensions of its employees, the pay commission or CPC, is responsible for decisions on contributions, retirement benefits and government spending. All central government employees and retired former servicemen are impacted by the revisions.\n\nOverall, the recommendations are set to benefit over 1 crore individuals, including about 50 lakh central government employees and close to 65 lakh pensioners , including personnel and retirees with the defence and railway ministries.\n\nThe 8th CPC is chaired by former Supreme Court Justice Ranjana Prakash Desai , with Pankaj Jain, a former IAS officer as Member-Secretary, and Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister as Member of the Commission.\n\nThey are is gathering views and inputs from stakeholders such as employee unions, labour groups, ministries, pension bodies and more, which will be analysed to decide allowances, pension formula and salary structures for the relevant employee and retiree groups. The current panel is the Centre's eight since Independence. It was constituted by Prime Minister Narendra Modi last year and issued its Terms of Reference (ToR) in November.\n\nData, suggestions and feedback is also solicited before the Commission provides its final recommendations. Notably, official meetings started in March, while windows for data and suggestion submissions closed by July.\n\nMumbai \u2014 22-23 October 2026: The 8th CPC will visit Mumbai from 22-23 October (Thursday-Friday).", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 06:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Bank earnings, CPI headline busy markets week as S&P 500 hovers near records", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Oct 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The bull market is turning 4 years old \u2014 but yields could crash the party", "full_content": "For four years, tech has been the answer to almost every question about this bull market.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ola Electric \u20b91k cr rights issue: Check dates, per share price, face value, premium, record date, ratio - Details", "full_content": "Ola Electric \u20b9 1,000 crore right issue: Shares of Ola Electric Mobility will remain in focus in the coming week ahead of the record date for its right issue. The EV maker has fixed Tuesday as the crucial date to determine eligibility of shareholders.\n\nOla Electric Mobility share price closed nearly 1.83% higher during Friday\u2019s trading session after seeing steep decline in the previous trading session.\n\nThe Bhavish Agarwal-led EV manufacturer had approved the offer and issuance of partly paid-up equity shares of the company for an amount not exceeding \u20b9 1,000 crores by way of a rights issue.\n\nThe rights issue will be carried out in accordance with Companies Act, 2013, as amended and the rules made thereunder, the Securities and Exchange Board of India (Issue of Capital and Disclosure Requirements) Regulations, 2018.\n\nThe company\u2019s board has approved 37,02,72,665 rights equity shares each for an amount aggregating to \u20b9 9,99,73,61,955 (approximately \u20b9 1,000 crore). The company has fixed rights issue price at \u20b9 27 per equity share with a face value of \u20b9 10 each. The issue will also include a premium of \u20b9 17 per equity shares.\n\nThe firm has fixed Tuesday, October 13, as the record date to determine the eligibility of shareholders for the issu. Which makes Monday, October 12, as the last date for investors to purchase the stock to qualify for the corporate action.\n\nThe rights issue will open on Thursday, October 22, 2026, and is likely to remain open for nearly a week. The corporate action will close for investors on Friday, Oct 30, 2026\n\nPrior to the rights issue, company\u2019s outstanding shares stood at 4,62,84,08,313, which will increase to 4,99,86,80,978 equity shares post the corporate action, if the issue is fully subscribed in the duration.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 06:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "NBA commissioner Adam Silver says league could introduce \u2018smart ball\u2019 technology as soon as next year", "full_content": "NBA Commissioner Adam Silver says the league could begin using a new \"smart ball\" in games as soon as 2027, potentially transforming how officials make calls on the basketball court.\n\nIn an interview with CNBC's Contessa Brewer , Silver revealed that the NBA is working with official basketball manufacturer Wilson to develop a ball embedded with a tiny microchip Bluetooth sensor that can track movement, spin and changes in trajectory.\n\n\"We're experimenting with putting a small chip in the ball that weighs roughly a gram,\" Silver said.\n\nThe technology has already been tested in the NBA's G League, Summer League, and some preseason games, where players used basketballs both with and without the chip. Silver said players have been pleased with the results.\n\n\"Nobody could tell the difference. So that's a good sign,\" he said.\n\nThe chip weighs just one gram, compared with the roughly 620-gram or 1.4 pound basketball. Silver said the league wanted to ensure that even the most experienced players wouldn't notice a change in how the ball feels or bounces.\n\nSilver said the technology could help referees determine whether a player touched the ball before it went out of bounds by detecting subtle changes in its spin. It could also help identify whether a shot's trajectory was altered.\n\n\"I think you could see as soon as next year us using it for officiating in our games,\" Silver said.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 06:24 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "I\u2019m a psychologist who studies couples: The No. 1 way to end a fight before it escalates\u2014it works \u2018almost immediately\u2019", "full_content": "You might start out talking about something real and specific. Maybe a plan that was altered without a check-in or an impulse purchase that should have been discussed. Then suddenly you've stopped talking about that thing and started talking about each other:\n\nOne minute you're trying to solve a problem together, and the next you're each trying to prove you're the more reasonable person in the room. And once an argument becomes about that, it can't really be resolved. Because now, the battlefield and ammunition are endless.\n\nAs a psychologist who studies couples, I know that, thankfully, there's a practice that can act as a guardrail for disagreements. I call it a partial yield, and it prevents this all-too-familiar detour.\n\nA partial yield is a type of phrase you use when you concede the specific piece of the argument you're genuinely responsible for, the moment it comes up, without conceding the rest of your position. It usually sounds very ordinary:\n\nSo you're not agreeing that you were wrong about everything. But you are admitting the fault that's actually yours, before your partner has to pry it out of you.\n\nWhen your partner confronts you, some part of them is preemptively braced for the effort of convincing you. It's why voices get louder and why examples start piling up. They're not trying to hurt you. They're trying to get you to believe them, and they've assumed it's going to be hard.\n\nA partial yield releases the pent-up steam that can otherwise fuel an escalation. The effect is palpable almost immediately, and it rarely feels like a defeat for either person. Your partner gets the acknowledgment they were pushing for, and you get to be honest about your part without signing away the rest.\n\nIt's also easier on you than a full apology, which matters more than you might think. Most of us don't withhold small admissions because we believe we did nothing wrong.", "source": "CNBC Top News", "pub_date_str": "11 Oct 2026, 06:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Struggling to monetise your art? How to earn revenue with the \u20181,000 True Fans\u2019 theory", "full_content": "Making money from art can feel difficult when success seems linked to fame. Many artists believe they need millions of followers before earning a steady income. The \u20181,000 True Fans\u2019 theory offers another way to think about earning.\n\nInstead of chasing audiences, it focuses on people who value your work deeply. These supporters buy your creations and help you continue making them. For independent artists, that relationship can become the foundation of a sustainable career.\n\nKevin Kelly introduced the idea in 2008 through his essay, \u20181,000 True Fans\u2019. He was the founding executive editor of Wired magazine. His argument was simple: creators could earn without depending on companies or fame.\n\nA true fan does more than like a post or watch a video. They buy your books, attend performances, collect prints and support new releases. They also share your work and encourage others to discover it. Their support comes from a lasting interest in what you create.\n\nConsider an artist offering a subscription at \u20b9 100 per month. If 1,000 fans subscribe, the monthly revenue reaches \u20b9 1,00,000. Over 12 months, that adds up to \u20b9 12,00,000 in revenue. This calculation shows how smaller payments can add up through regular support.\n\nThe key is finding people willing to pay consistently for something they value.\n\nA writer could offer exclusive essays or stories through a monthly subscription. A musician could share special recordings while an artist could offer creative process updates. Prints, books, performance tickets and online classes provide other ways for fans to spend.\n\nThis approach changes what you measure as success. A thoughtful comment, repeat purchase or personal recommendation becomes worth your attention. You spend more energy strengthening relationships with people who are interested. You worry less about whether every post reaches a huge audience.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 06:05 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018I feel like a loser\u2019: My stock portfolio is swinging wildly. Is it finally time to worry?", "full_content": "\u201cI presume these are sophisticated investors taking a profit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Oct 2026, 06:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dividend record date stocks this week: TCS, Vedanta, Anand Rathi Wealth shares - check dates, amount and payment details", "full_content": "Dividend record dates this week: Investors will closely track developments around Tata Consultancy Services , Vedanta Limited, and Anand Rathi Wealth Limited due to their upcoming dividends record dates.\n\nVedanta has announced an interim dividend of \u20b9 5 per equity share with a face value of Re 1 each. The company\u2019s dividend amounted to \u20b9 1,955 crore.\n\n\u201cWe wish to inform you that the Board of Directors of Vedanta Limited (the \u201cCompany\u201d), have, today i.e. October 08, 2026, approved the First Interim Dividend 2026-27 of \u20b9 5/- per equity share on face value of \u20b9 1/- per equity share for the Financial Year 2026-27 amounting to c. \u20b9 1,955 Crores,\u201d the company stated in its BSE filing.\n\nThe board has fixed Wednesday, October 14, as the record date to determine the eligibility of shareholders for the payout. Interested investors must own the stock before the record date to qualify for the dividend.\n\nVedanta stock closed 4.11% higher at \u20b9 263.50 per share on BSE on Friday. The stock has delivered 51% return in one year, 47% return in two years, and 234% return in three years.\n\nThe IT services heavyweight has announced an interim dividend of \u20b9 12 per equity share with a face value of Re 1 each. The declared dividend will be paid to eligible shareholders on Friday, October 30, 2026.\n\n\u201cThe second interim dividend shall be paid on Friday, October 30, 2026, to the equity shareholders of the Company, whose names appear on the Register of Members or in the records of the Depositories as beneficial owners of the shares as on Wednesday, October 14, 2026, which is the Record Date fixed for this purpose,\u201d stated the firm in its BSE filing.\n\nThe stock closed 4.23% higher at \u20b9 2163 per share on BSE with an Mcap of \u20b9 7,82,592.33 crore. Its share price value has declined 29% in one year, 49% in two years and 40% in three years.", "source": "LiveMint Markets", "pub_date_str": "11 Oct 2026, 05:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Amazon Great Indian Festival 2026: Top Gaming Phones At Big Discounts, Check Full List", "full_content": "Amazon's Great Indian Festival sale has brought discounts on smartphones with powerful processors and large batteries. From premium Samsung models to more affordable Realme and Redmi phones, here are some options for buyers looking for a gaming phone.", "source": "NDTV Profit", "pub_date_str": "11 Oct 2026, 05:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "EPFO explains EPS eligibility after \u20b925,000 wage hike: Check which employees get pension coverage \u2014 and who don't", "full_content": "The monthly wage limit for mandatory Employees\u2019 Provident Fund Organisation ( EPFO ) coverage was increased from \u20b9 15,000 to \u20b9 25,000, effective 17 September 2026.\n\nAccording to the Ministry of Labour & Employment, the change is expected to extend statutory social security benefits to more than 51 lakh additional employees, particularly those earning between \u20b9 15,000 and \u20b9 25,000 a month who were previously outside mandatory coverage.\n\nEPF and EPS are two distinct components of the retirement benefits framework. Now, EPFO has posted on X explaining the eligibility criteria for the Employees\u2019 Pension Scheme (EPS).\n\nAccording to EPFO\u2019s post, \u201cIf your monthly salary is \u20b9 25,000 or less, EPS membership is mandatory as per eligibility. If your monthly salary is more than \u20b9 25,000, EPS membership is not mandatory.\u201d\n\nThe post highlights how monthly wages and an employee\u2019s previous EPS membership determine eligibility, as well as when contributions towards the pension scheme are required or may not be deducted.\n\nEPFO outlined two key conditions for determining EPS membership eligibility.\n\nThis distinction means that salary alone does not determine eligibility in every case. An employee\u2019s previous membership of EPS is also relevant when assessing whether they can become a member of the scheme.\n\nThe Employees\u2019 Provident Fund (EPF) and EPS are two components of the broader retirement savings framework. While EPF helps employees accumulate retirement savings, EPS provides pension benefits to eligible members.", "source": "LiveMint Money", "pub_date_str": "11 Oct 2026, 05:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Should investors buy or sell gold and silver this Navratri week? Commodity Outlook for precious metal traders", "full_content": "Gold and silver prices are likely to remain in focus during the Navratri week as traders track US inflation data, Treasury yields, Federal Reserve policy expectations and escalating geopolitical tensions in the Middle East. After facing pressure earlier in the week, both precious metals recovered towards Friday as the dollar and US bond yields eased, although expectations of further monetary tightening continue to pose a risk to the outlook.\n\nOn the Multi Commodity Exchange (MCX), gold futures for December delivery rose \u20b9 1,893, or 1.27%, to \u20b9 1,51,503 per 10 grams on Friday, supported by fresh positions and firm spot demand. The contract traded in a business turnover of 5,341 lots. Gold also gained around 1.3% over the week, recovering from a two-month low recorded earlier.\n\nSilver, meanwhile, traded at \u20b9 2,25,820 per kg on Friday, up \u20b9 65, or 0.03%. The metal also recovered from its early-week decline, although its overall technical trend remains weaker than gold's.\n\nThe recovery in precious metals followed easing US Treasury yields and a softer dollar, which helped
