<script>

    const allData = {"general": [{"title": "Marshall Wace and Millennium hit as hedge funds suffer in October\u2019s AI rout", "full_content": "Wall Street\u2019s tech correction and bond market turbulence spark losses for sector", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 08:51 PM IST", "pub_date_relative": "2m ago"}, {"title": "Stock market after midterm elections: What S&P 500 history shows", "full_content": "Markets are sweating it out ahead of the midterm elections , but the event historically heralds strong performance for stocks \u2014 regardless of whether it's a red or blue wave , split decision, or status quo in Washington.\n\nThe S&P 500 tends to perform well after both midterm and presidential elections. According to a CNBC analysis of S&P 500 returns after elections from 1980 through 2024, the index rose an average of 0.2% after one day and one week, and 1.1% after one month across both presidential and midterm elections.\n\nA year later, the index gained an average of 13.7% after midterms and 13.8% after presidential elections. Returns were positive in 91% of cases. And the S&P 500 was up after all 11 midterms from 1982 through 2022.\n\nShort-term returns were less reliable, particularly after presidential contests, which produced slightly negative average returns after one day and one week.\n\n\"There's some anxiousness before these elections,\" Ryan Detrick, CNBC contributor and chief market strategist at Carson Group, told CNBC. \"Once you are through it, it's a big relief and markets tend to do pretty well.\"\n\nStill, the market usually prefers divided government : one party in charge of the White House and the other holding at least one house of Congress.\n\nAcross 10 midterm and five presidential elections that left no single party in charge, the S&P 500 rose an average 15% after one year. One-year returns were positive in 14 out of 15 cases. By comparison, the index gained an average of 11.5% over the year after elections that resulted in single-party control.\n\n\"If you have a huge red wave or a big blue wave, markets actually kind of don't like that as much because you have too much spending one way and too much power,\" Detrick said.", "source": "CNBC Finance", "pub_date_str": "03 Nov 2026, 08:49 PM IST", "pub_date_relative": "4m ago"}, {"title": "Yum Brands earnings beat estimates, but cyclospora outbreak weighs on Taco Bell", "full_content": "Yum Brands on Tuesday reported earnings that beat expectations, but a cyclospora outbreak linked to iceberg lettuce at Taco Bell weighed on the company's same-store sales growth.\n\nHowever, Yum said Taco Bell, which the company considers a \"growth engine\" for its business, has since rebounded.\n\n\"Since the end of September, Taco Bell U.S. has been outpacing the [quick-service restaurant] industry on same-store sales growth,\" Yum CEO Chris Turner said in a statement.\n\nTaco Bell's same-store sales are up about 1% so far in the fourth quarter, CFO Ranjith Roy said on the company's earnings conference call Tuesday. In the last four weeks ended Friday, same-store sales have risen 3% compared with the year-ago period.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nYum reported fiscal third-quarter net income of $1.62 billion, or $5.92 per share, up from $397 million, or $1.41 per share, a year earlier.\n\nExcluding gains from its divestiture of Pizza Hut and other items, the restaurant company earned $1.56 per share.\n\nDuring the quarter, Yum completed its divestiture of Pizza Hut. It closed the sale of the pizza chain's business in mainland China to Yum China on Aug. 7 and sold the rest of Pizza Hut to LongRange Capital on Sept. 1. The company's third-quarter results include Pizza Hut up until those dates.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:49 PM IST", "pub_date_relative": "4m ago"}, {"title": "Bill Ackman warns of 'casino' stock market as speculative trading grows", "full_content": "Bill Ackman worries that the stock market is broken, saying the rise of speculative trading is leading to wild price swings thanks to the amount of leverage in the system.\n\n\"Every number of days, I feel like markets are broken,\" Ackman told CNBC's \" Squawk Box \" on Tuesday. \"Stocks trade at prices that make no sense to me. Yes, it's good if you're a long-term investor and you can buy at a stupid price. I don't think it's good for the country generally.\"\n\n\"We're back to the casino type markets when there was 95% leverage,\" he added. \"I don't think that's inherently good for the economy, for society, and it's leading to these massive moves in stocks.\"\n\nThe founder of Pershing Square Capital Management said those same dislocations in the market have given the hedge fund the opportunity to snag big bargains.\n\nPershing bought Microsoft , for example, when it was pummeled during the \"SaaSpocalypse\" earlier this year, and Amazon when it fell following President Donald Trump's tariffs. It also bought Alphabet when the stock moved \"massively\" following ChatGPT's launch, he said.\n\nBut the billionaire investor worries that the rise of one-day leveraged vehicles, perpetual futures and sports betting is dangerous for investors who are treating the stock market as a get-rich-quick scheme \u2014 an attitude that could have disastrous consequences.\n\n\"It's good for us long term, us being Pershing Square,\" he said. \"I don't think it's good for the country.\"\n\nAmong the stocks Ackman is especially bullish on are Visa and Mastercard , which he called among the world's \"greatest\" businesses, as well as streaming platform Netflix, in which he disclosed a position in August.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:46 PM IST", "pub_date_relative": "7m ago"}, {"title": "Shopify falls 9% after Q3 revenue and merchandise volume miss estimates", "full_content": "Shares of e-commerce platform Shopify plunged 9% in early trading on Tuesday after the company missed estimates on subscription gross profit and gross merchandise volume.\n\nShopify reported before the bell Tuesday and posted adjusted earnings of 49 cents per share, topping LSEG estimates of 46 cents per share.\n\nOverall, quarterly revenue of $3.74 billion came in just below LSEG estimates of $3.75 billion. Shopify said it sees revenue growth in the \"low thirties\" range year over year for the fourth quarter, versus LSEG estimates of 32.1%.\n\nGross merchandise volume, which came in at $119.15 billion, missed analyst estimates of $120.03 billion for the quarter, according to StreetAccount. Subscription gross profit also missed estimates by nearly $20 million, coming in at $661 million compared to StreetAccount estimates of $680.3 million. Merchant gross profit beat estimates.\n\nSubscription revenue of $836 million also missed analyst estimates of $848.1 million, according to FactSet. Merchant revenue beat estimates.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 08:45 PM IST", "pub_date_relative": "8m ago"}, {"title": "US Midterm Election Results 2026 date today! What Trump's loss mean for gold, Sensex, Nifty, global markets, US bonds?", "full_content": "US Midterm Election Results 2026 date today: The most awaited US Midterm Election Results date has arrived and the final outcome is expected to become public in the next 18-20 hours. However, the first US Midterm Election Result 2026 can be expected by 4:30 AM in India on Wednesday (read 23:00 GMT on Tuesday in the US).\n\nIn an NBC poll released on Sunday, quoted by Al Jazeera, 75% of respondents said they were dissatisfied with the state of the US economy, and 51% said they were dissatisfied with their personal financial situation.\n\nAl Jazeera also quoted a Pew Research Centre survey, conducted between September 28 and October 4, suggested that 84 percent of registered voters considered the economy very important to their midterm vote. It was the top issue for 82 percent of respondents who prefer Republican candidates, and 88 percent for those who back Democrats.\n\nSpeaking on the possible outcome that we can expect from the US Midterm Election Results 2026, the ICICI Bank's global markets report said, \u201cRepublicans currently hold a majority in both chambers. However, Democrats are expected to sweep the midterm i.e., gain control of both the House and the Senate. Democrats are likely to win a simple majority, and this should give control of one or both chambers to more Congressional power and oversight.\u201d\n\nExpecting an upside in the US stock market, if Trump's Republicn Party suffers a setback in the US Midterm Elections, Anuj Gupta, a SEBI-registered market expert, said, \u201cTrump's loss would have a direct impact on the US currency and the US bond market. These two assets are expected suffer due to the policy paralysis scenario after Democrats victory, and the smart money is expected to move from the US bond and US dollar to the US equities.\u201d\n\nThe SEBI-registered market expert said that most of the US indices, including are trading green on Tuesday during the OPpening Bell on Wall Street.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 08:43 PM IST", "pub_date_relative": "10m ago"}, {"title": "RBI launches 3 surveys to capture inflation expectations, consumer confidence ahead of December policy meeting", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI launches 3 surveys to capture inflation expectations, consumer confidence ahead of December policy meeting The Economic Times daily newspaper is available online now. Read Today's Paper RBI launches 3 surveys to capture inflation expectations, consumer confidence ahead of December policy meeting SECTIONS RBI launches 3 surveys to capture inflation Telugu, Malayalam and Kannada. The runtime of the version in India is 3 hours and 15 minutes.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:35 PM IST", "pub_date_relative": "18m ago"}, {"title": "What Happens When You Look At Your iPhone? How 3D Face Unlock Actually Works", "full_content": "A viral video from a tech creator breaks down what happens inside the iPhone's notch every time you unlock it with your face, and why Apple hasn't been able to get rid of it.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:34 PM IST", "pub_date_relative": "19m ago"}, {"title": "Nvidia, SK Hynix, SanDisk Spike Up To 7% Ahead Of AMD Earnings As Chips Rebound From Multi-Week Selloff", "full_content": "Among major chip stocks, SanDisk surged the most, up 7.15% to $1,151,9 apiece, followed by AMD, which rose 6.14% to $496.76 and Micron traded 4.42% higher at $870.48.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:34 PM IST", "pub_date_relative": "19m ago"}, {"title": "5 questions to ask if your boss offers you a buyout, as Microsoft did with 60,000 employees", "full_content": "Two days after Microsoft asked more than a quarter of its workers if they\u2019d take a buyout, it reported $45.2 billion in capital spending in a single quarter, most of it for AI.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 08:34 PM IST", "pub_date_relative": "19m ago"}, {"title": "Earnings call transcript: Archrock beats on q3 2026 profit, shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:33 PM IST", "pub_date_relative": "20m ago"}, {"title": "Horace Mann earnings on deck as profitability test looms ahead", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:33 PM IST", "pub_date_relative": "20m ago"}, {"title": "Patria Investments stock hits 52-week low at 9.04 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:33 PM IST", "pub_date_relative": "20m ago"}, {"title": "Stifel reiterates Compass Pathways stock rating on NDA progress", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:33 PM IST", "pub_date_relative": "20m ago"}, {"title": "Pinnacle West earnings beat by $0.29, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:33 PM IST", "pub_date_relative": "20m ago"}, {"title": "Earnings call transcript: Fiserv tops Q3 2026 EPS forecast, shares jump 7.8%", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "India's 10 Most Polluted Cities Today: Bathinda AQI Hits Alarming 737, Faridkot Records 692", "full_content": "Check the top 10 Indian cities with the highest AQI readings, led by Bathinda, Faridkot and Patiala.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "Versigent earnings loom as investors eye post-spinoff momentum", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "Las Vegas Raiders owner Mark Davis says he feels no pressure to rush backup QB Fernando Mendoza", "full_content": "Las Vegas Raiders owner Mark Davis says he feels no pressure to rush backup quarterback Fernando Mendoza onto the field. The No. 1 overall draft pick's popularity has fueled questions about when he will become the team's starting quarterback.\n\n\u201cFrom me, there\u2019s absolutely no pressure whatsoever,\u201d Davis told CNBC Sport\u2019s Michael Ozanian in an interview Monday. \"I'm really happy with the way it is with Fernando right now,\" he added.\n\nDavis called Mendoza a hard worker and a \"sponge.\" He said that the rookie has been working with Tom Brady, the Raiders' minority owner and a retired superstar quarterback. Davis also believes Mendoza can learn behind veteran quarterback Kirk Cousins.\n\n\u201cThat\u2019s why I think we are so fortunate to get Kirk Cousins as somebody that could bridge the gap and let this young man learn a lot about what football is in the pros, the speed of the game, the things that have to be done,\u201d Davis said. \u201cAnd again, he\u2019s picking it up great.\u201d\n\nThe Raiders have faced growing scrutiny over when to play Mendoza following a four-game losing streak. Las Vegas ended that streak on Sunday with a 38-33 win over the New York Jets, moving them to a 4-4 record. Despite the team's struggles, Cousins has the second-most passing touchdowns in the league this season.\n\nDavis said he remembers a time in the 1960s when quarterbacks sometimes sat for several seasons before starting. He said he feels fortunate to be in a position where he doesn't have to rush his young quarterback.\n\n\u201cToday, there\u2019s a lot of pressure put on teams when they draft a guy number one that, you know, you\u2019ve got to play him right away,\u201d Davis said. \u201cI\u2019ve seen quarterbacks get fast-tracked onto the field, and they may do well, but they don\u2019t learn all the intricacies of footwork and everything else that it takes.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "Oil turns lower after Trump says he will halt $4 billion in funding to Israel", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "Fortis Q3 2026 slides: $32.2B capital plan drives 7.5% rate base growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "Job openings surge as U.S. labor market remains robust", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago"}, {"title": "What the 2026 midterm elections could mean for Trump\u2019s final two years", "full_content": "Tuesday's midterm elections will at their heart determine control of Congress for the remainder of Donald Trump 's presidency. U.S. voters will decide whether Trump will maintain his Republican iron grip on Washington or recede into lame duck status after a Democratic triumph.\n\nIf Republicans win, Trump could spend another two years facing little congressional resistance and pushing through major policy packages . If Democrats win one or both chambers, the president's remaining legislative priorities would be severely kneecapped, and even the basic functions of government could become gridlocked .\n\nOddsmakers and public polls placed Democrats in a favorable position ahead of Election Day, especially for flipping control of the Republican-held House. Still, the balance of power will not be decided until ballots are counted \u2014 a process that could take days or, in some cases, weeks to complete. The Senate is expected to be particularly close, and if the balance of power comes down to Alaska, the nation may have to wait while the state counts.\n\n\"The election results could trigger an immediate market reaction, particularly as the Senate outcome becomes clearer,\" the Washington Policy Strategy Group of Stifel wrote Sunday in an analyst report, where it predicted Democrats will win the House while the Senate remains too close to call. \"However, the market's knee-jerk trade could reverse as investors recognize that gridlock remains the most likely policy outcome in either case.\"\n\nRepublicans also control the Senate, and with a larger majority than in the House.\n\nIf Democrats capture one chamber of Congress, Washington policymaking would become significantly more gridlocked. Single-party budget reconciliation bills, the procedural vehicle for most major spending and policy changes in the current status quo of tight congressional margins, would become impossible.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:30 PM IST", "pub_date_relative": "23m ago"}, {"title": "Apple shares fall 4% despite revenue beat in first earnings under CEO John Ternus; what's next for the iPhone maker?", "full_content": "Shares of Apple Inc. slipped 4% in Tuesday\u2019s trade on November 3, falling to $325 apiece, as the company\u2019s fourth-quarter performance offered a mixed picture to investors. The results also marked the first quarterly report under its new Chief Executive Officer, John Ternus.\n\nThe iPhone maker reported revenue of $114.5 billion for the fiscal fourth quarter ended September 26, up 12% from the same period last year. The figure narrowly beat analysts\u2019 estimates, with the average projection at $113.5 billion, according to data compiled by Bloomberg .\n\nTernus became CEO on September 1, putting him in charge for the final month of Apple\u2019s fourth quarter. He has since overseen the unveiling of the foldable iPhone Duo, touchscreen MacBook Pro, and HomeView hub, although none of these products went on sale until the current quarter, which runs through December.\n\niPhone revenue, which accounted for the bulk of the company\u2019s top line, reached $57.6 billion, up from $49.0 billion a year earlier. This indicates that the company is weathering a shift in its product launch schedule. Apple typically launches multiple new iPhone models in September, but this time it released only the iPhone 18 Pro line.\n\nThe regular iPhone 18 and the new iPhone Air are not expected to arrive until the first half of 2027, while the foldable iPhone Duo was launched only on October 23, well into the following quarter.\n\nServices, a segment that includes music streaming, the App Store, iCloud subscriptions, Apple TV and other digital offerings, rose 9.8% to $31.6 billion, in line with estimates. Earnings came in at $2.10 per share, beating the estimate of $2.\n\nMac revenue climbed 24% to $10.8 billion, significantly exceeding the average analyst projection of $9.7 billion. A fresh wave of products is also expected to help sustain momentum. The company\u2019s touchscreen MacBook Pro, refreshed iMac, and new entry-level MacBook Pro are scheduled to ship on November 6.\n\nMemory is the problem.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 08:29 PM IST", "pub_date_relative": "24m ago"}, {"title": "Crude oil prices fall for second day as market hopes for diplomatic resolution to Iran war", "full_content": "Crude oil prices fell Tuesday for a second consecutive session, as the market hopes the U.S. and Iran will reach a diplomatic settlement to the conflict that has disrupted global energy supplies for eight months.\n\nU.S. West Texas Intermediate futures were 42 cents lower to $96.04 a barrel after dipping below $95 earlier. Brent crude futures, the international benchmark, were down $1.23 at $103.54 a barrel. The move lower came after rumors circulated the U.S. and Iran were making progress toward a deal.\n\nOil sold off more than 7% on Monday after Washington and Tehran signaled they were both open to discussions to reach a settlement. President Donald Trump told reporters Tehran wants \"to make a deal and that could happen.\"\n\nQatar is continuing to mediate talks between the U.S. and Iran, the Gulf state's foreign ministry said Tuesday. A delegation from Qatar held talks in Tehran in an effort to reach an agreement that prevents further escalation in the region and ends the U.S.-Iran conflict, the foreign ministry said.\n\nThe market had been pricing in the risk of escalation after the U.S. midterm elections, as reports circulated that Washington was drafting plans for strikes on Iran. Crude prices gained more than 10% in October in response.\n\nThe situation in the Middle East remains volatile and there's still substantial risk that fighting could break out. Washington attacked Iran's Qeshm Island on Monday, U.S. officials told The Wall Street Journal, adding that the U.S. has been carrying out \"limited strikes\" against the country in recent weeks.\n\nThe military campaign against Iran has been kept deliberately low-profile to avoid signaling plans for a major escalation in fighting, the report said, quoting an unnamed official.\n\nAnd commercial ships continue to come under attack in the Persian Gulf, Strait of Hormuz and Gulf of Oman. At least four ship attacks have been reported since the start of the month, according to the United Kingdom Maritime Trade Operations Centre.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:27 PM IST", "pub_date_relative": "26m ago"}, {"title": "\u2018The new frontier of finance is built in the United States of America\u2019", "full_content": "Perp talk", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 08:23 PM IST", "pub_date_relative": "30m ago"}, {"title": "Bihar Museum Ranked 9th In World's Best Museums List: Check Which Global Icons It Beat", "full_content": "Visitors can explore the Didarganj Yakshi, Mithila paintings, the Diaspora Art Gallery and an exhibition featuring prominent Indian artists.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:22 PM IST", "pub_date_relative": "30m ago"}, {"title": "Stocks are at their highest in two months; why are analysts flagging caution?", "full_content": "Indian stocks rose for the fourth straight day on Tuesday, reaching their highest level in the last two months, supported by a decline in crude oil prices and optimism ahead of the US mid-term elections. However, a key contrarion indicator suggests that the market may have entered overbought territory, raising the possibility of a decline as investors sell shares to book profits.\n\nThe Nifty closed 1.58% higher at 23,810.85, its highest since 4 September, while the BSE Sensex advanced 1.62% to settle at 76,917, the highest since 1 September. The market capitalization of BSE-listed companies rose by \u20b9 4.5 trillion. Foreign institutional investors turned net buyers for the third consecutive day, buying shares worth \u20b9 6,856 crore on Tuesday, provisional data from NSE showed.\n\nThe Nifty is now trading 7.3% above its 52-week intraday low of 22,179.9 on 8 October, triggering expectations that markets might be close to topping out and could witness profit-taking in the short term. The indicator in question is the Nifty aggregate put-call ratio (PCR) open interest which reached 1.52, its highest since 5 January's 1.46, signalling that the market might be overbought.\n\nOpen interest refers to the outstanding buy-sell options positions at various Nifty levels.\n\nAfter the PCR touched a high of 1.46 on 5 January this year when the Nifty was at a record high of 26373.2, the index plunged 16% till October. The rise in PCR above early January levels has analysts advising caution.\n\nA 1.52 ratio implies that for every 100 call options on Nifty sold, traders have sold 152 puts, hoping that the markets would rise and they could pocket the premium paid by put buyers. This is why the indicator is known as a contrarion one because a higher quantum of puts, instead of being seen as bearish, is seen as a bullish sign.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 08:22 PM IST", "pub_date_relative": "31m ago"}, {"title": "Hormuz Won't Reopen Till US Meets 7 Conditions: Iran Draws Red Line; Oil Prices Off Day's Low", "full_content": "Brent crude was trading near $103.50 a barrel, while West Texas Intermediate (WTI) futures were around $96 a barrel.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:19 PM IST", "pub_date_relative": "34m ago"}, {"title": "Jharkhand Board Exams 2027: Class 10 And 12 Registration Opens On November 12", "full_content": "Students preparing for Jharkhand 2027 Class 10 and Class 12 Board exams need to ensure their application are submitted within the prescribed deadline", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:17 PM IST", "pub_date_relative": "36m ago"}, {"title": "The 'poison pill' ballot measure that could kill the California billionaire tax", "full_content": "The Inside Wealth newsletter by Robert Frank is your weekly guide to high-net-worth investors and the industries that serve them.\n\nThe California billionaire tax could face a stiff challenge from a competing ballot measure that would ban state taxes on retirement accounts, according to tax experts.\n\nCalifornia voters will decide the fate today of Proposition 40, known as the Billionaire Tax Act, which would impose a one-time tax of 5% on the total net worth of Californians worth over $1 billion. The so-called \"billionaire tax\" is one of the most widely watched ballot measures this election season, since it would be the first state tax on net worth and taps popular anger over the rising power and wealth of tech billionaires.\n\nThe tax requires a simple majority to pass. Since it would only tax the state's roughly 250 billionaires, many political experts initially predicted easy passage. Yet a recent poll by the Public Policy Institute of California shows it falling short, with 46% supporting and 52% against.\n\nSupporters of the tax blame a $300 million ad blitz funded by tech billionaires and business groups opposing the measure. Many of the ads claim the ballot measure would allow the Legislature, with a two-thirds vote, to expand the tax to everyday Californians.\n\nYet tax experts cite another potential roadblock to the tax: Proposition 42.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:16 PM IST", "pub_date_relative": "37m ago"}, {"title": "Learning from \u2018Love Is Blind\u2019 money drama", "full_content": "Hear me out: These reality-TV couples are having really important conversations about love and money heading into Wednesday\u2019s finale.", "source": "MarketWatch Top Stories", "pub_date_str": "03 Nov 2026, 08:16 PM IST", "pub_date_relative": "37m ago"}, {"title": "Ferrari raises 2026 guidance after Q3 earnings beat", "full_content": "Ferrari on Tuesday raised its 2026 guidance after the sports car maker slightly beat Wall Street's third-quarter expectations.\n\nHere's how Ferrari performed in the third quarter compared with average estimates compiled by LSEG:\n\nFerrari raised its guidance to revenue of 7.65 billion euros, up from 7.6 billion euros; adjusted earnings before interest, taxes, depreciation and amortization to 3 billion euros, up from 2.97 billion euros; and adjusted EPS to at least 9.85 euros, up from at least 9.68 euros.\n\nThe automaker also upgraded its expectations for industrial free cash flow to up to 1.65 billion euros, up from previous expectations for at least 1.55 billion euros.\n\nThis is the second consecutive quarter Ferrari has raised its 2026 guidance, despite vehicle shipments being lower by 318 units through the first nine months of the year, at 10,170 vehicles, compared with last year. The decline is led by fewer shipments to the Americas and China, Hong Kong and Taiwan.\n\nFerrari said Tuesday that the guidance improvements were a result of stronger-than-expected customer personalizations, lower than anticipated currency headwinds and a second place finish in the Formula 1 championship.\n\n\"Our order book now reaches into 2028, and we still have two more launches to come this year. In addition, we continue to create engaging events around the world to further tighten the bonds with our clients and partners across Racing, Sports Cars and Lifestyle,\" Ferrari CEO Benedetto Vigna said in a release.\n\nRBC Capital Markets analyst Tom Narayan said Tuesday that Ferrari's results were largely in line with Wall Street expectations. However, he said shares may be under \"under slight pressure given some were hoping for a bigger guidance raise, but expect it to get better once folks realize these results are healthy.\"", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:13 PM IST", "pub_date_relative": "40m ago"}, {"title": "Gold vs Silver ETFs before Diwali 2026: Which delivered better returns? What risks should investors check before buying?", "full_content": "With Diwali approaching, investors looking to add precious metals to their portfolios face a choice between gold and silver exchange-traded funds (ETFs). While both offer exposure to precious metals without the need to purchase or store physical bullion, their returns and risk profiles differ considerably.\n\nValue Research data shows that silver ETFs delivered an average return of 25.04% over one year, compared with 15.79% for gold ETFs. Over three years, silver ETFs generated average returns of 35.96%, against 30.58% for gold ETFs.\n\nHowever, the recent performance paints a different picture. Over three months, gold ETFs declined 3.86%, while silver ETFs fell 17.04%. This highlights the sharper price fluctuations investors may have to contend with when investing in silver.\n\nThe performance difference reflects the distinct demand drivers of the two precious metals. While silver has benefited from its industrial demand and investment interest, gold has traditionally attracted investors seeking a safe-haven asset.\n\nThe three-month performance data also highlights the difference in their downside risks. Silver ETFs have corrected more sharply than gold ETFs, making it important for investors to consider their risk appetite rather than choosing a fund solely based on historical returns.\n\nAmong individual schemes, Tata Silver ETF delivered the highest one-year return in the silver category at 20.51%, followed by SBI Silver ETF at 20.36%. In the gold category, Aditya Birla Sun Life Gold ETF topped the list with a one-year return of 12.93%, followed by Quantum Gold ETF at 12.89%.\n\nGold and silver have different demand drivers, which explains why their prices do not always move in tandem.\n\nGold derives much of its value from safe-haven demand, central bank purchases and investment demand. Silver, meanwhile, has a significant industrial component to its demand, with applications across sectors such as electronics, solar energy and manufacturing.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 08:12 PM IST", "pub_date_relative": "40m ago"}, {"title": "US Stock Market Today: Dow Down 200 Points Ahead Of Midterm Verdict; Nasdaq Climbs On Chips Rebound", "full_content": "According to JP Morgan, a victory of the House and Senate by Democrats could result in sell-off for artificial intelligence stocks.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:11 PM IST", "pub_date_relative": "42m ago"}, {"title": "India vs Dubai vs Pakistan: Where Is Gold Cheapest On Nov. 3? Check 22K And 24K Rates", "full_content": "Gold prices vary between countries due to several factors, including movements in global bullion markets, changes in currency values and differences in domestic taxes and import duties.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:11 PM IST", "pub_date_relative": "42m ago"}, {"title": "US stocks today: S&P 500, Nasdaq open higher as oil prices extend declines, midterms on tap", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: S&P 500, Nasdaq open higher as oil prices extend declines, midterms on tap Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks today: S&P 500, Nasdaq open higher as oil prices extend declines, midterms on tap SECTIONS US stocks today: S&P 500, Nasdaq open higher as oil prices extend declines, midterms on tap Reuters Last Updated: Nov 03, 2026, 08:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The S&P 500 and the Nasdaq opened higher on Tuesday as crude oil prices fell further heading into the US midterm elections, while Apple joined the list of Big Tech companies whose\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "03 Nov 2026, 08:08 PM IST", "pub_date_relative": "45m ago"}, {"title": "Apple stock sinks as global memory crisis hurts profits, giving Ternus his first big test", "full_content": "John Ternus' first earnings report as Apple CEO was going fine until it was time to issue a forecast for the company's gross margin, one of the key metrics followed by investors.\n\nApple reported better-than-expected earnings and revenue on Monday, including in the company's core iPhone unit, and even projected sales in the current period that topped estimates. But just before Ternus opened the earnings call up to analysts' questions, CFO Kevan Parekh came forward with the first real piece of bad news.\n\nParekh said that for the December quarter, which goes through the holiday season, Apple's gross margin will be between 45% and 46%, trailing the 46.3% average analyst estimate, according to LSEG.\n\n\"This includes primarily the impact of higher memory costs, as well as some costs related to the ramp of Siri AI,\" Parekh said.\n\nApple stock chart It's part of an ongoing trend for Apple, which is absorbing some of the soaring costs from the global memory shortage. A margin drop in the fiscal first quarter would be a third straight decline for Apple, following a gross margin of 50.1% in the June period and 47.9% in the September quarter, boosted by 1 percentage point of tariff refunds.\n\nAt the midpoint of the forecast range, it would be Apple's lowest gross margin since the fiscal fourth quarter of 2023.\n\n\"What we're seeing with memory pricing right now is unprecedented,\" Ternus said on the call, adding that the company is paying more than it did earlier this year. \"Looking beyond the December quarter, we see the pricing for memory purchases continuing to increase.\"\n\nTernus, who took the reins from Tim Cook on Sept. 1, is grappling with a problem that his predecessor spent his final months addressing. Cook told The Wall Street Journal in June that the memory situation was a \"hundred-year flood.\" Apple followed by raising prices across the board on Macs, iPads and accessories.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 08:08 PM IST", "pub_date_relative": "45m ago"}, {"title": "Wall Street braces as voters head to high-stakes polls", "full_content": "Vote will set the trajectory for everything from AI to public spending", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 08:03 PM IST", "pub_date_relative": "50m ago"}, {"title": "Iranian TV Airs Nuclear Strike Survival Guide: 5 Instructions For Citizens", "full_content": "The advisory tells citizens to avoid windows, wash exposed skin and rely on bottled water and packaged food after a nuclear explosion.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:02 PM IST", "pub_date_relative": "51m ago"}, {"title": "Palantir slumps 5% after earnings as analysts point to slowdown in total contract value", "full_content": "Palantir shares fell on Tuesday after the software company reported third-quarter earnings and analysts pointed to signs of a slowdown in total contract value and other \"forward indicators.\"\n\nU.S. commercial revenue topped government for the first time, but the company closed $1.5 billion in TCV in the segment, up 11% from last year. In Q2, Palantir closed a record $2.1 billion worth of TCV in the segment, which was up 153% from the prior year.\n\nInvestors will \"no doubt be looking for evidence in subsequent quarters that 11% growth in U.S. commercial TCV bookings is a fluke of duration and not something structural,\" a Piper Sandler note from Monday said. \"We believe that is the case and demand for PLTR's solutions still very much outstrip supply.\"\n\nIn a Tuesday note, Goldman Sachs analysts noted that the company attributed some of this to shorter contract durations.\n\n\"The key will be converting shorter duration contracts into longer duration commitments, which Palantir has done successfully in the past,\" the analysts wrote.\n\nRevenue nearly doubled from a year ago and blew past $2 billion for the first time, Palantir said in its earnings report.\n\nPalantir stock chart. Apple's earnings The iPhone maker reported better-than-expected revenue in its fourth-quarter earnings, but fell short of estimates on iPad sales and issued a margin forecast that disappointed investors.\n\nApple 's statement marked the first earnings report since John Ternus took over as CEO from Tim Cook in September. The stock fell more than 2% on Tuesday.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 08:01 PM IST", "pub_date_relative": "52m ago"}, {"title": "Supermarket fridges hit with cyberattacks across Europe \u2014 here's what's happening", "full_content": "European supermarkets have become the center of another cyberattack , with hackers remotely heating fridges and spoiling food.\n\nThe attack caused temperatures in fridges and freezers to rise sharply, with at least one store reporting temperatures of up to 50\u00b0C (122\u00b0F) and other retailers discarding food. It's sparked concerns across the retail industry.\n\nDutch supermarket group Ahold Delhaize had dozens of Delhaize stores affected in Belgium and Luxembourg.\n\nThe Dutch supermarket giant told CNBC that there was an incident with refrigeration systems in dozens of its stores on Monday, which has resulted in food having to be discarded. It said the situation has since returned to normal with stores fully operational.\n\nMeanwhile, Colruyt Group said five of its Spar stores in Belgium were targeted, according to Reuters . French supermarket Carrefour told the BBC that 15 of its Belgian-based stores were attacked too. France's Intermarch\u00e9 also said 15 stores out of 153 in total were impacted in Belgium.\n\n\"In most cases, the security measures in place made it possible to quickly contain the attack,\" an Intermarch\u00e9 spokesperson told CNBC. \"However, a few stores did suffer some stock losses, although nothing comparable to the attack in mid-October.\n\n\"At this stage, the information available to us indicates that the bulk of the attack affected other players in the sector, notably Carrefour and Delhaize,\" they added.\n\nIKEA told CNBC that a cyber incident affected refrigerators and freezers at its Mons store in Belgium between Sunday and Monday.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 08:01 PM IST", "pub_date_relative": "52m ago"}, {"title": "ED Attaches Rs 510 Crore More Assets of Reliance Anil Ambani Group; Total Crosses Rs 23,000 Crore", "full_content": "The agency has cumulatively attached or seized assets worth nearly Rs 23,100 crores till date in several cases being investigated against Reliance Anil Ambani Group under the provisions of Prevention of Money Laundering Act (PMLA) and the Foreign Exchange Management Act (FEMA).", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:00 PM IST", "pub_date_relative": "53m ago"}, {"title": "Vision Quest Season 1 Episode 7 Release: Recap, Plot, When, Where To Watch \u2014 All You Need To Know", "full_content": "Paul Bettany leads the superhero series as Vision. The cast also includes Orla Brady as Friday, T'Nia Miller as Jocasta, Ruaridh Mollica as Tommy Maximoff/Thomas Shepherd, Lauren Morais as Lisa Molinari and James Spader as Ultron.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:00 PM IST", "pub_date_relative": "53m ago"}, {"title": "'Don't Let The Old Man In': Amitabh Bachchan Reveals His Sleep Struggle, Attempts To Go Back To Gym", "full_content": "This came weeks after Amitabh Bachchan slipped and fell on the sets of Kaun Banega Crorepati 18.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 07:59 PM IST", "pub_date_relative": "54m ago"}, {"title": "Who protects a music composer\u2019s legacy post death?", "full_content": "My late father was a music composer. He assigned the rights in his works to a film producer decades ago, and by virtue of subsequent assignments, a music label now owns them. The label has released a remix that distorts one of his best-known songs, and his name is missing from the streaming credits. Can our family do anything?\n\nYes. Even where a label owns the copyright in a song, Indian law gives the composer certain moral rights that remain with him even after he has parted with the copyright.\n\nThese rights are governed by Section 57 of the Copyright Act, 1957, which gives an author two rights:\n\nRight of attribution : The right to be identified as the author of the work.\n\nRight of integrity : The right to restrain, or claim damages for, any distortion, mutilation, modification or other act in relation to the work if it is prejudicial to the author's honour or reputation.\n\nThe family can, therefore, seek restoration of the composer's name in the credits if his musical work has been used in the remix. Whether they can also challenge the remix itself depends on what has been changed. If the remix distorts the song in a manner prejudicial to his honour or reputation, his legal representatives can seek to restrain it or claim damages.\n\nSubject to the terms of the assignment deed and the applicable law, when a composer assigns his song to a film producer or music label, he transfers the right to exploit it commercially. He does not transfer his right to be identified as the composer or his right to object to distortion of his work.\n\nBefore the 2012 amendment, a deceased composer's legal representatives could enforce the right against changes prejudicial to his honour or reputation, but could not exercise his right to claim authorship. The Copyright (Amendment) Act, 2012 removed that restriction with effect from 21 June 2012.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 07:58 PM IST", "pub_date_relative": "55m ago"}, {"title": "Goldman Sachs is bullish on stocks. Why it's also telling clients to hold cash near term", "full_content": "Things could get rocky for stocks near term, and investors should keep cash on hand to ride out the bumps, according to Goldman Sachs.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 07:58 PM IST", "pub_date_relative": "55m ago"}, {"title": "MTA should eliminate some jobs to prepare for budget woes, watchdog writes - Gothamist", "full_content": "MTA should eliminate some jobs to prepare for budget woes, watchdog writes Gothamist MTA could plug projected budget holes by taking conductors off more trains, making other reforms: fiscal watchdog report | amNewYork amNewYork NY\u2019s MTA Could Save $2.5 Billion With Faster Buses, Expense Cuts Bloomberg MTA could save $2.5 billion with faster buses, expense cuts: watchdog Audacy How Can the MTA Save $2.5 Billion? Long Island Life & Politics", "source": "Google News Business", "pub_date_str": "03 Nov 2026, 07:58 PM IST", "pub_date_relative": "55m ago"}], "cfa": [{"title": "Marshall Wace and Millennium hit as hedge funds suffer in October\u2019s AI rout", "full_content": "Wall Street\u2019s tech correction and bond market turbulence spark losses for sector", "source": "FT Markets", "pub_date_str": "03 Nov 2026, 08:51 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock market after midterm elections: What S&P 500 history shows", "full_content": "Markets are sweating it out ahead of the midterm elections , but the event historically heralds strong performance for stocks \u2014 regardless of whether it's a red or blue wave , split decision, or status quo in Washington.\n\nThe S&P 500 tends to perform well after both midterm and presidential elections. According to a CNBC analysis of S&P 500 returns after elections from 1980 through 2024, the index rose an average of 0.2% after one day and one week, and 1.1% after one month across both presidential and midterm elections.\n\nA year later, the index gained an average of 13.7% after midterms and 13.8% after presidential elections. Returns were positive in 91% of cases. And the S&P 500 was up after all 11 midterms from 1982 through 2022.\n\nShort-term returns were less reliable, particularly after presidential contests, which produced slightly negative average returns after one day and one week.\n\n\"There's some anxiousness before these elections,\" Ryan Detrick, CNBC contributor and chief market strategist at Carson Group, told CNBC. \"Once you are through it, it's a big relief and markets tend to do pretty well.\"\n\nStill, the market usually prefers divided government : one party in charge of the White House and the other holding at least one house of Congress.\n\nAcross 10 midterm and five presidential elections that left no single party in charge, the S&P 500 rose an average 15% after one year. One-year returns were positive in 14 out of 15 cases. By comparison, the index gained an average of 11.5% over the year after elections that resulted in single-party control.\n\n\"If you have a huge red wave or a big blue wave, markets actually kind of don't like that as much because you have too much spending one way and too much power,\" Detrick said.", "source": "CNBC Finance", "pub_date_str": "03 Nov 2026, 08:49 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Yum Brands earnings beat estimates, but cyclospora outbreak weighs on Taco Bell", "full_content": "Yum Brands on Tuesday reported earnings that beat expectations, but a cyclospora outbreak linked to iceberg lettuce at Taco Bell weighed on the company's same-store sales growth.\n\nHowever, Yum said Taco Bell, which the company considers a \"growth engine\" for its business, has since rebounded.\n\n\"Since the end of September, Taco Bell U.S. has been outpacing the [quick-service restaurant] industry on same-store sales growth,\" Yum CEO Chris Turner said in a statement.\n\nTaco Bell's same-store sales are up about 1% so far in the fourth quarter, CFO Ranjith Roy said on the company's earnings conference call Tuesday. In the last four weeks ended Friday, same-store sales have risen 3% compared with the year-ago period.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nYum reported fiscal third-quarter net income of $1.62 billion, or $5.92 per share, up from $397 million, or $1.41 per share, a year earlier.\n\nExcluding gains from its divestiture of Pizza Hut and other items, the restaurant company earned $1.56 per share.\n\nDuring the quarter, Yum completed its divestiture of Pizza Hut. It closed the sale of the pizza chain's business in mainland China to Yum China on Aug. 7 and sold the rest of Pizza Hut to LongRange Capital on Sept. 1. The company's third-quarter results include Pizza Hut up until those dates.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:49 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bill Ackman warns of 'casino' stock market as speculative trading grows", "full_content": "Bill Ackman worries that the stock market is broken, saying the rise of speculative trading is leading to wild price swings thanks to the amount of leverage in the system.\n\n\"Every number of days, I feel like markets are broken,\" Ackman told CNBC's \" Squawk Box \" on Tuesday. \"Stocks trade at prices that make no sense to me. Yes, it's good if you're a long-term investor and you can buy at a stupid price. I don't think it's good for the country generally.\"\n\n\"We're back to the casino type markets when there was 95% leverage,\" he added. \"I don't think that's inherently good for the economy, for society, and it's leading to these massive moves in stocks.\"\n\nThe founder of Pershing Square Capital Management said those same dislocations in the market have given the hedge fund the opportunity to snag big bargains.\n\nPershing bought Microsoft , for example, when it was pummeled during the \"SaaSpocalypse\" earlier this year, and Amazon when it fell following President Donald Trump's tariffs. It also bought Alphabet when the stock moved \"massively\" following ChatGPT's launch, he said.\n\nBut the billionaire investor worries that the rise of one-day leveraged vehicles, perpetual futures and sports betting is dangerous for investors who are treating the stock market as a get-rich-quick scheme \u2014 an attitude that could have disastrous consequences.\n\n\"It's good for us long term, us being Pershing Square,\" he said. \"I don't think it's good for the country.\"\n\nAmong the stocks Ackman is especially bullish on are Visa and Mastercard , which he called among the world's \"greatest\" businesses, as well as streaming platform Netflix, in which he disclosed a position in August.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:46 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Shopify falls 9% after Q3 revenue and merchandise volume miss estimates", "full_content": "Shares of e-commerce platform Shopify plunged 9% in early trading on Tuesday after the company missed estimates on subscription gross profit and gross merchandise volume.\n\nShopify reported before the bell Tuesday and posted adjusted earnings of 49 cents per share, topping LSEG estimates of 46 cents per share.\n\nOverall, quarterly revenue of $3.74 billion came in just below LSEG estimates of $3.75 billion. Shopify said it sees revenue growth in the \"low thirties\" range year over year for the fourth quarter, versus LSEG estimates of 32.1%.\n\nGross merchandise volume, which came in at $119.15 billion, missed analyst estimates of $120.03 billion for the quarter, according to StreetAccount. Subscription gross profit also missed estimates by nearly $20 million, coming in at $661 million compared to StreetAccount estimates of $680.3 million. Merchant gross profit beat estimates.\n\nSubscription revenue of $836 million also missed analyst estimates of $848.1 million, according to FactSet. Merchant revenue beat estimates.", "source": "CNBC World Economy", "pub_date_str": "03 Nov 2026, 08:45 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Midterm Election Results 2026 date today! What Trump's loss mean for gold, Sensex, Nifty, global markets, US bonds?", "full_content": "US Midterm Election Results 2026 date today: The most awaited US Midterm Election Results date has arrived and the final outcome is expected to become public in the next 18-20 hours. However, the first US Midterm Election Result 2026 can be expected by 4:30 AM in India on Wednesday (read 23:00 GMT on Tuesday in the US).\n\nIn an NBC poll released on Sunday, quoted by Al Jazeera, 75% of respondents said they were dissatisfied with the state of the US economy, and 51% said they were dissatisfied with their personal financial situation.\n\nAl Jazeera also quoted a Pew Research Centre survey, conducted between September 28 and October 4, suggested that 84 percent of registered voters considered the economy very important to their midterm vote. It was the top issue for 82 percent of respondents who prefer Republican candidates, and 88 percent for those who back Democrats.\n\nSpeaking on the possible outcome that we can expect from the US Midterm Election Results 2026, the ICICI Bank's global markets report said, \u201cRepublicans currently hold a majority in both chambers. However, Democrats are expected to sweep the midterm i.e., gain control of both the House and the Senate. Democrats are likely to win a simple majority, and this should give control of one or both chambers to more Congressional power and oversight.\u201d\n\nExpecting an upside in the US stock market, if Trump's Republicn Party suffers a setback in the US Midterm Elections, Anuj Gupta, a SEBI-registered market expert, said, \u201cTrump's loss would have a direct impact on the US currency and the US bond market. These two assets are expected suffer due to the policy paralysis scenario after Democrats victory, and the smart money is expected to move from the US bond and US dollar to the US equities.\u201d\n\nThe SEBI-registered market expert said that most of the US indices, including are trading green on Tuesday during the OPpening Bell on Wall Street.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 08:43 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI launches 3 surveys to capture inflation expectations, consumer confidence ahead of December policy meeting", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI launches 3 surveys to capture inflation expectations, consumer confidence ahead of December policy meeting The Economic Times daily newspaper is available online now. Read Today's Paper RBI launches 3 surveys to capture inflation expectations, consumer confidence ahead of December policy meeting SECTIONS RBI launches 3 surveys to capture inflation expectations, consumer confidence ahead of December policy meeting ET Online Last Updated: Nov 03, 2026, 08:40:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Reserve Bank of India has announced the November 2026 round of the Inflation Expectations Survey of Households. This survey aims to capture households' perceptions regarding price movements and inflation based on their consumption patterns. Additionally, the Urban Consumer Confidence Survey seeks to understand household sentiments on the economic situation and employment. The Rural Consumer Confidence Survey collects perceptions from rural areas on economic conditions, income, and spending.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "03 Nov 2026, 08:40 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "We're trimming some more off a stock that's enjoying nice post-earnings gains", "full_content": "Like we said Monday, we're still unsure what the next catalyst is.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:39 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia, SK Hynix, SanDisk Spike Up To 7% Ahead Of AMD Earnings As Chips Rebound From Multi-Week Selloff", "full_content": "Among major chip stocks, SanDisk surged the most, up 7.15% to $1,151,9 apiece, followed by AMD, which rose 6.14% to $496.76 and Micron traded 4.42% higher at $870.48.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:34 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Archrock beats on q3 2026 profit, shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:33 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Horace Mann earnings on deck as profitability test looms ahead", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:33 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Pinnacle West earnings beat by $0.29, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:33 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Fiserv tops Q3 2026 EPS forecast, shares jump 7.8%", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Versigent earnings loom as investors eye post-spinoff momentum", "full_content": "", "source": "Investing.com News", "pub_date_str": "03 Nov 2026, 08:32 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Apple shares fall 4% despite revenue beat in first earnings under CEO John Ternus; what's next for the iPhone maker?", "full_content": "Shares of Apple Inc. slipped 4% in Tuesday\u2019s trade on November 3, falling to $325 apiece, as the company\u2019s fourth-quarter performance offered a mixed picture to investors. The results also marked the first quarterly report under its new Chief Executive Officer, John Ternus.\n\nThe iPhone maker reported revenue of $114.5 billion for the fiscal fourth quarter ended September 26, up 12% from the same period last year. The figure narrowly beat analysts\u2019 estimates, with the average projection at $113.5 billion, according to data compiled by Bloomberg .\n\nTernus became CEO on September 1, putting him in charge for the final month of Apple\u2019s fourth quarter. He has since overseen the unveiling of the foldable iPhone Duo, touchscreen MacBook Pro, and HomeView hub, although none of these products went on sale until the current quarter, which runs through December.\n\niPhone revenue, which accounted for the bulk of the company\u2019s top line, reached $57.6 billion, up from $49.0 billion a year earlier. This indicates that the company is weathering a shift in its product launch schedule. Apple typically launches multiple new iPhone models in September, but this time it released only the iPhone 18 Pro line.\n\nThe regular iPhone 18 and the new iPhone Air are not expected to arrive until the first half of 2027, while the foldable iPhone Duo was launched only on October 23, well into the following quarter.\n\nServices, a segment that includes music streaming, the App Store, iCloud subscriptions, Apple TV and other digital offerings, rose 9.8% to $31.6 billion, in line with estimates. Earnings came in at $2.10 per share, beating the estimate of $2.\n\nMac revenue climbed 24% to $10.8 billion, significantly exceeding the average analyst projection of $9.7 billion. A fresh wave of products is also expected to help sustain momentum. The company\u2019s touchscreen MacBook Pro, refreshed iMac, and new entry-level MacBook Pro are scheduled to ship on November 6.\n\nMemory is the problem.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 08:29 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Crude oil prices fall for second day as market hopes for diplomatic resolution to Iran war", "full_content": "Crude oil prices fell Tuesday for a second consecutive session, as the market hopes the U.S. and Iran will reach a diplomatic settlement to the conflict that has disrupted global energy supplies for eight months.\n\nU.S. West Texas Intermediate futures were 42 cents lower to $96.04 a barrel after dipping below $95 earlier. Brent crude futures, the international benchmark, were down $1.23 at $103.54 a barrel. The move lower came after rumors circulated the U.S. and Iran were making progress toward a deal.\n\nOil sold off more than 7% on Monday after Washington and Tehran signaled they were both open to discussions to reach a settlement. President Donald Trump told reporters Tehran wants \"to make a deal and that could happen.\"\n\nQatar is continuing to mediate talks between the U.S. and Iran, the Gulf state's foreign ministry said Tuesday. A delegation from Qatar held talks in Tehran in an effort to reach an agreement that prevents further escalation in the region and ends the U.S.-Iran conflict, the foreign ministry said.\n\nThe market had been pricing in the risk of escalation after the U.S. midterm elections, as reports circulated that Washington was drafting plans for strikes on Iran. Crude prices gained more than 10% in October in response.\n\nThe situation in the Middle East remains volatile and there's still substantial risk that fighting could break out. Washington attacked Iran's Qeshm Island on Monday, U.S. officials told The Wall Street Journal, adding that the U.S. has been carrying out \"limited strikes\" against the country in recent weeks.\n\nThe military campaign against Iran has been kept deliberately low-profile to avoid signaling plans for a major escalation in fighting, the report said, quoting an unnamed official.\n\nAnd commercial ships continue to come under attack in the Persian Gulf, Strait of Hormuz and Gulf of Oman. At least four ship attacks have been reported since the start of the month, according to the United Kingdom Maritime Trade Operations Centre.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:27 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stocks are at their highest in two months; why are analysts flagging caution?", "full_content": "Indian stocks rose for the fourth straight day on Tuesday, reaching their highest level in the last two months, supported by a decline in crude oil prices and optimism ahead of the US mid-term elections. However, a key contrarion indicator suggests that the market may have entered overbought territory, raising the possibility of a decline as investors sell shares to book profits.\n\nThe Nifty closed 1.58% higher at 23,810.85, its highest since 4 September, while the BSE Sensex advanced 1.62% to settle at 76,917, the highest since 1 September. The market capitalization of BSE-listed companies rose by \u20b9 4.5 trillion. Foreign institutional investors turned net buyers for the third consecutive day, buying shares worth \u20b9 6,856 crore on Tuesday, provisional data from NSE showed.\n\nThe Nifty is now trading 7.3% above its 52-week intraday low of 22,179.9 on 8 October, triggering expectations that markets might be close to topping out and could witness profit-taking in the short term. The indicator in question is the Nifty aggregate put-call ratio (PCR) open interest which reached 1.52, its highest since 5 January's 1.46, signalling that the market might be overbought.\n\nOpen interest refers to the outstanding buy-sell options positions at various Nifty levels.\n\nAfter the PCR touched a high of 1.46 on 5 January this year when the Nifty was at a record high of 26373.2, the index plunged 16% till October. The rise in PCR above early January levels has analysts advising caution.\n\nA 1.52 ratio implies that for every 100 call options on Nifty sold, traders have sold 152 puts, hoping that the markets would rise and they could pocket the premium paid by put buyers. This is why the indicator is known as a contrarion one because a higher quantum of puts, instead of being seen as bearish, is seen as a bullish sign.", "source": "LiveMint Markets", "pub_date_str": "03 Nov 2026, 08:22 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hormuz Won't Reopen Till US Meets 7 Conditions: Iran Draws Red Line; Oil Prices Off Day's Low", "full_content": "Brent crude was trading near $103.50 a barrel, while West Texas Intermediate (WTI) futures were around $96 a barrel.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:19 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "The 'poison pill' ballot measure that could kill the California billionaire tax", "full_content": "The Inside Wealth newsletter by Robert Frank is your weekly guide to high-net-worth investors and the industries that serve them.\n\nThe California billionaire tax could face a stiff challenge from a competing ballot measure that would ban state taxes on retirement accounts, according to tax experts.\n\nCalifornia voters will decide the fate today of Proposition 40, known as the Billionaire Tax Act, which would impose a one-time tax of 5% on the total net worth of Californians worth over $1 billion. The so-called \"billionaire tax\" is one of the most widely watched ballot measures this election season, since it would be the first state tax on net worth and taps popular anger over the rising power and wealth of tech billionaires.\n\nThe tax requires a simple majority to pass. Since it would only tax the state's roughly 250 billionaires, many political experts initially predicted easy passage. Yet a recent poll by the Public Policy Institute of California shows it falling short, with 46% supporting and 52% against.\n\nSupporters of the tax blame a $300 million ad blitz funded by tech billionaires and business groups opposing the measure. Many of the ads claim the ballot measure would allow the Legislature, with a two-thirds vote, to expand the tax to everyday Californians.\n\nYet tax experts cite another potential roadblock to the tax: Proposition 42.", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:16 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Ferrari raises 2026 guidance after Q3 earnings beat", "full_content": "Ferrari on Tuesday raised its 2026 guidance after the sports car maker slightly beat Wall Street's third-quarter expectations.\n\nHere's how Ferrari performed in the third quarter compared with average estimates compiled by LSEG:\n\nFerrari raised its guidance to revenue of 7.65 billion euros, up from 7.6 billion euros; adjusted earnings before interest, taxes, depreciation and amortization to 3 billion euros, up from 2.97 billion euros; and adjusted EPS to at least 9.85 euros, up from at least 9.68 euros.\n\nThe automaker also upgraded its expectations for industrial free cash flow to up to 1.65 billion euros, up from previous expectations for at least 1.55 billion euros.\n\nThis is the second consecutive quarter Ferrari has raised its 2026 guidance, despite vehicle shipments being lower by 318 units through the first nine months of the year, at 10,170 vehicles, compared with last year. The decline is led by fewer shipments to the Americas and China, Hong Kong and Taiwan.\n\nFerrari said Tuesday that the guidance improvements were a result of stronger-than-expected customer personalizations, lower than anticipated currency headwinds and a second place finish in the Formula 1 championship.\n\n\"Our order book now reaches into 2028, and we still have two more launches to come this year. In addition, we continue to create engaging events around the world to further tighten the bonds with our clients and partners across Racing, Sports Cars and Lifestyle,\" Ferrari CEO Benedetto Vigna said in a release.\n\nRBC Capital Markets analyst Tom Narayan said Tuesday that Ferrari's results were largely in line with Wall Street expectations. However, he said shares may be under \"under slight pressure given some were hoping for a bigger guidance raise, but expect it to get better once folks realize these results are healthy.\"", "source": "CNBC Top News", "pub_date_str": "03 Nov 2026, 08:13 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold vs Silver ETFs before Diwali 2026: Which delivered better returns? What risks should investors check before buying?", "full_content": "With Diwali approaching, investors looking to add precious metals to their portfolios face a choice between gold and silver exchange-traded funds (ETFs). While both offer exposure to precious metals without the need to purchase or store physical bullion, their returns and risk profiles differ considerably.\n\nValue Research data shows that silver ETFs delivered an average return of 25.04% over one year, compared with 15.79% for gold ETFs. Over three years, silver ETFs generated average returns of 35.96%, against 30.58% for gold ETFs.\n\nHowever, the recent performance paints a different picture. Over three months, gold ETFs declined 3.86%, while silver ETFs fell 17.04%. This highlights the sharper price fluctuations investors may have to contend with when investing in silver.\n\nThe performance difference reflects the distinct demand drivers of the two precious metals. While silver has benefited from its industrial demand and investment interest, gold has traditionally attracted investors seeking a safe-haven asset.\n\nThe three-month performance data also highlights the difference in their downside risks. Silver ETFs have corrected more sharply than gold ETFs, making it important for investors to consider their risk appetite rather than choosing a fund solely based on historical returns.\n\nAmong individual schemes, Tata Silver ETF delivered the highest one-year return in the silver category at 20.51%, followed by SBI Silver ETF at 20.36%. In the gold category, Aditya Birla Sun Life Gold ETF topped the list with a one-year return of 12.93%, followed by Quantum Gold ETF at 12.89%.\n\nGold and silver have different demand drivers, which explains why their prices do not always move in tandem.\n\nGold derives much of its value from safe-haven demand, central bank purchases and investment demand. Silver, meanwhile, has a significant industrial component to its demand, with applications across sectors such as electronics, solar energy and manufacturing.", "source": "LiveMint Money", "pub_date_str": "03 Nov 2026, 08:12 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Stock Market Today: Dow Down 200 Points Ahead Of Midterm Verdict; Nasdaq Climbs On Chips Rebound", "full_content": "According to JP Morgan, a victory of the House and Senate by Democrats could result in sell-off for artificial intelligence stocks.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:11 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India vs Dubai vs Pakistan: Where Is Gold Cheapest On Nov. 3? Check 22K And 24K Rates", "full_content": "Gold prices vary between countries due to several factors, including movements in global bullion markets, changes in currency values and differences in domestic taxes and import duties.", "source": "NDTV Profit", "pub_date_str": "03 Nov 2026, 08:11 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US stocks today: S&P 500, Nasdaq open higher as oil prices extend declines, midterms on tap", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US stocks today: S&P 500, Nasdaq open higher as oil prices extend declines, midterms on tap Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks today: S&P 500, Nasdaq open higher as oil prices extend declines, midterms on tap SECTIONS US stocks today: S&P 500, Nasdaq open higher as oil prices extend declines, midterms on tap Reuters Last Updated: Nov 03, 2026, 08:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The S&P 500 and the Nasdaq opened higher on Tuesday as crude oil prices fell further heading into the US midterm elections, while Apple joined the list of Big Tech companies whose\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.",
