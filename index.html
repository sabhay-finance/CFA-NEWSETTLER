<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Trump says new White House press secretary Katie Zacharia should 'reconsider' job", "full_content": "President Donald Trump on Friday opened the door for new White House press secretary Katie Zacharia to step down just days after getting the job.\n\nTrump said he had just told Zacharia, \"If I were you, I'd reconsider.\"\n\nZacharia has faced criticism in the days since she led a shaky first press briefing. She also has faced scrutiny about her legal background.\n\nThe White House did not immediately respond to CNBC's request for comment on Trump's remarks.\n\nTrump spoke outside the White House before heading to Georgia for a political rally as he hopes to boost Republicans' electoral chances with just 18 days until the midterms.\n\nBut Trump's efforts to sell his agenda have been muddled in part by Zacharia, who ended her first, and so far only, press briefing on Tuesday after delivering halting remarks and taking questions from just three reporters.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 11:02 PM IST", "pub_date_relative": "just now"}, {"title": "S&P 500 dragged down by AI stocks as chip shares head for worst week since July: Live updates", "full_content": "Stocks were lower on Friday as traders headed for a mostly losing week amid a rotation out of tech and artificial intelligence-related names.\n\nThe S&P 500 traded down 1%, while the Nasdaq Composite shed 1.9%. The Dow Jones Industrial Average outperformed as it fell 241 points, or 0.5%.\n\nChipmakers were lower again. The VanEck Semiconductor ETF (SMH) lost 1%, led by declines in Micron Technology , Advanced Micro Devices and Sandisk . Semiconductors have struggled this week amid jitters about competition from China . The SMH is down 8% week to date, on pace for its biggest weekly decline since July.\n\nThose declines, coupled with drops in other stocks linked to AI, put the S&P 500 on pace for a losing week. The benchmark index is down nearly 2% this week, while the Nasdaq has shed more than 4%. The Dow, on the other hand, has moved higher by less than 1% on the week.\n\nInvestors have also grown concerned that tech companies are borrowing too much for the AI buildout . Shares of neoclouds like CoreWeave , which has seen its total debt rise to more than $51 billion , were down 10%, putting the stock's week-to-date losses at more than 23%.\n\n\"The question is: Is this a systemic issue?\" said Michael Rosen, Angeles' chief investment officer. \"Obviously, increased debt issuance is something to observe and continue to watch and be concerned about if it continues to get to levels of excessiveness. But we're not remotely close to that right now.\"\n\nOther areas of the market such as energy saw gains Friday, with stocks like Chevron helping to keep the Dow's losses in check. That's as oil prices moved higher amid rising tensions between the U.S. and Iran as well as between Russian and Ukraine.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:59 PM IST", "pub_date_relative": "3m ago"}, {"title": "Putin says Russia is building non-negotiable \u2019security zone\u2019 in Ukraine along border", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:54 PM IST", "pub_date_relative": "8m ago"}, {"title": "European Commission to propose additional China import curbs", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:54 PM IST", "pub_date_relative": "8m ago"}, {"title": "Cboe hires Catherine Grover as chief human resources officer", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:50 PM IST", "pub_date_relative": "12m ago"}, {"title": "Marriott vs. Hilton: MAR offers lower valuation and stronger revenue growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:50 PM IST", "pub_date_relative": "13m ago"}, {"title": "FAA bans unauthorized drones along US-Mexico border", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:46 PM IST", "pub_date_relative": "16m ago"}, {"title": "UMH Properties director William Mitchell purchases $1,000 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:46 PM IST", "pub_date_relative": "16m ago"}, {"title": "Earnings call transcript: Punjab National Bank posts strong Q2 2026 profit growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:42 PM IST", "pub_date_relative": "20m ago"}, {"title": "Warsh signals steady Fed outlook despite inflation jump - Axios", "full_content": "Warsh signals steady Fed outlook despite inflation jump Axios Fed's Warsh withholds rate signal, praises recent global tightening CNBC Fed Chair Kevin Warsh warns of AI 'shock' for economy, pledges to contain inflation ABC News - Breaking News, Latest News and Videos Warsh Vows to Tame Inflation as A.I. Delivers \u2018Shock\u2019 to Economy The New York Times U.S. Stocks Mixed as Investors Pare Rate-Hike Bets WSJ", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 10:41 PM IST", "pub_date_relative": "21m ago"}, {"title": "City Therapeutics surges in market debut after upsizing $200M IPO", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:39 PM IST", "pub_date_relative": "23m ago"}, {"title": "David Taylor from Ohio\u2019s 2nd District makes multiple stock transactions", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:38 PM IST", "pub_date_relative": "25m ago"}, {"title": "Reliance-backed Jio Platforms IPO: \u20b91 lakh crore gains for Meta, Google in \u20b930,213 cr issue by Mukesh Ambani firm?", "full_content": "Meta Platforms and Google could be sitting on nearly \u20b9 1 lakh crore in combined paper gains from their investments in Jio Platforms as the Reliance Industries-backed digital services company prepares to launch next week what is set to become country's largest-ever initial public offering (IPO).\n\nMeta Platforms owns a 10% stake through Jaadhu Holdings LLC, while Google International LLC holds a 7.73% stake. However, neither existing shareholder is selling shares through the IPO.\n\nAt the upper end of Jio Platforms\u2019 IPO price band of \u20b9 1,119 per share, the two US technology giants could see returns of approximately 129% on their investments made in 2020, according to estimates highlighted in Groww\u2019s LinkedIn post on Friday, October 16.\n\nThe issue is entirely a fresh issue of up to 27 crore equity shares, with no offer-for-sale (OFS) component. This means existing investors will not sell their shares through the IPO. At the upper end of the price band of \u20b9 1,119 per share, Jio Platforms\u2019 IPO is expected to raise approximately \u20b9 30,213 crore.\n\nReliance Industries Group will become India\u2019s largest conglomerate by the combined market capitalization of its listed companies after Jio Platforms makes its stock market debut, Kotak Mahindra Bank founder Uday Kotak said on Thursday.\n\nUnlike an offer for sale, in which existing shareholders sell their holdings and receive the proceeds, a fresh issue involves the company issuing new shares to investors. The proceeds therefore go to the company rather than to shareholders seeking to reduce or exit their investments.\n\nIn Jio Platforms\u2019 case, the proceeds are earmarked primarily for the full or partial repayment or prepayment of certain outstanding borrowings of its material subsidiary, Reliance Jio Infocomm Ltd, along with general corporate purposes.\n\nThe structure means that existing investors, including Meta Platforms and Google, are not using the IPO to sell their holdings.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:37 PM IST", "pub_date_relative": "25m ago"}, {"title": "Plug Power stock hits 52-week low at 1.4 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:37 PM IST", "pub_date_relative": "25m ago"}, {"title": "Here\u2019s how the Fed should reveal its outlook for the economy", "full_content": "As Chairman Kevin Warsh looks to revamp the central bank\u2019s communication strategy, the dot plot is ripe for change.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 10:37 PM IST", "pub_date_relative": "26m ago"}, {"title": "A 30% salary hike or bedtime with his toddler? Parent's career dilemma sparks debate over the real cost of switching job", "full_content": "A 30% salary hike may look like an obvious career move, but for a parent with a toddler, a better-paying job can come with a less visible cost. Longer commutes, additional childcare expenses and fewer evenings with the child can reduce the financial benefit of switching jobs.\n\nThe dilemma raises a practical personal-finance question. How much of a higher salary does an employee actually get to keep after income tax and the additional costs of taking up a new job?\n\nThe answer depends on more than the headline increment. The salary structure, tax liability, commuting expenses and childcare arrangements all affect the amount left over at the end of the month. A parent must also weigh these monetary gains against the time the new role demands.\n\nConsider an employee earning \u20b9 18 lakh a year who receives a 30% hike to \u20b9 23.4 lakh. Assuming the new tax regime, a \u20b9 75,000 standard deduction and no other income or deductions, the additional tax reduces the benefit of the raise.\n\nThe employee's gross salary increases by \u20b9 5.4 lakh a year, but the additional tax reduces the gain to about \u20b9 4.14 lakh annually, or \u20b9 34,492 a month, before accounting for the extra costs of the new job.\n\nThe post-tax increase is not the final financial gain. If the new job requires the parent to leave home earlier or return later, the family may need to pay for additional daycare hours, a nanny or household help. A longer commute can also increase fuel, cab or public transport expenses.\n\nTo see how these costs affect the decision, assume the employee incurs an additional \u20b9 5,000 a month on commuting, \u20b9 12,000 on childcare and \u20b9 3,000 on meals and other work-related expenses. These are illustrative assumptions, not verified expenses from the parent's situation.\n\nIn this scenario, just under \u20b9 14,500 a month remains after tax and additional expenses. The employee receives a 30% increase in gross salary, but the net financial gain is considerably smaller.", "source": "LiveMint Money", "pub_date_str": "16 Oct 2026, 10:34 PM IST", "pub_date_relative": "28m ago"}, {"title": "Here's who Netflix just brought in to run content \u2014 and what it means for the streamer", "full_content": "Netflix is shaking up its C-suite in an effort to fix its engagement woes.\n\nOn Thursday, the streaming giant announced that former Disney executive Peter Rice will take over as the company's chief content officer, overseeing global content organization, including scripted and unscripted series, film and live events.\n\nRice is replacing 10-year Netflix veteran Bela Bajaria, who most recently led the company's global content team with a focus on its live sports strategy . Bajaria was initially hired in 2016 to help the streamer launch an unscripted division as well as licensing and studio co-productions. She later transitioned to the top creative role, spearheading Netflix's $20 billion content budget.\n\nShe oversaw popular TV series like \"Stranger Things,\" \"Wednesday,\" \"Bridgerton,\" \"Squid Game,\" \"Adolescence\" and \"Beef,\" as well as Netflix films like \"Frankenstein\" and \"KPop Demon Hunters.\" Bajaria also helped push Netflix into live sports and events, including deals with the WWE and the NFL as well as programs like \"The Roast of Tom Brady.\"\n\nPrior to his stint at Disney, Rice was president of 21st Century Fox and CEO of Fox Networks Group as well as Fox's lead executive on the Hulu board. He was also the president of Fox Searchlight Pictures and helped release \"Slumdog Millionaire,\" \"Juno,\" \"Little Miss Sunshine\" and \"Sideways.\"\n\nThe executive change follows a tumultuous period for Netflix as it faces stagnating viewership and explores avenues for growth.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:32 PM IST", "pub_date_relative": "30m ago"}, {"title": "Prediction market odds on Tesla-SpaceX merger are above 50% for early 2027", "full_content": "Following a Barclays note Wednesday that outlined what a merger between Tesla and SpaceX could look like, prediction market traders increased the odds of an integration above 50% for early 2027.\n\nOdds of a merger happening before March jumped to 56% by Friday morning, up from 29%. Odds for an integration before April and May climbed to similar levels.\n\nThe contract asks, \"When will Tesla and SpaceX merge?\" and will be verified by news outlets and the Securities and Exchange Commission's EDGAR database.\n\nTesla, known for its electric vehicles, and SpaceX, a rocket and satellite company, have collaborated before. Both are controlled by Elon Musk.\n\nOn Thursday, Tesla showed off its long-delayed Roadster , which relies on SpaceX technology to make the vehicle hover. A video showcasing the Roadster's capabilities was also recorded from SpaceX's test site in Texas.\n\nBeyond collaboration, the growing speculation of a merger comes after Musk spoke of \"more and more overlap\" between Tesla and SpaceX on the EV maker's latest earnings call.\n\nBarclays now expects a merger could be announced before Tesla's annual general meeting, which must take place no later than Dec. 6, 2026. Analyst Dan Levy expects the merger may be proposed as an AI vertical integration, involving Tesla's Robotaxi and Optimus with SpaceX's Grok and Macrohard.\n\nTerafab, the semiconductor project relying on Tesla, SpaceX and xAI, could also be a \"key driver\" for the merger, Levy added.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:32 PM IST", "pub_date_relative": "30m ago"}, {"title": "Treasuries head for big weekly gains as AI jitters halt bond rout", "full_content": "Borrowing costs fall back from highest levels in decades as investors seek safety in government debt", "source": "FT Markets", "pub_date_str": "16 Oct 2026, 10:25 PM IST", "pub_date_relative": "37m ago"}, {"title": "Why Trump and the GOP's billion-dollar midterm blitz isn\u2019t working", "full_content": "A billion-dollar war chest was meant to be Republicans' great equalizer heading into a bleak midterm election environment defined by economic frustration , President Donald Trump's unpopularity and fallout from the war in Iran .\n\nFrom Labor Day through Oct. 14, GOP groups injected more than $740 million into congressional races that will determine control of Congress , according to a CNBC analysis of AdImpact data. That includes at least $220 million in spending from Trump-linked groups. Elon Musk has separately given another $276 million to Republican groups since July and helped boost the GOP's Senate Leadership Fund super PAC to a record quarter .\n\nYet with less than three weeks until the Nov. 3 Election Day, the spending blitz has barely moved the map. Democrats lead in FiftyPlusOne's polling averages across nine of the Senate's most competitive races \u2013 Alaska, Georgia, Iowa, Kansas, Maine, Michigan, Minnesota, New Hampshire, North Carolina, Ohio and Texas \u2013 little changed from before the Republican spending spree. Minnesota was expected to be solidly blue, making its tight race a concern for Democrats.\n\nAnd Republican political operatives and independent election observers CNBC spoke with say the money hasn't had the effects its magnitude would be expected to in voter sentiment.\n\nMeanwhile, the broader battlefield continues to deteriorate for Republicans. Democrats are favored to flip the House and remain competitive in the Senate , according to the Cook Political Report with Amy Walter , forcing the GOP to burn millions protecting once-safe seats while abandoning former pickup targets.\n\n\"Money is an amplifier, not a magic wand,\" said Neil Newhouse , partner at Republican polling firm Public Opinion Strategies.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:23 PM IST", "pub_date_relative": "39m ago"}, {"title": "U.S. presses China on Mastercard, Citigroup market access in bilateral Bangkok talks, official says", "full_content": "BANGKOK \u2013 U.S. officials pressed Beijing on market access issues for Mastercard Inc and Citigroup Inc during at least two bilateral meetings with Chinese counterparts in Bangkok this week, according to a U.S. Treasury official.\n\nThe Treasury delegation, led by Deputy Secretary Francis Brooke, held bilateral meetings with officials from the People's Bank of China and the finance ministry on the sidelines of the Group of 20 finance meetings and the IMF-World Bank annual gathering this week, the official said, speaking on condition of anonymity to discuss the closed-door meetings.\n\nThe talks included market access for U.S. companies, including Mastercard, Visa and Citigroup, the official said, adding that regulatory approval was part of the agreement reached during the meeting between Presidents Donald Trump and Xi Jinping during the latter's state visit in Washington last month.\n\nThe sideline meetings in Bangkok continued discussions on implementing these deals, the official said.\n\nThe PBOC, China's National Financial Regulatory Administration, China Securities Regulatory Commission, Chinese embassies in Singapore and Thailand, the U.S. Treasury Department press office and Visa did not immediately respond to CNBC's request for comment. Citigroup and Mastercard declined to comment.\n\nThe progress follows China's Oct. 13 approval for Visa Inc. to begin preparing a wholly owned domestic card-clearing business . Visa has up to a year to prepare before it applies for an operating license, the PBOC has said .\n\nChina has opened much of its financial sector to foreign firms since 2018, gradually lifting foreign ownership caps on services such as securities, futures and fund management. It still limits cross-border capital flows and has kept state-backed domestic players dominant in payments.\n\nMastercard currently operates yuan card payments in China through a local joint venture with NetsUnion Clearing Corp., which began operating in 2024.", "source": "CNBC Finance", "pub_date_str": "16 Oct 2026, 10:16 PM IST", "pub_date_relative": "46m ago"}, {"title": "From 50% Slump To 250% Rally: What's Behind This Small-Cap Multibagger AI Stock's Upwing?", "full_content": "E2E Networks shares have surged approximately 249.14% in 2026 after losing 50% in 2025. Rising demand for AI computing infrastructure, a Rs 1,000-crore sovereign AI contract and strong September-quarter earnings have helped revive investor interest.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 10:16 PM IST", "pub_date_relative": "47m ago"}, {"title": "The drumbeat to buy battered shares of CoreWeave is growing louder on Wall Street", "full_content": "Analysts are saying the sell-off, which is continuing Friday, are \"overblown.\"", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:12 PM IST", "pub_date_relative": "50m ago"}, {"title": "The Emerging-Market AI Divide: How World Bank Plans To Democratise 'Small AI' For Small Businesses", "full_content": "World Bank President Ajay Banga says practical AI tools can help small businesses in developing economies overcome barriers to finance, reach new markets and create jobs.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 10:09 PM IST", "pub_date_relative": "53m ago"}, {"title": "Are we spending our retirement money in the right order? Our plan is: Social Security, annuities, cash \u2014 then IRA.", "full_content": "Spending all your cash first can make your income surge in later years.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 10:09 PM IST", "pub_date_relative": "54m ago"}, {"title": "Elon Musk may have just taken a major step toward consolidating his empire", "full_content": "Tesla\u2019s newly unveiled flying sports car, which features SpaceX rocket thrusters, could help Musk push for a merger between his two biggest companies, analysts say,", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 10:09 PM IST", "pub_date_relative": "54m ago"}, {"title": "Anything not tied to artificial intelligence took off this week", "full_content": "S&P 500 stocks beyond the realm of AI are on pace for their second-largest weekly outperformance since 2024.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:08 PM IST", "pub_date_relative": "54m ago"}, {"title": "\u20b930 dividend: ICICI Prudential AMC dividend record date ahead! Check yield, payout history, stock performance", "full_content": "Dividend alert: Shares of ICICI Prudential Asset Management Company (AMC) Limited are likely to remain in focus ahead of the upcoming record date for dividend. The AMC has announced \u20b9 30 per equity share dividend for the financial year 2026-27.\n\nICICI Prudential AMC stock closed marginally lower on Friday, October 16. The stock has declined 9.55% in three months and around 14.68% in six months. Here are all the details about ICICI Prudential AMC payout.\n\nLast week, the company\u2019s board of directors had approved \u20b9 30 interim dividend to eligible shareholders, which is 3000% of the stock\u2019s face value of Re 1 each.\n\nThe board has fixed Wednesday, October 21, as the record date to determine the eligibility of shareholders for the payout. ICICI Prudential AMC board greenlit \u201cdeclaration and payment of interim dividend of \u20b9 30 per equity share to the equity shareholders of the Company, whose names appear in the Register of Members of the Company or in the records of Depositories as beneficial owners of the shares as on October 21, 2026, being record date fixed for this purpose,\u201d as per the company\u2019s BSE filing.\n\nWhich means that investors must own the stock by October 20 to qualify for the payout.\n\nOver the past 12 months, ICICI Prudential AMC has announced an annual payout of \u20b9 27.25 per equity share. Its dividend yield stood at 0.97%.\n\nThe stock closed 0.90% lower at \u20b9 2811.75 per share on BSE with an Mcap of \u20b9 1,38,973.14 crore on Friday. Its share price value has declined 7.16% in one week, 9.05% in two weeks and around 8.87% in one month. Over the last six months, the stock has delivered - 14.68% return, but has surged 7.10% in 2026 so far.\n\nThe Maharashtra-headquartered AMC reported 6.1% rise in profit after tax at \u20b9 889 crore for September quarter FY27 on the back of higher revenue from operations. The company had logged a profit of \u20b9 838 crore in the year-ago period.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:04 PM IST", "pub_date_relative": "58m ago"}, {"title": "Stocks making the biggest moves midday: CoreWeave, Moog, J.B. Hunt, Alcoa & more", "full_content": "These are the stocks posting the largest moves midday.", "source": "CNBC Finance", "pub_date_str": "16 Oct 2026, 09:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "OpenAI Saudi national bugging case shows threat to U.S. leadership in AI: DNI Clayton", "full_content": "U.S. companies and the Trump administration both \"need to be wary\" of foreign espionage attempts as the race for artificial intelligence dominance continues, Director of National Intelligence Jay Clayton told CNBC on Friday.\n\nAI \"amplifies\" existing cybersecurity risks toward U.S. digital infrastructure, which is interconnected with critical systems related to everything from public goods to the national defense and global communications, Clayton said on \" Squawk Box .\"\n\nIt's \"why we're focused on hardening those systems\" and using \"our commitment to continue to lead to stay ahead of those nefarious actors,\" said Clayton, who leads a new White House AI task force .\n\nClayton was asked how concerned Americans should be with the threat of foreign spying in light of the recently revealed case charging Saudi national Abdulrahman Alfozan with allegedly installing a recording device in an OpenAI executive conference room. Alfozan has not been charged with espionage; the federal charge involves alleged interception of oral communications.\n\nAlfozan, who was an OpenAI employee, had booked a one-way plane ticket to Saudi Arabia with his wife and another family member prior to his arrest, according to federal prosecutors.\n\n\"The short answer to your question is espionage, both commercial espionage, and I would say state-sponsored espionage, are realities,\" Clayton said.\n\n\"It's something that our private sector companies need to be wary of. We, as a government, need to be wary of,\" he said.\n\nThe OpenAI incident \"shows the lengths that people will go to try and supplant our leadership in this, or at least stay close to us in this emerging technology,\" Clayton said.", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 09:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Who Is Sudhakar Dalela? The New Indian Ambassador To Nepal", "full_content": "The 1993-batch IFS officer brings experience in economic diplomacy, trade negotiations and India\u2019s neighbourhood policy to his new assignment in Kathmandu", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Yes Bank Q2 Preview: AT-1 Bonds Impact To Asset Quality \u2014 Five Key Things To Watch", "full_content": "Net profit is projected to rise 54.13% year on year to Rs 1,008 crore, although it could decline 5.88% from the preceding quarter.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Navigating Friction And Energy Realities: An Analysis Of Marco Rubio's October Visit To India", "full_content": "Occurring at a critical juncture marked by stalled trade negotiations and escalating geopolitical pressures over global energy supplies, the visit offers a profound window into modern Washington-New Delhi relations.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Schwab to create 'tax-aware' strategy that's been attracting billions from wealthy investors", "full_content": "When Charles Schwab released its quarterly earnings on Thursday, it wasn't the quarterly earnings per share print in the numbers that caught the attention of those who manage money for wealthy stock investors \u2014 it was a $60.7 billion figure. That was reported in a detail about margin loan balances which increased 14% quarter-over-quarter to $187.9 billion, including a whopping $60.7 billion related to what are known as \"tax-aware\" long/short strategies used by many registered investment advisors.\n\nThese strategies have been booming as a way for the wealthy to super-charge tax-loss harvesting approaches to stock gains and losses. According to one estimated provided by Tax Alpha Insider to CNBC in September, total assets in TALS surged to more than $170 billion this year from $2 billion in 2022.\n\nNow Schwab is planning to take a bigger piece of that action. On the earnings call , Schwab CEO Rick Wurster said in response to a question from UBS analyst Mike Brown that the broker will launch its own version of the tax-aware long-short strategy.\n\n\"Obviously, the tax advantage long/short products have been a meaningful driver of client demand and asset gathering across the industry. There is an increasing number of funds coming to market, and so given Schwab's positioning and client interest in the category, do you see an opportunity to launch a proprietary solution?\" Brown asked.\n\n\"I do expect us to have an offering,\" Wurster said. \"We already have a great direct indexing capability today that has had wonderful performance in terms of tax alpha and delivering for clients, and I expect us to be able to deliver an extended version of that on long/short. ...", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "India's Long Home T20I Series Unbeaten Run At Stake Against West Indies In Decider", "full_content": "A look at every home T20I series India have played with at least three matches, and the record against each opponent.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Older Americans feel less of the affordability crunch. How that could affect the midterm elections", "full_content": "Affordability is a major theme of the upcoming midterm elections .\n\nBut not all households are feeling the financial strain equally \u2014 and that could have implications for how people vote in November, according to economists and political experts.\n\nSpecifically, older Americans are more insulated from the affordability crunch than younger households like millennials, the experts said.\n\n\"Affordability is the central issue in the forthcoming midterm elections,\" said William Galston, a senior fellow and chair of governance studies at the Brookings Institution, a think tank. \"Nothing else is close.\"\n\nThis isn't to say that older Americans \u2014 generally, those age 65 and older \u2014 aren't feeling any financial pressures .\n\nThey're certainly paying more for food, gasoline, electricity and other items like everybody else amid stubbornly high inflation , economists said.\n\nIt's also not to say that all young households find life to be more unaffordable.\n\nHowever, in aggregate, seniors disproportionately own their homes and are less likely to be first-time homebuyers \u2014 meaning they're less exposed to fast-rising mortgage rates and home prices, economists said. They generally drive fewer miles and keep their cars longer \u2014 making them less sensitive to high gasoline prices and rising bond yields, which have put upward pressure on auto loan rates, economists said.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dividend delight on D-Street: Modison, LTM to Oberoi Realty announce dividends on October 16 | Amount, record dates", "full_content": "Dividend delight on D-Street: As the September quarter earnings season has kicked off in full swing, nearly three companies announced dividends on Friday, October 16. Modison Limited, LTM Limited, and Oberoi Realty Limited rewarded investors with cash payouts.\n\nAll the three firms have fixed Friday, October 23 as the record date. For dividend hunters, here are all the details about these companies\u2019 dividend payouts, record date, and most importantly Q2FY27 results.\n\nModison Limited, on Friday, declared a 400% dividend for the financial year 2026-27. The company\u2019s board of directors has approved \u20b9 4 dividend per equity share with a face value of Re 1 each.\n\nThe company has fixed Friday, October 23, as the record date to determine the eligibility of shareholders for the payout.\n\nModison\u2019s net profit stood at \u20b9 2,332.3 lakhs in Q2FY 27 against a net profit of \u20b9 1,165.69 lakh reported in the year-ago period. Its net revenue from operations increased to \u20b9 27,902.59 lakhs in Q2FY27 against \u20b9 14,516.21 lakhs reported in the year ago period. Its net revenue stood at \u20b9 27,046.67 lakh in Q1FY27.\n\nOberoi Realty\u2019s board of directors approved a second interim dividend for FY26-27 at the rate of \u20b9 2 per equity share, i.e. 20% of the face value of \u20b9 10 each. Investors must own the stock before the record date to qualify for the payout. The board has fixed Friday, October 23, as the record date to determine eligibility of shareholders for the payout.\n\nIts net consolidated profit increased marginally to \u20b9 761.65 crore for the quarter ended September, a marginal increase from the year-ago period. Its net profit stood at Rs760.26 crore in the year-ago period.\n\nTotal income fell 6% to \u20b9 1,736.37 crore during the second quarter of this fiscal from \u20b9 1,844.84 crore in the corresponding period of the preceding year, according to a regulatory filing.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 09:41 PM IST", "pub_date_relative": "1h ago"}, {"title": "The 800-Million Deficit: World Bank's Ajay Banga Warns Of Massive Job Void \u2014 His Blueprint To Fix It", "full_content": "World Bank chief says 1.2 billion young people will enter the workforce over the next 10\u201315 years, while only 400 million jobs are projected to be created, calling for greater mobilisation of public and private capital to bridge the gap.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Many of 2026\u2019s hottest stocks have seen dramatic comedowns this week", "full_content": "Many of the best-performing stocks of 2026 fell this week, while this year\u2019s biggest losers also changed course,", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 09:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "What we want to see when Capital One and Meta report earnings next week", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Can a $55,000 robot load the dishwasher? Inside my afternoon with two humanoid housekeepers.", "full_content": "Tau Robotics\u2019 humanoids vacuumed my floors and wiped my counters \u2014 with some help from humans behind the scenes", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 09:35 PM IST", "pub_date_relative": "1h ago"}, {"title": "CoreWeave stock wipeout exposes divide between AI fear and greed", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a CoreWeave stock wipeout exposes divide between AI fear and greed Powered By The Economic Times daily newspaper is available online now. Read Today's Paper CoreWeave stock wipeout exposes divide between AI fear and greed SECTIONS CoreWeave stock wipeout exposes divide between AI fear and greed By Jeran Wittenstein and Ryan Vlastelica , Bloomberg Last Updated: Oct 16, 2026, 09:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis CoreWeave Inc. is navigating turbulent stock trends due to climbing bond yields and investor trepidation over its debt, raising fears of default. Although a temporary boost followed optimistic comments from Nvidia's CEO, the overall sentiment leans towards caution. Analysts believe that while funding needs are pressing, robust AI demand could mitigate rate worries. Furthermore, CoreWeave's alliance with Nvidia may be a vital source of financial support in these unpredictable conditions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 09:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Your 8GB RAM PC Could Feel Faster After Microsoft's Latest Windows 11 Update", "full_content": "Microsoft says Windows 11 improvements include faster Search, Start and File Explorer, reduced background memory use on 8GB PCs, and fewer interruptions from updates.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "ChatGPT Can Now Fill Out Forms And Send Messages In Chrome: Would You Trust It?", "full_content": "OpenAI's Chrome upgrade lets ChatGPT gather information across open tabs, organise browser tabs and access chat history while users browse websites.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tesla unveils long-delayed Roadster developed with SpaceX, fueling merger speculation", "full_content": "Tesla showed off its long-delayed next-generation Roadster on Thursday, almost a decade after Elon Musk's company started taking deposits for the electric sports car.\n\nThe event was livestreamed from a SpaceX test site in McGregor, Texas, near Waco, starting at 7:55 p.m. local time, or 8:55 p.m. ET. In attendance along with Musk were design leader Franz von Holzhausen and Lars Moravy, vice president of vehicle engineering.\n\n\"You're going to see some crazy stuff tonight,\" Musk said. \"You're going to see the results of what happens when you have a collaboration with the world's best car company and the world's best rocket company.\"\n\nTesla's original Roadster, designed and engineered by a team led by founding CEO Martin Eberhard, was based on a Lotus Elise chassis and was first delivered in 2008, selling for roughly $100,000 in small volumes until 2012.\n\nThe next-generation Roadster is expected to be a high-end, low-volume model that relies on SpaceX technology to enable it to hover. While Musk fanatics expressed their excitement on social media, the Roadster isn't likely to have any material financial impact on the company.\n\nAt the event, Musk and his team showcased a white sports car that raced up a curved ramp, then clung to it upside down and vaulted off it, flipping in mid-air and hovering slowly before landing on the ground.\n\nThe two-seater can go from zero to 60 miles per hour in under a second, according to Tesla's timer, a feat Moravy demonstrated for the live audience.\n\nMusk said the next-generation Roadster would enter production in 2028. The price wasn't announced, and the company didn't disclose specifications about other performance-level variants of the new Roadster. It was unclear whether the vehicle would be street-legal, with Musk saying on stage that, \"This is not necessarily a safety-optimized car.\"", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 09:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank Stocks JPMorgan, Goldman Sachs Lift Dow To One-Month High Despite AI Selloff", "full_content": "The Dow has bucked that trend, rising more than 1% over one week, supported by gains in stocks outside the technology sector.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sickle cell gene therapies offer new hope, but access remains a major challenge", "full_content": "For decades, people living with sickle cell disease have endured a lifetime of hospital visits, medications and blood transfusions to manage a painful genetic blood disorder that can shorten life expectancy by up to 20 years .\n\nBut a long-awaited breakthrough came in 2023, when the U.S. Food and Drug Administration approved Casgevy and Lyfgenia, the first two gene therapies for patients with severe forms of the disease. Patient advocates and clinicians say the recent advancements in treatment could mark the beginning of a new era in sickle cell care, one that may free thousands from recurrent episodes of debilitating pain and improve long-term health outcomes.\n\n\"That opens up a whole world of individuals potentially being cured of sickle cell disease,\" said Dr. Edward Donnell Ivy, chief medical officer for the national patient advocacy organization, Sickle Cell Disease Association of America .\n\nYet for thousands of people living with the disease, accessing the transformative therapies remains far from straightforward.\n\nPatients often face a fragmented and uneven healthcare landscape where treatment costs, a complex treatment process, provider availability, and access to specialized treatment centers can vary widely based on where they live. The result has left therapies with the potential to dramatically alter the course of the disease still out of reach for many eligible patients.\n\n\"The patients' priorities are actually a big part of really trying to figure out what the barriers to access are and how we overcome them,\" said Dr. Alexis Thompson, an attending physician in the division of hematology at Children's Hospital of Philadelphia and spokesperson for the American Society of Hematology.\n\nSometimes referred to as \"the most common rare disease\" because millions of people globally are affected, sickle cell disease impacts around 100,000 people in the U.S., according to the Centers for Disease Control and Prevention .", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ranbir Kapoor Leases Trump Towers Flat In Pune For Rs 4.63 Lakh Per Month: Report", "full_content": "The 6,094 sq ft apartment is located in Tower A of Trump Towers in Kalyani Nagar, Pune. The three-year agreement was registered on October 6, with rent rising each year.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Europe's answer to SpaceX rises 18% as Ukraine's Starshield limits raise concerns", "full_content": "Shares of French Satellite Group Eutelsat soared this week as SpaceX 's Starshield drew criticism after the Ukrainian military's access to its systems was suddenly restricted.\n\nEarlier this week, tensions rose between the U.S. and Ukraine after Kyiv accused Elon Musk's SpaceX of imposing new restrictions on its military-grade Starlink internet service without warning, curbing connectivity and limiting Ukraine's ability to defend itself against Russian attacks.\n\nUkraine's President Volodymyr Zelenskyy criticized the U.S., saying \"Starlink was switched off\" in the middle of the night, preventing Ukrainian drones from intercepting Russian attacks, and ultimately contributing to civilian deaths.\n\n\"They knew what they did,\" Zelenskyy said. \"It's not about attack. It's also about defending the lives\u2026 People were killed because not enough destroying, not enough interceptors, including interceptors with Starlink, which didn't work.\"\n\nSpaceX CEO Elon Musk responded by shifting blame on the U.S. government and said that Starshield systems were under Washington and President Donald Trump's control.\n\nEutelsat shares rose 17.7% on Friday, and were up 25% over the past five days following the news of Starlink's struggles in Ukraine.\n\nEutelsat shares over the past five days. Eutelsat's share move this week is more evidence \"supporting the sovereign value of European Satellite networks,\" Deutsche Bank analysts said in a note Thursday. Markets viewed Eutelsat as \"the credible Starlink alternative\" amid the disruption, they added. \"Whilst we note Eutelsat does offer a global LEO [Low Earth Orbit] constellation, we believe it lacks the scale to offer the number of terminals that Starlink can provide,\" they added. \"We would expect the shares to give up some of the gains.\"\n\nEutelsat consolidated with satellite internet provider OneWeb in 2023, looking to challenge Starlink's market dominance.", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 09:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX AI policy leader grilled by NYC Council on Grok safety, sexualized images", "full_content": "SpaceX artificial intelligence policy leader Gabriela Castillo Madrid faced a tough line of questioning from NYC Council Speaker Julie Menin and other members on Friday as part of a council investigation into AI safety.\n\nWhen Castillo Madrid claimed that the company had appropriate \"safeguards\" in place around its AI products, Menin immediately confronted her.\n\n\"I'm going to completely push back on that,\" Menin said. \"I mean, just this morning \u2014 myself and my team \u2014 we put our own names, my own name, into Grok, and there's absolutely a sexualized image of myself. So then, how is it that within a second, I could find a sexualized image of myself using Grok?\"\n\nCastillo Madrid responded that the company has \"strict controls\" and would have the safety team look into that specific instance.\n\nNYC Council Member Carmen De La Rosa, who leads the council's tech committee, told Castillo Madrid that \"it is disgusting\" that Grok enables users to easily \"sexualize\" images of real women without their consent.\n\n\"I just don't understand how you can say that there are these safe models,\" Menin said. \"It's just unacceptable.\"\n\nCastillo Madrid appeared in front of the council's tech committee by video.\n\nElon Musk's aerospace, defense tech and AI company originally evaded requests and a subpoena from the city council to appear alongside leaders from OpenAI , Anthropic , Google and Meta on Oct. 5. SpaceX agreed to testify earlier this week after the council threatened to have its subpoena enforced by a judge.", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 09:14 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "S&P 500 dragged down by AI stocks as chip shares head for worst week since July: Live updates", "full_content": "Stocks were lower on Friday as traders headed for a mostly losing week amid a rotation out of tech and artificial intelligence-related names.\n\nThe S&P 500 traded down 1%, while the Nasdaq Composite shed 1.9%. The Dow Jones Industrial Average outperformed as it fell 241 points, or 0.5%.\n\nChipmakers were lower again. The VanEck Semiconductor ETF (SMH) lost 1%, led by declines in Micron Technology , Advanced Micro Devices and Sandisk . Semiconductors have struggled this week amid jitters about competition from China . The SMH is down 8% week to date, on pace for its biggest weekly decline since July.\n\nThose declines, coupled with drops in other stocks linked to AI, put the S&P 500 on pace for a losing week. The benchmark index is down nearly 2% this week, while the Nasdaq has shed more than 4%. The Dow, on the other hand, has moved higher by less than 1% on the week.\n\nInvestors have also grown concerned that tech companies are borrowing too much for the AI buildout . Shares of neoclouds like CoreWeave , which has seen its total debt rise to more than $51 billion , were down 10%, putting the stock's week-to-date losses at more than 23%.\n\n\"The question is: Is this a systemic issue?\" said Michael Rosen, Angeles' chief investment officer. \"Obviously, increased debt issuance is something to observe and continue to watch and be concerned about if it continues to get to levels of excessiveness. But we're not remotely close to that right now.\"\n\nOther areas of the market such as energy saw gains Friday, with stocks like Chevron helping to keep the Dow's losses in check. That's as oil prices moved higher amid rising tensions between the U.S. and Iran as well as between Russian and Ukraine.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:59 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Marriott vs. Hilton: MAR offers lower valuation and stronger revenue growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:50 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Punjab National Bank posts strong Q2 2026 profit growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:42 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Warsh signals steady Fed outlook despite inflation jump - Axios", "full_content": "Warsh signals steady Fed outlook despite inflation jump Axios Fed's Warsh withholds rate signal, praises recent global tightening CNBC Fed Chair Kevin Warsh warns of AI 'shock' for economy, pledges to contain inflation ABC News - Breaking News, Latest News and Videos Warsh Vows to Tame Inflation as A.I. Delivers \u2018Shock\u2019 to Economy The New York Times U.S. Stocks Mixed as Investors Pare Rate-Hike Bets WSJ", "source": "Google News Business", "pub_date_str": "16 Oct 2026, 10:41 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "City Therapeutics surges in market debut after upsizing $200M IPO", "full_content": "", "source": "Investing.com News", "pub_date_str": "16 Oct 2026, 10:39 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Reliance-backed Jio Platforms IPO: \u20b91 lakh crore gains for Meta, Google in \u20b930,213 cr issue by Mukesh Ambani firm?", "full_content": "Meta Platforms and Google could be sitting on nearly \u20b9 1 lakh crore in combined paper gains from their investments in Jio Platforms as the Reliance Industries-backed digital services company prepares to launch next week what is set to become country's largest-ever initial public offering (IPO).\n\nMeta Platforms owns a 10% stake through Jaadhu Holdings LLC, while Google International LLC holds a 7.73% stake. However, neither existing shareholder is selling shares through the IPO.\n\nAt the upper end of Jio Platforms\u2019 IPO price band of \u20b9 1,119 per share, the two US technology giants could see returns of approximately 129% on their investments made in 2020, according to estimates highlighted in Groww\u2019s LinkedIn post on Friday, October 16.\n\nThe issue is entirely a fresh issue of up to 27 crore equity shares, with no offer-for-sale (OFS) component. This means existing investors will not sell their shares through the IPO. At the upper end of the price band of \u20b9 1,119 per share, Jio Platforms\u2019 IPO is expected to raise approximately \u20b9 30,213 crore.\n\nReliance Industries Group will become India\u2019s largest conglomerate by the combined market capitalization of its listed companies after Jio Platforms makes its stock market debut, Kotak Mahindra Bank founder Uday Kotak said on Thursday.\n\nUnlike an offer for sale, in which existing shareholders sell their holdings and receive the proceeds, a fresh issue involves the company issuing new shares to investors. The proceeds therefore go to the company rather than to shareholders seeking to reduce or exit their investments.\n\nIn Jio Platforms\u2019 case, the proceeds are earmarked primarily for the full or partial repayment or prepayment of certain outstanding borrowings of its material subsidiary, Reliance Jio Infocomm Ltd, along with general corporate purposes.\n\nThe structure means that existing investors, including Meta Platforms and Google, are not using the IPO to sell their holdings.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:37 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Here\u2019s how the Fed should reveal its outlook for the economy", "full_content": "As Chairman Kevin Warsh looks to revamp the central bank\u2019s communication strategy, the dot plot is ripe for change.", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 10:37 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "A 30% salary hike or bedtime with his toddler? Parent's career dilemma sparks debate over the real cost of switching job", "full_content": "A 30% salary hike may look like an obvious career move, but for a parent with a toddler, a better-paying job can come with a less visible cost. Longer commutes, additional childcare expenses and fewer evenings with the child can reduce the financial benefit of switching jobs.\n\nThe dilemma raises a practical personal-finance question. How much of a higher salary does an employee actually get to keep after income tax and the additional costs of taking up a new job?\n\nThe answer depends on more than the headline increment. The salary structure, tax liability, commuting expenses and childcare arrangements all affect the amount left over at the end of the month. A parent must also weigh these monetary gains against the time the new role demands.\n\nConsider an employee earning \u20b9 18 lakh a year who receives a 30% hike to \u20b9 23.4 lakh. Assuming the new tax regime, a \u20b9 75,000 standard deduction and no other income or deductions, the additional tax reduces the benefit of the raise.\n\nThe employee's gross salary increases by \u20b9 5.4 lakh a year, but the additional tax reduces the gain to about \u20b9 4.14 lakh annually, or \u20b9 34,492 a month, before accounting for the extra costs of the new job.\n\nThe post-tax increase is not the final financial gain. If the new job requires the parent to leave home earlier or return later, the family may need to pay for additional daycare hours, a nanny or household help. A longer commute can also increase fuel, cab or public transport expenses.\n\nTo see how these costs affect the decision, assume the employee incurs an additional \u20b9 5,000 a month on commuting, \u20b9 12,000 on childcare and \u20b9 3,000 on meals and other work-related expenses. These are illustrative assumptions, not verified expenses from the parent's situation.\n\nIn this scenario, just under \u20b9 14,500 a month remains after tax and additional expenses. The employee receives a 30% increase in gross salary, but the net financial gain is considerably smaller.", "source": "LiveMint Money", "pub_date_str": "16 Oct 2026, 10:34 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Prediction market odds on Tesla-SpaceX merger are above 50% for early 2027", "full_content": "Following a Barclays note Wednesday that outlined what a merger between Tesla and SpaceX could look like, prediction market traders increased the odds of an integration above 50% for early 2027.\n\nOdds of a merger happening before March jumped to 56% by Friday morning, up from 29%. Odds for an integration before April and May climbed to similar levels.\n\nThe contract asks, \"When will Tesla and SpaceX merge?\" and will be verified by news outlets and the Securities and Exchange Commission's EDGAR database.\n\nTesla, known for its electric vehicles, and SpaceX, a rocket and satellite company, have collaborated before. Both are controlled by Elon Musk.\n\nOn Thursday, Tesla showed off its long-delayed Roadster , which relies on SpaceX technology to make the vehicle hover. A video showcasing the Roadster's capabilities was also recorded from SpaceX's test site in Texas.\n\nBeyond collaboration, the growing speculation of a merger comes after Musk spoke of \"more and more overlap\" between Tesla and SpaceX on the EV maker's latest earnings call.\n\nBarclays now expects a merger could be announced before Tesla's annual general meeting, which must take place no later than Dec. 6, 2026. Analyst Dan Levy expects the merger may be proposed as an AI vertical integration, involving Tesla's Robotaxi and Optimus with SpaceX's Grok and Macrohard.\n\nTerafab, the semiconductor project relying on Tesla, SpaceX and xAI, could also be a \"key driver\" for the merger, Levy added.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:32 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Treasuries head for big weekly gains as AI jitters halt bond rout", "full_content": "Borrowing costs fall back from highest levels in decades as investors seek safety in government debt", "source": "FT Markets", "pub_date_str": "16 Oct 2026, 10:25 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "U.S. presses China on Mastercard, Citigroup market access in bilateral Bangkok talks, official says", "full_content": "BANGKOK \u2013 U.S. officials pressed Beijing on market access issues for Mastercard Inc and Citigroup Inc during at least two bilateral meetings with Chinese counterparts in Bangkok this week, according to a U.S. Treasury official.\n\nThe Treasury delegation, led by Deputy Secretary Francis Brooke, held bilateral meetings with officials from the People's Bank of China and the finance ministry on the sidelines of the Group of 20 finance meetings and the IMF-World Bank annual gathering this week, the official said, speaking on condition of anonymity to discuss the closed-door meetings.\n\nThe talks included market access for U.S. companies, including Mastercard, Visa and Citigroup, the official said, adding that regulatory approval was part of the agreement reached during the meeting between Presidents Donald Trump and Xi Jinping during the latter's state visit in Washington last month.\n\nThe sideline meetings in Bangkok continued discussions on implementing these deals, the official said.\n\nThe PBOC, China's National Financial Regulatory Administration, China Securities Regulatory Commission, Chinese embassies in Singapore and Thailand, the U.S. Treasury Department press office and Visa did not immediately respond to CNBC's request for comment. Citigroup and Mastercard declined to comment.\n\nThe progress follows China's Oct. 13 approval for Visa Inc. to begin preparing a wholly owned domestic card-clearing business . Visa has up to a year to prepare before it applies for an operating license, the PBOC has said .\n\nChina has opened much of its financial sector to foreign firms since 2018, gradually lifting foreign ownership caps on services such as securities, futures and fund management. It still limits cross-border capital flows and has kept state-backed domestic players dominant in payments.\n\nMastercard currently operates yuan card payments in China through a local joint venture with NetsUnion Clearing Corp., which began operating in 2024.", "source": "CNBC Finance", "pub_date_str": "16 Oct 2026, 10:16 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "From 50% Slump To 250% Rally: What's Behind This Small-Cap Multibagger AI Stock's Upwing?", "full_content": "E2E Networks shares have surged approximately 249.14% in 2026 after losing 50% in 2025. Rising demand for AI computing infrastructure, a Rs 1,000-crore sovereign AI contract and strong September-quarter earnings have helped revive investor interest.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 10:16 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Elon Musk may have just taken a major step toward consolidating his empire", "full_content": "Tesla\u2019s newly unveiled flying sports car, which features SpaceX rocket thrusters, could help Musk push for a merger between his two biggest companies, analysts say,", "source": "MarketWatch Top Stories", "pub_date_str": "16 Oct 2026, 10:09 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anything not tied to artificial intelligence took off this week", "full_content": "S&P 500 stocks beyond the realm of AI are on pace for their second-largest weekly outperformance since 2024.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 10:08 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "\u20b930 dividend: ICICI Prudential AMC dividend record date ahead! Check yield, payout history, stock performance", "full_content": "Dividend alert: Shares of ICICI Prudential Asset Management Company (AMC) Limited are likely to remain in focus ahead of the upcoming record date for dividend. The AMC has announced \u20b9 30 per equity share dividend for the financial year 2026-27.\n\nICICI Prudential AMC stock closed marginally lower on Friday, October 16. The stock has declined 9.55% in three months and around 14.68% in six months. Here are all the details about ICICI Prudential AMC payout.\n\nLast week, the company\u2019s board of directors had approved \u20b9 30 interim dividend to eligible shareholders, which is 3000% of the stock\u2019s face value of Re 1 each.\n\nThe board has fixed Wednesday, October 21, as the record date to determine the eligibility of shareholders for the payout. ICICI Prudential AMC board greenlit \u201cdeclaration and payment of interim dividend of \u20b9 30 per equity share to the equity shareholders of the Company, whose names appear in the Register of Members of the Company or in the records of Depositories as beneficial owners of the shares as on October 21, 2026, being record date fixed for this purpose,\u201d as per the company\u2019s BSE filing.\n\nWhich means that investors must own the stock by October 20 to qualify for the payout.\n\nOver the past 12 months, ICICI Prudential AMC has announced an annual payout of \u20b9 27.25 per equity share. Its dividend yield stood at 0.97%.\n\nThe stock closed 0.90% lower at \u20b9 2811.75 per share on BSE with an Mcap of \u20b9 1,38,973.14 crore on Friday. Its share price value has declined 7.16% in one week, 9.05% in two weeks and around 8.87% in one month. Over the last six months, the stock has delivered - 14.68% return, but has surged 7.10% in 2026 so far.\n\nThe Maharashtra-headquartered AMC reported 6.1% rise in profit after tax at \u20b9 889 crore for September quarter FY27 on the back of higher revenue from operations. The company had logged a profit of \u20b9 838 crore in the year-ago period.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 10:04 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI Saudi national bugging case shows threat to U.S. leadership in AI: DNI Clayton", "full_content": "U.S. companies and the Trump administration both \"need to be wary\" of foreign espionage attempts as the race for artificial intelligence dominance continues, Director of National Intelligence Jay Clayton told CNBC on Friday.\n\nAI \"amplifies\" existing cybersecurity risks toward U.S. digital infrastructure, which is interconnected with critical systems related to everything from public goods to the national defense and global communications, Clayton said on \" Squawk Box .\"\n\nIt's \"why we're focused on hardening those systems\" and using \"our commitment to continue to lead to stay ahead of those nefarious actors,\" said Clayton, who leads a new White House AI task force .\n\nClayton was asked how concerned Americans should be with the threat of foreign spying in light of the recently revealed case charging Saudi national Abdulrahman Alfozan with allegedly installing a recording device in an OpenAI executive conference room. Alfozan has not been charged with espionage; the federal charge involves alleged interception of oral communications.\n\nAlfozan, who was an OpenAI employee, had booked a one-way plane ticket to Saudi Arabia with his wife and another family member prior to his arrest, according to federal prosecutors.\n\n\"The short answer to your question is espionage, both commercial espionage, and I would say state-sponsored espionage, are realities,\" Clayton said.\n\n\"It's something that our private sector companies need to be wary of. We, as a government, need to be wary of,\" he said.\n\nThe OpenAI incident \"shows the lengths that people will go to try and supplant our leadership in this, or at least stay close to us in this emerging technology,\" Clayton said.", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 09:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Yes Bank Q2 Preview: AT-1 Bonds Impact To Asset Quality \u2014 Five Key Things To Watch", "full_content": "Net profit is projected to rise 54.13% year on year to Rs 1,008 crore, although it could decline 5.88% from the preceding quarter.", "source": "NDTV Profit", "pub_date_str": "16 Oct 2026, 09:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Schwab to create 'tax-aware' strategy that's been attracting billions from wealthy investors", "full_content": "When Charles Schwab released its quarterly earnings on Thursday, it wasn't the quarterly earnings per share print in the numbers that caught the attention of those who manage money for wealthy stock investors \u2014 it was a $60.7 billion figure. That was reported in a detail about margin loan balances which increased 14% quarter-over-quarter to $187.9 billion, including a whopping $60.7 billion related to what are known as \"tax-aware\" long/short strategies used by many registered investment advisors.\n\nThese strategies have been booming as a way for the wealthy to super-charge tax-loss harvesting approaches to stock gains and losses. According to one estimated provided by Tax Alpha Insider to CNBC in September, total assets in TALS surged to more than $170 billion this year from $2 billion in 2022.\n\nNow Schwab is planning to take a bigger piece of that action. On the earnings call , Schwab CEO Rick Wurster said in response to a question from UBS analyst Mike Brown that the broker will launch its own version of the tax-aware long-short strategy.\n\n\"Obviously, the tax advantage long/short products have been a meaningful driver of client demand and asset gathering across the industry. There is an increasing number of funds coming to market, and so given Schwab's positioning and client interest in the category, do you see an opportunity to launch a proprietary solution?\" Brown asked.\n\n\"I do expect us to have an offering,\" Wurster said. \"We already have a great direct indexing capability today that has had wonderful performance in terms of tax alpha and delivering for clients, and I expect us to be able to deliver an extended version of that on long/short. ...", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Older Americans feel less of the affordability crunch. How that could affect the midterm elections", "full_content": "Affordability is a major theme of the upcoming midterm elections .\n\nBut not all households are feeling the financial strain equally \u2014 and that could have implications for how people vote in November, according to economists and political experts.\n\nSpecifically, older Americans are more insulated from the affordability crunch than younger households like millennials, the experts said.\n\n\"Affordability is the central issue in the forthcoming midterm elections,\" said William Galston, a senior fellow and chair of governance studies at the Brookings Institution, a think tank. \"Nothing else is close.\"\n\nThis isn't to say that older Americans \u2014 generally, those age 65 and older \u2014 aren't feeling any financial pressures .\n\nThey're certainly paying more for food, gasoline, electricity and other items like everybody else amid stubbornly high inflation , economists said.\n\nIt's also not to say that all young households find life to be more unaffordable.\n\nHowever, in aggregate, seniors disproportionately own their homes and are less likely to be first-time homebuyers \u2014 meaning they're less exposed to fast-rising mortgage rates and home prices, economists said. They generally drive fewer miles and keep their cars longer \u2014 making them less sensitive to high gasoline prices and rising bond yields, which have put upward pressure on auto loan rates, economists said.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dividend delight on D-Street: Modison, LTM to Oberoi Realty announce dividends on October 16 | Amount, record dates", "full_content": "Dividend delight on D-Street: As the September quarter earnings season has kicked off in full swing, nearly three companies announced dividends on Friday, October 16. Modison Limited, LTM Limited, and Oberoi Realty Limited rewarded investors with cash payouts.\n\nAll the three firms have fixed Friday, October 23 as the record date. For dividend hunters, here are all the details about these companies\u2019 dividend payouts, record date, and most importantly Q2FY27 results.\n\nModison Limited, on Friday, declared a 400% dividend for the financial year 2026-27. The company\u2019s board of directors has approved \u20b9 4 dividend per equity share with a face value of Re 1 each.\n\nThe company has fixed Friday, October 23, as the record date to determine the eligibility of shareholders for the payout.\n\nModison\u2019s net profit stood at \u20b9 2,332.3 lakhs in Q2FY 27 against a net profit of \u20b9 1,165.69 lakh reported in the year-ago period. Its net revenue from operations increased to \u20b9 27,902.59 lakhs in Q2FY27 against \u20b9 14,516.21 lakhs reported in the year ago period. Its net revenue stood at \u20b9 27,046.67 lakh in Q1FY27.\n\nOberoi Realty\u2019s board of directors approved a second interim dividend for FY26-27 at the rate of \u20b9 2 per equity share, i.e. 20% of the face value of \u20b9 10 each. Investors must own the stock before the record date to qualify for the payout. The board has fixed Friday, October 23, as the record date to determine eligibility of shareholders for the payout.\n\nIts net consolidated profit increased marginally to \u20b9 761.65 crore for the quarter ended September, a marginal increase from the year-ago period. Its net profit stood at Rs760.26 crore in the year-ago period.\n\nTotal income fell 6% to \u20b9 1,736.37 crore during the second quarter of this fiscal from \u20b9 1,844.84 crore in the corresponding period of the preceding year, according to a regulatory filing.", "source": "LiveMint Markets", "pub_date_str": "16 Oct 2026, 09:41 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "What we want to see when Capital One and Meta report earnings next week", "full_content": "The Investing Club holds its \"Morning Meeting\" every weekday at 10:20 a.m. ET.", "source": "CNBC Top News", "pub_date_str": "16 Oct 2026, 09:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CoreWeave stock wipeout exposes divide between AI fear and greed", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a CoreWeave stock wipeout exposes divide between AI fear and greed Powered By The Economic Times daily newspaper is available online now. Read Today's Paper CoreWeave stock wipeout exposes divide between AI fear and greed SECTIONS CoreWeave stock wipeout exposes divide between AI fear and greed By Jeran Wittenstein and Ryan Vlastelica , Bloomberg Last Updated: Oct 16, 2026, 09:33:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis CoreWeave Inc. is navigating turbulent stock trends due to climbing bond yields and investor trepidation over its debt, raising fears of default. Although a temporary boost followed optimistic comments from Nvidia's CEO, the overall sentiment leans towards caution. Analysts believe that while funding needs are pressing, robust AI demand could mitigate rate worries. Furthermore, CoreWeave's alliance with Nvidia may be a vital source of financial support in these unpredictable conditions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Oct 2026, 09:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tesla unveils long-delayed Roadster developed with SpaceX, fueling merger speculation", "full_content": "Tesla showed off its long-delayed next-generation Roadster on Thursday, almost a decade after Elon Musk's company started taking deposits for the electric sports car.\n\nThe event was livestreamed from a SpaceX test site in McGregor, Texas, near Waco, starting at 7:55 p.m. local time, or 8:55 p.m. ET. In attendance along with Musk were design leader Franz von Holzhausen and Lars Moravy, vice president of vehicle engineering.\n\n\"You're going to see some crazy stuff tonight,\" Musk said. \"You're going to see the results of what happens when you have a collaboration with the world's best car company and the world's best rocket company.\"\n\nTesla's original Roadster, designed and engineered by a team led by founding CEO Martin Eberhard, was based on a Lotus Elise chassis and was first delivered in 2008, selling for roughly $100,000 in small volumes until 2012.\n\nThe next-generation Roadster is expected to be a high-end, low-volume model that relies on SpaceX technology to enable it to hover. While Musk fanatics expressed their excitement on social media, the Roadster isn't likely to have any material financial impact on the company.\n\nAt the event, Musk and his team showcased a white sports car that raced up a curved ramp, then clung to it upside down and vaulted off it, flipping in mid-air and hovering slowly before landing on the ground.\n\nThe two-seater can go from zero to 60 miles per hour in under a second, according to Tesla's timer, a feat Moravy demonstrated for the live audience.\n\nMusk said the next-generation Roadster would enter production in 2028. The price wasn't announced, and the company didn't disclose specifications about other performance-level variants of the new Roadster. It was unclear whether the vehicle would be street-legal, with Musk saying on stage that, \"This is not necessarily a safety-optimized car.\"", "source": "CNBC World Economy", "pub_date_str": "16 Oct 2026, 09:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "SpaceX AI policy leader grilled by NYC Council on Grok safety, sexualized images", "full_content": "SpaceX artificial intelligence policy leader Gabriela Castillo Madrid faced a tough line
