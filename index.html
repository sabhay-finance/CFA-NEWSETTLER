in probe of CEO Jensen Huang", "full_content": "Nvidia's investigation into CEO Jensen Huang over his affair with an alleged Chinese spy may hinge on decisions by company board member Stephen Neal , a longtime white-collar defense attorney whose extensive resume includes dealing with corporate scandals.\n\nNeal, the former CEO of the Cooley law firm, is Nvidia's lead independent director and head of corporate governance.\n\nNvidia has not named the investigators who will probe the allegations surrounding Huang, but the company has said its board is leading the probe with help from outside counsel.\n\nNeal's experience makes him a likely key figure in the investigation.\n\nNvidia's board has said there is \"no reason to believe that either national security or Nvidia secrets were compromised\" by Huang's admitted affair with Alice Huang, who had been an executive with Megaspeed, a Singapore-based Nvidia customer.\n\nChina dismissed U.S. intelligence conclusions that Alice Huang was a spy, which were first reported by The New York Times .\n\nJensen Huang, one of the most powerful businessmen in the artificial intelligence boom, has said he would \"cooperate fully\" with the investigation.\n\nNvidia's board has 10 independent members, including a former president of Taco Bell , a former Eli Lilly executive, and a former vice chairman from Goldman Sachs .", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 01:52 AM IST", "pub_date_relative": "7m ago"}, {"title": "Dollar jumps as hot CPI and Waller comments bring supersized Fed hike into play", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:51 AM IST", "pub_date_relative": "9m ago"}, {"title": "Editas at guggenheim healthcare innovation conference: focused on in vivo CRISPR", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:50 AM IST", "pub_date_relative": "10m ago"}, {"title": "Inspire Medical at Stifel 2026 Healthcare Conference: growth reset ahead", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:50 AM IST", "pub_date_relative": "10m ago"}, {"title": "Schumer accuses Trump of defending Nvidia CEO Jensen Huang at cost of national security", "full_content": "Democratic leader Sen. Charles Schumer ripped President Donald Trump on Tuesday for defending embattled Nvidia CEO Jensen Huang at the expense of U.S. national security.\n\n\"The press reports that Trump was briefed more than a year ago that Nvidia's CEO was having an affair with a suspected Chinese spy, and Trump didn't do anything \u2013 anything \u2013 about it,\" Schumer, D-N.Y., said on the Senate floor.\n\n\"Can you believe that?\" said Schumer, the Senate's minority leader.\n\nSchumer's broadside came on the heels of New York Times reports that Trump had been briefed about Huang's extramarital affair with Megaspeed executive Alice Huang \u2014 whom U.S. intelligence concluded was a spy for China \u2014 and opted not to do anything about it.\n\nTrump suggested to reporters on Monday that he only recently learned of the allegations about Alice Huang, and the president commented Monday that he \"really\" believes Jensen Huang's claim to him directly that he had no idea Alice Huang was a spy.\n\n\"One of our most important companies that is involved in national security, and the CEO might be having an affair with a Chinese spy, and Trump did nothing about it,\" Schumer said Tuesday.\n\n\"What a dereliction of duty. He's supposed to protect America, not China, not his friends,\" Schumer said. \"Trump has been busy trying to defend Jensen Huang when he ought to be defending our national security. It's that simple, it's obvious.\"\n\nSchumer's comments escalated growing bipartisan concern in Congress about the Nvidia CEO, whose company makes advanced chips that power artificial intelligence in the U.S. and China's race to dominate that technology.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 01:49 AM IST", "pub_date_relative": "11m ago"}, {"title": "Xilio Therapeutics at Stifel 2026 Healthcare Conference: pipeline gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:49 AM IST", "pub_date_relative": "11m ago"}, {"title": "Oil falls below $90 as Trump pulls back from threat to strike Iran", "full_content": "Falling crude prices have supported recovery in global stocks from last week\u2019s sell-off", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 01:49 AM IST", "pub_date_relative": "11m ago"}, {"title": "IHS Holding earnings missed by $0.25, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:48 AM IST", "pub_date_relative": "12m ago"}, {"title": "PubMatic Q3 2026 slides: AI drives growth acceleration, margins double", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:48 AM IST", "pub_date_relative": "12m ago"}, {"title": "Nvidia-backed AI cloud firm Nscale considers delaying $35 billion listing, the Telegraph reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:48 AM IST", "pub_date_relative": "12m ago"}, {"title": "Spruce Biosciences at Guggenheim healthcare conference: FDA path in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:48 AM IST", "pub_date_relative": "12m ago"}, {"title": "First Tracks at Guggenheim conference: celiac data drives pipeline push", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:47 AM IST", "pub_date_relative": "13m ago"}, {"title": "S&P 500 falls after hot CPI ignites inflation concerns: Live updates", "full_content": "Stocks fell on Tuesday after October inflation data came in hotter than expected and a key Federal Reserve official hinted at the possibility of a half-point rise in rates next month.\n\nThe S&P 500 traded down 0.6%, while the Dow Jones Industrial Average declined 181 points, or 0.3%. The Nasdaq Composite fell 1.1%.\n\nNvidia dragged down the three major averages, falling 6%. The stock sat out Monday's tech-fueled rally following CEO Jensen Huang's admission over the weekend to an affair with an alleged Chinese spy .\n\nThe consumer price index rose 0.4% in October, above the gain of 0.3% that economists polled by Dow Jones expected. Core CPI \u2014 which excludes volatile food and energy costs \u2014 increased 0.3% in October, whereas economists had called for a 0.2% advance. Annual figures were not be provided for Tuesday's report because of the 2025 government shutdown.\n\nTreasury yields jumped as traders reacted to the report, fearing that interest rate increases could now be more likely in 2027. The 10-year Treasury note yield in particular advanced back above 5% .\n\nEarlier Tuesday, Fed Governor Christopher Waller said in a speech in London that he thinks a December rate hike is likely and opened the door for a possible half-point increase amid persistent inflationary pressures.\n\n\"While the precise timing of the hikes doesn't matter, ensuring that the promised hikes are implemented in a reasonable period of time does,\" he said.\n\nTraders now see a December rate hike as a near certainty and a small chance of a supersized increase. They also expect at least a quarter-point hike at some point next year.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:47 AM IST", "pub_date_relative": "13m ago"}, {"title": "U.S. housing market positioning risks as mortgage rates hold near 7.4%", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:46 AM IST", "pub_date_relative": "14m ago"}, {"title": "Dangote Refinery Gets $4.1 Billion Orders in Top Africa IPO", "full_content": "(Bloomberg) -- Africa\u2019s biggest refinery attracted about 5.85 trillion naira ($4.1 billion) of applications for shares in the continent\u2019s largest public offering to date, almost three times the amount it sought to raise, according to people familiar with the matter.\n\nDangote Petroleum Refinery and Petrochemicals FZE, which aimed to garner at least $1.6 billion in the IPO, received about $1.9 billion in inquiries from investors in its home country of Nigeria and a further $2.1 billion from prospective international buyers, said the people who declined to be identified because the information is private.\n\nThe Public Investment Corp., which oversees about $220 billion in pensions of South African state workers and is the continent\u2019s biggest money manager, asked for a large allocation the people said, declining to specify the amount. The allocation could be accommodated through a secondary share sale, said the people.\n\nNigerian pension managers covering about 11 million members also asked for allocations, they said.\n\nInvestors have raced to secure a stake in the Lagos-based crude-processing facility that\u2019s Africa\u2019s largest as well as one of the biggest globally and owned by its richest man, Aliko Dangote. Exchanges across the continent are providing structures to give buyers access to the listing that has attracted applications from all 54 countries in the region.\n\nThere are close to 4 million unique subscription applications, plus the pension funds that indirectly have tens of millions of contributors, said the people. Dangote had targeted 10 million retail investors.\n\nA spokesman for Dangote declined to comment, while the PIC said it wasn\u2019t in a position to provide any public comment or explanations on the proposed IPO currently.\n\nThe company is due to submit a draft allotment announcement to Nigeria\u2019s Securities and Exchange Commission this week, with the regulator expected to sign off on how the refiner will distribute the shares on Nov. 17.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 01:40 AM IST", "pub_date_relative": "20m ago"}, {"title": "GE Vernova sellers have it all wrong \u2014 plus, why Fed rate hike odds are soaring", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:32 AM IST", "pub_date_relative": "27m ago"}, {"title": "Nvidia hires law firm Wachtell Lipton to lead Jensen Huang affair probe", "full_content": "Nvidia's board of directors said on Tuesday that it hired Wachtell, Lipton, Rosen & Katz to conduct an investigation of CEO Jensen Huang and whether company secrets or national security was compromised, after Huang admitted to having an affair with a woman who has been connected to Chinese intelligence.\n\n\"The independent members of the NVIDIA Board have retained former acting U.S. Attorney of the Southern District of New York Joon H. Kim and his firm Wachtell, Lipton, Rosen & Katz to conduct a thorough and independent investigation as was announced on Sunday,\" the board said in a statement.\n\nKim joined the firm last month, and he was previously the chief U.S. prosecutor in Manhattan, according to Law360.\n\nNvidia has been thrust into turmoil since Huang's acknowledgement of the affair over the weekend. The chipmaker's stock dropped 6% on Tuesday after falling more than 4% on Monday, as investors worry that the investigation and scandal could result in the co-founder and CEO being forced out.\n\nNvidia and the board are facing pressure from critics and politicians over what the company knew about sales of its restricted AI chips to Chinese companies.\n\nOver the past few weeks, The New York Times and Financial Times have reported that U.S. intelligence agencies surveilled an Asian technology executive, Alice Huang, who has been affiliated with Nvidia customer Megaspeed. These agencies have concluded that she is passing information to Beijing and is involved with Chinese intelligence, according to the reports.\n\nHuang has become the face of the AI industry, going by his first name \"Jensen\" to customers and rivals as Nvidia's technology is used to train nearly all major AI models. The chipmaker has become an essential source of financing for AI startups and Huang has met with presidents and CEOs around the world as Nvidia's public face.\n\nBut Huang's actions have thrown the chipmaker into instability as he admitted to an affair with Alice Huang in an email to staff on Sunday.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 01:31 AM IST", "pub_date_relative": "29m ago"}, {"title": "US regulator postpones Wall Street push to trade AI computing futures", "full_content": "The Commodity Futures Trading Commission raises concerns over price manipulation as exchanges race to create new asset class", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 01:28 AM IST", "pub_date_relative": "32m ago"}, {"title": "EXCLUSIVE: Anthropic eyes $1.4 trillion IPO valuation in test of Wall Street's AI fervor - Reuters", "full_content": "EXCLUSIVE: Anthropic eyes $1.4 trillion IPO valuation in test of Wall Street's AI fervor Reuters Anthropic's Blockbuster IPO Filing Contains a Surprising Nod to Washington Yahoo Finance Anthropic Targets Valuation of Up to $1.4 Trillion for Blockbuster I.P.O. The New York Times Anthropic Founders to Cash Out $1.75 Billion in Blockbuster IPO Bloomberg.com All 7 Anthropic founders will each cash out about $250M in IPO TechCrunch", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 01:25 AM IST", "pub_date_relative": "35m ago"}, {"title": "Traders bet on a pop for Anthropic's historic IPO", "full_content": "News of Anthropic's historic initial public offering provided a wave of relief for tech investors. The response in the perpetual futures market might provide even more relief.\n\nAs Anthropic prepares to raise money in its initial public offering this month, traders in offshore markets are making large bets that there will be a big pop on the AI giant's debut.\n\nTrying to guess an initial first day IPO reaction is nearly impossible, but a new and fast-growing corner of the markets might offer some clues.\n\nPre-IPO perpetuals, contracts that aim to track the price of private companies, trade on decentralized crypto exchanges like Hyperliquid, Coinbase, Binance and OKX to name a few. The current Hyperliquid Anthropic contract implies a stock price of $98 and its market cap at roughly $1.7 trillion, more than 30% higher than the $70-$78 range announced in the company's updated S1 .\n\nWhile trading on the exchange is not currently available to American investors, about $250 million of volume traded across Hyperliquid's two Anthropic trackers in the past 24 hours, according to the exchange. Hyperliquid's pre-IPO Anthropic perp began trading two weeks ago at $138 before settling into a roughly ten-dollar range between $110 and $120 prior to last week's selloff in tech stocks, as the contract slipped below $94 at one point. To proponents of this new asset class, the pricing of the perps is evidence that bankers intentionally undersell equity ahead of IPOs to ensure a post-market \"pop.\" Looking at SpaceX, the argument rings true: pre-IPO perps on SpaceX traded at a premium and converged with equity prices at the IPO, all before shares went on a three-day rally of as much as 40% in the immediate aftermath of the listing. News of Anthropic's upcoming roadshow may be weighing on competitor OpenAI. Perps tracking OpenAI's market cap dropped 7% to $1.27 trillion, according to Hyperliquid trading on a contract trading $2.8 billion in volume over the past 24 hours.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:21 AM IST", "pub_date_relative": "39m ago"}, {"title": "10-year Treasury yield races back to 5% as inflation data, Waller comments drive rate hike expectations", "full_content": "Treasury yields jumped on Tuesday after the U.S. consumer price index data for October came in hotter than expected . A mediocre auction of $42 billion in Treasury notes compounded the decline in bonds.\n\nThe yield on the 10-year Treasury note \u2014 the benchmark for mortgages, car loans and credit card rates \u2014 traded above 5% before paring gains. It was last up more than 12 basis points at 4.985%. The 30-year Treasury bond yield, more sensitive to geopolitical developments, rose more than 9 basis points to 5.35%. The 2-year Treasury note yield, which closely tracks short-term Fed rate expectations, surged more than 18 basis points to 4.733%.\n\nThe 10-year yield last traded above the 5% level earlier this month. In October, 10-year and 30-year yields hit 24-year highs .\n\nOne basis point equals 0.01% or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe consumer price index for October grew 0.4%, more than the 0.3% expected from economists polled by Dow Jones and down from the 0.6% growth in September.\n\nCore CPI, which excludes volatile food and energy prices, gained 0.3%. Economists had expected a 0.2% gain on the month. The reading was in line with September's 0.3% rise.\n\nThe report came after Fed Governor Christopher Waller said he would support \"more robust action\" if inflation readings are higher than expected.\n\n\"In that case, I believe a 50 basis point hike in the policy rate should be considered at the December meeting,\" Waller said in London at a central bank conference hosted by the Bank of England. \"Hiking only 25 basis points would put our credibility at risk, a risk I am not eager to take.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:21 AM IST", "pub_date_relative": "39m ago"}, {"title": "Anthropic officially sets the stage for an IPO valuing the company north of $1 trillion", "full_content": "Anthropic could raise up to $63 billion in an IPO expected to take place next week.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 01:17 AM IST", "pub_date_relative": "43m ago"}, {"title": "Wall St retreats as hot inflation data, Fed comments fuel rate worries", "full_content": "* Consumer Price Index rises 0.4% last month, above economists' 0.3% estimate\n\nNEW YORK, Nov 10 (Reuters) - US stocks stumbled on Tuesday, as a hotter-than-expected inflation reading cemented expectations for a rate hike from the Federal Reserve next month and fueled concerns the central bank may be more aggressive in raising rates.\n\nThe Labor Department said the Consumer Price Index increased 0.4% last month, its third straight gain of 0.4% or more and above the 0.3% estimate of economists polled by Reuters, after advancing 0.6% in September.\n\nThe data came after Fed Governor Christopher Waller said the central bank should raise short-term borrowing costs in December even if data shows inflation cooled last month, and should consider an upsized half-point rate hike if the inflation picture worsens.\n\nMarkets are now completely pricing in a rate hike of at least 25 basis points at the Fed's December meeting, according to CME FedWatch, up from 84% on Monday.\n\nThe two-year US Treasury yield, which typically moves in step with interest rate expectations for the Fed, surged 19.1 basis points to 4.738% and was on track for its biggest daily gain since April 9, 2025, after US President Donald Trump launched his sweeping global tariffs.\n\nThe jump has come even as oil prices have eased to two-month lows as US officials have downplayed any imminent military actions against Iran.\n\n\"What kind of has the market spooked a little bit is this idea of, 'Well, we were already pricing in a December hike ... but maybe it's not 25, maybe it's 50, and maybe the Fed's more worried about inflation than I am, so let's sell some stocks,'\" said Jason Ware, chief investment officer at Albion Financial Group in Salt Lake City, Utah.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 01:14 AM IST", "pub_date_relative": "46m ago"}, {"title": "Amazon's Ring unveils flying drone and robot to patrol homes and businesses", "full_content": "Amazon 's Ring is going deeper into surveillance with an indoor drone for home monitoring and an autonomous robot designed to patrol businesses.\n\nThe company on Tuesday unveiled the $250 Ring Drone Cam, a security camera that can fly from room to room, including upstairs, as well as capture footage during the day or at night. When an alarm or sensor on windows, doors and home security devices is triggered, the textbook-sized drone travels a preset path to investigate suspicious activity. Users can also deploy the drone at any time, the company said.\n\nAt a demo in New York on Monday, Ring CEO Jamie Siminoff said the drone could be used as a home monitoring tool and as a crime \"deterrent\" due to the device's built-in LED lights.\n\n\"If someone is going around your house at night, and your motion detector goes off on your Ring doorbell, imagine if you see spotlights and something flying across the window,\" Siminoff said. \"You're probably not going to go into that house.\"\n\nThe drone, which can fly up to eight minutes at a time before autonomously returning to its charging dock, has two plastic-encased propellers that emit a loud buzz when it's airborne.\n\nRing devices have provided Amazon another avenue to grow its presence in the smart home beyond its Echo smart speakers and Eero routers, expanding in a market that Grand View Research estimates will top $200 billion in sales this year. It's equally fertile ground for Amazon rivals Apple and Google .\n\nRing, which Amazon acquired in 2018 and is known for its doorbells, has been beset with privacy concerns , primarily due to its partnerships with police. Earlier this year, Ring faced renewed scrutiny over a controversial Super Bowl ad touting an AI pet-finding tool called \"Search Party.\" It then canceled an integration with police tech provider Flock Safety , which has also faced widespread backlash over its automated license plate readers.\n\nRing first previewed its drone, then called the Always Home Cam , in 2020.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 01:13 AM IST", "pub_date_relative": "46m ago"}, {"title": "Op-ed: In Nvidia CEO Jensen Huang's alleged China spy scandal, there's plenty of blame to go around", "full_content": "In June 2013, President Barack Obama welcomed Chinese President Xi Jinping to Sunnylands, a secluded California estate, for an informal summit. Behind the diplomatic pleasantries, Obama confronted Xi over Chinese state-directed cyber-enabled espionage and theft of American intellectual property, warning that such activities threatened American companies and the broader bilateral relationship.\n\nThirteen years after the Sunnylands Summit, the threat has evolved significantly as the race to dominate AI frames the U.S.-China relationship. The stakes are higher, the technology more consequential, and the vulnerabilities increasingly involve attempts to compromise or coopt the \"key man\" at the helm of the nation's top technology companies.\n\nWith the unfolding scandal involving Nvidia CEO Jensen Huang , the blame should start with the CEO himself, but it should not end there. The situation illustrates a failure of Silicon Valley, corporate and political leadership at a much wider level.\n\nHuang has acknowledged an extramarital affair with a woman identified in reporting as Alice Huang, a former executive at Singapore-based Megaspeed , an Nvidia customer. American intelligence officials reportedly believe she was recruited by China's Ministry of State Security to gather information and potentially influence Nvidia's efforts to loosen American semiconductor export restrictions. China denies the allegations.\n\nNvidia's independent directors have launched an investigation , and so far, they say no compromise of company secrets or national security information has been established. But the problem extends well beyond Huang or Nvidia. Focusing exclusively on whether proprietary technology or trade secrets were transferred fundamentally misunderstands the potential intelligence value of such an operation.\n\nFor Beijing, gaining insight into, influencing, or potentially compromising American technology policymaking could be equally valuable.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 01:10 AM IST", "pub_date_relative": "50m ago"}, {"title": "Singapore seizes US-operated cruise ship that offered \u2018permanent\u2019 life at sea - The Guardian", "full_content": "Singapore seizes US-operated cruise ship that offered \u2018permanent\u2019 life at sea The Guardian Cruise ship that stranded passengers in Cambodia kept in Singapore under court order Reuters 'Cruise for life' ship seized in Singapore BBC Singapore seizes \u2018forever\u2019 cruise ship that dumped passengers in Cambodia Financial Times They Spent Millions to Keep Their Dream Cruise Afloat. It Died Anyway. The New York Times", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 01:02 AM IST", "pub_date_relative": "58m ago"}, {"title": "Corn Soars After USDA Cuts American Yield in Another Surprise", "full_content": "(Bloomberg) -- Corn surged the most in three months after the US Department of Agriculture surprised traders with a bigger-than-expected cut to yield and production of America\u2019s most widely grown crop.\n\nWhile a small trim in USDA\u2019s monthly supply and demand outlook was anticipated, the scale of the reduction caught traders off guard, with futures in Chicago rising by as much as 3.7% after the report was published.\n\nFarmers have been complaining about the accuracy of the agency\u2019s reports \u2014 and also replying less to surveys that are used by the USDA to produce the data. Tuesday\u2019s report is the third time to spark increased volatility since the end of September. Such turbulence in USDA reports has prompted efforts at the agency to modernize.\n\nThe USDA pared back yields in key corn-growing states including Illinois, Indiana and Nebraska, estimating national production at 15.893 billion bushels. That\u2019s down from an October outlook and below an estimate in a Bloomberg survey. The numbers are a reversal from recent reports that showed unexpectedly large stockpiles, such as one last month that sent prices tumbling.\n\n\u201cThe market finally got its production cut,\u201d said Giovana Cavalca, grains research analyst at Amius.\n\nStill, any gains in grain prices will be welcomed by farmers who have been navigating high costs for diesel and fertilizer that make it difficult to profit when crop prices are relatively lower. Shares of farm machinery makers Deere & Co. and AGCO Corp. briefly turned higher after the report.\n\nUSDA lifted its soybean production estimate to a fresh record high of 4.57 billion bushels.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 01:01 AM IST", "pub_date_relative": "59m ago"}, {"title": "Stock Market Today: Dow Opens Lower After Inflation Report \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Dow Opens Lower After Inflation Report \u2014 Live Updates WSJ Here's the inflation breakdown for October 2026 \u2014 in one chart CNBC U.S. inflation rises more than expected for 3rd straight month Honolulu Star-Advertiser Broad Price Pressures Firm Up Case for Fed Rate Increase in December WSJ October inflation data comes in hotter than expected, even as energy inflation fades Yahoo Finance", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 01:01 AM IST", "pub_date_relative": "59m ago"}, {"title": "Homeowners tap equity as HELOC balances post biggest jump since 2005: New York Fed report", "full_content": "Homeowners tapped their home equity lines of credit in the third quarter at the highest rate in more than two decades, according to a new Federal Reserve Bank of New York report on household debt released Tuesday.\n\nBalances on HELOCs jumped by $23 billion during the three months ending Sept. 30, the largest increase since 2005. That brings the outstanding amount owed to $481 billion, the report shows. This also marks the 18th consecutive quarterly increase.\n\nHELOC balances peaked at roughly $714 billion in the first quarter of 2009, according to a 2015 New York Fed report .\n\nThe current rise in balances comes amid a sluggish housing market, due at least partly to the so-called mortgage rate lock-in effect. Just under half of outstanding mortgages \u2014 49.1% \u2014 carried rates of 4% or lower in the second quarter, according to a Realtor.com analysis of federal mortgage data , leaving many owners reluctant to give up their low rates to purchase another home at current higher borrowing costs.\n\nThe median price of an existing home was $417,500 in September , according to the National Association of Realtors, a real estate trade group. While up just 1.3% from a year earlier, the amount is nearly 54% higher than in September 2019, according to NAR.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Should a widow leave her late partner\u2019s home to her stepkids \u2014 or cut off contact with them?", "full_content": "\u201cIt would be a less drastic step than selling the home now and splitting the proceeds.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 01:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Corporate America is making a trillion-dollar mistake about retirement", "full_content": "The market is dramatically underpricing the economic impact of Americans age 50 and older.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 12:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "AMD\u2019s stock fades as investors weigh whether Nvidia\u2019s turmoil will mean lasting wins", "full_content": "It\u2019s one thing for money to shift between stocks, but it\u2019s another thing for customers to shift their supplier relationships.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 12:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Weil partners approve plan to shut down law firm - Financial Times", "full_content": "Weil partners approve plan to shut down law firm Financial Times $2 Billion Wasn\u2019t Enough to Save Weil Gotshal The New York Times Daily Briefing: Weil Gotshal Alumni Reflect on Firm and Harvey Miller\u2019s Legacy WSJ In Wind-Down, Weil is Likely Negotiating Leases With Landlords Law.com Weil Gotshal: A \u2018Lehman moment\u2019 for Big Law? The Week", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 12:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gold falls nearly 3% as CPI tops forecasts, lifting dollar and yields", "full_content": "Nov 10 (Reuters) - Gold prices fell nearly 3% on Tuesday after hotter-than-expected US inflation data lifted the dollar and Treasury yields while reinforcing expectations of a bigger interest rate hike from the Federal Reserve this year.\n\nSpot gold was down 2.7% at $4,028.39 per ounce by 1:53 p.m. ET (1854 GMT). US gold futures for December delivery settled 2.0% lower at $4,030.20 per ounce.\n\n\"I think it's a bit of a short-term negative for gold because the inflation numbers were running a little higher than expected,\" said Edward Meir, an analyst at Marex.\n\nThe US Consumer Price Index rose 0.4% last month after advancing 0.6% in September, the Labor Department's Bureau of Labor Statistics said. Economists polled by Reuters had forecast a 0.3% month-on-month rise.\n\nBets on a 50-basis-point Fed rate hike in December started to build after the inflation print and comments by Fed governor Christopher Waller, who said he would support more aggressive action in the event of a too-hot Consumer Price Index report.\n\nThe probability of a 25 bp hike is fully priced in, while the possibility of a 50 bp hike rose to 10% from 0% before the data, according to CME's FedWatch Tool.\n\nThe US dollar rose against a basket of other major currencies, and Treasury yields climbed. [USD/] [US/]\n\nA stronger dollar makes gold more expensive for overseas buyers, while higher Treasury yields increase the opportunity cost of holding non-yielding bullion.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia shares down as Huang affair scandal deepens", "full_content": "What happens when a tech giant becomes a security concern?", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 12:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018It feels like he\u2019s quietly building a separate life\u2019: My husband inherited $500,000, but he refuses to spend it on our home", "full_content": "\u201cOur kitchen dates from 1999 and the oven only works if you hit the door a certain way.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 12:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Treasuries slide as \u2018hot\u2019 inflation sparks bets on Fed rate rise", "full_content": "Two-year government bond yields soar most since 2024 as October consumer price growth tops forecasts", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 12:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks: Five things to know about Anthropic", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Five things to know about Anthropic Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Five things to know about Anthropic SECTIONS US stocks: Five things to know about Anthropic By AFP Last Updated: Nov 11, 2026, 12:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Founded by former OpenAI researchers, Anthropic has grown into a major AI company backed by Amazon, Alphabet, Microsoft and Nvidia. As the Claude developer prepares for a landmark IPO, its safety-focused philosophy, unconventional roots and clash with the Pentagon are drawing renewed scrutiny.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 12:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018The thought of living to 100 terrifies me\u2019: Is Social Security a giant Ponzi scheme?", "full_content": "There is already a demographic \u2018run\u2019 on Social Security.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 12:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "Amazon's Ring launches flying security drones, patrol robots to guard homes, businesses - Fox Business", "full_content": "Amazon's Ring launches flying security drones, patrol robots to guard homes, businesses Fox Business Amazon's Ring unveils flying drone and robot to patrol homes and businesses CNBC Ring Drone Cam Becomes a Reality for Homeowners Eager To Level Up With Smart Home Security Realtor.com Amazon\u2019s Ring debuts security robots including a drone NBC News Amazon\u2019s Ring Unveils $250 Flying Security Camera After Delays Bloomberg.com", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 12:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Soybeans, corn rally after USDA pegs US harvest, stocks below expectations", "full_content": "* USDA projects US corn, soy harvests and end-of-season stocks below trade expectations\n\n* Forecasts spark rally in corn and soybeans after prolonged decline\n\n* Wheat follows corn and soy higher, but gains tempered by higher global supply outlook\n\nCHICAGO, - US soybeans surged on Tuesday after the US Department of Agriculture raised its US harvest outlook by less than expected in a monthly report and projected tighter supplies in the year ahead.\n\nCorn futures also rallied as the USDA cut its US production and stocks forecasts by more than expected. Wheat futures followed corn and soybeans higher, though gains were limited by expectations for larger global supplies due to big crops in the southern hemisphere.\n\nCorn and soybean markets rebounded sharply after a prolonged slide since late September dragged prices to multi-month lows. The USDA surprised traders last month by raising its US corn harvest outlook despite adverse weather in parts of the Midwest this summer while also forecasting a record-large soybean crop.\n\nThe USDA's US soy production forecast on Tuesday was 23 million bushels below the average analyst estimate in a Reuters poll. With increases in its domestic and export demand forecasts, the agency's end-of-season supply estimate fell by 15 million bushels, while analysts had expected an increase of 16 million bushels.\n\nMeanwhile, South American soy harvest estimates were left unchanged.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Americans are more concerned about retirement than ever. Politicians should pay attention.", "full_content": "Retirement is now part of the affordability crisis, and it can\u2019t be fixed by individual behavior alone", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 12:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: Major Indexes Fall, Treasury Yields Jump as Inflation Data Boosts Fed Rate-Hike Expectations; Nvidia Shares Plunge - Investopedia", "full_content": "Stock Market Today: Major Indexes Fall, Treasury Yields Jump as Inflation Data Boosts Fed Rate-Hike Expectations; Nvidia Shares Plunge Investopedia See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 12:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks To Watch Today: Bajaj Finance, Tata Motors, Kalyan Jewellers, Cochin Shipyard, MRF & More", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Wednesday.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 12:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "Stocks moving the most midday: Microsoft drops suddenly on Anthropic threat to Office", "full_content": "Microsoft shares were under pressure midday Tuesday after Anthropic unveiled a slew of tools that rival the Washington-based giant's Office suite. The move by Anthropic comes after the Claude AI parent released an amended regulatory filing in the lead-up to its big initial public offering.\n\nNvidia shares also slumped on the day ., alongside On Holding .\n\nFollow below as CNBC breaks down the biggest stock market moves of the day:\n\nMicrosoft shares dropped 3% in a sudden move after Anthropic announced a slate of new workplace tools for Claude that could compete with Office.\n\nAnthropic introduced Claude Sheets, Claude Whiteboards and Claude Data in a blog post .\n\n\"Starting today, Claude can build spreadsheets, whiteboards, and dashboards with your team,\" the post said.\n\nShares of On Holding fell 8% as investors looked beyond a one-time tariff refund of 52.6 million Swiss francs and focused on a direct-to-consumer sales miss.\n\nOn Holding stock price- YTD Adjusted earnings rose from a year earlier and topped the FactSet consensus estimate. Net income increased 36.9% to 162.8 million Swiss francs.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 11:59 PM IST", "pub_date_relative": "2h ago"}, {"title": "Tokenization: The next evolution of the stock market", "full_content": "Tokenization is beginning to change how investors can access, transfer and use stocks without replacing the market infrastructure beneath them.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 11:58 PM IST", "pub_date_relative": "2h ago"}, {"title": "Veterans Day is Wednesday. Here\u2019s where veterans eat free - USA Today", "full_content": "Veterans Day is Wednesday. Here\u2019s where veterans eat free USA Today Veterans Day 2026 Free Meals, Freebies and Deals The American Legion Veterans Day freebies: Dozens of local restaurants offer free meals and deals KTUL 67 Veterans Day Food Deals: Free Meals and Restaurant Discounts TODAY.com Veterans Day 2026: Free meals, discounts and events across the Phoenix area AZ Family", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 11:57 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Aggressive Fed rate hikes are quickly becoming the biggest risk to stocks in 2027, says economist", "full_content": "The Fed remains too optimistic on its ability to tame inflation, and markets may be too complacent, economist Neil Dutta warns.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 01:57 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia board member Stephen Neal could play big role in probe of CEO Jensen Huang", "full_content": "Nvidia's investigation into CEO Jensen Huang over his affair with an alleged Chinese spy may hinge on decisions by company board member Stephen Neal , a longtime white-collar defense attorney whose extensive resume includes dealing with corporate scandals.\n\nNeal, the former CEO of the Cooley law firm, is Nvidia's lead independent director and head of corporate governance.\n\nNvidia has not named the investigators who will probe the allegations surrounding Huang, but the company has said its board is leading the probe with help from outside counsel.\n\nNeal's experience makes him a likely key figure in the investigation.\n\nNvidia's board has said there is \"no reason to believe that either national security or Nvidia secrets were compromised\" by Huang's admitted affair with Alice Huang, who had been an executive with Megaspeed, a Singapore-based Nvidia customer.\n\nChina dismissed U.S. intelligence conclusions that Alice Huang was a spy, which were first reported by The New York Times .\n\nJensen Huang, one of the most powerful businessmen in the artificial intelligence boom, has said he would \"cooperate fully\" with the investigation.\n\nNvidia's board has 10 independent members, including a former president of Taco Bell , a former Eli Lilly executive, and a former vice chairman from Goldman Sachs .", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 01:52 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Corporate Issuers", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dollar jumps as hot CPI and Waller comments bring supersized Fed hike into play", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:51 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IHS Holding earnings missed by $0.25, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:48 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia-backed AI cloud firm Nscale considers delaying $35 billion listing, the Telegraph reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Nov 2026, 01:48 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "S&P 500 falls after hot CPI ignites inflation concerns: Live updates", "full_content": "Stocks fell on Tuesday after October inflation data came in hotter than expected and a key Federal Reserve official hinted at the possibility of a half-point rise in rates next month.\n\nThe S&P 500 traded down 0.6%, while the Dow Jones Industrial Average declined 181 points, or 0.3%. The Nasdaq Composite fell 1.1%.\n\nNvidia dragged down the three major averages, falling 6%. The stock sat out Monday's tech-fueled rally following CEO Jensen Huang's admission over the weekend to an affair with an alleged Chinese spy .\n\nThe consumer price index rose 0.4% in October, above the gain of 0.3% that economists polled by Dow Jones expected. Core CPI \u2014 which excludes volatile food and energy costs \u2014 increased 0.3% in October, whereas economists had called for a 0.2% advance. Annual figures were not be provided for Tuesday's report because of the 2025 government shutdown.\n\nTreasury yields jumped as traders reacted to the report, fearing that interest rate increases could now be more likely in 2027. The 10-year Treasury note yield in particular advanced back above 5% .\n\nEarlier Tuesday, Fed Governor Christopher Waller said in a speech in London that he thinks a December rate hike is likely and opened the door for a possible half-point increase amid persistent inflationary pressures.\n\n\"While the precise timing of the hikes doesn't matter, ensuring that the promised hikes are implemented in a reasonable period of time does,\" he said.\n\nTraders now see a December rate hike as a near certainty and a small chance of a supersized increase. They also expect at least a quarter-point hike at some point next year.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:47 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dangote Refinery Gets $4.1 Billion Orders in Top Africa IPO", "full_content": "(Bloomberg) -- Africa\u2019s biggest refinery attracted about 5.85 trillion naira ($4.1 billion) of applications for shares in the continent\u2019s largest public offering to date, almost three times the amount it sought to raise, according to people familiar with the matter.\n\nDangote Petroleum Refinery and Petrochemicals FZE, which aimed to garner at least $1.6 billion in the IPO, received about $1.9 billion in inquiries from investors in its home country of Nigeria and a further $2.1 billion from prospective international buyers, said the people who declined to be identified because the information is private.\n\nThe Public Investment Corp., which oversees about $220 billion in pensions of South African state workers and is the continent\u2019s biggest money manager, asked for a large allocation the people said, declining to specify the amount. The allocation could be accommodated through a secondary share sale, said the people.\n\nNigerian pension managers covering about 11 million members also asked for allocations, they said.\n\nInvestors have raced to secure a stake in the Lagos-based crude-processing facility that\u2019s Africa\u2019s largest as well as one of the biggest globally and owned by its richest man, Aliko Dangote. Exchanges across the continent are providing structures to give buyers access to the listing that has attracted applications from all 54 countries in the region.\n\nThere are close to 4 million unique subscription applications, plus the pension funds that indirectly have tens of millions of contributors, said the people. Dangote had targeted 10 million retail investors.\n\nA spokesman for Dangote declined to comment, while the PIC said it wasn\u2019t in a position to provide any public comment or explanations on the proposed IPO currently.\n\nThe company is due to submit a draft allotment announcement to Nigeria\u2019s Securities and Exchange Commission this week, with the regulator expected to sign off on how the refiner will distribute the shares on Nov. 17.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 01:40 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "GE Vernova sellers have it all wrong \u2014 plus, why Fed rate hike odds are soaring", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:32 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia hires law firm Wachtell Lipton to lead Jensen Huang affair probe", "full_content": "Nvidia's board of directors said on Tuesday that it hired Wachtell, Lipton, Rosen & Katz to conduct an investigation of CEO Jensen Huang and whether company secrets or national security was compromised, after Huang admitted to having an affair with a woman who has been connected to Chinese intelligence.\n\n\"The independent members of the NVIDIA Board have retained former acting U.S. Attorney of the Southern District of New York Joon H. Kim and his firm Wachtell, Lipton, Rosen & Katz to conduct a thorough and independent investigation as was announced on Sunday,\" the board said in a statement.\n\nKim joined the firm last month, and he was previously the chief U.S. prosecutor in Manhattan, according to Law360.\n\nNvidia has been thrust into turmoil since Huang's acknowledgement of the affair over the weekend. The chipmaker's stock dropped 6% on Tuesday after falling more than 4% on Monday, as investors worry that the investigation and scandal could result in the co-founder and CEO being forced out.\n\nNvidia and the board are facing pressure from critics and politicians over what the company knew about sales of its restricted AI chips to Chinese companies.\n\nOver the past few weeks, The New York Times and Financial Times have reported that U.S. intelligence agencies surveilled an Asian technology executive, Alice Huang, who has been affiliated with Nvidia customer Megaspeed. These agencies have concluded that she is passing information to Beijing and is involved with Chinese intelligence, according to the reports.\n\nHuang has become the face of the AI industry, going by his first name \"Jensen\" to customers and rivals as Nvidia's technology is used to train nearly all major AI models. The chipmaker has become an essential source of financing for AI startups and Huang has met with presidents and CEOs around the world as Nvidia's public face.\n\nBut Huang's actions have thrown the chipmaker into instability as he admitted to an affair with Alice Huang in an email to staff on Sunday.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 01:31 AM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "US regulator postpones Wall Street push to trade AI computing futures", "full_content": "The Commodity Futures Trading Commission raises concerns over price manipulation as exchanges race to create new asset class", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 01:28 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "EXCLUSIVE: Anthropic eyes $1.4 trillion IPO valuation in test of Wall Street's AI fervor - Reuters", "full_content": "EXCLUSIVE: Anthropic eyes $1.4 trillion IPO valuation in test of Wall Street's AI fervor Reuters Anthropic's Blockbuster IPO Filing Contains a Surprising Nod to Washington Yahoo Finance Anthropic Targets Valuation of Up to $1.4 Trillion for Blockbuster I.P.O. The New York Times Anthropic Founders to Cash Out $1.75 Billion in Blockbuster IPO Bloomberg.com All 7 Anthropic founders will each cash out about $250M in IPO TechCrunch", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 01:25 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Traders bet on a pop for Anthropic's historic IPO", "full_content": "News of Anthropic's historic initial public offering provided a wave of relief for tech investors. The response in the perpetual futures market might provide even more relief.\n\nAs Anthropic prepares to raise money in its initial public offering this month, traders in offshore markets are making large bets that there will be a big pop on the AI giant's debut.\n\nTrying to guess an initial first day IPO reaction is nearly impossible, but a new and fast-growing corner of the markets might offer some clues.\n\nPre-IPO perpetuals, contracts that aim to track the price of private companies, trade on decentralized crypto exchanges like Hyperliquid, Coinbase, Binance and OKX to name a few. The current Hyperliquid Anthropic contract implies a stock price of $98 and its market cap at roughly $1.7 trillion, more than 30% higher than the $70-$78 range announced in the company's updated S1 .\n\nWhile trading on the exchange is not currently available to American investors, about $250 million of volume traded across Hyperliquid's two Anthropic trackers in the past 24 hours, according to the exchange. Hyperliquid's pre-IPO Anthropic perp began trading two weeks ago at $138 before settling into a roughly ten-dollar range between $110 and $120 prior to last week's selloff in tech stocks, as the contract slipped below $94 at one point. To proponents of this new asset class, the pricing of the perps is evidence that bankers intentionally undersell equity ahead of IPOs to ensure a post-market \"pop.\" Looking at SpaceX, the argument rings true: pre-IPO perps on SpaceX traded at a premium and converged with equity prices at the IPO, all before shares went on a three-day rally of as much as 40% in the immediate aftermath of the listing. News of Anthropic's upcoming roadshow may be weighing on competitor OpenAI. Perps tracking OpenAI's market cap dropped 7% to $1.27 trillion, according to Hyperliquid trading on a contract trading $2.8 billion in volume over the past 24 hours.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:21 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "10-year Treasury yield races back to 5% as inflation data, Waller comments drive rate hike expectations", "full_content": "Treasury yields jumped on Tuesday after the U.S. consumer price index data for October came in hotter than expected . A mediocre auction of $42 billion in Treasury notes compounded the decline in bonds.\n\nThe yield on the 10-year Treasury note \u2014 the benchmark for mortgages, car loans and credit card rates \u2014 traded above 5% before paring gains. It was last up more than 12 basis points at 4.985%. The 30-year Treasury bond yield, more sensitive to geopolitical developments, rose more than 9 basis points to 5.35%. The 2-year Treasury note yield, which closely tracks short-term Fed rate expectations, surged more than 18 basis points to 4.733%.\n\nThe 10-year yield last traded above the 5% level earlier this month. In October, 10-year and 30-year yields hit 24-year highs .\n\nOne basis point equals 0.01% or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe consumer price index for October grew 0.4%, more than the 0.3% expected from economists polled by Dow Jones and down from the 0.6% growth in September.\n\nCore CPI, which excludes volatile food and energy prices, gained 0.3%. Economists had expected a 0.2% gain on the month. The reading was in line with September's 0.3% rise.\n\nThe report came after Fed Governor Christopher Waller said he would support \"more robust action\" if inflation readings are higher than expected.\n\n\"In that case, I believe a 50 basis point hike in the policy rate should be considered at the December meeting,\" Waller said in London at a central bank conference hosted by the Bank of England. \"Hiking only 25 basis points would put our credibility at risk, a risk I am not eager to take.\"", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 01:21 AM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic officially sets the stage for an IPO valuing the company north of $1 trillion", "full_content": "Anthropic could raise up to $63 billion in an IPO expected to take place next week.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 01:17 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wall St retreats as hot inflation data, Fed comments fuel rate worries", "full_content": "* Consumer Price Index rises 0.4% last month, above economists' 0.3% estimate\n\nNEW YORK, Nov 10 (Reuters) - US stocks stumbled on Tuesday, as a hotter-than-expected inflation reading cemented expectations for a rate hike from the Federal Reserve next month and fueled concerns the central bank may be more aggressive in raising rates.\n\nThe Labor Department said the Consumer Price Index increased 0.4% last month, its third straight gain of 0.4% or more and above the 0.3% estimate of economists polled by Reuters, after advancing 0.6% in September.\n\nThe data came after Fed Governor Christopher Waller said the central bank should raise short-term borrowing costs in December even if data shows inflation cooled last month, and should consider an upsized half-point rate hike if the inflation picture worsens.\n\nMarkets are now completely pricing in a rate hike of at least 25 basis points at the Fed's December meeting, according to CME FedWatch, up from 84% on Monday.\n\nThe two-year US Treasury yield, which typically moves in step with interest rate expectations for the Fed, surged 19.1 basis points to 4.738% and was on track for its biggest daily gain since April 9, 2025, after US President Donald Trump launched his sweeping global tariffs.\n\nThe jump has come even as oil prices have eased to two-month lows as US officials have downplayed any imminent military actions against Iran.\n\n\"What kind of has the market spooked a little bit is this idea of, 'Well, we were already pricing in a December hike ... but maybe it's not 25, maybe it's 50, and maybe the Fed's more worried about inflation than I am, so let's sell some stocks,'\" said Jason Ware, chief investment officer at Albion Financial Group in Salt Lake City, Utah.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 01:14 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Op-ed: In Nvidia CEO Jensen Huang's alleged China spy scandal, there's plenty of blame to go around", "full_content": "In June 2013, President Barack Obama welcomed Chinese President Xi Jinping to Sunnylands, a secluded California estate, for an informal summit. Behind the diplomatic pleasantries, Obama confronted Xi over Chinese state-directed cyber-enabled espionage and theft of American intellectual property, warning that such activities threatened American companies and the broader bilateral relationship.\n\nThirteen years after the Sunnylands Summit, the threat has evolved significantly as the race to dominate AI frames the U.S.-China relationship. The stakes are higher, the technology more consequential, and the vulnerabilities increasingly involve attempts to compromise or coopt the \"key man\" at the helm of the nation's top technology companies.\n\nWith the unfolding scandal involving Nvidia CEO Jensen Huang , the blame should start with the CEO himself, but it should not end there. The situation illustrates a failure of Silicon Valley, corporate and political leadership at a much wider level.\n\nHuang has acknowledged an extramarital affair with a woman identified in reporting as Alice Huang, a former executive at Singapore-based Megaspeed , an Nvidia customer. American intelligence officials reportedly believe she was recruited by China's Ministry of State Security to gather information and potentially influence Nvidia's efforts to loosen American semiconductor export restrictions. China denies the allegations.\n\nNvidia's independent directors have launched an investigation , and so far, they say no compromise of company secrets or national security information has been established. But the problem extends well beyond Huang or Nvidia. Focusing exclusively on whether proprietary technology or trade secrets were transferred fundamentally misunderstands the potential intelligence value of such an operation.\n\nFor Beijing, gaining insight into, influencing, or potentially compromising American technology policymaking could be equally valuable.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 01:10 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Corn Soars After USDA Cuts American Yield in Another Surprise", "full_content": "(Bloomberg) -- Corn surged the most in three months after the US Department of Agriculture surprised traders with a bigger-than-expected cut to yield and production of America\u2019s most widely grown crop.\n\nWhile a small trim in USDA\u2019s monthly supply and demand outlook was anticipated, the scale of the reduction caught traders off guard, with futures in Chicago rising by as much as 3.7% after the report was published.\n\nFarmers have been complaining about the accuracy of the agency\u2019s reports \u2014 and also replying less to surveys that are used by the USDA to produce the data. Tuesday\u2019s report is the third time to spark increased volatility since the end of September. Such turbulence in USDA reports has prompted efforts at the agency to modernize.\n\nThe USDA pared back yields in key corn-growing states including Illinois, Indiana and Nebraska, estimating national production at 15.893 billion bushels. That\u2019s down from an October outlook and below an estimate in a Bloomberg survey. The numbers are a reversal from recent reports that showed unexpectedly large stockpiles, such as one last month that sent prices tumbling.\n\n\u201cThe market finally got its production cut,\u201d said Giovana Cavalca, grains research analyst at Amius.\n\nStill, any gains in grain prices will be welcomed by farmers who have been navigating high costs for diesel and fertilizer that make it difficult to profit when crop prices are relatively lower. Shares of farm machinery makers Deere & Co. and AGCO Corp. briefly turned higher after the report.\n\nUSDA lifted its soybean production estimate to a fresh record high of 4.57 billion bushels.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 01:01 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Dow Opens Lower After Inflation Report \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Dow Opens Lower After Inflation Report \u2014 Live Updates WSJ Here's the inflation breakdown for October 2026 \u2014 in one chart CNBC U.S. inflation rises more than expected for 3rd straight month Honolulu Star-Advertiser Broad Price Pressures Firm Up Case for Fed Rate Increase in December WSJ October inflation data comes in hotter than expected, even as energy inflation fades Yahoo Finance", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 01:01 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold falls nearly 3% as CPI tops forecasts, lifting dollar and yields", "full_content": "Nov 10 (Reuters) - Gold prices fell nearly 3% on Tuesday after hotter-than-expected US inflation data lifted the dollar and Treasury yields while reinforcing expectations of a bigger interest rate hike from the Federal Reserve this year.\n\nSpot gold was down 2.7% at $4,028.39 per ounce by 1:53 p.m. ET (1854 GMT). US gold futures for December delivery settled 2.0% lower at $4,030.20 per ounce.\n\n\"I think it's a bit of a short-term negative for gold because the inflation numbers were running a little higher than expected,\" said Edward Meir, an analyst at Marex.\n\nThe US Consumer Price Index rose 0.4% last month after advancing 0.6% in September, the Labor Department's Bureau of Labor Statistics said. Economists polled by Reuters had forecast a 0.3% month-on-month rise.\n\nBets on a 50-basis-point Fed rate hike in December started to build after the inflation print and comments by Fed governor Christopher Waller, who said he would support more aggressive action in the event of a too-hot Consumer Price Index report.\n\nThe probability of a 25 bp hike is fully priced in, while the possibility of a 50 bp hike rose to 10% from 0% before the data, according to CME's FedWatch Tool.\n\nThe US dollar rose against a basket of other major currencies, and Treasury yields climbed. [USD/] [US/]\n\nA stronger dollar makes gold more expensive for overseas buyers, while higher Treasury yields increase the opportunity cost of holding non-yielding bullion.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Treasuries slide as \u2018hot\u2019 inflation sparks bets on Fed rate rise", "full_content": "Two-year government bond yields soar most since 2024 as October consumer price growth tops forecasts", "source": "FT Markets", "pub_date_str": "11 Nov 2026, 12:23 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US stocks: Five things to know about Anthropic", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US stocks: Five things to know about Anthropic Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US stocks: Five things to know about Anthropic SECTIONS US stocks: Five things to know about Anthropic By AFP Last Updated: Nov 11, 2026, 12:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Founded by former OpenAI researchers, Anthropic has grown into a major AI company backed by Amazon, Alphabet, Microsoft and Nvidia. As the Claude developer prepares for a landmark IPO, its safety-focused philosophy, unconventional roots and clash with the Pentagon are drawing renewed scrutiny.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Nov 2026, 12:23 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Soybeans, corn rally after USDA pegs US harvest, stocks below expectations", "full_content": "* USDA projects US corn, soy harvests and end-of-season stocks below trade expectations\n\n* Forecasts spark rally in corn and soybeans after prolonged decline\n\n* Wheat follows corn and soy higher, but gains tempered by higher global supply outlook\n\nCHICAGO, - US soybeans surged on Tuesday after the US Department of Agriculture raised its US harvest outlook by less than expected in a monthly report and projected tighter supplies in the year ahead.\n\nCorn futures also rallied as the USDA cut its US production and stocks forecasts by more than expected. Wheat futures followed corn and soybeans higher, though gains were limited by expectations for larger global supplies due to big crops in the southern hemisphere.\n\nCorn and soybean markets rebounded sharply after a prolonged slide since late September dragged prices to multi-month lows. The USDA surprised traders last month by raising its US corn harvest outlook despite adverse weather in parts of the Midwest this summer while also forecasting a record-large soybean crop.\n\nThe USDA's US soy production forecast on Tuesday was 23 million bushels below the average analyst estimate in a Reuters poll. With increases in its domestic and export demand forecasts, the agency's end-of-season supply estimate fell by 15 million bushels, while analysts had expected an increase of 16 million bushels.\n\nMeanwhile, South American soy harvest estimates were left unchanged.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 12:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: Major Indexes Fall, Treasury Yields Jump as Inflation Data Boosts Fed Rate-Hike Expectations; Nvidia Shares Plunge - Investopedia", "full_content": "Stock Market Today: Major Indexes Fall, Treasury Yields Jump as Inflation Data Boosts Fed Rate-Hike Expectations; Nvidia Shares Plunge Investopedia See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 12:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks moving the most midday: Microsoft drops suddenly on Anthropic threat to Office", "full_content": "Microsoft shares were under pressure midday Tuesday after Anthropic unveiled a slew of tools that rival the Washington-based giant's Office suite. The move by Anthropic comes after the Claude AI parent released an amended regulatory filing in the lead-up to its big initial public offering.\n\nNvidia shares also slumped on the day ., alongside On Holding .\n\nFollow below as CNBC breaks down the biggest stock market moves of the day:\n\nMicrosoft shares dropped 3% in a sudden move after Anthropic announced a slate of new workplace tools for Claude that could compete with Office.\n\nAnthropic introduced Claude Sheets, Claude Whiteboards and Claude Data in a blog post .\n\n\"Starting today, Claude can build spreadsheets, whiteboards, and dashboards with your team,\" the post said.\n\nShares of On Holding fell 8% as investors looked beyond a one-time tariff refund of 52.6 million Swiss francs and focused on a direct-to-consumer sales miss.\n\nOn Holding stock price- YTD Adjusted earnings rose from a year earlier and topped the FactSet consensus estimate. Net income increased 36.9% to 162.8 million Swiss francs.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 11:59 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Tokenization: The next evolution of the stock market", "full_content": "Tokenization is beginning to change how investors can access, transfer and use stocks without replacing the market infrastructure beneath them.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 11:58 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Chipmakers warn AI demand is creating bottlenecks in automotive supply chain", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Chipmakers warn AI demand is creating bottlenecks in automotive supply chain Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Chipmakers warn AI demand is creating bottlenecks in automotive supply chain SECTIONS Chipmakers warn AI demand is creating bottlenecks in automotive supply chain Reuters Last Updated: Nov 10, 2026, 11:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Nexperia says it is heavily oversubscribed as chipmakers redirect capacity towards higher-margin AI data-centre products, creating shortages of mature semiconductors used in vehicles and industrial equipment. Industry executives warn that the AI investment boom is worsening bottlenecks across automotive and industrial supply chains.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)
