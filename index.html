<script>

    const allData = {"general": [{"title": "Bahrain intercepts Iranian aerial attacks as Tehran says it attacked US base", "full_content": "Bahrain intercepted and destroyed several Iranian aerial attacks, it said on Sunday, while Tehran said it had struck a U.S. military base in the Gulf kingdom amid uncertainty over a deal to end the US-Israeli war on Iran.\n\nThe first such interceptions by Bahraini air defenses since September followed two warnings of potential threats, urging residents to seek shelter.\n\nIran's Islamic Revolutionary Guard Corps said it had attacked a U.S. military base in Bahrain in retaliation for \"hostile U.S. actions,\" Iran's Fars news agency reported.\n\nThe Bahraini military said its air defenses had intercepted several Iranian aerial attacks before they reached their targets, accusing Tehran of continuing its \"systematic hostile approach\" towards the kingdom.\n\nThe Revolutionary Guards said they had launched six drones targeting U.S. air defense radar at the Al-Rifaa helicopter base in Bahrain, Iranian state-run Press TV reported. There was no immediate confirmation from U.S. or Bahraini authorities.\n\nBahrain, home to the U.S. Navy's Fifth Fleet, urged citizens and residents to remain calm and proceed to the nearest safe location, the interior ministry said.\n\nTwo days earlier, the Revolutionary Guards said they had attacked a U.S. early-warning radar facility in Bahrain. The US military denied this, saying it had intercepted two Iranian drones without any damage.\n\nDiplomatic efforts to end the almost nine-month conflict have yet to produce a breakthrough, with sporadic attacks continuing despite a broader lull in fighting between the US and Iran.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 08:21 PM IST", "pub_date_relative": "2m ago"}, {"title": "Texas Pacific Land: 10% owner Horizon Kinetics buys $370 stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 08:01 PM IST", "pub_date_relative": "22m ago"}, {"title": "Verizon evp Kyle Malady sells $56,309 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 08:01 PM IST", "pub_date_relative": "22m ago"}, {"title": "Social Security and the blue wave: What could happen to payroll taxes and senior tax breaks", "full_content": "Congress has six years to enact changes to Social Security to prevent cuts to retirement benefits. Senators elected in the Nov. 3 midterms will be in office when the deadline arrives, and their decisions may be critical in making tax changes that can affect Social Security.\n\nDuring the midterm campaign season, tax policy surfaced in the debate over Social Security in two different ways. Many Democrats, and some Republicans, called for high earners to pay more in Social Security payroll taxes, while many Republicans touted a recently enacted tax deduction for adults 65 and older.\n\nThe diverging tactics come at a crucial moment for reform: The first could increase revenue flowing into the program. The second reduces eligible older adults' income taxes and can lower the taxes some beneficiaries pay on Social Security benefits, reducing program revenue.\n\nSocial Security trustees' latest projections show the trust fund used to pay retirement benefits may start to become depleted in 2032, when 78% of benefits would be payable.\n\nLawmakers do have some leeway \u2014 if the program's retirement and disability trust funds are combined, depletion would be pushed out to 2034, when 83% of scheduled benefits would be payable. But that's still a haircut for retirees \u2014 and it's coming soon.\n\n\"We've waited too long already, and the consequences are that the gap has grown larger,\" Shai Akabas, vice president of economic policy at the Bipartisan Policy Center, said of Social Security's shortfall.\n\nOn the campaign trail, midterm candidates largely avoided specifics on how they would reform Social Security. However, raising the payroll tax cap, also known as the taxable maximum, was a popular choice among Democratic candidates.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 08:00 PM IST", "pub_date_relative": "24m ago"}, {"title": "Two more tankers hit mines in Hormuz, Iran says it targeted Bahrain radar", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 07:55 PM IST", "pub_date_relative": "28m ago"}, {"title": "'We slept here.' Flight delays linger as airlines scramble to recover from ground stop", "full_content": "Flight disruptions lingered on Sunday, two days after the Federal Aviation Administration grounded departures nationwide for more than four hours as airlines scrambled to get travelers and crews into place.\n\n\"We slept here,\" said Beth Martin, who was trying to travel home to Birmingham, Alabama, from New York's LaGuardia Airport on Sunday at the end of her daughter's birthday trip. They were booked for Saturday night, and when delay announcements started rolling in from Delta Air Lines , they decided to make good use of the extra time: after strolling through Central Park, they went window shopping on Fifth Avenue.\n\nBut when the flight was canceled, the standby list on a backup flight looked grim, and their original midtown hotel was charging about $700 for an additional night, the two of them slept at LaGuardia on Saturday. She said they found wheelchairs to sleep in outside security.\n\nMore than 1,400 U.S. flights there were canceled as of 7 a.m. ET and more than 2,000 were delayed, according to FlightAware data. That was far fewer than the almost 6,700 cancellations on Saturday and more than 9,200 on Sunday when the FAA halted all departures into U.S. airports.\n\nTransportation Secretary Sean Duffy on Saturday tied the issue to a router and work to update from copper wires, a system overseen by L3Harris Technologies , to a fiber-optic system. FAA administrator Bryan Bedford said the upgrades were part of \"routine\" maintenance to switch over to fiber optic.\n\n\"We are supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel,\" L3Harris said in a statement Saturday afternoon.\n\nAirlines waived change fees and fare differences and offered pilots and flight attendants extra pay to ease the delays.\n\nCustomers told CNBC they were booked on several flights before getting on board.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 07:54 PM IST", "pub_date_relative": "29m ago"}, {"title": "M&T Bank Corp CEO Rene Jones sells $4.64 million in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 07:46 PM IST", "pub_date_relative": "37m ago"}, {"title": "Megaspeed says ex-Nvidia CEO-linked executive left in 2025 amid U.S. scrutiny", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 07:35 PM IST", "pub_date_relative": "48m ago"}, {"title": "Stock to buy after Q2 Results 2026: Up 70% in YTD! Should you buy retail stock after strong guidance? Target, stop-loss", "full_content": "Sharmila Bhadoria Published 15 Nov 2026, 07:35 PM IST Prefer Livemint on Google Stock to buy after Q2 results, 2026: Shares of Baazar Style Retail Limited will remain in focus during Monday\u2019s trading session after the announcement of second quarter results over the weekend.\n\nBazaar Style Retail share price closed 5.39% higher on Friday, extending its bullish run over the past few trading sessions. Its share price value has surged 20% over the last one week.\n\nThe specialty retail stock is showcasing positive momentum on daily, weekly and monthly charts, according to Mahesh M Ojha, VP -Research and Business Development at KC Securities. The expert suggest to place support at \u20b9 442- 415, it can go up to the level of resistance near 486-503-530.\n\nThe stock closed 5.39% higher at \u20b9 468.55 per share on BSE with a market capitalisation of \u20b9 3,566.48 crore on Friday, November 13. Its share price value has surged nearly 20.08% over the last one week, 33.3% in two weeks, 22.87% in one month, 34% in three months. The stock has delivered 73% return since the beginning of the year 2026 and around 51% in one year.\n\nThe Kolkata-headquartered company\u2019s revenue from operations stood at \u20b9 47,848.31 lakh in the second quarter of financial year 2026-27, against \u20b9 53,149.66 lakh reported in the year ago period.\n\nThe value fashion retail chains expanded its network to 293 stores across 10 states. The company is on track to achieve its milestone of 300 stores. The company reported a revenue of \u20b9 965 crore in the first half of financial year 2026-27.\n\n\u201cLooking ahead, the Company expects Q3 and Q4 FY27 to be its strongest quarters. It is targeting turnover of \u20b9 2,500 Cr in FY27, with revenue guidance to achieve \u20b9 3,800 Cr in FY28 and \u20b9 5,600 Cr in FY29,\u201d read the press release.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 07:35 PM IST", "pub_date_relative": "48m ago"}, {"title": "8th Pay Commission salary hike: How a 7% annual increment could take your basic pay above \u20b91 lakh in 10 years", "full_content": "A central government employee drawing a basic salary of \u20b9 29,200 could see it cross \u20b9 1 lakh in 10 years if the annual increment rate increases to 7% under the 8th Pay Commission. Interestingly, this could happen even with a lower fitment factor of 2.1. Under another scenario, where the fitment factor remains at 2.57 but the annual increment stays at 3%, the employee's basic salary could reach only \u20b9 97,915 over the same period.\n\nThe comparison highlights an important question for central government employees awaiting the next pay revision. Would a higher fitment factor, which provides a bigger initial salary increase, be more beneficial than a higher annual increment that allows basic pay to grow faster over time?\n\nEmployee organisations have submitted proposals seeking changes to both components. While several have demanded a fitment factor of 3.833, others are seeking an increase in annual increments from the existing 3% to 6-7%. Neither proposal has been approved by the government.\n\nThe fitment factor is the multiplier applied to an employee's existing basic pay to calculate the revised basic salary under a new pay commission. Under the 7th Pay Commission, the government fixed it at 2.57.\n\nFor the 8th Pay Commission, the National Council of the Joint Consultative Machinery (NC-JCM) and several other employee organisations have proposed a fitment factor of 3.833. If accepted, this would increase the minimum basic salary from \u20b9 18,000 to \u20b9 69,000.\n\nEmployees are also seeking a higher annual increment. NC-JCM, the All India Defence Employees' Federation (AIDEF) and the Federation of National Postal Organisations (FNPO) have demanded an increase to 6%. The All India New Pension Scheme Employees Federation (AINPSEF) has proposed an annual increment of 7%.\n\nUnder the existing pay structure, central government employees receive a 3% annual increment.\n\nConsider an employee in Pay Level 5, currently drawing a basic salary of \u20b9 29,200.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 07:31 PM IST", "pub_date_relative": "52m ago"}, {"title": "Consumers Bancorp SVP, chief people officer, buys $3,708 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 07:31 PM IST", "pub_date_relative": "53m ago"}, {"title": "\u2018The thought of living to 100 terrifies me\u2019: Is Social Security a giant Ponzi scheme?", "full_content": "There is already a demographic \u2018run\u2019 on Social Security.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 07:30 PM IST", "pub_date_relative": "54m ago"}, {"title": "Will the Anthropic IPO create a disturbance in the broader U.S. equity market, like SpaceX did?", "full_content": "SpaceX\u2019s offering coincided with the June peak in semiconductors.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 07:30 PM IST", "pub_date_relative": "54m ago"}, {"title": "Judge temporarily blocks Trump from moving ahead on Washington public golf course redevelopment", "full_content": "A federal judge on Saturday ordered a two-week delay to any work at a historic Washington public golf course near the White House, blocking, for now, President Donald Trump's push to redevelop the site along the Potomac River into a championship-level venue.\n\nU.S. District Judge Ana Reyes issued the temporary restraining order before the East Potomac Golf Links was set to close for 15 months on Sunday. Trump had announced work would begin that day despite the legal challenge initiated against the project in February by the DC Preservation League and two local golfers.\n\nThe plaintiffs argue that Trump's plan would change the character of the accessible golf course and make it unaffordable, something the Republican president denies. They had sought the stop-work order, saying that closing the course and launching work on the project would \"irreparably injure plaintiffs and the public interest.\"\n\nThe president's public announcements on social media last month, outlining the closure date for East Potomac Park and linking it to the renovation of the golf course, weighed heavily in the decision. Trump said on Oct. 26 that \"We are closing the East Potomac Golf Course Site as scheduled on November 15th in order to renovate and rebuild for Competitive (with other such projects!), Safety, Modernization, and Aesthetic reasons.\" He added that the goal was to renovate and rebuild \"a World Championship Public Facility.\"\n\nReyes, in her ruling Saturday, noted that Trump's posts presented a problem for the government. \"They indicate that the Washington National Plan is final and that NPS will close the Park to implement it,\" she wrote. \"Both points favor granting Plaintiffs' motion for another temporary restraining order.\"\n\nReyes said her order \"ENJOINS the government from closing East Potomac Park and the East Potomac Golf Course during the daily hours in which they were open as of November 14, 2026. It does not order the Government to undertake any active management of either.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 07:28 PM IST", "pub_date_relative": "56m ago"}, {"title": "I'm a psychologist who studies couples\u20145 signs you've fallen into a common rut: 'It builds through small habits that each look harmless'", "full_content": "Couples today, especially ones who've been together for many years, are vulnerable to a silent, almost invisible and slow-growing \"relationship disease.\" I call this condition coexistence without contact. Couples living with this \"disease\" share a home, a bed and a schedule while living in almost entirely separate daily realities .\n\nIn her book \"Reclaiming Conversation,\" for example, MIT sociologist Sherry Turkle describes the modern experience of \"being together, but also being elsewhere,\" and argues that it undermines our capacity to have the conversations that count. Real conversations require both people to be present.\n\nAs a psychologist who specializes in relationships, I see couples having fewer of those real conversations and being less present with each other. They build systems for running a shared life. They work out who handles the mornings, who books the appointments, which chores belong to whom and how the week gets planned. These systems are a genuine achievement, and they're indicative of good management.\n\nBut a relationship isn't a company you're trying to run. A company improves when you divide responsibilities clearly and let each person own one area. A relationship is more complicated than that. In my experience, what holds two people together is overlap, along with conversation and genuine connection.\n\nIt builds through small habits that each look harmless, but get out of hand because you repeat them for a decade. In my experience, three of them do most of the damage:\n\nIn my experience, this issue shows up in five fairly predictable ways.\n\nYou confirm the plumber is coming Tuesday, agree on who's collecting your daughter from band practice and decide what to do about your mother's birthday.\n\nBut while you settle things and close loops, you never get to the strange thing a colleague said in a meeting, the article you read on the train or the fact that you've been contemplating leaving your job.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 07:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Take-Two director Ellen Siminoff sells $73,323 in TTWO shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 07:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Alliance Laundry Holdings COO Vleugels disposes of $1.58M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 07:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Got tax refund twice? Here is what you should do", "full_content": "At the outset, you should check whether this is actually a case of a double refund received in different bank accounts, whether the amount received in the other bank account is related to some other transaction/action, or whether it is a refund of TDS by the purchaser. Income tax refund is credited only in the one bank account nominated by the taxpayer and not in any other bank account.\n\nYou can check whether there are two instances of the same amount of refund granted by logging into the income tax portal and selecting \u201cStatus of Income Tax Refund\u201d in the filed returns tab. Each refund granted would have a unique UTR Number along with the bank account (censored) to which the refund has been paid. You can also check the amount of refund paid in Form 26AS/Annual Information System as available on the income tax portal. This will help you determine whether refund has indeed been granted to you twice and in separate bank accounts.\n\nWhile returning the excess income tax refund promptly is important to ensure that there is no interest charged on the excess received, it is imperative that the amount paid back by you is correctly reflected in the system so that a demand is not once again raised for the same.\n\nBefore taking any steps for returning the excess refund due, you may also check the Outstanding Demand tab on the income tax portal to check if the Income Tax Department has already demanded the excess refund back. If there is no outstanding demand, in order to ensure that the amount paid back is correctly reflected, you may write to your jurisdictional Assessing Officer explaining the facts and asking him to pass an order rectifying the amount in the system, thereby creating a demand for return of the excess amount.\n\nAgainst this new demand, you can now make the payment within the time prescribed. This may, however, be a time-consuming affair, with further interest accruing.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 07:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "South Korea's top scorer in tax accountancy exam admits cheating - BBC", "full_content": "South Korea's top scorer in tax accountancy exam admits cheating BBC Top scorer on South Korean tax exam confesses to cheating with AI Reuters 160 questions, only one wrong: top scorer in South Korea tax exam admits AI cheating The Guardian Korea\u2019s Top Scorer in Tax Accountant Exam Admits to AI Cheating Bloomberg.com AI cheating case raises scrutiny over test administration ahead of Suneung The Korea Herald", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 07:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Synopsys CEO Sassine Ghazi sells $5.47M in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 07:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Should a widow leave her late partner\u2019s home to her stepkids \u2014 or cut off contact with them?", "full_content": "\u201cIt would be a less drastic step than selling the home now and splitting the proceeds.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 07:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "The U.S. is turning more socialist under Trump 2.0, one analyst says. What could change with a Democratic-run Congress?", "full_content": "A handy chart shows how the U.S. used to be among the economies with the least state control \u2014 until that changed last year.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 07:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Curbline Properties director Alexander Otto sells $24,767 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "15 Nov 2026, 06:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Crystal Crop Protection IPO one lot profit calculator on latest GMP: How much can retail and HNI investors earn? Listing", "full_content": "Sharmila Bhadoria Updated 15 Nov 2026, 06:57 PM IST Prefer Livemint on Google The initial public offering (IPO) of Crystal Crop Protection is all set to open for subscription on Wednesday, November 18. The IPO\u2019s grey market premium (GMP) hints at 5.15% listing gain for investors. The IPO is a combination of fresh issue and offer for sale (OFS).\n\nValuing at approximately \u20b9 4,438 crore at the upper end of the price range, Crystal Crop IPO subscription process will begin on Wednesday and conclude on Friday. Here are all the details about the IPO and a calculation of how much profit investors are expected to make based on the latest GMP.\n\nCrystal Crop Protection\u2019s last recorded grey market premium (GMP) stood at \u20b9 14. With its upper price band fixed at \u20b9 272 per share, the estimated listing price for Crystal Crop Protection IPO stood at \u20b9 286 per share (which is the sum of upper price band and latest GMP), indicating an estimated listing gain for Crystal Crop Protection IPO at 5.15%.\n\nThe IPO's issue price band is fixed at \u20b9 259 - \u20b9 272 per share. The lot size for an application is 55 shares. The minimum amount of investment required by an individual investor (Retail) is \u20b9 14,960 (for 55 shares). Retail investors can apply for maximum 13 lots, ie 715 shares (equivalent to \u20b9 1,94,480). Small High-Net-Worth Individual (SHNI) are required to invest 14 lots, ie 770 shares (worth \u20b9 2,09,440)\n\nBased on the latest IPO GMP (at 6 pm on November 15), retail investors are expected to earn a profit of \u20b9 770 (for 1 lot) and \u20b9 10,010 (for 13 lots).\n\nCrystal Crop Protection IPO is a book build issue of \u20b9 455.49 crore and is a combination of 1.31 crore shares aggregating to \u20b9 354.77 crores and offer for sale of 37.03 lakh shares (equivalent to \u20b9 100.71 crore). The IPO will open for subscription on November 18 and conclude on November 20.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 06:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Rivian, Lucid, Scout CEOs aren\u2019t counting on Democrats to restore EV federal support after midterm wins", "full_content": "Leaders of several U.S. electric vehicle manufacturers said they're not counting on increased federal support for their businesses once Democrats gain control of Congress in January, but they said they'll gladly take it if it does happen.\n\nThat was the overall sentiment from CEOs of Rivian Automotive , Lucid Group and EV startup Scout Motors during interviews with CNBC after Democrats' historic midterm election wins.\n\n\"We've honestly constructed Scout from day one to be in an environment where we're not going to count on, let's say, legislation or count on things that may or may not be there,\" Scout CEO Scott Keogh , an automotive veteran, told CNBC on Wednesday.\n\nEV makers have had to contend with flip-flopping support from Washington over the years. The Trump administration has ended or rolled back support for climate change initiatives and EVs that were supported by the Biden administration, including an up to $7,500 customer incentive for purchasing an EV.\n\nLegacy automakers such as General Motors and EV startups alike had counted on such credits to help them boost their sales and assist in electric vehicle profitability. But now they don't have that same level of federal assistance.\n\nRivian CEO RJ Scaringe said it's his hope that the Democratic-controlled Congress and Republican President Donald Trump can find middle ground to make progress for the EV industry, but Rivian's not counting on that.\n\n\"We try not to plan for those sort of things. The reality is it's probably going to have less of an impact than we think,\" Scaringe said Nov. 6 following the election results. \"I think we're going to actually have a lot of challenges getting things done.\"\n\nFellow EV manufacturer Lucid , which is backed by Saudi Arabia's Public Investment Fund, is taking a similar approach.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018It leaves me with a sour taste\u2019: My elderly mother gave our cousin $800 for a car repair. Should I be worried?", "full_content": "\u201cI know older people can easily feel patronized, and I don\u2019t want that to happen.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Top Wall Street analysts are bullish on these 3 stocks for the long term", "full_content": "Major indexes were volatile this week due to earnings from artificial intelligence companies, key economic releases, and the scandal involving Nvidia former CEO Jensen Huang. While short-term fluctuations could weigh on investor sentiment, it is prudent to maintain a long-term investment horizon.\n\nInvestors looking for attractive long-term picks can track the ratings of top Wall Street analysts and gain key insights from their in-depth research on the macro and micro factors impacting stocks.\n\nHere are three stocks favored by some of Wall Street's top pros, according to TipRanks, a platform that ranks analysts based on their past performance.\n\nCybersecurity company Palo Alto Networks will announce its fiscal first-quarter earnings on Nov. 18. Migration to the cloud and the rapid adoption of AI have increased demand for cybersecurity solutions provided by Palo Alto and its peers. TipRanks' KPIs tool for PANW shows the rise in the company's subscription revenue over the years, driven by the adoption of its AI and security offerings and contributions from recent acquisitions.\n\nTipranks Ahead of the upcoming earnings, Oppenheimer analyst Ittai Kidron reiterated a buy rating on Palo Alto stock with a price target of $450 . The five-star analyst said that his checks indicate upside potential from CyberArk and Chronosphere acquisitions and strength in the company's core businesses.\n\nSpecifically, Kidron expects Palo Alto's Q1 FY27 next-generation security annualized recurring revenue to be about two percentage points above the midpoint of the guidance range and consensus, or $9.55 billion. He also sees nearly 1 to 1.5 percentage points of revenue upside compared to the guidance and consensus of $3.305 billion.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 06:19 PM IST", "pub_date_relative": "2h ago"}, {"title": "Panchayat Season 5 Release: Prime Video's Cryptic Post Sparks Buzz, Leaves Fans Speculating", "full_content": "Produced by The Viral Fever (TVF) and directed by Deepak Kumar Mishra, Panchayat follows Abhishek Tripathi, an urban graduate who becomes the secretary of a gram panchayat in the fictional village of Phulera.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 06:13 PM IST", "pub_date_relative": "2h ago"}, {"title": "Jensen Huang Carried a Secret for More Than a Year. It Led to His Downfall. - The New York Times", "full_content": "Jensen Huang Carried a Secret for More Than a Year. It Led to His Downfall. The New York Times How the tech industry and markets have responded to Jensen Huang's resignation NPR Jensen Huang resigned in disgrace from Nvidia. Many in Silicon Valley are still showering him with support CNN Nvidia scandal hits Trump\u2019s political vulnerabilities after Democratic sweep The Washington Post Over 100,000 Want Jensen Huang Back. Nvidia Stock\u2019s Real Test Comes Tuesday. Yahoo Finance", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 06:10 PM IST", "pub_date_relative": "2h ago"}, {"title": "Invested in Post Office Monthly Income Scheme? Here's what happens to your monthly interest if you leave it unclaimed", "full_content": "Investors putting money into the Post Office Monthly Income Scheme (MIS) for a regular income should pay attention to what happens to the interest they leave unclaimed. Unlike a recurring deposit or a fixed deposit with a reinvestment option, the scheme does not compound its monthly interest. Any interest that an account holder does not claim earns no additional interest, which can reduce the effective return on money that remains unused.\n\nThe government-backed small savings scheme currently offers an interest rate of 7.4% per annum, payable monthly. It has a five-year maturity period and is designed primarily for investors who want a predictable income stream rather than capital appreciation.\n\nUnder the National Savings (Monthly Income Account) Scheme, 2019, interest is payable on completion of every month from the date of opening the account. However, the rules explicitly state that if the account holder does not claim the monthly interest, it will not earn any additional interest.\n\nConsider an investor who deposits \u20b9 9 lakh, the maximum permitted in a single-holder MIS account. At the current interest rate of 7.4%, the investment generates \u20b9 66,600 in annual interest, translating into a monthly payout of \u20b9 5,550.\n\nIf the investor does not claim this monthly interest, the unclaimed amount does not earn any further interest under the scheme's rules.\n\nThe same applies to joint accounts, where the maximum investment limit is \u20b9 15 lakh. At 7.4%, such an investment generates \u20b9 1,11,000 annually, or \u20b9 9,250 every month.\n\nThe distinction is important because investors may assume that leaving their monthly payouts untouched will help their savings grow. However, MIS is structured to distribute interest rather than reinvest it.\n\nInvestors do not necessarily have to visit a post office every month to collect their interest.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 06:04 PM IST", "pub_date_relative": "2h ago"}, {"title": "As Thousands Of College Seats Remain Vacant, Karnataka To Hold Counselling for 222 College Principals", "full_content": "The new appointments of College principals will give a boost to institutional leadership and is expected to attract more students to fill vacant seats", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 06:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold and silver are supposed to protect against inflation. So why are both metals tumbling instead?", "full_content": "Charts show the potential for more pain ahead", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 06:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "India, Egypt To Work On Terms Of Reference For Potential Trade Pact", "full_content": "Commerce Minister Piyush Goyal called for far greater ambition than the current $6.5 billion in bilateral trade, and suggested linking UPI with Egyptian payment systems to cut the cost of doing business.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 05:58 PM IST", "pub_date_relative": "2h ago"}, {"title": "Gold, silver prices ahead of wedding season: Down over 4% this week - Investors guide before US Fed Dec meeting", "full_content": "Gold and silver prices have taken a sharp knock, offering some relief to buyers ahead of India's wedding season. However, the recent correction in precious metals has also raised concerns about whether the sell-off has further room to run, particularly as hotter-than-expected US inflation strengthens expectations of another Federal Reserve rate hike.\n\nOn the Multi Commodity Exchange (MCX), gold futures for December delivery ended Friday higher by \u20b9 525, or 0.39%, at \u20b9 1,36,750 per 10 grams. Silver contracts also recovered, gaining \u20b9 234, or 0.13%, to \u20b9 1,76,543 per kg.\n\nDespite Friday's recovery, both metals remained sharply lower for the week. MCX gold declined around 4.6%, while silver fell nearly 5%, reflecting pressure from a stronger US dollar, rising bond yields and concerns over the US interest-rate outlook.\n\nGold witnessed its steepest fall on Thursday, when prices dropped nearly 3% to a year-to-date low and their weakest level in more than a year. Bargain buying helped the yellow metal recover some losses in the following session. Silver tracked gold's decline but experienced sharper price swings, reflecting its higher volatility.\n\nThe sell-off followed the hotter-than-expected US inflation reading for October. The producer price index (PPI) rose 6.5% year-on-year, while the latest inflation data strengthened expectations of a December rate hike. Higher interest rates tend to weigh on non-yielding assets such as gold and silver by making interest-bearing investments more attractive.\n\nPonmudi R, CEO of Enrich Money, said MCX gold ended the week with a negative bias, closing near \u20b9 1,36,705 after breaking below the \u20b9 1,37,500\u2013 \u20b9 1,38,300 support zone. This range has now turned into a resistance area.\n\nAccording to Ponmudi, immediate resistance is placed at \u20b9 1,37,500\u2013 \u20b9 1,38,300, followed by \u20b9 1,40,000\u2013 \u20b9 1,41,000.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 05:45 PM IST", "pub_date_relative": "2h ago"}, {"title": "Crude Oil May Extend Losses This Week; Brent Seen Testing $90-92 Per Barrel, Say Analysts", "full_content": "Geopolitical tensions between Washington and Tehran, rising inventories and supply concerns are likely to shape crude oil prices this week.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 05:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "From Viral Trolling, Endless Visa Delays To A US Boy Band: The Surreal' Rise Of Darshan Magdum", "full_content": "The 22-year-old made his first in-person appearance alongside his three bandmates at the American Dream Mall in East Rutherford, New Jersey, on Friday.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 05:44 PM IST", "pub_date_relative": "2h ago"}, {"title": "Rs 4.06 Lakh Crore From Your Wallet: Where India's Rs 9.52 Lakh Crore Healthcare Spend Actually Goes", "full_content": "Of the country's total healthcare expenditure of Rs 9.52 lakh crore, a staggering Rs 4.06 lakh crore is borne by households.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 05:41 PM IST", "pub_date_relative": "2h ago"}, {"title": "Anthropic\u2019s IPO lands as the embattled AI trade looks for a much-needed bright spot", "full_content": "Between rising interest rates, a nationwide AI backlash, a major political shift in Washington, D.C., and the sudden ouster of Nvidia CEO Jensen Huang , the tech industry is under mounting strain.\n\nNow comes the most important tech IPO in years, and a defining event for the burgeoning but still young artificial intelligence market.\n\nWith Anthropic expected to debut on the Nasdaq on Thursday, the stakes are sky-high for almost every major tech company. Advanced Micro Devices , Broadcom , Google , Micron , Microsoft , Nvidia and Taiwan Semiconductor Manufacturing Company are collectively investing $26 billion at the IPO price, which is currently expected at $70 to $78 a share. Some of those companies are existing investors, as is early backer Amazon , whose stake could be in the hundreds of billions of dollars.\n\nIn addition to all the cash on the line, tech giants also need Anthropic's spending for many years to come. The Claude creator and its top rival, OpenAI, are driving an outsized amount of the AI buildout, and are burning historic amounts of money in the process.\n\nAnthropic has outstanding spending commitments of over $900 billion, according to its latest prospectus . It's on the hook to spend at least $110 billion with Amazon over the course of a decade, and another $400 billion with other companies for cloud capacity, according to filings and partner disclosures. The lab also made $300 billion in commitments with data center and chip partners. Anthropic intends to lay out $125 billion to $150 billion for AI chips from Google , though delivery won't start until 2028.\n\n\"The numbers are just staggering,\" Joe Fath, a partner at venture firm Eclipse and former T. Rowe Price portfolio manager, said in an interview. \"It's hard to get your head wrapped around it.\"\n\nCloud partners Amazon, Google and Microsoft account for 31% of contractual obligations, Anthropic said in its prospectus.", "source": "CNBC World Economy", "pub_date_str": "15 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "As US credit card debt hits $1.29T, bank algorithms are rejecting debt-free, six-figure earners - Fox Business", "full_content": "As US credit card debt hits $1.29T, bank algorithms are rejecting debt-free, six-figure earners Fox Business Why you shouldn't wait until 2027 to deal with your credit card debt CBS News Data Show Households Still Managing to Meet Their Monthly Debts The New York Times A Look at the Wider Divide in Credit Card Delinquency by Income Liberty Street Economics Credit card debt climbs to a record $1.29 trillion, New York Fed research finds CNBC", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "CEO SUNDAY: BlackBerry boss on the company's evolution from smartphone giant to software powerhouse - Fox Business", "full_content": "CEO SUNDAY: BlackBerry boss on the company's evolution from smartphone giant to software powerhouse Fox Business BlackBerry\u2019s Second Act Has Kicked Into High Gear https://www.readthepeak.com/", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Stock market outlook, November 16-20: Nifty logs 3-week winning streak, first since June - Rally ahead or a pause?", "full_content": "Sharmila Bhadoria Updated 15 Nov 2026, 05:21 PM IST Prefer Livemint on Google Stock market outlook, November 16-20: The Nifty 50 ended in the green for the third consecutive week, marking its longest winning streak since June. The benchmark index gained 114 points, or 0.46%, last week, supported by strong foreign investor inflows and stronger corporate earnings.\n\nRenewed investor optimism towards domestic equities following a correction in global AI stocks also supported Nifty 50 and Sensex. The benchmark indices have surged nearly 9.70% over the past month. As we look ahead to next week, the key question is whether the stock market rally will extend into November 16-20 or take a breather after three consecutive weeks of gains.\n\nThe Indian stock market is likely to remain volatile with upward bias in the coming week as Nifty 50 continued to form higher highs and higher lows over the past few trading sessions. The trend indicated a bullish momentum, highlighted Dr. Ravi Singh, Chief Research Officer from Master Capital Services Ltd.\n\n\u201cThe index continues to form higher highs and higher lows, indicating sustained bullish momentum. As long as Nifty holds above the crucial horizontal support zone of 24,750, the overall technical outlook remains positive,\u201d explained Singh.\n\nGlobal crude oil price volatility, Indian Rupee movement, signals on the US Federal Reserve\u2019s policy trajectory and geopolitical developments around the Iran-US war are likely to impact the stock market investors\u2019 sentiment in the coming week.\n\n\u201cIn the coming weeks, the sustainability of these foreign inflows will be the key variable, with market participants closely tracking US-Iran geopolitical developments and their impact on crude oil prices.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 05:19 PM IST", "pub_date_relative": "3h ago"}, {"title": "Air Purifier Sales Surge As NCR AQI Deteriorates; Demand Spreads Beyond Traditional Markets", "full_content": "Croma says volumes have more than doubled this year, Amazon has seen sales double in a week, and Xiaomi reports fourfold growth. Brands say buyers are no longer waiting for smog to strike before purchasing.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 05:19 PM IST", "pub_date_relative": "3h ago"}, {"title": "Anthropic\u2019s IPO is the next big test for AI", "full_content": "Even the most powerful frontier labs must bend to the power of public equity", "source": "FT Markets", "pub_date_str": "15 Nov 2026, 05:10 PM IST", "pub_date_relative": "3h ago"}, {"title": "The Stock Market Is Doing Something for Only the 6th Time in 156 Years, and History Says It's Clear What Comes Next for Stocks - The Motley Fool", "full_content": "The Stock Market Is Doing Something for Only the 6th Time in 156 Years, and History Says It's Clear What Comes Next for Stocks The Motley Fool This epic Wall Street boom is not over yet The Telegraph I've studied the stock market for 30 years.This is the path to a crash Daily Mail Are Investors Expecting Too Much from the US Stock Market? Morningstar Record Highs, a 57-Year Low in Jobless Claims, and a Stock Market Bubble: Inside the Weirdest Market in History Briefs Finance", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 05:06 PM IST", "pub_date_relative": "3h ago"}, {"title": "No Pilot, 5-Tonne Payload: China\u2019s W5000 Cargo Aircraft Makes Maiden Flight", "full_content": "Built by Air White Whale with all-Chinese parts, the pilotless W5000 can carry up to 5 tonnes and fly as far as 2,600 km. It has drawn interest for 835 aircraft, with commercial service targeted for the end of 2027.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 05:03 PM IST", "pub_date_relative": "3h ago"}, {"title": "Stock Markets This Week: WPI Inflation, Crude Oil, FII Trading Activity To Guide Movement, Say Analysts", "full_content": "WPI inflation, FII flows, crude oil prices and global economic signals are expected to shape market sentiment amid a packed week of domestic and international triggers.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 04:59 PM IST", "pub_date_relative": "3h ago"}, {"title": "Sold a commercial property? Can you claim tax exemption by investing the proceeds in two flats? ITAT clarifies", "full_content": "A Mumbai taxpayer who sold six commercial properties and invested the proceeds in two flats on different floors of the same building has won a major capital gains tax relief. The Mumbai Income Tax Appellate Tribunal (ITAT) has allowed a deduction of \u20b9 2.51 crore under Section 54F of the Income-tax Act, ruling that the two flats could be treated as one residential house despite having separate registrations and entrances.\n\nThe decision is important for property owners who sell commercial property, land or other long-term capital assets and reinvest the proceeds in a residential home. It clarifies that buying two separately registered flats does not automatically mean that a taxpayer loses the Section 54F exemption. What matters is whether the two units, considering the facts of the case, can be treated as one residential house.\n\nThe ruling in Sunil Indravadan Shah vs ITO, Ward 19(3)(1) (ITA No. 7276/MUM/2025), pronounced on 24 August 2026, addresses an important question for taxpayers buying multiple residential units to claim capital gains tax exemption.\n\nThe taxpayer sold six commercial units at Solitaire Chambers on Kalbadevi Road, Mumbai, between 13 June 2019 and 5 July 2019. The sale generated a net consideration of \u20b9 5.32 crore and long-term capital gains of approximately \u20b9 4.97 crore.\n\nTo claim exemption under Section 54F, he invested the proceeds in two residential flats in 22 Dholera, a building in Parel, Mumbai. Both properties were purchased from the same developer, Safal Realtors & Developers Pvt. Ltd., through separate agreements registered on 29 September 2020.\n\nEach flat measured 1,334.19 sq. ft. and cost \u20b9 2.65 crore.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 04:47 PM IST", "pub_date_relative": "3h ago"}, {"title": "IPO Lock-In Expiry: ENS Enterprises, Shankesh Jewellers, Sunshine Pictures, Behari Lal Engineering In Focus From Nov 16-20", "full_content": "ENS Enterprises Ltd. is scheduled for Nov. 17, followed by Shankesh Jewellers Ltd. on Nov. 18.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 04:40 PM IST", "pub_date_relative": "3h ago"}, {"title": "BITS Pilani Raises $54 Million in Alumni Donations, Moves Closer To $100 Million Goal", "full_content": "Overall, BITS Pilani has received alumni contributions of Rs 256 crore, since the inception of its Alumni Relations Office.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 04:40 PM IST", "pub_date_relative": "3h ago"}, {"title": "Congress moves to pass tighter AI chip export rules following Nvidia scandal - Financial Times", "full_content": "Congress moves to pass tighter AI chip export rules following Nvidia scandal Financial Times Huang's downfall may undo cozy ties between business and government: analysis CNBC Democrats Vie to Lead Nvidia Probes Next Year WSJ Is the Nvidia scandal souring Washington\u2019s Silicon Valley love affair? The San Francisco Standard Nvidia TelegraphHerald.com", "source": "Google News Business", "pub_date_str": "15 Nov 2026, 04:30 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Social Security and the blue wave: What could happen to payroll taxes and senior tax breaks", "full_content": "Congress has six years to enact changes to Social Security to prevent cuts to retirement benefits. Senators elected in the Nov. 3 midterms will be in office when the deadline arrives, and their decisions may be critical in making tax changes that can affect Social Security.\n\nDuring the midterm campaign season, tax policy surfaced in the debate over Social Security in two different ways. Many Democrats, and some Republicans, called for high earners to pay more in Social Security payroll taxes, while many Republicans touted a recently enacted tax deduction for adults 65 and older.\n\nThe diverging tactics come at a crucial moment for reform: The first could increase revenue flowing into the program. The second reduces eligible older adults' income taxes and can lower the taxes some beneficiaries pay on Social Security benefits, reducing program revenue.\n\nSocial Security trustees' latest projections show the trust fund used to pay retirement benefits may start to become depleted in 2032, when 78% of benefits would be payable.\n\nLawmakers do have some leeway \u2014 if the program's retirement and disability trust funds are combined, depletion would be pushed out to 2034, when 83% of scheduled benefits would be payable. But that's still a haircut for retirees \u2014 and it's coming soon.\n\n\"We've waited too long already, and the consequences are that the gap has grown larger,\" Shai Akabas, vice president of economic policy at the Bipartisan Policy Center, said of Social Security's shortfall.\n\nOn the campaign trail, midterm candidates largely avoided specifics on how they would reform Social Security. However, raising the payroll tax cap, also known as the taxable maximum, was a popular choice among Democratic candidates.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 08:00 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'We slept here.' Flight delays linger as airlines scramble to recover from ground stop", "full_content": "Flight disruptions lingered on Sunday, two days after the Federal Aviation Administration grounded departures nationwide for more than four hours as airlines scrambled to get travelers and crews into place.\n\n\"We slept here,\" said Beth Martin, who was trying to travel home to Birmingham, Alabama, from New York's LaGuardia Airport on Sunday at the end of her daughter's birthday trip. They were booked for Saturday night, and when delay announcements started rolling in from Delta Air Lines , they decided to make good use of the extra time: after strolling through Central Park, they went window shopping on Fifth Avenue.\n\nBut when the flight was canceled, the standby list on a backup flight looked grim, and their original midtown hotel was charging about $700 for an additional night, the two of them slept at LaGuardia on Saturday. She said they found wheelchairs to sleep in outside security.\n\nMore than 1,400 U.S. flights there were canceled as of 7 a.m. ET and more than 2,000 were delayed, according to FlightAware data. That was far fewer than the almost 6,700 cancellations on Saturday and more than 9,200 on Sunday when the FAA halted all departures into U.S. airports.\n\nTransportation Secretary Sean Duffy on Saturday tied the issue to a router and work to update from copper wires, a system overseen by L3Harris Technologies , to a fiber-optic system. FAA administrator Bryan Bedford said the upgrades were part of \"routine\" maintenance to switch over to fiber optic.\n\n\"We are supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel,\" L3Harris said in a statement Saturday afternoon.\n\nAirlines waived change fees and fare differences and offered pilots and flight attendants extra pay to ease the delays.\n\nCustomers told CNBC they were booked on several flights before getting on board.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 07:54 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stock to buy after Q2 Results 2026: Up 70% in YTD! Should you buy retail stock after strong guidance? Target, stop-loss", "full_content": "Sharmila Bhadoria Published 15 Nov 2026, 07:35 PM IST Prefer Livemint on Google Stock to buy after Q2 results, 2026: Shares of Baazar Style Retail Limited will remain in focus during Monday\u2019s trading session after the announcement of second quarter results over the weekend.\n\nBazaar Style Retail share price closed 5.39% higher on Friday, extending its bullish run over the past few trading sessions. Its share price value has surged 20% over the last one week.\n\nThe specialty retail stock is showcasing positive momentum on daily, weekly and monthly charts, according to Mahesh M Ojha, VP -Research and Business Development at KC Securities. The expert suggest to place support at \u20b9 442- 415, it can go up to the level of resistance near 486-503-530.\n\nThe stock closed 5.39% higher at \u20b9 468.55 per share on BSE with a market capitalisation of \u20b9 3,566.48 crore on Friday, November 13. Its share price value has surged nearly 20.08% over the last one week, 33.3% in two weeks, 22.87% in one month, 34% in three months. The stock has delivered 73% return since the beginning of the year 2026 and around 51% in one year.\n\nThe Kolkata-headquartered company\u2019s revenue from operations stood at \u20b9 47,848.31 lakh in the second quarter of financial year 2026-27, against \u20b9 53,149.66 lakh reported in the year ago period.\n\nThe value fashion retail chains expanded its network to 293 stores across 10 states. The company is on track to achieve its milestone of 300 stores. The company reported a revenue of \u20b9 965 crore in the first half of financial year 2026-27.\n\n\u201cLooking ahead, the Company expects Q3 and Q4 FY27 to be its strongest quarters. It is targeting turnover of \u20b9 2,500 Cr in FY27, with revenue guidance to achieve \u20b9 3,800 Cr in FY28 and \u20b9 5,600 Cr in FY29,\u201d read the press release.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 07:35 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "8th Pay Commission salary hike: How a 7% annual increment could take your basic pay above \u20b91 lakh in 10 years", "full_content": "A central government employee drawing a basic salary of \u20b9 29,200 could see it cross \u20b9 1 lakh in 10 years if the annual increment rate increases to 7% under the 8th Pay Commission. Interestingly, this could happen even with a lower fitment factor of 2.1. Under another scenario, where the fitment factor remains at 2.57 but the annual increment stays at 3%, the employee's basic salary could reach only \u20b9 97,915 over the same period.\n\nThe comparison highlights an important question for central government employees awaiting the next pay revision. Would a higher fitment factor, which provides a bigger initial salary increase, be more beneficial than a higher annual increment that allows basic pay to grow faster over time?\n\nEmployee organisations have submitted proposals seeking changes to both components. While several have demanded a fitment factor of 3.833, others are seeking an increase in annual increments from the existing 3% to 6-7%. Neither proposal has been approved by the government.\n\nThe fitment factor is the multiplier applied to an employee's existing basic pay to calculate the revised basic salary under a new pay commission. Under the 7th Pay Commission, the government fixed it at 2.57.\n\nFor the 8th Pay Commission, the National Council of the Joint Consultative Machinery (NC-JCM) and several other employee organisations have proposed a fitment factor of 3.833. If accepted, this would increase the minimum basic salary from \u20b9 18,000 to \u20b9 69,000.\n\nEmployees are also seeking a higher annual increment. NC-JCM, the All India Defence Employees' Federation (AIDEF) and the Federation of National Postal Organisations (FNPO) have demanded an increase to 6%. The All India New Pension Scheme Employees Federation (AINPSEF) has proposed an annual increment of 7%.\n\nUnder the existing pay structure, central government employees receive a 3% annual increment.\n\nConsider an employee in Pay Level 5, currently drawing a basic salary of \u20b9 29,200.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 07:31 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Will the Anthropic IPO create a disturbance in the broader U.S. equity market, like SpaceX did?", "full_content": "SpaceX\u2019s offering coincided with the June peak in semiconductors.", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 07:30 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Judge temporarily blocks Trump from moving ahead on Washington public golf course redevelopment", "full_content": "A federal judge on Saturday ordered a two-week delay to any work at a historic Washington public golf course near the White House, blocking, for now, President Donald Trump's push to redevelop the site along the Potomac River into a championship-level venue.\n\nU.S. District Judge Ana Reyes issued the temporary restraining order before the East Potomac Golf Links was set to close for 15 months on Sunday. Trump had announced work would begin that day despite the legal challenge initiated against the project in February by the DC Preservation League and two local golfers.\n\nThe plaintiffs argue that Trump's plan would change the character of the accessible golf course and make it unaffordable, something the Republican president denies. They had sought the stop-work order, saying that closing the course and launching work on the project would \"irreparably injure plaintiffs and the public interest.\"\n\nThe president's public announcements on social media last month, outlining the closure date for East Potomac Park and linking it to the renovation of the golf course, weighed heavily in the decision. Trump said on Oct. 26 that \"We are closing the East Potomac Golf Course Site as scheduled on November 15th in order to renovate and rebuild for Competitive (with other such projects!), Safety, Modernization, and Aesthetic reasons.\" He added that the goal was to renovate and rebuild \"a World Championship Public Facility.\"\n\nReyes, in her ruling Saturday, noted that Trump's posts presented a problem for the government. \"They indicate that the Washington National Plan is final and that NPS will close the Park to implement it,\" she wrote. \"Both points favor granting Plaintiffs' motion for another temporary restraining order.\"\n\nReyes said her order \"ENJOINS the government from closing East Potomac Park and the East Potomac Golf Course during the daily hours in which they were open as of November 14, 2026. It does not order the Government to undertake any active management of either.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 07:28 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Crystal Crop Protection IPO one lot profit calculator on latest GMP: How much can retail and HNI investors earn? Listing", "full_content": "Sharmila Bhadoria Updated 15 Nov 2026, 06:57 PM IST Prefer Livemint on Google The initial public offering (IPO) of Crystal Crop Protection is all set to open for subscription on Wednesday, November 18. The IPO\u2019s grey market premium (GMP) hints at 5.15% listing gain for investors. The IPO is a combination of fresh issue and offer for sale (OFS).\n\nValuing at approximately \u20b9 4,438 crore at the upper end of the price range, Crystal Crop IPO subscription process will begin on Wednesday and conclude on Friday. Here are all the details about the IPO and a calculation of how much profit investors are expected to make based on the latest GMP.\n\nCrystal Crop Protection\u2019s last recorded grey market premium (GMP) stood at \u20b9 14. With its upper price band fixed at \u20b9 272 per share, the estimated listing price for Crystal Crop Protection IPO stood at \u20b9 286 per share (which is the sum of upper price band and latest GMP), indicating an estimated listing gain for Crystal Crop Protection IPO at 5.15%.\n\nThe IPO's issue price band is fixed at \u20b9 259 - \u20b9 272 per share. The lot size for an application is 55 shares. The minimum amount of investment required by an individual investor (Retail) is \u20b9 14,960 (for 55 shares). Retail investors can apply for maximum 13 lots, ie 715 shares (equivalent to \u20b9 1,94,480). Small High-Net-Worth Individual (SHNI) are required to invest 14 lots, ie 770 shares (worth \u20b9 2,09,440)\n\nBased on the latest IPO GMP (at 6 pm on November 15), retail investors are expected to earn a profit of \u20b9 770 (for 1 lot) and \u20b9 10,010 (for 13 lots).\n\nCrystal Crop Protection IPO is a book build issue of \u20b9 455.49 crore and is a combination of 1.31 crore shares aggregating to \u20b9 354.77 crores and offer for sale of 37.03 lakh shares (equivalent to \u20b9 100.71 crore). The IPO will open for subscription on November 18 and conclude on November 20.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 06:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rivian, Lucid, Scout CEOs aren\u2019t counting on Democrats to restore EV federal support after midterm wins", "full_content": "Leaders of several U.S. electric vehicle manufacturers said they're not counting on increased federal support for their businesses once Democrats gain control of Congress in January, but they said they'll gladly take it if it does happen.\n\nThat was the overall sentiment from CEOs of Rivian Automotive , Lucid Group and EV startup Scout Motors during interviews with CNBC after Democrats' historic midterm election wins.\n\n\"We've honestly constructed Scout from day one to be in an environment where we're not going to count on, let's say, legislation or count on things that may or may not be there,\" Scout CEO Scott Keogh , an automotive veteran, told CNBC on Wednesday.\n\nEV makers have had to contend with flip-flopping support from Washington over the years. The Trump administration has ended or rolled back support for climate change initiatives and EVs that were supported by the Biden administration, including an up to $7,500 customer incentive for purchasing an EV.\n\nLegacy automakers such as General Motors and EV startups alike had counted on such credits to help them boost their sales and assist in electric vehicle profitability. But now they don't have that same level of federal assistance.\n\nRivian CEO RJ Scaringe said it's his hope that the Democratic-controlled Congress and Republican President Donald Trump can find middle ground to make progress for the EV industry, but Rivian's not counting on that.\n\n\"We try not to plan for those sort of things. The reality is it's probably going to have less of an impact than we think,\" Scaringe said Nov. 6 following the election results. \"I think we're going to actually have a lot of challenges getting things done.\"\n\nFellow EV manufacturer Lucid , which is backed by Saudi Arabia's Public Investment Fund, is taking a similar approach.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 06:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Top Wall Street analysts are bullish on these 3 stocks for the long term", "full_content": "Major indexes were volatile this week due to earnings from artificial intelligence companies, key economic releases, and the scandal involving Nvidia former CEO Jensen Huang. While short-term fluctuations could weigh on investor sentiment, it is prudent to maintain a long-term investment horizon.\n\nInvestors looking for attractive long-term picks can track the ratings of top Wall Street analysts and gain key insights from their in-depth research on the macro and micro factors impacting stocks.\n\nHere are three stocks favored by some of Wall Street's top pros, according to TipRanks, a platform that ranks analysts based on their past performance.\n\nCybersecurity company Palo Alto Networks will announce its fiscal first-quarter earnings on Nov. 18. Migration to the cloud and the rapid adoption of AI have increased demand for cybersecurity solutions provided by Palo Alto and its peers. TipRanks' KPIs tool for PANW shows the rise in the company's subscription revenue over the years, driven by the adoption of its AI and security offerings and contributions from recent acquisitions.\n\nTipranks Ahead of the upcoming earnings, Oppenheimer analyst Ittai Kidron reiterated a buy rating on Palo Alto stock with a price target of $450 . The five-star analyst said that his checks indicate upside potential from CyberArk and Chronosphere acquisitions and strength in the company's core businesses.\n\nSpecifically, Kidron expects Palo Alto's Q1 FY27 next-generation security annualized recurring revenue to be about two percentage points above the midpoint of the guidance range and consensus, or $9.55 billion. He also sees nearly 1 to 1.5 percentage points of revenue upside compared to the guidance and consensus of $3.305 billion.", "source": "CNBC Top News", "pub_date_str": "15 Nov 2026, 06:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Invested in Post Office Monthly Income Scheme? Here's what happens to your monthly interest if you leave it unclaimed", "full_content": "Investors putting money into the Post Office Monthly Income Scheme (MIS) for a regular income should pay attention to what happens to the interest they leave unclaimed. Unlike a recurring deposit or a fixed deposit with a reinvestment option, the scheme does not compound its monthly interest. Any interest that an account holder does not claim earns no additional interest, which can reduce the effective return on money that remains unused.\n\nThe government-backed small savings scheme currently offers an interest rate of 7.4% per annum, payable monthly. It has a five-year maturity period and is designed primarily for investors who want a predictable income stream rather than capital appreciation.\n\nUnder the National Savings (Monthly Income Account) Scheme, 2019, interest is payable on completion of every month from the date of opening the account. However, the rules explicitly state that if the account holder does not claim the monthly interest, it will not earn any additional interest.\n\nConsider an investor who deposits \u20b9 9 lakh, the maximum permitted in a single-holder MIS account. At the current interest rate of 7.4%, the investment generates \u20b9 66,600 in annual interest, translating into a monthly payout of \u20b9 5,550.\n\nIf the investor does not claim this monthly interest, the unclaimed amount does not earn any further interest under the scheme's rules.\n\nThe same applies to joint accounts, where the maximum investment limit is \u20b9 15 lakh. At 7.4%, such an investment generates \u20b9 1,11,000 annually, or \u20b9 9,250 every month.\n\nThe distinction is important because investors may assume that leaving their monthly payouts untouched will help their savings grow. However, MIS is structured to distribute interest rather than reinvest it.\n\nInvestors do not necessarily have to visit a post office every month to collect their interest.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 06:04 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold and silver are supposed to protect against inflation. So why are both metals tumbling instead?", "full_content": "Charts show the potential for more pain ahead", "source": "MarketWatch Top Stories", "pub_date_str": "15 Nov 2026, 06:00 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold, silver prices ahead of wedding season: Down over 4% this week - Investors guide before US Fed Dec meeting", "full_content": "Gold and silver prices have taken a sharp knock, offering some relief to buyers ahead of India's wedding season. However, the recent correction in precious metals has also raised concerns about whether the sell-off has further room to run, particularly as hotter-than-expected US inflation strengthens expectations of another Federal Reserve rate hike.\n\nOn the Multi Commodity Exchange (MCX), gold futures for December delivery ended Friday higher by \u20b9 525, or 0.39%, at \u20b9 1,36,750 per 10 grams. Silver contracts also recovered, gaining \u20b9 234, or 0.13%, to \u20b9 1,76,543 per kg.\n\nDespite Friday's recovery, both metals remained sharply lower for the week. MCX gold declined around 4.6%, while silver fell nearly 5%, reflecting pressure from a stronger US dollar, rising bond yields and concerns over the US interest-rate outlook.\n\nGold witnessed its steepest fall on Thursday, when prices dropped nearly 3% to a year-to-date low and their weakest level in more than a year. Bargain buying helped the yellow metal recover some losses in the following session. Silver tracked gold's decline but experienced sharper price swings, reflecting its higher volatility.\n\nThe sell-off followed the hotter-than-expected US inflation reading for October. The producer price index (PPI) rose 6.5% year-on-year, while the latest inflation data strengthened expectations of a December rate hike. Higher interest rates tend to weigh on non-yielding assets such as gold and silver by making interest-bearing investments more attractive.\n\nPonmudi R, CEO of Enrich Money, said MCX gold ended the week with a negative bias, closing near \u20b9 1,36,705 after breaking below the \u20b9 1,37,500\u2013 \u20b9 1,38,300 support zone. This range has now turned into a resistance area.\n\nAccording to Ponmudi, immediate resistance is placed at \u20b9 1,37,500\u2013 \u20b9 1,38,300, followed by \u20b9 1,40,000\u2013 \u20b9 1,41,000.", "source": "LiveMint Markets", "pub_date_str": "15 Nov 2026, 05:45 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Crude Oil May Extend Losses This Week; Brent Seen Testing $90-92 Per Barrel, Say Analysts", "full_content": "Geopolitical tensions between Washington and Tehran, rising inventories and supply concerns are likely to shape crude oil prices this week.", "source": "NDTV Profit", "pub_date_str": "15 Nov 2026, 05:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Anthropic\u2019s IPO lands as the embattled AI trade looks for a much-needed bright spot", "full_content": "Between rising interest rates, a nationwide AI backlash, a major political shift in Washington, D.C., and the sudden ouster of Nvidia CEO Jensen Huang , the tech industry is under mounting strain.\n\nNow comes the most important tech IPO in years, and a defining event for the burgeoning but still young artificial intelligence market.\n\nWith Anthropic expected to debut on the Nasdaq on Thursday, the stakes are sky-high for almost every major tech company. Advanced Micro Devices , Broadcom , Google , Micron , Microsoft , Nvidia and Taiwan Semiconductor Manufacturing Company are collectively investing $26 billion at the IPO price, which is currently expected at $70 to $78 a share. Some of those companies are existing investors, as is early backer Amazon , whose stake could be in the hundreds of billions of dollars.\n\nIn addition to all the cash on the line, tech giants also need Anthropic's spending for many years to come. The Claude creator and its top rival, OpenAI, are driving an outsized amount of the AI buildout, and are burning historic amounts of money in the process.\n\nAnthropic has outstanding spending commitments of over $900 billion, according to its latest prospectus . It's on the hook to spend at least $110 billion with Amazon over the course of a decade, and another $400 billion with other companies for cloud capacity, according to filings and partner disclosures. The lab also made $300 billion in commitments with data center and chip partners. Anthropic intends to lay out $125 billion to $150 billion for AI chips from Google , though delivery won't start until 2028.\n\n\"The numbers are just staggering,\" Joe Fath, a partner at venture firm Eclipse and former T. Rowe Price portfolio manager, said in an interview. \"It's hard to get your head wrapped around it.\"\n\nCloud partners Amazon, Google and Microsoft account for 31% of contractual obligations, Anthropic said in its prospectus.", "source": "CNBC World Economy", "pub_date_str": "15 Nov 2026, 05:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock market outlook, November 16-20: Nifty logs 3-week winning streak, first since June - Rally ahead or a pause?", "full_content": "Sharmila Bhadoria Updated 15 Nov 2026, 05:21 PM IST Prefer Livemint on Google Stock market outlook, November 16-20: The Nifty 50 ended in the green for the third consecutive week, marking its longest winning streak since June. The benchmark index gained 114 points, or 0.46%, last week, supported by strong foreign investor inflows and stronger corporate earnings.\n\nRenewed investor optimism towards domestic equities following a correction in global AI stocks also supported Nifty 50 and Sensex. The benchmark indices have surged nearly 9.70% 9 in an attack that the DOJ attributed to actors linked to the North Korean military.\n\nJoint efforts by the US government and the private sector have resulted in more than $2.7 billion of the stolen funds being frozen, CNBC reported.\n\nThe Federal Bureau of Investigation (FBI) has blamed the attack, which raised concerns about security in the cryptocurrency market, on members of the North Korean military. The agency refers to the group as \u201cTraderTraitor.\u201d\n\nThe DOJ said it was taking coordinated action against what it described as the North Korean government\u2019s \u201cschemes to fund its regime through the massive theft of cryptocurrency.\u201d\n\nAs part of these efforts, the department announced \u201cthe court-authorized seizure and restraint of more than $1.2 billion worth of cryptocurrency recently stolen from Binance.\u201d\n\nBinance's Proof of Reserves (PoR) system allows users to check whether their assets are included in the exchange's published reserve records. Here is a step-by-step guide to verifying your account balance.\n\nAccording to Binance's monthly schedule, users' balances are recorded on the first day of each month at midnight (00:00 UTC). The results are generally published by the seventh day of the month. However, the exchange may also publish special snapshots or announce changes to the publication date.", "source": "LiveMint Money", "pub_date_str": "15 Nov 2026, 04:29 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sensex, Nifty cheer as Bulls, FPIs back in Indian stock market; pump in over \u20b984k cr in Nov so far - More rally ahead?", "full_content": "MIDCAP Dhanya Nagasundaram Published 15 Nov 2026, 04:27 PM IST Prefer Livemint on Google Foreign portfolio investors (FPIs) have made a dramatic comeback to Indian equities in November, turning
