    const allData = {"general": [{"title": "My Top Nuclear Stock to Buy Right Now (and It's Not Even Close)", "full_content": "Skip to navigation Skip to main content Skip to right column My Top Nuclear Stock to Buy Right Now (and It's Not Even Close) Ryan Vanzo, The Motley Fool Sat, September 5, 2026 at 9:12 AM EDT 4 min read NVDA Nuclear energy is experiencing a resurgence, according to many leading experts. \"After decades of underinvestment, a convergence of generational technological breakthroughs, intensifying geopolitical competition, and the need for clean, dense, reliable power are positioning nuclear energy for a renaissance,\" analysts from Goldman Sachs conclude.\n\n\"But the next nuclear age will look different from the last,\" the bank warns. \"Innovations in fission like small modular reactors (SMRs) are shaping what the revival of traditional nuclear fission could look like.\"\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nAnalysts from Morgan Stanley are in agreement. \"Nuclear power generation is experiencing a revival driven by ambitious climate goals and technology demands,\" the firm observes. Like Goldman Sachs, Morgan Stanley sees SMRs as one of the most promising solutions for scaling nuclear energy.\n\n\"Innovations in nuclear energy may also contribute to the investment growth picture, and a new U.S. law aimed at encouraging new nuclear technologies while cutting down red tape could help spur activity,\" Morgan Stanley says. \"Small modular reactors (SMRs), for instance, are a fraction of the size of conventional reactors and can be factory assembled and transported, offering scalability and flexibility.\"\n\nThe idea of SMRs -- which are, in essence, simply miniature nuclear power plants -- has been around since the 1940s.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:42 PM IST", "pub_date_relative": "19m ago"}, {"title": "Bloom Energy, Illumina, Everpure Rise On S&P 500 Inclusion", "full_content": "BREAKING: Stocks Narrowly Mixed For Week; Sandisk Leads Memory Higher\n\nStore Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Stocks On The Move New Highs Stock Spotlight Stocks Near Buy Zone RS Line At New High Rising Profit Estimates Stocks Funds Are Buying Your Weekly Review Breakout Stocks Index IBD ETF Indexes IBD Data Tables IBD Digital: 2 Months for $20 New? Start Here Research STOCK RESEARCH IBD Stock Checkup Stock Of The Day Screen Of The Day IBD Charts Stock Screener Swing Trading Options Investing Action Plan Earnings Preview Earnings Calendar IBD Industry Themes The New America Best ETFs Best Mutual Funds The Income Investor IBD Stock Analysis Industry Snapshot IBD 50 Stocks To Watch IBD Data Stories IBD Digital: 2 Months for $20 News NEWS eIBD Technology Magnificent Seven Stocks Personal Finance Special Reports Cryptocurrency Retirement Management ECONOMY Economic Calendar Economic News IBD Digital: 2 Months for $20 Videos VIDEOS & PODCASTS IBD Live How To Invest Videos Options Videos Investing With IBD Podcast Growth Stories Podcast Webinars Online Courses IBD Digital: 2 Months for $20 Learn HOW TO INVEST How To Invest In Stocks Stock Investing Keys Stock Market Timing Track Market Trends How To Read Stock Charts How To Buy Stocks When To Sell Stocks Short Selling Swing Trading What Is Crypto EDUCATIONAL RESOURCES New to IBD Investor's Corner Investing With IBD Podcast Events & Webinars IBD Moneyworks 12 Days Of Learning In.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:31 PM IST", "pub_date_relative": "30m ago"}, {"title": "\u2018Poverty doesn\u2019t have to be my reality\u2019: I thought I\u2019d have to rely on Social Security. Then I taught myself how to invest.", "full_content": "Skip to navigation Skip to main content Skip to right column \u2018Poverty doesn\u2019t have to be my reality\u2019: I thought I\u2019d have to rely on Social Security. Then I taught myself how to invest. Quentin Fottrell Sat, September 5, 2026 at 9:01 AM EDT 6 min read Dear Quentin, I'm a chef who is in the process of switching careers. I plan to pursue the Enrolled Agent credential. I'm also an avid investor. About four years ago, I started studying everything I could about investing and personal finance. I also encouraged my sister to do the same.\n\nFor most of my life, I had no idea that building wealth and having a positive net worth was something I could realistically achieve. I genuinely thought I was destined to depend almost entirely on Social Security in retirement. Now I know that poverty doesn't have to be my reality.\n\nBloom Energy was just named to the S&P 500. These other stocks are joining the index as well.\n\n'It's not fair': My twin brother and I were left houses by our parents. Can I make him pay his share for taxes and upkeep?\n\nAdobe just announced its next CEO. Here's why its stock is dropping.\n\nI've also built an emergency fund. It's relatively small in dollar terms, but it covers about six months of my monthly expenses, which gives me some peace of mind. I'm incredibly glad I decided to educate myself financially, and even happier that I decided to go back to school.\n\nThe funny thing is that I didn't know what I didn't know. It wasn't until I got myself into some serious debt that I finally became willing to learn about personal finance. I was never taught anything about stocks, bonds, index funds \u2014 or investing in general.\n\nI only knew about a basic savings account; I didn't even know high-yield savings accounts existed. Because of that, it always baffled me how some people managed to retire with significant wealth. I simply couldn't understand how they did it.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:31 PM IST", "pub_date_relative": "30m ago"}, {"title": "Replenish Nutrients CEO talks major scale-up - ICYMI", "full_content": "Skip to navigation Skip to main content Skip to right column Replenish Nutrients CEO talks major scale-up - ICYMI Proactive Sat, September 5, 2026 at 9:01 AM EDT 2 min read ERTH.CN VVIVF ERTH 7KE.F Replenish Nutrients Holding Corp (CSE:ERTH, OTC:VVIVF, FRA:7KE) earlier this week outlined how its strategic relationship with Spanish River Carbonatite (SRC) could support a significant production scale-up, with CEO Neil Wiens saying the company has reached an operational \"inflection point\".\n\nWiens told Proactive that the relationship initially developed through Replenish Nutrients evaluating Spanish River Carbonatite as an ingredient in its products. He said the material demonstrated strong efficacy when incorporated into the company's blends, leading to discussions about securing greater and more consistent supply.\n\nFollowing due diligence, SRC made a sizable strategic investment in Replenish Nutrients, while SRC CEO Tim Close has become chairman of the company.\n\nClose described SRC's northern Ontario carbonatite resource as a naturally occurring blend containing calcium, potassium, phosphate and magnesium, together with trace and micronutrients and beneficial microbes.\n\nHe said Replenish Nutrients' production capabilities, distribution network and relationships throughout the agricultural supply chain had been important attractions for SRC. Close added that the respective products represented an \"ideal fit\", with benefits from combining SRC's material with Replenish Nutrients' products.\n\nThe partnership comes as Replenish Nutrients ramps up production at several operations. Close said the immediate priority was a \"laser focus on execution\", with the company effectively working on commissioning \"three, four plants all at once\".\n\nA key potential catalyst highlighted during the interview was the planned expansion at Beiseker.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:31 PM IST", "pub_date_relative": "30m ago"}, {"title": "Documents You\u2019ll Need to Get Approved for a Mortgage", "full_content": "Skip to navigation Skip to main content Skip to right column Documents You\u2019ll Need to Get Approved for a Mortgage Christian Drerup Sat, September 5, 2026 at 9:00 AM EDT 5 min read Quick Read Pre-approval signals you likely qualify, but no underwriter has verified your income, debts, or employment, so it is far from a guaranteed loan.\n\nFull underwriting approval verifies income, employment, credit, and assets, but can still carry conditions that must be resolved before closing.\n\nEven after full approval, taking on new debt, switching jobs, or a failed appraisal can derail your mortgage before closing day.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now. The report is free. Enter your email and see if any of your stocks made the cut.\n\nGetting approved for a mortgage is one of the first major steps in the home-buying process. But it's not always so easy and usually comes with a lot of paperwork. Lenders need to know you are a reliable borrower. They want to review your finances to make sure you can comfortably afford the loan. This means you need to provide documented proof of your income, employment history, savings, and existing debt. Having these documents ready ahead of time can make the mortgage process faster and more manageable. While every lender will have slightly different requirements, these are the most common documents a lender will ask for.\n\nFor obvious reasons, lenders want to see that you have a steady source of income. They also want to know you have a reliable work history, though employment-history requirements depend on the situation and income type. Typically, lenders like to see information about your current employer. It's possible they'll want to look at your employment history from the past two years as well.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:30 PM IST", "pub_date_relative": "30m ago"}, {"title": "Fake job recruiters are getting smarter about scamming job seekers. AI is making it even worse.", "full_content": "Scammers are spamming job candidates with emails and LinkedIn messages with offers that are too good to be true.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Sep 2026, 06:30 PM IST", "pub_date_relative": "31m ago"}, {"title": "Iranian tanker hit near Kharg Island in US attack, Tasnim reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Sep 2026, 06:29 PM IST", "pub_date_relative": "31m ago"}, {"title": "Acquisitive Strategy Offers Long-Term Prospects for QXO Inc. (QXO) Despite Dilution and Integration Risks", "full_content": "Skip to navigation Skip to main content Skip to right column Acquisitive Strategy Offers Long-Term Prospects for QXO Inc. (QXO) Despite Dilution and Integration Risks Muhammad Ali Khalid Sat, September 5, 2026 at 8:59 AM EDT 4 min read QXO On July 1, QXO Inc. (NYSE:QXO) finalized its cash-and-stock acquisition of TopBuild Corp. for a $17 billion consideration. This makes QXO North America's largest distributor and installer of insulation, the largest distributor of waterproofing products, and the second-largest distributor of roofing products.. Chairman and CEO, Brad Jacobs, noted that the acquisition will enable QXO to explore rapidly expanding end markets such as data centers and broaden its product portfolio. Let's explore QXO's acquisitive growth strategy within the building products distribution segment and what potential does it offer to the company going forward.\n\nQXO's acquisition of TopBuild is anticipated to be a highly accretive deal, with the company expecting at least $300 million of annual synergies by 2030. These will be linked with pricing, procurement, and cross-selling opportunities. Along with previous transactions involving $2.25 billion purchase of Kodiak Building Partners back in April and $11 billion acquisition of Beacon Roofing Supply in 2025, it makes QXO one of the top names across roofing, insulation, waterproofing, and building materials categories within North America.\n\nThe company's financials also appear encouraging. On August 13, QXO announced its second quarter results. The company posted $3.25 billion in revenue compared to $1.91 billion during Q2 2025. Adjusted EBITDA clocked in at $272 million, exhibiting 33% year-on-year growth. Adjusted net income came in at $130 million, up by more than 19% relative to the same period last year. The comparison, however, is influenced by acquisition timing.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:29 PM IST", "pub_date_relative": "32m ago"}, {"title": "Why UiPath Rallied in August", "full_content": "Skip to navigation Skip to main content Skip to right column Why UiPath Rallied in August Billy Duberstein, The Motley Fool Sat, September 5, 2026 at 8:57 AM EDT 4 min read PATH NVDA Shares of enterprise automation software company UiPath (NYSE: PATH) rallied 46.3% in August, according to data from S&P Global Market Intelligence .\n\nUiPath didn't provide any specific financial news last month, as it just reported fiscal second-quarter earnings on Thursday.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nHowever, there were a few bullish data points for the enterprise software space during August, as Wall Street analysts grew more optimistic on the sector following the first half's \" SaaS -pocalypse.\" Earnings results from UiPath's peers also indicated resilience amid the disruption concerns that dominated the first half. With a very cheap valuation heading into August, UiPath had a strong month.\n\nIn August, the software sector received some encouragement from the analyst community after a terrible first half. In the first half of 2026, the enterprise software space was hit by fears of disruption, as Anthropic's Claude code and other agentic software offerings raised concerns that companies might be able to \"vibe code\" their own software rather than purchasing from others.\n\nHowever, as the second-quarter earnings season commenced, software companies began reporting resilient growth numbers. In the middle of the month, sell-side analysts at RBC Capital raised their price targets on several software stocks, including UiPath.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:27 PM IST", "pub_date_relative": "34m ago"}, {"title": "History Says That Bitcoin Is an Unbelievable Bargain Right Now", "full_content": "Skip to navigation Skip to main content Skip to right column History Says That Bitcoin Is an Unbelievable Bargain Right Now Alex Carchidi, The Motley Fool Sat, September 5, 2026 at 8:50 AM EDT 4 min read BTC-USD NVDA On the basis of its price right now relative to where it was at the same point in its prior four-year market cycles, Bitcoin (CRYPTO: BTC) looks pretty cheap, with a price of $77,155 as of Sept. 1, 38% below its last all-time high near $126,080, which was set in October 2025.\n\nOf course, Bitcoin \"cycle theory\" isn't an empirically proven law, but it can be a useful framework for understanding the coin's behavior relative to past periods. If we take that caveat in stride, there's reason to believe decent returns await those who buy it now, so let's examine the case for it being priced at a bargain.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nBitcoin miners are businesses that lend their computing power to the network to produce new coins by essentially burning electricity on difficult calculations.\n\nWhen the coin's price drops below its production cost, such as during a bear market, the least efficient miners have to capitulate and shut down their rigs to stop operating at a loss, and the network's total computing power, called the hash rate, declines. If the hash rate declines by too much, it takes longer for each new block to be mined, which triggers an automatic downward adjustment to the protocol's mining difficulty.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:20 PM IST", "pub_date_relative": "41m ago"}, {"title": "Abel: Two ways Berkshire hopes to cash in on AI", "full_content": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\n\nBerkshire Hathaway CEO Greg Abel told CNBC the company is pursuing artificial intelligence opportunities on two paths.\n\nIn a live \"Squawk Box\" interview Wednesday morning , Abel said he sees providing energy to the growing number of AI data centers as a \"significant opportunity for Berkshire and Berkshire Hathaway Energy\" since he's long believed the biggest constraint for the buildout is having enough energy to operate the power-hungry facilities.\n\nBut, he said, the company will only sell energy to hyperscalers if there is \"no impact to the rates of our other customers.\"\n\nThe other avenue is Berkshire's now almost $36 billion investment in shares of Google parent Alphabet that was initiated by Warren Buffett last year.\n\nAbel said from the experience of Berkshire's own operating companies, he and Buffett knew AI was \"going to have a significant impact on America and businesses,\" and \" we saw Google as a significant player .\"\n\nAbel did the interview from Japan, where he was visiting a Berkshire tool-making unit and meeting with executives of the \"trading houses\" in which Berkshire has significant equity stakes.\n\nHe said none of them mentioned rising Japanese interest rates as a \"fundamental challenge right now.\"", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 06:15 PM IST", "pub_date_relative": "45m ago"}, {"title": "Iranian tanker hit by US attack near Iran's Kharg Island, Tasnim says", "full_content": "An Iranian tanker was hit by U.S. forces on Saturday near Iran's key oil export hub, Kharg Island, in the Gulf, the semi-official Iranian news agency Tasnim reported.\n\nAccording to a Tasnim correspondent from Kharg, the tanker was hit by four U.S. missiles in the area of Kharg Island's anchorage.\n\nTasnim quoted local sources as saying there were no casualties and the tanker's crew was being evacuated.\n\nThere was no immediate official announcement by Iranian authorities and U.S. Central Command did not immediately respond to a request for comment.\n\nU.S. President Donald Trump \u200bsaid on Aug. 31 in a one-line social media post accompanied by an AI-generated video that Kharg Island was being \"blown to smithereens.\" Iranian authorities have vowed a strong response if Kharg is attacked.\n\nIran is the third-largest producer in the Organization of the Petroleum Exporting \u200cCountries and exported 90% of its crude via Kharg Island before the war, but flows have been disrupted since a U.S. blockade of Iranian oil exports began in mid-April.\n\nTrump said on June 11 that he wanted to take over Kharg Island, but then said a threatened U.S. \u200bmilitary operation there was off the table for now, days before Tehran and Washington signed an interim agreement aimed at ending the war on June 17.\n\nA U.S. attack on Kharg would \u200bheap further pressure on Iran's oil industry and its wider economy, which is already reeling from the U.S. naval blockade.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 06:15 PM IST", "pub_date_relative": "46m ago"}, {"title": "\u2018Wow, wow, wow!\u2019: CNBC host clearly shocked after US economy adds 162,000 jobs \u2014 3X expectations. Bet on America now", "full_content": "Skip to navigation Skip to main content Skip to right column \u2018Wow, wow, wow!\u2019: CNBC host clearly shocked after US economy adds 162,000 jobs \u2014 3X expectations. Bet on America now Jing Pan Sat, September 5, 2026 at 8:45 AM EDT 8 min read Moneywise and Yahoo Finance LLC may earn commission or revenue through links in the content below.\n\nCNBC's Rick Santelli has analyzed countless economic releases during his decades at the network. But the veteran market commentator could barely contain his surprise when the latest U.S. jobs numbers crossed the screen.\n\n\"Hold on to your seats, folks,\" Santelli said (1) during CNBC's live coverage on the morning of Sept. 4. \"Nonfarm payrolls for the month of August: up 162,000. That's basically three times what expectations are.\"\n\nThe official numbers confirmed the magnitude of the surprise. The U.S. economy added 162,000 nonfarm payroll jobs in August, according to the U.S. Bureau of Labor Statistics (2) \u2014 more than three times the 53,000 jobs economists had expected (3).\n\nJeff Bezos backs a platform that lets anyone invest in rental homes for as little as $100 \u2014 6 ways to build wealth like a landlord without actually being one\n\nJPMorgan sees gold hitting $5,000/oz by Q4 \u2014 and savvy investors are protecting their wealth with a tax-advantaged Gold IRA. Get your free guide from Priority Gold\n\nThe tax breaks in Trump's 'big beautiful bill' expire after 2028. Here are 4 moves to make before the window closes\n\nThe government revised June's gain upward from 20,000 to 31,000 jobs, while July's initially reported loss of 23,000 was transformed into a gain of 21,000. Together, the revisions made employment growth in those two months stronger than previously reported by 55,000 jobs.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:15 PM IST", "pub_date_relative": "46m ago"}, {"title": "Expansion of Commercial Operations in Focus for BWX Technologies (BWXT)", "full_content": "Skip to navigation Skip to main content Skip to right column Expansion of Commercial Operations in Focus for BWX Technologies (BWXT) Muhammad Ali Khalid Sat, September 5, 2026 at 8:44 AM EDT 5 min read BWXT On August 27, David Strauss from Wells Fargo upgraded BWX Technologies Inc. (NYSE:BWXT) from an Underweight to Equal Weight rating. In the process, the analyst cut down his target price from $200 to $170, which equates to an adjusted upside potential of 11.63% as of August 31 closing.\n\nStrauss looks forward to the company's upcoming investor day in late September. He expects it to provide support to the stock, as the long-term growth forecast to be shared by the management is projected to be in line with the broader consensus estimates. The analyst also highlighted the company's various commercial initiatives that could lead to further upside, once they start materializing.\n\nAs of the August 31 close, the stock was down 11.89% from its December 31, 2025 closing price. Following Wells Fargo's rating upgrade, let's shed some more light on some underlying growth drivers and risks for BWX Technologies.\n\nBWX Technologies Inc. (NYSE:BWXT) has its core focus on nuclear components and reactors. Its diverse customer base includes the U.S Navy, Department of Energy, and Commercial customers, which ensures recurring, high-visibility revenue streams for the business.\n\nThe company reported topline figure of $901.6 million for Q2 2026, compared to 764 million during the same period last year. Revenue from government operations contributed $601.3 million to the topline. The second quarter adjusted EPS stood at $1.07 compared to $1.02 in Q2 2025. The company also registered almost a 40% jump in its backlog relative to last year, which currently sits at around $8.4 billion.\n\nManagement increased its full-year revenue guidance from $3.75 billion to $3.8 billion. Moreover, the adjusted EPS guidance was also raised from the previous $4.60-$4.75 range to $4.70-$4.80.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:14 PM IST", "pub_date_relative": "46m ago"}, {"title": "An $860,000 Portfolio That Quietly Pays You $5,100 a Month Without Touching Principal", "full_content": "Skip to navigation Skip to main content Skip to right column An $860,000 Portfolio That Quietly Pays You $5,100 a Month Without Touching Principal David Beren Sat, September 5, 2026 at 8:43 AM EDT 6 min read NNN BTI OBDC Quick Read OBDC cut its quarterly dividend from $0.37 to $0.31 as falling rates squeezed floating-rate loan income, making the 7% headline yield harder to trust.\n\nNNN REIT extended its dividend growth streak to 37 consecutive years, while BTI dividends may qualify for the lower U.S.-UK tax treaty rate.\n\nOBDC dropped ~10% over the past year and its NAV slipped to $14.26, proving that collecting dividends without selling shares doesn't protect principal.\n\nRead More: Avoid these 13 retirement mistakes before they derail your future (sponsor)\n\nThe pitch behind an $860,000 portfolio paying $5,100 a month is a blended yield of roughly 7%. That is achievable today with three well-known income names in the right mix, but the word quietly in the headline does a lot of work. One of the three holdings just cut its base distribution, another trades at a share price that is down double digits over the past year, and the tax treatment across the sleeve varies enough to change what actually lands in your account. Here is the real version.\n\nA single portfolio, not a tiered menu: about 35% in Blue Owl Capital ( NYSE:OBDC ), 30% in NNN REIT ( NYSE:NNN ), and 35% in British American Tobacco ( NYSE:BTI ). The three cover different engines: middle-market direct lending, U.S. net-lease real estate, and international consumer staples with a nicotine transformation story.\n\nAt current prices, NNN shares are around $45 with a forward annualized dividend of $2.48, BTI shares are around $55 with an annualized dividend of roughly $3.34, and OBDC shares are around $11. The math on the OBDC piece is where this gets interesting.\n\nOne investment mistake could create big risks for your retirement.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:13 PM IST", "pub_date_relative": "48m ago"}, {"title": "American Farmers Sell Into Long-Hoped-for Crop Price Rally", "full_content": "(Bloomberg) -- Punishing temperatures swept across the US Midwest this week, prompting another round of heat advisories after weeks of sizzling weather. For America\u2019s farmers, the sweltering conditions are bringing something they\u2019ve been waiting years for: higher crop prices.\n\nThe heat\u2019s threat to yields helped corn futures jump about 15% since the end of July, sending prices above the critical $5-a-bushel threshold to reach the highest levels since 2023. Those gains ripple through the farm economy, underpinning higher bids at grain terminals and elevators while also allowing growers to use futures contracts to hedge their risks.\n\nFarmers like Iowa\u2019s Dave Walton see the rally as a game changer.\n\n\u201cWe\u2019ve been fairly aggressive selling into this rally, and so we\u2019re looking at black ink all the way across the board,\u201d Walton said in an interview, speaking about profitable conditions on his farm. \u201cIf I would have sold even six weeks ago, we\u2019d still have been in the red on some of it.\u201d\n\nHigher grain prices have raised hopes that an elusive rebound in the American farm economy is finally taking hold. Fresh data from the US Department of Agriculture show that farmers\u2019 cash receipts from crops are projected to climb 6.1% year-over-year in 2026. And investors are wagering on a continued rally, with the net-bullish holding in corn futures reaching the highest on record, data issued Friday show.\n\nBut after years of depressed prices and rising costs, growers still want to see more evidence of sustained improvement before they start making big investments.\n\nAt this week\u2019s Farm Progress Show in Iowa, Walton perused CNH Industrial NV\u2019s New Holland brand\u2019s latest tractors and crop sprayers as he searched for ways to improve his operation producing soybeans, corn and wheat. Timely rains in eastern Iowa have him expecting a \u201cpretty good bean crop\u201d and an average to below-average corn harvest.", "source": "LiveMint Markets", "pub_date_str": "05 Sep 2026, 06:12 PM IST", "pub_date_relative": "48m ago"}, {"title": "Dollar General (DG) or Dollar Tree (DLTR): Which Stock Is Better?", "full_content": "Skip to navigation Skip to main content Skip to right column Dollar General (DG) or Dollar Tree (DLTR): Which Stock Is Better? Ali Ahmed Sat, September 5, 2026 at 8:42 AM EDT 5 min read DG DLTR Dollar Tree, Inc. (NASDAQ:DLTR) and Dollar General Corporation (NYSE:DG) both reported quarterly results above sales expectations as lower-priced essentials continued to drive consumers to their stores amid economic uncertainty. Both retailers also benefited from tariff refunds, which helped support their higher full-year profit targets.\n\nDollar General Corporation (NYSE:DG) saw a 3.5% year-over-year increase in quarterly same-store sales, supported by growth across categories like seasonal, home products, and apparel. The company lifted its fiscal 2026 same-store sales growth forecast from its earlier range of 2.2% to 2.7% to 2.5% to 2.9%.\n\nDollar General Corporation (NYSE:DG) now expects fiscal 2026 earnings per share of about $7.80 to $8.00. This includes a benefit of about 25 cents from tariff refunds after related reinvestments. Dollar Tree, Inc. (NASDAQ:DLTR) also raised its full-year earnings forecast to $7.70 to $8.05 per share, which includes a benefit of about 60 cents from tariff refunds.\n\nIt is not difficult to argue that the latest results point to improving momentum at both discount retailers. Dollar General Corporation (NYSE:DG) delivered its seventh consecutive earnings beat, with earnings per share coming in 11% above analysts' expectations. Even after excluding the 25-cent net benefit from tariff refunds, the company's earnings were up approximately 20% year-over-year.\n\nDollar General Corporation (NYSE:DG) experienced growth across all four of its product categories, with non-consumables performing better than consumables. Traffic increased 2% during the quarter, while the company also reported continued improvement in shrink and damages despite increasingly difficult comparisons. The company raised the midpoint of all its key fiscal 2026 guidance metrics.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:12 PM IST", "pub_date_relative": "49m ago"}, {"title": "Palantir Jumped 7.7% on an Expanded PwC Alliance as Globant Launched a Salesforce AI Pod. Which Services Model Scales Better?", "full_content": "Skip to navigation Skip to main content Skip to right column Palantir Jumped 7.7% on an Expanded PwC Alliance as Globant Launched a Salesforce AI Pod. Which Services Model Scales Better? Habib Ur Rehman Sat, September 5, 2026 at 8:38 AM EDT 3 min read PLTR GLOB CRM Palantir shares gained 7.7% on September 3, the same day PwC US expanded an alliance built around enterprise AI, M&A, and ERP modernization. The companies described an AI-native deals platform intended to execute transactions up to 50% faster and cut one-time costs by as much as 45%, but disclosed no new contract value. The same day, Globant introduced a MuleSoft AI Pod for Salesforce integration. Palantir Technologies Inc. (NASDAQ: PLTR ) and Globant S.A. (NYSE: GLOB ) are packaging expertise around software in very different ways.\n\nPalantir's bull case is productized delivery. PwC can bring industry relationships and implementation capacity, while Foundry and AIP remain the recurring platform. Palantir's Q2 revenue rose 93% to $1.94 billion, including 149% growth in U.S. commercial revenue, so the alliance lands on real momentum. Arrowstreet Capital held 20,517,115 shares at June 30 after increasing its stake by 97%.\n\nThe valuation is the obvious counterweight. A partnership announcement without disclosed revenue cannot by itself justify a large daily move. Receivables concentration, stock-based compensation, and competition from clouds and consultants deserve attention. Hedge-fund breadth had already weakened: Insider Monkey counted 86 funds holding Palantir at June 30, down from 96 at March 31.\n\nGlobant's AI Pod offers a more explicit delivery unit. Configurations support roughly six, 12, or 24 integration flows or APIs per month, and the company cited benchmarks including up to 80% automation and 15% to 25% faster time to value. That makes capacity tangible. Twenty-three hedge funds held Globant S.A. (NYSE:GLOB) in Q2, down from 25 in Q1.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:08 PM IST", "pub_date_relative": "52m ago"}, {"title": "Putin orders a 72-hour pause in strikes on Kyiv as U.S. envoys Witkoff and Kushner visit Russia and Ukraine", "full_content": "Russian President Vladimir Putin ordered a 72-hour pause in strikes on Kyiv, the Kremlin said Saturday, as U.S. envoys Steve Witkoff and Jared Kushner arrived in Moscow to try to revive a stalled push to end Russia's full-scale invasion of Ukraine.\n\n\"Putin has ordered that no strikes be carried out against Kyiv for three days, starting at midnight today,\" presidential spokesperson Dmitry Peskov told Russia's Tass news agency. He said the decision was tied to preparations for Witkoff and Kushner's planned visit to the Ukrainian capital, which Kyiv has said will take place on Sunday.\n\nThe envoys' trip comes as both sides escalate aerial attacks, some 4 1/2-years after the Kremlin's invasion of its neighbor. Ukrainian President Volodymyr Zelenskyy said Friday that Ukraine would halt airstrikes during the envoys' visit and urged Moscow to do the same.\n\nWashington's push to end the fighting, now in its fifth year, has lost momentum as U.S. attention has been focused for the last six months on its war with Iran. The last known visit to Moscow by Witkoff and Kushner, U.S. President Donald Trump's son-in-law, was in January, when they met Putin in the Kremlin. The envoys had never visited Kyiv before.\n\nThe envoys were met at the airport by Russian envoy Kirill Dmitriev, Tass reported. Dmitriev shared photos of him meeting the U.S.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 06:06 PM IST", "pub_date_relative": "54m ago"}, {"title": "Schwab U.S. Dividend Equity vs. Vanguard Dividend Appreciation: Which ETF Looks Better for Your Portfolio?", "full_content": "Skip to navigation Skip to main content Skip to right column Schwab U.S. Dividend Equity vs. Vanguard Dividend Appreciation: Which ETF Looks Better for Your Portfolio? Erin Kennedy, The Motley Fool Sat, September 5, 2026 at 8:35 AM EDT 4 min read VIG ^GSPC The Schwab U.S. Dividend Equity ETF (NYSEMKT:SCHD) offers a higher current yield and deeper value tilt, whereas the Vanguard Dividend Appreciation ETF (NYSEMKT:VIG) focuses on consistent dividend growth and tech-heavy quality.\n\nBoth funds target dividend-paying companies, but their underlying methodologies lead to distinct portfolio profiles. The Schwab fund screens for sustainable high yields and fundamental financial strength, while the Vanguard fund strictly requires a 10-year track record of annual dividend increases. This difference creates a more conservative, tech-forward tilt for the Vanguard fund versus the value focus of its peer.\n\nBeta measures price volatility relative to the S&P 500; beta is calculated from monthly returns over the available fund history (up to five years). The 1-year return represents total return over the trailing 12 months. Dividend yield is the trailing-12-month distribution yield.\n\nBoth funds offer extremely affordable expense ratios. The primary differentiator for many income investors is the significant yield difference, with the Schwab fund nearly doubling the payout of its Vanguard peer.\n\nThe Schwab U.S. Dividend Equity ETF aims to track the overall performance of the Dow Jones U.S. Dividend 100 Index, which filters for companies with high yields and consistent payment histories. This investment strategy results in a portfolio of 102 holdings that concentrates on healthcare at 21%, consumer defensive at 20%, and energy at 15%. Its largest positions include Merck (NYSE:MRK) at 4.92%, Abbott Laboratories (NYSE:ABT) at 4.83%, and Amgen (NASDAQ:AMGN) at 4.8%.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:05 PM IST", "pub_date_relative": "56m ago"}], "cfa": [{"title": "Bloom Energy, Illumina, Everpure Rise On S&P 500 Inclusion", "full_content": "BREAKING: Stocks Narrowly Mixed For Week; Sandisk Leads Memory Higher\n\nStore Subscribe Sign In My Subscriptions Founder's Club SwingTrader Leaderboard MarketSurge eIBD IBD Digital IBD Live Customer Center My Stock Lists Email Preferences Help & Support Sign Out Market Trend Stock Lists Research News Videos Learn Store Search stocks or keywords Sections My IBD Market Trend MARKET TREND The Big Picture Stock Market Today ETF Market Strategy Stock Market Data Psychological Indicators New? Start Here IBD Digital: 2 Months for $20 Stock Lists STOCK LISTS IBD 50 IBD Sector Leaders IBD Big Cap 20 IBD Long-Term Leaders IPO Leaders My Stock Lists Stock Lists Update Stocks On The Move New Highs Stock Spotlight Stocks Near Buy Zone RS Line At New High Rising Profit Estimates Stocks Funds Are Buying Your Weekly Review Breakout Stocks Index IBD ETF Indexes IBD Data Tables IBD Digital: 2 Months for $20 New? Start Here Research STOCK RESEARCH IBD Stock Checkup Stock Of The Day Screen Of The Day IBD Charts Stock Screener Swing Trading Options Investing Action Plan Earnings Preview Earnings Calendar IBD Industry Themes The New America Best ETFs Best Mutual Funds The Income Investor IBD Stock Analysis Industry Snapshot IBD 50 Stocks To Watch IBD Data Stories IBD Digital: 2 Months for $20 News NEWS eIBD Technology Magnificent Seven Stocks Personal Finance Special Reports Cryptocurrency Retirement Management ECONOMY Economic Calendar Economic News IBD Digital: 2 Months for $20 Videos VIDEOS & PODCASTS IBD Live How To Invest Videos Options Videos Investing With IBD Podcast Growth Stories Podcast Webinars Online Courses IBD Digital: 2 Months for $20 Learn HOW TO INVEST How To Invest In Stocks Stock Investing Keys Stock Market Timing Track Market Trends How To Read Stock Charts How To Buy Stocks When To Sell Stocks Short Selling Swing Trading What Is Crypto EDUCATIONAL RESOURCES New to IBD Investor's Corner Investing With IBD Podcast Events & Webinars IBD Moneyworks 12 Days Of Learning In.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:31 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018Poverty doesn\u2019t have to be my reality\u2019: I thought I\u2019d have to rely on Social Security. Then I taught myself how to invest.", "full_content": "Skip to navigation Skip to main content Skip to right column \u2018Poverty doesn\u2019t have to be my reality\u2019: I thought I\u2019d have to rely on Social Security. Then I taught myself how to invest. Quentin Fottrell Sat, September 5, 2026 at 9:01 AM EDT 6 min read Dear Quentin, I'm a chef who is in the process of switching careers. I plan to pursue the Enrolled Agent credential. I'm also an avid investor. About four years ago, I started studying everything I could about investing and personal finance. I also encouraged my sister to do the same.\n\nFor most of my life, I had no idea that building wealth and having a positive net worth was something I could realistically achieve. I genuinely thought I was destined to depend almost entirely on Social Security in retirement. Now I know that poverty doesn't have to be my reality.\n\nBloom Energy was just named to the S&P 500. These other stocks are joining the index as well.\n\n'It's not fair': My twin brother and I were left houses by our parents. Can I make him pay his share for taxes and upkeep?\n\nAdobe just announced its next CEO. Here's why its stock is dropping.\n\nI've also built an emergency fund. It's relatively small in dollar terms, but it covers about six months of my monthly expenses, which gives me some peace of mind. I'm incredibly glad I decided to educate myself financially, and even happier that I decided to go back to school.\n\nThe funny thing is that I didn't know what I didn't know. It wasn't until I got myself into some serious debt that I finally became willing to learn about personal finance. I was never taught anything about stocks, bonds, index funds \u2014 or investing in general.\n\nI only knew about a basic savings account; I didn't even know high-yield savings accounts existed. Because of that, it always baffled me how some people managed to retire with significant wealth. I simply couldn't understand how they did it.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:31 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Documents You\u2019ll Need to Get Approved for a Mortgage", "full_content": "Skip to navigation Skip to main content Skip to right column Documents You\u2019ll Need to Get Approved for a Mortgage Christian Drerup Sat, September 5, 2026 at 9:00 AM EDT 5 min read Quick Read Pre-approval signals you likely qualify, but no underwriter has verified your income, debts, or employment, so it is far from a guaranteed loan.\n\nFull underwriting approval verifies income, employment, credit, and assets, but can still carry conditions that must be resolved before closing.\n\nEven after full approval, taking on new debt, switching jobs, or a failed appraisal can derail your mortgage before closing day.\n\nJust released. Our analysts combed the entire stock market and named the ten best stocks to buy right now. The report is free. Enter your email and see if any of your stocks made the cut.\n\nGetting approved for a mortgage is one of the first major steps in the home-buying process. But it's not always so easy and usually comes with a lot of paperwork. Lenders need to know you are a reliable borrower. They want to review your finances to make sure you can comfortably afford the loan. This means you need to provide documented proof of your income, employment history, savings, and existing debt. Having these documents ready ahead of time can make the mortgage process faster and more manageable. While every lender will have slightly different requirements, these are the most common documents a lender will ask for.\n\nFor obvious reasons, lenders want to see that you have a steady source of income. They also want to know you have a reliable work history, though employment-history requirements depend on the situation and income type. Typically, lenders like to see information about your current employer. It's possible they'll want to look at your employment history from the past two years as well.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:30 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Acquisitive Strategy Offers Long-Term Prospects for QXO Inc. (QXO) Despite Dilution and Integration Risks", "full_content": "Skip to navigation Skip to main content Skip to right column Acquisitive Strategy Offers Long-Term Prospects for QXO Inc. (QXO) Despite Dilution and Integration Risks Muhammad Ali Khalid Sat, September 5, 2026 at 8:59 AM EDT 4 min read QXO On July 1, QXO Inc. (NYSE:QXO) finalized its cash-and-stock acquisition of TopBuild Corp. for a $17 billion consideration. This makes QXO North America's largest distributor and installer of insulation, the largest distributor of waterproofing products, and the second-largest distributor of roofing products.. Chairman and CEO, Brad Jacobs, noted that the acquisition will enable QXO to explore rapidly expanding end markets such as data centers and broaden its product portfolio. Let's explore QXO's acquisitive growth strategy within the building products distribution segment and what potential does it offer to the company going forward.\n\nQXO's acquisition of TopBuild is anticipated to be a highly accretive deal, with the company expecting at least $300 million of annual synergies by 2030. These will be linked with pricing, procurement, and cross-selling opportunities. Along with previous transactions involving $2.25 billion purchase of Kodiak Building Partners back in April and $11 billion acquisition of Beacon Roofing Supply in 2025, it makes QXO one of the top names across roofing, insulation, waterproofing, and building materials categories within North America.\n\nThe company's financials also appear encouraging. On August 13, QXO announced its second quarter results. The company posted $3.25 billion in revenue compared to $1.91 billion during Q2 2025. Adjusted EBITDA clocked in at $272 million, exhibiting 33% year-on-year growth. Adjusted net income came in at $130 million, up by more than 19% relative to the same period last year. The comparison, however, is influenced by acquisition timing.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:29 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why UiPath Rallied in August", "full_content": "Skip to navigation Skip to main content Skip to right column Why UiPath Rallied in August Billy Duberstein, The Motley Fool Sat, September 5, 2026 at 8:57 AM EDT 4 min read PATH NVDA Shares of enterprise automation software company UiPath (NYSE: PATH) rallied 46.3% in August, according to data from S&P Global Market Intelligence .\n\nUiPath didn't provide any specific financial news last month, as it just reported fiscal second-quarter earnings on Thursday.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nHowever, there were a few bullish data points for the enterprise software space during August, as Wall Street analysts grew more optimistic on the sector following the first half's \" SaaS -pocalypse.\" Earnings results from UiPath's peers also indicated resilience amid the disruption concerns that dominated the first half. With a very cheap valuation heading into August, UiPath had a strong month.\n\nIn August, the software sector received some encouragement from the analyst community after a terrible first half. In the first half of 2026, the enterprise software space was hit by fears of disruption, as Anthropic's Claude code and other agentic software offerings raised concerns that companies might be able to \"vibe code\" their own software rather than purchasing from others.\n\nHowever, as the second-quarter earnings season commenced, software companies began reporting resilient growth numbers. In the middle of the month, sell-side analysts at RBC Capital raised their price targets on several software stocks, including UiPath.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:27 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "History Says That Bitcoin Is an Unbelievable Bargain Right Now", "full_content": "Skip to navigation Skip to main content Skip to right column History Says That Bitcoin Is an Unbelievable Bargain Right Now Alex Carchidi, The Motley Fool Sat, September 5, 2026 at 8:50 AM EDT 4 min read BTC-USD NVDA On the basis of its price right now relative to where it was at the same point in its prior four-year market cycles, Bitcoin (CRYPTO: BTC) looks pretty cheap, with a price of $77,155 as of Sept. 1, 38% below its last all-time high near $126,080, which was set in October 2025.\n\nOf course, Bitcoin \"cycle theory\" isn't an empirically proven law, but it can be a useful framework for understanding the coin's behavior relative to past periods. If we take that caveat in stride, there's reason to believe decent returns await those who buy it now, so let's examine the case for it being priced at a bargain.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nBitcoin miners are businesses that lend their computing power to the network to produce new coins by essentially burning electricity on difficult calculations.\n\nWhen the coin's price drops below its production cost, such as during a bear market, the least efficient miners have to capitulate and shut down their rigs to stop operating at a loss, and the network's total computing power, called the hash rate, declines. If the hash rate declines by too much, it takes longer for each new block to be mined, which triggers an automatic downward adjustment to the protocol's mining difficulty.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:20 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Iranian tanker hit by US attack near Iran's Kharg Island, Tasnim says", "full_content": "An Iranian tanker was hit by U.S. forces on Saturday near Iran's key oil export hub, Kharg Island, in the Gulf, the semi-official Iranian news agency Tasnim reported.\n\nAccording to a Tasnim correspondent from Kharg, the tanker was hit by four U.S. missiles in the area of Kharg Island's anchorage.\n\nTasnim quoted local sources as saying there were no casualties and the tanker's crew was being evacuated.\n\nThere was no immediate official announcement by Iranian authorities and U.S. Central Command did not immediately respond to a request for comment.\n\nU.S. President Donald Trump \u200bsaid on Aug. 31 in a one-line social media post accompanied by an AI-generated video that Kharg Island was being \"blown to smithereens.\" Iranian authorities have vowed a strong response if Kharg is attacked.\n\nIran is the third-largest producer in the Organization of the Petroleum Exporting \u200cCountries and exported 90% of its crude via Kharg Island before the war, but flows have been disrupted since a U.S. blockade of Iranian oil exports began in mid-April.\n\nTrump said on June 11 that he wanted to take over Kharg Island, but then said a threatened U.S. \u200bmilitary operation there was off the table for now, days before Tehran and Washington signed an interim agreement aimed at ending the war on June 17.\n\nA U.S. attack on Kharg would \u200bheap further pressure on Iran's oil industry and its wider economy, which is already reeling from the U.S. naval blockade.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 06:15 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018Wow, wow, wow!\u2019: CNBC host clearly shocked after US economy adds 162,000 jobs \u2014 3X expectations. Bet on America now", "full_content": "Skip to navigation Skip to main content Skip to right column \u2018Wow, wow, wow!\u2019: CNBC host clearly shocked after US economy adds 162,000 jobs \u2014 3X expectations. Bet on America now Jing Pan Sat, September 5, 2026 at 8:45 AM EDT 8 min read Moneywise and Yahoo Finance LLC may earn commission or revenue through links in the content below.\n\nCNBC's Rick Santelli has analyzed countless economic releases during his decades at the network. But the veteran market commentator could barely contain his surprise when the latest U.S. jobs numbers crossed the screen.\n\n\"Hold on to your seats, folks,\" Santelli said (1) during CNBC's live coverage on the morning of Sept. 4. \"Nonfarm payrolls for the month of August: up 162,000. That's basically three times what expectations are.\"\n\nThe official numbers confirmed the magnitude of the surprise. The U.S. economy added 162,000 nonfarm payroll jobs in August, according to the U.S. Bureau of Labor Statistics (2) \u2014 more than three times the 53,000 jobs economists had expected (3).\n\nJeff Bezos backs a platform that lets anyone invest in rental homes for as little as $100 \u2014 6 ways to build wealth like a landlord without actually being one\n\nJPMorgan sees gold hitting $5,000/oz by Q4 \u2014 and savvy investors are protecting their wealth with a tax-advantaged Gold IRA. Get your free guide from Priority Gold\n\nThe tax breaks in Trump's 'big beautiful bill' expire after 2028. Here are 4 moves to make before the window closes\n\nThe government revised June's gain upward from 20,000 to 31,000 jobs, while July's initially reported loss of 23,000 was transformed into a gain of 21,000. Together, the revisions made employment growth in those two months stronger than previously reported by 55,000 jobs.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:15 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Expansion of Commercial Operations in Focus for BWX Technologies (BWXT)", "full_content": "Skip to navigation Skip to main content Skip to right column Expansion of Commercial Operations in Focus for BWX Technologies (BWXT) Muhammad Ali Khalid Sat, September 5, 2026 at 8:44 AM EDT 5 min read BWXT On August 27, David Strauss from Wells Fargo upgraded BWX Technologies Inc. (NYSE:BWXT) from an Underweight to Equal Weight rating. In the process, the analyst cut down his target price from $200 to $170, which equates to an adjusted upside potential of 11.63% as of August 31 closing.\n\nStrauss looks forward to the company's upcoming investor day in late September. He expects it to provide support to the stock, as the long-term growth forecast to be shared by the management is projected to be in line with the broader consensus estimates. The analyst also highlighted the company's various commercial initiatives that could lead to further upside, once they start materializing.\n\nAs of the August 31 close, the stock was down 11.89% from its December 31, 2025 closing price. Following Wells Fargo's rating upgrade, let's shed some more light on some underlying growth drivers and risks for BWX Technologies.\n\nBWX Technologies Inc. (NYSE:BWXT) has its core focus on nuclear components and reactors. Its diverse customer base includes the U.S Navy, Department of Energy, and Commercial customers, which ensures recurring, high-visibility revenue streams for the business.\n\nThe company reported topline figure of $901.6 million for Q2 2026, compared to 764 million during the same period last year. Revenue from government operations contributed $601.3 million to the topline. The second quarter adjusted EPS stood at $1.07 compared to $1.02 in Q2 2025. The company also registered almost a 40% jump in its backlog relative to last year, which currently sits at around $8.4 billion.\n\nManagement increased its full-year revenue guidance from $3.75 billion to $3.8 billion. Moreover, the adjusted EPS guidance was also raised from the previous $4.60-$4.75 range to $4.70-$4.80.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:14 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "An $860,000 Portfolio That Quietly Pays You $5,100 a Month Without Touching Principal", "full_content": "Skip to navigation Skip to main content Skip to right column An $860,000 Portfolio That Quietly Pays You $5,100 a Month Without Touching Principal David Beren Sat, September 5, 2026 at 8:43 AM EDT 6 min read NNN BTI OBDC Quick Read OBDC cut its quarterly dividend from $0.37 to $0.31 as falling rates squeezed floating-rate loan income, making the 7% headline yield harder to trust.\n\nNNN REIT extended its dividend growth streak to 37 consecutive years, while BTI dividends may qualify for the lower U.S.-UK tax treaty rate.\n\nOBDC dropped ~10% over the past year and its NAV slipped to $14.26, proving that collecting dividends without selling shares doesn't protect principal.\n\nRead More: Avoid these 13 retirement mistakes before they derail your future (sponsor)\n\nThe pitch behind an $860,000 portfolio paying $5,100 a month is a blended yield of roughly 7%. That is achievable today with three well-known income names in the right mix, but the word quietly in the headline does a lot of work. One of the three holdings just cut its base distribution, another trades at a share price that is down double digits over the past year, and the tax treatment across the sleeve varies enough to change what actually lands in your account. Here is the real version.\n\nA single portfolio, not a tiered menu: about 35% in Blue Owl Capital ( NYSE:OBDC ), 30% in NNN REIT ( NYSE:NNN ), and 35% in British American Tobacco ( NYSE:BTI ). The three cover different engines: middle-market direct lending, U.S. net-lease real estate, and international consumer staples with a nicotine transformation story.\n\nAt current prices, NNN shares are around $45 with a forward annualized dividend of $2.48, BTI shares are around $55 with an annualized dividend of roughly $3.34, and OBDC shares are around $11. The math on the OBDC piece is where this gets interesting.\n\nOne investment mistake could create big risks for your retirement.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:13 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "American Farmers Sell Into Long-Hoped-for Crop Price Rally", "full_content": "(Bloomberg) -- Punishing temperatures swept across the US Midwest this week, prompting another round of heat advisories after weeks of sizzling weather. For America\u2019s farmers, the sweltering conditions are bringing something they\u2019ve been waiting years for: higher crop prices.\n\nThe heat\u2019s threat to yields helped corn futures jump about 15% since the end of July, sending prices above the critical $5-a-bushel threshold to reach the highest levels since 2023. Those gains ripple through the farm economy, underpinning higher bids at grain terminals and elevators while also allowing growers to use futures contracts to hedge their risks.\n\nFarmers like Iowa\u2019s Dave Walton see the rally as a game changer.\n\n\u201cWe\u2019ve been fairly aggressive selling into this rally, and so we\u2019re looking at black ink all the way across the board,\u201d Walton said in an interview, speaking about profitable conditions on his farm. \u201cIf I would have sold even six weeks ago, we\u2019d still have been in the red on some of it.\u201d\n\nHigher grain prices have raised hopes that an elusive rebound in the American farm economy is finally taking hold. Fresh data from the US Department of Agriculture show that farmers\u2019 cash receipts from crops are projected to climb 6.1% year-over-year in 2026. And investors are wagering on a continued rally, with the net-bullish holding in corn futures reaching the highest on record, data issued Friday show.\n\nBut after years of depressed prices and rising costs, growers still want to see more evidence of sustained improvement before they start making big investments.\n\nAt this week\u2019s Farm Progress Show in Iowa, Walton perused CNH Industrial NV\u2019s New Holland brand\u2019s latest tractors and crop sprayers as he searched for ways to improve his operation producing soybeans, corn and wheat. Timely rains in eastern Iowa have him expecting a \u201cpretty good bean crop\u201d and an average to below-average corn harvest.", "source": "LiveMint Markets", "pub_date_str": "05 Sep 2026, 06:12 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Dollar General (DG) or Dollar Tree (DLTR): Which Stock Is Better?", "full_content": "Skip to navigation Skip to main content Skip to right column Dollar General (DG) or Dollar Tree (DLTR): Which Stock Is Better? Ali Ahmed Sat, September 5, 2026 at 8:42 AM EDT 5 min read DG DLTR Dollar Tree, Inc. (NASDAQ:DLTR) and Dollar General Corporation (NYSE:DG) both reported quarterly results above sales expectations as lower-priced essentials continued to drive consumers to their stores amid economic uncertainty. Both retailers also benefited from tariff refunds, which helped support their higher full-year profit targets.\n\nDollar General Corporation (NYSE:DG) saw a 3.5% year-over-year increase in quarterly same-store sales, supported by growth across categories like seasonal, home products, and apparel. The company lifted its fiscal 2026 same-store sales growth forecast from its earlier range of 2.2% to 2.7% to 2.5% to 2.9%.\n\nDollar General Corporation (NYSE:DG) now expects fiscal 2026 earnings per share of about $7.80 to $8.00. This includes a benefit of about 25 cents from tariff refunds after related reinvestments. Dollar Tree, Inc. (NASDAQ:DLTR) also raised its full-year earnings forecast to $7.70 to $8.05 per share, which includes a benefit of about 60 cents from tariff refunds.\n\nIt is not difficult to argue that the latest results point to improving momentum at both discount retailers. Dollar General Corporation (NYSE:DG) delivered its seventh consecutive earnings beat, with earnings per share coming in 11% above analysts' expectations. Even after excluding the 25-cent net benefit from tariff refunds, the company's earnings were up approximately 20% year-over-year.\n\nDollar General Corporation (NYSE:DG) experienced growth across all four of its product categories, with non-consumables performing better than consumables. Traffic increased 2% during the quarter, while the company also reported continued improvement in shrink and damages despite increasingly difficult comparisons. The company raised the midpoint of all its key fiscal 2026 guidance metrics.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:12 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Palantir Jumped 7.7% on an Expanded PwC Alliance as Globant Launched a Salesforce AI Pod. Which Services Model Scales Better?", "full_content": "Skip to navigation Skip to main content Skip to right column Palantir Jumped 7.7% on an Expanded PwC Alliance as Globant Launched a Salesforce AI Pod. Which Services Model Scales Better? Habib Ur Rehman Sat, September 5, 2026 at 8:38 AM EDT 3 min read PLTR GLOB CRM Palantir shares gained 7.7% on September 3, the same day PwC US expanded an alliance built around enterprise AI, M&A, and ERP modernization. The companies described an AI-native deals platform intended to execute transactions up to 50% faster and cut one-time costs by as much as 45%, but disclosed no new contract value. The same day, Globant introduced a MuleSoft AI Pod for Salesforce integration. Palantir Technologies Inc. (NASDAQ: PLTR ) and Globant S.A. (NYSE: GLOB ) are packaging expertise around software in very different ways.\n\nPalantir's bull case is productized delivery. PwC can bring industry relationships and implementation capacity, while Foundry and AIP remain the recurring platform. Palantir's Q2 revenue rose 93% to $1.94 billion, including 149% growth in U.S. commercial revenue, so the alliance lands on real momentum. Arrowstreet Capital held 20,517,115 shares at June 30 after increasing its stake by 97%.\n\nThe valuation is the obvious counterweight. A partnership announcement without disclosed revenue cannot by itself justify a large daily move. Receivables concentration, stock-based compensation, and competition from clouds and consultants deserve attention. Hedge-fund breadth had already weakened: Insider Monkey counted 86 funds holding Palantir at June 30, down from 96 at March 31.\n\nGlobant's AI Pod offers a more explicit delivery unit. Configurations support roughly six, 12, or 24 integration flows or APIs per month, and the company cited benchmarks including up to 80% automation and 15% to 25% faster time to value. That makes capacity tangible. Twenty-three hedge funds held Globant S.A. (NYSE:GLOB) in Q2, down from 25 in Q1.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:08 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Putin orders a 72-hour pause in strikes on Kyiv as U.S. envoys Witkoff and Kushner visit Russia and Ukraine", "full_content": "Russian President Vladimir Putin ordered a 72-hour pause in strikes on Kyiv, the Kremlin said Saturday, as U.S. envoys Steve Witkoff and Jared Kushner arrived in Moscow to try to revive a stalled push to end Russia's full-scale invasion of Ukraine.\n\n\"Putin has ordered that no strikes be carried out against Kyiv for three days, starting at midnight today,\" presidential spokesperson Dmitry Peskov told Russia's Tass news agency. He said the decision was tied to preparations for Witkoff and Kushner's planned visit to the Ukrainian capital, which Kyiv has said will take place on Sunday.\n\nThe envoys' trip comes as both sides escalate aerial attacks, some 4 1/2-years after the Kremlin's invasion of its neighbor. Ukrainian President Volodymyr Zelenskyy said Friday that Ukraine would halt airstrikes during the envoys' visit and urged Moscow to do the same.\n\nWashington's push to end the fighting, now in its fifth year, has lost momentum as U.S. attention has been focused for the last six months on its war with Iran. The last known visit to Moscow by Witkoff and Kushner, U.S. President Donald Trump's son-in-law, was in January, when they met Putin in the Kremlin. The envoys had never visited Kyiv before.\n\nThe envoys were met at the airport by Russian envoy Kirill Dmitriev, Tass reported. Dmitriev shared photos of him meeting the U.S.", "source": "CNBC Top News", "pub_date_str": "05 Sep 2026, 06:06 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Schwab U.S. Dividend Equity vs. Vanguard Dividend Appreciation: Which ETF Looks Better for Your Portfolio?", "full_content": "Skip to navigation Skip to main content Skip to right column Schwab U.S. Dividend Equity vs. Vanguard Dividend Appreciation: Which ETF Looks Better for Your Portfolio? Erin Kennedy, The Motley Fool Sat, September 5, 2026 at 8:35 AM EDT 4 min read VIG ^GSPC The Schwab U.S. Dividend Equity ETF (NYSEMKT:SCHD) offers a higher current yield and deeper value tilt, whereas the Vanguard Dividend Appreciation ETF (NYSEMKT:VIG) focuses on consistent dividend growth and tech-heavy quality.\n\nBoth funds target dividend-paying companies, but their underlying methodologies lead to distinct portfolio profiles. The Schwab fund screens for sustainable high yields and fundamental financial strength, while the Vanguard fund strictly requires a 10-year track record of annual dividend increases. This difference creates a more conservative, tech-forward tilt for the Vanguard fund versus the value focus of its peer.\n\nBeta measures price volatility relative to the S&P 500; beta is calculated from monthly returns over the available fund history (up to five years). The 1-year return represents total return over the trailing 12 months. Dividend yield is the trailing-12-month distribution yield.\n\nBoth funds offer extremely affordable expense ratios. The primary differentiator for many income investors is the significant yield difference, with the Schwab fund nearly doubling the payout of its Vanguard peer.\n\nThe Schwab U.S. Dividend Equity ETF aims to track the overall performance of the Dow Jones U.S. Dividend 100 Index, which filters for companies with high yields and consistent payment histories. This investment strategy results in a portfolio of 102 holdings that concentrates on healthcare at 21%, consumer defensive at 20%, and energy at 15%. Its largest positions include Merck (NYSE:MRK) at 4.92%, Abbott Laboratories (NYSE:ABT) at 4.83%, and Amgen (NASDAQ:AMGN) at 4.8%.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:05 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Enterprise Products Partners: Buy, Sell, or Hold?", "full_content": "Skip to navigation Skip to main content Skip to right column Enterprise Products Partners: Buy, Sell, or Hold? Reuben Gregg Brewer, The Motley Fool Sat, September 5, 2026 at 8:35 AM EDT 4 min read EPD NG=F The energy sector has been thrown into disarray since the geopolitical conflict in the Middle East began in early 2026. Oil and natural gas prices have been volatile, often driven more by investor sentiment than by market fundamentals. And through it all, Enterprise Products Partners (NYSE: EPD) has continued to provide investors with a well-above-market yield backed by reliable cash flows. Here's a quick look at the buy, sell, hold call on this energy industry stalwart.\n\nThe reasons to buy and to hold Enterprise Products Partners are essentially identical. For starters, it is a service provider to energy companies , collecting fees for helping to move oil and natural gas around the world. The price of the commodities moving through Enterprise's vast North American energy infrastructure network is less important than the volume being moved. And since energy remains vital to modern life, volumes tend to be robust most of the time. In a sector known for volatility, Enterprise has a very consistent and reliable business.\n\nMissed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb\n\nIt is also financially strong, with an investment-grade credit rating. And its distributable cash flow in 2025 covered its distribution by a robust 1.7x, leaving ample room for adversity before a cut would likely be on the table. There's no reason to expect the 28-year streak of annual increases to be at risk. And given the $6.5 billion in capital investment plans the master limited partnership (MLP) has lined up, further increases seem highly likely.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 06:05 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "OpenAI\u2019s $1 Billion Cyber Push Backs Cloudflare and SentinelOne. Which Has the Better AI Security Model?", "full_content": "Skip to navigation Skip to main content Skip to right column OpenAI\u2019s $1 Billion Cyber Push Backs Cloudflare and SentinelOne. Which Has the Better AI Security Model? Habib Ur Rehman Sat, September 5, 2026 at 8:26 AM EDT 3 min read NET S OpenAI launched Daybreak for Frontline Defenders on September 3, committing $1 billion in subsidized Daybreak access, training, technical support and partnerships. Separately, the Daybreak Defense Network now includes more than 35 enterprise products and partner-operated services. Cloudflare is offering invitation-only access to an AI vulnerability-discovery and remediation service built with GPT-5.6 Cyber, while SentinelOne is adding Daybreak models to its Wayfinder services. Cloudflare, Inc. (NYSE: NET ) and SentinelOne, Inc. (NYSE: S ) therefore enter the same program with different routes to revenue.\n\nCloudflare's model starts at the network and developer edge. It can combine authorized source-code analysis with traffic and security context, then propose code patches and WAF mitigations for customer review. That distribution creates a credible cross-sell path because customers already use Cloudflare for performance and security. Insider Monkey counted 87 hedge funds holding NET at June 30, versus 84 at March 31. AQR Capital Management owned 2,076,835 shares after raising its position by 129%.\n\nThe weakness is monetization. Early access is not general availability, and subsidized services can prove usefulness before they prove willingness to pay. Cloudflare must also prevent automated discovery from producing noise or unsafe fixes. Its premium valuation leaves little tolerance for a long gap between product attention and revenue.\n\nSentinelOne approaches the opportunity from endpoint and security operations. Wayfinder can use the new models for code-risk assessment, compromise investigation, and malware analysis, placing AI inside workflows staffed by security teams. Forty-one hedge funds held SentinelOne, Inc.", "source": "Yahoo Finance", "pub_date_str": "05 Sep 2026, 05:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Toxic Box Office Collection Day 10: Yash Starrer Sees 58.8% Drop In Earnings", "full_content": "Toxic sees a sharp 58.8% drop on Day 10, earning Rs 1.75 crore net in India and taking its total to Rs 241.05 crore.", "source": "NDTV Profit", "pub_date_str": "05 Sep 2026, 05:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "7.8% GDP is good news but why skyrocketing KOSPI, Nikkei, Taiwan remain a major concern for Sensex, Nifty | Explained", "full_content": "GDP growth rate of India 2026: India\u2019s economic growth engine maintained its momentum in the April-June quarter of FY27, registering a GDP growth of 7.8% , negating any impact of the conflict in West Asia, late onset of the southwest monsoon and uncertain tariff policies, according to official data released on Monday last week. However, a smart investor correlates the stock market with the national economy; in India, the scenario is completely different.\n\nThe key benchmark indices of the Indian stock market, Nifty 50, registered an 8.60% loss in YTD, and the BSE Sensex logged over a 10% correction in YTD. The Bank Nifty index shed nearly 3.90% in 2026.\n\nIn Asian markets, the South Korean KOSPI, Japanese Nikkei 225, and South Korean Taiwan Weighted index have delivered robust gains of 55%, 25%, and 60%, respectively. They have delivered such impressive returns even when their economy failed to beat India's economic indicators, such as GDP.\n\nSpeaking on the GDP growth of India in 2026 and its impact on the Indian stock market, Avinash Gorakshkar, a SEBI-registered fundamental equity analyst, said, 'Normally, the stock market is linked to the national economy. India's GDP performed well during the April to June 2026 quarter, as reflected in the Q1 2026 results. The market is expecting a similar result in the next quarter; hence, Q2 2026 results are also expected to boost the market.\"\n\nOn why the Indian stock market is unable to reflect the GDP growth of India 2026, Anuj Gupta, a SEBI-registered market expert, said, \u201cThe Indian stock market was unable to sustain the soaring crude oil prices in the wake of the US-Iran war and closure of the Strait of Hormuz. The US-Iran war began on 28th February 2026, and there are no signs of any ceasefire even after more than six months of the beginning of this war.", "source": "LiveMint Markets", "pub_date_str": "05 Sep 2026, 05:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "This enhanced geothermal project aims to unlock gigawatts of power to fuel the data center boom", "full_content": "MILFORD, Utah \u2014 Deep in the Utah desert, down miles of gravel roads and hours from a major city, Fervo Energy bets it can economically harness heat from the Earth's core for power, potentially unlocking dozens of gigawatts of baseload, emissions-free electricity at a time when U.S. power demand is meaningfully growing for the first time in decades.\n\nGeothermal power is not new. Traditionally, it required specific geological formations, vastly limiting its potential. Now, Fervo aims to prove that, by utilizing the same drilling and hydraulic fracturing techniques developed by the oil and gas industry, what's known as enhanced geothermal can become a key power source for the U.S.\n\nThe company's Cape Station project in Milford is on track to send power to the grid next month, which would make it the first enhanced geothermal system in the U.S. to reach commercial operation. After an initial public offering in May and a new offtake agreement with Google , Fervo must prove it can provide cost-competitive enhanced geothermal at scale.\n\nThe company's roots precede the data center power boom. CEO Tim Latimer began his career as a drilling engineer in South Texas, before founding the company in 2017 with Chief Technology Officer Jack Norbeck. As Latimer tells it, when they first tried to raise venture capital funds, a common response was, \"'Why would we invest in a power generation c
