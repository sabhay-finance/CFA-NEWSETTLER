e easing of geopolitical tensions are supporting this trend. The Reserve Bank of India has implemented measures to stabilize the currency and enhance dollar availability.\n\nBusiness of Odd Things: The farm that needs no land, freshwater, or fertiliser\n\nKYC and KYB: Inside Pidilite, the company that turned Fevicol into a word for a strong bond \u2013 Part 1 of 3\n\nSeoul halts trading, Nifty has its best week since 2021: Money leaving the AI trade \u2013 will it land in India?\n\nJunk bonds are cracking at the bottom. Will the noise get loud enough to make \u2018junk bond\u2019 a household term again?\n\nPNG connections rise half a million, but how many use piped gas for cooking?\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "10 Nov 2026, 08:34 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "CoreWeave earnings put debt-fueled AI build-out under scrutiny", "full_content": "CoreWeave faces a pivotal test when it reports its third-quarter financial results after the bell on Tuesday.\n\nThe market will be closely watching what the neocloud company says about artificial intelligence spending \u2014 and how it plans to finance its infrastructure buildout. The outcome could either calm concerns over its debt or stoke more fear.\n\n\"Investors need neoclouds to quantify how much financing they expect to raise to execute on existing backlog,\" Wolfe Research said in a note Monday. \"We think outlooks that communicate when and which avenues of funding will be tapped will increase investor confidence.\"\n\nCoreWeave stock and bonds have come under pressure as fears deepened about the enormous amount of debt it has taken out to build its data centers.\n\nIts stock is down roughly 40% over the past month. Meanwhile, the yield on its 9.75% bond due in 2031 was 15.5% on Tuesday, after jumping to 16.7% on Thursday as investors digested the election results and possible roadblocks to data center construction. Bond yields move inversely to prices.\n\nThe spread on its five-year credit default swaps \u2014 which is insurance against default and considered a barometer of perceived credit risk \u2014 is also at levels that are considered distressed. On Tuesday, its CDS spread stood around 1,152 basis points, after rising above its October peak to close at 1,278 basis points on Thursday. Rising CDS spreads mean investors view the debt as riskier.\n\nIn addition, the New Jersey-based company's leverage is high. CoreWeave has a debt-to-equity ratio of 702%, up from almost 291% a year ago.\n\nCEO Michael Intrator has sought to quell investor fear, posting on LinkedIn after the election last week that the company doesn't anticipate \"any impact to CoreWeave's existing customer commitments or associated backlog as a result of shifts in the political landscape.\"", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 08:31 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Market spooked because now the Fed may need a supersized hike in December", "full_content": "Wall Street was recently able to put inflation worries on the back burner, as traders focused on the midterm elections and swings in tech stocks. That\u2019s over now.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:29 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic's potential mega IPO joins ranks of world's biggest stock market listings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Anthropic's potential mega IPO joins ranks of world's biggest stock market listings Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic's potential mega IPO joins ranks of world's biggest stock market listings SECTIONS Anthropic's potential mega IPO joins ranks of world's biggest stock market listings Reuters Last Updated: Nov 10, 2026, 08:25:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic has kicked off its U.S. IPO roadshow, seeking to raise up to $64.4 billion by offering 825 million shares. This latest valuation stands at roughly $1.4 trillion, representing a drop from earlier estimations of $2 trillion. Notably, tech giants like Alphabet and Microsoft are set to invest $26 billion in a private placement.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 08:25 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Consumer prices rose 0.4% in October, more than expected, complicating Fed's inflation fight", "full_content": "Costs for goods and services rose more than expected in October, providing fresh warning signs for the Federal Reserve in its fight to lower inflation.\n\nThe consumer price index , a broad gauge of costs across the U.S. economy, increased a seasonally adjusted 0.4% for the month, the Bureau of Labor Statistics reported Tuesday. Economists surveyed by Dow Jones had been looking for a 0.3% increase.\n\nStripping out volatile food and energy, so-called core CPI increased 0.3% against the forecast for a 0.2% gain.\n\nThe headline CPI had increased 0.6% in September while core was up 0.3%.\n\nThe BLS did not estimate a yearly rate. The government shutdown last year prevented the bureau from collecting sufficient data in October 2025, so there is no comparable figure to use. However, the report did include annual figures for some individual items where it was able to collect data.\n\nStock market futures drifted lower following the release while Treasury yields jumped. Traders fully priced in a quarter percentage point increase when the Fed next meets Dec. 8-9 and put odds of a half-point hike at 13.6%, after being around zero prior to the release, according to the CME Group's FedWatch tool.\n\nThe report comes at a critical juncture for the Federal Reserve as it considers its next move regarding interest rates. At its October meeting, central bank officials voted 10-2 to keep their benchmark rate in a range between 3.75%-4% while awaiting incoming data.\n\n\"This was the report the market could least afford to see,\" said Karen Manna, fixed income investment strategist at Federated Hermes. \"A hotter inflation print raises fresh questions about whether the Fed has done enough to contain price pressures and reinforces the risk that interest rates need to move higher and stay there for longer.\"", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:20 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FDA warns of vision loss risk linked to popular GLP-1 drugs like Wegovy, Zepbound", "full_content": "The U.S. Food and Drug Administration is requiring new safety warnings on all GLP-1 drugs after finding evidence of a potential increased risk of a rare eye condition, the agency said on Monday.\n\nThe condition, which can cause sudden vision loss, known as nonarteritic anterior ischemic optic neuropathy (NAION), is rare, and a causal relationship has not been established.\n\nThe FDA is requiring the makers of all GLP-1 medications to add a warning about the potential increased risk of NAION associated with use of these medications, it said.\n\nNAION is a condition that can result in sudden decreased vision, including permanent vision loss. It is caused by decreased blood flow to the front part of the \u200boptic nerve \u2014 the underlying cause is not completely understood, however.\n\nNAION cases have been reported for all currently marketed GLP-1 products, the FDA said.\n\nOzempic and Wegovy maker Novo Nordisk said it \"continues to believe the data do not establish a cause-and-effect relationship, and we remain confident in the benefit-risk profile of our GLP-1 medicines.\"\n\nCNBC has reached out to Eli Lilly, the company behind Mounjaro, Zepbound and Foundayo, for comment.\n\nDiabetes itself is a known risk factor for NAION, complicating efforts to determine if cases among GLP-1 users are caused by the medications or by patients' underlying health conditions.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:13 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Tuesday", "full_content": "Futures are down after a higher-than-expected consumer price index this morning stoked inflation concerns.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:13 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Scene Box Office Collection Day 5: Will Suriya Starrer Cross Rs 100 Crore Mark Today? Check Total Earnings", "full_content": "The film added \u20b99.10 crore to its India net collection on Tuesday, taking its five-day total closer to the \u20b9100-crore mark.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 08:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks, Bonds Fall as CPI Data Fuel Fed-Hike Bets: Markets Wrap - Bloomberg.com", "full_content": "Stocks, Bonds Fall as CPI Data Fuel Fed-Hike Bets: Markets Wrap Bloomberg.com S&P 500 falls slightly after hot CPI as tech shares try to keep comeback going: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq trade mixed ahead of key inflation data Yahoo Finance Stocks cut gains, dollar and yields up as US CPI cements December rate hike bets Reuters US stocks stumble after a discouraging update on inflation KSL News", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 08:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Stock Market Today: Dow, Nasdaq Trade Lower As Hotter CPI Fuels Fed Rate Hike Fears", "full_content": "The S&P 500 fell 0.7% to 7,497 whereas it had logged its best day since April just yesterday, while Dow Jones Industrial Average slipped 0.4% to 52,168. Nasdaq 100 also declined 1.20% to 27,571.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 08:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Does anyone feel safe from layoffs right now?", "full_content": "In late October, Bashel Lubarsky had a feeling something was off when she got a DM from her co-worker on the way to work. Once she opened her email and saw a note announcing layoffs, Lubarsky suspected she'd been cut.\n\nMinutes later, Lubarsky stepped off the subway to join an impromptu Zoom meeting with HR and got laid off in the middle of downtown Brooklyn, New York.\n\nUp until that point, Lubarsky, 28, says she held two ideas in her head: On the one hand, she had a feeling the company would be going through another round of October layoffs considering it had done the same in 2025. On the other, she felt pretty secure in her job as a graphic designer and illustrator. She'd gotten a promotion earlier in the year, had essential skills used across multiple projects and jokes that she was likely the \"cheapest\" member of her team. \"I never thought my job wasn't safe,\" Lubarsky tells CNBC Make It.\n\nLubarsky's experience hits home for many Americans these days . Despite official numbers saying the job market is relatively stable , with new jobs opening up, increased hiring and a steady unemployment rate , an increasing number of workers can't shake the feeling that layoffs are just around the corner and that nothing \u2014 not an artificial intelligence-related job, stellar performance or company success \u2014 is enough to keep them safe.\n\nAccording to the American Psychological Association's spring survey of 2,009 employed adults, some 32%, or 1 in 3, U.S. workers say they're concerned about losing their job in the next few weeks or months, up from 26% in 2025.\n\nU.S. employee engagement fell to 29% in the third quarter of 2026, its lowest level since 2011, according to Gallup . And employee confidence fell to its lowest point in September since Glassdoor began measuring it in 2016; confidence rebounded slightly in October, per Glassdoor's latest analysis, but remains near record lows.\n\nDespite the sour outlook, layoffs are less severe today than they were a year ago.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 08:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "TSMC to invest up to $1 billion in Anthropic, OpenAI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a TSMC to invest up to $1 billion in Anthropic, OpenAI Powered By The Economic Times daily newspaper is available online now. Read Today's Paper TSMC to invest up to $1 billion in Anthropic, OpenAI SECTIONS TSMC to invest up to $1 billion in Anthropic, OpenAI Reuters Last Updated: Nov 10, 2026, 07:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis TSMC is set to invest up to $1 billion in the AI landscape, directing $500 million each to Anthropic and OpenAI. As Anthropic prepares for its IPO, this financial move by TSMC underscores its belief in a booming AI industry. With surging demand for AI chips, TSMC also aims to enhance its production capabilities, reinforcing its role in evolving AI infrastructure.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 07:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "FPIs return to Dalal Street amid AI sell-off and oil slump; Can proposed tax cuts sustain inflows?", "full_content": "A Ksheerasagar ( with inputs from Deutsche Welle ) Published 10 Nov 2026, 07:48 PM IST Prefer Livemint on Google Indian stocks have staged a strong comeback in recent sessions, with benchmark indices witnessing a sustained rally that bulls had been eagerly awaiting since the beginning of the year.\n\nWhile there have been no significant domestic triggers behind the upmove, the rally has largely been driven by the return of foreign investors, who had largely stayed away from Asia's third-largest economy in recent months.\n\nTheir shift in sentiment comes amid a rotation away from AI-linked stocks, driven by concerns over a slowdown in data center expansion following the Democrats' victories in both houses.\n\nA sharp retreat in crude oil prices has also boosted foreign investors' optimism towards Indian equities, prompting FPIs to pour \u20b9 53,739 crore into domestic stocks in November so far, according to NSDL data. The inflows have helped the Nifty 50 extend its winning streak to seven consecutive sessions, enabling the benchmark index to pare its year-to-date losses to 4.15%.\n\nThe key question now is whether the return of foreign investors signals a durable turnaround or is merely a tactical shift driven by global developments and expectations of tax relief.\n\nTo understand what is driving the change in FPI sentiment, the possibility of capital gains tax relief, and whether the recent inflows can be sustained, Manoj Purohit, Partner & Leader, Financial Services Tax, Tax & Regulatory Services, BDO India, shared his views.\n\nForeign investors are reassessing their current exposure to India amid ongoing discussions and representations by industry bodies and various associations seeking tax breaks on long-term investments.\n\nIn addition to expectations of tax relief, the recent US midterm elections could influence the revision and revival of various trade policies.", "source": "LiveMint Markets", "pub_date_str": "10 Nov 2026, 07:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Central govt pension rules clarified: Who can commute pension without medical tests and when is examination compulsory", "full_content": "Central government pensioners can receive a lump-sum payment by commuting a portion of their monthly pension without necessarily undergoing a medical examination. However, whether they qualify for this facility depends on their pension category and when they submit their application.\n\nThe Department of Pension and Pensioners\u2019 Welfare (DoPPW) has issued a series of clarifications dated October 29, 2026, explaining the rules governing pension commutation under the Central Civil Services (Commutation of Pension) Rules, 1981. The clarifications cover eligibility for commutation without medical examination, the one-year application deadline, cases requiring medical fitness tests and the treatment of pension applications after departmental or judicial proceedings.\n\nFor retiring government employees, the timing of the application is particularly important. Even pensioners who are otherwise eligible to commute their pension without a medical examination may have to undergo one if they miss the prescribed deadline.\n\nUnder Rule 12 of the CCS (Commutation of Pension) Rules, 1981, five categories of pensioners can commute a portion of their pension without undergoing a medical examination.\n\nThe department has also clarified that provisional pension sanctioned under Rule 62 is covered in the specified categories of superannuation, retiring and compensation pension.\n\nThese provisions apply to pensions authorised under the CCS (Pension) Rules, 2021, through Rule 84(2), which makes the 1981 commutation rules applicable.\n\nUnder Rule 13 of the CCS (Commutation of Pension) Rules, 1981, pensioners belonging to the eligible categories must submit their application in the prescribed form within one year of retirement to commute a portion of their pension without a medical examination.\n\nThe application can be submitted any time after the day following retirement, but before the expiry of one year from the retirement date.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 07:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How much you can make in 2027 and still pay 0% capital gains tax", "full_content": "The IRS has released the capital gains tax brackets for 2027 , which include a six-figure earnings limit for the 0% rate for married couples.\n\nIf you're eager to sell profitable brokerage account investments, higher income thresholds for the 0% rate could help reduce your tax bill , experts say.\n\n\"The 0% capital gains bracket is easily one of the most overlooked strategies for tax-free income,\" said Stephen Maggard, a certified financial planner with Abacus Planning Group in Columbia, South Carolina.\n\nBut it's important to know how the tax brackets work and the possible trade-offs before selling investments.\n\nDespite recent stock market volatility , many investors have portfolio gains after years of market growth . As of market close Nov. 9, the S&P 500 was up about 10% year-to-date. The index also returned more than 16% in 2025, and over 23% in 2024.\n\nIf you're planning to leverage the 0% capital gains bracket in 2027 to sell or rebalance brokerage account assets, here are some key things to know.\n\nThe capital gains brackets \u2014 with rates of 0%, 15% or 20% \u2014 apply to assets owned for more than one year, known as long-term capital gains. By contrast, investments held for one year or less are short-term gains, subject to regular income tax rates .\n\nYour rate depends on taxable income, which you calculate by subtracting the greater of the standard or itemized deductions from your adjusted gross income , or AGI. Taxable income also includes any gains from investments that year.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 07:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic Unveils New Fable, Mythos AI Models Ahead Of IPO", "full_content": "Anthropic said Fable 5.2, set to be released Monday, can tackle more difficult software engineering work, take on more hardware-related tasks like controlling robots and handle long-running projects.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 07:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic Run-Rate Revenue Jumps $10B To $81B; Discloses $900.9B In Total Spend Commitments", "full_content": "Anthropic's annualised revenue reached $81 billion by October 31, up $10 billion in a month, even as the AI company disclosed nearly $901 billion in aggregate spending commitments.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 07:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Salary slip shows PF deduction, but is the full amount reaching your EPF account? How to check and report shortfalls", "full_content": "Salaried employees usually check their salary slips to see whether provident fund (PF) has been deducted every month. However, this does not confirm that the employer has deposited the contribution with the Employees\u2019 Provident Fund Organisation (EPFO) and credited it to the employee's EPF account.\n\nCompanies covered under EPFO are required to deposit both the PF deducted from employees' salaries and their own matching contribution to the retirement fund within 15 days of the close of the month.\n\nBoth the employee and the employer contribute 12% of the employee's basic salary plus dearness allowance ( DA ) to EPF and the accumulated corpus can be used for financial needs after retirement. Mandatory EPF rules apply to a statutory wage ceiling of \u20b9 25,000 under the current framework.\n\nYou can check whether your employer is depositing PF contributions every month through the EPFO member portal. By accessing the EPF passbook, one can check the contributions credited under one's Universal Account Number (UAN), including one's contribution, employer's contribution and Employees\u2019 Pension Scheme ( EPS ) contribution, if applicable.\n\nNow, employees also have the option to keep track of their EPF contributions on WhatsApp. You can check your balance, view the last five transactions and download the PF passbook without logging in to the EPFO member portal.\n\nTo use the service, members need to send a simple 'Hi' message to EPFO's verified WhatsApp number, +91 8796441800.\n\nIt is advisable to check your EPF passbook every few months and compare the entries with your salary slips to ensure the deducted amount is not less than the deposited amount.", "source": "LiveMint Money", "pub_date_str": "10 Nov 2026, 07:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US consumer prices rise above expectations in October", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US consumer prices rise above expectations in October Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US consumer prices rise above expectations in October SECTIONS US consumer prices rise above expectations in October Reuters Last Updated: Nov 10, 2026, 07:31:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Consumer prices in the US experienced a larger-than-expected increase in October, affecting future Federal Reserve interest rates. The Consumer Price Index rose by 0.4%, following a 0.6% increase in September. Core CPI also increased, leading many to predict a rate hike in December. Despite missing year-over-year data, inflation remains significantly above the Fed's 2% target.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 07:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Piero Cipollone: Cash and the digital euro: two sides of the same coin", "full_content": "It is a pleasure to be back here for the first time since the Parliament adopted its position on the Single Currency Package, and I very much welcome the broad support it received in the plenary session on 9 July. This gives a strong democratic backing to the digital euro. Let me also thank you for the considerable work and constructive dialogue that have made this progress possible.\n\nA swift conclusion of the ongoing trilogue negotiations would pave the way for the adoption of the Single Currency Package [ 1 ] by the end of the year as foreseen in the One Europe, One Market Roadmap . [ 2 ] This would give us the legal certainty needed to complete our preparations for the digital euro. It would also give certainty to the market regarding the planned date for a possible first issuance, which can be set only after the Regulation is adopted. A delay in adoption could instead postpone the introduction of the digital euro, further entrench Europe\u2019s dependence on foreign providers, and make it more difficult for European companies to innovate and compete.\n\nEurope\u2019s achievements in payments innovation go beyond progress on the digital euro. In September we launched Pontes, which connects market distributed ledger technology (DLT) platforms with the Eurosystem\u2019s TARGET Services. [ 3 ] The launch was widely welcomed by the market, with 18 market participants and market DLT operators onboarded on day one and many others preparing to join soon. Pontes makes the settlement of tokenised transactions in central bank money an operational reality and is a major milestone in the development of digital European capital markets.", "source": "ECB Press", "pub_date_str": "10 Nov 2026, 07:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic Sets IPO Price Band At $70-$78 Per Share, Eyeing Historic $1-Trillion Nasdaq Debut", "full_content": "An $81 billion annualised revenue run rate, nearly $900 billion in infrastructure commitments and a $1 trillion valuation target. Anthropic's IPO will put the AI investment boom to the test.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 07:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nvidia, AMD, Broadcom, Google Lead $26B Investment Blitz In Anthropic Pre-IPO Round", "full_content": "Anthropic will raise $26 billion through a private placement deal with investors such as Alphabet's Google, Microsoft, Nvidia, Broadcom and Advanced Micro Devices.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 07:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "France blames Iran for supermarket refrigerator cyberattacks, weighs sanctions", "full_content": "France is \"not ruling anything out\" in its response to October's mass cyberattacks on supermarket refrigerators that the country has blamed on Iran, the country's Foreign Minister Jean-No\u00ebl Barrot said on Tuesday.\n\nThe French government summoned Iran's ambassador Tuesday morning after Paris said Monday that the findings of an investigation laid the blame for the hacks on Shahid Kaveh, an affiliate of the cyber unit of the powerful Revolutionary Guard Corps.\n\nBarrot told radio station Franceinfo that the French government could respond with bans on entering European territory and the freezing of assets of anyone held responsible, as it looks to deter any further malicious acts conducted against the region.\n\nIn a statement issued on Tuesday, Iran's Ministry of Foreign Affairs said it categorically rejected the accusations made by France, labeling them \"baseless and malicious.\"\n\n\"This latest round of allegations \u2014 a continuation of previous, repetitive claims \u2014 is clearly intended to divert public attention from France's own destructive policies toward Iran and the West Asia region. Such a move is highly irresponsible and contemptible; it is a transparent attempt to tarnish Iran's image and disrupt its relations with other nations,\" the MOF said in a statement, according to Google translation of the original Farsi.\n\nRemote hacks on around 700 grocery stores over the night of Oct. 11 to Oct. 12 caused refrigerators and freezers to heat up by as much as 50 degrees Celsius (122 degrees Fahrenheit).\n\nThe soaring temperatures spoiled food and sparked fires, generating tens of millions of dollars in damage. Major French retailers, including Intermarch\u00e9, E. Leclerc, Carrefour , Monoprix and Coop\u00e9rative U were targeted.\n\nThe Paris Prosecutor's Office is seeking international arrest warrants, Paris chief prosecutor Laure Beccuau said in a statement.", "source": "CNBC Top News", "pub_date_str": "10 Nov 2026, 07:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "China panel chair Moolenaar demands answers on Nvidia CEO's alleged affair with a Chinese spy", "full_content": "Rep. John Moolenaar , R-Mich., said on a Tuesday appearance on CNBC's \"Squawk Box\" that Congress needs to \"get to the bottom\" of Nvidia CEO Jensen Huang 's affair with an alleged Chinese spy.\n\nMoolenaar, who chairs the House Permanent Select Committee on China, said he wants to know whether Huang shared privileged information with a Chinese spy; whether Huang was influenced to lobby against preventing chip sales to China; and whether China was given preference in purchasing Nvidia's limited supply of advanced chips.\n\n\"If it becomes less of an investigation, more of damage control, that's not going to work because people have to have confidence,\" Moolenaar said.\n\n\"We're dealing with the country, the Chinese Communist Party that is a foremost adversary, that's funding wars and supporting Russia, supporting Iran, North Korea,\" he said. \"And we have basically a Cold War race with technology. We cannot allow the premier company at the forefront of this to, in some way, be irresponsible.\"\n\nCongressional scrutiny of Huang's affair has intensified since members returned to Washington on Monday.\n\nThe New York Times reported that Huang was romantically involved with Alice Huang, a Megaspeed executive who U.S. intelligence agencies have identified as a Chinese intelligence asset. Nvidia opened an investigation into its CEO on Sunday. The two Huangs are not related.\n\nHouse Minority Leader Hakeem Jeffries , D-N.Y., said in a press conference on Monday that \"we're going to need a full briefing specifically as it relates to the Nvidia issue so we can all get to the bottom of what has happened and what the implications are in terms of national security\"\n\nMoolenaar co-authored a letter with Florida Rep. Brian Mast and Arkansas Rep. Rick Crawford on Nov. 5 asking Huang to appear before the Select Committee on China, the House Foreign Affairs Committee and House Select Committee on Intelligence. Mast chairs the foreign affairs panel, and Crawford chairs intelligence.", "source": "CNBC World Economy", "pub_date_str": "10 Nov 2026, 07:11 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Fed\u2019s Waller puts half-point rate hike into the mix for December", "full_content": "U.S. central bank official had put a half-point discussion into the mix ahead of Labor Department data, which came in as hot as he feared.", "source": "MarketWatch Top Stories", "pub_date_str": "10 Nov 2026, 07:11 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "FDA orders new warning labels on Ozempic, Wegovy over rare risk of permanent vision loss - Fox Business", "full_content": "FDA orders new warning labels on Ozempic, Wegovy over rare risk of permanent vision loss Fox Business US FDA orders new eye risk warnings for Ozempic, Zepbound CNN FDA orders new warning on GLP-1s over rare eye condition linked to sudden blindness NBC News FDA requires NAION warning across the GLP-1 receptor agonist class Ophthalmology Times FDA warns of vision loss risk linked to popular GLP-1 drugs like Wegovy, Zepbound CNBC", "source": "Google News Business", "pub_date_str": "10 Nov 2026, 06:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic targets valuation of up to $1.4tn in IPO", "full_content": "The Claude maker plans to raise as much as $64bn in highly anticipated listing", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 06:37 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Chip Stocks Drag Nasdaq Futures On Nvidia CEO's Affair Row, Anthropic IPO Buzz; Intel, Marvell Down 2%", "full_content": "Nasdaq 100 futures fell 0.35% as investors weighed allegations involving Nvidia CEO Jensen Huang and Anthropic's proposed $64.4 billion IPO, while inflation data kept markets on edge.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 06:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US stocks edge lower after October's hot inflation print: Stock Market Live Updates", "full_content": "", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 06:33 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Polymarket says annualized revenue has topped $1.8 billion", "full_content": "Amid growth of its U.S. exchange, the prediction market platform\u2019s current annual run-rate is $1.8 billion.", "source": "CNBC Finance", "pub_date_str": "10 Nov 2026, 06:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Africa\u2019s richest man Aliko Dangote pulls London listing", "full_content": "Nigerian billionaire had planned to list $18.4bn group Dangote Cement in UK this year", "source": "FT Markets", "pub_date_str": "10 Nov 2026, 06:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Kalyan Jewellers Q2 Results: Profit Jumps 64% To Rs 427 Crore On One-Time Gain, Revenue Up 31%", "full_content": "Revenue rises 31.4% to Rs 10,323 crore, while EBITDA grows 29.7%; one-time gain of Rs 73.5 crore boosts bottom line as operating margins edge lower.", "source": "NDTV Profit", "pub_date_str": "10 Nov 2026, 06:27 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq futures slip with Nvidia woes, Anthropic IPO in focus", "full_content": "Nvidia's CEO Jensen Huang is facing scrutiny, impacting investor sentiment in the tech sector. Anthropic is preparing for a huge initial public offering, potentially raising $64.4 billion. The market is anxious about upcoming inflation data that could influence stock performance. Cooling oil prices have provided some optimism among investors and pushed Dow futures higher. Concerns over the sustainability of the AI boom continue to linger in the background.", "source": "Economic Times Markets", "pub_date_str": "10 Nov 2026, 06:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India may get a better trade deal: Samir Saran on renegotiating with the US", "full_content": "Following the US midterm elections, Samir Saran emphasized India's need to navigate trade negotiations with patience. He believes aggressive US tariff threats are often part of larger negotiations rather than immediate policy changes. Saran indicated that both domestic political shifts and bipartisan support in Congress ensure continuity of US trade goals. India can leverage its vast market to secure advantageous terms during negotiations.", "source": "Economic Times Economy", "pub_date_str": "10 Nov 2026, 06:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "10 Nov 2026, 09:12 PM IST", "total_stories": 298};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
