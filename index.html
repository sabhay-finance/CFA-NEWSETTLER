ers hoarding inventory. Even bankruptcy.\n\nFor American companies large and small, the combination of tariffs imposed under President Donald Trump 's trade policies, surging fuel prices from the Iran war and, now, rising interest rates is forcing executives to make tough choices.\n\nAllen Eden has been holding onto extra inventory for his 25-person business, the Original Saw Co. in Britt, Iowa, which makes industrial power saws for wood and metalwork, as he grapples with spiking prices for aluminum, steel and essential parts.\n\nOne example: A \"little bracket\" used for his saw motors more than doubled in price this summer, surging to $87 from $42, he said.\n\n\"It's awful,\" Eden, 56, told CNBC. \"[I'm] just trying to keep more of the stuff around because I don't know if we can get it down the road.\"\n\nIt's a three-way squeeze for businesses across manufacturing, transportation and retail: Tariffs are making raw materials and goods more expensive. Higher fuel prices are pushing up the cost of making and moving them. And rising rates are making it more expensive to finance the inventory and equipment businesses need to keep running.\n\nWhile few sectors are completely insulated from these pressures, middle-market manufacturers are caught in a particularly tight vise. Rising steel and fuel costs are forcing them to pass at least some of those expenses on through higher prices, helping feed the stubborn inflation of the past few years.\n\nBut to wrangle inflation, the Federal Reserve raised interest rates for the first time in three years and signaled another hike is possible this year. That makes it more expensive for businesses to finance inventory and borrow for growth at the same time that higher input costs and record prices for diesel , which is used for trucking, squeeze margins.", "source": "CNBC Finance", "pub_date_str": "20 Sep 2026, 06:17 PM IST", "pub_date_relative": "45m ago"}, {"title": "Ashiana Housing To Invest Rs 1,000 Crore On Land Acquisition Th full_content": "This year's Congressional Black Caucus Annual Legislative Conference , which wraps Sunday, has taken on a different feel than its usual college homecoming vibe. The event, which has drawn thousands of attendees to Washington, took on a more serious tone with briefings and conversations focused on artificial intelligence opportunities and regulation amid escalating concern about threats posed by the technology.\n\n\"I stand 100%, and so does the CBC on regulation,\" CBC Vice Chair Rep. Troy Carter (D-La.) told CNBC. \"I think we need guardrails, I think we need transparency, I think we need to prepare and protect the community from the potential ills that come with it.\"\n\nCarter said at least 60 of the 62 members of the CBC would vote for a bill to regulate artificial intelligence, creating guardrails and placing guidelines on human safety. He added that competition with China should not be a factor in any legislation.\n\n\"I'm not going to run and race with China, they're not doing it the right way. They are not protecting communities,\" he said. \"Our race should be enhanced innovation, advanced technology, while we simultaneously protect the rights of the American people.\"\n\nThe CBC is an influential group whose members include 29% of Democrats in the U.S. House. As Democrats aim to take control of the House in November's midterm election, the caucus's standing could rise.\n\nThe CBC's tackling of AI came amid the backdrop of Open AI becoming the latest company to report an incident where AI agents conducted what they call 'concerning model behavior,' It's one of a growing number of so called 'jailbreaks,' the slang term for when models bypass guidelines and perform unauthorized actions.\n\n\"The message they wanted me to bring is how we can do this in a way that protects our communities but do not put us in a position to lose in a national security race,\" said X.", "source": "CNBC World Economy", "pub_date_str": "20 Sep 2026, 06:47 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "\u2018There might be a silver lining\u2019: My friend\u2019s wife died at 60 after a high-earning career. Can he claim her Social Security?", "full_content": "\u201cThey had been married for over 30 years when she passed.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "20 Sep 2026, 06:46 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Record diesel prices are exposing pain points in the stock market and economy", "full_content": "A major risks now is that diesel prices stay high \u2014 and continue to put upward pressure on inflation.", "source": "MarketWatch Top Stories", "pub_date_str": "20 Sep 2026, 06:30 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018It's awful\u2019: How tariffs, soaring fuel costs and higher interest rates are squeezing American companies", "full_content": "Fewer, pricier flights. Freight surcharges. Manufacturers hoarding inventory. Even bankruptcy.\n\nFor American companies large and small, the combination of tariffs imposed under President Donald Trump 's trade policies, surging fuel prices from the Iran war and, now, rising interest rates is forcing executives to make tough choices.\n\nAllen Eden has been holding onto extra inventory for his 25-person business, the Original Saw Co. in Britt, Iowa, which makes industrial power saws for wood and metalwork, as he grapples with spiking prices for aluminum, steel and essential parts.\n\nOne example: A \"little bracket\" used for his saw motors more than doubled in price this summer, surging to $87 from $42, he said.\n\n\"It's awful,\" Eden, 56, told CNBC. \"[I'm] just trying to keep more of the stuff around because I don't know if we can get it down the road.\"\n\nIt's a three-way squeeze for businesses across manufacturing, transportation and retail: Tariffs are making raw materials and goods more expensive. Higher fuel prices are pushing up the cost of making and moving them. And rising rates are making it more expensive to finance the inventory and equipment businesses need to keep running.\n\nWhile few sectors are completely insulated from these pressures, middle-market manufacturers are caught in a particularly tight vise. Rising steel and fuel costs are forcing them to pass at least some of those expenses on through higher prices, helping feed the stubborn inflation of the past few years.\n\nBut to wrangle inflation, the Federal Reserve raised interest rates for the first time in three years and signaled another hike is possible this year. That makes it more expensive for businesses to finance inventory and borrow for growth at the same time that higher input costs and record prices for diesel , which is used for trucking, squeeze margins.", "source": "CNBC Finance", "pub_date_str": "20 Sep 2026, 06:17 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Ashiana Housing To Invest Rs 1,000 Crore On Land Acquisition This Fiscal", "full_content": "The proposed development will have around 20 lakh square feet of saleable area and an estimated revenue potential of Rs 1,800 crore.", "source": "NDTV Profit", "pub_date_str": "20 Sep 2026, 06:16 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Trade Setup For Sept 21: Nifty Bulls Eye Pullback From Oversold Levels; Key Resistance At 23,400", "full_content": "On the downside, 23,200 remains the immediate support for the Nifty, followed by the crucial 23,10023,070 zone.", "source": "NDTV Profit", "pub_date_str": "20 Sep 2026, 05:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold Likely To Stay Range-Bound This Week Amid Dollar, West Asia Tensions: Analysts", "full_content": "Dollar movements, bond yields, West Asia tensions and key US economic data to shape bullion prices as investors assess the interest-rate outlook.", "source": "NDTV Profit", "pub_date_str": "20 Sep 2026, 05:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "EPFO wage ceiling raised to \u20b925,000: Know the impact on contributions, pension and EDLI benefits \u2014 all FAQs answered", "full_content": "The government has raised the wage ceiling for mandatory EPFO membership from \u20b9 15,000 to \u20b9 25,000 a month.\n\nThe Ministry of Labour and Employment notified the revised ceiling under the Code on Social Security, 2020, with effect from 17 September 2026. According to the ministry, more than 51 lakh employees could come under EPFO coverage for the first time.\n\nAn EY report examining the implications of the revised wage ceiling highlighted that the change will affect several aspects of employees' retirement savings and insurance coverage. Here's what employees should know.\n\nEmployees earning monthly wages of more than \u20b9 15,000 but up to \u20b9 25,000 will now come within mandatory provident fund coverage.\n\nThe EY report noted that under the earlier ceiling, employees earning above \u20b9 15,000 could have been treated as \u201cexcluded employees\u201d if their wages exceeded the threshold when they first became eligible for EPF membership.\n\n\u201cWith the wage ceiling increasing from \u20b9 15,000 to \u20b9 25,000 per month, an employee earning wages up to \u20b9 25,000 will be mandatorily required to become a member of the Provident Fund,\u201d the report mentioned.\n\nThe revised threshold is based on \u201cwages\u201d as defined under the Code on Social Security, 2020, rather than simply the employee's gross salary.\n\nFor employees whose EPF contribution was earlier restricted to the \u20b9 15,000 ceiling, the employee contribution can increase.", "source": "LiveMint Money", "pub_date_str": "20 Sep 2026, 05:32 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Top Wall Street analysts find these 3 stocks attractive as long-term investments", "full_content": "Investors have been grappling with stock market volatility, weighing elevated oil prices, persistent geopolitical tensions, the Federal Reserve's rate hike and a debate about AI safety. For all that, it helps to look beyond short-term noise and focus on stocks with strong long-term growth potential.\n\nTop Wall Street analysts' recommendations can help investors gain clarity, as these experts conduct in-depth research to pick stocks with attractive growth prospects.\n\nHere are three stocks favored by some of Wall Street's top pros, according to TipRanks, a platform that ranks analysts based on their past performance.\n\nEnterprise software and cloud infrastructure company Oracle ( ORCL ) recently announced better-than-expected results for the first quarter of fiscal 2027. The quarter benefited from solid growth in cloud infrastructure revenue.\n\nAfter hosting a series of investor meetings with Ken Bond, Oracle head of investor relations following Q1 earnings, Guggenheim analyst John DiFucci reiterated a buy rating on the stock with a price target of $400 . Oracle remains a Guggenheim Best Idea, he said.\n\n\"We continue to believe ORCL is a decade stock, driven by the massive (and profitable) opportunity ahead for AI training and inferencing,\" said DiFucci. He also cited the traditional Public Cloud business and additional AI-enabled cloud database and cloud applications for his bullish stance. DiFucci expects all the factors to drive revenue and profit acceleration over the next few years.\n\nWhile Oracle delivered 850 MW of data center capacity in Q1 FY27, Bond cautioned that Infrastructure as a Service revenue in any quarter depends more on the timing of when that capacity comes online, than on the headline MW number. DiFucci expects IaaS growth to stay strong, with full-year growth expected above Q1 FY27's 120% constant currency rate.", "source": "CNBC Top News", "pub_date_str": "20 Sep 2026, 05:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Williams-Sonoma's stock has soared in a sluggish housing market. Here's how it won over Wall Street", "full_content": "Williams-Sonoma is one of the top-performing retail stocks of the year, despite weakness in the housing market that has dampened sales of home goods.\n\nThe company's share price had climbed about 23% year to date as of Friday, outperforming the S&P 1500 Home Furnishings index as well as competitors such as Wayfair , Arhaus , Ethan Allen and RH , formerly known as Restoration Hardware.\n\n\"We've been working on the product, we've been working on the service and the quality, but also the storytelling,\" said Williams-Sonoma CEO Laura Alber in a late August interview on CNBC's \"Mad Money. \" \"And that is also what's attracting ... many new customers to our brands, and then bringing people back to our brands.\"\n\nWilliams-Sonoma stock compared to peers and other retail giants. The traditional investing thesis around home furnishings often revolves around home sales: As people buy new homes, they also purchase new furniture. In the U.S., which accounts for 96% of Williams-Sonoma's sales, consumers face a sluggish housing market driven by high interest rates , along with rising energy and food costs.\n\nYet over a three-year period, Williams-Sonoma shares have climbed more than 200%.\n\nFixing the underlying business fundamentals has been key to the success of the company, which includes its namesake brand along with retailers such as Pottery Barn and West Elm. In 2019, the company's operating margin, which is a key measure of profitability, was 7.9%. By 2021, it reached 17.6%.\n\nAfter a Covid-fueled housing boom, the market slumped. Williams-Sonoma's sales fell accordingly, but it proved to investors that it could sustain profitability.\n\n\"They made a number of savvy moves, including reducing the amount of promotions and also optimizing their supply chain with home deliveries and, all in, they drove over 10% expansion in their EBIT [earnings before interest and taxes] margin during those tough years,\" said Peter Keith, head of consumer research at Piper Sandler.", "source": "CNBC Top News", "pub_date_str": "20 Sep 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Budget airline king Bill Franke warms to first-class seats and premium upgrades", "full_content": "SCOTTSDALE, Ariz. \u2014 For decades, William Augustus Franke , Frontier Airlines ' chairman and a serial airline investor, made a killing selling cheap plane tickets and charging fees to check bags, to pick seats and for everything else. Now, he says first-class seats and other traveler comforts are in order \u2014 at least in the United States.\n\nFrontier is planning to roll out first-class seats next year on its Airbus fleet. It's also joined a growing list of airlines adding SpaceX 's Starlink Wi-Fi on board as it seeks to return to steady profitability.\n\n\"We're not trying to have a Singapore Airlines first class,\" Franke, 89, told CNBC in late June at the model airplane-filled offices of Indigo Partners, the private equity firm he founded. \"What we're trying to do is give the consumer an option,\" he said, calling it at once upscale and competitive.\n\nThe ultra-low-cost airline model that Franke, who goes by Bill, pioneered has faced a reckoning in recent years. A jump in pilot salaries, maintenance costs and operating expenses, along with a boom in premium travel, have hit long-profitable and fast-growing budget carriers. Maintaining strong growth and keeping costs low were sacrosanct for that sector for years.\n\nAnother pillar was not giving things away for free. At the 2017 Dubai Air Show , where he made a record Airbus aircraft order for the empire of airlines he invested in, Franke likened some consumers to teenagers and \"spoiled brats,\" saying they expected to get low fares and what are now add-ons without paying for them, CNBC reported at the time.\n\n\"They had been flying with all the amenities for ever and ever and that's what they think they ought to get,\" Franke said at the time.\n\nBut since then, larger, more powerful rivals like United Airlines and Delta Air Lines have copied the model for their cheapest tickets. They've started offering bare-bones fare options and adding fees for everything else.", "source": "CNBC Top News", "pub_date_str": "20 Sep 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "How much could investing $10,000 in a CD right now earn you in one year?", "full_content": "If you have cash you can put aside for a while, a certificate of deposit , or CD, is a good way to earn a reliable return while keeping your money safe. The highest CD rates we've found reach up to 5.00% APY, though most top-tier options cluster around 4.35% to 4.50% APY.\n\nWith the Fed now in a rate-raising cycle for the first time in three years, those yields could go even higher.\n\nOne-year terms are among the most popular CDs, available at traditional banks, credit unions and fintech institutions. But not all CDs pay a competitive rate, so it's worth shopping around for an account with a rate, term, minimum deposit and early withdrawal penalty that meets your needs.\n\nThe top rate we've found is 4.45% APY on a one-year CD from EagleBank , which comes with a $1,000 minimum. USAlliance Financial is advertising a 4.36% APY on a 12-month CD with only a $500 minimum.\n\nAccounts are subject to early withdrawal fees and other conditions, which are detailed in the Truth in Savings Disclosure and Membership Agreement , Certificate Account Disclosure and Fees and Service Charges Schedule .\n\nIf you want more flexible on terms, American Express has a 4.25% APY on a 10-month CD with no minimum balance requirement.\n\nFor CDs with terms less than 12 months, the penalty is 90 days' interest on the withdrawn amount. For terms between 12 and 48 months, it's 270 days' interest. For terms between 48 and 60 months, it's 365 days' interest. For terms of 60 months or more, the penalty is 540 days' interest.\n\nThe current average APY for a one-year CD is 1.71% , according to the Federal Deposit Insurance Corporation, which guarantees deposits at commercial banks.", "source": "CNBC Top News", "pub_date_str": "20 Sep 2026, 05:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Caruso-Cabrera: The investing tailwinds for Latin America are the best in decades", "full_content": "As measured by the iShares Latin America 40 ETF (ILF) , the region is handily beating the S&P 500 year to date, up 15% compared to the S&P's 11% move. It's up more than 70% since late 2024.\n\nIn a new report from Citi, Chief Latin America Economist Ernesto Revilla answers with a qualified yes \u2014 only if the countries seize the moment.\n\n\"Latin America is poised for take-off. Or to be more precise: the conditions for Latin America to achieve a higher rate of growth are the best they have been in decades, and it is time to capitalize on the opportunity,\" wrote Revilla.\n\niShares Latin America 40 ETF (ILF) vs. the S&P 500, YTD The tailwinds helping the region are the best in decades: a weak dollar, strong commodities, favorable geo-politics, and a wave of elections that have brought pro-business and pro-reform leaders to power. The most important factor in the region's success is the weaker dollar, said Revilla.\n\nInvestors seek out \"stronger currencies and returns, debt repayment is cheaper (because they borrow in dollars) and commodity prices move higher.\" Add modern and mature central banking which is far better at controlling inflation than in decades past.\n\nReal rates in Latin America are some of the highest in the world leading to carry levels as high as 10% in Brazil, the report highlights. That attracts fixed income and foreign exchange inflows.", "source": "CNBC Top News", "pub_date_str": "20 Sep 2026, 05:29 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold price prediction: Will US-Iran war, crude oil rates impact yellow metal rates? Check technical outlook", "full_content": "Gold is expected to remain highly sensitive to movements in Treasury yields, the US dollar and inflation data, as well as further signals on the pace and timing of additional tightening.", "source": "LiveMint Markets", "pub_date_str": "20 Sep 2026, 05:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Inflation Bites US Households: Mortgage Rates Jump 7% At 19-Month High Following Fed Rate Hike", "full_content": "The increase in mortgage rates comes as inflation remains elevated and log-term bond yields have risen, factors that can influence the cost of home loans. Home shoppers holding out for relief from rising mortgage rates may be in for a long wait.", "source": "NDTV Profit", "pub_date_str": "20 Sep 2026, 05:03 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "These 3 factors \"remain significant risks\" to stock market valuations: analyst", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Sep 2026, 04:49 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Monday", "full_content": "Indian equities extended their recovery, with Nifty gaining 0.33% as moderation in crude and global yields supported sentiment. Sensex slipped 0.03%, while broader markets outperformed. Here are 10 key factors that could influence Friday\u2019s market action.", "source": "Economic Times Markets", "pub_date_str": "20 Sep 2026, 04:48 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SME IPO: Liqvd Digital India issue to open on Sep 23; price band fixed at Rs 51-54", "full_content": "Liqvd Digital India is gearing up for its Rs 39-crore initial public offering, set to open for subscription on September 23. With a price range between Rs 51 and Rs 54 per equity share, this three-day offer will wrap up on September 25, allowing shares to be listed on the BSE SME platform. The funds will be directed towards acquiring a video content production hub.", "source": "Economic Times Markets", "pub_date_str": "20 Sep 2026, 04:44 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold likely to stay range-bound next week as dollar, West Asia tensions guide market: Analysts", "full_content": "After a week dominated by monetary policy and geopolitical developments, investors will turn their focus to a fresh batch of economic data, including mid-month manufacturing and services Purchasing Managers' Index (PMI readings) from major economies.", "source": "Economic Times Markets", "pub_date_str": "20 Sep 2026, 04:42 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "20 Sep 2026, 07:03 PM IST", "total_stories": 364};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
