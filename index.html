orces behind this convergence, with openness being central to that success. Integration into European and global value chains supported productivity, while foreign direct investment accelerated capital accumulation and technology transfer. [ 2 ]\n\nYet the same openness that enabled convergence has also exposed CEE countries to repeated shocks. In the space of just a few years, Europe has faced a pandemic, Russia\u2019s unjustified war against Ukraine, an unprecedented energy shock, disruptions to global supply chains and, more recently, renewed trade tensions and conflict in the Middle East.\n\nThese developments have placed economic resilience at the centre of the policy debate. And central and eastern Europe provides a particularly useful lens through which to think about what resilience means.\n\nThe experience of CEE economies provides valuable lessons for Europe as a whole. It shows us that openness and resilience are not opposites. In fact, integration can be a source of resilience through diversifying markets, suppliers and sources of financing. The question then is how to preserve the benefits of integration while strengthening our capacity to withstand and adapt to shocks.\n\nSo what actually makes an economy resilient? Resilience is not about avoiding shocks altogether \u2013 no economy can do that. Nor does it mean trying to become self-sufficient.", "source": "ECB Press", "pub_date_str": "24 Nov 2026, 04:30 PM IST", "pub_date_relative": "10m ago"}, {"title": "Nasdaq futures turn lower after Nvidia rally as Jensen Huang returns: Live updates", "full_content": "U.S. stock futures fell on Tuesday morning after Jensen Huang's return as Nvidia CEO sent the chipmaker's shares soaring and sparked a rebound in the artificial intelligence trade in the previous session.\n\nNasdaq-100 futures were 1.61% lower, reversing earlier gains, while Dow Jones Industrial Average futures were down 0.34%. S&P 500 futures fell 0.75%.\n\nNvidia surged 31% during Monday's regular session, leading a rally in chip stocks. In pre-market trading on Tuesday, the stock shed more than 3%.\n\nTom Hulick, CEO of Strategy Asset Managers, told CNBC 's \"Squawk Box Europe\" on Tuesday that Huang was probably the right person to lead Nvidia \"for now.\"\n\nHowever, he added that the company still has \"a lot of things to worry about\" regarding corporate governance.\n\nThe Nasdaq Composite closed 6.5% higher on Monday, while the S&P 500 finished up 4.7% and the Dow Industrials rose 3%.\n\nIt was the best session for the Nasdaq and the S&P 500 since April 9, 2025, when President Donald Trump announced a reprieve on tariffs.\n\nThe tech sector of the S&P 500 soared 9%, powered by sharp gains in semiconductors, memory names and neoclouds. Advanced Micro Devices added almost 7%, while Micron Technology surged 19%. Neocloud stock CoreWeave jumped 22%.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:27 PM IST", "pub_date_relative": "12m ago"}, {"title": "Jensen Huang is \u2018too big to fire,\u2019 putting Nvidia\u2019s governance in focus: analysts", "full_content": "Jensen Huang 's return as Nvidia CEO may have eased concerns over the chipmaker's leadership, but it has also brought renewed scrutiny to the company's corporate governance and its reliance on its founder.\n\nHuang's abrupt departure and unexpected reinstatement exposed a deeper vulnerability at the heart of Nvidia, industry experts told CNBC, raising questions about board oversight and succession planning.\n\n\"What does it mean if you have a company too big to fail or a CEO too big to fire?\" Angela Mancini, head of advisory for global risk insights at Dow Jones, told CNBC's \"Squawk Box Asia \" on Tuesday.\n\nMancini pointed to Huang's unusually large number of direct reports as another sign of how heavily Nvidia depends on its founder.\n\n\"What does it mean when someone has 60 direct reports, and you literally are in a situation where you feel like you can't fire them?\" she added.\n\nNvidia's market cap ballooned from $3 trillion on Friday to almost $4 trillion on Tuesday after Huang was reinstated. \"That is what you'd call a founder premium,\" Yang Wang, a principal analyst at Counterpoint Research, told CNBC's \"Squawk Box Europe.\"\n\n\"The reaction has been staggering,\" Wang said. \"But is this level of dependence healthy?\"\n\nFor Nvidia, Huang's return offers an opportunity to address some of the governance issues brought to light by his departure.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:26 PM IST", "pub_date_relative": "13m ago"}, {"title": "After Tame Wellington Draw, Here's What India Can Expect From Christchurch Pitch", "full_content": "With head groundman Jayden Tohill unwell, second-in-command Ash Head is overseeing the preparations, and he has said the pitch will offer a traditional Hagley Oval experience.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:24 PM IST", "pub_date_relative": "15m ago"}, {"title": "Nvidia stock falls 5% premarket; Goldman says Huang\u2019s return not a clearing event", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:22 PM IST", "pub_date_relative": "17m ago"}, {"title": "'Couldn't Have Afforded': Ayan Mukerji On Why Brahmastra Sequels Weren't Filmed Together", "full_content": "Ayan Mukerji has revealed that financial constraints prevented the team from filming Brahmastra Part 2 alongside the first instalment.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:22 PM IST", "pub_date_relative": "17m ago"}, {"title": "Viral Video Shows Crowd Rushing For Hot Wheels At Hyderabad Mall; Collectors Say 'Hobby Is Ruined'", "full_content": "Many social media users blamed scalpers, who buy collectibles in bulk to resell them at higher prices to genuine collectors. Others called the scenes embarrassing.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:21 PM IST", "pub_date_relative": "18m ago"}, {"title": "31.5% surge in Nvidia share adds $34 billion to Jensen Huang's wealth in a day; what's his net worth now?", "full_content": "WORTHPERI A Ksheerasagar Published 24 Nov 2026, 04:20 PM IST Prefer Livemint on Google In a dramatic turn of events, Jensen Huang is back as Nvidia's CEO, just eleven days after the co-founder announced his resignation. His return triggered a massive surge in the stock and added nearly $34 billion to his personal wealth .\n\nThe board on Monday voted unanimously to reinstate Huang as president, chief executive and board member after a series of meetings left directors satisfied with his \"candour and ability to lead\", the board said in a surprise statement.\n\n\"The board believes Jensen is the right person to lead Nvidia and that his reinstatement is in the best interests of our stockholders, employees, partners and customers,\" Chairman Harvey C. Jones said in the statement.\n\nNews of Huang's return triggered a historic rally in Nvidia shares. The stock climbed 31.5% to $165.05 in New York, marking its biggest single-day surge since May 2003. Before the gain, the stock had fallen by about a third this year, erasing approximately $1.5 trillion in market value.\n\nNvidia's sharp rebound also lifted several AI-linked stocks, including Micron Technology, which surged 19%. It was followed by Intel, Advanced Micro Devices (AMD), Qualcomm, Sandisk and Oracle, all of which closed, with gains of up to 18%.\n\nThe rally also powered the Nasdaq to surge 5.8%, the biggest one-day percentage gain since April 2025, after the index suffered its worst weekly performance since 2020.\n\nThe board's decision to bring Huang back came after US intelligence services reportedly concluded that he had passed information to Beijing, an allegation that China has denied.\n\nHuang appeared at the company's offices in Santa Clara, California, on Monday, drawing applause and cheers from employees, who shared videos of his return online. He briefly addressed employees at one of the entrances.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 04:20 PM IST", "pub_date_relative": "19m ago"}, {"title": "Xiaomi profit misses Q3 forecasts as EV and smartphone sales shrink", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:20 PM IST", "pub_date_relative": "19m ago"}, {"title": "Drugmaker Insmed shares rally 14% after Sanofi agrees to buy it in pharma\u2019s biggest deal in three years", "full_content": "Insmed shares rallied 14% in premarket trading Tuesday after Sanofi announced it would buy the smaller drugmaker for $41 billion, marking the largest pharma deal since 2023.\n\nThe acquisition includes Insmed's portfolio of two commercialized respiratory drugs as well as its pipeline of experimental candidates. Sanofi will pay $175 per share in cash.\n\nIt's a big bet by new Sanofi CEO Belen Garijo, who took up the role in May to steer the company through its upcoming patent cliff , when its blockbuster immunology drug Dupixent will face generic competition as patents expire.\n\nIf closed, the transaction will be the biggest one the industry has seen since Pfizer bought Seagen for $43 billion in December 2023.\n\nInsmed shares rose 14.6% to $170.86 in early premarket trading, while Sanofi stock rose 6% in Paris.\n\nBarclays analysts called the deal a \"breath of fresh air,\" significantly improving Sanofi's Dupixent patent expiry outlook by adding Insmed's established respiratory assets Brinsupri and Arikayce, plus a late-stage pipeline offering further potential upside.\n\nLike much of the industry, Sanofi faces a revenue drop towards the end of the decade as top-selling drugs lose exclusivity and open up for generic drugmakers to compete.\n\nGlobal biopharma has experienced a sharp uptick in deals in 2026 , as the sector is driven by looming patent cliffs, newly buoyant public markets, and a race to beef up pipelines. Following a post-pandemic trough in 2022, M&A activity surged in 2025 and has accelerated into 2026.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:20 PM IST", "pub_date_relative": "20m ago"}, {"title": "Oil prices subdued amid improving supplies, Mideast disruption fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:19 PM IST", "pub_date_relative": "20m ago"}, {"title": "Kingsoft Cloud earnings beat by \u00a50.20, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:19 PM IST", "pub_date_relative": "21m ago"}, {"title": "Molten Ventures H1 FY27 slides: NAV jumps 15% on portfolio gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:19 PM IST", "pub_date_relative": "21m ago"}, {"title": "Citizens reiterates Resideo Technologies stock rating after conference", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:18 PM IST", "pub_date_relative": "21m ago"}, {"title": "Pentagon in talks with General Motors and Ford on military drones, WSJ reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:18 PM IST", "pub_date_relative": "21m ago"}, {"title": "Kingsoft Cloud beats Q3 estimates on strong AI cloud growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:18 PM IST", "pub_date_relative": "22m ago"}, {"title": "Westrock Coffee CFO Thomas Pledger buys $24,519 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:16 PM IST", "pub_date_relative": "24m ago"}, {"title": "Nvidia shares fall over 5% in premarket after Huang comeback rally", "full_content": "Nvidia shares fell on Tuesday after the return of Jensen Huang as CEO sparked a massive rally on Monday.\n\nNvidia shares were down 5.4% in premarket trading as of 5:44 a.m. ET.\n\nOther U.S. semiconductor stocks were also lower in premarket trading on Tuesday, with Micron , Marvell Technology , AMD and Arm all down over 3%.\n\nHuang, who resigned as CEO of Nvidia earlier this month after admitting to an extramarital affair, was reinstated on Monday. The stock closed 30% higher following the news.\n\nThe company's board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him.\n\nPresident Donald Trump also claimed he was personally involved in Huang's return. The president told CNBC that he spoke with the chip maker's board before it reversed course and reinstated its co-founder.\n\n\"I made the deal,\" Trump told CNBC's Eamon Javers during an interview on \"Squawk on the Street.\"\n\nTrump said Nvidia's board asked for guarantees that Huang, who resigned less than two weeks ago, was not a threat to national security.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:15 PM IST", "pub_date_relative": "24m ago"}, {"title": "Planning to retire in a smaller city? 5 things you should consider before moving away from a metro after retirement", "full_content": "Retiring in a smaller city may seem like an easy way to stretch your retirement savings. Lower rents, cheaper housing and reduced commuting expenses can make life more affordable than in a metro. However, moving to a smaller city does not necessarily mean you can retire with a substantially smaller corpus.\n\nThe bigger challenge is accounting for inflation, rising healthcare expenses and the possibility of living 25-30 years after retirement. A retirement plan that looks sufficient today may fall short when everyday expenses increase over the next few decades.\n\nFor instance, a 30-year-old spending \u20b9 1 lakh a month today would need approximately \u20b9 5.7 lakh a month at age 60 to maintain the same lifestyle, assuming annual inflation of 6%. This translates into annual expenses of nearly \u20b9 68.9 lakh at retirement.\n\nThe illustration, shared by Ashok Manwani, vice-president of products at Go Digit Life Insurance, highlights why retirement planning should begin with present spending and future inflation rather than simply the cost of living in the city where one intends to settle.\n\nOne of the biggest attractions of retiring in a smaller city is the possibility of spending less on housing. Retirees who own a home or move to a less expensive location may save considerably on rent, property costs and daily commuting.\n\nHowever, healthcare, medicines, travel and other essential expenses can still take up a significant portion of the retirement budget. Retirees may also need to travel frequently to larger cities for specialised medical treatment or to visit children living elsewhere.\n\nThis means that retirement planning should account for the actual cost of living in the chosen city rather than assume that every expense will fall after relocation.\n\nInflation is one of the biggest risks to retirement savings because expenses continue to rise even after regular employment income stops.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 04:14 PM IST", "pub_date_relative": "25m ago"}, {"title": "Cine Body Urges PM To Ban Netflix's Pakistani Series 'Jo Bachay Hain Sang Samait Lo' In India", "full_content": "Fawad Khan and Mahira Khan headline Netflix's Pakistani series Bachay Hain Sang Samait Lo, which follows three generations and six love stories based on Farhat Ishtiaq's bestselling Urdu novel.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:13 PM IST", "pub_date_relative": "27m ago"}, {"title": "Wells Fargo cuts HP Enterprise stock price target on margin pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:12 PM IST", "pub_date_relative": "27m ago"}, {"title": "Ionic Wealth Announces Rs 117 Crore Fundraise From Angel One To Ramp Up Growth", "full_content": "The company said it will focus on strengthening its portfolio-led proposition and its global capabilities.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:08 PM IST", "pub_date_relative": "31m ago"}, {"title": "East Bengal vs Al Hussein Live Streaming: Likely Lineups; How To Watch ACL Two Match On TV, Online?", "full_content": "East Bengal need a win against the Jordanian side to keep their hopes of reaching the AFC Champions League Two knockout stage alive.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:07 PM IST", "pub_date_relative": "32m ago"}, {"title": "Silver price crash: Rates today in India down \u20b91 lakh in 3 months! Recovery or more fall ahead for MCX silver futures?", "full_content": "Silver Price Today: Silver rate today in India is around \u20b9 1,54,000 per kg after a strong rebound of over \u20b9 6,000 on Monday. Barring this rebound, the precious white metal price in India was around \u20b9 1 lakh below the August 2026 high of around \u20b9 2.50 lakh per kg, which means the silver rate today in India is down by around \u20b9 1 lakh in three months. US bond yields sustaining at higher levels, a strong US Dollar (USD) against the major six global currencies, buzz for a US Fed rate hike, and appreciation in the Indian Rupee are some of the major reasons for the silver price crash in India.\n\nAccording to market experts, the silver rate today in India has crucial support at \u20b9 1,40,000. Breaking below this support on a closing basis would mean further downside towards \u20b9 1,20,000 and \u20b9 1,00,000 per kg. In the international market, silver price today has crucial support placed at $38/oz. Breaking below this support would open the downside probability of $34/oz and $30/oz. They said that silver prices would be considered bottomed out if they break above \u20b9 1,90,000 per kg in the Indian market and above $52/oz in the international market.\n\nHighlighting the reasons for the silver price crash, Anuj Gupta, a SEBI-registered market expert, said, \u201cThe downside trend in the MCX silver rates and the COMEX silver price today can be attributed to these three reasons: US bond yields sustaining at elevated levels; Indian Rupee appreciating against the US Dollar (USD) from around 98 to 92.50 levels, and buzz for the US Fed rate hike.\u201d\n\nPointing towards the Indian Rupee's appreciation, Anuj Gupta said, \u201cThe Indian Rupee has ascended from around 98 per USD levels to around 92.50 per USD levels in the last three months.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 04:03 PM IST", "pub_date_relative": "37m ago"}, {"title": "Alibaba's $4.2 Bn Deal Lands Its Singapore Unit On US Blacklist. Here's The Link To Nvidia Scandal", "full_content": "The US has added Megaspeed, an Alibaba subsidiary and five other companies to its trade blacklist over suspected attempts to divert restricted Nvidia AI chips to China.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:02 PM IST", "pub_date_relative": "38m ago"}, {"title": "India vs China Live Streaming: When And Where To Watch Women's Asian Champions Trophy Match?", "full_content": "India face China in the Women's Asian Champions Trophy 2026 on November 24. Check the match timing, venue and live streaming details in India.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:00 PM IST", "pub_date_relative": "40m ago"}, {"title": "EPFO may let employees deposit PF money directly via UAN beyond 12% mandate: What the proposal means for you?", "full_content": "In the 240th meeting of the Central Board of Trustees (CBT), Employees\u2019 Provident Fund (EPF) chaired by Mansukh Mandaviya , Union Minister for Labour & Employment and Youth Affairs & Sports, a proposal was made to introduce \"UAN-linked mechanisms for direct voluntary contributions and third-party micro-contributions (such as customer tips),\" which will be \"completely independent of traditional employer payroll systems\" to the EPFO accounts so that employees can earn interests on these incomes as well.\n\nOnce the ministry approves of the same, the necessary amendments to the EPF scheme will be notified accordingly.\n\nWhile more details on this proposal and how it develops will be notified subject to approval. this means that those with UAN accounts will now be able to deposit their spare money in their EPF accounts and earn interests on the same, with there being no involvement of their employers.\n\nNo decision has yet been made on how much taxes these deposits are set to attract.\n\n\"The proposal for a corresponding amendment in the Income Tax Act is being taken up with the Ministry of Finance,\" the Labour Ministry's release said.\n\nWhile making voluntary contributions to your PF account is not something new, earlier this went through one's employer and there was no facility to deposit money directly into your PF account.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 03:55 PM IST", "pub_date_relative": "45m ago"}, {"title": "Claude Ship: All About Anthropic\u2019s New Tool To Ship Code Faster", "full_content": "Anthropic's new Claude Ship tool aims to speed up software development by identifying code errors, addressing reviewer feedback, and managing approvals.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:53 PM IST", "pub_date_relative": "46m ago"}, {"title": "Only 3% Of India's Gas Is Traded On Exchanges. A New Plan Reportedly Aims To Change That", "full_content": "Investors can trade in petroleum products that are not currently available for such purposes like gas, aviation turbine fuel (ATF) and naptha.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:51 PM IST", "pub_date_relative": "48m ago"}, {"title": "China extends pause in controls on critical mineral exports to US", "full_content": "Beijing\u2019s dominance of supply chains has given it leverage against Washington", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 03:51 PM IST", "pub_date_relative": "49m ago"}, {"title": "PM YASASVI Scholarship: Rs 1.25 Lakh Annual Aid For Students, Check Who Can Apply", "full_content": "The Ministry of Social Justice and Empowerment's scheme provides financial assistance to eligible OBC, EBC and DNT students studying in identified schools.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:50 PM IST", "pub_date_relative": "50m ago"}, {"title": "Farm Law Ghost No More? Why BJP, Akalis Have Tied Up, And What It Means For Punjab Elections 2027", "full_content": "Ten years after losing power, and six years after ending their alliance, two of the oldest NDA partners have joined hands to contest the Punjab polls. Now, the voters will decide if they intend to bring the Badal-BJP combine back to power.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:46 PM IST", "pub_date_relative": "54m ago"}, {"title": "I\u2019m in my 70s and buying a new BMW X1. Should I put my only son on the title?", "full_content": "\u201cGiven my age, I never make a major new purchase without thinking about the future.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:45 PM IST", "pub_date_relative": "55m ago"}, {"title": "Ousted BP chair Albert Manifold to join Aggreko board after IPO", "full_content": "Manifold responds to bullying allegations levelled against him and calls them \u2018lies\u2019", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 03:42 PM IST", "pub_date_relative": "57m ago"}, {"title": "Zendaya and Tom Holland buy a home on 1 acre in London for $10 million", "full_content": "Tom Holland and Zendaya may make London their primary residence after splashing out $10 million on a palatial pad across the pond.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Aakasamlo Oka Tara Box Office Collection Day 5: Dulquer Salmaan's Film Crosses Rs 20 Crore Gross In India", "full_content": "Championing girls' education and ambition, the film follows a supportive husband striving to help his young wife fulfil her dreams.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:29 PM IST", "pub_date_relative": "1h ago"}, {"title": "Here\u2019s your chance to bid on Alex Trebek\u2019s former $6.45 million California ranch and winery", "full_content": "A sprawling California ranch where Alex Trebek helped run a winery is heading to auction, giving buyers a chance to purchase nearly 578 acres of the Central Coast once owned by the longtime \u201cJeopardy!\u201d host.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "The bull and bear surprises that could ambush investors next year, according to Bank of America", "full_content": "Michael Hartnett\u2019s tactical masterplan is to stay risk off until global rate hikes start to dry up next spring. Thereafter, modest earnings growth and the chance of looser financial conditions in the second half favor owning cyclicals and adding more risk.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sanofi strikes $41bn deal as patent cliff looms - Financial Times", "full_content": "Sanofi strikes $41bn deal as patent cliff looms Financial Times Drugmaker Insmed shares rally 14% after Sanofi agrees to buy it in pharma\u2019s biggest deal in three years CNBC Sanofi Strikes $41 Billion Deal to Buy U.S. Drugmaker Insmed WSJ Sanofi to buy Insmed for $41B as efforts to navigate Dupixent patent cliff ramp up FirstWord Pharma Sanofi strikes $41 billion deal for Insmed as CEO Garijo makes her mark Reuters", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "CM Punk Betrayed By Cody Rhodes? Seth Rollins' WWE Return Sparks Tension On Raw", "full_content": "Team USA's lineup is complete, but Punk's reaction to Rollins' inclusion has raised questions ahead of Survivor Series.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "MeitY Revises Local Content Rules For Laptops, PCs, Servers In Govt Purchases; Motherboard Assembly Must Be Done In India", "full_content": "The new rules give weight to in-house R&D, Indian design and intellectual property, and introduce a standard format for companies to certify their local value addition.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "How Nvidia stock skyrocketing 31% will change risk-return outlook for mutual funds? Experts weigh in as Jensen returns", "full_content": "Nvidia's board unanimously reinstated Jensen Huang as president, CEO and board director on Monday, 23 November, 11 days after his resignation following reports of an extramarital affair and alleged links to a Chinese intelligence spy.\n\nThe board said its decision followed discussions with Huang and input from senior US government officials. However, its investigation into the matter will continue.\n\nThe development triggered a sharp recovery in Nvidia shares. According to Yahoo Finance , Nvidia Corporation closed at $165.05 on 23 November, up 31.48%. Currently, the stock is trading at $162.68, down 1.44% (3:46 am EST on 24 November; 2:16 pm IST on 24 November).\n\nThe sharp rebound could also influence mutual funds holding Nvidia directly or through US indices. But how much could retail investors benefit, and should they consider investing in these funds after the rally? Here's what experts say.\n\nThe list includes passive international funds such as Mirae Asset S&P 500 Top 50 ETF, Mirae Asset NYSE FANG+ ETF and Motilal Oswal NASDAQ 100 ETF, alongside actively managed schemes such as Edelweiss Technology Fund, Franklin India Technology Fund, Axis Innovation Fund and ABSL International Equity Fund.\n\n*Source: Value Research, Allocation as on 31 October 2026, Direct plans\n\nRahul Jain, Director \u2013 Advisory Business & Head of Research & Products, International Money Matters (IMMPL), said, \u201cThe effect on a fund depends almost entirely on how much Nvidia it owns. At roughly 12%, the Mirae Asset S&P 500 Top 50 ETF gains close to 3.7% of NAV from the move, and the NASDAQ 100 funds, at around 8%, about 2.5%.\u201d\n\nFor instance, a 12.12% allocation translates into a 3.82% NAV contribution. This means a potential gain of \u20b9 3.82 for every \u20b9 100 invested, solely from Nvidia's rally.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 03:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia Bears Lost Up To 92% In A Single Day. Here\u2019s What Happened When Jensen Huang Returned", "full_content": "Nvidia's 31.5% rally on Monday sent leveraged inverse products plunging as much as 92%. Short sellers also faced estimated paper losses of $12.2 billion.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Chinese Social Media Has A Theory About Why Jensen Huang Really Left Nvidia, And It Involves GTA 6", "full_content": "Chinese social media users are joking that Jensen Huang took a two-week break from Nvidia to play GTA 6, as his return as CEO sparks celebrations and memes across Weibo.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 03:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Asian tech stocks recover from \u2018collateral damage\u2019 of Jensen Huang\u2019s departure", "full_content": "Asian technology stocks jumped on Tuesday as investors piled back into the sector, after Nvidia reinstated Jensen Huang as CEO.\n\nKey Nvidia partners and suppliers in Asia saw their shares skyrocket. Taiwan's TSMC, a critical partner to the U.S. chip giant, surged 9.85%, with Hon Hai Precision Industry \u2014 known also as Foxconn \u2014 up by 9.95%. Nvidia partner Mediatek also spiked 9.91%. Taipei's stock exchange has a daily price limit of 10% for stocks.\n\n\"Jensen's return is particularly welcome for Asian technology stocks, many of which suffered collateral damage from Nvidia's leadership crisis,\" Charu Chanana, chief investment strategist at Saxo, said in a note Tuesday morning.\n\nThe recovery will likely favor established companies with visible orders, strong balance sheets and pricing power, compared to those who rely on \"years of uninterrupted AI spending,\" Chanana added.\n\nIn South Korea, Nvidia suppliers Samsung Electronics and SK Hynix jumped 6.7% each. The two companies, which together make up over 40% of the Kospi's weighting, sent the index up over 6%. South Korea's LG Electronics soared 15.86%.\n\nThe rise in the index triggered the Korea Exchange's sidecar on the index early in the day, reportedly making it the 100th sidecar the KRX has activated. Japan's Softbank Group Corp , a major investor in the chip space, climbed over 8% before paring gains to 4.66%.\n\nSemiconductor test company Advantest , as well as counterpart Tokyo Electron , jumped 12% and 7%, respectively. Both companies are collaborators with Nvidia.\n\nThe exuberance did not follow into European markets at the open, with the region's technology sector down 0.3% in early deals, weighing on a broader 0.14% rise in the benchmark Stoxx 600 index. Europe's tech index popped more than 5% on Monday.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 03:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia stock falls after epic rally on Jensen Huang's return as CEO - Yahoo Finance", "full_content": "Nvidia stock falls after epic rally on Jensen Huang's return as CEO Yahoo Finance Nvidia Surge Crushes Short-Leveraged Funds With Losses Up to 92% Bloomberg.com The leveraged short Nvidia ETFs have just blown up Financial Times Nvidia bears face $12.2 billion hit on Huang's surprise return Reuters Short sellers get smoked as Nvidia tallies biggest one-day gain in stock-market history MarketWatch", "source": "Google News Business", "pub_date_str": "24 Nov 2026, 03:15 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Nvidia Party Over? 3 Reasons Why US Stock Market Futures Are Falling After Monster Rally", "full_content": "US stock futures slipped after Monday's AI-fuelled rally, with semiconductor stocks retreating, Nvidia losing momentum in pre-market trade and investors booking profits.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:32 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nasdaq futures turn lower after Nvidia rally as Jensen Huang returns: Live updates", "full_content": "U.S. stock futures fell on Tuesday morning after Jensen Huang's return as Nvidia CEO sent the chipmaker's shares soaring and sparked a rebound in the artificial intelligence trade in the previous session.\n\nNasdaq-100 futures were 1.61% lower, reversing earlier gains, while Dow Jones Industrial Average futures were down 0.34%. S&P 500 futures fell 0.75%.\n\nNvidia surged 31% during Monday's regular session, leading a rally in chip stocks. In pre-market trading on Tuesday, the stock shed more than 3%.\n\nTom Hulick, CEO of Strategy Asset Managers, told CNBC 's \"Squawk Box Europe\" on Tuesday that Huang was probably the right person to lead Nvidia \"for now.\"\n\nHowever, he added that the company still has \"a lot of things to worry about\" regarding corporate governance.\n\nThe Nasdaq Composite closed 6.5% higher on Monday, while the S&P 500 finished up 4.7% and the Dow Industrials rose 3%.\n\nIt was the best session for the Nasdaq and the S&P 500 since April 9, 2025, when President Donald Trump announced a reprieve on tariffs.\n\nThe tech sector of the S&P 500 soared 9%, powered by sharp gains in semiconductors, memory names and neoclouds. Advanced Micro Devices added almost 7%, while Micron Technology surged 19%. Neocloud stock CoreWeave jumped 22%.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:27 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Jensen Huang is \u2018too big to fire,\u2019 putting Nvidia\u2019s governance in focus: analysts", "full_content": "Jensen Huang 's return as Nvidia CEO may have eased concerns over the chipmaker's leadership, but it has also brought renewed scrutiny to the company's corporate governance and its reliance on its founder.\n\nHuang's abrupt departure and unexpected reinstatement exposed a deeper vulnerability at the heart of Nvidia, industry experts told CNBC, raising questions about board oversight and succession planning.\n\n\"What does it mean if you have a company too big to fail or a CEO too big to fire?\" Angela Mancini, head of advisory for global risk insights at Dow Jones, told CNBC's \"Squawk Box Asia \" on Tuesday.\n\nMancini pointed to Huang's unusually large number of direct reports as another sign of how heavily Nvidia depends on its founder.\n\n\"What does it mean when someone has 60 direct reports, and you literally are in a situation where you feel like you can't fire them?\" she added.\n\nNvidia's market cap ballooned from $3 trillion on Friday to almost $4 trillion on Tuesday after Huang was reinstated. \"That is what you'd call a founder premium,\" Yang Wang, a principal analyst at Counterpoint Research, told CNBC's \"Squawk Box Europe.\"\n\n\"The reaction has been staggering,\" Wang said. \"But is this level of dependence healthy?\"\n\nFor Nvidia, Huang's return offers an opportunity to address some of the governance issues brought to light by his departure.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:26 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "31.5% surge in Nvidia share adds $34 billion to Jensen Huang's wealth in a day; what's his net worth now?", "full_content": "WORTHPERI A Ksheerasagar Published 24 Nov 2026, 04:20 PM IST Prefer Livemint on Google In a dramatic turn of events, Jensen Huang is back as Nvidia's CEO, just eleven days after the co-founder announced his resignation. His return triggered a massive surge in the stock and added nearly $34 billion to his personal wealth .\n\nThe board on Monday voted unanimously to reinstate Huang as president, chief executive and board member after a series of meetings left directors satisfied with his \"candour and ability to lead\", the board said in a surprise statement.\n\n\"The board believes Jensen is the right person to lead Nvidia and that his reinstatement is in the best interests of our stockholders, employees, partners and customers,\" Chairman Harvey C. Jones said in the statement.\n\nNews of Huang's return triggered a historic rally in Nvidia shares. The stock climbed 31.5% to $165.05 in New York, marking its biggest single-day surge since May 2003. Before the gain, the stock had fallen by about a third this year, erasing approximately $1.5 trillion in market value.\n\nNvidia's sharp rebound also lifted several AI-linked stocks, including Micron Technology, which surged 19%. It was followed by Intel, Advanced Micro Devices (AMD), Qualcomm, Sandisk and Oracle, all of which closed, with gains of up to 18%.\n\nThe rally also powered the Nasdaq to surge 5.8%, the biggest one-day percentage gain since April 2025, after the index suffered its worst weekly performance since 2020.\n\nThe board's decision to bring Huang back came after US intelligence services reportedly concluded that he had passed information to Beijing, an allegation that China has denied.\n\nHuang appeared at the company's offices in Santa Clara, California, on Monday, drawing applause and cheers from employees, who shared videos of his return online. He briefly addressed employees at one of the entrances.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 04:20 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Xiaomi profit misses Q3 forecasts as EV and smartphone sales shrink", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:20 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Drugmaker Insmed shares rally 14% after Sanofi agrees to buy it in pharma\u2019s biggest deal in three years", "full_content": "Insmed shares rallied 14% in premarket trading Tuesday after Sanofi announced it would buy the smaller drugmaker for $41 billion, marking the largest pharma deal since 2023.\n\nThe acquisition includes Insmed's portfolio of two commercialized respiratory drugs as well as its pipeline of experimental candidates. Sanofi will pay $175 per share in cash.\n\nIt's a big bet by new Sanofi CEO Belen Garijo, who took up the role in May to steer the company through its upcoming patent cliff , when its blockbuster immunology drug Dupixent will face generic competition as patents expire.\n\nIf closed, the transaction will be the biggest one the industry has seen since Pfizer bought Seagen for $43 billion in December 2023.\n\nInsmed shares rose 14.6% to $170.86 in early premarket trading, while Sanofi stock rose 6% in Paris.\n\nBarclays analysts called the deal a \"breath of fresh air,\" significantly improving Sanofi's Dupixent patent expiry outlook by adding Insmed's established respiratory assets Brinsupri and Arikayce, plus a late-stage pipeline offering further potential upside.\n\nLike much of the industry, Sanofi faces a revenue drop towards the end of the decade as top-selling drugs lose exclusivity and open up for generic drugmakers to compete.\n\nGlobal biopharma has experienced a sharp uptick in deals in 2026 , as the sector is driven by looming patent cliffs, newly buoyant public markets, and a race to beef up pipelines. Following a post-pandemic trough in 2022, M&A activity surged in 2025 and has accelerated into 2026.", "source": "CNBC Top News", "pub_date_str": "24 Nov 2026, 04:20 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Derivatives", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kingsoft Cloud earnings beat by \u00a50.20, revenue topped estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:19 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Molten Ventures H1 FY27 slides: NAV jumps 15% on portfolio gains", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Nov 2026, 04:19 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Nvidia shares fall over 5% in premarket after Huang comeback rally", "full_content": "Nvidia shares fell on Tuesday after the return of Jensen Huang as CEO sparked a massive rally on Monday.\n\nNvidia shares were down 5.4% in premarket trading as of 5:44 a.m. ET.\n\nOther U.S. semiconductor stocks were also lower in premarket trading on Tuesday, with Micron , Marvell Technology , AMD and Arm all down over 3%.\n\nHuang, who resigned as CEO of Nvidia earlier this month after admitting to an extramarital affair, was reinstated on Monday. The stock closed 30% higher following the news.\n\nThe company's board of directors said it unanimously voted to reinstate Huang following \"a series of discussions and meetings\" with him.\n\nPresident Donald Trump also claimed he was personally involved in Huang's return. The president told CNBC that he spoke with the chip maker's board before it reversed course and reinstated its co-founder.\n\n\"I made the deal,\" Trump told CNBC's Eamon Javers during an interview on \"Squawk on the Street.\"\n\nTrump said Nvidia's board asked for guarantees that Huang, who resigned less than two weeks ago, was not a threat to national security.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 04:15 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Planning to retire in a smaller city? 5 things you should consider before moving away from a metro after retirement", "full_content": "Retiring in a smaller city may seem like an easy way to stretch your retirement savings. Lower rents, cheaper housing and reduced commuting expenses can make life more affordable than in a metro. However, moving to a smaller city does not necessarily mean you can retire with a substantially smaller corpus.\n\nThe bigger challenge is accounting for inflation, rising healthcare expenses and the possibility of living 25-30 years after retirement. A retirement plan that looks sufficient today may fall short when everyday expenses increase over the next few decades.\n\nFor instance, a 30-year-old spending \u20b9 1 lakh a month today would need approximately \u20b9 5.7 lakh a month at age 60 to maintain the same lifestyle, assuming annual inflation of 6%. This translates into annual expenses of nearly \u20b9 68.9 lakh at retirement.\n\nThe illustration, shared by Ashok Manwani, vice-president of products at Go Digit Life Insurance, highlights why retirement planning should begin with present spending and future inflation rather than simply the cost of living in the city where one intends to settle.\n\nOne of the biggest attractions of retiring in a smaller city is the possibility of spending less on housing. Retirees who own a home or move to a less expensive location may save considerably on rent, property costs and daily commuting.\n\nHowever, healthcare, medicines, travel and other essential expenses can still take up a significant portion of the retirement budget. Retirees may also need to travel frequently to larger cities for specialised medical treatment or to visit children living elsewhere.\n\nThis means that retirement planning should account for the actual cost of living in the chosen city rather than assume that every expense will fall after relocation.\n\nInflation is one of the biggest risks to retirement savings because expenses continue to rise even after regular employment income stops.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 04:14 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Cine Body Urges PM To Ban Netflix's Pakistani Series 'Jo Bachay Hain Sang Samait Lo' In India", "full_content": "Fawad Khan and Mahira Khan headline Netflix's Pakistani series Bachay Hain Sang Samait Lo, which follows three generations and six love stories based on Farhat Ishtiaq's bestselling Urdu novel.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:13 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Ionic Wealth Announces Rs 117 Crore Fundraise From Angel One To Ramp Up Growth", "full_content": "The company said it will focus on strengthening its portfolio-led proposition and its global capabilities.", "source": "NDTV Profit", "pub_date_str": "24 Nov 2026, 04:08 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Silver price crash: Rates today in India down \u20b91 lakh in 3 months! Recovery or more fall ahead for MCX silver futures?", "full_content": "Silver Price Today: Silver rate today in India is around \u20b9 1,54,000 per kg after a strong rebound of over \u20b9 6,000 on Monday. Barring this rebound, the precious white metal price in India was around \u20b9 1 lakh below the August 2026 high of around \u20b9 2.50 lakh per kg, which means the silver rate today in India is down by around \u20b9 1 lakh in three months. US bond yields sustaining at higher levels, a strong US Dollar (USD) against the major six global currencies, buzz for a US Fed rate hike, and appreciation in the Indian Rupee are some of the major reasons for the silver price crash in India.\n\nAccording to market experts, the silver rate today in India has crucial support at \u20b9 1,40,000. Breaking below this support on a closing basis would mean further downside towards \u20b9 1,20,000 and \u20b9 1,00,000 per kg. In the international market, silver price today has crucial support placed at $38/oz. Breaking below this support would open the downside probability of $34/oz and $30/oz. They said that silver prices would be considered bottomed out if they break above \u20b9 1,90,000 per kg in the Indian market and above $52/oz in the international market.\n\nHighlighting the reasons for the silver price crash, Anuj Gupta, a SEBI-registered market expert, said, \u201cThe downside trend in the MCX silver rates and the COMEX silver price today can be attributed to these three reasons: US bond yields sustaining at elevated levels; Indian Rupee appreciating against the US Dollar (USD) from around 98 to 92.50 levels, and buzz for the US Fed rate hike.\u201d\n\nPointing towards the Indian Rupee's appreciation, Anuj Gupta said, \u201cThe Indian Rupee has ascended from around 98 per USD levels to around 92.50 per USD levels in the last three months.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 04:03 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "China extends pause in controls on critical mineral exports to US", "full_content": "Beijing\u2019s dominance of supply chains has given it leverage against Washington", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 03:51 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Ousted BP chair Albert Manifold to join Aggreko board after IPO", "full_content": "Manifold responds to bullying allegations levelled against him and calls them \u2018lies\u2019", "source": "FT Markets", "pub_date_str": "24 Nov 2026, 03:42 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The bull and bear surprises that could ambush investors next year, according to Bank of America", "full_content": "Michael Hartnett\u2019s tactical masterplan is to stay risk off until global rate hikes start to dry up next spring. Thereafter, modest earnings growth and the chance of looser financial conditions in the second half favor owning cyclicals and adding more risk.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 03:28 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How Nvidia stock skyrocketing 31% will change risk-return outlook for mutual funds? Experts weigh in as Jensen returns", "full_content": "Nvidia's board unanimously reinstated Jensen Huang as president, CEO and board director on Monday, 23 November, 11 days after his resignation following reports of an extramarital affair and alleged links to a Chinese intelligence spy.\n\nThe board said its decision followed discussions with Huang and input from senior US government officials. However, its investigation into the matter will continue.\n\nThe development triggered a sharp recovery in Nvidia shares. According to Yahoo Finance , Nvidia Corporation closed at $165.05 on 23 November, up 31.48%. Currently, the stock is trading at $162.68, down 1.44% (3:46 am EST on 24 November; 2:16 pm IST on 24 November).\n\nThe sharp rebound could also influence mutual funds holding Nvidia directly or through US indices. But how much could retail investors benefit, and should they consider investing in these funds after the rally? Here's what experts say.\n\nThe list includes passive international funds such as Mirae Asset S&P 500 Top 50 ETF, Mirae Asset NYSE FANG+ ETF and Motilal Oswal NASDAQ 100 ETF, alongside actively managed schemes such as Edelweiss Technology Fund, Franklin India Technology Fund, Axis Innovation Fund and ABSL International Equity Fund.\n\n*Source: Value Research, Allocation as on 31 October 2026, Direct plans\n\nRahul Jain, Director \u2013 Advisory Business & Head of Research & Products, International Money Matters (IMMPL), said, \u201cThe effect on a fund depends almost entirely on how much Nvidia it owns. At roughly 12%, the Mirae Asset S&P 500 Top 50 ETF gains close to 3.7% of NAV from the move, and the NASDAQ 100 funds, at around 8%, about 2.5%.\u201d\n\nFor instance, a 12.12% allocation translates into a 3.82% NAV contribution. This means a potential gain of \u20b9 3.82 for every \u20b9 100 invested, solely from Nvidia's rally.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 03:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Asian tech stocks recover from \u2018collateral damage\u2019 of Jensen Huang\u2019s departure", "full_content": "Asian technology stocks jumped on Tuesday as investors piled back into the sector, after Nvidia reinstated Jensen Huang as CEO.\n\nKey Nvidia partners and suppliers in Asia saw their shares skyrocket. Taiwan's TSMC, a critical partner to the U.S. chip giant, surged 9.85%, with Hon Hai Precision Industry \u2014 known also as Foxconn \u2014 up by 9.95%. Nvidia partner Mediatek also spiked 9.91%. Taipei's stock exchange has a daily price limit of 10% for stocks.\n\n\"Jensen's return is particularly welcome for Asian technology stocks, many of which suffered collateral damage from Nvidia's leadership crisis,\" Charu Chanana, chief investment strategist at Saxo, said in a note Tuesday morning.\n\nThe recovery will likely favor established companies with visible orders, strong balance sheets and pricing power, compared to those who rely on \"years of uninterrupted AI spending,\" Chanana added.\n\nIn South Korea, Nvidia suppliers Samsung Electronics and SK Hynix jumped 6.7% each. The two companies, which together make up over 40% of the Kospi's weighting, sent the index up over 6%. South Korea's LG Electronics soared 15.86%.\n\nThe rise in the index triggered the Korea Exchange's sidecar on the index early in the day, reportedly making it the 100th sidecar the KRX has activated. Japan's Softbank Group Corp , a major investor in the chip space, climbed over 8% before paring gains to 4.66%.\n\nSemiconductor test company Advantest , as well as counterpart Tokyo Electron , jumped 12% and 7%, respectively. Both companies are collaborators with Nvidia.\n\nThe exuberance did not follow into European markets at the open, with the region's technology sector down 0.3% in early deals, weighing on a broader 0.14% rise in the benchmark Stoxx 600 index. Europe's tech index popped more than 5% on Monday.", "source": "CNBC World Economy", "pub_date_str": "24 Nov 2026, 03:16 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Supreme Court strikes down UP\u2019s 2021, 2025 pension laws: What does it mean for retired employees & legal heirs", "full_content": "The Supreme Court has struck down the Uttar Pradesh Qualifying Service for Pension and Validation Act, 2021, and the Uttar Pradesh Entitlement to Pension and Validation Act, 2025, as unconstitutional, according to a Bar and Bench report.\n\nPassed on November 18 in Uttar Pradesh Ground Water Department Non-Gazetted Employee Association (Regd.) & Anr. v. The Chief Secretary & Ors., the judgment by a Bench of Justices Dipankar Datta and Satish Chandra Sharma came as a major relief for regularised Uttar Pradesh government employees and retirees.\n\nIt restores the right of eligible employees regularised under a duly formulated scheme to have their prior work-charged, temporary, daily-wage, or muster-roll service counted towards qualifying service for pension .\n\nFor retired employees whose pre-regularisation service was previously excluded under the two now-invalidated laws, the Supreme Court has laid down a clear process and strict safeguards, according to Bar and Bench :\n\nThe Bench also clarified how monetary benefits will be computed and what happens if the State fails to pay on time:\n\nWhile the Court did not impose interest on amounts already due, any payments delayed beyond the prescribed deadlines will attract 9% annual simple interest until release.\n\nTaking note of contempt petitions alleging that Uttar Pradesh had failed to implement the pension directions in Prem Singh, the Court gave the State a final six months to disburse the required payments, warning that further non-compliance could constitute aggravated contempt.\n\nThe dispute traces back to the Supreme Court\u2019s 2019 ruling in Prem Singh v. State of Uttar Pradesh, which held that work-charged service must count towards qualifying service for pension.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 02:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "RBI DG asks primary dealers to bid responsibly in G-Sec underwriting auctions", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a RBI DG asks primary dealers to bid responsibly in G-Sec underwriting auctions Powered By The Economic Times daily newspaper is available online now. Read Today's Paper RBI DG asks primary dealers to bid responsibly in G-Sec underwriting auctions SECTIONS RBI DG asks primary dealers to bid responsibly in G-Sec underwriting auctions PTI Last Updated: Nov 24, 2026, 02:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis RBI Deputy Governor Rohit Jain has urged primary dealers to bid responsibly in government securities auctions. Jain noted instances of volatile pricing that misalign with orderly market conditions, impacting government borrowing costs. He highlighted the challenge of liquidity concentration in a few securities and called for improved market-making activities. Jain also pointed out declining demand from institutional investors for long-term sovereign debt amid uncertain interest rates.\n\nRBI Deputy Governor Rohit Jain has urged primary dealers to bid responsibly in government securities auctions. Jain noted instances of volatile pricing that misalign with orderly market conditions, impacting government borrowing costs. He highlighted the challenge of liquidity concentration in a few securities and called for improved market-making activities. Jain also pointed out declining demand from institutional investors for long-term sovereign debt amid uncertain interest rates.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Nov 2026, 02:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The biggest biotech deal in nearly three years carries a hefty $41 billion price tag", "full_content": "French drugmaker Sanofi on Tuesday agreed to pay $41 billion for U.S. biotech Insmed, a hefty price that will help the pharma giant offset the patent expiration on a key drug.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Nov 2026, 02:44 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "How a Bengaluru couple explored Egypt in 8 days for \u20b93.2 lakh", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nEgypt, home to the pyramids, ancient temples and the Nile, is a dream destination for history enthusiasts. While international holidays can be expensive, relatively affordable accommodation, food and sightseeing make the country an attractive option for Indian tourists looking beyond the usual destinations.\n\nChinmay Tadwalkar and his wife spent a total \u20b9 3.23 lakh on an eight-day trip to Egypt in December 2025, covering flights, hotels, transport, food and sightseeing. The couple began planning six months in advance, drawn by the country's ancient history and the opportunity to benefit from the sharp depreciation of the Egyptian pound in 2024. December is peak season in Egypt, so they kept expenses in check by travelling before the Christmas holiday rush.\n\n\"We have always been fascinated by the fact that structures built nearly 5,000 years ago can still be experienced today. I also felt the currency depreciation would make Egypt a good-value destination,\" Tadwalkar said. As part of Mint's travel series, the couple share everything about their trip.\n\nDecember is a suitable time to explore Egypt's outdoor historical sites. However, we made sure to wrap up our trip by the third week of the month, before the Christmas and New Year holiday rush pushed up prices.\n\nI started researching the destination about six months before our trip. Our flights cost about \u20b9 1.4 lakh, making it the biggest expense of the holiday. We flew from Bengaluru to Cairo via Bahrain on Gulf Air. We also took one internal flight from Luxor to Cairo.\n\nIn hindsight, I could have saved on the internal flight which cost me \u20b9 24,000 as EgyptAir airline is part of Star Alliance loyalty programme and I had credit card points that could have been used to book those flights. I missed that opportunity.\n\nGetting an Egyptian visa was completely online and straightforward.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 02:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Penny stock under \u20b910 with high book value, strong fundamentals \u2014 Can it become a multibagger? Experts' views, target", "full_content": "Asit Manohar Published 24 Nov 2026, 02:10 PM IST Prefer Livemint on Google Penny stock under \u20b9 10 with high book value, good fundamentals: Despite the bloodbath on Dalal Street wiping out over \u20b9 6 lakh crore in investors' wealth, the positive sentiment of the Indian stock market is still intact. Investors and market experts still believe the Nifty 50 index is sustaining above 25,300, suggesting the key benchmark index has the potential to reach a new peak, eclipsing the existing record high of 26,373.20. So, when an ordinary investor is in a panic after the stock market crash, smart investors are expected to identify value picks in the current market. For such investors, it might be worth scanning Orient Green Power Company shares. The penny stock under \u20b9 10 has a high book value and strong fundamentals. Experts believe the penny stock can be a multibagger if bought and held for the long term.\n\nHighlighting the reasons that may attract bulls' attention towards the Orient Green Power Company shares, Anuj Gupta, a SEBI-registered market expert, said, \u201cOrient Green Power shares finished at \u20b9 8.85 per share on the NSE on Monday. As of 30 September 2026, the book value per share of the company is around \u20b9 10.75, which means the penny stock has a high book value with a price-to-book ratio of around 0.80.\u201d\n\nOn what high book value means for shareholders of the company, the SEBI-registered market expert said that, in the worst case, the penny stock is expected to touch its book value, which means the penny stock is expected to go up to \u20b9 10.75 apiece, adding around \u20b9 1.90 or 21.50% more to the current market price.\n\nGupta said that Orient Green Power Company Ltd has good fundamentals as the company reported strong operational growth in its latest financial filings, posting \u20b9 146.57 crore in consolidated total income and \u20b9 81.57 crore in net profit for Q2 FY27.", "source": "LiveMint Markets", "pub_date_str": "24 Nov 2026, 02:10 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Kotak Life Insurance launches Variable Index Annuity Plan: Check Nifty 50-linked option, eligibility and death benefits", "full_content": "Kotak Mahindra Life Insurance has launched the Kotak Variable Index Annuity Plan, a retirement product that offers regular income throughout the policyholder's lifetime.\n\nAn annuity is a series of regular payments made by an insurance company in return for an investment or purchase price. The new plan offers both fixed-income options and an option to receive payouts linked partly to the performance of the Nifty 50 index. Here's what you need to know.\n\nKotak Variable Index Annuity Plan is a non-participating, non-linked general annuity product offering regular income based on the annuity option selected. It offers two immediate and two deferred annuity options.\n\nThe other two options allow policyholders to start receiving income after a chosen waiting period.\n\nThe plan is available to individuals aged 35 to 70 years, subject to the applicable maximum vesting age of 75 years. Existing Kotak Life pension plan policyholders can enter the plan from the age of 18 years.\n\nOptions 1 and 2 require a single premium payment, while Options 3 and 4 offer regular or limited premium payment terms. The available premium payment frequencies are yearly, half-yearly, quarterly and monthly.\n\nThe deferment period for Options 3 and 4 ranges from five to 25 years. The minimum annuity amount is \u20b9 1,000 per month, \u20b9 3,000 per quarter, \u20b9 6,000 half-yearly and \u20b9 12,000 annually.\n\nUnder Option 4, policyholders can choose how much of their base annuity income they want to keep fixed. They can select a Guaranteed Proportion of 60%, 70%, 80% or 90%.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 02:10 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IIFCL IPO: Govt plans to sell part of its stake, company to issue fresh shares", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a IIFCL IPO: Govt plans to sell part of its stake, company to issue fresh shares The Economic Times daily newspaper is available online now. Read Today's Paper IIFCL IPO: Govt plans to sell part of its stake, company to issue fresh shares SECTIONS IIFCL IPO: Govt plans to sell part of its stake, company to issue fresh shares PTI Last Updated: Nov 24, 2026, 02:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The government aims to partially divest its shareholding in India Infrastructure Finance Company Ltd through an initial public offering. The IPO is expected to occur by the end of the current fiscal year, according to an official statement. IIFCL will issue fresh shares to raise capital alongside the government stake sale. The proceeds from the stake sale will contribute to the government's disinvestment revenue.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Nov 2026, 02:02 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why investors are ditching multi-asset funds", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nNet flows into multi-asset allocation funds have fallen sharply through 2026. After pulling in \u20b9 10,485 crore in January, the category's inflows nearly halved to \u20b9 5,213 crore by March. By September, net flows had shrunk to \u20b9 3,667 crore, and in October they slipped to \u20b9 1,515 crore\u2014barely a seventh of January's levels.\n\nExperts attribute this to returns moderating in recent period. The multi-asset allocation fund category average has returned just 2.6% year-to-date and 1.3% over six months, weighed down by equity market volatility and a correction in gold and silver after their sharp 2024-25 rally.\n\n\"Over the last few years, we have consistently advocated multi-asset allocation funds, highlighting their potential to offer investors exposure to multiple asset classes through a single fund. When gold and silver prices were on an uptrend, this was one of the categories which saw a sharp uptick in investor interest. With near-term softness in equity and commodity markets, investor interest in the category seems to have moderated, but we continue to recommend long-term investing in multi-asset funds,\u201d said Vipin Bhandari, head\u2013retail business, ICICI Prudential AMC.\n\nA part of the pullback is tactical money exiting. \"There will always be some tactical flow element where investors allocate more money where they see higher returns,\" said Aparna Karnik, fund manager at DSP Mutual Fund .\n\n\"Multi-asset allocation funds received high flows when gold and silver returns were high; some of that money later moved towards small-cap categories,\" Karnik said. \u201cHowever, the multi-asset fund has continued to see steady systematic flows,\u201d she said.\n\nThat is the right way to hold these funds, say fund managers. \" Gold and silver can't be seen as short-term return generators. It is more of a long-term asset allocation in a multi-asset portfolio,\" said Rahul Singh at Tata Mutual Fund.", "source": "LiveMint Money", "pub_date_str": "24 Nov 2026, 01:35 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Investors mint Rs 34.61 lakh cr in November as markets rally nearly 11%", "full_content": "In a remarkable surge this month, Indian equity markets have observed a substantial upswing, with the BSE Sensex climbing nearly 11 percent. This rally was largely propelled by foreign institutional investors, who contributed record-setting inflows exceeding Rs 1 lakh crore. Motivated by lower crude oil prices and impressive Q2 earnings, investor optimism soared, although a recent profit booking saw a minor dip of nearly 2 percent.", "source": "Economic Times Markets", "pub_date_str": "24 Nov 2026, 01:28 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Is stock market open today? Thanksgiving, Black Friday holiday, US trading schedule - Nasdaq, New York Stock Exchange", "full_content": "US stock markets will close for Thanksgiving on November 26 and reopen with an early 1 p.m. ET close on Black Friday. The article also outlines holiday trading hours for bonds and year-end market closures, while reporting a sharp Monday rally le     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
