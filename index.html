: Sep 19, 2026, 12:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Warren Buffett has stepped down from his role as chairman of Berkshire Hathaway, marking the end of an era defined by remarkable investment success. Known for his shrewd yet patient approach to bargain-hunting, he outperformed the US stock market time and again. Beyond finance, his down-to-earth advice resonated with countless individuals, earning him a legacy of honesty and trust, inspiring a holistic understanding of success in life.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Sep 2026, 12:17 PM IST", "pub_date_relative": "49m ago"}, {"title": "Car loan rates start at 7.35% in September 2026: Check SBI, BoB, Bank of India, and other PSU bank offers", "full_content": "Are you an aspiring car buyer in this festive season? Are you planning to finance your purchase? If that is the case, you should be clear that the applicable interest rate on your car loan can make all the difference and ultimately determine your overall borrowing cost.\n\nThis calls for a proper understanding of the applicable rates, terms and conditions. Currently, PSU banks are offering car loans to individuals at starting rates of less than 8%, although the actual rate may vary based on the borrower\u2019s profile, credit score, repayment history and the lender's eligibility criteria.\n\nFurthermore, for a \u20b9 5 lakh car loan with a 5-year tenure, the EMIs across these lending institutions range from \u20b9 9,983 to \u20b9 11,647, as per data compiled by Paisabazaar . Aspiring borrowers should hence compare both the interest rate and the total repayment cost before opting for any particular loan offer or lending institution.\n\nKeeping these important factors in mind, let us look at the most recent car loan rates offered by prominent banks nationwide.\n\n*Bank of Maharashtra: 0.25% concession for eligible existing customers. **Canara Bank: 50% processing-fee waiver till 30 September 2026. ***Punjab & Sind Bank: Up to 50% processing-fee concession under PSB Apna Vahan Sugam.\n\nRates and charges as of 16 September 2026. Source: Paisabazaar.com\n\n1. Check the actual interest rate offered: The headline rate is generally the starting rate; it can change depending on the individual profile. Factors such as credit profile , income history, recent defaults or missed payments (if any), and the relationship with the lending institution all matter before an individual is considered for a car loan.\n\n2. Compare total repayment, not just EMI: A lower Equated Monthly Instalment (EMI) does not necessarily mean a cheaper loan. This is a myth that needs to be carefully understood and tackled, because a longer tenure can reduce the monthly burden but increase the total interest paid over the loan period.", "source": "LiveMint Money", "pub_date_str": "19 Sep 2026, 12:16 PM IST", "pub_date_relative": "50m ago"}, {"title": "IIT Bombay Student Dies By Suicide Hours After Being Caught Using ChatGPT During Exam", "full_content": "Wakode's death triggered protests on the IIT Bombay campus, with students demanding accountability and transparency from the administration.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 12:14 PM IST", "pub_date_relative": "52m ago"}, {"title": "California judge blocks part of TikTok\u2019s $400 million privacy settlement", "full_content": "", "source": "Investing.com News", "pub_date_str": "19 Sep 2026, 12:10 PM IST", "pub_date_relative": "56m ago"}, {"title": "CGHS eligibility rules changed: Central govt employees outside covered areas can now opt for CGHS", "full_content": "Serving central government employees posted or living outside the geographical coverage of the Central Government Health Scheme (CGHS) can now decide, plan, and opt for CGHS benefits, subject to the applicable conditions.\n\nThis is a recent development announced by the Ministry of Health and Family Welfare in an Office Memorandum dated 17 September 2026. Let us discuss this development in detail, along with the history, inception and significance of CGHS.\n\nTo put it simply, the Central Government Health Scheme (CGHS) is a government healthcare programme for serving and retired Central government employees and their eligible family members. It was launched in Delhi on 1 July 1954, primarily to provide medical care and address difficulties employees faced in claiming reimbursement for outpatient medicines.\n\nOver the past few decades, CGHS expanded beyond Delhi to several cities and now provides services through Wellness Centres, polyclinics, laboratories and empanelled hospitals.\n\nFurthermore, its coverage has also widened to include eligible pensioners and certain other categories of beneficiaries. According to the Ministry of Health and Family Welfare's 2024-25 annual report, CGHS had spread to 81 cities, serving nearly 46.87 lakh beneficiaries\n\nAfter much deliberation, the government has decided to do away with the geographical criteria that previously restricted CGHS eligibility for serving central government employees based on their place of residence or posting. The salient features of the same are as follows:\n\nThis is a welcome change, because the earlier geographical restrictions had created difficulties and complications for employees residing or posted outside the prescribed CGHS coverage. The revised rules permit eligible employees in such circumstances to opt for CGHS, provided they fulfil the other conditions and pay the prescribed contribution.\n\nIt is vital to keep in mind that the option is not reversible once exercised.", "source": "LiveMint Money", "pub_date_str": "19 Sep 2026, 12:08 PM IST", "pub_date_relative": "57m ago"}, {"title": "What Is Teqball? The Sport Where India's Quimcy Dsouza Is Closing In On An Asian Games Medal", "full_content": "Teqball originated in Hungary a little over 10 years ago and is played on a distinctive curved table designed specifically for the sport.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mohun Bagan vs Mohammedan Live Streaming: When, Where To Watch CFL Super Six Match On TV, Online?", "full_content": "Fans can watch the live stream of the match on No.10 Sports.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 12:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ashish Kacholia's Portfolio: 10 stocks rally up to 180% in CY26, 4 turn multibaggers; 1 new Q1 bet", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Ashish Kacholia's Portfolio: 10 stocks rally up to 180% in CY26, 4 turn multibaggers; 1 new Q1 bet Written by Ritesh Presswala , ETMarkets.com | Sep 19, 2026, 12:03:47 PM IST 1 / 11 Portfolio Tracker Investors closely monitor the portfolios of prominent market participants on Dalal Street. In this context, ETMarkets analysed the investment holdings of well-known investor Ashish Kacholia. According to the latest data for the June 2026 quarter, Kacholia publicly disclosed stakes in around 33 stocks. The total portfolio value was estimated at roughly Rs 3,102 crore as of September 18, 2026, up about 19% from Rs 2,602 crore in the December 2025 quarter. Notably, the list includes only companies in which Kacholia holds a stake of more than 1%, and therefore may not represent his entire portfolio. A deeper analysis shows that around 15 of these stocks have delivered more than 25% returns so far in CY26. Of these, 10 stocks have gained between 40% and 180%, while four have more than doubled, turning into multibaggers and significantly increasing investors' wealth. The analysis also identified one stock that was newly added to the portfolio during the June 2026 quarter. (Data Source: ACE Equity, Trendlyne).\n\nThe stock has surged 181% so far in CY26, rising from Rs 1,424 to Rs 4,002. As of the June 2026 quarter, Ashish Kacholia held a 2.08% stake in the company, currently valued at around Rs 100 crore.\n\nThe stock has gained 165% so far in CY26, climbing from Rs 193 to Rs 511. As of the June 2026 quarter, Ashish Kacholia held a 2.27% stake in the company, currently valued at around Rs 154 crore.\n\nThe stock has surged 131% so far in CY26, rising from Rs 25 to Rs 57.", "source": "Economic Times Markets", "pub_date_str": "19 Sep 2026, 11:54 AM IST", "pub_date_relative": "1h ago"}, {"title": "BoJ has room to accelerate rate hikes as inflation pressures build: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a BoJ has room to accelerate rate hikes as inflation pressures build: Report ICICI Bank Share Price HDFC Bank Share Price Kotak Mahindra Bank Share Price Axis Bank Share Price Federal Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper BoJ has room to accelerate rate hikes as inflation pressures build: Report SECTIONS BoJ has room to accelerate rate hikes as inflation pr ks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Sep 2026, 12:39 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NLMC recommends monetisation of government assets worth over Rs 5,000 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a NLMC recommends monetisation of government assets worth over Rs 5,000 crore The Economic Times daily newspaper is available online now. Read Today's Paper NLMC recommends monetisation of government assets worth over Rs 5,000 crore SECTIONS NLMC recommends monetisation of government assets worth over Rs 5,000 crore By ET Online Last Updated: Sep 19, 2026, 12:36:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The National Land Monetization Corporation recommended assets worth over Rs 5,000 crore for monetization. Its board stressed accelerating value unlocking from government entities' surplus land. The corporation reviewed ongoing asset monetisation programmes and financial performance. Discussions focused on expediting processes and strengthening stakeholder coordination. NLMC will continue facilitating efficient and transparent asset monetization.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s on g on the product labels. According to Nestle India, these statements were factual and supported by scientific literature.\n\nNestle India also reiterated its compliance with regulations covering product labels and declarations. It also said it would continue working with FSSAI on consumer awareness.\n\n\u201cWe confirm to adherence of all regulations including all norms and label declarations as per applicable laws. We will continue to work closely and support FSSAI in its efforts towards consumer awareness,\" said the firm.\n\nThe company further pointed out that all material information that could have an impact on its operations or performance had been disclosed to the stock exchanges in accordance with Regulation 30 of the SEBI Listing Regulations. Nestle India stated that such disclosures had been made regularly, accurately and in a timely manner.\n\nFurthermore, responding specifically to the exchange's query on whether there was any undisclosed information that could explain movements in the company's shares, Nestle India said it had no such information to report. The company also said the reported news item had no material impact on the company.", "source": "LiveMint Markets", "pub_date_str": "19 Sep 2026, 12:30 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Crude Oil Above $100: Can Saudi Arabia\u2019s export disruption trigger a new global energy shock?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a News \u203a Crude Oil Above $100: Can Saudi Arabia\u2019s export disruption trigger a new global energy shock? The Economic Times daily newspaper is available online now. Read Today's Paper Crude Oil Above $100: Can Saudi Arabia\ re Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Sep 2026, 12:17 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Car loan rates start at 7.35% in September 2026: Check SBI, BoB, Bank of India, and other PSU bank offers", "full_content": "Are you an aspiring car buyer in this festive season? Are you planning to finance your purchase? If that is the case, you should be clear that the applicable interest rate on your car loan can make all the difference and ultimately determine your overall borrowing cost.\n\nThis calls for a proper understanding of the applicable rates, terms and conditions. Currently, PSU banks are offering car loans to individuals at starting rates of less than 8%, although the actual rate may vary based on the borrower\u2019s profile, credit score, repayment history and the lender's eligibility criteria.\n\nFurthermore, for a \u20b9 5 lakh car loan with a 5-year tenure, the EMIs across these lending institutions range from \u20b9 9,983 to \u20b9 11,647, as per data compiled by Paisabazaar . Aspiring borrowers should hence compare both the interest rate and the total repayment cost before opting for any particular loan offer or lending institution.\n\nKeeping these important factors in mind, let us look at the most recent car loan rates offered by prominent banks nationwide.\n\n*Bank of Maharashtra: 0.25% concession for eligible existing customers. **Canara Bank: 50% processing-fee waiver till 30 September 2026. ***Punjab & Sind Bank: Up to 50% processing-fee concession under PSB Apna Vahan Sugam.\n\nRates and charges as of 16 September 2026. Source: Paisabazaar.com\n\n1. Check the actual interest rate offered: The headline rate is generally the starting rate; it can change depending on the individual profile. Factors such as credit profile , income history, recent defaults or missed payments (if any), and the relationship with the lending institution all matter before an individual is considered for a car loan.\n\n2. Compare total repayment, not just EMI: A lower Equated Monthly Instalment (EMI) does not necessarily mean a cheaper loan. This is a myth that needs to be carefully understood and tackled, because a longer tenure can reduce the monthly burden but increase the total interest paid over the loan period.", "source": "LiveMint Money", "pub_date_str": "19 Sep 2026, 12:16 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IIT Bombay Student Dies By Suicide Hours After Being Caught Using ChatGPT During Exam", "full_content": "Wakode's death triggered protests on the IIT Bombay campus, with students demanding accountability and transparency from the administration.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 12:14 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "CGHS eligibility rules changed: Central govt employees outside covered areas can now opt for CGHS", "full_content": "Serving central government employees posted or living outside the geographical coverage of the Central Government Health Scheme (CGHS) can now decide, plan, and opt for CGHS benefits, subject to the applicable conditions.\n\nThis is a recent development announced by the Ministry of Health and Family Welfare in an Office Memorandum dated 17 September 2026. Let us discuss this development in detail, along with the history, inception and significance of CGHS.\n\nTo put it simply, the Central Government Health Scheme (CGHS) is a government healthcare programme for serving and retired Central government employees and their eligible family members. It was launched in Delhi on 1 July 1954, primarily to provide medical care and address difficulties employees faced in claiming reimbursement for outpatient medicines.\n\nOver the past few decades, CGHS expanded beyond Delhi to several cities and now provides services through Wellness Centres, polyclinics, laboratories and empanelled hospitals.\n\nFurthermore, its coverage has also widened to include eligible pensioners and certain other categories of beneficiaries. According to the Ministry of Health and Family Welfare's 2024-25 annual report, CGHS had spread to 81 cities, serving nearly 46.87 lakh beneficiaries\n\nAfter much deliberation, the government has decided to do away with the geographical criteria that previously restricted CGHS eligibility for serving central government employees based on their place of residence or posting. The salient features of the same are as follows:\n\nThis is a welcome change, because the earlier geographical restrictions had created difficulties and complications for employees residing or posted outside the prescribed CGHS coverage. The revised rules permit eligible employees in such circumstances to opt for CGHS, provided they fulfil the other conditions and pay the prescribed contribution.\n\nIt is vital to keep in mind that the option is not reversible once exercised.", "source": "LiveMint Money", "pub_date_str": "19 Sep 2026, 12:08 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ashish Kacholia's Portfolio: 10 stocks rally up to 180% in CY26, 4 turn multibaggers; 1 new Q1 bet", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Poli m feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Sep 2026, 11:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Concurrent Gainers: 10 smallcap stocks that gain for 5 days in a row", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Gainers: 10 smallcap stocks that gain for 5 days in a row Written by Ritesh Presswala , ETMarkets.com | Sep 19, 2026, 11:21:34 AM IST 1 / 11 Consistent Gainers Over the five trading sessions ending September 18, the benchmark Sensex declined 0.81%, or 608 points, to close at 74,295. The index ended lower in four of the five sessions between September 11 and September 18. Despite the market weakness, 10 stocks from the BSE SmallCap Index recorded gains in all five sessions. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "19 Sep 2026, 11:14 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ETMarkets Smart Talk | Don\u2019t chase growth at any valuation; rising US yields can pressure P/E multiples: Manish Kumar", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Expert Views \u203a ETMarkets Smart Talk | Don\u2019t chase growth at any valuation; rising US yields can pressure P/E multiples: Manish Kumar The Economic Times daily newspaper is available online now. Read Today's Paper ETMarkets Smart Talk | Don\u2019t chase growth at any valuation; rising US yields can pressure P/E multiples: Manish Kumar SECTIONS ETMarkets Smart Talk | Don\u2019t chase growth at any valuation; rising US yields can pressure P/E multiples: Manish Kumar By Kshitij Anand , ETMarkets.com Last Updated: Sep 19, 2026, 10:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Midcap and smallcap stocks are hitting record highs, but rising valuations and higher US Treasury yields could challenge the rally. ICICI Prudential Life Insurance CIO Manish Kumar discusses earnings visibility, domestic liquidity, FII selling, IPO supply and valuation discipline, while explaining why investors should avoid chasing growth at any price.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Sep 2026, 10:48 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Home loan nearly over? 5 things to do with the EMI you are about to save", "full_content": "When you are left with just a few more EMIs on your ongoing home loan, it can feel like a major financial milestone. Still, when faced with such a situation, it is wise for borrowers to use this transition to their advantage and prepare for the future rather than immediately increasing discretionary spending or committing the freed-up cash flow to mutual funds or stock investments.\n\nFor example, if you have a monthly income of \u20b9 50,000 and your home loan EMI is \u20b9 15,000. Soon, your monthly home loan EMI is about to conclude, as you have completed the entire repayment as per the home loan terms and conditions.\n\nThen you should spend the freed-up \u20b9 15,000 recklessly or lavishly. Proper thought, time and planning must be dedicated towards making the most of the freed-up amount, so that you can meaningfully grow in life.\n\nKeeping these basics in mind and recognising the importance of proper financial planning to achieve other financial goals seamlessly, here are several financial moves to consider once the home loan is fully repaid.\n\nBefore redirecting your EMI savings towards growth-based investments such as stocks and mutual funds, it is prudent to ensure you have an adequately healthy emergency fund.\n\nAs a norm, the fund should cover about six months of your essential expenses. This includes household costs , school fees, insurance premiums, day-to-day expenses and other unavoidable payments. This amount can also be higher for borrowers with dependents, variable income or limited job security. An emergency fund should be kept in a relatively liquid, easily available and low-risk investment option so that it is accessible when required.\n\nThe end of a home loan is also an appropriate time to reassess and analyse insurance coverage. Borrowers should check whether their term insurance is sufficient to support their family if they are no longer around.", "source": "LiveMint Money", "pub_date_str": "19 Sep 2026, 10:44 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Small-cap stock under \u20b950: Kellton Tech in focus next week due to fundraise meeting - Check date", "full_content": "AI-led digital tech stock Kellton Tech Solutions share price will be in focus on Monday, September 21 after it announced that its boad will consider fundraising proposal on September 23\n\nIn an exchange filing, the firm said that it has scheduled a board meeting on September 23, 2026, to consider a proposal to raise funds through the issue of equity shares and/or other eligible securities.\n\nKellton Tech said the proposed fundraising could involve the issuance of equity shares or other eligible securities through one or more permissible modes. However, the company has not disclosed the proposed size of the fundraise or the specific route that may be used.\n\nAccording to the company\u2019s regulatory filing, the board will discuss various permitted methods of raising funds, subject to the terms and conditions it may decide and the receipt of the required statutory and regulatory approvals.\n\nMeanwhile, earlier this month, the company was selected to develop an enterprise loan integration platform for a leading automotive finance company.\n\nAccording to Kellton\u2019s press release, the platform will act as a central integration layer for the lender, linking its loan origination, customer management, credit assessment and servicing systems with external verification and financial data providers.\n\nThe platform will support key lending processes, including applicant verification, credit assessment, eligibility decision-making and synchronisation of customer records. It is also expected to simplify integrations across the lending ecosystem.\n\nKellton said the platform has been built as a reusable framework rather than a fixed network of connections. This will enable the finance company to add new providers, channels and product lines to the same platform as its operations grow. The system has also been designed to meet security, auditability and transaction integrity requirements for a regulated financial environment.", "source": "LiveMint Markets", "pub_date_str": "19 Sep 2026, 10:42 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "'Everything on record': Parliamentary Finance panel chief defends unanimous Standing Committee report amid UPI MDR row", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a 'Everything on record': Parliamentary Finance panel chief defends unanimous Standing Committee report amid UPI MDR row The Economic Times daily newspaper is available online now. Read Today's Paper 'Everything on record': Parliamentary Finance panel chief defends unanimous Standing Committee report amid UPI MDR row SECTIONS 'Everything on record': Parliamentary Finance panel chief defends unanimous Standing Committee report amid UPI MDR row ANI Last Updated: Sep 19, 2026, 10:31:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bhartruhari Mahtab defended the finance committee's report on Demands for Grants. Congress MP Manish Tewari rejected claims of opposition support for MDR proposals. The committee's report explored a possible revenue model for digital payments. The government is currently exploring options for restoring MDR on certain transactions. New UPI MDR framework for merchant transactions will take effect soon.\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nA different kind of buyback. Is this the beginning of these kinds of buybacks?\n\nCome January 2027, will India\u2019s online platforms get their own Tukaram?\n\nFour rules made HDFC Bank a compounder. All four have stopped. Can the new CEO rewrite them?\n\nGold rush on Dalal St as regional jewellers bid to be the next Tanishq\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Sep 2026, 10:31 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Derivatives", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI Sees Burning Through $278 Billion by 2030: FT", "full_content": "OpenAI Chief Executive Officer Sam Altman told Fortune earlier that the company's long-anticipated IPO is still in the works but would not happen this year.", "source": "NDTV Profit", "pub_date_str": "19 Sep 2026, 10:31 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "A new arms race is unfolding on the ocean floor", "full_content": "Countries and companies are investing in technologies for underwater use amid concerns about the vulnerability of critical infrastructure on the ocean floor.", "source": "CNBC World Economy", "pub_date_str": "19 Sep 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "19 Sep 2026, 01:06 PM IST", "total_stories": 386};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
