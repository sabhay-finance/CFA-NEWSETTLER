deral Reserve's October 27\u201328 policy meeting for clues on the future path of interest rates. Spot gold rose 0.1% to $4,145.22 per ounce by 0347 GMT, while US gold futures for December delivery gained 0.1% to $4,164.70.\n\nThe recovery followed a correction of more than 26% from record highs in January 2026. According to CME's FedWatch Tool, traders were pricing in an 82% probability that the Federal Reserve would leave interest rates unchanged at its October meeting, although expectations of a rate hike in December remained elevated at 89%. Higher interest rates typically weigh on gold because bullion does not pay interest, increasing the opportunity cost of holding it. A weaker dollar, meanwhile, makes greenback-priced gold more affordable for overseas buyers.\n\nAshish Rajodiya, Head of Commodities at PL Capital, said softer crude prices and lower Treasury yields had supported bullion after recent volatility. He added that the Fed's policy statement and upcoming inflation data would be key triggers, while a renewed oil-price spike or hawkish signals could put pressure on gold and silver.\n\nGold ETFs attracted net inflows of \u20b9 2,596.70 crore in August, up from \u20b9 1,559 crore in July, marking the third consecutive month of positive flows.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 11:27 AM IST", "pub_date_relative": "13m ago"}, {"title": "Copper is outshining gold this year. Investors say the rally can survive an AI correction", "full_content": "Copper is becoming increasingly strategic to governments and industries as artificial intelligence, power-grid investment and defense spending increase demand for the industrial metal, investors say.\n\nThe metal \u2014 a key component in electronics, construction and transportation, and often seen as a barometer of economic activity \u2014 has outperformed gold this year, as the need to secure reliable supplies has intensified.\n\nCopper has rallied 15.8% year-to-date, and is up more than 30% over the past 12 months. By comparison, gold futures have slipped 4.11% year-to-date, and are down 4.52% over the past 12 months. Spot gold is 4.89% lower over the past 12 months, and 4% down year-to-date.\n\nSpeaking to CNBC's \"Squawk Box Europe,\" Ivanhoe Electric CEO Taylor Melvin said countries, regions and industries are increasingly focused on securing access to metals for national security, economic growth and technology infrastructure. Melvin said that shift has helped support copper prices.\n\n\"It's certainly a good time to be in copper mining globally, and specifically in the United States,\" said Melvin, whose Arizona-based mining and exploration company focuses on copper, gold, silver, nickel and cobalt.\n\n\"We're really in a world right now where the metals that we used to refer to, and still do, as critical metals are really becoming strategic metals, in every sense of the word,\" said Melvin, who spoke as LME Week, the annual gathering of the global metals industry, began in London on Monday.\n\nThat shift comes as investors question the sustainability of AI spending and the hyperscaler build-out, which has led to a recent wobble in tech stocks.\n\nBut Melvin said he expects copper to withstand the recent volatility.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 11:27 AM IST", "pub_date_relative": "13m ago"}, {"title": "ABB Q3 orders surge on data-centre boom as operating profit beats forecasts", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:25 AM IST", "pub_date_relative": "15m ago"}, {"title": "Bank of Japan may raise inflation forecast, stand pat on rates, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:24 AM IST", "pub_date_relative": "16m ago"}, {"title": "IT, FMCG lose defensive sheen. Where should investors seek safety now?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFor years, investors seeking refuge during market swings gravitated towards IT and consumer staples stocks, but that strategy is looking less reliable today as both sectors wrestle with slowing growth, rising competition and shifting investor expectations.\n\nA sector is defensive \u201cwhen earnings volatility is amongst the lowest, when the ownership of this sector is quite low, and expectations are low,\u201d said Harish Krishnan, chief investment officer Equity, Aditya Birla Sun Life AMC.\n\nThe numbers tell the story. Over the past three years, the Nifty IT index has gone nowhere, while the Nifty FMCG index has fallen 16%. In contrast, Nifty 50 has gained 17%, according to Bloomberg data.\n\nFund managers say these sectors no longer have the combination that once made them dependable safe havens: low expectations, limited investor ownership and steady earnings.\n\nBloomberg data showed that Nifty IT surged 166% in 2009 and 60% in 2021, while Nifty FMCG gained 59% in 2005 and 48.5% in 2012\u2014returns that market participants believe may be difficult to replicate.\n\n\u201cI agree,\u201d says Trilok Agarwal, fund manager at Ambit Asset Management, adding that those periods were driven by exceptional circumstances rather than normal business cycles.\n\nThe 2009 and 2021 IT rallies were driven by post-crisis recovery and a digitalisation boom, but with both sectors maturing, growth is slowing amid AI disruption, stronger competition and changing consumer behaviour.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 11:18 AM IST", "pub_date_relative": "22m ago"}, {"title": "McKesson EVP, CIO and CTO Francisco Fraga sells $797,128 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:17 AM IST", "pub_date_relative": "23m ago"}, {"title": "Incyte president Cagnoni sells $297,779 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:16 AM IST", "pub_date_relative": "24m ago"}, AM IST", "pub_date_relative": "25m ago"}, {"title": "Waiting for good IPO", "full_content": "Anthropic\u2019s shrinking window to list", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 11:00 AM IST", "pub_date_relative": "40m ago"}, {"title": "The world\u2019s finance chiefs see new risks \u2014 and less China angst", "full_content": "The world's finance chiefs spent last week in Bangkok debating the biggest risk facing the global economy \u2014 with debt, artificial intelligence and trade imbalances topping the list. Meanwhile, China, long a main risk factor in these discussions, was no longer at the top of the worry list.\n\nThe Bangkok meetings were the first in Asia since 2018, when the gathering was held in Bali, Indonesia . Thailand last hosted in 1991, six years before the unpegging of the baht from the U.S. dollar set off the Asian financial crisis.\n\nFast-forward to 2026, and anything from global imbalances to the AI boom or a massive debt buildup in the \"Global North\" could trigger the next financial crisis, said Kevin Gallagher, director of Boston University's Global Development Policy Center, who spoke with reporters in Beijing after attending the IMF and World Bank meetings.\n\nThe IMF was upbeat on economies positioned to benefit from the global AI supply chain, such as South Korea, Japan and China, and downbeat on those that aren't, warning that the AI build-out is widening gaps between economies.\n\nAI-related borrowing is also pushing up debt levels and competing with governments for capital, which lifts borrowing costs further. The IMF warned that should AI technology fail to deliver the promised productivity gains, it could trigger severe global economic consequences.\n\nGallagher said he's watching whether the IMF, the Federal Reserve and People's Bank of China can coordinate, or end up going in different directions and \"make things worse.\"\n\nThe U.S. Treasury is at odds with the Fund over its own debt. IMF Managing Director Kristalina Georgieva said strong growth alone won't put the U.S. on a sustainable path , with federal debt above $40 trillion. David Zervos, a counselor to Treasury Secretary Scott Bessent, dismissed the warning. \"It's good to remember how messy their forecasts have been in the past,\" he said.", "source": "CNBC Finance", "pub_date_str": "20 Oct 2026, 10:57 AM IST", "pub_date_relative": "43m ago"}, {"title": "Global Market: China and Hong Kong shares weaken as stable growth eases stimulus bets", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China and Hong Kong shares weaken as stable growth eases stimulus bets Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China and Hong Kong shares weaken as stable growth eases stimulus bets SECTIONS Global Market: China and Hong Kong shares weaken as stable growth eases stimulus bets Reuters Last Updated: Oct 20, 2026, 10:52:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China and Hong Kong stocks weakened on Tuesday, joining a broader retreat in the region, after Beijing kept key lending rates unchanged and stronger GDP data dampened\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\nOne company, 2 words.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 10:52 AM IST", "pub_date_relative": "48m ago"}, {"title": "SBI cyber fraud: Kerala HC orders \u20b93.73 lakh refund. Can you get a refund after sharing an OTP?", "full_content": "Cyber fraudsters often impersonate bank, ED, RBI and police officials to trick customers into sharing confidential information such as OTPs, CVVs and ATM PINs. They use fear and urgency to pressure victims, then use the details to carry out unauthorised transactions, often causing serious financial loss.\n\nIn a recent case, the Kerala High Court directed the State Bank of India (SBI) to refund \u20b9 3.73 lakh to a retired college principal after an unauthorised transaction was made on her debit card. The ruling highlights the importance of promptly reporting fraud, staying vigilant, and understanding your rights as a customer. The case was reported by The Indian Express .\n\nAccording to the report, the victim received an SMS saying her debit card would soon be blocked. A call offering reactivation followed, from a number that looked official. Trusting the caller, she shared an OTP for the \u201cregistration\u201d of the purported SBI Secure App, after which \u20b9 3.73 lakh was debited from her account.\n\nBanks and their officials never ask customers to disclose confidential information, such as OTPs , over calls or messages. Turn down any such request immediately.\n\nFraudsters often pose as senior bank or police officers, so do not engage with such callers, and report the number to the authorities. Never share your bank details, OTPs, ATM PINs, internet banking credentials or card images with anyone.\n\nCalls, texts or emails warning that your debit card or account is about to be blocked are designed to cause panic. Stay calm and verify the claim through your bank\u2019s official website, app or customer care number, not through links or instructions given by the caller.\n\nContact your bank or card issuer as soon as you notice or suspect a fraudulent transaction. Block the affected card or digital banking access, and report the incident through official channels.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 10:47 AM IST", "pub_date_relative": "53m ago"}, {"title": "EPFO shares stepwise guide on PM Viksit Bharat Rozgar Yojana: How salaried workers can unlock full \u20b915,000 incentive", "full_content": "The Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY) is a welfare scheme for salaried workers and employers. Launched in August 2025, it provides \u201cemployment linked incentives\u201d over a two-year period from 1 August 2025 to 31 July 2027, with an outlay of \u20b9 99,446 crore.\n\nSalaried employees earning up to \u20b9 1 lakh per month are eligible for incentives of up to \u20b9 15,000 each, to be paid through the Direct Benefit Transfer (DBT) system to their Aadhaar seeded bank account, according to the scheme document.\n\nOverall, the scheme comprises two parts \u2014 Part A which incentivises first time joiners to the workforce, and Part B which incentivises employers to generate and sustain employment, as follows:\n\nThe first instalment is paid after six months of service and the second after 12 months of continuous service, following completion of a financial literacy programme. A portion of the incentive is invested in a designated savings instrument, encouraging financial security and savings and can be withdrawn by the employee at a later date.\n\nFor this scheme, the following are considered eligible to join and receive incentives :\n\nThus, you must be a first-time employee registered with the EPFO earning monthly salary of not more than \u20b9 1,00,000 and have completed six months of employment in the same establishment. You will have to activate and authenticate UAN through the Aadhaar face authentication app and ensure a DBT enabled bank account.\n\nNotably, the \u20b9 15,000 incentive under PMVBY is maximum cap, and your particular amount will be calculated based on your one completed month EPF wage.\n\nHere, the first installment, capped at \u20b9 7,500, will be paid after completion of six months of service. Further, the second will be paid after 12 months of continuous service and following the completion of a financial literacy course (FLC).", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 10:43 AM IST", "pub_date_relative": "57m ago"}, {"title": "Tata Group stock to buy on Dussehra 2026 for money gains - Check target, stop loss by Choice Broking's Sumeet Bagadia", "full_content": "Stock to buy on Dussehra 2026 : Brokerage firm Choice Broking's Executive Director Sumeet Bagadia has recommended Tata Group's jewellery stock, Titan , to buy on the auspicious occasion of Dussehra 2026.\n\nBagadia said that the Tata Group stock is maintaining a long-term bullish structure on the weekly chart, supported by an ascending trendline that has consistently provided support and helped the stock form higher lows over the past few years.\n\nHe added that the latest weekly candlestick indicates stabilization near this major trendline support, with a tight consolidation suggesting that buyers are attempting to defend the prevailing uptrend.\n\nOn the technical outlook of Titan share price, he highlighted, \u201cThe stock is currently taken rebound from 50 EMA, where a sustained buying interest could support a recovery. The RSI is at 44.95, indicating that momentum remains relatively moderate and has yet to turn decisively bullish. A rebound from the current support area could improve the technical outlookand create an opportunity for further upside.\u201d\n\nFor positional trades, Bagadia suggested that buying can be considered around \u20b9 4,420, with additional accumulation on dips towards \u20b9 4,300. The stock has the potential to move towards upside targets of \u20b9 4,860 and \u20b9 5,085. The support of 4070 remains crucial, and holding above this zone will be important for sustaining the long-term bullish structure.\n\nTitan Company \u2019s stock has witnessed a decline in the short term, falling 1.40% over the past week. The selling pressure has intensified over the past month, with the stock declining 7.80%, indicating a recent correction after its earlier gains.\n\nDespite the recent weakness, Titan shares have delivered positive returns over the longer term.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago"}, {"title": "Japan's 2nd-largest bank leases property in Mumbai's BKC for Rs 189 crore for 5 years", "full_content": "Japan's second largest bank Sumitomo Mitsui Banking Corporation (SMBC) has leased 49,820 sq ft of office space in Mumbai's Bandra-Kurla Complex under a five-year rent agreement for approximately Rs 3.46 crore a month, amounting to a total of Rs 189 crore per year.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 10:35 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why should you buy Vedanta shares despite strong Hindustan Zinc Q2 results 2026? Experts' views, target price", "full_content": "Hindustan Zinc Q2 Results 2026 effect: The Vedanta Group company Hindustan Zinc Ltd delivered strong Q2 results on Monday, beating the market estimates with Q2 EBITDA of \u20b9 9,290 crore, up 14.20% QoQ. The QoQ EBITDA growth is robust, with the consensus market estimate at 6.90% for Hindustan Zinc Ltd during Q2FY27.\n\nAccording to experts, Hindustan Zinc's strong EBIDTA growth was mainly driven by lower zinc cost of production ($703/t vs $851/t in 1Q), which was supported by higher sulfuric acid realisations during 2Q; this was further backed by the sequentially higher volumes across silver and lead, which increased 16.1% and 8.5% QoQ, respectively, and the Indian National Rupee (INR) depreciation.\n\nDecoding the Hindustan Zinc Q2 results, Shweta Dikshit, Deputy Vice President \u2013 Metals and Mining at Systematix Institutional Equities, said, \u201cHindustan Zinc (HZ) reported strong 2QFY27 revenue of \u20b9 14,582 crore (+76% YoY/+12% QoQ), 12% above our estimate, driven by higher metal production, higher by-product realisations, and a stronger dollar.\u201d\n\nThe Systematix Institutional Equities expert said that the company's EBITDA grew by around 108% YoY, whereas EBITDA margin improved by 928bps YoY and 272bps QoQ to 61.3% in Q2FY27.\n\nGiving a \u2018buy\u2019 tag to Hindustan Zinc shares after strong Q2 results 2026, Shwetta Dixit of Systematix Institutional Equities, said, \"We raise our FY27E/FY28E EBITDA estimates by 23%/9%, reflecting stronger 1HFY27 performance, lower CoP assumptions and higher zinc prices, and introduce FY29 estimates.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "New Zealand firm Valocity secures biggest-ever deal on day one of India FTA: PM Luxon", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a New Zealand firm Valocity secures biggest-ever deal on day one of India FTA: PM Luxon The Economic Times daily newspaper is available online now. Read Today's Paper New Zealand firm Valocity secures biggest-ever deal on day one of India FTA: PM Luxon SECTIONS New Zealand firm Valocity secures biggest-ever deal on day one of India FTA: PM Luxon ANI Last Updated: Oct 20, 2026, 10:33:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Auckland-based property technology company Valocity has secured the biggest deal in its history on the first day of the India-New Zealand Free Trade Agreement (FTA), New Zealand Prime Minister Christopher Luxon said. Highlighting the agreement's potential to boost business opportunities, Luxon said the trade pact would help New Zealand companies expand overseas while creating jobs and raising incomes at home.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Jaguar Unveils 130,000 Pound Electric Car in UK Brand's Reboot", "full_content": "The new model, the first in eight years, arrives at a key moment for Jaguar after a radical rebranding in 2024 was met with criticism. A video released at the time to build anticipation prompted mixed reviews when it was devoid of vehicles and featured expressionless fashion models.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "What has actually battered the bond market?", "full_content": "A fixed-income whodunit", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "HDFC Bank vs ICICI Bank share price targets: Check upside potential, returns, valuations \u2014 which stock should you buy?", "full_content": "ICICI Bank and HDFC Bank remain among the most closely watched private-sector banking stocks, with their September-quarter results offering investors fresh insights into earnings growth, margins, asset quality and future profitability.\n\nWhile both lenders reported improvements in asset quality, their performance differed on several key metrics, with ICICI Bank delivering faster profit growth and stronger margins, while HDFC Bank continued to report higher absolute earnings. Experts remain positive on both stocks, although their investment arguments differ, with ICICI Bank's growth momentum contrasting with HDFC Bank's potential recovery and valuation appeal.\n\nBoth stocks closed lower on Monday, with ICICI Bank declining 1.1% to \u20b9 1,382 and HDFC Bank falling 2.3% to \u20b9 712. The Nifty dropped 1.11%, while the Bank Nifty declined 0.6%.\n\nHDFC Bank has been giving weak returns in recent times, down 3% in 1 month, 13% in 3 months, 11% in 6 months and 29% in the last 1 year.\n\nMeanwhile, ICICI Bank has been mixed. It has added 3% in 1 month but us down 4.4% in 3 months. Meanwhile, the lender advanced 2.5% in 6 months but declined 4% in the last 1 year.\n\nHDFC Bank reported standalone net profit of \u20b9 19,510 crore for the September quarter, up 4.7% year-on-year. ICICI Bank's net profit increased 20.1% to \u20b9 14,843 crore from \u20b9 12,359 crore a year earlier.\n\nICICI Bank also outperformed HDFC Bank on net interest income (NII) growth. Its NII rose 17.7% year-on-year to \u20b9 25,339 crore, compared with HDFC Bank's 9.7% increase to \u20b9 34,619 crore.\n\nBoth lenders experienced pressure on net interest margins (NIMs), partly because of foreign-currency deposits mobilised under the Reserve Bank of India's FCNR(B) swap window. ICICI Bank's NIM declined to 4.18% from 4.36% in the June quarter and 4.30% a year earlier. HDFC Bank reported a NIM of 3.32% on interest-earning assets and 3.16% on total assets.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Paras Healthcare secures Rs 652 cr from anchor investors; IPO to open on Oct 21", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Paras Healthcare secures Rs 652 cr from anchor investors; IPO to open on Oct 21 JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Paras Healthcare secures Rs 652 cr from anchor investors; IPO to open on Oct 21 SECTIONS Paras Healthcare secures Rs 652 cr from anchor investors; IPO to open on Oct 21 PTI Last Updated: Oct 20, 2026, 10:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis According to circulars uploaded on exchanges' websites, Paras Healthcare has allotted 94,15,584 equity shares to 39 funds at Rs 693 apiece, aggregating to Rs 652.5 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 10:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why have fresh investments into gold FoFs been halted, and what should you do?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAbout 20 mutual fund houses have reportedly halted fresh lump-sum investments, new SIPs (systematic investment plans) and top-ups in gold fund of funds (FoFs) following regulatory directives on 15 and 16 October. The step, as explained by experts, is designed to curb domestic gold import demand and relieve pressure on the rupee during the festive season, without disrupting direct ETF (exchange traded fund) investments.\n\nThe fund houses of State Bank of India, Kotak Mahindra, ICICI Prudential, HDFC, Tata and DSP, along with others, have restricted new incremental flows into gold FoFs, though existing active SIPs will continue.\n\n\u201cFund houses have taken action only in gold fund of funds, not in gold ETFs ,\u201d clarified Anil Ghelani, head of passive investments at DSP Mutual Fund.\n\nHe emphasized that this is not a market-driven liquidity issue, unlike what was previously seen in micro-cap or small-cap funds, where massive inflows into relatively less liquid stocks created real risks during redemption in the category, while gold remained fully liquid. Also, the restriction targets only one specific entry route.\n\n\u201cToday, if you want to buy any gold ETF, it is listed and actively traded on the NSE and BSE. You can go there and buy at any point in time,\u201d Ghelani added.\n\nA gold FoF acts as a feeder pipe that invests in underlying gold ETFs. At DSP Mutual Fund, the gold FoF has \u20b9 500 crore-600 crore of assets under management, representing roughly 20% of the \u20b9 3,000 crore gold ETF total size. According to data from DSP MF, the total industry size of gold FoF stood at \u20b9 47,359 crore as of August compared with \u20b9 53,638 crore in March and \u20b9 22,837 crore in September 2025.\n\nGhelani added that this is a structural posturing and investors need not panic by considering these restrictions as an indication of sudden liquidity pressures or price premiums or similar stress points for gold ETFs.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 10:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "'Cannot play hide and seek': Minister's warning over haze sends Singapore agricultural stocks lower", "full_content": "Shares of several Singapore-listed agricultural companies fell Tuesday after Senior Minister K Shanmugam warned they won't \"escape responsibility\" for their possible role in the haze blanketing the city-state.\n\n\"Companies cannot play hide and seek\" with different corporate structures, hoping that will help them, Shanmugam said, revealing that seven companies had been questioned by the Singapore Exchange.\n\nBumitama Agri fell as much as 6.5%, while First Resources dropped to a low of 4.83%. Golden Agri Resources and Wilmar International slipped almost 2%.\n\nShanmugam, who is also home affairs minister for the city-state, said that some of the fires or smoke source points seem to be associated with First Resources, Bumitama Agri, as well as non-listed First Borneo Plantations.\n\n\"Take, for example, First Resources. It issued a detailed statement on its zero burning policy and firefighting efforts ... but statements, no matter how well drafted, are not good enough. Show us the evidence.\"\n\nThe other companies named by the minister were Golden Agri-Resources, Wilmar International, Kencana Agri, Indofood Agri and TSH Resources.\n\nThe haze has affected businesses and daily life in Singapore and Malaysia in the past few weeks, with the air quality in Singapore hitting levels not seen since 2015.\n\nSchools in the state of Johor Bahru in Malaysia have also closed due to the air quality reaching unhealthy levels.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 10:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "UltraTech Cement Sees Further Cement Price Hikes As Fuel Costs Squeeze Margins", "full_content": "UltraTech Cement expects further price hikes to offset rising fuel costs, with the full benefit of recent increases likely to reflect in Q3 earnings.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 10:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "China Slaps Export Curbs on More Drones and Industrial Machinery", "full_content": "China's Commerce Ministry said the items have been officially classified as \"having an obvious military-civil dual-use nature,\" and that it has notified in advance countries with which Beijing has an export control dialogue.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago"}, {"title": "Buying A Flat? Realty Firm Reveals The Hidden Factor That Can Make An Apartment More Attractive", "full_content": "A completed building can draw buyers who were previously unconvinced, with the quality of construction and the community already living there helping shape their decision, according to Oberoi Realty's Vikas Oberoi.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 10:03 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bajaj Finance Shares To Be In Focus After Q2 Results. Should You Buy, Sell Or Hold The NBFC Stock?", "full_content": "Bajaj Finance Q2 results largely met the Street estimates, with most brokerages maintaining their bullish view on the stock. The company delivered a strong quarter, supported by healthy growth, positive demand commentary and prudent risk management.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "The Rs 999 Ceiling: Is Affordable Fashion Ready For A Higher Price Tag?", "full_content": "Shoppers Stop's Intune is testing products priced at Rs 1,299 and Rs 1,499 after management reported a strong response to its higher-priced range", "sour n hurdles are behind us, while the earnings ramp-up is still ahead, creating a compelling growth and re-rating opportunity,\u201d Antique Stock Broking said.\n\nThe brokerage expects Neogen's revenue, EBITDA and adjusted profit after tax (PAT) to grow at compound annual growth rates (CAGRs) of 45%, 49% and 87%, respectively, between FY26 and FY30. However, the investment case depends on the timely ramp-up of new facilities, customer offtake and the company's ability to manage elevated debt.\n\nThe chemicals stock has surged 14% in 3 months, 64% in 6 months, and 70% in the last 1 year. However, in more recent times, it has declined 2% in 1 week and 0.3% in last 1 month.\n\nIt had hit its 52-week high of \u20b9 2785 in October 2026 and its 52-week low of \u20b9 978 in December 2025.\n\nBattery chemicals are expected to become Neogen's biggest growth driver over the coming years. Its subsidiary, Neogen Ionics, manufactures battery electrolyte and lithium hexafluorophosphate (LiPF6), a key salt used in lithium-ion batteries. The company uses licensed Japanese manufacturing technology from MU Ionic Solutions and operates its salt business through a joint venture with Japan's Morita.\n\nAntique expects battery chemicals to increase their share of Neogen's revenue from 4% in FY26 to 62% by FY30.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 09:35 AM IST", "pub_date_relative": "2h ago"}, {"title": "Japan \u2018months\u2019 from running out of critical rare earth as China squeezes supply", "full_content": "Tokyo asks US to help convince Beijing to ease chokehold on yttrium and avert manufacturing shutdown", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 09:33 AM IST", "pub_date_relative": "2h ago"}, {"title": "AI debt worries spark surge in default insurance trading", "full_content": "Volumes of credit default swaps linked to big tech groups soar as investors seek protection against boom unravelling", "source": "FT Markets", "pub_date_str": "20 Oct 202 erts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 09:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Warren Buffett warned about stock valuations but Berkshire Hathaway is aggressively purchasing stocks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Warren Buffett warned about stock valuations but Berkshire Hathaway is aggressively purchasing stocks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Warren Buffett warned about stock valuations but Berkshire Hathaway is aggressively purchasing stocks SECTIONS Warren Buffett warned about stock valuations but Berkshire Hathaway is aggressively purchasing stocks By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 20, 2026, 09:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis While Buffett criticised the current market scenario, his firm Berkshire Hathaway has been pumping up its investments. The company under CEO Greg Abel has been increasing its stake in Google-parent Alphabet, making it one of Berkshire's five largest common stock holdings, led by iPhone maker Apple. Berkshire more than tripled its stake in Alphabet and purchased over $2.6 billion worth of shares in Delta Air Lines after Abel formally took on Wall Street\u2019.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 09:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bank Indonesia faces mounting pressure to hike after MSCI threat fuels market rout", "full_content": "Bank Indonesia faces mounting pressure to raise interest rates on Wednesday as economists revise their forecasts after global index provider MSCI warned it may downgrade the country's stock market from emerging-market status, setting off a selloff in stocks and the rupiah.\n\nCitibank now expects a pre-emptive 50 basis-point increase to 6.25%, abandoning its earlier call for no change. Capital Economics and Permata Bank expect a 25 basis-point hike to 6%. The central bank has held its benchmark seven-day reverse repurchase rate at 5.75% since June.\n\nMSCI said Friday it is considering moving Indonesia to \"standalone\" from the emerging-market status it has held since 1989, causing the Jakarta Composite Index to suffer the worst two-day sell-off recorded, before recovering about 3% Tuesday after authorities announced steps to improve market transparency and price discovery, including expelling tightly held companies from the flagship index.\n\nMeanwhile, rupiah weakened to 18,030 per dollar on Tuesday, near its June record low, falling about 8% this year.\n\n\"Not delivering a rate hike [on Wednesday] would run the risk of disappointing investors and fueling further downward pressure on the currency,\" said Jason Tuvey, deputy chief emerging markets economist at Capital Economics. \"A decision to hold rates on Wednesday could also revive concerns among investors that Bank Indonesia is kowtowing to political pressure.\"\n\nCiti's Helmi Arman said a hike would aim to stop equity outflows spilling into bonds and prompting capital flight by domestic investors. He expects it to be a \"one-off\" followed by other support such as government foreign-currency borrowing or another round of bilateral currency swaps with foreign central banks.\n\nThe central bank has already raised rates by a combined 100 basis points since May. Headline inflation quickened to a three-month high of 3.28% in September, within the 1.5%-3.5% target range, while core inflation eased to 2.84%.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 09:29 AM IST", "pub_date_relative": "2h ago"}, {"title": "India eyes a $20 billion pot of gold in New Zealand as its trade pact goes live", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India eyes a $20 billion pot of gold in New Zealand as its trade pact goes live The Economic Times daily newspaper is available online now. Read Today's Paper India eyes a $20 billion pot of gold in New Zealand as its trade pact goes live SECTIONS India eyes a $20 billion pot of gold in New Zealand as its trade pact goes live ET Online Last Updated: Oct 20, 2026, 09:25:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The free trade agreement between India and New Zealand promises to promote trade and enhance professional movement. While some goods may enjoy duty-free status, a significant rise in merchandise exports might take time. However, New Zealand's engagement in several service sectors holds potential benefits for Indian companies. The agreement also opens up new job opportunities for Indian students and creates pathways for skilled professionals.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 09:25 AM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Stock futures mixed after tech shares rebound to start the week: Live updates", "full_content": "U.S. stock futures were mixed early Tuesday, following a mostly higher session on Wall Street as investors jumped back into tech names after a fierce sell-off last week.\n\nThe S&P 500 futures were flat, while Nasdaq-100 futures slid 0.2%. Dow Jones Industrial Average futures traded 94 points, or 0.18% higher.\n\nThe S&P 500 climbed 0.4% in regular trading, while the Nasdaq Composite advanced more than 1%, with tech leading the charge. Nvidia added 1.4%, and Tesla jumped 3.8%. Alphabet shares advanced about 1%.\n\nIn Asia, Japan's Nikkei 225 declined 0.79% on Tuesday, while South Korea's Kospi lost 2.31%. Australia's S&P/ASX 200 traded 0.6% lower. Hong Kong's Hang Seng Index fell 1.11%, while mainland China's CSI 300 lost 0.58%.\n\nTech last week suffered a rout that spilled over into the broader market, as concerns grew around companies borrowing too much money for their artificial intelligence build-outs.\n\n\"Improving moods regarding the prospects of modern technology have Wall Street breathing a sigh of relief as participants drop hedges, after the cost of volatility protection soared intraday on Friday, ahead of the intensifying selloff,\" wrote Jose Torres, senior economist at Interactive Brokers.\n\nCoreWeave , which fell more than 25% last week, tried to recover some of that decline after a Goldman Sachs upgrade to buy. However, early gains fizzled and the stock closed slightly lower.\n\nInvestors on Tuesday will parse through a slew of corporate earnings. United Airlines is due to post after the bell, while General Motors is set to report before the open.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 11:39 AM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "McBride seeks increased buyback authority at upcoming AGM", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:33 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nykaa shares: Anand Rathi initiates coverage on e-commerce stock with 'buy' rating | Check target price, rating", "full_content": "Stock to buy : Brokerage firm Anand Rathi has initiated coverage on e-commerce platform Nykaa share price. The brokerage firm has assigned \u2018buy\u2019 rating for long-term with a target price of \u20b9 400.\n\n\u201cWe initiate coverage on Nykaa with BUY rating and a TP of Rs400, valuing the stock at 50xFY29e EBITDA. We believe Nykaa should trade at a premiumcompared to its retail peers, considering massive long-term growth runway, category leadership and margin expansion across core segments,\u201d the firm said in a note.\n\nNykaa staged a strong recovery in FY26, achieving record revenue of approximately $1 billion after two years of post-listing volatility marked by subdued growth and persistent margin pressures in its fashion business.\n\nIts turnaround strategy is centred on a dual-engine approach: improving profitability through premiumisation in its core Beauty and Personal Care (BPC) segment and strengthening the underlying economics of its fashion vertical.\n\nIt further added that its turnaround strategy is centred on a dual-engine approach: improving profitability through premiumisation in its core Beauty and Personal Care (BPC) segment and strengthening the underlying economics of its fashion vertical. The company is well-positioned to benefit from the growing number of digitally savvy consumers as India's retail market shifts from offline to online channels and from unorganised to organised retail.\n\n\u201cWith a leading share in beauty segment, a portfolio of premium and exclusive brand partnerships, continued momentum in the House of Nykaa portfolio, and improving unit economics within Nykaa Fashion, it has built a differentiated platform across BPC and Fashion,\u201d it added.\n\nNykaa shares have delivered strong returns over the medium to long term, despite witnessing some near-term fluctuations.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 11:30 AM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold price outlook: Yellow metal prices cool 26% from record high: What Indian buyers are doing this Dussehra, Diwali?", "full_content": "Gold Outlook : Gold remains a preferred investment and festive purchase for Indian households, with demand typically picking up during Dussehra, Diwali and the wedding season. However, elevated prices are changing buying patterns, prompting some families to opt for lighter jewellery while others are turning to coins, bars and gold exchange-traded funds (ETFs).\n\nWith the yellow metal having corrected from its record highs, buyers are assessing whether the dip offers an opportunity to purchase gold or whether prices could face further pressure.\n\nGold prices edged higher on Tuesday, supported by a softer US dollar, as investors looked ahead to the US Federal Reserve's October 27\u201328 policy meeting for clues on the future path of interest rates. Spot gold rose 0.1% to $4,145.22 per ounce by 0347 GMT, while US gold futures for December delivery gained 0.1% to $4,164.70.\n\nThe recovery followed a correction of more than 26% from record highs in January 2026. According to CME's FedWatch Tool, traders were pricing in an 82% probability that the Federal Reserve would leave interest rates unchanged at its October meeting, although expectations of a rate hike in December remained elevated at 89%. Higher interest rates typically weigh on gold because bullion does not pay interest, increasing the opportunity cost of holding it. A weaker dollar, meanwhile, makes greenback-priced gold more affordable for overseas buyers.\n\nAshish Rajodiya, Head of Commodities at PL Capital, said softer crude prices and lower Treasury yields had supported bullion after recent volatility. He added that the Fed's policy statement and upcoming inflation data would be key triggers, while a renewed oil-price spike or hawkish signals could put pressure on gold and silver.\n\nGold ETFs attracted net inflows of \u20b9 2,596.70 crore in August, up from \u20b9 1,559 crore in July, marking the third consecutive month of positive flows.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 11:27 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Copper is outshining gold this year. Investors say the rally can survive an AI correction", "full_content": "Copper is becoming increasingly strategic to governments and industries as artificial intelligence, power-grid investment and defense spending increase demand for the industrial metal, investors say.\n\nThe metal \u2014 a key component in electronics, construction and transportation, and often seen as a barometer of economic activity \u2014 has outperformed gold this year, as the need to secure reliable supplies has intensified.\n\nCopper has rallied 15.8% year-to-date, and is up more than 30% over the past 12 months. By comparison, gold futures have slipped 4.11% year-to-date, and are down 4.52% over the past 12 months. Spot gold is 4.89% lower over the past 12 months, and 4% down year-to-date.\n\nSpeaking to CNBC's \"Squawk Box Europe,\" Ivanhoe Electric CEO Taylor Melvin said countries, regions and industries are increasingly focused on securing access to metals for national security, economic growth and technology infrastructure. Melvin said that shift has helped support copper prices.\n\n\"It's certainly a good time to be in copper mining globally, and specifically in the United States,\" said Melvin, whose Arizona-based mining and exploration company focuses on copper, gold, silver, nickel and cobalt.\n\n\"We're really in a world right now where the metals that we used to refer to, and still do, as critical metals are really becoming strategic metals, in every sense of the word,\" said Melvin, who spoke as LME Week, the annual gathering of the global metals industry, began in London on Monday.\n\nThat shift comes as investors question the sustainability of AI spending and the hyperscaler build-out, which has led to a recent wobble in tech stocks.\n\nBut Melvin said he expects copper to withstand the recent volatility.", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 11:27 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ABB Q3 orders surge on data-centre boom as operating profit beats forecasts", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:25 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank of Japan may raise inflation forecast, stand pat on rates, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 11:24 AM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "IT, FMCG lose defensive sheen. Where should investors seek safety now?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nFor years, investors seeking refuge during market swings gravitated towards IT and consumer staples stocks, but that strategy is looking less reliable today as both sectors wrestle with slowing growth, rising competition and shifting investor expectations.\n\nA sector is defensive \u201cwhen earnings volatility is amongst the lowest, when the ownership of this sector is quite low, and expectations are low,\u201d said Harish Krishnan, chief investment officer Equity, Aditya Birla Sun Life AMC.\n\nThe numbers tell the story. Over the past three years, the Nifty IT index has gone nowhere, while the Nifty FMCG index has fallen 16%. In contrast, Nifty 50 has gained 17%, according to Bloomberg data.\n\nFund managers say these sectors no longer have the combination that once made them dependable safe havens: low expectations, limited investor ownership and steady earnings.\n\nBloomberg data showed that Nifty IT surged 166% in 2009 and 60% in 2021, while Nifty FMCG gained 59% in 2005 and 48.5% in 2012\u2014returns that market participants believe may be difficult to replicate.\n\n\u201cI agree,\u201d says Trilok Agarwal, fund manager at Ambit Asset Management, adding that those periods were driven by exceptional circumstances rather than normal business cycles.\n\nThe 2009 and 2021 IT rallies were driven by post-crisis recovery and a digitalisation boom, but with both sectors maturing, growth is slowing amid AI disruption, stronger competition and changing consumer behaviour.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 11:18 AM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tonbo Imaging\u2019s Rs 852 crore IPO subscribed 140x. Check GMP, allotment, other details", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Tonbo Imaging\u2019s Rs 852 crore IPO subscribed 140x. Check GMP, allotment, other details National Stock Exchange of India Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Tonbo Imaging\u2019s Rs 852 crore IPO subscribed 140x. Check GMP, allotment, other details SECTIONS Tonbo Imaging\u2019s Rs 852 crore IPO subscribed 140x. Check GMP, allotment, other details By Veer Sharma , ETMarkets.com Last Updated: Oct 20, 2026, 11:15:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The issue received bids for 1,15,86,91,464 shares against 85,26,033 shares on offer. Qualified institutional buyers led the demand, subscribing to their allotted portion 293.56 times. The non-institutional investor category was subscribed 170.94 times, while the retail portion saw 31.06 times subscription.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 11:15 AM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Waiting for good IPO", "full_content": "Anthropic\u2019s shrinking window to list", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 11:00 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The world\u2019s finance chiefs see new risks \u2014 and less China angst", "full_content": "The world's finance chiefs spent last week in Bangkok debating the biggest risk facing the global economy \u2014 with debt, artificial intelligence and trade imbalances topping the list. Meanwhile, China, long a main risk factor in these discussions, was no longer at the top of the worry list.\n\nThe Bangkok meetings were the first in Asia since 2018, when the gathering was held in Bali, Indonesia . Thailand last hosted in 1991, six years before the unpegging of the baht from the U.S. dollar set off the Asian financial crisis.\n\nFast-forward to 2026, and anything from global imbalances to the AI boom or a massive debt buildup in the \"Global North\" could trigger the next financial crisis, said Kevin Gallagher, director of Boston University's Global Development Policy Center, who spoke with reporters in Beijing after attending the IMF and World Bank meetings.\n\nThe IMF was upbeat on economies positioned to benefit from the global AI supply chain, such as South Korea, Japan and China, and downbeat on those that aren't, warning that the AI build-out is widening gaps between economies.\n\nAI-related borrowing is also pushing up debt levels and competing with governments for capital, which lifts borrowing costs further. The IMF warned that should AI technology fail to deliver the promised productivity gains, it could trigger severe global economic consequences.\n\nGallagher said he's watching whether the IMF, the Federal Reserve and People's Bank of China can coordinate, or end up going in different directions and \"make things worse.\"\n\nThe U.S. Treasury is at odds with the Fund over its own debt. IMF Managing Director Kristalina Georgieva said strong growth alone won't put the U.S. on a sustainable path , with federal debt above $40 trillion. David Zervos, a counselor to Treasury Secretary Scott Bessent, dismissed the warning. \"It's good to remember how messy their forecasts have been in the past,\" he said.", "source": "CNBC Finance", "pub_date_str": "20 Oct 2026, 10:57 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Global Market: China and Hong Kong shares weaken as stable growth eases stimulus bets", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: China and Hong Kong shares weaken as stable growth eases stimulus bets Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: China and Hong Kong shares weaken as stable growth eases stimulus bets SECTIONS Global Market: China and Hong Kong shares weaken as stable growth eases stimulus bets Reuters Last Updated: Oct 20, 2026, 10:52:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China and Hong Kong stocks weakened on Tuesday, joining a broader retreat in the region, after Beijing kept key lending rates unchanged and stronger GDP data dampened\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\nOne company, 2 words.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 10:52 AM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SBI cyber fraud: Kerala HC orders \u20b93.73 lakh refund. Can you get a refund after sharing an OTP?", "full_content": "Cyber fraudsters often impersonate bank, ED, RBI and police officials to trick customers into sharing confidential information such as OTPs, CVVs and ATM PINs. They use fear and urgency to pressure victims, then use the details to carry out unauthorised transactions, often causing serious financial loss.\n\nIn a recent case, the Kerala High Court directed the State Bank of India (SBI) to refund \u20b9 3.73 lakh to a retired college principal after an unauthorised transaction was made on her debit card. The ruling highlights the importance of promptly reporting fraud, staying vigilant, and understanding your rights as a customer. The case was reported by The Indian Express .\n\nAccording to the report, the victim received an SMS saying her debit card would soon be blocked. A call offering reactivation followed, from a number that looked official. Trusting the caller, she shared an OTP for the \u201cregistration\u201d of the purported SBI Secure App, after which \u20b9 3.73 lakh was debited from her account.\n\nBanks and their officials never ask customers to disclose confidential information, such as OTPs , over calls or messages. Turn down any such request immediately.\n\nFraudsters often pose as senior bank or police officers, so do not engage with such callers, and report the number to the authorities. Never share your bank details, OTPs, ATM PINs, internet banking credentials or card images with anyone.\n\nCalls, texts or emails warning that your debit card or account is about to be blocked are designed to cause panic. Stay calm and verify the claim through your bank\u2019s official website, app or customer care number, not through links or instructions given by the caller.\n\nContact your bank or card issuer as soon as you notice or suspect a fraudulent transaction. Block the affected card or digital banking access, and report the incident through official channels.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 10:47 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tata Group stock to buy on Dussehra 2026 for money gains - Check target, stop loss by Choice Broking's Sumeet Bagadia", "full_content": "Stock to buy on Dussehra 2026 : Brokerage firm Choice Broking's Executive Director Sumeet Bagadia has recommended Tata Group's jewellery stock, Titan , to buy on the auspicious occasion of Dussehra 2026.\n\nBagadia said that the Tata Group stock is maintaining a long-term bullish structure on the weekly chart, supported by an ascending trendline that has consistently provided support and helped the stock form higher lows over the past few years.\n\nHe added that the latest weekly candlestick indicates stabilization near this major trendline support, with a tight consolidation suggesting that buyers are attempting to defend the prevailing uptrend.\n\nOn the technical outlook of Titan share price, he highlighted, \u201cThe stock is currently taken rebound from 50 EMA, where a sustained buying interest could support a recovery. The RSI is at 44.95, indicating that momentum remains relatively moderate and has yet to turn decisively bullish. A rebound from the current support area could improve the technical outlookand create an opportunity for further upside.\u201d\n\nFor positional trades, Bagadia suggested that buying can be considered around \u20b9 4,420, with additional accumulation on dips towards \u20b9 4,300. The stock has the potential to move towards upside targets of \u20b9 4,860 and \u20b9 5,085. The support of 4070 remains crucial, and holding above this zone will be important for sustaining the long-term bullish structure.\n\nTitan Company \u2019s stock has witnessed a decline in the short term, falling 1.40% over the past week. The selling pressure has intensified over the past month, with the stock declining 7.80%, indicating a recent correction after its earlier gains.\n\nDespite the recent weakness, Titan shares have delivered positive returns over the longer term.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 10:36 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why should you buy Vedanta shares despite strong Hindustan Zinc Q2 results 2026? Experts' views, target price", "full_content": "Hindustan Zinc Q2 Results 2026 effect: The Vedanta Group company Hindustan Zinc Ltd delivered strong Q2 results on Monday, beating the market estimates with Q2 EBITDA of \u20b9 9,290 crore, up 14.20% QoQ. The QoQ EBITDA growth is robust, with the consensus market estimate at 6.90% for Hindustan Zinc Ltd during Q2FY27.\n\nAccording to experts, Hindustan Zinc's strong EBIDTA growth was mainly driven by lower zinc cost of production ($703/t vs $851/t in 1Q), which was supported by higher sulfuric acid realisations during 2Q; this was further backed by the sequentially higher volumes across silver and lead, which increased 16.1% and 8.5% QoQ, respectively, and the Indian National Rupee (INR) depreciation.\n\nDecoding the Hindustan Zinc Q2 results, Shweta Dikshit, Deputy Vice President \u2013 Metals and Mining at Systematix Institutional Equities, said, \u201cHindustan Zinc (HZ) reported strong 2QFY27 revenue of \u20b9 14,582 crore (+76% YoY/+12% QoQ), 12% above our estimate, driven by higher metal production, higher by-product realisations, and a stronger dollar.\u201d\n\nThe Systematix Institutional Equities expert said that the company's EBITDA grew by around 108% YoY, whereas EBITDA margin improved by 928bps YoY and 272bps QoQ to 61.3% in Q2FY27.\n\nGiving a \u2018buy\u2019 tag to Hindustan Zinc shares after strong Q2 results 2026, Shwetta Dixit of Systematix Institutional Equities, said, \"We raise our FY27E/FY28E EBITDA estimates by 23%/9%, reflecting stronger 1HFY27 performance, lower CoP assumptions and higher zinc prices, and introduce FY29 estimates.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "New Zealand firm Valocity secures biggest-ever deal on day one of India FTA: PM Luxon", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a New Zealand firm Valocity secures biggest-ever deal on day one of India FTA: PM Luxon The Economic Times daily newspaper is available online now. Read Today's Paper New Zealand firm Valocity secures biggest-ever deal on day one of India FTA: PM Luxon SECTIONS New Zealand firm Valocity secures biggest-ever deal on day one of India FTA: PM Luxon ANI Last Updated: Oct 20, 2026, 10:33:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Auckland-based property technology company Valocity has secured the biggest deal in its history on the first day of the India-New Zealand Free Trade Agreement (FTA), New Zealand Prime Minister Christopher Luxon said. Highlighting the agreement's potential to boost business opportunities, Luxon said the trade pact would help New Zealand companies expand overseas while creating jobs and raising incomes at home.\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 10:33 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "What has actually battered the bond market?", "full_content": "A fixed-income whodunit", "source": "FT Markets", "pub_date_str": "20 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "HDFC Bank vs ICICI Bank share price targets: Check upside potential, returns, valuations \u2014 which stock should you buy?", "full_content": "ICICI Bank and HDFC Bank remain among the most closely watched private-sector banking stocks, with their September-quarter results offering investors fresh insights into earnings growth, margins, asset quality and future profitability.\n\nWhile both lenders reported improvements in asset quality, their performance differed on several key metrics, with ICICI Bank delivering faster profit growth and stronger margins, while HDFC Bank continued to report higher absolute earnings. Experts remain positive on both stocks, although their investment arguments differ, with ICICI Bank's growth momentum contrasting with HDFC Bank's potential recovery and valuation appeal.\n\nBoth stocks closed lower on Monday, with ICICI Bank declining 1.1% to \u20b9 1,382 and HDFC Bank falling 2.3% to \u20b9 712. The Nifty dropped 1.11%, while the Bank Nifty declined 0.6%.\n\nHDFC Bank has been giving weak returns in recent times, down 3% in 1 month, 13% in 3 months, 11% in 6 months and 29% in the last 1 year.\n\nMeanwhile, ICICI Bank has been mixed. It has added 3% in 1 month but us down 4.4% in 3 months. Meanwhile, the lender advanced 2.5% in 6 months but declined 4% in the last 1 year.\n\nHDFC Bank reported standalone net profit of \u20b9 19,510 crore for the September quarter, up 4.7% year-on-year. ICICI Bank's net profit increased 20.1% to \u20b9 14,843 crore from \u20b9 12,359 crore a year earlier.\n\nICICI Bank also outperformed HDFC Bank on net interest income (NII) growth. Its NII rose 17.7% year-on-year to \u20b9 25,339 crore, compared with HDFC Bank's 9.7% increase to \u20b9 34,619 crore.\n\nBoth lenders experienced pressure on net interest margins (NIMs), partly because of foreign-currency deposits mobilised under the Reserve Bank of India's FCNR(B) swap window. ICICI Bank's NIM declined to 4.18% from 4.36% in the June quarter and 4.30% a year earlier. HDFC Bank reported a NIM of 3.32% on interest-earning assets and 3.16% on total assets.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Paras Healthcare secures Rs 652 cr from anchor investors; IPO to open on Oct 21", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Paras Healthcare secures Rs 652 cr from anchor investors; IPO to open on Oct 21 JM Financial Share Price Choice International Share Price IIFL Capital Services Share Price Anand Rathi Share & Stock Brokers Share Price SMC Global Securities Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Paras Healthcare secures Rs 652 cr from anchor investors; IPO to open on Oct 21 SECTIONS Paras Healthcare secures Rs 652 cr from anchor investors; IPO to open on Oct 21 PTI Last Updated: Oct 20, 2026, 10:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis According to circulars uploaded on exchanges' websites, Paras Healthcare has allotted 94,15,584 equity shares to 39 funds at Rs 693 apiece, aggregating to Rs 652.5 crore.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 10:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Why have fresh investments into gold FoFs been halted, and what should you do?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nAbout 20 mutual fund houses have reportedly halted fresh lump-sum investments, new SIPs (systematic investment plans) and top-ups in gold fund of funds (FoFs) following regulatory directives on 15 and 16 October. The step, as explained by experts, is designed to curb domestic gold import demand and relieve pressure on the rupee during the festive season, without disrupting direct ETF (exchange traded fund) investments.\n\nThe fund houses of State Bank of India, Kotak Mahindra, ICICI Prudential, HDFC, Tata and DSP, along with others, have restricted new incremental flows into gold FoFs, though existing active SIPs will continue.\n\n\u201cFund houses have taken action only in gold fund of funds, not in gold ETFs ,\u201d clarified Anil Ghelani, head of passive investments at DSP Mutual Fund.\n\nHe emphasized that this is not a market-driven liquidity issue, unlike what was previously seen in micro-cap or small-cap funds, where massive inflows into relatively less liquid stocks created real risks during redemption in the category, while gold remained fully liquid. Also, the restriction targets only one specific entry route.\n\n\u201cToday, if you want to buy any gold ETF, it is listed and actively traded on the NSE and BSE. You can go there and buy at any point in time,\u201d Ghelani added.\n\nA gold FoF acts as a feeder pipe that invests in underlying gold ETFs. At DSP Mutual Fund, the gold FoF has \u20b9 500 crore-600 crore of assets under management, representing roughly 20% of the \u20b9 3,000 crore gold ETF total size. According to data from DSP MF, the total industry size of gold FoF stood at \u20b9 47,359 crore as of August compared with \u20b9 53,638 crore in March and \u20b9 22,837 crore in September 2025.\n\nGhelani added that this is a structural posturing and investors need not panic by considering these restrictions as an indication of sudden liquidity pressures or price premiums or similar stress points for gold ETFs.", "source": "LiveMint Money", "pub_date_str": "20 Oct 2026, 10:26 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "UltraTech Cement Sees Further Cement Price Hikes As Fuel Costs Squeeze Margins", "full_content": "UltraTech Cement expects further price hikes to offset rising fuel costs, with the full benefit of recent increases likely to reflect in Q3 earnings.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 10:18 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "China Slaps Export Curbs on More Drones and Industrial Machinery", "full_content": "China's Commerce Ministry said the items have been officially classified as \"having an obvious military-civil dual-use nature,\" and that it has notified in advance countries with which Beijing has an export control dialogue.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 10:10 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bajaj Finance Shares To Be In Focus After Q2 Results. Should You Buy, Sell Or Hold The NBFC Stock?", "full_content": "Bajaj Finance Q2 results largely met the Street estimates, with most brokerages maintaining their bullish view on the stock. The company delivered a strong quarter, supported by healthy growth, positive demand commentary and prudent risk management.", "source": "NDTV Profit", "pub_date_str": "20 Oct 2026, 09:58 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Jio IPO\u2019s GMP r underway, the key execution hurdles are behind us, while the earnings ramp-up is still ahead, creating a compelling growth and re-rating opportunity,\u201d Antique Stock Broking said.\n\nThe brokerage expects Neogen's revenue, EBITDA and adjusted profit after tax (PAT) to grow at compound annual growth rates (CAGRs) of 45%, 49% and 87%, respectively, between FY26 and FY30. However, the investment case depends on the timely ramp-up of new facilities, customer offtake and the company's ability to manage elevated debt.\n\nThe chemicals stock has surged 14% in 3 months, 64% in 6 months, and 70% in the last 1 year. However, in more recent times, it has declined 2% in 1 week and 0.3% in last 1 month.\n\nIt had hit its 52-week high of \u20b9 2785 in October 2026 and its 52-week low of \u20b9 978 in December 2025.\n\nBattery chemicals are expected to become Neogen's biggest growth driver over the coming years. Its subsidiary, Neogen Ionics, manufactures battery electrolyte and lithium hexafluorophosphate (LiPF6), a key salt used in lithium-ion batteries. The company uses licensed Japanese manufacturing technology from MU Ionic Solutions and operates its salt business through a joint venture with Japan's Morita.\n\nAntique expects battery chemicals to increase their share of Neogen's revenue from 4% in FY26 to 62% by FY30.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 09:35 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "From \u20b9228 a GB to \u20b97.5: How Mukesh Ambani\u2019s Jio rewired India\u2019s internet and is now seeking a \u20b910 lakh crore valuation", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a From \u20b9228 a GB to \u20b97.5: How Mukesh Amb
