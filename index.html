ted event contracts.\n\n\"We hold that Kalshi has not shown that its sports-event contracts satisfy the statutory definition of a 'swap' so as to fall within the scope of the CFTC's 'exclusive jurisdiction,'\" the opinion said.\n\nKalshi and other prediction market platforms argue all event contracts are swaps , a type of financial derivative that is regulated by the Commodity Futures Trading Commission . However, states assert that platforms' sports-related offerings amount to gambling , and thus should be regulated by their laws related to sports betting.\n\nThis disagreement has spawned a legal battle across the country as states sue platforms for operating what they often claim are illegal gambling operations, while exchanges also sue states to block them from enforcing local laws on what they argue should be federally-regulated financial exchanges.\n\nThe CFTC has sued nine states to defend what it believes is its exclusive right to regulate event contracts, given to it by the Commodity Exchange Act. But the 6th Circuit panel rejected that notion.\n\n\"Even assuming that Kalshi's sports-event contracts are swaps, we alternatively hold that the CEA neither expressly nor impliedly preempts Ohio's or Tennessee's gambling laws,\" the opinion said. The decision overturns a Tennessee federal district court ruling that sided with Kalshi, and reaffirms a decision by a federal district court in Ohio that sided with the states' argument.\n\n\"Kalshi attempted an end run around Tennessee law to avoid any of the rules or taxes associated with sports gambling.", "source": "CNBC Finance", "pub_date_str": "26 Sep 2026, 04:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "Could an iced coffee freeze you out of the job market? - BBC", "full_content": "Could an iced coffee freeze you out of the job market? BBC How Iced Coffee Sparked a Generational Debate The New York Times The iced coffee debate reflects 'everything wrong with hiring right now,' says career expert CNBC Wha \nWith the day's gains, the Dow notched a winning week, up 0.3%. The S&P 500 added 1.2%, while the Nasdaq rose 2%.\n\nThat advance was bolstered by technology stocks such as Meta Platforms , which popped nearly 13% on the week amid excitement surrounding its artificial intelligence agent Muse . Information technology rose 3.1%, which was the most of any of the S&P 500's sectors.\n\nThe drama continued in the bond market, where the 10-year Treasury yield climbed to its highest level since 2007 , while the 30-year yield reached its highest level since 2004. The two were last seen up slightly at 5.163% and 5.488%, respectively.\n\nThis week's ascent in yields was fueled by hawkish comments from Federal Reserve Governor Michael Barr, persistently high energy prices due to the Iran war, and a hot purchasing managers' report. Fed funds futures trading suggests a roughly 64% likelihood of a rate hike in October, according to the CME FedWatch tool .", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 04:11 AM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018She says it\u2019s just money\u2019: My friend pays for everything. I should be grateful, but I can\u2019t stand her anymore.", "full_content": "\u201cOn each of these weekends away, she\u2019s probably spending $500.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 03:30 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Centre cuts FY27 market borrowing to Rs 15.99 lakh crore; targets longer debt maturity", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a Centre cuts FY27 market borrowing to Rs 15.99 lakh crore; targets longer debt maturity The Economic Times daily newspaper is available online now. Read Today's Paper Centre cuts FY27 market borrowing to Rs 15.99 lakh crore; targets longer debt maturity SECTIONS Ce ourt of Appeals ruled on Friday that states have a right to regulate sports-related event contracts on prediction market platforms, marking a second major legal defeat for the industry as a fight at the U.S. Supreme Court looms.\n\nIn a unanimous decision, the three judge panel said that Ohio and Tennessee are permitted to apply their state gambling laws to Kalshi's sports-related event contracts.\n\n\"We hold that Kalshi has not shown that its sports-event contracts satisfy the statutory definition of a 'swap' so as to fall within the scope of the CFTC's 'exclusive jurisdiction,'\" the opinion said.\n\nKalshi and other prediction market platforms argue all event contracts are swaps , a type of financial derivative that is regulated by the Commodity Futures Trading Commission . However, states assert that platforms' sports-related offerings amount to gambling , and thus should be regulated by their laws related to sports betting.\n\nThis disagreement has spawned a legal battle across the country as states sue platforms for operating what they often claim are illegal gambling operations, while exchanges also sue states to block them from enforcing local laws on what they argue should be federally-regulated financial exchanges.\n\nThe CFTC has sued nine states to defend what it believes is its exclusive right to regulate event contracts, given to it by the Commodity Exchange Act. But the 6th Circuit panel rejected that notion.\n\n\"Even assuming that Kalshi's sports-event contracts are swaps, we alternatively hold that the CEA neither expressly nor impliedly preempts Ohio's or Tennessee's gambling laws,\" the opinion said. The decision overturns a Tennessee federal district court ruling that sided with Kalshi, and reaffirms a decision by a federal district court in Ohio that sided with the states' argument.\n\n\"Kalshi attempted an end run around Tennessee law to avoid any of the rules or taxes associated with sports gambling.", "source": "CNBC Finance", "pub_date_str": "26 Sep 2026, 04:58 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Dow jumps more than 470 points Friday; stocks notch winning week despite Treasury yield surge", "full_content": "U.S. equities rose on Friday as Wall Street wrapped up a volatile week of trading, with a surge in Treasury yields rippling through financial markets.\n\nThe S&P 500 climbed 0.51% to close at 7,743.41, while the Nasdaq Composite gained 0.5% to 27,068.72. The Dow Jones Industrial Average advanced 478.64 points, or 0.93% to end at 51,828.62.\n\nAkamai Technologies was a key winner of the session, rising 3% after announcing a multiyear deal with Anthropic .\n\nAlso helping sentiment, oil prices slid amid optimism that the Strait of Hormuz could be reopened, as Iran has asked the U.S. to return to the memorandum of understanding from June that failed to end the Middle East conflict. West Texas Intermediate crude futures dropped 2.33% to settle at $92.41 per barrel, while international benchmark Brent crude futures declined 2.14% to $104.32 a barrel.\n\nWith the day's gains, the Dow notched a winning week, up 0.3%. The S&P 500 added 1.2%, while the Nasdaq rose 2%.\n\nThat advance was bolstered by technology stocks such as Meta Platforms , which popped nearly 13% on the week amid excitement surrounding its artificial intelligence agent Muse . Information technology rose 3.1%, which was the most of any of the S&P 500's sectors.\n\nThe drama continued in the bond market, where the 10-year Treasury yield climbed to its highest level since 2007 , while the 30-year yield reached its highest level since 2004. The two were last seen up slightly at 5.163% and 5.488%, respectively.\n\nThis week's ascent in yields was fueled by hawkish comments from Federal Reserve Governor Michael Barr, persistently high energy prices due to the Iran war, and a hot purchasing managers' report. Fed funds futures trading suggests a roughly 64% likelihood of a rate hike in October, according to the CME FedWatch tool .", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 04:11 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "A \u2018death cross\u2019 is coming for the dollar. Why Trump will be happy.", "full_content": "Don\u2019t look now, but there are some technical reasons to believe that U.S. Treasury Secretary Scott Bessent was right when he declared to the financial markets that \u201cI am the house now.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 03:27 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Trump, Xi wrap state visit centered on spectacle over substance. Here are the top takeaways", "full_content": "Chinese leader Xi Jinping ended his first formal trip to Washington in 11 years Friday, capping a highly anticipated state visit with President Donald Trump that saw three days of bonhomie and pageantry but delivered few concrete agreements.\n\nTrump gave Xi a rare airport tarmac greeting, the two leaders enjoyed a splashy state dinner and tea with their spouses and visited the National Archives. In between ceremonial elements, Trump and Xi inked an extension to an existing trade pact , and Xi promised to send a pair of pandas to Atlanta.\n\nWhat didn't happen were promises of purchases or agreement on addressing artificial intelligence risks , the war in Iran or taking steps toward resolving other vexing world challenges.\n\nA state visit that featured much pomp but little change in circumstances might have been intentional.\n\n\"Ahead of the midterms, President Trump's interest is to keep things calm,\" Scott Kennedy , a Center for Strategic and International Studies senior advisor who studies the Chinese economy. \"We have interest rates getting to record highs, and he doesn't want to make markets even more skittish.\"\n\n\"I think it's a great success,\" said Hai Zhao, a director of international political studies at the Chinese Academy of Social Sciences, a state-affiliated think tank. \"Chinese people are very happy to see that President Xi is very well received in Washington, D.C.,\" he said as the Trump-Xi dinner was wrapping up.\n\nOne concrete deliverable came when Treasury Secretary Scott Bessent announced the U.S. and China agreed to continue their soon-to-expire trade truce until Jan. 10, a two-month extension of the agreement inked last year.\n\nWithout specifying a date, Xi noted a \"new joint arrangement\" on bilateral trade, according to Beijing's readout of his meeting with Trump.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 03:08 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Walmart chief rules out personalised pricing as AI transforms retail - Financial Times", "full_content": "Walmart chief rules out personalised pricing as AI transforms retail Financial Times Walmart won't charge a 'personalized price', CEO says Business Insider Walmart\u2019s pricing patents are stirring fears about what shoppers could pay Fortune Elizabeth Warren Says Walmart's Patent Enables Surveillance Pricing - Walmart (NASDAQ:WMT) Benzinga Walmart Says It Won\u2019t Use Dynamic Pricing WSJ", "source": "Google News Business", "pub_date_str": "26 Sep 2026, 02:46 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "How recent grads and college students should be thinking about AI, the CV, and the job market", "full_content": "Artificial intelligence is transforming the hiring process, leaving many college students and recent graduates searching for ways to stand out in an increasingly competitive job market . As employers adopt AI-powered screening tools , young job seekers say landing an interview can feel more challenging than ever.\n\nMichela DiLorenzo, a student at Seton Hall and student editor at The Setonian who has covered the careers sentiment on campus , recently wrote that post-graduation plans for many of her peers have changed as they enter an uncertain job market. Rather than immediately pursuing graduate degrees, some are taking summer jobs or other work to save money as they consider their next steps.\n\n\"AI is really changing the motivation that students have going into the job market. It's changing the hiring process, how people are formatting their resumes and just overall, how students are approaching life post-grad,\" DiLorenzo said in an interview with CNBC's Jon Fortt on Friday.\n\nAccording to the Federal Reserve Bank of New York, college graduates in the 22- to 27-year-old age bracket had an unemployment rate of 5.7% as of June 2026, significantly above the national average and a full percentage point higher than it was two years ago for their cohort. The unemployment rate for all young workers as of June was 7.2%. Meanwhile, the underemployment rate \u2014 college graduates working in jobs that do not require a bachelor's degree \u2014 has reached 42% for graduates of recent years, compared to 33.7% for all college graduates.\n\nFor students, the challenge is not only finding an opportunity but getting noticed.", "source": "CNBC World Economy", "pub_date_str": "26 Sep 2026, 02:22 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Oil Declines as Traders Weigh US, Iran Hormuz Talk Progress", "full_content": "(Bloomberg) -- Oil fell on tentative signs that talks between the US and Iran to reopen the world\u2019s most important energy shipping route were progressing.\n\nWest Texas Intermediate futures fell about 2.3% to settle near $92 a barrel, notching its first weekly drop since late August, as traders increasingly expect that the negotiations will be productive. The two countries were said to be pushing for a breakthrough that would see Tehran reopen the Strait of Hormuz and Washington lift its blockade of Iranian ports.\n\nStill, the warring sides have appeared close to a deal many times before, only for talks to collapse. Signs of tightness remain across markets for real-world barrels, and many traders were hesitant to shift their positions until they see a meaningful increase in supplies.\n\nA White House official said that President Donald Trump remained open to talking with Iran but stressed the US didn\u2019t need to negotiate because it was in a strong position as a result of its sanctions campaign and the blockade.\n\n\u201cA similar deal has been announced so many times before, and we have seen little traction on it,\u201d said Emily Ashford, head of energy research at Standard Chartered Bank. \u201cPlus, even if we saw some diplomatic breakthrough, that doesn\u2019t immediately restore disrupted flows, doesn\u2019t normalize shipping, or boost dwindling inventories, or improve confidence.\u201d\n\nAll week, crude prices have been buffeted by mixed signals on the outlook for peace, indications of a pick-up in Middle East flows and speculation that the US may ban diesel exports. For the year, Brent remains more than 70% higher, adding to inflationary pressures.\n\nWhile front-month futures retreated on Friday, some widely tracked metrics pointed to elevated concerns about near-term supplies. Among them, Brent\u2019s prompt spread \u2014 the difference between its two nearest contracts \u2014 has widened to nearly $7 a barrel, from less than $1 at the end of last month.", "source": "LiveMint Markets", "pub_date_str": "26 Sep 2026, 02:21 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Derivatives", "Ethical & Professional Standards"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Apple\u2019s expensive new iPhones could be a double-edged sword for the company", "full_content": "Bernstein analysts suggest Wall Street isn\u2019t properly modeling the extent to which gross margins, a profit metric, could take a hit due to the rising costs of smartphone components.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 02:07 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Micron investors should get ready for a seesaw ride, analyst says", "full_content": "The timing of an Nvidia product ramp may require a balancing act for Micron investors, as some estimated revenue shifts toward next year instead of this year.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 02:06 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "A 10% risk-free yield? For some, yes.", "full_content": "This could be a bargain, especially for very high earners and those in high-tax locations.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 02:02 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "US bond sell-off pushes long-term yields to highest since 2004", "full_content": "Investors \u2018don\u2019t want to hold risk going into the weekend\u2019, said one investor, as market heads for worst week since 2024", "source": "FT Markets", "pub_date_str": "26 Sep 2026, 01:54 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Stock Market Today: Dow Surges 450 Points On U.S.-Iran Peace Hopes; Micron Rises - Investor's Business Daily", "full_content": "Stock Market Today: Dow Surges 450 Points On U.S.-Iran Peace Hopes; Micron Rises Investor's Business Daily Bond Selloff Fades as Oil Cools, Lifting Stocks: Markets Wrap Bloomberg.com Stocks Climb Back To Par WSJ A shaky day for oil prices and the bond market leaves US stocks not far from where they started AP News Stock market today: Dow, S&P 500, Nasdaq trims losses as hopes of Hormuz deal offset rising bond yields finance.yahoo.com", "source": "Google News Business", "pub_date_str": "26 Sep 2026, 01:51 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bond market alarms are ringing on Wall Street. Here's what's ahead", "full_content": "The chance that higher rates are here to stay is unnerving those who fear that eventually something will break.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 01:46 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Dow ends 400 points higher as investors buy AI stocks; Microsoft rallies", "full_content": "Wall Street experienced gains on Friday, driven by positive performance from Microsoft and AI-related technology stocks. High oil prices and rising US Treasury yields created investor uncertainty throughout the week. Various industries are under scrutiny regarding their prospects related to artificial intelligence advancements. Additionally, traders faced a potential interest rate increase by the Federal Reserve in October.", "source": "Economic Times Markets", "pub_date_str": "26 Sep 2026, 01:41 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Blackstone\u2019s top private equity executive prepares exit for possible public service move", "full_content": "Joseph Baratta, one of the company\u2019s best-paid employees, plans to leave the group after almost three decades", "source": "FT Markets", "pub_date_str": "26 Sep 2026, 01:40 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Soaring bond yields \u2018not even close\u2019 to cooling red-hot US economy, investors say", "full_content": "Rising borrowing costs so far show no sign of putting a brake on activity in world\u2019s biggest economy", "source": "FT Markets", "pub_date_str": "26 Sep 2026, 01:30 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "What we want to see next week from one of Jim Cramer's 6 stocks to buy", "full_content": "Micron has all the leverage heading into earnings as memory supply constraints persist. But how long will this favorable cycle last?", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 01:10 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "U.S. crude oil falls nearly 8% for the week after Tehran and Washington hold talks at the U.N.", "full_content": "Iran has asked the U.S. to meet the same conditions laid out in the June 17 memorandum of understanding, Iran's foreign minister said.", "source": "CNBC Top News", "pub_date_str": "26 Sep 2026, 01:08 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}], "updated_at": "26 Sep 2026, 07:04 AM IST", "total_stories": 354};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
