10 grams as speculators created fresh positions on firm spot demand, the PTI added.\n\nHowever, experts and analysts noted that gold bullion may extend losses during the week ahead as traders await US economic data, inflation data and cues on interest rate hikes from the US Federal Reserve cues, as per another PTI report.\n\nJateen Trivedi, VP Research Analyst \u2013 Commodity and Currency, LKP Securities. told PTI that the ongoing corrective trend in gold extended as profit booking intensified across international and domestic bullion markets. \u201cThe weakness was further amplified by appreciation in the rupee and a sharp decline in global gold prices. The stronger rupee has added another layer of pressure on MCX prices by reducing the landed cost of imported bullion,\u201d he felt.\n\nNotably, PMI readings from across major economies, US GDP data, housing data, durable goods orders and inflation numbers will impact expectations from the Fed and thus long outlook for the precious metals remains weak, it added.\n\n\u201cThe outlook for gold and silver remains weak, and the downward trajectory is likely to persist.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 12:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Investors gives a thumbs down to Tata Steel-APL Apollo $1.67 billion deal, plunging shares", "full_content": "Tata Steel , one of the world's leading steel producers, on Monday said it will buy a 26.4% stake in India's largest structural steel pipe and tube maker, APL Apollo , for 155.1 billion rupees ($1.67 billion).\n\nThe acquisition will boost Tata Steel's downstream integration to around 53% from 35%, the company said in a stock exchange filing. That will lead to more value addition, improved product mix, and greater exposure to higher-margin downstream segments, it said.\n\nInvestors reacted negatively to the deal, with shares of Tata Steel sliding over 9% on Monday, while APL Apollo's stock crashed more than 19% .\n\nWhile the deal is likely to be positive in the long term, the complex structure and lack of clarity have rattled investors, Deven Choksey, founder and managing director of wealth management firm DRChoksey FinServ, told CNBC.\n\nAs per Tata Steel, before acquiring APL Apollo, it will sell its steel tubes business and Tata Steel Colors to APL Apollo for 280 billion rupees. \"APL Apollo will initially fund the acquisition through a mix of acquisition financing and subsequently replace the debt with long-term capitalization,\" Tata Steel said.\n\n\"The deal is appearing very complex,\" said Choksey, adding that minority investors have not been given any clarity or taken into consideration while signing this deal.\n\nTata Steel will hold an investor call, post-market hours on Monday.\n\nAPL Apollo said after the deal it plans to more than double the downstream capacity to 15.5 million tons from the current 7.5 million tons, making it a leading global downstream steel firm.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 12:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Brigade Enterprises moves a step closer to FY27 pre-sales target with new launch", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nRealty company Brigade Enterprises has had a dull first half of FY27 (H1FY27) with sales volumes down 28% year-on-year. Pre-sales fell 8% year-on-year to \u20b9 2,888 crore in H1 versus FY27 target of \u20b9 9,000 crore. But visibility is improving as new launches accelerate. Last week, Brigade unveiled the first phase of Brigade Autograph in Whitefield, East Bengaluru\u2014a premium integrated residential development project of about 40 acres.\n\nChannel checks by PL Capital indicated a strong response to this launch and potential to contribute \u20b9 2,000-2,500 crore to Q3FY27 pre-sales. \u201cThis provides healthy visibility on achieving the balance H2FY27 pre-sales target of \u20b9 6,100 crore, supported by the upcoming launch pipeline across North Bengaluru (~0.6msf), Chennai (~1msf) and Hyderabad (~1msf) in H2FY27,\u201d added the PL report.\n\nBrigade sees new launches and sales in existing projects supporting pre-sales ahead. For H2FY27, Brigade has planned 7 msf launches worth \u20b9 7,600 crore gross development value or revenue potential across Bengaluru, Hyderabad, Chennai, and Mysore.\n\nThe management maintains residential demand has not been impacted by repo rate hike or by IT-sector job cuts, as GCC hiring continues to absorb talent. Its Bengaluru launches are largely in \u20b9 1\u20131.5 crore ticket range, with the rest around \u20b9 2 crore and nearly 20% of projects, at \u20b9 3 crore. Nuvama Research expects Brigade\u2019s likely pivot towards the mid-income segment in its upcoming launches to address soft volumes/sales velocity.\n\nHowever, interest rates are likely to rise further, making home loans dearer, so its impact on the mid-income segment should be tracked. Brigade\u2019s investments in business development/acquiring land bank acquisitions augur well for long-term growth, but its elevated debt amid rising interest rates can be a concern.\n\nNet debt rose sequentially at Q2FY27-end to \u20b9 2,088 from \u20b9 1,541 crore.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 12:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India bonds give up marginal opening gains as profit booking takes over", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a India bonds give up marginal opening gains as profit booking takes over Powered By The Economic Times daily newspaper is available online now. Read Today's Paper India bonds give up marginal opening gains as profit booking takes over SECTIONS India bonds give up marginal opening gains as profit booking takes over Reuters Last Updated: Nov 23, 2026, 12:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian government bonds fell after initial gains due to profit booking by traders and a sharp rupee decline. The benchmark yield of the 6.94% 2036 bond increased to 7.2185% during trading hours. Last week, the yield had dropped significantly due to lower US Treasury yields and a stronger rupee. Investors now focus on the upcoming Reserve Bank of India's policy decision on December 4.\n\nIndian government bonds fell after initial gains due to profit booking by traders and a sharp rupee decline. The benchmark yield of the 6.94% 2036 bond increased to 7.2185% during trading hours. Last week, the yield had dropped significantly due to lower US Treasury yields and a stronger rupee. Investors now focus on the upcoming Reserve Bank of India's policy decision on December 4.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Nov 2026, 12:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fund managers look to raise gold, silver exposure as price correction revives interest", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMumbai: Some Indian fund managers are returning to gold and silver in their multi-asset funds, after trimming exposure in recent months, as a correction in prices and shifting expectations on US interest rates revive the case for precious metals.\n\nAxis Mutual Fund has started adding to its gold and silver holdings and plans to increase allocations gradually. DSP Mutual Fund has begun reducing its underweight position in precious metals, while SBI Mutual Fund is also finding the two metals more attractive.\n\nThe renewed interest follows a steep sell-off. MCX spot gold has fallen 41% from its 29 January peak to \u20b9 123,805 per 10 grams as of 20 November, while silver has dropped 59% to \u20b9 152,674 per kg. The declines have erased a large part of the gains from the metals' sharp rally in recent years, making valuations more appealing. At the same time, fears that a slowdown driven by the artificial intelligence (AI) trade could push the Federal Reserve to pause its rate-tightening cycle have bolstered the outlook for both metals\n\n\u201cUntil three weeks ago, the expectation was that the US Federal Reserve (Fed) would deliver at least two more rate hikes. However, concerns about a possible slowdown driven by artificial intelligence (AI) could prompt the Fed to pause after one more hike and focus more on growth than inflation,\u201d said Dinesh Balachandran, head of investments at SBI Mutual Fund.\n\n\u201cSuch a shift would strengthen the case for precious metals, as gold and silver tend to benefit when central banks prioritise growth over inflation.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 12:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rupee retreats, Goldman calls it a 'port of stability' in AI storm", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Rupee retreats, Goldman calls it a 'port of stability' in AI storm The Economic Times daily newspaper is available online now. Read Today's Paper Rupee retreats, Goldman calls it a 'port of stability' in AI storm SECTIONS Rupee retreats, Goldman calls it a 'port of stability' in AI storm Reuters Last Updated: Nov 23, 2026, 12:39:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian rupee initially rose to a seven-month high before retreating amid corporate dollar buying. It is on track for a monthly gain of over 2%, bolstered by significant foreign investment in Indian equities. Analysts noted that the rupee's early gains pushed it into overbought territory, prompting some selling. Despite recent fluctuations, the rupee has remained stable compared to other major currencies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Nov 2026, 12:39 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "137% up in five years, ITI shares rally 11% today despite stock market crash | Check stock returns, buy target price", "full_content": "CURRENT Vaamanaa Sethi Published 23 Nov 2026, 12:29 PM IST Prefer Livemint on Google ITI share price jumped over 11% in Monday's trading session despite weak sentiments on Dalal Street. The stock opened at \u20b9 248 on Monday, as compared to previous close of \u20b9 245.72 on Friday last week and touched an intraday high of \u20b9 275 apiece.\n\nThe stock witnessed a significant rally amid heavy trading volumes. According to data available on NSE, around 319.49 lakh shares changed hands during the intraday session on 23 November.\n\nMeanwhile, Indian benchmark indices Sensex and Nifty traded in the red during early Monday deals, weighed down by a sharp sell-off across global markets and profit booking following a two-session rally. The 30-share BSE Sensex fell 243.95 points to 83,675.76 in early trading, reversing gains after opening on a positive note. Likewise, the 50-share NSE Nifty declined 110.10 points to 25,672.\n\nITI reported an 11.3% year-on-year (YoY) decline in consolidated revenue to \u20b9 481.99 crore in the second quarter of FY27, compared with \u20b9 543.4 crore in the corresponding quarter of the previous financial year. The company's revenue performance remained under pressure during the quarter, reflecting a decline in its topline.\n\nHowever, the telecom equipment manufacturer managed to narrow its consolidated net loss by 42.15% YoY to \u20b9 31.44 crore in Q2 FY27, against a net loss of \u20b9 54.35 crore in Q2 FY26. The improvement in profitability indicates that the company made progress in containing its losses despite the decline in revenue.\n\nAt the operating level, ITI reported an operating profit of \u20b9 6.51 crore during the quarter, compared with an operating loss of \u20b9 1.21 crore in the year-ago period. This marked a turnaround in operating performance.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 12:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "How Asian countries are looking to prop up markets as AI downturn sinks stocks", "full_content": "South Korea, China and Taiwan have introduced new measures aimed at supporting their respective markets, as a tech-fueled sell-off in the region spills into another week.\n\nOn Sunday, South Korea's finance ministry said it would prepare its securities-market stabilization fund for immediate activation. The fund, reportedly established in 2020 during the Covid-19 pandemic by financial firms and other institutions seeks to support markets during sharp downturns and is valued at 10.76 trillion won (nearly $8 billion).\n\nThe government also plans to relax listed companies' daily share-buyback order limits for three months, starting Nov. 24 and start a \"special intensive monitoring period\" to prevent illegal short-selling. Regulators will also track margin lending and forced liquidations.\n\nSouth Korean stocks have seen wild swings over 2026 as investors piled into, then fled from its two tech heavyweights, Samsung Electronics and SK Hynix, both critical companies in the AI supply chain. The benchmark Kospi index is deep in bear territory, down more than 46% from its June high.\n\nThe ministry said that it \"assessed that volatility in domestic and international stock markets has significantly increased recently due to internal and external uncertainties surrounding the global AI and semiconductor industries, as well as U.S. interest rate hikes,\" according to a Google translation of the release in Korean.\n\nHowever, Seoul also said that the mid-to-long-term growth expectations for the AI industry remain intact, and that \"excessive anxiety is not a concern.\"\n\nTaiwan, which is also exposed to the AI industry through Taiwan Semiconductor Manufacturing Company and other tech firms, has also moved to rein in market volatility.\n\nTaiwan's Financial Supervisory Commission announced Friday that short selling below the closing price was \"completely prohibited,\" while making it an exception if used for hedging purposes by securities and futures firms.", "source": "CNBC Top News", "pub_date_str": "23 Nov 2026, 12:20 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "The great Indian stock market comeback. Can the rally sustain and what should investors do?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a The great Indian stock market comeback. Can the rally sustain and what should investors do? The Economic Times daily newspaper is available online now. Read Today's Paper The great Indian stock market comeback. Can the rally sustain and what should investors do? SECTIONS The great Indian stock market comeback. Can the rally sustain and what should investors do? By Dr. V K Vijayakumar , ET CONTRIBUTORS Last Updated: Nov 23, 2026, 12:09:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities staged a sharp 9.7% rally in eight sessions through November 12, reversing months of underperformance. A sell-off in US AI stocks, triggered by Republican losses in the midterm elections and fears of tighter AI regulation, spilled across global technology markets. Earlier, foreign investor outflows, elevated crude prices and rupee weakness had weighed heavily on Dalal Street sentiment.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "23 Nov 2026, 12:09 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bull vs Bear: Why is stock market down today? Sensex, Nifty succumb to profit-booking, plunge nearly 1% - Top 3 reasons", "full_content": "Dhanya Nagasundaram Published 23 Nov 2026, 11:52 AM IST Prefer Livemint on Google Indian equity benchmarks came under pressure on Monday, 23 November, as investors booked profits following a four-week rally. The recent market upswing had been supported by strong foreign fund inflows, a retreat in crude oil prices and a shift in global investor sentiment amid a selloff in AI-linked stocks.\n\nThe Nifty 50 slipped 0.91% to 25,568 . 80, while the Sensex declined 0.96% to 83,117.35 as of 11:44 am IST. Both indices had started the session on a positive note, rising around 0.8% each, but soon surrendered their early gains as selling gathered pace.\n\nThe weakness was widespread, with 16 major sectoral indices trading lower. The Nifty Smallcap and Nifty Midcap indices also fell 0.6% each, reflecting pressure across the broader market.\n\nBanking stocks were among the biggest drags on the benchmarks. The Nifty Bank and Nifty Private Bank indices declined 1.9% each after delivering gains of 19.1% and 18.8%, respectively, over the preceding four weeks. The broader financial services index lost 1.3%, while the PSU Bank index dropped 2.4%, following a sharp 22.4% rally over the previous four weeks. Financial stocks had gained 18.3% during the same period.\n\nMetal stocks also witnessed significant selling, with the sectoral index falling 2.4%. Weakness in global metal prices and a stronger US dollar weighed on the segment, as concerns surrounding the artificial intelligence outlook and the possibility of further US interest-rate hikes dented risk appetite.\n\nMonday's decline comes after a strong November rally. The Nifty 50 and Sensex remain higher by 11.4% and 12.2%, respectively, for the month.", "source": "LiveMint Markets", "pub_date_str": "23 Nov 2026, 11:52 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India factory demand offsets weaker services growth in November, PMI shows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India factory demand offsets weaker services growth in November, PMI shows The Economic Times daily newspaper is available online now. Read Today's Paper India factory demand offsets weaker services growth in November, PMI shows SECTIONS India factory demand offsets weaker services growth in November, PMI shows Reuters Last Updated: Nov 23, 2026, 11:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's private sector activity experienced marginal growth in November, driven by manufacturing demand and production. The HSBC Flash India Composite Purchasing Managers' Index rose slightly from October, indicating continued expansion. The manufacturing sector achieved a nine-month high, while the services sector saw a decline in growth. Employment trends diverged, with factories increasing hiring and services sectors reducing jobs. Companies exhibited optimism about future performance, although confidence remained below historic averages.\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Nov 2026, 11:51 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "JPMorgan is working on AI agent transactions that don\u2019t involve humans", "full_content": "Artificial intelligence agents have already proven to be helpful, or cause a lot of trouble, or both. One area seen as high-potential is in payments, where \u2014 if they're able to be trusted \u2014 the agents could deal with all sorts of money matters on behalf of people.\n\nThat's why JPMorgan Chase and South Korea's Hyundai Card are testing how AI agents can handle financial transactions without direct human intervention, including whether they can eventually negotiate and make payments with one another.\n\nThe companies have completed an initial proof-of-concept involving a simulated foreign exchange transaction and are targeting the first half of 2027 for a more complex phase involving multiple AI agents.\n\nWee Kee Toh, global head of Kinexys Insights at Kinexys by JP Morgan, told CNBC that the next step is to test what happens when autonomous agents move beyond execution and begin interacting with each other in an ecosystem.\n\n\"That, I would say, is really the biggest part of what we want to get as an expansion of the phase one scope,\" he added.\n\nThe initial trial involved a Hyundai Card AI agent requesting a foreign exchange transaction to maintain euro liquidity in its Kinexys blockchain deposit account. JPMorgan said it was the first private blockchain-based autonomous bank-agent-to-client-agent test for corporate treasury management.\n\nWhile the initial trial has been completed, JPMorgan has yet to set a timeline for commercializing the technology.\n\nToh said building the technology itself was relatively straightforward, but establishing appropriate governance and internal controls proved more difficult.", "source": "CNBC Finance", "pub_date_str": "23 Nov 2026, 11:36 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Amid gold price crash and rebound, how Titan, PC Jeweller, Kalyan Jewellers are faring? Jewellery stocks price movement", "full_content": "Jewellery stocks like Titan, PC Jeweller, Kalyan Jewellers, Sky Gold and Diamonds t ": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold, silver prices today, 23 November: Check retail rates of 24K, 22K gold, 999 silver in Delhi, Mumbai and Kolkata", "full_content": "Gold and silver prices today, 23 November: Check latest 24K, 22K gold and 999 silver retail rates across Delhi, Mumbai, Kolkata and other major Indian cities, along with MCX market updates.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 09:46 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Property seller escapes \u20b96.75 lakh cash penalty: 5 lessons from ITAT Chennai ruling for property buyers and sellers", "full_content": "ITAT Chennai has cancelled a \u20b96.75 lakh income tax penalty on a property seller who accepted a cash advance. Here is the ruling, the reasonable cause provisions and five important pointers for property buyers and sellers.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 09:09 AM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}], "updated_at": "23 Nov 2026, 02:46 PM IST", "total_stories": 251};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
