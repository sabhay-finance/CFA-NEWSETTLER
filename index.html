    const allData = {"general": [{"title": "Nvidia CEO Jensen Huang faces bipartisan congressional scrutiny over reported China spy link", "full_content": "Lawmakers from both sides of the aisle are ramping up calls for investigations into reports of Nvidia CEO Jensen Huang's relationship with an alleged Chinese spy. Some are also questioning what the Trump administration knew about the matter.\n\n\"The more I learn about the insane relationship between the Trump Administration, Chinese spies, and AI billionaires, the more I'm convinced there is nothing this administration does that isn't corrupt,\" Sen. Chris Coons, D-Del., posted on X on Saturday. \"Congress will investigate and get answers.\"\n\nCoons is in line to chair the Senate Foreign Relations Committee when his party takes control of the chamber in January.\n\nThree House Republican committee chairs sent a letter to Huang on Wednesday requesting that he sit for a closed-door briefing with lawmakers on Nov. 18, a day after the company is scheduled to report third-quarter earnings.\n\n\"Recent reports raise significant national security concerns regarding the [People's Republic of China's] access to sensitive U.S. technology and information,\" the GOP lawmakers wrote in a letter to Huang .\n\nThe reports refer to Huang's alleged relationship with Alice Huang, a Chinese citizen and executive at Megaspeed, a Singapore-based tech company that the U.S. has suspected of helping China circumvent artificial intelligence chip sales prohibitions.\n\nPolicymakers in the Trump administration received a memo last spring with intelligence identifying Alice Huang as having been recruited by China's Ministry of State Security and revealing her relationship with Nvidia's chief executive, The New York Times first reported on Friday.\n\nWhen asked by the Times whether Huang would appear before lawmakers to discuss the matter, Nvidia spokesman John Rizzo declined to comment. \"Our chief executive has an outstanding security te ut", "full_content": "\u201cIt\u2019s not my funeral \u2014 it\u2019s yours \u2014 so make it what you want,\u201d one funeral-home operator says.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 10:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Cullen/Frost Bankers chief accounting officer Henson sells $85,290 of stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 10:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "Atletico Madrid vs Barcelona Live Streaming: When, Where To Watch LaLiga Match On TV, Online?", "full_content": "Barcelona will look to strengthen their position at the top of the table, while Atletico Madrid aim to extend their seven-match winning run in La Liga.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "No credit history at 30: How first-time borrowers can build a healthy credit profile and improve future loan eligibility", "full_content": "If you are turning 30 without a credit history, then be clear: this is not a disadvantage when you are proceeding to apply for a new loan. Still, for individuals who have never taken a personal loan, a home loan, or used a credit card, or any other form of debt, establishing a credible credit profile can take some planning, time, and responsible financial behaviour.\n\nA credit history is a metric that helps lending institutions analyse and assess how an individual manages borrowed money, repays it on time, and whether they are likely to default in the future. That is why, without a credit history , a lending institution may face challenges in processing a loan request, as it has limited information to crunch to assess the borrower\u2019s creditworthiness and borrowing behaviour. This makes it vital for first-time borrowers to start building their credit profiles early, with a clear goal of keeping them healthy and free of missed payments and defaults.\n\nSuresh Venkatesan, Whole-time Director and CEO of CRIF Credit Information Services Private Limited (formerly CRIF High Mark Credit Information Services Private Limited), explains the significance of a neat credit profile and a well-established credit history and how individuals can establish a healthy credit history.\n\nHe stated, \u201cA credit history is built through behaviour, not time alone. For first-time borrowers, the best start is a small loan or a credit card with a limit they can comfortably manage, repaid on time, every time.\u201d\n\nThe primary step in such cases is to start small and stay focused, instead of taking on a large loan that can later become difficult to manage. Credit history is not established just by the size of the loan one applies for and secures.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 10:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "China AI bust threatens Xi\u2019s \u2019Wall Street East\u2019 ambitions", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 10:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Fiorentina vs Juventus Live Streaming: When And Where To Watch Serie A Match Live In India", "full_content": "Juventus will look to secure back-to-back Serie A wins when they travel to Florence to take on a Fiorentina side still searching for their first home league victory of the season.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Mumbai, Thane Choke On Diwali Pollution As Firecrackers Push AQI To Severe Levels", "full_content": "Mumbai and Thane recorded severe air quality readings on Diwali night, with AQI at 278 and 298, respectively, as firecracker emissions added to the city's pollution burden.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 10:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dividend alert: MRF, Cochin Shipyard, Talbros and others may reward shareholders this week - Check key ry; Netizens Report Smelling Smoke As Diwali Celebrations Gather Pace", "full_content": "Firecracker emissions, vehicular pollution and the ongoing peak stubble-burning season in neighbouring states are expected to add to the city's pollution load.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 09:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Labcorp director Richelle Parham sells $389,395 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 09:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018It feels like he\u2019s quietly building a separate life\u2019: My husband inherited $500,000, but he refuses to spend it on our home", "full_content": "\u201cOur kitchen dates from 1999 and the oven only works if you hit the door a certain way.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 09:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Houthi attack damages Aramco building in Riyadh\u2019s financial district", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 09:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "Poland mourns victims of Krakow mass shooting as security fears grow", "full_content": "Poland began two days of national mourning on Sunday and police bolstered security after six people were killed in a mass shooting in the southern city of Krakow that the government said was likely inspired by far-right ideology.\n\nSaturday's attack in the city's historic main square shocked a country that has prided itself on being safer than many of its Western European neighbors, deepening public concern following a string of school stabbings in October that officials linked to extremist content online.\n\nSixteen people were wounded in the attack, including two police officers and the suspected gunman, a 24-year-old Polish man who remained in a critical condition in hospital, local authorities said.\n\nKrakow's old town is a UNESCO World Heritage Site that attracts visitors from around the globe, and several foreigners were among the casualties.\n\nOne of the people who died was identified as a British citizen and another as Austrian, while five foreign nationals from Austria, Germany, Portugal, Russia and Britain were among the wounded.\n\nIn the suspect's hometown, Ostrowiec Swietokrzyski, about 200 km (124 miles) north of Krakow, police later found the bodies of his parents and sister at his home.\n\nProsecutor's Office spokesperson Daniel Prokopowicz said it was \"highly likely\" that the killings in Ostrowiec Swietokrzyski and Krakow were carried out by the same person, but that investigations were ongoing.\n\nThe three bodies found there had gunshot wounds, and seven firearms and a \"significant\" quantity of ammunition were recovered from the property, Prokopowicz added.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 09:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bhai Dooj 2026: 6 financial gifts you as a brother can gift to your sister on Diwali to make her financially stronger", "full_content": "Diwali 2026: Bhai Dooj, which celebrates the bond between brothers and sisters, will be observed on Wednesday, November 11.\n\nWhile sweets, clothes and jewellery remain popular gifts, brothers can use the occasion to support their sisters' financial independence by helping them save, invest and prepare for unexpected expenses.\n\nA systematic investment plan ( SIP ) in a mutual fund can be a meaningful gift for a sister looking to build wealth over the long term. A brother can gift her money to start an SIP in a mutual fund suited to her financial goals and risk appetite\n\nRegular investments can help build a corpus over time through the power of compounding. However, equity mutual funds are market-linked and do not guarantee returns. The investment horizon and risk tolerance should be considered before choosing a scheme.\n\nGold has traditionally been associated with prosperity and is a popular festive gift. Instead of buying jewellery, a brother can consider gifting digital gold or helping his sister invest in a Gold Exchange-Traded Fund (ETF).\n\nThese options allow her to gain exposure to gold without having to store physical jewellery. Gold ETFs are traded on stock exchanges and require a demat and trading account. Digital gold, meanwhile, comes with platform-specific terms and risks, so buyers should check the provider's credibility, storage arrangements and redemption charges before investing.\n\nFor a sister who prefers a government-backed, long-term savings option, a Public Provident Fund (PPF) account could be worth considering. A brother can help her open an account, understand its rules and make an initial contribution.\n\nPPF is designed for long-term savings and has a 15-year maturity period, with provisions for extension. It can help build a retirement or other long-term savings corpus. However, its lock-in period makes it unsuitable for money she may need immediately.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 09:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "Top 5 stocks to watch this week", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 09:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "How Democrats will try to end Trump's tariffs", "full_content": "The battle for Congress is over. The war over President Donald Trump 's tariffs is about to heat up.\n\nThe knotted web of tariffs that Trump spent the last two years weaving could soon face its biggest threat, as Democrats prepare to unload their new legislative firepower against the Republican president's signature policy.\n\nDemocrats have made no secret of their plans to bombard Trump and his associates with investigations as soon as the next Congress is sworn in. They are also preparing a first-100-hours legislative blitz, putting forward a series of bills that would unwind much of Trump's agenda.\n\nBoth prongs of attack will take aim at Trump's unprecedented use of tariffs , which Democrats have quickly identified as a main target following their landslide victory in Tuesday's midterm elections .\n\nEnding Trump's tariff regime, and especially his trade war against Canada, is something Democrats \"absolutely have to do immediately,\" Sen.-elect Abdul El-Sayed, D-Mich., told MS NOW's \"Morning Joe\" Thursday.\n\nRep. Hakeem Jeffries of New York, the Democratic minority leader who could be elected House speaker in the next Congress, has made clear that ending Trump's tariffs is a top priority.\n\n\"We should restore congressional authority as it relates to tariffs, because the Trump tariffs are making life more expensive for the American people,\" he said at a press conference in late August.\n\nIf picked as speaker, Jeffries would speed legislation to the House floor that reasserts congressional authority over trade.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 09:06 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bosch bonus issue, stock split: 1 share to become 20 after 38% rally in one year! Check ratio, record date, returns", "full_content": "Sharmila Bhadoria Published 8 Nov 2026, 09:01 PM IST Prefer Livemint on Google Bosch bonus issue, stock split: Shares of Bosch Limited surged nearly 8% over the past one week as the auto ancillary company announces its second quarter results for the financial year 2026-27. Alongside the corporate earnings announcement, Bosch also declared a bonus issue and stock split.\n\nShares of Bosch closed the special Diwali Muhurat trading session marginally higher on Sunday, November 8. Meanwhile, the auto ancillary stock has delivered 8.41% return in one week. Here are all the details about its upcoming corporate actions.\n\nThe company\u2019s board of directors, last week, approved sub division of shares in the ratio of 1:5, which means that every stock (with face value of \u20b9 10) will be divided into five equity shares (with a face value of \u20b9 2 each). The stock split will be executed after approval from the shareholders of the company through postal ballot.\n\nApart from stock split, Bosch\u2019s board of directors approved bonus issues in the ratio of 3:1. Which means that eligible investors will receive three bonus equity share of \u20b9 2 each for every one equity share with a face value of \u20b9 2 each.\n\nBosch shares will undergo stock split, followed by bonus issue corporate action. Which means that original shareholding of 1 share will turn into five shares (with face value of \u20b9 2 each) after stock split. Then, those 5 shares will lead to issuance of 15 additional shares after bonus issue. Which will make total holding of an investor to 20 shares (with face value of \u20b9 2 each).\n\nThe company is yet to notify about record dates for the two corporate actions.\n\nShares of Bosch closed 0.44% higher at \u20b9 50,990 per share on BSE with a market capitalisation of \u20b9 1,50,400.61 crore on Sunday, November 8, after Diwali Muhurat trading session.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 09:01 PM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018I have no financial safety net\u2019: I\u2019m 66, rely on Social Security and have just $500 in savings. What hope do I have?", "full_content": "\u201cSometimes I wonder whether wealthier Americans should trade places with people like me.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 09:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Top spending cities on OnlyFans revealed \u2013 and NYC is nowhere near the top - New York Post", "full_content": "Top spending cities on OnlyFans revealed \u2013 and NYC is nowhere near the top New York Post", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 08:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "My 93-year-old father changed his will at the 11th hour, leaving my brother his entire $500,000 estate. Can I challenge it?", "full_content": "\u201cMy brother had no job and needed a place to live.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 08:46 PM IST", "pub_date_relative": "3h ago"}, {"title": "AI Spending Boom Nears Peak? Jefferies Flags Risks To Big Tech's $1 Trillion Capex", "full_content": "Jefferies says rising credit spreads, mounting financing risks and weakening cash flows could signal a peak in the AI investment boom, putting Big Tech's spending plans under pressure.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 08:45 PM IST", "pub_date_relative": "3h ago"}, {"title": "San Diego pizza maker has 3,500 people begging for a pie \u2014 but only makes 15 a week - New York Post", "full_content": "San Diego pizza maker has 3,500 people begging for a pie \u2014 but only makes 15 a week New York Post", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 08:45 PM IST", "pub_date_relative": "3h ago"}, {"title": "\u20b93 lakh per year? Can parents invest \u20b91.5 lakh each in their child\u2019s PPF account? Income Tax rules, limits explained", "full_content": "Parents can secure their child's future and help them get a leg up financially. Here, a government-backed savings scheme, such as the public provident fund , is a safe, long-term bet. Offering 7.1% interest rate this quarter, PPF can help with your child's big expenses \u2014 be it for healthcare, marriage, education or other aspirations.\n\nEveryone is allowed one PPF account , which can be opened with a bank or the post office. For children and minor applicants, a parent or guardian can open a joint PPF account, which must be converted upon the account holder's 18th birthday. Here's how to open an account for a minor:\n\nInvestors sometimes misunderstand the tax-free investment limits when depositing amounts into their child's PPF account. While you may be confused that each parent can individually invest \u20b9 1.5 lakh each in your child's PPF account, this mathematically raises the annual contribution to \u20b9 3 lakh \u2014 way above the tax-free \u20b9 1.5 lakh cap.\n\nAccording to PPF rules, the total tax-free contribution is \u20b9 1.5 lakh per financial year, and this includes deposits made to own and children's accounts combined. Thus, a minor\u2019s PPF account cannot receive more than \u20b9 1.5 lakh in total contributions (from both parents combined) in a given tax year, regardless of who contributes.\n\nCheck the scenarios/illustrations below for how the limit functions:\n\nUnder income tax laws, contributions made to a child's PPF account are treated as a \u201cgift\u201d. Further, interest earned is credited to the child\u2019s account but may be clubbed with the higher-earning parent's income as per tax rules.\n\nHowever, as PPF interest is completely tax-free, it usually does not add any tax burden for the parent. Thus, regardless of one or two parents / guardians' contributions, the total deposit in a child\u2019s PPF account cannot exceed \u20b9 1.5 lakh in a given financial year.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 08:41 PM IST", "pub_date_relative": "3h ago"}, {"title": "Corporate America\u2019s profit numbers are just barely beating Wall Street\u2019s expectations", "full_content": "S&P 500 companies\u2019 earnings are mostly topping analysts\u2019 estimates \u2014 but by the narrowest margin in roughly four years.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 08:30 PM IST", "pub_date_relative": "3h ago"}, {"title": "Wall Street Races For Megadeals As Countdown Begins On Trump Era", "full_content": "The rout by the Democrats in the midterms is creating a sudden sense of urgency in boardrooms, with executives wondering if they might have one last chance to pull off a transformational transaction while M&A-friendly regulators remain in place under Trump.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 08:07 PM IST", "pub_date_relative": "3h ago"}, {"title": "Diwali 2026: Planning to invest in gold savings schemes by jewellers? How they work, benefits, risks and what to check", "full_content": "Many jewellers in India offer gold saving schemes to encourage customers to save towards purchasing gold jewellery. These schemes become particularly relevant during the festive season, especially around Dhanteras and Diwali, when making new purchases such as gold and silver items are considered auspicious and is traditionally associated with prosperity and good fortune.\n\nA jeweller gold savings scheme is a structured purchase plan in which you deposit a fixed amount every month for a set tenure. At maturity, you can use the accumulated funds, along with scheme benefits, to buy jewellery.\n\nThe scheme benefits typically include a discount on making charges or a bonus added at the time of redemption. Unlike other investment products, like bank deposits, these schemes do not offer interest on your deposits.\n\nGold savings schemes follow an instalment-based structure, allowing you to set aside a fixed amount every month towards a future jewellery purchase. While the exact terms vary across jewellers, most plans follow a similar process:\n\n\u2014 Enrol with a jeweller: Sign up for a scheme offered by a participating jeweller and choose your monthly instalment and tenure.\n\n\u2014 Pay monthly instalments: Deposit the agreed amount every month, typically for 10 or 11 months, depending on the scheme.\n\n\u2014 Redeem at maturity: Use your final deposit to purchase jewellery and avail of the scheme benefit, which may include a bonus instalment, a discount on making charges or other value additions.\n\n\u2014 Check the terms and conditions: Rules on missed instalments , grace periods, premature closure, redemption deadlines and eligible jewellery vary by jeweller. You must always check these details before considering the scheme.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 08:03 PM IST", "pub_date_relative": "3h ago"}, {"title": "Private equity firm seeks to take control of LIV Golf from Saudi wealth fund", "full_content": "BC Partners looks to purchase Public Investment Fund\u2019s bankruptcy loan in order to revive failed golf league assets", "source": "FT Markets", "pub_date_str": "08 Nov 2026, 08:02 PM IST", "pub_date_relative": "3h ago"}, {"title": "Diwali Stock Picks 2026: Tata Steel, BEL, HDFC Bank - 25 brokerages reveal 187 shares to buy in Samvat 2083 | Full List", "full_content": "STLTECH PAYTM ASTERDM Pranati Deva Published 8 Nov 2026, 08:01 PM IST Prefer Livemint on Google Stocks to buy : Investors looking for stock ideas ahead of Samvat 2083 have a wide range of companies to track, with 25 brokerages collectively identifying 187 distinct companies across their Diwali and Samvat stock-pick lists. The combined research list features large-cap leaders, mid-cap companies and emerging businesses spanning sectors such as banking, financial services, automobiles, metals, technology, pharmaceuticals, infrastructure, power and consumer businesses.\n\nThe compilation brings together visible stock recommendations from brokerages including Axis Securities, Motilal Oswal, HDFC Securities, Nirmal Bang, ICICI Securities, Religare Broking, Kotak Neo, JM Financial, InCred Equities, Ventura Securities, SBI Securities and Angel One, among others.\n\nThe lists contain several stocks that appear across multiple brokerage recommendations, suggesting that these companies have attracted attention from more than one research house. Banks, industrial companies, technology businesses, power and infrastructure players, and consumer-facing companies feature prominently in the recommendations.\n\nAxis Securities' Diwali list includes Eternal, Larsen & Toubro, Axis Bank, Bharat Electronics, BEL, Bharti Airtel, Blue Star and CUMI. The recommendations cover financial services, engineering, defence, telecommunications and industrial businesses.\n\nNirmal Bang's selections comprise Adani Ports, HDFC Securities, HDFC Bank, Nirmal Bang, ICICI Bank, Kotak Bank, Titan Company and UltraTech Cement. The list features banking and financial services alongside ports, consumer and cement businesses.\n\nArihant Capital has identified Sheela Foam, GMM Pfaudler, CE Info Systems, Raymond Lifestyles, Nuvoco Vistas, HEG Advanced, Exide Industries and Navin Fluorine.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 08:01 PM IST", "pub_date_relative": "3h ago"}, {"title": "Iran suggests blasts are not U.S. attacks as both sides report ships hit", "full_content": "Iranian media suggested explosions in southern Iran on Saturday evening were related to Iranian military activities rather than U.S. strikes, while both sides reported that shipping had been hit in or near the Strait of Hormuz.\n\nIran's state television said officials had not confirmed any missile strikes on Iranian territory following blasts heard in several areas, including on Qeshm Island in the strait.\n\nPresident Donald \u200bTrump had hinted at renewing major attacks on Iran \u200bafter \u2060last week's US midterm elections but there has been no sign of a large-scale U.S. military operation, which Iran has said it would respond to by striking U.S. and Israeli targets.\n\nBoth sides have continued strikes on vessels in the Strait of Hormuz, however, restricting exports of energy and other commodities vital to the world economy.\n\nIran's state television said the evening explosions might be related to Iranian military activity in the waterway, where Iran said two vessels had hit mines and a third had caught fire.\n\nThe US said its air force had disabled a vessel in the Gulf of Oman beyond the strait.\n\nTasnim news agency said two missiles had struck Qeshm Island, with no official information on possible damage. Neither Iran nor the US has commented on that report. Washington said on November 2 that it had struck the island in a limited defensive measure against Iranians using surface-to-air missiles against US assets.\n\nSince the US and Israel began attacks on Iran in February, Tehran has sought the upper hand by hitting vessels in the Strait of Hormuz to block Gulf energy exports, while US forces began blockading movements to and from Iranian ports in April.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 08:00 PM IST", "pub_date_relative": "3h ago"}, {"title": "Anthropic secures $3.4 billion generator deal for AI data centers, FT reports", "full_content": "Anthropic has struck a deal worth about $3.4 billion to secure gas-fired power generators for data centers, the Financial Times reported on Sunday.\n\nThe AI startup bought commitments for 1.7 gigawatts of heavy-duty generators in late September from OnePWR Solutions, a San Antonio, Texas-based equipment supplier, the report said.\n\nAnthropic did not acquire OnePWR itself, and none of the supplier's employees transferred to the AI startup, but the deal included engineering and construction capabilities needed to install the generators, the report added, citing a person familiar with the matter.\n\nReuters could not immediately verify the report and Anthropic and OnePWR did not respond to requests for comment.\n\nStrong demand for Anthropic's Claude family of AI models has prompted the company to secure additional \u200bcomputing and power capacity. Reuters reported in September that Anthropic expects to spend more than $500 billion over the next 10 years building AI infrastructure.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:53 PM IST", "pub_date_relative": "4h ago"}, {"title": "Trump targets Slotkin in call for DOJ probe of alleged Democratic threats to Republicans", "full_content": "President Donald Trump said Saturday that he was ordering the Justice Department to investigate Democratic leaders over what he described as threats against Republican officials, donors and supporters, without identifying the alleged communications or providing evidence of criminal conduct.\n\n\"The Democrats are going around threatening a lot of people, including the Attorney General of the United States, and others, with Impeachment and many other forms of punishment, even though they admit they have no reason to do so,\" Trump said in a Truth Social post .\n\nThe alleged threats, the president said, are \"extortion at the highest level,\" he wrote. \"I am ordering the Department of Justice to look into this criminal act, immediately!\"\n\nIn his post, Trump claimed that Democratic Sen. Elissa Slotkin of Michigan is planning to \"go after all young people that believe in Republican Values.\"\n\nTrump was apparently referencing a speech Slotkin made at a University of Chicago event on Oct. 13. At the time, Slotkin said: \"I want young people coming out of school to say, 'Should I go work for the Trump administration?'...I want them to be like, 'Lord, that might be buying myself a ton of problems that I don't want. And so let me avoid participating in that.' I want that deterrence message sent.\"\n\nSlotkin alleges that she, her family and her staff faced physical and legal intimidation after the posting of a November 2025 video in which Slotkin and other Democratic leaders called on the U.S. military to \"refuse illegal orders\" following the airstrikes targeting boats in the Caribbean.\n\nOn Nov. 20, Trump called the video treason and said \"an example must be set.\"\n\nThe FBI contacted lawmakers, including Slotkin, days later. In February, Slotkin declined to sit for an interview the Justice Department requested about the video.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:45 PM IST", "pub_date_relative": "4h ago"}, {"title": "Recent AI agent experiments reveal a risky future of machine 'teamwork' inside corporations", "full_content": "AI agents have been caught circumventing restrictions, communicating through unauthorized channels and pursuing goals in ways their creators did not intend. The most high-profile example emerged last summer when OpenAI disclosed that its models found ways to communicate through improvised channels, bypass internet restrictions and hack into an outside system , Hugging Face.\n\nAI behaving in unexpected ways is nothing new, but the unexpected behavior that can emerge from interactions among authorized AI agents within a corporate enterprise is a broader question that could become central to the future of work.\n\nIn its analysis of the Hugging Face attack , METR and Redwood Research found that roughly 1200 agents meant to be isolated from one another found a way to communicate with one another on an unsanctioned message board, sending over 70,000 messages and files during the investigation period. One agent, PHASEONE[big], emerged as a coordinator, assigning hundreds of tasks to other agents, which in turn delegated work to others. The agents developed their own conventions for assigning ownership, placing work on hold and vetoing actions, although coordination sometimes broke down into conflicts. In some cases, the researchers found, success was achieved because some agents risked failing at their own task to generate information for the \"collective.\"\n\nThe researchers also found that once the message board identified a way to attack Hugging Face, over 90% of the 533 agents active at that time quickly joined in the attack. \"Agents realized this activity was out of scope and unethical but joined because they believed that helping the board's cheating research would be broadly useful and had a general inclination to help their 'peers.' The researchers added that ethical concerns posed by agents \"rarely limited their behavior.\"\n\nCompanies are increasingly exploring systems that divide complex tasks among specialized agents.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 07:44 PM IST", "pub_date_relative": "4h ago"}, {"title": "\u2018We\u2019re losing to cottage cheese\u2019: The protein-maxxing craze is hurting cream-cheese sales", "full_content": "U.S. cottage-cheese sales have more than doubled from levels seen in 2021.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 07:43 PM IST", "pub_date_relative": "4h ago"}, {"title": "Received a Diwali bonus or voucher from your employer? Know the tax exemption limit and rules for salaried employees", "full_content": "Diwali gifts and bonuses from employers can provide salaried employees with some extra spending money during the festive season. However, not every festive benefit enjoys the same tax treatment. While qualifying gifts and vouchers worth less than \u20b9 15,000 in aggregate during the tax year can be tax-free, a cash bonus is generally taxable as salary from the first rupee.\n\nThe distinction is important for employees, particularly those earning close to the \u20b9 12 lakh taxable-income threshold under the new tax regime. A festive bonus could push their income above the rebate limit and increase their tax liability.\n\nThe Income-tax Act, 2025, and the Income-tax Rules, 2026, which came into effect on 1 April 2026, have increased the exemption for qualifying employer gifts from \u20b9 5,000 to less than \u20b9 15,000. Here is how the rules apply to different types of festive benefits.\n\nUnder Rule 15 of the Income-tax Rules, 2026, the value of gifts, vouchers and tokens received from an employer is treated as nil if their aggregate value remains below \u20b9 15,000 during the tax year.\n\nThe exemption applies to gifts received by employees or members of their household on ceremonial occasions or otherwise. It can cover physical gifts, festive hampers and qualifying shopping vouchers.\n\nFor example, if an employee receives a Diwali hamper worth \u20b9 8,000 and another gift worth \u20b9 5,000 from the employer during the same tax year, the aggregate value of \u20b9 13,000 remains tax-free.\n\nHowever, if the aggregate value reaches \u20b9 15,000, the entire value becomes taxable as a perquisite, not merely the amount exceeding the exemption threshold. The limit is annual, not applicable separately to every festival or occasion.\n\nA cash bonus paid by an employer as additional remuneration is treated differently from a qualifying gift or voucher.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 07:41 PM IST", "pub_date_relative": "4h ago"}, {"title": "Ramayana Box Office Collection Day 4: Nitesh Tiwari Film Crosses Rs 200 Crore In India", "full_content": "The first instalment released on November 5, 2026, in Hindi, Tamil, Telugu, Malayalam and Kannada.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 07:41 PM IST", "pub_date_relative": "4h ago"}, {"title": "2027 Toyota RAV4 Woodland Gains An Inch Where It Counts, All PHEVs Get NACS And Level 3 Charging - Jalopnik", "full_content": "2027 Toyota RAV4 Woodland Gains An Inch Where It Counts, All PHEVs Get NACS And Level 3 Charging Jalopnik How Much Is the 2027 Toyota RAV4? (JGall) Cars.com The 2027 Toyota RAV4 Raises Prices and Ride Height, While the PHEV Model Adds a NACS Charge Port Car and Driver 2027 Toyota RAV4 Updates: More Expensive, Better Charging, New Suspension Edmunds Toyota Quietly Gave The 2027 Toyota RAV4 PHEV A Big Upgrade InsideEVs", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 07:35 PM IST", "pub_date_relative": "4h ago"}, {"title": "Poppi founders are going after PepsiCo's Gatorade with new beverage startup Jetty", "full_content": "After disrupting the soda category with Poppi, founders Allison and Stephen Ellsworth are now taking aim at hydration with their new brand, Jetty.\n\nStarting Monday, Jetty drinks and ready-to-mix electrolyte packets will be on shelves at Whole Foods grocery stores and available online at Target and Amazon .\n\nThe new, self-funded venture directly pits the Ellsworths against PepsiCo , which bought Poppi for $1.95 billion in 2025. Pepsi owns Gatorade, which dominates the U.S. sports drink category with about 60% market share, according to Numerator data.\n\nPoppi shook up the soda category with prebiotic fiber, low calorie and sugar counts and its fun marketing aimed at Generation Z and millennials. Jetty looks to upend the hydration category through a similar strategy. To do so, it will face off not only against Gatorade but also a swarm of other upstarts looking to get in on the electrolyte-fueled trend.\n\nFor decades, Gatorade and other sports drinks have pitched their products to athletes who need electrolytes and fluids after an intense workout, although many consumers drink them every day without even sweating. Jetty is aimed at people who need a hydration boost, but not the same level of electrolytes or sugar as a traditional sports drink.\n\n\"No one has really created a product for just everyday hydration \u2014 literally everyday hydration for normal people,\" Allison Ellsworth, Jetty's chief brand officer, told CNBC. \"Like I woke up this morning, I didn't run a marathon.\"\n\nFollowing Poppi's sale to PepsiCo, Ellsworth stayed on as an advisor to the brand, although she said she is no longer involved in the day-to-day operations.\n\nAfter 10 years building Poppi, Ellsworth said, she finally had free time. As Ellsworth tells it, she went to the doctor for the first time in a decade. She started using a GLP-1 medication and lost 60 pounds.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "4h ago"}, {"title": "F1 Brazilian GP Final Race Live Streaming: When And Where To Watch In India", "full_content": "Newly crowned world champion Kimi Antonelli will look to add another victory to his tally as Formula 1 heads to Interlagos for the So Paulo Grand Prix.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Nvidia CEO Jensen Huang faces bipartisan congressional scrutiny over reported China spy link", "full_content": "Lawmakers from both sides of the aisle are ramping up calls for investigations into reports of Nvidia CEO Jensen Huang's relationship with an alleged Chinese spy. Some are also questioning what the Trump administration knew about the matter.\n\n\"The more I learn about the insane relationship between the Trump Administration, Chinese spies, and AI billionaires, the more I'm convinced there is nothing this administration does that isn't corrupt,\" Sen. Chris Coons, D-Del., posted on X on Saturday. \"Congress will investigate and get answers.\"\n\nCoons is in line to chair the Senate Foreign Relations Committee when his party takes control of the chamber in January.\n\nThree House Republican committee chairs sent a letter to Huang on Wednesday requesting that he sit for a closed-door briefing with lawmakers on Nov. 18, a day after the company is scheduled to report third-quarter earnings.\n\n\"Recent reports raise significant national security concerns regarding the [People's Republic of China's] access to sensitive U.S. technology and information,\" the GOP lawmakers wrote in a letter to Huang .\n\nThe reports refer to Huang's alleged relationship with Alice Huang, a Chinese citizen and executive at Megaspeed, a Singapore-based tech company that the U.S. has suspected of helping China circumvent artificial intelligence chip sales prohibitions.\n\nPolicymakers in the Trump administration received a memo last spring with intelligence identifying Alice Huang as having been recruited by China's Ministry of State Security and revealing her relationship with Nvidia's chief executive, The New York Times first reported on Friday.\n\nWhen asked by the Times whether Huang would appear before lawmakers to discuss the matter, Nvidia spokesman John Rizzo declined to comment. \"Our chief executive has an outstanding security team that accompanies him where needed,\" Mr. Rizzo said in a statement to the Times.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 11:48 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Here are the 2 big things we're watching in the stock market in the week ahead", "full_content": "CoreWeave earnings and inflation data will take center stage.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 11:10 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Cullen/Frost Bankers chief accounting officer Henson sells $85,290 of stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "08 Nov 2026, 10:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dividend alert: MRF, Cochin Shipyard, Talbros and others may reward shareholders this week - Check key dates, returns", "full_content": "COCHINSHIP DIVIDEND NILE Sharmila Bhadoria Published 8 Nov 2026, 10:00 PM IST Prefer Livemint on Google Dividend alert: Shares of MRF, Cochin Shipyard , EAAA India and Talbros Automotive Components are likely to remain in focus in the coming week as these companies are scheduled to announce their second-quarter results for FY27. Investors will also track their board meetings for potential dividend announcements.\n\nAs the corporate earnings season reached to its last leg, Nifty and Sensex are likely to remain volatile in the coming week after the market ended flat in Diwali\u2019s Muhurat trading session on Sunday, November 8. Nifty 50 failed to retain the 25,000 levels and ended 0.18% lower, whereas BSE Sensex closed 28.62 points lower.\n\nAs investors prepare for the next week\u2019s trading session, here are all the details to know.\n\nMRF, Cochin Shipyard, Nile Limited, Talbros Automotive Components, and EAA India are scheduled to announce their Q2FY27 results next week. They may also announce dividend.\n\nMRF share price closed 1.11% higher at \u20b9 1,26,699.85 per share on BSE on Sunday, November 8. The stock has delivered negative 20.25% return in one year, 6.22% return in two years, and 16.92% return in three years.\n\nShares of Cochin Shipyard closed 1.48% higher at \u20b9 1238 per share on BSE with a market capitalisation of \u20b9 32,569.40 crore on Friday. The stock has delivered 3% return in one month, but has declined 28.29% in one year, and 14.59% in two years.\n\nNile share price ended 6.12% higher at \u20b9 1397.25 per share on BSE with an MCap of \u20b9 419.44 crore. The stock has surged 14.26% in one year, but declined 19.47% in one year.\n\nThe company scrip closed Diwali Muhurat trading session with 2.07% gain at \u20b9 386.45 per share. The stock has delivered 12% return in two weeks and around 33.33% return in one year.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 10:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bhai Dooj 2026: 6 financial gifts you as a brother can gift to your sister on Diwali to make her financially stronger", "full_content": "Diwali 2026: Bhai Dooj, which celebrates the bond between brothers and sisters, will be observed on Wednesday, November 11.\n\nWhile sweets, clothes and jewellery remain popular gifts, brothers can use the occasion to support their sisters' financial independence by helping them save, invest and prepare for unexpected expenses.\n\nA systematic investment plan ( SIP ) in a mutual fund can be a meaningful gift for a sister looking to build wealth over the long term. A brother can gift her money to start an SIP in a mutual fund suited to her financial goals and risk appetite\n\nRegular investments can help build a corpus over time through the power of compounding. However, equity mutual funds are market-linked and do not guarantee returns. The investment horizon and risk tolerance should be considered before choosing a scheme.\n\nGold has traditionally been associated with prosperity and is a popular festive gift. Instead of buying jewellery, a brother can consider gifting digital gold or helping his sister invest in a Gold Exchange-Traded Fund (ETF).\n\nThese options allow her to gain exposure to gold without having to store physical jewellery. Gold ETFs are traded on stock exchanges and require a demat and trading account. Digital gold, meanwhile, comes with platform-specific terms and risks, so buyers should check the provider's credibility, storage arrangements and redemption charges before investing.\n\nFor a sister who prefers a government-backed, long-term savings option, a Public Provident Fund (PPF) account could be worth considering. A brother can help her open an account, understand its rules and make an initial contribution.\n\nPPF is designed for long-term savings and has a 15-year maturity period, with provisions for extension. It can help build a retirement or other long-term savings corpus. However, its lock-in period makes it unsuitable for money she may need immediately.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 09:21 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "How Democrats will try to end Trump's tariffs", "full_content": "The battle for Congress is over. The war over President Donald Trump 's tariffs is about to heat up.\n\nThe knotted web of tariffs that Trump spent the last two years weaving could soon face its biggest threat, as Democrats prepare to unload their new legislative firepower against the Republican president's signature policy.\n\nDemocrats have made no secret of their plans to bombard Trump and his associates with investigations as soon as the next Congress is sworn in. They are also preparing a first-100-hours legislative blitz, putting forward a series of bills that would unwind much of Trump's agenda.\n\nBoth prongs of attack will take aim at Trump's unprecedented use of tariffs , which Democrats have quickly identified as a main target following their landslide victory in Tuesday's midterm elections .\n\nEnding Trump's tariff regime, and especially his trade war against Canada, is something Democrats \"absolutely have to do immediately,\" Sen.-elect Abdul El-Sayed, D-Mich., told MS NOW's \"Morning Joe\" Thursday.\n\nRep. Hakeem Jeffries of New York, the Democratic minority leader who could be elected House speaker in the next Congress, has made clear that ending Trump's tariffs is a top priority.\n\n\"We should restore congressional authority as it relates to tariffs, because the Trump tariffs are making life more expensive for the American people,\" he said at a press conference in late August.\n\nIf picked as speaker, Jeffries would speed legislation to the House floor that reasserts congressional authority over trade.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 09:06 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bosch bonus issue, stock split: 1 share to become 20 after 38% rally in one year! Check ratio, record date, returns", "full_content": "Sharmila Bhadoria Published 8 Nov 2026, 09:01 PM IST Prefer Livemint on Google Bosch bonus issue, stock split: Shares of Bosch Limited surged nearly 8% over the past one week as the auto ancillary company announces its second quarter results for the financial year 2026-27. Alongside the corporate earnings announcement, Bosch also declared a bonus issue and stock split.\n\nShares of Bosch closed the special Diwali Muhurat trading session marginally higher on Sunday, November 8. Meanwhile, the auto ancillary stock has delivered 8.41% return in one week. Here are all the details about its upcoming corporate actions.\n\nThe company\u2019s board of directors, last week, approved sub division of shares in the ratio of 1:5, which means that every stock (with face value of \u20b9 10) will be divided into five equity shares (with a face value of \u20b9 2 each). The stock split will be executed after approval from the shareholders of the company through postal ballot.\n\nApart from stock split, Bosch\u2019s board of directors approved bonus issues in the ratio of 3:1. Which means that eligible investors will receive three bonus equity share of \u20b9 2 each for every one equity share with a face value of \u20b9 2 each.\n\nBosch shares will undergo stock split, followed by bonus issue corporate action. Which means that original shareholding of 1 share will turn into five shares (with face value of \u20b9 2 each) after stock split. Then, those 5 shares will lead to issuance of 15 additional shares after bonus issue. Which will make total holding of an investor to 20 shares (with face value of \u20b9 2 each).\n\nThe company is yet to notify about record dates for the two corporate actions.\n\nShares of Bosch closed 0.44% higher at \u20b9 50,990 per share on BSE with a market capitalisation of \u20b9 1,50,400.61 crore on Sunday, November 8, after Diwali Muhurat trading session.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 09:01 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI Spending Boom Nears Peak? Jefferies Flags Risks To Big Tech's $1 Trillion Capex", "full_content": "Jefferies says rising credit spreads, mounting financing risks and weakening cash flows could signal a peak in the AI investment boom, putting Big Tech's spending plans under pressure.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 08:45 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "\u20b93 lakh per year? Can parents invest \u20b91.5 lakh each in their child\u2019s PPF account? Income Tax rules, limits explained", "full_content": "Parents can secure their child's future and help them get a leg up financially. Here, a government-backed savings scheme, such as the public provident fund , is a safe, long-term bet. Offering 7.1% interest rate this quarter, PPF can help with your child's big expenses \u2014 be it for healthcare, marriage, education or other aspirations.\n\nEveryone is allowed one PPF account , which can be opened with a bank or the post office. For children and minor applicants, a parent or guardian can open a joint PPF account, which must be converted upon the account holder's 18th birthday. Here's how to open an account for a minor:\n\nInvestors sometimes misunderstand the tax-free investment limits when depositing amounts into their child's PPF account. While you may be confused that each parent can individually invest \u20b9 1.5 lakh each in your child's PPF account, this mathematically raises the annual contribution to \u20b9 3 lakh \u2014 way above the tax-free \u20b9 1.5 lakh cap.\n\nAccording to PPF rules, the total tax-free contribution is \u20b9 1.5 lakh per financial year, and this includes deposits made to own and children's accounts combined. Thus, a minor\u2019s PPF account cannot receive more than \u20b9 1.5 lakh in total contributions (from both parents combined) in a given tax year, regardless of who contributes.\n\nCheck the scenarios/illustrations below for how the limit functions:\n\nUnder income tax laws, contributions made to a child's PPF account are treated as a \u201cgift\u201d. Further, interest earned is credited to the child\u2019s account but may be clubbed with the higher-earning parent's income as per tax rules.\n\nHowever, as PPF interest is completely tax-free, it usually does not add any tax burden for the parent. Thus, regardless of one or two parents / guardians' contributions, the total deposit in a child\u2019s PPF account cannot exceed \u20b9 1.5 lakh in a given financial year.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 08:41 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Corporate America\u2019s profit numbers are just barely beating Wall Street\u2019s expectations", "full_content": "S&P 500 companies\u2019 earnings are mostly topping analysts\u2019 estimates \u2014 but by the narrowest margin in roughly four years.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 08:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street Races For Megadeals As Countdown Begins On Trump Era", "full_content": "The rout by the Democrats in the midterms is creating a sudden sense of urgency in boardrooms, with executives wondering if they might have one last chance to pull off a transformational transaction while M&A-friendly regulators remain in place under Trump.", "source": "NDTV Profit", "pub_date_str": "08 Nov 2026, 08:07 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Diwali 2026: Planning to invest in gold savings schemes by jewellers? How they work, benefits, risks and what to check", "full_content": "Many jewellers in India offer gold saving schemes to encourage customers to save towards purchasing gold jewellery. These schemes become particularly relevant during the festive season, especially around Dhanteras and Diwali, when making new purchases such as gold and silver items are considered auspicious and is traditionally associated with prosperity and good fortune.\n\nA jeweller gold savings scheme is a structured purchase plan in which you deposit a fixed amount every month for a set tenure. At maturity, you can use the accumulated funds, along with scheme benefits, to buy jewellery.\n\nThe scheme benefits typically include a discount on making charges or a bonus added at the time of redemption. Unlike other investment products, like bank deposits, these schemes do not offer interest on your deposits.\n\nGold savings schemes follow an instalment-based structure, allowing you to set aside a fixed amount every month towards a future jewellery purchase. While the exact terms vary across jewellers, most plans follow a similar process:\n\n\u2014 Enrol with a jeweller: Sign up for a scheme offered by a participating jeweller and choose your monthly instalment and tenure.\n\n\u2014 Pay monthly instalments: Deposit the agreed amount every month, typically for 10 or 11 months, depending on the scheme.\n\n\u2014 Redeem at maturity: Use your final deposit to purchase jewellery and avail of the scheme benefit, which may include a bonus instalment, a discount on making charges or other value additions.\n\n\u2014 Check the terms and conditions: Rules on missed instalments , grace periods, premature closure, redemption deadlines and eligible jewellery vary by jeweller. You must always check these details before considering the scheme.", "source": "LiveMint Money", "pub_date_str": "08 Nov 2026, 08:03 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income", "Alternative Investments"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Private equity firm seeks to take control of LIV Golf from Saudi wealth fund", "full_content": "BC Partners looks to purchase Public Investment Fund\u2019s bankruptcy loan in order to revive failed golf league assets", "source": "FT Markets", "pub_date_str": "08 Nov 2026, 08:02 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Diwali Stock Picks 2026: Tata Steel, BEL, HDFC Bank - 25 brokerages reveal 187 shares to buy in Samvat 2083 | Full List", "full_content": "STLTECH PAYTM ASTERDM Pranati Deva Published 8 Nov 2026, 08:01 PM IST Prefer Livemint on Google Stocks to buy : Investors looking for stock ideas ahead of Samvat 2083 have a wide range of companies to track, with 25 brokerages collectively identifying 187 distinct companies across their Diwali and Samvat stock-pick lists. The combined research list features large-cap leaders, mid-cap companies and emerging businesses spanning sectors such as banking, financial services, automobiles, metals, technology, pharmaceuticals, infrastructure, power and consumer businesses.\n\nThe compilation brings together visible stock recommendations from brokerages including Axis Securities, Motilal Oswal, HDFC Securities, Nirmal Bang, ICICI Securities, Religare Broking, Kotak Neo, JM Financial, InCred Equities, Ventura Securities, SBI Securities and Angel One, among others.\n\nThe lists contain several stocks that appear across multiple brokerage recommendations, suggesting that these companies have attracted attention from more than one research house. Banks, industrial companies, technology businesses, power and infrastructure players, and consumer-facing companies feature prominently in the recommendations.\n\nAxis Securities' Diwali list includes Eternal, Larsen & Toubro, Axis Bank, Bharat Electronics, BEL, Bharti Airtel, Blue Star and CUMI. The recommendations cover financial services, engineering, defence, telecommunications and industrial businesses.\n\nNirmal Bang's selections comprise Adani Ports, HDFC Securities, HDFC Bank, Nirmal Bang, ICICI Bank, Kotak Bank, Titan Company and UltraTech Cement. The list features banking and financial services alongside ports, consumer and cement businesses.\n\nArihant Capital has identified Sheela Foam, GMM Pfaudler, CE Info Systems, Raymond Lifestyles, Nuvoco Vistas, HEG Advanced, Exide Industries and Navin Fluorine.", "source": "LiveMint Markets", "pub_date_str": "08 Nov 2026, 08:01 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic secures $3.4 billion generator deal for AI data centers, FT reports", "full_content": "Anthropic has struck a deal worth about $3.4 billion to secure gas-fired power generators for data centers, the Financial Times reported on Sunday.\n\nThe AI startup bought commitments for 1.7 gigawatts of heavy-duty generators in late September from OnePWR Solutions, a San Antonio, Texas-based equipment supplier, the report said.\n\nAnthropic did not acquire OnePWR itself, and none of the supplier's employees transferred to the AI startup, but the deal included engineering and construction capabilities needed to install the generators, the report added, citing a person familiar with the matter.\n\nReuters could not immediately verify the report and Anthropic and OnePWR did not respond to requests for comment.\n\nStrong demand for Anthropic's Claude family of AI models has prompted the company to secure additional \u200bcomputing and power capacity. Reuters reported in September that Anthropic expects to spend more than $500 billion over the next 10 years building AI infrastructure.", "source": "CNBC Top News", "pub_date_str": "08 Nov 2026, 07:53 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Recent AI agent experiments reveal a risky future of machine 'teamwork' inside corporations", "full_content": "AI agents have been caught circumventing restrictions, communicating through unauthorized channels and pursuing goals in ways their creators did not intend. The most high-profile example emerged last summer when OpenAI disclosed that its models found ways to communicate through improvised channels, bypass internet restrictions and hack into an outside system , Hugging Face.\n\nAI behaving in unexpected ways is nothing new, but the unexpected behavior that can emerge from interactions among authorized AI agents within a corporate enterprise is a broader question that could become central to the future of work.\n\nIn its analysis of the Hugging Face attack , METR and Redwood Research found that roughly 1200 agents meant to be isolated from one another found a way to communicate with one another on an unsanctioned message board, sending over 70,000 messages and files during the investigation period. One agent, PHASEONE[big], emerged as a coordinator, assigning hundreds of tasks to other agents, which in turn delegated work to others. The agents developed their own conventions for assigning ownership, placing work on hold and vetoing actions, although coordination sometimes broke down into conflicts. In some cases, the researchers found, success was achieved because some agents risked failing at their own task to generate information for the \"collective.\"\n\nThe researchers also found that once the message board identified a way to attack Hugging Face, over 90% of the 533 agents active at that time quickly joined in the attack. \"Agents realized this activity was out of scope and unethical but joined because they believed that helping the board's cheating research would be broadly useful and had a general inclination to help their 'peers.' The researchers added that ethical concerns posed by agents \"rarely limited their behavior.\"\n\nCompanies are increasingly exploring systems that divide complex tasks among specialized agents.", "source": "CNBC World Economy", "pub_date_str": "08 Nov 2026, 07:44 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Stocks are moving in sync again for the first time in a while. There\u2019s just one problem.", "full_content": "An increasingly divided U.S. equity market is enjoying a rare moment of unity. Unfortunately, it has coincided with the biggest selloff in more than a year.", "source": "MarketWatch Top Stories", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Wall Street Races for Megadeals as Countdown Begins on Trump Era - Bloomberg.com", "full_content": "Wall Street Races for Megadeals as Countdown Begins on Trump Era Bloomberg.com Will The Blue Wave Midterms Put A Damper On Ad Tech M&A? AdExchanger Democrats' Midterm Victory Reshapes M&A Landscape Amid Regulator GuruFocus Megadeal Countdown After Democratic Midterm Surge Briefs Finance Dealmakers will ride US election blue wave Breakingviews", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 07:30 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Binance names new CFO days after $6.3 billion cryptocurrency hack - Fox Business", "full_content": "Binance names new CFO days after $6.3 billion cryptocurrency hack Fox Business Binance Says Kaiser Ng Leaving, Names Justin Yek New CFO Bloomberg.com It Turns Out Binance\u2019s $6 Billion Hack Happened Because Its Employees Were Vibe Coding Futurism North Korea\u2019s army of hackers is secret weapon that took down Binance Honolulu Star-Advertiser Insurers After $6.3 Billion Crypto Heist: D\u2019oh! Gizmodo", "source": "Google News Business", "pub_date_str": "08 Nov 2026, 07:12 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "RBI cheque book rules: Will existing CTS cheque books become invalid from January 1, 2027? Here's what RBI said", "full_content": "RBI cheque book rules: Bank customers will not have to replace their existing Cheque Truncation System (CTS) cheque books from January 1, 2027, the Reserve Bank of India (RBI) has clarified, dismissing viral social media claims that new cheque books with upgraded security features would become compulsory next year.\n\nThe clarification, issued on November 7, comes amid the circulation of messages suggesting that existing CTS cheque books would stop being valid after December 31, 2026. The central bank has described these claims as misleading and confirmed that no such changes are being introduced.\n\nIn a post on X, the RBI addressed reports claiming that customers would need to obtain fresh cheque books to comply with revised security requirements from January 1, 2027.\n\n\"It is clarified that at present Reserve Bank of India is not introducing any such measures with regard to the CTS cheque books,\" the central bank said.\n\nThe statement makes clear that the RBI has not announced any new requirement to replace existing CTS cheque books by the end of December.\n\nThe central bank also ad     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
