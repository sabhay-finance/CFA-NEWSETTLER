s to Fan Rate-Hike Bets", "full_content": "(Bloomberg) -- Gold was set to end to the week lower as elevated energy prices continued to fuel expectations the Federal Reserve will need to raise interest rates further to combat inflation.\n\nBullion was trading around $4,270 an ounce, down more than 2% since last Friday. Oil steadied after surging on Thursday as the US and Iran remained at an impasse on restoring energy flows through the Strait of Hormuz. Negotiators were said to be exploring a phased deal that would see Tehran reopen the critical waterway and Washington lift a port blockade.\n\nThe impact of persistently high energy costs on the Fed\u2019s rate path has dictated gold\u2019s trajectory in recent weeks as investors gauge whether this will keep inflationary pressures strong enough to prompt more increases, after the first hike in three years last week. Higher borrowing costs are typically negative for bullion as it pays no interest.\n\nLosses in the US Treasuries market intensified Thursday amid inflation fears stemming from the day\u2019s spike in oil prices, as well as concerns about government debt. Yields on 30-year US bonds rose to just shy of 5.5%, the highest in more than two decades. Wall Street is starting to consider that higher yields might be here to stay.\n\nStill, Australian hedge fund manager Raphael Lamm, whose long-short gold fund has delivered a net return of more than 200% to investors since its launch last year, sees the decline in gold prices as temporary, arguing that the key forces underpinning its long-term rally remain intact.\n\nSpot gold fell 0.1% to $4,271.54 an ounce at 7:50 a.m. in Singapore. Silver was down 0.2% at $63.68 an ounce and on track to end the week almost 4% lower. Platinum and palladium were little changed. The Bloomberg Dollar Spot Index, a gauge of the US currency, was steady after five days of gains.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint.", "s er to regulate swaps, which prediction markets view their event contracts as.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 05:47 AM IST", "pub_date_relative": "54m ago"}], "cfa": [{"title": "Raja Venkatraman recommends two stocks for 25 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nTrends remained in distress as the higher levels were used to supply on a continuous basis. With the markets not behaving as expected the trends ahead will continue to remain in a challenging mode.\n\nOn 24 September 2026, Indian markets extended their sharp gap-down opening into the mid-session, with the Sensex plunging 813 points or 1.09% to 74,015.05 and the Nifty 50 slipping 265 points or 1.13% to 23,181.80 by 1:18 pm.\n\nCAPLIPOINT: Buy above \u20b9 2870, stop \u20b9 2750 target \u20b9 3080 (Multiday)\n\nSelling pressure intensified across financials, metals, and insurance counters, dragging benchmarks lower. Financial stocks led the decline, with HDFC Life tumbling over 5% , Bajaj Finance and Axis Bank losing nearly 5% each, and Bajaj Finserv down close to 4%.\n\nHindalco also joined the losers, sliding more than 2%. Options data reflected defensive positioning, with heavy call writing at 23,300\u201323,400 strikes and strong put interest at 23,200 and 23,100. Market breadth remained weak, with the Nifty advance-decline ratio at 7:43. Only four Nifty stocks\u2014Cipla, SBI Life, Bharat Electronics, and NTPC\u2014traded in positive territory. Elevated crude prices near $91 and US Treasury yields above 5% further weighed on sentiment, while geopolitical tensions kept risk appetite subdued.\n\nThe markets are continuing to showcase hesitation and are slipping at the slightest hint of negative newsflow. As we observe the trends the market action remains pressured to the downside as we await some clarity. Despite the large-scale volatility the trends have been quite active in certain stocks thus making it a very stock specific movement. With the markets remaining restricted heightened stock specific action that could generate some more participation.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:32 AM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Global Market Today: Asian stocks edge up amid bond selloff, surging oil and Yen concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian stocks edge up amid bond selloff, surging oil and Yen concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian stocks edge up amid bond selloff, surging oil and Yen concerns SECTIONS Global Market Today: Asian stocks edge up amid bond selloff, surging oil and Yen concerns Bloomberg Last Updated: Sep 25, 2026, 06:29:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Australian and New Zealand 10-year government bonds slipped in early Asian trading. The yield on a global bond index hit 4% for the first time since 2007.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track late ng to the CME FedWatch tool .\n\nThe 30-year fixed rate mortgage , which tracks the 10-year note, rose to 7.45%, the highest level since 2024, as borrowing costs for consumers looked poised to increase ahead of the midterm elections.\n\n\"Even before the moves of the past few days, the declines in credit card [annual percentage rates] and auto loan rates that occurred from mid- 2024 through the start of 2026 had stalled, and mortgage rates reaccelerated,\" Heather Berger, economist at Morgan Stanley, wrote in a note to clients.", "source": "CNBC Top News", "pub_date_str": "25 Sep 2026, 06:26 AM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. stock futures drift lower as soaring yields, oil prices weigh", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:23 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stock recommendations for 25 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: The Indian stock market selloff intensified on Thursday as a toxic mix of surging bond yields, elevated crude oil prices, a weaker rupee and growing expectations of higher US interest rates rattled investors. The pressure was compounded by aggressive selling in banking, financial services and insurance stocks after the regulator proposed changes to insurance commission rules.\n\nThe Sensex tumbled 1,264 points, or 1.54%, to an intraday low of 73,563.92, while the Nifty 50 fell 369 points, or 1.57%, to 23,046.15. The Sensex ended 1,248 points, or 1.67%, lower at 73,580.54, while the broader Nifty 50 settled 383.70 points, or 1.6%, lower at 23,063.10.\n\nThe broad-based selloff also wiped out nearly \u20b9 5 trillion of investor wealth in a single session. The total market capitalization of companies listed on the BSE fell to \u20b9 480.99 trillion from \u20b9 485 trillion in the previous session.\n\nMost sectoral indices traded sharply lower, with pharma the only exception. Banking and financial services stocks were the biggest drags on the benchmarks after the Insurance Regulatory and Development Authority of India (Irdai) questioned the economics of bank-led insurance distribution , particularly the remuneration paid to banks under multiple tie-up arrangements.\n\nIndian equities ended sharply lower, with Nifty 50 closing at 23,063.10, down 383.70 points or 1.64%, near the session low of 23,046.15, indicating sustained selling pressure through the day.\n\nSensex also suffered a steep decline. Risk sentiment was hurt by Brent crude moving above $102/bbl and elevating U.S. Treasury yields, while weakness in financial and insurance stocks added to the pressure.\n\nThe sell-off was broad-based.", "source": "LiveMint Markets", "pub_date_str": "25 Sep 2026, 06:05 AM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Tango Therapeutics principal accounting officer sells $198k in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Sep 2026, 06:01 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Pre-market action: Here's the trade setup for today's session", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
