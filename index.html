al trade, valued at $11 trillion of the $33 trillion global trade market.\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Nov 2026, 12:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "What is Yash Bharti Samman? Akhilesh Yadav vows to reinstate award, double monthly honorarium to \u20b91L if SP wins UP polls", "full_content": "Samajwadi Party (SP) president Akhilesh Yadav has promised to revive the Yash Bharti Samman and double the monthly honorarium paid to its recipients from \u20b9 50,000 to \u20b9 1 lakh if his party returns to power in Uttar Pradesh after the 2027 Assembly elections.\n\nThe announcement brings the award, instituted to recognise outstanding talent and contributions across different fields, back into the political spotlight ahead of the state polls.\n\nYadav made the announcement on Sunday, November 22, while addressing a press conference in Lucknow on the birth anniversary of his father and Samajwadi Party founder Mulayam Singh Yadav.\n\nRecalling his father's approach towards public service and support for talented individuals, Akhilesh said Mulayam Singh, popularly known as Netaji, had helped people during difficult circumstances and worked to strengthen the socialist movement.\n\n\"Netaji never abandoned anyone in difficult times. He always helped those in need and continuously connected people to strengthen the socialist movement and its inclusive ideology,\" PTI quoted Akhilesh Yadav as saying.\n\nRecalling initiatives introduced during previous Samajwadi Party governments, he referred to the distribution of laptops to students and the establishment of the Yash Bharti awards to recognise exceptional achievements.\n\n\"If the Samajwadi Party forms the government in 2027, the Yash Bharti Samman will be reinstated. The honorarium given to its recipients will be increased from \u20b9 50,000 to \u20b9 1 lakh,\" he said.\n\nThe Yash Bharti Samman is an award instituted by the Uttar Pradesh government in 1994 under the then chief ministership of Mulayam Singh Yadav. It was established to recognise individuals who have made significant contributions in their respective fields and brought recognition to the state.", "source": "LiveMint Money", "pub_date_str": "23 Nov 2026, 12:09 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks To Watch Today: Waaree Energies, Berger Paints, Blue Dart Express, Raymond, Indian Bank & More", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Monday.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 12:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "These little-known investments could be among the best bargains in a crash", "full_content": "If this stock market turmoil turns into a full-blown crash, look for low-risk investment bargains among closed-end funds.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 11:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "US intelligence chief predicts more tech outages as systems undergo upgrades", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 11:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "Inside an AI prophet\u2019s secretive visions for humanity\u2019s future - The Washington Post", "full_content": "Inside an AI prophet\u2019s secretive visions for humanity\u2019s future The Washington Post Opinion | Don\u2019t Play Anthropic\u2019s Game The New York Times Did you just invest in a company that could destroy humanity? The Independent DealBook AGI panel: Dan Hendrycks wants frontier AI training paused The Next Web Opinion | Anthropic warned investors what could go wrong. Educators and parents should listen. Star Tribune", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 11:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "SIP on salary day or at month-end? Does your mutual fund investment date affect returns? What Sensex data reveal", "full_content": "Choosing a date for a monthly mutual fund systematic investment plan (SIP) may seem like an important investment decision, particularly for salaried investors who prefer to align instalments with their payday. But does investing on the 1st, 5th, 15th or 25th of the month actually change long-term returns?\n\nHistorical Sensex data suggest that the difference is marginal. A WhiteOak Capital Mutual Fund analysis found that the average 10-year SIP return varied very little across different investment dates. This indicates that investors may have little to gain from trying to identify the best day of the month.\n\nThe analysis compared the average 10-year annualised returns, measured through XIRR , for monthly SIP investments made on different dates. The results showed that the difference between the highest and lowest average returns was just 0.06 percentage points.\n\nThe highest average return was recorded for SIPs made between the 23rd and 28th of the month, while investments made on the 9th recorded the lowest. However, the gap was too small to suggest that one date offers a meaningful advantage over another.\n\nFor investors, this challenges the idea that there is a particularly advantageous date for making monthly mutual fund investments. The day that delivers the best return in one month may not do so in another. Investors can identify the best date only in hindsight.\n\nFor salaried investors, aligning an SIP with the date of salary credit can be a practical choice. It allows them to set aside money before discretionary spending reduces their available balance and lowers the risk of missing an instalment because of insufficient funds.\n\nInvestors should therefore prioritise a date that makes monthly contributions convenient and sustainable, rather than repeatedly changing their SIP mandates in an attempt to improve returns.\n\nA regular SIP also helps investors buy mutual fund units across different market conditions.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 11:29 PM IST", "pub_date_relative": "2h ago"}, {"title": "What is Oracle worth if you don\u2019t believe in the AI data center buildout?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 11:27 PM IST", "pub_date_relative": "2h ago"}, {"title": "US seeks answers on Nvidia\u2019s sale of chips to China, Bessent says", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 11:24 PM IST", "pub_date_relative": "2h ago"}, {"title": "Forget the mortgage. Behold the hidden costs of homeownership - USA Today", "full_content": "Forget the mortgage. Behold the hidden costs of homeownership USA Today US Homeowners Spend $21466 Beyond Mortgages Annually cwibc.co.id US homeowners spend $21,466 a year on average beyond their mortgage payments Yahoo Finance Map Shows 5 States Where It Costs More than $30,000 a Year To Own a Home Newsweek Saving to buy a home in New Jersey? Don't forget the hidden costs Bergen Record", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 11:16 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia Stock Has A Cockroach Problem. What Comes Next Could Be Worse - Forbes", "full_content": "Nvidia Stock Has A Cockroach Problem. What Comes Next Could Be Worse Forbes Nvidia\u2019s roaring results can\u2019t hide its troubles The Economist Four takeaways from Nvidia\u2019s first earnings report after Jensen Huang scandal CNN Stock Market Dives To New Lows Despite Nvidia Earnings, Anthropic IPO: Weekly Review Investor's Business Daily Nvidia delivered a monster quarter, then its new leaders stumbled on the earnings call Yahoo Finance", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 11:07 PM IST", "pub_date_relative": "2h ago"}, {"title": "I\u2019ve studied over 200 kids\u2014to avoid raising a people pleaser, ditch 6 parenting habits: It starts in \u2018ordinary, well-intentioned moments\u2019", "full_content": "We all want to raise children who are kind, respectful and considerate. But sometimes, the very behaviors we praise are the ones teaching our children to put themselves last.\n\nA child who never complains, always agrees and goes out of their way to make others happy might seem like a parent's dream. But what if they've simply learned that being easy to love means trying to please everyone all the time?\n\nAs a conscious parenting coach who's worked with over 200 families, I've seen how people pleasing can begin in the most ordinary, well-intentioned moments at home.\n\nWe love telling our children how easygoing they are, especially when they rarely complain or make demands. But when being easy earns our approval, children may start believing their needs are a burden and their feelings are better kept to themselves.\n\nWhat to do instead: Make room for your child's disappointment, frustration and disagreement, even when it's inconvenient. They need to know they don't have to be happy or agreeable to be accepted by you.\n\nWhen children question our decisions, it's tempting to respond with \"Don't talk back\" or \"Because I said so.\" But when we repeatedly shut down their opinions, we may be teaching them that having a voice comes at the cost of a connection with us.\n\nWhat to do instead: Separate disrespectful behavior from differences in perspective. You can say, \"You don't have to agree with me. I want to understand what you think.\"\n\nStatements that start with \"After everything I've done for you\u2026\" may seem harmless in the moment, but they can leave children feeling responsible for their parents' emotional well-being.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 11:03 PM IST", "pub_date_relative": "2h ago"}, {"title": "Who Is Claire Bramlee? The New Paypal Chief Financial Officer Set To Succeed Jamie Miller", "full_content": "Bramley spent more than 14 years at HP, holding a series of senior finance positions across the UK, Switzerland and the US.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 10:53 PM IST", "pub_date_relative": "3h ago"}, {"title": "Private equity has been buying up hospice centers \u2014 with striking consequences", "full_content": "Medicare costs are higher and patients stay longer at hospice providers owned by private-equity firms, new research has found.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 10:52 PM IST", "pub_date_relative": "3h ago"}, {"title": "Transcript: Treasury Secretary Scott Bessent on \"Face the Nation with Margaret Brennan,\" Nov. 22, 2026 - CBS News", "full_content": "Transcript: Treasury Secretary Scott Bessent on \"Face the Nation with Margaret Brennan,\" Nov. 22, 2026 CBS News Face the Nation: Smith, cybersecurity panel Yahoo Transcript: Brad Smith, Microsoft president and vice chair, on \"Face the Nation with Margaret Brennan,\" Nov. 22, 2026 CBS News Trump Goon Mocked for His Bizarre Pep Talk on Outage Chaos The Daily Beast Jeffries, Treasury Secretary Bessent and Microsoft president to appear on Nov. 22 Face the Nation; cybersecurity experts to discuss outages Tippah News", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 10:46 PM IST", "pub_date_relative": "3h ago"}, {"title": "Director of National Intelligence Jay Clayton warns Americans of 'bumps in the road' after tech outages", "full_content": "Director of National Intelligence Jay Clayton warned Americans to prepare for \"bumps in the road\" after a set of damaging technology outages rocked air travel and systems like Microsoft Outlook.\n\nGovernment officials have largely dismissed the prospects that the outages, which also slowed bank transactions , are linked to a coordinated or artificial intelligence cyberattack.\n\nClayton, however, said on CNN's \"State of the Union\" that outages may continue as companies and the government upgrade their systems to adapt to the AI age.\n\n\"The American people should be prepared for a great deal of investment in upgrading our systems; they should be prepared for investment in cybersecurity, and they should be prepared that any time there is a step change in technology, a step change in both compute and applications, there will be bumps in the road,\" Clayton said.\n\n\"You prepare by knowing that systems are going to be upgraded; they may be interrupted for a period of time and that companies and government are dealing with this on the front foot,\" he said.\n\nClayton's warning came as the U.S. prepares to celebrate Thanksgiving on Thursday, one of the busiest travel weeks of the year. A technology outage prompted a nationwide ground stop just over a week ago, which lasted for hours.\n\nThe Federal Aviation Administration said router upgrades caused a flood of data that led to the ground stop, and that there is no indication of a cyberattack.\n\nSeparately, Microsoft said the Outlook outage was caused by \"an issue during an earlier network capacity upgrade.\"", "source": "CNBC World Economy", "pub_date_str": "22 Nov 2026, 10:44 PM IST", "pub_date_relative": "3h ago"}, {"title": "Income tax notice sent to your old address? When can ITAT declare reassessment proceedings invalid for taxpayers", "full_content": "A taxpayer may face an income-tax demand years after an assessment is reopened, even if he was unaware that the proceedings had begun. But can the tax department sustain a reassessment when the notice initiating it was sent to an address where the taxpayer no longer worked?\n\nThe Delhi bench of the Income Tax Appellate Tribunal (ITAT) recently ruled in favour of a taxpayer in such a case, holding that reassessment proceedings cannot stand when the mandatory notice under Section 148 of the Income-tax Act has not been validly served.\n\nIn the case of Ranbir Singh vs Income Tax Officer , concerning assessment year 2011-12, the tribunal quashed the reassessment after finding that the tax department had sent the notice to the taxpayer's former office address, even though he had retired from the Delhi Transport Corporation (DTC) years earlier. The order was pronounced on 23 March 2026.\n\nThe dispute arose after the Income Tax Department initiated reassessment proceedings under Section 147 of the Income-tax Act.\n\nSingh challenged the proceedings, arguing that he had never been served with the mandatory notice under Section 148. He had retired from DTC with effect from 30 April 2010, but the department sent the notice dated 31 March 2018 to his former office address.\n\nThe Assessing Officer also claimed to have served a subsequent show-cause notice through affixture. However, the tribunal found that the department had attempted to serve it at the same office address, without checking whether Singh was still employed there or verifying his current whereabouts.\n\nSingh argued that the assessment had been completed without giving him an opportunity to respond, as he was unaware of the proceedings.\n\nThe tribunal examined whether the department had fulfilled the legal requirement of serving the notice under Section 148.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 10:32 PM IST", "pub_date_relative": "3h ago"}, {"title": "Air Products group president sells $142,584 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 10:31 PM IST", "pub_date_relative": "3h ago"}, {"title": "\u2018Nvidia\u2019s turmoil has me treaming: When And Where To Watch Serie A Match?", "full_content": "Check the date, kick-off time, venue and live telecast details for the Atalanta vs Inter Milan clash.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 10:00 PM IST", "pub_date_relative": "3h ago"}, {"title": "Bullion May Extend Losses This Week As US Economic Data, Fed Cues Loom: Analysts", "full_content": "Gold and silver face further downside risks as hawkish Fed signals, a stronger dollar and thin holiday trading weigh on sentiment.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 09:59 PM IST", "pub_date_relative": "3h ago"}, {"title": "\u2018I felt so seen\u2019: Why families across America are laughing \u2014 and crying \u2014 over SNL\u2019s \u2018Sister\u2019 sketch", "full_content": "The late-night comedy sketch does the impossible by making female caregivers feel seen.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 09:48 PM IST", "pub_date_relative": "4h ago"}, {"title": "ENE Repeat Box Office Collection Day 4: Vishwak Sen Starrer Holds Steady On First Sunday", "full_content": "Directed by Tharun Bhascker Dhaassyam, ENE Repeat follows Vivek and his close-knit group of friends, who reunite years after their memorable misadventure in Goa.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 09:45 PM IST", "pub_date_relative": "4h ago"}, {"title": "\u2018Never too late to start\u2019: Practical investing advice from some of the top women in finance", "full_content": "There are plenty of rich and influential women in the U.S. Their time may be coming.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 09:45 PM IST", "pub_date_relative": "4h ago"}, {"title": "My husband spent $80,000 on a boat, yet says my plans for a $100,000 pottery studio are irresponsible. Who\u2019s right?", "full_content": "\u201cWe have $2.9 million in retirement accounts. That includes some money that we inherited about 10 years ago.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 09:40 PM IST", "pub_date_relative": "4h ago"}, {"title": "F.A.A. Says All Delta Flights Through Atlanta Delayed as Automated System Falters - The New York Times", "full_content": "F.A.A. Says All Delta Flights Through Atlanta Delayed as Automated System Falters The New York Times Delta Air Lines flights delayed nationwide, snarling holiday travel after carrier computer problems CNN Atlanta\u2019s Airport Has Massive Flight Delays. Expect More Tech \u2018Glitches,\u2019 Clayton Says. Barron's Delta Air Lines automation issue triggers hundreds of Thanksgiving travel delays in Atlanta FOX 5 Atlanta Issue with automation system causes Delta flight delays in Atlanta AL.com", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 09:39 PM IST", "pub_date_relative": "4h ago"}, {"title": "PNB MD Says ECL Provision Requirement Is Around Rs 5,000 Crore, With No Impact On Profitability", "full_content": "The reduction of around Rs 1,000-1,500 crore reflects the bank's sound underwriting standards over the past six years.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 09:36 PM IST", "pub_date_relative": "4h ago"}, {"title": "America is definitely rich enough to fix Social Security and Medicare. Here\u2019s how.", "full_content": "This one, simple, low-pain tax solves all the problems.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 09:34 PM IST", "pub_date_relative": "4h ago"}, {"title": "FD interest rate vs maturity date: Should you chase higher returns or choose a tenure that suits your financial goals?", "full_content": "For fixed deposit (FD) investors, choosing the highest available interest rate may not always be the best decision. The tenure of the deposit and the date on which the money becomes available can be equally important, particularly when savings are earmarked for a specific financial goal.\n\nA five-year FD offering a higher rate may generate a larger maturity amount, but it could leave an investor with limited access to money needed earlier. On the other hand, choosing a shorter deposit to retain flexibility exposes investors to the risk of reinvesting at lower interest rates when the FD matures.\n\nThe decision, therefore, should go beyond comparing advertised FD rates. Investors need to consider when they will need the money, how much liquidity they require and what interest rates could look like when the deposit matures.\n\nAn FD maturity date determines when the bank returns the principal along with the accumulated interest. Until then, the money remains committed to the chosen tenure, subject to the bank's premature withdrawal rules.\n\nA common mistake is to select a deposit solely because it offers a higher interest rate. Banks do not necessarily offer their best rates on the longest tenures. A two-year FD, for instance, could offer a better rate than a five-year deposit.\n\nInvestors should compare rates across different tenures rather than assume that a longer deposit will automatically deliver better returns.\n\nThe maturity date should also correspond with the investor's financial commitments. Someone planning a house down payment in two years may prefer an FD that matures around that time rather than locking the entire amount into a five-year deposit.\n\nConsider an investor with \u20b9 10 lakh who has two options: a one-year FD offering 6.5% interest or a five-year FD offering 7%, assuming quarterly compounding.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 09:33 PM IST", "pub_date_relative": "4h ago"}, {"title": "Shree Cement To Cross 100 Mt Capacity In 3-4 Yrs; Targets 9-10% Growth: Chairman Hari Mohan Bangur", "full_content": "Bangur said the company is targeting a compound annual growth rate (CAGR) of 9-10 per cent over the next six to seven years, higher than the expected 7-8 per cent growth in the overall Indian cement industry.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 09:23 PM IST", "pub_date_relative": "4h ago"}, {"title": "Gold slides to lowest level since September 2025, silver crashes nearly 4%: What's driving the selloff?", "full_content": "Gold and silver prices plunged in US trade on Friday, dragged down by a technology-driven stock market selloff , mounting concerns over global growth and expectations of further Federal Reserve rate hikes.\n\nGold fell towards $3,500 an ounce , hitting its lowest level since September 2025, while silver plunged nearly 4% as investors pulled back from commodities amid deteriorating risk sentiment.\n\nAccording to Kitco, spot gold was trading at $3,537.90 an ounce at 5 p.m. ET on Friday, down $86.30, or 2.38%, while spot silver stood at $41.120, falling $1.637, or 3.83%. Gold touched an intraday low of $3,502.93, while silver slipped to $40.660.\n\nThe selloff came despite a weaker US dollar and declining Treasury yields, which would typically support precious metals, suggesting that broader portfolio liquidation and concerns about the economic outlook were overriding traditional market drivers.\n\nThe sharp decline in US equities triggered selling across asset classes as investors reassessed valuations of artificial intelligence companies, heavy technology spending and the sustainability of returns from AI investments.\n\nThe S&P 500 plunged 3.70% on Friday to close at 6,910.39, falling more than 10% from its October 6 record high and entering correction territory. The Nasdaq Composite tumbled 5.28% to 22,617.73, turning negative for the year, while the Dow Jones Industrial Average fell 949.73 points, or 1.93%, to 48,147.33.\n\nThe selloff extended losses for the week, with the Nasdaq declining approximately 10%, the S&P 500 losing 8.6% and the Dow falling around 8%.\n\nThe broader market weakness encouraged investors to reduce exposure to risk assets, with gold and silver also facing liquidation rather than benefiting from increased demand for safe havens.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 09:16 PM IST", "pub_date_relative": "4h ago"}, {"title": "APL Apollo To Buy Tata Steel's Tubes And Colors Business For Rs 28,000 Crore", "full_content": "The business deal regarding its Tubes business involves Rs 11,700 crore in cash transferred via a slump sale to APL Apollo.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 09:01 PM IST", "pub_date_relative": "4h ago"}, {"title": "Yardeni Cuts S&P 500 Target Again, Says Bear Market Is Unlikely - Bloomberg.com", "full_content": "Yardeni Cuts S&P 500 Target Again, Says Bear Market Is Unlikely Bloomberg.com Ed Yardeni Says Investors Are Overreacting to S&P 500 Selloff TradingView Wall Street's Biggest Bull Says Investors Are Overreacting BeInCrypto Stay invested in stocks right now, Ed Yardeni advises Traders Union S&P 500 Falls as Yardeni Cuts Year-End Target to 7,500 JournalArta", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 08:48 PM IST", "pub_date_relative": "5h ago"}, {"title": "'Extremely Cheap' Yet Too Risky: Why Bernstein Is Hesitating To Buy The Dip In Nvidia Stock", "full_content": "The brokerage expects Nvidia's revenue to rise from $406.9 billion in fiscal 2027 to $690.3 billion in fiscal 2028,", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:42 PM IST", "pub_date_relative": "5h ago"}, {"title": "Modi Says 50-Crore People Lifted Out Of Poverty, But Some Still Hesitant To Acknowledge It", "full_content": "Modi also defended initiatives such as opening bank accounts for the poor, providing LPG connections, electricity access and distributing Ayushman Bharat health cards, saying critics had questioned their effectiveness when they were introduced.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:39 PM IST", "pub_date_relative": "5h ago"}, {"title": "Karur Vysya Bank raises one-year MCLR to 9.30% from November 22: Here's what changes for borrowers", "full_content": "Karur Vysya Bank has increased its one-year Marginal Cost of Funds Based Lending Rate (MCLR) by 5 basis points (bps) to 9.30% from November 22, 2026. The private sector lender has also raised its overnight, one-month, three-month and six-month MCLR by 5 bps each.\n\nHowever, in a separate revision, the bank has reduced its Base Rate and Benchmark Prime Lending Rate (BPLR) by 25 bps each.\n\nThe revised lending rates were announced through a regulatory filing dated November 19. The changes will affect borrowers differently depending on the benchmark to which their loans are linked.\n\nFollowing the latest revision, the bank's overnight and one-month MCLR have increased from 8.85% to 8.90%. The three-month rate has moved up from 9% to 9.05%.\n\nSimilarly, the six-month MCLR has been raised from 9.15% to 9.20%, while the one-year MCLR has increased from 9.25% to 9.30%.\n\nAlongside the MCLR increase, Karur Vysya Bank has lowered two other lending benchmarks.\n\nThe bank's Base Rate has been reduced from 11.20% to 10.95%, marking a cut of 25 bps. The Benchmark Prime Lending Rate has also been brought down from 16.20% to 15.95%.\n\nBoth these changes will also come into effect from Sunday, November 22.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:37 PM IST", "pub_date_relative": "5h ago"}, {"title": "I-285 South lanes over Chattahoochee River bridge open after emergency repairs - The Atlanta Journal-Constitution", "full_content": "I-285 South lanes over Chattahoochee River bridge open after emergency repairs The Atlanta Journal-Constitution I-285 bridge joint issue in Smyrna poses 'no structural danger,' GDOT says FOX 5 Atlanta Lanes on I-285 reopen in Cobb County after emergency closure 11Alive.com I-285 bridge over Chattahoochee reopens after temporary repairs closed span WSB-TV I-285 southbound bridge partially reopens, three lanes remain closed 95.5 WSB", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 08:33 PM IST", "pub_date_relative": "5h ago"}], "cfa": [{"title": "South Africa vs Bangladesh 2nd Test Live Streaming: When And Where To Watch SA vs BAN Match In India", "full_content": "South Africa face Bangladesh in the second Test from November 23. Check the match time, venue and live streaming details in India.", "source": "NDTV Profit", "pub_date_str": "23 Nov 2026, 01:30 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Delta flights faced brief delays at Atlanta airport over automated system issue", "full_content": "", "source": "Investing.com News", "pub_date_str": "23 Nov 2026, 12:48 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "The decade India turned the tide on poverty", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a The decade India turned the tide on poverty The Economic Times daily newspaper is available online now. Read Today's Paper The decade India turned the tide on poverty SECTIONS The decade India turned the tide on poverty By Nirmala Sitharaman , ET CONTRIBUTORS Last Updated: Nov 23, 2026, 12:30:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The World Bank report highlights that nearly 50 crore Indians have moved out of poverty between 2011 and 2023. Government efforts include health initiatives and direct benefit transfers that empower households. Women's participation in self-help groups has transformed economic opportunities for many. Continued investment in infrastructure aims to support future growth and prevent slippage back into poverty. Achieving Viksit Bharat by 2047 remains a shared goal for India's development.\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Nov 2026, 12:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India-EU trade deal likely to be signed on December 16", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-EU trade deal likely to be signed on December 16 The Economic Times daily newspaper is available online now. Read Today's Paper India-EU trade deal likely to be signed on December 16 SECTIONS India-EU trade deal likely to be signed on December 16 PTI Last Updated: Nov 23, 2026, 12:12:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Described as the 'mother of all deals', the FTA will provide duty-free access to the EU for 93% of India's exports, while making imports of luxury cars and wines from the bloc cheaper. Together, India and the EU account for 25% of global GDP and about one-third of international trade, valued at $11 trillion of the $33 trillion global trade market.\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nWhy IndiGo could land a sharp rebound in profit despite a sluggish aviation market\n\nGold still rules, but with a difference: How young India is redefining wedding jewellery\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "23 Nov 2026, 12:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "These little-known investments could be among the best bargains in a crash", "full_content": "If this stock market turmoil turns into a full-blown crash, look for low-risk investment bargains among closed-end funds.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 11:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "SIP on salary day or at month-end? Does your mutual fund investment date affect returns? What Sensex data reveal", "full_content": "Choosing a date for a monthly mutual fund systematic investment plan (SIP) may seem like an important investment decision, particularly for salaried investors who prefer to align instalments with their payday. But does investing on the 1st, 5th, 15th or 25th of the month actually change long-term returns?\n\nHistorical Sensex data suggest that the difference is marginal. A WhiteOak Capital Mutual Fund analysis found that the average 10-year SIP return varied very little across different investment dates. This indicates that investors may have little to gain from trying to identify the best day of the month.\n\nThe analysis compared the average 10-year annualised returns, measured through XIRR , for monthly SIP investments made on different dates. The results showed that the difference between the highest and lowest average returns was just 0.06 percentage points.\n\nThe highest average return was recorded for SIPs made between the 23rd and 28th of the month, while investments made on the 9th recorded the lowest. However, the gap was too small to suggest that one date offers a meaningful advantage over another.\n\nFor investors, this challenges the idea that there is a particularly advantageous date for making monthly mutual fund investments. The day that delivers the best return in one month may not do so in another. Investors can identify the best date only in hindsight.\n\nFor salaried investors, aligning an SIP with the date of salary credit can be a practical choice. It allows them to set aside money before discretionary spending reduces their available balance and lowers the risk of missing an instalment because of insufficient funds.\n\nInvestors should therefore prioritise a date that makes monthly contributions convenient and sustainable, rather than repeatedly changing their SIP mandates in an attempt to improve returns.\n\nA regular SIP also helps investors buy mutual fund units across different market conditions.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 11:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia Stock Has A Cockroach Problem. What Comes Next Could Be Worse - Forbes", "full_content": "Nvidia Stock Has A Cockroach Problem. What Comes Next Could Be Worse Forbes Nvidia\u2019s roaring results can\u2019t hide its troubles The Economist Four takeaways from Nvidia\u2019s first earnings report after Jensen Huang scandal CNN Stock Market Dives To New Lows Despite Nvidia Earnings, Anthropic IPO: Weekly Review Investor's Business Daily Nvidia delivered a monster quarter, then its new leaders stumbled on the earnings call Yahoo Finance", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 11:07 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Private equity has been buying up hospice centers \u2014 with striking consequences", "full_content": "Medicare costs are higher and patients stay longer at hospice providers owned by private-equity firms, new research has found.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 10:52 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Transcript: Treasury Secretary Scott Bessent on \"Face the Nation with Margaret Brennan,\" Nov. 22, 2026 - CBS News", "full_content": "Transcript: Treasury Secretary Scott Bessent on \"Face the Nation with Margaret Brennan,\" Nov. 22, 2026 CBS News Face the Nation: Smith, cybersecurity panel Yahoo Transcript: Brad Smith, Microsoft president and vice chair, on \"Face the Nation with Margaret Brennan,\" Nov. 22, 2026 CBS News Trump Goon Mocked for His Bizarre Pep Talk on Outage Chaos The Daily Beast Jeffries, Treasury Secretary Bessent and Microsoft president to appear on Nov. 22 Face the Nation; cybersecurity experts to discuss outages Tippah News", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 10:46 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "\u2018Nvidia\u2019s turmoil has me spooked\u2019: Is it time to sell my stocks and buy real estate?", "full_content": "If you are tempted to ditch stocks for property or CDs, take a deep breath before making any sudden moves.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 10:30 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Buy, Sell Or Hold: Fortis Healthcare, Paytm, ICICI Bank And HDFC Bank \u2014 Ask Profit", "full_content": "Market experts shared buy, sell and hold recommendations for stocks such as Fortis Healthcare, Paytm, ICICI Bank and HDFC Bank.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 10:14 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "I\u2019m terrified of a market crash. Should I put $400,000 of my $1 million retirement savings into an annuity?", "full_content": "\u201cWe have a house worth $450,000. Our combined annual income is $125,000.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 10:02 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bullion May Extend Losses This Week As US Economic Data, Fed Cues Loom: Analysts", "full_content": "Gold and silver face further downside risks as hawkish Fed signals, a stronger dollar and thin holiday trading weigh on sentiment.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 09:59 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "F.A.A. Says All Delta Flights Through Atlanta Delayed as Automated System Falters - The New York Times", "full_content": "F.A.A. Says All Delta Flights Through Atlanta Delayed as Automated System Falters The New York Times Delta Air Lines flights delayed nationwide, snarling holiday travel after carrier computer problems CNN Atlanta\u2019s Airport Has Massive Flight Delays. Expect More Tech \u2018Glitches,\u2019 Clayton Says. Barron's Delta Air Lines automation issue triggers hundreds of Thanksgiving travel delays in Atlanta FOX 5 Atlanta Issue with automation system causes Delta flight delays in Atlanta AL.com", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 09:39 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "FD interest rate vs maturity date: Should you chase higher returns or choose a tenure that suits your financial goals?", "full_content": "For fixed deposit (FD) investors, choosing the highest available interest rate may not always be the best decision. The tenure of the deposit and the date on which the money becomes available can be equally important, particularly when savings are earmarked for a specific financial goal.\n\nA five-year FD offering a higher rate may generate a larger maturity amount, but it could leave an investor with limited access to money needed earlier. On the other hand, choosing a shorter deposit to retain flexibility exposes investors to the risk of reinvesting at lower interest rates when the FD matures.\n\nThe decision, therefore, should go beyond comparing advertised FD rates. Investors need to consider when they will need the money, how much liquidity they require and what interest rates could look like when the deposit matures.\n\nAn FD maturity date determines when the bank returns the principal along with the accumulated interest. Until then, the money remains committed to the chosen tenure, subject to the bank's premature withdrawal rules.\n\nA common mistake is to select a deposit solely because it offers a higher interest rate. Banks do not necessarily offer their best rates on the longest tenures. A two-year FD, for instance, could offer a better rate than a five-year deposit.\n\nInvestors should compare rates across different tenures rather than assume that a longer deposit will automatically deliver better returns.\n\nThe maturity date should also correspond with the investor's financial commitments. Someone planning a house down payment in two years may prefer an FD that matures around that time rather than locking the entire amount into a five-year deposit.\n\nConsider an investor with \u20b9 10 lakh who has two options: a one-year FD offering 6.5% interest or a five-year FD offering 7%, assuming quarterly compounding.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 09:33 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Quantitative Methods", "Economics", "Fixed Income", "Derivatives"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Gold slides to lowest level since September 2025, silver crashes nearly 4%: What's driving the selloff?", "full_content": "Gold and silver prices plunged in US trade on Friday, dragged down by a technology-driven stock market selloff , mounting concerns over global growth and expectations of further Federal Reserve rate hikes.\n\nGold fell towards $3,500 an ounce , hitting its lowest level since September 2025, while silver plunged nearly 4% as investors pulled back from commodities amid deteriorating risk sentiment.\n\nAccording to Kitco, spot gold was trading at $3,537.90 an ounce at 5 p.m. ET on Friday, down $86.30, or 2.38%, while spot silver stood at $41.120, falling $1.637, or 3.83%. Gold touched an intraday low of $3,502.93, while silver slipped to $40.660.\n\nThe selloff came despite a weaker US dollar and declining Treasury yields, which would typically support precious metals, suggesting that broader portfolio liquidation and concerns about the economic outlook were overriding traditional market drivers.\n\nThe sharp decline in US equities triggered selling across asset classes as investors reassessed valuations of artificial intelligence companies, heavy technology spending and the sustainability of returns from AI investments.\n\nThe S&P 500 plunged 3.70% on Friday to close at 6,910.39, falling more than 10% from its October 6 record high and entering correction territory. The Nasdaq Composite tumbled 5.28% to 22,617.73, turning negative for the year, while the Dow Jones Industrial Average fell 949.73 points, or 1.93%, to 48,147.33.\n\nThe selloff extended losses for the week, with the Nasdaq declining approximately 10%, the S&P 500 losing 8.6% and the Dow falling around 8%.\n\nThe broader market weakness encouraged investors to reduce exposure to risk assets, with gold and silver also facing liquidation rather than benefiting from increased demand for safe havens.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 09:16 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Yardeni Cuts S&P 500 Target Again, Says Bear Market Is Unlikely - Bloomberg.com", "full_content": "Yardeni Cuts S&P 500 Target Again, Says Bear Market Is Unlikely Bloomberg.com Ed Yardeni Says Investors Are Overreacting to S&P 500 Selloff TradingView Wall Street's Biggest Bull Says Investors Are Overreacting BeInCrypto Stay invested in stocks right now, Ed Yardeni advises Traders Union S&P 500 Falls as Yardeni Cuts Year-End Target to 7,500 JournalArta", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 08:48 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "'Extremely Cheap' Yet Too Risky: Why Bernstein Is Hesitating To Buy The Dip In Nvidia Stock", "full_content": "The brokerage expects Nvidia's revenue to rise from $406.9 billion in fiscal 2027 to $690.3 billion in fiscal 2028,", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:42 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Karur Vysya Bank raises one-year MCLR to 9.30% from November 22: Here's what changes for borrowers", "full_content": "Karur Vysya Bank has increased its one-year Marginal Cost of Funds Based Lending Rate (MCLR) by 5 basis points (bps) to 9.30% from November 22, 2026. The private sector lender has also raised its overnight, one-month, three-month and six-month MCLR by 5 bps each.\n\nHowever, in a separate revision, the bank has reduced its Base Rate and Benchmark Prime Lending Rate (BPLR) by 25 bps each.\n\nThe revised lending rates were announced through a regulatory filing dated November 19. The changes will affect borrowers differently depending on the benchmark to which their loans are linked.\n\nFollowing the latest revision, the bank's overnight and one-month MCLR have increased from 8.85% to 8.90%. The three-month rate has moved up from 9% to 9.05%.\n\nSimilarly, the six-month MCLR has been raised from 9.15% to 9.20%, while the one-year MCLR has increased from 9.25% to 9.30%.\n\nAlongside the MCLR increase, Karur Vysya Bank has lowered two other lending benchmarks.\n\nThe bank's Base Rate has been reduced from 11.20% to 10.95%, marking a cut of 25 bps. The Benchmark Prime Lending Rate has also been brought down from 16.20% to 15.95%.\n\nBoth these changes will also come into effect from Sunday, November 22.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:37 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Will a PF withdrawal for buying a house be tax-free after five years of service?", "full_content": "We understand that your Provident Fund (PF) account was maintained with an employer-managed private PF trust and is now being transferred to the Employees' Provident Fund Organization (EPFO). We further understand that you have completed more than five years of continuous service with your employer and have contributed to PF for more than five years.\n\nThe EPF Scheme 2026 permits partial withdrawal (subject to eligibility conditions and specified limits) of provident fund balance for housing purposes, which covers following:\n\niv) repayment of a home loan obtained for purchase, construction of a flat or house or for acquisition of a site; and\n\nv) additions, alterations, renovations or improvements to an existing house or flat:\n\nAforesaid is a partial withdrawal, not a full account closure. The remaining balance continues to earn interest.\n\nFurther, since you have completed more than 5 years of continuous service and contribution, such partial withdrawal from PF shall be fully exempt from tax.\n\nIt may be noted that regardless of period of service, where an employee contribution exceeded INR 2.5 lakh in a year, the interest earned on such excess portion of contribution, would have been taxable on a yearly basis (on accrual) at applicable slab rate for that year. In such case, such interest shall not again be separately taxable on withdrawal.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:32 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Corporate America hunts for \u2018generational\u2019 growth in AI, trading cards and the L.A. airport", "full_content": "There\u2019s been no shortage of trends deemed once-in-a-generation by executives on earnings calls.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 08:31 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Investors Brave Stock Market \u2018Fragility\u2019 as AI Trade Falters - Bloomberg.com", "full_content": "Investors Brave Stock Market \u2018Fragility\u2019 as AI Trade Falters Bloomberg.com Five Below Signals Reveal Mixed Outlook on Nov 21, 2026 cwibc.co.id Five Below Trading Signals Show Mixed Market Momentum Demokratis.co.id MoneyMasters Podcast: Volatility Surging! What Smart Traders are Doing NOW The Globe and Mail Trading Systems Reacting to (FIVE) Volatility Stock Traders Daily", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 08:30 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Taiwan Mulls Lowering Margin Requirement to Support Stock Market", "full_content": "Taiwan is considering lowering the margin requirement ratio for stock investors using borrowed funds as it tries to stem a selloff after the benchmark equity index\u2019s worst week in 35 years.\n\nThe Taiwan Stock Exchange said it held an emergency meeting with 10 local brokerages Sunday to discuss the potential move, which would cut the minimum margin maintenance ratio to 120% from the current 130%.\n\nThe exchange and brokers discussed potential scenarios that could arise if the ratio were lowered, and will assess any operational issues, according to the bourse. No decision was reached at the meeting, and any change would require approval from the Financial Supervisory Commission.\n\nTaiwan currently requires a minimum margin maintenance ratio of 130% for investors who buy stocks with borrowed funds, meaning the market value of their securities must remain at least 1.3 times the amount borrowed.\n\nThe island\u2019s market and finance authorities have utilized a growing arsenal of measures to combat the market rout, with little effect. The FSC tightened short-selling curbs again Saturday, banning such trades below the previous day\u2019s close across the market after two earlier rounds of restrictions failed to stop the slide.\n\nThe latest curbs cover both margin short sales and borrowed shares. Authorities also raised the minimum margin requirement for short sales to 150% from 130%, and temporarily suspended the acceptance of applications from securities firms to list new put warrants.\n\nElsewhere, China announced Sunday that it will cut the minimum margin requirement for leveraged investors to 80% from 100%, starting on Nov. 30. Earlier this month, South Korea waived a rule requiring brokerages to maintain collateral worth at least 140% of their margin loans to prevent forced selling from worsening stock-market volatility.\n\nThis article was generated from an automated news agency feed without modifications to text.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 08:21 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Senior citizens can earn 8.5% on 5-year FDs: These small finance banks offer the highest rates", "full_content": "Senior citizens looking to earn a steady income from their savings can still find fixed deposit (FD) interest rates of up to 8.5% for a five-year investment period at select small finance banks. These rates are higher than those offered by many traditional banks, although depositors should weigh the returns against the risks before committing their money.\n\nFor individuals aged 60 years and above, fixed deposits remain a popular option because they offer predictable returns and allow savings to grow over a specified period. Several small finance banks are offering competitive rates on five-year FDs for deposits of up to \u20b9 3 crore.\n\nSuryoday Small Finance Bank is among the banks offering the highest returns, with a five-year FD interest rate of 8.5% for senior citizens, according to the rates provided.\n\nJana Small Finance Bank is offering 8% on deposits with the same tenure. Other small finance banks are offering rates ranging from 6.25% to 7.7%.\n\nHigher interest rates can make small finance bank FDs attractive, but senior citizens should also consider the safety of their deposits.\n\nThe Deposit Insurance and Credit Guarantee Corporation (DICGC) insures bank deposits of up to \u20b9 5 lakh per depositor per bank. This coverage includes both the principal and interest and applies across savings accounts, fixed deposits and other eligible deposits held with the same bank.\n\nFinancial experts generally advise depositors to understand this insurance limit before placing large sums in small finance bank FDs. Keeping deposits within the insured limit can help reduce exposure if a bank faces financial difficulties.\n\nInterest earned on fixed deposits is taxable according to the depositor's applicable income tax slab. Banks are required to deduct tax at source (TDS) when interest earned on deposits exceeds \u20b9 1 lakh in a financial year for senior citizens.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:18 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold, silver, copper, aluminium, platinum to zinc: Why are metal prices crashing to multi-month lows? Key reasons", "full_content": "Sharmila Bhadoria Published 22 Nov 2026, 08:01 PM IST Prefer Livemint on Google Last week was a disappointing one for the metals segment, with a broad-based selloff across both base metals, be it base metals like aluminium, copper or zinc, or precious metals like gold, silver or platinum. Gold prices are currently hovering to their 14-month low levels, whereas silver has declined more than 60% from its all-time high level.\n\nConcerns around rising inflation, higher yields, stronger possibility of US Federal Reserve rate hike in December, and potential slowdown in artificial intelligence-related capital expenditure (capex) were among the key factors that contributed to metals\u2019 meltdown.\n\nGold prices are currently hovering to their multi-month low levels. Silver rates in India which surged to their all-time high levels in the first half of 2026 are currently hovering around their 14-month low level. Platinum is also trading close to their multi-month low levels.\n\nOn Multi Commodity Exchange ( MCX ), silver futures (with December expiry) closed marginally higher at \u20b9 1,48,900 per kilogram. Silver rates in the international market tumbled below $ 42 per ounce on Friday, reaching their lowest level since September 2025.\n\n\u201c25% of the silver mind is regained by nature whereas 99.9% gold is recycled. This creates a systematic demand on Silver unlike Gold. Also silver is used increasingly in EV, electronics and batteries. This is expected to put additional pressure on silver demand,\u201d explained Abhishek Banerjee, smallcase Manger, Founder of Lotusdew Wealth and Investment Advisors, while remaining bullish on the precious metal .\n\nMCX Gold Futures with December expiry closed 4.32% lower at \u20b9 1,21,949 per 10 gram on Friday.\n\nConcerns around sticky US inflation, Fed rate hike bets and a stronger US dollar weighed on gold prices.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 08:01 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Social Security benefits are rising in 2027, but other changes could affect what you keep", "full_content": "Whether you're working or retired, changes to Social Security in 2027 could affect your finances.\n\nStarting in January, millions of program beneficiaries will get a 3.6% increase to their benefits, thanks to the annual cost-of-living adjustment. But rising Medicare premiums could chip away at the increase \u2014 and as beneficiaries' incomes rise, that may affect the taxes they owe and their eligibility for a new senior deduction.\n\nMeanwhile, a higher taxable earnings cap means some workers will pay Social Security taxes on more income, reducing their paycheck.\n\nSocial Security's limit for payroll taxes is adjusted every year to reflect the average wage index.\n\nIn 2027, the taxable maximum will go up to $192,300 in earnings, up from $184,500 in 2026. Workers and employers each pay a 6.2% payroll tax on earnings up to that limit \u2014 or 12.4% for self-employed workers. Medicare taxes of 1.45% for both workers and employers are not subject to a limit.\n\nIn 2027, workers who earn $192,300 or more will pay $11,922.60 in total Social Security payroll taxes, according to the Social Security Administration, while self-employed workers will pay $23,845.20.\n\n\"If you're somebody whose income is over what the new threshold is going to be, this increase in the threshold results in a tax increase to you,\" said Tim Steffen, director of advanced planning at financial services firm Baird.\n\nThe 3.6% Social Security cost-of-living adjustment for 2027 is slated to increase retirement benefits by about $75 per month on average, according to the Social Security Administration.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 08:00 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Borrowing money to invest in stocks? Charlie Munger's warning explains why a market crash can put your savings at risk", "full_content": "Charlie Munger warned against borrowing money to invest in stocks. A 30% market decline can wipe out 45% of an investor's original capital when leverage is involved. Here's why margin calls, interest costs and forced selling can put wealth at risk.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 07:26 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "52% rally in six months! Mukul Agrawal portfolio\u2019s defence stock has 19% upside, says ICICI Direct - Do you own it?", "full_content": "PTC Industries shares rose 1.01% on Friday, while the stock gained about 23% in three months and 53% in six. ICICI Securities retained its Buy rating and \u20b929,000 target, implying 19% upside, citing strong EBITDA growth and long-term aerospace and defence opportunities.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 07:18 PM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sensex Rejig: Shriram Finance To Enter BSE Index From Dec. 21 As Trent Takes An Exit", "full_content": "The changes will become effective during the trading session on     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
