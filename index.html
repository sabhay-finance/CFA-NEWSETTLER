North Kathana, Allora, Dholasan, North Balol, and Unawa fields. In FY26, the company, along with its then step-down subsidiary, GNRL Oil & Gas Limited (GOGL), continued to undertake drilling and development activities across its oil and gas fields in the Cambay Basin.\n\nThe company progressed with its seven-well drilling campaign, including development and appraisal-cum-development drilling in the Kanawara field and drilling activities in the North Kathana field.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 11:37 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic expands Claude Startups program in bid to snag founders and fast-growing companies", "full_content": "Anthropic on Tuesday announced it's expanding its Claude Startups program, the artificial intelligence lab's latest push to deepen its ties to founders and fast-growing companies.\n\nClaude Startups initially launched in May, and thousands of companies are already participating, according to Anthropic. The company is opening up the program to more organizations, and members will get access to thousands of dollars' worth of Anthropic's Claude products and credits to help them build.\n\n\"Startups are often the first to push Claude to its limits,\" Beth Robertson, head of startups at Anthropic, told CNBC in a statement. \"When a new model ships, they're ready that same day to take on projects that used to seem out of reach. Claude Startups gives founders credits, tools and direct time with our team, so more companies can build this way from the start.\"\n\nThe vast majority of Anthropic's revenue comes from its business customers , and it has spent much of the last year trying to fend off rivals like OpenAI and Google , which both offer their own programs for startups.", "source": "CNBC World Economy", "pub_date_str": "06 Oct 2026, 11:36 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed plans bank-supervision overhaul to strengthen accountability, says Vice Chair Michelle Bowman", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Fed plans bank-supervision overhaul to strengthen accountability, says Vice Chair Michelle Bowman Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Fed plans bank-supervision overhaul to strengthen accountability, says Vice Chair Michelle Bowman SECTIONS Fed plans bank-supervision overhaul to strengthen accountability, says Vice Chair Michelle Bowman By ETMarkets.com Last Updated: Oct 06, 2026, 11:35:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Federal Reserve is set to realign its bank supervision system for increased accountability and efficient decision-making. Five new geographic supervisory regions will be established, each led by a regional leader. This new structure aims to address concerns raised in an independent review of Silicon Valley Bank\u2019s collapse. The Fed will also reconsider asset thresholds for regulatory requirements to better align with inflation and economic growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "06 Oct 2026, 11:35 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Economics", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: S&P 500 Hits New Record High - WSJ", "full_content": "Stock Market Today: S&P 500 Hits New Record High WSJ See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "06 Oct 2026, 11:30 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "British Airways plans record 106-seat business class on Airbus A380 jumbo jets", "full_content": "British Airways is building what it calls the \"world's largest\" business-class cabin and ripping out dozens of coach-class seats, the starkest example yet of how airlines are betting their future on high-spending travelers.\n\nThe changes are part of a massive overhaul of the British Airways fleet and its ground services, including lounges at its London Heathrow hub.\n\nAirlines have been spending years and hundreds of millions of dollars to expand their pricier seats, capitalizing on demand for roomier options and travelers' appetite for more luxurious trips.\n\nBritish Airways' joint-venture partner, American Airlines , last month debuted a 70-seat business class on its largest Boeing aircraft.\n\nThose more expensive seats command a premium. Even extra legroom on trips across the Atlantic can go for more than $200 per leg, with surcharges of more than $1,000 for premium economy seats after purchase.\n\nThe prices can be even higher if they're selected at booking. The top-end seats regularly run $5,000 and even well over $10,000 on lengthier flights.\n\nDeliveries of new aircraft have even been delayed because some of the new seats are so elaborate that carriers have been waiting for parts or federal certification.\n\nBritish Airways' overhaul of the cabins on its 12 A380s is also a bet on the jumbo jet, which many carriers have retired in recent years, opting for smaller, more fuel-efficient jets. Airbus delivered the last A380 to the plane's largest user, Emirates, in late 2021.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Cyber fraud: How customers can prevent their bank accounts from being used as mule accounts", "full_content": "Three people were recently arrested in Delhi for allegedly supplying and using mule bank accounts to facilitate cyber fraud . According to the allegations, the account holders provided access to their bank accounts to receive proceeds from cyber fraud in exchange for commissions.\n\nIn a separate case, police in Maharashtra's Thane district busted a cyberfraud syndicate allegedly involved in fraudulent transactions worth \u20b9 57.25 crore through several mule accounts.\n\nA mule account is a bank or financial account used by criminals to receive, hold or transfer illegally obtained money. Such accounts can be operated by the criminals themselves or by individuals who knowingly or unknowingly allow their accounts to be used for suspicious transactions.\n\nCustomers can become involved in such arrangements through fake job offers, easy-money schemes, fraudulent investment opportunities or low-interest loan offers. Unused or dormant bank accounts can also pose a risk if they are not regularly monitored.\n\nExperts advise customers to be particularly cautious about unsolicited job offers, schemes promising easy money and requests to \"rent\" or \"lend\" a bank account.\n\nShailendra Awasthi, Leader Technology at chartered accountancy firm Bhuta Shah & Co LLP, said customers should not treat their bank accounts as facilities that can be lent to others.\n\n\u201cThe biggest mistake customers make is treating their bank account as a facility that can be \u2018lent\u2019 to someone else. Your bank account should only be used for transactions that you personally understand and are responsible,\u201d Awasthi said.\n\nHe advised customers never to allow another person to use their account to receive or transfer money, even if they are promised a commission.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 11:14 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why deep-red Kansas has become an unexpected Senate battleground", "full_content": "In a state that hasn't elected a Democratic senator since 1932, Republican Sen. Roger Marshall suddenly finds himself in a competitive race with weeks to go until the 2026 midterm elections .\n\nStubborn inflation, blowback from White House trade policies, and a formidable Democratic challenger in megachurch pastor Adam Hamilton have combined to turn ruby-red Kansas into an unexpected Senate battleground.\n\nThe tightening contest has forced Marshall into a balancing act confronting a growing number of vulnerable Republicans: creating space from President Donald Trump on issues that pose risks at home without alienating his base.\n\n\"When a sitting Republican senator in Kansas starts running away from their leader in the White House, the five-alarm bell is ringing for the entire party,\" said Bob Beatty , a political scientist at Washburn University. \"Loyalty to Washington is becoming a liability when voters are feeling the squeeze at home.\"\n\nThe Cook Political Report with Amy Walter shifted the race from \"Likely Republican\" to \"Lean Republican\" on Sept. 23.\n\nA September Emerson College/Nexstar survey of 750 Kansas likely voters put Hamilton at 45% and Marshall at 43%, a dead heat within the poll's 3.6% margin of error. In the same poll, Trump's approval in Kansas stood at 40%, with 53% disapproving and nearly half of likely voters naming the economy their top issue.\n\nNational Republican groups have taken note. Outside groups are now pouring millions into Kansas to defend the seat that once sat safely outside the Senate battlefield. At stake is the GOP's Senate majority.\n\nMarshall has been a stalwart Trump ally for years. Though Trump carried Kansas by 16 points in 2024, the senator has recently shown a willingness to distance himself.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mid-cap and small-cap mutual funds have outperformed: Why should investors favour large-caps at this stage?", "full_content": "Mutual fund investors often spread their equity allocation across large-, mid-, and small-cap funds to balance growth and risk. However, recent mutual fund flows, with stronger inflows into mid- and small-cap categories and outflows from large-cap funds, also reflect changing investor preferences.\n\nIn the last one year, large-cap funds delivered a category-average return of -4.76%, compared with 2.87% for mid-cap funds and 8.02% for small-cap funds.\n\nAn October 2026 Netra report from DSP Mutual Fund points to a sharp divergence between large caps and the mid- and small-cap segments, raising an important question about why investors should review their equity fund allocations at this stage.\n\nDSP Mutual Fund says the market is unusually polarised, with small and mid-caps trading at elevated valuations while several large-cap segments have undergone a significant correction. Over the past year, small and mid-caps have outperformed the Sensex by 21.5% and 14.1%, respectively.\n\nThe report noted that \u201cLarge caps have corrected enough for valuations to be near fair/cheap zones. SMIDs (small-cap and mid-caps) have seen less valuation compression and still need stronger earnings delivery to justify broad exposure. Large-caps may offer more opportunities at this time.\u201d\n\nFor mutual fund investors, this means large-cap funds, which invest predominantly in established companies, could currently offer a relatively better margin of safety than mid- and small-caps. The report adds, \u201cBarring the COVID decline, large caps haven\u2019t been this attractive in over a decade.\u201d\n\nThe report also noted that \u201cduring each downcycle, SMIDs lose almost all the alpha generated during the upcycle.\u201d Currently, SMIDs have a large alpha over large-caps, suggesting that investors may be better served by increasing their focus on large-cap funds.\n\nThe report\u2019s valuation data also offers an important comparison for mutual fund investors.", "source": "LiveMint Money", "pub_date_str": "06 Oct 2026, 10:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'SaaSpocalypse' Fades: Wall Street's Software Stocks Hit Fresh 2026 Highs On Easing AI Disruption Fears", "full_content": "US software stocks have climbed to fresh 2026 highs as stronger earnings expectations and fading concerns over AI-led disruption revive investor confidence in the sector.", "source": "NDTV Profit", "pub_date_str": "06 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Salesforce shares sit at the epicenter of AI confusion. Here's how to trade it", "full_content": "If ever there was a stock that personified the promise and peril of the AI trade, it's Salesforce .\n\nSalesforce shares have been in a tug of war throughout 2026, and it may present an opportunity for options traders. The stock bottomed in late June, down more than 40% from the start of the year on fears that AI agents would make traditional software subscriptions obsolete.\n\nFear collided with reality when the company released Q2 earnings in August that blew away Street expectations and put to rest, at least temporarily, that the so-called SasSpocalypse was upon us. The stock responded by jumping from $205 to a share price of $252 by the end of the following session, a rally of over 22% and the second biggest single day gain in the company's history.\n\nNow, just one month later, the stock has faded much of that post-earnings momentum and sits near a share price of $230, significantly above yearly lows but still down nearly 10% YTD.\n\nSalesforce, YTD Like many other legacy SaaS names, Salesforce has reported strong financials, but many investors remain unconvinced the business can grow through an AI driven overhaul of enterprise software. That unresolved debate may be part of why the stock has stayed stuck between its highs and lows rather than settling into a clear trend. With the next earnings announcement estimated in December, this gives options traders several weeks to potentially play this choppy range before the next major catalyst.\n\nImplied volatility on Salesforce currently sits around 39%, somewhat elevated relative to its annual range but fairly in line with levels for the past month. For context, that volatility spiked into the mid 50s back in August around the earnings reaction. Current volatility levels in Salesforce are more consistent with sustained, moderately elevated investor uncertainty as opposed to the market gearing up for another violent move.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 10:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "High diesel prices may put 'another squeeze' on the consumer, economist says", "full_content": "Consumers are feeling the pinch of higher gasoline prices. But another type of fuel \u2014 diesel \u2014 also threatens to push up prices at the store in a less visible way, economists said.\n\nDiesel prices have soared 68% since the start of the Iran war, a larger increase than for gasoline prices, according to data from AAA.\n\nThat dynamic threatens to push up costs for consumers across store shelves, from food to physical goods, at a time when inflation is already persistently high , economists said.\n\n\"It's going to be another squeeze on the consumer,\" said Michael Reid, head of U.S. economics at the Royal Bank of Canada. \"And it's really the lower- and middle-income consumers who feel it disproportionately.\"\n\nAverage diesel prices rose to $6.32 per gallon on Tuesday from $3.76 per gallon on Feb. 27, the day before the U.S. and Israel bombed Iran, according to AAA.\n\nSeptember marked the first time national average diesel prices ever breached $6 a gallon.\n\nThe Group of Seven nations \u2014 France, Canada, Germany, Italy, Japan, the United Kingdom and the United States \u2014 on Friday agreed to a \"substantial release\" of diesel stocks to combat rising fuel prices. The Trump administration had been pressuring Europe to release diesel stocks as an alternative to the U.S. imposing an export ban to lower prices.\n\nPresident Donald Trump signed an executive order Monday temporarily allowing the use of cheaper red-dyed diesel, typically reserved for farm operations, more broadly in an attempt to bring down record-high fuel costs.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 10:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Wall Street says Elon Musk's Terafab talks with TSMC could spell bad news for Intel", "full_content": "Intellectual property licensing or a process-technology agreement are options in play, analysts say.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 10:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Zerodha founders Kamath brothers bet on Viceroy Hotels with 6.72% stake after insolvency-led crisis: What changed?", "full_content": "Zerodha founders Nithin Kamath and Nikhil Kamath have acquired a 6.72% stake in Viceroy Hotels during the September quarter, and the acquisition comes at a time when the stock has attempted a strong recovery after remaining under prolonged losses.\n\nThe brothers made the investment through two entities \u2014 Kamath Associates and Nksquared, The Economic Tim es reported, citing the company\u2019s latest shareholding disclosures. As per the latest shareholding data, promoters continued to hold the majority, 74%, of ownership in the company, while the remaining 25.6% was held by general shareholders.\n\nThe investment by the Zerodha founders also indicates confidence in Viceroy Hotels\u2019 growth prospects following a change in management in 2023.\n\nViceroy Hotels had earlier entered the Corporate Insolvency Resolution Process after running up heavy debt under its previous promoter. Creditors were owed more than \u20b9 1,150 crore, and the company at one point faced the possibility of liquidation. Trading in its shares was also suspended, the report said.\n\nThe company\u2019s fortunes began to change in October 2023, when the National Company Law Appellate Tribunal approved a resolution plan submitted by Anirudh Agro Farms Limited. Fresh funds were later brought into the company through its subsidiary, Loko Hospitality.\n\nAfter the resolution plan was implemented, shares of Viceroy Hotels resumed trading on the NSE and BSE in April 2024.\n\nFY26 marked Viceroy\u2019s shift from post-CIRP stabilization to strategic expansion after taking charge in October 2023 and prepaying its resolution dues early in FY25.\n\nIt delivered a resilient performance, with revenue at \u20b9 149 crore, an increase of 6.3% YoY, while EBITDA improved by 20.6% YoY to \u20b9 44.6 crore and the operating margin expanded by 353 basis points to 30.62%.", "source": "LiveMint Markets", "pub_date_str": "06 Oct 2026, 10:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'Magnificent Seven' profit lag: How the rest of the stock market may outpace tech giants this earnings season", "full_content": "The upcoming earnings season could mean the rally broadens out again after the recent weakness in breadth.", "source": "CNBC Top News", "pub_date_str": "06 Oct 2026, 10:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Vaishali Parelh's best stocks to buy: IndiGo, IndusInd Bank, GPIL | Target price, stoploss, Nifty, Bank Nifty prediction", "full_content": "Stock market prediction: Vaishali Parekh belie     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
