 500 futures and Nasdaq-100 futures were each up 0.1%.\n\nIn Asia, markets were mixed in early Wednesday trade. Japan's Nikkei 225 lost 0.17%, while the Topix added 0.55%. South Korea's Kospi was little changed, while the small-cap Kosdaq declined 0.69%. Australia's S&P/ASX 200 climbed 0.24%.\n\nFutures markets were pricing in a quarter-point hike for Wednesday with 92% odds, according to the CME FedWatch tool . Odds of an additional quarter-point hike were 45% for the Fed's October meeting and 30% for the Fed's December meeting. The current target rate range is 3.5% to 3.75%.\n\nThe central bank's decision on Wednesday comes amid pressure from the White House to leave rates where they are. Council of Economic Advisers chairman Christopher Phelan told CNBC on Tuesday that it would be a \"mistake\" for the Fed to raise rates.\n\n\"[It] doesn't make sense to raise rates now in my view,\" Phelan said, adding that \"inflation data has been in the right direction.\"\n\nThe 12-month rate on the consumer price index came in at 3.4% in August , marking a cooling from the recent high of 4.2% in May . On a month-over-month basis, CPI rose 0.4% last month, in line with expectations, though core inflation, which removes the more volatile categories of food and energy, rose 0.3%, which was more than expected.\n\nCrude oil prices rose Tuesday as Saudi Arabia reportedly cancelled some shipments following drone attacks on its key export pipeline. U.S. West Texas Intermediate increased 4.4% to $105.83 per barrel, its highest closing price since May 19. Brent crude futures rose 2.9% to settle at $108.75.", "source": "CNBC Top News", "pub_date_str": "16 Sep 2026, 06:56 AM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks to buy today: Colgate to Rossell Techsys - int Comment Synopsis On Tuesday, information technology stocks saw a notable recovery as investor confidence returned, easing worries surrounding artificial intelligence disruptions. The Nifty IT index performed robustly, surpassing other sector indices. Analysts suggest that AI holds promising prospects for Indian IT firms, yet technical experts express caution regarding the sector's short-term forecasts.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "16 Sep 2026, 06:02 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Never say never: Jefferies keeps wealth, asset management entry open", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nYield differentials and currency risk may be flying under the radar for most investors, but country head of Jefferies India, Aashish Agarwal, considers them a critical blind spot for the market.\n\nNarrowing yield spreads between the US and India put direct pressure on debt flows and create indirect currency risks for equities. To curb sharp rupee depreciation and narrowing yield differentials, a domestic rate hike could eventually be on the table.\n\nHowever, Agarwal emphasizes that foreign portfolio investors (FPIs) are primarily watching currency stability. \u201cCurrency stability\u2014not yield spread alone\u2014is the key trigger for FPIs . If foreign currency reserves keep the rupee steady, outflows remain manageable.\u201d\n\nLooking beyond macro risks, Jefferies is keeping its options open on home turf. While Agarwal stressed that the firm remains squarely focused on its core strengths for now, he didn't rule out venturing into wealth or asset management down the road, noting that \u201cif the right opportunity arises, you never say never\u201d. Edited excerpts:\n\nThe world is definitely a lot more uncertain than it was a few months ago. We are seeing unprecedented volatility across demand, energy prices, and global trade outlooks, and this volatility may stay for a while. However, as a house, we genuinely believe India has always been a great water mark market. Real money is made by staying strong through uncertainty. We believe there are enough companies with very robust earnings outlooks despite current volatility, and investors should focus on finding stocks with strong leadership and visible earnings.\n\nEvery large-cap was once a small-cap, with that transition driven by sector performance and company leadership or execution.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Raja Venkatraman recommends two stocks for 16 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Benchmark Sensex tumbled 778 points and the broader Nifty fell to a five-month low on Tuesday, as surging oil prices, geopolitical tensions and weak global markets weighed on investor sentiment.\n\nThe 30-share Sensex fell 777.94 points, or 1.04%, to close at 74,003.82, its lowest level in three months, dragged by losses in blue-chip banking, auto and oil & gas stocks. The 50-share NSE Nifty fell 279.50 points, or 1.19%, to settle at 23,118.60, its lowest close since 6 April.\n\nAmong the 30 Sensex stocks, Bharat Electronics tumbled 6%. InterGlobe Aviation, Titan , Bajaj Finserv, Adani Ports, Mahindra & Mahindra and State Bank of India were also among the laggards.\n\nBrent crude , the global oil benchmark, jumped 1.89% to $107.7 a barrel.\n\nAEGISVOPAK [ Cmp \u20b9 302 - Buy above \u20b9 302, stop loss \u20b9 288, target price \u20b9 335 (Multiday)]\n\nRAINBOW [Cmp \u20b9 1453.70 - Buy above \u20b9 1455, stop loss \u20b9 1390, target price \u20b9 1595 (Multiday)]\n\nOn 15 September, Indian markets came under pressure as the rupee weakened to its lowest level in over a month, slipping 0.4% to 95.9550 against the dollar. Surging crude prices and expectations of a US rate hike weighed on sentiment, though likely RBI intervention capped losses. Brent crude jumped over 2% to $108.20 a barrel, stoking concerns of a wider trade deficit and inflationary risks.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 06:01 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSE IPO looks cheap at \u20b91,785. Here\u2019s the catch", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nThe much-awaited initial public offering (IPO) of the National Stock Exchange Ltd (NSE) opens this week with a valuation paradox: at \u20b9 1,700-1,785 a share, NSE is being offered at a roughly 30% discount to rival BSE Ltd on FY27 earnings estimates, despite being nearly three times its size. The apparent bargain, however, comes as NSE\u2019s dominant derivatives business faces a weaker growth outlook\u2014and investors have little room for an earnings miss.\n\nThe upper end of the price band is about 6% below NSE\u2019s latest unlisted market price of around \u20b9 1,900, fuelling investor interest ahead of the \u20b9 22,569 crore IPO, which opens on 17 September. Grey market activity suggests NSE could list at an 11-12% premium to its offer price.\n\nBut the valuation gap may not be the opportunity it first appears to be.\n\n\u201c(The) gap is not a genuine headroom (for an upside),\u201d cautions Kush Gupta, director at SKG Investments and Advisory. BSE delivered stronger earnings momentum through fiscal year 2026 (FY26) as NSE\u2019s growth slowed, he said.\n\nThe discount could narrow if BSE\u2019s low-base advantage fades or NSE restores investor confidence by sustaining its FY27 earnings recovery, Gupta added.\n\nNSE reported 13% year-on-year growth in operating revenue and 7% growth in profit in the June quarter of FY27 (Q1FY27), helped by a 16% rise in equity options premium average daily turnover, according to its red herring prospectus (RHP). Higher trading volumes and better price realization drove a 16% increase in options transaction revenue, which accounts for more than 60% of operating revenue.\n\nThat marked a recovery after a weaker FY26, when operating revenue contracted 3% and premium average daily turnover fell 8% as regulatory measures to curb speculative options trading weighed on activity.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tokenized bonds pass the launch test. The real challenge starts now", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nTokenized bond issuances by Rural Electrification Corp., Larsen & Toubro and IIFL Finance mark an important technological milestone for India\u2019s debt market, but market participants believe the transactions remain largely ceremonial until a functioning secondary market, interoperable infrastructure and financing mechanism are put in place.\n\nLast week, REC raised \u20b9 500 crore through its first-ever tokenized corporate bonds maturing on 31 May, 2028 at a coupon of 7.30%. This was followed by L&T raising \u20b9 500 crore through a similar mechanism, with bonds maturing in three years at a coupon of 7.40% and IIFL Finance borrowing \u20b9 25 crore.\n\nTokenized bonds are essentially bonds whose ownership and transactions are recorded digitally using distributed ledger technology (DLT), which also underpins blockchains powering cryptocurrency. Instead of relying entirely on the conventional securities and payment infrastructure, the pilot links the bond to a digital securities wallet and uses RBI\u2019s central bank digital currency ( CBDC ) for payment, allowing the securities and money to move together in near real time.\n\n\u201cThe first stage has proved that the technology works. The next stage has to prove that the market works. The next milestone for Demat 2.0 is not the fourth tokenized bond; it is the secondary market trade,\u201d said Venkatkrishnan Srinivasan, founder of Rockfort Fincap.\n\nMarket participants said the current structure introduces uncertainty about the availability of funds for investors. \u201cThese are ceremonial trades which have taken place.", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock recommendations for 16 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Indian equities fell sharply on Tuesday, giving up early gains as a surge in crude oil prices and a spike in US bond yields triggered broad-based selling. Nifty 50 dropped 279.50 points, or 1.19%, to close at 23,118.60, while Sensex slumped 777.94 points, or 1.04%, to settle at 74,003.82.\n\nBrent crude climbed toward $109 a barrel amid renewed West Asia supply concerns. At the same time, the US 10-year Treasury yield touched 5%, pressuring risk sentiment, and the rupee slipped to a seven-week low. Realty, capital goods, auto , metals, and banking were the biggest laggards, with most sectors down 2% or more. IT bucked the trend to close firmly higher, as HCL Tech, TCS, Infosys, and Tech Mahindra rallied on a rotation into large-cap technology names, even as select AI and data-centre-linked stocks fell sharply on global AI-slowdown concerns.\n\nMarket breadth was extremely weak, with 754 stocks advancing, 2,824 stocks declining, and 109 remaining unchanged, underscoring broad-based selling pressure beneath the headline fall. With crude prices and global bond yields firmly in focus, volatility is likely to stay elevated in the sessions ahead.\n\nIndian equities ended sharply lower on 15 September, with Nifty 50 falling 279.50 points (1.19%) to 23,118.60, near the day\u2019s low after opening at 23,576.15 and touching 23,592.85, while Sensex declined 777.94 points (1.04%) to 74,003.82.\n\nMarket breadth was particularly weak, with 754 stocks advancing, 2,824 stocks declining, and 109 remaining unchanged, translating into an advance-decline ratio of roughly 0.27. This highlighs broad-based selling beyond the benchmark indices.\n\nOn the sectoral front, Realty (-4.04%) led the decline, followed by Metals (-2.54%), Consumer Durables (-2.41%), PSU Banks (-2.29%), and Autos (-2.01%).", "source": "LiveMint Markets", "pub_date_str": "16 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today: All You Need To Know Going Into Trade On Sept 16", "full_content": "Stocks in the news, big brokerage calls of the day, complete trade setup and much more!", "source": "NDTV Profit", "pub_date_str": "16 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks in news: Yes Bank, Vedanta, Groww, BHEL, Bharat Forge and NBCC", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Stocks in news: Yes Bank, Vedanta, Groww, BHEL, Bharat Forge and NBCC The Economic Times daily newspaper is available online now. Read Today's Paper Stocks in news: Yes Bank, Vedanta, Groww, BHEL, Bharat Forge and NBCC SECTIONS Stocks in news: Yes Bank, Vedanta, Groww, BHEL, Bharat Forge and NBCC By Kumar Gaurav , ETMarkets.com Last Updated: Sep 16, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equity markets closed lower on Tuesday, extending their monthly decline. Nifty50 reached a key support level, indicating a potential technical bounce. Several companies, including Yes Bank and Vedanta, are expected to be in focus. Bharat Forge and BHEL announced significant collaborations and joint ventures. Other firms reported regulatory updates and investment plans for future growth.\n\nListen Loading... \u00d7     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
