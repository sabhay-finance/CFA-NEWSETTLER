    const allData = {"general": [{"title": "10-year Treasury yield climbs to a 24-year high amid relentless global bond sell-off", "full_content": "U.S. Treasury yields hit their highest level in more than two decades on Thursday as a global bond sell-off deepened. A September manufacturing survey in the U.S. showed a sharp gain in prices.\n\nThe 10-year Treasury yield breached a level last seen in April 2002, rising more than 3 basis points to 5.327%. The 10-year is a key benchmark for rates on mortgage and auto loans and credit card debt. The yield on the 30-year Treasury bond climbed almost 4 basis points, to 5.678%, also its highest in 24 years.\n\nYields and prices move inversely. One basis point equals 0.01%.\n\nThe U.S. manufacturing sector continued to expand in September while showing substantial pressure from higher prices, according to the Institute for Supply Management.\n\nWithin the monthly ISM manufacturing index survey , the prices index surged to 77.9, up 6.8 points, while backlogs jumped 4.6 points to 56.4.\n\nGovernment borrowing costs around the world continued their relentless march upward on Thursday, continuing a months-long trend as investors voted with their feet over a lack of political will to tackle fiscal deficits, while inflation remains stubbornly above target and leading central banks move to push interest rates higher.\n\nMajor economies face \"persistently large deficits and rising interest expenses \u2014 challenges long associated with debt-distressed emerging market sovereigns,\" the Institute of International Finance said last week .\n\nJapan's 10-year yield was last trading at 3.126%, the highest level since the mid-1990s. Japan's debt has come under pressure from a weaker yen and rate hikes by the Bank of Japan .", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 08:09 PM IST", "pub_date_relative": "just now"}, {"title": "Need a personal loan? Report shows digital lenders are outpacing legacy banks; younger borrowers prefer fintech apps", "full_content": "Digital personal loans are becoming a significant part of how Indians access unsecured credit, particularly among younger borrowers and those in smaller cities.\n\nThe report titled \u201cDigital Personal Loans\u201d was released by the Fintech Association for Consumer Empowerment (FACE), an RBI-recognised Self-Regulatory Organisation for the FinTech sector (SRO-FT).\n\nIt uses data from credit bureau CRIF High Mark and tracks personal loans sanctioned by 110+ digital NBFCs from April 2022 to June 2026. It also compares digital NBFCs with banks and other NBFCs to show their position in India's overall personal-loan market.\n\nIn the first quarter of FY27 (April-June 2026), digital NBFCs sanctioned 3.4 crore personal loans worth \u20b9 64,656 crore, accounting for 70% of all personal-loan sanction volumes across digital NBFCs, other NBFCs and banks. The report groups digital NBFCs as lenders that primarily offer personal loans through digital lending apps.\n\nThe data suggests that digital lending is expanding access to smaller-ticket personal loans, while banks continue to dominate higher-value borrowing.\n\nDuring Q1 FY26-27, lenders sanctioned about 4.9 crore personal loans worth \u20b9 2.99 lakh crore.\n\nDigital NBFCs sanctioned 3.4 crore loans amounting to \u20b9 64,656 crore, with an average ticket size of \u20b9 18,802, about 15% higher than in FY 25-26. Digital loans accounted for 22% of total sanction value and 70% of total sanction volume. Volumes continue to grow, though at a steadier pace. Sanction volume rose 14% over Q1 FY 25-26 and 2% over the previous quarter.\n\nThe average ticket size has increased, but it remains much lower than the \u20b9 70,025 average for other NBFCs and \u20b9 4.52 lakh for banks . This indicates that digital personal loans continue to cater largely to smaller borrowing requirements.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 08:06 PM IST", "pub_date_relative": "4m ago"}, {"title": "Judge dismisses Reflecting Pool case against Olympian, bars DOJ from refiling charges", "full_content": "A Washington judge on Thursday dismissed the criminal vandalism case against former U.S. Olympic canoeist David Hearn with prejudice, barring prosecutors from refiling the same charges in the future.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 08:05 PM IST", "pub_date_relative": "4m ago"}, {"title": "Sgi stock hits 52-week low at 60.35 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:04 PM IST", "pub_date_relative": "5m ago"}, {"title": "McKesson extends CVS deal; shares rise", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:04 PM IST", "pub_date_relative": "5m ago"}, {"title": "Varo Energy CEO says defence spending boosts refining demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:04 PM IST", "pub_date_relative": "5m ago"}, {"title": "HDFC Bank ADRs jump over 5% after Anup Bagchi appointed as MD & CEO for three years", "full_content": "HDFC Bank \u2019s American Depositary Receipts (ADRs) jumped 5.4% in Thursday\u2019s intraday trade to reach a day\u2019s high of $23.55 on the NYSE after the country\u2019s largest private sector lender appointed Anup Bagchi as Managing Director and Chief Executive Officer for three years, effective October 27, 2026.\n\nIn its post-market regulatory filing on Thursday, the bank said the Reserve Bank of India had approved the appointment of Bagchi as Managing Director and Chief Executive Officer for three years.\n\nBagchi, currently serving as the MD and CEO of ICICI Prudential Life Insurance, will succeed Sashidhar Jagdishan.\n\nConsequently, the Board of Directors of the Bank, based on the recommendation of the Governance, Nomination, and Remuneration Committee, at its meeting held on October 1, 2026, approved the appointment of Bagchi as an Additional Director of the Bank with effect from October 2, 2026, the bank said in the filing.\n\nThe board also approved the appointment of Anup Bagchi as the MD & CEO of the Bank on such terms and conditions, including remuneration, as approved by the RBI, for a period of three years with effect from October 27, 2026, subject to approval of the shareholders as per the provisions of the Companies Act, 2013, HDFC Bank said.\n\nThe appointment is also the second instance in recent years of an insurance executive being appointed to lead a bank. In 2019, Amitabh Chaudhry joined Axis Bank as chief executive after serving as the CEO of HDFC Life Insurance Company.\n\nBagchi, an experienced banking and financial services executive, currently serves as managing director and CEO of ICICI Prudential Life Insurance Company. During his tenure, the company reportedly crossed the \u20b9 10,000 crore mark in Annualized Premium Equivalent (APE) for the first time in FY2025.\n\nAPE rose 15% year over year to \u20b9 10,407 crore, while profit after tax climbed nearly 40% to \u20b9 1,189 crore.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 08:04 PM IST", "pub_date_relative": "6m ago"}, {"title": "SEC proposes investor exam to expand private market access \u2014 here's how it could work", "full_content": "he U.S. Securities and Exchange Commission is considering new ways for individual investors to gain access to some private market investments \u2014 including passing an exam .\n\nThe three-member commission said Wednesday it is considering expanding the qualifiers for so-called accredited investor status. Certain investments \u2014 such as private equity funds, venture capital and hedge funds, among others \u2014 commonly require investors to be accredited to participate.\n\nCurrently, to qualify as accredited , investors generally need an annual earned income of $200,000 for individuals, or $300,000 for married couples in each of the prior two years, with a reasonable expectation of the same income in the current year. Individuals or couples can also qualify with a total net worth of at least $1 million, not including the value of their primary residence.\n\n\"Accredited investor access to private offerings should not be solely to individuals satisfying financial thresholds,\" Paul Atkins, chairman of the SEC, said at an open meeting Wednesday.\n\nCurrent SEC rules also allow accredited investor status for individuals who hold a Series 7, 65 or 82 securities license in good standing, among other qualifiers.\n\nSEC officials said in the meeting that FINRA, a self-regulatory organization that oversees U.S. broker-dealers, would develop the new exam. Anyone age 18 or older would be eligible to take the test.\n\nAccording to details shared in the meeting, the test would be modeled on an existing FINRA assessment for securities industry professionals: a roughly 75-question multiple-choice exam with a two-hour time limit. That existing exam costs about $100, and officials said an accredited investor test could have a similar price tag. It could be administered at testing sites across the country.\n\nHere's a look at more stories on how to manage, grow and protect your money for the years ahead.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 08:03 PM IST", "pub_date_relative": "7m ago"}, {"title": "Worried your bank account is empty after cyber fraud? Here\u2019s what to do immediately", "full_content": "If you have ever received a transactional message from your bank saying that a massive amount has been deducted, but you did not make the transaction, you might have been scammed. While your first instinct may be to panic, call the person who just contacted you, keep checking your account, or try to figure out how it all happened, people often forget that in times like these, the first few minutes are crucial.\n\nBut for someone who has just discovered that their hard-earned money has been debited from their account, the bigger question is: what should they do next? Should they call the bank first and get their account blocked, call 1930, or file a police complaint?\n\nAccording to a 2025 Press Information Bureau (PIB) report, the surge in cybersecurity incidents from 10.29 lakh in 2022 to 22.68 lakh in 2024 reflects the growing scale and complexity of digital threats in India. At the same time, the financial toll is becoming more pronounced, with cyber frauds amounting to \u20b9 36.45 lakh reported on the National Cyber Crime Reporting Portal (NCRP).\n\nAccording to Gaurav Gupta, Group Head - Financial Crime Intelligence, Axis Bank, if someone suspects they have been a victim of cyber fraud, they should act immediately. They should report the incident to their bank through official customer service channels, block compromised cards or accounts, including relevant digital channels , and change passwords or PINs linked to their banking services.\n\nCustomers should also report the fraud on the National Cyber Crime Helpline (1930) or the cybercrime reporting portal.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 08:02 PM IST", "pub_date_relative": "7m ago"}, {"title": "Natural gas storage surpasses forecast, impacting market dynamics", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:02 PM IST", "pub_date_relative": "8m ago"}, {"title": "Exclusive-US tells France and Germany to release diesel stocks or face US export ban, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:01 PM IST", "pub_date_relative": "8m ago"}, {"title": "Rex American Resources COB Stuart Rose sells $2.13m in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:01 PM IST", "pub_date_relative": "9m ago"}, {"title": "JPMorgan dealmaker Hernan Cristerna to retire at end of 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:01 PM IST", "pub_date_relative": "9m ago"}, {"title": "RBC Capital raises Skyworks Solutions price target on deal approval", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "BMO reiterates PBF Energy stock rating on strong Q3 outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "RBC Capital reiterates ConAgra stock rating on Q1 results", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:00 PM IST", "pub_date_relative": "9m ago"}, {"title": "\u2018I want to make her proud\u2019: My mother, a divorc\u00e9e, died and I\u2019m her executor. Do I need to file for probate?", "full_content": "\u201cThe only debts were utility and credit-card bills, which we will pay off.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 08:00 PM IST", "pub_date_relative": "10m ago"}, {"title": "India's motor car exports witnessing healthy growth in EFTA market: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India's motor car exports witnessing healthy growth in EFTA market: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India's motor car exports witnessing healthy growth in EFTA market: Piyush Goyal SECTIONS India's motor car exports witnessing healthy growth in EFTA market: Piyush Goyal PTI Last Updated: Oct 01, 2026, 07:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's exports of motor cars and heavy waters have seen significant growth since the trade agreement implementation. The trade and economic partnership agreement with EFTA has created market access for the majority of India's exports. The EFTA countries have committed to invest USD 100 billion in India over 15 years.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "01 Oct 2026, 07:58 PM IST", "pub_date_relative": "11m ago"}, {"title": "Sebi revamps Document Number Verification System, adds subject matter as mandatory field", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi revamps Document Number Verification System, adds subject matter as mandatory field The Economic Times daily newspaper is available online now. Read Today's Paper Sebi revamps Document Number Verification System, adds subject matter as mandatory field SECTIONS Sebi revamps Document Number Verification System, adds subject matter as mandatory field By Kumar Gaurav , ETMarkets.com Last Updated: Oct 01, 2026, 07:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has revamped its Document Number Verification System, making a letter\u2019s subject matter mandatory for authentication. The upgraded system aligns with Sebi\u2019s E-Office format and lets recipients verify physical letters, notices and show-cause notices issued by the regulator.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:58 PM IST", "pub_date_relative": "12m ago"}, {"title": "Kalshi, Polymarket trading volumes on some products raise questions amid massive growth", "full_content": "Trading volumes for certain products on prediction market platforms Kalshi and Polymarket are raising questions from some industry observers, who fear the numbers may be inflated.\n\nOn Polymarket, observers have flagged a quirk on the company's international exchange, which is not overseen by U.S. regulators: Markets that feature multiple contracts will see greater activity on those with lower odds of occurring versus those with higher probabilities. It's seen on markets related to elections, sports and central bank decisions.\n\nMeanwhile, a user on X on Sept. 20 flagged a strange pattern on Kalshi's perpetual futures market for the ether cryptocurrency. Trades of around $5,500 made up a large share of transactions on the contracts, and that 24-hour trading volume was abnormally high compared with actual resting liquidity. A CNBC analysis found that on Sept. 20, nearly half of the dollar volume traded on Kalshi's ether perpetuals came from trades sized between $5,495 and $5,505.\n\nBoth developments create concerns among some observers that the companies are overseeing inflated volumes or, at worst, are experiencing wash trading, in which traders collude to buy and sell an asset to create a false sense of economic activity.\n\nBoth Kalshi and Polymarket deny wash trading occurs on any of their products. They also deny that the respective patterns represent inorganic activity.\n\nA designated contract market, the type of exchange prediction markets are, \"has a duty to protect market integrity by monitoring market conditions, price movements, and volumes in real time for abnormalities,\" said Tamika Bent, a partner at K&L Gates. While she said the patterns described here don't alone establish misconduct by an exchange, she added observers would \"expect DCMs to be surveilling unusual volume and looking into any signs of market disruption.\"\n\nPolymarket is currently raising at a valuation north of $20 billion in the private market after the launch of its U.S.", "source": "CNBC Finance", "pub_date_str": "01 Oct 2026, 07:54 PM IST", "pub_date_relative": "15m ago"}, {"title": "October by the numbers: A typically strong month with a scary reputation", "full_content": "Some of the biggest monthly declines have happened in October.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 07:54 PM IST", "pub_date_relative": "15m ago"}, {"title": "UK pound falls to three-month lows as investors fret over rates, oil", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a UK pound falls to three-month lows as investors fret over rates, oil Powered By The Economic Times daily newspaper is available online now. Read Today's Paper UK pound falls to three-month lows as investors fret over rates, oil SECTIONS UK pound falls to three-month lows as investors fret over rates, oil Reuters Last Updated: Oct 01, 2026, 07:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The pound has hit a three-month low against the dollar, triggered by mounting economic apprehensions. Investors are anxious about the effects of soaring oil prices and persistent inflation on market stability. The FTSE 100 index has notably declined, reflecting burdens in government borrowing. Prime Minister Andy Burnham and Chancellor John Healey confront escalating gilt yields.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:53 PM IST", "pub_date_relative": "16m ago"}, {"title": "UK 30-year gilt yields top 6% for the first time since 1998", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a UK 30-year gilt yields top 6% for the first time since 1998 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper UK 30-year gilt yields top 6% for the first time since 1998 SECTIONS UK 30-year gilt yields top 6% for the first time since 1998 Reuters Last Updated: Oct 01, 2026, 07:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis British 30-year government bond yields have surged to their highest level since early 1998. This surge follows a significant increase in U.S. Treasury yields despite steadied oil prices. Short-dated gilt yields also rose sharply, reflecting concerns about the UK's fiscal vulnerabilities. Investors anticipate possible interest rate hikes by the Central Bank in November or December. The financial market is reacting to ongoing economic pressures like rising food and energy prices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:52 PM IST", "pub_date_relative": "18m ago"}, {"title": "Pulse of the Street: Eight-week slide puts RBI, earnings in focus", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nCheaper oil failed to bring much comfort for Indian equities as the markets slid for the eighth consecutive week. The Nifty 50 recorded its longest weekly losing streak since 2001 in a holiday-truncated week, with markets closed on Friday for Gandhi Jayanti. On Thursday, it fell 0.88% to 22,421.95, while the Sensex declined 0.79% to 71,909.69.\n\nTheir weekly losses stood at 3.11% and 2.69%, respectively, with the Nifty posting its sharpest weekly decline since the week ended 13 March 2026. The retreat has sharpened a question: is a recovery in sight?\n\nPrasenjit Paul, fund manager at 129 Wealth and head of research at Paul Asset, said elevated oil prices, rupee weakness and higher US bond yields were driving foreign outflows. Yet the benchmark weakness concealed pockets of resilience, with select small caps and microcaps showing improving earnings and stock prices even as largecaps struggled.\n\nForeign portfolio investors sold a net \u20b9 35,861 crore of equities in September, with \u20b9 19,273 crore\u201453.7% of the monthly outflow\u2014withdrawn in the final seven trading sessions. Selling continued on Thursday, with another \u20b9 9,232 crore offloaded.\n\nThe US 10-year Treasury yield climbed to around 5.3%, its highest since June 2007, while India\u2019s benchmark government bond yield hovered near 7.20%. Crude\u2019s retreat to about $96.30 a barrel offered relief, but proved insufficient to reverse market sentiment.\n\nPaul believes equities already reflect expectations of higher interest rates and bond yields, limiting the scope for another sharp correction. \u201cUnfavourable macro conditions will prevent a near-term bull run. We foresee Nifty to remain rangebound within the 22,000-24,500 range for the rest of 2026.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 07:51 PM IST", "pub_date_relative": "19m ago"}, {"title": "Social Security claiming ages may soon get new names. What retirees need to know", "full_content": "One of the biggest decisions retirees make \u2014 when to claim Social Security benefits \u2014 would be described differently under a bill that may soon become law.\n\nThe Claiming Age Clarity Act , a bipartisan bill that changes certain terms to describe the ages when a worker may claim Social Security retirement benefits, passed the Senate on Tuesday.\n\nThe bill is now on its way to President Donald Trump for his signature. The White House did not respond to CNBC.com's request for comment on whether and when he might sign.\n\nClaiming Social Security benefits at age 62 \u2014 when qualifying retirees first become eligible \u2014 may permanently reduce benefits by up to 30% compared to claiming at full retirement age. By waiting until age 67, individuals born in 1960 or later may receive 100% of the benefits they've earned. And for each year delayed past that \"full\" retirement age, up to age 70, prospective beneficiaries receive an 8% benefit boost.\n\nThe Claiming Age Clarity Act calls for modernizing the terminology around those claiming ages to help retirees better understand the tradeoffs of their decisions. It does not change the claiming ages themselves or how benefits are paid.\n\n\"This straightforward legislation aims to simplify bureaucratic jargon which may mislead Americans into making poor financial decisions,\" Rep. Lloyd Smucker, R-Pa., said in a statement when he introduced the bill with Rep. Don Beyer, D-Va., in 2025.\n\nUnder the terms of the bill , age 62 would now be described as \"minimum benefit age\" rather than the term the Social Security Administration currently uses, \"early eligibility age.\"\n\nFor age 66 to 67, when an individual receives 100% of their earned benefits depending on their birth year, the agency would use \"standard benefit age\" rather than the current \"full retirement age.\"", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 07:50 PM IST", "pub_date_relative": "19m ago"}, {"title": "CNBC AI Forum live updates: Enterprise AI in Dallas", "full_content": "The CNBC AI Forum brings business leaders, entrepreneurs and researchers to Dallas on Oct. 1, 2026, for live conversations about how artificial intelligence is reshaping companies, workers and customers.\n\nCNBC's AI Forum will focus on the practical challenge of moving from experimentation to enterprise-scale deployment, along with the risks posed by autonomous agents, cybersecurity threats, the data center buildout and uneven regulation. Follow this live blog for updates, key quotes and takeaways from sessions on AI infrastructure, governance, financial services and the global race for technological leadership.\n\nCNBC is hosting its second annual AI Forum today in Dallas, Texas \u2014 highlighting that Dallas has become a hub for enterprise-minded AI development.\n\nDallas now boasts one of the country's largest tech workforces, driven by local universities' focus on expanding AI and engineering programs and by Texas's lower cost of living, which has been drawing talent away from Silicon Valley. Meanwhile, key industries, from telecom to healthcare to financial services, are embedding AI into existing infrastructure in Dallas or setting down new roots to build AI systems that can solve real-world problems for their customers.\n\nOpenAI Chairman Bret Taylor is one of the most anticipated speakers at the CNBC AI Forum in Dallas.\n\nTaylor, the co-founder of AI startup Sierra , will be joined on stage by Saul Van Beurden, Wells Fargo co-CEO of consumer banking & head of AI, for a conversation with CNBC's Julia Boorstin about how organizations can scale AI to create value.\n\nIt's been a big week for OpenAI: the company held its annual DevDay developer conference Tuesday, where the AI company unveiled a number of new products and developer tools.\n\nThis year's DevDay took place amid intense pressure on OpenAI to address safety concerns after it disclosed several incidents where models behaved in unintended ways.", "source": "CNBC World Economy", "pub_date_str": "01 Oct 2026, 07:48 PM IST", "pub_date_relative": "21m ago"}, {"title": "\u2018I\u2019m never selling\u2019: I\u2019m 47 and buy bitcoin with every dollar I earn. Am I crazy?", "full_content": "\u201cWhen my paycheck lands, it takes a detour through bitcoin.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:45 PM IST", "pub_date_relative": "25m ago"}, {"title": "I\u2019m 71 and still working. I earn $108,000 a year. Am I doing the right thing?", "full_content": "\u201cI have $152,000 in my IRA and Roth accounts.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:45 PM IST", "pub_date_relative": "25m ago"}, {"title": "This dollar store stock will get a boost from a shaky economy, Loop Capital says", "full_content": "Dollar Tree's shares should get a lift as consumers tighten their purse strings amid uncertain macroeconomic conditions, an analyst says.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 07:36 PM IST", "pub_date_relative": "33m ago"}, {"title": "'Good Days Ahead': HDFC Bank Sources Say Anup Bagchi Brings The Hands-On Execution Missing Earlier", "full_content": "HDFC Bank sources say Bagchi\u2019s retail, technology and execution experience will be key as the lender enters a new leadership phase.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:35 PM IST", "pub_date_relative": "34m ago"}, {"title": "Asian Games 2026 Day 13 Highlights: India\u2019s Hockey Thriller, Cricket Final And More", "full_content": "From a last-minute hockey winner to a 124-run cricket victory, India enjoyed a memorable day at the Asian Games.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:32 PM IST", "pub_date_relative": "37m ago"}, {"title": "HDFC Bank ADRs Spike 4% As ICICI Group Veteran Anup Bagchi Gets CEO Charge", "full_content": "HDFC Bank American Depository Receipts (ADRs) rose over 4% before the opening bell on Thursday, October 1 after the private lender announced the appointment of Anup Bagchi as its new Managing Director and CEO.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:31 PM IST", "pub_date_relative": "38m ago"}, {"title": "Racehorse market breaks records riding high on tax breaks, stock market gains", "full_content": "A version of this article first appeared in CNBC's Inside Wealth newsletter with Robert Frank, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions, straight to your inbox.\n\nThe world's largest thoroughbred auction broke records this year despite concerns that the Gulf conflict would deter deep-pocketed racehorse buyers from the Middle East.\n\nThe Keeneland September Yearling Sale in Kentucky grossed $536.7 million this year, surpassing last year's record by about $5 million. At the two-week auction, which ended Sept. 26, 70 yearlings sold for at least $1 million, up from 56 last year, which broke a 19-year record. The average yearling price increased nearly 7% to $187,933.\n\nThe top lot, a dark bay colt with white socks, was bought for $3.7 million, by a group of investors including paper mogul Peter Brant. The colt was sired by champion stallion Into Mischief, who has produced three Kentucky Derby winners.\n\nHorse breeder and accountant Len Green said tax breaks from the \"one big beautiful bill\" was an important driver of the strong auction results in recent years. At last year's September Sale , which took place two months after OBBBA was signed into law, sales jumped 24% from the year prior.\n\n\"If you happen to be successful and you wanted to have something that gives you a tax deduction and gives you publicity, taking pictures and being in newspapers, et cetera, that kind of thing, the horse business is a pretty damn good investment to make,\" Green said.\n\nOBBBA permanently reinstated 100% bonus depreciation, a tax incentive that allows businesses to write off qualified business property. While bonus depreciation is more commonly associated with commercial real estate and private jets, businesses can write off 100% of a racehorse purchase in the first year of ownership.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 07:30 PM IST", "pub_date_relative": "39m ago"}, {"title": "Gandhi Jayanti 2026: Why Is October 2 Observed As Gandhi Jayanti? History And Significance", "full_content": "Gandhi Jayanti 2026: Why is October 2 observed as Gandhi Jayanti? Know why the date is significant and the history behind the national occasion.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:30 PM IST", "pub_date_relative": "39m ago"}, {"title": "More than 10 million older adults are now living in poverty as Social Security cuts loom: \u2018I don\u2019t know how anyone is making it\u2019", "full_content": "Even seniors with savings are struggling to get by", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:30 PM IST", "pub_date_relative": "40m ago"}, {"title": "Micron beats on earnings and issues strong guidance as data center revenue jumps 11-fold", "full_content": "Micron reported better-than-expected quarterly results on Wednesday as the memory maker continues to benefit from soaring demand for AI infrastructure. The stock rose slightly in extended trading.\n\nRevenue almost quadrupled in the fiscal fourth quarter from $11.32 billion a year earlier, according to a statement .\n\nFor the fiscal first quarter, Micron said it expects revenue of about $61.5 billion and adjusted earnings per share of $38.15. Analysts polled by LSEG had expected $35.40 in adjusted earnings per share on $57 billion in revenue.\n\nMicron's stock has soared more than 500% in the past year, benefiting from a worldwide supply crunch caused by historic levels of demand for memory chips needed for artificial intelligence models and workloads. The shortage has led to a spike in memory costs and resulted in increased prices for consumer electronics like Apple 's iPads and MacBooks.\n\nHendi Susanto, portfolio at Gabelli Funds, said in an email after the release that it was \"another strong beat and raise for Micron.\"\n\n\"At this point, I have not heard any negative data points pointing to the memory cycle reversing toward a decline anytime soon for the foreseeable future,\" Susanto wrote.\n\nMicron is the only U.S.-based maker of high-bandwidth memory, HBM, made up of stacks of general-purpose dynamic random-access memory, or DRAM. Fourth-quarter DRAM revenue increased 343% from a year ago to $39.8 billion, representing 73% of total sales.\n\nCEO Sanjay Mehrotra said on the earnings call that the company has a \"strong roadmap for future HBM products\" and is working with Nvidia on the industry's \"first custom HBM implementation.\"", "source": "CNBC World Economy", "pub_date_str": "01 Oct 2026, 07:29 PM IST", "pub_date_relative": "40m ago"}, {"title": "Accenture Shares Jump Record 22% On Earnings Boost; Infosys, Wipro ADRs Spike Up To 10%", "full_content": "Accenture shares surge a record 22% after earnings, lifting Indian IT names Infosys and Wipro, whose US-listed shares also rally.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:29 PM IST", "pub_date_relative": "40m ago"}, {"title": "Jio Platforms IPO in final stages after concluding worldwide roadshows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio Platforms IPO in final stages after concluding worldwide roadshows Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio Platforms IPO in final stages after concluding worldwide roadshows SECTIONS Jio Platforms IPO in final stages after concluding worldwide roadshows PTI Last Updated: Oct 01, 2026, 07:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms is on the verge of launching what is projected to be the largest public offering in India, targeting USD 3.8 billion. International roadshows spearheaded by Akash Ambani and Isha Ambani have garnered interest. Following approval from Sebi, Jio Platforms plans to release new equity shares, constituting about 2.9 percent of its base.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:27 PM IST", "pub_date_relative": "42m ago"}, {"title": "AI is operating inside the healthcare billing system. Patients may already be paying the price", "full_content": "AI is moving deeper into an already expensive and administratively complex U.S. healthcare system, not just to help doctors diagnose and treat patients but to determine what hospitals bill, what insurance pays, and which claims get denied.\n\nAnd for all the talk of AI as a productivity tool that will lead to efficiencies and serve as a deflationary force, some of the early evidence is raising questions about whether these tools will make an already costly system more expensive.\n\nBlue Cross Blue Shield Association recently estimated that hospitals' use of AI-assisted medical coding contributed to close to $1 billion ( $942 million ) in additional costs for its health plans between 2023 and 2025. BCBSA said much of that increase came from secondary diagnoses that moved patients into higher-paying reimbursement categories, types of diagnoses that it said \"may be derived from single laboratory values, making it particularly well suited for detection by AI tools.\"\n\nThe finding comes as hospitals, insurers, and other parts of the healthcare system increasingly use AI in billing, coding, and claims review, posing the question of whether reducing administrative burden can also intensify the financial incentives already built into the system.\n\nAccording to Christopher Whaley, a health economist at Brown University who studies hospital coding, AI appears to be \"accelerating, and in some sense making it easier to capture, the existing and underlying billing incentives that are in the system.\"\n\nIt is not that additional diagnoses identified through AI are necessarily inappropriate.", "source": "CNBC World Economy", "pub_date_str": "01 Oct 2026, 07:27 PM IST", "pub_date_relative": "43m ago"}, {"title": "Who Is Anup Bagchi? The ICICI Group Veteran Taking Helm At HDFC Bank As New CEO", "full_content": "Anup Bagchi will take charge as HDFC Bank's new CEO, bringing extensive experience across retail banking, corporate banking, capital markets and insurance.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:25 PM IST", "pub_date_relative": "44m ago"}, {"title": "The Vvaan Box Office Collection Day 7: Sidharth-Tamannaah Starrer Crosses Rs 50 Crore", "full_content": "The Vvaan: Force of the Forrest is a Hindi fantasy thriller directed by Deepak Kumar Mishra, who makes his feature directorial debut with the film.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:23 PM IST", "pub_date_relative": "46m ago"}, {"title": "RBI eases bank stake rules, allows one-time approval for MFs, insurers for holdings up to 10%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a RBI eases bank stake rules, allows one-time approval for MFs, insurers for holdings up to 10% The Economic Times daily newspaper is available online now. Read Today's Paper RBI eases bank stake rules, allows one-time approval for MFs, insurers for holdings up to 10% SECTIONS RBI eases bank stake rules, allows one-time approval for MFs, insurers for holdings up to 10% ANI Last Updated: Oct 01, 2026, 07:23:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Reserve Bank of India (RBI) on Thursday finalised its July proposal to simplify bank shareholding rules, allowing eligible mutual funds, insurance companies and pension funds to seek one-time approval for subsequent acquisitions of major shareholding of up to 10 per cent in the same bank.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:23 PM IST", "pub_date_relative": "47m ago"}, {"title": "These bond strategies can help you get a safe 5% return on your cash", "full_content": "With U.S. Treasury yields on the rise, financial planners say they\u2019re seeing a growing interest in bonds, especially among investors looking to secure fixed income in retirement.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:22 PM IST", "pub_date_relative": "48m ago"}, {"title": "Why Micron\u2019s big earnings report isn\u2019t lifting the stock", "full_content": "Expectations are high, and Micron isn\u2019t topping estimates to the degree that it used to.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:22 PM IST", "pub_date_relative": "48m ago"}, {"title": "Why American investors should care as France\u2019s bond market stumbles", "full_content": "As French bond yields rise, is it a threat to the U.S.?", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:19 PM IST", "pub_date_relative": "51m ago"}, {"title": "A tough job market is pushing more young Americans to make a big bet: on themselves", "full_content": "There has been a rise in entrepreneurship among young Americans as the entry-level labor market has become tougher to join.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:18 PM IST", "pub_date_relative": "52m ago"}, {"title": "Global bond sell-off pushes 10-year Treasury yield to highest since 2002", "full_content": "Sovereign debt costs around world return to multiyear highs", "source": "FT Markets", "pub_date_str": "01 Oct 2026, 07:15 PM IST", "pub_date_relative": "55m ago"}, {"title": "Cars have become unaffordable for many Americans. Here\u2019s what the numbers show.", "full_content": "At today\u2019s prices and rates, even the average used vehicle can exceed some commonly used affordability measures.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:15 PM IST", "pub_date_relative": "55m ago"}, {"title": "U.S. reportedly asks Germany and France to release diesel stockpiles: What that means for a U.S. ban on exports of the fuel", "full_content": "The Trump administration asked the European Union to draw down 120 million barrels of diesel over the next six months, Reuters reported.", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:15 PM IST", "pub_date_relative": "55m ago"}, {"title": "Accenture Results Spark IT Sector Rally; Cognizant, Salesforce, IBM Surge Up To 12%", "full_content": "Accenture shares surged 22% after reportING stronger-than-expected fourth-quarter results and provided a positive outlook for fiscal 2027.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:14 PM IST", "pub_date_relative": "55m ago"}], "cfa": [{"title": "10-year Treasury yield climbs to a 24-year high amid relentless global bond sell-off", "full_content": "U.S. Treasury yields hit their highest level in more than two decades on Thursday as a global bond sell-off deepened. A September manufacturing survey in the U.S. showed a sharp gain in prices.\n\nThe 10-year Treasury yield breached a level last seen in April 2002, rising more than 3 basis points to 5.327%. The 10-year is a key benchmark for rates on mortgage and auto loans and credit card debt. The yield on the 30-year Treasury bond climbed almost 4 basis points, to 5.678%, also its highest in 24 years.\n\nYields and prices move inversely. One basis point equals 0.01%.\n\nThe U.S. manufacturing sector continued to expand in September while showing substantial pressure from higher prices, according to the Institute for Supply Management.\n\nWithin the monthly ISM manufacturing index survey , the prices index surged to 77.9, up 6.8 points, while backlogs jumped 4.6 points to 56.4.\n\nGovernment borrowing costs around the world continued their relentless march upward on Thursday, continuing a months-long trend as investors voted with their feet over a lack of political will to tackle fiscal deficits, while inflation remains stubbornly above target and leading central banks move to push interest rates higher.\n\nMajor economies face \"persistently large deficits and rising interest expenses \u2014 challenges long associated with debt-distressed emerging market sovereigns,\" the Institute of International Finance said last week .\n\nJapan's 10-year yield was last trading at 3.126%, the highest level since the mid-1990s. Japan's debt has come under pressure from a weaker yen and rate hikes by the Bank of Japan .", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 08:09 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Economics", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Need a personal loan? Report shows digital lenders are outpacing legacy banks; younger borrowers prefer fintech apps", "full_content": "Digital personal loans are becoming a significant part of how Indians access unsecured credit, particularly among younger borrowers and those in smaller cities.\n\nThe report titled \u201cDigital Personal Loans\u201d was released by the Fintech Association for Consumer Empowerment (FACE), an RBI-recognised Self-Regulatory Organisation for the FinTech sector (SRO-FT).\n\nIt uses data from credit bureau CRIF High Mark and tracks personal loans sanctioned by 110+ digital NBFCs from April 2022 to June 2026. It also compares digital NBFCs with banks and other NBFCs to show their position in India's overall personal-loan market.\n\nIn the first quarter of FY27 (April-June 2026), digital NBFCs sanctioned 3.4 crore personal loans worth \u20b9 64,656 crore, accounting for 70% of all personal-loan sanction volumes across digital NBFCs, other NBFCs and banks. The report groups digital NBFCs as lenders that primarily offer personal loans through digital lending apps.\n\nThe data suggests that digital lending is expanding access to smaller-ticket personal loans, while banks continue to dominate higher-value borrowing.\n\nDuring Q1 FY26-27, lenders sanctioned about 4.9 crore personal loans worth \u20b9 2.99 lakh crore.\n\nDigital NBFCs sanctioned 3.4 crore loans amounting to \u20b9 64,656 crore, with an average ticket size of \u20b9 18,802, about 15% higher than in FY 25-26. Digital loans accounted for 22% of total sanction value and 70% of total sanction volume. Volumes continue to grow, though at a steadier pace. Sanction volume rose 14% over Q1 FY 25-26 and 2% over the previous quarter.\n\nThe average ticket size has increased, but it remains much lower than the \u20b9 70,025 average for other NBFCs and \u20b9 4.52 lakh for banks . This indicates that digital personal loans continue to cater largely to smaller borrowing requirements.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 08:06 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "HDFC Bank ADRs jump over 5% after Anup Bagchi appointed as MD & CEO for three years", "full_content": "HDFC Bank \u2019s American Depositary Receipts (ADRs) jumped 5.4% in Thursday\u2019s intraday trade to reach a day\u2019s high of $23.55 on the NYSE after the country\u2019s largest private sector lender appointed Anup Bagchi as Managing Director and Chief Executive Officer for three years, effective October 27, 2026.\n\nIn its post-market regulatory filing on Thursday, the bank said the Reserve Bank of India had approved the appointment of Bagchi as Managing Director and Chief Executive Officer for three years.\n\nBagchi, currently serving as the MD and CEO of ICICI Prudential Life Insurance, will succeed Sashidhar Jagdishan.\n\nConsequently, the Board of Directors of the Bank, based on the recommendation of the Governance, Nomination, and Remuneration Committee, at its meeting held on October 1, 2026, approved the appointment of Bagchi as an Additional Director of the Bank with effect from October 2, 2026, the bank said in the filing.\n\nThe board also approved the appointment of Anup Bagchi as the MD & CEO of the Bank on such terms and conditions, including remuneration, as approved by the RBI, for a period of three years with effect from October 27, 2026, subject to approval of the shareholders as per the provisions of the Companies Act, 2013, HDFC Bank said.\n\nThe appointment is also the second instance in recent years of an insurance executive being appointed to lead a bank. In 2019, Amitabh Chaudhry joined Axis Bank as chief executive after serving as the CEO of HDFC Life Insurance Company.\n\nBagchi, an experienced banking and financial services executive, currently serves as managing director and CEO of ICICI Prudential Life Insurance Company. During his tenure, the company reportedly crossed the \u20b9 10,000 crore mark in Annualized Premium Equivalent (APE) for the first time in FY2025.\n\nAPE rose 15% year over year to \u20b9 10,407 crore, while profit after tax climbed nearly 40% to \u20b9 1,189 crore.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 08:04 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SEC proposes investor exam to expand private market access \u2014 here's how it could work", "full_content": "he U.S. Securities and Exchange Commission is considering new ways for individual investors to gain access to some private market investments \u2014 including passing an exam .\n\nThe three-member commission said Wednesday it is considering expanding the qualifiers for so-called accredited investor status. Certain investments \u2014 such as private equity funds, venture capital and hedge funds, among others \u2014 commonly require investors to be accredited to participate.\n\nCurrently, to qualify as accredited , investors generally need an annual earned income of $200,000 for individuals, or $300,000 for married couples in each of the prior two years, with a reasonable expectation of the same income in the current year. Individuals or couples can also qualify with a total net worth of at least $1 million, not including the value of their primary residence.\n\n\"Accredited investor access to private offerings should not be solely to individuals satisfying financial thresholds,\" Paul Atkins, chairman of the SEC, said at an open meeting Wednesday.\n\nCurrent SEC rules also allow accredited investor status for individuals who hold a Series 7, 65 or 82 securities license in good standing, among other qualifiers.\n\nSEC officials said in the meeting that FINRA, a self-regulatory organization that oversees U.S. broker-dealers, would develop the new exam. Anyone age 18 or older would be eligible to take the test.\n\nAccording to details shared in the meeting, the test would be modeled on an existing FINRA assessment for securities industry professionals: a roughly 75-question multiple-choice exam with a two-hour time limit. That existing exam costs about $100, and officials said an accredited investor test could have a similar price tag. It could be administered at testing sites across the country.\n\nHere's a look at more stories on how to manage, grow and protect your money for the years ahead.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 08:03 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Worried your bank account is empty after cyber fraud? Here\u2019s what to do immediately", "full_content": "If you have ever received a transactional message from your bank saying that a massive amount has been deducted, but you did not make the transaction, you might have been scammed. While your first instinct may be to panic, call the person who just contacted you, keep checking your account, or try to figure out how it all happened, people often forget that in times like these, the first few minutes are crucial.\n\nBut for someone who has just discovered that their hard-earned money has been debited from their account, the bigger question is: what should they do next? Should they call the bank first and get their account blocked, call 1930, or file a police complaint?\n\nAccording to a 2025 Press Information Bureau (PIB) report, the surge in cybersecurity incidents from 10.29 lakh in 2022 to 22.68 lakh in 2024 reflects the growing scale and complexity of digital threats in India. At the same time, the financial toll is becoming more pronounced, with cyber frauds amounting to \u20b9 36.45 lakh reported on the National Cyber Crime Reporting Portal (NCRP).\n\nAccording to Gaurav Gupta, Group Head - Financial Crime Intelligence, Axis Bank, if someone suspects they have been a victim of cyber fraud, they should act immediately. They should report the incident to their bank through official customer service channels, block compromised cards or accounts, including relevant digital channels , and change passwords or PINs linked to their banking services.\n\nCustomers should also report the fraud on the National Cyber Crime Helpline (1930) or the cybercrime reporting portal.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 08:02 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Natural gas storage surpasses forecast, impacting market dynamics", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:02 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Exclusive-US tells France and Germany to release diesel stocks or face US export ban, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 08:01 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India's motor car exports witnessing healthy growth in EFTA market: Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India's motor car exports witnessing healthy growth in EFTA market: Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper India's motor car exports witnessing healthy growth in EFTA market: Piyush Goyal SECTIONS India's motor car exports witnessing healthy growth in EFTA market: Piyush Goyal PTI Last Updated: Oct 01, 2026, 07:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's exports of motor cars and heavy waters have seen significant growth since the trade agreement implementation. The trade and economic partnership agreement with EFTA has created market access for the majority of India's exports. The EFTA countries have committed to invest USD 100 billion in India over 15 years.\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "01 Oct 2026, 07:58 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Sebi revamps Document Number Verification System, adds subject matter as mandatory field", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi revamps Document Number Verification System, adds subject matter as mandatory field The Economic Times daily newspaper is available online now. Read Today's Paper Sebi revamps Document Number Verification System, adds subject matter as mandatory field SECTIONS Sebi revamps Document Number Verification System, adds subject matter as mandatory field By Kumar Gaurav , ETMarkets.com Last Updated: Oct 01, 2026, 07:58:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Sebi has revamped its Document Number Verification System, making a letter\u2019s subject matter mandatory for authentication. The upgraded system aligns with Sebi\u2019s E-Office format and lets recipients verify physical letters, notices and show-cause notices issued by the regulator.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:58 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kalshi, Polymarket trading volumes on some products raise questions amid massive growth", "full_content": "Trading volumes for certain products on prediction market platforms Kalshi and Polymarket are raising questions from some industry observers, who fear the numbers may be inflated.\n\nOn Polymarket, observers have flagged a quirk on the company's international exchange, which is not overseen by U.S. regulators: Markets that feature multiple contracts will see greater activity on those with lower odds of occurring versus those with higher probabilities. It's seen on markets related to elections, sports and central bank decisions.\n\nMeanwhile, a user on X on Sept. 20 flagged a strange pattern on Kalshi's perpetual futures market for the ether cryptocurrency. Trades of around $5,500 made up a large share of transactions on the contracts, and that 24-hour trading volume was abnormally high compared with actual resting liquidity. A CNBC analysis found that on Sept. 20, nearly half of the dollar volume traded on Kalshi's ether perpetuals came from trades sized between $5,495 and $5,505.\n\nBoth developments create concerns among some observers that the companies are overseeing inflated volumes or, at worst, are experiencing wash trading, in which traders collude to buy and sell an asset to create a false sense of economic activity.\n\nBoth Kalshi and Polymarket deny wash trading occurs on any of their products. They also deny that the respective patterns represent inorganic activity.\n\nA designated contract market, the type of exchange prediction markets are, \"has a duty to protect market integrity by monitoring market conditions, price movements, and volumes in real time for abnormalities,\" said Tamika Bent, a partner at K&L Gates. While she said the patterns described here don't alone establish misconduct by an exchange, she added observers would \"expect DCMs to be surveilling unusual volume and looking into any signs of market disruption.\"\n\nPolymarket is currently raising at a valuation north of $20 billion in the private market after the launch of its U.S.", "source": "CNBC Finance", "pub_date_str": "01 Oct 2026, 07:54 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "UK pound falls to three-month lows as investors fret over rates, oil", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a UK pound falls to three-month lows as investors fret over rates, oil Powered By The Economic Times daily newspaper is available online now. Read Today's Paper UK pound falls to three-month lows as investors fret over rates, oil SECTIONS UK pound falls to three-month lows as investors fret over rates, oil Reuters Last Updated: Oct 01, 2026, 07:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The pound has hit a three-month low against the dollar, triggered by mounting economic apprehensions. Investors are anxious about the effects of soaring oil prices and persistent inflation on market stability. The FTSE 100 index has notably declined, reflecting burdens in government borrowing. Prime Minister Andy Burnham and Chancellor John Healey confront escalating gilt yields.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:53 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "UK 30-year gilt yields top 6% for the first time since 1998", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a UK 30-year gilt yields top 6% for the first time since 1998 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper UK 30-year gilt yields top 6% for the first time since 1998 SECTIONS UK 30-year gilt yields top 6% for the first time since 1998 Reuters Last Updated: Oct 01, 2026, 07:52:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis British 30-year government bond yields have surged to their highest level since early 1998. This surge follows a significant increase in U.S. Treasury yields despite steadied oil prices. Short-dated gilt yields also rose sharply, reflecting concerns about the UK's fiscal vulnerabilities. Investors anticipate possible interest rate hikes by the Central Bank in November or December. The financial market is reacting to ongoing economic pressures like rising food and energy prices.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 07:52 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Pulse of the Street: Eight-week slide puts RBI, earnings in focus", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nCheaper oil failed to bring much comfort for Indian equities as the markets slid for the eighth consecutive week. The Nifty 50 recorded its longest weekly losing streak since 2001 in a holiday-truncated week, with markets closed on Friday for Gandhi Jayanti. On Thursday, it fell 0.88% to 22,421.95, while the Sensex declined 0.79% to 71,909.69.\n\nTheir weekly losses stood at 3.11% and 2.69%, respectively, with the Nifty posting its sharpest weekly decline since the week ended 13 March 2026. The retreat has sharpened a question: is a recovery in sight?\n\nPrasenjit Paul, fund manager at 129 Wealth and head of research at Paul Asset, said elevated oil prices, rupee weakness and higher US bond yields were driving foreign outflows. Yet the benchmark weakness concealed pockets of resilience, with select small caps and microcaps showing improving earnings and stock prices even as largecaps struggled.\n\nForeign portfolio investors sold a net \u20b9 35,861 crore of equities in September, with \u20b9 19,273 crore\u201453.7% of the monthly outflow\u2014withdrawn in the final seven trading sessions. Selling continued on Thursday, with another \u20b9 9,232 crore offloaded.\n\nThe US 10-year Treasury yield climbed to around 5.3%, its highest since June 2007, while India\u2019s benchmark government bond yield hovered near 7.20%. Crude\u2019s retreat to about $96.30 a barrel offered relief, but proved insufficient to reverse market sentiment.\n\nPaul believes equities already reflect expectations of higher interest rates and bond yields, limiting the scope for another sharp correction. \u201cUnfavourable macro conditions will prevent a near-term bull run. We foresee Nifty to remain rangebound within the 22,000-24,500 range for the rest of 2026.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 07:51 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "CNBC AI Forum live updates: Enterprise AI in Dallas", "full_content": "The CNBC AI Forum brings business leaders, entrepreneurs and researchers to Dallas on Oct. 1, 2026, for live conversations about how artificial intelligence is reshaping companies, workers and customers.\n\nCNBC's AI Forum will focus on the practical challenge of moving from experimentation to enterprise-scale deployment, along with the risks posed by autonomous agents, cybersecurity threats, the data center buildout and uneven regulation. Follow this live blog for updates, key quotes and takeaways from sessions on AI infrastructure, governance, financial services and the global race for technological leadership.\n\nCNBC is hosting its second annual AI Forum today in Dallas, Texas \u2014 highlighting that Dallas has become a hub for enterprise-minded AI development.\n\nDallas now boasts one of the country's largest tech workforces, driven by local universities' focus on expanding AI and engineering programs and by Texas's lower cost of living, which has been drawing talent away from Silicon Valley. Meanwhile, key industries, from telecom to healthcare to financial services, are embedding AI into existing infrastructure in Dallas or setting down new roots to build AI systems that can solve real-world problems for their customers.\n\nOpenAI Chairman Bret Taylor is one of the most anticipated speakers at the CNBC AI Forum in Dallas.\n\nTaylor, the co-founder of AI startup Sierra , will be joined on stage by Saul Van Beurden, Wells Fargo co-CEO of consumer banking & head of AI, for a conversation with CNBC's Julia Boorstin about how organizations can scale AI to create value.\n\nIt's been a big week for OpenAI: the company held its annual DevDay developer conference Tuesday, where the AI company unveiled a number of new products and developer tools.\n\nThis year's DevDay took place amid intense pressure on OpenAI to address safety concerns after it disclosed several incidents where models behaved in unintended ways.", "source": "CNBC World Economy", "pub_date_str": "01 Oct 2026, 07:48 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u2018I\u2019m never selling\u2019: I\u2019m 47 and buy bitcoin with every dollar I earn. Am I crazy?", "full_content": "\u201cWhen my paycheck lands, it takes a detour through bitcoin.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "01 Oct 2026, 07:45 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Racehorse market breaks records riding high on tax breaks, stock market gains", "full_content": "A version of this article first appeared in CNBC's Inside Wealth newsletter with Robert Frank, a weekly guide to the high-net-worth investor and consumer. Sign up to receive future editions, straight to your inbox.\n\nThe world's largest thoroughbred auction broke records this year despite concerns that the Gulf conflict would deter deep-pocketed racehorse buyers from the Middle East.\n\nThe Keeneland September Yearling Sale in Kentucky grossed $536.7 million this year, surpassing last year's record by about $5 million. At the two-week auction, which ended Sept. 26, 70 yearlings sold for at least $1 million, up from 56 last year, which broke a 19-year record. The average yearling price increased nearly 7% to $187,933.\n\nThe top lot, a dark bay colt with white socks, was bought for $3.7 million, by a group of investors including paper mogul Peter Brant. The colt was sired by champion stallion Into Mischief, who has produced three Kentucky Derby winners.\n\nHorse breeder and accountant Len Green said tax breaks from the \"one big beautiful bill\" was an important driver of the strong auction results in recent years. At last year's September Sale , which took place two months after OBBBA was signed into law, sales jumped 24% from the year prior.\n\n\"If you happen to be successful and you wanted to have something that gives you a tax deduction and gives you publicity, taking pictures and being in newspapers, et cetera, that kind of thing, the horse business is a pretty damn good investment to make,\" Green said.\n\nOBBBA permanently reinstated 100% bonus depreciation, a tax incentive that allows businesses to write off qualified business property. While bonus depreciation is more commonly associated with commercial real estate and private jets, businesses can write off 100% of a racehorse purchase in the first year of ownership.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 07:30 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Micron beats on earnings and issues strong guidance as data center revenue jumps 11-fold", "full_content": "Micron reported better-than-expected quarterly results on Wednesday as the memory maker continues to benefit from soaring demand for AI infrastructure. The stock rose slightly in extended trading.\n\nRevenue almost quadrupled in the fiscal fourth quarter from $11.32 billion a year earlier, according to a statement .\n\nFor the fiscal first quarter, Micron said it expects revenue of about $61.5 billion and adjusted earnings per share of $38.15. Analysts polled by LSEG had expected $35.40 in adjusted earnings per share on $57 billion in revenue.\n\nMicron's stock has soared more than 500% in the past year, benefiting from a worldwide supply crunch caused by historic levels of demand for memory chips needed for artificial intelligence models and workloads. The shortage has led to a spike in memory costs and resulted in increased prices for consumer electronics like Apple 's iPads and MacBooks.\n\nHendi Susanto, portfolio at Gabelli Funds, said in an email after the release that it was \"another strong beat and raise for Micron.\"\n\n\"At this point, I have not heard any negative data points pointing to the memory cycle reversing toward a decline anytime soon for the foreseeable future,\" Susanto wrote.\n\nMicron is the only U.S.-based maker of high-bandwidth memory, HBM, made up of stacks of general-purpose dynamic random-access memory, or DRAM. Fourth-quarter DRAM revenue increased 343% from a year ago to $39.8 billion, representing 73% of total sales.\n\nCEO Sanjay Mehrotra said on the earnings call that the company has a \"strong roadmap for future HBM products\" and is working with Nvidia on the industry's \"first custom HBM implementation.\"", "source": "CNBC World Economy", "pub_date_str": "01 Oct 2026, 07:29 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Accenture Shares Jump Record 22% On Earnings Boost; Infosys, Wipro ADRs Spike Up To 10%", "full_content": "Accenture shares surge a record 22% after earnings, lifting Indian IT names Infosys and Wipro, whose US-listed shares also rally.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 07:29 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms IPO in final stages after concluding worldwide roadshows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio Platforms IPO in final stages after concluding worldwide roadshows Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio Platforms IPO in final stages after concluding worldwide roadshows SECTIONS Jio Platforms IPO in final stages after concluding worldwide roadshows PTI Last Updated: Oct 01, 2026, 07:27:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms is on the verge of launching what is projected to be the largest public offering in India, targeting USD 3.8 billion. International roadshows spearheaded by Akash Ambani and Isha Ambani have garnered interest. Following approval from Sebi, Jio Platforms plans to release new equity shares, constituting about 2.9 percent of its base.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "p
