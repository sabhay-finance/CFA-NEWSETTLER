te_relative": "7m ago"}, {"title": "Buy, Sell Or Hold: Samvardhana Motherson, ITC, IRCTC, Hitachi Energy India, Shriram Finance And HDFC Bank \u2014 Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks such as, ITC, IRCTC, Shriram Finance and HDFC Bank.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 11:27 PM IST", "pub_date_relative": "8m ago"}, {"title": "Data Centres In Space? US Approves SpaceX Plan For 1 Million AI Satellites", "full_content": "The US Federal Communications Commission has authorised Elon Musk's SpaceX to deploy up to one million satellites for orbital data centres. The Starmind network aims to process AI workloads in space and transmit results to Earth.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 11:17 PM IST", "pub_date_relative": "17m ago"}, {"title": "Inter Milan vs Stuttgart Live Streaming: Likely Lineups; How To Watch Champions League Match On TV, Online?", "full_content": "Inter Milan will host Stuttgart in a Matchday 5 clash of the UEFA Champions League 2026-27. Check the match timing, predicted lineups and live telecast details.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 11:17 PM IST", "pub_date_relative": "18m ago"}, {"title": "US Treasury financial crime watchdog hit by suspected cyber attack", "full_content": "FinCen takes systems offline after detecting unauthorised access amid growing fears over vulnerability of technology systems", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 11:15 PM IST", "pub_date_relative": "20m ago"}, {"title": "Nasdaq 100 plunges nearly 5%, briefly enters bear-market zone as AI fears and fresh tariffs hit sentiment", "full_content": "The technology-heavy Nasdaq 100 index slumped for a second consecutive session on Wednesday, briefly slipping into bear-market territory, as investors continued to dump AI-linked stocks amid mounting concerns over excessive investments in the sector and rising borrowing costs, while fresh US data showed inflation accelerating in October.\n\nInvestor sentiment was also dented by the Trump administration's proposed new tariffs on 14 trading partners, including the European Union and China. The Nasdaq Composite plunged nearly 5% during the session, while the Nasdaq 100 briefly fell 20% from its record closing high in October, the threshold commonly used to define a bear market.\n\nOther key indices, including the S&P 500 and Dow Jones Industrial Average, also came under pressure, falling 3.2% and 2.20%, respectively, at 11:30 a.m. ET. The Nasdaq and S&P 500 remained on track for their worst November since the 2008 global financial crisis.\n\nChipmakers led the declines, with Nvidia plunging 8.7%, while the Philadelphia Semiconductor Index dropped 7.3%. Among other major technology stocks, Alphabet fell 5%, and Amazon shed 5.4%, while Microsoft and Apple declined 3% and 1.7%, respectively.\n\nAnthropic, the company behind the Claude AI chatbot, slipped another 2.1% after closing below its $83 initial public offering (IPO) price for the first time on Tuesday. The stock had briefly surged to $115 during its first day of trading last week amid a frenzy of AI-driven enthusiasm.\n\nThe US markets, which had scaled multiple record highs this year, have come under sustained pressure as fund managers reassess their exposure to the AI trade amid concerns over whether the debt-fuelled AI boom can generate sufficient returns to justify massive investments.\n\nJensen Huang's return as Nvidia CEO after his removal earlier this month provided a temporary reprieve at the start of the week.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 11:13 PM IST", "pub_date_relative": "21m ago"}, {"title": "Analysis-Volatility-weary investors hammered as tariff mayhem adds to tech pain", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 11:12 PM IST", "pub_date_relative": "23m ago"}, {"title": "US Justice Department did not open probe into Jensen Huang before reinstatement, sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 11:12 PM IST", "pub_date_relative": "23m ago"}, {"title": "PM Modi Reviews 5 Key Projects Worth Rs 78,000 Crore: What The Centre Is Focusing On", "full_content": "Prime Minister Narendra Modi chaired the 55th PRAGATI meeting, reviewing five infrastructure projects worth over \u20b978,000 crore and the implementation of PM-SETU.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 11:12 PM IST", "pub_date_relative": "23m ago"}, {"title": "Kalshi traders say state data center moratoriums are more likely than not", "full_content": "On Wednesday morning, Kalshi traders put the probability above 55% that at least four states would adopt data center moratoriums this year.\n\nAfter Democrats swept Congress and key governor races during the midterm elections, Kalshi traders put the odds that at least four states would pause data center construction at about 75%. Since Nov. 22, the probability that at least four states would adopt moratoriums rose again, to 57% from 52%.\n\nThe contract asks \"How many states will adopt data center moratoriums this year?\" and will be verified from state governments. On July 14, New York became the first state to impose a one-year pause on certain state permits for hyperscale data centers. Various local governments have also ordered moratoriums on data centers this year.\n\nSen. Bernie Sanders, I-Vt., called for a national data center moratorium the day after the midterms on social media , signaling growing pushback against the build-out.\n\nMeanwhile, some investors say unease surrounding the artificial intelligence trade is partly an emotional or sentiment-driven reaction. Doug Clinton, founder and CEO of Intelligent Alpha, told CNBC's \" Closing Bell: Overtime \" the AI sell-off is psychological.\n\n\"I actually think it is difficult to point to some fundamental data point from here that all of a sudden would make investors okay,\" Clinton said.\n\nAI-related stocks slumped again Wednesday. Nvidia and Oracle slid more than 8%, while Anthropic tumbled 6% and Alphabet slid 5.5%.\n\nOn Friday, the S&P 500 and Dow Jones Industrial Average entered corrections, down 10% from their recent highs, while the Nasdaq Composite declined more than 5% following Anthropic's blockbuster public offering the day before.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 11:06 PM IST", "pub_date_relative": "28m ago"}, {"title": "US proposes surprise new tariffs on Brazil imports, including 10% duty on aircraft", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 11:06 PM IST", "pub_date_relative": "28m ago"}, {"title": "Wall Street cuts losses after brutal rout, but mood glum heading into Thanksgiving", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 11:03 PM IST", "pub_date_relative": "32m ago"}, {"title": "Europe stocks drop as autos, pharma gain, chipmakers drag", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 11:00 PM IST", "pub_date_relative": "34m ago"}, {"title": "ECB and Sveriges Riksbank conclude agreement for Sweden to join T2", "full_content": "The European Central Bank (ECB) and Sveriges Riksbank have concluded an agreement for Sweden to join T2, the Eurosystem\u2019s real-time gross settlement system. Today, ECB President Christine Lagarde and Sveriges Riksbank Governor Erik Thed\u00e9en took part in a signing ceremony for the T2 currency participation agreement at the ECB.\n\nThis agreement will enable Sveriges Riksbank to use T2 for settling large-value payments in Swedish kronor. Migration is targeted for February 2030.\n\nJoining T2 will move Sweden\u2019s large-value payment settlement from a national platform to shared European infrastructure. Sveriges Riksbank and Swedish financial institutions will benefit from investments in security, resilience and technological development that are shared across participating markets, as well as from common European standards. Payments will continue to be settled in Swedish kronor using central bank money.\n\n\u201cShared payment infrastructure strengthens Europe\u2019s strategic autonomy and supports a more integrated financial system,\u201d said ECB President Christine Lagarde. \u201cThis agreement builds on our partnership with Sveriges Riksbank and our joint commitment to safe and efficient payments.\u201d\n\n\u201cBy connecting to the European T2 platform for settling payments in Swedish kronor, we can, together with the ECB and other central banks, ensure that the Swedish settlement system becomes an even safer and more efficient payment system in the long run, both in everyday life and in a crisis,\u201d said Sveriges Riksbank Governor Erik Thed\u00e9en.\n\nTARGET Services are the Eurosystem\u2019s financial market infrastructure for settling large-value payments, instant payments and securities transactions, and for managing collateral. In addition to payments in euro, T2 already supports large-value payments in Danish kroner.", "source": "ECB Press", "pub_date_str": "25 Nov 2026, 11:00 PM IST", "pub_date_relative": "35m ago"}, {"title": "SpaceX wins landmark FCC backing for 1 million-satellite data center constellation", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 10:59 PM IST", "pub_date_relative": "36m ago"}, {"title": "Nvidia sellers seek new buyers as U.S. curbs China AI chip access, sources tell CNBC", "full_content": "Nvidia chip sellers are seeking new buyers for the semiconductor giant's hardware, three people told CNBC, after the Trump administration tightened rules to curb Chinese companies' remote access to the most advanced artificial-intelligence systems.\n\nCompanies have put an unusually high volume of Nvidia graphics processing units, or GPUs, on the market since new measures restricting Chinese companies renting access to advanced Nvidia chips were announced on Nov. 16, the people said.\n\nJack Duhamel, president of AI infrastructure marketplace GPU Mart, and two people familiar with the matter told CNBC the surge in GPUs for sale was directly attributable to the new rule. Duhamel added that one company looking to sell Nvidia chips told GPU Mart the sale was related to the new rule.\n\nThe two people said it appeared chip sellers were seeking to offload them because they were originally for use in data centers in which Chinese companies would rent access. They asked not to be named because they were discussing private information.\n\nThe Department of Commerce's Bureau of Industry and Security, or BIS, announced an interim final rule as part of a clampdown on Chinese companies bypassing export controls, which effectively ban the sale of the most advanced Nvidia chips to China, by accessing them remotely in overseas data centers. The rule came into effect on Nov. 19.\n\nDeals to find buyers for thousands of B300 GPUs, one of Nvidia's most advanced offerings, have been floated since the rule was announced, said Duhamel and one of the people.\n\nNvidia declined to comment. BIS did not immediately respond to a request for comment.\n\nNvidia has been facing increasing scrutiny from U.S. lawmakers over Chinese companies' access to its advanced chips.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 10:58 PM IST", "pub_date_relative": "37m ago"}, {"title": "Grupo Galicia Q3 2026 slides: EPS misses as margins compress in lower-rate shift", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 10:56 PM IST", "pub_date_relative": "39m ago"}, {"title": "Stock Market Today: Nasdaq Opens Over 3% Lowe as Confidence in AI Trade Weakens \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Opens Over 3% Lowe as Confidence in AI Trade Weakens \u2014 Live Updates WSJ Dow turns positive on the day as Wall Street attempts sell-off recovery: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq sink on hot inflation, new Trump tariffs as chip rout continues Yahoo Finance Stock Sell-Off Continues as Investors Fret About A.I., Tariffs and Inflation The New York Times US stocks sell-off deepens as AI trade cracks Financial Times", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 10:56 PM IST", "pub_date_relative": "39m ago"}, {"title": "Gemini's New Google Messages Feature Can Alert You About Deals, Travel And Deliveries", "full_content": "A new beta of Google Messages reportedly links its Gemini button to Gemini Channels, letting the assistant start chats with users. The feature is said to be limited to the US for now.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:54 PM IST", "pub_date_relative": "41m ago"}, {"title": "Iraq\u2019s top court says Baghdad can deploy troops to secure borders in Kurdistan region", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 10:54 PM IST", "pub_date_relative": "41m ago"}, {"title": "Assurant stock hits all-time high at 327.03 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 10:52 PM IST", "pub_date_relative": "43m ago"}, {"title": "Someone repaid your loan in cash and you deposited it in the bank. Can the taxman treat it as your income? ITAT explains", "full_content": "A retired Indian Airlines official has won relief from a \u20b9 12.09 lakh income tax addition after the Delhi bench of the Income Tax Appellate Tribunal (ITAT) accepted his explanation that the money deposited in his bank account represented repayment of a loan he had advanced to a company. The company had subsequently denied borrowing the money, but its own financial statements showed that it had received the loan and later settled the outstanding liability.\n\nIn its order dated 20 November 2026, the tribunal deleted the entire addition made under Section 69A of the Income Tax Act, which deals with unexplained money. It held that the taxpayer's explanation was supported by documentary evidence, including bank transactions and the company's balance sheets.\n\nThe taxpayer, Rahul Kumar, had filed his income tax return declaring an income of \u20b9 3.32 lakh. During reassessment proceedings, the assessing officer (AO) found that he had deposited \u20b9 12.09 lakh in cash in his Canara Bank savings account.\n\nThe tax department questioned the source of these deposits, arguing that the transactions were not commensurate with his declared income.\n\nKumar explained that he had advanced a loan of \u20b9 25 lakh to SAR Aviation Services Pvt. Ltd. on 4 March 2011 through three cheques of \u20b9 10 lakh, \u20b9 10 lakh and \u20b9 5 lakh, drawn on his HDFC Bank account.\n\nHe claimed that the company subsequently repaid the loan in instalments in cash and that the disputed bank deposits represented these repayments.\n\nHowever, the assessing officer rejected his explanation, citing the absence of a confirmation from the company and a date-wise account of the cash repayments. The AO also questioned the legality of the cash transactions and treated the \u20b9 12.09 lakh as unexplained money under Section 69A.\n\nThe taxpayer challenged the addition before the first appellate authority, but his appeal was dismissed. He subsequently approached the ITAT.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 10:50 PM IST", "pub_date_relative": "45m ago"}, {"title": "Revaz Shmertz Examines Who Pays for Stablecoin Yield at Stable Summit IV", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 10:48 PM IST", "pub_date_relative": "47m ago"}, {"title": "The AI trade is unraveling days after Jensen Huang's comeback sparked a monster rally - Business Insider", "full_content": "The AI trade is unraveling days after Jensen Huang's comeback sparked a monster rally Business Insider The $2 trillion chip rally is getting wiped out \u2014 here's what history says comes next Yahoo Finance Jensen Huang Boost Fades Fast as Taiwan Stocks Tumble 8% Bloomberg.com The market euphoria has evaporated \ud83c\udf2c\ufe0f XTB.com The KOSPI plunged more than 6% on the 25th, returning all the gains of the previous day. Samsung Ele.. \ub9e4\uc77c\uacbd\uc81c", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 10:48 PM IST", "pub_date_relative": "47m ago"}, {"title": "Gold, Silver Rates Updates: Gold Drops Below $3,500 An Ounce To Lowest Since Sept. 2025", "full_content": "Gold price dipped slightly to Rs 1,22,250 per 10 grams in early trade on Wednesday as per MCX data.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:47 PM IST", "pub_date_relative": "48m ago"}, {"title": "Spider-Man In Avengers: Doomsday? Robert Downey Jr's Thanksgiving Post Sparks Fan Speculation", "full_content": "The 'P--er' reference could point to Peter Parker, raising speculation about Spider-Man's possible appearance. Tobey Maguire has also been linked to the film through unconfirmed reports.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:45 PM IST", "pub_date_relative": "50m ago"}, {"title": "Speeding Truck Runs Over Students At Pune Bus Stop, 3 Dead; CCTV Shows Driver Fleeing", "full_content": "The accident took place near Garwa Hotel in Bopdev Ghat at around 1:34 pm on Wednesday.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:44 PM IST", "pub_date_relative": "51m ago"}, {"title": "Nvidia leads tech sell-off as Huang comeback rally fizzles and AI concerns return", "full_content": "Technology stocks plunged on Wednesday as excitement over Nvidia CEO Jensen Huang 's return faded and failed to calm mounting concerns over the sustainability of the artificial intelligence trade.\n\nThe tech-heavy Nasdaq Composite dropped nearly 4%. Semiconductor stocks dragged on the index, and the VanEck Semiconductor ETF that tracks the sector plummeted 7%.\n\nAfter notching one of its best days on record Monday, Nvidia has fallen in the days since and slumped 8% Wednesday. Advanced Micro Devices , Micron Technology , Marvell Technology and Intel all dropped more than 9%, with some plunging further.\n\nHuang's return to Nvidia on Monday briefly revived appetite for tech stocks but didn't fully calm investor concerns over the high costs tied to the AI build-out and worries of a potential slowdown.\n\nNvidia stock chart Other stocks tied to the AI trade also plummeted. Oracle dropped 8% and CoreWeave and Nebius sank more than 10% each.\n\nWednesday's declines also came as Wall Street digested a hot inflation reading that fueled concerns that higher interest rates could dent demand for growth stocks, including tech.\n\nAmazon , Tesla and Alphabet each declined about 5%. Microsoft lost more than 2% and Meta traded marginally lower.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 10:40 PM IST", "pub_date_relative": "55m ago"}, {"title": "Prediction markets push OpenAI IPO expectations later into 2027", "full_content": "Anthropic's shaky performance on the public markets since its debut last week and a continuing tech sell-off may be changing the outlook for when prediction markets think OpenAI will go public.\n\nSpeculators on prediction market platform Kalshi think there's a roughly 28% chance the ChatGPT developer officially announces an IPO by June 2027. That figure was most recently above 50% earlier this month.\n\nEven by October 2027, odds are still only 50-50 that the private company \u2014 most recently conducting a funding round at a $1.25 trillion valuation \u2014 will make its move to the public markets.\n\nKalshi defines officially announcing an IPO as either the Securities and Exchange Commission declaring an S-1 form as effective, the IPO being priced or an exchange has assigned a ticker to the company. Contracts are resolved using reports from media outlets.\n\nOpenAI confidentially filed for an IPO in June, but then in an interview with Fortune published in September CEO Sam Altman ruled out a 2026 public markets debut as questions over artificial intelligence safety grew.\n\nThe company's chief rival, Anthropic, debuted on the public markets last week. However, the stock has declined nearly 30% from its peak during its first trading session, and on Tuesday it closed below its IPO price of $83 .\n\nMeanwhile, a perpetual futures contract for OpenAI on Hyperliquid has tumbled more than 30% since highs in early October. In late October, OpenAI pared back its goal for its recent funding round to $20 billion from $30 billion.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Finance", "pub_date_str": "25 Nov 2026, 10:38 PM IST", "pub_date_relative": "57m ago"}, {"title": "This missile maker's stock has fallen on expected U.S. military spending cuts, but its backlog reduces the risk", "full_content": "Defense stocks have come under pressure since Democrats won control of Congress, but RTX\u2019s record backlog gives it unusual visibility into future demand.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 10:37 PM IST", "pub_date_relative": "58m ago"}, {"title": "Trade Setup For Nov. 26: Nifty Wipes 2026 Losses; Can Bulls Win The Crucial 26,000 Test?", "full_content": "Trade Setup For Nov. 26: Nifty witnessed a strong recovery after profit booking, reclaiming the crucial 25,650 mark. Going forward, some consolidation and volatility should be considered healthy rather than a reason to turn structurally cautious, as per analysts.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:23 PM IST", "pub_date_relative": "1h ago"}, {"title": "No More Omelettes, Sandwiches? IRCTC Changes Food Menu On 3 Vande Bharat Sleeper Trains", "full_content": "IRCTC has reduced food options on three Vande Bharat Sleeper trains, removing items such as omelettes, sandwiches and sweets from the menu.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Nandini Curd Gets Cheaper From November 29: Check New Prices For 500 g And 1 Kg Packs", "full_content": "KMF has reduced Nandini Curd prices by Rs 2 per kg following the Karnataka government's direction. The revised rates will take effect on November 29, with the 1 kg pack priced at Rs 66.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Army blows up bomb chemicals in Iowa despite fears a toxic plume could endanger residents", "full_content": "The U.S. Army intentionally blew up the nation's entire stockpile of lead azide at an ammunition plant in southeastern Iowa on Wednesday after officials said the 5 tons of degraded bomb-making materials were at risk of exploding uncontrollably as temperatures cooled.\n\nThe controlled detonation set off concerns about potential health and environmental impacts from lead dust, and frustration over a lack of information.\n\nVideo footage from several miles away showed two white plumes rolling over the detonation site before the clouds quickly dissipated. Journalists reported hearing a loud boom at the same time, around 9 a.m. Despite warnings to stay inside, some residents pulled to the side of a road to watch the blast upwind from the Iowa Army Ammunition Plant in Middletown.\n\nSchools that weren't already closed for the Thanksgiving holiday canceled classes, and a gas station near the detonation site posted a note on the front door saying they'd be back open once it's safe. Some residents sealed their windows and doors as a precaution.\n\nThe blast originally was planned for last Friday. The Army changed the detonation date three times amid public backlash and to allow more time for safety measures and favorable wind, according to court documents.\n\nThe weather forecast around the time of the blast called for a gentle breeze to the southwest and temperatures around the freezing mark \u2014 one of the concerns has been that the stockpile will become volatile as temperatures drop.\n\n\"Inaction is no longer an option,\" said Maj. Gen. Eric Shirley, the Army's leader of the operation.\n\nGovernment officials encouraged residents within 5 miles (8 kilometers) of the site to evacuate to avoid lead dust in the air, while also assuring them that barriers around the blast zone should limit much of the plume from the detonation.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 10:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks Swoon as AI Fears Spur Rush to Treasuries: Markets Wrap - Bloomberg.com", "full_content": "Stocks Swoon as AI Fears Spur Rush to Treasuries: Markets Wrap Bloomberg.com Treasury Yields Extend Fall After U.S. Data Flurry WSJ 10-year Treasury yield slides despite sticky inflation data as investors buy bonds for protection CNBC Rates Spark: Treasuries with blinkers on ing think Treasury yields drop as stock-market worries drive investors toward safety MarketWatch", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 10:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Drive-By Firing Outside Jewellery Store In Mumbai's Mahim Sparks Panic. What Police Know So Far", "full_content": "Unidentified assailants fired five to six rounds at the jewellery store located next to Shobha Hotel, triggering panic in the area.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pay Extra For Gutkha, Get Money Back: Delhi Plans Deposit Scheme For Plastic Bottles, Tobacco Packets", "full_content": "The Delhi government is considering including PET bottles and packaging used for khaini and gutkha in its proposed deposit return scheme. The initiative aims to improve recycling and reduce plastic waste.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "'He Looks Nice': Donald Trump Backs Robert Pattinson As New 007, Asks 'Is James Bond A Conservative?'", "full_content": "Donald Trump has wished Robert Pattinson luck as the new James Bond and asked if 007 is conservative. He also revisited his 2012 tweet about Pattinson and Kristen Stewart\u2019s relationship.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Merger First, No Listing Promise To RBI: Noel Tata Objects To Tata Sons' Nov 30 Board Agenda", "full_content": "Noel Tata has objected to the sequencing of Tata Sons' November 30 board agenda, seeking deliberations on the SP Group financing and merger proposals before any RBI listing commitment.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "There are 5,100 newly minted Anthropic millionaires\u2014here\u2019s all the stuff they don\u2019t tell you about when you suddenly get rich", "full_content": "Things are about to get very weird for the thousands of employees of Anthropic who just became, or soon will become, multi-millionaires.\n\nAnthropic's IPO on Nov. 19 turned around 5,100 non-founder \"Ants,\" as the company's staffers are known, into \"paper millionaires,\" and at least 400 will be worth north of $100 million.\n\nFew of us will ever make a million-dollar windfall from an employer. And fewer still will win the lottery or magically land a massive sum from an estranged rich uncle. But don't be too jealous of these employees' gains. Sure, money can buy a lot \u2014 and it would be hard to say no if you do strike it rich \u2014 but there are a remarkable number of downsides to sudden wealth.\n\nAnd they may explain why you likely won't see all of Anthropic's newly minted millionaire employees heading for the exits.\n\nFirst of all, these new moguls won't be able to access all their wealth immediately. The terms of the stock sale outlined in Anthropic's revised S-1 allow employees to cash out up to 10% of the value of their holdings on the first day of trading following the date of the prospectus, but the rest can only be exercised after various vesting periods pass or lock-up terms are achieved, based on the individual's agreements with the company.\n\nSome won't be able to realize all their gains for years. There are many financial institutions willing to lend based on paper gains, or to buy options \u2014 but their wealth will also continue to fluctuate with the rise and fall of the company's stock price.\n\nEven after those riches become liquid, research shows that only a small but still significant percentage of employees will, in fact, leave as a direct result of their new wealth. No, they aren't jetting off to the South Pacific to board their new yacht \u2014 which is what I would do in my \"I just got $10 million\" fantasy.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 10:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "MCX gold plunges \u20b94,420/10g, silver sheds nearly \u20b98,800/kg as PCE data fuels December Fed rate hike bets", "full_content": "The sell-off in precious metals, gold and silver, accelerated in Wednesday's trade as the latest PCE inflation data reinforced expectations of US Federal Reserve rate hikes in December, making non-yielding assets such as precious metals less attractive to investors.\n\nIn addition, a sharp rally in the US dollar is weighing on the recovery in precious metals, as a stronger greenback makes dollar-denominated commodities more expensive for holders of other currencies.\n\nMCX gold futures dropped another \u20b9 4,423, or 3.6%, to \u20b9 1,17,906 per 10 grams in trade, their lowest level in more than a year. The latest decline widened the metal's November losses to \u20b9 20,435, putting the yellow metal on track for one of its steepest monthly declines in recent times.\n\nSilver futures on the MCX crashed another \u20b9 8,800 per kg to \u20b9 1,36,712, their lowest level since September 2025. Wednesday's decline followed a fall of \u20b9 8,779 in the previous session, taking the white metal's losses to nearly \u20b9 1 lakh in 2026.\n\nThe personal consumption expenditures (PCE) price index, the Fed's preferred inflation gauge, showed an annual inflation rate of 3.8% on a seasonally adjusted basis in October.\n\nThe data reinforced bets the Fed will hike rates by at least 25 basis points before the end of 2026. Inflation has remained above the central bank's 2% target for around 5\u00bd years.\n\nRate hike expectations have also boosted demand for the US dollar, while the greenback is also drawing support from an AI-driven sell-off in global equities, causing it rebound to 104 against a basket of currencies.\n\nApart from rate hike concerns and a stronger dollar, precious metals are also facing additional pressure from liquidity constraints amid a broader sell-off in technology stocks, fuelled by persistent concerns surrounding the artificial intelligence trade.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 09:57 PM IST", "pub_date_relative": "1h ago"}, {"title": "Maharashtra Cabinet approves free foodgrains for 42.30 lakh farmers, Rs 5,548 crore for Narmada-Tapi project", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Maharashtra Cabinet approves free foodgrains for 42.30 lakh farmers, Rs 5,548 crore for Narmada-Tapi project The Economic Times daily newspaper is available online now. Read Today's Paper Maharashtra Cabinet approves free foodgrains for 42.30 lakh farmers, Rs 5,548 crore for Narmada-Tapi project SECTIONS Maharashtra Cabinet approves free foodgrains for 42.30 lakh farmers, Rs 5,548 crore for Narmada-Tapi project ANI Last Updated: Nov 25, 2026, 09:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Maharashtra Cabinet on Wednesday approved free foodgrains for 42.30 lakh farmers, \u20b95,548 crore for the Narmada-Tapi Valley Diversion Project and a draft bill to regulate private aided schools, among 14 decisions taken at the meeting.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 09:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks sell-off deepens as AI trade cracks", "full_content": "Tech-heavy Nasdaq 100 falls more than 4% as weeks-long slide continues", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 09:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "India-UK investment treaty talks stall, pact unlikely soon, officials say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-UK investment treaty talks stall, pact unlikely soon, officials say The Economic Times daily newspaper is available online now. Read Today's Paper India-UK investment treaty talks stall, pact unlikely soon, officials say SECTIONS India-UK investment treaty talks stall, pact unlikely soon, officials say Reuters Last Updated: Nov 25, 2026, 09:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The prospect of India pursuing a bilateral investment treaty with the UK appears grim, primarily because of enduring disputes related to taxation and arbitration. Talks have hit a snag, with both countries entrenched in contrasting views on investor protection and sovereignty. Future discussions will divert from the investment treaty, concentrating on economic dialogues instead.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 09:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "10-year Treasury yield slides despite sticky inflation data as investors buy bonds for protection", "full_content": "U.S. Treasury yields fell on Wednesday, with investors fleeing to bonds for protection after October's personal consumption expenditures price index showed that inflation continued to accelerate.\n\nThe 10-year Treasury note yield \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 was more than 9 basis points lower at 4.809%.\n\nThe yield on the 2-year Treasury note, which typically moves in line with short-term Federal Reserve interest rate decisions, was down more than 8 basis points at 4.588%.\n\nThe longer-dated 30-year Treasury yield, which tends to track geopolitical events, was more than 7 basis points lower at 5.213%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe personal consumption expenditures price index \u2014 the Federal Reserve's preferred gauge of underlying inflation \u2014 rose 3.8% year over year for October, in line with the Dow Jones consensus estimate. Separately, economic growth came in much stronger for the third quarter. Gross domestic product rose at a 4.3% annualized rate, according to a revised Commerce Department estimate.\n\nThe data reinforced expectations for another Fed rate hike in December.\n\n\"[I]t is more urgent than ever that Fed officials step up the pace of interest rate hikes to cool off economic demand,\" said Chris Rupkey, chief economist at FWDBONDS. \"Rate hikes are coming. Lots of them. Bet on it. The economy and inflation are literally on fire.\"", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 09:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "WhatsApp Introduces Scheduled Messages: How To Send Texts Up To 14 Days Later", "full_content": "Users can line up a message anywhere from 10 minutes to two weeks in advance, in both personal and group chats. The message will be delivered on time even if the sender's phone is switched off.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 09:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Even the price of toys is on the rise. How Americans are scaling back holiday plans", "full_content": "As Amanda Brecht planned how her family would spend Thanksgiving this year, she had to make some difficult decisions.\n\nBecause of high gas prices , the 30-year-old decided she wouldn't drive across her home state of Michigan to celebrate with extended family. Instead, Brecht and her husband will spend the holiday with just their three kids. And with food prices rising, they'll be skipping appetizers and serving turkey breast instead of a whole bird.\n\n\"Thanksgiving is definitely going to look different this year,\" Brecht said. \"Money doesn't grow on trees. You can only do so much.\"\n\nWith inflation accelerating, Americans like Brecht will see higher prices almost everywhere they look this holiday season . At a time of year synonymous with food, gifts and big spending, many consumers are instead pinching pennies, paring back their plans and making tough choices about how they'll celebrate.\n\nSome are raiding their savings accounts and running up debt on credit cards. They're reporting downbeat outlooks about the economy in surveys. And they've become more selective with spending as inflationary pressures mount.\n\n\"Families are facing some tough choices this year,\" said Alexander Smith, an associate professor who researches behavioral economics at the Worcester Polytechnic Institute. \"They might have to cut back on holiday spending in whatever way that they can.\"\n\nA classic Thanksgiving feast will be harder to pull off as grocery prices rise.\n\nThe price of a 10-person Thanksgiving dinner increased 6% to $58.63 in 2026, according to an annual survey from the American Farm Bureau Federation. Faith Parum, the organization's deputy chief economist, said the price increase was a result of higher costs for labor and transportation.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 09:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold loan market grows 61% to \u20b923.3 lakh crore as borrowers take bigger loans against jewellery amid rising gold prices", "full_content": "India's gold loan market is witnessing a shift in how borrowers use credit, with pledged jewellery increasingly serving as a source of funds for business requirements and planned expenses rather than just a financial safety net during emergencies. Small-business owners are turning to gold-backed loans to meet working-capital needs, while rising gold prices are allowing borrowers to access larger amounts against their existing jewellery.\n\nThe shift is reflected in the sharp expansion of the market. India's outstanding gold loan portfolio grew 60.6% year-on-year to \u20b9 23.3 lakh crore in September 2026, accounting for 12.6% of the country's retail credit portfolio, according to CRIF Credit Information Services data. Gold loans' share of retail credit increased by 3.3 percentage points over the year.\n\nThe number of active gold loan accounts also rose 14% to 10.2 crore during the period. However, the value of outstanding loans is growing considerably faster than the number of accounts, indicating that borrowers are increasingly accessing larger amounts of credit.\n\nThe average gold loan ticket size increased 32.7% year-on-year to \u20b9 2.2 lakh in the second quarter of FY27. Loan originations by value rose 27.2% to \u20b9 8.15 lakh crore, even as the number of loans originated declined 4.1% to 3.69 crore.\n\nLarger loans are driving a significant part of this growth. Loans above \u20b9 2.5 lakh accounted for 67.1% of gold loan origination value, while loans of \u20b9 5 lakh and above contributed around 40%. However, these larger loans represented only 10% of the total loan volumes.\n\nRising gold prices have contributed to this trend by increasing the value of jewellery that borrowers can pledge. This allows households and business owners to raise more funds without having to sell their gold.\n\nThe changing usage of gold loans is also important.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 09:45 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Who Is Sanjay Mehrotra? The Indian-Origin Micron CEO Whose Security Costs Just Jumped 2,000%", "full_content": "Micron CEO Sanjay Mehrotra's security expenses surged 2,000% to $764,748 in FY26 as the AI-driven chipmaker's valuation soared. Here's a look at his journey and wealth.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 11:29 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks making the biggest moves midday: HP Inc, Ambarella, Nvidia, Sandisk & more", "full_content": "HP Inc bucked the tech sell-off on Wednesday, rising after fourth-quarter earnings beat estimates. The manufacturer of computers also lifted its dividend.\n\nThe artificial intelligence slide continued, though key stocks in that trade were off their lows in the afternoon. AI bellwether Nvidia slumped, as did shares of Micron and Sandisk.\n\nElsewhere, semiconductor designer Ambarella tanked on the back of a bleak outlook for revenue.\n\nFollow along as CNBC highlights the biggest stock moves of the day.\n\nStocks linked to the AI trade rose from their session lows but remained negative on the day.\n\nThe Nasdaq Composite was down just 2.1% on the day, an improvement from earlier in the session when it was down 4.6%.\n\nNasdaq Composite on Wednesday CoreWeave was trading nearly 6% lower midday, while AI bellwether Nvidia was off almost 7%. Memory plays Micron and Sandisk lost close to 9% and 10% on the day.\n\nThe payroll services company saw shares rise after Wedbush began coverage of the stock, giving it a rating of outperform.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 11:27 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buy, Sell Or Hold: Samvardhana Motherson, ITC, IRCTC, Hitachi Energy India, Shriram Finance And HDFC Bank \u2014 Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks such as, ITC, IRCTC, Shriram Finance and HDFC Bank.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 11:27 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Treasury financial crime watchdog hit by suspected cyber attack", "full_content": "FinCen takes systems offline after detecting unauthorised access amid growing fears over vulnerability of technology systems", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 11:15 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nasdaq 100 plunges nearly 5%, briefly enters bear-market zone as AI fears and fresh tariffs hit sentiment", "full_content": "The technology-heavy Nasdaq 100 index slumped for a second consecutive session on Wednesday, briefly slipping into bear-market territory, as investors continued to dump AI-linked stocks amid mounting concerns over excessive investments in the sector and rising borrowing costs, while fresh US data showed inflation accelerating in October.\n\nInvestor sentiment was also dented by the Trump administration's proposed new tariffs on 14 trading partners, including the European Union and China. The Nasdaq Composite plunged nearly 5% during the session, while the Nasdaq 100 briefly fell 20% from its record closing high in October, the threshold commonly used to define a bear market.\n\nOther key indices, including the S&P 500 and Dow Jones Industrial Average, also came under pressure, falling 3.2% and 2.20%, respectively, at 11:30 a.m. ET. The Nasdaq and S&P 500 remained on track for their worst November since the 2008 global financial crisis.\n\nChipmakers led the declines, with Nvidia plunging 8.7%, while the Philadelphia Semiconductor Index dropped 7.3%. Among other major technology stocks, Alphabet fell 5%, and Amazon shed 5.4%, while Microsoft and Apple declined 3% and 1.7%, respectively.\n\nAnthropic, the company behind the Claude AI chatbot, slipped another 2.1% after closing below its $83 initial public offering (IPO) price for the first time on Tuesday. The stock had briefly surged to $115 during its first day of trading last week amid a frenzy of AI-driven enthusiasm.\n\nThe US markets, which had scaled multiple record highs this year, have come under sustained pressure as fund managers reassess their exposure to the AI trade amid concerns over whether the debt-fuelled AI boom can generate sufficient returns to justify massive investments.\n\nJensen Huang's return as Nvidia CEO after his removal earlier this month provided a temporary reprieve at the start of the week.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 11:13 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Analysis-Volatility-weary investors hammered as tariff mayhem adds to tech pain", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 11:12 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PM Modi Reviews 5 Key Projects Worth Rs 78,000 Crore: What The Centre Is Focusing On", "full_content": "Prime Minister Narendra Modi chaired the 55th PRAGATI meeting, reviewing five infrastructure projects worth over \u20b978,000 crore and the implementation of PM-SETU.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 11:12 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Kalshi traders say state data center moratoriums are more likely than not", "full_content": "On Wednesday morning, Kalshi traders put the probability above 55% that at least four states would adopt data center moratoriums this year.\n\nAfter Democrats swept Congress and key governor races during the midterm elections, Kalshi traders put the odds that at least four states would pause data center construction at about 75%. Since Nov. 22, the probability that at least four states would adopt moratoriums rose again, to 57% from 52%.\n\nThe contract asks \"How many states will adopt data center moratoriums this year?\" and will be verified from state governments. On July 14, New York became the first state to impose a one-year pause on certain state permits for hyperscale data centers. Various local governments have also ordered moratoriums on data centers this year.\n\nSen. Bernie Sanders, I-Vt., called for a national data center moratorium the day after the midterms on social media , signaling growing pushback against the build-out.\n\nMeanwhile, some investors say unease surrounding the artificial intelligence trade is partly an emotional or sentiment-driven reaction. Doug Clinton, founder and CEO of Intelligent Alpha, told CNBC's \" Closing Bell: Overtime \" the AI sell-off is psychological.\n\n\"I actually think it is difficult to point to some fundamental data point from here that all of a sudden would make investors okay,\" Clinton said.\n\nAI-related stocks slumped again Wednesday. Nvidia and Oracle slid more than 8%, while Anthropic tumbled 6% and Alphabet slid 5.5%.\n\nOn Friday, the S&P 500 and Dow Jones Industrial Average entered corrections, down 10% from their recent highs, while the Nasdaq Composite declined more than 5% following Anthropic's blockbuster public offering the day before.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 11:06 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Quantitative Methods", "Equity Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "ECB and Sveriges Riksbank conclude agreement for Sweden to join T2", "full_content": "The European Central Bank (ECB) and Sveriges Riksbank have concluded an agreement for Sweden to join T2, the Eurosystem\u2019s real-time gross settlement system. Today, ECB President Christine Lagarde and Sveriges Riksbank Governor Erik Thed\u00e9en took part in a signing ceremony for the T2 currency participation agreement at the ECB.\n\nThis agreement will enable Sveriges Riksbank to use T2 for settling large-value payments in Swedish kronor. Migration is targeted for February 2030.\n\nJoining T2 will move Sweden\u2019s large-value payment settlement from a national platform to shared European infrastructure. Sveriges Riksbank and Swedish financial institutions will benefit from investments in security, resilience and technological development that are shared across participating markets, as well as from common European standards. Payments will continue to be settled in Swedish kronor using central bank money.\n\n\u201cShared payment infrastructure strengthens Europe\u2019s strategic autonomy and supports a more integrated financial system,\u201d said ECB President Christine Lagarde. \u201cThis agreement builds on our partnership with Sveriges Riksbank and our joint commitment to safe and efficient payments.\u201d\n\n\u201cBy connecting to the European T2 platform for settling payments in Swedish kronor, we can, together with the ECB and other central banks, ensure that the Swedish settlement system becomes an even safer and more efficient payment system in the long run, both in everyday life and in a crisis,\u201d said Sveriges Riksbank Governor Erik Thed\u00e9en.\n\nTARGET Services are the Eurosystem\u2019s financial market infrastructure for settling large-value payments, instant payments and securities transactions, and for managing collateral. In addition to payments in euro, T2 already supports large-value payments in Danish kroner.", "source": "ECB Press", "pub_date_str": "25 Nov 2026, 11:00 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia sellers seek new buyers as U.S. curbs China AI chip access, sources tell CNBC", "full_content": "Nvidia chip sellers are seeking new buyers for the semiconductor giant's hardware, three people told CNBC, after the Trump administration tightened rules to curb Chinese companies' remote access to the most advanced artificial-intelligence systems.\n\nCompanies have put an unusually high volume of Nvidia graphics processing units, or GPUs, on the market since new measures restricting Chinese companies renting access to advanced Nvidia chips were announced on Nov. 16, the people said.\n\nJack Duhamel, president of AI infrastructure marketplace GPU Mart, and two people familiar with the matter told CNBC the surge in GPUs for sale was directly attributable to the new rule. Duhamel added that one company looking to sell Nvidia chips told GPU Mart the sale was related to the new rule.\n\nThe two people said it appeared chip sellers were seeking to offload them because they were originally for use in data centers in which Chinese companies would rent access. They asked not to be named because they were discussing private information.\n\nThe Department of Commerce's Bureau of Industry and Security, or BIS, announced an interim final rule as part of a clampdown on Chinese companies bypassing export controls, which effectively ban the sale of the most advanced Nvidia chips to China, by accessing them remotely in overseas data centers. The rule came into effect on Nov. 19.\n\nDeals to find buyers for thousands of B300 GPUs, one of Nvidia's most advanced offerings, have been floated since the rule was announced, said Duhamel and one of the people.\n\nNvidia declined to comment. BIS did not immediately respond to a request for comment.\n\nNvidia has been facing increasing scrutiny from U.S. lawmakers over Chinese companies' access to its advanced chips.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 10:58 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Grupo Galicia Q3 2026 slides: EPS misses as margins compress in lower-rate shift", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 10:56 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Today: Nasdaq Opens Over 3% Lowe as Confidence in AI Trade Weakens \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Opens Over 3% Lowe as Confidence in AI Trade Weakens \u2014 Live Updates WSJ Dow turns positive on the day as Wall Street attempts sell-off recovery: Live updates CNBC Stock market today: Dow, S&P 500, Nasdaq sink on hot inflation, new Trump tariffs as chip rout continues Yahoo Finance Stock Sell-Off Continues as Investors Fret About A.I., Tariffs and Inflation The New York Times US stocks sell-off deepens as AI trade cracks Financial Times", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 10:56 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gemini's New Google Messages Feature Can Alert You About Deals, Travel And Deliveries", "full_content": "A new beta of Google Messages reportedly links its Gemini button to Gemini Channels, letting the assistant start chats with users. The feature is said to be limited to the US for now.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:54 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Revaz Shmertz Examines Who Pays for Stablecoin Yield at Stable Summit IV", "full_content": "", "source": "Investing.com News", "pub_date_str": "25 Nov 2026, 10:48 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Gold, Silver Rates Updates: Gold Drops Below $3,500 An Ounce To Lowest Since Sept. 2025", "full_content": "Gold price dipped slightly to Rs 1,22,250 per 10 grams in early trade on Wednesday as per MCX data.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:47 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Spider-Man In Avengers: Doomsday? Robert Downey Jr's Thanksgiving Post Sparks Fan Speculation", "full_content": "The 'P--er' reference could point to Peter Parker, raising speculation about Spider-Man's possible appearance. Tobey Maguire has also been linked to the film through unconfirmed reports.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:45 PM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Nvidia leads tech sell-off as Huang comeback rally fizzles and AI concerns return", "full_content": "Technology stocks plunged on Wednesday as excitement over Nvidia CEO Jensen Huang 's return faded and failed to calm mounting concerns over the sustainability of the artificial intelligence trade.\n\nThe tech-heavy Nasdaq Composite dropped nearly 4%. Semiconductor stocks dragged on the index, and the VanEck Semiconductor ETF that tracks the sector plummeted 7%.\n\nAfter notching one of its best days on record Monday, Nvidia has fallen in the days since and slumped 8% Wednesday. Advanced Micro Devices , Micron Technology , Marvell Technology and Intel all dropped more than 9%, with some plunging further.\n\nHuang's return to Nvidia on Monday briefly revived appetite for tech stocks but didn't fully calm investor concerns over the high costs tied to the AI build-out and worries of a potential slowdown.\n\nNvidia stock chart Other stocks tied to the AI trade also plummeted. Oracle dropped 8% and CoreWeave and Nebius sank more than 10% each.\n\nWednesday's declines also came as Wall Street digested a hot inflation reading that fueled concerns that higher interest rates could dent demand for growth stocks, including tech.\n\nAmazon , Tesla and Alphabet each declined about 5%. Microsoft lost more than 2% and Meta traded marginally lower.", "source": "CNBC World Economy", "pub_date_str": "25 Nov 2026, 10:40 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Prediction markets push OpenAI IPO expectations later into 2027", "full_content": "Anthropic's shaky performance on the public markets since its debut last week and a continuing tech sell-off may be changing the outlook for when prediction markets think OpenAI will go public.\n\nSpeculators on prediction market platform Kalshi think there's a roughly 28% chance the ChatGPT developer officially announces an IPO by June 2027. That figure was most recently above 50% earlier this month.\n\nEven by October 2027, odds are still only 50-50 that the private company \u2014 most recently conducting a funding round at a $1.25 trillion valuation \u2014 will make its move to the public markets.\n\nKalshi defines officially announcing an IPO as either the Securities and Exchange Commission declaring an S-1 form as effective, the IPO being priced or an exchange has assigned a ticker to the company. Contracts are resolved using reports from media outlets.\n\nOpenAI confidentially filed for an IPO in June, but then in an interview with Fortune published in September CEO Sam Altman ruled out a 2026 public markets debut as questions over artificial intelligence safety grew.\n\nThe company's chief rival, Anthropic, debuted on the public markets last week. However, the stock has declined nearly 30% from its peak during its first trading session, and on Tuesday it closed below its IPO price of $83 .\n\nMeanwhile, a perpetual futures contract for OpenAI on Hyperliquid has tumbled more than 30% since highs in early October. In late October, OpenAI pared back its goal for its recent funding round to $20 billion from $30 billion.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Finance", "pub_date_str": "25 Nov 2026, 10:38 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Trade Setup For Nov. 26: Nifty Wipes 2026 Losses; Can Bulls Win The Crucial 26,000 Test?", "full_content": "Trade Setup For Nov. 26: Nifty witnessed a strong recovery after profit booking, reclaiming the crucial 25,650 mark. Going forward, some consolidation and volatility should be considered healthy rather than a reason to turn structurally cautious, as per analysts.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:23 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "No More Omelettes, Sandwiches? IRCTC Changes Food Menu On 3 Vande Bharat Sleeper Trains", "full_content": "IRCTC has reduced food options on three Vande Bharat Sleeper trains, removing items such as omelettes, sandwiches and sweets from the menu.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:22 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stocks Swoon as AI Fears Spur Rush to Treasuries: Markets Wrap - Bloomberg.com", "full_content": "Stocks Swoon as AI Fears Spur Rush to Treasuries: Markets Wrap Bloomberg.com Treasury Yields Extend Fall After U.S. Data Flurry WSJ 10-year Treasury yield slides despite sticky inflation data as investors buy bonds for protection CNBC Rates Spark: Treasuries with blinkers on ing think Treasury yields drop as stock-market worries drive investors toward safety MarketWatch", "source": "Google News Business", "pub_date_str": "25 Nov 2026, 10:11 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "'He Looks Nice': Donald Trump Backs Robert Pattinson As New 007, Asks 'Is James Bond A Conservative?'", "full_content": "Donald Trump has wished Robert Pattinson luck as the new James Bond and asked if 007 is conservative. He also revisited his 2012 tweet about Pattinson and Kristen Stewart\u2019s relationship.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Merger First, No Listing Promise To RBI: Noel Tata Objects To Tata Sons' Nov 30 Board Agenda", "full_content": "Noel Tata has objected to the sequencing of Tata Sons' November 30 board agenda, seeking deliberations on the SP Group financing and merger proposals before any RBI listing commitment.", "source": "NDTV Profit", "pub_date_str": "25 Nov 2026, 10:06 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "There are 5,100 newly minted Anthropic millionaires\u2014here\u2019s all the stuff they don\u2019t tell you about when you suddenly get rich", "full_content": "Things are about to get very weird for the thousands of employees of Anthropic who just became, or soon will become, multi-millionaires.\n\nAnthropic's IPO on Nov. 19 turned around 5,100 non-founder \"Ants,\" as the company's staffers are known, into \"paper millionaires,\" and at least 400 will be worth north of $100 million.\n\nFew of us will ever make a million-dollar windfall from an employer. And fewer still will win the lottery or magically land a massive sum from an estranged rich uncle. But don't be too jealous of these employees' gains. Sure, money can buy a lot \u2014 and it would be hard to say no if you do strike it rich \u2014 but there are a remarkable number of downsides to sudden wealth.\n\nAnd they may explain why you likely won't see all of Anthropic's newly minted millionaire employees heading for the exits.\n\nFirst of all, these new moguls won't be able to access all their wealth immediately. The terms of the stock sale outlined in Anthropic's revised S-1 allow employees to cash out up to 10% of the value of their holdings on the first day of trading following the date of the prospectus, but the rest can only be exercised after various vesting periods pass or lock-up terms are achieved, based on the individual's agreements with the company.\n\nSome won't be able to realize all their gains for years. There are many financial institutions willing to lend based on paper gains, or to buy options \u2014 but their wealth will also continue to fluctuate with the rise and fall of the company's stock price.\n\nEven after those riches become liquid, research shows that only a small but still significant percentage of employees will, in fact, leave as a direct result of their new wealth. No, they aren't jetting off to the South Pacific to board their new yacht \u2014 which is what I would do in my \"I just got $10 million\" fantasy.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 10:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "MCX gold plunges \u20b94,420/10g, silver sheds nearly \u20b98,800/kg as PCE data fuels December Fed rate hike bets", "full_content": "The sell-off in precious metals, gold and silver, accelerated in Wednesday's trade as the latest PCE inflation data reinforced expectations of US Federal Reserve rate hikes in December, making non-yielding assets such as precious metals less attractive to investors.\n\nIn addition, a sharp rally in the US dollar is weighing on the recovery in precious metals, as a stronger greenback makes dollar-denominated commodities more expensive for holders of other currencies.\n\nMCX gold futures dropped another \u20b9 4,423, or 3.6%, to \u20b9 1,17,906 per 10 grams in trade, their lowest level in more than a year. The latest decline widened the metal's November losses to \u20b9 20,435, putting the yellow metal on track for one of its steepest monthly declines in recent times.\n\nSilver futures on the MCX crashed another \u20b9 8,800 per kg to \u20b9 1,36,712, their lowest level since September 2025. Wednesday's decline followed a fall of \u20b9 8,779 in the previous session, taking the white metal's losses to nearly \u20b9 1 lakh in 2026.\n\nThe personal consumption expenditures (PCE) price index, the Fed's preferred inflation gauge, showed an annual inflation rate of 3.8% on a seasonally adjusted basis in October.\n\nThe data reinforced bets the Fed will hike rates by at least 25 basis points before the end of 2026. Inflation has remained above the central bank's 2% target for around 5\u00bd years.\n\nRate hike expectations have also boosted demand for the US dollar, while the greenback is also drawing support from an AI-driven sell-off in global equities, causing it rebound to 104 against a basket of currencies.\n\nApart from rate hike concerns and a stronger dollar, precious metals are also facing additional pressure from liquidity constraints amid a broader sell-off in technology stocks, fuelled by persistent concerns surrounding the artificial intelligence trade.", "source": "LiveMint Markets", "pub_date_str": "25 Nov 2026, 09:57 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Maharashtra Cabinet approves free foodgrains for 42.30 lakh farmers, Rs 5,548 crore for Narmada-Tapi project", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Maharashtra Cabinet approves free foodgrains for 42.30 lakh farmers, Rs 5,548 crore for Narmada-Tapi project The Economic Times daily newspaper is available online now. Read Today's Paper Maharashtra Cabinet approves free foodgrains for 42.30 lakh farmers, Rs 5,548 crore for Narmada-Tapi project SECTIONS Maharashtra Cabinet approves free foodgrains for 42.30 lakh farmers, Rs 5,548 crore for Narmada-Tapi project ANI Last Updated: Nov 25, 2026, 09:55:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Maharashtra Cabinet on Wednesday approved free foodgrains for 42.30 lakh farmers, \u20b95,548 crore for the Narmada-Tapi Valley Diversion Project and a draft bill to regulate private aided schools, among 14 decisions taken at the meeting.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 09:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US stocks sell-off deepens as AI trade cracks", "full_content": "Tech-heavy Nasdaq 100 falls more than 4% as weeks-long slide continues", "source": "FT Markets", "pub_date_str": "25 Nov 2026, 09:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "India-UK investment treaty talks stall, pact unlikely soon, officials say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-UK investment treaty talks stall, pact unlikely soon, officials say The Economic Times daily newspaper is available online now. Read Today's Paper India-UK investment treaty talks stall, pact unlikely soon, officials say SECTIONS India-UK investment treaty talks stall, pact unlikely soon, officials say Reuters Last Updated: Nov 25, 2026, 09:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The prospect of India pursuing a bilateral investment treaty with the UK appears grim, primarily because of enduring disputes related to taxation and arbitration. Talks have hit a snag, with both countries entrenched in contrasting views on investor protection and sovereignty. Future discussions will divert from the investment treaty, concentrating on economic dialogues instead.\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nHidden export winners: The unlikely products finding real buyers abroad\n\nIndia\u2019s USD25 bn copper drive moves from building smelters to securing mines\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Nov 2026, 09:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "10-year Treasury yield slides despite sticky inflation data as investors buy bonds for protection", "full_content": "U.S. Treasury yields fell on Wednesday, with investors fleeing to bonds for protection after October's personal consumption expenditures price index showed that inflation continued to accelerate.\n\nThe 10-year Treasury note yield \u2014 the main benchmark for mortgages, auto loans and credit card debt \u2014 was more than 9 basis points lower at 4.809%.\n\nThe yield on the 2-year Treasury note, which typically moves in line with short-term Federal Reserve interest rate decisions, was down more than 8 basis points at 4.588%.\n\nThe longer-dated 30-year Treasury yield, which tends to track geopolitical events, was more than 7 basis points lower at 5.213%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nThe personal consumption expenditures price index \u2014 the Federal Reserve's preferred gauge of underlying inflation \u2014 rose 3.8% year over year for October, in line with the Dow Jones consensus estimate. Separately, economic growth came in much stronger for the third quarter. Gross domestic product rose at a 4.3% annualized rate, according to a revised Commerce Department estimate.\n\nThe data reinforced expectations for another Fed rate hike in December.\n\n\"[I]t is more urgent than ever that Fed officials step up the pace of interest rate hikes to cool off economic demand,\" said Chris Rupkey, chief economist at FWDBONDS. \"Rate hikes are coming. Lots of them. Bet on it. The economy and inflation are literally on fire.\"", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 09:50 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Even the price of toys is on the rise. How Americans are scaling back holiday plans", "full_content": "As Amanda Brecht planned how her family would spend Thanksgiving this year, she had to make some difficult decisions.\n\nBecause of high gas prices , the 30-year-old decided she wouldn't drive across her home state of Michigan to celebrate with extended family. Instead, Brecht and her husband will spend the holiday with just their three kids. And with food prices rising, they'll be skipping appetizers and serving turkey breast instead of a whole bird.\n\n\"Thanksgiving is definitely going to look different this year,\" Brecht said. \"Money doesn't grow on trees. You can only do so much.\"\n\nWith inflation accelerating, Americans like Brecht will see higher prices almost everywhere they look this holiday season . At a time of year synonymous with food, gifts and big spending, many consumers are instead pinching pennies, paring back their plans and making tough choices about how they'll celebrate.\n\nSome are raiding their savings accounts and running up debt on credit cards. They're reporting downbeat outlooks about the economy in surveys. And they've become more selective with spending as inflationary pressures mount.\n\n\"Families are facing some tough choices this year,\" said Alexander Smith, an associate professor who researches behavioral economics at the Worcester Polytechnic Institute. \"They might have to cut back on holiday spending in whatever way that they can.\"\n\nA classic Thanksgiving feast will be harder to pull off as grocery prices rise.\n\nThe price of a 10-person Thanksgiving dinner increased 6% to $58.63 in 2026, according to an annual survey from the American Farm Bureau Federation. Faith Parum, the organization's deputy chief economist, said the price increase was a result of higher costs for labor and transportation.", "source": "CNBC Top News", "pub_date_str": "25 Nov 2026, 09:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold loan market grows 61% to \u20b923.3 lakh crore as borrowers take bigger loans against jewellery amid rising gold prices", "full_content": "India's gold loan market is witnessing a shift in how borrowers use credit, with pledged jewellery increasingly serving as a source of funds for business requirements and planned expenses rather than just a financial safety net during emergencies. Small-business owners are turning to gold-backed loans to meet working-capital needs, while rising gold prices are allowing borrowers to access larger amounts against their existing jewellery.\n\nThe shift is reflected in the sharp expansion of the market. India's outstanding gold loan portfolio grew 60.6% year-on-year to \u20b9 23.3 lakh crore in September 2026, accounting for 12.6% of the country's retail credit portfolio, according to CRIF Credit Information Services data. Gold loans' share of retail credit increased by 3.3 percentage points over the year.\n\nThe number of active gold loan accounts also rose 14% to 10.2 crore during the period. However, the value of outstanding loans is growing considerably faster than the number of accounts, indicating that borrowers are increasingly accessing larger amounts of credit.\n\nThe average gold loan ticket size increased 32.7% year-on-year to \u20b9 2.2 lakh in the second quarter of FY27. Loan originations by value rose 27.2% to \u20b9 8.15 lakh crore, even as the number of loans originated declined 4.1% to 3.69 crore.\n\nLarger loans are driving a significant part of this growth. Loans above \u20b9 2.5 lakh accounted for 67.1% of gold loan origination value, while loans of \u20b9 5 lakh and above contributed around 40%. However, these larger loans represented only 10% of the total loan volumes.\n\nRising gold prices have contributed to this trend by increasing the value of jewellery that borrowers can pledge. This allows households and business owners to raise more funds without having to sell their gold.\n\nThe changing usage of gold loans is also important.", "source": "LiveMint Money", "pub_date_str": "25 Nov 2026, 09:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic's stock has been a clunker post-IPO. Why that matters for the AI trade", "full_content": "Shares of Anthropic are tr
