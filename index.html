<script>

    const allData = {"general": [{"title": "Piero Cipollone: Interview with Milano Finanza", "full_content": "Mr Cipollone, you have just attended a meeting of the Executive Committee of the Italian Banking Association. Was the digital euro one of the topics discussed?\n\nWe mainly talked about tokenisation. On the subject of the digital euro, I provided an update on the status of the debates on the legislation in Brussels and on the progress of our internal preparations within the Eurosystem.\n\nSince you joined the ECB, payments have become one of the main focus areas of your work. Why are they so important for Europe\u2019s future?\n\nBecause payments constitute a strategic infrastructure for Europe and, as a central bank, ensuring the smooth functioning of payment systems falls within our mandate. Whenever we buy something online or pay for a coffee, we think about the price of what we\u2019re buying. But we hardly ever think about how the payment is made. Yet if the payment system stops working, the economy stops working.\n\nYes. Today we can use money issued by the central bank only in the form of cash. But a growing share of our economic life takes place online, where banknotes can\u2019t be used. The digital euro fills this gap. It gives people the freedom to make payments using an instrument that is equivalent to cash in terms of its nature and characteristics, such as privacy and covering all payment needs, but which also works where cash can\u2019t be used.\n\nEver more purchases are being made online. In Italy, for example, according to the latest available data, online payments grew from 6% of the total in 2019 to 24% in 2024. And I expect they\u2019ve grown even more since then.\n\nThese online purchases are normally made via card payments and two thirds of these payments are made using non-European card schemes.", "source": "ECB Press", "pub_date_str": "24 Oct 2026, 11:30 AM IST", "pub_date_relative": "3m ago"}, {"title": "ICICI Bank, Indian Bank hike LiveMint Money", "pub_date_str": "24 Oct 2026, 11:12 AM IST", "pub_date_relative": "20m ago"}, {"title": "Reliance Jio Platforms IPO allotment status check online by PAN number on NSE India, BSE websites: Direct link, steps", "full_content": "Reliance Jio IPO Allotment : The subscription window for Reliance Jio Platforms\u2019 \u20b9 30,213-crore IPO has closed, with investors now awaiting the share allotment results scheduled for October 26, 2026. Applicants can check whether they have secured shares through the official portals of BSE , NSE or KFin Technologies, which is managing the IPO\u2019s allotment process.\n\nAs per the provisional schedule, the allotment status is expected to be declared on October 26. Once the status is released, investors can visit any of the three platforms to find out the outcome of their applications.\n\nShares will be credited to investors' demat accounts on October 27. Meanwhile, refunds for those investors who didn't get an allotment will also be processed the same day. Meanwhile, shares will be list on BSE and NSE on October 28.\n\nInvestors can follow these steps to check their application details through the National Stock Exchange :\n\nVisit the NSE IPO bid verification page: https://www.nseindia.com/invest/check-trades-bids-verify-ipo-bids\n\nApplicants can also use the Bombay Stock Exchange\u2019s online application-status facility:\n\nVisit the BSE IPO application status page: https://www.bseindia.com/investors/appli_check\n\nChoose the permitted identification option - PAN or application number.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 11:05 AM IST", "pub_date_relative": "27m ago"}, {"title": "Sebi orders Avadhut Sathe, academy to refund Rs 546 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi orders Avadhut Sathe, academy to refund Rs 546 crore The Economic Times daily newspaper is available online now. Read Today's Paper Sebi orders Avadhut Sathe, academy to refund Rs 546 crore SECTIONS Sebi orders Avadhut Sathe, academy to refund Rs 546 crore ET Bureau Last Updated: Oct 24, 2026, 11:01:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Securities and Exchange Board of India has directed Avadhut Sathe Trading Academy to refund \u20b9546.18 crore to investors. Avadhut Sathe and his academy provided unregistered investment advisory services under the pretext of education. The regulator found that misleading testimonials were circulated while concealing overall trading losses. A penalty of \u20b911.5 crore was imposed on Sathe and the academy for their actions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 11:01 AM IST", "pub_date_relative": "31m ago"}, {"title": "Bitcoin eyes $84,000 as whale withdrawals surge and institutional activity grows", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 10:55 AM IST", "pub_date_relative": "38m ago"}, {"title": "8th pay commission: Here's what ToR says on dearness allowance and govt's response to DA merger demands", "full_content": "The 8th central pay commission (CPC) is in its consultation stage, gathering inputs from central government employees and pensioner groups, unions and stakeholders before it makes its final recommendations in May next year.\n\nFormer Supreme Court Justice Ranjana Prakash Desai is the Chair, and the panel includes Member-Secretary \u2014 Pankaj Jain, a former IAS officer, and Member of the Commission \u2014 Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister.\n\nThe decisions are set to benefit more than 1 crore people, including around 50 lakh central government employees and about 65 lakh pensioners, including personnel and retirees with the defence and railway ministries.\n\nDearness allowance is a component of basic salary tied to inflation. It impacts the monthly pay of central government employees, public sector staff, defence personnel, bank employees and retired pensioners aimed at mitigating rising inflation.\n\nDA is revised twice annually based on the All-India Consumer Price Index ( AICPI ) formula as prescribed under the 7th central pay commission. Annually, the announcements are mostly made in March and October, with rollouts scheduled in January and July.\n\nThe Terms of Reference (ToR) of the 8th CPC outline what central government employees and pensioners can expect from its final recommendations.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 10:51 AM IST", "pub_date_relative": "41m ago"}, {"title": "Goldman Sachs Ola Electric Downgrade: Why stock rating changed to sell; 23% downside seen - New target price, rationale", "full_content": "Goldman Sachs Ola Electric downgrade : Goldman Sachs has turned bearish on Ola Electric Mobility , cutting its rating to Sell and reducing its price target sharply, as mounting concerns over cash flow, funding requirements and operational challenges cloud the electric two-wheeler maker\u2019s recovery prospects. The global investment bank has warned that the company faces a difficult path towards generating positive free cash flow, with high interest costs and substantial capital expenditure requirements adding to the pressure.\n\nGoldman Sachs lowered its target price to \u20b9 23 from \u20b9 39.28, implying a downside of 23% from Ola Electric\u2019s previous closing price of \u20b9 29.93. The brokerage also reduced its revenue estimates for FY27 to FY29 by up to 10%, citing a tougher market-share environment and expectations of prolonged operating losses.\n\nGoldman Sachs\u2019 downgrade reflects growing concerns over Ola Electric\u2019s growth prospects, financial sustainability and ability to navigate intensifying competition in the electric two-wheeler market.\n\nAccording to Goldman Sachs, Ola Electric would need a substantial acceleration in revenue to cover its capital expenditure and interest servicing requirements. Revenue during FY28 to FY30 would need to reach 3.6 times to 7.1 times FY26 levels to meet these obligations, it highlighted.\n\nThe scale of the challenge is underscored by the company\u2019s recent performance. Ola Electric\u2019s revenue in FY26 was 55% lower than its FY24 level, making the growth required over the coming years particularly demanding.\n\nMoreover, the brokerage expects operating losses, elevated interest expenses and investments across the electric two-wheeler (E2W) and battery-cell businesses to complicate efforts to generate positive free cash flow.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 10:50 AM IST", "pub_date_relative": "43m ago"}, {"title": "Athena Gold CEO Koby Kushner buys $3,534 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 10:45 AM IST", "pub_date_relative": "47m ago"}, {"title": "DA Hike 2026 UP Government Employees: Latest update, expectations on dearness allowance announcement", "full_content": "With central government employees waiting for the July 2026 dearness allowance (DA) hike, Uttar Pradesh government employees are also anticipating a possible increase in DA.\n\nOn October 23, the Himachal Pradesh government increased DA for eligible state government employees from 45% to 50%, a hike of five percentage points.\n\nThe increase covers employees under the Himachal Pradesh Civil Services (Revised Pay) Rules, 2022, eligible All India Services officers and state government employees covered by UGC pay scales.\n\nOn October 17, Kerala increased DA and dearness relief (DR) by two percentage points, from 35% to 37%. The revised rates will be paid with the October 2026 salary, disbursed in November.\n\nThe hike primarily covers state government employees, teachers, full-time contingent employees and local government staff. It also includes state service pensioners, family pensioners and eligible ex-gratia pensioners and their families.\n\nFollowing these recent hikes, state government employees in Uttar Pradesh are also anticipating a DA revision by the Chief Minister Yogi Adityanath.\n\nAccording to a Hindustan Times report dated May 22, 2026, \u201cThe Uttar Pradesh government has increased the dearness allowance (DA) by 2% for its employees, those working with aided educational institutions, technical education institutions, regular and full-time employees of local bodies, work-charge employees, those in UGC grades, as well as pensioners.\u201d\n\nThe DA hike, effective January 1, 2026, increased the rate from 58% to 60%. Uttar Pradesh State Employees Sanyukta Parishad president JN Tiwari said the increase would benefit around 28 lakh employees and pensioners, including 16.35 lakh employees and 11.53 lakh pensioners, Hindustan Times reported.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 10:40 AM IST", "pub_date_relative": "53m ago"}, {"title": "Anthropic IPO: What should investors consider when valuing the AI company? Aswath Damodaran explains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Anthropic IPO: What should investors consider when valuing the AI company? Aswath Damodaran explains Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic IPO: What should investors consider when valuing the AI company? Aswath Damodaran explains SECTIONS Anthropic IPO: What should investors consider when valuing the AI company? Aswath Damodaran explains By Kumar Gaurav , ETMarkets.com Last Updated: Oct 24, 2026, 10:33:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic is on track for an IPO expected in mid-November, reporting impressive revenues of $16.3 billion. However, the company faces a staggering net loss of over $80 billion for the year. Valuation expert Aswath Damodaran warns that IPO investor metrics can be erratic and heavily influenced by market sentiment. As Anthropic navigates an evolving business model, investors are advised to look beyond venture capital evaluations for a clearer understanding.\n\nAs Anthropic's IPO nears its target date, it it worth remembering that IPOs get priced, and that as a young company with growing revenues and big losses, that pricing will be based on metrics that are buzzy and unfamiliar, from eyeballs in the dotcom era to users in the social media decade to ARR with AI companies...https://t.co/5DXmDGcSTf\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 10:33 AM IST", "pub_date_relative": "59m ago"}, {"title": "Veralto president and CEO Jennifer Honeycutt sells $745,290 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Circle internet group cfo fox-geen disposes of $1.35m in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "yelp cfo david schwarzbach sells $150,000 in yelp shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 10:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "What a day in customer service looks like \u2014 as AI changes everything", "full_content": "For Kaylee Harris, who works in customer service for a credit card company, a day at work now looks very different.\n\nHer hours used to be filled with calls, note-taking and lengthy card disclosures. Now, thanks to artificial intelligence , she can focus more on each customer, Harris told CNBC.\n\nFor Shannon, AI has also changed things \u2014 but not in a good way. She works in customer service for a telecommunications company in Cardiff, Wales, and did not want to share her surname for fear of being identified by her employer. She told CNBC that AI-generated notes at her current workplace are often riddled with errors, \"so I just write my own.\"\n\nAt her previous employer, a property services company, senior management told staff to \"ChatGPT it\" if they didn't know the answer. AI agents booked appointments, but when they couldn't offer a customer the requested date, they passed the case to a human.\n\nStaff were \"constantly fighting fires,\" Shannon said. \"All the complicated cases came to us, causing a lot of burnout.\"\n\nIn theory, automation in customer service should mean human agents spend less time on admin and more time helping customers with problems that require human judgment, empathy and experience.\n\nNikola Mrk\u0161i\u0107, CEO and co-founder of London-headquartered PolyAI, which develops voice AI systems for customer service, said contact-center agents can face \"maximum abuse for minimum wage.\"\n\nThey often deal with frustrated customers while working under strict performance metrics, sometimes without the authority or information to resolve problems, he told CNBC. He sees AI agents as a way to help shoulder that load.", "source": "CNBC World Economy", "pub_date_str": "24 Oct 2026, 10:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Coforge Raises FY27 Margin Guidance As AI Changes Its Cost Equation", "full_content": "Chief Executive Sudhir Singh said the company aims to be among the top three tech services firms by EBIT margin in the short to medium term.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 10:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sunny Deol\u2019s Gabru To Feature Actor In Never-Seen-Before Avatar, Says Producer", "full_content": "The teaser of Gabru was shown during the screening of Batwara 1947. The movie features Sunny Deol alongside actor Simran.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 10:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "EPFO ECR deadline 31 Oct: How the new PF wage ceiling affects contributions & membership; What employers must know", "full_content": "Employers have up to 31 October to file the Electronic Challan-cum-Return (ECR) and deposit statutory provident fund (PF) contributions for September 2026. This deadline was initially set to end on 15 October but was extended until 31 October 2026, following the Employees\u2019 Provident Fund Organisation\u2019s (EPFO) revision of the EPF wage ceiling from \u20b9 15,000 to \u20b9 25,000 per month, effective from 17 September 2026.\n\nThe primary objective behind these changes is to meaningfully align employers and eligible employees with the benefits of EPFO. Now, this change requires employers to carefully review payroll systems, employee-wise contribution calculations and membership eligibility in order to ensure meaningful compliance with the revised rules and regulations.\n\nFurthermore, it is also vital to keep in mind that the ECR contains employee-wise wage and contribution details for the Employees\u2019 Provident Fund (EPF) , Employees\u2019 Pension Scheme (EPS), and Employees\u2019 Deposit Linked Insurance (EDLI).\n\nThat is why employers must ensure and follow through on the fact that applicable employee and employer contributions are correctly checked, calculated and deposited by the deadline.\n\nThe eventual impact of the revised wage ceiling will depend on how employers calculate PF contributions.\n\nThe revision in ceiling might also help in bringing eligible new employees earning above \u20b9 15,000 and up to \u20b9 25,000 per month under mandatory EPF coverage , subject to applicable membership rules and regulations.\n\nFurthermore, new employees earning above \u20b9 25,000 who are not already EPF members may continue to remain outside mandatory coverage if they qualify as excluded members. Finally, all existing members generally continue their membership when changing jobs.\n\nIn summary, with the 31 October deadline approaching, employers should carry out proper verification of employee eligibility, reconcile payroll records, and ensure accurate reporting of EPF, EPS, and EDLI details .", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 10:15 AM IST", "pub_date_relative": "1h ago"}, {"title": "'I Accidentally Killed A Dog': Reddit Reacts After Mumbai Man Shares Guilt Over Stray Dog's Death", "full_content": "A Mumbai man has turned to Reddit after a stray dog died following a kick in self-defence, leaving him guilty and facing backlash from society residents.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 10:09 AM IST", "pub_date_relative": "1h ago"}, {"title": "Digital Zero-Balance Savings Accounts Compared: Quantum+, Kotak 811, Slice, Airtel Payments Bank And Jio Payments Bank", "full_content": "Digital zero balance accounts are popular in India, offered by universal, small finance, and payments banks with varied features, interest rates, and services.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "For Tata Motors CV, The Commodity Bill Is Rising Faster Than Its Pricing Power", "full_content": "EBITDA rose 31% to about Rs 2,800 crore, but margin was 11.7%, down 90 basis points year-on-year and flat sequentially.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago"}, {"title": "Growth, value stocks set for reshuffle as S&P adopts new rules", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Growth, value stocks set for reshuffle as S&P adopts new rules Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Growth, value stocks set for reshuffle as S&P adopts new rules SECTIONS Growth, value stocks set for reshuffle as S&P adopts new rules By Lu Wang , Bloomberg Last Updated: Oct 24, 2026, 09:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis S&P Dow Jones Indices will soon change its rules for classifying growth and value shares. The new criteria will incorporate intangible assets, forward earnings, and free cash flow instead of relying on 12-month price momentum. These changes are expected to affect approximately $375 billion of passive funds linked to the index. FTSE Russell is also considering adjustments due to the dominance of technology companies.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 09:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "Heavy Rain Alert For Tamil Nadu, Karnataka; IMD Warns Of Cyclonic Storm On October 26", "full_content": "The Indian Meteorological Department has issued rainfall warnings for several states and union territories over the coming days. Widespread rainfall is forecast across Kerala, Mahe and Lakshadweep between October 24 and 25, coastal Andhra Pradesh and Yanam is likely to receive between October 25 and 28.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "Radhakishan Damani portfolio: Top 10 stock holdings of the ace investor", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Radhakishan Damani portfolio: Top 10 stock holdings of the ace investor Written by Debaroti Adhikary , ETMarkets.com | Oct 24, 2026, 09:46:54 AM IST 1 / 7 \u200bPortfolio Watch DMart founder and ace investor Radhakishan Damani is among India\u2019s richest stock market investors, with his family\u2019s net worth estimated at over $20 billion, according to Forbes. Popularly known as the \u201cretail king of India\u201d, the billionaire publicly holds 14 stocks. Here are his top 10 stock holdings by value, based on data from Trendlyne.\n\nAvenue Supermarts, operator of the DMart hypermarket chain, remains Radhakishan Damani\u2019s largest holding. He held a 67% stake as of September 30, 2026, valued at more than Rs 1.38 lakh crore, according to Trendlyne data. The stock has fallen around 18% in the past month and 15% in 2026 so far. It has declined more than 26% in one year, 14% in three years and over 30% in five years.\n\nNSE shares made their much-awaited market debut on September 24, listing at Rs 1,800 apiece on BSE. This marked a premium of less than 1% over the IPO price of Rs 1,785. Radhakishan Damani was one of the popular stakeholders in the company who sat out on the IPO, making NSE his second biggest stock holding after DMart in terms of holding value. He owns 1.6% stake worth Rs 6,527 crore.\n\nAlso read | NSE shares hit record low as IPO lock-in expiry frees up stake worth Rs 3,247 cr for trading. How has the stock performed since listing?\n\nDamani and his family acquired around a 2.4% stake in NBFC Sundaram Finance during the April-June quarter of FY27, which they kept unchanged in Q2 according to Trendlyne data. The stock has dropped around 151% in the past month and more than 25% in 2026 so far.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 09:41 AM IST", "pub_date_relative": "1h ago"}, {"title": "Reliance Jio Platforms IPO GMP, allotment date, listing date, time, overall subscription status; QIB, NII, Retail, RIL", "full_content": "Reliance Jio IPO allotment : Reliance Jio Platforms\u2019 \u20b9 30,213-crore initial public offering has concluded its subscription process, setting the stage for the allotment announcement on October 26, 2026. Investors who applied for shares will be able to verify their allotment through the official websites of BSE, NSE and KFin Technologies, the registrar to the issue.\n\nThe IPO, backed by Mukesh Ambani-led Reliance Industries Limited (RIL), attracted substantial investor interest during its three-day bidding window. Meanwhile, the reported grey market premium (GMP) of \u20b9 250 has indicated a potential listing price above the issue\u2019s upper price band.\n\nWhile the allotment is expected to be finalised on October 26, shares will be credited to investors' demat account on October 27. Meanwhile, refunds for those investors who didn't get allotment will also be processed the same day.\n\nThe company is scheduled to list on the stock exchanges BSE and NSE on October 28 at 10 am.\n\nThe allotment is expected to be finalised on October 26, according to the tentative timetable. Investors can use any of the following platforms to check their application status once the results are available.\n\nInvestors can follow these steps to check their application details through the National Stock Exchange :\n\nVisit the NSE IPO bid verification page: https://www.nseindia.com/invest/check-trades-bids-verify-ipo-bids\n\nApplicants can also use the Bombay Stock Exchange\u2019s online application-status facility:", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 09:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "BPCL reports 21.45% drop in Q2 FY27 net profit, attributes losses to fuel pricing issues", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a BPCL reports 21.45% drop in Q2 FY27 net profit, attributes losses to fuel pricing issues Bharat Petroleum Corporation Share Price Indian Oil Corporation Share Price Hindustan Petroleum Corporation Share Price The Economic Times daily newspaper is available online now. Read Today's Paper BPCL reports 21.45% drop in Q2 FY27 net profit, attributes losses to fuel pricing issues SECTIONS BPCL reports 21.45% drop in Q2 FY27 net profit, attributes losses to fuel pricing issues ET Bureau Last Updated: Oct 24, 2026, 09:32:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bharat Petroleum Corporation Limited (BPCL) has reported a 21.45% decline in consolidated net profit for Q2 FY27. The decline is attributed to atest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 09:00 AM IST", "pub_date_relative": "2h ago"}, {"title": "DA hike: Himachal Pradesh, Kerala, Telangana, Sikkim \u2014 Check full list of states with dearness allowance hikes this year", "full_content": "DA hikes in 2026: Dearness allowance and dearness relief (DA and DR) are updated biannually using data from the All India Consumer Price Index ( AICPI ), as per the 7th Central Pay Commission's recommendations. The CPC announcements usually come in March and October, with rollouts in January and July.\n\nNotably, the government has not officially confirmed a date for the second DA hike this year. Over 1 crore beneficiaries, comprising about 50 lakh central government employees and nearly 65 lakh pensioners, including defence and railway personnel and retirees, gain from DA and Dearness Relief (DR) hikes.\n\nNotably, after the Union Cabinet meetings on October 14 and 21 did not result in DA hike announcements, central government employees and pensioners are now awaiting the next meeting on 28 October for a possible 3-4% \u201c Diwali gift\u201d.\n\nAmid this, we take a look at the full list of states that have released dearness allowance hikes this year \u2014 from Himachal Pradesh's Diwali increase in DA and DR to Kerala, Telangana, Sikkim, Punjab and Andhra Pradesh announcing hikes.\n\nFollowing the Finance Ministry's announcement, the Indian Banks' Association (IBA) announced revised DA and DR for workmen and officer employees across levels for the months of May, June and July 2026. It hiked basic salaries between \u20b9 48,000 and \u20b9 1,17,000 and DA from \u20b9 435 to \u20b9 1,050. Later, the Indian Railways also announced a 2% hike in DA and DR for staff and pensioners.\n\nHere's a look at the full list of DA hikes announced by states so far:\n\nDisclaimer: This is for informational purposes only.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 08:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "Tu Hai Meri Kiran Box Office Collection Day 1: Sonakshi Sinha, Zaheer Iqbal Starrer Gets A Lukewarm Opening", "full_content": "Sonakshi Sinha and Zaheer Iqbal's romantic thriller 'Tu Hai Meri Kiran' collected Rs 15.86 lakh on Day 1, with Rs 4.78 lakh in advance bookings and 6.7% overall theatre occupancy.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "Gross FDI inflows to India fall to $11 billion in August", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Gross FDI inflows to India fall to $11 billion in August The Economic Times daily newspaper is available online now. Read Today's Paper Gross FDI inflows to India fall to $11 billion in August SECTIONS Gross FDI inflows to India fall to $11 billion in August ET Bureau Last Updated: Oct 24, 2026, 09:19:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gross foreign direct investment (FDI) to India decreased to $11 billion in August, from $14 billion a month ago. Net FDI to India slows $3 billion in August, from $7 billion in July. F arkets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India is not living in isolation, says Piyush Goyal, as India-EU FTA and several trade pacts pave the way for German R&D The Economic Times daily newspaper is available online now. Read Today's Paper India is not living in isolation, says Piyush Goyal, as India-EU FTA and several trade pacts pave the way for German R&D SECTIONS India is not living in isolation, says Piyush Goyal, as India-EU FTA and several trade pacts pave the way for German R&D ET Online Last Updated: Oct 24, 2026, 08:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Piyush Goyal emphasized the importance of collaboration between Indian and German research institutes during his visit. He highlighted the potential for co-development and co-innovation under the India-EU free trade agreement. Goyal encouraged the institutes to connect research with industry in order to support manufacturing in India. The minister also mentioned India's extensive trade agreements that will boost global market access.\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "24 Oct 2026, 08:28 AM IST", "pub_date_relative": "3h ago"}, {"title": "8th Pay Commission: Will DA merge with basic pay? What past panels decided and what employees should know", "full_content": "The 8th Pay Commission recently concluded its key meeting in Mumbai on 23 October. Over the last few months, the commission headed by Justice Ranjana Prakash Desai has held several meetings in prominent states and union territories, including Delhi, Ladakh, Kolkata, and Bengaluru.\n\nSeveral prominent unions and associations have urged the 8th Pay Commission panel to make meaningful improvements to the treatment of dearness allowance (DA), dearness relief (DR), and basic pay to objectively boost payouts for serving employees and pensioners.\n\nAlong similar lines, another key demand that continues to hold immense value is the merger of dearness allowance (DA) with basic pay, as serving central government employees and pensioners continue to wait for the final recommendations of the 3-member 8th Pay Commission panel.\n\nEmployee unions, hence, are seeking changes to the existing mechanism with the aim of helping serving employees better combat rising inflation. Changes include a DA merger at specified inflation levels (for example, when DA reaches 40% or 50%, depending on eventual approval if cleared) and revisions to the formula used to calculate the allowance.\n\nStill, it is vital to keep in mind that the decisions made by previous Pay Commissions suggest that a merger is not automatic. This write-up is dedicated towards discussing how the earlier pay commissions approached DA merger and what the unions and associations are actually demanding from the 8th Pay Commission.\n\nThe 5th Pay Commission recommended the conversion of DA into dearness pay whenever the Consumer Price Index (CPI) rose by 50% over the base index. This particular metric, i.e., dearness pay, was to account for all purposes, including retirement benefits. It also suggested 100% neutralisation of inflation through DA for employees across pay levels.\n\nThe 6th Pay Commission, on the other hand, took a different approach; it rejected the merger of DA with basic pay at any given stage.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 08:28 AM IST", "pub_date_relative": "3h ago"}, {"title": "Infosys upbeat on deals, cautious on growth as competition intensifies", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Infosys upbeat on deals, cautious on growth as competition intensifies Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Infosys upbeat on deals, cautious on growth as competition intensifies SECTIONS Infosys upbeat on deals, cautious on growth as competition intensifies By Ranjit Shinde , ET Bureau Last Updated: Oct 24, 2026, 08:35:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Infosys released its quarterly results, showing good revenue growth and stable operating margins. However, the management reduced the annual revenue guidance due to competitive pressures. The company secured a significant $2 billion deal, boosting its total contract value to $5.2 billion. Despite positive performance from some sectors, weaknesses in others contributed to the cautious outlook. The market response led to a rise in the stock price, affecting valuation metrics.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 08:24 AM IST", "pub_date_relative": "3h ago"}, {"title": "Friday blockbuster for Jio IPO: Rs 7.4 lakh crore bids, 22x subscription", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Friday blockbuster for Jio IPO: Rs 7.4 lakh crore bids, 22x subscription Reliance Industries Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Friday blockbuster for Jio IPO: Rs 7.4 lakh crore bids, 22x subscription SECTIONS Friday blockbuster for Jio IPO: Rs 7.4 lakh crore bids, 22x subscription By ET Bureau Last Updated: Oct 24, 2026, 08:16:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms has experienced a surge in demand for its initial public offering, garnering roughly \u20b97.41 lakh crore in bids. The subscription soared to 22.19 times, mainly due to robust involvement from institutional investors, including domestic mutual funds and foreign entities. This enthusiasm contrasts with current trends in the secondary market, and shares are scheduled for listing on October 28, showcasing Jio's strides in the digital and telecommunications arenas.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 08:16 AM IST", "pub_date_relative": "3h ago"}, {"title": "'Told Them You Will Not Trade With US': Trump Repeats Claim Tariff Threats Ended India-Pakistan Conflict", "full_content": "Trump has often placed the India-Pakistan episode within a broader boast that he has stopped 'eight wars' during his presidency.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:10 AM IST", "pub_date_relative": "3h ago"}, {"title": "Ranabaali Box Office Collection Day 8: Vijay Deverakonda And Rashmika Mandanna Starrer Slows Down", "full_content": "'Ranabaali' earned Rs 2.10 crore net in India across 1,471 shows on Day 8, taking its total India net collection to Rs 47.30 crore and gross collection to Rs 55 crore.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 08:07 AM IST", "pub_date_relative": "3h ago"}, {"title": "Small and midcap indices post worst weekly decline in two years", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Small and midcap indices post worst weekly decline in two years The Economic Times daily newspaper is available online now. Read Today's Paper Small and midcap indices post worst weekly decline in two years SECTIONS Small and midcap indices post worst weekly decline in two years By ET Bureau Last Updated: Oct 24, 2026, 08:06:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Mid-cap and small-cap stocks in India have faced major declines, indicating a shift in market sentiment. The Nifty MidCap 150 and Small-cap 250 indices reported their worst weekly falls in two years. Domestic retail investors initially supported these segments by increasing mutual fund contributions. However, concerns over rising oil prices and fiscal deficits are adding to market uncertainties.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 08:06 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Piero Cipollone: Interview with Milano Finanza", "full_content": "Mr Cipollone, you have just attended a meeting of the Executive Committee of the Italian Banking Association. Was the digital euro one of the topics discussed?\n\nWe mainly talked about tokenisation. On the subject of the digital euro, I provided an update on the status of the debates on the legislation in Brussels and on the progress of our internal preparations within the Eurosystem.\n\nSince you joined the ECB, payments have become one of the main focus areas of your work. Why are they so important for Europe\u2019s future?\n\nBecause payments constitute a strategic infrastructure for Europe and, as a central bank, ensuring the smooth functioning of payment systems falls within our mandate. Whenever we buy something online or pay for a coffee, we think about the price of what we\u2019re buying. But we hardly ever think about how the payment is made. Yet if the payment system stops working, the economy stops working.\n\nYes. Today we can use money issued by the central bank only in the form of cash. But a growing share of our economic life takes place online, where banknotes can\u2019t be used. The digital euro fills this gap. It gives people the freedom to make payments using an instrument that is equivalent to cash in terms of its nature and characteristics, such as privacy and covering all payment needs, but which also works where cash can\u2019t be used.\n\nEver more purchases are being made online. In Italy, for example, according to the latest available data, online payments grew from 6% of the total in 2019 to 24% in 2024. And I expect they\u2019ve grown even more since then.\n\nThese online purchases are normally made via card payments and two thirds of these payments are made using non-European card schemes.", "source": "ECB Press", "pub_date_str": "24 Oct 2026, 11:30 AM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ICICI Bank, Indian Bank hike FD rates: Check latest rates for senior citizens and general depositors", "full_content": "ICICI Bank and Indian Bank have revised fixed deposit (FD) interest rates on select tenures, with effect from 23 October 2026. These are changes that apply to deposits below \u20b9 3 crore.\n\nThe changes have been introduced by banks to align with evolving developments and central bank policies. Subsequently, ICICI Bank has increased rates by 10 basis points (bps) on select longer-term deposits, whereas Indian Bank has raised rates on its special 555-day and 777-day FDs by 15 bps. This write-up is dedicated towards discussing the complete changes and their long-term implications.\n\nTo ensure meaningful investments and long-term wealth creation , it is wise for aspiring investors in fixed deposits to carefully understand the introduced changes, clearly acknowledge inflation-related changes, and plan investments accordingly.\n\nICICI Bank offers FD interest rates for general citizens ranging from 2.75% to 6.60%, while senior citizens can earn up to 7.20%. The complete details are as follows:\n\nNow, let us look at ICICI Bank's FD rate changes for senior citizens and how they will affect the long-term investments of eligible individuals.\n\nIndian Bank, on the other hand, has also revised rates on its \u2018special-term deposits\u2019 for 555 days and 777 days, respectively. \u2018Ind Grow\u2019 (555 days) and \u2018Ind Prosper\u2019 (777 days). The offered interest rates on other listed tenures continue to remain unchanged.\n\nIt is also vital to note that senior citizens receive an additional 0.50 percentage point on Indian Bank\u2019s 555-day and 777-day special FDs. Their revised rates are 7.30% and 7.25%, respectively.\n\nInvesting in any asset class is an individual decision. That is why, when investing in any fixed deposit, aspiring depositors should seek professional guidance from a certified financial advisor and carefully consider the following aspects:", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 11:12 AM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Reliance Jio Platforms IPO allotment status check online by PAN number on NSE India, BSE websites: Direct link, steps", "full_content": "Reliance Jio IPO Allotment : The subscription window for Reliance Jio Platforms\u2019 \u20b9 30,213-crore IPO has closed, with investors now awaiting the share allotment results scheduled for October 26, 2026. Applicants can check whether they have secured shares through the official portals of BSE , NSE or KFin Technologies, which is managing the IPO\u2019s allotment process.\n\nAs per the provisional schedule, the allotment status is expected to be declared on October 26. Once the status is released, investors can visit any of the three platforms to find out the outcome of their applications.\n\nShares will be credited to investors' demat accounts on October 27. Meanwhile, refunds for those investors who didn't get an allotment will also be processed the same day. Meanwhile, shares will be list on BSE and NSE on October 28.\n\nInvestors can follow these steps to check their application details through the National Stock Exchange :\n\nVisit the NSE IPO bid verification page: https://www.nseindia.com/invest/check-trades-bids-verify-ipo-bids\n\nApplicants can also use the Bombay Stock Exchange\u2019s online application-status facility:\n\nVisit the BSE IPO application status page: https://www.bseindia.com/investors/appli_check\n\nChoose the permitted identification option - PAN or application number.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 11:05 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Sebi orders Avadhut Sathe, academy to refund Rs 546 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Sebi orders Avadhut Sathe, academy to refund Rs 546 crore The Economic Times daily newspaper is available online now. Read Today's Paper Sebi orders Avadhut Sathe, academy to refund Rs 546 crore SECTIONS Sebi orders Avadhut Sathe, academy to refund Rs 546 crore ET Bureau Last Updated: Oct 24, 2026, 11:01:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Securities and Exchange Board of India has directed Avadhut Sathe Trading Academy to refund \u20b9546.18 crore to investors. Avadhut Sathe and his academy provided unregistered investment advisory services under the pretext of education. The regulator found that misleading testimonials were circulated while concealing overall trading losses. A penalty of \u20b911.5 crore was imposed on Sathe and the academy for their actions.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 11:01 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bitcoin eyes $84,000 as whale withdrawals surge and institutional activity grows", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 10:55 AM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "8th pay commission: Here's what ToR says on dearness allowance and govt's response to DA merger demands", "full_content": "The 8th central pay commission (CPC) is in its consultation stage, gathering inputs from central government employees and pensioner groups, unions and stakeholders before it makes its final recommendations in May next year.\n\nFormer Supreme Court Justice Ranjana Prakash Desai is the Chair, and the panel includes Member-Secretary \u2014 Pankaj Jain, a former IAS officer, and Member of the Commission \u2014 Professor Pulak Ghosh, a tenured Professor of Finance and Member of the Economic Advisory Council to the Prime Minister.\n\nThe decisions are set to benefit more than 1 crore people, including around 50 lakh central government employees and about 65 lakh pensioners, including personnel and retirees with the defence and railway ministries.\n\nDearness allowance is a component of basic salary tied to inflation. It impacts the monthly pay of central government employees, public sector staff, defence personnel, bank employees and retired pensioners aimed at mitigating rising inflation.\n\nDA is revised twice annually based on the All-India Consumer Price Index ( AICPI ) formula as prescribed under the 7th central pay commission. Annually, the announcements are mostly made in March and October, with rollouts scheduled in January and July.\n\nThe Terms of Reference (ToR) of the 8th CPC outline what central government employees and pensioners can expect from its final recommendations.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 10:51 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Goldman Sachs Ola Electric Downgrade: Why stock rating changed to sell; 23% downside seen - New target price, rationale", "full_content": "Goldman Sachs Ola Electric downgrade : Goldman Sachs has turned bearish on Ola Electric Mobility , cutting its rating to Sell and reducing its price target sharply, as mounting concerns over cash flow, funding requirements and operational challenges cloud the electric two-wheeler maker\u2019s recovery prospects. The global investment bank has warned that the company faces a difficult path towards generating positive free cash flow, with high interest costs and substantial capital expenditure requirements adding to the pressure.\n\nGoldman Sachs lowered its target price to \u20b9 23 from \u20b9 39.28, implying a downside of 23% from Ola Electric\u2019s previous closing price of \u20b9 29.93. The brokerage also reduced its revenue estimates for FY27 to FY29 by up to 10%, citing a tougher market-share environment and expectations of prolonged operating losses.\n\nGoldman Sachs\u2019 downgrade reflects growing concerns over Ola Electric\u2019s growth prospects, financial sustainability and ability to navigate intensifying competition in the electric two-wheeler market.\n\nAccording to Goldman Sachs, Ola Electric would need a substantial acceleration in revenue to cover its capital expenditure and interest servicing requirements. Revenue during FY28 to FY30 would need to reach 3.6 times to 7.1 times FY26 levels to meet these obligations, it highlighted.\n\nThe scale of the challenge is underscored by the company\u2019s recent performance. Ola Electric\u2019s revenue in FY26 was 55% lower than its FY24 level, making the growth required over the coming years particularly demanding.\n\nMoreover, the brokerage expects operating losses, elevated interest expenses and investments across the electric two-wheeler (E2W) and battery-cell businesses to complicate efforts to generate positive free cash flow.", "source": "LiveMint Markets", "pub_date_str": "24 Oct 2026, 10:50 AM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Athena Gold CEO Koby Kushner buys $3,534 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Oct 2026, 10:45 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Anthropic IPO: What should investors consider when valuing the AI company? Aswath Damodaran explains", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Anthropic IPO: What should investors consider when valuing the AI company? Aswath Damodaran explains Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic IPO: What should investors consider when valuing the AI company? Aswath Damodaran explains SECTIONS Anthropic IPO: What should investors consider when valuing the AI company? Aswath Damodaran explains By Kumar Gaurav , ETMarkets.com Last Updated: Oct 24, 2026, 10:33:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic is on track for an IPO expected in mid-November, reporting impressive revenues of $16.3 billion. However, the company faces a staggering net loss of over $80 billion for the year. Valuation expert Aswath Damodaran warns that IPO investor metrics can be erratic and heavily influenced by market sentiment. As Anthropic navigates an evolving business model, investors are advised to look beyond venture capital evaluations for a clearer understanding.\n\nAs Anthropic's IPO nears its target date, it it worth remembering that IPOs get priced, and that as a young company with growing revenues and big losses, that pricing will be based on metrics that are buzzy and unfamiliar, from eyeballs in the dotcom era to users in the social media decade to ARR with AI companies...https://t.co/5DXmDGcSTf\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 10:33 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "EPFO ECR deadline 31 Oct: How the new PF wage ceiling affects contributions & membership; What employers must know", "full_content": "Employers have up to 31 October to file the Electronic Challan-cum-Return (ECR) and deposit statutory provident fund (PF) contributions for September 2026. This deadline was initially set to end on 15 October but was extended until 31 October 2026, following the Employees\u2019 Provident Fund Organisation\u2019s (EPFO) revision of the EPF wage ceiling from \u20b9 15,000 to \u20b9 25,000 per month, effective from 17 September 2026.\n\nThe primary objective behind these changes is to meaningfully align employers and eligible employees with the benefits of EPFO. Now, this change requires employers to carefully review payroll systems, employee-wise contribution calculations and membership eligibility in order to ensure meaningful compliance with the revised rules and regulations.\n\nFurthermore, it is also vital to keep in mind that the ECR contains employee-wise wage and contribution details for the Employees\u2019 Provident Fund (EPF) , Employees\u2019 Pension Scheme (EPS), and Employees\u2019 Deposit Linked Insurance (EDLI).\n\nThat is why employers must ensure and follow through on the fact that applicable employee and employer contributions are correctly checked, calculated and deposited by the deadline.\n\nThe eventual impact of the revised wage ceiling will depend on how employers calculate PF contributions.\n\nThe revision in ceiling might also help in bringing eligible new employees earning above \u20b9 15,000 and up to \u20b9 25,000 per month under mandatory EPF coverage , subject to applicable membership rules and regulations.\n\nFurthermore, new employees earning above \u20b9 25,000 who are not already EPF members may continue to remain outside mandatory coverage if they qualify as excluded members. Finally, all existing members generally continue their membership when changing jobs.\n\nIn summary, with the 31 October deadline approaching, employers should carry out proper verification of employee eligibility, reconcile payroll records, and ensure accurate reporting of EPF, EPS, and EDLI details .", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 10:15 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "For Tata Motors CV, The Commodity Bill Is Rising Faster Than Its Pricing Power", "full_content": "EBITDA rose 31% to about Rs 2,800 crore, but margin was 11.7%, down 90 basis points year-on-year and flat sequentially.", "source": "NDTV Profit", "pub_date_str": "24 Oct 2026, 09:56 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Growth, value stocks set for reshuffle as S&P adopts new rules", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Growth, value stocks set for reshuffle as S&P adopts new rules Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Growth, value stocks set for reshuffle as S&P adopts new rules SECTIONS Growth, value stocks set for reshuffle as S&P adopts new rules By Lu Wang , Bloomberg Last Updated: Oct 24, 2026, 09:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis S&P Dow Jones Indices will soon change its rules for classifying growth and value shares. The new criteria will incorporate intang ng of India\u201d, the billionaire publicly holds 14 stocks. Here are his top 10 stock holdings by value, based on data from Trendlyne.\n\nAvenue Supermarts, operator of the DMart hypermarket chain, remains Radhakishan Damani\u2019s largest holding. He held a 67% stake as of September 30, 2026, valued at more than Rs 1.38 lakh crore, according to Trendlyne data. The stock has fallen around 18% in the past month and 15% in 2026 so far. It has declined more than 26% in one year, 14% in three years and over 30% in five years.\n\nNSE shares made their much-awaited market debut on September 24, listing at Rs 1,800 apiece on BSE. This marked a premium of less than 1% over the IPO price of Rs 1,785. Radhakishan Damani was one of the popular stakeholders in the company who sat out on the IPO, making NSE his second biggest stock holding after DMart in terms of holding value. He owns 1.6% stake worth Rs 6,527 crore.\n\nAlso read | NSE shares hit record low as IPO lock-in expiry frees up stake worth Rs 3,247 cr for trading. How has the stock performed since listing?\n\nDamani and his family acquired around a 2.4% stake in NBFC Sundaram Finance during the April-June quarter of FY27, which they kept unchanged in Q2 according to Trendlyne data. The stock has dropped around 151% in the past month and more than 25% in 2026 so far.", "source": "Economic Times Markets", "pub_date_str": "24 Oct 2026, 09:41 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Reliance Jio Platforms IPO GMP, allotment date, listing date, time, overall subscription status; QIB, NII, Retail, RIL", "full_content": "Reliance Jio IPO allotment : Reliance Jio Platforms\u2019 \u20b9 30,213-crore initial public offering has concluded its subscription process, setting the stage for the allotment announcement on Oct de the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "24 Oct 2026, 08:28 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "8th Pay Commission: Will DA merge with basic pay? What past panels decided and what employees should know", "full_content": "The 8th Pay Commission recently concluded its key meeting in Mumbai on 23 October. Over the last few months, the commission headed by Justice Ranjana Prakash Desai has held several meetings in prominent states and union territories, including Delhi, Ladakh, Kolkata, and Bengaluru.\n\nSeveral prominent unions and associations have urged the 8th Pay Commission panel to make meaningful improvements to the treatment of dearness allowance (DA), dearness relief (DR), and basic pay to objectively boost payouts for serving employees and pensioners.\n\nAlong similar lines, another key demand that continues to hold immense value is the merger of dearness allowance (DA) with basic pay, as serving central government employees and pensioners continue to wait for the final recommendations of the 3-member 8th Pay Commission panel.\n\nEmployee unions, hence, are seeking changes to the existing mechanism with the aim of helping serving employees better combat rising inflation. Changes include a DA merger at specified inflation levels (for example, when DA reaches 40% or 50%, depending on eventual approval if cleared) and revisions to the formula used to calculate the allowance.\n\nStill, it is vital to keep in mind that the decisions made by previous Pay Commissions suggest that a merger is not automatic. This write-up is dedicated towards discussing how the earlier pay commissions approached DA merger and what the unions and associations are actually demanding from the 8th Pay Commission.\n\nThe 5th Pay Commission recommended the conversion of DA into dearness pay whenever the Consumer Price Index (CPI) rose by 50% over the base index. This particular metric, i.e., dearness pay, was to account for all purposes, including retirement benefits. It also suggested 100% neutralisation of inflation through DA for employees across pay levels.\n\nThe 6th Pay Commission, on the other hand, took a different approach; it rejected the merger of DA with basic pay at any given stage.", "source": "LiveMint Money", "pub_date_str": "24 Oct 2026, 08:28 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Infosys upbeat on deals, cautious on growth as competition intensifies", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Infosys upbeat on deals, cautious on growth as competition intensifies Infosys Share Price Tata Consultancy Services Share Price HCL Technologies Share Price Wipro Share Price Tech Mahindra Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Infosys upbeat on deals, cautious on growth as competition intensifies SECTIONS Infosys upbeat on deals, cautious on growth as competition intensifies By Ranjit Shinde , ET Bureau Last Updated: Oct 24, 2026, 08:35:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
