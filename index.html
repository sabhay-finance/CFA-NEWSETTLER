    const allData = {"general": [{"title": "FSSAI Finds Sample Of Bisleri Packaged Drinking Water 'Unsafe'", "full_content": "The action comes after a sample was found non-compliant with the prescribed bromate limits and flagged unsafe under FSS Act.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:45 PM IST", "pub_date_relative": "15m ago"}, {"title": "APL Apollo To Buy Tata Steel's Tubes And Colors Business For Rs 28,000 Crore", "full_content": "The business deal regarding its Tubes business involves Rs 11,700 crore in cash transferred via a slump sale to APL Apollo.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:45 PM IST", "pub_date_relative": "15m ago"}, {"title": "Asian countries take steps to aid stock markets after AI rout", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 08:42 PM IST", "pub_date_relative": "17m ago"}, {"title": "'Extremely Cheap' Yet Too Risky: Why Bernstein Is Hesitating To Buy The Dip In Nvidia Stock", "full_content": "The brokerage expects Nvidia's revenue to rise from $406.9 billion in fiscal 2027 to $690.3 billion in fiscal 2028,", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:42 PM IST", "pub_date_relative": "18m ago"}, {"title": "I\u2019ve studied over 200 kids\u2014parents who do 6 things accidentally raise people pleasers: It starts in \u2018ordinary, well-intentioned moments\u2019", "full_content": "We all want to raise children who are kind, respectful and considerate. But sometimes, the very behaviors we praise are the ones teaching our children to put themselves last.\n\nA child who never complains, always agrees and goes out of their way to make others happy might seem like a parent's dream. But what if they've simply learned that being easy to love means trying to please everyone all the time?\n\nAs a conscious parenting coach who's worked with over 200 families, I've seen how people pleasing can begin in the most ordinary, well-intentioned moments at home.\n\nWe love telling our children how easygoing they are, especially when they rarely complain or make demands. But when being easy earns our approval, children may start believing their needs are a burden and their feelings are better kept to themselves.\n\nWhat to do instead: Make room for your child's disappointment, frustration and disagreement, even when it's inconvenient. They need to know they don't have to be happy or agreeable to be accepted by you.\n\nWhen children question our decisions, it's tempting to respond with \"Don't talk back\" or \"Because I said so.\" But when we repeatedly shut down their opinions, we may be teaching them that having a voice comes at the cost of a connection with us.\n\nWhat to do instead: Separate disrespectful behavior from differences in perspective. You can say, \"You don't have to agree with me. I want to understand what you think.\"\n\nStatements that start with \"After everything I've done for you\u2026\" may seem harmless in the moment, but they can leave children feeling responsible for their parents' emotional well-being.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 08:40 PM IST", "pub_date_relative": "20m ago"}, {"title": "Modi Says 50-Crore People Lifted Out Of Poverty, But Some Still Hesitant To Acknowledge It", "full_content": "Modi also defended initiatives such as opening bank accounts for the poor, providing LPG connections, electricity access and distributing Ayushman Bharat health cards, saying critics had questioned their effectiveness when they were introduced.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:39 PM IST", "pub_date_relative": "20m ago"}, {"title": "Karur Vysya Bank raises one-year MCLR to 9.30% from November 22: Here's what changes for borrowers", "full_content": "Karur Vysya Bank has increased its one-year Marginal Cost of Funds Based Lending Rate (MCLR) by 5 basis points (bps) to 9.30% from November 22, 2026. The private sector lender has also raised its overnight, one-month, three-month and six-month MCLR by 5 bps each.\n\nHowever, in a separate revision, the bank has reduced its Base Rate and Benchmark Prime Lending Rate (BPLR) by 25 bps each.\n\nThe revised lending rates were announced through a regulatory filing dated November 19. The changes will affect borrowers differently depending on the benchmark to which their loans are linked.\n\nFollowing the latest revision, the bank's overnight and one-month MCLR have increased from 8.85% to 8.90%. The three-month rate has moved up from 9% to 9.05%.\n\nSimilarly, the six-month MCLR has been raised from 9.15% to 9.20%, while the one-year MCLR has increased from 9.25% to 9.30%.\n\nAlongside the MCLR increase, Karur Vysya Bank has lowered two other lending benchmarks.\n\nThe bank's Base Rate has been reduced from 11.20% to 10.95%, marking a cut of 25 bps. The Benchmark Prime Lending Rate has also been brought down from 16.20% to 15.95%.\n\nBoth these changes will also come into effect from Sunday, November 22.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:37 PM IST", "pub_date_relative": "23m ago"}, {"title": "Will a PF withdrawal for buying a house be tax-free after five years of service?", "full_content": "We understand that your Provident Fund (PF) account was maintained with an employer-managed private PF trust and is now being transferred to the Employees' Provident Fund Organization (EPFO). We further understand that you have completed more than five years of continuous service with your employer and have contributed to PF for more than five years.\n\nThe EPF Scheme 2026 permits partial withdrawal (subject to eligibility conditions and specified limits) of provident fund balance for housing purposes, which covers following:\n\niv) repayment of a home loan obtained for purchase, construction of a flat or house or for acquisition of a site; and\n\nv) additions, alterations, renovations or improvements to an existing house or flat:\n\nAforesaid is a partial withdrawal, not a full account closure. The remaining balance continues to earn interest.\n\nFurther, since you have completed more than 5 years of continuous service and contribution, such partial withdrawal from PF shall be fully exempt from tax.\n\nIt may be noted that regardless of period of service, where an employee contribution exceeded INR 2.5 lakh in a year, the interest earned on such excess portion of contribution, would have been taxable on a yearly basis (on accrual) at applicable slab rate for that year. In such case, such interest shall not again be separately taxable on withdrawal.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:32 PM IST", "pub_date_relative": "27m ago"}, {"title": "The Danger of Jensen Huang\u2019s Handshake Deals at Nvidia - WSJ", "full_content": "The Danger of Jensen Huang\u2019s Handshake Deals at Nvidia WSJ A tale of two Nvidias Yahoo Finance WATCH: Trump says he would love former Nvidia CEO Jensen Huang to 'be given a second chance' PBS Jensen Huang\u2019s \u2018Lying\u2019 Alarmed Nvidia Board Ahead of His Resignation WIRED Trump asks Nvidia to give Jensen Huang a \u2018second chance\u2019 Politico", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 08:31 PM IST", "pub_date_relative": "29m ago"}, {"title": "Crimson Wine Group director Joseph Steinberg acquires $100,680 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 08:31 PM IST", "pub_date_relative": "29m ago"}, {"title": "Corporate America hunts for \u2018generational\u2019 growth in AI, trading cards and the L.A. airport", "full_content": "There\u2019s been no shortage of trends deemed once-in-a-generation by executives on earnings calls.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 08:31 PM IST", "pub_date_relative": "29m ago"}, {"title": "Scene Box Office Collection Day 17: Suriya Starrer Crosses Key Milestone On Third Sunday", "full_content": "The Tamil version recorded 62 per cent occupancy on Sunday, well ahead of Telugu's 36 per cent, after the film picked up on Saturday in its third week.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:30 PM IST", "pub_date_relative": "30m ago"}, {"title": "Taiwan Mulls Lowering Margin Requirement to Support Stock Market", "full_content": "Taiwan is considering lowering the margin requirement ratio for stock investors using borrowed funds as it tries to stem a selloff after the benchmark equity index\u2019s worst week in 35 years.\n\nThe Taiwan Stock Exchange said it held an emergency meeting with 10 local brokerages Sunday to discuss the potential move, which would cut the minimum margin maintenance ratio to 120% from the current 130%.\n\nThe exchange and brokers discussed potential scenarios that could arise if the ratio were lowered, and will assess any operational issues, according to the bourse. No decision was reached at the meeting, and any change would require approval from the Financial Supervisory Commission.\n\nTaiwan currently requires a minimum margin maintenance ratio of 130% for investors who buy stocks with borrowed funds, meaning the market value of their securities must remain at least 1.3 times the amount borrowed.\n\nThe island\u2019s market and finance authorities have utilized a growing arsenal of measures to combat the market rout, with little effect. The FSC tightened short-selling curbs again Saturday, banning such trades below the previous day\u2019s close across the market after two earlier rounds of restrictions failed to stop the slide.\n\nThe latest curbs cover both margin short sales and borrowed shares. Authorities also raised the minimum margin requirement for short sales to 150% from 130%, and temporarily suspended the acceptance of applications from securities firms to list new put warrants.\n\nElsewhere, China announced Sunday that it will cut the minimum margin requirement for leveraged investors to 80% from 100%, starting on Nov. 30. Earlier this month, South Korea waived a rule requiring brokerages to maintain collateral worth at least 140% of their margin loans to prevent forced selling from worsening stock-market volatility.\n\nThis article was generated from an automated news agency feed without modifications to text.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 08:21 PM IST", "pub_date_relative": "38m ago"}, {"title": "Senior citizens can earn 8.5% on 5-year FDs: These small finance banks offer the highest rates", "full_content": "Senior citizens looking to earn a steady income from their savings can still find fixed deposit (FD) interest rates of up to 8.5% for a five-year investment period at select small finance banks. These rates are higher than those offered by many traditional banks, although depositors should weigh the returns against the risks before committing their money.\n\nFor individuals aged 60 years and above, fixed deposits remain a popular option because they offer predictable returns and allow savings to grow over a specified period. Several small finance banks are offering competitive rates on five-year FDs for deposits of up to \u20b9 3 crore.\n\nSuryoday Small Finance Bank is among the banks offering the highest returns, with a five-year FD interest rate of 8.5% for senior citizens, according to the rates provided.\n\nJana Small Finance Bank is offering 8% on deposits with the same tenure. Other small finance banks are offering rates ranging from 6.25% to 7.7%.\n\nHigher interest rates can make small finance bank FDs attractive, but senior citizens should also consider the safety of their deposits.\n\nThe Deposit Insurance and Credit Guarantee Corporation (DICGC) insures bank deposits of up to \u20b9 5 lakh per depositor per bank. This coverage includes both the principal and interest and applies across savings accounts, fixed deposits and other eligible deposits held with the same bank.\n\nFinancial experts generally advise depositors to understand this insurance limit before placing large sums in small finance bank FDs. Keeping deposits within the insured limit can help reduce exposure if a bank faces financial difficulties.\n\nInterest earned on fixed deposits is taxable according to the depositor's applicable income tax slab. Banks are required to deduct tax at source (TDS) when interest earned on deposits exceeds \u20b9 1 lakh in a financial year for senior citizens.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:18 PM IST", "pub_date_relative": "42m ago"}, {"title": "Lodha Developers Chairman Mukund Chitale Steps Down; Akhil Gupta To Replace", "full_content": "Mukund Chitale also completed his tenure as independent director.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:18 PM IST", "pub_date_relative": "42m ago"}, {"title": "Organon earnings on deck as Sun Pharma deal looms", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 08:05 PM IST", "pub_date_relative": "54m ago"}, {"title": "ChipMOS earnings up next: Can packaging specialist sustain growth?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 08:05 PM IST", "pub_date_relative": "55m ago"}, {"title": "Gold, silver, copper, aluminium, platinum to zinc: Why are metal prices crashing to multi-month lows? Key reasons", "full_content": "Sharmila Bhadoria Published 22 Nov 2026, 08:01 PM IST Prefer Livemint on Google Last week was a disappointing one for the metals segment, with a broad-based selloff across both base metals, be it base metals like aluminium, copper or zinc, or precious metals like gold, silver or platinum. Gold prices are currently hovering to their 14-month low levels, whereas silver has declined more than 60% from its all-time high level.\n\nConcerns around rising inflation, higher yields, stronger possibility of US Federal Reserve rate hike in December, and potential slowdown in artificial intelligence-related capital expenditure (capex) were among the key factors that contributed to metals\u2019 meltdown.\n\nGold prices are currently hovering to their multi-month low levels. Silver rates in India which surged to their all-time high levels in the first half of 2026 are currently hovering around their 14-month low level. Platinum is also trading close to their multi-month low levels.\n\nOn Multi Commodity Exchange ( MCX ), silver futures (with December expiry) closed marginally higher at \u20b9 1,48,900 per kilogram. Silver rates in the international market tumbled below $ 42 per ounce on Friday, reaching their lowest level since September 2025.\n\n\u201c25% of the silver mind is regained by nature whereas 99.9% gold is recycled. This creates a systematic demand on Silver unlike Gold. Also silver is used increasingly in EV, electronics and batteries. This is expected to put additional pressure on silver demand,\u201d explained Abhishek Banerjee, smallcase Manger, Founder of Lotusdew Wealth and Investment Advisors, while remaining bullish on the precious metal .\n\nMCX Gold Futures with December expiry closed 4.32% lower at \u20b9 1,21,949 per 10 gram on Friday.\n\nConcerns around sticky US inflation, Fed rate hike bets and a stronger US dollar weighed on gold prices.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 08:01 PM IST", "pub_date_relative": "58m ago"}, {"title": "Social Security benefits are rising in 2027, but other changes could affect what you keep", "full_content": "Whether you're working or retired, changes to Social Security in 2027 could affect your finances.\n\nStarting in January, millions of program beneficiaries will get a 3.6% increase to their benefits, thanks to the annual cost-of-living adjustment. But rising Medicare premiums could chip away at the increase \u2014 and as beneficiaries' incomes rise, that may affect the taxes they owe and their eligibility for a new senior deduction.\n\nMeanwhile, a higher taxable earnings cap means some workers will pay Social Security taxes on more income, reducing their paycheck.\n\nSocial Security's limit for payroll taxes is adjusted every year to reflect the average wage index.\n\nIn 2027, the taxable maximum will go up to $192,300 in earnings, up from $184,500 in 2026. Workers and employers each pay a 6.2% payroll tax on earnings up to that limit \u2014 or 12.4% for self-employed workers. Medicare taxes of 1.45% for both workers and employers are not subject to a limit.\n\nIn 2027, workers who earn $192,300 or more will pay $11,922.60 in total Social Security payroll taxes, according to the Social Security Administration, while self-employed workers will pay $23,845.20.\n\n\"If you're somebody whose income is over what the new threshold is going to be, this increase in the threshold results in a tax increase to you,\" said Tim Steffen, director of advanced planning at financial services firm Baird.\n\nThe 3.6% Social Security cost-of-living adjustment for 2027 is slated to increase retirement benefits by about $75 per month on average, according to the Social Security Administration.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 08:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "UN climate talks collapse as EU and others reject deal", "full_content": "UN climate talks collapsed on Sunday as the European Union and others rejected a final draft deal put forward by COP31 presidents Turkey and Australia, saying it was too weak to advance the fight against global warming.\n\nThe failed talks reflect world governments' struggle this year to muster ambitious action to address the worsening consequences of climate change, as wars, economic pressures and other crises compete for their attention.\n\nAfter more than two weeks of negotiations that spilled two days into overtime \u2014 making it the longest COP on record \u2014 Turkey's conference president Murat Kurum said at the closing plenary that he could see there was no agreement and confirmed he would not advance any new text.\n\n\"There is nothing to do, we did all that we could,\" he said. \"There will be no new text from now on.\"\n\nHe later left the stage amid speeches being delivered by country representatives.\n\nAustralia's COP31 President of Negotiations, Chris Bowen, called the outcome \"very disappointing\" and said disagreements over fuels and climate finance were the dealbreakers.\n\nThe last time UN climate talks failed to get a deal adopted by all was in Copenhagen in 2009.\n\nIreland's environment minister Darragh O'Brien said the European Union could not support the proposed deal in part because it made no mention of the fossil fuels that scientists say drive global warming.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 07:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "OM Box Office Collection Day 3: Dhanush-Mammootty Starrer Set For Strong Opening Weekend", "full_content": "Written and directed by Rajkumar Periasamy, the film stars Dhanush as Palanivel and Mammootty as Burma Karthikeyan.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 07:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2019Black Friday\u2019 brings consumer spending into focus for AI-rocked market", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 07:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "26-year-old Google worker earns $323,000 a year\u2014but lives on less than minimum wage", "full_content": "This story is part of CNBC Make It's Millennial Money series, which details how people around the world earn, spend and save their money.\n\nAt 26 years old, Google AI security analyst and YouTuber Charles Broomfield is on track to earn about $323,000 this year \u2014 but he lives on less than minimum wage.\n\nFor the past few years, Broomfield has kept his annual spending on core living expenses under $20,000, less than the roughly $23,700 a full-time worker would earn at the minimum wage, averaged across all 50 states.\n\nHe does it by living with roommates in Washington, D.C., walking or biking instead of driving, eating free meals at work and rarely spending beyond his basic needs. Even when he splurges on something fun, he keeps things modest; in August, that meant a baseball game and a single $7 beer.\n\n\"I guess something else that probably does make me a little bit unique is I really don't feel joy when I buy things,\" he says. \"I feel like I have what I need.\"\n\nThere is a goal behind all that saving. Broomfield has pursued financial independence since college and now expects to reach his target of $750,000 in investments within the next year, well ahead of his original goal of doing so by age 30. As his income has climbed, his lifestyle has largely stayed the same, he says.\n\nHere's how Broomfield keeps his spending so low and what he plans to do once he no longer needs the paycheck.\n\nBroomfield grew up in Colorado Springs, Colorado, the son of two military veterans. He and his siblings had to set aside half of everything they earned growing up. They could spend the other half or earn interest from their parents by putting that money away, too.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 07:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "AC Milan vs Frosinone Calcio Live Streaming: When And Where To Watch Serie A Match Live In India?", "full_content": "AC Milan face Frosinone on November 22. Check the match time, venue and where to watch AC Milan vs Frosinone live in India.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 07:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks are in a correction heading into the Thanksgiving holiday. What to brace for next.", "full_content": "Other stocks are in a bear market, which could be bad timing with the crucial holiday shopping period ahead", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 07:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "Borrowing money to invest in stocks? Charlie Munger's warning explains why a market crash can put your savings at risk", "full_content": "Charlie Munger, Warren Buffett's longtime investing partner and former vice chairman of Berkshire Hathaway, believed that investors should focus as much on avoiding major mistakes as they do on finding winning investments. One of the biggest risks he repeatedly cautioned against was borrowing money to buy stocks. While taking a loan to invest can magnify gains when markets rise, it can also accelerate losses during a downturn, leaving investors with a depleted portfolio and debt to repay.\n\nMunger's warning against excessive leverage is particularly relevant for investors approaching retirement, when a sharp market correction can magnify losses, force premature selling and jeopardise years of accumulated wealth . Unlike younger investors, those nearing retirement may have limited time to rebuild their savings or recover from a substantial portfolio loss.\n\nThe lesson also applies to Indian investors using margin trading facilities (MTF), leveraged trading positions or personal loans to increase their stock market exposure. The risk is not limited to retirees. Anyone investing borrowed money without the financial capacity to absorb losses could find themselves under pressure when markets turn volatile.\n\nConsider two investors who each have \u20b9 5 lakh to invest. The first invests the entire amount in equities without borrowing. The second borrows another \u20b9 2.5 lakh, taking their total market exposure to \u20b9 7.5 lakh.\n\nIf the market declines 30%, the first investor's portfolio falls to \u20b9 3.5 lakh. This represents a loss of \u20b9 1.5 lakh, or 30% of the original investment.\n\nFor the second investor, the portfolio declines to \u20b9 5.25 lakh. However, the \u20b9 2.5 lakh loan remains outstanding. After deducting the borrowed amount, the investor is left with equity worth \u20b9 2.75 lakh. This translates into a 45% loss on the original \u20b9 5 lakh capital, excluding interest and other borrowing costs.\n\nThe difference becomes more significant when interest costs are included.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 07:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Markets with Bertie | Have high crude prices sown the seeds of their own destruction?", "full_content": "ENERGY Bertie Published 22 Nov 2026, 07:20 PM IST Prefer Livemint on Google Bertie loves attending kids\u2019 birthday parties. No kid has ever walked up to him, put on an air of formality, and asked: \u201cSo what do you do?\u201d Kids are generally not interested in interacting with random adults, and that is a policy choice that Bertie wholeheartedly endorses. Also, kids\u2019 birthday parties have a lot of games and prizes to be won.\n\n\u201cKeep your inner child alive\u201d is a popular quote with life coaches and motivational speakers, but that generally sound advice does not apply to Bertie. The kid inside him is very much alive and boisterous, and most of the time has to be closely supervised.\n\nAt a previous birthday party, Bertie had made a beeline for a game of \u2018Can Knockdown\u2019. The idea was to topple a pyramid of cans by throwing a tennis ball at them. Now, irrespective of the age bracket of his adversaries, Bertie is a competitive bloke. His first throw was completely off the mark, and that made him cuss loudly. Oblivious to the turned heads of shocked parents, he took a step back, imagined himself at long-off at Wankhede Stadium and decided to hurl the ball straight to the wicket-keeper. This one missed the cans too, but hit the game's attendant smack in the middle of his belly. He groaned and doubled up on the floor; Bertie cussed again, but for an entirely different reason. He now felt an assertive tug on his shirt sleeve, followed by the supervisory voice of the missus. \u201cCome!\u201d she said and pulled him away from the games section.\n\nKnowing his track record, the missus had warned him before this weekend\u2019s party. No kids\u2019 games, nothing stronger than fruit juice and interactions, if any, only with adults.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 07:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "52% rally in six months! Mukul Agrawal portfolio\u2019s defence stock has 19% upside, says ICICI Direct - Do you own it?", "full_content": "Sharmila Bhadoria Published 22 Nov 2026, 07:18 PM IST Prefer Livemint on Google Shares of PTC Industries ended more than a percentage point higher on Friday, November 20. The Mukul Agarwal portfolio\u2019s stock has delivered more than 23% return in three months, and around 52% return in six months.\n\nThe defence player reported profit in-line with expectations in the second quarter of financial year 2026-27. ICICI Securities sees 19% upside potential in the stock.\n\nPTC Industries performance was broadly in line with our expectations. Its consolidated EBITDA increased by 119% on an annual basis, largely driven by the strength in Aerolloy Technology (ATL).\n\n\u201cWe believe that the company would likely now enter the approval phase (building order book; recently won a couple of orders from Safran and Airbus); the execution phase is expected to start FY29 onwards (ramp-up across Blue Origin, BrahMos, GTRE, and VSSC titanium ingots provides multi-year revenue visibility),\u201d read the ICICI Securities report.\n\nPTC Industries\u2019 5,000tpa EBCHR plant is on the verge of commissioning. After that, the next few years could be a phase of approval and order build-up, followed by an exponential growth phase backed by execution. Material and machine parts supply ecosystem is likely to emerge as the biggest beneficiary, given that the Indian aerospace ecosystem is at an inflection point, as per the report.\n\nThe brokerage gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 29,000. \u201cWe retain our BUY rating and the TP of INR 29,000, which is based on 65x FY29E EPS.\u201d\n\nThe stock closed 1.01% higher at \u20b9 24,111.13 per share on BSE with a market capitalisation of \u20b9 38,225.13 crore on Friday. Its share price value has 23% in three months, and 52.67% in six months. Its share price value has surged 40% in one year.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 07:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Sensex Rejig: Shriram Finance To Enter BSE Index From Dec. 21 As Trent Takes An Exit", "full_content": "The changes will become effective during the trading session on Monday, December 21, 2026.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 07:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "Marriott president, Greater China, Mao Yibing sells $2.57M shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 07:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "JEE Main 2027 Session 1: Over 15 Lakh Applications Received As Registration Ends Today", "full_content": "Following the closure of the late-fee window, candidates will be allowed to make corrections to application forms between November 27-29.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 07:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ramayana Box Office Collection Day 18: Film Stays Strong On Third Sunday", "full_content": "Directed by Nitesh Tiwari, Ramayana part 1 stars Ranbir Kapoor as Lord Rama, Sai Pallavi as Sita and Yash as Ravana.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 07:11 PM IST", "pub_date_relative": "1h ago"}, {"title": "Behind the Curtain \u2014 AI 2027: The reckoning - Axios", "full_content": "Behind the Curtain \u2014 AI 2027: The reckoning Axios The year ahead will be crunch time for artificial intelligence The Economist The Capgemini shape of things to come - more AI unpredictability on the cards Diginomica 2027 Cybersecurity Outlook: AI Will Transform Security Operations, but Visibility and Control Remain Critical Cybersecurity Insiders Redefining Operations: Five Critical Shifts in Data Management and AI for 2027 VMblog", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 07:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "UN Climate Talks Collapse In Acrimony As Nations Reject Deal", "full_content": "Fights over the financial flows to developing economies and the role of flagship scientific reports also stymied delegates.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 07:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Liverpool vs Manchester United Live Streaming: When And Where To Watch Premier League Match?", "full_content": "Manchester United begin a new chapter under Mauricio Pochettino with a high-profile trip to Liverpool.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 07:00 PM IST", "pub_date_relative": "2h ago"}, {"title": "Saudi Arabia, Bahrain report new attacks as Iran says it remains open to a deal with U.S.", "full_content": "Saudi Arabia and Bahrain reported attacks by Iran-linked forces over the weekend, as Iran's foreign minister said his government remains open to a deal to end the war with the U.S.\n\n\"Intercepted and destroyed a drone launched by the Houthi terrorist militia toward the Riyadh area,\" the Saudi-led Coalition to Support Legitimacy in Yemen, which has been leading the fight against the Iran-backed group, said Sunday in a post on X.\n\nThe coalition said late Saturday that its air defenses \"intercepted and destroyed a ballistic missile\" launched by the Yemen-based Houthis toward Saudi Arabia's western region, which includes some of the country's sensitive energy refining and export infrastructure.\n\n\"As a result of the heinous Iranian aggression, a civilian industrial facility was targeted, causing a fire at the site,\" Bahrain's Ministry of Interior said on X. The ministry later said two people , a Bahraini citizen and a Pakistani resident, were injured in the attack.\n\nIranian state media reported late Saturday that the country's Islamic Revolutionary Guard Corps fired missiles and drones at U.S. military facilities in Bahrain .\n\nA separate Iranian media report claimed the IRGC's air defenses intercepted and destroyed a U.S. MQ-9 drone .\n\nU.S. Central Command did not immediately respond to CNBC's request for comment on either Iranian report.\n\nMeanwhile, Iranian Foreign Minister Abbas Araghchi said his government remains open to a negotiated settlement to the war. An agreement aimed at developing a permanent peace deal signed in June between President Donald Trump and his Iranian counterpart Masoud Pezeshkian \u2014 the so-called Islamabad Memorandum of Understanding \u2014 later broke down.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 06:55 PM IST", "pub_date_relative": "2h ago"}, {"title": "Engineering Exports Jump 36% In October On Strong US Shipments: EEPC", "full_content": "Exports to Vietnam and Thailand declined on lower iron and steel, aluminium and zinc shipments, though both remained positive in cumulative terms.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 06:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Trump\u2019s Memecoin Gala Returns With Demand Down and Scrutiny Up", "full_content": "The first time Morten Christensen traded his way into a gala with President Donald Trump, it cost him about $1,200. The second time, about $500. This time, he says, he ended up making $6.\n\nTo qualify, Christensen bought Trump\u2019s memecoin and placed a separate bet that would pay off if its price fell, as he had for the first two events.\n\n\u201cA cup of coffee,\u201d said Christensen, a long-time trader who runs a crypto-giveaways site AirdropAlert.com, referring to the small profit this time round.\n\nTrump is scheduled to attend a third gala for holders of his memecoin Sunday at Trump National Golf Club in Virginia, according to the organizers. They list boxer Floyd Mayweather, entrepreneur Kevin O\u2019Leary, basketball player Tristan Thompson and mentalist Lior Suchard among the celebrities expected at Sunday\u2019s event.\n\nThe coin, known as $TRUMP, went on sale days before Trump took office for a second term. It has subsequently fallen around 98% from the highs and is near record lows. The president reported $636 million in earnings from it last year. Affiliate CIC Digital holds a large share of the supply and earns revenue when the coin trades, while some of the biggest holders can qualify for an invitation to see the president in person. That arrangement has made the coin a symbol of the conflicts of interest critics see in Trump\u2019s presidency and continued business dealings.\n\nCrypto executives cultivated ties with Trump, whose administration backed policies the industry had long sought. But legislation to establish rules for much of the industry stalled this fall amid opposition from Democrats, who are now threatening fresh scrutiny of Trump\u2019s crypto ventures.\n\nTrading surged after the first two galas were announced. After the latest announcement, it fell.\n\nIn the two weeks after each of the first two announcements, trading volume rose to between four and eight times its previous levels, according to crypto research firm Kaiko.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 06:51 PM IST", "pub_date_relative": "2h ago"}, {"title": "Arjun Bijlani Tells Trolls To Find Something Else On The Net To Comment On' Amid Backlash Over Remarks On Wife Neha", "full_content": "Arjun and Neha Bijlani are among the participating couples on Colors TV's reality show Pati Patni Aur Panga 2, hosted by Sonali Bendre and Munawar Faruqui.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 06:48 PM IST", "pub_date_relative": "2h ago"}, {"title": "Ground stop issued for Delta flights en route to Atlanta - Atlanta News First", "full_content": "Ground stop issued for Delta flights en route to Atlanta Atlanta News First Delta Air Lines automation issue triggers hundreds of Thanksgiving travel delays in Atlanta FOX 5 Atlanta \"Ground delay\" issued for Delta Flights set to arrive at Hartsfield Airport 11Alive.com Delta CEO thanks employees who helped travelers after nationwide FAA outage CBS News Delta Air Lines delays at Hartsfield-Jackson ongoing as teams work to \u2018restore automation\u2019 WSB-TV", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 06:46 PM IST", "pub_date_relative": "2h ago"}, {"title": "Stock market outlook: Nifty posts longest weekly winning streak in 5 months; will rally survive next week, Nov 23-27?", "full_content": "Stock market outlook: Nifty 50 registered nearly 2.2% weekly gains as bulls continued to dance on D-Street last week. The Indian stock market maintained its winning streak for the fourth consecutive week, its longest run in last five months. All eyes are now on whether the bulls can sustain their momentum in the holiday-shortened trading week from November 23 to 27.\n\nNifty 50 closed 1.12% higher at 25,800.60 points on Friday, November 20. BSE Sensex surged 1.08% and closed at 83,919.71 points. Last week\u2019s rally was led by banking and financial services stocks. Additionally, the healthcare and pharmaceutical segment also saw strong upside moves in some stocks.\n\nNifty 50 saw strong buying interest during the last trading session which helped the benchmark to breakout from its consolidation range and sustaining above the previous day\u2019s high, noted Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking, signalling towards a positive near-term outlook.\n\n\u201cOn the daily chart, the index has broken out of a bullish flag pattern, signaling potential continuation of the uptrend towards 26,000, followed by 26,340, which coincides with the psychological resistance and previous all-time high,\u201d stated Mukherjee.\n\nDespite expectations of positive momentum, failure to surpass Friday\u2019s high could lead to near-term consolidation within the 25,100\u201325,781 range, with Thursday's low acting as the lower boundary, the expert added.\n\n\u201cThe short-term support has been revised higher to 25,100\u201325,000, coinciding with last week's low and the lower boundary of the consolidation range. The overall bias remains positive, with buying on dips preferred as long as this support zone remains intact,\u201d stated Mukherjee.\n\nNifty 50 index continued to form higher highs and higher lows, supported by strong buying interest in the banking and auto sectors, according to Dr. Ravi Singh, Chief Research Officer from Master Capital Services Ltd.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 06:37 PM IST", "pub_date_relative": "2h ago"}, {"title": "'Stabbed Me In The Back': Eisha Singh Appears To Hit Out At Avinash Mishra Amid Breakup, Cheating Rumours", "full_content": "Her post came days after Avinash asked people to respect everyone's privacy and treat relationships as personal.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 06:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "Watch: Argentina Midfielder Leandro Paredes Collapses During TV Interview After Boca Juniors' Win", "full_content": "Argentina Midfielder Leandro Paredes reportedly began experiencing dizziness towards the end of the first half but continued playing after the interval.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 06:33 PM IST", "pub_date_relative": "2h ago"}, {"title": "Inside an AI prophet\u2019s secretive visions for humanity\u2019s future - The Washington Post", "full_content": "Inside an AI prophet\u2019s secretive visions for humanity\u2019s future The Washington Post Opinion | Don\u2019t Play Anthropic\u2019s Game The New York Times Did you just invest in a company that could destroy humanity? The Independent DealBook AGI panel: Dan Hendrycks wants frontier AI training paused The Next Web Opinion | Anthropic warned investors what could go wrong. Educators and parents should listen. Star Tribune", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 06:32 PM IST", "pub_date_relative": "2h ago"}, {"title": "The life, death and improbable rebirth of LA\u2019s most beloved diner - The Guardian", "full_content": "The life, death and improbable rebirth of LA\u2019s most beloved diner The Guardian Cole\u2019s French dips, the Original Pantry Cafe return in an era of closures Los Angeles Times The Original Pantry Reopens November 19, and a Homeless Nonprofit Is Running It Food Journal Magazine A century-old Downtown Los Angeles diner is back, with a new mission KTLA How A Why This Iconic Los Angeles Diner Rising From The Ashes Matters So Much Right Now \u0418\u0424\u0417 \u0420\u0410\u041d", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 06:32 PM IST", "pub_date_relative": "2h ago"}, {"title": "Teradyne CEO Gregory Smith sells $942,880 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 06:31 PM IST", "pub_date_relative": "2h ago"}, {"title": "Exclusive-Like SpaceX, Anthropic ran an unusual IPO process, chafing some bankers", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 06:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Pizza chains are under pressure. GLP-1 use is only one part of the problem", "full_content": "Big pizza chains are struggling as weaker consumer spending, a wider variety of dining options and the rise of GLP-1 medications weigh on their sales.\n\nThe pandemic was a boom time for Domino's Pizza , Papa Johns , Little Caesars and Pizza Hut. But since dining rooms reopened, the biggest U.S. pizza chains have faced an uphill battle to retain their customers.\n\nThese days, consumers are watching their discretionary spending but have more delivery and takeout options when they do decide to order, thanks to the accessibility of third-party platforms. Plus, food quality and the customer experience have become more important to diners who are looking for value when they order from restaurants.\n\nAs a result of pizza fatigue and challenges facing the broader restaurant industry, the number of U.S. pizza restaurants has tumbled. Since pizza locations hit a peak of 83,035 nationwide in August 2019, more than 9,600 pizzerias had closed their doors as of July 2026, according to data from Datassential.\n\nIn 2025, sales at U.S. pizza restaurants fell 0.3%, according to Technomic data. Sales at independent pizzerias slipped 0.4%. Chains, which account for about two-thirds of the domestic pizza category sales, saw revenue shrink 0.3%.\n\nPapa Johns reported that North American same-store sales declined 2.5% in 2025. Pizza Hut's U.S. same-store sales fell 5%. Among the three pizza chains that were publicly traded last year, only Domino's posted annual same-store sales growth at its U.S. restaurants, with an increase of 3%.\n\nIt isn't just diners who have lost their appetite for pizza. Since March 2020, Papa Johns stock has lost about two-thirds of its value. Even shares of Domino's, which dominates the category, have seen gains of only about 2% in that time.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 06:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Anonymous Devotee To Offer 121 Kg Gold Ornaments To Lord Venkateswara; find out its worth", "full_content": "In a letter to Andhra Pradesh Chief Minister N Chandrababu Naidu, the devotee has requested that their identity be kept anonymous", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 06:28 PM IST", "pub_date_relative": "2h ago"}, {"title": "Saudi, Qatar Stocks Slide As US-Iran Tensions Rattle Gulf Markets", "full_content": "Saudi Arabia's benchmark index Tadawul All-Share Index (TASI) slipped 1.7%, pressured by a 2% dropin Al Rajhi Bank and a 1.8% slide in Saudi National Bank.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 06:25 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "'Extremely Cheap' Yet Too Risky: Why Bernstein Is Hesitating To Buy The Dip In Nvidia Stock", "full_content": "The brokerage expects Nvidia's revenue to rise from $406.9 billion in fiscal 2027 to $690.3 billion in fiscal 2028,", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 08:42 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Karur Vysya Bank raises one-year MCLR to 9.30% from November 22: Here's what changes for borrowers", "full_content": "Karur Vysya Bank has increased its one-year Marginal Cost of Funds Based Lending Rate (MCLR) by 5 basis points (bps) to 9.30% from November 22, 2026. The private sector lender has also raised its overnight, one-month, three-month and six-month MCLR by 5 bps each.\n\nHowever, in a separate revision, the bank has reduced its Base Rate and Benchmark Prime Lending Rate (BPLR) by 25 bps each.\n\nThe revised lending rates were announced through a regulatory filing dated November 19. The changes will affect borrowers differently depending on the benchmark to which their loans are linked.\n\nFollowing the latest revision, the bank's overnight and one-month MCLR have increased from 8.85% to 8.90%. The three-month rate has moved up from 9% to 9.05%.\n\nSimilarly, the six-month MCLR has been raised from 9.15% to 9.20%, while the one-year MCLR has increased from 9.25% to 9.30%.\n\nAlongside the MCLR increase, Karur Vysya Bank has lowered two other lending benchmarks.\n\nThe bank's Base Rate has been reduced from 11.20% to 10.95%, marking a cut of 25 bps. The Benchmark Prime Lending Rate has also been brought down from 16.20% to 15.95%.\n\nBoth these changes will also come into effect from Sunday, November 22.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:37 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Will a PF withdrawal for buying a house be tax-free after five years of service?", "full_content": "We understand that your Provident Fund (PF) account was maintained with an employer-managed private PF trust and is now being transferred to the Employees' Provident Fund Organization (EPFO). We further understand that you have completed more than five years of continuous service with your employer and have contributed to PF for more than five years.\n\nThe EPF Scheme 2026 permits partial withdrawal (subject to eligibility conditions and specified limits) of provident fund balance for housing purposes, which covers following:\n\niv) repayment of a home loan obtained for purchase, construction of a flat or house or for acquisition of a site; and\n\nv) additions, alterations, renovations or improvements to an existing house or flat:\n\nAforesaid is a partial withdrawal, not a full account closure. The remaining balance continues to earn interest.\n\nFurther, since you have completed more than 5 years of continuous service and contribution, such partial withdrawal from PF shall be fully exempt from tax.\n\nIt may be noted that regardless of period of service, where an employee contribution exceeded INR 2.5 lakh in a year, the interest earned on such excess portion of contribution, would have been taxable on a yearly basis (on accrual) at applicable slab rate for that year. In such case, such interest shall not again be separately taxable on withdrawal.\n\nCatch all the Instant Personal Loan , Business Loan , Business News , Money news , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:32 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Corporate America hunts for \u2018generational\u2019 growth in AI, trading cards and the L.A. airport", "full_content": "There\u2019s been no shortage of trends deemed once-in-a-generation by executives on earnings calls.", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 08:31 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Taiwan Mulls Lowering Margin Requirement to Support Stock Market", "full_content": "Taiwan is considering lowering the margin requirement ratio for stock investors using borrowed funds as it tries to stem a selloff after the benchmark equity index\u2019s worst week in 35 years.\n\nThe Taiwan Stock Exchange said it held an emergency meeting with 10 local brokerages Sunday to discuss the potential move, which would cut the minimum margin maintenance ratio to 120% from the current 130%.\n\nThe exchange and brokers discussed potential scenarios that could arise if the ratio were lowered, and will assess any operational issues, according to the bourse. No decision was reached at the meeting, and any change would require approval from the Financial Supervisory Commission.\n\nTaiwan currently requires a minimum margin maintenance ratio of 130% for investors who buy stocks with borrowed funds, meaning the market value of their securities must remain at least 1.3 times the amount borrowed.\n\nThe island\u2019s market and finance authorities have utilized a growing arsenal of measures to combat the market rout, with little effect. The FSC tightened short-selling curbs again Saturday, banning such trades below the previous day\u2019s close across the market after two earlier rounds of restrictions failed to stop the slide.\n\nThe latest curbs cover both margin short sales and borrowed shares. Authorities also raised the minimum margin requirement for short sales to 150% from 130%, and temporarily suspended the acceptance of applications from securities firms to list new put warrants.\n\nElsewhere, China announced Sunday that it will cut the minimum margin requirement for leveraged investors to 80% from 100%, starting on Nov. 30. Earlier this month, South Korea waived a rule requiring brokerages to maintain collateral worth at least 140% of their margin loans to prevent forced selling from worsening stock-market volatility.\n\nThis article was generated from an automated news agency feed without modifications to text.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 08:21 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Senior citizens can earn 8.5% on 5-year FDs: These small finance banks offer the highest rates", "full_content": "Senior citizens looking to earn a steady income from their savings can still find fixed deposit (FD) interest rates of up to 8.5% for a five-year investment period at select small finance banks. These rates are higher than those offered by many traditional banks, although depositors should weigh the returns against the risks before committing their money.\n\nFor individuals aged 60 years and above, fixed deposits remain a popular option because they offer predictable returns and allow savings to grow over a specified period. Several small finance banks are offering competitive rates on five-year FDs for deposits of up to \u20b9 3 crore.\n\nSuryoday Small Finance Bank is among the banks offering the highest returns, with a five-year FD interest rate of 8.5% for senior citizens, according to the rates provided.\n\nJana Small Finance Bank is offering 8% on deposits with the same tenure. Other small finance banks are offering rates ranging from 6.25% to 7.7%.\n\nHigher interest rates can make small finance bank FDs attractive, but senior citizens should also consider the safety of their deposits.\n\nThe Deposit Insurance and Credit Guarantee Corporation (DICGC) insures bank deposits of up to \u20b9 5 lakh per depositor per bank. This coverage includes both the principal and interest and applies across savings accounts, fixed deposits and other eligible deposits held with the same bank.\n\nFinancial experts generally advise depositors to understand this insurance limit before placing large sums in small finance bank FDs. Keeping deposits within the insured limit can help reduce exposure if a bank faces financial difficulties.\n\nInterest earned on fixed deposits is taxable according to the depositor's applicable income tax slab. Banks are required to deduct tax at source (TDS) when interest earned on deposits exceeds \u20b9 1 lakh in a financial year for senior citizens.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 08:18 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Organon earnings on deck as Sun Pharma deal looms", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 08:05 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ChipMOS earnings up next: Can packaging specialist sustain growth?", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 08:05 PM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold, silver, copper, aluminium, platinum to zinc: Why are metal prices crashing to multi-month lows? Key reasons", "full_content": "Sharmila Bhadoria Published 22 Nov 2026, 08:01 PM IST Prefer Livemint on Google Last week was a disappointing one for the metals segment, with a broad-based selloff across both base metals, be it base metals like aluminium, copper or zinc, or precious metals like gold, silver or platinum. Gold prices are currently hovering to their 14-month low levels, whereas silver has declined more than 60% from its all-time high level.\n\nConcerns around rising inflation, higher yields, stronger possibility of US Federal Reserve rate hike in December, and potential slowdown in artificial intelligence-related capital expenditure (capex) were among the key factors that contributed to metals\u2019 meltdown.\n\nGold prices are currently hovering to their multi-month low levels. Silver rates in India which surged to their all-time high levels in the first half of 2026 are currently hovering around their 14-month low level. Platinum is also trading close to their multi-month low levels.\n\nOn Multi Commodity Exchange ( MCX ), silver futures (with December expiry) closed marginally higher at \u20b9 1,48,900 per kilogram. Silver rates in the international market tumbled below $ 42 per ounce on Friday, reaching their lowest level since September 2025.\n\n\u201c25% of the silver mind is regained by nature whereas 99.9% gold is recycled. This creates a systematic demand on Silver unlike Gold. Also silver is used increasingly in EV, electronics and batteries. This is expected to put additional pressure on silver demand,\u201d explained Abhishek Banerjee, smallcase Manger, Founder of Lotusdew Wealth and Investment Advisors, while remaining bullish on the precious metal .\n\nMCX Gold Futures with December expiry closed 4.32% lower at \u20b9 1,21,949 per 10 gram on Friday.\n\nConcerns around sticky US inflation, Fed rate hike bets and a stronger US dollar weighed on gold prices.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 08:01 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Social Security benefits are rising in 2027, but other changes could affect what you keep", "full_content": "Whether you're working or retired, changes to Social Security in 2027 could affect your finances.\n\nStarting in January, millions of program beneficiaries will get a 3.6% increase to their benefits, thanks to the annual cost-of-living adjustment. But rising Medicare premiums could chip away at the increase \u2014 and as beneficiaries' incomes rise, that may affect the taxes they owe and their eligibility for a new senior deduction.\n\nMeanwhile, a higher taxable earnings cap means some workers will pay Social Security taxes on more income, reducing their paycheck.\n\nSocial Security's limit for payroll taxes is adjusted every year to reflect the average wage index.\n\nIn 2027, the taxable maximum will go up to $192,300 in earnings, up from $184,500 in 2026. Workers and employers each pay a 6.2% payroll tax on earnings up to that limit \u2014 or 12.4% for self-employed workers. Medicare taxes of 1.45% for both workers and employers are not subject to a limit.\n\nIn 2027, workers who earn $192,300 or more will pay $11,922.60 in total Social Security payroll taxes, according to the Social Security Administration, while self-employed workers will pay $23,845.20.\n\n\"If you're somebody whose income is over what the new threshold is going to be, this increase in the threshold results in a tax increase to you,\" said Tim Steffen, director of advanced planning at financial services firm Baird.\n\nThe 3.6% Social Security cost-of-living adjustment for 2027 is slated to increase retirement benefits by about $75 per month on average, according to the Social Security Administration.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 08:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks are in a correction heading into the Thanksgiving holiday. What to brace for next.", "full_content": "Other stocks are in a bear market, which could be bad timing with the crucial holiday shopping period ahead", "source": "MarketWatch Top Stories", "pub_date_str": "22 Nov 2026, 07:30 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Borrowing money to invest in stocks? Charlie Munger's warning explains why a market crash can put your savings at risk", "full_content": "Charlie Munger, Warren Buffett's longtime investing partner and former vice chairman of Berkshire Hathaway, believed that investors should focus as much on avoiding major mistakes as they do on finding winning investments. One of the biggest risks he repeatedly cautioned against was borrowing money to buy stocks. While taking a loan to invest can magnify gains when markets rise, it can also accelerate losses during a downturn, leaving investors with a depleted portfolio and debt to repay.\n\nMunger's warning against excessive leverage is particularly relevant for investors approaching retirement, when a sharp market correction can magnify losses, force premature selling and jeopardise years of accumulated wealth . Unlike younger investors, those nearing retirement may have limited time to rebuild their savings or recover from a substantial portfolio loss.\n\nThe lesson also applies to Indian investors using margin trading facilities (MTF), leveraged trading positions or personal loans to increase their stock market exposure. The risk is not limited to retirees. Anyone investing borrowed money without the financial capacity to absorb losses could find themselves under pressure when markets turn volatile.\n\nConsider two investors who each have \u20b9 5 lakh to invest. The first invests the entire amount in equities without borrowing. The second borrows another \u20b9 2.5 lakh, taking their total market exposure to \u20b9 7.5 lakh.\n\nIf the market declines 30%, the first investor's portfolio falls to \u20b9 3.5 lakh. This represents a loss of \u20b9 1.5 lakh, or 30% of the original investment.\n\nFor the second investor, the portfolio declines to \u20b9 5.25 lakh. However, the \u20b9 2.5 lakh loan remains outstanding. After deducting the borrowed amount, the investor is left with equity worth \u20b9 2.75 lakh. This translates into a 45% loss on the original \u20b9 5 lakh capital, excluding interest and other borrowing costs.\n\nThe difference becomes more significant when interest costs are included.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 07:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "52% rally in six months! Mukul Agrawal portfolio\u2019s defence stock has 19% upside, says ICICI Direct - Do you own it?", "full_content": "Sharmila Bhadoria Published 22 Nov 2026, 07:18 PM IST Prefer Livemint on Google Shares of PTC Industries ended more than a percentage point higher on Friday, November 20. The Mukul Agarwal portfolio\u2019s stock has delivered more than 23% return in three months, and around 52% return in six months.\n\nThe defence player reported profit in-line with expectations in the second quarter of financial year 2026-27. ICICI Securities sees 19% upside potential in the stock.\n\nPTC Industries performance was broadly in line with our expectations. Its consolidated EBITDA increased by 119% on an annual basis, largely driven by the strength in Aerolloy Technology (ATL).\n\n\u201cWe believe that the company would likely now enter the approval phase (building order book; recently won a couple of orders from Safran and Airbus); the execution phase is expected to start FY29 onwards (ramp-up across Blue Origin, BrahMos, GTRE, and VSSC titanium ingots provides multi-year revenue visibility),\u201d read the ICICI Securities report.\n\nPTC Industries\u2019 5,000tpa EBCHR plant is on the verge of commissioning. After that, the next few years could be a phase of approval and order build-up, followed by an exponential growth phase backed by execution. Material and machine parts supply ecosystem is likely to emerge as the biggest beneficiary, given that the Indian aerospace ecosystem is at an inflection point, as per the report.\n\nThe brokerage gave a \u2018Buy\u2019 rating for the stock with a target price of \u20b9 29,000. \u201cWe retain our BUY rating and the TP of INR 29,000, which is based on 65x FY29E EPS.\u201d\n\nThe stock closed 1.01% higher at \u20b9 24,111.13 per share on BSE with a market capitalisation of \u20b9 38,225.13 crore on Friday. Its share price value has 23% in three months, and 52.67% in six months. Its share price value has surged 40% in one year.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 07:18 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Sensex Rejig: Shriram Finance To Enter BSE Index From Dec. 21 As Trent Takes An Exit", "full_content": "The changes will become effective during the trading session on Monday, December 21, 2026.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 07:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Saudi Arabia, Bahrain report new attacks as Iran says it remains open to a deal with U.S.", "full_content": "Saudi Arabia and Bahrain reported attacks by Iran-linked forces over the weekend, as Iran's foreign minister said his government remains open to a deal to end the war with the U.S.\n\n\"Intercepted and destroyed a drone launched by the Houthi terrorist militia toward the Riyadh area,\" the Saudi-led Coalition to Support Legitimacy in Yemen, which has been leading the fight against the Iran-backed group, said Sunday in a post on X.\n\nThe coalition said late Saturday that its air defenses \"intercepted and destroyed a ballistic missile\" launched by the Yemen-based Houthis toward Saudi Arabia's western region, which includes some of the country's sensitive energy refining and export infrastructure.\n\n\"As a result of the heinous Iranian aggression, a civilian industrial facility was targeted, causing a fire at the site,\" Bahrain's Ministry of Interior said on X. The ministry later said two people , a Bahraini citizen and a Pakistani resident, were injured in the attack.\n\nIranian state media reported late Saturday that the country's Islamic Revolutionary Guard Corps fired missiles and drones at U.S. military facilities in Bahrain .\n\nA separate Iranian media report claimed the IRGC's air defenses intercepted and destroyed a U.S. MQ-9 drone .\n\nU.S. Central Command did not immediately respond to CNBC's request for comment on either Iranian report.\n\nMeanwhile, Iranian Foreign Minister Abbas Araghchi said his government remains open to a negotiated settlement to the war. An agreement aimed at developing a permanent peace deal signed in June between President Donald Trump and his Iranian counterpart Masoud Pezeshkian \u2014 the so-called Islamabad Memorandum of Understanding \u2014 later broke down.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 06:55 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump\u2019s Memecoin Gala Returns With Demand Down and Scrutiny Up", "full_content": "The first time Morten Christensen traded his way into a gala with President Donald Trump, it cost him about $1,200. The second time, about $500. This time, he says, he ended up making $6.\n\nTo qualify, Christensen bought Trump\u2019s memecoin and placed a separate bet that would pay off if its price fell, as he had for the first two events.\n\n\u201cA cup of coffee,\u201d said Christensen, a long-time trader who runs a crypto-giveaways site AirdropAlert.com, referring to the small profit this time round.\n\nTrump is scheduled to attend a third gala for holders of his memecoin Sunday at Trump National Golf Club in Virginia, according to the organizers. They list boxer Floyd Mayweather, entrepreneur Kevin O\u2019Leary, basketball player Tristan Thompson and mentalist Lior Suchard among the celebrities expected at Sunday\u2019s event.\n\nThe coin, known as $TRUMP, went on sale days before Trump took office for a second term. It has subsequently fallen around 98% from the highs and is near record lows. The president reported $636 million in earnings from it last year. Affiliate CIC Digital holds a large share of the supply and earns revenue when the coin trades, while some of the biggest holders can qualify for an invitation to see the president in person. That arrangement has made the coin a symbol of the conflicts of interest critics see in Trump\u2019s presidency and continued business dealings.\n\nCrypto executives cultivated ties with Trump, whose administration backed policies the industry had long sought. But legislation to establish rules for much of the industry stalled this fall amid opposition from Democrats, who are now threatening fresh scrutiny of Trump\u2019s crypto ventures.\n\nTrading surged after the first two galas were announced. After the latest announcement, it fell.\n\nIn the two weeks after each of the first two announcements, trading volume rose to between four and eight times its previous levels, according to crypto research firm Kaiko.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 06:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ground stop issued for Delta flights en route to Atlanta - Atlanta News First", "full_content": "Ground stop issued for Delta flights en route to Atlanta Atlanta News First Delta Air Lines automation issue triggers hundreds of Thanksgiving travel delays in Atlanta FOX 5 Atlanta \"Ground delay\" issued for Delta Flights set to arrive at Hartsfield Airport 11Alive.com Delta CEO thanks employees who helped travelers after nationwide FAA outage CBS News Delta Air Lines delays at Hartsfield-Jackson ongoing as teams work to \u2018restore automation\u2019 WSB-TV", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 06:46 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stock market outlook: Nifty posts longest weekly winning streak in 5 months; will rally survive next week, Nov 23-27?", "full_content": "Stock market outlook: Nifty 50 registered nearly 2.2% weekly gains as bulls continued to dance on D-Street last week. The Indian stock market maintained its winning streak for the fourth consecutive week, its longest run in last five months. All eyes are now on whether the bulls can sustain their momentum in the holiday-shortened trading week from November 23 to 27.\n\nNifty 50 closed 1.12% higher at 25,800.60 points on Friday, November 20. BSE Sensex surged 1.08% and closed at 83,919.71 points. Last week\u2019s rally was led by banking and financial services stocks. Additionally, the healthcare and pharmaceutical segment also saw strong upside moves in some stocks.\n\nNifty 50 saw strong buying interest during the last trading session which helped the benchmark to breakout from its consolidation range and sustaining above the previous day\u2019s high, noted Pabitro Mukherjee, Deputy Vice President-Research, Bajaj Broking, signalling towards a positive near-term outlook.\n\n\u201cOn the daily chart, the index has broken out of a bullish flag pattern, signaling potential continuation of the uptrend towards 26,000, followed by 26,340, which coincides with the psychological resistance and previous all-time high,\u201d stated Mukherjee.\n\nDespite expectations of positive momentum, failure to surpass Friday\u2019s high could lead to near-term consolidation within the 25,100\u201325,781 range, with Thursday's low acting as the lower boundary, the expert added.\n\n\u201cThe short-term support has been revised higher to 25,100\u201325,000, coinciding with last week's low and the lower boundary of the consolidation range. The overall bias remains positive, with buying on dips preferred as long as this support zone remains intact,\u201d stated Mukherjee.\n\nNifty 50 index continued to form higher highs and higher lows, supported by strong buying interest in the banking and auto sectors, according to Dr. Ravi Singh, Chief Research Officer from Master Capital Services Ltd.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 06:37 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Exclusive-Like SpaceX, Anthropic ran an unusual IPO process, chafing some bankers", "full_content": "", "source": "Investing.com News", "pub_date_str": "22 Nov 2026, 06:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Pizza chains are under pressure. GLP-1 use is only one part of the problem", "full_content": "Big pizza chains are struggling as weaker consumer spending, a wider variety of dining options and the rise of GLP-1 medications weigh on their sales.\n\nThe pandemic was a boom time for Domino's Pizza , Papa Johns , Little Caesars and Pizza Hut. But since dining rooms reopened, the biggest U.S. pizza chains have faced an uphill battle to retain their customers.\n\nThese days, consumers are watching their discretionary spending but have more delivery and takeout options when they do decide to order, thanks to the accessibility of third-party platforms. Plus, food quality and the customer experience have become more important to diners who are looking for value when they order from restaurants.\n\nAs a result of pizza fatigue and challenges facing the broader restaurant industry, the number of U.S. pizza restaurants has tumbled. Since pizza locations hit a peak of 83,035 nationwide in August 2019, more than 9,600 pizzerias had closed their doors as of July 2026, according to data from Datassential.\n\nIn 2025, sales at U.S. pizza restaurants fell 0.3%, according to Technomic data. Sales at independent pizzerias slipped 0.4%. Chains, which account for about two-thirds of the domestic pizza category sales, saw revenue shrink 0.3%.\n\nPapa Johns reported that North American same-store sales declined 2.5% in 2025. Pizza Hut's U.S. same-store sales fell 5%. Among the three pizza chains that were publicly traded last year, only Domino's posted annual same-store sales growth at its U.S. restaurants, with an increase of 3%.\n\nIt isn't just diners who have lost their appetite for pizza. Since March 2020, Papa Johns stock has lost about two-thirds of its value. Even shares of Domino's, which dominates the category, have seen gains of only about 2% in that time.", "source": "CNBC Top News", "pub_date_str": "22 Nov 2026, 06:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anonymous Devotee To Offer 121 Kg Gold Ornaments To Lord Venkateswara; find out its worth", "full_content": "In a letter to Andhra Pradesh Chief Minister N Chandrababu Naidu, the devotee has requested that their identity be kept anonymous", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 06:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Saudi, Qatar Stocks Slide As US-Iran Tensions Rattle Gulf Markets", "full_content": "Saudi Arabia's benchmark index Tadawul All-Share Index (TASI) slipped 1.7%, pressured by a 2% dropin Al Rajhi Bank and a 1.8% slide in Saudi National Bank.", "source": "NDTV Profit", "pub_date_str": "22 Nov 2026, 06:25 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Gold prices plunge ahead of wedding season. How much can families save when buying bridal jewellery now?", "full_content": "The sharp correction in gold prices has come as a welcome relief for families preparing for weddings, bringing down the cost of one of the biggest expenses in traditional Indian wedding budgets. After months of elevated bullion prices that pushed some buyers to postpone purchases or opt for lighter jewellery, the recent decline has improved affordability ahead of the wedding season.\n\nGold prices, which had climbed to around \u20b9 1.75 lakh- \u20b9 1.80 lakh per 10 grams at their peak, have fallen to approximately \u20b9 1.19 lakh- \u20b9 1.20 lakh per 10 grams, according to the price levels cited in the ANI report.\n\nFor families planning to purchase bridal necklaces, bangles, earrings and other traditional ornaments, the correction could translate into substantial savings. The benefit is particularly significant for those purchasing larger quantities of gold for weddings .\n\nConsider a family planning to purchase 50 grams of gold. At \u20b9 1.80 lakh per 10 grams, the gold component would cost \u20b9 9 lakh. At \u20b9 1.20 lakh per 10 grams, the same quantity would cost \u20b9 6 lakh.\n\nThis translates into a potential saving of \u20b9 3 lakh on the gold component alone.\n\nFor families purchasing jewellery for the bride and other family members, the lower gold prices could help reduce the overall wedding budget or allow them to purchase more jewellery within the same allocation.\n\nGold purchases account for a significant portion of wedding-related spending in India. Jewellery is often bought months before the wedding, making price movements particularly important for households planning large purchases.\n\nThe recent correction has improved affordability after a prolonged period of elevated prices. It has also created an opportunity for families who had postponed jewellery purchases because of the high cost of bullion.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 06:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock recommendations for 23 November from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndian equities shrugged off a global selloff in AI stocks on Friday, recovering sharply from a weak start and extending gains for a second consecutive session. Nifty 50 also posted its highest closing level in about ten months. The index rose 286.30 points, or 1.12%, to close at 25,800.60, after swinging more than 450 points from the day's low, while Sensex climbed 894.15 points, or 1.08%, to 83,915.90.\n\nFor the week, it gained about 2.6%, marking its fourth consecutive weekly advance. Relentless foreign buying, record inflows into Indian equities this month, and a rupee that strengthened to 92.67 against the dollar powered the rebound. Banking stocks led the charge, with Bank Nifty surging 2.5% to a fresh record high above 64,600, while IT stocks rallied more than 2%.\n\nMetals, Consumer Durables, Oil and Gas, and PSU Banks lagged. Apollo Hospitals, Axis Bank, and Max Healthcare were the top gainers. Meanwhile, Titan, Tata Steel, and NTPC led the decline. However, market breadth was weak, with 1,414 stocks advancing against 2,205 declining, signalling narrow rally.\n\nIndian equity markets witnessed a strong rebound on Friday, November 20, 2026, with Nifty 50 surging 286.30 points (1.12%) to close at 25,800.60, supported by robust buying in Banking, Financial Services, and IT stocks. The benchmark opened at 25,368.00, touched an intraday low of 25,345.20, and rallied to a high of 25,808.80, clsoing near the day's peak.\n\nSectoral performance was led by Nifty Private Bank (+3.01%), Realty (+1.71%), Financial Services (+1.66%), IT (+1.30%), and PSU Bank (+1.23%), while Media (-1.68%), Consumer Durables (-0.40%), and Metal (-0.23%) underperformed.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 06:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation metho
