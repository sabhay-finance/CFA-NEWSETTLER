 equities State Bank of India Share Price Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper SBI economists call for scrapping LTCG tax on equities SECTIONS SBI economists call for scrapping LTCG tax on equities PTI Last Updated: Oct 12, 2026, 09:12:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis SBI economists are advocating for the elimination of long-term capital gains tax to stimulate sustained investment in Indian equity markets. This proposal arises amid substantial foreign portfolio investor withdrawals exceeding Rs 3 lakh crore this year, prompting concerns. Furthermore, the lack of AI-focused stocks is contributing to these market exits.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 09:12 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Inflation likely peaked for 2026 but will remain sticky, according to prediction markets", "full_content": "Traders on prediction market platform Kalshi think inflation likely reached a peak for the year, though they don't see a sharp move lower anytime soon.\n\nTraders think the September consumer price index, due Wednesday at 8:30 a.m. ET, will show a 3.6% increase year over year. That's in line with a FactSet consensus estimate.\n\nThat would mark an increase from the 3.4% advance seen in August . Yet speculators on Kalshi place just under one-in-three odds that inflation will hit new highs in 2026. Previously, year-over-year inflation peaked at 4.2% in May .\n\nInflation-related contracts on the platform ask traders if they think that CPI will come in above various levels for the month of September or if it will go above certain levels at any point in 2026. The contracts are resolved using the official data from the Bureau of Labor Statistics.\n\nCore inflation is predicted to remain steady at 2.4% year over year, also in line with economists' estimates, according to FactSet. However, traders think that core inflation \u2014 which excludes food and energy price changes \u2014 will remain elevated throughout the rest of 2026.\n\nThere's just a 6% chance that core inflation falls below 2.2% this year. Annual core inflation was last below that level before the spike in inflation that began in 2021.\n\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.", "source": "CNBC Finance", "pub_date_str": "12 Oct 2026, 09:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Market Trading Guide: Astra Microwave, Manappuram among 5 stock recommendations for Tuesday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Market Trading Guide: Astra Microwave, Manappuram among 5 stock recommendations for Tuesday Written by Akash Podishetti , ETMarkets.com | Oct 12, 2026, 09:02:20 PM IST 1 / 6 Trading Guide Indian markets failed to hold early gains on Monday as sentiment weakened amid a rise in the 10-year bond yield to a three-year high and continued FII outflows driven by external uncertainties. Going forward, analysts say the Middle East remains a key overhang, with continued Houthi attacks on Saudi and regional energy infrastructure keeping concerns over potential supply disruptions and elevated crude oil prices alive. Here are 5 stock recommendations for Tuesday\n\nAstra Microwave is attempting a breakout from a downward-sloping channel pattern on the daily chart, currently trading at Rs 1,690 after consolidating and defending its base along the 1,600\u20131,630 zone. The 14-period RSI has crossed back into positive territory at 53.56, indicating steadying momentum and renewed buying interest off the channel lows. Sachin Gupta, VP \u2013 Technical Research at Choice Equity Broking\n\nManappuram is staging a technical rebound off its long-term base on the daily chart, currently trading at 320 after finding support around the 308\u2013312 zone. The 14-period RSI has curled upward to 48.75, showing a steady pickup in momentum as selling pressure subsides from recent lows. Across the moving average framework, the price has reclaimed its 20 EMA and the long-term 200 EMA, with further upside opening the way toward retesting the overhead 50 and 100 EMAs. Sachin Gupta, VP \u2013 Technical Research at Choice Equity Broking\n\nLaurus Labs is demonstrating strong bullish continuation on the daily timeframe, currently trading at fresh swing highs of 2,069.20 after completing a brief shallow consolidation above the 1,980\u20132,000 zone.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 08:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ahead of Market: 10 things that will decide stock market action on Tuesday", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Ahead of Market: 10 things that will decide stock market action on Tuesday Lenskart Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Ahead of Market: 10 things that will decide stock market action on Tuesday SECTIONS Ahead of Market: 10 things that will decide stock market action on Tuesday By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 12, 2026, 08:53:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian benchmark indices reversed early gains on Monday, with the Sensex falling 548 points and the Nifty closing below 22,400 amid persistent FII selling, rising bond yields and geopolitical concerns. Investors will track key stocks, global cues, crude oil prices, inflation data and earnings expectations for Tuesday\u2019s market direction.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "12 Oct 2026, 08:53 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nominee vs legal heir: Who gets your bank fixed deposits, PPF and mutual funds if you die without a will?", "full_content": "When you open a bank fixed deposit, invest in mutual funds or put money in small savings schemes like the Public Provident Fund (PPF), you are typically asked to nominate a person who can receive the funds in the event of your death.\n\nThis helps banks and financial institutions identify whom to approach for settling the investment. However, many investors assume that nominating someone automatically makes them the legal owner of the money after their death.\n\nA nominee only acts as a custodian of the assets, which may include mutual funds, PPF corpus or fixed deposit money, until they are transferred to the rightful legal heirs. Such a person has no ownership rights over these assets unless they are also a legal heir, such as the deceased investor\u2019s spouse, children or parents.\n\nThe purpose of having a nominee is to facilitate the smooth settlement and transfer of assets after the account holder's death.\n\nYou can designate a trusted and eligible person as a nominee for your assets, who can be your spouse, sibling, family member or relative.\n\nIt is also important to review and update nominations after major life events, such as marriage, divorce, the death of a nominee, or the birth or adoption of a child, to ensure that your nominations reflect your wishes.\n\nThe final ownership of money in a bank account, mutual fund, or other assets is determined by a valid will, succession laws, and the rights of legal heirs, not merely by the nominee mentioned in the account.\n\nIf the deceased person has left a legally valid will, the assets are distributed according to that will. In the absence of a will, the applicable inheritance or succession laws decide who has the rightful claim over the money and property.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 08:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "HCL Tech Q2 Report Card: Rupee boost, record deal wins, hiring rebound and AI boom despite odds - Key numbers decoded", "full_content": "HCL Technologies was another major domestic IT player to report its September-quarter results, following TCS, which announced its earnings last week. HCL Tech's numbers came in line with analysts' consensus estimates.\n\nThe tech major reported a sharp rise in deal bookings, led by the Guardian Life and European automotive deals.\n\nDespite concerns over advances in AI, the country's third-largest IT company increased its headcount during the quarter, taking its total employee count to an all-time high of 2.3 lakh.\n\nThe company posted revenue of \u20b9 35,620 crore, registering a 3 per cent sequential increase from \u20b9 34,579 crore in the June quarter and an 11.51 per cent year-on-year rise from \u20b9 31,942 crore in the corresponding quarter last year.\n\nIn constant currency terms, revenue grew 2.3 per cent quarter-on-quarter and 2.6 per cent year-on-year. The company's Advanced AI revenue grew 28.4 per cent sequentially and 78 per cent year-on-year in constant currency terms.\n\nThe higher growth in rupee-denominated revenue compared with constant currency revenue may have been supported by favourable currency movements.\n\nThe company's Advanced AI business continued to record strong growth, with revenue reaching USD 219 million, up 78 per cent year-on-year (YoY) and 28.4 per cent quarter-on-quarter (QoQ) in constant currency terms.\n\nChairperson Roshni Nadar Malhotra said the accelerating growth in Advanced AI revenue validated the company's business strategy. She added that investments across the AI stack and strategic partnerships positioned HCLTech to serve enterprises and governments globally.", "source": "LiveMint Markets", "pub_date_str": "12 Oct 2026, 08:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Rupee rebounds nearly 1% after RBI moves to curb speculative trades", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee rebounds nearly 1% after RBI moves to curb speculative trades Bank of Baroda Share Price Punjab National Bank Share Price Union Bank of India Share Price Indian Bank Share Price Canara Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Rupee rebounds nearly 1% after RBI moves to curb speculative trades SECTIONS Rupee rebounds nearly 1% after RBI moves to curb speculative trades By Atmadip Ray , OUR BUREAU Last Updated: Oct 12, 2026, 08:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The rupee rebounded nearly 1% to 95.77 per dollar on Monday after the RBI announced measures to curb speculative currency trades. A special window for state-owned oil marketing companies eased spot-market pressure, though dollar buying by importers and corporates capped gains. Elevated crude prices and global uncertainties continue to weigh on the currency.\n\n(What's moving Sensex and Nifty Track latest market news , stock ators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Chip Stocks Fall Over 5% As Micron, Intel, Nvidia, AMD, SK Hynix And SanDisk Trade Lower Amid High Bond Yield, Oil Prices", "full_content": "Intel Corp' stock futures decreased by 1.51% to $103.12 during early trade.", "source": "NDTV Profit", "pub_date_str": "12 Oct 2026, 07:25 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income", "Derivatives"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Gold vs equity vs real estate: How much would \u20b91 lakh invested 20 years ago be worth today? Gold leads the pack", "full_content": "FundsIndia\u2019s October 2026 report compares 20-year returns across asset classes. \u20b91 lakh invested in gold grew to \u20b914.6 lakh, compared with \u20b98 lakh in Indian equities, \u20b94.3 lakh in debt and \u20b94.2 lakh in real estate, highlighting gold\u2019s stronger performance over the period.", "source": "LiveMint Money", "pub_date_str": "12 Oct 2026, 07:24 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "US issues warning over Saudi airports as Trump weighs new strikes on Iran - Fox News", "full_content": "US issues warning over Saudi airports as Trump weighs new strikes on Iran Fox News FAA warns U.S. airlines of safety risks over Saudi Arabia after attacks CNBC Delta Postpones Direct Service To Riyadh Until March 2027 After Deadly Attacks Forbes Delta delays launch of service to Saudi Arabia over attacks on airport Yahoo Delta Delays Nonstop Service to Saudi Arabia Amid Conflict Bloomberg.com", "source": "Google News Business", "pub_date_str": "12 Oct 2026, 07:22 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}], "updated_at": "12 Oct 2026, 10:23 PM IST", "total_stories": 306};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
