    const allData = {"general": [{"title": "Taking Ozempic and worried about vision loss? This test can help you understand your risk.", "full_content": "Some research suggests that GLP-1 drugs may raise the risk of a rare eye disease that causes full or partial vision loss.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Sep 2026, 07:06 PM IST", "pub_date_relative": "2m ago"}, {"title": "CarMax earnings in focus as turnaround strategy faces test", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 07:05 PM IST", "pub_date_relative": "2m ago"}, {"title": "Meta hires MongoDB CEO CJ Desai to lead enterprise unit. MongoDB shares crater", "full_content": "MongoDB CEO CJ Desai is joining Meta Platforms as its chief enterprise platform officer and will report directly to Meta CEO Mark Zuckerberg .\n\nDesai, who was in his role at MongoDB for less than a year, will be leading the social media giant's new Meta Enterprise Platform for businesses, according to a release.\n\nThe new platform will initially prioritize a suite of tools that includes its new Muse agent, business agent and a coding tool.\n\nMeta plans to use \"strengths that few other companies have: advanced models, leading agents, large-scale infrastructure, and years of working closely with many businesses,\" Zuckerberg wrote in a release.\n\nThe MongoDB board named Dev Ittycheria as interim president and CEO. Desai took over from Ittycheria, who served as CEO for 11 years, in November 2025. Desai previously served as president of product and engineering at Cloudflare .\n\nDesai's transition comes as Meta undergoes a massive pivot, betting big on new AI products and services for its enterprise customers. Amid this transition, investors have demanded a payoff from the company's hefty AI investments on new infrastructure and tools.\n\nThe social media giant's push into the AI agent market with its Muse personal AI assistant has seen a rush of consumer demand, overtaking OpenAI's ChatGPT as the leading free iOS app.\n\nAt the same time, a heated battle is unfolding in both Washington and Silicon Valley after top AI researchers and tech leaders, such as Anthropic 's Dario Amodei, called for a development slowdown amid mounting concerns over AI safety.", "source": "CNBC World Economy", "pub_date_str": "28 Sep 2026, 07:05 PM IST", "pub_date_relative": "2m ago"}, {"title": "Jim Cramer's top 10 things to watch in the stock market Monday", "full_content": "The relentless climb in bond yields continues, and Nvidia adds $150 billion to its buyback program.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 07:05 PM IST", "pub_date_relative": "3m ago"}, {"title": "Uranium Energy faces fiscal year test as spot strategy plays out", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 07:05 PM IST", "pub_date_relative": "3m ago"}, {"title": "One Gas Inc stock hits 52-week low at 71.26 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 07:05 PM IST", "pub_date_relative": "3m ago"}, {"title": "Dow drops more than 300 points, weighed down by rising oil prices and Treasury yields: Live updates", "full_content": "Stocks fell Monday, weighed down by a jump in oil prices and Treasury yields to start the week.\n\nThe Dow Jones Industrial Average dropped 377 points, or 0.7%. The S&P 500 slid 0.5%, along with the Nasdaq Composite .\n\nBrent crude traded more than 2% higher at $106.79 per barrel. West Texas Intermediate futures gained around 2% as well to $94.40, after President Donald Trump rejected conditions for a ceasefire presented by Iran.\n\nTreasury yields build on last week's sharp moves. The benchmark 10-year Treasury note yield traded above 5.2%. The 30-year bond yield topped 5.5%. Both traded around multiyear highs.\n\nWall Street is coming off a winning week after tech and tech-linked names outperformed. Meta Platforms rallied nearly 13% in that time, as traders cheered the company's Muse artificial intelligence agent. Microsoft climbed more than 4%, while Apple and Nvidia advanced more than 1% each.\n\n10-year Treasury yield in 2026 Those gains came even as Treasury yields raced to highs not seen in years, with traders increasing bets of more Federal Reserve rate hikes due to persistent inflation. The benchmark 10-year Treasury note yield scaled to a level not seen since 2007. The 30-year bond yield reach a 2004 high. The 2-year note yield also jumped around 17 basis points last week.\n\n\"The rapid rise in 2-year government note yields worldwide signals that major central banks need to raise their policy rates further in response to the inflationary impact of higher-for-longer oil prices resulting from the recent re-escalation of the Middle East war,\" wrote Ed Yardeni, president of Yardeni Research. \"Unfortunately, these higher rates also exacerbate the outlook for large government deficits worldwide.\"\n\nRates will be in focus again this week, with a slew of key economic data on deck. The August personal consumption expenditure price index, the Fed's preferred inflation gauge, is due out Wednesday. New U.S.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 07:03 PM IST", "pub_date_relative": "5m ago"}, {"title": "U.S. stocks open the week with losses amid Iran tensions, OpenAI training halt", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 07:03 PM IST", "pub_date_relative": "5m ago"}, {"title": "Greenpro Capital completes sale of subsidiaries for HK$3.5 million", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 07:02 PM IST", "pub_date_relative": "5m ago"}, {"title": "Why you might consider a midlife sabbatical and 5 questions to answer before you do - The Washington Post", "full_content": "Why you might consider a midlife sabbatical and 5 questions to answer before you do The Washington Post", "source": "Google News Business", "pub_date_str": "28 Sep 2026, 07:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "Resideo Technologies stock hits 52-week low at 18.12 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 07:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "SpaceX launches its massive Starship rocket into orbit for the first time", "full_content": "SpaceX launched its massive Starship rocket early Monday, sending the spacecraft into orbit for the first time.\n\nStarship reached orbit around 8:15 a.m. local time with SpaceX employees in attendance at the launch loudly cheering the milestone.\n\nThe Federal Aviation Administration told CNBC by email that it issued a \"license authorization for the SpaceX Starship Super Heavy Flight 14 launch and reentry operations\" on Sept. 26.\n\nWith the 14th test flight of Starship, Elon Musk's aerospace and defense company also planned to deploy 26 of its new Starlink V3 satellites. After the Starship reached orbit, SpaceX began to quickly release the satellites around 8:25 a.m. local time.\n\nA livestream of the test flight on social network X, which is owned by SpaceX, showed the rocket taking off at 8:48 a.m. ET, or 7:48 a.m. local time, from the company town of Starbase, Texas.\n\nThe ship's booster made a \"soft splashdown\" off the coast of Starbase a few moments after launch, while the Starship spacecraft continued to climb with one of its vacuum engines going out in sub-orbital trajectory.\n\nStarship is critical to SpaceX's expansion plans. The company is counting on the giant rocket to scale its Starlink , or Connectivity, business, which was its largest and only profitable segment as of the second quarter. SpaceX operates around 11,000 active satellites in orbit today, compared to roughly 650 for competitor Eutelsat OneWeb.\n\nOn SpaceX's earnings call in August, Musk said, \"It's not out of the question that at some point, Starlink will deliver a majority of the world's internet, at least in countries where we're allowed to operate, which is the vast majority of countries.\"", "source": "CNBC World Economy", "pub_date_str": "28 Sep 2026, 07:02 PM IST", "pub_date_relative": "6m ago"}, {"title": "Apollo raises specter of an AI agentic 'bank run' hitting financial industry", "full_content": "As if things couldn\u2019t get worse for banks, artificial intelligence could present a problem for the group.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 07:00 PM IST", "pub_date_relative": "8m ago"}, {"title": "The history of this market\u2019s bad-breadth signal points to risks ahead", "full_content": "Not since the dot-com bubble have stocks thrown up this concerning metric.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Sep 2026, 07:00 PM IST", "pub_date_relative": "8m ago"}, {"title": "Christine Lagarde: Hearing of the Committee on Economic and Monetary Affairs of the European Parliament", "full_content": "It is a pleasure to be back before this Committee as part of our regular dialogue.\n\nThe topic for today\u2019s hearing goes to the heart of Europe\u2019s economic future.\n\nArtificial intelligence has the potential to transform how we produce, work and innovate. Firms are set to devote around 10% of total investment to AI in 2026, and AI-related borrowing already accounts for roughly a quarter of credit growth to firms. [ 1 ]\n\nAI could significantly enhance Europe\u2019s productivity, competitiveness and living standards. But it will also affect \u2013 and to some extent is already affecting \u2013 investment, labour markets and inflation, and it therefore also matters for monetary policy.\n\nEurope has a real opportunity to harness this technology. But success is not automatic. We need to seize the benefits, while managing the risks appropriately.\n\nIn my remarks today, I will first discuss the outlook for the euro area economy and explain our latest monetary policy decisions. I will then elaborate on how artificial intelligence may affect inflation and the wider economy.\n\nDespite headwinds from the energy shock, the euro area economy proved resilient with solid real GDP growth in the second quarter of 2026. Growth was broad-based across most countries and sectors. This pattern is expected to have continued in the third quarter.\n\nManufacturing is performing solidly, supported by higher government spending on defence and infrastructure. Consumer confidence has rebounded from the low levels in the spring, helping services recover. And increased AI-related activity is visible in digital services, business investment and exports.", "source": "ECB Press", "pub_date_str": "28 Sep 2026, 07:00 PM IST", "pub_date_relative": "8m ago"}, {"title": "AI trade enters a new phase: Why DBS favours AI adopters over capex-heavy players", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a AI trade enters a new phase: Why DBS favours AI adopters over capex-heavy players Powered By The Economic Times daily newspaper is available online now. Read Today's Paper AI trade enters a new phase: Why DBS favours AI adopters over capex-heavy players SECTIONS AI trade enters a new phase: Why DBS favours AI adopters over capex-heavy players By Kumar Gaurav , ETMarkets.com Last Updated: Sep 28, 2026, 06:59:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis DBS says the AI investment theme is entering a selective phase as investors focus on companies converting AI adoption into productivity, stronger margins and durable revenue growth. The bank favours lower-capex AI adopters while maintaining exposure to infrastructure enablers.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:59 PM IST", "pub_date_relative": "9m ago"}, {"title": "Equity capital inflow in real estate, data centre, hotel assets doubles to USD 9.5 bn in Jul-Sep: CBRE", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Equity capital inflow in real estate, data centre, hotel assets doubles to USD 9.5 bn in Jul-Sep: CBRE The Economic Times daily newspaper is available online now. Read Today's Paper Equity capital inflow in real estate, data centre, hotel assets doubles to USD 9.5 bn in Jul-Sep: CBRE SECTIONS Equity capital inflow in real estate, data centre, hotel assets doubles to USD 9.5 bn in Jul-Sep: CBRE PTI Last Updated: Sep 28, 2026, 06:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During the third quarter of 2026, India's real estate, data centre, and hospitality sectors attracted a record USD 9.5 billion, marking a notable rise from the previous year. Data centres alone accounted for 57 percent of these investments, signaling a change in investor focus. Additionally, foreign entities represented roughly 59 percent of all inflows, contributing to an impressive doubling of total capital compared to early 2025.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:56 PM IST", "pub_date_relative": "12m ago"}, {"title": "Meta, Google, Amazon, Microsoft draw Sen. Warren questions about AI tax subsidies", "full_content": "Senate Democrats are seeking information on how artificial intelligence and data center spending by Meta , Amazon , Alphabet and Microsoft has been subsidized by tax breaks authorized in the 2025 tax cutting and spending package passed by Republicans at the behest of President Donald Trump .\n\nSen. Elizabeth Warren , D-Mass., led the letters, which were sent Sunday night and shared exclusively with CNBC, to the CEOs of the four companies asking for information on tax deductions they've claimed related to AI and data center development and on their lobbying efforts in the lead-up to the passage of the 2025 legislation, known more commonly as the \"one big beautiful bill\" act .\n\nSens. Tina Smith , D-Minn., Jeff Merkley , D-Ore., Elissa Slotkin , D-Mich., Bernie Sanders , I-Vt., and Richard Blumenthal , D-Conn., joined the letters.\n\n\"Americans across the country are worried about the impacts of artificial intelligence (AI) on their lives \u2014from increased utility bills to threats of job losses and cyberattacks,\" the lawmakers wrote in the letters. \"But rather than meaningfully regulate Big Tech companies and slow down the mad rush to deploy this new technology, Republicans in Washington have passed tax subsidies for AI development and AI data centers.\"\n\nSpokespeople for all four companies did not immediately respond to a request for comment. The White House also did not immediately respond to a request for comment.\n\nThe probe comes as Washington grapples with how to deal with AI and data center development, as public backlash has become increasingly intense heading into the 2026 midterm election .\n\nDemocrats are hoping to win back a majority in the House and Senate \u2014 though Republicans are still favored in most projections to retain the upper chamber \u2014 and have tried to distinguish themselves as the more pro-regulation party.\n\nDemocratic 2028 presidential hopefuls like California Gov. Gavin Newsom have made statements and issued executive orders .", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 06:54 PM IST", "pub_date_relative": "14m ago"}, {"title": "Live updates: SpaceX launches unprecedented test flight of massive Starship, aiming for orbit - cnn.com", "full_content": "Live updates: SpaceX launches unprecedented test flight of massive Starship, aiming for orbit cnn.com SpaceX\u2019s giant Starship rocket launches toward orbit for the first time nbcnews.com Live coverage: SpaceX to launch first Starlink V3 satellites to orbit on Starship Spaceflight Now SpaceX launches Starship rocket on first orbital flight axios.com SpaceX\u2019s Starship launches on first orbital mission from Texas NPR", "source": "Google News Business", "pub_date_str": "28 Sep 2026, 06:54 PM IST", "pub_date_relative": "14m ago"}, {"title": "Nvidia makes a statement with historic $150 billion buyback announcement", "full_content": "The company intends to repurchase a large amount of shares through January 2028, reflecting \u201cconfidence in the long-term opportunity ahead.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "28 Sep 2026, 06:50 PM IST", "pub_date_relative": "18m ago"}], "cfa": [{"title": "Taking Ozempic and worried about vision loss? This test can help you understand your risk.", "full_content": "Some research suggests that GLP-1 drugs may raise the risk of a rare eye disease that causes full or partial vision loss.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Sep 2026, 07:06 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CarMax earnings in focus as turnaround strategy faces test", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Sep 2026, 07:05 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Meta hires MongoDB CEO CJ Desai to lead enterprise unit. MongoDB shares crater", "full_content": "MongoDB CEO CJ Desai is joining Meta Platforms as its chief enterprise platform officer and will report directly to Meta CEO Mark Zuckerberg .\n\nDesai, who was in his role at MongoDB for less than a year, will be leading the social media giant's new Meta Enterprise Platform for businesses, according to a release.\n\nThe new platform will initially prioritize a suite of tools that includes its new Muse agent, business agent and a coding tool.\n\nMeta plans to use \"strengths that few other companies have: advanced models, leading agents, large-scale infrastructure, and years of working closely with many businesses,\" Zuckerberg wrote in a release.\n\nThe MongoDB board named Dev Ittycheria as interim president and CEO. Desai took over from Ittycheria, who served as CEO for 11 years, in November 2025. Desai previously served as president of product and engineering at Cloudflare .\n\nDesai's transition comes as Meta undergoes a massive pivot, betting big on new AI products and services for its enterprise customers. Amid this transition, investors have demanded a payoff from the company's hefty AI investments on new infrastructure and tools.\n\nThe social media giant's push into the AI agent market with its Muse personal AI assistant has seen a rush of consumer demand, overtaking OpenAI's ChatGPT as the leading free iOS app.\n\nAt the same time, a heated battle is unfolding in both Washington and Silicon Valley after top AI researchers and tech leaders, such as Anthropic 's Dario Amodei, called for a development slowdown amid mounting concerns over AI safety.", "source": "CNBC World Economy", "pub_date_str": "28 Sep 2026, 07:05 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Monday", "full_content": "The relentless climb in bond yields continues, and Nvidia adds $150 billion to its buyback program.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 07:05 PM IST", "pub_date_relative": "3m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dow drops more than 300 points, weighed down by rising oil prices and Treasury yields: Live updates", "full_content": "Stocks fell Monday, weighed down by a jump in oil prices and Treasury yields to start the week.\n\nThe Dow Jones Industrial Average dropped 377 points, or 0.7%. The S&P 500 slid 0.5%, along with the Nasdaq Composite .\n\nBrent crude traded more than 2% higher at $106.79 per barrel. West Texas Intermediate futures gained around 2% as well to $94.40, after President Donald Trump rejected conditions for a ceasefire presented by Iran.\n\nTreasury yields build on last week's sharp moves. The benchmark 10-year Treasury note yield traded above 5.2%. The 30-year bond yield topped 5.5%. Both traded around multiyear highs.\n\nWall Street is coming off a winning week after tech and tech-linked names outperformed. Meta Platforms rallied nearly 13% in that time, as traders cheered the company's Muse artificial intelligence agent. Microsoft climbed more than 4%, while Apple and Nvidia advanced more than 1% each.\n\n10-year Treasury yield in 2026 Those gains came even as Treasury yields raced to highs not seen in years, with traders increasing bets of more Federal Reserve rate hikes due to persistent inflation. The benchmark 10-year Treasury note yield scaled to a level not seen since 2007. The 30-year bond yield reach a 2004 high. The 2-year note yield also jumped around 17 basis points last week.\n\n\"The rapid rise in 2-year government note yields worldwide signals that major central banks need to raise their policy rates further in response to the inflationary impact of higher-for-longer oil prices resulting from the recent re-escalation of the Middle East war,\" wrote Ed Yardeni, president of Yardeni Research. \"Unfortunately, these higher rates also exacerbate the outlook for large government deficits worldwide.\"\n\nRates will be in focus again this week, with a slew of key economic data on deck. The August personal consumption expenditure price index, the Fed's preferred inflation gauge, is due out Wednesday. New U.S.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 07:03 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SpaceX launches its massive Starship rocket into orbit for the first time", "full_content": "SpaceX launched its massive Starship rocket early Monday, sending the spacecraft into orbit for the first time.\n\nStarship reached orbit around 8:15 a.m. local time with SpaceX employees in attendance at the launch loudly cheering the milestone.\n\nThe Federal Aviation Administration told CNBC by email that it issued a \"license authorization for the SpaceX Starship Super Heavy Flight 14 launch and reentry operations\" on Sept. 26.\n\nWith the 14th test flight of Starship, Elon Musk's aerospace and defense company also planned to deploy 26 of its new Starlink V3 satellites. After the Starship reached orbit, SpaceX began to quickly release the satellites around 8:25 a.m. local time.\n\nA livestream of the test flight on social network X, which is owned by SpaceX, showed the rocket taking off at 8:48 a.m. ET, or 7:48 a.m. local time, from the company town of Starbase, Texas.\n\nThe ship's booster made a \"soft splashdown\" off the coast of Starbase a few moments after launch, while the Starship spacecraft continued to climb with one of its vacuum engines going out in sub-orbital trajectory.\n\nStarship is critical to SpaceX's expansion plans. The company is counting on the giant rocket to scale its Starlink , or Connectivity, business, which was its largest and only profitable segment as of the second quarter. SpaceX operates around 11,000 active satellites in orbit today, compared to roughly 650 for competitor Eutelsat OneWeb.\n\nOn SpaceX's earnings call in August, Musk said, \"It's not out of the question that at some point, Starlink will deliver a majority of the world's internet, at least in countries where we're allowed to operate, which is the vast majority of countries.\"", "source": "CNBC World Economy", "pub_date_str": "28 Sep 2026, 07:02 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Christine Lagarde: Hearing of the Committee on Economic and Monetary Affairs of the European Parliament", "full_content": "It is a pleasure to be back before this Committee as part of our regular dialogue.\n\nThe topic for today\u2019s hearing goes to the heart of Europe\u2019s economic future.\n\nArtificial intelligence has the potential to transform how we produce, work and innovate. Firms are set to devote around 10% of total investment to AI in 2026, and AI-related borrowing already accounts for roughly a quarter of credit growth to firms. [ 1 ]\n\nAI could significantly enhance Europe\u2019s productivity, competitiveness and living standards. But it will also affect \u2013 and to some extent is already affecting \u2013 investment, labour markets and inflation, and it therefore also matters for monetary policy.\n\nEurope has a real opportunity to harness this technology. But success is not automatic. We need to seize the benefits, while managing the risks appropriately.\n\nIn my remarks today, I will first discuss the outlook for the euro area economy and explain our latest monetary policy decisions. I will then elaborate on how artificial intelligence may affect inflation and the wider economy.\n\nDespite headwinds from the energy shock, the euro area economy proved resilient with solid real GDP growth in the second quarter of 2026. Growth was broad-based across most countries and sectors. This pattern is expected to have continued in the third quarter.\n\nManufacturing is performing solidly, supported by higher government spending on defence and infrastructure. Consumer confidence has rebounded from the low levels in the spring, helping services recover. And increased AI-related activity is visible in digital services, business investment and exports.", "source": "ECB Press", "pub_date_str": "28 Sep 2026, 07:00 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI trade enters a new phase: Why DBS favours AI adopters over capex-heavy players", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a AI trade enters a new phase: Why DBS favours AI adopters over capex-heavy players Powered By The Economic Times daily newspaper is available online now. Read Today's Paper AI trade enters a new phase: Why DBS favours AI adopters over capex-heavy players SECTIONS AI trade enters a new phase: Why DBS favours AI adopters over capex-heavy players By Kumar Gaurav , ETMarkets.com Last Updated: Sep 28, 2026, 06:59:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis DBS says the AI investment theme is entering a selective phase as investors focus on companies converting AI adoption into productivity, stronger margins and durable revenue growth. The bank favours lower-capex AI adopters while maintaining exposure to infrastructure enablers.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:59 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Equity capital inflow in real estate, data centre, hotel assets doubles to USD 9.5 bn in Jul-Sep: CBRE", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Digital Real Estate \u203a Realty News \u203a Equity capital inflow in real estate, data centre, hotel assets doubles to USD 9.5 bn in Jul-Sep: CBRE The Economic Times daily newspaper is available online now. Read Today's Paper Equity capital inflow in real estate, data centre, hotel assets doubles to USD 9.5 bn in Jul-Sep: CBRE SECTIONS Equity capital inflow in real estate, data centre, hotel assets doubles to USD 9.5 bn in Jul-Sep: CBRE PTI Last Updated: Sep 28, 2026, 06:56:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis During the third quarter of 2026, India's real estate, data centre, and hospitality sectors attracted a record USD 9.5 billion, marking a notable rise from the previous year. Data centres alone accounted for 57 percent of these investments, signaling a change in investor focus. Additionally, foreign entities represented roughly 59 percent of all inflows, contributing to an impressive doubling of total capital compared to early 2025.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Sep 2026, 06:56 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nvidia makes a statement with historic $150 billion buyback announcement", "full_content": "The company intends to repurchase a large amount of shares through January 2028, reflecting \u201cconfidence in the long-term opportunity ahead.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "28 Sep 2026, 06:50 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Five arrested over alleged bomb plot at UK air base used by U.S.; Iran denies link", "full_content": "Counterterrorism police are understood to be investigating a potential link between Iran and an alleged bomb threat against a U.K. base hosting the U.S. Air Force \u2014 which Iran has denied.\n\nBritish police arrested five men on Sunday near RAF Fairford in the west of England on suspicion of explosives and terrorism offenses.\n\nRAF Fairford has been used as the U.S. Air Force's command outpost for operations from Europe and for American strikes on Iranian missile sites.\n\nIn July, Iran's Revolutionary Guard warned any base used in airstrikes on the Islamic Republic was a legitimate target. Iranian Ambassador Seyed Ali Mousavi has previously said allowing U.S. bombers to launch from the Fairford base was an \"important matter for our self-defense.\"\n\nBritish newspaper The Daily Telegraph reported on Monday that U.K. police are understood to suspect that Iran is the most likely state actor behind the alleged plot.\n\nThe Iranian Embassy in London said on Monday that it \"categorically\" rejected and \"strongly condemns\" speculation linking the country to the arrests of five men at RAF Fairford.\n\nIn a statement posted on social media, Iran's embassy said: \"The Circulation of such fabricated speculations, particularly in the aftermath of the criminal acts of aggression committed by the United States and the Israeli regime against the Iranian people, will serve no purpose other than to fuel Iranophobia propaganda in the UK.\"\n\nIt added: \"The Islamic Republic of Iran reserves the right to take appropriate legal measures, as necessary, to safeguard the rights and interests of the country and its people in response to misleading and damaging media narratives.\"", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 06:46 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "The Moves That Backfired on Trump and Drove Interest Rates and Inflation Higher - WSJ", "full_content": "The Moves That Backfired on Trump and Drove Interest Rates and Inflation Higher WSJ Lenders Don\u2019t Trust the United States Anymore The Atlantic Treasury Market Volatility Is Capital Disciplining the State Jacobin Trumpflation Is No Longer Just an Gas Story: The US Economy Under Threat Yahoo Finance Two years ago in November. President Donald Trump won re-election and a report appeared called \"The \ub9e4\uc77c\uacbd\uc81c", "source": "Google News Business", "pub_date_str": "28 Sep 2026, 06:43 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump \u2018very seriously\u2019 considering diesel export ban as global supply crunch worsens", "full_content": "U.S. President Donald Trump has suggested the White House is still considering a diesel export ban as he faces mounting political pressure to tackle soaring fuel prices ahead of the midterm elections in November .\n\n\"We're thinking about it very seriously,\" Trump told a Fox News reporter on Sunday, while attending the Presidents Cup golf tournament in Illinois.\n\n\"That can oftentimes lead to a little bit of an increase on gasoline for cars, so we're looking at it very seriously. We may do it,\" he added.\n\nTrump has previously indicated support for an export ban as retail diesel prices have climbed to fresh record highs, saying earlier this month that a decision would be made quickly \" one way or another \" on whether to implement a ban.\n\nU.S. Energy Secretary Chris Wright has said the White House is considering restrictions rather than an outright ban, while Politico reported last week that the Trump administration was preparing a plan to ban diesel exports for 90 days.\n\nThe idea of the world's largest diesel exporter implementing an outright ban has prompted firm pushback from the U.S. energy industry, while analysts have warned that the move could backfire and exacerbate the global fuel crisis.\n\nDiesel prices have soared amid hostilities between the U.S. and Iran , as well as Russia and Ukraine , with the conflicts disrupting vital oil and fuel trade routes. Average U.S. diesel prices hovered around $6.50 a gallon on Friday, according to AAA , up sharply from a year ago but just below their record high of $6.53 on Sept. 22.\n\nCommodity strategists at Morgan Stanley have said an export restriction from the U.S., which has become an important source of marginal diesel supply amid reduced flow from Russia and the Middle East, would likely lower U.S. diesel prices initially \u2014 \"but with potentially adverse reactions downstream.\"", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 06:39 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia share buyback plan gets $150 billion boost", "full_content": "Nvidia said Monday it has authorized an additional $150 billion to its share buyback program, taking its total to $235 billion, amid record spending on AI.\n\nThe chip giant said it marks the largest share repurchase authorization increase in history. It expects to complete the total remaining buyback program through the fiscal year 2028.\n\nNvidia produces the most advanced chips used for AI and has been a huge beneficiary of the boom in spending on the infrastructure needed to power the tech.\n\nNvidia stock Nvidia's shares have climbed 24% over the past 12 months, lifting the company's market cap to $5.42 trillion. The stock was up 1.24% in premarket trading on Monday.\n\n\"NVIDIA's growth is being driven by a once-in-a-generation platform shift to AI and accelerated computing,\" said CEO Jensen Huang in a statement.\n\n\"Our cash generation gives us the capacity to invest in the technologies that advance this transformation and return capital to shareholders,\" he added. \"This authorization reflects our confidence in the long-term opportunity ahead.\"\n\nCombined hyperscaler capital expenditure is projected to exceed $1.3 trillion by 2027, S&P Global Ratings said in August, as companies race to build AI infrastructure including data centers.\n\nHuang earlier this month said Nvidia would double the number of chips it sells in 2027.", "source": "CNBC World Economy", "pub_date_str": "28 Sep 2026, 06:38 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Nvidia announces $150 billion buyback boost as AI boom drives massive cash flow", "full_content": "Chipmaking giant and \u2018Magnificent Seven\u2019 favourite Nvidia bolstered its share buyback authorisation by $150 billion, lifting the company's remaining buyback capacity to $235 billion.\n\nOn Monday, the company announced that its board of directors had increased the size of its buyback program by $150 billion, using its massive balance sheet to repurchase its own stock. The company expects to execute the total remaining program through fiscal year 2028.\n\nThe additional authorisation has surpassed Apple's $110 billion boost in 2024, marking the biggest-ever increase in a stock repurchase program.\n\n\u201cNVIDIA\u2019s growth is being driven by a once-in-a-generation platform shift to AI and accelerated computing,\u201d said Jensen Huang, founder and CEO of NVIDIA. \u201cOur cash generation gives us the capacity to invest in the technologies that advance this transformation and return capital to shareholders. This authorisation reflects our confidence in the long-term opportunity ahead.\u201d\n\nMeanwhile, in a filing, NVIDIA said it has introduced an open safety platform for AI agents that places monitoring and security controls outside the AI model. It said its Open Agent Safety Platform brings together its OpenShell and Sentry technologies to create an independent layer for monitoring, policy enforcement and security around AI agents.\n\nJensen Huang said the company was working with more than 100 industry partners on the platform. \u201cToday, with over 100 industry partners, we introduced the NVIDIA Open Agent Safety Platform, bringing together OpenShell and Sentry. This is bigger than a single product. It's the beginning of an open ecosystem to build the trust layer for safe agent systems,\u201d Huang said.\n\nLast month, the US chip giant announced blockbuster second-quarter results and expects revenue to grow by approximately 70% in fiscal 2028, suggesting that demand for chips powering artificial intelligence projects remains strong.", "source": "LiveMint Markets", "pub_date_str": "28 Sep 2026, 06:28 PM IST", "pub_date_relative": "39m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "White House moves to block $810 million in funding through pocket rescission", "full_content": "The White House on Friday evening announced plans to claw back $810 million in congressionally appropriated funding, prompting criticism from lawmakers.\n\nA year ago, President Donald Trump's administration blocked $4.9 billion in congressionally approved foreign aid through a pocket rescission, marking the first time in roughly 50 years that the president has attempted to use that authority.\n\nThe controversial budget maneuver occurs when a president submits a request to Congress to block funding so close to the end of the fiscal year that the funds can expire before Congress receives the full 45-day consideration period under the law.\n\nIn the announcement, the White House cited the Impoundment Control Act (ICA) as the basis for the Trump administration's authority. But the Government Accountability Office has stated the ICA doesn't permit withholding proposed rescissions through expiration if Congress has not approved them.\n\nSen. Susan Collins, R-Maine, who chairs the Senate committee on appropriations, blasted the move in a statement posted on X.\n\n\"This is the most recent attempt by this Office of Management and Budget (OMB) to undermine Congress's Constitutional power of the purse,\" she wrote.\n\n\"The independent Government Accountability Office has concluded that pocket rescissions are unlawful and not permitted by the Impoundment Control Act,\" Collins added. \"Any effort to rescind appropriated funds without congressional approval is a clear violation of the law.\"\n\nThe rescissions would block $567 million appropriated for Health and Human Services programs for refugees, asylees and other non-citizens and $28 million for HHS research. Additional cuts target the Department of Education's special programs for immigrant students, among other programs.", "source": "CNBC Top News", "pub_date_str": "28 Sep 2026, 06:24 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Bond sell-off deepens as oil price rises", "full_content": "Brent crude jumps and 10-year Treasury yield surpasses 5.2% as hopes for US-Iran agreement fade", "source": "FT Markets", "pub_date_str": "28 Sep 2026, 06:24 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Treasury Secretary Scott Bessent hires Wall Street economist David Zervos", "full_content": "Treasury Secretary Scott Bessent has hired veteran Wall Street economist David Zervos , the longtime chief market strategist at Jefferies, as a counselor in the Treasury Department. Zervos was a CNBC contributor.\n\nBessent announced the hire Monday in a statement obtained first by CNBC. Zervos will serve in a broad advisory capacity and is expected to begin immediately.\n\nHe has backed Bessent's recent decision to increase buybacks of some long-term Treasury debt and has called for lower interest rates from the Federal Reserve.\n\nZervos in a brief interview called himself a \"Wall Street geek\" and said he was excited for his third stint in government. Bessent \"has done an incredible job in this administration at guiding the economy through a lot of tumultuous periods,\" Zervos said.\n\n\"Whether it's trade, whether it's war, he's stepped up,\" he said of Bessent.\n\nZervos will add intellectual firepower to the Treasury after a series of staff departures that have drawn some attention. Seven of the department's 1 ation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "28 Sep 2026, 07:08 PM IST", "total_stories": 292};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
