cks fell sharply on Wednsday as renewed optimism around the global AI trade weighed on sentiment. Strong earnings from SK Hynix and Anthropic\u2019s IPO filing fuelled gains in AI-linked stocks globally. However, concerns over an AI bubble persist, with analysts highlighting a potential advantage for Indian IT services firms.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 12:16 PM IST", "pub_date_relative": "10m ago"}, {"title": "Jio Platforms Has The Scale. Can Broadband, Digital Services And Cash Flow Unlock Its Next Growth Phase?", "full_content": "While tariff hikes could provide an immediate boost to average revenue per user (ARPU), the brokerages see home broadband expansion, digital platforms and lower capital expenditure as key drivers of growth over the coming years.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 12:16 PM IST", "pub_date_relative": "11m ago"}, {"title": "Who Was Neeraj Yadav? Three-Time Asian Para Games Gold Medallist Dies By Suicide", "full_content": "Indian para-athlete Neeraj Yadav, a three-time Asian Para Games gold medallist, has died aged 42 in Delhi. His sporting achievements, career challenges and reported death have drawn attention to his legacy in para-athletics.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 12:14 PM IST", "pub_date_relative": "13m ago"}, {"title": "UBS pre-tax profits jump 27% to $3.59 billion in the third quarter", "full_content": "UBS reported a pre-tax profit of almost $3.6 billion in the third quarter, up 27% year on year, largely in line with consensus forecasts.\n\nThe Swiss banking and asset management giant saw strong net inflows into its global wealth management business.\n\nNet profits were $2.7 billion for the third quarter, in line with estimates.\n\nUBS shares are up by around a quarter this year The Zurich-headquartered lender's common equity tier (CET) 1 capital ratio \u2014 a measure of a bank's solvency \u2014 reached 14.7% during the period, up from 14.4% the previous quarter.\n\nStrong inflows into its global wealth management business supported performance, with net new assets reaching $55.1 billion by the end of the quarter. UBS recorded $12.5 billion in client commitments across its wealth management and asset management businesses.\n\nIn its third-quarter earnings statement Thursday, the bank said the integration of Credit Suisse is \"firmly on track\" to be completed by year-end, delivering a total of $13.7 billion in cumulative cost savings, above earlier expectations of $13.5 billion.\n\n\"In an increasingly complex market environment, our strong third-quarter performance once again demonstrated the benefits of our diversified global business model and disciplined execution,\" said UBS CEO Sergio P. Ermotti.\n\n\"UBS remains strategically committed to its diversified business model and its global and regional footprint.\"", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 12:13 PM IST", "pub_date_relative": "13m ago"}, {"title": "Stock Market Live: Sensex Off Day's Low, Down 450 Points, Nifty Near 22,650; Infosys Tanks 5%, L&T Gains 4%", "full_content": "Stock Market LIVE Updates: Barring Nifty Auto, all other sectoral indices were trading in the red, with Nifty IT falling the most over 3%, followed by Nifty FMCG, Nifty Oil & Gas, Nifty Realty, Nifty Metals and Nifty Pharma.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 12:10 PM IST", "pub_date_relative": "16m ago"}, {"title": "Flexi-cap vs multi-cap mutual fund returns race 2026: Which category leads across 1, 3 and 5 years? Check top schemes", "full_content": "Flexi-cap and multi-cap funds are both types of equity mutual funds , but they differ in their portfolio composition rules. According to SEBI regulations, flexi-cap funds must invest at least 65% of their assets in equity and equity-related instruments.\n\nHowever, multi-cap funds must invest at least 75% in equities, with a minimum allocation of 25% each to large-cap, mid-cap and small-cap stocks.\n\nThis means flexi-cap fund managers can allocate their equity portfolios across market capitalisations based on their investment strategy, while multi-cap fund managers must maintain the prescribed allocation to all three segments.\n\nHere\u2019s how the two categories performed over one, three and five years, and which schemes delivered consistent positive returns across all three periods.\n\nThe Nifty 500, a key benchmark for diversified equity funds, is down more than 9% as of 28 October 2026. In the 1-year period, flexi-cap funds delivered average category returns of -5.36%, while multi-cap funds recorded -3.58%.\n\nOver 3 years, flexi-cap funds returned 11.25%, compared with 12.75% for multi-cap funds. Over 5 years, the respective returns stood at 8.72% and 10.50%.\n\nMulti-cap funds have outperformed flexi-cap funds across all three periods on a category-average basis. However, individual schemes have delivered different results.\n\nAgainst this backdrop, it is worth examining which schemes have generated positive returns over the one-, three-, and five-year periods. Consistency across these horizons can help investors assess how funds have performed across different market conditions.", "source": "LiveMint Money", "pub_date_str": "28 Oct 2026, 12:06 PM IST", "pub_date_relative": "21m ago"}, {"title": "Stock futures are mixed as traders await Fed decision, Big Tech earnings: Live updates", "full_content": "U.S. equity futures were mixed early Wednesday as investors await earnings reports from megacap technology companies and a rate policy decision from the Federal Reserve due Wednesday.\n\nS&P 500 futures inched higher and Nasdaq-100 futures rose 0.5%. Dow futures were 0.2% lower.\n\nIn Asia, Japan's Nikkei 225 added 1.38% while the Topix rose 0.23%. South Korea's Kospi surged 6.57%, and the tech-focused, small-cap Kosdaq rose 3.09%. Australia's benchmark S&P/ASX 200 was marginally higher. Hong Kong's Hang Seng index was up 0.43%, while mainland China's CSI 300 gained 0.68%.\n\nIn Tuesday's regular U.S. trading, the major averages ended the session higher . Chip stocks rose again, this time powered by an announcement from Broadcom that a group of banks would provide $63 billion in financing to buy the company's chips and networking solutions to be leased to Anthropic, the company behind Claude. Broadcom rose 4%, while Advanced Micro Devices climbed 5.5% and Micron Technology rose 2.8%.\n\nThose moves led the Nasdaq Composite to rise 1.2% on the session.\n\nStocks were also supported by lower oil prices, which fell following news that Iran's Supreme Leader Mojtaba Khamenei met with the nation's top security official Mohsen Rezaei to discuss conditions for ending the war with the U.S.\n\nOn Wednesday, though, focus will turn to domestic monetary policy as the Fed wraps up its two-day policy meeting. The central bank is widely predicted to keep interest rates steady at a target rate range of 3.75% to 4%. Policymakers raised rates by a quarter percentage point at their September meeting .\n\nAccording to CME's FedWatch tool, there's a roughly 92% chance that the Fed maintains the current interest rate, but some expect that Chairman Kevin Warsh will signal that more hikes are coming in future policy meetings. The decision on interest rates will be announced at 2:00 p.m. ET.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 12:04 PM IST", "pub_date_relative": "22m ago"}, {"title": "Heineken Q3 volumes beat expectations on Asia growth, Americas rebound", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:04 PM IST", "pub_date_relative": "22m ago"}, {"title": "Why is Samsung Electro-Mechanics stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:03 PM IST", "pub_date_relative": "23m ago"}, {"title": "Earnings call transcript: StrongPoint Q3 2026 revenue rises 14% as stock falls 8.5%", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:03 PM IST", "pub_date_relative": "23m ago"}, {"title": "Can the AI boom sustain SK Hynix's record earnings?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Can the AI boom sustain SK Hynix's record earnings? Written by Anupam Nagar , ETMarkets.com | Oct 28, 2026, 12:10:44 PM IST 1 / 7 \u200bSK Hynix Q3 Profit Jumps Seven-Fold South Korean chipmaker SK Hynix reported record quarterly earnings as booming demand for artificial intelligence memory chips boosted revenue and profitability. The results underscore the company's growing role in supplying advanced memory used in AI data centres. (Sources: CNBC, Yahoo Finance)\n\nSK Hynix's operating profit jumped more than seven-fold year-on-year to 83.3 trillion won, while revenue surged 328% to a record 104.6 trillion won. Net profit reached 39.8 trillion won in the July-September quarter. Operating profit also exceeded the analyst estimate of 76.7 trillion won tracked by LSEG, highlighting the strength of the company's earnings momentum.\n\nExpanding AI data centres are driving demand for high-bandwidth memory (HBM) and advanced server DRAM. SK Hynix has benefited from stronger demand for server DDR5 memory and the ramp-up of its next-generation HBM products. Higher prices for key memory products have also supported revenue growth and profitability.\n\nSK Hynix expects HBM4 to overtake HBM3E in both shipment volume and revenue in the fourth quarter, reflecting the growing importance of next-generation memory for AI applications. The company also plans to ramp up its M15X facility to maximum capacity by the end of the year. The expansion is aimed at supporting rising demand for advanced memory products.\n\nSK Hynix expects memory demand to outpace supply as investment in AI infrastructure continues to expand. The company has signed long-term agreements with 14 major customers covering more than 50% of its total production capacity for 2027 and 2028.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 12:03 PM IST", "pub_date_relative": "23m ago"}, {"title": "Paying extra to buy EV over petrol car? OpEx advantage may shock you; check break-even point, ROI, cash-flow benefits", "full_content": "Paying more for an electric car can feel difficult when comparing showroom prices. However, lower running costs could help recover that extra payment over time. The key question is how much you drive every day.\n\nThe real advantage lies in the Operating expenses (OpEx). Consider a compact SUV driven 40 km daily, covering around 14,600 km annually. Assume the petrol version delivers 15 km per litre. Let\u2019s say petrol costs \u20b9 100 per litre. The electric version covers 8 km per unit of electricity, costing \u20b9 8.\n\nThese assumptions put petrol expenses at roughly \u20b9 6.66 per kilometre. The EV costs \u20b9 1 per km, reducing energy expenses by about 85%. Annual petrol spending reaches \u20b9 97,333, against electricity expenses of \u20b9 14,600. That results in annual energy savings of \u20b9 82,733.\n\nMaintenance adds another difference. The petrol car's annual maintenance is estimated at \u20b9 12,000. The EV's maintenance is estimated at \u20b9 5,000, reflecting fewer moving parts. This adds \u20b9 7,000 to annual savings.\n\nTogether, fuel and maintenance cost \u20b9 1,09,333 annually for the petrol vehicle. The EV's corresponding bill comes to \u20b9 19,600. The resulting annual saving is \u20b9 89,733.\n\nNow, consider paying \u20b9 3 lakh extra for the EV after road-tax benefits. Divide this extra payment by the yearly saving of \u20b9 89,733. The additional purchase cost is recovered in around 40 months. This is the break-even point, when accumulated savings match the extra purchase expense.\n\nAfter that point, continued savings improve the household's cash flow. Under these assumptions, you save nearly \u20b9 90,000 annually, compared with running the petrol car. This explains the return from paying extra upfront. The benefit comes through lower expenses, rather than a separate cash payment.\n\nPurchase taxes and registration benefits can also affect the initial price difference. For tax comparison, let\u2019s consider 5% GST for EVs . There is 28% GST for petrol vehicles, alongside a 1%-22% compensation cess.", "source": "LiveMint Money", "pub_date_str": "28 Oct 2026, 12:02 PM IST", "pub_date_relative": "24m ago"}, {"title": "JSW Cement Q2 FY27 slides: volume surges 26% as margins face pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:02 PM IST", "pub_date_relative": "24m ago"}, {"title": "Jio Platforms Shares Debut At Over 21% Premium. Should Investors Buy, Sell Or Hold?", "full_content": "Jio Platforms made a positive debut in the Indian stock market today. Investors will watch out whether the company can sustain revenue growth, improve profitability and execute its expansion plans while maintaining healthy cash flows.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 12:01 PM IST", "pub_date_relative": "25m ago"}, { asterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan bond yields rise as investors eye BOJ policy meeting Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan bond yields rise as investors eye BOJ policy meeting SECTIONS Global Market: Japan bond yields rise as investors eye BOJ policy meeting By Anupam Nagar , ETMarkets.com Last Updated: Oct 28, 2026, 11:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japanese government bond yields rise as an AI-led equity rebound weakens safe-haven demand. Investors await the BOJ\u2019s policy decision and guidance on future rate hikes amid persistent inflation, fiscal uncertainty and concerns over government borrowing.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 11:55 AM IST", "pub_date_relative": "31m ago"}, {"title": "SAIL Q2 FY\u201927 slides: profit surges 315% as debt falls, shares drop 4%", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 11:54 AM IST", "pub_date_relative": "32m ago"}, {"title": "Uorfi Javed vs Housing Society: Why Did Her Society Ban Content Shoots At Home? Controversy Explained", "full_content": "Uorfi Javed claimed that the society committee believes that such shoots qualify as commercial because the content is uploaded on social media and contributes to her popularity.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:54 AM IST", "pub_date_relative": "33m ago"}, {"title": "TCS Out, Jio In! Reliance Jio's listing shakes up India\u2019s rich list: IT major crashes out of top 5 as shares tumble 3.5%", "full_content": "Jio Platforms \u2019 blockbuster stock market debut has reshuffled India\u2019s corporate rankings, pushing Tata Consultancy Services (TCS) out of the country\u2019s five most valuable companies for the first time in decades. While Jio Platforms surged 21.36% above its IPO price on October 28, TCS shares tumbled nearly 3.5% amid a broader sell-off in information technology stocks and concerns over global economic uncertainty.\n\nJio Platforms\u2019 market capitalisation soared to around \u20b9 12.5 lakh crore, making it India\u2019s second-most valuable company. Meanwhile, TCS slipped to sixth place, with its market capitalisation falling to \u20b9 8.76 lakh crore as its shares declined to \u20b9 2,411.70.\n\nReliance Industries remained the most valuable firm with \u20b9 16.20 lakh crore market cap. Bharti Airtel, HDFC Bank, and ICICI Bank were shifted to 3rd,4th and 5th spots with market capitalisation of \u20b9 12.07 lakh crore, \u20b9 10.44 lakh crore, and \u20b9 9.83 lakh crore, respectively.\n\nThe listing also strengthened the Reliance Group\u2019s position in India\u2019s corporate hierarchy. Its combined market capitalisation crossed \u20b9 28 lakh crore, overtaking the Tata Group\u2019s approximately \u20b9 26 lakh crore to become the country\u2019s most valuable business house.\n\nFor the first time in decades, neither the Tata Group nor the Adani Group had a company among India\u2019s five most valuable listed companies. The rankings were instead dominated by the Reliance Group, telecom companies and private-sector banking heavyweights.\n\nThe \u20b9 30,213-crore IPO of Reliance-backed Jio Platforms made a blockbuster debut on the BSE and NSE.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:53 AM IST", "pub_date_relative": "33m ago"}, {"title": "Mercedes-Benz cars Q3 adjusted profit halves as China slump bites", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 11:50 AM IST", "pub_date_relative": "36m ago"}, {"title": "India's festive wallet: Family, discounts and emotions drive festive overspending for Gen Z across states, finds report", "full_content": "Gen Z shoppers across India are balancing cultural traditions, family expectations, personal preferences and digital discovery, according to a study by YouGov and Rukam Capital.\n\nThe report, titled \u2018Gen Z: A Deep Dive into India\u2019s Most Influential Consumer Cohort\u2019, noted that festive spending , shopping priorities, gifting choices and celebration styles vary across the country.\n\nIt highlighted regional differences. Respondents in the North showed higher festive spending and a growing prominence of family-led consumption, while those in the South showed a preference for greater personalisation alongside tradition. In the East, stronger digital discovery and spontaneous shopping led the trends, while in the West, respondents made more experience-oriented choices. Central India preferred value-conscious gifting, with growing experimentation with AI-led discovery, the report added.\n\nGifting remains central to the festive season, with parents and family members emerging as the leading gifting recipients nationally at 74%, followed by friends (61%), partners (39%) and younger relatives or children (31%). However, the categories consumers choose to gift vary across states.\n\n\u201cThese differences suggest that festive gifting is not a uniform market, with local traditions and individual preferences influencing what consumers choose for family and friends,\u201d the report noted. It added that digital tools are becoming increasingly relevant to festive purchase decisions.\n\nNationally, online search (41%) has overtaken personal judgement (39%) as the leading source of gift ideas, while 25% of respondents already use AI to suggest gifts.\n\nThe report further noted that festive spending is shaped by more than product needs and prices.", "source": "LiveMint Money", "pub_date_str": "28 Oct 2026, 11:48 AM IST", "pub_date_relative": "38m ago"}, {"title": "Maruti Suzuki shares see target price cuts by Jefferies, Nomura, other brokerages after Q2 net profit drops 26% YoY. What\u2019s ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Maruti Suzuki shares see target price cuts by Jefferies, Nomura, other brokerages after Q2 net profit drops 26% YoY. What\u2019s ahead? Maruti Suzuki India Share Price Mahindra & Mahindra Share Price Hyundai Motor India Share Price Tata Motors Share Price Tata Motors Passenger Vehicles Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Maruti Suzuki shares see target price cuts by Jefferies, Nomura, other brokerages after Q2 net profit drops 26% YoY. What\u2019s ahead? SECTIONS Maruti Suzuki shares see target price cuts by Jefferies, Nomura, other brokerages after Q2 net profit drops 26% YoY. What\u2019s ahead? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 28, 2026, 11:47:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Maruti Suzuki shares post marginal gains despite a 26% YoY decline in Q2 FY27 net profit. Jefferies, Nomura and Elara Capital lower their target prices, citing weaker margins and financial income, even as record sales volumes and strong revenue growth offer support.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 11:47 AM IST", "pub_date_relative": "40m ago"}, {"title": "Jio Platforms share price beat Motilal Oswal\u2019s target on debut | What lies ahead for the Reliance arm stock?", "full_content": "Jio Platforms shares made a strong debut on the stock exchanges, opening at \u20b9 1,358 apiece on both the BSE and NSE, a premium of 21.36% over the issue price of \u20b9 1,119. The stock opened above the target price of \u20b9 1,350 set by Motilal Oswal Financial Services , which had initiated coverage with a \u2018Buy\u2019 rating ahead of the listing.\n\nJio Platforms shares touched an intraday high of \u20b9 1,375 on the BSE and NSE.\n\nThe listing gives investors an early glimpse of market expectations for Reliance Industries\u2019 digital services arm, whose growth prospects are closely tied to telecom tariff increases, subscriber additions, expansion of home broadband and the scaling up of its digital platform businesses.\n\nJio Platforms IPO comprised an entirely fresh issue of 27 crore shares, with the price band set at \u20b9 1,065\u2013 \u20b9 1,119 per share.\n\nMotilal Oswal initiated coverage on Jio Platforms with a \u2018Buy\u2019 rating and a target price of \u20b9 1,350, implying an upside of around 21% from the IPO price. The brokerage\u2019s valuation is based on a discounted cash flow (DCF) model, using an estimated 11.5 times FY29 reported EBITDA multiple.\n\nThe brokerage expects Jio Platforms to deliver compound annual growth rates (CAGRs) of 14% in consolidated revenue, 15% in reported EBITDA and 20% in profit after tax (PAT) between FY26 and FY29.\n\nIt attributes the expected growth to continued subscriber additions, anticipated telecom tariff hikes, an expanding home broadband subscriber base and the growth of digital platform offerings. Motilal Oswal has factored in tariff increases of around 15% from March 2027, making the timing and extent of any price hikes an important driver of its forecasts.\n\nThe brokerage also believes Jio Platforms could command a premium to Bharti Airtel\u2019s India business in the near term, citing its market leadership, greater influence over industry tariffs and a limited free float of less than 3%.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:37 AM IST", "pub_date_relative": "49m ago"}, {"title": "'This Morning He Just Did Not Wake Up': Daya On BP Singh's Health Before Death", "full_content": "A video shared just days before his death had sparked concerns over Singh's health among viewers as he appeared frail while sitting with the CID cast.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:37 AM IST", "pub_date_relative": "50m ago"}, {"title": "GST clarification on foreign investor brokerage offers sentiment boost, analysts say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST clarification on foreign investor brokerage offers sentiment boost, analysts say The Economic Times daily newspaper is available online now. Read Today's Paper GST clarification on foreign investor brokerage offers sentiment boost, analysts say SECTIONS GST clarification on foreign investor brokerage offers sentiment boost, analysts say Reuters Last Updated: Oct 28, 2026, 11:35:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian government has clarified that brokerage paid by overseas clients may qualify as an export service. This could help foreign investors avoid the 18% goods and services tax on brokerage fees. Analysts suggest this clarification is sentimentally positive amid significant foreign outflows from Indian stocks. There is ongoing speculation regarding potential cuts in capital gains tax ahead of the federal budget.\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "28 Oct 2026, 11:35 AM IST", "pub_date_relative": "51m ago"}, {"title": "Jio IPO Listing Live Updates: Jio Platforms Shares Trade Flat After Strong Listing; M-Cap Crosses Rs 12.5 Lakh Crore", "full_content": "Jio Platforms IPO Listing Live Updates: Mukesh Ambani-led Reliance Industries' digital arm, Jio Platforms Ltd, made a strong stock market debut on October 28. Track Jio's listing price, share price movements, grey market premium (GMP), listing gains and the latest updates from NSE and BSE.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:32 AM IST", "pub_date_relative": "55m ago"}, {"title": "Who is Nithya Raman? Los Angeles' 'Zohran Mamdani' Tipped to Become Mayor Of US' Second Largest City", "full_content": "The race invites comparisons to Zohran Mamdani, another DSA-backed politician who was elected mayor of New York City.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:31 AM IST", "pub_date_relative": "56m ago"}, {"title": "TCS, Vedanta among 10 companies offering dividend yield of up to 7%. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News TCS, Vedanta among 10 companies offering dividend yield of up to 7%. Do you own any? Written by Veer Sharma , ETMarkets.com | Oct 28, 2026, 11:37:32 AM IST 1 / 11 Dividend watch Domestic brokerage firm Axis Direct\u2019s latest report highlights companies that have consistently rewarded shareholders with strong payouts over the past year. A dividend yield is a financial ratio that shows how much a company pays out in dividends each year relative to its stock price. It is a key metric for investors, particularly those focused on income generation, as it indicates the return on investment strictly from dividends. Here\u2019s the full list.\n\nVedanta has a dividend yield of 7%, with dividends of Rs 16 per share over the past 12 months. The stock's current market price (CMP) is Rs 225, while its market capitalisation stands at Rs 87,000 crore.\n\nCoal India offers a dividend yield of 7%, having paid Rs 26.5 per share in dividends over the past 12 months. The stock trades at Rs 396, with a market capitalisation of Rs 2.44 lakh crore.\n\nIndian Oil Corporation has a dividend yield of 6%, with dividends of Rs 8.3 per share over the past 12 months. The stock, currently trading at about Rs 128, has market capitalisation of Rs 1.81 lakh crore.\n\nBharat Petroleum Corporation offers a dividend yield of 6%, having paid Rs 17.5 per share in dividends over the past 12 months. The stock trades at Rs 279, with a market capitalisation of Rs 1.21 lakh crore.\n\nPower Finance Corporation has a dividend yield of 6%, with dividends of Rs 18.8 per share over the past 12 months. Its current market price is Rs 315 and its market capitalisation stands at Rs 1.04 lakh crore.\n\nState-run oil company ONGC offers a dividend yield of 6%, having paid Rs 13.3 per share in dividends over the past 12 months.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 11:30 AM IST", "pub_date_relative": "56m ago"}, {"title": "Subros shares surge 10% after securing Rs 1,225 crore HVAC supply order from Maruti Suzuki", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Subros shares surge 10% after securing Rs 1,225 crore HVAC supply order from Maruti Suzuki Maruti Suzuki India Share Price Mahindra & Mahindra Share Price Hyundai Motor India Share Price Tata Motors Share Price Tata Motors Passenger Vehicles Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Subros shares surge 10% after securing Rs 1,225 crore HVAC supply order from Maruti Suzuki SECTIONS Subros shares surge 10% after securing Rs 1,225 crore HVAC supply order from Maruti Suzuki By Ritesh Presswala , ETMarkets.com Last Updated: Oct 28, 2026, 11:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Subros shares surged up to 10% after securing a Rs 1,225 crore HVAC supply contract from Maruti Suzuki for two vehicle models over approximately seven years. The award comes as the stock remains down around 45% over the past year.\n\n(What's moving Sensex and Nifty Track latest market news , s n Q2 FY27, compared with \u20b9 67,984 crore in the corresponding quarter last year. The growth was driven by faster execution across businesses within its Projects, Products & Manufacturing (PPM) portfolio.\n\nL&T secured orders worth \u20b9 1,47,665 crore during the quarter, marking a 28% YoY increase. The company won several high-value contracts, led by its Hydrocarbon \u2013 Offshore & Onshore, CarbonLite Solutions and Public Spaces businesses, among others.\n\n\u201cThe company has delivered a strong quarter in an everchanging geopolitical landscape. This performance reflects continued customer confidence and our ability to secure large and complex orders across sectors and geographies. We achieved yet another record quarterly order inflow. Focused execution across our Projects, Products & Manufacturing businesses supported a higher revenue growth. The highest ever order book at \u20b9 8.5 lakh crore provides multi-year revenue visibility,\" said S N Subrahmanyan, Chairman and Managing Director.\n\nOn the L&T Q2 results preview, Gaurav Garg, Head - Research, Lemonn, said that Larsen & Toubro\u2019s Q2 FY27 results reflect strong business momentum, with net profit rising 33% to \u20b9 5,202 crore, revenue growing 16% to \u20b9 78,750 crore and order inflows reaching a record \u20b9 1.48 lakh crore.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "Worried About AI Taking Your Job? Goldman Sachs CEO David Solomon Has A Message", "full_content": "Goldman Sachs CEO David Solomon expects AI to create new jobs and boost productivity over time, but warns that rapid automation could require government action to soften employment disruption.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "Smallcap stocks rally up to 21% in 2 days: Should you chase the rush or book profits?", "full_content": "Home ETPrime Markets Market Data Masterclass ice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 12:16 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms Has The Scale. Can Broadband, Digital Services And Cash Flow Unlock Its Next Growth Phase?", "full_content": "While tariff hikes could provide an immediate boost to average revenue per user (ARPU), the brokerages see home broadband expansion, digital platforms and lower capital expenditure as key drivers of growth over the coming years.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 12:16 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Who Was Neeraj Yadav? Three-Time Asian Para Games Gold Medallist Dies By Suicide", "full_content": "Indian para-athlete Neeraj Yadav, a three-time Asian Para Games gold medallist, has died aged 42 in Delhi. His sporting achievements, career challenges and reported death have drawn attention to his legacy in para-athletics.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 12:14 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "UBS pre-tax profits jump 27% to $3.59 billion in the third quarter", "full_content": "UBS reported a pre-tax profit of almost $3.6 billion in the third quarter, up 27% year on year, largely in line with consensus forecasts.\n\nThe Swiss banking and asset management giant saw strong net inflows into its global wealth management business.\n\nNet profits were $2.7 billion for the third quarter, in line with estimates.\n\nUBS shares are up by around a quarter this year The Zurich-headquartered lender's common equity tier (CET) 1 capital ratio \u2014 a measure of a bank's solvency \u2014 reached 14.7% during the period, up from 14.4% the previous quarter.\n\nStrong inflows into its global wealth management business supported performance, with net new assets reaching $55.1 billion by the end of the quarter. UBS recorded $12.5 billion in client commitments across its wealth management and asset management businesses.\n\nIn its third-quarter earnings statement Thursday, the bank said the integration of Credit Suisse is \"firmly on track\" to be completed by year-end, delivering a total of $13.7 billion in cumulative cost savings, above earlier expectations of $13.5 billion.\n\n\"In an increasingly complex market environment, our strong third-quarter performance once again demonstrated the benefits of our diversified global business model and disciplined execution,\" said UBS CEO Sergio P. Ermotti.\n\n\"UBS remains strategically committed to its diversified business model and its global and regional footprint.\"", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 12:13 PM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock Market Live: Sensex Off Day's Low, Down 450 Points, Nifty Near 22,650; Infosys Tanks 5%, L&T Gains 4%", "full_content": "Stock Market LIVE Updates: Barring Nifty Auto, all other sectoral indices were trading in the red, with Nifty IT falling the most over 3%, followed by Nifty FMCG, Nifty Oil & Gas, Nifty Realty, Nifty Metals and Nifty Pharma.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 12:10 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Flexi-cap vs multi-cap mutual fund returns race 2026: Which category leads across 1, 3 and 5 years? Check top schemes", "full_content": "Flexi-cap and multi-cap funds are both types of equity mutual funds , but they differ in their portfolio composition rules. According to SEBI regulations, flexi-cap funds must invest at least 65% of their assets in equity and equity-related instruments.\n\nHowever, multi-cap funds must invest at least 75% in equities, with a minimum allocation of 25% each to large-cap, mid-cap and small-cap stocks.\n\nThis means flexi-cap fund managers can allocate their equity portfolios across market capitalisations based on their investment strategy, while multi-cap fund managers must maintain the prescribed allocation to all three segments.\n\nHere\u2019s how the two categories performed over one, three and five years, and which schemes delivered consistent positive returns across all three periods.\n\nThe Nifty 500, a key benchmark for diversified equity funds, is down more than 9% as of 28 October 2026. In the 1-year period, flexi-cap funds delivered average category returns of -5.36%, while multi-cap funds recorded -3.58%.\n\nOver 3 years, flexi-cap funds returned 11.25%, compared with 12.75% for multi-cap funds. Over 5 years, the respective returns stood at 8.72% and 10.50%.\n\nMulti-cap funds have outperformed flexi-cap funds across all three periods on a category-average basis. However, individual schemes have delivered different results.\n\nAgainst this backdrop, it is worth examining which schemes have generated positive returns over the one-, three-, and five-year periods. Consistency across these horizons can help investors assess how funds have performed across different market conditions.", "source": "LiveMint Money", "pub_date_str": "28 Oct 2026, 12:06 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock futures are mixed as traders await Fed decision, Big Tech earnings: Live updates", "full_content": "U.S. equity futures were mixed early Wednesday as investors await earnings reports from megacap technology companies and a rate policy decision from the Federal Reserve due Wednesday.\n\nS&P 500 futures inched higher and Nasdaq-100 futures rose 0.5%. Dow futures were 0.2% lower.\n\nIn Asia, Japan's Nikkei 225 added 1.38% while the Topix rose 0.23%. South Korea's Kospi surged 6.57%, and the tech-focused, small-cap Kosdaq rose 3.09%. Australia's benchmark S&P/ASX 200 was marginally higher. Hong Kong's Hang Seng index was up 0.43%, while mainland China's CSI 300 gained 0.68%.\n\nIn Tuesday's regular U.S. trading, the major averages ended the session higher . Chip stocks rose again, this time powered by an announcement from Broadcom that a group of banks would provide $63 billion in financing to buy the company's chips and networking solutions to be leased to Anthropic, the company behind Claude. Broadcom rose 4%, while Advanced Micro Devices climbed 5.5% and Micron Technology rose 2.8%.\n\nThose moves led the Nasdaq Composite to rise 1.2% on the session.\n\nStocks were also supported by lower oil prices, which fell following news that Iran's Supreme Leader Mojtaba Khamenei met with the nation's top security official Mohsen Rezaei to discuss conditions for ending the war with the U.S.\n\nOn Wednesday, though, focus will turn to domestic monetary policy as the Fed wraps up its two-day policy meeting. The central bank is widely predicted to keep interest rates steady at a target rate range of 3.75% to 4%. Policymakers raised rates by a quarter percentage point at their September meeting .\n\nAccording to CME's FedWatch tool, there's a roughly 92% chance that the Fed maintains the current interest rate, but some expect that Chairman Kevin Warsh will signal that more hikes are coming in future policy meetings. The decision on interest rates will be announced at 2:00 p.m. ET.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 12:04 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: StrongPoint Q3 2026 revenue rises 14% as stock falls 8.5%", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 12:03 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Can the AI boom sustain SK Hynix's record earnings?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Can the AI boom sustain SK Hynix's record earnings? Written by Anupam Nagar , ETMarkets.com | Oct 28, 2026, 12:10:44 PM IST 1 / 7 \u200bSK Hynix Q3 Profit Jumps Seven-Fold South Korean chipmaker SK Hynix reported record quarterly earnings as booming demand for artificial intelligence memory chips boosted revenue and profitability. The results underscore the company's growing role in supplying advanced memory used in AI data centres. (Sources: CNBC, Yahoo Finance)\n\nSK Hynix's operating profit jumped more than seven-fold year-on-year to 83.3 trillion won, while revenue surged 328% to a record 104.6 trillion won. Net profit reached 39.8 trillion won in the July-September quarter. Operating profit also exceeded the analyst estimate of 76.7 trillion won tracked by LSEG, highlighting the strength of the company's earnings momentum.\n\nExpanding AI data centres are driving demand for high-bandwidth memory (HBM) and advanced server DRAM. SK Hynix has benefited from stronger demand for server DDR5 memory and the ramp-up of its next-generation HBM products. Higher prices for key memory products have also supported revenue growth and profitability.\n\nSK Hynix expects HBM4 to overtake HBM3E in both shipment volume and revenue in the fourth quarter, reflecting the growing importance of next-generation memory for AI applications. The company also plans to ramp up its M15X facility to maximum capacity by the end of the year. The expansion is aimed at supporting rising demand for advanced memory products.\n\nSK Hynix expects memory demand to outpace supply as investment in AI infrastructure continues to expand. The company has signed long-term agreements with 14 major customers covering more than 50% of its total production capacity for 2027 and 2028.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 12:03 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms Shares Debut At Over 21% Premium. Should Investors Buy, Sell Or Hold?", "full_content": "Jio Platforms made a positive debut in the Indian stock market today. Investors will watch out whether the company can sustain revenue growth, improve profitability and execute its expansion plans while maintaining healthy cash flows.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 12:01 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Listing: Telco's Stellar Debut Knocks TCS Out Of India's Top Five, SBI Climbs", "full_content": "Tata Consultancy Services slipped to seventh place by market value on Wednesday morning. Jio Platf rfi Javed claimed that the society committee believes that such shoots qualify as commercial because the content is uploaded on social media and contributes to her popularity.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:54 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "TCS Out, Jio In! Reliance Jio's listing shakes up India\u2019s rich list: IT major crashes out of top 5 as shares tumble 3.5%", "full_content": "Jio Platforms \u2019 blockbuster stock market debut has reshuffled India\u2019s corporate rankings, pushing Tata Consultancy Services (TCS) out of the country\u2019s five most valuable companies for the first time in decades. While Jio Platforms surged 21.36% above its IPO price on October 28, TCS shares tumbled nearly 3.5% amid a broader sell-off in information technology stocks and concerns over global economic uncertainty.\n\nJio Platforms\u2019 market capitalisation soared to around \u20b9 12.5 lakh crore, making it India\u2019s second-most valuable company. Meanwhile, TCS slipped to sixth place, with its market capitalisation falling to \u20b9 8.76 lakh crore as its shares declined to \u20b9 2,411.70.\n\nReliance Industries remained the most valuable firm with \u20b9 16.20 lakh crore market cap. Bharti Airtel, HDFC Bank, and ICICI Bank were shifted to 3rd,4th and 5th spots with market capitalisation of \u20b9 12.07 lakh crore, \u20b9 10.44 lakh crore, and \u20b9 9.83 lakh crore, respectively.\n\nThe listing also strengthened the Reliance Group\u2019s position in India\u2019s corporate hierarchy. Its combined market capitalisation crossed \u20b9 28 lakh crore, overtaking the Tata Group\u2019s approximately \u20b9 26 lakh crore to become the country\u2019s most valuable business house.\n\nFor the first time in decades, neither the Tata Group nor the Adani Group had a company among India\u2019s five most valuable listed companies. The rankings were instead dominated by the Reliance Group, telecom companies and private-sector banking heavyweights.\n\nThe \u20b9 30,213-crore IPO of Reliance-backed Jio Platforms made a blockbuster debut on the BSE and NSE.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:53 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Mercedes-Benz cars Q3 adjusted profit halves as China slump bites", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Oct 2026, 11:50 AM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Maruti Suzuki shares see target price cuts by Jefferies, Nomura, other brokerages after Q2 net profit drops 26% YoY. What\u2019s ahead?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Maruti Suzuki shares see target price cuts by Jefferies, Nomura, other brokerages after Q2 net profit drops 26% YoY. What\u2019s ahead? Maruti Suzuki India Share Price Mahindra & Mahindra Share Price Hyundai Motor India Share Price Tata Motors Share Price Tata Motors Passenger Vehicles Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Maruti Suzuki shares see target price cuts by Jefferies, Nomura, other brokerages after Q2 net profit drops 26% YoY. What\u2019s ahead? SECTIONS Maruti Suzuki shares see target price cuts by Jefferies, Nomura, other brokerages after Q2 net profit drops 26% YoY. What\u2019s ahead? By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 28, 2026, 11:47:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Maruti Suzuki shares post marginal gains despite a 26% YoY decline in Q2 FY27 net profit. Jefferies, Nomura and Elara Capital lower their target prices, citing weaker margins and financial income, even as record sales volumes and strong revenue growth offer support.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 11:47 AM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms share price beat Motilal Oswal\u2019s target on debut | What lies ahead for the Reliance arm stock?", "full_content": "Jio Platforms shares made a strong debut on the stock exchanges, opening at \u20b9 1,358 apiece on both the BSE and NSE, a premium of 21.36% over the issue price of \u20b9 1,119. The stock opened above the target price of \u20b9 1,350 set by Motilal Oswal Financial Services , which had initiated coverage with a \u2018Buy\u2019 rating ahead of the listing.\n\nJio Platforms shares touched an intraday high of \u20b9 1,375 on the BSE and NSE.\n\nThe listing gives investors an early glimpse of market expectations for Reliance Industries\u2019 digital services arm, whose growth prospects are closely tied to telecom tariff increases, subscriber additions, expansion of home broadband and the scaling up of its digital platform businesses.\n\nJio Platforms IPO comprised an entirely fresh issue of 27 crore shares, with the price band set at \u20b9 1,065\u2013 \u20b9 1,119 per share.\n\nMotilal Oswal initiated coverage on Jio Platforms with a \u2018Buy\u2019 rating and a target price of \u20b9 1,350, implying an upside of around 21% from the IPO price. The brokerage\u2019s valuation is based on a discounted cash flow (DCF) model, using an estimated 11.5 times FY29 reported EBITDA multiple.\n\nThe brokerage expects Jio Platforms to deliver compound annual growth rates (CAGRs) of 14% in consolidated revenue, 15% in reported EBITDA and 20% in profit after tax (PAT) between FY26 and FY29.\n\nIt attributes the expected growth to continued subscriber additions, anticipated telecom tariff hikes, an expanding home broadband subscriber base and the growth of digital platform offerings. Motilal Oswal has factored in tariff increases of around 15% from March 2027, making the timing and extent of any price hikes an important driver of its forecasts.\n\nThe brokerage also believes Jio Platforms could command a premium to Bharti Airtel\u2019s India business in the near term, citing its market leadership, greater influence over industry tariffs and a limited free float of less than 3%.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:37 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "GST clarification on foreign investor brokerage offers sentiment boost, analysts say", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a GST clarification on foreign investor brokerage offers sentiment boost, analysts say The Economic Times daily newspaper is available online now. Read Today's Paper GST clarification on foreign investor brokerage offers sentiment boost, analysts say SECTIONS GST clarification on foreign investor brokerage offers sentiment boost, analysts say Reuters Last Updated: Oct 28, 2026, 11:35:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian government has clarified that brokerage paid by overseas clients may qualify as an export service. This could help foreign investors avoid the 18% goods and services tax on brokerage fees. Analysts suggest this clarification is sentimentally positive amid significant foreign outflows from Indian stocks. There is ongoing speculation regarding potential cuts in capital gains tax ahead of the federal budget.\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "28 Oct 2026, 11:35 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Economics", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jio IPO Listing Live Updates: Jio Platforms Shares Trade Flat After Strong Listing; M-Cap Crosses Rs 12.5 Lakh Crore", "full_content": "Jio Platforms IPO Listing Live Updates: Mukesh Ambani-led Reliance Industries' digital arm, Jio Platforms Ltd, made a strong stock market debut on October 28. Track Jio's listing price, share price movements, grey market premium (GMP), listing gains and the latest updates from NSE and BSE.", "source": "NDTV Profit", "pub_date_str": "28 Oct 2026, 11:32 AM IST", "pub_date_relative": "55m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "TCS, Vedanta among 10 companies offering dividend yield of up to 7%. Do you own any?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News TCS, Vedanta among 10 companies offering dividend yield of up to 7%. Do you own any? Written by Veer Sharma , ETMarkets.com | Oct 28, 2026, 11:37:32 AM IST 1 / 11 Dividend watch Domestic brokerage firm Axis Direct\u2019s latest report highlights companies that have consistently rewarded shareholders with strong payouts over the past year. A dividend yield is a financial ratio that shows how much a company pays out in dividends each year relative to its stock price. It is a key metric for investors, particularly those focused on income generation, as it indicates the return on investment strictly from dividends. Here\u2019s the full list.\n\nVedanta has a dividend yield of 7%, with dividends of Rs 16 per share over the past 12 months. The stock's current market price (CMP) is Rs 225, while its market capitalisation stands at Rs 87,000 crore.\n\nCoal India offers a dividend yield of 7%, having paid Rs 26.5 per share in dividends over the past 12 months. The stock trades at Rs 396, with a market capitalisation of Rs 2.44 lakh crore.\n\nIndian Oil Corporation has a dividend yield of 6%, with dividends of Rs 8.3 per share over the past 12 months. The stock, currently trading at about Rs 128, has market capitalisation of Rs 1.81 lakh crore.\n\nBharat Petroleum Corporation offers a dividend yield of 6%, having paid Rs 17.5 per share in dividends over the past 12 months. The stock trades at Rs 279, with a market capitalisation of Rs 1.21 lakh crore.\n\nPower Finance Corporation has a dividend yield of 6%, with dividends of Rs 18.8 per share over the past 12 months. Its current market price is Rs 315 and its market capitalisation stands at Rs 1.04 lakh crore.\n\nState-run oil company ONGC offers a dividend yield of 6%, having paid Rs 13.3 per share in dividends over the past 12 months.", "source": "Economic Times Markets", "pub_date_str": "28 Oct 2026, 11:30 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Subros shares surge 10% after securing Rs 1,225 crore HVAC supply order from Maruti Suzuki", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Subros shares surge 10% after securing Rs 1,225 crore HVAC supply order from Maruti Suzuki Maruti Suzuki India Share Price Mahindra & Mahindra Share Price Hyundai Motor India Share Price Tata Motors Share Price Tata Motors Passenger Vehicles Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Subros shares surge 10% after securing Rs 1,225 crore HVAC supply order from Maruti Oct 2026, 11:26 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "L&T share price jumps 6% after strong Q2 results 2026 | Should you buy, sell or hold? Check target, upside", "full_content": "Larsen & Toubro (L&T) share price jumped over 6% in Wednesday's trading session after the company reported strong set of numbers during the September quarter FY27.\n\nL&T shares opened at \u20b9 3,820 per share on NSE today, as compared to previous close of \u20b9 3,665.10 on Tuesday and touched an intraday low of \u20b9 3,770 on 28 October. The stock emerged as one of the top gainers in Sensex and Nifty 50 today.\n\nEngineering conglomerate Larsen & Toubro (L&T) on October 27 reported a 33% year-on-year (YoY) rise in net profit to \u20b9 5,202 crore for the quarter ended September 30, 2026.\n\nThe company's revenue grew 16% to \u20b9 78,750 crore in Q2 FY27, compared with \u20b9 67,984 crore in the corresponding quarter last year. The growth was driven by faster execution across businesses within its Projects, Products & Manufacturing (PPM) portfolio.\n\nL&T secured orders worth \u20b9 1,47,665 crore during the quarter, marking a 28% YoY increase. The company won several high-value contracts, led by its Hydrocarbon \u2013 Offshore & Onshore, CarbonLite Solutions and Public Spaces businesses, among others.\n\n\u201cThe company has delivered a strong quarter in an everchanging geopolitical landscape. This performance reflects continued customer confidence and our ability to secure large and complex orders across sectors and geographies. We achieved yet another record quarterly order inflow. Focused execution across our Projects, Products & Manufacturing businesses supported a higher revenue growth. The highest ever order book at \u20b9 8.5 lakh crore provides multi-year revenue visibility,\" said S N Subrahmanyan, Chairman and Managing Director.\n\nOn the L&T Q2 results preview, Gaurav Garg, Head - Research, Lemonn, said that Larsen & Toubro\u2019s Q2 FY27 results reflect strong business momentum, with net profit rising 33% to \u20b9 5,202 crore, revenue growing 16% to \u20b9 78,750 crore and order inflows reaching a record \u20b9 1.48 lakh crore.", "source": "LiveMint Markets", "pub_date_str": "28 Oct 2026, 11:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Smallcap stocks rally up to 21% in 2 days: Should you chase the rush or book profits?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Smallcap stocks rally up to 21% in 2 days: Should you chase the rush or book profits? The Economic Times daily newspaper is available online now. Read Today's Paper Smallcap stocks rally up to 21% in 2 days: Should you chase the rush or book profits? SECTIONS Smallcap stocks rally up to 21% in 2 days: Should you chase the rush or book profits? By Kumar Gaurav , ETMarkets.com Last Updated: Oct 28, 2026, 11:23:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In the last two trading sessions, smallcap stocks have experienced an impressive resurgence, with certain stocks posting significant gains. As investors weigh their options, they face the decision of whether to capitalize on this upswing or secure profits amidst growing caution. Technical analysts identify critical resistance levels, foreseeing possible pullbacks. They recommend partial profit-taking at these points while also highlighting several stocks with promising recovery signs for potential purchases.\n\n(What's moving Sensex a  nuclear weapon.\n\nOil prices since the start of the year His remarks followed earlier comments that he was weighing whether to reach a deal with Tehran or pursue further military action, keeping investors on edge over the possibility of renewed strikes.\n\nConcerns over disruptions to oil flows have kept a geopolitical risk premium embedded in crude prices, with traders closely monitoring developments in the region.\n\nAdding to the uncertainty, Israel's election appeared headed for a political stalemate, with neither Prime Minister Benjamin Netanyahu nor his main challenger, Gadi Eisenkot, securing a clear path to a governing majority.", "source": "CNBC Top News", "pub_date_str": "28 Oct 2026, 11:22 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Global Market: Japan\u2019s Nikkei jumps over 1% as tech rally on Wall Street lifts sentiment", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan\u2019s Nikkei jumps over 1% as tech rally on Wall Street lifts sentiment Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan\u2019s Nikkei jumps over 1% as tech rally on Wall Street lifts sentiment SECTIONS Global Market: Japan\u2019s Nikkei jumps over 1% as tech rally on Wall Street lifts sentiment By Anupam Nagar , ETMarkets.com Last Updated: Oct 28, 2026, 11:21:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan\u2019s Nikkei rose 1.34%, tracking Wall Street\u2019s technology-led rally, as semiconductor stocks gained. Investors remain cautious ahead of the US Federal Reserve\u2019s policy decision, corporate ear     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
