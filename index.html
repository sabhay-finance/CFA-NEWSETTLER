k Partners, said in an interview. \u201cThis business is a much different business from the one that's been considered three years ago, five years ago, 10 years ago, where there had been a litany of headwinds that the pharmacy just couldn't overcome.\u201d\n\nCVS CEO David Joyner told CNBC\u2019s \"Squawk on the Street\" on Wednesday that back in 2024, the company was \"in a turnaround\" without the flexibility, cash or business performance to execute a split.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:28 AM IST", "pub_date_relative": "29m ago"}, {"title": "Earnings call transcript: Douglas Emmett tops revenue forecast in Q3 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:27 AM IST", "pub_date_relative": "31m ago"}, {"title": "Mizuho raises Livanova stock price target on Essenz placements", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:26 AM IST", "pub_date_relative": "31m ago"}, {"title": "Mizuho raises Procore stock price target on strong Q3 results", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:26 AM IST", "pub_date_relative": "31m ago"}, {"title": "Musk stocks lose $120 billion as Democrats\u2019 Texas win rattles investors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Musk stocks lose $120 billion as Democrats\u2019 Texas win rattles investors Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Musk stocks lose $120 billion as Democrats\u2019 Texas win rattles investors SECTIONS Musk stocks lose $120 billion as Democrats\u2019 Texas win rattles investors By Jordan Fitzgerald , Bloomberg Last Updated: Nov 05, 2026, 01:25:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tesla and SpaceX lost more than $120 billion in combined market value after Democrats scored major election victories in Texas and across the US. Investors are concerned that a Democrat-controlled Congress could increase scrutiny of Elon Musk\u2019s businesses, complicate a potential Tesla-SpaceX merger and create fresh regulatory hurdles.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 01:25 AM IST", "pub_date_relative": "32m ago"}, {"title": "Democrats take Congress in a blue wave. Here's what it means for your money", "full_content": "With Democrats flipping control of Congress in the midterm election , the shift in power on Capitol Hill could reshape household budgets \u2014 from student loan bills and health insurance premiums to housing costs and taxes.\n\nExperts say results show that rising costs were top of mind for voters.\n\n\"I see this election as a repudiation of the anti-affordability agenda from the Trump administration,\" said Daniel Bunn, president and CEO of the Tax Foundation, a nonpartisan, nonprofit research organization.\n\n\"Whether that's the conflict in the Middle East or the tariffs, just top to bottom, it's clear to me that was a real concern of the electorate,\" he said.\n\nWhite House spokesman Matthew Middleton said in an emailed statement that the Trump administration has delivered \"tangible wins to make life more affordable for American families.\" Officials \"will continue to put hardworking American's first with or without support from Democrats,\" he wrote.\n\nDemocrats won control of both the House of Representatives and Senate, which could make it easier for the party to advance legislation. They can also use hearings and investigations to press federal agencies and companies to answer for policies and practices that impact consumers, and exert leverage over confirmation of President Donald Trump's nominees.\n\nBut turning campaign promises into changes people feel in their finances won't be easy. Trump can veto bills a Democrat-controlled Congress passes, limiting how much of their agenda could become law. Based on projections, Democrats will lack the numbers needed to override a presidential veto.\n\nAny changes will also take time: Newly elected members of Congress won't take office until January.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:23 AM IST", "pub_date_relative": "34m ago"}, {"title": "New Flutter CEO bets on FanDuel promotions to win customers as profits suffer", "full_content": "Flutter's new CEO Dan Taylor is counting on better products and more generous customer rewards to help convert FanDuel's improving engagement into stronger profits.\n\nTaylor's been at the helm for just five weeks and issued his first earnings report as CEO on Wednesday, with third-quarter revenue and adjusted earnings before interest, taxes, depreciation and amortization missing Wall Street's expectations.\n\n\"We made some changes to the product,\" Taylor told CNBC in an interview. \"Fundamentally, the way you win this business is by delighting customers, delivering the very best experiences and delivering to them in the way that they want, with the right overall proposition.\"\n\nFanDuel also launched a nationwide rewards program in September that Taylor said has \"resonated really, really well.\"\n\nThe early customer numbers are improving. Average monthly players on FanDuel's U.S. sportsbook rose 9% in the third quarter, while bet counts increased 15%, Taylor said.\n\nFlutter's earnings release showed total U.S. average monthly players up 12%, including 24% growth in iGaming. Sportsbook handle, or the total amount wagered, rose 13%, but sportsbook revenue grew just 4% as promotional spending increased.\n\nTaylor said the company plans to keep investing in customer experience. He said Flutter sees room to improve its structural margins over time by changing the mix of products customers use.\n\nFlutter has increased its media spend to build FanDuel Predicts, its predictions platform to rival Kalshi and Polymarket, but the cost of sales as a percent of revenue is forecast to be 58% for the full-year 2026 and into 2027.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:23 AM IST", "pub_date_relative": "35m ago"}, {"title": "Democrats may go after data centers. That's not a reason to dump all your AI stocks", "full_content": "The AI trade could be tricky in the short term, but a bubble deflating gradually is better than a pop, economists say", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:21 AM IST", "pub_date_relative": "36m ago"}, {"title": "Voters rebuff data centers in every ballot measure except one during the 2026 midterms", "full_content": "The artificial intelligence data center boom hit a roadblock on election night , further complicating the tech industry's historic expansion plans.\n\nThere were 41 local ballot measures in 10 states up for a vote on Tuesday that would place restrictions on the construction of data centers in different ways, according to Ballotpedia .\n\nVoters sided against data centers in each measure except one in Harwood, North Dakota, according to an analysis by Ballotpedia and additional results gathered by CNBC on Wednesday.\n\nThe City of Harwood voted against a charter rule amendment that would have required additional review before city approval of industrial developments, including data centers.\n\nIn Ohio, where Democrat Sherrod Brown ousted Republican Sen. Jon Husted after casting the incumbent as \"the face of data centers,\" 21 local measures were up for a vote, according to Ballotpedia.\n\nThe Buckeye State, which was named America's Top State for Business in 2026 by CNBC, has become a key battleground for the issue.\n\nOpenAI announced in August that it secured 8 gigawatts of computing capacity at the PORTS-Pike Technology Campus in Ohio, the largest planned AI data center campus in the world. The first phase of construction is slated to begin this year, and capacity is expected to come online in phases starting in 2028, according to the project's website .\n\nSoftBank and SB Energy are developing the Ohio data center campus in partnership with the U.S. Department of Energy. SoftBank is a major investor in OpenAI, and the two companies announced plans to invest $1 billion in SB Energy earlier this year.", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 01:21 AM IST", "pub_date_relative": "37m ago"}, {"title": "McDonald's stock rises as earnings beat, U.S. restaurants show improvement", "full_content": "McDonald's on Wednesday reported mixed quarterly results as traffic to its U.S. restaurants fell, leading to a slight decline in domestic same-store sales.\n\nThe fast-food giant reported a 0.2% decrease in sales at its U.S. restaurants that have been open at least 13 months. Even so, the segment performed better than the 0.5% decline that Wall Street anticipated, according to a survey of analysts by StreetAccount.\n\n\"In the U.S., we're encouraged by improvement as the quarter progressed following our intervention on value,\" McDonald's CEO Chris Kempczinski said in a statement.\n\nMcDonald's same-store sales returned to growth in September after falling in July and August, CFO Ian Borden said on the company's earnings conference call. However, in response to an analyst question, he clarified that he did not say that U.S. same-store sales would be better in the fourth quarter.\n\nKempczinski said in August that the company's U.S. business was falling short on execution, particularly on the implementation of its value offerings. Like many restaurants, McDonald's has leaned into discounts to attract budget-conscious diners over the last two years.\n\nTo reverse same-store sales declines, McDonald's focused its marketing on its Extra Value Meals and restarted regional and national promotions on its mobile app, which are important to its most frequent diners.\n\nAs McDonald's tries to regain its footing in the U.S., the chain is also testing two new value menus, one with mix and match bundles and the other with set combinations of menu items, executives said on the earnings call. The offering that resonates the most with customers and franchisees will be rolled out across the U.S. in early 2027.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:17 AM IST", "pub_date_relative": "41m ago"}, {"title": "Top stocks to own now after Democrats sweep the midterms, according to CIBC", "full_content": "CIBC recommended a list of top picks for investors after Democratic victories paved the way for a potentially tougher regulatory environment for corporate America.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:13 AM IST", "pub_date_relative": "45m ago"}, {"title": "Hyperscalers and Apple surge after election results remove investor uncertainty", "full_content": "Many of the biggest technology companies are surging on Wednesday, after Democrats scored a seismic victory in the midterm elections, flipping both the House and Senate.\n\nDuring trading on Wednesday, Amazon surged 8%, Google rose over 6%, Microsoft rose 4%, Meta was up 3%, and Apple \u2014 which faced Trump's tariffs and recently got refunds \u2014 climbed nearly 7%.\n\nTuesday's results remove uncertainty in the market, David Kelly, chief global strategist at JPMorgan Asset Management, said on \"Squawk on the Street.\"\n\nHe said the divided government would lead to \"moderation in growth, moderation in inflation, less uncertainty, and I think that's all helping the stock market move up today.\"\n\nHowever, some stocks, particularly those tied to Trump advisor Elon Musk as well as the AI data center buildout, fell on Wednesday.\n\nAs results came in last night, some observers saw bad news for big technology companies because of their bets to build large AI-focused data centers. There were 41 local ballot measures on Tuesday to place restrictions or clear the way for AI data centers, and voters sided against data centers in 40 of them. In a CNBC Voter Poll, 56% of voters said data centers were a crucial or major factor in their voting decision.\n\nAnalysts said that Democrats who proposed data center moratoriums won gubernatorial races in Texas, Georgia, and Ohio, raising fears that projects could get snarled in regulation or blocked by politicians.\n\n\"Recall that backup power emissions, zoning, water, interconnect/grid, and tax considerations are often overseen by state regulators,\" Macquarie analyst Paul Golding said in a note on Wednesday.", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 01:07 AM IST", "pub_date_relative": "50m ago"}, {"title": "Bitcoin rebounds with stocks despite threat to crypto agenda", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Bitcoin rebounds with stocks despite threat to crypto agenda Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Bitcoin rebounds with stocks despite threat to crypto agenda SECTIONS Bitcoin rebounds with stocks despite threat to crypto agenda By Suvashree Ghosh and Emma Haidar , Bloomberg Last Updated: Nov 05, 2026, 01:02:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bitcoin rebounds more than 4% to above $81,000, tracking a broader recovery in financial markets after the US midterm elections. However, Democratic control of Congress threatens to stall crypto-friendly legislation and increase regulatory scrutiny. Investors are also weighing the impact of political uncertainty, Treasury yields and institutional adoption.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 01:02 AM IST", "pub_date_relative": "56m ago"}, {"title": "Who Keeps Crashing China\u2019s Stock Market?", "full_content": "China is scrambling to contain a stock-market rout only two years after the previous rescue.\n\nBeijing is dusting off the market-support playbook it deployed in 2024. The People\u2019s Bank of China is providing low-cost funding for corporate share buybacks and liquidity for institutional investors. The shadowy \u201cnational team\u201d appears to have stepped up its operations, while regulators are again resorting to window guidance \u2014 informally instructing institutional investors and brokerages not to sell.\n\nIn October, China\u2019s stock market suffered its worst monthly decline in more than a decade. The blue-chip CSI 300 Index has fallen into a bear market from its late-June peak, while Shanghai\u2019s semiconductor-heavy SSE Science and Technology Innovation Board 50 Index, or Star 50, has plunged as much as 48%.\n\nSo who\u2019s been selling? The blame game has already begun. Shiva Capital Group, one of China\u2019s biggest hedge funds, has pointed the finger at insurers. In a recent letter to clients, founder Hong Liang accused the insurance firms of piling into technology stocks near their July peak, only to slash positions in late September. The behavior was \u201ctruly baffling,\u201d lamented the prominent investor, who has a large following on the mainland.\n\nLiang certainly has reason to deflect blame. China has a long history of faulting private-sector investors, from quant funds to foreign asset managers, for igniting selloffs. But he might just have a point this time.\n\nChina had already endured a bear market in July, when momentum-driven trades suffered their worst loss in history. The pattern mirrored markets in South Korea and the US, where the red-hot semiconductor trade was hastily unwound. Three months later, however, the usual suspects are harder to blame. Margin financing has already fallen, as has northbound turnover through the Stock Connect with Hong Kong, suggesting neither leveraged traders nor foreign hot money is behind the latest weakness.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "The New York Times Adds 420,000 Digital Subscribers - The New York Times", "full_content": "The New York Times Adds 420,000 Digital Subscribers The New York Times New York Times Revenue Rises on Digital Subscriber Gains WSJ New York Times (NYT) Q3 Earnings: Taking a Look at Key Metrics Versus Estimates Yahoo Finance New York Times: Q3 Earnings Snapshot kare11.com NY Times (NYT) Q3 2026 Earnings Call Transcript The Globe and Mail", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 12:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "Big factories dominate India's manufacturing output, Annual Survey of Industries shows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Big factories dominate India's manufacturing output, Annual Survey of Industries shows The Economic Times daily newspaper is available online now. Read Today's Paper Big factories dominate India's manufacturing output, Annual Survey of Industries shows SECTIONS Big factories dominate India's manufacturing output, Annual Survey of Industries shows By ET Bureau Last Updated: Nov 05, 2026, 12:47:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's manufacturing sector is characterized by a significant concentration in large factories generating substantial output. Factories producing over \u20b9500 crore contribute to more than three-fifths of total value added. Smaller factories represent a large number but have minimal output and value contribution. The overall manufacturing corporate sector experienced a notable growth in gross value added year-on-year. However, per-worker value creation did not witness similar growth despite increased employment.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nNew orders & robust demand lift India's October services growth to 4-month high\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?", "source": "Economic Times Economy", "pub_date_str": "05 Nov 2026, 12:47 AM IST", "pub_date_relative": "1h ago"}, {"title": "Visits to US McDonald's locations falls as customers struggle with the high cost of living - ABC News - Breaking News, Latest News and Videos", "full_content": "Visits to US McDonald's locations falls as customers struggle with the high cost of living ABC News - Breaking News, Latest News and Videos McDonald's stock rises as earnings beat, U.S. restaurants show improvement CNBC McDonald's plans new value bundles next year after U.S. traffic falls in third quarter Pittsburgh Post-Gazette McDonald\u2019s US Slump Cushioned by Increase in Order Sizes Bloomberg McDonald's says US sales on the mend as promotions draw diners back Reuters", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 12:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "4 market-moving issues investors should watch now that the midterms are over", "full_content": "The Democrats\u2019 election sweep on Tuesday could have far-reaching consequences for markets and the economy.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 12:42 AM IST", "pub_date_relative": "1h ago"}, {"title": "A massive trade just happened in a leading mortgage lender: Watch Options Action Live", "full_content": "For more options-trading reaction to the rally, click the link at the top of the page for Options Action LIVE featuring CNBC contributors Michael Khouw and Brent Kochuba alongside host Oliver Renick.\n\nStocks are surging after midterms brought a Democratic blue wave and options traders are responding by selling volatility and embracing a rotation away from big-tech trades. The S&P 500 added just shy of 2% by midday Wednesday, recovering losses from Friday and Monday. The move in its corresponding options prices was even bigger, with the Cboe Volatility index falling about four points to below 17, the biggest one-day drop in the volatility gauge since at least July. Crude oil prices fell as WTI traded below $90 and energy stocks dropped 5.6% for the biggest decline in the S&P 500. Options on the State Street Energy Select Sector SPDR ETF (XLE) jumped to more than three times the 30-day average, with 57% puts by volume and the big-money trades concentrated in bearish put-buyers. The top trade in XLE was the 62.5-strike put expiring Jan. 15, suggesting it could be a slow rollover for what has been the best-performing sector of 2026, SpotGamma data show. With the drop in crude oil, a handful of inflation and interest-rate related trades got some bullish attention. Consumer discretionary stocks rallied almost 5% but options volume in the SPDR sector fund XLY was below average and volume was split between puts and calls, according to Cboe LiveVol data. Instead, there was some big action in a few housing trades such as Rocket Companies , the mortgage lender and Redfin owner that fell almost 50% this year before turning around last month. Options volume on Rocket was double the average with a strong bullish bias. Of the 110,000 options traded, 90% were calls and more were likely initiated by buyers than sellers. Bulls traded the bulls like the 14 and 16-strike calls expiring Nov. 20 the most.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 12:38 AM IST", "pub_date_relative": "1h ago"}, {"title": "Democrats map out an agenda to address affordability and corruption after midterm sweep", "full_content": "The newly elected Democratic majorities in the Senate and the House are planning to pass a flurry of bills as soon as they take the reins next January, CNBC has learned, and are preparing to tussle with an antagonistic President Donald Trump .\n\nThe legislative push aims to show a united Democratic caucus taking quick action on the issues they were elected to solve, especially oppressively high costs on everything from gas to groceries.\n\nIn their first 100 hours after being sworn in, House Democrats plan to bring to the floor bills reinstating the enhanced health insurance subsidies that expired under the GOP-held Congress, and reversing the Medicaid cuts Trump signed into law last year.\n\nDemocrats \u2014 likely led by Minority Leader Hakeem Jeffries (D-N.Y.), who is poised to become the first Black Speaker of the House in U.S. history \u2014 also plan to push forward a bill that would undo Trump's sweeping tariffs and reassert Congress' role in setting import taxes. And they will again vote on legislation to end the Iran war or force Trump to seek congressional authorization to keep it going. Some details of the Democrats' plans had been previously reported by the New York Times.\n\nBut Democrats will need to strike a balance between these legislative priorities and a robust oversight and investigatory agenda that the party is mapping out to scrutinize Trump, his family, cabinet and supporters in the business world.\n\n\"We haven't evaluated who are going to be the targets of the investigation right out of the gate. We'll have those conversations over the next couple of weeks,\" Jeffries told CNBC on Wednesday.\n\n\"But clearly, things aren't going right for the American people. Capitalism is broken in the way in which it is being experienced by so many working-class Americans and middle-class Americans.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 12:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX\u2019s Qualcomm deal could be a precursor to a telecom takeover", "full_content": "The deal adds to what a BNP Paribas analyst called an \u201cunprecedented\u201d amount of news putting pressure on U.S. telecommunications operators.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump diesel deal with Russia falters as US fuel supplies hit 20-year low", "full_content": "Two tankers change course in setback to White House gambit to lower fuel prices and shore up political support", "source": "FT Markets", "pub_date_str": "05 Nov 2026, 12:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "Lumentum Sell-Off After Marvell Offer Raises Chance of Alternate Bid - The Information", "full_content": "Lumentum Sell-Off After Marvell Offer Raises Chance of Alternate Bid The Information Lumentum CEO touts 'enormous' opportunity in massive AI connectivity deal with Marvell CNBC Driven by A.I. Boom, Marvell and Lumentum Announce $115 Billion Merger The New York Times Tesla-SpaceX Merger: What the Marvell-Lumentum Backlash Tells Investors Barron's Nvidia\u2019s Huang Gave Blessing to Marvell-Lumentum Megadeal Bloomberg", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 12:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "New orders & robust demand lift India's October services growth to 4-month high", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a New orders & robust demand lift India's October services growth to 4-month high The Economic Times daily newspaper is available online now. Read Today's Paper New orders & robust demand lift India's October services growth to 4-month high SECTIONS New orders & robust demand lift India's October services growth to 4-month high ET Bureau Last Updated: Nov 05, 2026, 12:18:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Growth in India's services sector increased to a four-month high in October due to strong domestic demand and business orders. The HSBC Services Business Activity Index rose to 55.8, reflecting improved business conditions. Conversely, manufacturing activity showed a slight decline, easing to a PMI of 54.7. While input prices continued to rise, the rate of increase was the slowest in over six years.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nIndian car buyers trade up selectively as CNG, EVs gain ground over fuel; SUV growth reshapes price ladder\n\nIndia's palm oil imports hit 14-month high, soyoil purchases set record\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3", "source": "Economic Times Economy", "pub_date_str": "05 Nov 2026, 12:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "Trump hammers Fox News, blaming network for GOP losses as ratings slide", "full_content": "President Donald Trump turned against Fox News on Tuesday night in a string of posts on Truth Social while Democratic wins rolled in during a historic midterm election.\n\nTrump blamed the network, which he's long championed, for Republican losses, saying in one post on his social media network that it \"bears responsibility for these losses by constantly and consistently putting on the Dumocrat opposition.\"\n\nDemocrats took control of both the Senate and House of Representatives, flipping seats in states usually favorable to Republicans, including Texas, South Carolina and Kansas.\n\nTrump also pointed to Fox's recent ratings as evidence of the network's decline.\n\n\"FoxNews Ratings are way down (27%!) because they're spending too much time covering the Trump Deranged Dumocrats! All of those people who used to watch Fox, and no longer do, get it. It's them, not me,\" he posted.\n\nFox News did not immediately respond to a request for comment.\n\nIn a press release last week, Fox News reported 1.1 million average viewers for October, down about 27% from the same month a year prior.\n\nFox Corp. CEO Lachlan Murdoch noted the decline during the company's quarterly earnings call on Monday, citing \"viewer fatigue.\"", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 12:07 AM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018I have no financial safety net\u2019: I\u2019m 66, rely on Social Security and have $500 in savings. What politician speaks for me?", "full_content": "\u201cIn the wake of the midterm elections, how many Americans are living in poverty?\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 12:07 AM IST", "pub_date_relative": "1h ago"}, {"title": "CVS to split off drugstore business in major breakup of healthcare giant; shares fall 10%", "full_content": "CVS Health plans to split into two separate public companies by the first half 2028 in what would be one of the largest corporate breakups in history, the company announced Wednesday.\n\nThe move would reverse the company's massive $78 billion acquisition of its insurer, Aetna, and dismantle the vertically integrated healthcare conglomerate it created in 2018. The plan would specifically separate CVS' roughly 9,000 retail pharmacies from its major insurance business and pharmacy benefit manager, Caremark, one of the nation's three largest PBMs.\n\nThe decision follows a \"comprehensive strategic review\" by the company's board of directors, according to a news release . Shares of CVS fell more than 12% on Wednesday.\n\nIt's a stunning reversal for the healthcare powerhouse, which has spent the last two decades working to turn itself into a one-stop health destination. The move also comes as CVS' aggressive turnaround plan under CEO David Joyner shows substantial progress, with the company pursuing $2 billion in cost cuts, store closures, leadership shake-ups and efforts to rein in Medicare Advantage costs.\n\nBut Joyner told CNBC's \" Squawk on the Street \" on Wednesday that the decision to split is \"out of a position of strength,\" pointing to recovery in Aetna's Medicare business and solid performance in the retail pharmacy.\n\n\"So it's all about the strength of the business that affords us the opportunity to make what we think are the right strategic decisions for the future of this company,\" he later added.\n\nCVS shares have jumped roughly 70% since Joyner took the helm in October 2024, bringing the company's market value to $117 billion.\n\nThe insurance and PBM company will retain the CVS Health name and be run by Joyner, while the other company will be called CVS Pharmacy and be led by Prem Shah, who is currently group president of CVS Health. Additional leadership positions and board members will be announced at a later date, CVS said.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 12:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "CVS to break up $117 billion business, separating pharmacies from insurance; shares fall - Reuters", "full_content": "CVS to break up $117 billion business, separating pharmacies from insurance; shares fall Reuters CVS to Split Off Drugstore Business, Ending Its Bigger-Is-Better Era The New York Times CVS Health plans to split itself up. Here's why a breakup could make sense now CNBC CVS Will Break Off Its Namesake Pharmacies WSJ CVS to split into two companies, in major breakup of its $117 billion healthcare empire CNN", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 12:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks To Watch Today: Premier Energies, Axis Bank, M&M, Titan, Adani Power, ONGC & More", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Thursday.", "source": "NDTV Profit", "pub_date_str": "05 Nov 2026, 12:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "These stocks have soared the most today after the Democrats trounced Trump", "full_content": "Stanley Black & Decker\u2019s stock was the strongest performer among the S&P 500, while several tech players and associated power providers showed sharp declines.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 11:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "US slaps sanctions on Indian, Turkish firms and people for aiding Iran", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a US slaps sanctions on Indian, Turkish firms and people for aiding Iran The Economic Times daily newspaper is available online now. Read Today's Paper US slaps sanctions on Indian, Turkish firms and people for aiding Iran SECTIONS US slaps sanctions on Indian, Turkish firms and people for aiding Iran Reuters Last Updated: Nov 05, 2026, 12:20:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The sanctions are part of the Trump administration's \"Operation Economic Outcast,\" which aims to cut off Iran's ability to sell oil to fund the war with the US and Israel. Treasury unveiled the new sanctions a day after Democrats made huge gains in midterm elections, winning control of both houses of Congress as voters expressed anger about the Iran war and its impact in fueling US inflation.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 11:54 PM IST", "pub_date_relative": "2h ago"}, {"title": "Google responds to political backlash over removing search from schools that ban AI", "full_content": "Google is playing defense on Tuesday after a political backlash to its new policy surrounding use of artificial intelligence in schools.\n\nIn a blog post titled \"Designing responsible AI for learning,\" Google said it's bringing AI into its Classroom offering with a product called Guided Learning. The New York Times published a story saying that the company will turn off search for schools that reject AI entirely.\n\nFollowing the Times' story, prominent left-leaning politicians, including Sen. Bernie Sanders from Vermont and New York Mayor Zohran Mamdani voiced their outrage on social media.\n\n\"Google is trying to use its monopoly power to force AI into our public schools,\" Mamdani wrote on X. Sanders wrote that \"Google is threatening schools,\" referring to the policy as \"extortion.\"\n\nGoogle responded later in the day. In a post on X , the company said its new policy was meant to give schools more choice over how students interact with AI. Google said its Gemini chatbot, Gemini Notebook and search are turned off by default, and that \"schools are in control,\" with the ability to turn them as they see fit.\n\n\"We are also updating Search for schools to make it better for learning,\" Google wrote. \"Specifically, AI Mode and AI Overviews will offer step-by-step guided learning through problems, so that students don't get quick answers to schoolwork.\"\n\nThe company's post didn't explicitly respond to the claim that access to search requires use of AI. However, Chris Phillips, vice president for education at Google, told the Times that \"Search and AI are deeply integrated.\"\n\nA Google spokesperson referred CNBC to the X post when asked for comment.", "source": "CNBC World Economy", "pub_date_str": "04 Nov 2026, 11:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Will tighter AI regulation slow Big Tech spending? What the US midterm results mean for tech stocks - Explained", "full_content": "A Democratic sweep of both chambers of Congress in the midterm elections left Wall Street divided in Wednesday's trade. While AI chipmakers, memory companies and data centre operators fell, hyperscalers surged sharply.\n\nShares of Amazon surged 8% to a three-month high, while Apple and Microsoft advanced 6% each. Alphabet gained 5.7%, while Meta Platforms climbed 3.5%, powering a rally on Wall Street after days of selling fuelled by concerns over the soaring costs of the AI boom.\n\nApple, which has avoided Big Tech's massive AI spending but is feeling the impact of an AI-fuelled surge in memory chip prices, jumped nearly 7% to a record high.\n\nIf the gains hold, the five companies are on course to add more than $750 billion in combined market value, according to Bloomberg .\n\nA Democratic-led Congress could push for tighter regulation of AI development and data centre construction. Some investors see this as a sign that hyperscalers may moderate their spending.\n\nOn the other hand, SanDisk shares slumped 10%, while peer Seagate Technology Holdings plunged 8.2% at its intraday low. Nvidia, the chipmaker that quickly became the poster child of the AI stock frenzy, slipped 2.5%.\n\nCoreWeave, a company that rents out access to AI chips to customers over the cloud, fell 11%. Advanced Micro Devices, another chip giant, was down 1.5%, even after reporting a much stronger profit for the latest quarter than analysts had expected.\n\nFor hyperscalers, the rally marks a sharp reversal after a difficult period for cloud giants. Their quarterly earnings reports highlighted how the race to build AI infrastructure was turning once cash-rich, debt-light companies into heavy spenders increasingly reliant on borrowing. Microsoft was a notable exception, reporting $18.6 billion in cash flow.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 11:38 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "What Republicans' huge loss means for Trump", "full_content": "The party is projected to win commanding majorities in the House and Senate after thrashing Republicans in key races up and down the ballot across the country. The blue tsunami will knock Washington on its head and crush the Republican congressional bulwark that both supported and shielded Trump through the first two years of his term.\n\nFollow CNBC's live coverage of the 2026 midterm election results\n\nThe midterm result snuffs out any chance Trump had of passing partisan legislation in the second half of his presidency. And many of the interests he has been able to pursue without Congress' input \u2014 including tariffs , the Iran war and an array of Washington-area construction projects \u2014 are sure to face sudden pushback from newly empowered Democratic majorities.\n\nThe paradigm shift hardly leaves Trump helpless, however. As president at a time of executive power expansion , Trump wields singular authorities that could stymie Democrats' efforts to pursue their own agendas.\n\nBut with his grip on the Capitol shriveling and his approval ratings scraping record lows in numerous polls, it's unclear how much support he'll be able to muster to fight the coming political battles.\n\nEven before Election Day, analysts and pundits had contemplated a Democratic rout so decisive that it would force a reckoning for the GOP, and potentially even pose an existential threat to Trump's \"Make America Great Again\" movement.\n\nMarc Short, chairman of Advancing American Freedom and onetime chief of staff to former Vice President Mike Pence , told CNBC on Tuesday afternoon that the GOP has moved away from its conservative foundations.\n\n\"We need a refresh right now,\" Short said in an interview. \"We've lost our way.\"", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:53 AM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock market today: Dow jumps over 1,000 points, S&P 500 and Nasdaq gain after Democrats win control of Congress - Yahoo Finance", "full_content": "Stock market today: Dow jumps over 1,000 points, S&P 500 and Nasdaq gain after Democrats win control of Congress Yahoo Finance Why the stock market is unexpectedly rallying in the wake of the Democratic blue wave Yahoo Finance What investing pros see ahead for markets after the Democrats win Congress Business Insider Dow eyes best post-midterm elections day in 44 years as Democrats take control of Congress CNN Markets cheer Democratic win, betting divided Washington means fewer policy shocks Reuters", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 01:39 AM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Alcohol stocks jump as blue wave boosts industry prospects", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Alcohol stocks jump as blue wave boosts industry prospects Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Alcohol stocks jump as blue wave boosts industry prospects SECTIONS Alcohol stocks jump as blue wave boosts industry prospects By Redd Brown , Bloomberg Last Updated: Nov 05, 2026, 01:34:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis As the midterm elections unfold, investors are directing their focus to the alcohol sector, anticipating positive impacts on companies such as Constellation Brands due to shifting immigration policies. Optimism surrounding decreasing trade tensions with Canada also seems to uplift brands like Brown-Forman. However, the looming tariffs have caused a sharp decline in US spirits exports, and overall alcohol consumption in the country is still at historical lows, despite minor upticks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 01:34 AM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Microsoft and Amazon combine for a $400 billion market-cap boost \u2014 and these factors show why", "full_content": "Microsoft and Amazon shares are rising sharply on Wednesday, with one portfolio manager noting that a cloud-supply crunch could help the companies raise prices.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 01:34 AM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Stocks and Bonds Rise, Dollar Slides After US Vote: Markets Wrap - Bloomberg", "full_content": "Stocks and Bonds Rise, Dollar Slides After US Vote: Markets Wrap Bloomberg Dow surges 1,500 points after Democrats take control of Congress CBS News Stock Market Today: Dow Jumps 1,500 Points On Democratic Sweep of Congress \u2014 Live Updates WSJ These 3 Stocks Boost Dow Jones' Bounce. Here's Why. Investor's Business Daily Dow Skyrockets 1,500 Points in Best Day Since Trump's Tariff Pause Barron's", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 01:31 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Earnings call transcript: Douglas Emmett tops revenue forecast in Q3 2026", "full_content": "", "source": "Investing.com News", "pub_date_str": "05 Nov 2026, 01:27 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Musk stocks lose $120 billion as Democrats\u2019 Texas win rattles investors", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Musk stocks lose $120 billion as Democrats\u2019 Texas win rattles investors Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Musk stocks lose $120 billion as Democrats\u2019 Texas win rattles investors SECTIONS Musk stocks lose $120 billion as Democrats\u2019 Texas win rattles investors By Jordan Fitzgerald , Bloomberg Last Updated: Nov 05, 2026, 01:25:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Tesla and SpaceX lost more than $120 billion in combined market value after Democrats scored major election victories in Texas and across the US. Investors are concerned that a Democrat-controlled Congress could increase scrutiny of Elon Musk\u2019s businesses, complicate a potential Tesla-SpaceX merger and create fresh regulatory hurdles.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 01:25 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Democrats take Congress in a blue wave. Here's what it means for your money", "full_content": "With Democrats flipping control of Congress in the midterm election , the shift in power on Capitol Hill could reshape household budgets \u2014 from student loan bills and health insurance premiums to housing costs and taxes.\n\nExperts say results show that rising costs were top of mind for voters.\n\n\"I see this election as a repudiation of the anti-affordability agenda from the Trump administration,\" said Daniel Bunn, president and CEO of the Tax Foundation, a nonpartisan, nonprofit research organization.\n\n\"Whether that's the conflict in the Middle East or the tariffs, just top to bottom, it's clear to me that was a real concern of the electorate,\" he said.\n\nWhite House spokesman Matthew Middleton said in an emailed statement that the Trump administration has delivered \"tangible wins to make life more affordable for American families.\" Officials \"will continue to put hardworking American's first with or without support from Democrats,\" he wrote.\n\nDemocrats won control of both the House of Representatives and Senate, which could make it easier for the party to advance legislation. They can also use hearings and investigations to press federal agencies and companies to answer for policies and practices that impact consumers, and exert leverage over confirmation of President Donald Trump's nominees.\n\nBut turning campaign promises into changes people feel in their finances won't be easy. Trump can veto bills a Democrat-controlled Congress passes, limiting how much of their agenda could become law. Based on projections, Democrats will lack the numbers needed to override a presidential veto.\n\nAny changes will also take time: Newly elected members of Congress won't take office until January.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:23 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "New Flutter CEO bets on FanDuel promotions to win customers as profits suffer", "full_content": "Flutter's new CEO Dan Taylor is counting on better products and more generous customer rewards to help convert FanDuel's improving engagement into stronger profits.\n\nTaylor's been at the helm for just five weeks and issued his first earnings report as CEO on Wednesday, with third-quarter revenue and adjusted earnings before interest, taxes, depreciation and amortization missing Wall Street's expectations.\n\n\"We made some changes to the product,\" Taylor told CNBC in an interview. \"Fundamentally, the way you win this business is by delighting customers, delivering the very best experiences and delivering to them in the way that they want, with the right overall proposition.\"\n\nFanDuel also launched a nationwide rewards program in September that Taylor said has \"resonated really, really well.\"\n\nThe early customer numbers are improving. Average monthly players on FanDuel's U.S. sportsbook rose 9% in the third quarter, while bet counts increased 15%, Taylor said.\n\nFlutter's earnings release showed total U.S. average monthly players up 12%, including 24% growth in iGaming. Sportsbook handle, or the total amount wagered, rose 13%, but sportsbook revenue grew just 4% as promotional spending increased.\n\nTaylor said the company plans to keep investing in customer experience. He said Flutter sees room to improve its structural margins over time by changing the mix of products customers use.\n\nFlutter has increased its media spend to build FanDuel Predicts, its predictions platform to rival Kalshi and Polymarket, but the cost of sales as a percent of revenue is forecast to be 58% for the full-year 2026 and into 2027.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:23 AM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "McDonald's stock rises as earnings beat, U.S. restaurants show improvement", "full_content": "McDonald's on Wednesday reported mixed quarterly results as traffic to its U.S. restaurants fell, leading to a slight decline in domestic same-store sales.\n\nThe fast-food giant reported a 0.2% decrease in sales at its U.S. restaurants that have been open at least 13 months. Even so, the segment performed better than the 0.5% decline that Wall Street anticipated, according to a survey of analysts by StreetAccount.\n\n\"In the U.S., we're encouraged by improvement as the quarter progressed following our intervention on value,\" McDonald's CEO Chris Kempczinski said in a statement.\n\nMcDonald's same-store sales returned to growth in September after falling in July and August, CFO Ian Borden said on the company's earnings conference call. However, in response to an analyst question, he clarified that he did not say that U.S. same-store sales would be better in the fourth quarter.\n\nKempczinski said in August that the company's U.S. business was falling short on execution, particularly on the implementation of its value offerings. Like many restaurants, McDonald's has leaned into discounts to attract budget-conscious diners over the last two years.\n\nTo reverse same-store sales declines, McDonald's focused its marketing on its Extra Value Meals and restarted regional and national promotions on its mobile app, which are important to its most frequent diners.\n\nAs McDonald's tries to regain its footing in the U.S., the chain is also testing two new value menus, one with mix and match bundles and the other with set combinations of menu items, executives said on the earnings call. The offering that resonates the most with customers and franchisees will be rolled out across the U.S. in early 2027.\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:17 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Top stocks to own now after Democrats sweep the midterms, according to CIBC", "full_content": "CIBC recommended a list of top picks for investors after Democratic victories paved the way for a potentially tougher regulatory environment for corporate America.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 01:13 AM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Hyperscalers and Apple surge after election results remove investor uncertainty", "full_content": "Many of the biggest technology companies are surging on Wednesday, after Democrats scored a seismic victory in the midterm elections, flipping both the House and Senate.\n\nDuring trading on Wednesday, Amazon surged 8%, Google rose over 6%, Microsoft rose 4%, Meta was up 3%, and Apple \u2014 which faced Trump's tariffs and recently got refunds \u2014 climbed nearly 7%.\n\nTuesday's results remove uncertainty in the market, David Kelly, chief global strategist at JPMorgan Asset Management, said on \"Squawk on the Street.\"\n\nHe said the divided government would lead to \"moderation in growth, moderation in inflation, less uncertainty, and I think that's all helping the stock market move up today.\"\n\nHowever, some stocks, particularly those tied to Trump advisor Elon Musk as well as the AI data center buildout, fell on Wednesday.\n\nAs results came in last night, some observers saw bad news for big technology companies because of their bets to build large AI-focused data centers. There were 41 local ballot measures on Tuesday to place restrictions or clear the way for AI data centers, and voters sided against data centers in 40 of them. In a CNBC Voter Poll, 56% of voters said data centers were a crucial or major factor in their voting decision.\n\nAnalysts said that Democrats who proposed data center moratoriums won gubernatorial races in Texas, Georgia, and Ohio, raising fears that projects could get snarled in regulation or blocked by politicians.\n\n\"Recall that backup power emissions, zoning, water, interconnect/grid, and tax considerations are often overseen by state regulators,\" Macquarie analyst Paul Golding said in a note on Wednesday.", "source": "CNBC World Economy", "pub_date_str": "05 Nov 2026, 01:07 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bitcoin rebounds with stocks despite threat to crypto agenda", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Bitcoin rebounds with stocks despite threat to crypto agenda Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Bitcoin rebounds with stocks despite threat to crypto agenda SECTIONS Bitcoin rebounds with stocks despite threat to crypto agenda By Suvashree Ghosh and Emma Haidar , Bloomberg Last Updated: Nov 05, 2026, 01:02:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bitcoin rebounds more than 4% to above $81,000, tracking a broader recovery in financial markets after the US midterm elections. However, Democratic control of Congress threatens to stall crypto-friendly legislation and increase regulatory scrutiny. Investors are also weighing the impact of political uncertainty, Treasury yields and institutional adoption.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "05 Nov 2026, 01:02 AM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Who Keeps Crashing China\u2019s Stock Market?", "full_content": "China is scrambling to contain a stock-market rout only two years after the previous rescue.\n\nBeijing is dusting off the market-support playbook it deployed in 2024. The People\u2019s Bank of China is providing low-cost funding for corporate share buybacks and liquidity for institutional investors. The shadowy \u201cnational team\u201d appears to have stepped up its operations, while regulators are again resorting to window guidance \u2014 informally instructing institutional investors and brokerages not to sell.\n\nIn October, China\u2019s stock market suffered its worst monthly decline in more than a decade. The blue-chip CSI 300 Index has fallen into a bear market from its late-June peak, while Shanghai\u2019s semiconductor-heavy SSE Science and Technology Innovation Board 50 Index, or Star 50, has plunged as much as 48%.\n\nSo who\u2019s been selling? The blame game has already begun. Shiva Capital Group, one of China\u2019s biggest hedge funds, has pointed the finger at insurers. In a recent letter to clients, founder Hong Liang accused the insurance firms of piling into technology stocks near their July peak, only to slash positions in late September. The behavior was \u201ctruly baffling,\u201d lamented the prominent investor, who has a large following on the mainland.\n\nLiang certainly has reason to deflect blame. China has a long history of faulting private-sector investors, from quant funds to foreign asset managers, for igniting selloffs. But he might just have a point this time.\n\nChina had already endured a bear market in July, when momentum-driven trades suffered their worst loss in history. The pattern mirrored markets in South Korea and the US, where the red-hot semiconductor trade was hastily unwound. Three months later, however, the usual suspects are harder to blame. Margin financing has already fallen, as has northbound turnover through the Stock Connect with Hong Kong, suggesting neither leveraged traders nor foreign hot money is behind the latest weakness.", "source": "LiveMint Markets", "pub_date_str": "05 Nov 2026, 12:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The New York Times Adds 420,000 Digital Subscribers - The New York Times", "full_content": "The New York Times Adds 420,000 Digital Subscribers The New York Times New York Times Revenue Rises on Digital Subscriber Gains WSJ New York Times (NYT) Q3 Earnings: Taking a Look at Key Metrics Versus Estimates Yahoo Finance New York Times: Q3 Earnings Snapshot kare11.com NY Times (NYT) Q3 2026 Earnings Call Transcript The Globe and Mail", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 12:52 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Big factories dominate India's manufacturing output, Annual Survey of Industries shows", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a Big factories dominate India's manufacturing output, Annual Survey of Industries shows The Economic Times daily newspaper is available online now. Read Today's Paper Big factories dominate India's manufacturing output, Annual Survey of Industries shows SECTIONS Big factories dominate India's manufacturing output, Annual Survey of Industries shows By ET Bureau Last Updated: Nov 05, 2026, 12:47:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's manufacturing sector is characterized by a significant concentration in large factories generating substantial output. Factories producing over \u20b9500 crore contribute to more than three-fifths of total value added. Smaller factories represent a large number but have minimal output and value contribution. The overall manufacturing corporate sector experienced a notable growth in gross value added year-on-year. However, per-worker value creation did not witness similar growth despite increased employment.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nNew orders & robust demand lift India's October services growth to 4-month high\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?", "source": "Economic Times Economy", "pub_date_str": "05 Nov 2026, 12:47 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Visits to US McDonald's locations falls as customers struggle with the high cost of living - ABC News - Breaking News, Latest News and Videos", "full_content": "Visits to US McDonald's locations falls as customers struggle with the high cost of living ABC News - Breaking News, Latest News and Videos McDonald's stock rises as earnings beat, U.S. restaurants show improvement CNBC McDonald's plans new value bundles next year after U.S. traffic falls in third quarter Pittsburgh Post-Gazette McDonald\u2019s US Slump Cushioned by Increase in Order Sizes Bloomberg McDonald's says US sales on the mend as promotions draw diners back Reuters", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 12:42 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "A massive trade just happened in a leading mortgage lender: Watch Options Action Live", "full_content": "For more options-trading reaction to the rally, click the link at the top of the page for Options Action LIVE featuring CNBC contributors Michael Khouw and Brent Kochuba alongside host Oliver Renick.\n\nStocks are surging after midterms brought a Democratic blue wave and options traders are responding by selling volatility and embracing a rotation away from big-tech trades. The S&P 500 added just shy of 2% by midday Wednesday, recovering losses from Friday and Monday. The move in its corresponding options prices was even bigger, with the Cboe Volatility index falling about four points to below 17, the biggest one-day drop in the volatility gauge since at least July. Crude oil prices fell as WTI traded below $90 and energy stocks dropped 5.6% for the biggest decline in the S&P 500. Options on the State Street Energy Select Sector SPDR ETF (XLE) jumped to more than three times the 30-day average, with 57% puts by volume and the big-money trades concentrated in bearish put-buyers. The top trade in XLE was the 62.5-strike put expiring Jan. 15, suggesting it could be a slow rollover for what has been the best-performing sector of 2026, SpotGamma data show. With the drop in crude oil, a handful of inflation and interest-rate related trades got some bullish attention. Consumer discretionary stocks rallied almost 5% but options volume in the SPDR sector fund XLY was below average and volume was split between puts and calls, according to Cboe LiveVol data. Instead, there was some big action in a few housing trades such as Rocket Companies , the mortgage lender and Redfin owner that fell almost 50% this year before turning around last month. Options volume on Rocket was double the average with a strong bullish bias. Of the 110,000 options traded, 90% were calls and more were likely initiated by buyers than sellers. Bulls traded the bulls like the 14 and 16-strike calls expiring Nov. 20 the most.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 12:38 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Democrats map out an agenda to address affordability and corruption after midterm sweep", "full_content": "The newly elected Democratic majorities in the Senate and the House are planning to pass a flurry of bills as soon as they take the reins next January, CNBC has learned, and are preparing to tussle with an antagonistic President Donald Trump .\n\nThe legislative push aims to show a united Democratic caucus taking quick action on the issues they were elected to solve, especially oppressively high costs on everything from gas to groceries.\n\nIn their first 100 hours after being sworn in, House Democrats plan to bring to the floor bills reinstating the enhanced health insurance subsidies that expired under the GOP-held Congress, and reversing the Medicaid cuts Trump signed into law last year.\n\nDemocrats \u2014 likely led by Minority Leader Hakeem Jeffries (D-N.Y.), who is poised to become the first Black Speaker of the House in U.S. history \u2014 also plan to push forward a bill that would undo Trump's sweeping tariffs and reassert Congress' role in setting import taxes. And they will again vote on legislation to end the Iran war or force Trump to seek congressional authorization to keep it going. Some details of the Democrats' plans had been previously reported by the New York Times.\n\nBut Democrats will need to strike a balance between these legislative priorities and a robust oversight and investigatory agenda that the party is mapping out to scrutinize Trump, his family, cabinet and supporters in the business world.\n\n\"We haven't evaluated who are going to be the targets of the investigation right out of the gate. We'll have those conversations over the next couple of weeks,\" Jeffries told CNBC on Wednesday.\n\n\"But clearly, things aren't going right for the American people. Capitalism is broken in the way in which it is being experienced by so many working-class Americans and middle-class Americans.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 12:30 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "SpaceX\u2019s Qualcomm deal could be a precursor to a telecom takeover", "full_content": "The deal adds to what a BNP Paribas analyst called an \u201cunprecedented\u201d amount of news putting pressure on U.S. telecommunications operators.", "source": "MarketWatch Top Stories", "pub_date_str": "05 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Lumentum Sell-Off After Marvell Offer Raises Chance of Alternate Bid - The Information", "full_content": "Lumentum Sell-Off After Marvell Offer Raises Chance of Alternate Bid The Information Lumentum CEO touts 'enormous' opportunity in massive AI connectivity deal with Marvell CNBC Driven by A.I. Boom, Marvell and Lumentum Announce $115 Billion Merger The New York Times Tesla-SpaceX Merger: What the Marvell-Lumentum Backlash Tells Investors Barron's Nvidia\u2019s Huang Gave Blessing to Marvell-Lumentum Megadeal Bloomberg", "source": "Google News Business", "pub_date_str": "05 Nov 2026, 12:24 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "New orders & robust demand lift India's October services growth to 4-month high", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a New orders & robust demand lift India's October services growth to 4-month high The Economic Times daily newspaper is available online now. Read Today's Paper New orders & robust demand lift India's October services growth to 4-month high SECTIONS New orders & robust demand lift India's October services growth to 4-month high ET Bureau Last Updated: Nov 05, 2026, 12:18:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Growth in India's services sector increased to a four-month high in October due to strong domestic demand and business orders. The HSBC Services Business Activity Index rose to 55.8, reflecting improved business conditions. Conversely, manufacturing activity showed a slight decline, easing to a PMI of 54.7. While input prices continued to rise, the rate of increase was the slowest in over six years.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nIndian car buyers trade up selectively as CNG, EVs gain ground over fuel; SUV growth reshapes price ladder\n\nIndia's palm oil imports hit 14-month high, soyoil purchases set record\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3", "source": "Economic Times Economy", "pub_date_str": "05 Nov 2026, 12:18 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Trump hammers Fox News, blaming network for GOP losses as ratings slide", "full_content": "President Donald Trump turned against Fox News on Tuesday night in a string of posts on Truth Social while Democratic wins rolled in during a historic midterm election.\n\nTrump blamed the network, which he's long championed, for Republican losses, saying in one post on his social media network that it \"bears responsibility for these losses by constantly and consistently putting on the Dumocrat opposition.\"\n\nDemocrats took control of both the Senate and House of Representatives, flipping seats in states usually favorable to Republicans, including Texas, South Carolina and Kansas.\n\nTrump also pointed to Fox's recent ratings as evidence of the network's decline.\n\n\"FoxNews Ratings are way down (27%!) because they're spending too much time covering the Trump Deranged Dumocrats! All of those people who used to watch Fox, and no longer do, get it. It's them, not me,\" he posted.\n\nFox News did not immediately respond to a request for comment.\n\nIn a press release last week, Fox News reported 1.1 million average viewers for October, down about 27% from the same month a year prior.\n\nFox Corp. CEO Lachlan Murdoch noted the decline during the company's quarterly earnings call on Monday, citing \"viewer fatigue.\"", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 12:07 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CVS to split off drugstore business in major breakup of healthcare giant; shares fall 10%", "full_content": "CVS Health plans to split into two separate public companies by the first half 2028 in what would be one of the largest corporate breakups in history, the company announced Wednesday.\n\nThe move would reverse the company's massive $78 billion acquisition of its insurer, Aetna, and dismantle the vertically integrated healthcare conglomerate it created in 2018. The plan would specifically separate CVS' roughly 9,000 retail pharmacies from its major insurance business and pharmacy benefit manager, Caremark, one of the nation's three largest PBMs.\n\nThe decision follows a \"comprehensive strategic review\" by the company's board of directors, according to a news release . Shares of CVS fell more than 12% on Wednesday.\n\nIt's a stunning reversal for the healthcare powerhouse, which has spent the last two decades working to turn itself into a one-stop health destination. The move also comes as CVS' aggressive turnaround plan under CEO David Joyner shows substantial progress, with the company pursuing $2 billion in cost cuts, store closures, leadership shake-ups and efforts to rein in Medicare Advantage costs.\n\nBut Joyner told CNBC's \" Squawk on the Street \" on Wednesday that the decision to split is \"out of a position of strength,\" pointing to recovery in Aetna's Medicare business and solid performance in the retail pharmacy.\n\n\"So it's all about the strength of the business that affords us the opportunity to make what we think are the right strategic decisions for the future of this company,\" he later added.\n\nCVS shares have jumped roughly 70% since Joyner took the helm in October 2024, bringing the company's market value to $117 billion.\n\nThe insurance and PBM company will retain the CVS Health name and be run by Joyner, while the other company will be called CVS Pharmacy and be led by Prem Shah, who is currently group president of CVS Health. Additional leadership positions and board members will be announced at a later date, CVS said.", "source": "CNBC Top News", "pub_date_str": "05 Nov 2026, 12:05 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "These stocks have soared the most today after the Democrats trounced Trump", "full_content": "Stanley Black & Decker\u2019s stock was the strongest performer among the S&P 500, while several tech players and associated power providers showed sharp declines.", "source": "MarketWatch Top Stories", "pub_date_str": "04 Nov 2026, 11:59 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US slaps sanctions on Indian, Turkish firms and people for aiding Iran", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu
