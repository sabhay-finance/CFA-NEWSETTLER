<script>

    const allData = {"general": [{"title": "Oil up 1% as Iran official says country will keep enriched nuclear material", "full_content": "NEW YORK, Nov 11 (Reuters) - Oil prices rose about 1% on Wednesday after the Iranian security chief said Iran would not allow any enriched nuclear material to leave the country, feeding supply worries that lifted prices off two-month lows hit the previous session.\n\nThe United States has said nuclear issues must be part of any initial negotiations with Iran aimed at ending their war.\n\nBrent futures settled $1.27, or 1.39%, higher at $92.76, while US West Texas Intermediate crude gained 49 cents, or 0.57%, to $86.53.\n\nIn the previous session, oil prices initially fell by more than $3 a barrel after US officials played down the need for further military strikes against Iran. Prices later pared some losses after an Iranian security official said no talks were taking place between the two sides.\n\n\"Oil prices are being supported by fading hopes of an imminent de-escalation,\" UBS analyst Giovanni Staunovo said.\n\nWhile OPEC crude oil production jumped in October, led by a sharp increase in output from Saudi Arabia, there is little sign of easing disruption in the Strait of Hormuz. Data from the Washington Institute for Near East Policy showed that 37 ships were attacked in October, the highest monthly total since the start of the war in February.\n\n\"This demonstrates that operational risks have not disappeared simply because diplomatic signals have turned more positive,\" said Simon-Peter Massabni, head of business development at XS.com. \"More importantly, even if a political agreement is reached, shipping activity is unlikely to return to normal immediately.\"\n\nBrent and WTI prices have fallen about 21% and 17%, respectively, since the start of the month on hopes of an end to the war.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 01:39 AM IST", "pub_date_relative": "6m ago"}, {"title": "United Airlines moves to block AI agents from its platform over security concerns", "full_content": "United Airlines said on Wednesday it would restrict AI bots' access to its \u2060digital platforms, citing data security, in the latest pushback \u200bagainst AI agents \u200bincreasingly capable \u200bof planning and booking trips for travelers.\n\nCompanies across industries \u2060are \u200ctaking divergent approaches to the \u2060rapid rise of AI agents capable of carrying out tasks on behalf of users \u2014 some restricting access \u200cto protect their platforms, others embracing partnerships.\n\nAmazon has blocked Meta's AI \u200bagent Muse, while Walmart has partnered with it.\n\nMeanwhile, online travel firms such as Expedia and Booking are working \u2060with ChatGPT-parent OpenAI.\n\nUnited warned that sharing \u200caccount credentials with third-party AI \u200cassistants could expose sensitive information and lead to unintended purchases, account modifications or the unauthorized use \u2060of frequent-flyer miles.\n\nIt also said automated \u2060AI tools performing actions like flight \u2060check-in \u2014 which requires human acknowledgment for prohibited items such as explosives \u2014 could \u200bcreate regulatory risks.\n\nThe \u200ccarrier said it would take steps to restrict access both directly through its digital platforms and indirectly through travel agencies and aggregators, including \u200bupdates to its booking, ticketing \u200cand distribution policies.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:32 AM IST", "pub_date_relative": "13m ago"}, {"title": "Canada\u2019s ambassador warns Trump tariffs are driving up costs, threatening U.S. investment", "full_content": "Canada's ambassador to the U.S. warned Wednesday that President Donald Trump's tariffs are driving up investment costs and discouraging business expansion, as new Federal Reserve research points to more price hikes for American consumers next year.\n\n\"Uncertainty increases your cost of capital,\" Ambassador Mark Wiseman said at the B20 summit , a gathering of global business leaders in Washington hosted by the U.S. Chamber of Commerce.\n\n\"If you're going to build a new plant, add a new ship, spend money on R&D, the more certainty you have, the more likely you're going to do that,\" said Wiseman, a former BlackRock executive who became Canada's ambassador in February.\n\nHis warning comes as Washington and Ottawa struggle to resolve a tariff quarrel affecting one of the U.S.'s largest trading relationships. The two countries exchanged roughly $570 billion in goods during the first nine months of 2026, according to U.S. Census Bureau data . That's an increase from the same period in 2025, the first year of Trump's second term, but lower than the comparable nine months during the previous three years, when Joe Biden was president.\n\nU.S. customs duties calculated on imports from Canada reached $10 billion in 2025, compared with $400 million in 2024, according to the Congressional Research Service .\n\nAn October study by New York Fed researchers found that nearly 90% of tariff costs were passed on to U.S. importers, with about a quarter of tariff increases eventually reaching consumer goods prices and further price pressures expected in 2027.\n\nThe findings come as Labor Department data showed consumer prices rose a higher-than-expected 0.4% in October, adding to inflation concerns after Republicans' sweeping midterm losses .\n\nTrump has defended his tariffs as necessary to protect U.S. manufacturers and workers, accusing Canada of discriminatory trade practices that disadvantage U.S. exporters.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:32 AM IST", "pub_date_relative": "13m ago"}, {"title": "Majority of JetBlue lenders sign cooperation deal, Bloomberg News reports", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:31 AM IST", "pub_date_relative": "14m ago"}, {"title": "US container imports set all-time volume record in October as Chinese imports spike, Descartes says", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:30 AM IST", "pub_date_relative": "15m ago"}, {"title": "Should a widow leave her late partner\u2019s home to her stepkids \u2014 or cut off contact with them?", "full_content": "\u201cIt would be a less drastic step than selling the home now and splitting the proceeds.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 01:30 AM IST", "pub_date_relative": "16m ago"}, {"title": "Immunic at Stifel 2026 Healthcare Conference 2026: MS data loom", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:29 AM IST", "pub_date_relative": "16m ago"}, {"title": "Stick with high-quality AI bonds as debt worries persist, says Morgan Stanley", "full_content": "Morgan Stanley sees a more attractive entry point in high-quality hyperscaler bonds as investors remain wary of the debt funding the AI build-out.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:29 AM IST", "pub_date_relative": "16m ago"}, {"title": "Mississippi Senate: Scott Colom lead over Hyde-Smith pops to more than 4,400 votes", "full_content": "Democratic nominee Scott Colom on Wednesday significantly expanded his lead over incumbent Republican Sen. Cindy Hyde-Smith in the Mississippi Senate election to more than 4,400 votes as the ballot count continued.\n\nWhen the day began, Colom had a 2,990-vote lead over Hyde-Smith.\n\nThat spread ticked upward slowly until just after 2 p.m. ET when a surge of newly counted ballots boosted his tally by 607 votes, and then soon after by another 621 votes.\n\nAs of 2:30 p.m., Colom was ahead of Hyde-Smith by 4,404 votes, according to the Associated Press.\n\nWith an estimated 99% of the votes in, Colom led Hyde-Smith by 49.18% to 48.72%. Independent candidate Ty Pinkins had 2.1% of the vote.\n\nColom has steadily expanded his lead over Hyde-Smith for days as he has won a higher share of so-called affidavit ballots than he received in ballots counted on Election Day night. Affidavit ballots are cast by voters on a provisional basis if there is a question about the voter's eligibility.\n\nThe AP estimates that fewer than 15,000 ballots are left to be processed.\n\nColom was boosted by newly counted votes from Hinds County, the second-most populous county in Mississippi, which encompasses the capital of Jackson.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:25 AM IST", "pub_date_relative": "20m ago"}, {"title": "Social Security could pay full benefits until 2059 if taxable payroll kept pace with GDP: AARP report", "full_content": "Social Security 's taxable payroll, which provides most of the revenue for the program that pays monthly benefits to millions of Americans, has fallen as a share of gross domestic product over the past four decades, according to a new report from the AARP Public Policy Institute.\n\nHad payroll tax revenue kept up with GDP, the program could pay full benefits until 2059, according to the research \u2014 an additional 25 years beyond the latest projected depletion date of 2034 for the program's combined funds. The AARP Public Policy Institute provides policy research, analysis and development at AARP, a nonprofit, nonpartisan organization that represents Americans ages 50 and over.\n\n\"Social Security's finances have weakened not simply because America has grown older, but because the economy has changed, while the program's revenue system has not,\" Richard Johnson, vice president of financial security at the AARP Public Policy Institute, said during a Tuesday press briefing on the research.\n\n\"America's economy is larger and more productive than it was four decades ago, but Social Security is receiving support from a smaller share of that economy,\" Johnson said.\n\nSocial Security's trustees projected in June that the program's combined retirement and disability trust funds may be depleted in the third quarter of 2034. Unless Congress takes action, 83% of scheduled benefits will be payable at that time, according to the trustees' projections.\n\nThe trustees' report also included an earlier projected depletion date for Social Security's retirement trust fund \u2014 the fourth quarter of 2032, when 78% of benefits would be payable.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:24 AM IST", "pub_date_relative": "21m ago"}, {"title": "Evolus at Stifel 2026 Healthcare Conference: growth, pipeline in focus", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:23 AM IST", "pub_date_relative": "22m ago"}, {"title": "Jack Henry at KBW fintech ecosystem conference: growth picks up", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:23 AM IST", "pub_date_relative": "22m ago"}, {"title": "Apollo at 2026 Wolfe Research Wealth Symposium: private markets push", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:23 AM IST", "pub_date_relative": "22m ago"}, {"title": "Flowserve at Baird 2026 Global Industrial Conference: margin plan builds", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:22 AM IST", "pub_date_relative": "23m ago"}, {"title": "Upbound Group Inc stock hits 52-week high at 25.31 USD", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:19 AM IST", "pub_date_relative": "26m ago"}, {"title": "JPMorgan names top Mid & Small Cap stock pick", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:18 AM IST", "pub_date_relative": "27m ago"}, {"title": "Stocks climb as CoreWeave results ease AI spending concerns", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:18 AM IST", "pub_date_relative": "27m ago"}, {"title": "I\u2019m 63 and spending $95,000 on a roof deck for my $500,000 home. Am I being extravagant?", "full_content": "\u201cI have a net worth of $2.3 million and my only debt is a 15-year mortgage.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 01:11 AM IST", "pub_date_relative": "35m ago"}, {"title": "Stock Market Today: Nasdaq and S&P 500 surge, Dow rises 250 points as tech-stock rally picks up steam \u2014 live updates - MarketWatch", "full_content": "Stock Market Today: Nasdaq and S&P 500 surge, Dow rises 250 points as tech-stock rally picks up steam \u2014 live updates MarketWatch See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:59 AM IST", "pub_date_relative": "47m ago"}, {"title": "Analysis: Is Nvidia too big to fail? Its AI financing web raises the stakes", "full_content": "The swirl of sex-and-spying allegations around Nvidia CEO Jensen Huang is raising a worrying question: Could trouble at the chipmaker spread through the tightly connected financial network Nvidia has built to support the artificial intelligence boom?\n\nSerious problems with Nvidia could do far-reaching economic and financial damage. The company has made hundreds of billions of dollars in financial commitments to other firms to help the industry grow, earning it the nickname the \"central bank of AI.\" The Federal Reserve and other financial institutions are closely watching the AI buildout to monitor for the possibility that an unexpected event could destabilize the global financial system.\n\nEven back in July Fed officials were discussing the possibility of of a \"broad-based repricing of assets\" in the event of problems in the AI sector.\n\nA rerun of the 2007-2008 financial crisis isn't likely, according to analysts and current and former financial officials. Nvidia isn't \"too big to fail in a bank sense at all,\" said Sheila Bair, a former government regulator who ran the Federal Deposit Insurance Corp. Unlike a troubled bank, Nvidia isn't vulnerable to a sudden loss of confidence and would still produce a product customers want to buy even if something went wrong. And its massive equity gives it a cushion.\n\nBut regulators need to watch carefully for exposure by the banks and the wider financial system to Nvidia and other firms like it, Bair said.\n\n\"Nvidia going down would be a pretty seismic event,\" she said.\n\nInvestors still have high hopes for Nvidia, which reports earnings on Tuesday. Analysts expect its revenue to more than double in the current fiscal year, and then to roughly double again over the following two years, according to LSEG data.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 12:47 AM IST", "pub_date_relative": "58m ago"}, {"title": "Scoop: Inside Bessent's Situation Room confrontation with Lutnick over China chip security - Axios", "full_content": "Scoop: Inside Bessent's Situation Room confrontation with Lutnick over China chip security Axios Trump Officials Clashed Over Megaspeed, Firm at Heart of Nvidia Affair The New York Times Bessent confronts Lutnick over not labeling Nvidia customer a national security threat, sources say CNN US commerce department delays Megaspeed\u2019s inclusion on trade blacklist Financial Times Nvidia Intervened in US Probe of Megaspeed Chip Smuggling Bloomberg.com", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:46 AM IST", "pub_date_relative": "59m ago"}, {"title": "Four tech investing themes to consider beyond Nvidia", "full_content": "While Nvidia becomes a battleground, other areas of tech could power ahead. The case for cybersecurity, hyperscalers, robotics and quantum computing.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 12:46 AM IST", "pub_date_relative": "59m ago"}, {"title": "Prediction markets tied to clinical trials and drug approvals draw lawmakers' ire", "full_content": "Prediction market event contracts on both clinical drug trials and Food and Drug Administration regulatory approvals are drawing attention from two Democratic senators, according to a letter obtained first by CNBC.\n\nSen. Angela Alsobrooks , D-Md., and Sen. Ron Wyden , D-Ore., expressed concern over the related event contracts in a Wednesday letter to Department of Health and Human Services Secretary Robert F. Kennedy Jr . The senators asked what measures HHS has taken to mitigate any risks that may arise from the markets.\n\n\"Allowing individuals to bet on the success of these trials and drugs undermines the scientific process, creates perverse incentives for researchers, harms trial participants, and could lead to dangerous medical outcomes for untold numbers of Americans,\" the senators wrote.\n\nAlsobrooks and Wyden repeated concerns raised by some healthcare professionals that the markets could alter patient thinking when considering whether to participate in a trial and expressed concern over potential insider trading risks from researchers and regulators who may have access to nonpublic information.\n\nThe senators requested HHS provide all internal communication regarding staff participation in prediction markets tied to matters governed by the department.", "source": "CNBC Finance", "pub_date_str": "12 Nov 2026, 12:46 AM IST", "pub_date_relative": "59m ago"}, {"title": "Tech Gains Boost Stocks as Bonds Slide on Fed Bets: Markets Wrap - Bloomberg.com", "full_content": "Tech Gains Boost Stocks as Bonds Slide on Fed Bets: Markets Wrap Bloomberg.com US tech stocks surge as AI trade revives Financial Times Nasdaq Jumps After CoreWeave Re-Energizes AI Trade WSJ Rebounding AI stocks lift Wall Street The Seattle Times AI stocks bounce back \u2014 with one notable exception Axios", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "NASA takes an all-hands-on-deck approach in its return to the Moon - Ars Technica", "full_content": "NASA takes an all-hands-on-deck approach in its return to the Moon Ars Technica NASA Awards Moon Base Transportation, Technology, Science Projects NASA (.gov) SpaceX is competing for NASA\u2019s $10 billion in contracts to build a moon base Fortune NASA unveils $10 billion in moon base contracts, new lunar missions and the 'PROMISE' of a nuclear-powered rover Space Why Voyager Technologies Stock Went to the Moon on Monday Yahoo Finance", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Meta head of infrastructure will leave and be succeeded by former AWS cloud exec", "full_content": "Meta's long-time infrastructure leader will leave the company in the new year, setting the stage for a recently hired former Amazon Web Services executive to oversee its massive data center technical operations.\n\nSantosh Janardhan, Meta's head of infrastructure and co-head of engineering, revealed his upcoming departure on Wednesday in an internal memo obtained by CNBC. Janardhan, who has worked at Meta since 2009, said \"it's time to pass the baton\" to former AWS senior vice president David Brown, who joined Meta in July from AWS.\n\nThe executive move underscores Meta CEO Mark Zuckerberg's efforts to expand the company's data center operations under newer leaders at a time of increasing investor scrutiny on capital expenditure spending by the social media giant and its hyperscaler rivals.\n\nBrown will now formally lead Meta's infrastructure efforts and serve as chief technical officer of the Meta Compute initiative, which is spearheaded by the company's president and vice chairman Dina Powell McCormick and technical leader Daniel Gross. Zuckerberg is relying on these new executives to continue developing cutting-edge data centers and related infrastructure needed to support its AI ambitions.\n\nThe company said during its recent third-quarter earnings report that it expects full-year capex to fall in the range of $135 billion to $145 billion. Meta also logged negative free cash flow of $2.12 billion, which S&P Global Ratings noted as part of its decision in late October to revise Meta's credit rating from AA- stable to AA- negative.\n\nJanardhan said in the memo that he will help support Brown through the first quarter of 2027 as part of \"the transition.\"\n\n\"As we make the next set of choices about our priorities, this is the right time for Dave to take the lead in shaping that work,\" Janardhan said in the memo. \"Dave has spent his career building and operating dependable infrastructure for a wide range of demanding workloads.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "CoreWeave wants to sit with the credit-market grown-ups", "full_content": "The cloud computing group has benefited from a hitherto forgiving junk bond market", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago"}, {"title": "How Democrats could snarl Trump administration stakes in private sector companies", "full_content": "With Republicans in charge of the White House and Congress , President Donald Trump has embedded the federal government in private sector companies' affairs in unprecedented ways. That could change once Trump's Democratic adversaries take over the House and Senate following the blue wave midterm .\n\nDemocrats, planning to root out alleged corruption involving Trump, his family and their business associates, have signaled they will closely scrutinize companies that have curried the president's favor.\n\nTheir investigations may extend to Intel and the dozens of other companies that have clinched equity stakes with the government during Trump's second term. Democratic lawmakers in July asked law firm Skadden Arps for details about its involvement in the Intel deal.\n\nThe dynamic could affect how Trump approaches relationships with private sector companies, after spending two years involving the government in their affairs through stock agreements or, in the case of U.S. Steel, acquiring a \"golden share\" when the company was acquired by Nippon Steel .\n\nThe golden share , which allows a holder to outvote other shareholders, was negotiated as part of the June 2025 deal. The highly unusual arrangement gives Trump veto power over several key areas of the steelmaker's business, including those related to employee salaries, capital investment and even the company name.\n\nIn a unique twist, the company's amended charter specifies that after Trump leaves office, the veto power passes not to his successor, but to the Treasury and Commerce departments as representatives of the U.S. government.\n\nU.S. Steel CEO David Burritt said Wednesday that the government's representative on its board, Commerce Department official David Shapiro, typically abstains from voting but has access to company discussions.\n\n\"He gets to hear everything we're doing,\" Burritt told CNBC's Megan Cassella at the U.S.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 12:25 AM IST", "pub_date_relative": "1h ago"}, {"title": "Poundland set for more time to secure a rescue deal as emergency talks continue - BBC", "full_content": "Poundland set for more time to secure a rescue deal as emergency talks continue BBC Poundland owner releases \u00a310m to retailer hours before MP grilling Sky News Poundland unable to buy new stock as fears over collapse grow BBC Poundland directors to meet tonight to decide company's future, Sky News told Radio Royal Poundland to stave off collapse as US owner continues talks with buyers Financial Times", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nvidia is spending more than ever on Washington lobbying. It may not stop Congress from limiting China chip sales now.", "full_content": "\u2018There\u2019s no question that Congress is going to push for a complete ban on the sale of advanced semiconductors into China,\u2019 says a former U.S. ambassador to Beijing", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 12:18 AM IST", "pub_date_relative": "1h ago"}, {"title": "London Aluminum Market Faces Biggest Supply Squeeze in Decades", "full_content": "Aluminum buyers on the London Metal Exchange are facing the most severe squeeze in decades as inventories backing contracts plunge and much of the remaining stock comes under the control of just two traders.\n\nSpot prices for the crucial industrial metal spiked to trade $151 a ton above benchmark three-month futures on the exchange on Wednesday, hitting the highest level on record in data spanning more than 30 years. The spread was trading at a discount as recently as mid-October, but it has corkscrewed higher as stockpiles in LME warehouses have plunged to the lowest level since 1990.\n\nThe premiums for spot contracts, known as backwardation, are the steepest in the LME aluminum contract since the late 1980s, when Marc Rich Co squeezed the market, pushing the cash-three-month spread above $1,000 a ton. Since then, the LME has introduced rules that force traders with large positions to lend them out, effectively putting a cap on the scale of backwardations.\n\nBackwardations can cause major commercial challenges for holders of short positions, who must either buy back their contracts or deliver metal against them at expiry.\n\nA one-day spread known as Tom/next, which effectively represents the cost of deferring that obligation to deliver metal by a day, traded at the biggest premium since 2021, signaling an intensifying tussle over the dwindling volume of metal that\u2019s left in exchange warehouses.\n\nAnd increasingly, those who need the metal have few sellers to turn to. Exchange data shows that two entities held accumulated long positions in warrants and spot contracts equivalent to between 60% and 80% of readily available stocks in the LME\u2019s warehousing network as of Monday.\n\nThe acute shortages on the LME have whipsawed traders and manufacturers in the broader aluminum industry, as buyers await a surge in output from Indonesia that\u2019s set to push the global market into surplus in the coming years.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "US tech stocks surge as AI trade revives", "full_content": "Nasdaq erases last week\u2019s losses as CoreWeave results and prospect of higher Anthropic IPO valuation boost sentiment", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 12:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks making the biggest moves Wednesday: Corning, CoreWeave, Sandisk, Coherent & more", "full_content": "CoreWeave surged more than 20% Wednesday, as investors breathed a sigh of relief after the struggling neocloud reported better-than-expected third quarter results.\n\nA raft of stocks related to the artificial intelligence trade climbed alongside CoreWeave, with Sandisk , Micron and Lumentum jumping by double digits.\n\nNvidia also rose as the chipmaker tries to recover from steep back-to-back losses.\n\nFollow below as CNBC covers the biggest stock market moves of the day.\n\nAzenta , a life sciences company in Massachusetts, saw shares rise 22% after posting a quarterly earnings beat and guidance that surpassed estimates.\n\nAzenta in the past day Adjusted earnings of 28 cents per share on revenue of $167 million in the fourth quarter came in ahead of the FactSet consensus estimate for 11 cents a share and $160.2 million.\n\nAzenta shared revenue guidance of $648 million to $660 million for the fiscal year ending September 2027, topping the consensus estimate of $639.2 million.\n\nMicrosoft shares slid 2%, falling for a second day after Anthropic unveiled a suite of AI workplace tools that could directly rival core Microsoft Office products ahead of its IPO.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 12:02 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks To Watch Today: Adani Enterprises, Tata Power, Bajaj Finance, Aurobindo Pharma, Cupid & More", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Thursday.", "source": "NDTV Profit", "pub_date_str": "12 Nov 2026, 12:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Multibagger Cupid to be in focus on Thursday after Q2 net profit more than doubles to \u20b956 crore; raises FY27 guidance", "full_content": "A Ksheerasagar Published 11 Nov 2026, 11:56 PM IST Prefer Livemint on Google Multibagger Cupid shares are likely to be on investors' radar on Thursday, 12 November, as the company posted another solid quarter, led by consumer healthcare and FMCG business.\n\nThe company posted a 133% year-on-year jump in Q2 FY27 net profit to \u20b9 56.22 crore, compared with \u20b9 24.13 crore in the year-ago period. For the first half of FY27, net profit surged 156% YoY to \u20b9 100.37 crore from \u20b9 39.14 crore in H1 FY26.\n\nRevenue from operations grew 122% YoY to \u20b9 187.86 crore in Q2 FY27 and 137% to \u20b9 342.58 crore in H1 FY27. EBITDA for H1 FY27 stood at \u20b9 114.83 crore, registering 156% growth year-on-year, while Q2 EBITDA came in at \u20b9 54.77 crore, with a margin of 29%.\n\nCupid's strong performance was supported by growing contributions from its domestic consumer healthcare and FMCG business, alongside sustained demand in its international healthcare operations.\n\nThe domestic business contributed \u20b9 224.64 crore, accounting for 67% of H1 FY27 sales, compared with 41% in FY26. The Consumer Healthcare & FMCG segment alone contributed \u20b9 166.88 crore, representing 49% of sales, highlighting the increasing scale of its consumer portfolio.\n\nMeanwhile, the international business contributed \u20b9 112.73 crore, or 33% of H1 FY27 sales, supported by institutional demand through the PFSCM agreement and supplies under South Africa's 2025\u201330 national programme.\n\nPrice revisions implemented across its export portfolio also supported realisations during the first half of FY27. The company said it continues to focus on improving its product mix, sourcing efficiencies, and economies of scale as its consumer business expands across organised retail channels.\n\nCupid is expanding its domestic consumer business through organised retail partnerships. On November 4, 2026, the company entered into a long-term exclusive retail partnership with V2 Retail.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bouncing Wynn Shares might be primed for the 'wheel strategy'", "full_content": "In Barry Levinson's classic film Rain Man , Dustin Hoffman's character leans over to his brother in the middle of a blackjack hand with a simple piece of advice: bet two for good, one for bad.\n\nIn the case of Wynn Resorts shares, it might be time to bet two for good.\n\nSteve Wynn hasn't exactly been on a winning streak. No longer running his namesake company, he finally sold his 50 Central Park South penthouse after years on the market. WYNN shares haven't really been on a winning streak either. The stock is down more than 27% year-to-date as I write this. It was down more than 46% from the 2025 highs within the past couple of weeks. But it has bounced a bit since then, and perhaps the tables are turning.\n\nFundamentally, the business is demonstrating exceptional strength, particularly in the United States. Wynn's Las Vegas EBITDA margin has actually surpassed that of its Macau resorts. Recognizing this, management has accelerated capital spending in Las Vegas, where the company's profit has doubled from pre-pandemic levels. Meanwhile, the Asian market is also showing signs of life. Strategic property upgrades in Macau are successfully drawing lucrative premium mass play, which is directly supporting the company's ambitious expansion plans for the Enclave at Wynn Palace.\n\nFrom a valuation standpoint, WYNN is trading very close to its five-year historical averages across key metrics, including P/E, EV/EBITDA (currently around 9x to 10x), and Price-to-Book Value. Although this represents a slight premium compared to the broader gaming industry mean, Wynn's justifies a premium. (The Encore, the newer of the two adjacent Las Vegas properties, is one of my preferred hotels on \"The Strip\"). Technically, the stock has admittedly been in a downtrend, but this recent sharp bounce off the late October lows may indicate the run is over.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 11:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Who Was Alexander Darchiev? Russian Ambassador To US Dies Suddenly At 66", "full_content": "A veteran diplomat known for his criticism of the West, Darchiev previously served as Russia's ambassador to Canada from 2014 to 2021.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Oracle\u2019s stock is totally misunderstood and should be a \u2018go-to\u2019 AI play, says this analyst", "full_content": "A Bernstein analyst thinks two key investor concerns will soon subside.", "source": "MarketWatch Top Stories", "pub_date_str": "11 Nov 2026, 11:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Micron Is Rebounding. Goldman Prefers These Memory Stocks. - Barron's", "full_content": "Micron Is Rebounding. Goldman Prefers These Memory Stocks. Barron's Micron stock is a screaming buy at current valuation levels: Goldman Sachs Yahoo Finance Micron: HBM Repricing Strengthens The Buy Case After The Selloff (NASDAQ:MU) Seeking Alpha Prediction: This Could Be the Biggest AI Stock You\u2019re Not Talking About 24/7 Wall St. Why Micron Stock Popped Today The Motley Fool", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 11:41 PM IST", "pub_date_relative": "2h ago"}, {"title": "AI Spending Fears Concerns Its Investors. Thompson Reuter\u2019s Fix Is A $500 Million Buyback", "full_content": "Thomson Reuters will repurchase up to 7 million common shares, representing approximately 1.6% of its outstanding equity, under a $500 million programme running through November 2027.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "Post office time deposit scheme: How much interest can you earn on a \u20b91L investment across 1, 2, 3 and 5-year tenures?", "full_content": "Traditional and risk-averse investors often look for avenues to safely invest the surplus salary after meeting their expenses. Apart from bank fixed deposits, provident fund and savings accounts, such people can invest in small savings schemes offered by the government through post offices.\n\nOne such option is the post office time deposit (TD), commonly known as a post office fixed deposit. Just like bank FD , the scheme requires a one-time deposit for a set period, with the principal and accumulated interest paid at maturity.\n\nThe scheme offers four tenures of one, two, three and five years, allowing depositors to choose a period based on their financial needs. It can be a suitable option for those seeking assured returns without exposure to market fluctuations that can be witnessed in stocks and mutual funds.\n\nInterest rates under the post office TD scheme vary according to the investment period. As per official details, the annual rates are 6.9% for one year, 7% for two years, 7.1% for three years and 7.5% for five years. The five-year deposit offers the highest interest rate among these options.\n\nFurthermore, interest is calculated quarterly and credited annually. The eventual rate depends on the tenure that is chosen by the individual investor.\n\nLets' say you want to make an one-time investment of \u20b9 1 lakh. Before committing the money, it is important to assess the potential returns. Here are the estimated returns based on calculations from Paisabazaar post office TD calculator:\n\n\u2014 1-year deposit: At 6.9% interest, a one-time deposit of \u20b9 1 lakh will earn around \u20b9 7,081. The maturity amount is \u20b9 \u20b9 1,07,081.\n\n\u2014 2-year deposit: At 7%, the investment earns an interest of approximately \u20b9 14,888 until maturity, taking the final corpus to \u20b9 1,14,888.", "source": "LiveMint Money", "pub_date_str": "11 Nov 2026, 11:40 PM IST", "pub_date_relative": "2h ago"}, {"title": "General strikes to paralyze Spain as protestors clash with police ahead of election campaign", "full_content": "Spanish workers are expected to turn out in the millions on Wednesday for the country's first general strike in 14 years, as anger over soaring rents and living costs intensifies less than three weeks before a general election. Demonstrators clashed with police at a wholesale market in Madrid in the early hours of the strike, while roadblocks were also reported in the early hours of Wednesday. The 24-hour labor walkout is expected to disrupt public transport and flights, as well as bring some businesses, shops and factories to a standstill.\n\nHousing costs are a particular source of frustration among demonstrators. Rents have almost doubled over the past decade, squeezing household budgets as many workers feel homeownership is beyond their reach. The Bank of Spain estimates that the country faces a shortage of 750,000 homes, potentially rising to 1 million over the next two years. Spain's two largest trade unions, CCOO and UGT, which called the strike, are calling for greater government intervention in the housing market. Housing activists demand an end to tourist rentals and automatic lease renewals, while unions are seeking greater housing intervention and a new minimum-wage agreement.\n\nUGT Secretary-General Pepe \u00c1lvarez urged members to join the protests, saying \"there is no salary that can cope with the price of housing in this country,\" in comments translated by CNBC. He added that it was time for the government to listen to citizens' demands.\n\nThe strike follows weeks of social unrest. The eviction of an 87-year-old woman from her Madrid home, followed by her death around two weeks later, sparked national outrage. The left-wing government's attempts to pass measures to help tenants were blocked by the opposition.\n\nPrime Minister Pedro S\u00e1nchez's coalition responded by calling an election for Nov. 29, hoping to bolster his support and secure another four years in power.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 11:32 PM IST", "pub_date_relative": "2h ago"}, {"title": "Scene Box Office Collection Day 6: Suriya Starrer Maintains Strong Pace, Check Earnings", "full_content": "Suriya leads Scene, a Tamil action comedy that blends crime, conflict and chaos. The film also stars Pooja Hegde and Jyothika in key roles and continues to attract audiences in theatres.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Shubman Gill, Rishabh Pant Slip In ICC Rankings; Axar, Arshdeep And Gurnoor Make ODI Gains", "full_content": "Rahmat's fifth Test century helped him move past Shubman Gill, Aiden Markram and Kamindu Mendis, while Axar Patel and Arshdeep Singh also climbed in the ODI bowling list.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:21 PM IST", "pub_date_relative": "2h ago"}, {"title": "Stock Market Today: Nasdaq Jumps at Open After CoreWeave Earnings \u2014 Live Updates - WSJ", "full_content": "Stock Market Today: Nasdaq Jumps at Open After CoreWeave Earnings \u2014 Live Updates WSJ CoreWeave CEO Intrator tells CNBC he has canceled his planned share sale program CNBC CoreWeave turns to customer prepayments, shorter contracts to fund AI growth TechCrunch CoreWeave sparks AI cloud stock rally, lifts Nvidia as results ease bubble fears Reuters CoreWeave Finds a Workaround to Capital Constraints\u2014for Now WSJ", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 11:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "Q2 Results Highlights: Hindustan Copper Profit Rises 47%; Cupid's Revenue More Than Doubles; Tata Power Profit Up 49%", "full_content": "Tata Power, Garden Reach Shipbuilders & Engineers, Hindustan Copper, Triveni Turbine, Power Mech Projects were among the companies that announced September quarter earnings today.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:14 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bought Indo Thai Securities shares in 2026? Stock crashes 90% after two years of multibagger gains; what went wrong?", "full_content": "A Ksheerasagar Published 11 Nov 2026, 11:12 PM IST Prefer Livemint on Google Brokerage firm Indo Thai Securities , which once rewarded shareholders with handsome returns, is now struggling to regain momentum as its shares remain caught in a downward spiral in 2026, leaving investors who entered the stock earlier this year facing significant losses.\n\nAfter delivering multibagger returns for two consecutive years, the stock has plunged nearly 90% in 2026, falling to \u20b9 31.70, its lowest level in more than two years. The steep sell-off has also dragged the company's market capitalisation down to around \u20b9 420 crore.\n\nFor shareholders who were attracted by the stock's extraordinary past performance, those who entered in 2026 have been left with substantial losses.\n\nAccording to Trendlyne shareholding data, retail and other public shareholders collectively held a 45% stake in the company at the end of the September quarter, up from 39.5% in the corresponding period last year.\n\nPromoters continued to remain the largest shareholders, with a 54.8% stake in the company. Despite erasing much of its 2025 gains, the stock's five-year returns remain relatively strong at 188%. It finished the last annual year with a 132%, building on a massive 455% in 2024 .\n\nThe crash in the stock followed the company's failure to impress the Street with its financial performance, while the sharp rally in previous years may have also left the stock vulnerable to profit booking.\n\nThe company reported a consolidated net loss of \u20b9 35.58 crore in the second quarter of FY27, compared with a net profit of \u20b9 14.61 crore in the year-ago period.\n\nRevenue from operations declined 68.1% year-on-year to \u20b9 7.54 crore from \u20b9 23.62 crore. The company's EBITDA also turned negative at \u20b9 42.51 crore, against a positive EBITDA of \u20b9 20.17 crore in Q2 FY26.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:12 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nvidia shares rebound as Jensen Huang faces scrutiny ahead of earnings", "full_content": "Nvidia 's stock rose close to 5% on Wednesday, after falling for two days amid the scandal that has rocked the world's most valuable tech company.\n\nShares closed down 5.47% on Tuesday as more details were revealed about the impact of CEO Jensen Huang 's affair with an alleged Chinese spy . They fell 4.3% Monday.\n\nOn Tuesday, Nvidia announced it had hired law firm Wachtell, Lipton, Rosen & Katz to investigate whether company secrets or national security were compromised.\n\nHuang tried to project \"business as usual\" as he returned to the office on Monday, people familiar with the matter told CNBC. The CEO was also in the office on Tuesday, conducting meetings, ahead of the company's quarterly earnings on Nov. 17.\n\nInvestors are assessing whether the matter will have damaging spillover effects on the business.\n\nNvidia shares over the past five days. In a Tuesday note, Bank of America said it saw three scenarios with differing investment outcomes. In one scenario, the impact is contained with leadership continuity, and in another, prolonged uncertainty pressures valuation before earnings.\n\nIn the final scenario, the impact is escalated, with \"adverse findings, leadership disruption or tighter restrictions requiring earnings reassessment,\" BofA research analyst Vivek Arya said in the note.\n\nZacks' Chief Equity Strategist John Blank said the selloff reflected two concerns: that the U.S. might impose further restrictions in the wake of the affair and that further problems might arise as the news develops. \"What else has Jensen done?\" he said.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 11:09 PM IST", "pub_date_relative": "2h ago"}, {"title": "CoreWeave soars 26% as CEO reaffirms AI compute demand after strong Q3 report", "full_content": "CoreWeave shares jumped 26% Wednesday after the neocloud posted quarterly earnings that beat estimates and raised its guidance for the year.\n\n\"Demand for the infrastructure is and remains overwhelming.\" CEO Michael Intrator told CNBC's \"Squawk on the Street\" Wednesday.\n\n\"I think I said that we are 10x oversubscribed to the existing capacity that we have left in 2027, and we are multiples ... oversubscribed on the capacity we have out in 2028,\" he said.\n\nNeoclouds such as CoreWeave, Nebius and IREN have come under scrutiny this month as investors assessed the sustainability of the AI trade. CoreWeave, in particular, sparked alarm when spreads on its CDS widened past 11% , generally viewed as a distress level, as investors have to pay up for protection against default. With the price of its high-yield debt climbing, CoreWeave highlighted additional routes to finance its data center build-out with less alarming yields, quelling investor concerns for the time being.\n\n\"Our asset level debt has basically been rock solid through this entire thing,\" Intrator told CNBC. \"There is an enormous demand for that product. We're about to launch another asset-level debt in the next week or two that has already been rated high investment grade.\" Intrator added that he expects it \"will be underwritten in the market at 7% to 7.5% interest,\" which will bring down the average weighted cost of capital for the company.\n\nCoreWeave shares this year. The three months to Sept. 30 marked a \"breakout quarter\" for CoreWeave, Intrator said on the conference call, adding that growth was supported by multiple sources of funding, including financing backed by customer contracts and around $9 billion in customer prepayments and deposits.\n\nRevenue jumped 168% to $3.7 billion in the third quarter, the company said in a Tuesday statement .\n\nOther neclouds also rose on CoreWeave's strong results, with Nebius up 19%, Applied Digital up 9% and Iren up 8% in midday trading.", "source": "CNBC World Economy", "pub_date_str": "11 Nov 2026, 11:08 PM IST", "pub_date_relative": "2h ago"}, {"title": "American Airlines brings fresh food back to NY-Chicago first class for first time since 2019", "full_content": "American Airlines said Wednesday it's bringing small, fresh \"bites\" to first class on flights between its hubs in New York and Chicago, the carrier's latest effort to win over higher-spending customers .\n\nThe changes start this month. Customers will be able to pick between two options, which include prosciutto and melon or apple cinnamon chia pudding for breakfast and a Thai noodle salad or mezze plate for lunch and dinner, American said Wednesday.\n\nAmerican last offered fresh food for first class on these routes in 2019, a spokeswoman said. Currently, customers in first class on these flights get a smaller, packaged snack. Airlines largely have limited food options for shorter flights, even in first class.\n\nAmerican has fallen behind Delta Air Lines and United Airlines in profits and investments in premium options. The airline has been working to step up those premium offerings in recent years with new cabins, lounges and plans for seatback screens on its narrow-body fleets.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 11:04 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "Oil up 1% as Iran official says country will keep enriched nuclear material", "full_content": "NEW YORK, Nov 11 (Reuters) - Oil prices rose about 1% on Wednesday after the Iranian security chief said Iran would not allow any enriched nuclear material to leave the country, feeding supply worries that lifted prices off two-month lows hit the previous session.\n\nThe United States has said nuclear issues must be part of any initial negotiations with Iran aimed at ending their war.\n\nBrent futures settled $1.27, or 1.39%, higher at $92.76, while US West Texas Intermediate crude gained 49 cents, or 0.57%, to $86.53.\n\nIn the previous session, oil prices initially fell by more than $3 a barrel after US officials played down the need for further military strikes against Iran. Prices later pared some losses after an Iranian security official said no talks were taking place between the two sides.\n\n\"Oil prices are being supported by fading hopes of an imminent de-escalation,\" UBS analyst Giovanni Staunovo said.\n\nWhile OPEC crude oil production jumped in October, led by a sharp increase in output from Saudi Arabia, there is little sign of easing disruption in the Strait of Hormuz. Data from the Washington Institute for Near East Policy showed that 37 ships were attacked in October, the highest monthly total since the start of the war in February.\n\n\"This demonstrates that operational risks have not disappeared simply because diplomatic signals have turned more positive,\" said Simon-Peter Massabni, head of business development at XS.com. \"More importantly, even if a political agreement is reached, shipping activity is unlikely to return to normal immediately.\"\n\nBrent and WTI prices have fallen about 21% and 17%, respectively, since the start of the month on hopes of an end to the war.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 01:39 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Derivatives", "Alternative Investments"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "United Airlines moves to block AI agents from its platform over security concerns", "full_content": "United Airlines said on Wednesday it would restrict AI bots' access to its \u2060digital platforms, citing data security, in the latest pushback \u200bagainst AI agents \u200bincreasingly capable \u200bof planning and booking trips for travelers.\n\nCompanies across industries \u2060are \u200ctaking divergent approaches to the \u2060rapid rise of AI agents capable of carrying out tasks on behalf of users \u2014 some restricting access \u200cto protect their platforms, others embracing partnerships.\n\nAmazon has blocked Meta's AI \u200bagent Muse, while Walmart has partnered with it.\n\nMeanwhile, online travel firms such as Expedia and Booking are working \u2060with ChatGPT-parent OpenAI.\n\nUnited warned that sharing \u200caccount credentials with third-party AI \u200cassistants could expose sensitive information and lead to unintended purchases, account modifications or the unauthorized use \u2060of frequent-flyer miles.\n\nIt also said automated \u2060AI tools performing actions like flight \u2060check-in \u2014 which requires human acknowledgment for prohibited items such as explosives \u2014 could \u200bcreate regulatory risks.\n\nThe \u200ccarrier said it would take steps to restrict access both directly through its digital platforms and indirectly through travel agencies and aggregators, including \u200bupdates to its booking, ticketing \u200cand distribution policies.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:32 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Canada\u2019s ambassador warns Trump tariffs are driving up costs, threatening U.S. investment", "full_content": "Canada's ambassador to the U.S. warned Wednesday that President Donald Trump's tariffs are driving up investment costs and discouraging business expansion, as new Federal Reserve research points to more price hikes for American consumers next year.\n\n\"Uncertainty increases your cost of capital,\" Ambassador Mark Wiseman said at the B20 summit , a gathering of global business leaders in Washington hosted by the U.S. Chamber of Commerce.\n\n\"If you're going to build a new plant, add a new ship, spend money on R&D, the more certainty you have, the more likely you're going to do that,\" said Wiseman, a former BlackRock executive who became Canada's ambassador in February.\n\nHis warning comes as Washington and Ottawa struggle to resolve a tariff quarrel affecting one of the U.S.'s largest trading relationships. The two countries exchanged roughly $570 billion in goods during the first nine months of 2026, according to U.S. Census Bureau data . That's an increase from the same period in 2025, the first year of Trump's second term, but lower than the comparable nine months during the previous three years, when Joe Biden was president.\n\nU.S. customs duties calculated on imports from Canada reached $10 billion in 2025, compared with $400 million in 2024, according to the Congressional Research Service .\n\nAn October study by New York Fed researchers found that nearly 90% of tariff costs were passed on to U.S. importers, with about a quarter of tariff increases eventually reaching consumer goods prices and further price pressures expected in 2027.\n\nThe findings come as Labor Department data showed consumer prices rose a higher-than-expected 0.4% in October, adding to inflation concerns after Republicans' sweeping midterm losses .\n\nTrump has defended his tariffs as necessary to protect U.S. manufacturers and workers, accusing Canada of discriminatory trade practices that disadvantage U.S. exporters.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:32 AM IST", "pub_date_relative": "13m ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Social Security could pay full benefits until 2059 if taxable payroll kept pace with GDP: AARP report", "full_content": "Social Security 's taxable payroll, which provides most of the revenue for the program that pays monthly benefits to millions of Americans, has fallen as a share of gross domestic product over the past four decades, according to a new report from the AARP Public Policy Institute.\n\nHad payroll tax revenue kept up with GDP, the program could pay full benefits until 2059, according to the research \u2014 an additional 25 years beyond the latest projected depletion date of 2034 for the program's combined funds. The AARP Public Policy Institute provides policy research, analysis and development at AARP, a nonprofit, nonpartisan organization that represents Americans ages 50 and over.\n\n\"Social Security's finances have weakened not simply because America has grown older, but because the economy has changed, while the program's revenue system has not,\" Richard Johnson, vice president of financial security at the AARP Public Policy Institute, said during a Tuesday press briefing on the research.\n\n\"America's economy is larger and more productive than it was four decades ago, but Social Security is receiving support from a smaller share of that economy,\" Johnson said.\n\nSocial Security's trustees projected in June that the program's combined retirement and disability trust funds may be depleted in the third quarter of 2034. Unless Congress takes action, 83% of scheduled benefits will be payable at that time, according to the trustees' projections.\n\nThe trustees' report also included an earlier projected depletion date for Social Security's retirement trust fund \u2014 the fourth quarter of 2032, when 78% of benefits would be payable.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 01:24 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "JPMorgan names top Mid & Small Cap stock pick", "full_content": "", "source": "Investing.com News", "pub_date_str": "12 Nov 2026, 01:18 AM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market Today: Nasdaq and S&P 500 surge, Dow rises 250 points as tech-stock rally picks up steam \u2014 live updates - MarketWatch", "full_content": "Stock Market Today: Nasdaq and S&P 500 surge, Dow rises 250 points as tech-stock rally picks up steam \u2014 live updates MarketWatch See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:59 AM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Analysis: Is Nvidia too big to fail? Its AI financing web raises the stakes", "full_content": "The swirl of sex-and-spying allegations around Nvidia CEO Jensen Huang is raising a worrying question: Could trouble at the chipmaker spread through the tightly connected financial network Nvidia has built to support the artificial intelligence boom?\n\nSerious problems with Nvidia could do far-reaching economic and financial damage. The company has made hundreds of billions of dollars in financial commitments to other firms to help the industry grow, earning it the nickname the \"central bank of AI.\" The Federal Reserve and other financial institutions are closely watching the AI buildout to monitor for the possibility that an unexpected event could destabilize the global financial system.\n\nEven back in July Fed officials were discussing the possibility of of a \"broad-based repricing of assets\" in the event of problems in the AI sector.\n\nA rerun of the 2007-2008 financial crisis isn't likely, according to analysts and current and former financial officials. Nvidia isn't \"too big to fail in a bank sense at all,\" said Sheila Bair, a former government regulator who ran the Federal Deposit Insurance Corp. Unlike a troubled bank, Nvidia isn't vulnerable to a sudden loss of confidence and would still produce a product customers want to buy even if something went wrong. And its massive equity gives it a cushion.\n\nBut regulators need to watch carefully for exposure by the banks and the wider financial system to Nvidia and other firms like it, Bair said.\n\n\"Nvidia going down would be a pretty seismic event,\" she said.\n\nInvestors still have high hopes for Nvidia, which reports earnings on Tuesday. Analysts expect its revenue to more than double in the current fiscal year, and then to roughly double again over the following two years, according to LSEG data.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 12:47 AM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Prediction markets tied to clinical trials and drug approvals draw lawmakers' ire", "full_content": "Prediction market event contracts on both clinical drug trials and Food and Drug Administration regulatory approvals are drawing attention from two Democratic senators, according to a letter obtained first by CNBC.\n\nSen. Angela Alsobrooks , D-Md., and Sen. Ron Wyden , D-Ore., expressed concern over the related event contracts in a Wednesday letter to Department of Health and Human Services Secretary Robert F. Kennedy Jr . The senators asked what measures HHS has taken to mitigate any risks that may arise from the markets.\n\n\"Allowing individuals to bet on the success of these trials and drugs undermines the scientific process, creates perverse incentives for researchers, harms trial participants, and could lead to dangerous medical outcomes for untold numbers of Americans,\" the senators wrote.\n\nAlsobrooks and Wyden repeated concerns raised by some healthcare professionals that the markets could alter patient thinking when considering whether to participate in a trial and expressed concern over potential insider trading risks from researchers and regulators who may have access to nonpublic information.\n\nThe senators requested HHS provide all internal communication regarding staff participation in prediction markets tied to matters governed by the department.", "source": "CNBC Finance", "pub_date_str": "12 Nov 2026, 12:46 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Tech Gains Boost Stocks as Bonds Slide on Fed Bets: Markets Wrap - Bloomberg.com", "full_content": "Tech Gains Boost Stocks as Bonds Slide on Fed Bets: Markets Wrap Bloomberg.com US tech stocks surge as AI trade revives Financial Times Nasdaq Jumps After CoreWeave Re-Energizes AI Trade WSJ Rebounding AI stocks lift Wall Street The Seattle Times AI stocks bounce back \u2014 with one notable exception Axios", "source": "Google News Business", "pub_date_str": "12 Nov 2026, 12:40 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Meta head of infrastructure will leave and be succeeded by former AWS cloud exec", "full_content": "Meta's long-time infrastructure leader will leave the company in the new year, setting the stage for a recently hired former Amazon Web Services executive to oversee its massive data center technical operations.\n\nSantosh Janardhan, Meta's head of infrastructure and co-head of engineering, revealed his upcoming departure on Wednesday in an internal memo obtained by CNBC. Janardhan, who has worked at Meta since 2009, said \"it's time to pass the baton\" to former AWS senior vice president David Brown, who joined Meta in July from AWS.\n\nThe executive move underscores Meta CEO Mark Zuckerberg's efforts to expand the company's data center operations under newer leaders at a time of increasing investor scrutiny on capital expenditure spending by the social media giant and its hyperscaler rivals.\n\nBrown will now formally lead Meta's infrastructure efforts and serve as chief technical officer of the Meta Compute initiative, which is spearheaded by the company's president and vice chairman Dina Powell McCormick and technical leader Daniel Gross. Zuckerberg is relying on these new executives to continue developing cutting-edge data centers and related infrastructure needed to support its AI ambitions.\n\nThe company said during its recent third-quarter earnings report that it expects full-year capex to fall in the range of $135 billion to $145 billion. Meta also logged negative free cash flow of $2.12 billion, which S&P Global Ratings noted as part of its decision in late October to revise Meta's credit rating from AA- stable to AA- negative.\n\nJanardhan said in the memo that he will help support Brown through the first quarter of 2027 as part of \"the transition.\"\n\n\"As we make the next set of choices about our priorities, this is the right time for Dave to take the lead in shaping that work,\" Janardhan said in the memo. \"Dave has spent his career building and operating dependable infrastructure for a wide range of demanding workloads.", "source": "CNBC World Economy", "pub_date_str": "12 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "CoreWeave wants to sit with the credit-market grown-ups", "full_content": "The cloud computing group has benefited from a hitherto forgiving junk bond market", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 12:27 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "How Democrats could snarl Trump administration stakes in private sector companies", "full_content": "With Republicans in charge of the White House and Congress , President Donald Trump has embedded the federal government in private sector companies' affairs in unprecedented ways. That could change once Trump's Democratic adversaries take over the House and Senate following the blue wave midterm .\n\nDemocrats, planning to root out alleged corruption involving Trump, his family and their business associates, have signaled they will closely scrutinize companies that have curried the president's favor.\n\nTheir investigations may extend to Intel and the dozens of other companies that have clinched equity stakes with the government during Trump's second term. Democratic lawmakers in July asked law firm Skadden Arps for details about its involvement in the Intel deal.\n\nThe dynamic could affect how Trump approaches relationships with private sector companies, after spending two years involving the government in their affairs through stock agreements or, in the case of U.S. Steel, acquiring a \"golden share\" when the company was acquired by Nippon Steel .\n\nThe golden share , which allows a holder to outvote other shareholders, was negotiated as part of the June 2025 deal. The highly unusual arrangement gives Trump veto power over several key areas of the steelmaker's business, including those related to employee salaries, capital investment and even the company name.\n\nIn a unique twist, the company's amended charter specifies that after Trump leaves office, the veto power passes not to his successor, but to the Treasury and Commerce departments as representatives of the U.S. government.\n\nU.S. Steel CEO David Burritt said Wednesday that the government's representative on its board, Commerce Department official David Shapiro, typically abstains from voting but has access to company discussions.\n\n\"He gets to hear everything we're doing,\" Burritt told CNBC's Megan Cassella at the U.S.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 12:25 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nvidia is spending more than ever on Washington lobbying. It may not stop Congress from limiting China chip sales now.", "full_content": "\u2018There\u2019s no question that Congress is going to push for a complete ban on the sale of advanced semiconductors into China,\u2019 says a former U.S. ambassador to Beijing", "source": "MarketWatch Top Stories", "pub_date_str": "12 Nov 2026, 12:18 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "London Aluminum Market Faces Biggest Supply Squeeze in Decades", "full_content": "Aluminum buyers on the London Metal Exchange are facing the most severe squeeze in decades as inventories backing contracts plunge and much of the remaining stock comes under the control of just two traders.\n\nSpot prices for the crucial industrial metal spiked to trade $151 a ton above benchmark three-month futures on the exchange on Wednesday, hitting the highest level on record in data spanning more than 30 years. The spread was trading at a discount as recently as mid-October, but it has corkscrewed higher as stockpiles in LME warehouses have plunged to the lowest level since 1990.\n\nThe premiums for spot contracts, known as backwardation, are the steepest in the LME aluminum contract since the late 1980s, when Marc Rich Co squeezed the market, pushing the cash-three-month spread above $1,000 a ton. Since then, the LME has introduced rules that force traders with large positions to lend them out, effectively putting a cap on the scale of backwardations.\n\nBackwardations can cause major commercial challenges for holders of short positions, who must either buy back their contracts or deliver metal against them at expiry.\n\nA one-day spread known as Tom/next, which effectively represents the cost of deferring that obligation to deliver metal by a day, traded at the biggest premium since 2021, signaling an intensifying tussle over the dwindling volume of metal that\u2019s left in exchange warehouses.\n\nAnd increasingly, those who need the metal have few sellers to turn to. Exchange data shows that two entities held accumulated long positions in warrants and spot contracts equivalent to between 60% and 80% of readily available stocks in the LME\u2019s warehousing network as of Monday.\n\nThe acute shortages on the LME have whipsawed traders and manufacturers in the broader aluminum industry, as buyers await a surge in output from Indonesia that\u2019s set to push the global market into surplus in the coming years.", "source": "LiveMint Markets", "pub_date_str": "12 Nov 2026, 12:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "US tech stocks surge as AI trade revives", "full_content": "Nasdaq erases last week\u2019s losses as CoreWeave results and prospect of higher Anthropic IPO valuation boost sentiment", "source": "FT Markets", "pub_date_str": "12 Nov 2026, 12:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks making the biggest moves Wednesday: Corning, CoreWeave, Sandisk, Coherent & more", "full_content": "CoreWeave surged more than 20% Wednesday, as investors breathed a sigh of relief after the struggling neocloud reported better-than-expected third quarter results.\n\nA raft of stocks related to the artificial intelligence trade climbed alongside CoreWeave, with Sandisk , Micron and Lumentum jumping by double digits.\n\nNvidia also rose as the chipmaker tries to recover from steep back-to-back losses.\n\nFollow below as CNBC covers the biggest stock market moves of the day.\n\nAzenta , a life sciences company in Massachusetts, saw shares rise 22% after posting a quarterly earnings beat and guidance that surpassed estimates.\n\nAzenta in the past day Adjusted earnings of 28 cents per share on revenue of $167 million in the fourth quarter came in ahead of the FactSet consensus estimate for 11 cents a share and $160.2 million.\n\nAzenta shared revenue guidance of $648 million to $660 million for the fiscal year ending September 2027, topping the consensus estimate of $639.2 million.\n\nMicrosoft shares slid 2%, falling for a second day after Anthropic unveiled a suite of AI workplace tools that could directly rival core Microsoft Office products ahead of its IPO.", "source": "CNBC Top News", "pub_date_str": "12 Nov 2026, 12:02 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Multibagger Cupid to be in focus on Thursday after Q2 net profit more than doubles to \u20b956 crore; raises FY27 guidance", "full_content": "A Ksheerasagar Published 11 Nov 2026, 11:56 PM IST Prefer Livemint on Google Multibagger Cupid shares are likely to be on investors' radar on Thursday, 12 November, as the company posted another solid quarter, led by consumer healthcare and FMCG business.\n\nThe company posted a 133% year-on-year jump in Q2 FY27 net profit to \u20b9 56.22 crore, compared with \u20b9 24.13 crore in the year-ago period. For the first half of FY27, net profit surged 156% YoY to \u20b9 100.37 crore from \u20b9 39.14 crore in H1 FY26.\n\nRevenue from operations grew 122% YoY to \u20b9 187.86 crore in Q2 FY27 and 137% to \u20b9 342.58 crore in H1 FY27. EBITDA for H1 FY27 stood at \u20b9 114.83 crore, registering 156% growth year-on-year, while Q2 EBITDA came in at \u20b9 54.77 crore, with a margin of 29%.\n\nCupid's strong performance was supported by growing contributions from its domestic consumer healthcare and FMCG business, alongside sustained demand in its international healthcare operations.\n\nThe domestic business contributed \u20b9 224.64 crore, accounting for 67% of H1 FY27 sales, compared with 41% in FY26. The Consumer Healthcare & FMCG segment alone contributed \u20b9 166.88 crore, representing 49% of sales, highlighting the increasing scale of its consumer portfolio.\n\nMeanwhile, the international business contributed \u20b9 112.73 crore, or 33% of H1 FY27 sales, supported by institutional demand through the PFSCM agreement and supplies under South Africa's 2025\u201330 national programme.\n\nPrice revisions implemented across its export portfolio also supported realisations during the first half of FY27. The company said it continues to focus on improving its product mix, sourcing efficiencies, and economies of scale as its consumer business expands across organised retail channels.\n\nCupid is expanding its domestic consumer business through organised retail partnerships. On November 4, 2026, the company entered into a long-term exclusive retail partnership with V2 Retail.", "source": "LiveMint Markets", "pub_date_str": "11 Nov 2026, 11:56 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bouncing Wynn Shares might be primed for the 'wheel strategy'", "full_content": "In Barry Levinson's classic film Rain Man , Dustin Hoffman's character leans over to his brother in the middle of a blackjack hand with a simple piece of advice: bet two for good, one for bad.\n\nIn the case of Wynn Resorts shares, it might be time to bet two for good.\n\nSteve Wynn hasn't exactly been on a winning streak. No longer running his namesake company, he finally sold his 50 Central Park South penthouse after years on the market. WYNN shares haven't really been on a winning streak either. The stock is down more than 27% year-to-date as I write this. It was down more than 46% from the 2025 highs within the past couple of weeks. But it has bounced a bit since then, and perhaps the tables are turning.\n\nFundamentally, the business is demonstrating exceptional strength, particularly in the United States. Wynn's Las Vegas EBITDA margin has actually surpassed that of its Macau resorts. Recognizing this, management has accelerated capital spending in Las Vegas, where the company's profit has doubled from pre-pandemic levels. Meanwhile, the Asian market is also showing signs of life. Strategic property upgrades in Macau are successfully drawing lucrative premium mass play, which is directly supporting the company's ambitious expansion plans for the Enclave at Wynn Palace.\n\nFrom a valuation standpoint, WYNN is trading very close to its five-year historical averages across key metrics, including P/E, EV/EBITDA (currently around 9x to 10x), and Price-to-Book Value. Although this represents a slight premium compared to the broader gaming industry mean, Wynn's justifies a premium. (The Encore, the newer of the two adjacent Las Vegas properties, is one of my preferred hotels on \"The Strip\"). Technically, the stock has admittedly been in a downtrend, but this recent sharp bounce off the late October lows may indicate the run is over.", "source": "CNBC Top News", "pub_date_str": "11 Nov 2026, 11:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Micron Is Rebounding. Goldman Prefers These Memory Stocks. - Barron's", "full_content": "Micron Is Rebounding. Goldman Prefers These Memory Stocks. Barron's Micron stock is a screaming buy at current valuation levels: Goldman Sachs Yahoo Finance Micron: HBM Repricing Strengthens The Buy Case After The Selloff (NASDAQ:MU) Seeking Alpha Prediction: This Could Be the Biggest AI Stock You\u2019re Not Talking About 24/7 Wall St. Why Micron Stock Popped Today The Motley Fool", "source": "Google News Business", "pub_date_str": "11 Nov 2026, 11:41 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "AI Spending Fears Concerns Its Investors. Thompson Reuter\u2019s Fix Is A $500 Million Buyback", "full_content": "Thomson Reuters will repurchase up to 7 million common shares, representing approximately 1.6% of its outstanding equity, under a $500 million programme running through November 2027.", "source": "NDTV Profit", "pub_date_str": "11 Nov 2026, 11:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Post office time deposit scheme: How much interest can you earn on a \u20b91L investment across 1, 2, 3 and 5-year tenures?", "full_content": "Traditional and risk-averse investors often look for avenues to safely invest the surplus salary after meeting their expenses. Apart from bank fixed deposits
