2:29 PM IST", "pub_date_relative": "20m ago"}, {"title": "Isaias weakens to Category 1 hurricane after Florida landfall, NHC says", "full_content": "Hurricane Isaias weakened to a Category 1 storm on Friday, rapidly losing wind speed after hitting the Florida coast, the US National Hurricane Center said while warning of storm surges and snapped power lines as it moves through the Deep South.\n\nThe hurricane, crossing the western Florida Panhandle after making landfall near Destin as a Category 2 storm, was about 65 miles (105 km) west-northwest of Panama City, Florida, packing maximum sustained winds of 90 mph (150 kph), the NHC said in an advisory.\n\nThe center warned of possible storm surges, urban and river flooding and flash floods across the region, with considerable impacts likely across much of southern Alabama and the Florida Panhandle into southwest Georgia.\n\nIsaias, the first hurricane of the 2026 Atlantic season, is expected to continue weakening but produce gusty winds well inland through Saturday even after it becomes post-tropical, the NHC said.\n\nAlabama's emergency management agency said the hurricane has downed trees and power lines, making travel hazardous in Houston County, which is under a flash flood warning.\n\n\"Due to the impacts of Hurricane Isaias, all Houston County roads are closed until further notice,\" it posted on X. \"These road closures will remain in effect until conditions are deemed safe for travel.\"\n\nIsaias is expected to cross Alabama and go into the Tennessee Valley over the weekend, the NHC said.\n\nPresident Donald Trump, asked about hurricane preparations, told reporters outside the White House, \"We're watching it very closely, the hurricane,\" adding that it was \"under control.\"", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 12:16 PM IST", "pub_date_relative": "33m ago"}, {"title": "The Top Four AI Bets: Aswath Damodaran Cuts Through The Silicon Valley Valuation Fog", "full_content": "Damodaran sets moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 12:01 PM IST", "pub_date_relative": "48m ago"}, {"title": "Banking Stock Swoon in Europe Is a Sign of Caution, Not Panic", "full_content": "A selloff in banking stocks is rarely comforting. But after three years of strong gains, the latest pullback in European lenders looks more like a reset than a crash.\n\nThe Euro Stoxx banks index has dropped by about 8% over two weeks, sliding to the lowest level since June and entering a technical correction on Thursday. Societe Generale SA, Credit Agricole SA and Deutsche Bank AG have all tumbled more than 15% from their recent highs.\n\nSoaring bond yields have been at the heart of the sudden drawdown, adding to risks for borrowers and eroding the value of sovereign assets held by banks. Much of the drama centers on France, where political upheaval and fears over its finances have pushed the premium on the nation\u2019s debt over Germany\u2019s to the widest in more than a decade.\n\n\u201cBond yields appear to have crossed a pain threshold that has prompted investors to reassess fundamentals,\u201d said Roberto Scholtes, head of strategy at Singular Bank. \u201cIf interest rates rise as much as currently embedded in yield curves, non-performing loans could increase significantly, while loan growth and corporate banking activity would slow.\u201d\n\nOn the other hand, the retreat in banking stocks follows a breakneck rally that saw their shares triple since 2022. Bulls can point to the bigger picture: bank balance sheets are more robust than in the European sovereign bond crisis more than a decade ago. The spike in yields is unlikely to bleed through to fundamentals unless they go higher and stay elevated.\n\nRather than a turning point, it looks more like some of the heat has gone out of a widely popular trade.\n\n\u201cThere is also a positioning factor, as banks have been a consensus long and some names had become quite crowded,\u201d Scholtes noted.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 11:57 AM IST", "pub_date_relative": "52m ago"}, {"title": "UAW leader reviled by Trump declares victory in reelection - The Washington Post", "full_content": "UAW leader reviled by Trump declares victory in reelection The Washington Post Shawn Fain Claims Victory in UAW Election Rout WSJ Shawn Fain reelected, will be UAW president for 4 more years Detroit Free Press UAW President Shawn Fain declares victory in race for second term Reuters Shawn Fain claims reelection in apparent sweep for his UAW slate The Detroit News", "source": "Google News Business", "pub_date_str": "10 Oct 2026, 11:55 AM IST", "pub_date_relative": "54m ago"}, {"title": "Jio Platforms IPO: What does listing of Reliance Industries' company mean for Airtel, Vodafone, Indus Towers shares?", "full_content": "Jio Platforms IPO : The listing of Jio Platforms is likely introduce transformative structural shifts for both the broader Indian telecom sector and its parent company, Reliance Industries (RIL).\n\nAmid growing anticipation around Jio Platforms' initial public offering (IPO), a fresh update on the issue has emerged. The Mukesh Ambani-led telecom company is likely to price its shares in the range of \u20b9 1,065 to \u20b9 1,119 apiece, Bloomberg reported, citing sources. However, Jio Platforms has not yet officially disclosed key details of the IPO, including the price band, valuation and timeline.\n\nJio\u2019s proposed valuation could reset the way investors assess Bharti Airtel, which has been a major beneficiary of improving average revenue per user (ARPU), tariff increases and industry consolidation.\n\nSeema Srivastava, Senior Research Analyst at SMC Global Securities, said Jio\u2019s standalone listing would establish a transparent valuation benchmark for the telecom sector and could trigger a re-rating of listed peers, including Airtel.\n\nAt a reported valuation of around \u20b9 11 lakh crore, Jio Platforms would be valued slightly above Airtel\u2019s market capitalisation of approximately \u20b9 10.87 lakh crore. Garg noted that Jio\u2019s reported valuation of around 37 times FY26 profit compares with about 63 times trailing earnings for Airtel.\n\nMeanwhile, Gaurav Garg, Head of Research at Lemonn, said Jio\u2019s listing could create a near-term overhang for the stock as investors compare the valuations of the two telecom giants.\n\nGarg further explained that this valuation gap could influence institutional investors looking for direct exposure to Jio. Some investors may rebalance their portfolios ahead of the IPO, potentially creating short-term volatility in Airtel shares.\n\nBeyond valuation, the Jio IPO could have a more lasting impact on the sector if it improves the prospects of another round of mobile tariff increases.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 11:50 AM IST", "pub_date_relative": "59m ago"}, {"title": "EOS Climbs 17% In a Green Day", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bumble director Sissie Hsiao sells $6,956 in class A shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 11:46 AM IST", "pub_date_relative": "1h ago"}, {"title": "Can stock market losses offset mutual fund gains? What is tax-loss harvesting strategy, how it works", "full_content": "Investors may make profits on mutual fund investments while holding stocks that are trading at a loss. In such cases, selling loss-making stocks could help reduce their tax liability by offsetting capital losses against eligible capital gains.\n\nShort-term capital losses can be set off against both short-term and long-term capital gains, whereas long-term capital losses can be set off only against long-term gains. These rules apply subject to the relevant income-tax provisions.\n\nYes, offsetting capital losses from the sale of listed shares is allowed but only against equity-oriented mutual funds .\n\nA mutual fund scheme is classified as an equity mutual fund when it invests more than 60% of its total assets in the equity shares of different companies. The balance amount can be invested in money market instruments or debt securities as per the investment objective of the scheme.\n\nTax-loss harvesting is a common strategy in which investors sell investments at a loss to offset eligible capital gains and reduce their tax liability for the financial year. The losses can be used to lower the net taxable capital gains.\n\nSuppose you have earned \u20b9 1,00,000 in short-term capital gains (STCG) by selling equity mutual fund units during a certain financial year. At a tax rate of 20%, you would owe \u20b9 20,000 in tax, excluding applicable surcharge and cess.\n\nNow, suppose you also hold stocks with unrealised short-term capital losses of \u20b9 80,000. If you sell these investments and realise the losses, you can offset them against your eligible capital gains, bringing your net STCG down to \u20b9 20,000.\n\nAt a 20% tax rate, the amount you would owe on the remaining capital gains would be \u20b9 4,000, excluding applicable surcharge and cess. This would result in a tax saving of \u20b9 16,000. However, this should be done only if you are certain that the loss-making securities do not have any scope of recovery in the near future.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 11:43 AM IST", "pub_date_relative": "1h ago"}, {"title": "Vivek Jain, Analog Devices officer, sells $2.16m in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 11:31 AM IST", "pub_date_relative": "1h ago"}, {"title": "Why is the Chinese stock market missing the AI rally", "full_content": "", "source": "Investing.co Paper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 11:26 AM IST", "pub_date_relative": "1h ago"}, {"title": "Who Is Katie Zacharia? The New White House Press Secretary Appointed By Trump", "full_content": "As White House press secretary, Zacharia will serve as a key public-facing representative of the administration, explaining presidential decisions, communicating policy announcements and responding to questions from journalists.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 11:16 AM IST", "pub_date_relative": "1h ago"}, {"title": "Home loan rates October 2026: Compare rates starting from 7% across 12 public sector banks", "full_content": "Are you looking for a home loan? Have you decided which lending institution you will take out your home loan with? Do you have a well-planned strategy not only to borrow but also to ensure you repay the home loan seamlessly?\n\nThese are some core questions that an aspiring home loan borrower must answer before proceeding with their home loan application, as proper planning is essential to ensure borrowing remains a pleasant experience.\n\nFurthermore, home loan interest rates start from 7% at some prominent public sector banks in October 2026, although the rate applicable to a borrower can vary based on the lending institution, borrower profile, credit score , past borrowing history, loan amount and other fundamental factors.\n\nWith this in mind, let us look at the home loan rates offered by prominent public sector banks in the country for October 2026. The rates provided below cover three loan slabs: up to \u20b9 30 lakh, above \u20b9 30 lakh and up to \u20b9 75 lakh, and above \u20b9 75 lakh.\n\nIt is also important to note that Bank of Maharashtra and Central Bank of India offer starting rates of 7% across all three loan slabs. Bank of Maharashtra's rate ranges from 7% to 9.90%, while Central Bank of India's rate ranges from 7% to 9.15%. The complete list of all banks is discussed in detail below.\n\nNote: *Under CRG-Prime, CRG-1 and CRG-2, Canara Bank offers an additional 5 basis points concession for takeover/ready-to-move home loan proposals and for salaried employees maintaining a salary account with the bank.\n\n**UCO Bank offers an additional 0.05% concession for women borrowers and 0.10% for takeover loans.\n\n***Union Bank of India offers an additional 0.05% interest rate concession to borrowers opting for an insurance policy.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 11:13 AM IST", "pub_date_relative": "1h ago"}, {"title": "CJP Leader Abhijeet Dipke Detained By Delhi Police Inside Airplane In New Delhi | Watch Video", "full_content": "CJP founder Abhijeet Dipke shared a live video showing Delhi Police personnel inside his aircraft, allegedly attempting to arrest him and other CJP leaders ahead of today's protest at Jantar Mantar.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 11:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Semtech EVP and CCO Jason Green sells $526,508 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 11:01 AM IST", "pub_date_relative": "1h ago"}, {"title": "SEBI Settlement Regulations 2026: New formula, \u20b910 lakh fast-track, and other key changes investors must know", "full_content": "The Securities and Exchange Board of India ( SEBI ) has introduced a fresh set of rules aimed at making the regulatory framework for securities market violations simpler and more transparent. The changes cover how settlement amounts are calculated, how certain cases can be resolved faster and what companies may need to do to settle regulatory proceedings. The new framework also changes the treatment of wrongful gains and introduces separate routes for fast-track settlements.\n\nThe broader objective of the Settlement Regulations, 2026, is to simplify the settlement framework and reduce the scope for inconsistent or unpredictable outcomes.\n\nUnder the new framework, the settlement amount will be calculated using a base amount linked to the minimum penalty prescribed for the relevant violation under securities laws.\n\nThis base amount will then be adjusted according to several factors, including the stage of proceedings, regulatory action, the gravity of the violation, aggravating and mitigating circumstances, and legal costs.\n\nThe revised formula is intended to bring greater consistency to settlement calculations. By specifying the factors that influence the amount, SEBI aims to make the process easier to understand and more predictable for entities seeking to settle regulatory proceedings.\n\nHowever, the final settlement amount will continue to depend on the circumstances of the case and the applicable regulatory framework.\n\nOne of the key changes is the separate treatment of wrongful gains, losses avoided and losses caused to investors.\n\nUnder the earlier approach described in the notification, such amounts could be counted while calculating settlement terms, potentially resulting in double counting. The new framework removes this overlap.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "Market crash ahead? Warren Buffett's guide to navigate through bear attacks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Market crash ahead? Warren Buffett's guide to navigate through bear attacks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Market crash ahead? Warren Buffett's guide to navigate through bear attacks SECTIONS Market crash ahead? Warren Buffett's guide to navigate through bear attacks By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 10, 2026, 10:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Warren Buffett\u2019s investing principles offer a guide to navigating market crashes and bear markets. From avoiding panic-driven decisions and distinguishing investing from gambling to protecting capital and staying patient, the legendary investor emphasises discipline, rational thinking and risk management over speculation and attempts to time the market.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 10:55 AM IST", "pub_date_relative": "1h ago"}, {"title": "Baththa Box Office Collection Day 9: Vijay Sethupathi Starrer Picks Up After Weekday Dip", "full_content": "Vijay Sethupathi's 'Baththa' recorded a 15.9% rise in India net collections on Day 9. Its total India net collection has reached Rs 17.06 crore, while the India gross stands at Rs 19.75 crore.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:53 AM IST", "pub_date_relative": "1h ago"}, {"title": "RBI Announces Regulatory Measures For Forex Market: What Changes For Oil PSUs?", "full_content": "The RBI also introduced a foreign exchange risk reserve which will involve banks maintaining with the central bank - in cash - an amount equal to 20% of the rupee equivalent of the notional amount of each transaction which exceeds $2 million, it said.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "Sanctions For Thee, Crude For Me: The Paradox Of Trump's Energy Doctrine", "full_content": "Trump said Russia would supply more than 300,000 tonnes of diesel immediately, with larger shipments to follow.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:48 AM IST", "pub_date_relative": "2h ago"}, {"title": "YouTuber Dhruv Rathee Detained By Delhi Police Ahead of CJP Protest At Jantar Mantar", "full_content": "YouTuber Dhruv Rathee was detained by Delhi Police from his residence in Gurugram's Sector 56", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:44 AM IST", "pub_date_relative": "2h ago"}, {"title": "RIL, ICICI Bank, Infosys, and more: Motilal Oswal names 40 stocks to buy during Q2 earnings season \u2014 Check full list", "full_content": "Indian equities have become more attractive following a sharp valuation correction, with Motilal Oswal Financial Services (MOFSL) said in a recent report.\n\nThe brokerage expects earnings growth to remain healthy despite global uncertainties, although it cautioned that stock selection will be crucial as market performance increasingly depends on individual companies\u2019 earnings trajectories.\n\nMOFSL expects aggregate profit after tax across its coverage universe to grow 22% year-on-year in the September 2026 quarter, marking the highest growth in 11 quarters. Excluding oil marketing companies, earnings are projected to rise 24%, while Nifty-50 earnings are expected to increase 27%.\n\n\u201cIndia\u2019s ongoing market consolidation, alongside continued earnings recovery from FY25 lows, has led to a sustained cooling in valuations from the highs seen in 2024. Large- and mid-caps have witnessed the steepest valuation corrections of 31% and 36%, respectively, from their respective peaks,\u201d MOFSL said.\n\nIt identifying opportunities across banking, financial services, technology, manufacturing, automobiles, consumption and healthcare stocks.\n\nMOFSL\u2019s model portfolio maintains exposure to established companies such as ICICI Bank, HDFC Bank, State Bank of India, Infosys, Larsen & Toubro, Bharat Electronics, Titan Company, Reliance Industries, Bharti Airtel and Apollo Hospitals.\n\nIts portfolio also includes newer and mid-cap opportunities such as Meesho, PhysicsWallah, Jubilant FoodWorks, GE Vernova T&D, Kirloskar Oil Engines, Oberoi Realty, Pearl Global and Fujiyama Power.\n\nThe brokerage has an overweight stance on diversified financials, information technology and new-age platforms, manufacturing and industrials, and discretionary consumption. It is underweight on private banks, energy and telecom, and commodities, utilities and renewables, while maintaining a neutral stance on healthcare and automobiles.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 10:42 AM IST", "pub_date_relative": "2h ago"}, {"title": "Trump vows quick end to Iran war as fighting in Yemen intensifies", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 10:33 AM IST", "pub_date_relative": "2h ago"}, {"title": "AI is changing how lawyers work \u2014 and putting the billable hour under pressure", "full_content": "Artificial intelligence is now used by almost 90% of legal professionals in the U.K. and Ireland, and it's putting one of the profession's oldest conventions \u2014 the billable hour \u2014 under the microscope.\n\nThat's according to legal software company Clio's U.K. & Ireland Legal Insights Report 2026 . It found that among firms using AI, almost 80% said they can handle more work without increasing resources, while over 70% said it cut costs by absorbing administrative work once done by support staff.\n\nAs a result, AI is challenging some of the assumptions on which the legal profession was built, forcing firms to reevaluate how their lawyers spend their time, how they charge for it and how new lawyers learn the ropes.\n\nSome of the U.K.'s biggest firms are already putting this into practice. A&O Shearman has worked with legal AI company Harvey to develop artificial intelligence agents for tasks, including reviewing loan agreements and analyzing regulatory filings, which it says can complete in minutes work that previously took several hours. Slaughter and May, meanwhile, has rolled out Harvey across all practice areas this year, including for regulatory research and document analysis.\n\nThe billable hour is central to the business model of many law firms, but when AI significantly reduces the time lawyers spend sifting through and drafting documents, the economics are no longer so straightforward.\n\n\"You can't charge 16 hours for something that takes 16 seconds,\" Nick Rowles-Davies, founder and CEO of legal finance fund Lexolent, based in London and Dubai, told CNBC.\n\nAbout one in five firms that have widely adopted AI report difficulty meeting billable-hour targets, according to Clio's report. Globally, senior legal leaders expect the share of work charged by the hour to fall from 72% to 44% over the next two to three years, according to a Deloitte survey .\n\nRoutine work is the most exposed, Rowles-Davies said.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "The world needs Ukraine\u2019s grain. Its farmers are running out of reasons to plant", "full_content": "Ukraine's harvest season is moving from wheat and barley into corn, soybeans and sunflower, and farmer Oleksandr Chumak has had a strong yield so far. That should be good news.\n\nInstead, after 11 years of growing a range of crops in the Odesa region of southern Ukraine, Chumak has had enough.\n\nStorage facilities across both Ukraine and Russia are filled with millions of tons of produce that would normally be sent to Europe, the Middle East, Asia and Africa \u2014 but are instead trapped in the warring countries.\n\nRussian drone and missile hits on Black Sea targets intensified over the summer and into fall, making it impossible to insure commercial ships. Kyiv's retaliatory attacks mean Russian exports are now also stuck, further squeezing global supply.\n\nAnd with fatal Black Sea attacks continuing into October , prospects of a ceasefire look slim, even as Turkey ramps up efforts to broker a deal due to the risk to global food security.\n\nChumak says that around 80% of his grain cannot currently be sold at a profit, and he is out of cash.\n\nA collapse in domestic prices is giving farmers like him little reason to sow for the 2027 crop in the coming months.\n\n\"For the farmers, it's very difficult because we need to pay taxes, we need to pay rent for land, and now we are not able to do this because we are not able to sell anything,\" said Andrii Dykun, chairman of the Ukrainian Agri Council.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Other Mommy Box Office Collection Day 1: Jessica Chastain's Horror Film Records Modest Opening In India", "full_content": "'Other Mommy' is a supernatural horror film directed by Rob Savage and adapted from Josh Malerman's novel 'Incidents Around the House'.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:21 AM IST", "pub_date_relative": "2h ago"}, {"title": "This Kerala Bakery Business Made Rs 822 Crore In FY23 Without Raising A Single Funding Round", "full_content": "Elite Foods Pvt. Ltd. was launched because its founder was unable to find a bread that matched the quality that he had gotten used to during his abroad visit.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:17 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bessent Will Likely Cut US Long Bond Sales Next Month, Says Citi", "full_content": "US Treasury Secretary Scott Bessent may reduce auction sizes for long-dated bonds and possibly cancel 20-year bond sales, as per Citigroup's analysis.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:16 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bambusa Therapeutics Files for IPO To Fund Eczema Drug Trials", "full_content": "Started in 2024, Bambusa secured its lead drug candidates through its earlier acquisition of assets from a unit of BioNTech SE, the first to treat atopic dermatitis, commonly known as eczema, and the second to treat other inflammatory disorders including respiratory and allergic diseases.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:11 AM IST", "pub_date_relative": "2h ago"}, {"title": "India To Remain Fastest-Growing Large Economy At 7.3% In 2026, Says UNCTAD", "full_content": "India is projected to remain the fastest-growing large economy at 7.3% in 2026, says UNCTAD. However, global growth is expected to slow to 2.6%, amid energy shocks, geopolitical tensions and trade uncertainties.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:06 AM IST", "pub_date_relative": "2h ago"}, {"title": "Volkswagen ID.4 Is Dead: Meet Its New Electric SUV Replacement - Motor1.com", "full_content": "Volkswagen ID.4 Is Dead: Meet Its New Electric SUV Replacement Motor1.com View Interior Photos of the 2028 Volkswagen ID. Tiguan Car and Driver Volkswagen\u2019s replacement for the ID.4 crossover is here Ars Technica A Volkswagen bestseller goes electric: world premiere of the new ID. Tiguan Volkswagen Newsroom VW Proves It\u2019s Listening With ID.Tiguan That\u2019s Big on Buttons: TDS The Drive", "source": "Google News Business", "pub_date_str": "10 Oct 2026, 10:06 AM IST", "pub_date_relative": "2h ago"}, {"title": "Credit score after marriage: How can your spouse\u2019s credit history affect joint home and personal loans?", "full_content": "Marriage does not automatically merge spouses\u2019 credit scores or credit histories. However, when couples apply for a joint personal loan or home loan, a lender may assess both applicants\u2019 credit scores, repayment histories, incomes and existing debts. A spouse\u2019s poor credit record could affect the loan application\u2019s approval or terms, making it important to understand how creditworthiness influences joint borrowing.\n\nThis distinction is particularly important when couples plan to take on major financial commitments, such as a home loan, car loan or personal loan. Having a clear understanding of these concepts is essential for couples to plan their finances better.\n\nFurthermore, a credit score is like an individual\u2019s financial report card. This is a three-digit number provided by prominent credit bureaus such as CRIF High Mark, Experian, Equifax and TransUnion CIBIL. The basic range of credit scores is generally between 300 and 900. With any score over 750 usually considered excellent, though there is no fixed rule defining it.\n\nCredit scores are fundamentally based on an individual\u2019s credit history. Marriage itself does not lower, modify or improve an individual\u2019s credit score. Also, a spouse's poor credit history, excessive debt levels, or past defaults do not automatically impact or influence an individual\u2019s own credit score or credit profile in any way. Both partners, even after marriage, will continue to maintain separate credit reports.\n\nThe situation changes when an individual applies for credit with their partner, i.e., their spouse. For example, if you and your spouse apply for a:\n\nThen, in such cases, the lending institution may assess both applicants\u2019 credit scores, repayment histories, incomes and existing financial obligations.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 10:05 AM IST", "pub_date_relative": "2h ago"}, {"title": "RBI tightens forex derivative rules: What changes for hedging, cancelled trades", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a RBI tightens forex derivative rules: What changes for hedging, cancelled trades The Economic Times daily newspaper is available online now. Read Today's Paper RBI tightens forex derivative rules: What changes for hedging, cancelled trades SECTIONS RBI tightens forex derivative rules: What changes for hedging, cancelled trades By Kumar Gaurav , ETMarkets.com Last Updated: Oct 10, 2026, 10:50:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The RBI has tightened rules for rupee-linked foreign exchange derivatives, restricting the rebooking of cancelled contracts and cutting the threshold for transactions without establishing underlying exposure to $5 million from $100 million. It has also mandated additional checks for hedging activities and introduced a 20% cash reserve requirement for certain transactions.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share M cribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 09:59 AM IST", "pub_date_relative": "2h ago"}, {"title": "Stock to buy in short term: Choice Broking's Sumeet Bagadia recommends this PSU bank stock as Navratri Pick", "full_content": "Bank of Maharashtra has emerged as a stock pick this Navratri, with Sumeet Bagadia, Executive Director at Choice Broking, identifying a positive technical setup in the public sector lender.\n\nThe brokerage's Navratri Pick 2026 report, dated October 9, recommended buying the stock at \u20b9 82.75 and accumulating more on dips towards \u20b9 80, with upside targets of \u20b9 91 and \u20b9 96.\n\nSharad Navratri 2026 is observed from October 11 to October 20, 2026, starting with Ghatasthapana on October 11 and concluding with Vijayadashami (Dussehra) on October 20\n\nThe stock has been lost around 2% in the last 1 month. Meanwhile, it added 1.4% in 3 months, 19% in 6 months, and 47% in the last 1 year. Moreover, it has given multibagger returns, soaring 303% in 5 years. It had hit its 52-week high of \u20b9 94.50 in June 2026 and its 52-week low of \u20b9 54.70 in October 2025.\n\nChoice Broking's analysis is for traders looking to benefit from the stock's technical setup. However, the brokerage has identified \u20b9 76 as an important support level that the stock must hold to preserve its positive outlook.\n\nAccording to Bagadia, Bank of Maharashtra has maintained a higher-high and higher-low structure on the weekly chart, indicating a sustained uptrend. This pattern suggests that the stock has continued to form successive highs and lows above previous levels, supporting the prevailing bullish trend.\n\nHe said, \"Bank of Maharashtra is showing a positive technical setup on the weekly chart, with the stock maintaining a higher-high and higher-low structure, indicating a sustained uptrend. The stock has previously broken out of a sideways consolidation range.\"\n\nThe report also highlighted that the stock had broken out of a sideways consolidation range and repeatedly attracted buying interest near the breakout zone. Multiple reversals from this area have established what the brokerage described as a potential demand zone, where buyers have stepped in to support the stock.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 09:58 AM IST", "pub_date_relative": "2h ago"}, {"title": "Euro falls, set for fifth straight weekly drop as oil prices rise", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Euro falls, set for fifth straight weekly drop as oil prices rise The Economic Times daily newspaper is available online now. Read Today's Paper Euro falls, set for fifth straight weekly drop as oil prices rise SECTIONS Euro falls, set for fifth straight weekly drop as oil prices rise By Reuters Last Updated: Oct 10, 2026, 09:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The euro has experienced a significant drop as concerns about France's public debt continue to affect investor confidence. Global bond markets have stabilized following US President Donald Trump's remarks on potential military action against Iran. Oil prices fluctuated significantly, impacting market dynamics and investor sentiment. US consumer sentiment has worsened amid rising living costs attributed to the ongoing Middle East conflict.\n\n(What's moving Sensex and Nifty Track ut investors will need to distinguish companies with sustainable growth prospects from those whose valuations have risen ahead of their fundamentals. For smallcap investors in particular, the emphasis remains on balance-sheet strength, cash flows, earnings visibility and valuation discipline over the next two years.\n\nSmallcap stocks may offer opportunities for investors looking beyond short-term market movements, but largecap stocks are also presenting pockets of value. With market performance varying significantly across individual companies, fund managers believe investors should focus on earnings growth, valuations and business fundamentals rather than simply choosing stocks based on their market capitalisation.\n\nMonarch AIF remains constructive on quality smallcap stocks over the next 12-24 months, citing strong corporate balance sheets, healthy domestic demand, improving cash flows and companies' capital expenditure plans.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 12:39 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bitcoin hovers at Fibonacci support near $82,700: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 12:32 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Q2 Quarterly Results 2026 Today|Avenue Supermarts (DMart), Premier Polyfilm, , LCC Infotech, Grand Oak Canyon Distillery", "full_content": "Q2 2026 Quarterly Results Today - Four listed companies are announcing the Q2 FY 2026-27 Quarterly Results Today. The companies are Avenue Supermarts (DMart), Premier Polyfilm, Grand Oak Canyons Distillery, LCC Infotech.\n\nOn 1st Oct 2026, in an exchange filing DMART gave 'Notice of the Board Meeting scheduled to be held on Saturday, October 10, 2026'.\n\nPursuant to Regulation 29 of the Securities & Exchange Board of India (Listing Obligations and Disclosure Requirements) Regulations, 2015, we wish to inform you that meeting of the Board of Directors of the Company is scheduled to be held on Saturday, October 10, 2026 to, inter alia, consider and approve the Un-audited Standalone & Consolidated Financial Results of the Company for the quarter and half year ended September 30, 2026.\n\nOn 3rd Oct 2026, in an exchange filing Premier Polyfilm gave BOARD MEETING INTIMATION \u2014 UNAUDITED FINANCIAL RESULTS FOR THE QUARTER AND HALF YEAR ENDED 30TH SEPTEMBER 2026.\n\nPursuant to regulation 29(1) & (2) and 50(1) of the SEBI (Listing Obligations & Disclosure Requirements), Regulations 2015, It is hereby informed that a Meeting of Board of Directors of the company is scheduled on Saturday, 10 th October,2026 at 01:30 P.M.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 12:29 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The Top Four AI Bets: Aswath Damodaran Cuts Through The Silicon Valley Valuation Fog", "full_content": "Damodaran sets out the framework in his latest blog post, as the US market keeps rallying despite a sharp rise in bond yields.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 12:08 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Meta To Alphabet: Top AI Companies To Drive Most Third-Quarter US Earnings Gains", "full_content": "Technology stocks helped the S&P 500 reach a record high this week. The earnings season is expected to beg alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 12:05 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Signing Deals Is One Thing; Making Them Work Is Another | The Week In Whys", "full_content": "India has successfully concluded several trade agreements. More deals will also follow. These can bring more export orders, more investments and more business opportunities. But things can still go wrong along the way.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 12:03 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "European bank stocks slide 8% as bond yields spark investor caution - Bloomberg", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 12:03 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nifty bulls regain momentum, but can bears strike back? 5 factors to decide D-Street\u2019s fate next week", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Nifty bulls regain momentum, but can bears strike back? 5 factors to decide D-Street\u2019s fate next week The Economic Times daily newspaper is available online now. Read Today's Paper Nifty bulls regain momentum, but can bears strike back? 5 factors to decide D-Street\u2019s fate next week SECTIONS Nifty bulls regain momentum, but can bears strike back? 5 factors to decide D-Street\u2019s fate next week By Kumar Gaurav , ETMarkets.com Last Updated: Oct 10, 2026, 12:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities snapped an eight-week losing streak as the Nifty 50 and Sensex rebounded on Friday. However, elevated crude prices, foreign investor outflows, inflation data, bond yields and the September-quarter earnings season could shape the market\u2019s next move. Here are five key factors investors should track next week.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 12:01 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Banking Stock Swoon in Europe Is a Sign of Caution, Not Panic", "full_content": "A selloff in banking stocks is rarely comforting. But after three years of strong gains, the latest pullback in European lenders looks more like a reset than a crash.\n\nThe Euro Stoxx banks index has dropped by about 8% over two weeks, sliding to the lowest level since June and entering a technical correction on Thursday. Societe Generale SA, Credit Agricole SA and Deutsche Bank AG have all tumbled more than 15% from their recent highs.\n\nSoaring bond yields have been at the heart of the sudden drawdown, adding to risks for borrowers and eroding the value of sovereign assets held by banks. Much of the drama centers on France, where political upheaval and fears over its finances have pushed the premium on the nation\u2019s debt over Germany\u2019s to the widest in more than a decade.\n\n\u201cBond yields appear to have crossed a pain threshold that has prompted investors to reassess fundamentals,\u201d said Roberto Scholtes, head of strategy at Singular Bank. \u201cIf interest rates rise as much as currently embedded in yield curves, non-performing loans could increase significantly, while loan growth and corporate banking activity would slow.\u201d\n\nOn the other hand, the retreat in banking stocks follows a breakneck rally that saw their shares triple since 2022. Bulls can point to the bigger picture: bank balance sheets are more robust than in the European sovereign bond crisis more than a decade ago. The spike in yields is unlikely to bleed through to fundamentals unless they go higher and stay elevated.\n\nRather than a turning point, it looks more like some of the heat has gone out of a widely popular trade.\n\n\u201cThere is also a positioning factor, as banks have been a consensus long and some names had become quite crowded,\u201d Scholtes noted.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 11:57 AM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Jio Platforms IPO: What does listing of Reliance Industries' company mean for Airtel, Vodafone, Indus Towers shares?", "full_content": "Jio Platforms IPO : The listing of Jio Platforms is likely introduce transformative structural shifts for both the broader Indian telecom sector and its parent company, Reliance Industries (RIL).\n\nAmid growing anticipation around Jio Platforms' initial public offering (IPO), a fresh update on the issue has emerged. The Mukesh Ambani-led telecom company is likely to price its shares in the range of \u20b9 1,065 to \u20b9 1,119 apiece, Bloomberg reported, citing sources. However, Jio Platforms has not yet officially disclosed key details of the IPO, including the price band, valuation and timeline.\n\nJio\u2019s proposed valuation could reset the way investors assess Bharti Airtel, which has been a major beneficiary of improving average revenue per user (ARPU), tariff increases and industry consolidation.\n\nSeema Srivastava, Senior Research Analyst at SMC Global Securities, said Jio\u2019s standalone listing would establish a transparent valuation benchmark for the telecom sector and could trigger a re-rating of listed peers, including Airtel.\n\nAt a reported valuation of around \u20b9 11 lakh crore, Jio Platforms would be valued slightly above Airtel\u2019s market capitalisation of approximately \u20b9 10.87 lakh crore. Garg noted that Jio\u2019s reported valuation of around 37 times FY26 profit compares with about 63 times trailing earnings for Airtel.\n\nMeanwhile, Gaurav Garg, Head of Research at Lemonn, said Jio\u2019s listing could create a near-term overhang for the stock as investors compare the valuations of the two telecom giants.\n\nGarg further explained that this valuation gap could influence institutional investors looking for direct exposure to Jio. Some investors may rebalance their portfolios ahead of the IPO, potentially creating short-term volatility in Airtel shares.\n\nBeyond valuation, the Jio IPO could have a more lasting impact on the sector if it improves the prospects of another round of mobile tariff increases.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 11:50 AM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Can stock market losses offset mutual fund gains? What is tax-loss harvesting strategy, how it works", "full_content": "Investors may make profits on mutual fund investments while holding stocks that are trading at a loss. In such cases, selling loss-making stocks could help reduce their tax liability by offsetting capital losses against eligible capital gains.\n\nShort-term capital losses can be set off against both short-term and long-term capital gains, whereas long-term capital losses can be set off only against long-term gains. These rules apply subject to the relevant income-tax provisions.\n\nYes, offsetting capital losses from the sale of listed shares is allowed but only against equity-oriented mutual funds .\n\nA mutual fund scheme is classified as an equity mutual fund when it invests more than 60% of its total assets in the equity shares of different companies. The balance amount can be invested in money market instruments or debt securities as per the investment objective of the scheme.\n\nTax-loss harvesting is a common strategy in which investors sell investments at a loss to offset eligible capital gains and reduce their tax liability for the financial year. The losses can be used to lower the net taxable capital gains.\n\nSuppose you have earned \u20b9 1,00,000 in short-term capital gains (STCG) by selling equity mutual fund units during a certain financial year. At a tax rate of 20%, you would owe \u20b9 20,000 in tax, excluding applicable surcharge and cess.\n\nNow, suppose you also hold stocks with unrealised short-term capital losses of \u20b9 80,000. If you sell these investments and realise the losses, you can offset them against your eligible capital gains, bringing your net STCG down to \u20b9 20,000.\n\nAt a 20% tax rate, the amount you would owe on the remaining capital gains would be \u20b9 4,000, excluding applicable surcharge and cess. This would result in a tax saving of \u20b9 16,000. However, this should be done only if you are certain that the loss-making securities do not have any scope of recovery in the near future.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 11:43 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Why is the Chinese stock market missing the AI rally", "full_content": "", "source": "Investing.com News", "pub_date_str": "10 Oct 2026, 11:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "They Turned Discarded Banana Stems Into Yoga Mats And Baskets, Made Rs 2.5 Crore In Revenue", "full_content": "Taruwar Agro Industries does not only support the environment by re-using locally available farm resources, it also supports farmers with additional income.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 11:28 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brent commands a war premium as Middle East supply risks keep oil on edge", "full_content": "Home ETPrim  are fundamental CFA exam areas."}, {"title": "Home loan rates October 2026: Compare rates starting from 7% across 12 public sector banks", "full_content": "Are you looking for a home loan? Have you decided which lending institution you will take out your home loan with? Do you have a well-planned strategy not only to borrow but also to ensure you repay the home loan seamlessly?\n\nThese are some core questions that an aspiring home loan borrower must answer before proceeding with their home loan application, as proper planning is essential to ensure borrowing remains a pleasant experience.\n\nFurthermore, home loan interest rates start from 7% at some prominent public sector banks in October 2026, although the rate applicable to a borrower can vary based on the lending institution, borrower profile, credit score , past borrowing history, loan amount and other fundamental factors.\n\nWith this in mind, let us look at the home loan rates offered by prominent public sector banks in the country for October 2026. The rates provided below cover three loan slabs: up to \u20b9 30 lakh, above \u20b9 30 lakh and up to \u20b9 75 lakh, and above \u20b9 75 lakh.\n\nIt is also important to note that Bank of Maharashtra and Central Bank of India offer starting rates of 7% across all three loan slabs. Bank of Maharashtra's rate ranges from 7% to 9.90%, while Central Bank of India's rate ranges from 7% to 9.15%. The complete list of all banks is discussed in detail below.\n\nNote: *Under CRG-Prime, CRG-1 and CRG-2, Canara Bank offers an additional 5 basis points concession for takeover/ready-to-move home loan proposals and for salaried employees maintaining a salary account with the bank.\n\n**UCO Bank offers an additional 0.05% concession for women borrowers and 0.10% for takeover loans.\n\n***Union Bank of India offers an additional 0.05% interest rate concession to borrowers opting for an insurance policy.", "source": "LiveMint Money", "pub_date_str": "10 Oct 2026, 11:13 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Corporate Issuers"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "SEBI Settlement Regulations 2026: New formula, \u20b910 lakh fast-track, and other key changes investors must know", "full_content": "The Securities and Exchange Board of India ( SEBI ) has introduced a fresh set of rules aimed at making the regulatory framework for securities market violations simpler and more transparent. The changes cover how settlement amounts are calculated, how certain cases can be resolved faster and what companies may need to do to settle regulatory proceedings. The new framework also changes the treatment of wrongful gains and introduces separate routes for fast-track settlements.\n\nThe broader objective of the Settlement Regulations, 2026, is to simplify the settlement framework and reduce the scope for inconsistent or unpredictable outcomes.\n\nUnder the new framework, the settlement amount will be calculated using a base amount linked to the minimum penalty prescribed for the relevant violation under securities laws.\n\nThis base amount will then be adjusted according to several factors, including the stage of proceedings, regulatory action, the gravity of the violation, aggravating and mitigating circumstances, and legal costs.\n\nThe revised formula is intended to bring greater consistency to settlement calculations. By specifying the factors that influence the amount, SEBI aims to make the process easier to understand and more predictable for entities seeking to settle regulatory proceedings.\n\nHowever, the final settlement amount will continue to depend on the circumstances of the case and the applicable regulatory framework.\n\nOne of the key changes is the separate treatment of wrongful gains, losses avoided and losses caused to investors.\n\nUnder the earlier approach described in the notification, such amounts could be counted while calculating settlement terms, potentially resulting in double counting. The new framework removes this overlap.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Market crash ahead? Warren Buffett's guide to navigate through bear attacks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Market crash ahead? Warren Buffett's guide to navigate through bear attacks Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Market crash ahead? Warren Buffett's guide to navigate through bear attacks SECTIONS Market crash ahead? Warren Buffett's guide to navigate through bear attacks By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 10, 2026, 10:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Warren Buffett\u2019s investing principles offer a guide to navigating market crashes and bear markets. From avoiding panic-driven decisions and distinguishing investing from gambling to protecting capital and staying patient, the legendary investor emphasises discipline, rational thinking and risk management over speculation and attempts to time the market.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "10 Oct 2026, 10:55 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "RBI Announces Regulatory Measures For Forex Market: What Changes For Oil PSUs?", "full_content": "The RBI also introduced a foreign exchange risk reserve which will involve banks maintaining with the central bank - in cash - an amount equal to 20% of the rupee equivalent of the notional amount of each transaction which exceeds $2 million, it said.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:51 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Sanctions For Thee, Crude For Me: The Paradox Of Trump's Energy Doctrine", "full_content": "Trump said Russia would supply more than 300,000 tonnes of diesel immediately, with larger shipments to follow.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:48 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "RIL, ICICI Bank, Infosys, and more: Motilal Oswal names 40 stocks to buy during Q2 earnings season \u2014 Check full list", "full_content": "Indian equities have become more attractive following a sharp valuation correction, with Motilal Oswal Financial Services (MOFSL) said in a recent report.\n\nThe brokerage expects earnings growth to remain healthy despite global uncertainties, although it cautioned that stock selection will be crucial as market performance increasingly depends on individual companies\u2019 earnings trajectories.\n\nMOFSL expects aggregate profit after tax across its coverage universe to grow 22% year-on-year in the September 2026 quarter, marking the highest growth in 11 quarters. Excluding oil marketing companies, earnings are projected to rise 24%, while Nifty-50 earnings are expected to increase 27%.\n\n\u201cIndia\u2019s ongoing market consolidation, alongside continued earnings recovery from FY25 lows, has led to a sustained cooling in valuations from the highs seen in 2024. Large- and mid-caps have witnessed the steepest valuation corrections of 31% and 36%, respectively, from their respective peaks,\u201d MOFSL said.\n\nIt identifying opportunities across banking, financial services, technology, manufacturing, automobiles, consumption and healthcare stocks.\n\nMOFSL\u2019s model portfolio maintains exposure to established companies such as ICICI Bank, HDFC Bank, State Bank of India, Infosys, Larsen & Toubro, Bharat Electronics, Titan Company, Reliance Industries, Bharti Airtel and Apollo Hospitals.\n\nIts portfolio also includes newer and mid-cap opportunities such as Meesho, PhysicsWallah, Jubilant FoodWorks, GE Vernova T&D, Kirloskar Oil Engines, Oberoi Realty, Pearl Global and Fujiyama Power.\n\nThe brokerage has an overweight stance on diversified financials, information technology and new-age platforms, manufacturing and industrials, and discretionary consumption. It is underweight on private banks, energy and telecom, and commodities, utilities and renewables, while maintaining a neutral stance on healthcare and automobiles.", "source": "LiveMint Markets", "pub_date_str": "10 Oct 2026, 10:42 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "AI is changing how lawyers work \u2014 and putting the billable hour under pressure", "full_content": "Artificial intelligence is now used by almost 90% of legal professionals in the U.K. and Ireland, and it's putting one of the profession's oldest conventions \u2014 the billable hour \u2014 under the microscope.\n\nThat's according to legal software company Clio's U.K. & Ireland Legal Insights Report 2026 . It found that among firms using AI, almost 80% said they can handle more work without increasing resources, while over 70% said it cut costs by absorbing administrative work once done by support staff.\n\nAs a result, AI is challenging some of the assumptions on which the legal profession was built, forcing firms to reevaluate how their lawyers spend their time, how they charge for it and how new lawyers learn the ropes.\n\nSome of the U.K.'s biggest firms are already putting this into practice. A&O Shearman has worked with legal AI company Harvey to develop artificial intelligence agents for tasks, including reviewing loan agreements and analyzing regulatory filings, which it says can complete in minutes work that previously took several hours. Slaughter and May, meanwhile, has rolled out Harvey across all practice areas this year, including for regulatory research and document analysis.\n\nThe billable hour is central to the business model of many law firms, but when AI significantly reduces the time lawyers spend sifting through and drafting documents, the economics are no longer so straightforward.\n\n\"You can't charge 16 hours for something that takes 16 seconds,\" Nick Rowles-Davies, founder and CEO of legal finance fund Lexolent, based in London and Dubai, told CNBC.\n\nAbout one in five firms that have widely adopted AI report difficulty meeting billable-hour targets, according to Clio's report. Globally, senior legal leaders expect the share of work charged by the hour to fall from 72% to 44% over the next two to three years, according to a Deloitte survey .\n\nRoutine work is the most exposed, Rowles-Davies said.", "source": "CNBC World Economy", "pub_date_str": "10 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "The world needs Ukraine\u2019s grain. Its farmers are running out of reasons to plant", "full_content": "Ukraine's harvest season is moving from wheat and barley into corn, soybeans and sunflower, and farmer Oleksandr Chumak has had a strong yield so far. That should be good news.\n\nInstead, after 11 years of growing a range of crops in the Odesa region of southern Ukraine, Chumak has had enough.\n\nStorage facilities across both Ukraine and Russia are filled with millions of tons of produce that would normally be sent to Europe, the Middle East, Asia and Africa \u2014 but are instead trapped in the warring countries.\n\nRussian drone and missile hits on Black Sea targets intensified over the summer and into fall, making it impossible to insure commercial ships. Kyiv's retaliatory attacks mean Russian exports are now also stuck, further squeezing global supply.\n\nAnd with fatal Black Sea attacks continuing into October , prospects of a ceasefire look slim, even as Turkey ramps up efforts to broker a deal due to the risk to global food security.\n\nChumak says that around 80% of his grain cannot currently be sold at a profit, and he is out of cash.\n\nA collapse in domestic prices is giving farmers like him little reason to sow for the 2027 crop in the coming months.\n\n\"For the farmers, it's very difficult because we need to pay taxes, we need to pay rent for land, and now we are not able to do this because we are not able to sell anything,\" said Andrii Dykun, chairman of the Ukrainian Agri Council.", "source": "CNBC Top News", "pub_date_str": "10 Oct 2026, 10:30 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bessent Will Likely Cut US Long Bond Sales Next Month, Says Citi", "full_content": "US Treasury Secretary Scott Bessent may reduce auction sizes for long-dated bonds and possibly cancel 20-year bond sales, as per Citigroup's analysis.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:16 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Bambusa Therapeutics Files for IPO To Fund Eczema Drug Trials", "full_content": "Started in 2024, Bambusa secured its lead drug candidates through its earlier acquisition of assets from a unit of BioNTech SE, the first to treat atopic dermatitis, commonly known as eczema, and the second to treat other inflammatory disorders including respiratory and allergic diseases.", "source": "NDTV Profit", "pub_date_str": "10 Oct 2026, 10:11 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "RBI tightens forex derivative rules: What changes for hedging, cancelled trades", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a RBI tightens forex derivative rules: What changes for hedging, cancelled trades The Economic Times daily newspaper is available online now. Read Today's Paper RBI tightens forex derivative rules: What changes for hedging, cancelled trades SECTIONS RBI tightens f     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
