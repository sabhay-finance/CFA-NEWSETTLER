longest correction phases in recent times.\n\nThe index also moved close to its previous swing low. Although Nifty registered three consecutive positive closing sessions, it was unable to close above the 50% retracement level of the large bearish candle formed on September 15. This indicates that buying interest is present at lower levels, but the recovery lacks sufficient strength to confirm a trend reversal.\n\nThe September 15 large bearish candle remains an important reference point for the near-term trend. The candle formed a wide range between 23,118 and 23,592, and a breakout on either side of this range could determine the next directional move.\n\nUntil then, the index is likely to remain in a consolidation phase, with movement largely confined within the recent trading range. A decisive breakout from this zone may provide clarity on whether the market is preparing for a recovery or resuming the corrective trend.\n\nFrom a larger time-frame perspective, the price structure continues to remain weak and corrective. The Nifty has slipped below its 20-week and 100-week moving averages, while the 50-week moving average continues to remain significantly higher, reflecting continued weakness in the medium-term trend.\n\nThe ongoing decline has now matched the longest consecutive weekly losing streak seen during the recent past. In terms of price correction, the decline has extended beyond the fall witnessed between June and August 2025. After such an extended correction, a short-term pullback cannot be ruled out.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:18 AM IST", "pub_date_relative": "46m ago"}, {"title": "Bessent calls meeting with China Vice Premier He Lifeng 'successful' ahead of Trump-Xi summit", "full_content": "Treasury Secretary Scott Bessent said on Sunday he had a successful meeting with Chinese Vice Premier He Lifeng ahead of Chinese President Xi Jinping 's visit to the U.S. this week.\n\nThe talks covered artificial intelligence and trade , among other issues ahead of Trump and Xi's Sept. 24 summit in Washington, D.C.\n\nBessent, emerging from the meeting alongside U.S. Trade Representative Jamieson Greer, said the two sides had discussed setting up a \"U.S.-China AI Dialogue,\" with the U.S. proposing the two countries set up a notification mechanism for incidents regarding AI.\n\nThe notification mechanism would be for incidents rising \"up to a national security level from AI,\" he said.\n\n\"We think that just like with any cross-border activity, that moving from opaque to more transparency between the number one and the number two AI powers in the world is very important,\" he said.\n\nBessent's meeting with He also comes amid intensifying debate in Washington over the safety of AI and national security as the U.S. and China compete for technological leadership. The Trump administration has favored voluntary and national-security-focused safeguards over broad mandatory rules for AI developers. The issue is expected to be part of discussions between Xi and Trump during the Chinese president's visit.\n\nTop AI executives have recently warned that the technology could quickly become out of control and poses sweeping new threats. They urged Washington to set guardrails and regulations on the industry, something Trump himself has derided .\n\nGreer said the U.S. and China have \"operationalized\" the U.S.-China Board of Trade, to help facilitate trade negotiations by finding a \"critical mass of goods\" that could be considered separately \"when and if there are trade measures\" in the future.", "source": "CNBC World Economy", "pub_date_str": "21 Sep 2026, 06:15 AM IST", "pub_date_relative": "49m ago"}, {"title": "Global Market Today: Asian stocks edge higher, oil extends losses", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a G , sources say", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 06:06 AM IST", "pub_date_relative": "58m ago"}, {"title": "EMs have a bitter pill to swallow", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nDeveloped-market central banks are in a tightening cycle as they combat crude oil price-led inflation. The US Federal Reserve\u2019s 25 basis points interest rate hike last week was its first in three years, and another rate hike is on the cards before 2026 ends. The European Central Bank and Bank of Japan have raised rates, too. Asian markets\u2019 reaction to the Fed\u2019s much-anticipated move was mixed. The jury is now out on the timing and quantum of the next Fed hike, with the Fed meeting in October and December. A lot depends on crude oil price, which is already at $110/barrel.\n\nA higher-for-longer interest-rate scenario exerts pressure on risk assets such as emerging market (EM) equities and Asian currencies. Local currency weakness invites imported inflation, making the central banks\u2019 inflation fight trickier. Further, a higher-rate-led rise in Treasury yields usually triggers capital outflows from other markets into the US.\n\nA renewed tightening cycle by the Fed means a stronger US dollar and firmer bond yields. Higher yields weaken corporate balance sheets as the cost of capital rises, hurting earnings growth prospects. The US 10-year bond yield climbed above the 5% mark last week\u2014its highest level since 2007. Higher government bond yields make fixed-income assets more attractive than equities.\n\nEPFR data collated by Elara Securities showed that last week, US funds saw a sharp $64 billion rebound in inflows (a 3-month high) following the Fed\u2019s rate hike, while global emerging market funds recorded their first outflow in 10 weeks of $877 million. Among Asian countries, South Korea and India-focused funds saw outflows. Taiwan-dedicated funds attracted $1.7 billion in inflows, but the underlying trend is showing early signs of moderation.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Nifty may recover after two years of underperformance, says Anand Rathi\u2019s Azeez", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIndian equities may be due for a recovery after two years of underperformance, with historical returns and continued domestic institutional buying offering some support, according to Feroze Azeez, joint chief executive officer at Anand Rathi Wealth Ltd.\n\n\u201cMean reversion is favouring India,\u201d he said. He does not expect a sharp market correction unless both foreign institutional investors (FIIs) and domestic institutional investors (DIIs) turn sellers. While FIIs have been selling for an extended period, DIIs still have substantial cash to deploy, he said. Historically, the Nifty has delivered positive returns in the three years following a two-year period of price stagnation, Azeez added.\n\nAzeez now oversees \u20b9 1.06 lakh crore in assets under management (AUM), up sharply from \u20b9 32,000 crore four and a half years ago.\n\nYes, the rupee's recent depreciation has naturally brought currency diversification into the conversation, particularly for HNIs and NRIs. The rupee has historically depreciated by around 3-4% annually, while in recent years the pace has been closer to 5-6%, so some mean reversion can be expected. But currency movement needs to be seen alongside investment returns. Indian equities have more than compensated for rupee weakness over the longer term, making India one of the more rewarding investment destinations on a real-returns basis. With the Indian economy still expected to grow at around 6.4% in FY27, corporate earnings and financial assets have continued to compound in rupee terms.\n\nCurrency diversification makes the most sense when there is a specific future requirement in that currency. For example, if someone has a goal such as foreign education, overseas travel or any other expense in Australian dollars, US dollars or another foreign currency, then matching part of the investment to that currency makes sense.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "How Asian markets, crude will impact Sensex, Nifty today: What GIFT Nifty, Nikkei, Kospi, Taiwan signals for India", "full_content": "Stock market prediction on Monday, 21 September, 2026: The Indian stock market is likely start on a negative note on Monday amid escalating tensions in the Middle East over the weekend.\n\nAsian markets opened mixed on Monday, while US stock futures rose slightly higher.\n\n\u201cIndian equities are likely to open on a flat-to-negative note, with GIFT Nifty trading near 23,321 against the Nifty\u2019s previous close of 23,346.40. Global cues remain cautiously supportive, with Asian markets trading higher. Brent crude\u2019s retreat to around $102 a barrel offers some relief, but prices remain elevated as the unresolved Middle East conflict leaves the market vulnerable to renewed flare-ups and supply disruptions. The risk of another oil-price spike remains a key overhang on sentiment,\u201d said Hariselvan Radhakrishnan, Founder & CEO of HST Wealth.\n\nThe Indian stock market closed the truncated trading week in negative territory, led by elevated crude oil prices and rising global bond yields. Concerns about the near-term inflationary impact of higher energy costs and their potential implications for economic growth continued to weigh on investor sentiment.\n\nAmong the key benchmark indices, the Sensex fell 0.65% to end at 74,294.46, while the Nifty declined 0.22% to settle at 23,346.40. The broader midcap and smallcap indices remained largely flat after a volatile week, taking a pause following several weeks of strong performance.\n\n\u201cIndian equity markets remained volatile during the week, with the Nifty 50 extending its weekly losing streak to six consecutive weeks, marking its longest such stretch since 2020. Although the benchmark staged a recovery toward the end of the week, supported by bargain buying following recent oversold conditions, broader sentiment remained cautious as WTI crude oil prices stayed above the $95-per-barrel mark, global bond yields remained elevated and the U.S.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:52 AM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Australian shares edge lower as banks and miners drag", "full_content": "Sept 21 (Reuters) - Australian shares inched lower on Monday, led by heavyweight banks and miners, as risk appetite weakened after renewed tensions in the Middle East.\n\nThe S&P/ASX 200 index ticked 0.3% lower to 8,705.40 by 0018 GMT. The benchmark ended flat on Friday, finishing the week with a 0.1% loss.\n\nIran and the U.S. exchanged fresh threats over the weekend, underscoring months of deadlock between the two countries and adding to investor concerns about regional tensions and oil supplies.\n\nOil prices eased on Monday, however, as hopes for a recovery in shipments from top exporter Saudi Arabia offset news of a Houthi attack on Riyadh.\n\nMining stocks slipped 0.5% after a 1.9% jump in the previous session. BHP, Rio Tinto and Fortescue declined between 0.5% and 0.7%.\n\nAmong gold miners, Northern Star Resources and Evolution Mining were down 0.7% and 0.2%, respectively.\n\nBullion prices eased as the Middle East tensions added to inflation concerns and reinforced expectations that interest rates would stay higher for longer worldwide.\n\nFinancials slipped for a second straight session, falling 0.3%. Three of the \"Big Four\" banks traded in negative territory, while ANZ Group was little changed.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:46 AM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Treasury\u2019s Bessent and China\u2019s He launch talks on AI, trade and critical minerals", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 06:43 AM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Stock futures rise slightly after Dow posts third straight losing week: Live updates - CNBC", "full_content": "Stock futures rise slightly after Dow posts third straight losing week: Live updates CNBC Futures Rise: Can Market Take Off? 2026's Top Stocks Are Buys Investor's Business Daily Yields, oil and tech drag on US stocks with rate hike in sight TradingView Dow Futures Forecast : 47,379 Moderation Zone as Bearish Headwinds Persist FXLeaders Dow Jones Futures Set for Mixed Open as Bullish and Bearish Signals Compete - Return On Equity careplusvn.com", "source": "Google News Business", "pub_date_str": "21 Sep 2026, 06:33 AM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "French finance ministry expects record debt in 2026, reaching nearly 120% of GDP", "full_content": "", "source": "Investing.com News", "pub_date_str": "21 Sep 2026, 06:31 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jane Street bets big on leveraged ETF swaps", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Jane Street bets big on leveraged ETF swaps Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Jane Street bets big on leveraged ETF swaps SECTIONS Jane Street bets big on leveraged ETF swaps Bloomberg Last Updated: Sep 21, 2026, 06:26:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jane Street Group has entered the leveraged ETF swap market this year. They provided about $1.2 billion in swaps during the second quarter. This move increases competition in a specialized derivatives market. Clear Street and Marex Group also hold significant market shares. US leveraged ETF assets recently peaked above $200 billion.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Sep 2026, 06:26 AM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Equity Investments", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "NaBFID plans to raise $1.5 billion via overseas bonds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a NaBFID plans to raise $1.5 billion via overseas bonds Bank of Maharashtra Share Price Punjab National Bank Share Price Bank of Baroda Share Price Indian Bank Share Price Canara Bank Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper NaBFID plans to raise $1.5 billion via overseas bonds SECTIONS NaBFID plans to raise $1.5 billion via overseas bonds By Shilpy Sinha , ET Bureau Last Updated: Sep 21, 2026, 06:28:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis NaBFID is set to initiate the raising of $500 million via a 10-year overseas bond, while simultaneously negotiating a $1 billion MIGA-backed bond with a longer 15-year maturity. This financial strategy aims to secure essential long-term funding for infrastructure developments.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nNaBFID is set to initiate the raising of $500 million via a 10-year overseas bond, while simultaneously negotiating a $1 billion MIGA-backed bond with a longer 15-year maturity. This financial strategy aims to secure essential long-term funding for infrastructure developments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "21 Sep 2026, 06:20 AM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "History shows Nifty has rebounded after six consecutive weeks of decline; Will it repeat this time?", "full_content": "The Nifty witnessed a weak start to the previous week, declining in the first two trading sessions, with a sharp fall recorded on Tuesday. However, the index recovered gradually over the next three sessions and managed to close higher from the lower levels. Despite this recovery, the overall trend remained under pressure as the index extended its losing streak to the sixth consecutive week, marking one of the longest correction phases in recent times.\n\nThe index also moved close to its previous swing low. Although Nifty registered three consecutive positive closing sessions, it was unable to close above the 50% retracement level of the large bearish candle formed on September 15. This indicates that buying interest is present at lower levels, but the recovery lacks sufficient strength to confirm a trend reversal.\n\nThe September 15 large bearish candle remains an important reference point for the near-term trend. The candle formed a wide range between 23,118 and 23,592, and a breakout on either side of this range could determine the next directional move.\n\nUntil then, the index is likely to remain in a consolidation phase, with movement largely confined within the recent trading range. A decisive breakout from this zone may provide clarity on whether the market is preparing for a recovery or resuming the corrective trend.\n\nFrom a larger time-frame perspective, the price structure continues to remain weak and corrective. The Nifty has slipped below its 20-week and 100-week moving averages, while the 50-week moving average continues to remain significantly higher, reflecting continued weakness in the medium-term trend.\n\nThe ongoing decline has now matched the longest consecutive weekly losing streak seen during the recent past. In terms of price correction, the decline has extended beyond the fall witnessed between June and August 2025. After such an extended correction, a short-term pullback cannot be ruled out.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:18 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bessent calls meeting with China Vice Premier He Lifeng 'successful' ahead of Trump-Xi summit", "full_content": "Treasury Secretary Scott Bessent said on Sunday he had a successful meeting with Chinese Vice Premier He Lifeng ahead of Chinese President Xi Jinping 's visit to the U.S. this week.\n\nThe talks covered artificial intelligence and trade , among other issues ahead of Trump and Xi's Sept. 24 summit in Washington, D.C.\n\nBessent, emerging from the meeting alongside U.S. Trade Representative Jamieson Greer, said the two sides had discussed setting up a \"U.S.-China AI Dialogue,\" with the U.S. proposing the two countries set up a notification mechanism for incidents regarding AI.\n\nThe notification mechanism would be for incidents rising \"up to a national security level from AI,\" he said.\n\n\"We think that just like with any cross-border activity, that moving from opaque to more transparency between the number one and the number two AI powers in the world is very important,\" he said.\n\nBessent's meeting with He also comes amid intensifying debate in Washington over the safety of AI and national security as the U.S. and China compete for technological leadership. The Trump administration has favored voluntary and national-security-focused safeguards over broad mandatory rules for AI developers. The issue is expected to be part of discussions between Xi and Trump during the Chinese president's visit.\n\nTop AI executives have recently warned that the technology could quickly become out of control and poses sweeping new threats. They urged Washington to set guardrails and regulations on the industry, something Trump himself has derided .\n\nGreer said the U.S. and China have \"operationalized\" the U.S.-China Board of Trade, to help facilitate trade negotiations by finding a \"critical mass of goods\" that could be considered separately \"when and if there are trade measures\" in the future.", "source": "CNBC World Economy", "pub_date_str": "21 Sep 2026, 06:15 AM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Global Market Today: Asian stocks edge higher, oil extends losses", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian stocks edge higher, oil extends losses Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian stocks edge higher, oil extends losses SECTIONS Global Market Today: Asian stocks edge higher, oil extends losses Bloomberg Last Updated: Sep 21, 2026, 06:13:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis MSCI\u2019s Asia Pacific equities gauge advanced 0.2% with Japan shut for a public holiday. S&P 500 futures rose 0.3% after the underlying gauge eked out a gain Friday, while contracts on the Nasdaq 100 Index climbed 0.4%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and re  and continued domestic institutional buying offering some support, according to Feroze Azeez, joint chief executive officer at Anand Rathi Wealth Ltd.\n\n\u201cMean reversion is favouring India,\u201d he said. He does not expect a sharp market correction unless both foreign institutional investors (FIIs) and domestic institutional investors (DIIs) turn sellers. While FIIs have been selling for an extended period, DIIs still have substantial cash to deploy, he said. Historically, the Nifty has delivered positive returns in the three years following a two-year period of price stagnation, Azeez added.\n\nAzeez now oversees \u20b9 1.06 lakh crore in assets under management (AUM), up sharply from \u20b9 32,000 crore four and a half years ago.\n\nYes, the rupee's recent depreciation has naturally brought currency diversification into the conversation, particularly for HNIs and NRIs. The rupee has historically depreciated by around 3-4% annually, while in recent years the pace has been closer to 5-6%, so some mean reversion can be expected. But currency movement needs to be seen alongside investment returns. Indian equities have more than compensated for rupee weakness over the longer term, making India one of the more rewarding investment destinations on a real-returns basis. With the Indian economy still expected to grow at around 6.4% in FY27, corporate earnings and financial assets have continued to compound in rupee terms.\n\nCurrency diversification makes the most sense when there is a specific future requirement in that currency. For example, if someone has a goal such as foreign education, overseas travel or any other expense in Australian dollars, US dollars or another foreign currency, then matching part of the investment to that currency makes sense.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock recommendations for 21 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap : Indian equities ended mixed on Friday, with Nifty 50 edging higher for a second straight session. At the same time, Sensex stayed nearly flat, as strong domestic macro cues offset lingering global rate concerns. The index rose 75.80 points, or 0.33%, to close at 23,346.40, while Sensex slipped 19.63 points, or 0.03%, to settle at 74,294.96.\n\nCapital goods, Healthcare, Oil & Gas, and Banking stocks led the gains, while IT, Consumer Durables, and FMCG lagged. Nestle India fell after facing regulatory action over its baby-food products. Sentiment got a lift after Moody's raised India's FY27 growth forecast to 7% from 6%, citing the economy's resilience despite the West Asia conflict.\n\nHowever, elevated crude oil prices and a hawkish US Federal Reserve stance kept some pressure on the rupee and foreign flows. Life-insurance stocks also gained on expectations of lower commission payouts. Market breadth stayed strong for a second consecutive day, with 2,388 stocks advancing, 1,154 stocks declining, and 111 remaining unchanged. This reflects broad-based buying interest even as global uncertainties kept investors selectively cautious.\n\nOn Friday, 18 September, Indian equities ended on a positive note, with Nifty 50 closing at 23,346.40, up 75.80 points or 0.33%, after trading between 23,286.60 and 23,389.15 during the session. The broader market showed strong participation, with 2,388 stocks advancing, 1,154 stocks declining, and 111 remaining unchanged. This resulted in an advance-decline ratio of roughly 2.1:1 and indicating healthy underlying breadth. On the sectoral front, Metals (+1.51%), Media (+1.34%), Realty (+1.19%), and Oil & Gas (+0.84%) led the gains. On the other hand, IT (-1.03%) was the major laggard. TCS was among the notable drags on technology stocks. Financial services, PSU Banks, and Pharma also finished higher.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Raja Venkatraman recommends three stocks for 21 September", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBetween 15 September and 18 September, 2026, Indian equities experienced a volatile but ultimately mixed week, with Nifty showing resilience while Bank Nifty remained under pressure. The week began with sharp declines on September 15, as Nifty fell 1.19% to 23,118.60 and Sensex dropped 1.04% to 74,003.82.\n\nSANSERA: Buy above \u20b9 4265, stop \u20b9 4065 target \u20b9 4765 (Multiday)\n\nSUDARSCHEM: Buy above \u20b9 1265, stop \u20b9 1205 target \u20b9 1385(Multiday)\n\nFinancials bore the brunt of the selloff, with Bank Nifty sliding 1.43% to 55,794.75, reflecting stress in the sector and bearish positioning in derivatives. Midweek sentiment remained weak, particularly on September 17, when FIIs sold equities worth \u20b9 3,208.76 crore, keeping indices subdued. Sensex slipped marginally by 0.03% to 74,314.59, underscoring persistent caution among investors.\n\nBy September 18, however, markets managed a modest recovery. Nifty closed at 23,346.40, up 0.33%, while Sensex ended flat at 74,294.96. The rebound was supported by softer crude oil prices, with Brent easing to $103.4 per barrel, which alleviated inflationary concerns and provided relief to the rupee. Positive cues from Asian markets also contributed to the uptick. Despite this, gains were capped by weakness in IT majors such as TCS (-4.33%) and Tech Mahindra (-1.82%), along with declines in Tata Group stocks including Titan (-2.11%), Tata Steel (-1.73%), and Tata Chemicals (-11.71%). On the other hand, select counters like Adani Ports, Power Grid, HDFC Bank, and Bharti Airtel provided support.\n\nOverall, the week reflected a tug-of-war between bearish FII flows and supportive macro cues. While Nifty managed to hold ground and recover by Friday, Bank Nifty\u2019s weakness underscored sectoral stress.", "source": "LiveMint Markets", "pub_date_str": "21 Sep 2026, 06:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks in news: RVNL, Lenskart, Mazagon Dock, Maruti Suzuki India and Nestle India", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Stocks in news: RVNL, Lenskart, Mazagon Dock, Maruti Suzuki India and Nestle India Lenskart Solutions Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Stocks in news: RVNL, Lenskart, Mazagon Dock, Maruti Suzuki India and Nestle India SECTIONS Stocks in news: RVNL, Lenskart, Mazagon Dock, Maruti Suzuki India and Nestle India By Kumar Gaurav , ETMarkets.com Last Updated: Sep 21, 2026, 06:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Indian equities concluded Friday's session with marginal gains, supported by softer crude prices. Several companies like RVNL and Mazagon Dock are expected to be in focus on Monday. RVNL secured a significant order from East Coast Railway for railway line works. Mazagon Dock plans a substantial investment in a new shipyard project. Lenskart Solutions is anticipated to see a large block deal transaction.\n\n(What's moving Sensex and Nifty Track latest marke     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
