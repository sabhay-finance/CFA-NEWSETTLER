n Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 10:13 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold, silver prices today, 22 November: Check retail rates of 24K, 22K, 18K gold, 999 silver in Delhi, Mumbai, Bangalore", "full_content": "Gold, silver prices today, 22 November: Gold prices crashed about 9% this week after five days of decline and its largest weekly loss since March 2026, as per a Bloomberg report. Bullion lost close to 9% this week, trading near $3,500 \u2014 close to its lowest level since September 2025 and Silver slipped 15%, it added.\n\nThe report noted the pullback came amid anxiety over artificial intelligence ( AI ) companies, continued war between the United States and Iran, and indications of further interest rate hikes by the hawkish US Federal Reserve.\n\nSpot gold fell 3% to $3,514.08/oz, US gold futures for December delivery settled 4.6% lower at $3,515.40/oz, and spot silver fell 4.1% to $40.99 per ounce, 66.3% below its record high of $121.64 hit in January, Reuters reported.\n\nAt the time of writing on 22 November, gold bullion was trading at \u20b9 1,22,520 per 10 grams, while Silver was at \u20b9 1,49,600 per kg, data on the bullion website showed.\n\nHere are gold and silver rates in key Indian cities on Sunday. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bengaluru, Chennai, Coimbatore, Delhi, Hyderabad, Kolkata, and Mumbai today as follows:\n\nThe gold price in Mumbai today, 22 November, was in line with the overall gold rate in India. The 24-karat gold price in Mumbai was \u20b9 1,22,300 per 10 grams. Meanwhile, the price of 22-karat gold in Mumbai was \u20b9 1,12,108 per 10 grams. On the other hand, the 18-karat gold rate in Mumbai was \u20b9 91,725 per 10 grams.\n\nThe silver price in Mumbai today, 22 November, was in line with the overall silver rates in India. The price of Silver 999 Fine in Mumbai was \u20b9 1,49,330 per kg.\n\nThe gold price in Delhi reflected the overall gold rates across India on 22 November. The 24-karat gold price in Delhi was \u20b9 1,22,090 per 10 grams. Meanwhile, the price of 22-karat gold in the national capital was \u20b9 1,11,916 per 10 grams, while the rate of 18-karat gold was \u20b9 91,568 per 10 grams.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 09:22 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Penny stock under \u20b910 with strong fundamentals, high book value; do you own this Reliance Group share? Target, SL", "full_content": "Asit Manohar Updated 22 Nov 2026, 09:21 AM IST Prefer Livemint on Google Penny stock under \u20b9 10 with high book value , strong fundamentals: Amid a strong rebound in the Indian stock market and the Nifty 50 index coming close to its record high of 26,373, investors are busy finding value picks with high book value and strong fundamentals. They prefer such stocks at lower prices, as it enables them to acquire more shares with a higher probability of wealth creation. For such investors, shares of Hathway Cable and Datacom Limited could be a good stock to consider. The small-cap, debt-free company, with a market cap of \u20b9 1,620 crore, is owned by Reliance Industries.\n\nAccording to the latest shareholding pattern of this penny stock under \u20b9 10 with high book value and strong fundamentals, Reliance Industries is among the promoters of this company. Some other Reliance Group companies, Jio Content Distribution Holdings, Jio Internet Distribution Holdings, and Jio Cable and Broadband Holdings, figure among the promoters of this penny stock with high book value.\n\nThe Reliance Industries-owned company we are talking about is Hathway Cable and Datacom Limited. The penny stock finished at \u20b9 9.21 per share on Friday. So, it is a penny stock under \u20b9 10, and it is owned by Reliance Industries and some other Reliance Group companies.\n\nDescribing Hathway Cable and Datacom shares as high book value shares, Anuj Gupta, a SEBI-registered market expert, said, \u201cThe penny stock under \u20b9 10 is a high book value stock. Its current book value is around 26, which means the penny stock under \u20b9 10 is trading at a steep discount with a price-to-book around 0.35.\u201d\n\nOn why the penny stock with strong book value is trading at a huge discount (around one third of its accounting net worth), Anuj Gupta said, \u201cDespite a strong balance sheet, Hathway has delivered low Return on Equity (ROE of ~1.3%\u20131.9%), modest sales growth (~4.4% over 5 years), and shrinking operating margins.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 09:20 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Quantitative Methods", "Financial Statement Analysis", "Equity Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Wall Street sell-off: Is the worst over? Goldman Sachs warns of fresh selling wave, flags 3 recovery triggers", "full_content": "The S&P 500 Index slid deeper into correction territory after a string of disappointing Big Tech earnings and scandal at Nvidia Corp. eroded confidence in the artificial intelligence trade over the last two weeks. Even Anthropic PBC\u2019s record IPO did little to lift market sentiment.\n\nIn fact, it\u2019s the first time the S&P 500 has fallen into a correction since US President Donald Trump\u2019s sweeping tariff announcements in April 2025.\n\nGoldman Sachs notes the index is 12% below its Oct. 6 record, and its strategists have named the three things they\u2019d need to see before calling a bottom.\n\nAccording to Goldman Sachs strategist Snider, the sell-off has expanded from an artificial intelligence (AI) stock unwind into a broader growth downgrade. The S&P 500 excluding AI stocks had held up until this week but is now 6% below its high. Goldman's AI stock basket has fallen 32% since October 6, while cyclical stocks have underperformed defensive stocks by 5 percentage points over the past 10 days.\n\nGoldman Sachs said any one of three developments could support a market bottom: improved confidence in AI earnings, a dovish signal from the Federal Reserve, or a significant decline in investor positioning.\n\nThe outlook for AI earnings remains uncertain. Investor Dan Niles recently told CNBC that a price war between Anthropic and OpenAI is hurting both. Providing numbers, the investor pointed out that combined sequential revenue growth fell from 75% in the second quarter to 48% in the third quarter, while combined losses increased from $7.9 billion to around $8.4 billion.\n\nGoldman\u2019s own outlook says the AI outlook for 2028 and beyond \u201cis highly uncertain.\u201d\n\nA change in the Fed's interest-rate outlook could also help markets recover. However, futures put the odds of a December rate hike at around 95%, ahead of the central bank's December 9 meeting.", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 09:03 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic's post-debut stumble delivers reality check for AI trade", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Anthropic's post-debut stumble delivers reality check for AI trade Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic's post-debut stumble delivers reality check for AI trade SECTIONS Anthropic's post-debut stumble delivers reality check for AI trade Reuters Last Updated: Nov 22, 2026, 09:00:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic\u2019s shares fell about 9% after their market debut, deepening concerns over stretched AI valuations and showing that even a marquee listing has not revived investor enthusiasm for the sector. The focus is now shifting to whether Anthropic can justify its roughly 40-times-sales valuation and whether a potential OpenAI IPO next year can restore appetite for AI stocks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "22 Nov 2026, 09:00 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bank holidays next week: SBI, HDFC, ICICI branches will be closed on these five days from 23-30 Nov. Check RBI calendar", "full_content": "Bank holidays next week: All public and private sector lenders, including the State Bank of India and HDFC Bank will remain closed on five days next week between 23-30 November across regions, according to the central bank's official calendar.\n\nBanks are also closed pan India today, on 22 November, on account of the Sunday weekend holiday.\n\nAccording to Reserve Bank of India's rules, all scheduled and non-scheduled banks observe listed holidays and mandatory closure on second and fourth Saturdays and every Sunday in a month. In-branch services are shut, but digital services (online net banking, app) will remain operational.\n\nUsually, in addition to the common national and gazetted holidays, or weekend offs, banks in India could have local holidays and festivals off, as required. The central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks will be closed for a total of 16 days this month, including state and regional holidays and weekend offs, as per the official RBI calendar for November. Of this, banks, including the SBI , HDFC Bank, ICICI Bank, Axis Bank, Punjab National Bank, Canara Bank, Bank of Baroda and other lenders across India will remain closed on the following dates next week:\n\n\u2014 November 23 (Monday): Banks will be closed in Shillong for Seng Kut Snem.\n\n\u2014 November 24 (Tuesday): Banks will be closed in Aizawl, Belapur, Bhopal, Bhubaneswar, Chandigarh, Dehradun, Hyderabad, Itanagar, Jaipur, Jammu and Kanpur. Kohima, Kolkata , Lucknow, Mumbai, Nagpur, New Delhi, Raipur, Ranchi, Shimla and Srinagar for observances including Guru Nanak Jayanti, Karthika Purnima and Rahas Purnima.\n\n\u2014 November 27 (Friday): Banks will be closed in Bengaluru for Kanakadasa Jayanthi.", "source": "LiveMint Money", "pub_date_str": "22 Nov 2026, 07:36 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jensen Huang\u2019s demise isn't from the affair \u2014 but rather his shady Nvidia business with China - New York Post", "full_content": "Jensen Huang\u2019s demise isn't from the affair \u2014 but rather his shady Nvidia business with China New York Post How We Broke Open the Nvidia Investigation The New York Times MAGA figures hope Jensen Huang's spy scandal finally breaks Trump's embrace of Big Tech Axios A fight over chips is roiling Donald Trump\u2019s cabinet The Economist American State Capitalism Helped Produce the Nvidia Scandal WSJ", "source": "Google News Business", "pub_date_str": "22 Nov 2026, 07:32 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Best 3 stocks to buy under \u20b9100: IDFC First Bank, Jayaswal Neco Industries, Sagility by Sumeet Bagadia | Targets, SL", "full_content": "Stock market prediction: Sumeet Bagadia believes that Dalal Street bias has improved following the sharp rally in Indian indices", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 06:30 AM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold rate today in India at 14-month low; will it hit \u20b91 lakh? Experts list out 3 reasons for gold price drop in 2026", "full_content": "Gold rate today in India: MCX gold rate finished at 14-month low of \u20b91,21,949 per 10 gm on Friday, whereas gold price in the international market ended at $3,539/oz", "source": "LiveMint Markets", "pub_date_str": "22 Nov 2026, 05:04 AM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Alternative Investments"], "exam_note"     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
