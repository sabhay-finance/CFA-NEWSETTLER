ction with Forward Sale Agreements Meta Investor Relations Meta and SpaceX to Raise Billions More to Fund A.I. Ambitions The New York Times 1 Unstoppable Stock-Split Stock to Buy Before It Joins Nvidia, Alphabet, Microsoft, and Apple in the $3 Trillion Club The Motley Fool", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:38 PM IST", "pub_date_relative": "19m ago"}, {"title": "Dhanteras 2026: Buying gold jewellery? Here's how to check purity, verify BIS hallmark and avoid costly mistakes", "full_content": "Buying gold jewellery during Dhanteras is a tradition for many Indian households. However, with gold prices remaining elevated, even a small difference in purity can result in a significant financial loss for buyers.\n\nBefore purchasing gold jewellery, consumers should check more than just the price and design. The Bureau of Indian Standards (BIS) has laid down guidelines covering gold hallmarking, purity verification, billing requirements and compensation for consumers who receive jewellery that does not meet the stated purity standards.\n\nHere is what buyers should know before purchasing gold this festive season.\n\nThe first step is to look for the BIS hallmark, which certifies the purity of gold jewellery.\n\nAccording to BIS, hallmarked gold jewellery carries three mandatory markings. These include the BIS logo, the purity of gold expressed in caratage and fineness, and a six-character alphanumeric Hallmark Unique Identification (HUID) code.\n\nFor instance, 22-carat gold is marked 22K916, indicating 91.6% gold content. Similarly, 18-carat gold carries the marking 18K750, indicating 75% gold content.\n\nConsumers should understand these differences because the price of jewellery depends partly on its gold content.\n\nA 22-carat ornament and an 18-carat ornament of identical weight should not be valued at the same gold rate, assuming other factors remain unchanged.", "source": "LiveMint Money", "pub_date_str": "26 Oct 2026, 07:38 PM IST", "pub_date_relative": "19m ago"}, {"title": "Anthropic begins countdown to IPO with prospectus filing", "full_content": "240,000-word prospectus lays out explosive growth alongside steep losses and daunting risk factors", "source": "FT Markets", "pub_date_str": "26 Oct 2026, 07:38 PM IST", "pub_date_relative": "19m ago"}, {"title": "Meta announces $95 billion stock offering to fund AI expansion", "full_content": "Meta said Monday it is planning to raise a total of $95 billion to support its investments in artificial intelligence infrastructure and superintelligence.\n\nThe stock was down 1.6% in morning trading after the announcement. Nvidia , Advanced Micro Devices and Broadcom were interested in purchasing up to $5 billion in shares, Meta said in a statement.\n\nThe tech giant will initially raise $35 billion in underwritten public equity offerings, before raising an additional $60 billion with an at-the-market program.\n\nThe news comes as hyperscalers pour record sums into the AI infrastructure build-out. Goldman Sachs estimates that AI-related capital spending could total about $7.6 trillion from 2026 through 2031, across compute, data centers and power.\n\nMeta's planned investments will support \"emerging AI opportunities\" including its family of apps, its AI agent Muse and its data center business, the company said Monday.\n\nIt plans to balance funding for these investments through a mix of operating cash flow, investment-grade debt, partnerships and equity capital.\n\nMeta is among the major hyperscalers that are increasingly tapping debt to fund the expensive infrastructure required for the AI boom.\n\nLast week, Meta posted third-quarter results showing revenue jumped 26% year on year: $64.60 billion versus the $63.37 billion analysts expected. However, investors focused more on the tech company's negative free cash flow and its higher full-year capital expenditure forecast.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 07:35 PM IST", "pub_date_relative": "22m ago"}, {"title": "Q2 Results Today LIVE Updates: Nazara Tech Swings To Profit; Tata Consumer Net Profit Rises 16%", "full_content": "Q2 Results Today LIVE: Paytm, Tata Consumer Products, ITC Hotels, Indian Overseas Bank, Bank of Maharashtra, REC, Mankind Pharma, Sunteck Realty, Ather Energy, Eris Lifesciences, Nazara Technologies, among other will announce Q2 results today.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:32 PM IST", "pub_date_relative": "24m ago"}, {"title": "Kawasaki Z300 Arrives In India With Ninja 300 Engine: Check Price, Specs And Key Features", "full_content": "Kawasaki has launched the Z300 in India at Rs 3.24 lakh, ex-showroom, positioning it as the entry point into the brand\u2019s Z streetfighter lineup, built on the same underpinnings as the Ninja 300.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:32 PM IST", "pub_date_relative": "25m ago"}, {"title": "Mumbai Local Trains Disruption: Signalling System On All 4 Suburban Railway Lines Restored At Kanjurmarg", "full_content": "Railway officials said that nearly 24 signals on all six lines including 5th and 6th lines that used for long distance trains operation.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:31 PM IST", "pub_date_relative": "26m ago"}, {"title": "\u2018We don\u2019t have inflation\u2019? Five charts show the US economic reality of Trump\u2019s second term so far - The Guardian", "full_content": "\u2018We don\u2019t have inflation\u2019? Five charts show the US economic reality of Trump\u2019s second term so far The Guardian Trump failed to stop inflation. Now Republicans may pay the price in the midterm elections AP News Affordability Is Splintering the Voter Coalition Trump Built With Midterms at Stake Bloomberg.com How Trump\u2019s Economy Is Working in 7 Charts Barron's Trump promised $2 gas and cheaper groceries. Here\u2019s what voters got instead. NBC News", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:31 PM IST", "pub_date_relative": "26m ago"}, {"title": "Mortgage rates above 7% are the 'new normal'\u2014here's why", "full_content": "Everyone seems to agree that mortgage rates above 7% are the new \"normal.\"\n\nThe phrase keeps popping up lately in public comments from housing economists, including Lawrence Yun , chief economist for the National Association of Realtors, and Robert Dietz , chief economist for the National Association of Home Builders.\n\nIt's a sentiment increasingly reflected in forecasts, too, with major housing groups predicting mortgage rates will remain above 7% well into 2027. Fannie Mae forecasts mortgage rates could average 7.5% in 2027, while the Mortgage Bankers Association expects them to remain above 7% .\n\nThat means the 3% or 4% mortgage rates borrowers were used to in the years before 2022 are unlikely to return anytime soon.\n\n\"We could definitely see some movement up and down depending on data, but we're just not in the same economic environment we were in during the 2010s or the pandemic,\" says Jenna Stauffer, a broker and market analyst with Sotheby's International Realty.\n\nMortgage rates tend to move with the 10-year Treasury yield, which serves as a benchmark because mortgages are typically paid off or refinanced well before their 30-year term. And there are reasons to think those longer-term borrowing costs could remain elevated.\n\nOne is persistently high inflation. When inflation remains elevated, investors generally demand higher yields on long-term bonds to compensate for the declining purchasing power of the money they'll eventually be repaid. Inflation, as measured by the Fed's preferred PCE price index, hasn't been below the central bank's 2% target since February 2021 .\n\nBut inflation isn't the only factor. The federal government is borrowing heavily , while the artificial intelligence boom is fueling enormous private investment in data centers, power generation and other infrastructure, says Selma Hepp, chief economist at real estate data firm Cotality.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 07:30 PM IST", "pub_date_relative": "27m ago"}, {"title": "US Stock Market Today: Dow Jones, Nasdaq Jump On Anthropic IPO Interest, Falling Oil Prices", "full_content": "Oil prices moved lower, with Brent crude futures falling 1.4% to $115.02 a barrel and US West Texas Intermediate declining 2% to $101.01 a barrel.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:28 PM IST", "pub_date_relative": "28m ago"}, {"title": "This Major Indian City's AQI Turns Severe; Delhi, Mumbai And Kolkata Also See Elevated AQI", "full_content": "AQI.in's readings showed Chennai with the highest AQI among six major cities, while Hyderabad recorded a comparatively lower reading of 122.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:27 PM IST", "pub_date_relative": "29m ago"}, {"title": "A Rout in Brazilian Financial Markets - WSJ", "full_content": "A Rout in Brazilian Financial Markets WSJ Live Coverage: Lula, Bolsonaro Face Off in Brazil Presidential Runoff Election Bloomberg.com Why is MercadoLibre stock plunging today? Investing.com StoneCo Sinks 29%, Inter & Co Down 36%, PagSeguro Down 25% on Lula\u2019s Unexpected Election Win TIKR.com StoneCo (NASDAQ:STNE): What Drove the 33.36% Decline in the Early Session? kalkine.ca", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:26 PM IST", "pub_date_relative": "31m ago"}, {"title": "Jeep Compass Sport Diesel Automatic Launched: Price, Features And Delivery Date", "full_content": "Jeep has added an automatic gearbox to the entry-level Compass Sport trim, making it the most affordable automatic version of the SUV in India, with deliveries starting in the second week of November 2026.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:26 PM IST", "pub_date_relative": "31m ago"}, {"title": "TN Monsoon Fury: 14 Killed By Lightning, 62 Landslides Reported In Nilgiris; Tourists Barred From Hill Stations", "full_content": "Families of those killed by lightning will receive Rs 4 lakh in compensation as heavy rainfall disrupts several districts across Tamil Nadu.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:22 PM IST", "pub_date_relative": "35m ago"}, {"title": "This Startup Wants To Use Carbon Dioxide To Make Air Conditioners More Energy-Efficient", "full_content": "A US-based startup called Pascal is working on a new cooling technology that uses carbon dioxide in most air conditioners and refrigerators today.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:20 PM IST", "pub_date_relative": "37m ago"}, {"title": "The excitement around Moderna\u2019s cancer vaccine is cooling. Here\u2019s why.", "full_content": "Investors had \u201cincredibly high\u201d expectations around the Phase 3 data for the drugmaker\u2019s experimental cancer treatment.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Oct 2026, 07:20 PM IST", "pub_date_relative": "37m ago"}, {"title": "Apple stock has become an anti-AI trade. Here\u2019s why", "full_content": "As goes Apple, so goes the tech sector. For years, that was the case, but not anymore.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 07:13 PM IST", "pub_date_relative": "43m ago"}, {"title": "Anthropic opens books on AI's explosive growth and staggering costs", "full_content": "Anthropic unveiled its US IPO filing on Monday, laying out its ambitions to build AI systems capable of transforming the global economy while confronting the costs and challenges of developing the technology.\n\nThe prospectus highlights Anthropic's rapid growth over the past year, fuelled by Big Tech's breakneck spending that has driven a rally in AI stocks while raising concerns about lofty valuations and rising debt.\n\nThe IPO is expected to establish Anthropic, the AI lab behind the viral Claude models, as a benchmark for how Wall Street values leading AI companies, including rival OpenAI.\n\nAnthropic is pressing ahead with its IPO plans even as a once-busy fall listing calendar has thinned out, with market volatility prompting companies to delay offerings. The IPO would give Anthropic access to a deep pool of capital to fund its costly AI ambitions, which require heavy investment in computing infrastructure to develop and operate sophisticated models.\n\nGlobal equities have sold off sharply as investors grow uneasy with the debt-fueled AI investment boom and start to doubt if the trillions being poured into data centers, chips and computing capacity will generate returns fast enough to support lofty valuations. Higher borrowing costs and rising bond yields have added to their caution.\n\nSome current and prospective investors are valuing Anthropic at about $1.5 trillion, down from roughly $2 trillion a week ago, after the AI startup disclosed some financial details at a recent investor event, Reuters reported.\n\nThe filing confirmed a series of Reuters exclusives that offered an early peek at its contents before Anthropic made it public, including details of its financial performance, growth trajectory and IPO plans.\n\nThe IPO comes as Anthropic's own research raises concerns about advanced AI systems, which in controlled tests have demonstrated behaviors including code sabotage, fraud assistance and information manipulation.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 07:13 PM IST", "pub_date_relative": "44m ago"}, {"title": "Neocloud stocks fall as Elon Musk says more than 200 of them face 'guppy-level death'", "full_content": "Shares of major neocloud stocks fell on Monday after Elon Musk said that more than 200 companies in the sector could collapse.\n\nNebius and CoreWeave dropped around 4%, adding pressure to a sector already facing investor concerns about debt-fueled expansion and whether the large AI infrastructure buildout will generate returns. Iren was last trading down 3.2%.\n\n\"As of the past few weeks, debt markets have almost entirely shut off access to money for any company that doesn't have substantial revenue independent of AI data centers,\" Musk, CEO of SpaceX and Tesla , said on a post on X on Sunday.\n\n\"That means the 200+ neoclouds are going to see guppy-level death and consolidation. Some will make it through, but not many,\" he added.\n\nMusk's SpaceX operates its own data centers through which it sells computing capacity. SpaceX is a direct competitor to the neoclouds which also rent compute.\n\nCoreWeave, Nebius and Iren shares over the past five days. Musk was replying to a post on X by Chamath Palihapitiya, the founder of Social Capital, who laid out his views on the state of the data center buildout. He suggested that there will be \"a lot of partially stranded compute and compute sitting in inventory in 2027 than is currently forecasted,\" which will be \"bought and paid for but effectively underearning (below total cost of capital) or collecting dust.\"\n\n\"2027 will be a turbulent year because it will clear out a bunch of wrong/bad bets. It will also be a consolidation year for a few,\" Palihapitiya said.\n\nNeocloud stocks have taken a hammering over the past month, with CoreWeave and Nebius down more than 30% while Iren has tanked 40%. The sell-off started earlier this month after the spread on CoreWeave's five-year credit default swaps hit levels generally viewed as signs of distress. The yields on CoreWeave's bonds also climbed.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 07:13 PM IST", "pub_date_relative": "44m ago"}, {"title": "How This 25-Year-Old YouTuber Bought Rs 1 Crore Mercedes-Benz For His Parents", "full_content": "YouTuber and entrepreneur Ishan Sharma has earlier purchased his first home in Bengaluru.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:12 PM IST", "pub_date_relative": "45m ago"}, {"title": "US stocks today: US stocks open higher as Anthropic's IPO filing sharpens AI focus", "full_cont tent": "DCM Shriram reported a 33.5% year-on-year decline in Q2 net profit to Rs 105 crore, even as revenue rose 21.6% to Rs 3,977 crore.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:11 PM IST", "pub_date_relative": "46m ago"}, {"title": "Retail investors are getting cold feet about stocks, just when the market needs them most", "full_content": "Last week\u2019s carnage for hedge funds highlighted the relative decline in trading activity among retail investors.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Oct 2026, 07:07 PM IST", "pub_date_relative": "50m ago"}, {"title": "Verizon lifts annual forecasts, signs more than $2 billion AI infrastructure deal with AWS", "full_content": "Verizon raised its annual forecast for wireless subscriber additions on Monday, betting on strong demand for its simplified \u2060plans, and signed an AI infrastructure deal worth more than $2 billion \u200bwith Amazon Web Services.\n\nFor \u200bthe third \u200bquarter, the telecom carrier reported nearly double the analysts' estimate for monthly-bill-paying wireless subscriber gains at 406,000, against Visible \u2060Alpha \u200cexpectations of 209,439.\n\nVerizon now expects \u2060to add between 1.1 million and 1.2 million postpaid phone subscribers this year compared with earlier projections of 750,000 to 1 million\n\nIt \u200calso raised its full-year adjusted earnings per share forecast to $5.04 to $5.06, from $4.99 to $5.04 earlier\n\nHowever, \u200bthird-quarter revenue of $34.3 billion fell short of analyst estimates of $34.74 billion, according to LSEG data\n\nRevenue was pressured by lower device upgrade volumes \u2060as customers held on to their phones longer after Verizon began cutting \u200cdevice subsidies\n\nA year into CEO \u200cDan Schulman's tenure, Verizon has pursued a broad overhaul of its business, restructuring operations and simplifying its wireless offerings\n\nIt \u2060launched its Simplicity plan in June, introducing transparent pricing and \u2060unlimited data", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 07:05 PM IST", "pub_date_relative": "52m ago"}, {"title": "Stocks Gain Before Tech Earnings as Oil Declines: Markets Wrap - Bloomberg.com", "full_content": "Stocks Gain Before Tech Earnings as Oil Declines: Markets Wrap Bloomberg.com See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:04 PM IST", "pub_date_relative": "53m ago"}, {"title": "Anthropic Files SEC Form For US IPO To Go Public On Nasdaq; Goldman Sachs, Morgan Stanley Among Lead Bookrunners", "full_content": "Anthropic has not disclosed the number of shares it plans to sell or the expected price range in the filing.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:03 PM IST", "pub_date_relative": "53m ago"}, {"title": "The stock market\u2019s biggest test in weeks is here", "full_content": "Here\u2019s what\u2019s I\u2019m watching this morning: A week chockablock with enough catalysts that we might finally get some answers about the direction of the market by the end of it.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Oct 2026, 07:03 PM IST", "pub_date_relative": "54m ago"}, {"title": "Audi CEO faces backlash after joining Trump at midterm campaign rally - Reuters", "full_content": "Audi CEO faces backlash after joining Trump at midterm campaign rally Reuters Audi plans first US factory in Georgia with $4bn investment Yahoo Finance Trump reveals Audi's ambitious plans for a major expansion in the US Fox Business Audi defends plans for a $4 billion Georgia plant amid VW restructuring, tariffs CNBC Audi Announces Its First U.S. Factory; Nvidia, Micron Drive Earnings Boom WSJ", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:01 PM IST", "pub_date_relative": "56m ago"}, {"title": "REC Q2 Results: Net Profit Drops 21% Despite Record Disbursements, AUM Boost; Dividend Declared", "full_content": "REC's asset quality remained strong, with net NPA at 0.11% as of Sept. 30, 2026.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:00 PM IST", "pub_date_relative": "56m ago"}, {"title": "Mega Defence Boost: Rajnath Singh-Led DAC Clears Rs 2.12-Lakh-Crore Procurement Push For Army", "full_content": "The approvals cover high-mobility vehicles, artillery systems, light helicopters, air defence platforms and advanced drones to strengthen the armed forces\u2019 operational and surveillance capabilities.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:00 PM IST", "pub_date_relative": "57m ago"}, {"title": "The 5 big voting issues in the midterm elections that will impact your wallet", "full_content": "America won\u2019t be picking a president Nov. 3, but this is how the voting results could affect fuel prices, taxes and more.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Oct 2026, 07:00 PM IST", "pub_date_relative": "57m ago"}, {"title": "Anthropic IPO: It\u2019s official now! Artificial intelligence giant files papers to sell shares to public for first time", "full_content": "Anthropic, the artificial intelligence startup behind the Claude family of AI models, has filed papers for its initial public offering (IPO) on Monday with SEC, setting the stage for a closely watched technology listing amid growing concerns over AI valuations and rising investment costs.\n\nThe IPO is expected to provide a benchmark for how Wall Street values leading AI companies, including rival OpenAI. It would also give Anthropic access to capital to fund its ambitions, which require substantial investment in computing infrastructure to develop and operate advanced AI models.\n\nAnthropic intends to list its Class A common stock on the Nasdaq Global Select Market under the symbol \u201cANT.\u201d The number of shares of Class A common stock to be offered and the price range for the proposed offering have not yet been determined. The group owns in total about 1.7 billion Class A shares.\n\nThe filing comes as market volatility and rising interest rates have prompted several technology and AI infrastructure companies to delay their planned listings.\n\nAnthropic is planning to hold its IPO around the middle of next month, with its prospectus expected to be made public as early as late October, people familiar with the matter told Reuters. The timeline remains subject to change.\n\nThe company is expected to begin marketing its shares to prospective investors during the week of November 9, Reuters reported quoting sources. Anthropic declined to comment on the reported plans.\n\nThe listing stands out as other AI infrastructure and data-centre companies reconsider their IPO timelines amid rising borrowing costs and concerns about the sustainability of AI spending.\n\nIn June, the Claude make has confidentially filed with the SEC, giving the agency time to review its financials before they were made available to the public and prospective investors", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 06:59 PM IST", "pub_date_relative": "58m ago"}, {"title": "Oil prices fall as Saudi defense minister travels to Iran for talks to de-escalate conflict", "full_content": "Crude oil prices fell Monday as Saudi Arabia's defense minister travelled to Tehran to meet with senior Iranian officials.\n\nU.S. West Texas Intermediate futures slid 1.2% to $102.05 a barrel by 9:19 a.m. ET, while Brent crude futures declined 0.7% to $115.86 a barrel.\n\nThe pullback followed a sharp rally on Friday as repeated attacks by Iran-allied Houthi militants on Saudi Arabia have reignited fears of further disruptions to global energy supplies.\n\nSaudi Defense Minister Prince Khalid bin Salman will meet Monday with Iranian President Masoud Pezeshkian and National Security Council chief Mohsen Rezaei in an effort to de-escalate tensions, according to the Saudi Foreign Ministry.\n\nPakistan's Army Chief of Staff Asim Munir and the head of Turkish intelligence Ibrahim Kalin are also participating in the talks. Pakistan and Turkey are members of a defense pact with Saudi Arabia.\n\nTensions remained elevated over the weekend as the Houthis said they had targeted Saudi Arabia's main airport in Riyadh and oil facilities on Saturday. Saudi authorities said Sunday that they had intercepted additional missiles and drones.\n\nOil prices year-to-date The kingdom partially resumed operations at its main airport on Sunday despite damage from earlier attacks, even as the Houthis threatened further strikes.\n\nThe continued hostilities have heightened concerns about the vulnerability of Saudi Arabia's energy infrastructure, with traders increasingly focused on the risk of a major disruption to production, refining or export facilities.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 06:58 PM IST", "pub_date_relative": "58m ago"}, {"title": "SpaceX Agrees To $40 Billion Chip-Financing Deal With Apollo", "full_content": "The fixed-rate that the company will pay will be determined at pricing, which hasn't yet occurred, SpaceX said in a filing Monday. The deal is expected to close before year-end, and the leases are expected to start in the first half of next year.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 06:53 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic files for US IPO amid AI boom, rising costs and safety concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Anthropic files for US IPO amid AI boom, rising costs and safety concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic files for US IPO amid AI boom, rising costs and safety concerns SECTIONS Anthropic files for US IPO amid AI boom, rising costs and safety concerns ETMarkets.com Last Updated: Oct 26, 2026, 07:01:00 PM I alaries, careers and family life in 2026.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 06:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "Anthropic IPO live updates: AI lab lost $80.7 billion in first half of 2026 - CNBC", "full_content": "Anthropic IPO live updates: AI lab lost $80.7 billion in first half of 2026 CNBC Anthropic Reveals 14-Fold Increase in Growth as It Prepares for Blockbuster I.P.O. The New York Times Claude says Anthropic's IPO is a buy. ChatGPT disagrees Axios Stock Market Today: AI Giant Anthropic Unveils Paperwork for Blockbuster IPO \u2014 Live Updates WSJ How this Anthropic investor is thinking through its IPO filing Yahoo Finance", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 06:48 PM IST", "pub_date_relative": "1h ago"}, {"title": "Didn't Get Jio Shares? Rs 4.7 Lakh Crore Is Coming Back To Investors' Accounts", "full_content": "Jio Platforms' record IPO tied up far more money than it needed. With allotment due, about Rs 4.7 lakh crore of bids that will not turn into shares is set to be released back to investors.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 06:46 PM IST", "pub_date_relative": "1h ago"}, {"title": "Apollo to buy nearly 10% stake in Abu Dhabi-backed alternative asset manager Mubadala Capital", "full_content": "Investing giant Apollo Global Management is finalizing a deal to buy nearly a 10% stake in Mubadala Capital, the alternative asset manager subsidiary of Abu Dhabi's sovereign wealth fund, Mubadala Investment Co., according to people familiar with the matter who spoke on condition of anonymity.\n\nThe deal is expected to be announced later Monday morning, they said. Financial terms were not immediately known.\n\nThe transaction is significant on multiple fronts. It further advances Apollo's ambitions in Abu Dhabi often called the \"capital of capital.\" The firm has spent the past 15 years building key strategic relationships there, with both the country's investment arm and its core leadership.\n\nApollo already has a multibillion-dollar partnership with Mubadala Investment Co., first established in 2022 and extended two years ago. At the time of that extension, Apollo said the agreement would strengthen the firm's Capital Solutions platform by enabling the firms to jointly source and provide customized debt and equity financing to companies worldwide.\n\nIn 2023, the institutions formed a $2.5 billion joint venture designed specifically to co-invest in global private credit opportunities over a five-year horizon.\n\nFor Mubadala Capital specifically \u2014 the region's only large-scale asset manager, advising and administering more than $755 billion in assets \u2014 the deal further advances its growth strategy under the direction of CEO Hani Barhoush, and its relevance on the global investing stage. It also marks an inflection point for the company's core alternatives business, which has grown to more than $60 billion.\n\nApollo Global Management, YTD John Zito, co-president of Apollo's Asset Management arm, and Barhoush have worked closely together over the past several years and, according to sources, their close-knit relationship and the success of prior partnerships led to talks of deepening ties.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 06:39 PM IST", "pub_date_relative": "1h ago"}, {"title": "Breaking down Anthropic\u2019s 335-page S-1", "full_content": "Anthropic\u2019s planned listing could be the biggest stock market debut in history", "source": "FT Markets", "pub_date_str": "26 Oct 2026, 06:38 PM IST", "pub_date_relative": "1h ago"}, {"title": "SpaceX closes $40 billion debt deal for AI chips, Elon Musk says", "full_content": "SpaceX has closed $40 billion in debt financing to buy graphics processing units, or GPUs, used to power artificial intelligence systems.\n\nIn a post on X on Sunday, SpaceX CEO Elon Musk said it had closed the financing, adding that the company was investment grade and generated revenue from its Starlink satellite internet and rocket launch businesses.\n\nIn a follow-up post , he added that the financing primarily consisted of callable debt for graphics processing units, which are expected to arrive in the first and second quarters of 2027.\n\nIn a regulatory filing Monday, SpaceX said it signed a binding commitment with an Apollo-managed entity for roughly $40 billion in GPU financing.\n\nThe financing underscores the AI boom's enormous capital requirements, as technology companies pour billions of dollars into advanced chips and data centers to support increasingly powerful AI models.\n\nSpaceX has expanded aggressively into artificial intelligence this year, referring to the business as \"Super Intelligence,\" or SI.\n\nThe segment has become the company's largest business unit, with third-quarter revenue surging ninefold to $7.56 billion from $813 million a year earlier, according to its latest earnings release.\n\nMusk also said that debt markets have largely shut off access to financing for companies without substantial revenue outside AI data centers.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 06:36 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Anthropic IPO live updates: How the Amodei siblings, co-founders control voting shares", "full_content": "Anthropic is officially headed for the public market in what is expected to be a historic offering for a five-year-old company that's been at the heart of the generative artificial intelligence boom.\n\nIn a Form S-1 filing with the Securities and Exchange Commission , Anthropic said it plans to list on the Nasdaq under ticker symbol \"ANT.\"\n\nThe company behind Claude confidentially filed with the SEC in June, giving the agency time to review its financials before they were made available to the public and prospective investors.\n\nAnthropic CEO Dario Amodei co-founded the company in 2021 after he and a small group of researchers defected from OpenAI , now its chief rival. Anthropic's Claude model and services have captivated the corporate world, as companies have opened their wallets in an effort to crack new growth opportunities and find internal efficiencies.\n\nExpansion has accelerated in 2026, driven largely by the popularity of AI coding tool Claude Code , and powerful models including Claude Fable 5 and Mythos 5 . The company has been racing to maintain an edge over competitors like OpenAI and Google , and faced sharp criticism over its positions on safety, regulation and national security, leading to two high-profile disputes with the U.S. government in recent months.\n\nAnthropic's offering, if it doesn't get derailed, will land just a few months after Elon Musk's SpaceX debuted on the Nasdaq in by far the biggest IPO on record, ultimately raising $85.7 billion. It's been a volatile stretch for SpaceX shares, which finished last week slightly below where they opened in June.\n\nAs it prepares to hit the market, Anthropic has to contend with severe jitters on Wall Street as concerns grow over whether spending on AI services will justify the trillions of dollars in expected infrastructure costs.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 07:55 PM IST", "pub_date_relative": "2m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Alaska Senate: Peltola seeks quick dismissal of DOJ election lawsuit suit before midterm", "full_content": "The campaign of Alaska Senate Democratic nominee Mary Peltola asked a federal judge to fast-track a Trump administration lawsuit that could block certification of that election, so the judge can dismiss the suit before Election Day.\n\nA lawyer for Peltola's campaign and the Democratic Senatorial Campaign Committee in a court filing late Sunday said they are \"seriously concerned\" President Donald Trump and Attorney General Todd Blanche will use the lawsuit to \"lay the groundwork for unlawful efforts to challenge a potential Peltola victory\" if the complaint remains pending as of Nov. 3, the day of the election.\n\nThe Department of Justice filed the suit in U.S. District Court on Friday, and Trump later that day said he ordered it.\n\nThe DOJ's suit asks a judge to bar Alaska from certifying the Senate race results if incumbent Republican Sen. Dan Sullivan loses by a margin that could be attributable to voters mistakenly casting their ballots for another candidate, Daniel J. Sullivan.\n\nThe DOJ, in that case, would want an investigation to determine whether enough voters were confused by the men's names to swing the vote to another candidate, presumably the former Rep. Peltola. The DOJ claims that Daniel J. Sullivan's \"sole purpose\" of running \"is to benefit the Peltola campaign by reducing the number of votes for Senator Sullivan.\"\n\nThe winner of the race could determine which party holds a majority in the Senate starting in January.\n\nPeltola's campaign and the DSCC, in their court filing, asked that a judge order the DOJ to respond by their motion to intervene in the case, and their motion to dismiss the lawsuit by 5 p.m. Alaska Time on Tuesday, and to order a reply to that response by Wednesday.\n\n\"DOJ filed this lawsuit in the midst of the ongoing general election, less than two weeks before election day, raising issues governed exclusively by state law that were definitively resolved by the Alaska Supreme Court months ago,\" the filing says.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 07:49 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Anthropic IPO: Rising costs, risks, rapid growth mark AI frontrunner", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Anthropic IPO: Rising costs, risks, rapid growth mark AI frontrunner Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic IPO: Rising costs, risks, rapid growth mark AI frontrunner SECTIONS Anthropic IPO: Rising costs, risks, rapid growth mark AI frontrunner Reuters Last Updated: Oct 26, 2026, 07:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic, established by ex-OpenAI researchers, is gearing up for an anticipated entry into the stock market in the United States. The organization has impressively generated $16.29 billion in revenue during the first half of 2026. Yet, significant operational losses due to soaring computing costs pose a challenge, along with over $500 billion in cloud computing commitments. Competing against OpenAI and Google, they must adeptly maneuver through a tough economic environment.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 07:43 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic's top investors include Amazon, Google, Fidelity Management", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Anthropic's top investors include Amazon, Google, Fidelity Management General Insurance Corporation of India Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic's top investors include Amazon, Google, Fidelity Management SECTIONS Anthropic's top investors include Amazon, Google, Fidelity Management Reuters Last Updated: Oct 26, 2026, 07:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic is gearing up for its initial public offering, showcasing robust support from heavyweight investors like Amazon and Google. The company\u2019s valuation has surged through various funding rounds, signaling considerable confidence from the investment community. Collaborations with technology leaders provide vital resources essential for advancing AI development and infrastructure. Notable financial participants include ICONIQ Capital, Coatue Management, and Eric Schmidt, among several others.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 07:41 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Brazilian stocks rocked as Lula wins presidential election, Bolsonaro reportedly refuses to concede", "full_content": "Luiz In\u00e1cio Lula da Silva has won an unprecedented fourth term as Brazil's president, overturning a first-round loss to beat Senator Fl\u00e1vio Bolsonaro. The outcome triggered a sell-off in Brazilian assets as markets were caught off guard.\n\nLula took 51.8% of valid votes to Bolsonaro's 48.2%, according to the Superior Electoral Court, with nearly all ballots counted on Sunday.\n\nThe results are also historic as it's the first time since Brazil returned to direct elections in 1989 that a candidate has won the final runoff after losing in the first round.\n\nBrazilian stocks plunged following the unexpected victory, unwinding some of the rally from the first-round result three weeks earlier. That reflected expectations of more market-friendly policymaking by Bolsonaro and broader jitters around Brazil's debt and spending .\n\nThe iShares MSCI Brazil ETF was 25% lower at 10:30 a.m. ET, while trading on Brazil's stock exchange was halted by an automatic circuit breaker.\n\nU.S.-listed Brazilian companies also sold off. Energy giant Petrobras was last seen down 16%, banking group Ita\u00fa Unibanco fell 20%, brewer Ambev shed 10.3%, and mining firm Vale fell 1.2%. Aircraft manufacturer Embraer was 5% lower.\n\nThe Brazilian real meanwhile dropped 10.5% against the U.S. dollar to its lowest level since December 2025, according to LSEG data.\n\nThe Brazilian Treasury on Monday canceled auctions of inflation-linked and fixed-rate government bonds that had been scheduled for Oct. 27 and Oct. 29, saying in a notice that it would \"continue to monitor market conditions and act to ensure the proper functioning of the government bond market and other related assets.\" An auction of Treasury Financial Bills scheduled for Oct. 27 will go ahead.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 07:39 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic's filing for blockbuster US IPO shows key executives and board", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Anthropic's filing for blockbuster US IPO shows key executives and board Novartis India Share Price Abbott India Share Price GlaxoSmithKline Pharmaceuticals Share Price Pfizer Share Price AstraZeneca Pharma India Share Price Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic's filing for blockbuster US IPO shows key executives and board SECTIONS Anthropic's filing for blockbuster US IPO shows key executives and board Reuters Last Updated: Oct 26, 2026, 07:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In a significant step forward, Anthropic has filed for a US initial public offering, with hopes for a mid-November listing. Amid rising interest rate concerns and investor scrutiny over AI sector stock performance, the company is backed by a formidable leadership team. Co-founders Dario and Daniela Amodei lead this endeavor, promising a noteworthy entry into the public market for Anthropic.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 07:38 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Corporate Issuers", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bon Secours agrees $5.7bn takeover of Bain-backed Surgery Partners", "full_content": "US hospital chain is the latest not-for-profit healthcare provider to strike a large deal", "source": "FT Markets", "pub_date_str": "26 Oct 2026, 07:38 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Dhanteras 2026: Buying gold jewellery? Here's how to check purity, verify BIS hallmark and avoid costly mistakes", "full_content": "Buying gold jewellery during Dhanteras is a tradition for many Indian households. However, with gold prices remaining elevated, even a small difference in purity can result in a significant financial loss for buyers.\n\nBefore purchasing gold jewellery, consumers should check more than just the price and design. The Bureau of Indian Standards (BIS) has laid down guidelines covering gold hallmarking, purity verification, billing requirements and compensation for consumers who receive jewellery that does not meet the stated purity standards.\n\nHere is what buyers should know before purchasing gold this festive season.\n\nThe first step is to look for the BIS hallmark, which certifies the purity of gold jewellery.\n\nAccording to BIS, hallmarked gold jewellery carries three mandatory markings. These include the BIS logo, the purity of gold expressed in caratage and fineness, and a six-character alphanumeric Hallmark Unique Identification (HUID) code.\n\nFor instance, 22-carat gold is marked 22K916, indicating 91.6% gold content. Similarly, 18-carat gold carries the marking 18K750, indicating 75% gold content.\n\nConsumers should understand these differences because the price of jewellery depends partly on its gold content.\n\nA 22-carat ornament and an 18-carat ornament of identical weight should not be valued at the same gold rate, assuming other factors remain unchanged.", "source": "LiveMint Money", "pub_date_str": "26 Oct 2026, 07:38 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic begins countdown to IPO with prospectus filing", "full_content": "240,000-word prospectus lays out explosive growth alongside steep losses and daunting risk factors", "source": "FT Markets", "pub_date_str": "26 Oct 2026, 07:38 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Meta announces $95 billion stock offering to fund AI expansion", "full_content": "Meta said Monday it is planning to raise a total of $95 billion to support its investments in artificial intelligence infrastructure and superintelligence.\n\nThe stock was down 1.6% in morning trading after the announcement. Nvidia , Advanced Micro Devices and Broadcom were interested in purchasing up to $5 billion in shares, Meta said in a statement.\n\nThe tech giant will initially raise $35 billion in underwritten public equity offerings, before raising an additional $60 billion with an at-the-market program.\n\nThe news comes as hyperscalers pour record sums into the AI infrastructure build-out. Goldman Sachs estimates that AI-related capital spending could total about $7.6 trillion from 2026 through 2031, across compute, data centers and power.\n\nMeta's planned investments will support \"emerging AI opportunities\" including its family of apps, its AI agent Muse and its data center business, the company said Monday.\n\nIt plans to balance funding for these investments through a mix of operating cash flow, investment-grade debt, partnerships and equity capital.\n\nMeta is among the major hyperscalers that are increasingly tapping debt to fund the expensive infrastructure required for the AI boom.\n\nLast week, Meta posted third-quarter results showing revenue jumped 26% year on year: $64.60 billion versus the $63.37 billion analysts expected. However, investors focused more on the tech company's negative free cash flow and its higher full-year capital expenditure forecast.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 07:35 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Q2 Results Today LIVE Updates: Nazara Tech Swings To Profit; Tata Consumer Net Profit Rises 16%", "full_content": "Q2 Results Today LIVE: Paytm, Tata Consumer Products, ITC Hotels, Indian Overseas Bank, Bank of Maharashtra, REC, Mankind Pharma, Sunteck Realty, Ather Energy, Eris Lifesciences, Nazara Technologies, among other will announce Q2 results today.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:32 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "\u2018We don\u2019t have inflation\u2019? Five charts show the US economic reality of Trump\u2019s second term so far - The Guardian", "full_content": "\u2018We don\u2019t have inflation\u2019? Five charts show the US economic reality of Trump\u2019s second term so far The Guardian Trump failed to stop inflation. Now Republicans may pay the price in the midterm elections AP News Affordability Is Splintering the Voter Coalition Trump Built With Midterms at Stake Bloomberg.com How Trump\u2019s Economy Is Working in 7 Charts Barron's Trump promised $2 gas and cheaper groceries. Here\u2019s what voters got instead. NBC News", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:31 PM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Mortgage rates above 7% are the 'new normal'\u2014here's why", "full_content": "Everyone seems to agree that mortgage rates above 7% are the new \"normal.\"\n\nThe phrase keeps popping up lately in public comments from housing economists, including Lawrence Yun , chief economist for the National Association of Realtors, and Robert Dietz , chief economist for the National Association of Home Builders.\n\nIt's a sentiment increasingly reflected in forecasts, too, with major housing groups predicting mortgage rates will remain above 7% well into 2027. Fannie Mae forecasts mortgage rates could average 7.5% in 2027, while the Mortgage Bankers Association expects them to remain above 7% .\n\nThat means the 3% or 4% mortgage rates borrowers were used to in the years before 2022 are unlikely to return anytime soon.\n\n\"We could definitely see some movement up and down depending on data, but we're just not in the same economic environment we were in during the 2010s or the pandemic,\" says Jenna Stauffer, a broker and market analyst with Sotheby's International Realty.\n\nMortgage rates tend to move with the 10-year Treasury yield, which serves as a benchmark because mortgages are typically paid off or refinanced well before their 30-year term. And there are reasons to think those longer-term borrowing costs could remain elevated.\n\nOne is persistently high inflation. When inflation remains elevated, investors generally demand higher yields on long-term bonds to compensate for the declining purchasing power of the money they'll eventually be repaid. Inflation, as measured by the Fed's preferred PCE price index, hasn't been below the central bank's 2% target since February 2021 .\n\nBut inflation isn't the only factor. The federal government is borrowing heavily , while the artificial intelligence boom is fueling enormous private investment in data centers, power generation and other infrastructure, says Selma Hepp, chief economist at real estate data firm Cotality.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 07:30 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Stock Market Today: Dow Jones, Nasdaq Jump On Anthropic IPO Interest, Falling Oil Prices", "full_content": "Oil prices moved lower, with Brent crude futures falling 1.4% to $115.02 a barrel and US West Texas Intermediate declining 2% to $101.01 a barrel.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:28 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "A Rout in Brazilian Financial Markets - WSJ", "full_content": "A Rout in Brazilian Financial Markets WSJ Live Coverage: Lula, Bolsonaro Face Off in Brazil Presidential Runoff Election Bloomberg.com Why is MercadoLibre stock plunging today? Investing.com StoneCo Sinks 29%, Inter & Co Down 36%, PagSeguro Down 25% on Lula\u2019s Unexpected Election Win TIKR.com StoneCo (NASDAQ:STNE): What Drove the 33.36% Decline in the Early Session? kalkine.ca", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:26 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Anthropic opens books on AI's explosive growth and staggering costs", "full_content": "Anthropic unveiled its US IPO filing on Monday, laying out its ambitions to build AI systems capable of transforming the global economy while confronting the costs and challenges of developing the technology.\n\nThe prospectus highlights Anthropic's rapid growth over the past year, fuelled by Big Tech's breakneck spending that has driven a rally in AI stocks while raising concerns about lofty valuations and rising debt.\n\nThe IPO is expected to establish Anthropic, the AI lab behind the viral Claude models, as a benchmark for how Wall Street values leading AI companies, including rival OpenAI.\n\nAnthropic is pressing ahead with its IPO plans even as a once-busy fall listing calendar has thinned out, with market volatility prompting companies to delay offerings. The IPO would give Anthropic access to a deep pool of capital to fund its costly AI ambitions, which require heavy investment in computing infrastructure to develop and operate sophisticated models.\n\nGlobal equities have sold off sharply as investors grow uneasy with the debt-fueled AI investment boom and start to doubt if the trillions being poured into data centers, chips and computing capacity will generate returns fast enough to support lofty valuations. Higher borrowing costs and rising bond yields have added to their caution.\n\nSome current and prospective investors are valuing Anthropic at about $1.5 trillion, down from roughly $2 trillion a week ago, after the AI startup disclosed some financial details at a recent investor event, Reuters reported.\n\nThe filing confirmed a series of Reuters exclusives that offered an early peek at its contents before Anthropic made it public, including details of its financial performance, growth trajectory and IPO plans.\n\nThe IPO comes as Anthropic's own research raises concerns about advanced AI systems, which in controlled tests have demonstrated behaviors including code sabotage, fraud assistance and information manipulation.", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 07:13 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Corporate Issuers", "Fixed Income", "Alternative Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Neocloud stocks fall as Elon Musk says more than 200 of them face 'guppy-level death'", "full_content": "Shares of major neocloud stocks fell on Monday after Elon Musk said that more than 200 companies in the sector could collapse.\n\nNebius and CoreWeave dropped around 4%, adding pressure to a sector already facing investor concerns about debt-fueled expansion and whether the large AI infrastructure buildout will generate returns. Iren was last trading down 3.2%.\n\n\"As of the past few weeks, debt markets have almost entirely shut off access to money for any company that doesn't have substantial revenue independent of AI data centers,\" Musk, CEO of SpaceX and Tesla , said on a post on X on Sunday.\n\n\"That means the 200+ neoclouds are going to see guppy-level death and consolidation. Some will make it through, but not many,\" he added.\n\nMusk's SpaceX operates its own data centers through which it sells computing capacity. SpaceX is a direct competitor to the neoclouds which also rent compute.\n\nCoreWeave, Nebius and Iren shares over the past five days. Musk was replying to a post on X by Chamath Palihapitiya, the founder of Social Capital, who laid out his views on the state of the data center buildout. He suggested that there will be \"a lot of partially stranded compute and compute sitting in inventory in 2027 than is currently forecasted,\" which will be \"bought and paid for but effectively underearning (below total cost of capital) or collecting dust.\"\n\n\"2027 will be a turbulent year because it will clear out a bunch of wrong/bad bets. It will also be a consolidation year for a few,\" Palihapitiya said.\n\nNeocloud stocks have taken a hammering over the past month, with CoreWeave and Nebius down more than 30% while Iren has tanked 40%. The sell-off started earlier this month after the spread on CoreWeave's five-year credit default swaps hit levels generally viewed as signs of distress. The yields on CoreWeave's bonds also climbed.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 07:13 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks today: US stocks open higher as Anthropic's IPO filing sharpens AI focus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a dend Declared - Check Record Date", "full_content": "DCM Shriram reported a 33.5% year-on-year decline in Q2 net profit to Rs 105 crore, even as revenue rose 21.6% to Rs 3,977 crore.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:11 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Verizon lifts annual forecasts, signs more than $2 billion AI infrastructure deal with AWS", "full_content": "Verizon raised its annual forecast for wireless subscriber additions on Monday, betting on strong demand for its simplified \u2060plans, and signed an AI infrastructure deal worth more than $2 billion \u200bwith Amazon Web Services.\n\nFor \u200bthe third \u200bquarter, the telecom carrier reported nearly double the analysts' estimate for monthly-bill-paying wireless subscriber gains at 406,000, against Visible \u2060Alpha \u200cexpectations of 209,439.\n\nVerizon now expects \u2060to add between 1.1 million and 1.2 million postpaid phone subscribers this year compared with earlier projections of 750,000 to 1 million\n\nIt \u200calso raised its full-year adjusted earnings per share forecast to $5.04 to $5.06, from $4.99 to $5.04 earlier\n\nHowever, \u200bthird-quarter revenue of $34.3 billion fell short of analyst estimates of $34.74 billion, according to LSEG data\n\nRevenue was pressured by lower device upgrade volumes \u2060as customers held on to their phones longer after Verizon began cutting \u200cdevice subsidies\n\nA year into CEO \u200cDan Schulman's tenure, Verizon has pursued a broad overhaul of its business, restructuring operations and simplifying its wireless offerings\n\nIt \u2060launched its Simplicity plan in June, introducing transparent pricing and \u2060unlimited data", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 07:05 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stocks Gain Before Tech Earnings as Oil Declines: Markets Wrap - Bloomberg.com", "full_content": "Stocks Gain Before Tech Earnings as Oil Declines: Markets Wrap Bloomberg.com See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:04 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic Files SEC Form For US IPO To Go Public On Nasdaq; Goldman Sachs, Morgan Stanley Among Lead Bookrunners", "full_content": "Anthropic has not disclosed the number of shares it plans to sell or the expected price range in the filing.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:03 PM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "The stock market\u2019s biggest test in weeks is here", "full_content": "Here\u2019s what\u2019s I\u2019m watching this morning: A week chockablock with enough catalysts that we might finally get some answers about the direction of the market by the end of it.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Oct 2026, 07:03 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Audi CEO faces backlash after joining Trump at midterm campaign rally - Reuters", "full_content": "Audi CEO faces backlash after joining Trump at midterm campaign rally Reuters Audi plans first US factory in Georgia with $4bn investment Yahoo Finance Trump reveals Audi's ambitious plans for a major expansion in the US Fox Business Audi defends plans for a $4 billion Georgia plant amid VW restructuring, tariffs CNBC Audi Announces Its First U.S. Factory; Nvidia, Micron Drive Earnings Boom WSJ", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 07:01 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "REC Q2 Results: Net Profit Drops 21% Despite Record Disbursements, AUM Boost; Dividend Declared", "full_content": "REC's asset quality remained strong, with net NPA at 0.11% as of Sept. 30, 2026.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 07:00 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic IPO: It\u2019s official now! Artificial intelligence giant files papers to sell shares to public for first time", "full_content": "Anthropic, the artificial intelligence startup behind the Claude family of AI models, has filed papers for its initial public offering (IPO) on Monday with SEC, setting the stage for a closely watched technology listing amid growing concerns over AI valuations and rising investment costs.\n\nThe IPO is expected to provide a benchmark for how Wall Street values leading AI companies, including rival OpenAI. It would also give Anthropic access to capital to fund its ambitions, which require substantial investment in computing infrastructure to develop and operate advanced AI models.\n\nAnthropic intends to list its Class A common stock on the Nasdaq Global Select Market under the symbol \u201cANT.\u201d The number of shares of Class A common stock to be offered and the price range for the proposed offering have not yet been determined. The group owns in total about 1.7 billion Class A shares.\n\nThe filing comes as market volatility and rising interest rates have prompted several technology and AI infrastructure companies to delay their planned listings.\n\nAnthropic is planning to hold its IPO around the middle of next month, with its prospectus expected to be made public as early as late October, people familiar with the matter told Reuters. The timeline remains subject to change.\n\nThe company is expected to begin marketing its shares to prospective investors during the week of November 9, Reuters reported quoting sources. Anthropic declined to comment on the reported plans.\n\nThe listing stands out as other AI infrastructure and data-centre companies reconsider their IPO timelines amid rising borrowing costs and concerns about the sustainability of AI spending.\n\nIn June, the Claude make has confidentially filed with the SEC, giving the agency time to review its financials before they were made available to the public and prospective investors", "source": "LiveMint Markets", "pub_date_str": "26 Oct 2026, 06:59 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Oil prices fall as Saudi defense minister travels to Iran for talks to de-escalate conflict", "full_content": "Crude oil prices fell Monday as Saudi Arabia's defense minister travelled to Tehran to meet with senior Iranian officials.\n\nU.S. West Texas Intermediate futures slid 1.2% to $102.05 a barrel by 9:19 a.m. ET, while Brent crude futures declined 0.7% to $115.86 a barrel.\n\nThe pullback followed a sharp rally on Friday as repeated attacks by Iran-allied Houthi militants on Saudi Arabia have reignited fears of further disruptions to global energy supplies.\n\nSaudi Defense Minister Prince Khalid bin Salman will meet Monday with Iranian President Masoud Pezeshkian and National Security Council chief Mohsen Rezaei in an effort to de-escalate tensions, according to the Saudi Foreign Ministry.\n\nPakistan's Army Chief of Staff Asim Munir and the head of Turkish intelligence Ibrahim Kalin are also participating in the talks. Pakistan and Turkey are members of a defense pact with Saudi Arabia.\n\nTensions remained elevated over the weekend as the Houthis said they had targeted Saudi Arabia's main airport in Riyadh and oil facilities on Saturday. Saudi authorities said Sunday that they had intercepted additional missiles and drones.\n\nOil prices year-to-date The kingdom partially resumed operations at its main airport on Sunday despite damage from earlier attacks, even as the Houthis threatened further strikes.\n\nThe continued hostilities have heightened concerns about the vulnerability of Saudi Arabia's energy infrastructure, with traders increasingly focused on the risk of a major disruption to production, refining or export facilities.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 06:58 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Anthropic files for US IPO amid AI boom, rising costs and safety concerns", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Anthropic files for US IPO amid AI boom, rising costs and safety concerns Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Anthropic files for US IPO amid AI boom, rising costs and safety concerns SECTIONS Anthropic files for US IPO amid AI boom, rising costs and safety concerns ETMarkets.com Last Updated: Oct 26, 2026, 07:01:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Anthropic has filed for a US IPO to support its ambitious AI development plans and secure funding. The company's recent financial details show significant revenue growth, but losses have widened sharply. Investors are currently valuing Anthropic at approximately $1.5 trillion, reflecting recent market fluctuations. Anthropic is in competition with OpenAI in the race to create advanced AI systems.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "26 Oct 2026, 06:52 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "'What Will You Do By Knowing?' How To Break The Silence Around Mothers And Wealth in Our Homes", "full_content": "From a UPI payment to a Rs 100 SIP, here's how small steps can help your mother become financially confident, whatever her age.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 06:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Anthropic IPO live updates: AI lab lost $80.7 billion in first half of 2026 - CNBC", "full_content": "Anthropic IPO live updates: AI lab lost $80.7 billion in first half of 2026 CNBC Anthropic Reveals 14-Fold Increase in Growth as It Prepares for Blockbuster I.P.O. The New York Times Claude says Anthropic's IPO is a buy. ChatGPT disagrees Axios Stock Market Today: AI Giant Anthropic Unveils Paperwork for Blockbuster IPO \u2014 Live Updates WSJ How this Anthropic investor is thinking through its IPO filing Yahoo Finance", "source": "Google News Business", "pub_date_str": "26 Oct 2026, 06:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Didn't Get Jio Shares? Rs 4.7 Lakh Crore Is Coming Back To Investors' Accounts", "full_content": "Jio Platforms' record IPO tied up far more money than it needed. With allotment due, about Rs 4.7 lakh crore of bids that will not turn into shares is set to be released back to investors.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 06:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Apollo to buy nearly 10% stake in Abu Dhabi-backed alternative asset manager Mubadala Capital", "full_content": "Investing giant Apollo Global Management is finalizing a deal to buy nearly a 10% stake in Mubadala Capital, the alternative asset manager subsidiary of Abu Dhabi's sovereign wealth fund, Mubadala Investment Co., according to people familiar with the matter who spoke on condition of anonymity.\n\nThe deal is expected to be announced later Monday morning, they said. Financial terms were not immediately known.\n\nThe transaction is significant on multiple fronts. It further advances Apollo's ambitions in Abu Dhabi often called the \"capital of capital.\" The firm has spent the past 15 years building key strategic relationships there, with both the country's investment arm and its core leadership.\n\nApollo already has a multibillion-dollar partnership with Mubadala Investment Co., first established in 2022 and extended two years ago. At the time of that extension, Apollo said the agreement would strengthen the firm's Capital Solutions platform by enabling the firms to jointly source and provide customized debt and equity financing to companies worldwide.\n\nIn 2023, the institutions formed a $2.5 billion joint venture designed specifically to co-invest in global private credit opportunities over a five-year horizon.\n\nFor Mubadala Capital specifically \u2014 the region's only large-scale asset manager, advising and administering more than $755 billion in assets \u2014 the deal further advances its growth strategy under the direction of CEO Hani Barhoush, and its relevance on the global investing stage. It also marks an inflection point for the company's core alternatives business, which has grown to more than $60 billion.\n\nApollo Global Management, YTD John Zito, co-president of Apollo's Asset Management arm, and Barhoush have worked closely together over the past several years and, according to sources, their close-knit relationship and the success of prior partnerships led to talks of deepening ties.", "source": "CNBC Top News", "pub_date_str": "26 Oct 2026, 06:39 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Breaking down Anthropic\u2019s 335-page S-1", "full_content": "Anthropic\u2019s planned listing could be the biggest stock market debut in history", "source": "FT Markets", "pub_date_str": "26 Oct 2026, 06:38 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "SpaceX closes $40 billion debt deal for AI chips, Elon Musk says", "full_content": "SpaceX has closed $40 billion in debt financing to buy graphics processing units, or GPUs, used to power artificial intelligence systems.\n\nIn a post on X on Sunday, SpaceX CEO Elon Musk said it had closed the financing, adding that the company was investment grade and generated revenue from its Starlink satellite internet and rocket launch businesses.\n\nIn a follow-up post , he added that the financing primarily consisted of callable debt for graphics processing units, which are expected to arrive in the first and second quarters of 2027.\n\nIn a regulatory filing Monday, SpaceX said it signed a binding commitment with an Apollo-managed entity for roughly $40 billion in GPU financing.\n\nThe financing underscores the AI boom's enormous capital requirements, as technology companies pour billions of dollars into advanced chips and data centers to support increasingly powerful AI models.\n\nSpaceX has expanded aggressively into artificial intelligence this year, referring to the business as \"Super Intelligence,\" or SI.\n\nThe segment has become the company's largest business unit, with third-quarter revenue surging ninefold to $7.56 billion from $813 million a year earlier, according to its latest earnings release.\n\nMusk also said that debt markets have largely shut off access to financing for companies without substantial revenue outside AI data centers.", "source": "CNBC World Economy", "pub_date_str": "26 Oct 2026, 06:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Zepto To Snabbit: List Of LinkedIn\u2019s Top 10 Startups In India For 2026", "full_content": "From quick commerce and artificial intelligence to gaming and jewellery, LinkedIn\u2019s 2026 ranking features 10 emerging Indian startups attracting talent and gaining business momentum.", "source": "NDTV Profit", "pub_date_str": "26 Oct 2026, 06:33 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fanatics teams up with OpenAI for new AI-powered shopping suggestion feature", "full_content": "At any given moment, Fanatics offers more than 1.5 million unique SKUs for sports fans to buy \u2014 from jerseys and hats to team-branded streetwear and socks. The search for those items is getting easier with a new feature called \"Shop the Look,\" created with the help of OpenAI's Codex.\n\nFanatics' product assortment reflects its rise into a massive sports-industry platform, with deals with nearly every major sports league and team worldwide. Each year, Fanatics Commerce manufactures more than 45 million items and sells them to customers in more than 180 countries.\n\nBut Justin Tsai, chief product officer for Fanatics Commerce, said that growth has also created a challenge for the company.\n\n\"One problem we just kept seeing was that our customers come to our sites, and we operate hundreds of these sites \u2026 their challenges are that they're always trying to look through our very large catalog to figure out what they can buy,\" he said.\n\nTsai said customers' shopping sessions routinely ran over 30 minutes on average, and that time kept compounding as Fanatics released upwards of a thousand new products each week.\n\n\"Shop the Look\" suggests coordinated outfits on each product page, matching those items with other in-stock items based on team and intended style.\n\nTraditional shopping curation
