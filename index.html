day as hawkish commentary and recent economic data cemented expectations for an interest rate hike next month. [USD/]", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dollar firmer as hawkish Waller backs aggressive Fed action", "full_content": "* Waller says Fed needs more aggressive response to inflation\n\nNEW YORK, Nov 18 (Reuters) - The dollar touched a fresh 19-month high on Wednesday as hawkish commentary from influential US Federal Reserve Governor Christopher Waller and recent economic data cemented expectations for an interest rate hike next month.\n\nFed Chairman Kevin Warsh's refusal to offer forward guidance has made investors more reliant on economic data and commentary from other policymakers to gauge the Fed's next move.\n\nWaller said on CNBC that if the central bank wants to get inflation down it needs to take more \"aggressive action\" either through a half-point increase at the December meeting, or using the post-meeting statement to set market expectations for further hikes.\n\nHotter-than-expected inflation data last week have left markets fully pricing a 25-basis-point rate hike in December, and seeing a small chance of a 50-bp rise, the CME Group's FedWatch Tool showed. Data on Tuesday showed US retail sales increased moderately in October, reinforcing expectations for a rate hike next month.\n\n\"The Federal Reserve seems at the moment to be very determined to hike interest rates and maybe even aggressively do so,\" said Juan Perez, senior director of trading at Monex USA in Washington.\n\n\"That's the belief right now that's carrying the US dollar,\" Perez said.\n\nFed officials saw a growing risk last month that they might need to intensify their efforts to control inflation, even as they agreed to keep interest rates steady for the moment, the minutes of their October 27-28 meeting showed on Wednesday.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 01:34 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "I watched Trump, Xi and Putin gather in China. Here are my top takeaways", "full_content": "SHENZHEN, China \u2014 It took a trip to China for me, an American, to see U.S. President Donald Trump in person for the first time.\n\nTrump emerged from a group of black-clad photographers and other personnel surrounding him at a welcome banquet in Shenzhen for the Asia-Pacific Economic Leaders' Meeting held Nov. 17 to 19.\n\nSeated just a few spots to his left was Russian President Vladimir Putin who picked up a glass of red wine to join a toast led by Chinese President Xi Jinping .\n\n\"At tomorrow's Leaders' Meeting, we will discuss measures to expand mutual opening up, explore pathways to innovation-driven growth, and identify opportunities to expand practical cooperation across various fields, so as to translate more initiatives into tangible results,\" Xi said in Mandarin, according to a CNBC translation.\n\nXi was speaking broadly, but Thursday's agenda includes a bilateral meeting with Trump, and their highly anticipated trilateral meeting with Putin.\n\nBut looking at the mood in the room, it seemed that their trilateral conversation had already started Wednesday night at their long banquet table. Much of what happens at APEC, including bilateral meetings and other exchanges between leaders, takes place away from the media.\n\nBut what struck me was how little sign there was of the tension surrounding Nvidia 's CEO Jensen Huang resignation, a controversy that has gripped markets for the past 10 days.\n\nAhead of Trump's entrance into the banquet hall, Chinese Commerce Minister Wang Wentao shared a friendly moment with U.S. Treasury Secretary Scott Bessent and other members of the American delegation.", "source": "CNBC Finance", "pub_date_str": "19 Nov 2026, 01:17 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Why Anthropic's hot IPO is bringing out sellers \u2014 plus, a silver lining of the down market", "full_content": "Every weekday, the Investing Club releases the Homestretch; an actionable afternoon update just in time for the last hour of trading.", "source": "CNBC Top News", "pub_date_str": "19 Nov 2026, 01:16 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Fed officials expect more rate hikes, worry about AI impact on inflation, minutes show", "full_content": "Federal Reserve officials expressed confidence in October that further interest rate increases will be needed to stem inflation, though they decided to hold off while gathering more information, according to meeting minutes released Wednesday.\n\nPolicymakers put artificial intelligence at the core of their discussions, indicating that demand associated with the technology would be \"a material source of inflation risk.\"\n\nMore broadly, officials said \"inflation pressures in the economy were broad based\" and would warrant action, with \"some\" policymakers advocating for a quarter percentage point hike at the meeting. A couple of participants even noted the possibility that a larger increase might be needed at the next policy meeting in December.\n\nThe meeting summary said \"almost all participants judged that, under their baseline outlooks for inflation and the labor market, further action to raise the target range for the federal funds rate \u2026 would likely be appropriate, in order to ensure a timely return of inflation to the 2 percent objective.\"\n\nIn a CNBC interview Wednesday, Fed Governor Christopher Waller reiterated his belief that the Federal Open Market Committee should consider a half-point hike in December.\n\nOfficials at the meeting expressed a high level of concern over AI, both as a source of inflation and financial instability.\n\nFed staff members who briefed participants noted \"that off-balance-sheet leasing commitments and circular financing arrangements among AI-related firms could amplify losses if returns on AI investment were to disappoint.\"\n\n\"Most participants observed that AI-related debt had grown rapidly and that much of this growth had taken place through complex and opaque financing structures,\" the minutes said. \"A few participants remarked that AI-related exposures were becoming increasingly concentrated among a small number of firms.\"", "source": "CNBC Finance", "pub_date_str": "19 Nov 2026, 01:11 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "I\u2019m in my 40s. Should I accept a lower pension in exchange for naming my husband or child as a beneficiary?", "full_content": "\u201cIf I die before my husband, he will receive a lifetime pension equal to 50%\u201366% of my monthly benefit.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "19 Nov 2026, 01:00 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Fed policymakers focused on inflation risks in October, with some seeing need for bigger rate hike", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Fed policymakers focused on inflation risks in October, with some seeing need for bigger rate hike Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Fed policymakers focused on inflation risks in October, with some seeing need for bigger rate hike SECTIONS Fed policymakers focused on inflation risks in October, with some seeing need for bigger rate hike Reuters Last Updated: Nov 19, 2026, 12:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Federal Reserve officials noted a greater risk of inflation requiring more action during their October meeting. Although they decided to keep interest rates steady, discussions indicated a potential need for a half-percentage-point increase. Policymakers expressed concerns over persistent inflation that might not ease quickly enough. The forthcoming December meeting could see intense debates on potential rate hikes and policy adjustments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Nov 2026, 12:55 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Nvidia interim CEO Kress tells employees \u2018let\u2019s move forward\u2019 at first all-hands meeting since Jensen Huang exit", "full_content": "Interim Nvidia CEO Colette Kress told employees \"let's move forward\" on Wednesday during the company's first all-hands meeting since founder Jensen Huang resigned, according to an attendee who spoke to CNBC on the condition of anonymity.\n\nKress was joined by newly appointed board chair Harvey Jones and hyperscale and high-performance computing head Ian Buck. Several other senior members of Nvidia's executive team spoke, including long-time company veteran Jeff Fisher, senior vice president of GPU engineering Jonah Alben, executive vice president in charge of Operations Debora Shoquist and co-founder Chris Malachowsky, according to a person familiar with the matter.\n\nKress opened with the message about moving forward, and also brought up pay raises for employees, according to the attendee. Jones then pivoted to a discussion about the search for the next CEO, the attendee added. The meeting lasted about an hour and was in person as well as streamed on Microsoft Teams.\n\nThe general sentiment swirling in the room, according to the attendee, is that employees want Huang to come back . Employees have spoken up on X in recent days to call for the return of Huang as CEO, and one senior employee reportedly sent a letter to the board warning Nvidia would lose \"irreplaceable talent\" if it doesn't consider reinstating Huang.\n\nBut another person familiar with the matter disagreed, saying that employees welcomed the remarks from leadership as well as the visibility into company leadership.\n\n\"The Nvidia board unanimously accepted his resignation and does not intend to reinstate Jensen as CEO,\" Jones said during the earnings call on Tuesday.\n\nDespite recent turmoil, Wednesday's meeting was not out of the ordinary. Nvidia typically holds all-hands the morning after quarterly earnings reports, according to a former employee who spoke to CNBC on the condition of anonymity.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 12:51 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Fed Minutes Show Almost All Officials Expect More Rate Hikes - Bloomberg.com", "full_content": "Fed Minutes Show Almost All Officials Expect More Rate Hikes Bloomberg.com Fed officials expect more rate hikes, worry about AI impact on inflation, minutes show CNBC Fed's Waller doubles down on a jumbo rate hike in December, sees more hikes to come Yahoo Finance The Fed's next moves come into focus Axios Fed Saw Need to Keep Raising Interest Rates Despite Holding Steady in October The New York Times", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 12:48 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stocks Fall as Nvidia\u2019s Earnings Rally Sputters: Markets Wrap - Bloomberg.com", "full_content": "Stocks Fall as Nvidia\u2019s Earnings Rally Sputters: Markets Wrap Bloomberg.com Nvidia stock erases earnings pop as investors face life after Jensen Huang Yahoo Finance Nvidia Stock Faces the Icarus Test After Huang's Exit - NVIDIA (NASDAQ:NVDA) Benzinga Nvidia Stock Is One of the Best Deals on Offer With 1 Big Catch Barron's It\u2019s Hard to Protect Your Nest Egg from Nvidia WSJ", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 12:34 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Buy, Sell Or Hold: Tata Motors, Infosys, LIC, Yes Bank, Tanla Platforms, UltraTech Cement, And More | Ask Profit", "full_content": "Market experts shared their insights on fundamentals and technical levels for key stocks.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:31 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO - CNBC", "full_content": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO CNBC Why the Anthropic IPO could be a trap for investors Yahoo Finance Anthropic promises to pursue humanity\u2019s benefit. Its IPO filing gives it wiggle room AP News Anthropic and the Monetization of Paradise The New Yorker Anthropic Said to Be Weighing IPO Price as High as $85 Per Share Bloomberg.com", "source": "Google News Business", "pub_date_str": "19 Nov 2026, 12:13 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Retail investor enthusiasm for Anthropic IPO to rival SpaceX debut", "full_content": "Retail investor Dan Shetty is so eager to get in on the Anthropic initial public offering that he \"drained\" his Roth IRA and moved roughly $12,000 from Fidelity to Robinhood for a chance to participate.\n\n\"I don't want to tell my grandkids that I didn't invest in Anthropic and I didn't invest in OpenAI during the AI bubble,\" he said.\n\nShetty's enthusiasm is shared by many, with excitement among small investors for the blockbuster IPO expected to be off the charts. Vanda Research estimates that Anthropic could see approximately $250 million of retail net buying when it starts trading Thursday, double the size of SpaceX's IPO.\n\n\"That would be far and away the largest amount of net retail buying of any stock that we've seen in our data on the first day of its listing,\" Jai Malhi, senior strategist at Vanda, said in an interview with CNBC.\n\nThe artificial intelligence laboratory \u2014 which will trade on the Nasdaq under ticker symbol ANT \u2014 is selling 825 million shares at an expected price range of $70 to $78 per share in the IPO, though sources told CNBC the stock is likely to price above that range . Individual investors are expected to be allocated as much as 20% in that initial offering. And if Vanda's figures prove correct, the buying enthusiasm will be big as regular trading begins.\n\nFounded less than six years ago, Anthropic aims to raise as much as $64.4 billion, giving it a valuation of $1.405 trillion. If demand is especially strong, Anthropic could even raise more than the record $85.7 billion that SpaceX sold in its record IPO in June.\n\nThe tech trade has been in turmoil since Jensen Huang's departure last week as Nvidia CEO raised questions about the future of AI financing.", "source": "CNBC World Economy", "pub_date_str": "19 Nov 2026, 12:12 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Wall Street Sees More Mega Debt Deals Using Paramount Blueprint", "full_content": "(Bloomberg) -- Skydance Corp.\u2019s $52 billion bond and loan sale is set to serve as a model for future jumbo credit financing, with Morgan Stanley predicting Wall Street will pull off even bigger deals using the unusual combination of investment-grade and junk-rated debt.\n\nJoe Bishay, Morgan Stanley\u2019s head of leveraged finance capital markets for Europe, Middle East and Africa said that the September deal backing the acquisition of Warner Bros. Discovery Inc. by the media company \u2014 then known as Paramount Skydance \u2014 is an indication of what\u2019s to come in the credit markets next year.\n\n\u201cParamount showed that $50 billion-plus was doable, especially when you have a mixture of investment-grade and sub-investment grade,\u201d Bishay said Wednesday at Bloomberg\u2019s Global Credit Forum in London. \u201cI think we will continue to see that structure or similar structures going forward. And I think the sizes are going to go up.\u201d\n\nSkydance took the unconventional step of issuing investment-grade debt, including $30 billion of bonds, alongside the riskier speculative-grade paper that often backs big buyouts. The safer debt carried stronger ratings because its first-lien claim on Paramount\u2019s assets put them first in line for repayment in a default. But the junk piece lacked covenants widely used in the high-yield market. Skydance offered yields as high as about 9% to entice investors.\n\nIts offering was part of a record $1.9 trillion of investment-grade debt sold by US companies this year. Meanwhile, bankers in Europe wrapped up their best year for high-fee leveraged-loan M&A financing in five years, with dealmakers remaining bullish on issuance next year.\n\nHowever, they are sounding caution on rising rates, particularly for junk-rated companies.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 12:11 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Anthropic IPO set to raise $90.4 billion, could become biggest stock market debut ever", "full_content": "Anthropic PBC is poised to make history with what could become the biggest initial public offering (IPO) ever, as the artificial intelligence company moves closer to pricing its shares above the proposed range despite recent volatility in technology stocks.\n\nThe maker of the Claude AI chatbot has indicated to prospective investors that it expects to price its shares above the initial range of $70 to $78, according to a Bloomberg report citing a person familiar with the matter.\n\nAnthropic and its seven co-founders are offering a combined 825 million shares in the IPO. At the upper end of the proposed price range, the offering, including a $26 billion private placement, could raise approximately $90.4 billion.\n\nThis would surpass the previous record set by SpaceX, whose base offering raised $75 billion. The transaction would also give Anthropic a fully diluted valuation of approximately $1.4 trillion.\n\nInvestor interest in the offering has reportedly been strong, with bankers informing investors that the IPO is close to seven times oversubscribed, Bloomberg reported.\n\nThe strong demand comes despite a difficult environment for technology stocks. The Nasdaq 100 Index is heading towards a five-day losing streak, having declined 5.3% during the period.\n\nShares of Nvidia, which is purchasing approximately $10 billion worth of Anthropic stock through the private placement, also came under pressure. The chipmaker's stock fell as much as 1.4% on Wednesday, a day after reporting earnings that exceeded market expectations.\n\nAnthropic's strong revenue growth prospects could support substantial demand from institutional and retail investors, according to Bloomberg Intelligence analysts.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 12:10 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Anthropic\u2019s IPO by the Numbers: Taking on SpaceX\u2019s Record Debut", "full_content": "(Bloomberg) -- Anthropic PBC is preparing to price what could be the biggest IPO of all time, and the numbers are startling. The AI lab is set to challenge SpaceX for the record, which Elon Musk\u2019s rocket and satellite firm claimed in June with a first-time share sale that rocked markets.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.\n\nLog in to our website to save your bookmarks. It'll just take a moment.\n\nOops! Looks like you have exceeded the limit to bookmark the image. Remove some to bookmark this image.", "source": "LiveMint Markets", "pub_date_str": "19 Nov 2026, 12:04 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stocks To Watch Today: Genus Power, Sky Gold Diamonds, Phoenix Mills And Bharat Forge", "full_content": "Here's a look at stocks that are likely to be in focus during the trading session on Thursday.", "source": "NDTV Profit", "pub_date_str": "19 Nov 2026, 12:00 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Stocks making the biggest moves Wednesday: ExxonMobil, TJX, Take-Two Interactive, Cal-Maine & more", "full_content": "Nvidia wavered after the embattled chipmaker reported quarterly figures that beat expectations and issued strong guidance.\n\nTake-Two Interactive also got a boost ahead of the release of \"Grand Theft Auto VI\", while Lowe's shares pulled back following the company posting third-quarter results.\n\nFollow along as CNBC covers the biggest stock market moves of the day.\n\nCompanies tied to cybersecurity gained in Wednesday's trading on the heels of a warning from the Cybersecurity and Infrastructure Security Agency of a \"critical Java vulnerability.\"\n\nThe federal agency warned on Tuesday that organizations should \"immediately patch\" a memory-corruption vulnerability that's known as \"Java4Shell.\"\n\nThe Global X Cybersecurity ETF (BUG) was last up 6%, n as CEO last week. So let's check in with Colette Kress, Nvidia's longtime chief financial officer and now its interim CEO. Ms. Kress, welcome to \"Mad Money.\"\n\nColette Kress: Thank you for having me, Jim. It's really great to see you.\n\nCramer: Thank you, Colette. The most important thing I heard tonight was that you increased your revenue growth forecast for next year. Previously, you said you would grow 70%. Now you're saying 75%, off of a higher base. How are you able to do that?\n\nKress: Thanks. Very, very important to understand how much our customers are interested in our compute infrastructure and how much they need the agentic solutions out there. So the most important thing that we have been seeing is just, again, a continuous growth in terms of the demand that's out there. But we also have been working in terms of our supply.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 11:44 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Investigators make progress in hunt for cause of FAA ground stop", "full_content": "Engineers and analysts searching for the root cause of the technical issues behind Friday's nationwide ground stop by the Federal Aviation Administration have been able to replicate the situation that was overwhelming parts of the air traffic system, people familiar with the investigation told CNBC.\n\nWhile replicating the issue in a lab in Florida is progress, those investigating the matter have yet to determine exactly why two routers in question failed, according to the people, who requested anonymity to talk about an ongoing situation. Finding the root cause is critical to the FAA determining if there may be an issue with other routers that form the backbone of communications for the national air transportation network.\n\nThe ground stop lasted for more than four hours Friday, marking the longest halt to U.S. flight departures since 9/11.\n\nTransportation Secretary Sean Duffy and FAA Administrator Bryan Bedford have said there is no indication the routers failed due to a cyberattack.\n\nThe incident in question happened shortly after L3Harris Technologies , the primary contractor supporting the FAA telecommunications network, installed a new router at a facility in El Dorado, Arkansas.\n\nL3Harris said that it, in partnership with other tech companies, has completed more than 70% of the planned airspace communications conversion from legacy copper wires to a fiber-optic system.\n\n\"We are supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel,\" the statement said. \"L3Harris takes the nationwide ground stop and its impact on travelers, airlines and air traffic operations seriously.\"\n\nInvestigators said within eight minutes of its installation, the router began to transmit too much data within the FAA network.", "source": "CNBC Top News", "pub_date_str": "18 Nov 2026, 11:43 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Nvidia\u2019s Kress faces a divided workforce as some employees push for Huang\u2019s return", "full_content": "The day before Colette Kress led her first earnings call as Nvidia's interim CEO, she did not want to talk about her predecessor, Jensen Huang .\n\n\"This is a new era for Nvidia,\" she told employees in an internal meeting on Monday, according to a person present, who spoke on the condition of anonymity. When someone brought up Huang, Kress quickly changed the subject, according to the person.\n\nOn Wednesday, Kress addressed the whole company at the first Nvidia all-hands meeting since the public chaos over Huang's affair with an alleged Chinese spy and other reported relationships. And while Kress will be tasked with filling the leadership vacuum created by Huang's departure, she is also tamping down public calls to bring him back.\n\nHuang himself weighed in with his first public statement Tuesday saying he would be \"honored\" to return to Nvidia.\n\nKress, who has served as the company's CFO since 2013, must steady employees and convince customers and investors that Nvidia can execute on its ambitious targets without the man who made them.\n\nAt Wednesday's meeting with staffers, Kress was joined by newly appointed board chair Harvey Jones as well as Ian Buck, who oversees Nvidia's hyperscale and high performance computing business, according to an attendee.\n\nKress' message was, \"Let's move forward,\" said the person, who asked not to be named because the event was private.\n\nNvidia's leaders have made clear that the board does not plan to bring Huang back.", "source": "CNBC World Economy", "pub_date_str": "18 Nov 2026, 11:41 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Stock Market: Nasdaq preparing to roll out 23-hour-a-day trading from this date \u2013 Key facts for investors", "full_content": "New trading schedule will operate five days a week, expanding access to US equities for global investors while retaining the regular market session and investor safeguards", "source": "LiveMint Markets", "pub_date_str": "18 Nov 2026, 11:24 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mahanadi Coalfields IPO: LIC Takes A Quarter Of Rs 2,295 Crore Anchor Book", "full_content": "LIC emerged as the biggest investor in Mahanadi Coalfields' anchor book, picking up shares worth Rs 568 crore. The Rs 8,981-crore IPO opens on No     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
