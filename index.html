<script>
    // This variable will be injected during the build process
    const allData = {"general": [{"title": "Mint Money Festival | Building retirement corpus is only half the battle: PFRDA's Randip Singh Jagpal", "full_content": "Building a retirement corpus is only one part of pension planning. Ensuring that the money lasts through old age, provides a predictable income, and meets healthcare expenses is equally important, said Randip Singh Jagpal, whole-time member (law) at the Pension Fund Regulatory and Development Authority (PFRDA).\n\nSpeaking at a fireside chat titled \u2018Beyond building a corpus: India\u2019s next retirement playbook\u2019 at the Mint Money Festival 2026 on Saturday, Jagpal outlined the regulator\u2019s efforts to make the National Pension System (NPS) more accessible through simpler onboarding, greater investment flexibility, and new retirement income options.\n\nThe PFRDA is also looking to reduce the friction involved in opening an NPS account. \u201cThe biggest hurdle in getting people onboarded was the time it used to take for people to open their accounts,\u201d Jagpal said.\n\nTo address this, the PFRDA recently introduced Tatkal NPS, a three-click account-opening facility linked to an individual\u2019s existing bank account through Unified Payments Interface (UPI). Subscribers can enter their date of birth and registered mobile number, select their UPI-linked bank account and validate the details. Since the bank has already carried out know-your-customer check, the information can be used to open an NPS account without a separate verification process. \u201cIt\u2019s under a minute that we do the entire transaction,\u201d he said.\n\nThe regulator is also looking to improve returns by allowing greater equity exposure. Under the Multiple Scheme Framework (MSF), pension fund managers can offer schemes with equity exposure of up to 100%, allowing subscribers with a longer investment horizon to take on greater market risk.\n\nOn withdrawals, Jagpal said the regulator had reduced the minimum lock-in period to 15 years to strike a balance between allowing subscribers access to their money and preserving the benefits of compounding.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 02:19 PM IST", "pub_date_relative": "10m ago"}, {"title": "India inflation may rise in coming months on weather, supply risks: Govt report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India inflation may rise in coming months on weather, supply risks: Govt report The Economic Times daily newspaper is available online now. Read Today's Paper India inflation may rise in coming months on weather, supply risks: Govt report SECTIONS India inflation may rise in coming months on weather, supply risks: Govt report Reuters Last Updated: Nov 28, 2026, 02:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's upcoming festive and wedding seasons could lead to increased inflation driven by food and non-food costs. Continued geopolitical tensions in the Middle East may affect oil prices and freight rates significantly. Despite uncertainties, domestic demand and industrial activity are currently supporting economic growth effectively. The Indian economy appears resilient with strong fundamentals and macroeconomic buffers in place to face challenges. Retail inflation has already reached 6.\n\nKYC and KYB: Zydus Lifesciences \u2013 From sales to profit, how Zydus earns. Part 2 of 3\n\nHow rare is Nvidia's CEO comeback, really? The record for 20 years has an answer\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "28 Nov 2026, 02:15 PM IST", "pub_date_relative": "14m ago"}, {"title": "Top stocks to buy on Monday, 30 Nov: Choice Broking's Kkunal V recommends three shares for next week | Target, stop loss", "full_content": "POWERINDIA Vaamanaa Sethi Published 28 Nov 2026, 02:04 PM IST Prefer Livemint on Google Top stocks to buy : Snapping its two-session winning streak, the benchmark equity indices ended sharply lower on Friday, with the Sensex plunging nearly 989 points and the Nifty slipping below the 25,650 mark. The decline was driven by profit-booking in IT and banking stocks amid a surge in crude oil prices.\n\nThe 30-share BSE Sensex plunged 989.33 points, or 1.17%, to close at 83,339.26. During the session, the index fell as much as 1,120.26 points, or 1.32%, to hit an intraday low of 83,208.33. The 50-share NSE Nifty dropped 277.30 points, or 1.07%, to settle at 25,607.20.\n\nNifty closed the week at 25,607.20, declining 193.40 points (-0.75%), snapping its four-week winning streak. The index started the week on a positive note at 25,929.15, up around 128 points, but witnessed sharp profit booking on the first trading day after touching the weekly high of 25,992.60 and the weekly low of 25,343.85.\n\nOn the technical outlook, brokerage firm Choice Broking said that the weekly candlestick formation indicates a lower shadow, suggesting buying interest at lower levels despite the initial selling pressure.\n\n\u201cOn the weekly chart, Nifty continues to trade above its 50-week EMA, currently positioned around 24,165, while the 200-week EMA near 22,515 continues to reflect a positive longer-term trend structure. The 26,000\u201326,300 zone remains an important overhead resistance area, while the earlier breakout region around 24,800\u201325,000 is likely to act as an immediate support base. Sustaining above these levels will be important for maintaining the broader recovery structure,\u201d the firm said.\n\nBank Nifty closed the week at 63,040.90, declining 1,594.30 points (-2.47%) and snapping its four-week winning streak. The index started the week on a positive note at 65,012.05, opening around 375 points higher than the previous week's close.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 02:04 PM IST", "pub_date_relative": "25m ago"}, {"title": "Mint Money Festival | Trust is the wealth that keeps Indian markets moving: NSE CEO Ashish Chauhan", "full_content": "Ananya Grover Published 28 Nov 2026, 01:54 PM IST Prefer Livemint on Google If companies perform well and deliver returns to investors, trust in India\u2019s markets will continue to grow. If they fail to do so, that trust will gradually erode,\u201d said Ashish Chauhan, managing director and chief executive of the National Stock Exchange of India Ltd, in his opening address at the Mint Money Festival on Saturday.\n\nHe described the growing participation of Indian households in stock markets as evidence of significant trust built over time.\n\nWhen people invest in companies, they expect them to put that capital to productive use, grow their businesses, and generate returns. The relationship between companies and investors, Chauhan said, rests on trust and strong corporate governance is essential to sustaining it.\n\nHe described money as a bridge of trust between today and tomorrow. \u201cWhen someone lends money today expecting it to be returned tomorrow, it is a leap of faith. Nobody has seen tomorrow; it is trust that makes such an arrangement possible.\u201d\n\nHe said that, just as blood in the human body carries nutrients to cells and removes waste, the financial system moves resources from places where they are in excess to parts of society that need them. \u201cWithout blood, there is no life and without money or finance, there is no society.\u201d\n\nHe said money is also used for transacting, saving, lending, and borrowing. Referring to the book In Debt: The First 5,000 Years , Chauhan said people are indebted from birth to death to their ancestors, parents and friends, and these relationships are interconnected.\n\nFor societies to function, trust must be mutual and the long-term fundamentals of policy, he said, are built on trust. Chauhan traced the changing forms of money, from gold and commodities such as salt to coins and paper currency. While the form and value of money have changed over time, its role as a bridge between today and tomorrow remains important.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 01:54 PM IST", "pub_date_relative": "34m ago"}, {"title": "Gold and silver prices recover, but Fed rate-hike risks persist: Where could prices head in six months? Expert views", "full_content": "Gold and silver prices have staged a rebound over the past three days. However, concerns over further US Federal Reserve rate hikes could limit the recovery, with both metals still trading below their January peaks of around \u20b9 1.8 lakh per 10 grams for gold and \u20b9 4.20 lakh per kg for silver.\n\nOn the Multi Commodity Exchange (MCX), gold futures for December delivery settled at \u20b9 1,25,350 per 10 grams, up 0.12%. Silver futures gained 4.80% to \u20b9 1,52,843 per kg on Friday, 27 November.\n\nIn the international market, spot gold is trading at $3,653.55 per ounce, up 1.97%, while spot silver rose 5.28% to $43.73 per ounce as of 1:04 PM on 28 November, according to TradingView data.\n\nGold prices are closely linked to US Federal Reserve interest rate decisions. The Fed's next Federal Open Market Committee (FOMC) meeting is scheduled for December 8\u20139, with its interest rate decision expected on December 9.\n\nThe Fed raised interest rates by 25 basis points in September, taking the federal funds target range to 3.75%\u20134%. This was its first rate hike since 2023. At its subsequent October meeting, the FOMC kept rates unchanged at the same level.\n\nAccording to the CME FedWatch Tool, markets are pricing in a 98.4% probability of a 25-basis-point Fed rate hike, taking the target range to 4.00%\u20134.25%, as of 28 November.\n\nHigher interest rates generally put pressure on gold because it is a non-interest-bearing asset and does not generate regular income, unlike bonds. When interest rates rise, interest-bearing investments become more attractive, reducing gold's appeal.\n\nHigher US rates can also strengthen the dollar and push bond yields higher, making gold relatively less attractive to investors. Silver can also face pressure from these developments, alongside changes in industrial demand.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 01:54 PM IST", "pub_date_relative": "34m ago"}, {"title": "United Fidelity shut by regulators in biggest U.S. bank failure in two years", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 01:52 PM IST", "pub_date_relative": "37m ago"}, {"title": "Gold loan borrowers face higher LTV risk as prices fall: Why lenders may seek additional gold or part-payment", "full_content": "The price of 24K gold has declined substantially since its peak of about \u20b9 1.80 lakh per 10 grams in January this year. As of today, gold prices in the international markets are hovering around $3,650 per ounce, and MCX gold prices closed at \u20b9 1,26,000 per 10 grams in the previous trading session. Thus marking a nearly 30-31% decline from its peak.\n\nNow, it is important to keep in mind that falling gold prices can increase the loan-to-value (LTV) ratio of existing gold loans, leaving borrowers with a smaller collateral cushion and potentially exposing them to demands for additional security, backing, or part-payment from lending institutions.\n\nThis risk arises because the outstanding loan amount does not automatically decline when gold prices drop. Therefore, as the market value of the pledged jewellery decreases, the LTV ratio rises , thus increasing the lender\u2019s exposure.\n\nKeeping these aspects in mind, let us discuss gold loans in detail along with the basic concept of the loan-to-value ratio. This will help aspiring borrowers plan their future gold loans effectively.\n\nFor example, suppose a borrower pledges gold worth \u20b9 1 lakh and takes a loan of \u20b9 70,000 at a 70% LTV ratio. Later on, if gold prices decline by 20%, then the collateral value drops to \u20b9 80,000, whereas the outstanding loan remains \u20b9 70,000. As a consequence, the LTV ratio rises to 87.5%.\n\nTherefore, such a decline in gold prices reduces the collateral cushion available to the lender. The impact can be particularly significant for borrowers who took loans when gold prices were considerably higher.\n\nAs per the revised RBI guidelines as of 1 April 2026, lenders must follow a tiered LTV structure based on the loan amount. The details of the same are as follows.\n\nAdhil Shetty, CEO of BankBazaar, in a conversation with Mint, explained this aspect in detail, stating that lenders may take corrective measures when falling gold prices push existing loans beyond the prescribed LTV limits.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 01:50 PM IST", "pub_date_relative": "38m ago"}, {"title": "Delhi Crime: 28-Year-Old Man Killed After LPG Cylinder Thrown From Third-Floor Balcony In Bindapur", "full_content": "Accused was subsequently detained in connection with the incident. Police have registered a murder case under Section 103 of the Bharatiya Nyaya Sanhita (BNS).", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:38 PM IST", "pub_date_relative": "50m ago"}, {"title": "Bisleri Disputes FSSAI Findings On West Bengal Batch, Cites Clean Reports From Two Independent Labs", "full_content": "The company says two independent laboratories found the batch within safety standards, while the regulator's labs reported coliform bacteria.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:36 PM IST", "pub_date_relative": "53m ago"}, {"title": "Air Quality On November 28: How Bad The Aqi In Your City Today?", "full_content": "Air quality across India's major metropolitan cities continues to vary, with Mumbai and Ahmedabad recording moderate to unhealthy AQI levels of around 120\u2013166. Although air in northern cities remains above healthy limits.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:33 PM IST", "pub_date_relative": "56m ago"}, {"title": "Boris Vuj\u010di\u0107: Interview with Kurier", "full_content": "What is the value of the euro and the euro area in uncertain times like these?\n\nVuj\u010di\u0107: The value of the euro area and the euro is particularly high for a country during times of crisis. We\u2019ve seen this over the years. In times of great uncertainty, during crises, when yields and spreads are rising or there are tensions in financial markets, the real benefits of the euro become very clear. I can tell you this, because I was in charge of the monetary policy of a small, open economy close to the euro area for 25 years. In good times, it made less difference whether a country was in the euro area or not. It\u2019s in times of crisis that the difference was stark.\n\nKocher: The euro is particularly valuable for Austria as an open and highly export-oriented economy. The single currency facilitates trade and investment, eliminates exchange rate risks within the euro area, and provides a reliable framework for businesses and households. In times of economic and geopolitical uncertainty, being part of a strong monetary union is a major advantage. The euro also gives Europe greater weight on the international stage.\n\nVuj\u010di\u0107: There are a few examples \u2013 from the global financial crisis, the euro sovereign debt crisis and the pandemic. Just before Croatia joined the European exchange rate mechanism, the currency market was under such pressure in the spring of 2020 that it was really difficult to keep the exchange rate stable. That\u2019s when we entered into a swap agreement with the European Central Bank (ECB). As soon as that was in place, the market upheaval calmed down. This is a clear example of how important the euro can be. Access to a swap line in such a situation acts as a shield. In effect, we went from a high-pressure situation where we had to make significant market interventions and deal with ballooning interest rates to a much more stable phase.", "source": "ECB Press", "pub_date_str": "28 Nov 2026, 01:30 PM IST", "pub_date_relative": "59m ago"}, {"title": "UK Student Visa Rules Change from November 30: Why Indians Must Recheck Their Bank Balance", "full_content": "Under UK immigration rules, applicants relying on personal or parental savings must maintain the amount in their banks for consecutive 28 days.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:28 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bhogi Box Office Collection Day 1: Sharwanand Starrer Opens On A Positive Note", "full_content": "Directed by Sampath Nandi, Bhogi is a Telugu action drama starring Sharwanand, Anupama Parameswaran and Dimple Hayathi in the lead roles.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold, silver prices stage stunning comeback after 15-month low: Can the rally sustain? Key levels, trading strategy", "full_content": "Gold, Silver prices : Gold and silver prices have staged a sharp comeback after plunging to multi-month lows earlier this week, raising hopes that the worst of the recent selloff may be over. Bullion's recovery has come alongside a rebound in global equities, easing pressure from the technology-led market rout and bargain hunting at lower levels.\n\nHowever, with US inflation remaining elevated and expectations of further Federal Reserve rate hikes persisting, investors are still waiting for confirmation that the recovery can turn into a sustained rally.\n\nPrecious metals recovered sharply in the final trading session of the week ended November 27, 2026. Spot gold rose 3% to $3,672.19 an ounce on Friday, while US gold futures gained 3.9% to $3,671.90. Spot silver advanced 6.6% to $44.2755 an ounce.\n\nOn the MCX, December gold futures settled at \u20b9 1,22,272 per 10 grams, up 0.94%, while December silver futures closed at \u20b9 1,45,843 per kg.\n\nThe rebound followed a volatile week. MCX gold had fallen from the previous Friday's close of \u20b9 1,22,055 to below \u20b9 1,17,906 on Wednesday, before recovering sharply over the final two sessions. It ended the week with a gain of more than 3%, snapping a two-week losing streak.\n\nSilver saw an even steeper correction, falling nearly 7% from \u20b9 1,47,658 to a 14-month low near \u20b9 1,37,728. It subsequently recovered around 12% from its low, with December futures touching an intraday high of \u20b9 1,54,804 on Friday. The contract finished the week nearly 4% to 4.8% higher.\n\nThe Thanksgiving holiday in the US helped cool technology-market volatility and eased selling pressure on bullion. US equities rallied as investors bought beaten-down technology shares, while the pause in trading activity reduced the risk of further forced liquidations.\n\nRoss Maxwell, chief strategy officer at VT Markets, said: \"Although gold has attempted to stabilise following its recent losses, investors remain cautious.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 01:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tata Trusts' Legal Challenge Can Wait: Why Bombay HC Let Tata Sons Board Meet On Nov 30", "full_content": "The court was examining whether allowing the November 30 meeting to proceed would cause prejudice that could not be remedied later.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Is the U.S. tariff wall here to stay? ING weighs in", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 01:17 PM IST", "pub_date_relative": "1h ago"}, {"title": "BV Financial director sells $16,754 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 01:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "Artesian Resources director sells $63,554 in common stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 01:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Naam Hai Tera 2.0 Is Coming, Himesh Reshammiya Reveals Release Date And First Details", "full_content": "Himesh Reshammiya has announced Naam Hai Tera 2.0, a fresh version of his much loved track Naam Hai Tera.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:14 PM IST", "pub_date_relative": "1h ago"}, {"title": "U.S. military repelled drones at UK airbase this month, FT reports", "full_content": "The U.S. military repelled a half dozen drones swarming Britain's RAF Lakenheath base earlier this month, the Financial Times reported on Saturday, saying Iran was suspected of being linked to the incident.\n\nThe newspaper, citing people familiar with the matter, said the U.S. deployed counter-drone technology to repel the unmanned aerial systems but that the drones were not retrieved by British or American personnel.\n\nAsked for comment on the report, a spokesperson for the UK's Ministry of Defence told Reuters in an emailed statement: \"Ministry of Defence Police and Suffolk Police worked closely with USAF Security Forces to respond to reports of unauthorised drone activity at RAF Lakenheath on 13 November and the situation was quickly resolved, with RAF Lakenheath returning to normal security and force protection measures.\"\n\nThe White House and Pentagon did not immediately respond to requests for comment.\n\nIn the incident, U.S. Air Force personnel at the base responded to \"suspected unauthorised drone activity\", and an Air Force spokesperson said at the time that no personnel, aircraft or infrastructure were affected.\n\nIn a September incident at RAF Fairford , another British base used by the U.S. Air Force, a threat linked to Iran prompted the removal of American B-1 bombers, President Donald Trump said last month.\n\nTehran has rejected accusations of involvement in the Fairford incident or other malign activity in Britain, where the authorities have \u200bfor years accused Iran of being involved in plots and attempted assassinations against dissidents and Israeli and Jewish targets.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 01:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Netanyahu Ready To Serve As Second PM In Rotation With Eisenkot, Say Reports", "full_content": "Israel voted on October 27 and no bloc reached the 61 seats needed in the 120-member Knesset. Netanyahu's Likud-led bloc won 53 seats, Eisenkot's allies 48 and Arab-led parties 19.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "30,000 Applicants, 1,000 Seats: Delhi University's 10% PG Expansion Plan Faces Pushback", "full_content": "Academic Council members and critics have said that adding 10 per cent of the current intake in two-year postgraduate courses will not help students", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Italy Approves School Face-Covering Ban, Restricting Burqas, Niqabs During Activities", "full_content": "The new legislation caps students of foreign origin at 30% in first-year classrooms, exempting those proficient in Italian, and introduces Italian-language courses for foreign parents to aid school integration.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold price prediction 2027: Should investors buy yellow metal after the recent correction? Experts' views", "full_content": "Gold price prediction 2027 : Gold prices have witnessed a sharp correction in November 2026, with MCX futures falling significantly from their record levels amid a stronger US dollar, rising bond yields and concerns over further interest-rate hikes by the US Federal Reserve. The sell-off pushed the yellow metal towards \u20b9 1.17 lakh per 10 grams, marking one of its steepest corrections this year as investors reduced their exposure to precious metals.\n\nHowever, gold prices staged a strong rebound towards the end of the month as buyers stepped in at lower levels. MCX gold recovered around 2.8% during the week to close near \u20b9 1,25,198 per 10 grams, signalling renewed buying interest after the sharp decline.\n\nGold's performance in 2026 has been shaped by a combination of geopolitical developments, US monetary policy expectations, currency movements and investor positioning.\n\nWhile geopolitical tensions typically support safe-haven demand, higher crude oil prices have fuelled inflation concerns and strengthened expectations that the US Federal Reserve could keep interest rates higher for longer or consider further hikes. A stronger US dollar and elevated bond yields have also weighed on gold, making the non-yielding asset less attractive.\n\nAshish Rajodiya, Head of Commodities at PL Capital, said the recent selling in gold and silver has largely been led by futures funds and concerns over Fed rate hikes rather than long-term investors. He added that physical buyers have stepped in during the price decline.\n\nThe recent correction has therefore not necessarily changed the longer-term investment case for gold. However, the direction of US interest rates, the dollar and central-bank purchases will remain important factors influencing prices in the coming months.\n\nGold prices could recover in 2027 if expectations of further US rate hikes ease and the dollar weakens.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 01:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Pensions and benefits services still down after 'cyber incident' - BBC", "full_content": "Pensions and benefits services still down after 'cyber incident' BBC Millions lose access to benefits and pensions services after 'cyber incident' BBC UK pensions department hit by 'serious' cyber incident, minister says Reuters Temporary disruption to some DWP online services GOV.UK Government told to \u2018wake up\u2019 to cyber threat after DWP hit by \u2018serious\u2019 incident The Independent", "source": "Google News Business", "pub_date_str": "28 Nov 2026, 12:56 PM IST", "pub_date_relative": "1h ago"}, {"title": "Gold rally puzzles investors: Prices rise despite stronger dollar and higher yields; expert sees \u20b91.50 lakh in one year", "full_content": "Gold prices in India rose for the third consecutive day on Friday, 27 November, closing at \u20b9 1,25,350 per 10 grams. The precious metal gained more than 0.12% on MCX, putting it on course to snap a two-week losing streak.\n\nIn the international market, spot gold is trading at around $3,654 per ounce, up 2.44%, as of 11:52 PM on 28 November. The recovery comes despite a challenging global environment, as rising bond yields and a stronger US dollar generally put pressure on gold prices.\n\nThe next US Federal Open Market Committee (FOMC) interest rate decision is scheduled for 9 December.\n\nGold is a non-interest-bearing asset and does not generate regular income, unlike bonds. Therefore, higher interest rates generally make interest-bearing investments more attractive, reducing gold's appeal.\n\nA stronger US dollar makes gold more expensive for buyers using other currencies, while higher bond yields make gold less attractive compared with interest-paying investments. Both can put pressure on gold prices.\n\nAs of 28 November, the US Dollar Index had risen 0.20% over the past five sessions to 104.01, while the US 10-year Treasury yield stood at 4.93%, up 9.2 basis points over the past year. However, gold has continued to recover despite these headwinds.\n\nKaynat Chainwala, AVP \u2013 Commodity Research, Kotak Neo, said spot gold was trading near $3,670 per ounce, with prices recovering as a rebound in technology stocks and a softer US dollar eased liquidation pressure earlier in the week. Gold has gained more than 4% so far this week, recovering some of its recent losses.\n\n\u201cWhile prices could extend higher toward $3,750/oz for gold, upside is likely to be capped as the macro backdrop remains challenging, with a hawkish Fed outlook and strong US data,\u201d she added.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 12:52 PM IST", "pub_date_relative": "1h ago"}, {"title": "Leather Jacket Off, Rulebook Too | Joining The Dots", "full_content": "Jensen Huang is back, APL Apollo investors want answers and India's business families are in court. What connects them is power.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 12:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "RBI Steps Up Gold Loan Scrutiny As Bullion Rout Signals Strain", "full_content": "IIFL Finance's nonperforming assets in the gold portfolio edged higher to 0.9% of total loans as of end-September, from 0.6% in the prior quarter.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 12:47 PM IST", "pub_date_relative": "1h ago"}, {"title": "RBI steps up scrutiny of gold loans as bullion price slump raises collateral risks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a RBI steps up scrutiny of gold loans as bullion price slump raises collateral risks The Economic Times daily newspaper is available online now. Read Today's Paper RBI steps up scrutiny of gold loans as bullion price slump raises collateral risks SECTIONS RBI steps up scrutiny of gold loans as bullion price slump raises collateral risks By Siddhi Nayak , Bloomberg Last Updated: Nov 28, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's Reserve Bank is monitoring the gold-loan sector due to falling bullion prices and potential borrower distress. The sector has expanded significantly, but recent price drops could lead to loan delinquencies. Borrowers may need to pledge additional collateral or repay debts as their gold loans become inadequately backed. Encounters of repayment stress are already visible among major lenders such as IIFL Finance and Bajaj Finance.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nKYC and KYB: Zydus Lifesciences \u2013 From sales to profit, how Zydus earns. Part 2 of 3\n\nHow rare is Nvidia's CEO comeback, really? The record for 20 years has an answer\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?", "source": "Economic Times Economy", "pub_date_str": "28 Nov 2026, 12:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Concurrent Gainers: 9 stocks that gain for 5 days in a row", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News Concurrent Gainers: 9 stocks that gain for 5 days in a row Written by Rounak Khare , ETMarkets.com | Nov 28, 2026, 12:42:46 PM IST 1 / 10 Consistent Gainers Over the five trading sessions ending November 27, the Sensex declined 1.17%, or 989.33 points, to close at 83,339, marking gains in three of the five sessions. Around 9 stocks from the BSE 500 index advanced in all five consecutive sessions from November 19 to 27, delivering cumulative returns ranging from 5% to 17%. (Data Source: ACE Equity)", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 12:36 PM IST", "pub_date_relative": "1h ago"}, {"title": "Dunzo's Collapse To $1.5 Billion AI Venture: How Mukund Jha Made A Stunning Comeback With Emergent", "full_content": "Mukund Jha studied at MNNIT Allahabad before pursuing a master's degree at Columbia University.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 12:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Natural Gas Services Group CEO buys $8,250 in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 12:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u20b950 lakh HDFC Bank home loan for 20 years: How much EMI will you pay at 8%, 9% and 10% interest?", "full_content": "Taking a \u20b9 50 lakh home loan for 20 years can mean a substantial financial commitment, with the monthly EMI and the total interest outgo depending on a host of factors such as the applicable interest rates, the individual applicant, and their past payment history, credit score and overall credit profile.\n\nIt is vital to keep in mind that even a relatively minor-looking 1 percentage point difference in the interest rates can significantly change and alter the repayment cost an individual pays over the complete loan tenure.\n\nThis write-up is dedicated to understanding the possible implications of a percentage-point difference in home loan rates and how it can result in meaningful financial outgoings over the years.\n\nAs per the HDFC Bank's home loan EMI calculator, a borrower aspiring to avail a \u20b9 50 lakh loan for 20 years will be required to pay a monthly EMI of \u20b9 41,822 at 8% interest. Let us now compare the three different cases of home loans at 8%, 9% and 10%.\n\nAt an annual interest rate of 8%, the monthly EMI works out to \u20b9 41,822. Over 20 years, the borrower will pay approximately \u20b9 50.37 lakh in interest, taking the total repayment to a little more than \u20b9 1 crore. The complete details as per the HDFC Bank calculator are presented below.\n\nNow, if the interest rate increases to 9% while the other parameters remain the same, the monthly EMI rises to \u20b9 44,986. The total interest outgo also increases to nearly \u20b9 58 lakh over the repayment period . Highlighting how the burden of debt silently rises over the years with just a minor increase in the interest rates. The complete calculations of the same are as follows:\n\nThis is yet another interesting case for aspiring borrowers to carefully observe. In this case, where at 10% interest, the monthly EMI increases further to \u20b9 48,251.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 12:26 PM IST", "pub_date_relative": "2h ago"}, {"title": "LIC portfolio stocks! 10 stocks where LIC had the highest stake in Q2. How many do you own?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News LIC portfolio stocks! 10 stocks where LIC had the highest stake in Q2. How many do you own? Written by Veer Sharma , ETMarkets.com | Nov 28, 2026, 12:32:34 PM IST 1 / 11 Portfolio Watch Life Insurance Corporation of India (LIC) holds significant stakes in several companies across different sectors of the Indian stock market. Data for the quarter ended September 30, 2026, highlights the 10 companies in which the insurer had its highest shareholding, along with their respective market capitalisations and LIC's ownership percentages. Here\u2019s the full list.\n\nLife Insurance Corporation of India (LIC) held a 49.24% stake in IDBI Bank as of September 30, 2026. The bank had a market capitalisation of Rs 82,191 crore.\n\nLIC held a 45.24% stake in LIC Housing Finance as of September 30, 2026. The company had a market capitalisation of Rs 26,953 crore.\n\nLIC owned a 16.45% stake in ITC as of September 30, 2026. The company had a market capitalisation of Rs 3,23,162 crore.\n\nLIC held a 13.47% stake in NMDC Steel as of September 30, 2026. The company had a market capitalisation of Rs 11,007 crore.\n\nLIC owned a 13.12% stake in Mahanagar Telephone Nigam as of September 30, 2026. The company had a market capitalisation of Rs 1,434 crore.\n\nLIC held a 13.07% stake in Larsen & Toubro as of September 30, 2026. The company had a market capitalisation of Rs 5,01,789 crore.\n\nLIC owned a 12.14% stake in Dr. Reddy's Laboratories as of September 30, 2026. The pharmaceutical company had a market capitalisation of Rs 1,02,624 crore.", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 12:23 PM IST", "pub_date_relative": "2h ago"}, {"title": "Take An 80% Pay Cut, Relocate To India Or Quit by Dec 31: IBM Employee Highlights Career Dilemma", "full_content": "IBM has not announced any uniform salary reduction for employees accepting overseas assignments outside the US.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 12:22 PM IST", "pub_date_relative": "2h ago"}, {"title": "Iran war intensifies maritime risks as OPEC+ prepares for oil supply talks", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 12:22 PM IST", "pub_date_relative": "2h ago"}, {"title": "Multibagger circuit-to-circuit stock jumps 2350% in 2026, hits 5% upper circuit for 14 days in a row | Do you own?", "full_content": "Multibagger Circuit-to-Circuit Stocks in India: Shares of Mrugesh Trading Ltd have been on an uptrend for a long time. However, the stock has found no seller for the last 14 straight sessions, hitting the 5% upper circuit since 9 November 2026. Mrugesh Trading Ltd share price has rallied from \u20b9 5.73 to \u20b9 140.54 per share on the BSE , delivering over 2,350% returns to its shareholders in YTD. In six months, this multibagger stock has risen over 280%, whereas in one month, this circuit-to-circuit stock has almost doubled shareholders' money by rising 95%.\n\nOn Friday last week, Mrugesh Trading Ltd touched the upper circuit and finished at \u20b9 140.54 per share, which is its lifetime high as well. So, in other words, the multibagger circuit-to-circuit stock has been hitting a record high on a regular basis while finding no seller during the trading session on Dalal Street.\n\nThe commodity trading company\u2019s recent share price performance has coincided with an improvement in its financial performance. For the quarter ended September 2026, Mrugesh Trading reported total income of \u20b9 2.19 crore, an increase of approximately 123% compared with \u20b9 98.3 lakh in the corresponding quarter of the previous year. Net profit stood at \u20b9 14.2 lakh, against a net loss of Rs. 2.90 lakh in the year-ago period.\n\nProfitability indicators also improved during the quarter, with the operating profit margin moving from a negative 2.95% to more than 14%, and the net profit margin increasing from a negative 2.95% to 8.28%.\n\nThe multibagger stock Mrugesh Trading Ltd finished on Friday with a market capitalisation of \u20b9 10,150 crore. The trade volume of the BSE-listed stock on Friday was above 2.03 lakh. This means the multibagger stock, which has remained as one of the circuit-to-circuit stocks in the Indian stock market these days, is a high float stock.\n\nMrugesh Trading is engaged in commodity trading, with a focus on agricultural commodities and bulk goods.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 12:12 PM IST", "pub_date_relative": "2h ago"}, {"title": "Top stocks to watch on Monday, Nov 30: Suzlon, Zee, Tata Group stocks, KEC, Bosch, APL Apollo, among 10 shares in focus", "full_content": "UJJIVANSFB null KEC SUZLON Pranati Deva Published 28 Nov 2026, 11:56 AM IST Prefer Livemint on Google Stocks to watch : After a volatile, holiday-shortened week that snapped the domestic market's four-week winning streak, investors will track a fresh set of corporate announcements, order wins and regulatory developments on Monday, November 30. Suzlon Energy , Tata Group companies, Zee Entertainment, KEC International , Bosch and APL Apollo are among the stocks likely to remain in focus.\n\nThe Nifty 50 declined 0.75% over the week, while the Sensex shed 0.69%, as rising crude oil prices, a weaker rupee and selling in heavyweight stocks weighed on sentiment. Here are 10 stocks to watch at the start of the next trading week.\n\nSuzlon Energy bagged India's first wind repowering project from the Tata Group. According to Suzlon Group CEO Ajay Kapur, the initial order is small, but the opportunity is significant, with wind repowering representing a potential 25 GW market. The government had announced a wind repowering policy three years ago to replace ageing, low-capacity turbines.\n\nTata Sons' board meeting scheduled for November 30 will proceed after the Bombay High Court refused to stay or defer it. However, the outcome will remain subject to the final decision in ongoing legal proceedings concerning Tata Trusts' affirmative voting rights. The trusts had approached the court seeking an injunction, alleging that the Tata Sons chairman's casting vote was used to override the mandatory voting rights of their nominee directors.\n\nBosch has fixed December 24, 2026, as the deemed date of allotment for its bonus shares. The company will submit the necessary documents to depositories for crediting the shares by noon on that day. The bonus shares are scheduled to become available for trading from December 28.\n\nAPL Apollo Tubes said SEBI has extended the deadline for Tata Steel's open offer to acquire up to a 26% stake in the company to December 8, from December 1.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 11:56 AM IST", "pub_date_relative": "2h ago"}, {"title": "Atif Aslam Sings Dhurandhar's Jaan Se Guzarte Hain At Dubai Concert: 'Crossover Nobody Could Have Scripted'", "full_content": "During his recent concert in Dubai, Atif Aslam performed Jaan Se Guzarte Hain, from Ranveer Singh\u2019s Dhurandhar.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 11:55 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bisleri In Trouble Again: West Bengal Water Sample Tests Positive For Coliform Bacteria", "full_content": "Bisleri International maintained on Monday that its packaged drinking water products are safe for consumption.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 11:54 AM IST", "pub_date_relative": "2h ago"}, {"title": "Defense company Chemring protects NATO fleets. Here's why an activist investor wants it to break up", "full_content": "A hedge fund activist says a Chemring overhaul could unlock up to 80% share upside in the defense stock.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 11:45 AM IST", "pub_date_relative": "2h ago"}, {"title": "Shah Rukh Khan Shares A Fun Father-Son Moment As AbRam Teaches Him Aura Farming", "full_content": "Shah Rukh Khan recently shared a fun moment with his youngest son, AbRam, while speaking at the King event in Mumbai.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 11:44 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bond market to stay cautious ahead of RBI policy: Equirus", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Bonds \u203a Bond market to stay cautious ahead of RBI policy: Equirus Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Bond market to stay cautious ahead of RBI policy: Equirus SECTIONS Bond market to stay cautious ahead of RBI policy: Equirus PTI Last Updated: Nov 28, 2026, 11:43:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The bond market is expected to remain cautious due to persistent inflationary pressures and anticipated rate hikes. Analysts predict a 25 basis points hike in the RBI's upcoming monetary policy review. Market yields are likely to be influenced by geopolitical tensions and global bond movements. Foreign portfolio investor inflows and stable currency conditions may provide some support for bond yields.\n\nThe bond market is expected to remain cautious due to persistent inflationary pressures and anticipated rate hikes. Analysts predict a 25 basis points hike in the RBI's upcoming monetary policy review. Market yields are likely to be influenced by geopolitical tensions and global bond movements. Foreign portfolio investor inflows and stable currency conditions may provide some support for bond yields.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 11:43 AM IST", "pub_date_relative": "2h ago"}, {"title": "Saudi Arabia shifts Vision 2030 spending amid economic and security pressure", "full_content": "Saudi Arabia's economic diversification strategy has moved from \"spending and delivery at any cost\" to \"spending and delivery at the right cost,\" Economy Minister Faisal Alibrahim told CNBC on Friday.\n\nIt comes after the Kingdom scaled back or cut several flagship projects as it endures a sharp economic contraction.\n\nAlibrahim also said Saudi Arabia would \"stop at nothing from realizing long-term sustainable stability in the region\" amid ongoing Houthi strikes on civilian and energy infrastructure that have killed and injured dozens and repeatedly rocked oil markets .\n\n\"The phase we're in today is one where every riyal is deployed with greater precision... it was clear that while we want to diversify or restructure our economy to depend less on government spend, there was a lot of catch-up that needed to be done, and for that, you saw government spend leading the way,\" Alibrahim told CNBC's Dan Murphy.\n\n\"Right now, that is shifting from spending and delivery at any cost to spending and delivering at the right cost. We're moving towards a policy-first approach to many of our policy areas and... objectives.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Africa\u2019s richest man is taking his mega-refinery public in a blockbuster IPO", "full_content": "One of the world's largest oil refineries is set to become Africa's biggest public firm in a highly anticipated offering that the continent's richest man has marketed as an \"IPO for the people.\"\n\nDangote Petroleum Refinery and Petrochemicals FZE, founded by Nigerian billionaire Aliko Dangote, is expected to begin trading in Lagos on Dec. 1, according to multiple media reports , following regulatory approval. A Dangote Refinery spokesperson did not respond to a CNBC request for comment.\n\nThe IPO of a minority stake in the refinery has reportedly been heavily oversubscribed, with investors from 120 countries and all 54 African countries applying to buy shares, Dangote Refinery said. The shares were offered at 525 naira ($0.39).\n\nReuters' calculations put Dangote Refinery's IPO-implied valuation at about $47 billion, based on the offer price and the company's registered share count. That would make it the biggest stock market listing Africa has ever seen.\n\nThe Lagos-based refinery is regarded as a crown jewel of Nigeria's energy industry given the facility's role in transforming the oil-rich country's fuel market since it started operating in 2024.\n\n\"With a minimum subscription of just 10 shares, the offer is designed to give ordinary Nigerians and Africans an opportunity to own a stake in the refinery,\" Aliko Dangote said at the IPO launch in early September.\n\n\"The IPO is positioned not simply as a capital-raising exercise, but as an opportunity for workers, entrepreneurs and everyday Nigerians to participate in the refinery's future growth,\" he added.\n\nBuilt for around $20 billion, the Dangote Refinery is now one of the largest in the world, with a crude oil distillation capacity of between 650,000 to 700,000 barrels per day.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 11:30 AM IST", "pub_date_relative": "2h ago"}, {"title": "Bitcoin price falls below $60,000 as whales buy dip, ETF outflows mount", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 11:26 AM IST", "pub_date_relative": "3h ago"}, {"title": "Missed Black Friday? Here\u2019s one FINAL chance to lock in InvestingPro for 60% off", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 11:23 AM IST", "pub_date_relative": "3h ago"}, {"title": "RBI issues ATM cash withdrawal rules: Banks must alert you about monthly free transactions used; 6 key points to know", "full_content": "You may be charged an additional amount plus applicable taxes every time you withdraw cash from an ATM after exhausting your monthly free transaction limit. However, do you know when you exhaust this limit and when additional charges apply?\n\nTo make these rules clearer and bring consistency to cash withdrawal transactions, the Reserve Bank of India ( RBI ) has issued the Reserve Bank of India (Cash Withdrawal Transactions through Automated Teller Machines and Point of Sale Terminals) Directions, 2026.\n\nThe consolidated Master Direction brings together instructions issued through 17 earlier RBI circulars. The new rules are effective from 27 November 2026 and apply to authorised payment system providers and system participants, including banks and payment service providers.\n\nSavings account holders are entitled to five free transactions every month at their own bank's ATMs. This limit includes both financial transactions, such as cash withdrawals, and non-financial transactions, such as balance enquiries.\n\nAt other banks' ATMs, customers are entitled to three free transactions per month in metro centres and five in non-metro centres. If you use ATMs in both metro and non-metro locations, the total free transaction limit remains capped at five per month.\n\nMetro centres include Mumbai, New Delhi, Chennai, Kolkata, Bengaluru and Hyderabad. All other locations are classified as non-metro centres.\n\nOnce you exhaust your monthly free ATM transaction limit, your bank may charge you for subsequent transactions. However, the RBI has capped the maximum customer charge at \u20b9 23 per transaction, plus applicable taxes.\n\nBanks must now put in place a suitable mechanism to caution, advise or alert customers about the number of free transactions they have already used during the month and the charges that may apply to subsequent transactions.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 11:19 AM IST", "pub_date_relative": "3h ago"}, {"title": "Diljit Dosanjh Concert: Two Test Positive for Drugs During Anti-Narcotics Cell Action", "full_content": "The screening comes amid controversy surrounding the concert, which was held at the Mahalaxmi Racecourse.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 11:16 AM IST", "pub_date_relative": "3h ago"}, {"title": "Suzlon Energy shares: Down 36% in 6 months! Will it rebound after winning wind repowering project from Tata Group?", "full_content": "Asit Manohar Published 28 Nov 2026, 11:14 AM IST Prefer Livemint on Google Stocks to buy | Suzlon Energy share price target: Suzlon Energy shares are one of the most watched stocks by Indian stock investors. The reason for this close watch is the long wait for the company's turnaround from debt to profitability. Suzlon shares witnessed a re-rating after the company became debt-free. Now, investors are eagerly awaiting the second round of re-rating \u2014 profit-making company status \u2014 which is expected to spur a fresh uptrend, followed by a re-rating in the stock.\n\nAccording to stock market experts, Indian stock investors' wait may not go on long as the company has won India's first wind repowering order from the Tata Group. The renewable energy sector will be opening a new avenue for revenue generation, as the Government of India (GoI) has been working on this policy for the last three years. They said that Tata Group's order is small, but the new revenue stream is expected to blossom at a faster rate, enabling the company to become profitable in the near term.\n\nSpeaking on the Tata Group's order bagged by Suzlon Energy, Seema Srivastava, Senior Research Analyst at SMC Global Securities, said, \u201cThe Tata Group order is small in size, but it is India's first wind repowering order, a policy on which the GoI has been working for the last three years. This is going to opene a new window of opportunity for the company and this business is expected to blossom at a very faster rate. So, a new business opportunity is expected to help the company attain profitability, for which stock investors have been waiting for a long time.\u201d\n\nPointing towards the push to re-rating in Suzlon share price, Seema Srivastava said, \u201cSuzlon shares witnessed a re-rating after becoming a debt-free company. However, the company is unable to enter the second phase of re-rating by becoming a profit-making company. Investors are eagerly waiting for the company's balance sheet turnaround.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 11:14 AM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Mint Money Festival | Building retirement corpus is only half the battle: PFRDA's Randip Singh Jagpal", "full_content": "Building a retirement corpus is only one part of pension planning. Ensuring that the money lasts through old age, provides a predictable income, and meets healthcare expenses is equally important, said Randip Singh Jagpal, whole-time member (law) at the Pension Fund Regulatory and Development Authority (PFRDA).\n\nSpeaking at a fireside chat titled \u2018Beyond building a corpus: India\u2019s next retirement playbook\u2019 at the Mint Money Festival 2026 on Saturday, Jagpal outlined the regulator\u2019s efforts to make the National Pension System (NPS) more accessible through simpler onboarding, greater investment flexibility, and new retirement income options.\n\nThe PFRDA is also looking to reduce the friction involved in opening an NPS account. \u201cThe biggest hurdle in getting people onboarded was the time it used to take for people to open their accounts,\u201d Jagpal said.\n\nTo address this, the PFRDA recently introduced Tatkal NPS, a three-click account-opening facility linked to an individual\u2019s existing bank account through Unified Payments Interface (UPI). Subscribers can enter their date of birth and registered mobile number, select their UPI-linked bank account and validate the details. Since the bank has already carried out know-your-customer check, the information can be used to open an NPS account without a separate verification process. \u201cIt\u2019s under a minute that we do the entire transaction,\u201d he said.\n\nThe regulator is also looking to improve returns by allowing greater equity exposure. Under the Multiple Scheme Framework (MSF), pension fund managers can offer schemes with equity exposure of up to 100%, allowing subscribers with a longer investment horizon to take on greater market risk.\n\nOn withdrawals, Jagpal said the regulator had reduced the minimum lock-in period to 15 years to strike a balance between allowing subscribers access to their money and preserving the benefits of compounding.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 02:19 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Quantitative Methods", "Derivatives", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "India inflation may rise in coming months on weather, supply risks: Govt report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Indicators \u203a India inflation may rise in coming months on weather, supply risks: Govt report The Economic Times daily newspaper is available online now. Read Today's Paper India inflation may rise in coming months on weather, supply risks: Govt report SECTIONS India inflation may rise in coming months on weather, supply risks: Govt report Reuters Last Updated: Nov 28, 2026, 02:15:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's upcoming festive and wedding seasons could lead to increased inflation driven by food and non-food costs. Continued geopolitical tensions in the Middle East may affect oil prices and freight rates significantly. Despite uncertainties, domestic demand and industrial activity are currently supporting economic growth effectively. The Indian economy appears resilient with strong fundamentals and macroeconomic buffers in place to face challenges. Retail inflation has already reached 6.\n\nKYC and KYB: Zydus Lifesciences \u2013 From sales to profit, how Zydus earns. Part 2 of 3\n\nHow rare is Nvidia's CEO comeback, really? The record for 20 years has an answer\n\nThe fall is new, the pattern is 11 years old: Making sense of gold's crash\n\nAs AI sharpens cyber attacks, should listed companies follow one standard in reporting them?\n\nKYC and KYB: Zydus Lifesciences \u2013 From the chemist\u2019s counter to US pharmacies. Part 1 of 3\n\nWhat would it take for the world to stop needing the Strait of Hormuz?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "28 Nov 2026, 02:15 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Top stocks to buy on Monday, 30 Nov: Choice Broking's Kkunal V recommends three shares for next week | Target, stop loss", "full_content": "POWERINDIA Vaamanaa Sethi Published 28 Nov 2026, 02:04 PM IST Prefer Livemint on Google Top stocks to buy : Snapping its two-session winning streak, the benchmark equity indices ended sharply lower on Friday, with the Sensex plunging nearly 989 points and the Nifty slipping below the 25,650 mark. The decline was driven by profit-booking in IT and banking stocks amid a surge in crude oil prices.\n\nThe 30-share BSE Sensex plunged 989.33 points, or 1.17%, to close at 83,339.26. During the session, the index fell as much as 1,120.26 points, or 1.32%, to hit an intraday low of 83,208.33. The 50-share NSE Nifty dropped 277.30 points, or 1.07%, to settle at 25,607.20.\n\nNifty closed the week at 25,607.20, declining 193.40 points (-0.75%), snapping its four-week winning streak. The index started the week on a positive note at 25,929.15, up around 128 points, but witnessed sharp profit booking on the first trading day after touching the weekly high of 25,992.60 and the weekly low of 25,343.85.\n\nOn the technical outlook, brokerage firm Choice Broking said that the weekly candlestick formation indicates a lower shadow, suggesting buying interest at lower levels despite the initial selling pressure.\n\n\u201cOn the weekly chart, Nifty continues to trade above its 50-week EMA, currently positioned around 24,165, while the 200-week EMA near 22,515 continues to reflect a positive longer-term trend structure. The 26,000\u201326,300 zone remains an important overhead resistance area, while the earlier breakout region around 24,800\u201325,000 is likely to act as an immediate support base. Sustaining above these levels will be important for maintaining the broader recovery structure,\u201d the firm said.\n\nBank Nifty closed the week at 63,040.90, declining 1,594.30 points (-2.47%) and snapping its four-week winning streak. The index started the week on a positive note at 65,012.05, opening around 375 points higher than the previous week's close.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 02:04 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Mint Money Festival | Trust is the wealth that keeps Indian markets moving: NSE CEO Ashish Chauhan", "full_content": "Ananya Grover Published 28 Nov 2026, 01:54 PM IST Prefer Livemint on Google If companies perform well and deliver returns to investors, trust in India\u2019s markets will continue to grow. If they fail to do so, that trust will gradually erode,\u201d said Ashish Chauhan, managing director and chief executive of the National Stock Exchange of India Ltd, in his opening address at the Mint Money Festival on Saturday.\n\nHe described the growing participation of Indian households in stock markets as evidence of significant trust built over time.\n\nWhen people invest in companies, they expect them to put that capital to productive use, grow their businesses, and generate returns. The relationship between companies and investors, Chauhan said, rests on trust and strong corporate governance is essential to sustaining it.\n\nHe described money as a bridge of trust between today and tomorrow. \u201cWhen someone lends money today expecting it to be returned tomorrow, it is a leap of faith. Nobody has seen tomorrow; it is trust that makes such an arrangement possible.\u201d\n\nHe said that, just as blood in the human body carries nutrients to cells and removes waste, the financial system moves resources from places where they are in excess to parts of society that need them. \u201cWithout blood, there is no life and without money or finance, there is no society.\u201d\n\nHe said money is also used for transacting, saving, lending, and borrowing. Referring to the book In Debt: The First 5,000 Years , Chauhan said people are indebted from birth to death to their ancestors, parents and friends, and these relationships are interconnected.\n\nFor societies to function, trust must be mutual and the long-term fundamentals of policy, he said, are built on trust. Chauhan traced the changing forms of money, from gold and commodities such as salt to coins and paper currency. While the form and value of money have changed over time, its role as a bridge between today and tomorrow remains important.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 01:54 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold and silver prices recover, but Fed rate-hike risks persist: Where could prices head in six months? Expert views", "full_content": "Gold and silver prices have staged a rebound over the past three days. However, concerns over further US Federal Reserve rate hikes could limit the recovery, with both metals still trading below their January peaks of around \u20b9 1.8 lakh per 10 grams for gold and \u20b9 4.20 lakh per kg for silver.\n\nOn the Multi Commodity Exchange (MCX), gold futures for December delivery settled at \u20b9 1,25,350 per 10 grams, up 0.12%. Silver futures gained 4.80% to \u20b9 1,52,843 per kg on Friday, 27 November.\n\nIn the international market, spot gold is trading at $3,653.55 per ounce, up 1.97%, while spot silver rose 5.28% to $43.73 per ounce as of 1:04 PM on 28 November, according to TradingView data.\n\nGold prices are closely linked to US Federal Reserve interest rate decisions. The Fed's next Federal Open Market Committee (FOMC) meeting is scheduled for December 8\u20139, with its interest rate decision expected on December 9.\n\nThe Fed raised interest rates by 25 basis points in September, taking the federal funds target range to 3.75%\u20134%. This was its first rate hike since 2023. At its subsequent October meeting, the FOMC kept rates unchanged at the same level.\n\nAccording to the CME FedWatch Tool, markets are pricing in a 98.4% probability of a 25-basis-point Fed rate hike, taking the target range to 4.00%\u20134.25%, as of 28 November.\n\nHigher interest rates generally put pressure on gold because it is a non-interest-bearing asset and does not generate regular income, unlike bonds. When interest rates rise, interest-bearing investments become more attractive, reducing gold's appeal.\n\nHigher US rates can also strengthen the dollar and push bond yields higher, making gold relatively less attractive to investors. Silver can also face pressure from these developments, alongside changes in industrial demand.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 01:54 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Gold loan borrowers face higher LTV risk as prices fall: Why lenders may seek additional gold or part-payment", "full_content": "The price of 24K gold has declined substantially since its peak of about \u20b9 1.80 lakh per 10 grams in January this year. As of today, gold prices in the international markets are hovering around $3,650 per ounce, and MCX gold prices closed at \u20b9 1,26,000 per 10 grams in the previous trading session. Thus marking a nearly 30-31% decline from its peak.\n\nNow, it is important to keep in mind that falling gold prices can increase the loan-to-value (LTV) ratio of existing gold loans, leaving borrowers with a smaller collateral cushion and potentially exposing them to demands for additional security, backing, or part-payment from lending institutions.\n\nThis risk arises because the outstanding loan amount does not automatically decline when gold prices drop. Therefore, as the market value of the pledged jewellery decreases, the LTV ratio rises , thus increasing the lender\u2019s exposure.\n\nKeeping these aspects in mind, let us discuss gold loans in detail along with the basic concept of the loan-to-value ratio. This will help aspiring borrowers plan their future gold loans effectively.\n\nFor example, suppose a borrower pledges gold worth \u20b9 1 lakh and takes a loan of \u20b9 70,000 at a 70% LTV ratio. Later on, if gold prices decline by 20%, then the collateral value drops to \u20b9 80,000, whereas the outstanding loan remains \u20b9 70,000. As a consequence, the LTV ratio rises to 87.5%.\n\nTherefore, such a decline in gold prices reduces the collateral cushion available to the lender. The impact can be particularly significant for borrowers who took loans when gold prices were considerably higher.\n\nAs per the revised RBI guidelines as of 1 April 2026, lenders must follow a tiered LTV structure based on the loan amount. The details of the same are as follows.\n\nAdhil Shetty, CEO of BankBazaar, in a conversation with Mint, explained this aspect in detail, stating that lenders may take corrective measures when falling gold prices push existing loans beyond the prescribed LTV limits.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 01:50 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Boris Vuj\u010di\u0107: Interview with Kurier", "full_content": "What is the value of the euro and the euro area in uncertain times like these?\n\nVuj\u010di\u0107: The value of the euro area and the euro is particularly high for a country during times of crisis. We\u2019ve seen this over the years. In times of great uncertainty, during crises, when yields and spreads are rising or there are tensions in financial markets, the real benefits of the euro become very clear. I can tell you this, because I was in charge of the monetary policy of a small, open economy close to the euro area for 25 years. In good times, it made less difference whether a country was in the euro area or not. It\u2019s in times of crisis that the difference was stark.\n\nKocher: The euro is particularly valuable for Austria as an open and highly export-oriented economy. The single currency facilitates trade and investment, eliminates exchange rate risks within the euro area, and provides a reliable framework for businesses and households. In times of economic and geopolitical uncertainty, being part of a strong monetary union is a major advantage. The euro also gives Europe greater weight on the international stage.\n\nVuj\u010di\u0107: There are a few examples \u2013 from the global financial crisis, the euro sovereign debt crisis and the pandemic. Just before Croatia joined the European exchange rate mechanism, the currency market was under such pressure in the spring of 2020 that it was really difficult to keep the exchange rate stable. That\u2019s when we entered into a swap agreement with the European Central Bank (ECB). As soon as that was in place, the market upheaval calmed down. This is a clear example of how important the euro can be. Access to a swap line in such a situation acts as a shield. In effect, we went from a high-pressure situation where we had to make significant market interventions and deal with ballooning interest rates to a much more stable phase.", "source": "ECB Press", "pub_date_str": "28 Nov 2026, 01:30 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Gold, silver prices stage stunning comeback after 15-month low: Can the rally sustain? Key levels, trading strategy", "full_content": "Gold, Silver prices : Gold and silver prices have staged a sharp comeback after plunging to multi-month lows earlier this week, raising hopes that the worst of the recent selloff may be over. Bullion's recovery has come alongside a rebound in global equities, easing pressure from the technology-led market rout and bargain hunting at lower levels.\n\nHowever, with US inflation remaining elevated and expectations of further Federal Reserve rate hikes persisting, investors are still waiting for confirmation that the recovery can turn into a sustained rally.\n\nPrecious metals recovered sharply in the final trading session of the week ended November 27, 2026. Spot gold rose 3% to $3,672.19 an ounce on Friday, while US gold futures gained 3.9% to $3,671.90. Spot silver advanced 6.6% to $44.2755 an ounce.\n\nOn the MCX, December gold futures settled at \u20b9 1,22,272 per 10 grams, up 0.94%, while December silver futures closed at \u20b9 1,45,843 per kg.\n\nThe rebound followed a volatile week. MCX gold had fallen from the previous Friday's close of \u20b9 1,22,055 to below \u20b9 1,17,906 on Wednesday, before recovering sharply over the final two sessions. It ended the week with a gain of more than 3%, snapping a two-week losing streak.\n\nSilver saw an even steeper correction, falling nearly 7% from \u20b9 1,47,658 to a 14-month low near \u20b9 1,37,728. It subsequently recovered around 12% from its low, with December futures touching an intraday high of \u20b9 1,54,804 on Friday. The contract finished the week nearly 4% to 4.8% higher.\n\nThe Thanksgiving holiday in the US helped cool technology-market volatility and eased selling pressure on bullion. US equities rallied as investors bought beaten-down technology shares, while the pause in trading activity reduced the risk of further forced liquidations.\n\nRoss Maxwell, chief strategy officer at VT Markets, said: \"Although gold has attempted to stabilise following its recent losses, investors remain cautious.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 01:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Is the U.S. tariff wall here to stay? ING weighs in", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 01:17 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. military repelled drones at UK airbase this month, FT reports", "full_content": "The U.S. military repelled a half dozen drones swarming Britain's RAF Lakenheath base earlier this month, the Financial Times reported on Saturday, saying Iran was suspected of being linked to the incident.\n\nThe newspaper, citing people familiar with the matter, said the U.S. deployed counter-drone technology to repel the unmanned aerial systems but that the drones were not retrieved by British or American personnel.\n\nAsked for comment on the report, a spokesperson for the UK's Ministry of Defence told Reuters in an emailed statement: \"Ministry of Defence Police and Suffolk Police worked closely with USAF Security Forces to respond to reports of unauthorised drone activity at RAF Lakenheath on 13 November and the situation was quickly resolved, with RAF Lakenheath returning to normal security and force protection measures.\"\n\nThe White House and Pentagon did not immediately respond to requests for comment.\n\nIn the incident, U.S. Air Force personnel at the base responded to \"suspected unauthorised drone activity\", and an Air Force spokesperson said at the time that no personnel, aircraft or infrastructure were affected.\n\nIn a September incident at RAF Fairford , another British base used by the U.S. Air Force, a threat linked to Iran prompted the removal of American B-1 bombers, President Donald Trump said last month.\n\nTehran has rejected accusations of involvement in the Fairford incident or other malign activity in Britain, where the authorities have \u200bfor years accused Iran of being involved in plots and attempted assassinations against dissidents and Israeli and Jewish targets.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 01:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Italy Approves School Face-Covering Ban, Restricting Burqas, Niqabs During Activities", "full_content": "The new legislation caps students of foreign origin at 30% in first-year classrooms, exempting those proficient in Italian, and introduces Italian-language courses for foreign parents to aid school integration.", "source": "NDTV Profit", "pub_date_str": "28 Nov 2026, 01:02 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Gold price prediction 2027: Should investors buy yellow metal after the recent correction? Experts' views", "full_content": "Gold price prediction 2027 : Gold prices have witnessed a sharp correction in November 2026, with MCX futures falling significantly from their record levels amid a stronger US dollar, rising bond yields and concerns over further interest-rate hikes by the US Federal Reserve. The sell-off pushed the yellow metal towards \u20b9 1.17 lakh per 10 grams, marking one of its steepest corrections this year as investors reduced their exposure to precious metals.\n\nHowever, gold prices staged a strong rebound towards the end of the month as buyers stepped in at lower levels. MCX gold recovered around 2.8% during the week to close near \u20b9 1,25,198 per 10 grams, signalling renewed buying interest after the sharp decline.\n\nGold's performance in 2026 has been shaped by a combination of geopolitical developments, US monetary policy expectations, currency movements and investor positioning.\n\nWhile geopolitical tensions typically support safe-haven demand, higher crude oil prices have fuelled inflation concerns and strengthened expectations that the US Federal Reserve could keep interest rates higher for longer or consider further hikes. A stronger US dollar and elevated bond yields have also weighed on gold, making the non-yielding asset less attractive.\n\nAshish Rajodiya, Head of Commodities at PL Capital, said the recent selling in gold and silver has largely been led by futures funds and concerns over Fed rate hikes rather than long-term investors. He added that physical buyers have stepped in during the price decline.\n\nThe recent correction has therefore not necessarily changed the longer-term investment case for gold. However, the direction of US interest rates, the dollar and central-bank purchases will remain important factors influencing prices in the coming months.\n\nGold prices could recover in 2027 if expectations of further US rate hikes ease and the dollar weakens.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 01:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics t
