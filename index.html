ficial intelligence (AI)-related stocks.\n\nThe blue-chip Dow Jones Industrial Average rebounded 1.5% from the day\u2019s low, while the S&P 500 recovered 1%. The Nasdaq Composite climbed 1.6% from the day\u2019s low. Among individual stocks, 3M rallied 4% after the industrial and safety products maker reported results that exceeded Wall Street estimates.\n\nThe market has been under pressure recently amid concerns about the sustainability of the AI trade, as worries over debt and demand have grown. Adding to these concerns, data centre infrastructure company Elice Inc. plunged as much as 33% during its trading debut in Seoul.\n\nHowever, AI-related stocks staged a modest recovery as the session progressed. Micron Technology, Intel and SanDisk each rose around 2%, while Seagate Technology gained 2% and Advanced Micro Devices (AMD) advanced more than 1%. The VanEck Semiconductor ETF (SMH) added nearly 1%, while CoreWeave gained more than 3%.\n\nChip stocks have fluctuated between gains and losses in recent sessions but have largely trended lower amid intensifying Chinese competition, tight NAND supply, expectations of higher interest rates and concerns about the sustainability of AI infrastructure spending.\n\nThese stocks suffered heavy losses last week, raising concerns about the AI trade following a sharp rally earlier this year. Meanwhile, in Asian trading, SK Hynix plunged 4.23%, falling to its lowest level since April and extending its October losses to 31%.\n\nThe decline has dragged SK Hynix\u2019s stock down 59% from its summer peak , reversing a significant portion of its earlier gains as one of Asia\u2019s biggest beneficiaries of the AI-driven memory boom.\n\nIn the commodity market, Brent crude oil prices retreat sharply after hitting a 5-month peak, falling to $107 from the day's high of $110.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 08:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Indian equities vs gold vs US stocks: Which asset class delivered the highest returns in 2026 so far?", "full_content": "Indian equities have been the worst-performing asset class in 2026 so far, while US stocks and gold have delivered double-digit returns. The divergence highlights how differently investors would have fared across markets and asset classes over the first nine months of the year.\n\nAccording to a research presentation by Edelweiss Mutual Fund, Indian equities, represented by the NSE 500 TRI, declined 6.81% between January and 30 September 2026. In contrast, US equities, represented by the S&P 500 TRI, gained 12.75%, while domestic gold prices rose 11.56%.\n\nThe gap between Indian and US equities stood at 19.56 percentage points. Gold also outperformed Indian equities by 18.37 percentage points over the same period.\n\nUS equities delivered the highest return among the eight asset classes tracked in the presentation, followed by gold. Their performance contrasted with the decline in Indian equities and the relatively modest gains from fixed-income investments.\n\nAn investment of \u20b9 1 lakh in US equities at the beginning of the year would have grown to approximately \u20b9 1.13 lakh by 30 September, before taxes and investment costs. The same amount invested in gold would have grown to \u20b9 1.12 lakh.\n\nBy comparison, \u20b9 1 lakh invested in Indian equities would have fallen to approximately \u20b9 93,190.\n\nFixed-income investments remained in positive territory, although their returns were considerably lower than those of US equities and gold.\n\nShort-term bonds delivered a return of 3.57%, the highest among the three debt categories tracked. Corporate bonds returned 2.47%, while government securities gained 0.67%.", "source": "LiveMint Money", "pub_date_str": "2 ": "Chips lead Nasdaq lower, oil tops 5-month high: AlphaCheck - Yahoo Finance", "full_content": "Chips lead Nasdaq lower, oil tops 5-month high: AlphaCheck Yahoo Finance Stocks mostly rise as oil, US yields ease; euro edges up Reuters Nasdaq sinks more than 2% as investors raise questions about AI debt | CNN Business CNN U.S. Stocks Mostly Higher as AI Credit Worries Abate WSJ Markets Brief: Chip Stocks Sell Off, Investors Rotate Into Value, and What to Watch in Big Tech Earnings Morningstar", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 07:13 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US stocks today: US stocks gain as healthcare stocks hit record high, oil prices fall", "full_content": "Wall Street's main indexes saw increases driven by a rally in healthcare stocks that reached record highs. Easing oil prices contributed to a recovery from the previous week's technology led selloff. Major companies like General Motors and Steel Dynamics reported disappointing earnings forecasts, while 3M and Equifax exceeded expectations. Investors are closely monitoring upcoming corporate earnings reports from several high-profile companies.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 07:09 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Signing Up for Best Buy's New Gamers Program Gets You a Free $5 Reward Certificate, While Supplies Last - IGN", "full_content": "Signing Up for Best Buy's New Gamers Program Gets You a Free $5 Reward Certificate, While Supplies Last IGN Meet Best Buy Gamers: a new experience built for gamers Best Buy Corporate Best Buy launches new gaming hub ahead of 'Zelda' and 'Grand Theft Auto VI' CNBC Best Buy makes new play for holiday gaming dollars Star Tribune Best Buy is launching Best Buy Gamers with IGN content in beta Quartz", "source": "Google News Business", "pub_date_str": "20 Oct 2026, 06:54 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Hilton to move stock listing to Nasdaq", "full_content": "Hilton Worldwide plans to shift its stock listing from the NYSE to Nasdaq, with shares set to begin trading under the HLT ticker on November 5. The hotel operator says Nasdaq's focus on technology and innovation aligns with its growth strategy as it strengthens its technology and innovation efforts.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 06:43 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "China's CATL third-quarter profit growth slowest in nearly two years as competition intensifies", "full_content": "CATL reports slower third-quarter profit growth as intense competition in China\u2019s EV battery market weighs on earnings. Net profit rises 14.5% to 21.2 billion yuan, below estimates, while revenue grows 58.6%. CATL also unveils new heavy-duty truck batteries and plans to expand its battery-swapping network.", "source": "Economic Times Markets", "pub_date_str": "20 Oct 2026, 06:38 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Investors look to earnings to reset the bull market. The key level to watch on the S&P 500", "full_content": "The key level traders are watching on the S&P 500 that could mean an even bigger decline is ahead.", "source": "CNBC Top News", "pub_date_str": "20     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
