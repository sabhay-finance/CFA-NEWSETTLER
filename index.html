<script>

    const allData = {"general": [{"title": "Nearly half of adults under 30 live with their parents. The financial fallout could last for decades.", "full_content": "Young people are increasingly living with their parents instead of establishing their own households.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 08:38 PM IST", "pub_date_relative": "5m ago"}, {"title": "White House still blocks some reporters despite judge's order lifting Trump ban", "full_content": "A federal judge ordered that White House access to journalists from CNN, MS NOW and Politico be immediately restored for up to two weeks, saying President Donald Trump 's media ban was likely unconstitutional.\n\nDespite the ruling, released late Wednesday evening, some journalists from all three outlets were barred from entering the White House on Thursday morning.\n\nMS NOW reporter Laura Barr\u00f3n-L\u00f3pez and an MS NOW producer had their press passes confiscated when they tried to enter, but a second MS NOW producer was allowed to enter. Politico said that at least one of their reporters was also blocked, and CNN reported that some of its staff was denied access, but at least one was allowed in.\n\nIt was not clear if Secret Service officers were denying access to some journalists from the three outlets because of a lag in electronically reactivating their press passes, rather than as a refusal to comply with the new order from Judge Timoty Kelly in U.S. District Court in Washington, D.C.\n\nLater Thursday, an attorney for the outlets notified Judge Timothy Kelly of the White House's \"non-compliance\" with his temporary restraining order and requested an immediate hearing on the issue.\n\n\"Defendants have already repeatedly violated the Court's Order,\" wrote the attorney, Theodore Boutrous Jr., in a court filing.\n\n\"Plaintiffs respectfully request that the Court set a hearing by videoconference or teleconference as soon as possible this morning,\" Boutrous said.\n\nKelly, soon after that motion was filed, issued an order directing Trump and the other defendants to respond to Boutrous' filing by 12:30 p.m. ET Thursday.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 08:36 PM IST", "pub_date_relative": "6m ago"}, {"title": "Hyundai expected to outsell Ford in third quarter as Detroit automakers lack hybrids", "full_content": "DETROIT \u2014 Hyundai Motor is expected to outsell Ford Motor during the third quarter for the first time ever, according to a new forecast released Thursday by Cox Automotive.\n\nThe South Korean automaker is expected to report a 6.5% increase in year-over-year sales from July through September to 511,421 units. That compares with an expected 7.1% decline for Ford over the period to 504,172 new vehicles sold, according to Cox predictions.\n\nThe expected leaderboard change would make Hyundai the third best-selling automaker in the U.S. behind General Motors and Toyota Motor.\n\nThat change comes as new vehicle sales have been stronger than expected this year. Cox on Thursday raised its 2026 forecast by roughly 2%, to 16.1 million units.\n\n\"The automotive market this year has been pretty resilient,\" Jeremy Robb, Cox chief economist, said Thursday during a media call. \"New and used sales are both down year over year, but they're not down really that much.\"\n\nHyundai, including its luxury Genesis brand and corporate sibling Kia, has been making major inroads in the U.S. this year. Ford, meanwhile, has struggled with production of its crucial F-Series pickup trucks following two supplier fires last year that disrupted production and sales.\n\nHyundai CEO Jos\u00e9 Mu\u00f1oz told CNBC last month that topping Ford in U.S. sales isn't a goal but if it happens, it's because of the company's continued focus on products and execution.\n\n\"We focus on delivering, the best, safe products to the customer with the highest possible quality,\" Mu\u00f1oz said, noting the company is No. 3 in sales globally. \"And we end up achieving unbelievable goals.\"", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 08:33 PM IST", "pub_date_relative": "9m ago"}, {"title": "Top stocks in focus tomorrow: Investors must watch Sterlite Tech, Nykaa, JSW Cement shares on Fri, 25 Sept | Triggers", "full_content": "Indian stock market investors are likely to track several companies on Thursday, September 24, following key business developments, acquisitions, order wins, project updates, fundraising plans and strategic initiatives.\n\nDr Lal PathLabs, LCC Projects, Nykaa, Vedanta and Nava are among the stocks likely to remain in focus. Sterlite Technologies, Mayasheel Ventures and Mahindra Finance may also attract attention following their latest corporate announcements.\n\nDuring Thursday's trade, the Nifty 50 plunged 1.64% to settle at 25,169.50, while the Sensex finished at 73,580, down 1.67% from the previous session. The pain was more pronounced in the broader market, with the Nifty Midcap 100 falling 2.57% and the Nifty Smallcap 100 tumbling 2.25%.\n\nDr Lal PathLabs : The company said it will acquire a 70% stake in SN Genelab Private Limited from its existing shareholders for up to \u20b9 168 crore, along with an additional earn-out of \u20b9 31.5 crore. Following the acquisition, SN Gene will become a subsidiary of Dr Lal PathLabs.\n\nLCC Projects : The company has emerged as the L-1 bidder for the \u20b9 653.34 crore Chhoti Kalisindh Medium Irrigation Project in Rajasthan. The EPC project involves construction of an irrigation system based on sprinkler technology with a solar system at the Chhoti Kalisindh and Chahurni rivers in Gangdhar, Jhalawar.\n\nFinancial stocks: The sector was the biggest hit in Thursday's trade after the Insurance Regulatory and Development Authority of India (IRDAI) proposed sweeping changes to insurance commission rules. It will likely remain focused on Friday's trade.\n\nVedanta : Clarified that its ESOS 2026 is 100% performance-linked, with no time-based or guaranteed vesting; enhanced disclosures will be provided in future annual reports.\n\nSterlite Technologies : The company has expanded its Neuralis Data Center portfolio with pre-terminated fiber trunk assemblies ranging from 48F to 6,912F.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 08:32 PM IST", "pub_date_relative": "11m ago"}, {"title": "Federal Reserve Board issues enforcement action with former employee of Sandy Spring Bank", "full_content": "Official websites use .gov A .gov website belongs to an official government organization in the United States.\n\nSecure .gov websites use HTTPS A lock ( Lock Locked padlock icon ) or https:// means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.\n\nFor release at 11:00 a.m. EDT Share --> --> --> --> --> --> The Federal Reserve Board on Thursday announced the execution of the following enforcement actions listed below:\n\nConsent prohibition against Renee Nicole Brown Former employee of Sandy Spring Bank Embezzlement by bank employee\n\nFor media inquiries, please email [email protected] or call 202-452-2955.", "source": "Federal Reserve", "pub_date_str": "24 Sep 2026, 08:30 PM IST", "pub_date_relative": "13m ago"}, {"title": "MGM Resorts shares sink 9% after Barry Diller's People Inc. rescinds takeover offer", "full_content": "Barry Diller's People Inc. has rescinded its proposal to buy MGM Resorts International , sending shares of the casino giant down 9% on Thursday.\n\nThe update comes nearly four months after Diller's company offered to purchase MGM Resorts for $48.30 per share. People Inc. already owns a roughly 26.1% stake in MGM.\n\nDiller, chairman of People Inc. \u2014 formerly known as IAC \u2014 attributed the decision to the complicated nature of the deal.\n\n\"There are lots of ingredients that go into a proposal of this kind on its way to completion,\" Diller said in the press release. \"We didn't feel the mix was coming together in the way we had hoped and have decided not to pursue taking the company private at this time.\"\n\nCNBC's David Faber reported Thursday that Diller backed off the deal in part because of the significant debt load it would have created for the company.\n\n\"We at People Incorporated remain open to and interested in the possibility of a strategic transaction with MGM Resorts and look forward to considering a range of alternatives,\" he said in the release.\n\nEarlier this week, shareholders of Caesars Entertainment approved an offer from billionaire Tilman Fertitta to acquire the casino company for $17.6 billion. Caesars shareholders will receive $31 per share in cash.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 08:29 PM IST", "pub_date_relative": "14m ago"}, {"title": "Financial stocks lead correction as insurance overhaul plan sparks fears", "full_content": "A surging oil market, historic highs in US yields, and a regulatory shake-up in domestic insurance combined to trigger a broad market sell-off on Thursday, with Indian equities faring among the worst in Asia.\n\nBrent crude oil crossed $106 a barrel and US treasury yields rose to their highest in nearly 20 years, while a proposed insurance overhaul cast a cloud over the distribution incomes of Indian banks. Financial services account for 36.47% of the Nifty's weight, making the sector a key driver of the benchmark.\n\nThe Nifty and Sensex fell 1.6% and 1.7% respectively, hitting their lowest levels since 6 April and 8 June. The India Vix jumped nearly 23% as volatility shot up. In other markets, the Shanghai Composite fell 1.2%, while the CAC 40, DAX, Nasdaq and S&P 500 declined 0.4%, 0.2%, 1.1% and 0.8%.\n\nFinancial services bore the brunt of the sell-off in India, a day after the Insurance Regulatory and Development Authority of India (Irdai) moved to lower customer acquisition costs, revamp distributor commissions, enforce expense limits and streamline intermediary categories. While aimed at curbing mis-selling and lowering costs for policyholders, industry executives cautioned the proposed caps could disrupt distribution networks, squeeze lower-ticket products and narrow consumer choice.\n\nThe sector reeled on Thursday\u2014the Nifty Financial Services ex-Bank index slumped 4.3%, followed by the Nifty Mid-small Financial Services index, which fell 4.4%. Nifty Private Bank declined 2.2%, while the Nifty Bank index shed 2%.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 08:29 PM IST", "pub_date_relative": "14m ago"}, {"title": "3 things Micron investors need to watch as the stakes get higher", "full_content": "When Micron reports earnings next week, a Rosenblatt analyst expects to hear about additional customer agreements, rising prices and stock buybacks.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 08:27 PM IST", "pub_date_relative": "16m ago"}, {"title": "US long-term borrowing costs touch highest level since 2004", "full_content": "Rising yields strain public finances after brutal sell-off in US Treasuries market", "source": "FT Markets", "pub_date_str": "24 Sep 2026, 08:23 PM IST", "pub_date_relative": "20m ago"}, {"title": "'Validly Passed': Tata Sons Cites Ex-CJI's Opinion To Back Board Decision On N Chandra's Reappointment", "full_content": "The company shared the legal opinions in its response to an email from Tata Trusts Chairman Noel Tata questioning the legality of the resolution passed at the Sept. 17 board meeting.", "source": "NDTV Profit", "pub_date_str": "24 Sep 2026, 08:21 PM IST", "pub_date_relative": "22m ago"}, {"title": "Oracle sends 'force majeure' notice about data center project \u2014 stock sinks 5%", "full_content": "Oracle shares fell 5% on Thursday following news that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses.\n\n\"Project Jupiter remains on our planned schedule,\" an Oracle said in a statement to CNBC. \"We are fully committed to New Mexico and confident in our path forward.\"\n\nBloomberg was first to report the news, citing sources familiar with the matter.\n\nThe company is looking to delay payment on the campus, dubbed Project Jupiter, if it doesn't come online as expected in 2028, according to the report.\n\nOracle sent the notice to the developer, which is a unit of Blue Owl Capital , CNBC confirmed. Blue Owl also saw its shares fall on Thursday.\n\n\"This notice does not change the financial commitments to this multi-year project,\" Blue Owl Capital said in a statement to CNBC.\n\nThe New Mexico data center project, which is part of the broader Stargate artificial intelligence infrastructure buildout with President Donald Trump , has been riddled with setbacks and regulatory hurdles.\n\nThat includes local opposition to data centers ahead of the upcoming midterm elections and concerns from environmental groups.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 08:20 PM IST", "pub_date_relative": "23m ago"}, {"title": "Millions will lose Medicaid once new work rules kick in. These groups will be hit the hardest.", "full_content": "The changes will cut about $1 trillion from federal Medicaid spending over 10 years.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 08:20 PM IST", "pub_date_relative": "23m ago"}, {"title": "Economists raise concerns as India's growth increasingly becomes credit expansion-led", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Economists raise concerns as India's growth increasingly becomes credit expansion-led The Economic Times daily newspaper is available online now. Read Today's Paper Economists raise concerns as India's growth increasingly becomes credit expansion-led SECTIONS Economists raise concerns as India's growth     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
