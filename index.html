 News \u203a Economy \u203a Infrastructure \u203a India\u2019s manufacturing sector needs 13.1% growth to hit $7.5 trillion by 2047: Report The Economic Times daily newspaper is available online now. Read Today's Paper India\u2019s manufacturing sector needs 13.1% growth to hit $7.5 trillion by 2047: Report SECTIONS India\u2019s manufacturing sector needs 13.1% growth to hit $7.5 trillion by 2047: Report ANI Last Updated: Sep 04, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's manufacturing sector requires a 13.1 percent annual growth rate to reach USD 7.5 trillion by 2047. This ambitious target is crucial for India's goal of becoming a USD 30 trillion economy. Workforce productivity is identified as the most underleveraged growth lever for the nation. Many companies need operational changes to meet productivity targets and overcome hidden factors. Reimagining work, redesigning organizations, and remodelling the workforce are key suggested strategies.\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nQ1 investment numbers look stellar, but are we celebrating too early?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Sep 2026, 12:44 PM IST", "pub_date_relative": "23m ago"}, {"title": "Global bond sell-off likely not over yet, Mohamed El-Erian tells CNBC", "full_content": "Investors should expect the sell-off of global government bonds to continue, renowned economist Mohamed El-Erian told CNBC on Friday.\n\n\"I don't see any appetite in the U.S. for immediate fiscal consolidation. So I suspect we will continue to see upward pressures on yields,\" he told CNBC's Carolin Roth at the Ambrosetti Forum in Cernobbio, Italy.\n\nGlobal government bonds have been gripped by a sharp sell-off this week, with yields on securities issued by various major governments rising to multi-decade highs amid mounting concerns over inflation and rate hikes.\n\nOn Friday morning, the rout cooled, with yields little changed on most developed-market government bonds. U.S. Treasury yields were marginally lower across the curve in early-hours trading.\n\nEl-Erian, the Rene M. Kern Practice Professor at the University of Pennsylvania's Wharton School and chief economic adviser at Allianz, told CNBC he did not see anything wrong with how the markets were functioning \u2013 but added that \"reliable buyers and holders\" of U.S. Treasurys were coming under pressure.\n\n\"China, for geopolitical purposes, is no longer as willing,\" he said. \"Japan and the Gulf countries have domestic issues.\"\n\nHe also pointed to the Norwegian Sovereign Wealth Fund rethinking its allocation to U.S. government bonds.\n\n\"The size isn't big, but the signal that traditional holders and buyers are becoming less reliable is a very important one,\" El-Erian said. \"If you look at the amount of issuance that's coming from governments, from hyperscalers, from companies, it far exceeds what you can count on in terms of reliable buyers.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 12:43 PM IST", "pub_date_relative": "24m ago"}, {"title": "European shares pause after bruising week as Fed\u2019s Waller tempers rate hike fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 12:43 PM IST", "pub_date_relative": "24m ago"}, {"title": "Brent Oil stalls at $97.62 double-top risk: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 12:42 PM IST", "pub_date_relative": "25m ago"}, {"title": "London Gas Oil stalls at $1,403 after parabolic run: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 12:42 PM IST", "pub_date_relative": "25m ago"}, {"title": "46:1 bonus stock: Record date soon - Check face value and share price performance", "full_content": "TVS Holdings, a core investment company, is set to allot bonus shares to its shareholders. The record date for this purpose is approaching, while the stock is also witnessing decent traction. Rising for the second consecutive session, TVS Holdings shares climbed nearly 3% in intraday deals on the BSE on Friday, 4 September. The stock opened at \u20b9 13,229.95 against its previous close of \u20b9 13,145 and rose 2.7% to an intraday high of \u20b9 13,496.95 during the session.\n\nAccording to the company's exchange filing on 27 August, TVS Holdings will issue and allot 46 non-convertible redeemable preference shares of \u20b9 10 each by way of bonus for every 1 fully paid up equity share of \u20b9 5 held by each equity shareholder of the company.\n\nTVS Holdings has fixed 8 September 2026 as the record date for the purpose of determining eligible shareholders of the company who will be entitled to receive the preference shares of the company.\n\nTVS Holdings share price has given multibagger returns over the long term, but is down 4% year-to-date. Over the last one year, it has gained 4%, hitting a 52-week high of \u20b9 16,150 on 18 November and a 52-week low of \u20b9 11,927.90 on 4 September last year.\n\nOver the last three and five years, the stock has jumped 145% and 341%, respectively.\n\nThe company's consolidated profit for Q1FY27 jumped 82% year-on-year (YoY) to \u20b9 610.25 crore. Revenue from operations for the quarter saw a 34% YoY jump to \u20b9 17,076.18 crore from \u20b9 12,742.19 crore in the same quarter last year.\n\nDisclaimer: This article is for educational purposes only and does not constitute investment advice. The views and recommendations expressed are those of individual analysts or broking firms, not Mint. We advise investors to consult with certified experts before making any investment decisions, as market conditions can change rapidly and circumstances may vary.\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint.", "source": "LiveMint Markets", "pub_date_str": "04 Sep 2026, 12:41 PM IST", "pub_date_relative": "26m ago"}, {"title": "The inflation genie could be out of the bottle \u2014 and bond markets are sounding the alarm", "full_content": "A sharp sell-off in global government bonds is exposing investor anxiety that the macroeconomic backdrop may be shifting toward persistently higher inflation, as governments struggle to rein in spending and sovereign debt.\n\nPressure on yields is not just a factor of this year's rise in government borrowing and higher energy prices. Investors highlight a pivot away from globalization toward protectionism, and geopolitical tensions, which have materialized in trade tariffs, industrial reshoring and increased defense spending, as signs of a broader shift that could keep inflation structurally higher.\n\nThat would mark a decisive break from the generally low and comparatively stable inflation environment that followed the global financial crisis \u2014 heralding wide-ranging implications for investors' portfolios.\n\nU.S. 10-Year Treasury. \"Structural features of the global economy have shifted and now create inflationary, rather than disinflationary impulses,\" said Emma Moriarty, portfolio manager at CG Asset Management.\n\n\"Tariffs, and then more recently, the outbreak of war in the Middle East have been the sharp end of this changing order. It is wrong to think of the energy shock as temporary, as the underlying structural change that has caused it might be quite long-lived.\"\n\nThe U.S. 10-year Treasury yield climbed to its highest level since November 2023 this week, while Japan's 10-year government bond yield moved above 3% for the first time since 1996.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 12:35 PM IST", "pub_date_relative": "32m ago"}, {"title": "Penny stock under 10 rupees: Upper circuit \u2014 Leather share jumps 74% in 4 sessions | Back-to-back surge for third day", "full_content": "Penny stock under 10 rupees: AKI India shares have been on an uptrend for the last four straight sessions. The \u20b9 10\">penny stock under \u20b9 10 has risen from \u20b9 4.15 to \u20b9 7.22 on the NSE, recording a nearly 74% rally in this period. However, the bull trend is still visible in the stock, as it soon touched 10% upper circuit, once trading resumed on Friday. Looking at the AKI share price history, the penny stock under 10 rupees has hit the 10% upper circuit for the third day in a row.\n\nAKI India shares remained almost flat throughout the month, but attracted bulls' attention after the announcement of the financial report for the financial year 2025-26. The company submitted its financial report for FY26 to the Indian exchanges on 2 September 2026.\n\nIn the Directors' report, the company reported a YoY rise in consolidated revenue and income despite higher expenses during FY26. In FY 26, the company's consolidated revenue from operations grew from \u20b9 80.96 crore to \u20b9 107.32 crore. The company's total income in FY26 stood at \u20b9 118.31 crore, which was around \u20b9 87.50 crore in the previous financial year. However, the company's expenses also grew from \u20b9 2.67 crore to \u20b9 2.71 crore.\n\nIn the last year, the penny stock trading under 10 rupees has remained a beaten-down stock, having lost nearly 20% over this period. The penny stock delivered 10% YTD and 50% over the last six months. However, the stock has delivered close to 80% returns in one month due to the recent bull run.\n\nThis penny stock under 10 rupees has a history of issuing bonus shares and stock splits.", "source": "LiveMint Markets", "pub_date_str": "04 Sep 2026, 12:30 PM IST", "pub_date_relative": "37m ago"}, {"title": "ESDS Software IPO: Blockbuster listing! Money doubled today - Buy more, book profit and exit or hold? Guide for investor", "full_content": "ESDS Software Solution share price locked in a 20% upper circuit on Friday, 4 September, after the stock made a blockbuster listing debut today.\n\nESDS Software Solution share price today was trading at \u20b9 895.55 apiece on the BSE and \u20b9 908.40 apiece on the NSE, with both exchanges hitting the 20% upper circuit. On the NSE, ESDS Software Solution share price opened at \u20b9 757 per share, marking a 76.46% premium over the issue price of \u20b9 429. On the BSE, the stock opened at \u20b9 746.30 apiece, up 73.96% from the issue price.\n\nFollowing the sharp gains, ESDS Software Solution share price has surged around 108% from the issue price on the BSE and 111% on the NSE. In effect, the stock has more than doubled investors\u2019 money on its listing day.\n\nThe company\u2019s market capitalisation stood at \u20b9 10,647.44 crore on the NSE and \u20b9 10,496.83 crore on the BSE.\n\nShivani Nyati, Head of Wealth at Swastika Investmart Ltd, said ESDS Software Solution Ltd. made a strong debut at \u20b9 757 on the NSE, marking a 76% premium over its \u20b9 429 issue price and exceeding the bullish expectations behind the brokerage\u2019s \u201cSubscribe\u201d rating. She attributed the positive outlook to sharp margin expansion, nearly 9x growth in PAT and strong customer stickiness.\n\nNyati said rising demand for cloud computing, data-centre infrastructure, cybersecurity and digitalisation in India offers ESDS a favourable long-term growth opportunity. However, given the sharp listing-day gains, she expects some near-term profit-taking as valuations have moved ahead of fundamentals.\n\nShe advised existing allottees to consider booking partial profits at current levels while holding the remaining shares with a stop loss of \u20b9 650\u2013680. Investors who missed the IPO , she said, could wait for a pullback toward \u20b9 600\u2013650 before considering a fresh entry.\n\nDr.", "source": "LiveMint Markets", "pub_date_str": "04 Sep 2026, 12:27 PM IST", "pub_date_relative": "40m ago"}, {"title": "World's biggest sovereign wealth fund plans to cut U.S. Treasury holdings", "full_content": "Norway's sovereign wealth fund has proposed cutting the allocation of government bonds in its $2.3 trillion investment portfolio, chiefly affecting its holdings of U.S. Treasurys, as it seeks to diversify its risk exposure and boost returns.\n\nThe heads of Norges Bank Investment Management wrote in a letter to the country's finance ministry, made public Friday, that it recommended reducing the government subindex of its bond holdings from 70% to 50% \u2014 a level it said would provide sufficient liquidity during market turbulence while allowing it to seek greater returns elsewhere.\n\nThe proposed reallocation would gradually cut NBIM's Treasury holdings from 34.1% to 21.9%, reduce its euro area holdings from 16.8% to 14.1%, and increase its share of Japanese government bonds to 7.4% from 4.6%.\n\nNBIM also wants to begin weighting its government bond holdings by market value instead of GDP because of the high debt loads of almost all developed economies,\n\nThe potential shift would come at a sensitive time for the Treasury market, with long-dated yields pushed to decade-highs as investors fret over the U.S. fiscal trajectory and increasingly heavy debt load .\n\n\"Reliable buyers and holders of U.S. Treasurys are under pressure,\" economist Mohamed El-Erian told CNBC's Carolin Roth in a Friday interview, citing Japan, China and Gulf countries.\n\nAddressing NBIM's proposal to reduce its own share of Treasurys, El-Erian said: \"The size isn't big, but the signal that traditional holders and buyers are becoming less reliable is a very important one.\"\n\nNBIM plans to increase its holdings of non-government U.S. fixed income, such as corporate bonds, to 27.6% from 16.2%.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 12:16 PM IST", "pub_date_relative": "51m ago"}], "cfa": [{"title": "600% dividend stock: Check amount per share, record date, payment timeline - Do you own?", "full_content": "Dividend Stock : Kajaria Ceramics share price is likely to remain in focus as the tile manufacturer has fixed September 21, 2026, as the record date. This date will determine the shareholders eligible to receive its final dividend for FY26. The company has recommended a final dividend of \u20b9 6 per equity share for the financial year ended March 31, 2026.\n\nThat translates into a 600% dividend , as the company's equity shares have a face value of Re 1 each.\n\nShareholders whose names appear in the company's Register of Members or the Register of Beneficial Owners maintained by the depositories on the record date will be eligible for the dividend, subject to its approval at the company's upcoming Annual General Meeting (AGM).\n\nMoreover, Kajaria Ceramics also announced that it will hold its 40th AGM on Tuesday, September 15, 2026, at 1:00 pm IST through Video Conferencing (VC) and Other Audio Visual Means (OAVM). The meeting will be conducted in compliance with the applicable provisions of the Companies Act, 2013, related rules and the SEBI Listing Regulations, along with the relevant circulars issued by the Ministry of Corporate Affairs.\n\nThe Board of Directors had initially recommended the final dividend at its meeting held on April 30, 2026. If shareholders approve the proposal at the AGM, the final dividend will be paid on or before Wednesday, October 14, 2026.\n\nIn today's deal, the stock lost around 2% to its day's low of \u20b9 1,237.90 per share on BSE.\n\nIt has risen 4% in 1 month, 14% in 3 months, and 33% in 6 months. Moreover, it has been flat in the last 1 year, up 0.21%. It has hit its 52-week high of \u20b9 1,294.30 in October 2025, and its 52-week low of \u20b9 870 in February this year.\n\nEarlier this week, Kajaria Ceramics entered into a shareholders' agreement with Sunsure Solarpark Fourty Three Private Limited and Sunsure Energy Private Limited for the generation and supply of solar and wind power to its Gailpur and Malootana plants in Rajasthan.", "source": "LiveMint Markets", "pub_date_str": "04 Sep 2026, 12:59 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Ultravolt to power UltraTech, but its current can rattle rivals", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nIn February 2025, the company had announced its decision to enter the wires and cables industry. On Thursday after market hours, it announced the launch of the business under the brand Ultravolt.\n\nWhat stands out, however, is that the company\u2019s plans seem more aggressive than initially foreseen. Backed by an investment of \u20b9 1,800 crore, Ultravolt will be the second largest player in the wires segment by capacity, said UltraTech. Further, it aims to become one of the top two players within five years.\n\n\u201cIts ambition of becoming the No. 2 player within five years suggests that Ultravolt is likely to adopt an aggressive strategy for capacity ramp-up, distribution expansion and brand building, similar to the group\u2019s approach during initial years of its paint business,\u201d said analysts from Motilal Oswal Financial Services in a report on 3 September.\n\nUltraTech is looking at a rollout across over 500 districts and 6,000 pin codes to start with. It plans to reach over 100,000 retailers and further activate availability through 5,000-plus UltraTech Building Solutions outlets.\n\nAs such, the near-term impact of the launch on UltraTech\u2019s earnings would not be meaningful. Assuming 4-5x asset turns (about \u20b9 10,000 crore revenue by FY30/FY31 estimates) and 10-12% Ebitda margins, the business could contribute about 3-7% of UltraTech\u2019s FY30 estimated revenue/Ebitda, reckons Jefferies India. Ebitda is earnings before interest, taxes, depreciation and amortization\u2014a key profitability measure for companies.\n\nUltraTech\u2019s launch also means intensifying competition for other wires and cables companies. Investors are jittery. Shares of KEI Industries, RR Kabel and Polycab India plummeted 5-8% in Friday\u2019s early session, while UltraTech\u2019s stock was marginally up, by 0.5%.\n\nTo be sure, the near-term earnings growth of wires and cables companies would be supported by the sharp increase in copper prices.", "source": "LiveMint Markets", "pub_date_str": "04 Sep 2026, 12:55 PM IST", "pub_date_relative": "12m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Volkswagen shares rally after board approves radical restructuring plan", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 12:48 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India's balance of payments likely to post $60-65 bn surplus in FY27 despite wider CAD: HDFC Bank", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India's balance of payments likely to post $60-65 bn surplus in FY27 despite wider CAD: HDFC Bank The Economic Times daily newspaper is available online now. Read Today's Paper India's balance of payments likely to post $60-65 bn surplus in FY27 despite wider CAD: HDFC Bank SECTIONS In ic Times daily newspaper is available online now. Read Today's Paper India\u2019s manufacturing sector needs 13.1% growth to hit $7.5 trillion by 2047: Report SECTIONS India\u2019s manufacturing sector needs 13.1% growth to hit $7.5 trillion by 2047: Report ANI Last Updated: Sep 04, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's manufacturing sector requires a 13.1 percent annual growth rate to reach USD 7.5 trillion by 2047. This ambitious target is crucial for India's goal of becoming a USD 30 trillion economy. Workforce productivity is identified as the most underleveraged growth lever for the nation. Many companies need operational changes to meet productivity targets and overcome hidden factors. Reimagining work, redesigning organizations, and remodelling the workforce are key suggested strategies.\n\nSeason of change in accounting policy: A simple AI prompt can tell you a lot\n\nPatent Cliff approaching: Can Indian pharma companies repeat past success?\n\nQ1 investment numbers look stellar, but are we celebrating too early?\n\nET Prime special: Bigger, Better or Both? Understanding business to figure out the mystery: Power Grid Corp \u2013 Part 1\n\nET Prime special series: 2013 to 2026. Not years, but evidence: Power Grid, Part 2\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Sep 2026, 12:44 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Global bond sell-off likely not over yet, Mohamed El-Erian tells CNBC", "full_content": "Investors should expect the sell-off of global government bonds to continue, renowned economist Mohamed El-Erian told CNBC on Friday.\n\n\"I don't see any appetite in the U.S. for immediate fiscal consolidation. So I suspect we will continue to see upward pressures on yields,\" he told CNBC's Carolin Roth at the Ambrosetti Forum in Cernobbio, Italy.\n\nGlobal government bonds have been gripped by a sharp sell-off this week, with yields on securities issued by various major governments rising to multi-decade highs amid mounting concerns over inflation and rate hikes.\n\nOn Friday morning, the rout cooled, with yields little changed on most developed-market government bonds. U.S. Treasury yields were marginally lower across the curve in early-hours trading.\n\nEl-Erian, the Rene M. Kern Practice Professor at the University of Pennsylvania's Wharton School and chief economic adviser at Allianz, told CNBC he did not see anything wrong with how the markets were functioning \u2013 but added that \"reliable buyers and holders\" of U.S. Treasurys were coming under pressure.\n\n\"China, for geopolitical purposes, is no longer as willing,\" he said. \"Japan and the Gulf countries have domestic issues.\"\n\nHe also pointed to the Norwegian Sovereign Wealth Fund rethinking its allocation to U.S. government bonds.\n\n\"The size isn't big, but the signal that traditional holders and buyers are becoming less reliable is a very important one,\" El-Erian said. \"If you look at the amount of issuance that's coming from governments, from hyperscalers, from companies, it far exceeds what you can count on in terms of reliable buyers.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 12:43 PM IST", "pub_date_relative": "24m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "European shares pause after bruising week as Fed\u2019s Waller tempers rate hike fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Sep 2026, 12:43 PM IST", "pub_date_relative": "24m e high debt loads of almost all developed economies,\n\nThe potential shift would come at a sensitive time for the Treasury market, with long-dated yields pushed to decade-highs as investors fret over the U.S. fiscal trajectory and increasingly heavy debt load .\n\n\"Reliable buyers and holders of U.S. Treasurys are under pressure,\" economist Mohamed El-Erian told CNBC's Carolin Roth in a Friday interview, citing Japan, China and Gulf countries.\n\nAddressing NBIM's proposal to reduce its own share of Treasurys, El-Erian said: \"The size isn't big, but the signal that traditional holders and buyers are becoming less reliable is a very important one.\"\n\nNBIM plans to increase its holdings of non-government U.S. fixed income, such as corporate bonds, to 27.6% from 16.2%.", "source": "CNBC Top News", "pub_date_str": "04 Sep 2026, 12:16 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Economics", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US Fed rate cut bets fall below 50% after Governor Chris Waller\u2019s comments. What did he say?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Fed rate cut bets fall below 50% after Governor Chris Waller\u2019s comments. What did he say? Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Fed rate cut bets fall below 50% after Governor Chris Waller\u2019s comments. What did he say? SECTIONS US Fed rate cut bets fall below 50% after Governor Chris Waller\u2019s comments. What did he say? By Veer Sharma , ETMarkets.com Last Updated: Sep 04, 2026, 12:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Sy     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
