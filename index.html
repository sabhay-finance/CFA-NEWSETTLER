<script>

    const allData = {"general": [{"title": "Hurricane Trudy brings heavy rain and strong winds to Mexico\u2019s Pacific coast", "full_content": "Hurricane Trudy lashed parts of Mexico's Pacific coast with heavy rain and strong winds Sunday as the U.S. National Hurricane Center warned of potentially life-threatening flooding and mudslides.\n\nA hurricane warning remained in effect from Manzanillo, Colima, to Cabo Corrientes, Jalisco. The latest NHC data showed the Category 2 hurricane with maximum sustained winds of 105 mph (165 kph) about 135 miles (215 kilometers) south-southwest of Cabo Corrientes in Jalisco state and 115 miles (185 kilometers) west-southwest of Manzanillo, moving northwest at 10 mph (17 kph).\n\nMeanwhile, Typhoon Champi was passing Guam as a Category 4 super typhoon.\n\nTrudy's center was expected to remain near the Mexican coast through Sunday evening before moving south of the Baja California Peninsula. A tropical storm warning remained in effect for Las Islas Marias. A warning for the coast east of Punta San Telmo to Lazaro Cardenas had been discontinued.\n\nThe Mexican Navy urged mariners and coastal residents to exercise extreme caution because of high waves, heavy rain, and the risk of rising rivers, flooding, and landslides in vulnerable areas.\n\nColima authorities said risks remained low, but warned that heavy rainfall could cause damage because successive storms had already saturated the ground along the Pacific coast.\n\nTrudy was expected to bring 4-8 inches (10-20 centimeters) of rain through the weekend, with isolated totals of around 12 inches (30 centimeters) along and near the coast in Michoacan, Colima and Jalisco. The hurricane center warned of potentially life-threatening flooding and mudslides, especially in areas with steep terrain.\n\nAlso in the Pacific, Champi moved away from Guam on Sunday after passing near the island's southern tip, with sustained winds of 150 mph (240 kph). Late Sunday afternoon, it was 200 miles (320 kilometers) west of Guam, moving west at 14 mph (23 kph), according to the U.S. National Weather Service.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 05:30 PM IST", "pub_date_relative": "7m ago"}, {"title": "Always on, always listening: New AI devices are pushing legal limits and could put users in jeopardy", "full_content": "Thomas, 43, wears a pair of Meta 's camera-equipped glasses, a Fieldy note-taking pendant around his neck and a wristband from Amazon 's Bee, all of which record his daily life. A Pittsburgh-based business owner and a livestreamer, Thomas relies on the devices to help him stay organized, pay bills on time and set reminders.\n\n\"I'm forgetful AF,\" Thomas said in an interview. \"My life is so crazy that not having to remember to remember is fantastic.\"\n\nNot everyone is on board with his lifestyle. Earlier this week, a bystander at a local bar noticed his Meta Glasses.\n\n\"He was like, 'I don't feel comfortable,'\" Thomas said. \"I don't turn it off, I take it off completely because people don't really believe it's off.\"\n\nIt's the type of interaction users are increasingly navigating as more tech companies introduce AI-powered, always-listening devices and features, which have been marketed as useful tools to transcribe meetings, keep track of conversations, set reminders and offer personalized recommendations.\n\nThe latest example of these gadgets arrived Thursday with Amazon's Bee Frontier wearable and Bee Eclipse, a card-shaped device that attaches to a smartphone. Both devices are designed to record, transcribe and analyze a user's day.\n\nApple's latest Apple Watch Series 12, unveiled in September, will have Siri Recap, which \"ambiently\" takes notes throughout the day and generates summaries of conversations. Another feature called Live Rewind can recap 15 seconds of a conversation via a text transcription.\n\nMeta's popular smart glasses can take photos, capture video and record voice notes or reminders. Startups including Plaud and Pocket also developed card-sized note-taking devices, while Friend offers an AI necklace.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 05:30 PM IST", "pub_date_relative": "8m ago"}, {"title": "There is a silent market rotation inside the S&P 500 that\u2019s warning of more weakness ahead", "full_content": "A \u201ctriple-top\u201d reversal chart pattern is pointing to a period of underperformance for the S&P 500 \u2014 perhaps a long one.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 05:30 PM IST", "pub_date_relative": "8m ago"}, {"title": "DA hike before Diwali 2026: How much extra salary could central government employees get if DA rises to 63%?", "full_content": "Central government employees awaiting a dearness allowance (DA) hike could receive a higher monthly salary and arrears if the Centre approves the pending July 2026 revision before Diwali . A 3-percentage-point increase is expected to take DA from 60% to 63% of basic pay, although the government has yet to announce the revision officially.\n\nWith Diwali falling on 8 November, employees and pensioners are hoping for a festive-season announcement. The Union Cabinet did not announce the pending DA and Dearness Relief (DR) revision at its 14 October meeting, leaving the next decision uncertain.\n\nFor employees, the amount at stake depends on their basic pay. A 3-percentage-point increase would add \u20b9 540 a month for someone drawing basic pay of \u20b9 18,000, while an employee with basic pay of \u20b9 56,100 would receive an additional \u20b9 1,683 a month before deductions.\n\nDA is calculated as a percentage of basic pay. The current rate is 60%, following the Centre's approval of a 2-percentage-point increase effective from 1 January 2026. If the next revision takes DA to 63%, employees would receive an additional 3% of their basic pay every month.\n\nThe additional amount would range from \u20b9 6,480 to \u20b9 20,196 annually across these basic-pay levels, assuming the 3-percentage-point increase remains in force for a full year. The actual increase in take-home salary may be lower because of applicable deductions.\n\nThe July 2026 DA revision is ordinarily expected to take effect from 1 July, even if the formal announcement comes later. If the government approves the increase retrospectively from that date, employees could also receive arrears for the intervening months, subject to the terms of the official order.\n\nFor an employee earning \u20b9 35,400 in basic pay, a 3-percentage-point increase would mean an additional \u20b9 1,062 a month. This translates into \u20b9 3,186 for July, August and September combined, or \u20b9 4,248 for four months through October.\n\nThese figures are illustrative.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 05:29 PM IST", "pub_date_relative": "9m ago"}, {"title": "Kellton Tech Solutions rights issue 2026: Record date, price, size, subscription date, entitlement ratio, other details", "full_content": "Small-cap stock under \u20b9 50: The board of directors of Kellton Tech Solutions Limited has declared raising funds through the rights issue. The small-cap took a decision in this regard at the board meeting on Saturday, declaring that the offer size would not exceed \u20b9 160 crore. The company board also approved the Draft Letter of Offer. The small-cap company said the terms and conditions of the rights issue will be determined and communicated later.\n\nThe \u20b9 50\">small-cap stock under \u20b9 50 made an announcement about the rights issue through an exchange filing, saying, \u201cWe wish to inform you that the Board of Directors of Kellton Tech Solutions Limited (\u201cthe Company\u201d) at its meeting held today i.e. Saturday, October 17, 2026 has considered and, inter alia, approved Issue of Equity Shares of the Company of face value of Re. 1/- each (the \u201cEquity Shares\u201d) for an amount up to and not exceeding Rs. 160 Crores (Rupees One Hundred and Sixty Crores Only) by way of Rights Issue to the eligible Shareholders of the Company as on the Record Date (to be determined and notified subsequently, and such issue, the \u201cRights Issue\u201d), in accordance with applicable laws, including the Companies Act, 2013, as amended, the Securities and Exchange Board of India (Issue of Capital and Disclosure Requirements) Regulations, 2018 (the \u201cSEBI ICDR Regulations\u201d), as amended, subject to such regulatory and statutory approvals, as may be relevant under the applicable laws.\u201d\n\nRegarding other details of the Kellton Tech Solutions rights issue, the small-cap company said, \u201cThe Board of Directors have also approved the Draft Letter of Offer.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 05:23 PM IST", "pub_date_relative": "14m ago"}, {"title": "Princeton Bancorp director Martin Tuchman sells $95,160 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 05:15 PM IST", "pub_date_relative": "22m ago"}, {"title": "Forbes Travel Guide-Endorsed Le Must Brings Plastic-Free Luxury Condiments to the UAE", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 05:02 PM IST", "pub_date_relative": "36m ago"}, {"title": "IPO GMP race: Zetwerk vs Sahajanand vs Bonfiglioli Transmissions vs Tonbo Imaging - check share listing price prediction", "full_content": "The four IPOs that opened for subscription this week recorded mixed responses on the second day of bidding on Friday, 16 October, with Tonbo Imaging India attracting strong demand, while Zetwerk Manufacturing Business saw a relatively muted response. Bonfiglioli Transmissions and Sahajanand Medical Technologies also witnessed varying subscription levels across investor categories.\n\nTonbo Imaging India\u2019s IPO was subscribed 7.77 times on the second day, driven by strong demand from non-institutional investors (NIIs), whose portion was subscribed 14.35 times. The retail investor portion was subscribed 7.12 times, while qualified institutional buyers (QIBs) subscribed 3.95 times their allotted quota.\n\nBonfiglioli Transmissions\u2019 IPO was subscribed 99% on the second day of bidding. The NII portion was subscribed 1.71 times, while the retail portion was subscribed 1.16 times. The QIB portion saw a relatively subdued response, with subscriptions at 16% of the shares reserved for the category.\n\nSahajanand Medical Technologies\u2019 IPO was subscribed 82% by the end of the second day. The QIB portion was subscribed 1.12 times, while retail investors subscribed to 82% of their allotted portion. The NII segment saw a 51% increase in subscriptions.\n\nZetwerk Manufacturing Business\u2019 IPO witnessed a slower response, with the issue subscribed 31% on the second day. The QIB portion was subscribed 37%, followed by 36% subscription in the retail category. The NII portion was subscribed 16%.\n\nAll four IPOs opened for subscription on Thursday, 15 October, and are scheduled to close on Monday, 19 October.\n\nZetwerk IPO GMP today, or grey market premium, is +7.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 04:50 PM IST", "pub_date_relative": "48m ago"}, {"title": "Energy stocks dividend leaderboard: Power Grid, NTPC, SJVN, NHPC or IREDA - Which power stock beats the rest on yield?", "full_content": "Energy stocks dividend leaderboard: Energy has emerged as one of the most popular themes over the past few years. Shares like Power Grid, NTPC, NHPC have delivered double digit returns over the past three years. For dividend hunters, let\u2019s compare the annual yield of top energy stocks including Power Grid, NTPC, SJVN, NHPC and IREDA .\n\nPower Grid has an annual dividend yield of 3.08% for the year 2026. The stock closed 250.95 per share on BSE on Friday, October 16. Its share price value has declined -14% in one year, -23% in two years and has surged close to 23.59% in three years.\n\nJust like Power Grid, NTPC has announced a total of \u20b9 9 per equity share dividend in last one year. Its yield stood at 2.63%. The stock closed at \u20b9 316 per share on BSE. Its share price value has declined 25.39% in two years, but has surged 30% in three years.\n\nSJVN, NHPC and IREDA have announced dividend less than \u20b9 2 per equity share over the last one year. SJVN stock has delivered -39% return in one year. NHPC has declined close to -17.20% in the duration, whereas, IREDA has delivered -29.39% return in one year.\n\nOut of the five stocks, Power Grid has the highest annual dividend yield over the past year. NTPC has a dividend yield of 2.63%.\n\nAnnual dividend yield is the percentage of the amount used to purchase a stock and the dividend income earned from it over the period of one year. IT matters because it helps investors to understand the cash return they get per Rupees invested in a stock.\n\n(Note: Annual dividend yield calculated based on the historical purchase price of the stocks.)\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 04:41 PM IST", "pub_date_relative": "56m ago"}, {"title": "Vance faces tough questions on Iran war, immigration and more in CBS town hall", "full_content": "Vice President JD Vance faced tough questions from voters about the Trump administration's policies on data centers, high costs, immigration and his own rhetoric in a town hall on CBS News that aired Saturday night.\n\nThe string of sharp questions, some from voters who said they had supported him and President Donald Trump , previewed the rocky path he may face if he runs for president in 2028 and has to answer for the administration's record.\n\nVance, who said during the town hall there's \"of course\" a chance he doesn't run for president, faced an especially pointed question about \"a failure of leadership\" posted by the widow of one of six U.S. soldiers killed by an Iranian drone strike in Kuwait, which occurred the day after Trump started the war with Iran.\n\n\"This literally is the first time I've heard of this,\" Vance said in response.\n\nAs he went on, he said, \"This job is an amazing honor, but you live in a bit of a bubble and sometimes information doesn't filter up.\"\n\nAfter telling the vice president about his late wife, Master Sgt. Nicole Amor, who was killed on March 1, Joey Amor asked about mistakes and fundamental failures that led up to the deaths of those soldiers and how leaders would be held accountable.\n\nVance seemed taken aback by Amor's questions, saying, \"This literally is the first time I've heard of this,\" and said he wanted to talk with Amor afterward to learn more.\n\nBut as Vance went on, he acknowledged mistakes were made and said, \"There were issues with where troops were located that we realized was a huge mistake that we could do better on, and we have changed that.\"", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 04:41 PM IST", "pub_date_relative": "57m ago"}, {"title": "Semiconductor market to remain solid \u2018at least through next year,\u2019 South Korea finance minister says", "full_content": "The semiconductor boom will last at least through 2027, South Korean finance minister Lee Hyoung-Il said on Saturday.\n\n\"For now, our view is that we can sustain this growth at least through next year,\" Lee told CNBC on the sidelines of the IMF-World Bank annual meetings in Bangkok. \"That's because the gap between demand and supply for semiconductors is still very wide, and supply is still being expanded.\"\n\nHis comments come after semiconductor stocks fell sharply this week, hurt by investor concerns about interest rate hikes and rising competition from Chinese companies. South Korean chip stocks like SK Hynix and Seoul Semiconductor were part of the sell-off, along with U.S. giants like Nvidia .\n\nChip stocks' large weighting has fueled volatility in South Korea's stock market this year, Lee said. He attributed the market's wild swings to the semiconductor industry's larger share of the economy than in other countries. Despite the market swings, South Korea's economy is \"solid,\" Lee said.\n\nOn Thursday, an opinion column in Maeil Business Newspaper , a prominent South Korean publication, urged the country's government to prepare for the coming slowdown in the artificial intelligence boom. The author said two experts expect a \"flood of new supply\" of semiconductors that will turn the memory market \"into a red ocean\" by 2029, according to a CNBC translation .\n\nWhile South Korea's semiconductors may be driving volatility in its stock market, the industry has also fueled tax growth. Lee said the country expects to collect more taxes than initially projected this year.\n\nSouth Korea will ultimately be in a stronger fiscal position because of the chip boom, he added.\n\nWATCH: Don't overlook opportunity in South Korea, says Verdad Advisers' Rasmussen", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 04:40 PM IST", "pub_date_relative": "57m ago"}, {"title": "Kelly Services delivers 67% return after Fair Value signal", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:39 PM IST", "pub_date_relative": "59m ago"}, {"title": "Deaths confirmed after 'serious incident,' fire at Canada military base in Alberta", "full_content": "People were killed and injured in a serious incident that resulted in a fire on one of Canada's busiest military bases in Alberta, Defense Minister David McGuinty said on Saturday.\n\n\"I'm saddened to share that there have been both fatalities and injuries as a result of an incident\" at Canadian Forces Base Wainwright, McGuinty told reporters in Ottawa.\n\nHe did not say how many people were killed or injured, or what caused the \"tragic\" situation at the base in the east-central part of the province, about 210 km (130 miles) east of Edmonton.\n\nA major fire was still burning on Saturday evening, he said, adding: \"I cannot recall an incident like this in recent memory.\"\n\nThe Canadian military and the Royal Canadian Mounted Police are investigating the incident, McGuinty said.\n\nPrime Minister Mark Carney posted on social media that the national government was \"working closely with the Government of Alberta and local authorities.\"\n\nCFB Wainwright had 1,310 military and civilian personnel stationed there as of 2021, according to census data. The town of Wainwright, population about 6,600, is just north of the base.\n\nThe municipality posted on social media that the fire had crossed the base fence into the nearby district but no evacuation orders had been issued.", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 04:33 PM IST", "pub_date_relative": "1h ago"}, {"title": "Akasa Air Suspends Flights To Riyadh, Jeddah Till Oct 27: Check Refund, Rescheduling Rules", "full_content": "Passengers affected by Akasa Air's cancellations can opt for a full refund, which will be credited to their original source of payment within seven days.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "Renault Duster Hybrid Launched at 16.99 Lakh: Mileage, Specs, Features And More", "full_content": "Renault has added a strong hybrid powertrain to the new Duster SUV in India. The model gets a 1.8 litre petrol engine, two electric motors and a claimed fuel efficiency of 29 kmpl.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:32 PM IST", "pub_date_relative": "1h ago"}, {"title": "InvestingPro\u2019s Fair Value spotted Infleqtion\u2019s 52% drop in advance", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:31 PM IST", "pub_date_relative": "1h ago"}, {"title": "NorthEast United FC vs Kerala Blasters FC Live Streaming, Telecast: When, Where To Watch ISL Match On TV, Online?", "full_content": "The Highlanders host Kerala Blasters after winning their opening matches, with both sides targeting another three points.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "CEO SUNDAY: Nothing Bundt Cakes CEO shares the career advice that stuck with him: 'It\u2019s OK to be vulnerable' - Fox Business", "full_content": "CEO SUNDAY: Nothing Bundt Cakes CEO shares the career advice that stuck with him: 'It\u2019s OK to be vulnerable' Fox Business", "source": "Google News Business", "pub_date_str": "18 Oct 2026, 04:30 PM IST", "pub_date_relative": "1h ago"}, {"title": "India Women Vs Zimbabwe Women Live Streaming: When And Where To Watch 2nd T20I", "full_content": "Zimbabwe, led by Josephine Nkomo, will look to bounce back after their four-wicket defeat in the series opener against India.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:21 PM IST", "pub_date_relative": "1h ago"}, {"title": "Analysis-IMF/World Bank meetings leave developing countries with more questions than answers", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Brokerage Radar: PNB Gets Target Price Hikes; Crompton Greaves And Federal Bank Stay Under Bullish Lens", "full_content": "Kotak Institutional Equities and J.P. Morgan raised their target prices on Punjab National Bank to Rs 130 and Rs 134. Kotak also maintained its bullish stance on Crompton Greaves Consumer Electricals and Federal Bank.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:15 PM IST", "pub_date_relative": "1h ago"}, {"title": "Leeds United vs Man United Live Streaming: Likely Lineups; How To Watch Premier League Match On TV, Online?", "full_content": "Leeds United takes on Manchester United at home: All you need to Know about Sunday's Premier League Match.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:12 PM IST", "pub_date_relative": "1h ago"}, {"title": "EPFO scheme offers up to \u20b915,000 to first-time employees: Check eligibility, salary limit and payment rules", "full_content": "Eligible first-time employees joining the formal workforce can receive an incentive of up to \u20b9 15,000 under the Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY). The scheme, administered through the Employees\u2019 Provident Fund Organisation (EPFO), aims to encourage formal employment by rewarding eligible workers entering the Employees\u2019 Provident Fund (EPF) system for the first time.\n\nHowever, the benefit is subject to eligibility and service conditions. Employees cannot assume they will automatically receive \u20b9 15,000 simply by joining a company. The incentive is linked to eligible EPF wages, continued employment and compliance with the scheme\u2019s requirements.\n\nThe scheme covers eligible jobs created between 1 August 2025 and 31 July 2027. Employees earning monthly wages of up to \u20b9 1 lakh may qualify, subject to the other conditions. The incentive is equivalent to one month\u2019s eligible EPF wage, capped at \u20b9 15,000.\n\nTo qualify under Part A of PM-VBRY, an employee must be joining the formal workforce as a first-time EPF member. The scheme covers eligible employees joining establishments between 1 August 2025 and 31 July 2027, provided they meet the prescribed membership, wage and employment conditions.\n\nEmployees should check their EPF membership history and ensure that their employer is depositing contributions and filing the required Electronic Challan-cum-Returns (ECRs). Meeting the salary limit alone does not guarantee eligibility.\n\nThe incentive is paid in two instalments, subject to the scheme's conditions. The first instalment is available after six months of continuous service, while the second is linked to completing 12 months of service and the prescribed financial literacy programme.\n\nThe amount is based on eligible wages, so not every employee will receive the maximum. Further, the second instalment is not necessarily paid as immediately withdrawable cash.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 04:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Five Snapdragon Smartphones Under Rs 45,000 In India: OnePlus Nord 6, Redmi Note 17 Pro And More", "full_content": "Looking for a new smartphone under Rs 45,000? These five options offer different strengths, including large batteries, high refresh rate displays and versatile cameras.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:09 PM IST", "pub_date_relative": "1h ago"}, {"title": "Failed UPI, ATM or card payment? Here's when you'll get \u20b9100 per day for a delayed refund \u2014 Key RBI rules explained", "full_content": "Suppose you make a UPI payment to a friend or merchant, or withdraw cash from an ATM, but the transaction fails even though your bank account is debited. If the money is not returned within the prescribed time, you may be entitled to compensation of \u20b9 100 per day for the delay under Reserve Bank of India ( RBI ) rules.\n\nThe compensation depends on the type of transaction and the deadline prescribed for reversing the amount. Here is what customers need to know.\n\nAccording to RBI's circular, Harmonisation of Turn Around Time (TAT) and customer compensation for failed transactions using authorised Payment Systems, dated September 20, 2019, a failed transaction is one that is not completed for reasons not attributable to the customer.\n\nThese may include communication failures, an ATM running out of cash, a session timing out, or money not reaching the beneficiary's account despite the sender's account being debited. The framework also covers certain delays in crediting money or initiating a reversal.\n\nThe rules came into effect on October 15, 2019, and cover domestic transactions where both the sender and the beneficiary are in India. The term bank also includes authorised non-bank payment service providers, wherever applicable.\n\nRBI states that the prescribed turnaround time is the outer limit for resolving a failed transaction. If compensation is payable, it must be credited automatically, without waiting for the customer to file a claim.\n\nFor some transactions, the amount must be reversed by T+1 day, while others have a T+5-day deadline.\n\nSource: RBI\u2019s circular, \u201cHarmonisation of Turn Around Time (TAT) and Customer Compensation for Failed Transactions Using Authorised Payment Systems\u201d. Wordings simplified for clarity and examples are added. T refers to the calendar date of the transaction.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 04:06 PM IST", "pub_date_relative": "1h ago"}, {"title": "49 Seconds Of Panic: Video Shows Kolkata Puja Pandal Crowd Crush That Killed 19. Watch", "full_content": "Women and children can be heard crying for help. Visitors are packed shoulder-to-shoulder inside a narrow, barricaded passage beneath a low roof. Some appear to brace themselves against the wall to avoid falling.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Ferrari Luce Makes India Debut With 1,000 PS Power, 530 Km Range: Key Details", "full_content": "Ferrari has showcased its first all electric car in India. The Luce gets four electric motors, a 122 kWh battery and a claimed range of over 530 km.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:03 PM IST", "pub_date_relative": "1h ago"}, {"title": "RGC Resources senior VP Lawrence Oliver buys $200 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Flexsteel director William S. Creekmuir sells over $101k in company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "RGC Resources VP, human resources Christen Miles buys $100 in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Iran urges US to accept proposal to reopen Strait of Hormuz", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Flipkart Sale Ends October 19: MacBook Air M5, HP OmniBook 3 And More Laptop Deals", "full_content": "Flipkart's Big Billion Days sale is nearing its end, with discounts available on laptops from Apple, HP, Lenovo, Samsung and Acer. Here are some deals to consider before the sale closes.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 03:59 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stocks to buy: Ganesh Dongre of Anand Rathi recommends Larsen and Toubro, Equitas, Bajaj Finance shares | Target, SL", "full_content": "Stocks to buy | Ganesh Dongre's stock recommendations: The key benchmark indices of the Indian stock market ended the week on a positive note, with the Nifty gaining nearly 3.78% to close at 23,146, while the Bank Nifty advanced 0.79% to settle at 55,844. Sectoral performance was broadly positive, with most major sectors witnessing gains. The IT sector emerged as the top performer, rallying nearly 10% during the week.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi, believes the recovery during the week was supported by buying interest at lower levels, although global uncertainties continue to weigh on overall market sentiment.\n\n\u201cConcerns surrounding the US Federal Reserve\u2019s interest-rate outlook, the possibility of further rate hikes by the Fed and the RBI in the coming quarters, and the upward bias in US 10-year Treasury yields remain key factors influencing global risk appetite and foreign institutional investor (FII) flows into emerging markets, including India,\u201d Ganesh Dongre of Anand Rathi said.\n\nFactors that may dictate the Indian stock market next week, Ganesh Dongre of Anand Rathi said, traders should closely monitor Brent crude oil prices, which are approaching their previous highs near $110 per barrel. A sustained move above this level could push crude prices towards $114 per barrel, potentially increasing inflationary concerns and adding pressure on equity markets. So any fresh geopolitical developments, particularly those involving the Middle East and US\u2013Iran relations, could further influence crude oil prices and market sentiment. Therefore, movements in crude oil and developments on the geopolitical front will remain critical factors in determining the market's next directional move.\n\nThe Anand Rathi expert believes the Nifty witnessed a notable rebound from the 22,000\u201322,200 support zone and recovered towards the 23,200 mark by the end of the week.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 03:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Bank Taking Too Long To Resolve Complaint? Know When You Can Claim Up To Rs 5,000 Compensation", "full_content": "When the complaint is not resolved within the stipulated period of time, you can go ahead and file a complaint through the RBI complaint portal.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 03:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "ICICI Bank ADR earnings missed, revenue was in line with estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 03:43 PM IST", "pub_date_relative": "1h ago"}, {"title": "Eating out with family for Diwali, Dussehra? Here's why your restaurant bills may go up by 10-15% this festive season", "full_content": "Planning to eat out with your family during this festive season on Diwali and Dussehra? You may have to shell out more as restaurant menu prices are set to rise by around 10-15% at member establishments in Mumbai, according to the Indian Hotel and Restaurant Association ( AHAR ).\n\nIn a statement from AHAR President Vijay K Shetty, titled \u2018Balancing the price on the menu with the cost behind the meal\u2019, he credited the impending menu price rise to sustained increases in the cost of preparing and serving food.\n\nThe statement said that revised prices are expected to be introduced progressively over the coming weeks across dine-in, quick-service and delivery menus. \u201cThe revision follows several months during which restaurants absorbed higher expenses to limit the impact on customers,\u201d the statement added.\n\nAccording to Shetty, for restaurants in the financial capital, the challenge extends beyond the price of any single commodity. \u201cCooking fuel, everyday ingredients, commercial rents, employee wages and transportation have become more expensive. With these costs rising together, establishments face growing pressure on the margins that support daily operations,\u201d he said.\n\nThe statement said recent reports illustrate the pressure on everyday kitchen essentials.\n\nAccording to AHAR said the proposed adjustment reflects the cumulative burden of higher procurement and operating expenses . \u201cEven where individual ingredient prices stabilise or ease temporarily, restaurants continue to carry higher recurring costs. The cost of a meal includes the people who prepare and serve it, the premises in which it is served, and the hygiene, maintenance and utilities required to keep a kitchen functioning consistently,\u201d it added.\n\nThe association emphasised that the revision is intended to recover a portion of the additional expenditure while maintaining food quality and service standards.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 03:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "DIIs increase stake in 8 midcap stocks in Q2FY27", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News DIIs increase stake in 8 midcap stocks in Q2FY27 Written by Ritesh Presswala , ETMarkets.com | Oct 18, 2026, 03:44:33 PM IST 1 / 9 DII buying Domestic Institutional Investors (DIIs) raising their holdings in a company can signal growing confidence in its prospects. Based on shareholding disclosures available so far for the September 2026 quarter, we have identified nine NSE midcap stocks that recorded an increase of over 200 basis points in DII shareholding on a quarter-on-quarter basis in Q2FY27, according to StockEdge\u2019s shareholding scan.\n\nDII shareholding in the stock rose to 34.49% in the September '26 quarter, up from 27.38% in June '26.\n\nDII shareholding in the stock rose to 29.52% in the September '26 quarter, up from 24.86% in June '26.\n\nDII shareholding in the stock rose to 13.65% in the September '26 quarter, up from 9.14% in June '26.\n\nDII shareholding in the stock rose to 11.24% in the September '26 quarter, up from 6.95% in June '26.\n\nDII shareholding in the stock rose to 26.81% in the September '26 quarter, up from 23.57% in June '26.\n\nDII shareholding in the stock rose to 21.75% in the September '26 quarter, up from 18.63% in June '26.\n\nDII shareholding in the stock rose to 20.83% in the September '26 quarter, up from 18.6% in June '26.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 03:40 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tesla Opens Roadster Bookings In India, Thrust Version Listed At Rs 2.50 Crore", "full_content": "Tesla has opened reservations for its upcoming Roadster in India, with the Thrust version listed at Rs 2.50 crore. Production is expected to begin in 2028.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 03:35 PM IST", "pub_date_relative": "2h ago"}, {"title": "Credit report errors: How mistakes like wrong phone number will impact your credit score? 5 things you must do correctly", "full_content": "An incorrect mobile number, an incorrectly reported loan, or an unfamiliar credit inquiry in an individual's credit report can raise concerns about their credit profile. Now, it is a given that not every error directly lowers your credit score; incorrect information can affect how lending institutions assess an individual\u2019s creditworthiness and may also indicate a risk of identity theft.\n\nIt is vital to keep in mind that an individual's credit report and credit score are entirely different. A credit score is a three-digit number provided by leading credit bureaus across the nation, such as CRIF High Mark, Experian, Equifax and TransUnion CIBIL. This metric typically ranges from 300 to 900, with a credit score above 750 considered excellent.\n\nA credit report is a slightly different metric. It records an individual\u2019s borrowing and repayment history, credit utilisation and other relevant details. Therefore, checking it regularly and correcting discrepancies is essential for maintaining an accurate credit profile, which in turn helps an individual maintain a high credit score that can come in handy when applying for new loans and credit cards.\n\nNow let us discuss several factors an individual should get right to ensure their credit score remains healthy and their credit profile remains neat and well-managed.\n\n1 . Check your mobile number and personal details: Ensure your name details, mobile number, address and other identifying data points are correct and updated. A wrong phone number may complicate identity verification and indicate that your details have been mixed up with someone else\u2019s records. It does not automatically reduce your score.\n\n2. Verify loan and credit card accounts: Check whether all listed personal loans, home loans and credit cards belong to you. An unfamiliar account or loan could indicate a reporting error or possible identity theft, which needs prompt investigation and amicable resolution.\n\n3.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 03:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "Planning for your ageing parents? Do\u2019s and don'ts of protecting their money, daily support, medical needs and more", "full_content": "Planning for ageing parents involves protecting their finances while safeguarding their comfort and independence. Bank paperwork, regular bills, insurance and scam protection deserve attention before problems arise. Start by asking what support they need and which decisions they prefer handling themselves.\n\nHelping with money should give parents confidence without taking away their control. A practical plan can organise payments and documents while respecting their choices.\n\nReview nominee details across bank accounts, fixed deposits, mutual funds and insurance policies. Make sure these records are updated.\n\nDiscuss wills and asset distribution openly with your parents. These conversations can help reduce the possibility of disputes later. Involve them throughout rather than making decisions about their money without asking.\n\nArrange automatic payments for recurring bills, including electricity and phone services. This can prevent service interruptions when a payment is forgotten.\n\nAsk whether they find any payment tasks difficult before offering help. The aim is reliable support that allows them to retain financial independence.\n\nDo not assume managing money alone means they need no assistance. Regular conversations can reveal changing needs without turning support into supervision.\n\nExplain digital scams and agree on simple precautions together. Parents should never share OTPs, which are one-time passwords.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 03:29 PM IST", "pub_date_relative": "2h ago"}, {"title": "Faster services imports threaten to erode cushion against India\u2019s goods trade deficit: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Faster services imports threaten to erode cushion against India\u2019s goods trade deficit: Report The Economic Times daily newspaper is available online now. Read Today's Paper Faster services imports threaten to erode cushion against India\u2019s goods trade deficit: Report SECTIONS Faster services imports threaten to erode cushion against India\u2019s goods trade deficit: Report ANI Last Updated: Oct 18, 2026, 03:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's services trade surplus has declined as imports grew faster than exports, leading to concerns about foreign exchange earnings. In September 2026, net services exports fell by 10 percent to USD 16.9 billion. Despite strong growth in merchandise exports of 23 percent, the services sector faces challenges. While cumulative net services exports increased during the first half, their sustainability is uncertain.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "18 Oct 2026, 03:26 PM IST", "pub_date_relative": "2h ago"}, {"title": "Adani Group stocks Q2 results 2026 date this week: Adani Green, Adani Energy, Adani Gas, Adani Power schedule, returns", "full_content": "Adani Group companies Q2 results 2026: As the earnings season is going on in full swing, four Adani Group companies will remain at the centre of attraction this week as they announce their results for the quarter ended September 2026. Adani Green Energy , Adani Energy Solutions , Adani Total Gas , and Adani Power have scheduled their Q2FY27 results in the coming week.\n\nAs investors prepare for the coming week, here are all the details to know about the four Adani group forms declaring their Q2 results 2026.\n\nAdani Energy Solutions Limited\u2019s board of directors meeting will be held on Thursday, October 22, to consider and announce the quarterly result for second quarter of FY27, and half-yearly result of FY27. Post Q2 results announcement, the company will hold investors\u2019 call conference on Friday, October 23.\n\nAdani Energy Solutions share price closed 0.54% lower at \u20b9 1360 per share on BSE with an Mcap of \u20b9 1,66,321.81 crore on Friday, October 16. Its share price value has surged 43.6% in one year, 31.64% in two years and around 75.55% in three years.\n\nAdani Green Energy Limited\u2019s board of directors is scheduled to meet on Wednesday, October 21, to consider and approve unaudited financial results for Q2FY27 and H1FY27. THe investors call will be held on Thursday, October 22.\n\nAdani Green Energy stock closed 0.46% lower at \u20b9 1300 per share on BSE with an MCap of \u20b9 2,14,132.90 crore. The green energy stock has surged 22.64% in one year, but declined 25.78% in two years.\n\nThe board of directors of Adani Total Gas is scheduled to meet on Thursday, October 22, to consider and approve quarterly results and half yearly results. Adani Total Gas\u2019 investors call is scheduled to be held on Friday, October 23.\n\nAdani Total Gas stock closed 0.40% higher at \u20b9 579.55 per share on BSE with a market capitalisation of \u20b9 63,739.49 crore. Its share price value has declined 6.79% in one year, 22.36% in two years, and around 2.63% in three years.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 03:25 PM IST", "pub_date_relative": "2h ago"}, {"title": "Bajaj Finance Q2 preview: Profit may jump 29%, NII 24% as strong loan growth lifts earnings", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Bajaj Finance Q2 preview: Profit may jump 29%, NII 24% as strong loan growth lifts earnings Bajaj Finance Share Price Mahindra & Mahindra Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Bajaj Finance Q2 preview: Profit may jump 29%, NII 24% as strong loan growth lifts earnings SECTIONS Bajaj Finance Q2 preview: Profit may jump 29%, NII 24% as strong loan growth lifts earnings By Akash Podishetti , ETMarkets.com Last Updated: Oct 18, 2026, 03:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bajaj Finance is projecting a remarkable 29% increase in net profit for the July-September quarter, driven by robust loan demand and a boost in interest income. With a significant rise in assets under management, the demand for its lending products appears strong. Yet, analysts caution about potential pressure on lending margins owing to escalating borrowing costs.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 03:20 PM IST", "pub_date_relative": "2h ago"}, {"title": "AdaniConneX's Vizag Data Centres To Use Air Cooling, Cut Freshwater Consumption", "full_content": "The facilities will have dedicated industrial water connections rather than draw supplies from municipal lines.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 03:17 PM IST", "pub_date_relative": "2h ago"}, {"title": "Neeti Mohan's Father Brij Mohan Sharma Dies; Celebrities Pay Tributes", "full_content": "Shreya Ghoshal, Palak Muchhal, Dia Mirza, Neha Dhupia extended condolences after learning about the demise of Neeti Mohan's father.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 03:16 PM IST", "pub_date_relative": "2h ago"}, {"title": "Airtel Launches Voice-Only Recharge Plans Starting At Rs 185 Ahead Of TRAI Deadline", "full_content": "Airtel launched three voice-only prepaid plans priced at Rs 185, Rs 203 and Rs 206, offering unlimited calls and 300 SMS without mobile data.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 03:09 PM IST", "pub_date_relative": "2h ago"}, {"title": "Cyient DLM shares crash 12% despite Q2 profit growth: 3 reasons, brokerages set targets; should you buy?", "full_content": "Cyient DLM share price plunged 12.24% on Friday, 16 October, even as the electronics manufacturing services company reported double-digit revenue growth, higher normalised profit and a record order book for the September quarter. The sell-off came amid concerns over margin pressure, continued growth investments and mixed brokerage views on the stock's valuation and earnings outlook.\n\nThe stock's sharp decline followed its Q2 FY27 results, with investors appearing to focus on the pressure on operating margins despite healthy business momentum. While Motilal Oswal remained bullish on the stock, PL Capital maintained a 'Reduce' rating, highlighting the differing views on its growth prospects and valuation.\n\nDespite Friday's sharp correction, Cyient DLM has delivered strong returns over the longer term. The stock has gained 53.41% over three months and 167.12% over six months, while its year-to-date return stands at 117.53%.\n\nCyient DLM reported revenue of \u20b9 393.1 crore in Q2 FY27, up 26.5% year on year. EBITDA increased 9.5% to \u20b9 34.2 crore, but the EBITDA margin contracted by around 130 basis points year on year to 8.7%.\n\nThe slower growth in operating profit compared with revenue points to cost pressures even as the business expands. PL Capital attributed the margin contraction primarily to higher sales and marketing expenses and continued investments in product development.\n\nMotilal Oswal also flagged gross margin compression due to the expensing of product development costs. The brokerage expects upfront growth investments to keep FY27 EBITDA margins in the 9\u201310% range, with operating leverage and double-digit margins expected from FY28.\n\nCyient DLM's reported profit after tax rose to \u20b9 34 crore in Q2 FY27, including a one-off gain of \u20b9 18.2 crore from an earnout reversal.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 03:06 PM IST", "pub_date_relative": "2h ago"}, {"title": "Delhi Govt Proposes 2.5 Lakh Cap On E-Rickshaws, Strict Ownership And Safety Rules In New Draft Policy", "full_content": "Every e-rickshaw would be required to obtain a digital ECC, valid for two years. The certificate would be linked to the vehicle's registration, ownership and driver details, along with relevant documents covering insurance and battery standards.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 03:01 PM IST", "pub_date_relative": "2h ago"}, {"title": "Multi-cap vs multi-asset allocation mutual funds returns race: Key differences, 1, 3 and 5-year returns compared here", "full_content": "Multi-cap funds and multi-asset allocation funds may sound similar, but they belong to different mutual fund categories and follow distinct investment strategies.\n\nWhile multi-cap funds invest primarily in equities across companies of different market capitalisations, multi-asset allocation funds spread investments across multiple asset classes, including equities and debt.\n\nHere is what investors need to know about the two mutual fund categories and how their returns compare.\n\nMulti-cap funds: They are open-ended equity schemes that invest across large-cap, mid-cap, and small-cap stocks.\n\nUnder Securities and Exchange Board of India ( SEBI ) rules, these funds must invest at least 75% of their total assets in equity and equity-related instruments. They must allocate at least 25% of total assets each to large-cap, mid-cap and small-cap stocks.\n\nThis structure requires multi-cap funds to maintain exposure to all three market-capitalisation segments, rather than concentrating only on large-cap stocks. Their performance is therefore linked primarily to equity-market movements across these segments.\n\nMulti-asset allocation funds: These are hybrid mutual fund schemes that invest across at least three asset classes, with a minimum allocation of 10% to each. Depending on the scheme's mandate, these asset classes may include equities, debt instruments, and commodities such as gold and silver, including through their exchange-traded funds (ETFs), REITs, etc.\n\nUnlike multi-cap funds, which focus on equities across market capitalisations, multi-asset allocation funds diversify investments across asset classes. Their returns depend on the performance of these assets and the scheme's allocation to each of them.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 02:58 PM IST", "pub_date_relative": "2h ago"}, {"title": "\u2018Rarest of rare\u2019 bets on Reliance ahead of Jio Platforms\u2019 biggest-ever IPO", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nMumbai: Two traders have built large leveraged positions in Reliance Industries Ltd (RIL), an unusual development that analysts have termed \u201crarest of rare\u201d, ahead of the initial public offering (IPO) of its subsidiary Jio Platforms Ltd, set to be the biggest IPO in the country.\n\nExchange data shows that both have built positions exceeding 3% each of Reliance\u2019s marketwide position limit (MWPL) since early October. Both raised their positions over the past fortnight, trimming only marginally towards the end of last week.\n\nThe scale of the bets is virtually without precedent in Reliance\u2019s derivatives counter. Analysts say they cannot recall a single client holding more than 3% of the stock\u2019s MWPL\u2014not even during Meta\u2019s investment in Jio Platforms in 2020 or the pandemic-triggered global market meltdown.\n\nWhile the rationale behind the bets remains unclear, analysts believe the sharp fall in Reliance shares to fresh lows may have prompted traders to position for a rebound. The stock has underperformed the Nifty amid persistent foreign investor selling, rising oil prices and a weakening rupee. The bets come ahead of the \u20b9 30,213 crore IPO of Jio Platforms, which opens on Wednesday and runs through Friday.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 02:47 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "There is a silent market rotation inside the S&P 500 that\u2019s warning of more weakness ahead", "full_content": "A \u201ctriple-top\u201d reversal chart pattern is pointing to a period of underperformance for the S&P 500 \u2014 perhaps a long one.", "source": "MarketWatch Top Stories", "pub_date_str": "18 Oct 2026, 05:30 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kellton Tech Solutions rights issue 2026: Record date, price, size, subscription date, entitlement ratio, other details", "full_content": "Small-cap stock under \u20b9 50: The board of directors of Kellton Tech Solutions Limited has declared raising funds through the rights issue. The small-cap took a decision in this regard at the board meeting on Saturday, declaring that the offer size would not exceed \u20b9 160 crore. The company board also approved the Draft Letter of Offer. The small-cap company said the terms and conditions of the rights issue will be determined and communicated later.\n\nThe \u20b9 50\">small-cap stock under \u20b9 50 made an announcement about the rights issue through an exchange filing, saying, \u201cWe wish to inform you that the Board of Directors of Kellton Tech Solutions Limited (\u201cthe Company\u201d) at its meeting held today i.e. Saturday, October 17, 2026 has considered and, inter alia, approved Issue of Equity Shares of the Company of face value of Re. 1/- each (the \u201cEquity Shares\u201d) for an amount up to and not exceeding Rs. 160 Crores (Rupees One Hundred and Sixty Crores Only) by way of Rights Issue to the eligible Shareholders of the Company as on the Record Date (to be determined and notified subsequently, and such issue, the \u201cRights Issue\u201d), in accordance with applicable laws, including the Companies Act, 2013, as amended, the Securities and Exchange Board of India (Issue of Capital and Disclosure Requirements) Regulations, 2018 (the \u201cSEBI ICDR Regulations\u201d), as amended, subject to such regulatory and statutory approvals, as may be relevant under the applicable laws.\u201d\n\nRegarding other details of the Kellton Tech Solutions rights issue, the small-cap company said, \u201cThe Board of Directors have also approved the Draft Letter of Offer.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 05:23 PM IST", "pub_date_relative": "14m ago", "cfa_topics": ["Corporate Issuers", "Ethical & Professional Standards"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "IPO GMP race: Zetwerk vs Sahajanand vs Bonfiglioli Transmissions vs Tonbo Imaging - check share listing price prediction", "full_content": "The four IPOs that opened for subscription this week recorded mixed responses on the second day of bidding on Friday, 16 October, with Tonbo Imaging India attracting strong demand, while Zetwerk Manufacturing Business saw a relatively muted response. Bonfiglioli Transmissions and Sahajanand Medical Technologies also witnessed varying subscription levels across investor categories.\n\nTonbo Imaging India\u2019s IPO was subscribed 7.77 times on the second day, driven by strong demand from non-institutional investors (NIIs), whose portion was subscribed 14.35 times. The retail investor portion was subscribed 7.12 times, while qualified institutional buyers (QIBs) subscribed 3.95 times their allotted quota.\n\nBonfiglioli Transmissions\u2019 IPO was subscribed 99% on the second day of bidding. The NII portion was subscribed 1.71 times, while the retail portion was subscribed 1.16 times. The QIB portion saw a relatively subdued response, with subscriptions at 16% of the shares reserved for the category.\n\nSahajanand Medical Technologies\u2019 IPO was subscribed 82% by the end of the second day. The QIB portion was subscribed 1.12 times, while retail investors subscribed to 82% of their allotted portion. The NII segment saw a 51% increase in subscriptions.\n\nZetwerk Manufacturing Business\u2019 IPO witnessed a slower response, with the issue subscribed 31% on the second day. The QIB portion was subscribed 37%, followed by 36% subscription in the retail category. The NII portion was subscribed 16%.\n\nAll four IPOs opened for subscription on Thursday, 15 October, and are scheduled to close on Monday, 19 October.\n\nZetwerk IPO GMP today, or grey market premium, is +7.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 04:50 PM IST", "pub_date_relative": "48m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Energy stocks dividend leaderboard: Power Grid, NTPC, SJVN, NHPC or IREDA - Which power stock beats the rest on yield?", "full_content": "Energy stocks dividend leaderboard: Energy has emerged as one of the most popular themes over the past few years. Shares like Power Grid, NTPC, NHPC have delivered double digit returns over the past three years. For dividend hunters, let\u2019s compare the annual yield of top energy stocks including Power Grid, NTPC, SJVN, NHPC and IREDA .\n\nPower Grid has an annual dividend yield of 3.08% for the year 2026. The stock closed 250.95 per share on BSE on Friday, October 16. Its share price value has declined -14% in one year, -23% in two years and has surged close to 23.59% in three years.\n\nJust like Power Grid, NTPC has announced a total of \u20b9 9 per equity share dividend in last one year. Its yield stood at 2.63%. The stock closed at \u20b9 316 per share on BSE. Its share price value has declined 25.39% in two years, but has surged 30% in three years.\n\nSJVN, NHPC and IREDA have announced dividend less than \u20b9 2 per equity share over the last one year. SJVN stock has delivered -39% return in one year. NHPC has declined close to -17.20% in the duration, whereas, IREDA has delivered -29.39% return in one year.\n\nOut of the five stocks, Power Grid has the highest annual dividend yield over the past year. NTPC has a dividend yield of 2.63%.\n\nAnnual dividend yield is the percentage of the amount used to purchase a stock and the dividend income earned from it over the period of one year. IT matters because it helps investors to understand the cash return they get per Rupees invested in a stock.\n\n(Note: Annual dividend yield calculated based on the historical purchase price of the stocks.)\n\nCatch all the Business News , Market News , Breaking News Events and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 04:41 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Semiconductor market to remain solid \u2018at least through next year,\u2019 South Korea finance minister says", "full_content": "The semiconductor boom will last at least through 2027, South Korean finance minister Lee Hyoung-Il said on Saturday.\n\n\"For now, our view is that we can sustain this growth at least through next year,\" Lee told CNBC on the sidelines of the IMF-World Bank annual meetings in Bangkok. \"That's because the gap between demand and supply for semiconductors is still very wide, and supply is still being expanded.\"\n\nHis comments come after semiconductor stocks fell sharply this week, hurt by investor concerns about interest rate hikes and rising competition from Chinese companies. South Korean chip stocks like SK Hynix and Seoul Semiconductor were part of the sell-off, along with U.S. giants like Nvidia .\n\nChip stocks' large weighting has fueled volatility in South Korea's stock market this year, Lee said. He attributed the market's wild swings to the semiconductor industry's larger share of the economy than in other countries. Despite the market swings, South Korea's economy is \"solid,\" Lee said.\n\nOn Thursday, an opinion column in Maeil Business Newspaper , a prominent South Korean publication, urged the country's government to prepare for the coming slowdown in the artificial intelligence boom. The author said two experts expect a \"flood of new supply\" of semiconductors that will turn the memory market \"into a red ocean\" by 2029, according to a CNBC translation .\n\nWhile South Korea's semiconductors may be driving volatility in its stock market, the industry has also fueled tax growth. Lee said the country expects to collect more taxes than initially projected this year.\n\nSouth Korea will ultimately be in a stronger fiscal position because of the chip boom, he added.\n\nWATCH: Don't overlook opportunity in South Korea, says Verdad Advisers' Rasmussen", "source": "CNBC Top News", "pub_date_str": "18 Oct 2026, 04:40 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Kelly Services delivers 67% return after Fair Value signal", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:39 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "InvestingPro\u2019s Fair Value spotted Infleqtion\u2019s 52% drop in advance", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 04:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "EPFO scheme offers up to \u20b915,000 to first-time employees: Check eligibility, salary limit and payment rules", "full_content": "Eligible first-time employees joining the formal workforce can receive an incentive of up to \u20b9 15,000 under the Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY). The scheme, administered through the Employees\u2019 Provident Fund Organisation (EPFO), aims to encourage formal employment by rewarding eligible workers entering the Employees\u2019 Provident Fund (EPF) system for the first time.\n\nHowever, the benefit is subject to eligibility and service conditions. Employees cannot assume they will automatically receive \u20b9 15,000 simply by joining a company. The incentive is linked to eligible EPF wages, continued employment and compliance with the scheme\u2019s requirements.\n\nThe scheme covers eligible jobs created between 1 August 2025 and 31 July 2027. Employees earning monthly wages of up to \u20b9 1 lakh may qualify, subject to the other conditions. The incentive is equivalent to one month\u2019s eligible EPF wage, capped at \u20b9 15,000.\n\nTo qualify under Part A of PM-VBRY, an employee must be joining the formal workforce as a first-time EPF member. The scheme covers eligible employees joining establishments between 1 August 2025 and 31 July 2027, provided they meet the prescribed membership, wage and employment conditions.\n\nEmployees should check their EPF membership history and ensure that their employer is depositing contributions and filing the required Electronic Challan-cum-Returns (ECRs). Meeting the salary limit alone does not guarantee eligibility.\n\nThe incentive is paid in two instalments, subject to the scheme's conditions. The first instalment is available after six months of continuous service, while the second is linked to completing 12 months of service and the prescribed financial literacy programme.\n\nThe amount is based on eligible wages, so not every employee will receive the maximum. Further, the second instalment is not necessarily paid as immediately withdrawable cash.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 04:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Five Snapdragon Smartphones Under Rs 45,000 In India: OnePlus Nord 6, Redmi Note 17 Pro And More", "full_content": "Looking for a new smartphone under Rs 45,000? These five options offer different strengths, including large batteries, high refresh rate displays and versatile cameras.", "source": "NDTV Profit", "pub_date_str": "18 Oct 2026, 04:09 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stocks to buy: Ganesh Dongre of Anand Rathi recommends Larsen and Toubro, Equitas, Bajaj Finance shares | Target, SL", "full_content": "Stocks to buy | Ganesh Dongre's stock recommendations: The key benchmark indices of the Indian stock market ended the week on a positive note, with the Nifty gaining nearly 3.78% to close at 23,146, while the Bank Nifty advanced 0.79% to settle at 55,844. Sectoral performance was broadly positive, with most major sectors witnessing gains. The IT sector emerged as the top performer, rallying nearly 10% during the week.\n\nGanesh Dongre, AVP \u2014 Equity Research at Anand Rathi, believes the recovery during the week was supported by buying interest at lower levels, although global uncertainties continue to weigh on overall market sentiment.\n\n\u201cConcerns surrounding the US Federal Reserve\u2019s interest-rate outlook, the possibility of further rate hikes by the Fed and the RBI in the coming quarters, and the upward bias in US 10-year Treasury yields remain key factors influencing global risk appetite and foreign institutional investor (FII) flows into emerging markets, including India,\u201d Ganesh Dongre of Anand Rathi said.\n\nFactors that may dictate the Indian stock market next week, Ganesh Dongre of Anand Rathi said, traders should closely monitor Brent crude oil prices, which are approaching their previous highs near $110 per barrel. A sustained move above this level could push crude prices towards $114 per barrel, potentially increasing inflationary concerns and adding pressure on equity markets. So any fresh geopolitical developments, particularly those involving the Middle East and US\u2013Iran relations, could further influence crude oil prices and market sentiment. Therefore, movements in crude oil and developments on the geopolitical front will remain critical factors in determining the market's next directional move.\n\nThe Anand Rathi expert believes the Nifty witnessed a notable rebound from the 22,000\u201322,200 support zone and recovered towards the 23,200 mark by the end of the week.", "source": "LiveMint Markets", "pub_date_str": "18 Oct 2026, 03:51 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ICICI Bank ADR earnings missed, revenue was in line with estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "18 Oct 2026, 03:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Eating out with family for Diwali, Dussehra? Here's why your restaurant bills may go up by 10-15% this festive season", "full_content": "Planning to eat out with your family during this festive season on Diwali and Dussehra? You may have to shell out more as restaurant menu prices are set to rise by around 10-15% at member establishments in Mumbai, according to the Indian Hotel and Restaurant Association ( AHAR ).\n\nIn a statement from AHAR President Vijay K Shetty, titled \u2018Balancing the price on the menu with the cost behind the meal\u2019, he credited the impending menu price rise to sustained increases in the cost of preparing and serving food.\n\nThe statement said that revised prices are expected to be introduced progressively over the coming weeks across dine-in, quick-service and delivery menus. \u201cThe revision follows several months during which restaurants absorbed higher expenses to limit the impact on customers,\u201d the statement added.\n\nAccording to Shetty, for restaurants in the financial capital, the challenge extends beyond the price of any single commodity. \u201cCooking fuel, everyday ingredients, commercial rents, employee wages and transportation have become more expensive. With these costs rising together, establishments face growing pressure on the margins that support daily operations,\u201d he said.\n\nThe statement said recent reports illustrate the pressure on everyday kitchen essentials.\n\nAccording to AHAR said the proposed adjustment reflects the cumulative burden of higher procurement and operating expenses . \u201cEven where individual ingredient prices stabilise or ease temporarily, restaurants continue to carry higher recurring costs. The cost of a meal includes the people who prepare and serve it, the premises in which it is served, and the hygiene, maintenance and utilities required to keep a kitchen functioning consistently,\u201d it added.\n\nThe association emphasised that the revision is intended to recover a portion of the additional expenditure while maintaining food quality and service standards.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 03:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "DIIs increase stake in 8 midcap stocks in Q2FY27", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News DIIs increase stake in 8 midcap stocks in Q2FY27 Written by Ritesh Presswala , ETMarkets.com | Oct 18, 2026, 03:44:33 PM IST 1 / 9 DII buying Domestic Institutional Investors (DIIs) raising their holdings in a company can signal growing confidence in its prospects. Based on shareholding disclosures available so far for the September 2026 quarter, we have identified nine NSE midcap stocks that recorded an increase of over 200 basis points in DII shareholding on a quarter-on-quarter basis in Q2FY27, according to StockEdge\u2019s shareholding scan.\n\nDII shareholding in the stock rose to 34.49% in the September '26 quarter, up from 27.38% in June '26.\n\nDII shareholding in the stock rose to 29.52% in the September '26 quarter, up from 24.86% in June '26.\n\nDII shareholding in the stock rose to 13.65% in the September '26 quarter, up from 9.14% in June '26.\n\nDII shareholding in the stock rose to 11.24% in the September '26 quarter, up from 6.95% in June '26.\n\nDII shareholding in the stock rose to 26.81% in the September '26 quarter, up from 23.57% in June '26.\n\nDII shareholding in the stock rose to 21.75% in the September '26 quarter, up from 18.63% in June '26.\n\nDII shareholding in the stock rose to 20.83% in the September '26 quarter, up from 18.6% in June '26.", "source": "Economic Times Markets", "pub_date_str": "18 Oct 2026, 03:40 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Credit report errors: How mistakes like wrong phone number will impact your credit score? 5 things you must do correctly", "full_content": "An incorrect mobile number, an incorrectly reported loan, or an unfamiliar credit inquiry in an individual's credit report can raise concerns about their credit profile. Now, it is a given that not every error directly lowers your credit score; incorrect information can affect how lending institutions assess an individual\u2019s creditworthiness and may also indicate a risk of identity theft.\n\nIt is vital to keep in mind that an individual's credit report and credit score are entirely different. A credit score is a three-digit number provided by leading credit bureaus across the nation, such as CRIF High Mark, Experian, Equifax and TransUnion CIBIL. This metric typically ranges from 300 to 900, with a credit score above 750 considered excellent.\n\nA credit report is a slightly different metric. It records an individual\u2019s borrowing and repayment history, credit utilisation and other relevant details. Therefore, checking it regularly and correcting discrepancies is essential for maintaining an accurate credit profile, which in turn helps an individual maintain a high credit score that can come in handy when applying for new loans and credit cards.\n\nNow let us discuss several factors an individual should get right to ensure their credit score remains healthy and their credit profile remains neat and well-managed.\n\n1 . Check your mobile number and personal details: Ensure your name details, mobile number, address and other identifying data points are correct and updated. A wrong phone number may complicate identity verification and indicate that your details have been mixed up with someone else\u2019s records. It does not automatically reduce your score.\n\n2. Verify loan and credit card accounts: Check whether all listed personal loans, home loans and credit cards belong to you. An unfamiliar account or loan could indicate a reporting error or possible identity theft, which needs prompt investigation and amicable resolution.\n\n3.", "source": "LiveMint Money", "pub_date_str": "18 Oct 2026, 03:30 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Faster services imports threaten to erode cushion against India\u2019s goods trade deficit: Report", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Faster services imports threaten to erode cushion against India\u2019s goods trade deficit: Report The Economic Times daily newspaper is available online now. Read Today's Paper Faster services imports threaten to erode cushion against India\u2019s goods trade deficit: Report SECTIONS Faster services imports threaten to erode cushion against India\u2019s goods trade deficit: Report ANI Last Updated: Oct 18, 2026, 03:26:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's services trade surplus has declined as imports grew faster than exports, leading to concerns about foreign exchange earnings. In September 2026, net services exports fell by 10 percent to USD 16.9 billion. Despite strong growth in merchandise exports of 23 percent, the services sector faces challenges. While cumulative net services exports increased during the first half, their sustainability is uncertain.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "18 Oct 2026, 03:26 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Adani Group stocks Q2 results 2026 date this week: Adani Green, Adani Energy, Adani Gas, Adani Power schedule, returns", "full_content": "Adani Group companies Q2 results 2026: As the earnings season is going on in full swing, four Adani Group companies will remain at the centre of attraction this week as they announce their results for the quarter ended September 2026. Adani Green Energy , Adani Energy Solution
