s traders moved back into tech following last week's artificial intelligence-related rout.\n\nThe tech-heavy index added 1.2%, while the S&P 500 gained 0.5%. The Dow Jones Industrial Average traded around the flatline.\n\nIntel advanced 2% after JPMorgan analysts upgraded their rating on the chipmaker. Advanced Micro Devices and Micron Technology were also up 1% and 2%, respectively.\n\nHowever, neocloud mainstay CoreWeave reversed course from earlier gains, falling 3%, even after receiving an upgrade at Goldman Sachs . The stock plunged more than 25% last week \u2014 its biggest one-week drop since November 2025 \u2014 over debt concerns.\n\nThe S&P 500 lost nearly 2% last week \u2014 its biggest weekly decline since late June. The Nasdaq tumbled 4.5%, snapping a four-week winning streak. Information technology also shed more than 6% to post its worst weekly performance since April 2025. It was the most net sold global sector last week , with hedge funds selling the largest percentage of tech on record, per Goldman Sachs.\n\nConcerns around the health of the AI trade took center stage after CNBC reported, citing sources, that Anthropic's third-quarter revenue totaled $16.8 billion . And while that's up from $11.6 billion in the second quarter, it raised flags among investors about the pace of growth with the AI build-out.\n\nInvestors in the corporate bond market have started to shun CoreWeave, with the company's credit default swaps reaching distress levels .\n\nLNW chief investment officer Ron Albahary believes the recent moves in CoreWeave's spreads is a sign that the narrative surrounding the AI trade's relative insulation from the rise in interest rates has changed. If earnings growth moderates, he thinks the market could become \"increasingly more fragile.\"", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 12:25 AM IST", "pub_date_relative": "28m ago"}, {"title": "S&P rises and Nasdaq jumps over 1%, rebounding after their worst week since June", "fu may keep price of spices elevated By Shambhavi Anand , ET Bureau Last Updated: Oct 20, 2026, 12:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Southern India is currently grappling with challenges in spice production, primarily due to uneven monsoon patterns and parched soil, which are adversely affecting harvest yields. Despite expanding cultivation areas, turmeric yields are predicted to plummet owing to unfavorable weather. Additionally, delays in red chilli sowing in Andhra Pradesh and Telangana could lead to surging market prices.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 12:11 AM IST", "pub_date_relative": "41m ago"}, {"title": "Jio Platforms IPO listing: Can Reliance overtake Tata Group as India\u2019s largest conglomerate by market cap? Details", "full_content": "The race to become India\u2019s largest business conglomerate by combined market capitalisation could intensify with the upcoming listing of Jio Platforms. Based on its estimated valuation, the IPO could propel Mukesh Ambani-led Reliance Group past the Tata Group to claim the top spot, with the Adani Group and HDFC Group following behind.\n\nAccording to recent data, Reliance Group has 12 listed companies with a combined market capitalisation of \u20b9 18.05 lakh crore. Reliance Industries accounts for the lion\u2019s share, with a market value of \u20b9 16.2 lakh crore, followed by Jio Financial Services at \u20b9 1.41 lakh crore.\n\nJio Platforms, which is set to become the 13th publicly listed company under the group, is estimated to be valued at around \u20b9 10.3 lakh crore at the upper end of its proposed IPO price band.\n\nIf listed at this valuation, the combined market capitalisation of the Reliance Group could rise to approximately \u20b9 28.35 lakh crore, potentially surpassing the Tata Group\u2019s combined market capitalisation of \u20b9 25.92 lakh crore.\n\nReliance Industries remains the dominant contributor to the group\u2019s market capitalisation, with a market value of \u20b9 16.2 lakh crore. At its peak, the company commanded a market capitalisation of \u20b9 21.2 lakh crore.\n\nBeyond Reliance Industries and Jio Financial Services, the group\u2019s other listed companies have comparatively smaller market values. These include Just Dial, with a market capitalisation of \u20b9 6,223 crore; Hathway Cable and Datacom, at \u20b9 1,725.85 crore; DEN Networks, at \u20b9 1,232 crore, Reliance Industrial Infrastructure, at \u20b9 1,129.40 crore, and GTPL Hathway, at \u20b9 615 crore.\n\nThe Tata Group ranks behind Reliance on the basis of the current combined market capitalisation of its listed companies, at \u20b9 25.92 lakh crore.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 12:06 AM IST", "pub_date_relative": "46m ago"}, {"title": "Women may be at greater risk of AI job losses. Telephone switch operators and PCs show why", "full_content": "Decades before Siri or Alexa or ChatGPT, there was a real person, almost always a woman, at the center of the information world. She was so vital, most long-distance communication could not happen without her.\n\nShe was the telephone switch operator, and at one time she was part of the single largest occupation for white, U.S.-born women under age 20.\n\nThe world is struggling to figure out what the dawn of artificial intelligence means for society, culture and the economy. A lot of ordinary Americans are just wondering what it means for their jobs.\n\nThe history of technological progress \u2014 from automated telephone switches to the introduction of the washing machine and the personal computer \u2014 can offer some guidance. And that guidance suggests women are likely to be among the most affected by AI.\n\n\"AI is focused on routine tasks and numbers and finding patterns, and those types of jobs are the clerical, administrative jobs that a lot of women hold,'' said Ariane Hegewisch, a senior research fellow at the Institute for Women's Policy Research. \"It's still 90% of secretaries and clerical workers who are women.\"\n\nNew research backs this up. The International Labour Organization in March concluded that nearly 1 in 10 women in high-income countries work in occupations at the highest risk from AI.\n\nIn the 1940s, nearly 95% of America's telephone operators were female. It was a relatively well-paying job for women at the time, and a complicated one: It took months of training to be able to handle the several hundred calls an hour that could come in at peak times. Operators were expected to be speedy, precise \u2014 and polite.\n\nThese women were hit hard when AT&T introduced the automated telephone switch. It was one of the largest automation investments in history \u2014 a close analog to the massive AI investment now underway \u2014 and created one of the biggest technological shocks the nation had ever seen.", "source": "CNBC World Economy", "pub_date_str": "20 Oct 2026, 12:06 AM IST", "pub_date_relative": "47m ago"}, {"title": "India-New Zealand FTA comes into effect today", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-New Zealand FTA comes into effect today The Economic Times daily newspaper is available online now. Read Today's Paper India-New Zealand FTA comes into effect today SECTIONS India-New Zealand FTA comes into effect today By ET Bureau Last Updated: Oct 20, 2026, 12:02:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The FTA will provide Indian exporters with 100% duty-free access to the New Zealand market, opening opportunities for MSMEs, women entrepreneurs, farmers and artisans. This is expected to facilitate $20 billion in investments into India in 15 years that would create opportunities across manufacturing, infrastructure, agriculture, and innovation.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 12:02 AM IST", "pub_date_relative": "51m ago"}, {"title": "AT-1 bonds back in news after Yes Bank case: Why banks issue them, how investors earn returns | Don'ts to avoid losses", "full_content": "AT-1 bonds are back in focus after the Supreme Court upheld a Bombay High Court ruling quashing Yes Bank's 2020 write-off of bonds worth \u20b9 8,415 crore. The verdict marks a landmark win for bondholders whose investments were cancelled during the bank's rescue facilitated six years ago.\n\nYes Bank plunged into a liquidity crisis in March 2020 as bad loans swelled, prompting the Reserve Bank of India (RBI) to take control of the lender and freeze withdrawals. To stabilise the bank, a consortium of lenders led by the State Bank of India (SBI) was assembled to to inject fresh equity capital.\n\nAs part of the exercise, the bank\u2019s administrator wrote down around \u20b9 8,415 crore worth of Additional Tier-1 (AT-1) bonds, prompting Axis Trustee Services and other bondholders to challenge the move in court.\n\nBanks issue AT-1 bonds under Basel III norms to strengthen their core Tier-1 capital, absorb financial losses, and support lending growth without diluting existing equity shareholding. While these bonds can be attractive in terms of interest rates, they also carry significant risks.\n\n\u201cTo attract capital, these instruments offer higher interest rates than conventional fixed-income products. However, AT-1 bonds are perpetual with no fixed maturity date, and banks retain the right to cancel interest payments without obligation to pay them later,\u201d according to K Sai Teja, an advocate at the Supreme Court of India.\n\nHe further explained that if a bank\u2019s common equity Tier-1 (CET1) ratio falls below regulatory thresholds, the principal can be partially or completely written down, as demonstrated during the 2020 Yes Bank crisis.\n\nA bank's Tier 1 capital ratio measures its core equity and reserves against its total risk-weighted assets to test financial strength and loss absorption.\n\nSince AT-1 bonds do not have a maturity date, lenders only need to pay coupon every year. However, most AT-1 bonds have a call option under which banks repay investors in full after five or 10 years.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 11:59 PM IST", "pub_date_relative": "54m ago"}, {"title": "Stocks making the biggest moves midday: Sandisk, Marvell, Datadog, Cleveland-Cliffs, Amazon & more", "full_content": "Here are some of the companies making headlines in midday trading.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 11:56 PM IST", "pub_date_relative": "57m ago"}, {"title": "Jio Platforms IPO draws \u20b98,110 crore in anchor investor bids", "full_content": "BlackRock Inc., Fidelity Management & Research, Capital Group and Allianz SE were among the investors taking anchoring stakes in Jio Platforms Ltd.\u2019s $3.2 billion initial public offering, as Reliance Industries Ltd.\u2019s telecom and digital services arm prepares for what\u2019s set to be India\u2019s biggest-ever share sale.\n\nInvestment bankers working on the transaction allocated 7.247 crore shares to anchor investors at \u20b9 1,119 apiece, the top end of the marketed range, raising \u20b9 8,110 crore ($854 million), according to an exchange filing.\n\nSovereign wealth funds including Abu Dhabi Investment Authority, Government of Singapore, Qatar Investment Authority and Norges Bank Investment Management also participated in the anchor book, the filing showed.\n\nThe offering drew strong demand from domestic mutual funds and insurers. Life Insurance Corporation of India , SBI Funds Management Ltd. , ICICI Prudential Asset Management Co. Ltd. and HDFC Asset Management Co. Ltd. were among the largest anchor investors in the offering.\n\nJio Platforms is seeking a valuation of as much as 10.3 lakh crore in the IPO. The company is offering as many as 27 crore shares at \u20b9 1,065-1,119 apiece, seeking to raise as much as \u20b9 30,200 crore. The shares on offer represent about 2.9% of Jio\u2019s post-issue equity capital, according to Bloomberg calculations.\n\nEven at the bottom of the price range, the offering would raise about \u20b9 28,700 crore, surpassing Hyundai Motor India Ltd.\u2019s \u20b9 27,800-crore share sale in October 2024, currently the country\u2019s largest IPO.\n\nJio has reserved shares worth as much as \u20b9 500 crore for eligible employees, who are being offered a discount of about 5%, company filings show. The IPO also includes a reservation of as much as \u20b9 2,500 crore of shares for eligible Reliance Industries shareholders.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:54 PM IST", "pub_date_relative": "58m ago"}, {"title": "Saudi Arabia Postpones Its FII Investment Event After Houthi Attacks - The New York Times", "full_content": "Saudi Arabia Postpones Its FII Investment Event After Houthi Attacks The New York Times Saudi Arabia cancels next week\u2019s \u2018Davos in the Desert\u2019 conference after series of Houthi attacks CNN Exclusive | Wall Street Elite Can\u2019t Decide How to RSVP to the Prince\u2019s Big Saudi Conference WSJ Saudi Arabia postpones big investor conference to 2027 as Iran-backed Houthis escalate attacks on kingdom CNBC Saudis Push Flagship FII Summit to 2027 After Houthi Attacks Bloomberg.com", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 11:51 PM IST", "pub_date_relative": "1h ago"}, {"title": "Apple Sets Oct 28 'Pro And Tell\u2019 Event; Touchscreen MacBook Tipped To Debut", "full_content": "Apple has announced an October 28 product event, with analysts anticipating new Macs and a possible touchscreen MacBook. The launch comes as CEO John Ternus adopts a faster product rollout schedule and Apple strengthens its AI-focused computing strategy.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:50 PM IST", "pub_date_relative": "1h ago"}, {"title": "S&P Global flags potentially hidden AI debt at hyperscalers as AI spending surges", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a S&P Global flags potentially hidden AI debt at hyperscalers as AI spending surges Powered By The Economic Times daily newspaper is available online now. Read Today's Paper S&P Global flags potentially hidden AI debt at hyperscalers as AI spending surges SECTIONS S&P Global flags potentially hidden AI debt at hyperscalers as AI spending surges ETMarkets.com Last Updated: Oct 20, 2026, 12:20:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis S&P Global warned that hyperscalers could be carrying more AI related debt than currently visible through financing structures linked to data centres and smaller AI firms. Despite rising concerns around AI infrastructure debt, the agency saw no immediate need for rating changes, while flagging profitability and escalating investment as key risks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago"}, {"title": "US stocks recover after AI sell-off", "full_content": "Nasdaq 100 rises following biggest weekly drop since last year\u2019s trade war rout", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 11:45 PM IST", "pub_date_relative": "1h ago"}, {"title": "Preached Starvation To Meet Jesus': Kenyan Cult Leader Convicted Over Starvation Deaths Of 200 Minors", "full_content": "More than 400 bodies were recovered from Shakahola Forest after the alleged starvation cult came under investigation in 2023.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Already a hit? Reliance's Jio Platforms gets \u20b98,110 cr from anchor investors; LIC, New World Fund among top investors", "full_content": "Jio Platforms has allotted shares worth \u20b9 8,110 crore to 212 anchor investors at the upper end of its price band of \u20b9 1,119 per share, according to a stock exchange filing.\n\nThe company allotted 7.24 crore shares to anchor investors ahead of its initial public offering (IPO), which opens for public subscription on Wednesday, October 21. The strong institutional response highlights investor interest in what is expected to be India\u2019s biggest-ever IPO.\n\nLife Insurance Corporation of India (LIC) received the largest allocation, worth \u20b9 500 crore, accounting for 6.17% of the anchor book.\n\nNew World Fund Inc. was allotted shares worth \u20b9 486.27 crore, followed by the Government of Singapore at \u20b9 340.93 crore, SBI Focused Fund at \u20b9 315 crore, and BNP Paribas Financial Markets \u2013 ODI at \u20b9 303.25 crore, the filing showed.\n\nDomestic mutual funds received 2.48 crore shares worth \u20b9 2,785 crore, representing 34.34% of the anchor allocation. The shares were allotted through 95 schemes across 25 fund houses. Life insurers and pension funds received 97.4 lakh shares worth \u20b9 1,090 crore, or 13.44% of the total.\n\nGlobal investors participating in the anchor book include BlackRock, Fidelity, Capital Group, T. Rowe Price, Schroders, JPMorgan Asset Management, Franklin Templeton, and Janus Henderson. Sovereign and public investment institutions include the Abu Dhabi Investment Authority and the Monetary Authority of Singapore.\n\nJio Platforms aims to raise around \u20b9 30,213 crore through a fresh issue of up to 27 crore shares, priced between \u20b9 1,065 and \u20b9 1,119 apiece. At the upper end of the price band, the offering values the company at approximately $108 billion.\n\nThe IPO will open on October 21 and close on October 23. A portion of the proceeds will go towards repaying debt at its telecom subsidiary, while the remainder will be used for general corporate purposes. Reliance Industries, controlled by billionaire Mukesh Ambani, will retain a majority stake following the listing.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:42 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tariff quota notified for New Zealand fruits, honey", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Tariff quota notified for New Zealand fruits, honey The Economic Times daily newspaper is available online now. Read Today's Paper Tariff quota notified for New Zealand fruits, honey SECTIONS Tariff quota notified for New Zealand fruits, honey ET Bureau Last Updated: Oct 19, 2026, 11:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Kiwifruit imports will qualify for zero customs duty under the tariff rate quota (TRQ), subject to a minimum CIF value of $1.80 per kg while 40 tonnes of New Zealand-certified Manuka honey under the quota have been permitted for 2026. The annual limit will increase to 200 tonnes from 2027.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Oct 2026, 11:37 PM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today: S&P 500 and Nasdaq rally as tech stocks bounce, Dow wavers; oil slips while yields tick up - MarketWatch", "full_content": "Stock Market Today: S&P 500 and Nasdaq rally as tech stocks bounce, Dow wavers; oil slips while yields tick up MarketWatch Nasdaq gains as investors buy the dip in the AI trade: Live updates CNBC What\u2019s Moving Markets Today? WSJ AI stocks lead a rebound on Wall Street as European markets drop following protests AP News Nasdaq 100 Climbs on AI Trade Revival After Rout: Markets Wrap Bloomberg.com", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 11:34 PM IST", "pub_date_relative": "1h ago"}, {"title": "1 Finance gets in-principle SEBI approval for MF Lite: Will investors get more choice in index funds and ETFs?", "full_content": "1 Finance has received in-principle approval from the Securities and Exchange Board of India (SEBI) for an asset management company (AMC) licence under the regulator\u2019s Mutual Funds Lite (MF Lite) framework, paving the way for its entry into India\u2019s passive mutual fund market.\n\nThe personal finance advisory and wealth-tech firm is targeting a launch in the fourth quarter of FY27, subject to completing regulatory and operational requirements and obtaining SEBI\u2019s final registration. Its proposed AMC will focus on passive investment products such as index funds and exchange-traded funds (ETFs), according to the company\u2019s press release dated 19 October.\n\nThe approval comes as SEBI seeks to encourage more asset managers to enter the passive fund segment through a separate regulatory framework with lighter compliance requirements. 1 Finance, which has more than \u20b9 17,000 crore in assets under advice (AUA), plans to extend its existing financial planning business into investment products.\n\nSEBI introduced the MF Lite framework on 31 December 2024 to ease entry barriers for asset management companies seeking to offer eligible passive mutual fund schemes. Under the earlier regulatory framework, active and passive schemes were subject to a common set of requirements, including provisions relating to net worth, track record, profitability and ongoing compliance.\n\nThe regulator said several requirements designed for actively managed funds may not be necessary for passive schemes. The lighter framework aims to encourage new players, reduce compliance requirements, increase market penetration, facilitate investment diversification and foster innovation.\n\nPassive funds seek to replicate the performance of an underlying index rather than rely on a fund manager to select securities in an attempt to outperform the market. Index funds and ETFs are common examples.\n\nHowever, not every passive investment product automatically qualifies under MF Lite.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 11:27 PM IST", "pub_date_relative": "1h ago"}, {"title": "Eyes on Wall Street: General Motors shares in focus ahead of 3rd quarter results - Key factors investors should watch", "full_content": "Shares of General Motors (GM) will be in focus on Tuesday, October 20, as the US automaker is scheduled to announce its third-quarter 2026 financial results before the opening bell. Wall Street analysts expect a sharp increase in earnings, supported by improving profitability despite relatively flat revenue growth.\n\nThe consensus earnings-per-share (EPS) estimate has risen to $3.63 from $3.55 over the past month, marking an increase of 2.3%. Over the past 90 days, the forecast has climbed 11.3% from $3.26, indicating improving analyst expectations ahead of the earnings announcement.\n\nThe upward revisions suggest that analysts may be factoring in stronger vehicle pricing, improved production efficiency or a more favourable sales mix. However, the company's actual performance and outlook will determine whether it meets these expectations.\n\nGeneral Motors shares were trading lower on Monday ahead of the quarterly results. At 1:15 p.m., the stock was down 1.86%, or $1.56, at $82.40 per share.\n\nDespite the day's decline, the stock remained up 1.79% year to date.\n\nInvestors will be watching the results for indications of whether the automaker can sustain its earnings momentum amid changing vehicle demand, pricing conditions and manufacturing costs. The company's guidance and commentary on its operating performance could also influence market sentiment.\n\nAnalysts expect General Motors to report earnings of $3.63 per share for the third quarter of 2026, up 29.6% from $2.80 in the corresponding quarter last year.\n\nThe projected increase points to a substantial improvement in profitability compared with the year-ago period. The higher earnings estimate also reflects the positive revisions made by analysts over the past three months.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Meta Blames Bot-Detection Glitch For Suspending 'No Kings\u2019 Account During Mass Protests", "full_content": "Meta says a surge of automated requests from a Claude tool caused it to wrongly suspend the \u201cNo Kings\u201d Instagram account. The protest coalition is calling for accountability weeks before the US midterm elections.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "Elon Musk says he's giving SpaceX stock to every kid in America - Yahoo Finance", "full_content": "Elon Musk says he's giving SpaceX stock to every kid in America Yahoo Finance Elon Musk says he'll give a SpaceX share to every child in America next year CNBC Elon Musk to give SpaceX shares to \u2018every kid in America\u2019 WBBJ-TV Elon Musk and Anthropic make promises to give the public a piece of the AI pie NBC News Elon Musk says he\u2019ll give a SpaceX share to every American child The Washington Post", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 11:22 PM IST", "pub_date_relative": "1h ago"}, {"title": "iQOO Neo 12 Launch Date Set For October 28 In China; Design And Colour Options Revealed", "full_content": "iQOO will launch the Neo 12 in China on October 28. The gaming-focused phone gets a Snapdragon 8 Elite Gen 5 chip, a Q3 gaming chip, an active cooling fan and three colour options.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:20 PM IST", "pub_date_relative": "1h ago"}, {"title": "Tecno Spark 50S 5G Goes On Sale In India Tomorrow: Price, Offers And Specifications", "full_content": "The Tecno Spark 50S 5G goes on sale in India on October 20, priced from Rs 19,999. It packs a 6,500mAh battery, 45W charging, a 120Hz display and MIL-STD-810H durability.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:19 PM IST", "pub_date_relative": "1h ago"}, {"title": "CJP's Ashutosh Ranka, Saurav Das In Tihar Jail Till Oct 21; Judicial Custody Extended By Two Days", "full_content": "Ranka and Das were produced before a Special Executive Magistrate at Mandir Marg police station for the required proceedings, after which they were taken back to Tihar Jail.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "PM Modi, FM Sitharaman In Deepfake Ads Promising Free Money; I4C Issues Warning", "full_content": "Fraudsters are using manipulated videos of political leaders to promise financial assistance, with victims allegedly tricked into making repeated payments or approving fraudulent UPI transactions.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:16 PM IST", "pub_date_relative": "1h ago"}, {"title": "One of this year\u2019s most important relationships in global financial markets is falling apart", "full_content": "One of the most important relationships in global markets has started to unravel over the past couple of weeks. Investors are scrambling to figure out what it might mean for the economy, and their portfolios.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Oct 2026, 11:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio Raises Rs 8,110 Crore From Anchor Investors Ahead Of IPO; LIC, SBI MF Among Top Investors", "full_content": "LIC received the largest allocation in the anchor book, worth Rs 499.98 crore, accounting for 6.17% of the total.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Jio IPO: LIC, BlackRock, Fidelity, GIC among 212 anchor investors to pour Rs 8,110 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio IPO: LIC, BlackRock, Fidelity, GIC among 212 anchor investors to pour Rs 8,110 crore Geojit Financial Services Share Price SBFC Finance Share Price Religare Enterprises Share Price Fedbank Financial Services Share Price Mas Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO: LIC, BlackRock, Fidelity, GIC among 212 anchor investors to pour Rs 8,110 crore SECTIONS Jio IPO: LIC, BlackRock, Fidelity, GIC among 212 anchor investors to pour Rs 8,110 crore By Akash Podishetti , ETMarkets.com Last Updated: Oct 19, 2026, 11:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms successfully raised approximately Rs 8,110 crore from 212 anchor investors before its upcoming IPO. The company allotted shares to well-known investors such as LIC, BlackRock, and Fidelity. These allocations indicate strong interest from both domestic and global institutional investors. The IPO is expected to surpass the previous record held by Hyundai Motor India. Jio Platforms aims to achieve an equity valuation of nearly Rs 10.3 lakh crore.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 11:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "When should you dump your target-date funds?", "full_content": "Target-date funds aren\u2019t necessarily built to handle many of the decisions retirees face.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Oct 2026, 11:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "\u2018My husband suffered a massive stroke at 53\u2019: I\u2019m 64 and will rent for the rest of my life \u2014 but I\u2019m still hopeful", "full_content": "\u201cIll-timed circumstances can change our financial future in unexpected ways.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "19 Oct 2026, 11:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Goldman says play defense with these stocks if you're worried about the AI bull failing", "full_content": "These defensive stocks, some of which have lagged, could be ready rally as investors bail on AI trade.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 10:58 PM IST", "pub_date_relative": "1h ago"}, {"title": "Apple announces product launch event for Oct. 28. Analysts expect touchscreen laptop", "full_content": "Apple announced a product launch event on Oct. 28, sending invitations on Monday to media and analysts for an \"Apple Experience in Los Angeles\".\n\nThe email says \"Pro and tell,\" suggesting the launch will focus on high-end \"Pro\" devices with powerful homegrown chips.\n\nBen Reitzes, an analyst at Melius Research, wrote in a note on Monday that he expects new Macs to be introduced, \"including a touchscreen notebook,\" this fall. He said that for CEO John Ternus, who succeeded Tim Cook last month, the launch cadence marks a \"meaningful shift\" from what has been two events a year.\n\nApple's invite to media for the event. Apple It will be Apple's third launch in Ternus' brief tenure, following an event at company headquarters for new iPhones, including the foldable Duo, and a gathering in New York centered around smart home hubs and a new speaker with a screen called HomeView.\n\nApple updated its Mac Mini and Mac Studio desktops with new chips in August, and refreshed its MacBook Pro in the spring, along with a new low-cost MacBook Neo. But Apple's iMac desktop hasn't been updated since October 2024.\n\nIn the most recent quarter, Apple's Mac sales accounted for about 10% of overall revenue, as the company remains heavily reliant on iPhones.\n\nStill, Macs have become one of the strongest parts of Apple's artificial intelligence story, thanks to its chips that can access more memory at higher speeds than other consumer processors. Apple shares are up 26% so far this year, outperforming the S&P 500.\n\nLast week, Apple and Meta teamed up to bring a large open-weight model, developed by Meta, to multiple high-end Mac Studios.", "source": "CNBC World Economy", "pub_date_str": "19 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Apple's iPhone Duo is proving itself the catalyst that Jim Cramer said it would be", "full_content": "Preorders of Apple's iPhone Duo are proving Jim Cramer right, as early indications show strong demand.", "source": "CNBC World Economy", "pub_date_str": "19 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago"}, {"title": "Digital gold market triples to $55bn as younger investors pile in", "full_content": "World Gold Council survey puts global ownership of tokenised gold holdings at 370 tonnes", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago"}, {"title": "Q2 Results Update: Ireda Profit Flat At Rs 549 Crore; Waaree Renewable Profit Dips 37%, Bajaj Finance NII Rises 24%", "full_content": "Q2 Results Live: Bajaj Finance, Hindustan Zinc, IREDA, LTTS, and UltraTech Cement are among 35 companies scheduled to announce their Q2 FY27 results today. Track the latest earnings announcements, financial performance and market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:51 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nasdaq Jumps 1.6% As Chip Stocks Set To End Nine-Day Losing Streak; Intel, AMD, Micron Lead Gains", "full_content": "Chip stocks rallied after nine consecutive sessions of declines, with semiconductor-focused exchange-traded funds (ETFs) also moving higher.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:43 PM IST", "pub_date_relative": "2h ago"}, {"title": "Nestl\u00e9 to close Solon factory by end of 2027 - FOX 8 News", "full_content": "Nestl\u00e9 to close Solon factory by end of 2027 FOX 8 News See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 10:40 PM IST", "pub_date_relative": "2h ago"}], "cfa": [{"title": "OpenAI bugging case: Saudi consulate offers to pay bail for suspect", "full_content": "Federal prosecutors in a new court filing warned that the alleged bugging of an OpenAI executive conference room by a Saudi national working as an engineer at that artificial intelligence giant \"could pose a danger to the national security of the United States.\"\n\nProsecutors in the filing said \"OpenAI executives met with government officials\" in OpenAI's San Francisco headquarters in the same conference room on days close to when it is alleged Abdulrahman Alfozan on Sept. 28.\n\nThe filing came as Alfozan, 35, faces a detention hearing in U.S. District Court in San Francisco on Monday. The U.S. Attorney's Office for the Northern District of California is asking a judge to keep Alfozan held without bail.\n\n\"This is an ongoing investigation that may yet result in more serious charges,\" the filing says.\n\nThe filing cites his ties to Saudi Arabia, his financial resources, and the fact that his wife and their 3-month-old baby flew there on the heels of his Oct. 9 arrest.\n\nAlfozan's lawyer, in a court filing, said the Saudi Consulate in Los Angeles offered to cover the full bail for him if a judge agrees to release him on bond. A letter from the consulate was included in a motion for pretrial release by the lawyer.\n\nMagistrate Judge Alex Tse at Monday's hearing questioned the idea of the consulate guaranteeing the bail.\n\n\"I find that problematic,\" Tse said. \"It seems like a blank check: 'We're gonna pay whatever the court wants to make sure he gets out.'\"", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 12:46 AM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Cleveland-Cliffs earnings analysis: questions answered and next catalysts", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 12:41 AM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq gains as investors buy the dip in the AI trade: Live updates", "full_content": "The Nasdaq Composite rose on Monday as traders moved back into tech following last week's artificial intelligence-related rout.\n\nThe tech-heavy index added 1.2%, while the S&P 500 gained 0.5%. The Dow Jones Industrial Average traded around the flatline.\n\nIntel advanced 2% after JPMorgan analysts upgraded their rating on the chipmaker. Advanced Micro Devices and Micron Technology were also up 1% and 2%, respectively.\n\nHowever, neocloud mainstay CoreWeave reversed course from earlier gains, falling 3%, even after receiving an upgrade at Goldman Sachs . The stock plunged more than 25% last week \u2014 its biggest one-week drop since November 2025 \u2014 over debt concerns.\n\nThe S&P 500 lost nearly 2% last week \u2014 its biggest weekly decline since late June. The Nasdaq tumbled 4.5%, snapping a four-week winning streak. Information technology also shed more than 6% to post its worst weekly performance since April 2025. It was the most net sold global sector last week , with hedge funds selling the largest percentage of tech on record, per Goldman Sachs.\n\nConcerns around the health of the AI trade took center stage after CNBC reported, citing sources, that Anthropic's third-quarter revenue totaled $16.8 billion . And while that's up from $11.6 billion in the second quarter, it raised flags among investors about the pace of growth with the AI build-out.\n\nInvestors in the corporate bond market have started to shun CoreWeave, with the company's credit default swaps reaching distress levels .\n\nLNW chief investment officer Ron Albahary believes the recent moves in CoreWeave's spreads is a sign that the narrative surrounding the AI trade's relative insulation from the rise in interest rates has changed. If earnings growth moderates, he thinks the market could become \"increasingly more fragile.\"", "source": "CNBC Top News", "pub_date_str": "20 Oct 2026, 12:25 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Fixed Income"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P rises and Nasdaq jumps over 1%, rebounding after their worst week since June", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 12:18 AM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Fed sees AI boom adding to inflation headache, but others may pay for the medicine", "full_content": "", "source": "Investing.com News", "pub_date_str": "20 Oct 2026, 12:12 AM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jio Platforms IPO listing: Can Reliance overtake Tata Group as India\u2019s largest conglomerate by market cap? Details", "full_content": "The race to become India\u2019s largest business conglomerate by combined market capitalisation could intensify with the upcoming listing of Jio Platforms. Based on its estimated valuation, the IPO could propel Mukesh Ambani-led Reliance Group past the Tata Group to claim the top spot, with the Adani Group and HDFC Group following behind.\n\nAccording to recent data, Reliance Group has 12 listed companies with a combined market capitalisation of \u20b9 18.05 lakh crore. Reliance Industries accounts for the lion\u2019s share, with a market value of \u20b9 16.2 lakh crore, followed by Jio Financial Services at \u20b9 1.41 lakh crore.\n\nJio Platforms, which is set to become the 13th publicly listed company under the group, is estimated to be valued at around \u20b9 10.3 lakh crore at the upper end of its proposed IPO price band.\n\nIf listed at this valuation, the combined market capitalisation of the Reliance Group could rise to approximately \u20b9 28.35 lakh crore, potentially surpassing the Tata Group\u2019s combined market capitalisation of \u20b9 25.92 lakh crore.\n\nReliance Industries remains the dominant contributor to the group\u2019s market capitalisation, with a market value of \u20b9 16.2 lakh crore. At its peak, the company commanded a market capitalisation of \u20b9 21.2 lakh crore.\n\nBeyond Reliance Industries and Jio Financial Services, the group\u2019s other listed companies have comparatively smaller market values. These include Just Dial, with a market capitalisation of \u20b9 6,223 crore; Hathway Cable and Datacom, at \u20b9 1,725.85 crore; DEN Networks, at \u20b9 1,232 crore, Reliance Industrial Infrastructure, at \u20b9 1,129.40 crore, and GTPL Hathway, at \u20b9 615 crore.\n\nThe Tata Group ranks behind Reliance on the basis of the current combined market capitalisation of its listed companies, at \u20b9 25.92 lakh crore.", "source": "LiveMint Markets", "pub_date_str": "20 Oct 2026, 12:06 AM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "India-New Zealand FTA comes into effect today", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a India-New Zealand FTA comes into effect today The Economic Times daily newspaper is available online now. Read Today's Paper India-New Zealand FTA comes into effect today SECTIONS India-New Zealand FTA comes into effect today By ET Bureau Last Updated: Oct 20, 2026, 12:02:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The FTA will provide Indian exporters with 100% duty-free access to the New Zealand market, opening opportunities for MSMEs, women entrepreneurs, farmers and artisans. This is expected to facilitate $20 billion in investments into India in 15 years that would create opportunities across manufacturing, infrastructure, agriculture, and innovation.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "20 Oct 2026, 12:02 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "AT-1 bonds back in news after Yes Bank case: Why banks issue them, how investors earn returns | Don'ts to avoid losses", "full_content": "AT-1 bonds are back in focus after the Supreme Court upheld a Bombay High Court ruling quashing Yes Bank's 2020 write-off of bonds worth \u20b9 8,415 crore. The verdict marks a landmark win for bondholders whose investments were cancelled during the bank's rescue facilitated six years ago.\n\nYes Bank plunged into a liquidity crisis in March 2020 as bad loans swelled, prompting the Reserve Bank of India (RBI) to take control of the lender and freeze withdrawals. To stabilise the bank, a consortium of lenders led by the State Bank of India (SBI) was assembled to to inject fresh equity capital.\n\nAs part of the exercise, the bank\u2019s administrator wrote down around \u20b9 8,415 crore worth of Additional Tier-1 (AT-1) bonds, prompting Axis Trustee Services and other bondholders to challenge the move in court.\n\nBanks issue AT-1 bonds under Basel III norms to strengthen their core Tier-1 capital, absorb financial losses, and support lending growth without diluting existing equity shareholding. While these bonds can be attractive in terms of interest rates, they also carry significant risks.\n\n\u201cTo attract capital, these instruments offer higher interest rates than conventional fixed-income products. However, AT-1 bonds are perpetual with no fixed maturity date, and banks retain the right to cancel interest payments without obligation to pay them later,\u201d according to K Sai Teja, an advocate at the Supreme Court of India.\n\nHe further explained that if a bank\u2019s common equity Tier-1 (CET1) ratio falls below regulatory thresholds, the principal can be partially or completely written down, as demonstrated during the 2020 Yes Bank crisis.\n\nA bank's Tier 1 capital ratio measures its core equity and reserves against its total risk-weighted assets to test financial strength and loss absorption.\n\nSince AT-1 bonds do not have a maturity date, lenders only need to pay coupon every year. However, most AT-1 bonds have a call option under which banks repay investors in full after five or 10 years.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 11:59 PM IST", "pub_date_relative": "54m ago", "cfa_topics": ["Financial Statement Analysis", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio Platforms IPO draws \u20b98,110 crore in anchor investor bids", "full_content": "BlackRock Inc., Fidelity Management & Research, Capital Group and Allianz SE were among the investors taking anchoring stakes in Jio Platforms Ltd.\u2019s $3.2 billion initial public offering, as Reliance Industries Ltd.\u2019s telecom and digital services arm prepares for what\u2019s set to be India\u2019s biggest-ever share sale.\n\nInvestment bankers working on the transaction allocated 7.247 crore shares to anchor investors at \u20b9 1,119 apiece, the top end of the marketed range, raising \u20b9 8,110 crore ($854 million), according to an exchange filing.\n\nSovereign wealth funds including Abu Dhabi Investment Authority, Government of Singapore, Qatar Investment Authority and Norges Bank Investment Management also participated in the anchor book, the filing showed.\n\nThe offering drew strong demand from domestic mutual funds and insurers. Life Insurance Corporation of India , SBI Funds Management Ltd. , ICICI Prudential Asset Management Co. Ltd. and HDFC Asset Management Co. Ltd. were among the largest anchor investors in the offering.\n\nJio Platforms is seeking a valuation of as much as 10.3 lakh crore in the IPO. The company is offering as many as 27 crore shares at \u20b9 1,065-1,119 apiece, seeking to raise as much as \u20b9 30,200 crore. The shares on offer represent about 2.9% of Jio\u2019s post-issue equity capital, according to Bloomberg calculations.\n\nEven at the bottom of the price range, the offering would raise about \u20b9 28,700 crore, surpassing Hyundai Motor India Ltd.\u2019s \u20b9 27,800-crore share sale in October 2024, currently the country\u2019s largest IPO.\n\nJio has reserved shares worth as much as \u20b9 500 crore for eligible employees, who are being offered a discount of about 5%, company filings show. The IPO also includes a reservation of as much as \u20b9 2,500 crore of shares for eligible Reliance Industries shareholders.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:54 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "S&P Global flags potentially hidden AI debt at hyperscalers as AI spending surges", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a S&P Global flags potentially hidden AI debt at hyperscalers as AI spending surges Powered By The Economic Times daily newspaper is available online now. Read Today's Paper S&P Global flags potentially hidden AI debt at hyperscalers as AI spending surges SECTIONS S&P Global flags potentially hidden AI debt at hyperscalers as AI spending surges ETMarkets.com Last Updated: Oct 20, 2026, 12:20:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis S&P Global warned that hyperscalers could be carrying more AI related debt than currently visible through financing structures linked to data centres and smaller AI firms. Despite rising concerns around AI infrastructure debt, the agency saw no immediate need for rating changes, while flagging profitability and escalating investment as key risks.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 11:49 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "US stocks recover after AI sell-off", "full_content": "Nasdaq 100 rises following biggest weekly drop since last year\u2019s trade war rout", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 11:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Preached Starvation To Meet Jesus': Kenyan Cult Leader Convicted Over Starvation Deaths Of 200 Minors", "full_content": "More than 400 bodies were recovered from Shakahola Forest after the alleged starvation cult came under investigation in 2023.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Already a hit? Reliance's Jio Platforms gets \u20b98,110 cr from anchor investors; LIC, New World Fund among top investors", "full_content": "Jio Platforms has allotted shares worth \u20b9 8,110 crore to 212 anchor investors at the upper end of its price band of \u20b9 1,119 per share, according to a stock exchange filing.\n\nThe company allotted 7.24 crore shares to anchor investors ahead of its initial public offering (IPO), which opens for public subscription on Wednesday, October 21. The strong institutional response highlights investor interest in what is expected to be India\u2019s biggest-ever IPO.\n\nLife Insurance Corporation of India (LIC) received the largest allocation, worth \u20b9 500 crore, accounting for 6.17% of the anchor book.\n\nNew World Fund Inc. was allotted shares worth \u20b9 486.27 crore, followed by the Government of Singapore at \u20b9 340.93 crore, SBI Focused Fund at \u20b9 315 crore, and BNP Paribas Financial Markets \u2013 ODI at \u20b9 303.25 crore, the filing showed.\n\nDomestic mutual funds received 2.48 crore shares worth \u20b9 2,785 crore, representing 34.34% of the anchor allocation. The shares were allotted through 95 schemes across 25 fund houses. Life insurers and pension funds received 97.4 lakh shares worth \u20b9 1,090 crore, or 13.44% of the total.\n\nGlobal investors participating in the anchor book include BlackRock, Fidelity, Capital Group, T. Rowe Price, Schroders, JPMorgan Asset Management, Franklin Templeton, and Janus Henderson. Sovereign and public investment institutions include the Abu Dhabi Investment Authority and the Monetary Authority of Singapore.\n\nJio Platforms aims to raise around \u20b9 30,213 crore through a fresh issue of up to 27 crore shares, priced between \u20b9 1,065 and \u20b9 1,119 apiece. At the upper end of the price band, the offering values the company at approximately $108 billion.\n\nThe IPO will open on October 21 and close on October 23. A portion of the proceeds will go towards repaying debt at its telecom subsidiary, while the remainder will be used for general corporate purposes. Reliance Industries, controlled by billionaire Mukesh Ambani, will retain a majority stake following the listing.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:42 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Tariff quota notified for New Zealand fruits, honey", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a Tariff quota notified for New Zealand fruits, honey The Economic Times daily newspaper is available online now. Read Today's Paper Tariff quota notified for New Zealand fruits, honey SECTIONS Tariff quota notified for New Zealand fruits, honey ET Bureau Last Updated: Oct 19, 2026, 11:37:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Kiwifruit imports will qualify for zero customs duty under the tariff rate quota (TRQ), subject to a minimum CIF value of $1.80 per kg while 40 tonnes of New Zealand-certified Manuka honey under the quota have been permitted for 2026. The annual limit will increase to 200 tonnes from 2027.\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nWar's second-order effects are becoming visible in critical sectors\n\nUS mid-term elections \u2013 Part 2: What does it mean for Trump to lose control of Congress?\n\nHomebuyers wait as NCLT panel picks holes in unfinished Jaypee projects\n\nWhat is the real impact of 13x jump in cash transfers to women?\n\nAirlines Q2 turbulence: Fewer passengers, rising fares and a crude shock\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "19 Oct 2026, 11:37 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock Market Today: S&P 500 and Nasdaq rally as tech stocks bounce, Dow wavers; oil slips while yields tick up - MarketWatch", "full_content": "Stock Market Today: S&P 500 and Nasdaq rally as tech stocks bounce, Dow wavers; oil slips while yields tick up MarketWatch Nasdaq gains as investors buy the dip in the AI trade: Live updates CNBC What\u2019s Moving Markets Today? WSJ AI stocks lead a rebound on Wall Street as European markets drop following protests AP News Nasdaq 100 Climbs on AI Trade Revival After Rout: Markets Wrap Bloomberg.com", "source": "Google News Business", "pub_date_str": "19 Oct 2026, 11:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "1 Finance gets in-principle SEBI approval for MF Lite: Will investors get more choice in index funds and ETFs?", "full_content": "1 Finance has received in-principle approval from the Securities and Exchange Board of India (SEBI) for an asset management company (AMC) licence under the regulator\u2019s Mutual Funds Lite (MF Lite) framework, paving the way for its entry into India\u2019s passive mutual fund market.\n\nThe personal finance advisory and wealth-tech firm is targeting a launch in the fourth quarter of FY27, subject to completing regulatory and operational requirements and obtaining SEBI\u2019s final registration. Its proposed AMC will focus on passive investment products such as index funds and exchange-traded funds (ETFs), according to the company\u2019s press release dated 19 October.\n\nThe approval comes as SEBI seeks to encourage more asset managers to enter the passive fund segment through a separate regulatory framework with lighter compliance requirements. 1 Finance, which has more than \u20b9 17,000 crore in assets under advice (AUA), plans to extend its existing financial planning business into investment products.\n\nSEBI introduced the MF Lite framework on 31 December 2024 to ease entry barriers for asset management companies seeking to offer eligible passive mutual fund schemes. Under the earlier regulatory framework, active and passive schemes were subject to a common set of requirements, including provisions relating to net worth, track record, profitability and ongoing compliance.\n\nThe regulator said several requirements designed for actively managed funds may not be necessary for passive schemes. The lighter framework aims to encourage new players, reduce compliance requirements, increase market penetration, facilitate investment diversification and foster innovation.\n\nPassive funds seek to replicate the performance of an underlying index rather than rely on a fund manager to select securities in an attempt to outperform the market. Index funds and ETFs are common examples.\n\nHowever, not every passive investment product automatically qualifies under MF Lite.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 11:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Eyes on Wall Street: General Motors shares in focus ahead of 3rd quarter results - Key factors investors should watch", "full_content": "Shares of General Motors (GM) will be in focus on Tuesday, October 20, as the US automaker is scheduled to announce its third-quarter 2026 financial results before the opening bell. Wall Street analysts expect a sharp increase in earnings, supported by improving profitability despite relatively flat revenue growth.\n\nThe consensus earnings-per-share (EPS) estimate has risen to $3.63 from $3.55 over the past month, marking an increase of 2.3%. Over the past 90 days, the forecast has climbed 11.3% from $3.26, indicating improving analyst expectations ahead of the earnings announcement.\n\nThe upward revisions suggest that analysts may be factoring in stronger vehicle pricing, improved production efficiency or a more favourable sales mix. However, the company's actual performance and outlook will determine whether it meets these expectations.\n\nGeneral Motors shares were trading lower on Monday ahead of the quarterly results. At 1:15 p.m., the stock was down 1.86%, or $1.56, at $82.40 per share.\n\nDespite the day's decline, the stock remained up 1.79% year to date.\n\nInvestors will be watching the results for indications of whether the automaker can sustain its earnings momentum amid changing vehicle demand, pricing conditions and manufacturing costs. The company's guidance and commentary on its operating performance could also influence market sentiment.\n\nAnalysts expect General Motors to report earnings of $3.63 per share for the third quarter of 2026, up 29.6% from $2.80 in the corresponding quarter last year.\n\nThe projected increase points to a substantial improvement in profitability compared with the year-ago period. The higher earnings estimate also reflects the positive revisions made by analysts over the past three months.", "source": "LiveMint Markets", "pub_date_str": "19 Oct 2026, 11:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "iQOO Neo 12 Launch Date Set For October 28 In China; Design And Colour Options Revealed", "full_content": "iQOO will launch the Neo 12 in China on October 28. The gaming-focused phone gets a Snapdragon 8 Elite Gen 5 chip, a Q3 gaming chip, an active cooling fan and three colour options.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:20 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Jio Raises Rs 8,110 Crore From Anchor Investors Ahead Of IPO; LIC, SBI MF Among Top Investors", "full_content": "LIC received the largest allocation in the anchor book, worth Rs 499.98 crore, accounting for 6.17% of the total.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 11:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jio IPO: LIC, BlackRock, Fidelity, GIC among 212 anchor investors to pour Rs 8,110 crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a Jio IPO: LIC, BlackRock, Fidelity, GIC among 212 anchor investors to pour Rs 8,110 crore Geojit Financial Services Share Price SBFC Finance Share Price Religare Enterprises Share Price Fedbank Financial Services Share Price Mas Financial Services Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Jio IPO: LIC, BlackRock, Fidelity, GIC among 212 anchor investors to pour Rs 8,110 crore SECTIONS Jio IPO: LIC, BlackRock, Fidelity, GIC among 212 anchor investors to pour Rs 8,110 crore By Akash Podishetti , ETMarkets.com Last Updated: Oct 19, 2026, 11:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Jio Platforms successfully raised approximately Rs 8,110 crore from 212 anchor investors before its upcoming IPO. The company allotted shares to well-known investors such as LIC, BlackRock, and Fidelity. These allocations indicate strong interest from both domestic and global institutional investors. The IPO is expected to surpass the previous record held by Hyundai Motor India. Jio Platforms aims to achieve an equity valuation of nearly Rs 10.3 lakh crore.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "19 Oct 2026, 11:04 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Apple announces product launch event for Oct. 28. Analysts expect touchscreen laptop", "full_content": "Apple announced a product launch event on Oct. 28, sending invitations on Monday to media and analysts for an \"Apple Experience in Los Angeles\".\n\nThe email says \"Pro and tell,\" suggesting the launch will focus on high-end \"Pro\" devices with powerful homegrown chips.\n\nBen Reitzes, an analyst at Melius Research, wrote in a note on Monday that he expects new Macs to be introduced, \"including a touchscreen notebook,\" this fall. He said that for CEO John Ternus, who succeeded Tim Cook last month, the launch cadence marks a \"meaningful shift\" from what has been two events a year.\n\nApple's invite to media for the event. Apple It will be Apple's third launch in Ternus' brief tenure, following an event at company headquarters for new iPhones, including the foldable Duo, and a gathering in New York centered around smart home hubs and a new speaker with a screen called HomeView.\n\nApple updated its Mac Mini and Mac Studio desktops with new chips in August, and refreshed its MacBook Pro in the spring, along with a new low-cost MacBook Neo. But Apple's iMac desktop hasn't been updated since October 2024.\n\nIn the most recent quarter, Apple's Mac sales accounted for about 10% of overall revenue, as the company remains heavily reliant on iPhones.\n\nStill, Macs have become one of the strongest parts of Apple's artificial intelligence story, thanks to its chips that can access more memory at higher speeds than other consumer processors. Apple shares are up 26% so far this year, outperforming the S&P 500.\n\nLast week, Apple and Meta teamed up to bring a large open-weight model, developed by Meta, to multiple high-end Mac Studios.", "source": "CNBC World Economy", "pub_date_str": "19 Oct 2026, 10:55 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Digital gold market triples to $55bn as younger investors pile in", "full_content": "World Gold Council survey puts global ownership of tokenised gold holdings at 370 tonnes", "source": "FT Markets", "pub_date_str": "19 Oct 2026, 10:54 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Q2 Results Update: Ireda Profit Flat At Rs 549 Crore; Waaree Renewable Profit Dips 37%, Bajaj Finance NII Rises 24%", "full_content": "Q2 Results Live: Bajaj Finance, Hindustan Zinc, IREDA, LTTS, and UltraTech Cement are among 35 companies scheduled to announce their Q2 FY27 results today. Track the latest earnings announcements, financial performance and market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:51 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nasdaq Jumps 1.6% As Chip Stocks Set To End Nine-Day Losing Streak; Intel, AMD, Micron Lead Gains", "full_content": "Chip stocks rallied after nine consecutive sessions of declines, with semiconductor-focused exchange-traded funds (ETFs) also moving higher.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:43 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Home loan borrowers: Pay higher EMI every month or extend your loan tenure? How to choose after a rate hike", "full_content": "A rise in home loan interest rates presents borrowers with a choice that can affect their finances for years. They can increase their equated monthly instalment (EMI) to repay the loan faster, or extend the repayment tenure to keep monthly outgo under control. While the second option offers immediate relief, it can increase the total interest paid over the life of the loan.\n\nThe right decision depends on a borrower's income stability, existing financial commitments, savings and the number of years remaining on the loan, said Mehernosh Tata, managing director and chief executive officer of Godrej Housing Finance.\n\n\u201cThose with stable income and sufficient room in their monthly budget may consider increasing the EMI to limit the additional interest cost. Others may prefer extending the tenure to keep their monthly outgo manageable, while recognising that this will increase the overall cost of the loan,\u201d Tata said.\n\nConsider a borrower with a \u20b9 50 lakh home loan and a 20-year repayment tenure. If the interest rate rises from 8.5% to 8.75%, the monthly EMI would increase from \u20b9 43,391 to \u20b9 44,186, an additional \u20b9 795 a month, according to calculations provided by Tata.\n\nThe increase in the interest rate would also raise the total interest payable over the loan tenure from approximately \u20b9 54.14 lakh to \u20b9 56.05 lakh, assuming the revised EMI is paid over the original 20-year period.\n\nBorrowers should assess this additional cost alongside their monthly cash flows before deciding how to respond to a rate reset. Those who can comfortably accommodate the higher EMI may be able to limit the additional interest burden by retaining the original tenure.\n\nHowever, borrowers already managing substantial expenses, other loan repayments or irregular incomes may find it difficult to absorb a higher EMI.", "source": "LiveMint Money", "pub_date_str": "19 Oct 2026, 10:36 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Saudi Arabia postpones big investor conference to 2027 as Iran-backed Houthis escalate attacks on kingdom", "full_content": "Saudi Arabia on Monday postponed its big annual investor conference until 2027 as Iran-backed Houthi militants have escalated missile and drone attacks on the kingdom in recent weeks.\n\nThe Future Investment Initiative was originally scheduled to take place in the Saudi capital Riyadh from Oct. 26 to Oct. 29. \"We will announce the new 2027 dates very soon,\" the conference organizers said in a statement .\n\nThe decision to postpone the conference comes after the Houthis attacked King Khalid International Airport in Riyadh on Oct. 10, leaving at least 12 people dead and more than 300 injured.\n\nSome of the biggest names in business and finance were listed as speakers for the conference. They included JPMorgan Chase's Jamie Dimon, Goldman Sachs' David Solomon, Blackstone's Stephen Schwarzman, BlackRock's Larry Fink and Citigroup's Jane Fraser.\n\nCNBC was told some participants and speakers had planned to travel to Saudi Arabia by flying first to Bahrain and then driving five hours to Riyadh.\n\nSaudi Arabia's sovereign wealth fund launched the Future Investment Initiative in 2017. The conference has played a key part in Riyadh's plans to diversify its oil-dependent economy. Crown Prince Mohammed bin Salman unveiled the ambitious megaproject NEOM at the first conference in 2017.\n\nThe decision to postpone the conference underscores the deteriorating security situation in the Middle East as the U.S-Iran war spreads across the region. Houthi militants have launched repeated waves of missile and drone strikes at Saudi Arabia since the deadly airport attack earlier this month.\n\nThe Saudi military destroyed several drones launched at the Riyadh region on Friday and Saturday, a spokesperson for the kingdom's armed forces said. Missiles launched over the Red Sea were also intercepted Friday including one heading toward the port city and oil terminal Yanbu, the spokesperson said.", "source": "CNBC Top News", "pub_date_str": "19 Oct 2026, 10:31 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Micron and other chip stocks spring back to life after bruising selloff", "full_content": "It\u2019s a key week for tech stocks as Nvidia gears up for a European conference and Meta prepares to report earnings.", "source": "MarketWatch Top Stories", "pub_date_str": "19 Oct 2026, 10:29 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Elon Musk says he'll give a SpaceX share to every child in America next year", "full_content": "SpaceX CEO Elon Musk said Monday that he'll give every child in the U.S. one of his shares in the company next year.\n\nMusk currently owns about 4.8 billion SpaceX shares, according to an August SEC filing. That figure rises to 6.4 billion when taking into account unvested awards and stock options, representing a 48.4% beneficial stake in the company.\n\nThere were 72 million children under 18 in the U.S. as of July 1, 2025, according to official census data.\n\nThat would amount to the CEO giving away about $10.5 billion worth of shares, taking into account SpaceX's closing stock price of $146.03 as of Friday.\n\n\"This will be the first of many,\" Musk said in a post on X, without providing further details on how the share giveaway would happen.\n\nCNBC has reached out to SpaceX and Musk's family office for further details.\n\nAltimeter Capital's Brad Gerstner, founder of Invest America and Trump Accounts, praised the move and suggested in a post on X that the SpaceX shares could be distributed via Trump accounts.\n\n\"Incredible Elon!\" he wrote. \"This will be the largest philanthropic gift in history! 70 M accounts - every citizen under 18 & every child born forevermore now has a free, lifetime investment acct making them an owner in the upside of America & our greatest companies!\"", "source": "CNBC World Economy", "pub_date_str": "19 Oct 2026, 10:28 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Delta Corp Q2 Results: Casino Firm Swings To Net Loss On One-Time Exceptional Hit, Revenue Slips 13%", "full_content": "Delta Corp reported a consolidated net loss of Rs 106 crore in Q2 FY27 against a profit of Rs 25 crore a year earlier. Revenue fell 13.1% to Rs 159 crore, while a Rs 137 crore exceptional loss weighed on earnings.", "source": "NDTV Profit", "pub_date_str": "19 Oct 2026, 10:19 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nepal Bans Import, Sale And Distribution Of Priyagold Biscuits Citing Substandard Product             return;

        renderAll();

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
