ST", "pub_date_relative": "27m ago"}, {"title": "Neurocrine Biosciences CCO Eric Benevich sells $333k in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:35 AM IST", "pub_date_relative": "29m ago"}, {"title": "Stock futures are little changed as key consumer inflation report looms ahead: Live updates", "full_content": "Stock futures were little changed Thursday night as traders looked ahead to August's consumer price index report.\n\nS&P 500 futures were marginally higher while the futures linked to the Dow Jones Industrial Average were down just 11 points. The Nasdaq 100 futures were up less than 0.1%.\n\nIn the regular trading day, the Dow fell more than 300 points, or 0.6%, while the S&P 500 lost 0.6%. The Nasdaq Composite slipped 0.7%. Thursday marked the fourth straight losing day for the three major averages.\n\nWeek to date, the Dow is on pace for a 2.5% decline, while the S&P 500 is heading for a 1.6% loss. The Nasdaq is also on track for a 1.6% slide.\n\nAsia-Pacific markets fell in early trade on Friday, with South Korean and Japan equities leading declines in the region. The benchmark Kospi index shed 2.7%.\n\nJapan's Nikkei 225 lost 2.6%. Australia's S&P/ASX 200 was 1% lower.\n\nOn Thursday, stocks were weighed down by surging oil prices, as West Texas Intermediate crude futures jumped over $100 per barrel. Both U.S. oil and international Brent crude futures both posted their highest settlement prices since May 19 as the conflict between the U.S. and Iran continued into a seventh month.\n\nRates surged alongside oil prices, with the 10-year note yield topping 4.95% and hitting the highest level since October 2023.", "source": "CNBC Top News", "pub_date_str": "11 Sep 2026, 06:33 AM IST", "pub_date_relative": "30m ago"}, {"title": "Oil prices rise, Brent tests $110 a barrel as M.East supply risks grow", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:31 AM IST", "pub_date_relative": "33m ago"}, {"title": "CoreWeave CEO Michael Intrator sells over $30.7m in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:31 AM IST", "pub_date_relative": "33m ago"}, {"title": "CoreWeave GC McVeety sells $9.1M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:31 AM IST", "pub_date_relative": "33m ago"}, {"title": "Symbotic director Todd Krasnow sells $87,139 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:30 AM IST", "pub_date_relative": "33m ago"}, {"title": "Arcutis Biotherapeutics EVP Masaru Matsuda sells $249,985 stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:30 AM IST", "pub_date_relative": "33m ago"}, {"title": "Global bonds fall as surging oil prices inflame inflation risks", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:30 AM IST", "pub_date_relative": "33m ago"}, {"title": "Chinese AI labs secretly used millions of Claude exchanges to train their models, Anthropic says", "full_content": "Anthropic said it detected and disrupted unauthorized large-scale efforts by China-based AI labs including Alibaba , Moonshot and DeepSeek to train their models using Claude.\n\nThe U.S. AI company said in a threat intelligence report released Thursday that the firms were involved in what it described as \"illicit distillation,\" a process in which outputs from a more capable AI model are used to train another model and replicate some of its capabilities without authorization.\n\n\"Some of these exchanges included sensitive information, including from individual users, major multinational companies, and state-affiliated actors ... These practices are likely inconsistent with privacy laws and the labs' own terms of service,\" according to the report.\n\nAnthropic said operators affiliated with Alibaba used Claude outputs to help train its Qwen models, while Moonshot routed some Kimi user requests to Claude and used some of the resulting exchanges to train its own models.\n\nThe Alibaba operation was the largest distillation campaign Anthropic said it has measured, involving more than 151 million exchanges with Claude between May and July.\n\nThe activity peaked at nearly 3 million exchanges per day from more than 3,500 fraudulent accounts, according to the report. The company said Alibaba also used Claude for broader AI research, including reinforcement learning and model architecture.\n\nAnthropic also detailed activity involving Moonshot AI, the Beijing-based company behind the Kimi family of AI models.\n\nMoonshot silently forwarded some customer requests intended for Kimi to Claude and then displayed Claude's responses to users, who thought they were using a Kimi model, according to the report.", "source": "CNBC World Economy", "pub_date_str": "11 Sep 2026, 06:29 AM IST", "pub_date_relative": "34m ago"}, {"title": "NSE IPO: Price band set at \u20b91,700-1,785 per share; check key dates, issue details", "full_content": "NSE IPO price band: The National Stock Exchange of India Limited (NSE) IPO price band has been fixed in the range of \u20b9 1,700 to \u20b9 1,785 per equity share of the face value of Re 1. The NSE IPO date of subscription is scheduled for Thursday, 17 September and will close on Monday, 21 September. The allocation to anchor investors for the NSE IPO is scheduled to take place on Wednesday, 16 September.\n\nThe NSE IPO lot size is 8 equity shares and in multiples of 8 equity shares thereafter.\n\nNSE IPO has reserved not more than 50% of the shares in the public issue for qualified institutional buyers (QIB), not less than 15% for non-institutional Institutional Investors (NII), and not less than 35% of the offer is reserved for retail investors.\n\nTentatively, NSE IPO basis of allotment of shares will be finalised on Tuesday, 22 September and the company will initiate refunds on Wednes s part of Iran strategy", "full_content": "\"A large bank\" will be sanctioned by the U.S. next week, U.S. Treasury Secretary Scott Bessent said Thursday.\n\n\"We're going to do it on Monday because we want to honor the memory of our fallen citizens on 9/11. But watch this space on Monday,\" Bessent said during an appearance on \"Real \u200bAmerica's Voice,\" without naming the financial institution nor the country.\n\nThe announcement come after Trump's administration sanctioned the Dubai branches of the second largest bank in Egypt which is believed to have given Iranians $1.8 billion of funds. According to Bessent, Turkey's largest bank \"that had been giving to the Iranians\" will also be closed.\n\nSince the Mideast conflict began in February, the U.S. implemented a series of economic measures against Iran, including sanctions. However, the Trump administration escalated its pressure last month via what Bessent called \"Operation Economic Outcast ,\" which imposed sanctions on almost 60 entities, vessels and individuals. The scope of secondary sanctions were also expanded on those involve in business with Iran in industries including shipping and technology.", "source": "CNBC Top News", "pub_date_str": "11 Sep 2026, 06:37 AM IST", "pub_date_relative": "26m ago", "cfa_topics": ["Fixed Income", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Global Market Today: Asian stocks, bonds fall on oil, inflation concern", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market Today: Asian stocks, bonds fall on oil, inflation concern Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market Today: Asian stocks, bonds fall on oil, inflation concern SECTIONS Globa inked to the Dow Jones Industrial Average were down just 11 points. The Nasdaq 100 futures were up less than 0.1%.\n\nIn the regular trading day, the Dow fell more than 300 points, or 0.6%, while the S&P 500 lost 0.6%. The Nasdaq Composite slipped 0.7%. Thursday marked the fourth straight losing day for the three major averages.\n\nWeek to date, the Dow is on pace for a 2.5% decline, while the S&P 500 is heading for a 1.6% loss. The Nasdaq is also on track for a 1.6% slide.\n\nAsia-Pacific markets fell in early trade on Friday, with South Korean and Japan equities leading declines in the region. The benchmark Kospi index shed 2.7%.\n\nJapan's Nikkei 225 lost 2.6%. Australia's S&P/ASX 200 was 1% lower.\n\nOn Thursday, stocks were weighed down by surging oil prices, as West Texas Intermediate crude futures jumped over $100 per barrel. Both U.S. oil and international Brent crude futures both posted their highest settlement prices since May 19 as the conflict between the U.S. and Iran continued into a seventh month.\n\nRates surged alongside oil prices, with the 10-year note yield topping 4.95% and hitting the highest level since October 2023.", "source": "CNBC Top News", "pub_date_str": "11 Sep 2026, 06:33 AM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Global bonds fall as surging oil prices inflame inflation risks", "full_content": "", "source": "Investing.com News", "pub_date_str": "11 Sep 2026, 06:30 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "NSE IPO: Price band set at \u20b91,700-1,785 per share; check key dates, issue details", "full_content": "NSE IPO price band: The National Stock Exchange of India Limited (NSE) IPO price band has been fixed in the range of \u20b9 1,700 to \u20b9 1,785 per equity share of the face value of Re 1. The NSE IPO date of subscription is scheduled for Thursday, 17 September and will close on Monday, 21 September. The allocation to anchor investors for the NSE IPO is scheduled to take place on Wednesday, 16 September.\n\nThe NSE IPO lot size is 8 equity shares and in multiples of 8 equity shares thereafter.\n\nNSE IPO has reserved not more than 50% of the shares in the public issue for qualified institutional buyers (QIB), not less than 15% for non-institutional Institutional Investors (NII), and not less than 35% of the offer is reserved for retail investors.\n\nTentatively, NSE IPO basis of allotment of shares will be finalised on Tuesday, 22 September and the company will initiate refunds on Wednesday, 23 September, while the shares will be credited to the demat account of allottees on the same day following refund. NSE share price is likely to be listed on BSE and NSE on Thursday, 24 September.\n\nThe company has reduced the number of shares on offer to 12.644 crore from the 14.89 crore planned earlier, according to its red herring prospectus filed in Mumbai late Thursday. The offering will comprise entirely existing shares, representing around 5.1% of the company\u2019s equity capital, down from the roughly 6% proposed earlier.\n\nThe selling shareholders include State Bank of India, General Insurance Corporation of India Ltd. and Canada Pension Plan Investment Board. However, SBI, Morgan Stanley, Bank of Baroda and General Insurance Corporation have reduced the number of shares they plan to sell in the IPO.\n\nDhanya Nagasundaram works as a Content Producer at LiveMint, specializing in news related to financial markets, stocks, and business. With over eight years of experience in journalism and content creation, she has honed her skills in data-driven reporting a percent reduction in provisioning.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "11 Sep 2026, 06:03 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock recommendations for 11 September from MarketSmith India", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nStock market recap: Indian equities snapped their three-session losing streak on Thursday, ending marginally higher in a choppy session coinciding with the weekly derivatives expiry. Nifty 50 rose 46.30 points, or 0.20%, to close at 23,477.80, while Sensex gained 235.44 points, or 0.31%, to settle at 74,999.67.\n\nBanking and oil & gas led the recovery, while capital goods, metals, healthcare, and FMCG ended in the red, keeping gains modest. Brent crude held above $101 per barrel, with mixed signals on the US-Iran conflict's trajectory keeping sentiment cautious even as some reports suggested a potential de-escalation later in the year.\n\nOn the domestic front, mutual     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
