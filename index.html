<script>

    const allData = {"general": [{"title": "Midterm elections 2026 live updates: El-Sayed wins Michigan Senate seat in victory for progressives", "full_content": "Democrats ' epic night led to projected victories in the House and Senate, with a commanding victory in at least the House. The party also flipped multiple governors' offices in an election that serves as a rebuke to President Donald Trump .\n\nDemocrats are projected to have flipped Senate seats from Republicans in Iowa, Kansas, North Carolina, Ohio, South Carolina and Texas, the Associated Press projected. Two key Democratic-held seats in Michigan and Minnesota are still being counted.\n\nDemocrats are projected to have a commanding majority in the U.S. House, surging past the 218 seats needed to control the chamber, according to a CNBC's Election Desk. The desk projects Democrats will win at least 245 House seats.\n\nIn the banner night for the party, Democrats are also projected to have flipped the Ohio and Texas governors' offices. Amy Acton is projected to have beaten Republican Vivek Ramaswamy in Ohio while Gina Hinojosa is the projected winner over Greg Abbott in Texas.\n\nThe AP provides vote data and race projections for CNBC. Polls began closing at 6 p.m. ET, and Alaska will be the last to close at 1 a.m. ET.\n\nFollow House results: Map Talarico flips Texas Senate seat Democrats projected to win control of the House Roy Cooper flips North Carolina Senate seat Ossoff wins Georgia Senate race Florida Senate seat \"leaning Republican\"\n\nProgressive Democrat Abdul El-Sayed is projected by The Associated Press to defeat Republican Mike Rogers in the Michigan Senate election.\n\nEl-Sayed, who won a bruising Democratic primary in August against Rep. Haley Stevens, is set to replace Sen. Gary Peters, a Democrat who is retiring.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 01:07 PM IST", "pub_date_relative": "just now"}, {"title": "Zeal Network raises 2026 sales guidance after Q3 results", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:03 PM IST", "pub_date_relative": "4m ago"}, {"title": "Kambi Group upgrades 2026 guidance after strong third quarter", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:02 PM IST", "pub_date_relative": "5m ago"}, {"title": "Petronet LNG\u2019s inventory boost is not enough to sustain earnings growth", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nPetronet LNG\u2019s September quarter (Q2FY27) results were decent despite supply disruptions amid the West Asia war. Ebitda surged 49% year-on-year (y-o-y) to \u20b9 1,663 crore (excluding one-offs), beating consensus estimates by 10%, driven by better-than-expected volumes and a favourable mix of higher spot LNG sales.\n\nBoth revenue and profit after tax beat consensus estimates. However, revenue fell 35% y-o-y to \u20b9 7,200 crore, weighed by a change in volume mix: lower sales of contracted natural gas and higher volumes handled through tolling arrangements.\n\nUnder the former, Petronet procures LNG and sells the regasified gas to customers, with the entire sale value booked as revenue. Under the latter, customers procure LNG themselves and pay only regasification charges for using Petronet\u2019s LNG terminal.\n\nProfitability got a leg-up from operational and commercial efficiencies, primarily trading and inventory gains of \u20b9 668 crore in Q2FY27, compared with \u20b9 41 crore a year ago, the management said. Antique Stock Broking notes that core Ebitda, excluding these gains, fell 8% y-o-y to \u20b9 1,130 crore.\n\nPetronet benefited from a recovery in demand in Q2FY27 despite higher prices, led primarily by the fertilizer and city gas distribution sectors. The management expects the refinery and petrochemicals sectors, currently using liquid fuels, to switch back to gas if prices normalize.\n\nTotal gas volumes processed rose 12% sequentially to 231 trillion British thermal units (TBtu), although y-o-y growth remained modest at 1.3%. Lower supplies from Qatar and the UAE were offset by higher imports from the US, Oman and African countries.\n\nPetronet\u2019s Dahej terminal capacity utilization rose to 94% in Q2FY27 from 84% in Q1FY27 (excluding the capacity commissioned in Q4FY26) and 92% in Q2FY26.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 01:01 PM IST", "pub_date_relative": "6m ago"}, {"title": "Continental lifts 2026 margin, cash flow targets after Q3 profit beat", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:01 PM IST", "pub_date_relative": "6m ago"}, {"title": "Life Time Group EVP & CFO Erik Weaver sells $300,951 in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:01 PM IST", "pub_date_relative": "7m ago"}, {"title": "BMW warns on profit again as restructuring costs bite", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:00 PM IST", "pub_date_relative": "7m ago"}, {"title": "Auto1 Group reports third quarter revenue miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:00 PM IST", "pub_date_relative": "7m ago"}, {"title": "Sai Silks Q2 FY27 slides: 86-store network faces margin pressure", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 12:59 PM IST", "pub_date_relative": "8m ago"}, {"title": "Smith+Nephew cuts guidance on weak orthopaedics demand", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 12:58 PM IST", "pub_date_relative": "9m ago"}, {"title": "Treasury yields fall as investors crowd into bonds for safety amid election stock sell-off", "full_content": "Treasury yields moved lower on Wednesday as investors sought shelter from a sell-off in equity futures sparked by potential big victories from Democrats in the U.S. midterm elections.\n\nThe benchmark 10-year Treasury note yield was last seen 2 basis points lower at 4.9291%. The 30-year bond yield slid 1 basis point to 5.3093%, and the shorter-term 2-year note yield pulled back 1 basis point to 4.5996%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nDemocrats are on course for a clean sweep, with the party winning at least the House and projected to win the Senate according to a CNBC Election Desk.\n\nThe Associated Press is projecting that Democrats have flipped Senate seats from Republicans in Iowa, Kansas, North Carolina, Ohio, South Carolina, Maine and Texas.\n\nStock futures fell sharply as election results rolled in. Contracts tied to the S&P 500 were seen 0.17% lower, and Nasdaq-100 futures slid 0.25%.\n\nAI-related shares, which have led the bull market, paced the overnight decline on fears that Democrats would slow the data center buildout.", "source": "CNBC Finance", "pub_date_str": "04 Nov 2026, 12:57 PM IST", "pub_date_relative": "10m ago"}, {"title": "Royal Vopak raises full-year guidance on strong performance", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 12:57 PM IST", "pub_date_relative": "10m ago"}, {"title": "Alfen reports third quarter profit beat despite revenue miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 12:56 PM IST", "pub_date_relative": "11m ago"}, {"title": "Frozen Turkish Funds\u2019 Blue-Chip Holdings Sold Off-Market", "full_content": "(Bloomberg) -- Banks overseeing Turkey\u2019s fund liquidations sold about $254 million of blue-chip shares held by frozen funds off-market, in a move that could help remove an overhang on the country\u2019s stock indexes.\n\nTC Ziraat Bankasi AS and Turkiye Is Bankasi AS, which were tasked with overseeing the liquidation, completed the sale on Nov. 3 through an off-exchange placement to investment and pension funds, a notice seen by Bloomberg showed.\n\nThe sale may ease pressure on Turkey\u2019s main stock indexes by removing a major source of uncertainty. Investors have been waiting to see how shares held by funds being wound down would be sold and whether large disposals could hit the market.\n\nThe transactions were valued at 12.7 billion liras ($254 million), according to the notice sent by Turkey\u2019s Capital Markets Association to asset managers. The association didn\u2019t immediately comment when contacted by Bloomberg.\n\nSettlement will take place on Wednesday through a conditional transfer mechanism, according to the notice.\n\nThe transaction marks a significant step in the liquidation of 131 funds managed by seven asset managers. Regulators ordered the funds to be wound down after a crisis that affected more than 455,000 investors.\n\nThe turmoil has erased more than $130 billion from the market value of Turkish stocks since the selloff began in mid-September. It has also kept some investors on the sidelines as they waited for clarity on how the fund holdings would be sold.\n\nThe liquidation involved shares of companies that are in the benchmark BIST-30 Index. They were offered in 20 equal blocks at Nov. 3 closing prices. Each package included all 30 stocks in different quantities and was valued at 636 million liras, according to the notice.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:50 PM IST", "pub_date_relative": "17m ago"}, {"title": "Kopsi, Taiwan, other Asian stocks tumble after US midterm elections signal Democratic victory. What\u2019s the connection?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Kopsi, Taiwan, other Asian stocks tumble after US midterm elections signal Democratic victory. What\u2019s the connection? The Economic Times daily newspaper is available online now. Read Today's Paper Kopsi, Taiwan, other Asian stocks tumble after US midterm elections signal Democratic victory. What\u2019s the connection? SECTIONS Kopsi, Taiwan, other Asian stocks tumble after US midterm elections signal Democratic victory. What\u2019s the connection? By Veer Sharma , ETMarkets.com Last Updated: Nov 04, 2026, 12:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis South Korean and Taiwanese equities tumbled as a potential Democratic sweep in the US midterm elections fuelled concerns over tighter AI regulations and slower data centre investments. Chipmakers led the sell-off, dragging regional markets lower, while Asian currencies strengthened against a weaker dollar.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:47 PM IST", "pub_date_relative": "20m ago"}, {"title": "Mutual fund 1, 3, 5 years returns battle 2026: Which large, mid, small-cap schemes delivered consistent money gains?", "full_content": "Equity mutual funds are classified into different categories based on their investments across market capitalisations, primarily large-cap, mid-cap, and small-cap funds.\n\nLarge-cap funds invest in well-established companies that tend to be relatively less volatile, while mid-cap funds focus on medium-sized companies. Small-cap funds, on the other hand, invest in smaller companies, which carry higher risks but also offer greater growth potential.\n\nAs per SEBI 's categorisation norms, large-cap funds must invest at least 80% of their assets in large-cap stocks. Mid-cap and small-cap funds must invest at least 65% of their assets in their respective categories.\n\nOver the last one year, the large-cap fund category declined by an average of 5.80%, while mid-cap funds fell by 1.06%. Small-cap funds, however, gained 3.13%.\n\nAgainst this backdrop, here is a look at the schemes across these three categories that delivered positive returns over the 1-year period and also recorded positive returns over the 3-year and 5-year periods.\n\nThe table below lists large-cap funds ranked by their 1-year returns. It includes only schemes that have delivered positive returns over the 3-year and 5-year periods as well. Only three large-cap schemes met these criteria.\n\n*Source: Morningstar, Direct-Growth plans; CAGR as on 3 November 2026\n\nTaurus Largecap Equity topped the list with a 1-year return of 5.55% and also recorded the highest 3-year return of 14.73% among the three schemes. However, Invesco India Large Cap delivered the highest 5-year return of 10.52%. Quant Large Cap does not have a 5-year return figure.", "source": "LiveMint Money", "pub_date_str": "04 Nov 2026, 12:45 PM IST", "pub_date_relative": "22m ago"}, {"title": "Novo raises full-year outlook as Wegovy pill sales impress", "full_content": "Novo posted quarterly earnings ahead of expectations early Wednesday as sales of its Wegovy pill blew past estimates.\n\nThe Danish weight-loss drug maker is looking to regain momentum following a tumultuous year in which it fell behind rival Eli Lilly.\n\nThe company updated its outlook to now see adjusted revenue and operating profit growth of between negative 2% and 2% at constant exchange rates. It previously saw full-year sales and operating profits, which it hiked in August, at negative 6% to flat for both metrics.\n\nSales in the third quarter came in at 79.2 billion Danish kroner ($11.9 billion), up 4% year-on-year at constant exchange rates and ahead of FactSet estimates of 73.6 billion kroner. Adjusted operating profit (EBIT) was 31.7 billion kroner, compared with the expected 28.6 billion kroner.\n\nWhile Novo pioneered the GLP-1 weight-loss drugs now used by around 10% of Americans, it has struggled to keep the momentum going as chief rival Eli Lilly quickly caught up and surpassed Novo in their by far biggest market, the U.S. Several other pharma companies are also eyeing entry into the lucrative market.\n\nInvestors are now laser-focused on the pair's next-generation weight-loss drugs, and whether they can treat obesity-linked diseases such as heart and kidney conditions, sleep apnea and arthritis.\n\nNovo said sales of its Wegovy pill, launched earlier this year, totaled 5.4 billion kroner, compared with the roughly 4.5 billion kroner analysts expected.\n\nSales of injectable Wegovy and diabetes treatment Ozempic were 20.4 billion kroner and 29.7 billion kroner, respectively, also above expectations.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:44 PM IST", "pub_date_relative": "23m ago"}, {"title": "Equitas Small Finance Bank shares jump 9% after Balaji Nuthalapadi\u2019s appointment as interim CEO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Equitas Small Finance Bank shares jump 9% after Balaji Nuthalapadi\u2019s appointment as interim CEO Equitas Small Finance Bank Share Price Au Small Finance Bank Share Price Ujjivan Small Finance Bank Share Price Jana Small Finance Bank Share Price ESAF Small Finance Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Equitas Small Finance Bank shares jump 9% after Balaji Nuthalapadi\u2019s appointment as interim CEO SECTIONS Equitas Small Finance Bank shares jump 9% after Balaji Nuthalapadi\u2019s appointment as interim CEO By Surbhi Khanna , ET Online Last Updated: Nov 04, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The bank further said that appointment of Nuthalapadi as interim CEO, consequent to the resignation of P. N. Vasudevan as the MD & CEO, shall take effect from the date of RBI approval or such other date as may be stipulated by the RBI in this regard.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:44 PM IST", "pub_date_relative": "23m ago"}, {"title": "Small-cap stock under \u20b950 SC Agrotech hits 5% upper circuit for 8th straight session; gives 160% returns in one year", "full_content": "Small-cap stock under \u20b9 50: Despite high volatility in the Indian stock market, some stocks have shown resilience against this nervousness on Dalal Street. Shares of SC Agrotech Ltd are one of them. The small-cap stock with a market cap of \u20b9 337 crore opened at \u20b9 44.37 per share on the BSE and touched the 5% upper circuit within a few seconds of the Opening Bell. While hitting this upper circuit, the small-cap stock under \u20b9 50 went on to touch 5% upper circuit for the eighth straight session. The small-cap stock that has delivered 160% returns in one year has been hitting the upper circuit since 26 October 2026, delivering over 43% in eight days by rising from \u20b9 30.88 to \u20b9 44.37 per share.\n\nThe small-cap company was in the news on Tuesday evening for receiving approval from the Ministry of Corporate Affairs for the acquisition of the subsidiary company \u2014 SC Careoasis Healthcare Private Limited. The latest catalyst is SC Agrotech\u2019s digital agriculture platform, AgriBridge , which the company says has been launched for public use on November 4, 2026, i.e., today\n\nThe small-cap company with a stock price below \u20b9 50 informed the Indian exchanges about the government's approval, saying, \u201cWe hereby wish to inform that, the Ministry of Corporate Affairs has approved incorporation of a subsidiary of the Company in the name of \u201cSC Careoasis Healthcare Private Limited\u201d on October 30, 2026.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:43 PM IST", "pub_date_relative": "25m ago"}, {"title": "Stock futures mixed as Democrats win big in midterms, traders bet they will slow data center buildout: Live updates", "full_content": "Stock futures were mixed early on Wednesday as traders speculated that Democrats were headed for majority control of Congress and some key gubernatorial wins in the 2026 U.S. midterm elections .\n\nFutures tied to the S&P 500 traded 0.21% lower, while Nasdaq-100 futures shed 0.30%. But futures tied to the Dow Jones Industrial Average moved higher, adding 29 points, or 0.06%. Futures were off their worst levels of the session.\n\nThe Democratic Party is projected to win both chambers of Congress, according to The Associated Press. The AP also projected that Texas Democratic governor candidate Gina Hinojosa is the winner over Republican incumbent Greg Abbott. Hinojosa has pledged a moratorium on data centers in the key tech hub.\n\nDemocrats securing a sizable majority in the House and Senate \u2014 the so-called blue wave scenario \u2014 would pressure the market and especially stocks related to the artificial intelligence buildout, according to some on Wall Street. Investors fear a big Democratic win could mean more restrictions on data centers nationwide. AI-linked stocks have already pulled back in recent weeks on concern about a slowing pace in data-center spending.\n\nBig Tech shares Microsoft , Amazon and Nvidia were all trading lower in overnight trading on Robinhood.\n\nElon Musk's SpaceX was down 4.6% on Robinhood, while Tesla shares were down 4.1%. Data center play CoreWeave was down 3.2% in Robinhood overnight trading, while Alphabet was some 0.6% lower.\n\nEquities \"trended lower as it's looked more likely that Democrats are going to pick up the House and most likely the Senate,\" said Anthony Saglimbene, chief market strategist at Ameriprise Financial, Tuesday evening as futures were pulling back.\n\nHe added: \"If you get some governorships that are Democratic, what does that mean for the data center buildout, which has already seen a lot of skepticism over the last couple weeks in terms of the hyperscaler capex spending?\"", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:42 PM IST", "pub_date_relative": "25m ago"}, {"title": "8th Pay Commission: How Much Arrears Could Employees Get If Implementation Is Delayed Until 2027?", "full_content": "Chaired by former Supreme Court Justice Ranjana Prakash Desai, the commission has been given an extensive 18-month window to submit its report on revised pay structure.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:39 PM IST", "pub_date_relative": "28m ago"}, {"title": "Now, Class 9 Students Will Learn All About Setting Up A Business, Fixed Deposits Mutual Funds And More", "full_content": "Economist Sanjeev Sanyal has highlighted the Textbook in a thread on X and said that it will teach skills that students could use in everyday life.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:38 PM IST", "pub_date_relative": "29m ago"}, {"title": "Stock Market LIVE: Sensex Flat, Nifty 50 Around 23,800; TCS, Infosys, HCL Tech Lead Losses; BEL, Adani Ent, ITC Gain", "full_content": "Among sectors, Nifty FMCG, Nifty Realty, Nifty Metal, Nifty Pharma and Nifty Oil & Gas led gains, while losses was seen in Nifty IT and Nifty Private Bank.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:37 PM IST", "pub_date_relative": "30m ago"}, {"title": "Gold Glitters, Silver Shines Ahead Of Dhanteras: Yellow Metal Prices Jump By Rs 2,500; Silver Surges By Rs 5,700", "full_content": "Gold prices climbed above Rs 1.41 lakh per 10 grams on MCX, while silver surged past Rs 1.85 lakh per kg.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:36 PM IST", "pub_date_relative": "31m ago"}, {"title": "Q2 Results Live Updates: Saregama India Profit Rises 48%, Cera Sanitaryware Profit Flat At Rs 56 Crore; BSE, Cummins Also In Focus", "full_content": "BSE, Cummins India, Zydus Life and Apollo Tyres are among the 327 companies scheduled to announce their Q2FY27 results today. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:35 PM IST", "pub_date_relative": "32m ago"}, {"title": "Unhedged Position | Blue Wave Will Derail the AI Trade but Won't Dismantle the AI Era", "full_content": "The Democrats' sweep of the US Congress will see politics collide with economic forces both over the long and short term.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:34 PM IST", "pub_date_relative": "34m ago"}, {"title": "Midterm Takeaways: Tech billionaires suffer horrible night as Democrats drub Republicans", "full_content": "Democrats took control of Congress Tuesday night, delivering a stinging rebuke to President Donald Trump and his economic record as voters voiced deep frustration with rising prices, government corruption and the AI data center build-out .\n\nThe party scored an extraordinary pair of victories in traditionally Republican Texas. James Talarico defeated Ken Paxton, becoming the first Democrat elected to the U.S. Senate from the state in nearly four decades. Gina Hinojosa defeated three-term Gov. Greg Abbott, making her the first Democratic governor of Texas since Ann Richards left office in 1995. Texas became the clearest measure of how far the blue wave reached: Democrats swept the state's marquee races in a Republican stronghold long considered beyond their grasp.\n\nThe victories were part of a broader wave of Democratic gains. In South Carolina, Democrat Annie Andrews upset Darline Graham in a race Republicans had expected to win. In Ohio, Sherrod Brown defeated Republican Sen. Jon Husted. Democrats also flipped Senate seats in Iowa and North Carolina and won key races in Georgia and New Hampshire.\n\nThe results marked a striking collapse for Trump's candidates. Paxton, Graham and Husted were among the president's prominent picks who lost after he made dozens of endorsements.\n\nThe election also sharpened the political fight over data centers and artificial intelligence infrastructure . Texas is a major center of planned data-center construction , and Hinojosa campaigned for a pause on new projects until the state adopts tougher rules. Her victory gives Democrats more influence over Texas' approach to the build-out, though the state Legislature remains in Republican hands.\n\nThe results also delivered a blow to the tech billionaires and corporate interest groups that poured hundreds of millions of dollars into backing Republican candidates who might be friendly to the massive AI data center projects they hope to build around the country.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:33 PM IST", "pub_date_relative": "34m ago"}, {"title": "Investing In US Stocks From India? Five Risks You Should Know", "full_content": "The returns from US stocks are not determined by share-price movements alone. The Rupee-Dollar exchange rate also plays a role in the final returns earned by Indian investors.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:25 PM IST", "pub_date_relative": "42m ago"}, {"title": "Awfis Space Solutions shares rally 13% on strong Q2 results | Check stock returns", "full_content": "Vaamanaa Sethi Published 4 Nov 2026, 12:24 PM IST Prefer Livemint on Google Awfis Space Solutions share price rallied as much as 13% in Wednesday's trading session after the company reported strong set of numbers during the July-September quarter.\n\nAwfis Space shares opened at \u20b9 257 apiece on NSE today, as compared to previous close of \u20b9 241.20 on Tuesday, as compared to previous close of \u20b9 275 on 4 November.\n\nAwfis Space Solutions , one of India's leading flexible workspace providers, reported a strong performance in the September 2026 quarter, with its net profit jumping 94% year-on-year (YoY) and revenue increasing 20%.\n\nThe company's revenue from operations rose to \u20b9 439 crore in Q2 FY27, compared with \u20b9 367 crore in the corresponding quarter of the previous financial year, registering a 20% YoY growth.\n\nAwfis Space Solutions' net profit nearly doubled to \u20b9 31 crore in the September quarter from \u20b9 16 crore in Q2 FY26, marking a 94% increase on a year-on-year basis.\n\nThe company also recorded strong business momentum in the first half of FY27, selling more than 25,000 seats amid sustained demand for flexible workspace solutions.\n\nDuring the September quarter, Awfis added six new centres, expanding its network to 254 centres with approximately 1.74 lakh seats across 18 cities. Its diversified clientele now comprises more than 3,700 companies.\n\nThe company's overall portfolio occupancy stood at 76.2%, while centres that have been operational for more than 12 months reported a higher occupancy rate of 84.1%.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:24 PM IST", "pub_date_relative": "43m ago"}, {"title": "US Midterm Election Results 2026: Check State-Wise Winners, Senate And House Results, Party Tally", "full_content": "The Democrats' gains extended well beyond Congress as they flipped governorships in Georgia, Iowa, Texas and Ohio, including states Trump won in 2024.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:23 PM IST", "pub_date_relative": "44m ago"}, {"title": "RBI sets up panel with banks, market players to review financial market issues", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a RBI sets up panel with banks, market players to review financial market issues The Economic Times daily newspaper is available online now. Read Today's Paper RBI sets up panel with banks, market players to review financial market issues SECTIONS RBI sets up panel with banks, market players to review financial market issues Reuters Last Updated: Nov 04, 2026, 12:21:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's central bank has formed a technical consultative committee to engage with market participants on financial issues. This committee will include seven external members from various financial institutions and will address market infrastructure. It will examine the functioning and efficiency of money and related derivative markets. Members will assess both domestic and international developments that impact these markets.\n\nSome elections matter more than you know: No crop changed in the fields, yet sugar, coffee and soya got cheaper in a day\n\nYou can buy a walkie-talkie online. But can you legally use it?\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "04 Nov 2026, 12:21 PM IST", "pub_date_relative": "46m ago"}, {"title": "Watch: Tabu Plays A Fierce Political Leader In Nagarjuna's Telugu Action Drama King100", "full_content": "The video offers a peek into a character who appears to have built her position in politics through determination and hard work rather than luck.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:16 PM IST", "pub_date_relative": "51m ago"}, {"title": "Texas Turns Blue After Over Three Decades \u2014 How The AI Game Backfired For Republicans Explained", "full_content": "Democrat governor candidateGina Hinojosa and Senate candidateJames Talarico have flipped the narrative and sent shockwaves through the state after their victory against Republican candidates Greg Abbott andKen Paxton, respectively.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:16 PM IST", "pub_date_relative": "52m ago"}, {"title": "Arvind Fashions To NALCO: Motilal Oswal Reviews Q2 Results Of Nine Stocks, Check Target Prices", "full_content": "Motilal Oswal's latest Q2 FY27 research highlights nine stocks across packaged foods, apparel, hospitality, logistics, metals, capital goods, auto ancillaries and specialty chemicals. Check the brokerage's ratings, target prices and key estimate revisions.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:13 PM IST", "pub_date_relative": "54m ago"}, {"title": "'Kahin Nahin Jayenge Modi\u2019: Union Minister Arjun Ram Meghwal Sings Song | Viral Video", "full_content": "The minister's participation brought the song into the spotlight, with videos of the performance increasingly going viral on social media.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:12 PM IST", "pub_date_relative": "55m ago"}, {"title": "US Midterm Elections Results 2026 Live: Trump Accepts Defeat As Democrats Close In On Total Control", "full_content": "Follow NDTV Profit for the latest voting updates, key developments, state-wise results, winners and reactions as the election unfolds across the US.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:09 PM IST", "pub_date_relative": "58m ago"}, {"title": "Gold rate today Coimbatore Nov 4 Wednesday: Up or down? Latest price for investors ahead of Dhanteras, Diwali 2026", "full_content": "Gold rate today, Coimbatore, Nov 4, Wednesday: The price of the yellow metal rose today in Coimbatore, in line with global trends, as the markets await the United States midterm election results and non-farm payrolls data, Reuters reported.\n\nSpot gold was up 0.5% at $3,947.49 per ounce by 0415 GMT, while US gold futures for December delivery rose 0.5% to $3,958.00. And among other metals, spot silver fell 0.8% to $49.38, platinum slipped 1.2% to $1,399.72, and palladium dropped 0.2% to $932.07, it added.\n\n\u201cA weaker USD and a punchy decline in both nominal and real US Treasury yields are clearly providing support for gold. The demand for protection against a potentially more unpredictable and confrontational Trump administration looks to be providing a compelling backdrop for gold buyers,\u201d Chris Weston, head of research at Pepperstone, told the agency.\n\nIn the domestic markets, gold prices on Wednesday rose by \u20b9 510 to \u20b9 1,39,962 per 10 grams in futures trade as speculators created fresh positions on firm spot demand, PTI reported. On the Multi Commodity Exchange ( MCX ), the yellow metal contract for December delivery traded higher by \u20b9 510, or 0.37%, at \u20b9 1,39,962/10 grams in a business turnover of 876 lots, it added.\n\nAt the time of writing, gold bullion was trading at \u20b9 1,42,450 per 10 grams, while Silver was at \u20b9 1,85,930 per kg, data on the bullion website showed.\n\nUp or down? Check the latest price for investors in Isha City ahead of Dhanteras and Diwali 2026. We also bring retail gold and silver rates in key Indian cities on Wednesday, 4 November 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bangalore, Chennai, Delhi, Hyderabad, Kolkata and Mumbai today as follows:\n\nThe 24-karat gold price was at \u20b9 1,42,880 per 10 grams on 4 November.", "source": "LiveMint Money", "pub_date_str": "04 Nov 2026, 12:09 PM IST", "pub_date_relative": "59m ago"}, {"title": "Stockal Fraud Case: HDFC Securities Says It Is Not An Accused, Partnership Ended In 2024", "full_content": "In an exchange filing, HDFC Securities said its operational partnership with Stockal had ended in 2024 and stressed that customer trust and regulatory compliance remained central to its operations.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:08 PM IST", "pub_date_relative": "1h ago"}, {"title": "Clean Max shares: Power stock jumps 42% in YTD; will this rally continue after Q2 results 2026? Expert views, target", "full_content": "Pranati Deva Published 4 Nov 2026, 12:07 PM IST Prefer Livemint on Google Shares of Clean Max Enviro Energy Solutions Ltd. traded higher on Wednesday, November 4, after the renewable energy company reported a strong set of Q2 FY27 results, with EBITDA and net profit beating analyst estimates.\n\nCleanMax's earnings growth was supported by higher power sales, an expanding renewable energy portfolio and continued demand from commercial and industrial (C&I) customers. Its overall platform capacity reached approximately 13 GW as of September 30, 2026.\n\nCleanMax shares climbed as much as 2.5% to \u20b9 1,257.05 on the BSE on Wednesday, against the previous close of \u20b9 1,225.30. The power stock opened at \u20b9 1,250.90.\n\nDespite the recent gains, it remains 18% below its 52-week high of \u20b9 1,532.80, recorded in June 2026. Its 52-week low stands at \u20b9 728, touched in March 2026.\n\nThe stock has faced some near-term pressure, declining 5% in one month and 7% over three months. However, it has gained 6.5% in six months and delivered a 42% return year-to-date in 2026.\n\nCleanMax Q2 results: Net profit jumps 82%, EBITDA beats estimates\n\nCleanMax reported an 82.3% year-on-year (YoY) increase in net profit to \u20b9 64.9 crore in Q2FY27 , compared with \u20b9 35.6 crore a year ago. This was significantly higher than the estimated \u20b9 42 crore.\n\nRevenue from operations rose 37% YoY to \u20b9 727.6 crore from \u20b9 530.6 crore, broadly meeting expectations. However, the bigger earnings surprise came from EBITDA, which increased 51% to \u20b9 547.7 crore against \u20b9 362.9 crore in Q2FY26, beating the consensus estimate of \u20b9 436 crore. Adjusted reported EBITDA stood at \u20b9 553 crore, up 43%.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:07 PM IST", "pub_date_relative": "1h ago"}, {"title": "Udta Teer Box Office Collection Day 12: Ayushmann Khurrana Starrer Bounces Back With 18.5% Jump", "full_content": "'Udta Teer' stars Ayushmann Khurrana and Sara Ali Khan in the lead roles, along with Suhail Nayyar, Raghubir Yadav, Gulshan Grover, Prammod Sanghi and Salim Siddiqui.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:05 PM IST", "pub_date_relative": "1h ago"}, {"title": "Democrats\u2019 win rattles Trump trades from AI stocks to crypto", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Democrats\u2019 win rattles Trump trades from AI stocks to crypto The Economic Times daily newspaper is available online now. Read Today's Paper Democrats\u2019 win rattles Trump trades from AI stocks to crypto SECTIONS Democrats\u2019 win rattles Trump trades from AI stocks to crypto By Abhishek Vishnoi and Winnie Hsu , Bloomberg Last Updated: Nov 04, 2026, 12:08:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The recent Democratic majority in Congress triggered a downturn in global markets, most notably impacting technology stocks. Investors are now wary about President Trump\u2019s policies and their implications for AI investments. Conversely, solar stocks saw an uptick, signaling potential changes to clean energy regulations. Additionally, Treasury yields dropped as heightened oversight dampens fiscal stimulus hopes, while cryptocurrencies also fell amid uncertainty surrounding upcoming industry regulations.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:04 PM IST", "pub_date_relative": "1h ago"}, {"title": "Oil slide, Treasury strength boost Indian bonds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a M w Jones futures slip 2% as Democrats set for big win in US midterm elections", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US bond yields fall; Nasdaq, Dow Jones futures slip 2% as Democrats set for big win in US midterm elections Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US bond yields fall; Nasdaq, Dow Jones futures slip 2% as Democrats set for big win in US midterm elections SECTIONS US bond yields fall; Nasdaq, Dow Jones futures slip 2% as Democrats set for big win in US midterm elections By Veer Sharma , ETMarkets.com Last Updated: Nov 04, 2026, 11:57:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Treasury yields fell on Tuesday as investors sought safe-haven assets amid a sharp sell-off in US equity futures following projections of significant Democratic gains in the 2026 midterm elections. The 10-year yield slipped nearly 5 bps to 4.902%, while the 2-year yield dropped 6 bps to 4.55%.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 11:57 AM IST 5 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 11:52 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stockal Fraud: Victim Tells NDTV Profit 'All My Life Savings Have Been Trashed' | Watch", "full_content": "An affected investor says she got no alert when her account email was changed and her holdings were sold within minutes. Stockal says its platform was not breached, and HDFC Securities says it is not an accused.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 11:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "China Banks' applications for PBOC stock loan scheme exceed 200 billion yuan", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a China Banks' applications for PBOC stock loan scheme exceed 200 billion yuan Powered By The Economic Times daily newspaper is available online now. Read Today's Paper China Banks' applications for PBOC stock loan scheme exceed 200 billion yuan SECTIONS China Banks' applications for PBOC stock loan scheme exceed 200 billion yuan By Anupam Nagar , ETMarkets.com Last Updated: Nov 04, 2026, 11:51:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis China's central bank said applications for loans under its stock-purchase financing scheme have exceeded 200 billion yuan. The PBOC has also cut the relending rate to 1%, stepping up efforts to support share buybacks and stabilise equity markets.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 11:51 AM IST", "pub_date_relative": "1h ago"}, {"title": "Ranbir Kapoor Sparks Franchise Speculation After Teasing 'Ramayana' Part 3", "full_content": "Kapoor's seemingly casual remark quickly became a talking point on social media.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 11:50 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "Petronet LNG\u2019s inventory boost is not enough to sustain earnings growth", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nPetronet LNG\u2019s September quarter (Q2FY27) results were decent despite supply disruptions amid the West Asia war. Ebitda surged 49% year-on-year (y-o-y) to \u20b9 1,663 crore (excluding one-offs), beating consensus estimates by 10%, driven by better-than-expected volumes and a favourable mix of higher spot LNG sales.\n\nBoth revenue and profit after tax beat consensus estimates. However, revenue fell 35% y-o-y to \u20b9 7,200 crore, weighed by a change in volume mix: lower sales of contracted natural gas and higher volumes handled through tolling arrangements.\n\nUnder the former, Petronet procures LNG and sells the regasified gas to customers, with the entire sale value booked as revenue. Under the latter, customers procure LNG themselves and pay only regasification charges for using Petronet\u2019s LNG terminal.\n\nProfitability got a leg-up from operational and commercial efficiencies, primarily trading and inventory gains of \u20b9 668 crore in Q2FY27, compared with \u20b9 41 crore a year ago, the management said. Antique Stock Broking notes that core Ebitda, excluding these gains, fell 8% y-o-y to \u20b9 1,130 crore.\n\nPetronet benefited from a recovery in demand in Q2FY27 despite higher prices, led primarily by the fertilizer and city gas distribution sectors. The management expects the refinery and petrochemicals sectors, currently using liquid fuels, to switch back to gas if prices normalize.\n\nTotal gas volumes processed rose 12% sequentially to 231 trillion British thermal units (TBtu), although y-o-y growth remained modest at 1.3%. Lower supplies from Qatar and the UAE were offset by higher imports from the US, Oman and African countries.\n\nPetronet\u2019s Dahej terminal capacity utilization rose to 94% in Q2FY27 from 84% in Q1FY27 (excluding the capacity commissioned in Q4FY26) and 92% in Q2FY26.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 01:01 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Continental lifts 2026 margin, cash flow targets after Q3 profit beat", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:01 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "BMW warns on profit again as restructuring costs bite", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:00 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Auto1 Group reports third quarter revenue miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 01:00 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Treasury yields fall as investors crowd into bonds for safety amid election stock sell-off", "full_content": "Treasury yields moved lower on Wednesday as investors sought shelter from a sell-off in equity futures sparked by potential big victories from Democrats in the U.S. midterm elections.\n\nThe benchmark 10-year Treasury note yield was last seen 2 basis points lower at 4.9291%. The 30-year bond yield slid 1 basis point to 5.3093%, and the shorter-term 2-year note yield pulled back 1 basis point to 4.5996%.\n\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\n\nDemocrats are on course for a clean sweep, with the party winning at least the House and projected to win the Senate according to a CNBC Election Desk.\n\nThe Associated Press is projecting that Democrats have flipped Senate seats from Republicans in Iowa, Kansas, North Carolina, Ohio, South Carolina, Maine and Texas.\n\nStock futures fell sharply as election results rolled in. Contracts tied to the S&P 500 were seen 0.17% lower, and Nasdaq-100 futures slid 0.25%.\n\nAI-related shares, which have led the bull market, paced the overnight decline on fears that Democrats would slow the data center buildout.", "source": "CNBC Finance", "pub_date_str": "04 Nov 2026, 12:57 PM IST", "pub_date_relative": "10m ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Alfen reports third quarter profit beat despite revenue miss", "full_content": "", "source": "Investing.com News", "pub_date_str": "04 Nov 2026, 12:56 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Frozen Turkish Funds\u2019 Blue-Chip Holdings Sold Off-Market", "full_content": "(Bloomberg) -- Banks overseeing Turkey\u2019s fund liquidations sold about $254 million of blue-chip shares held by frozen funds off-market, in a move that could help remove an overhang on the country\u2019s stock indexes.\n\nTC Ziraat Bankasi AS and Turkiye Is Bankasi AS, which were tasked with overseeing the liquidation, completed the sale on Nov. 3 through an off-exchange placement to investment and pension funds, a notice seen by Bloomberg showed.\n\nThe sale may ease pressure on Turkey\u2019s main stock indexes by removing a major source of uncertainty. Investors have been waiting to see how shares held by funds being wound down would be sold and whether large disposals could hit the market.\n\nThe transactions were valued at 12.7 billion liras ($254 million), according to the notice sent by Turkey\u2019s Capital Markets Association to asset managers. The association didn\u2019t immediately comment when contacted by Bloomberg.\n\nSettlement will take place on Wednesday through a conditional transfer mechanism, according to the notice.\n\nThe transaction marks a significant step in the liquidation of 131 funds managed by seven asset managers. Regulators ordered the funds to be wound down after a crisis that affected more than 455,000 investors.\n\nThe turmoil has erased more than $130 billion from the market value of Turkish stocks since the selloff began in mid-September. It has also kept some investors on the sidelines as they waited for clarity on how the fund holdings would be sold.\n\nThe liquidation involved shares of companies that are in the benchmark BIST-30 Index. They were offered in 20 equal blocks at Nov. 3 closing prices. Each package included all 30 stocks in different quantities and was valued at 636 million liras, according to the notice.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:50 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Kopsi, Taiwan, other Asian stocks tumble after US midterm elections signal Democratic victory. What\u2019s the connection?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Kopsi, Taiwan, other Asian stocks tumble after US midterm elections signal Democratic victory. What\u2019s the connection? The Economic Times daily newspaper is available online now. Read Today's Paper Kopsi, Taiwan, other Asian stocks tumble after US midterm elections signal Democratic victory. What\u2019s the connection? SECTIONS Kopsi, Taiwan, other Asian stocks tumble after US midterm elections signal Democratic victory. What\u2019s the connection? By Veer Sharma , ETMarkets.com Last Updated: Nov 04, 2026, 12:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis South Korean and Taiwanese equities tumbled as a potential Democratic sweep in the US midterm elections fuelled concerns over tighter AI regulations and slower data centre investments. Chipmakers led the sell-off, dragging regional markets lower, while Asian currencies strengthened against a weaker dollar.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:47 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mutual fund 1, 3, 5 years returns battle 2026: Which large, mid, small-cap schemes delivered consistent money gains?", "full_content": "Equity mutual funds are classified into different categories based on their investments across market capitalisations, primarily large-cap, mid-cap, and small-cap funds.\n\nLarge-cap funds invest in well-established companies that tend to be relatively less volatile, while mid-cap funds focus on medium-sized companies. Small-cap funds, on the other hand, invest in smaller companies, which carry higher risks but also offer greater growth potential.\n\nAs per SEBI 's categorisation norms, large-cap funds must invest at least 80% of their assets in large-cap stocks. Mid-cap and small-cap funds must invest at least 65% of their assets in their respective categories.\n\nOver the last one year, the large-cap fund category declined by an average of 5.80%, while mid-cap funds fell by 1.06%. Small-cap funds, however, gained 3.13%.\n\nAgainst this backdrop, here is a look at the schemes across these three categories that delivered positive returns over the 1-year period and also recorded positive returns over the 3-year and 5-year periods.\n\nThe table below lists large-cap funds ranked by their 1-year returns. It includes only schemes that have delivered positive returns over the 3-year and 5-year periods as well. Only three large-cap schemes met these criteria.\n\n*Source: Morningstar, Direct-Growth plans; CAGR as on 3 November 2026\n\nTaurus Largecap Equity topped the list with a 1-year return of 5.55% and also recorded the highest 3-year return of 14.73% among the three schemes. However, Invesco India Large Cap delivered the highest 5-year return of 10.52%. Quant Large Cap does not have a 5-year return figure.", "source": "LiveMint Money", "pub_date_str": "04 Nov 2026, 12:45 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Novo raises full-year outlook as Wegovy pill sales impress", "full_content": "Novo posted quarterly earnings ahead of expectations early Wednesday as sales of its Wegovy pill blew past estimates.\n\nThe Danish weight-loss drug maker is looking to regain momentum following a tumultuous year in which it fell behind rival Eli Lilly.\n\nThe company updated its outlook to now see adjusted revenue and operating profit growth of between negative 2% and 2% at constant exchange rates. It previously saw full-year sales and operating profits, which it hiked in August, at negative 6% to flat for both metrics.\n\nSales in the third quarter came in at 79.2 billion Danish kroner ($11.9 billion), up 4% year-on-year at constant exchange rates and ahead of FactSet estimates of 73.6 billion kroner. Adjusted operating profit (EBIT) was 31.7 billion kroner, compared with the expected 28.6 billion kroner.\n\nWhile Novo pioneered the GLP-1 weight-loss drugs now used by around 10% of Americans, it has struggled to keep the momentum going as chief rival Eli Lilly quickly caught up and surpassed Novo in their by far biggest market, the U.S. Several other pharma companies are also eyeing entry into the lucrative market.\n\nInvestors are now laser-focused on the pair's next-generation weight-loss drugs, and whether they can treat obesity-linked diseases such as heart and kidney conditions, sleep apnea and arthritis.\n\nNovo said sales of its Wegovy pill, launched earlier this year, totaled 5.4 billion kroner, compared with the roughly 4.5 billion kroner analysts expected.\n\nSales of injectable Wegovy and diabetes treatment Ozempic were 20.4 billion kroner and 29.7 billion kroner, respectively, also above expectations.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:44 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Equitas Small Finance Bank shares jump 9% after Balaji Nuthalapadi\u2019s appointment as interim CEO", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Equitas Small Finance Bank shares jump 9% after Balaji Nuthalapadi\u2019s appointment as interim CEO Equitas Small Finance Bank Share Price Au Small Finance Bank Share Price Ujjivan Small Finance Bank Share Price Jana Small Finance Bank Share Price ESAF Small Finance Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Equitas Small Finance Bank shares jump 9% after Balaji Nuthalapadi\u2019s appointment as interim CEO SECTIONS Equitas Small Finance Bank shares jump 9% after Balaji Nuthalapadi\u2019s appointment as interim CEO By Surbhi Khanna , ET Online Last Updated: Nov 04, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The bank further said that appointment of Nuthalapadi as interim CEO, consequent to the resignation of P. N. Vasudevan as the MD & CEO, shall take effect from the date of RBI approval or such other date as may be stipulated by the RBI in this regard.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "04 Nov 2026, 12:44 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Small-cap stock under \u20b950 SC Agrotech hits 5% upper circuit for 8th straight session; gives 160% returns in one year", "full_content": "Small-cap stock under \u20b9 50: Despite high volatility in the Indian stock market, some stocks have shown resilience against this nervousness on Dalal Street. Shares of SC Agrotech Ltd are one of them. The small-cap stock with a market cap of \u20b9 337 crore opened at \u20b9 44.37 per share on the BSE and touched the 5% upper circuit within a few seconds of the Opening Bell. While hitting this upper circuit, the small-cap stock under \u20b9 50 went on to touch 5% upper circuit for the eighth straight session. The small-cap stock that has delivered 160% returns in one year has been hitting the upper circuit since 26 October 2026, delivering over 43% in eight days by rising from \u20b9 30.88 to \u20b9 44.37 per share.\n\nThe small-cap company was in the news on Tuesday evening for receiving approval from the Ministry of Corporate Affairs for the acquisition of the subsidiary company \u2014 SC Careoasis Healthcare Private Limited. The latest catalyst is SC Agrotech\u2019s digital agriculture platform, AgriBridge , which the company says has been launched for public use on November 4, 2026, i.e., today\n\nThe small-cap company with a stock price below \u20b9 50 informed the Indian exchanges about the government's approval, saying, \u201cWe hereby wish to inform that, the Ministry of Corporate Affairs has approved incorporation of a subsidiary of the Company in the name of \u201cSC Careoasis Healthcare Private Limited\u201d on October 30, 2026.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:43 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures mixed as Democrats win big in midterms, traders bet they will slow data center buildout: Live updates", "full_content": "Stock futures were mixed early on Wednesday as traders speculated that Democrats were headed for majority control of Congress and some key gubernatorial wins in the 2026 U.S. midterm elections .\n\nFutures tied to the S&P 500 traded 0.21% lower, while Nasdaq-100 futures shed 0.30%. But futures tied to the Dow Jones Industrial Average moved higher, adding 29 points, or 0.06%. Futures were off their worst levels of the session.\n\nThe Democratic Party is projected to win both chambers of Congress, according to The Associated Press. The AP also projected that Texas Democratic governor candidate Gina Hinojosa is the winner over Republican incumbent Greg Abbott. Hinojosa has pledged a moratorium on data centers in the key tech hub.\n\nDemocrats securing a sizable majority in the House and Senate \u2014 the so-called blue wave scenario \u2014 would pressure the market and especially stocks related to the artificial intelligence buildout, according to some on Wall Street. Investors fear a big Democratic win could mean more restrictions on data centers nationwide. AI-linked stocks have already pulled back in recent weeks on concern about a slowing pace in data-center spending.\n\nBig Tech shares Microsoft , Amazon and Nvidia were all trading lower in overnight trading on Robinhood.\n\nElon Musk's SpaceX was down 4.6% on Robinhood, while Tesla shares were down 4.1%. Data center play CoreWeave was down 3.2% in Robinhood overnight trading, while Alphabet was some 0.6% lower.\n\nEquities \"trended lower as it's looked more likely that Democrats are going to pick up the House and most likely the Senate,\" said Anthony Saglimbene, chief market strategist at Ameriprise Financial, Tuesday evening as futures were pulling back.\n\nHe added: \"If you get some governorships that are Democratic, what does that mean for the data center buildout, which has already seen a lot of skepticism over the last couple weeks in terms of the hyperscaler capex spending?\"", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:42 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock Market LIVE: Sensex Flat, Nifty 50 Around 23,800; TCS, Infosys, HCL Tech Lead Losses; BEL, Adani Ent, ITC Gain", "full_content": "Among sectors, Nifty FMCG, Nifty Realty, Nifty Metal, Nifty Pharma and Nifty Oil & Gas led gains, while losses was seen in Nifty IT and Nifty Private Bank.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:37 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold Glitters, Silver Shines Ahead Of Dhanteras: Yellow Metal Prices Jump By Rs 2,500; Silver Surges By Rs 5,700", "full_content": "Gold prices climbed above Rs 1.41 lakh per 10 grams on MCX, while silver surged past Rs 1.85 lakh per kg.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:36 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Q2 Results Live Updates: Saregama India Profit Rises 48%, Cera Sanitaryware Profit Flat At Rs 56 Crore; BSE, Cummins Also In Focus", "full_content": "BSE, Cummins India, Zydus Life and Apollo Tyres are among the 327 companies scheduled to announce their Q2FY27 results today. Track the latest earnings announcements, financial performance, management commentary and stock market reaction live on NDTV Profit.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:35 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Midterm Takeaways: Tech billionaires suffer horrible night as Democrats drub Republicans", "full_content": "Democrats took control of Congress Tuesday night, delivering a stinging rebuke to President Donald Trump and his economic record as voters voiced deep frustration with rising prices, government corruption and the AI data center build-out .\n\nThe party scored an extraordinary pair of victories in traditionally Republican Texas. James Talarico defeated Ken Paxton, becoming the first Democrat elected to the U.S. Senate from the state in nearly four decades. Gina Hinojosa defeated three-term Gov. Greg Abbott, making her the first Democratic governor of Texas since Ann Richards left office in 1995. Texas became the clearest measure of how far the blue wave reached: Democrats swept the state's marquee races in a Republican stronghold long considered beyond their grasp.\n\nThe victories were part of a broader wave of Democratic gains. In South Carolina, Democrat Annie Andrews upset Darline Graham in a race Republicans had expected to win. In Ohio, Sherrod Brown defeated Republican Sen. Jon Husted. Democrats also flipped Senate seats in Iowa and North Carolina and won key races in Georgia and New Hampshire.\n\nThe results marked a striking collapse for Trump's candidates. Paxton, Graham and Husted were among the president's prominent picks who lost after he made dozens of endorsements.\n\nThe election also sharpened the political fight over data centers and artificial intelligence infrastructure . Texas is a major center of planned data-center construction , and Hinojosa campaigned for a pause on new projects until the state adopts tougher rules. Her victory gives Democrats more influence over Texas' approach to the build-out, though the state Legislature remains in Republican hands.\n\nThe results also delivered a blow to the tech billionaires and corporate interest groups that poured hundreds of millions of dollars into backing Republican candidates who might be friendly to the massive AI data center projects they hope to build around the country.", "source": "CNBC Top News", "pub_date_str": "04 Nov 2026, 12:33 PM IST", "pub_date_relative": "34m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Investing In US Stocks From India? Five Risks You Should Know", "full_content": "The returns from US stocks are not determined by share-price movements alone. The Rupee-Dollar exchange rate also plays a role in the final returns earned by Indian investors.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:25 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Awfis Space Solutions shares rally 13% on strong Q2 results | Check stock returns", "full_content": "Vaamanaa Sethi Published 4 Nov 2026, 12:24 PM IST Prefer Livemint on Google Awfis Space Solutions share price rallied as much as 13% in Wednesday's trading session after the company reported strong set of numbers during the July-September quarter.\n\nAwfis Space shares opened at \u20b9 257 apiece on NSE today, as compared to previous close of \u20b9 241.20 on Tuesday, as compared to previous close of \u20b9 275 on 4 November.\n\nAwfis Space Solutions , one of India's leading flexible workspace providers, reported a strong performance in the September 2026 quarter, with its net profit jumping 94% year-on-year (YoY) and revenue increasing 20%.\n\nThe company's revenue from operations rose to \u20b9 439 crore in Q2 FY27, compared with \u20b9 367 crore in the corresponding quarter of the previous financial year, registering a 20% YoY growth.\n\nAwfis Space Solutions' net profit nearly doubled to \u20b9 31 crore in the September quarter from \u20b9 16 crore in Q2 FY26, marking a 94% increase on a year-on-year basis.\n\nThe company also recorded strong business momentum in the first half of FY27, selling more than 25,000 seats amid sustained demand for flexible workspace solutions.\n\nDuring the September quarter, Awfis added six new centres, expanding its network to 254 centres with approximately 1.74 lakh seats across 18 cities. Its diversified clientele now comprises more than 3,700 companies.\n\nThe company's overall portfolio occupancy stood at 76.2%, while centres that have been operational for more than 12 months reported a higher occupancy rate of 84.1%.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:24 PM IST", "pub_date_relative": "43m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RBI sets up panel with banks, market players to review financial market issues", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panach a core CFA economics topic."}, {"title": "US Midterm Elections Results 2026 Live: Trump Accepts Defeat As Democrats Close In On Total Control", "full_content": "Follow NDTV Profit for the latest voting updates, key developments, state-wise results, winners and reactions as the election unfolds across the US.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:09 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Gold rate today Coimbatore Nov 4 Wednesday: Up or down? Latest price for investors ahead of Dhanteras, Diwali 2026", "full_content": "Gold rate today, Coimbatore, Nov 4, Wednesday: The price of the yellow metal rose today in Coimbatore, in line with global trends, as the markets await the United States midterm election results and non-farm payrolls data, Reuters reported.\n\nSpot gold was up 0.5% at $3,947.49 per ounce by 0415 GMT, while US gold futures for December delivery rose 0.5% to $3,958.00. And among other metals, spot silver fell 0.8% to $49.38, platinum slipped 1.2% to $1,399.72, and palladium dropped 0.2% to $932.07, it added.\n\n\u201cA weaker USD and a punchy decline in both nominal and real US Treasury yields are clearly providing support for gold. The demand for protection against a potentially more unpredictable and confrontational Trump administration looks to be providing a compelling backdrop for gold buyers,\u201d Chris Weston, head of research at Pepperstone, told the agency.\n\nIn the domestic markets, gold prices on Wednesday rose by \u20b9 510 to \u20b9 1,39,962 per 10 grams in futures trade as speculators created fresh positions on firm spot demand, PTI reported. On the Multi Commodity Exchange ( MCX ), the yellow metal contract for December delivery traded higher by \u20b9 510, or 0.37%, at \u20b9 1,39,962/10 grams in a business turnover of 876 lots, it added.\n\nAt the time of writing, gold bullion was trading at \u20b9 1,42,450 per 10 grams, while Silver was at \u20b9 1,85,930 per kg, data on the bullion website showed.\n\nUp or down? Check the latest price for investors in Isha City ahead of Dhanteras and Diwali 2026. We also bring retail gold and silver rates in key Indian cities on Wednesday, 4 November 2026. Check the price of 18K, 22K and 24K gold and 999 Fine silver in Ahmedabad, Bangalore, Chennai, Delhi, Hyderabad, Kolkata and Mumbai today as follows:\n\nThe 24-karat gold price was at \u20b9 1,42,880 per 10 grams on 4 November.", "source": "LiveMint Money", "pub_date_str": "04 Nov 2026, 12:09 PM IST", "pub_date_relative": "59m ago", "cfa_topics": ["Fixed Income", "Derivatives", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Stockal Fraud Case: HDFC Securities Says It Is Not An Accused, Partnership Ended In 2024", "full_content": "In an exchange filing, HDFC Securities said its operational partnership with Stockal had ended in 2024 and stressed that customer trust and regulatory compliance remained central to its operations.", "source": "NDTV Profit", "pub_date_str": "04 Nov 2026, 12:08 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Clean Max shares: Power stock jumps 42% in YTD; will this rally continue after Q2 results 2026? Expert views, target", "full_content": "Pranati Deva Published 4 Nov 2026, 12:07 PM IST Prefer Livemint on Google Shares of Clean Max Enviro Energy Solutions Ltd. traded higher on Wednesday, November 4, after the renewable energy company reported a strong set of Q2 FY27 results, with EBITDA and net profit beating analyst estimates.\n\nCleanMax's earnings growth was supported by higher power sales, an expanding renewable energy portfolio and continued demand from commercial and industrial (C&I) customers. Its overall platform capacity reached approximately 13 GW as of September 30, 2026.\n\nCleanMax shares climbed as much as 2.5% to \u20b9 1,257.05 on the BSE on Wednesday, against the previous close of \u20b9 1,225.30. The power stock opened at \u20b9 1,250.90.\n\nDespite the recent gains, it remains 18% below its 52-week high of \u20b9 1,532.80, recorded in June 2026. Its 52-week low stands at \u20b9 728, touched in March 2026.\n\nThe stock has faced some near-term pressure, declining 5% in one month and 7% over three months. However, it has gained 6.5% in six months and delivered a 42% return year-to-date in 2026.\n\nCleanMax Q2 results: Net profit jumps 82%, EBITDA beats estimates\n\nCleanMax reported an 82.3% year-on-year (YoY) increase in net profit to \u20b9 64.9 crore in Q2FY27 , compared with \u20b9 35.6 crore a year ago. This was significantly higher than the estimated \u20b9 42 crore.\n\nRevenue from operations rose 37% YoY to \u20b9 727.6 crore from \u20b9 530.6 crore, broadly meeting expectations. However, the bigger earnings surprise came from EBITDA, which increased 51% to \u20b9 547.7 crore against \u20b9 362.9 crore in Q2FY26, beating the consensus estimate of \u20b9 436 crore. Adjusted reported EBITDA stood at \u20b9 553 crore, up 43%.", "source": "LiveMint Markets", "pub_date_str": "04 Nov 2026, 12:07 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Democrats\u2019 win rattles Trump trades from AI stocks to crypto", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Democrats\u2019 win rattles Trump trades from AI stocks to
