ng that such orders are \"generally unappealable.\"\n\n\"Simply put\u2014the record lacks factual support for Defendants' contention that the revocation of Plaintiffs' hard passes will in fact protect national security or that national security will be endangered if the Court orders their passes reinstated while this litigation proceeds,\" Kelly said.\n\nIn a Truth Social post last week, Trump said he was banning the outlets from the White House effective immediately, warning that other \"Fake News Media Outlets\" could follow. The president cited what he called \"cumulative stories\" by the three news organizations, adding, \"You get sick of it.\"\n\nIn his ruling, Kelly said the court declined \"to stay\" the temporary restraining order's entry or effective date, as the defendants had requested.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:05 PM IST", "pub_date_relative": "11m ago"}, {"title": "Rupee falls 22 paise as crude, dollar demand rise", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee falls 22 paise as crude, dollar demand rise The Economic Times daily newspaper is available online now. Read Today's Paper Rupee falls 22 paise as crude, dollar demand rise SECTIONS Rupee falls 22 paise as crude, dollar demand rise By Atmadip Ray , ET Bureau Last Updated: Sep 24, 2026, 06:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The rupee weakened 22 paise to 95.96 per dollar as strong importer demand, rising crude prices and global bond yields pressured the currency. Traders said RBI intervened through state-owned banks, while US-Iran tensions raised inflation and rate-hike concerns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETM of terrorism,\" Pezeshkian said, according to a live translation of his speech at the United Nations General Assembly. Pezeshkian also asserted that his country will continue to fight back \"until our last breath.\"\n\nTraders are also assessing a report that Asia is on track to import its highest volume of crude oil since the start of the war.\n\nAsia's imports of crude oil rose in September to the highest level since the start of the Iran war, Reuters reported. The region is on track to import 23.96 million barrels per day \u200bin September, up from 23.38 million bpd in August and the most since February, Reuters said, citing data compiled by commodity analysts Kpler.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 05:59 PM IST", "pub_date_relative": "18m ago"}, {"title": "HCW Biologics prices $1.5M private placement offering", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:58 PM IST", "pub_date_relative": "18m ago"}, {"title": "HSBC sees \u2018plenty of road for recovery\u2019 for Dollar General", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:58 PM IST", "pub_date_relative": "19m ago"}, {"title": "OpenAI and Anthropic CEOs push for AI cooperation at UN after Trump rebuffs 'globalist scheme' to control it", "full_content": "OpenAI CEO Sam Altman and Anthropic CEO Dario Amodei addressed the United Nations Security Council on Wednesday and called for international coordination to address the potential risks posed by artificial intelligence .\n\n\"In our history, there have been times where countries who compete and don't always like each other very much still come together for shared interests and the collective good in the face of a powerful new technology,\" Altman said. \"We believe this must be one of those times\"\n\nEarlier this month, Amodei rocked the tech sector by publishing a proposal to slow down the pace of AI development. Altman, in a rare sign of solidarity with his chief rival, publicly agreed with Amodei on the need to \"pace the frontier.\" The safety practices at both companies have been under intense scrutiny after industry researchers warned about AI's growing potential to cause catastrophic harm .\n\nThe executives' remarks on Wednesday came just one day after President Donald Trump gave his own wide-ranging speech to the United Nations General Assembly. Trump criticized what he described as a \"globalist scheme\" to control AI, and said the U.S. would continue to encourage the technology's progress, \"not rein it in.\"\n\n\"I'm not going to stifle growth of something that will be bigger than the industrial revolution,\" Trump said.\n\nOpenAI and Anthropic's public positions have raised questions about what a slowdown would mean in practice, especially as both companies are gearing up for what are widely expected to be blockbuster IPOs . Neither company has officially disclosed when it plans to debut.\n\n\"Beating companies in a competitive race is not a reason to make rash decisions,\" Altman said Wednesday. \"We have unilaterally slowed down in the past. We will do so in the future.\"\n\nOpenAI opted to temporarily pause some of its research and training efforts after two of its models escaped containment, accessed the open internet breached the developer platform Hugging Face in July.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 05:57 PM IST", "pub_date_relative": "20m ago"}, {"title": "Stifel cuts Vail Resorts stock price target on Australia challenges", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:56 PM IST", "pub_date_relative": "20m ago"}, {"title": "Why is CoreWeave stock climbing today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:55 PM IST", "pub_date_relative": "21m ago"}, {"title": "Qualcomm secures extension to global chip licensing pact with Apple", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:55 PM IST", "pub_date_relative": "22m ago"}, {"title": "Iced coffee, tattoos, thank-you notes: The shifting do\u2019s and don\u2019ts of job interviews - The Washington Post", "full_content": "Iced coffee, tattoos, thank-you notes: The shifting do\u2019s and don\u2019ts of job interviews The Washington Post Bringing this popular drink to a job interview could hurt your chances, experts warn Fox News Gen Z's iced coffee habit in interviews could be costing them jobs, recruiters warn: 'It isn't really about coffee' Fortune Is iced coffee really unprofessional at a job interview? salon.com The great iced coffee debate: is it wrong to take a beverage into a job interview? The Guardian", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 05:54 PM IST", "pub_date_relative": "22m ago"}, {"title": "BlackBerry lifts annual revenue forecast on strength in automotive software business", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:54 PM IST", "pub_date_relative": "22m ago"}, {"title": "Why is aTyr Pharma stock surging today?", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:54 PM IST", "pub_date_relative": "22m ago"}, {"title": "Palo Alto CEO says slowing down AI is \u2018unrealistic\u2019, extinction threat \u2018extremely small\u2019", "full_content": "The CEO of Palo Alto Networks has entered the debate around the threat AI poses to humanity, telling CNBC that it's \"unrealistic\" to slow down the technology as different companies will do different things.\n\n\"I think not everybody is going to pace themselves,\" Nikesh Arora told CNBC's \"The Tech Download\" podcast, recorded on Tuesday.\n\nSome of the industry's biggest names take opposing views since an Anthropic researcher claimed that there is a 10% chance that AI could \"kill all humans,\" after another researcher said they were quitting because the company, alongside OpenAI, was not acting responsibly.\n\nAnthropic CEO Dario Amodei penned an essay days later, saying the AI industry \"must slow the pace at which we improve the capabilities of AI models.\" OpenAI CEO Sam Altman, SpaceX CEO Elon Musk and Google DeepMind Chair Demis Hassabis voiced support.\n\nArora initially posted on X that he thought the call for a slowdown was a \"NINJA MOVE,\" an action that could gain someone a stealthy advantage. He told CNBC that he posted this because he thought these AI firms were trying to \"get the sympathy of the regulators\" and lawmakers and get a \"free pass\" on liability.\n\nBut the CEO said he now thought the so-called \"pacing\" of AI development \"is unrealistic.\"\n\n\"I think more than likely that some people will jump the gun, and you'll have still people developing at the frontier, which means we shouldn't try and stop the frontiers because they're the most responsible people,\" Arora said.\n\n\"So, from that perspective, the idea is don't release your product if you don't believe it's going to be safe, or you're comfortable putting it out there,\" he said, adding that it's also unclear how companies would create a way to test the pace of AI development.", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 05:54 PM IST", "pub_date_relative": "22m ago"}, {"title": "Digital Brands\u2019 AVO unit reports 221% revenue growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:54 PM IST", "pub_date_relative": "22m ago"}], "cfa": [{"title": "Xi arrives in D.C., Treasury yields hit multiyear highs, McDonald's growth plan and more in Morning Squawk", "full_content": "This is CNBC's Morning Squawk newsletter. Subscribe here to receive future editions in your inbox.\n\nHappy Thursday. Planning a home project? You may soon be able to get the tools by drone. Lowe's told CNBC that it is launching a drone delivery service in partnership with DoorDash and Alphabet 's Wing.\n\nStock futures are falling this morning after a down day on Wall Street.\n\nHere are five key things investors need to know to start the trading day:\n\nFears that the Federal Reserve will deliver another interest rate hike this year pushed Treasury yields to multiyear highs yesterday, in turn causing the three major averages to close the session lower. The S&P 500 saw its worst day in more than a month, and the Nasdaq Composite dropped more than 1%.\n\nChinese President Xi Jinping arrived at Maryland's Joint Base Andrews last night, where he was greeted on the tarmac by President Donald Trump ahead of today's high-stakes summit . As CNBC's Kevin Breuninger writes, the two leaders are expected to discuss trade, artificial intelligence and the Iran war before a state dinner this evening.\n\nTreasury Secretary Scott Bessent told Fox News yesterday that the U.S. and China agreed to extend their trade truce to Jan. 10. Chinese state media did not immediately note Bessent's comments, but a spokesperson for China's Commerce Ministry told reporters this morning that the two sides had discussed plans for lowering tariffs.\n\nTrump and Xi's meeting comes as AI concerns take hold globally, though neither party appears interested in slowing down the pace of innovation. Trump wrote in a Truth Social post this morning that \"Super Intelligence (SI) will be a big topic of discussion, but I want to leave it exactly where it is. That is China's position also.\"", "source": "CNBC World Economy", "pub_date_str": "24 Sep 2026, 06:11 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Starbucks to shutter about 250 stores in latest round of cafe closures", "full_content": "Starbucks on Thursday announced it will close about 1% of its North American cafes as part of its turnaround.\n\nUnder CEO Brian Niccol, Starbucks has staged a revamp of its U.S. business that has focused on improving the customer experience, including in-person interactions at its cafes. The announcement marks the second round of closures in North America during Niccol's two-year tenure.\n\nStarbucks expects to shutter about 250 underperforming cafes out of its more than 18,000 locations in North America. It was not immediately clear where the closing locations are.\n\n\"We have carefully reviewed our North America coffeehouse portfolio and identified locations where we do not believe we can consistently deliver the experience we want for customers and partners or where we don't see a path to acceptable financial performance,\" Mike Grams, Starbucks chief operating officer, wrote in a letter addressed to employees.\n\nFor fiscal 2026, Starbucks is now projecting net new openings of 440 cafes, down from its prior outlook of 600 to 650 locations. Those new cafes will come from its international markets.\n\n\"The Company continues to see significant longer-term growth opportunity ahead in North America and is actively developing a strong pipeline of new coffeehouses,\" Starbucks said in a regulatory filing .\n\nMost of the closures will occur before the end of fiscal 2026, according to the filing. Starbucks' fiscal year ends later this month.\n\nThe company expects to incur about $300 million in restructuring charges related to the closures. About $200 million of that charge will be related to the costs of exiting leases early and paying employees separation benefits. The remaining $100 million will be noncash charges from the disposal and impairment of its company-owned restaurant assets.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:10 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The stock market is \u2018priced for perfection.\u2019 Here\u2019s what could drive a nearly 20% slump for the S&P 500 next year.", "full_content": "Clocktower\u2019s Eric Wallerstein believes stocks are headed for trouble next year, and safety-seeking investors could drive gold to $6,000 an ounce.", "source": "MarketWatch Top Stories", "pub_date_str": "24 Sep 2026, 06:08 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock market prediction for tomorrow: Sensex, Nifty outlook for Friday | Kospi, Taiwan cues to watch | 25 Sept 2026", "full_content": "The Indian stock market suffered heavy losses in Thursday\u2019s trade, September 24, with the headline indices closing more than 1.5% lower, erasing their recent gains and falling below key psychological levels. Investor sentiment was hit by surging global bond yields and volatility in crude oil prices.\n\nWith Thursday\u2019s decline, both the Nifty 50 and Sensex logged their worst single-session losses in 10 weeks, while their year-to-date losses widened to nearly 12%, putting them on track for their first annual decline in more than a decade.\n\nApart from weak global cues, the Insurance Regulatory and Development Authority of India (IRDAI) proposed sweeping changes to insurance commission rules, triggering a wave of selling across financial and NBFC stocks.\n\nThe Nifty 50 plunged 1.64% to settle at 25,169.50 , while the Sensex finished at 73,580, down 1.67% from the previous session. The pain was more pronounced in the broader market, with the Nifty Midcap 100 falling 2.57% and the Nifty Smallcap 100 tumbling 2.25%.\n\nAll major sectoral indices closed sharply lower, with banks and insurers bearing the brunt of the selling after the country\u2019s insurance regulator proposed an overhaul of commission rules to cap payouts, link them to product complexity and allow life insurers to spread commissions beyond the first year of a policy.\n\nBanking and financial stocks fell 2% and 2.4%, respectively. Among individual stocks, PB Fintech was the worst hit, plunging 36%, while Turtlemint Fintech sank 20%.\n\nThe sell-off in Indian equities came amid continued pressure from global bond markets. The US 10-year Treasury yield steadied at 5.12% in Thursday\u2019s session after surging 15 basis points on Wednesday, marking its biggest one-day increase since the turmoil triggered by President Donald Trump\u2019s April 2025 tariff announcement.\n\nThe rise in bond yields coincided with a sharp rebound in oil prices, adding another layer of pressure on global markets.", "source": "LiveMint Markets", "pub_date_str": "24 Sep 2026, 06:06 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Judge lifts Trump ban on CNN, MS NOW, Politico from White House", "full_content": "A federal judge on Thursday ordered White House access to journalists from CNN, MS NOW and Politico to be temporarily restored, saying U.S. President Donald Trump 's media ban was likely unconstitutional.\n\nThe ruling represents a victory for the three media outlets, who had argued the ban violated their First Amendment rights, and comes as Trump hosts Chinese President Xi Jinping for a high-stakes meeting .\n\nBut a Politico reporter on Thursday morning \"was denied access to the White House .... and his press credentials confiscated\" by the Secret Service, that news outlet reported .\n\nIn his ruling, District Judge Tim Kelly said the three outlets should have their access immediately restored from the ban that the president had announced on Sept. 18 , rejecting a request by the Justice Department to delay it for at least two days. The judge was nominated by Trump to the federal bench in 2017.\n\nKelly said the Trump administration must return, reinstate and restore the White House \"hard pass\" press credentials held by employees of the three outlets that had been revoked. The temporary restraining order remains in effect for 14 days, with Kelly noting that such orders are \"generally unappealable.\"\n\n\"Simply put\u2014the record lacks factual support for Defendants' contention that the revocation of Plaintiffs' hard passes will in fact protect national security or that national security will be endangered if the Court orders their passes reinstated while this litigation proceeds,\" Kelly said.\n\nIn a Truth Social post last week, Trump said he was banning the outlets from the White House effective immediately, warning that other \"Fake News Media Outlets\" could follow. The president cited what he called \"cumulative stories\" by the three news organizations, adding, \"You get sick of it.\"\n\nIn his ruling, Kelly said the court declined \"to stay\" the temporary restraining order's entry or effective date, as the defendants had requested.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 06:05 PM IST", "pub_date_relative": "11m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Rupee falls 22 paise as crude, dollar demand rise", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Forex \u203a Forex News \u203a Rupee falls 22 paise as crude, dollar demand rise The Economic Times daily newspaper is available online now. Read Today's Paper Rupee falls 22 paise as crude, dollar demand rise SECTIONS Rupee falls 22 paise as crude, dollar demand rise By Atmadip Ray , ET Bureau Last Updated: Sep 24, 2026, 06:02:  Thursday amid scant evidence that talks between the U.S. and Iran were showing progress towards a diplomatic solution to the Middle East conflict.\n\nBrent crude , the international benchmark, rose 1.9% to $105.02 a barrel. U.S. West Texas Intermediate futures moved 1.7% higher to $93.72 per barrel.\n\nbrent Tensions continue to simmer between the U.S. and Iran after Iranian President Masoud Pezeshkian blamed the U.S. and Israel for stoking global instability.\n\n\"The United States president described us as terrorists. We have been the victims of terrorism,\" Pezeshkian said, according to a live translation of his speech at the United Nations General Assembly. Pezeshkian also asserted that his country will continue to fight back \"until our last breath.\"\n\nTraders are also assessing a report that Asia is on track to import its highest volume of crude oil since the start of the war.\n\nAsia's imports of crude oil rose in September to the highest level since the start of the Iran war, Reuters reported. The region is on track to import 23.96 million barrels per day \u200bin September, up from 23.38 million bpd in August and the most since February, Reuters said, citing data compiled by commodity analysts Kpler.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 05:59 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "BlackBerry lifts annual revenue forecast on strength in automotive software business", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:54 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Digital Brands\u2019 AVO unit reports 221% revenue growth", "full_content": "", "source": "Investing.com News", "pub_date_str": "24 Sep 2026, 05:54 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Safety most important in managing forex reserves says RBI Deputy Governor Rohit Jain", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a Safety most important in managing forex reserves says RBI Deputy Governor Rohit Jain The Economic Times daily newspaper is available online now. Read Today's Paper Safety most important in managing forex reserves says RBI Deputy Governor Rohit Jain SECTIONS Safety most important in managing forex reserves says RBI Deputy Governor Rohit Jain By Joel Rebello , ET Bureau Last Updated: Sep 24, 2026, 05:50:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis RBI Deputy Governor Rohit Jain stated that safety is the highest priority when managing foreign exchange reserves. Liquidity and return are also important, but must follow safety in order of importance. Jain highlighted that the current reserves are the highest on record at $781 billion, ranking fifth globally. Financial institutions are urged to develop capacities for identifying technology vulnerabilities to maintain continuity and stability.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers\n\nLogin using your ET Prime credentials to enjoy all member benefits\n\nLog out of your current logged-in account and log in again using your ET Prime credentials to enjoy all member benefits.", "source": "Economic Times Economy", "pub_date_str": "24 Sep 2026, 05:50 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Global bond sell-off spreads as oil climbs back to $105", "full_content": "Rising yields strain public finances after brutal sell-off in US Treasuries market", "source": "FT Markets", "pub_date_str": "24 Sep 2026, 05:48 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "30-year Treasury yield hits highest level since 2004 as bond market rout continues", "full_content": "Treasury yields were trading near multidecade highs Thursday, as investor bets on another rate hike from the Federal Reserve mounted.\n\nThe 30-year Treasury bond yield was up more than 3 basis points at 5.435%. Earlier in the day, it reached a 2004 peak around 5.44%. The benchmark 10-year Treasury note yield , which is tied to rates on mortgages, surged to climbed 5.133% and hit its highest level since July 2007. The yield on the 2-year note fell slightly to 4.879%, though it remained around a 2023 high.\n\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\n\nGlobal bonds also sold off. Japan's 10-year JGB yield rose its highest since August 1996. U.K. Gilts and German Bunds also moved higher, with yields on various European bonds hitting fresh multi-year highs.\n\nThursday's moves build on a U.S. Treasury rout that took place Wednesday. The 10-year Treasury yield had its biggest one-day jump since April 7, 2025 as traders reacted to stronger-than-expected U.S. economic data, hawkish commentary from a Federal Reserve official and high oil prices.\n\n\"The combination of fiscal, economic, geopolitical, and supply-side inflation pressures converging has bond markets in less familiar territory. The recent rise in yields can no longer be attributed simply to concerns over the deficit,\" said from Mike Sanders, head of fixed income at Madison Investments.\n\nThe data drove expectations of more rate hikes, with traders last pricing in a more-than-75 % chance that the Federal Open Market Committee will increase rates again at its October meeting, per the CME Group's FedWatch tool . That compares to a roughly 49% probability just a week ago.\n\n\"With markets pricing in four rate hikes through next year, the Fed is being pushed toward tighter policy at a time when the risk of a policy mistake is rising,\" he added.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 05:47 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "New FTAs provide comfort to invest in global supply chains in India: Commerce Secretary Rajesh Agarwal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a New FTAs provide comfort to invest in global supply chains in India: Commerce Secretary Rajesh Agarwal The Economic Times daily newspaper is available online now. Read Today's Paper New FTAs provide comfort to invest in global supply chains in India: Commerce Secretary Rajesh Agarwal SECTIONS New FTAs provide comfort to invest in global supply chains in India: Commerce Secretary Rajesh Agarwal PTI Last Updated: Sep 24, 2026, 05:47:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's latest free trade agreements are designed to foster long-term investments within global supply chains, also ensuring tariff stability, Commerce Secretary Rajesh Agarwal said. By tapping into a massive $60 trillion market, these agreements bolster investor confidence, he noted.\n\nBuilding recycling plants is fine. Will they get enough scrap?\n\nBiogas found its ethanol moment this month. Can it now find scale?\n\nHas the US Fed and AI created a costlier world? And has the queue got longer for India?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "24 Sep 2026, 05:47 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Economics", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Darden Restaurants stock falls as Olive Garden reports slower growth", "full_content": "Darden Restaurants on Thursday reported quarterly earnings and revenue that narrowly missed analysts' expectations as same-store sales growth at Olive Garden slows.\n\nHere's what the company reported for the quarter ended Aug. 30 compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nDarden reported fiscal first-quarter net income of $233.4 million, or $2.04 per share, down from $257.8 million, or $2.19 per share, a year earlier.\n\nThe company's same-store sales increased 3.1% during the fiscal quarter as each of Darden's business units reported growth.\n\nLongHorn Steakhouse was once again the top performer of the portfolio this quarter, as same-store sales rose 6.2%. The chain has overtaken Olive Garden to become Darden's top performer, although it still accounts for a smaller share of the company's overall revenue.\n\nOlive Garden saw its same-store sales inch up 1.1%. While it is still the company's largest chain by both number of locations and sales, Olive Garden has seen its growth weaken as diners have become more choosy about their spending.\n\nDarden's fine-dining business reported same-store sales growth of 1.6%. The segment includes chains like The Capital Grille and Ruth's Chris.\n\nThe company's remaining chains, which are grouped under its \"other business\" division, saw same-store sales grow 3.8% in the quarter.", "source": "CNBC Top News", "pub_date_str": "24 Sep 2026, 05:44 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Starbucks to close 250 stores: 'Difficult decision' - Fox Business", "full_content": "Starbucks to close 250 stores: 'Difficult decision' Fox Business Starbucks to shutter about 250 stores in latest round of cafe closures CNBC Starbucks closing 250 stores, cutting 900 jobs in restructuring qz.com Starbucks to Close 250 Underperforming Stores WSJ Starbucks to close another 250 coffeehouses in North America Reuters", "source": "Google News Business", "pub_date_str": "24 Sep 2026, 05:41 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Treasury rout, oil spike bleed Indian bonds; 10-year yield jumps most in over 2 months", "full_content": "Bond yields in India have surged following a notable uptick in US Treasury yields and escalating oil prices. With inflationary pressures mounting from higher oil costs, concerns regarding India\u2019s economic stability have grown. Analysts predict that the Reserve Bank of India may enact a rate hike in the forthcoming monetary policy meeting, with expectations for the terminal repo rate to potentially rise from 5.75% to 6.", "source": "Economic Times Markets", "pub_date_str": "24 Sep 2026, 05:37 PM IS     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
