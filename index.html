uld not establish the identity of the hackers, the full scope of the intrusion or whether any data had been stolen.\n\nIn a statement to Reuters, the Air Force said it \"does not comment on the security posture, vulnerabilities or operational status of specific networks and systems. We continuously take prudent measures to protect Department (of the Air Force) information, systems and mission capabilities.\"\n\nInitiated in 2017, Cloud One was meant to serve as a one-stop shop for the Air Force's IT needs, combining the resources of four operators \u2014 Microsoft, Amazon, Oracle and Alphabet \u2014 to power scores of applications including ones that manage personnel data and pay or logistics and maintenance.\n\nAmong them are the Air Force's Cloud-Based Command and Control, which collates air defense radar and other data feeds from across North America, and the Theater Integrated Combat Munitions System, which tracks bombs and missiles across more than 200 US Air Force locations around the world.\n\nSAIC was the prime contractor for Cloud One until 2026, when Leidos took over. SAIC did not respond to a request seeking comment. Leidos referred questions to the Air Force.\n\nCloud One is among the US military's biggest cloud platforms, according to two of the sources.\n\nInvestigators have called in Cyber Command, the US military's cyber force, to assess the damage, one of the sources said.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 01:33 AM IST", "pub_date_relative": "2h ago"}, {"title": "Coming next year: Medicare Advantage plans without drug coverage for almost 640,000 people and fewer choices for the rest", "full_content": "Medicare Advantage is starting to lose its all-in-one benefit.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Nov 2026, 01:25 AM IST", "pub_date_relative": "2h ago"}, {"title": "Los Angeles schools block Google\u2019s AI features, consider dropping tech giant\u2019s products - AP News", "full_content": "Los Angeles ts benchmark rate by 25 basis points to 2.75% next month after the central bank tightened in October for the first time in three years\n\n* Canadian third-quarter GDP data, due on Monday, could guide rate hike expectations. Economists expect growth to slow to an annualized pace of 1.5% from 3.3% in the second quarter\n\n* The price of oil, one of Canada's major exports, pulled back from an earlier 10-day high. US crude oil futures were trading 0.8% lower $83 a barrel, while the US dollar notched gains against a basket of major currencies", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 12:48 AM IST", "pub_date_relative": "2h ago"}, {"title": "ET India Ascends: Tiny shops, big dreams \u2014 unlocking the true potential of India's MSMEs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a ET India Ascends: Tiny shops, big dreams \u2014 unlocking the true potential of India's MSMEs The Economic Times daily newspaper is available online now. Read Today's Paper ET India Ascends: Tiny shops, big dreams \u2014 unlocking the true potential of India's MSMEs SECTIONS ET India Ascends: Tiny shops, big dreams \u2014 unlocking the true potential of India's MSMEs By Ram Singh , ET CONTRIBUTORS Last Updated: Nov 28, 2026, 12:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's unincorporated MSME sector is witnessing faster productivity growth and narrowing regional disparities, with manufacturing recording the biggest gains, according to four rounds of ASUSE data. However, technology constraints, credit shortages, inadequate industrial workspaces and skill gaps continue to limit growth, calling for targeted policy interventions to help smaller businesses scale up.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\n ng October. The Yangshan premium for copper reflects a robust demand for imports, even in the face of recent downturns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 12:13 AM IST", "pub_date_relative": "3h ago"}, {"title": "The warnings behind this week\u2019s stock-market rally", "full_content": "Also in Weekend Reads: Important tips for Medicare enrollment, how to spot online shopping scams and marital advice from The Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Nov 2026, 12:10 AM IST", "pub_date_relative": "3h ago"}, {"title": "Gold pares gains as Fed-hike risks linger, eyes first weekly rise in three weeks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a Gold pares gains as Fed-hike risks linger, eyes first weekly rise in three weeks The Economic Times daily newspaper is available online now. Read Today's Paper Gold pares gains as Fed-hike risks linger, eyes first weekly rise in three weeks SECTIONS Gold pares gains as Fed-hike risks linger, eyes first weekly rise in three weeks Reuters Last Updated: Nov 28, 2026, 12:09:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold prices have recently experienced a modest uptick after bottoming out at a 15-month low. Despite the robustness of the US dollar, surging Treasury yields are making investors wary. Following two weeks of declines, gold is now positioned for a weekly gain close to 2.5%. There has been a notable rise in physical gold demand, notably in India and China.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 12:09 AM IST", "pub_date_relative": "3h ago"}, {"title": "Axis Mutual Fund launches Nifty LargeMidcap 250 Index Fund; NFO open until December 11", "full_content": "Axis Mutual Fund has launched the Axis Nifty LargeMidcap 250 Index Fund, an open-ended equity index scheme designed to replicate and track the Nifty LargeMidcap 250 Index. The New Fund Offer (NFO) opened for subscription on November 27, 2026, and will remain open until December 11, 2026.\n\nThe scheme will reopen for regular subscriptions and redemptions within five business days of the allotment date. It aims to generate returns in line with the Nifty LargeMidcap 250 Total Return Index (TRI), subject to tracking error.\n\nThe fund will follow a passive investment strategy, investing in stocks in the same proportion and weightage as their representation in the underlying benchmark.\n\nAccording to the scheme information document (SID), the fund will invest 95-100% of its total assets in securities forming part of the Nifty LargeMidcap 250 Index.\n\nThe remaining 0-5% may be allocated to money market instruments and units of debt and liquid mutual fund schemes.\n\nThe scheme can also invest up to 15% of its net assets in equity derivatives of index constituents for portfolio rebalancing and when the underlying securities are unavailable.\n\nTo meet liquidity requirements, the fund may invest in liquid assets, short-term deposits with scheduled commercial banks, government securities, treasury bills and cash equivalents. It can also invest in repos on government securities with residual maturities of less than 91 days.\n\nAs a passive fund, its primary objective will be to minimise tracking error by replicating changes in index constituents and their respective weights while managing investor subscriptions and redemptions.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 12:08 AM IST", "pub_date_relative": "3h ago"}, {"title": "Stocks snap from a $6 trillion washout to a $3.5 trillion surge as Nvidia, Micron, and SpaceX bounce back - Yahoo Finance", "full_content": "Stocks snap from a $6 trillion washout to a $3.5 trillion surge as Nvidia, Micron, and SpaceX bounce back Yahoo Finance The warnings behind this week\u2019s stock-market rally MarketWatch U.S. Stocks Mixed as Huang Relief Rally Fades WSJ Is This the Bottom? It May Not Matter. Here's Why! The Motley Fool What's Next For Nvidia Stock - Wall Street Weighs Benzinga", "source": "Google News Business", "pub_date_str": "28 Nov 2026, 12:02 AM IST", "pub_date_relative": "3h ago"}, {"title": "Trump\u2019s Nvidia intervention has a cost for US stocks", "full_content": "Political meddling has already rubbed some of the gloss off the dollar and US Treasuries. Now it is hitting equities", "source": "FT Markets", "pub_date_str": "27 Nov 2026, 11:56 PM IST", "pub_date_relative": "3h ago"}, {"title": "Nestl\u00e9 India receives \u20b936.36 lakh EPFO notice, including damages and penalty of over \u20b920 lakh", "full_content": "FMCG major Nestl\u00e9 India said on Friday that it has received a demand of \u20b9 36.36 lakh from the Employees' Provident Fund Organisation (EPFO), including damages and a penalty of over \u20b9 20 lakh, for the period from 2012 to 2019.\n\nThe demand was issued by the EPFO's Regional Office in Mysuru under Sections 7Q and 14B of the Employees' Provident Funds and Miscellaneous Provisions Act, 1952, the company said in a regulatory filing.\n\nNestl\u00e9 India has received a demand of \u20b9 36.36 lakh from the EPFO for the period between 2012 and 2019. The amount includes damages and a penalty of over \u20b9 20 lakh, according to the company's regulatory filing.\n\n\"The company has received an order from the Regional Office of Employees' Provident Fund Organisation demanding an amount of \u20b9 36,36,548, which includes an amount of \u20b9 20,09,516 on account of damages/penalty for the period of 2012-2019 under PF Code,\" it said.\n\nThe order, received by the company on November 26, 2026, has no material impact on its financials, operations or other activities, the filing added.\n\nUnder Section 7Q of the EPF Act, an employer is liable to pay interest on amounts due under the Act, while Section 14B empowers the EPFO to recover damages in the form of a penalty in cases of default in payment of provident fund contributions and other statutory dues.\n\nNestle India is one of the country's leading food and beverage companies, with brands including Maggi, Nescafe, KitKat, Milkmaid and Everyday in its portfolio.\n\nShares of Nestle India were trading at \u20b9 1,316.90 on BSE during the afternoon, down 0.29 per cent from the previous close.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:56 PM IST", "pub_date_relative": "3h ago"}, {"title": "The Wealthy Barber retirement: David Chilton's final money lessons on saving, debt and investing; what's next for him?", "full_content": "David Chilton, 65, author of The Wealthy Barber, is set to retire at the end of this year, bringing his nearly four-decade career of offering practical personal finance advice to a close.\n\nAs he prepares to step away, Chilton has outlined the money habits he believes can have the greatest impact on people's financial well-being, while highlighting three common mistakes that can undermine their savings.\n\nIn an interview with the Financial Post , Chilton, said his decision to retire was shaped by changing personal priorities, including the arrival of his granddaughter and a desire to spend more time with friends and family.\n\n\"My granddaughter was born and I want to be involved. I've had many friends battle health issues in the last year and I want to spend more time with them, but it also made me realize it could happen to me,\" he said.\n\n\"There are things I want to do while I'm healthy. And, to a smaller degree \u2026 I'd be leaving on a high note.\"\n\nFirst published in 1989, The Wealthy Barber used a fictional barber and his conversations with clients to explain personal finance principles. Chilton followed it with The Wealthy Barber Returns in 2011 and later appeared on CBC's Dragons' Den, hosted a podcast and continued sharing financial advice.\n\nHere are the three money habits Chilton recommends and the mistakes he says people continue to make.\n\nChilton reiterated that saving should be treated as a priority rather than whatever is left after monthly expenses. He recommends automating the process through pre-authorised bank transfers, payroll deductions and investment platforms that move money directly into savings and investment accounts.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:56 PM IST", "pub_date_relative": "3h ago"}, {"title": "SpaceX shares jump over 4% amid tech rally and after Musk says he will expand on Trump Account share donations", "full_content": "SpaceX shares rose 4.83% in Friday's shortened trading session, amid broader Nasdaq gains and after CEO Elon Musk expanded his SpaceX share-donation plan for U.S. children.\n\nOther tech-related stocks, including Micron , Qualcomm , Lumentum and Tesla all gained over 5% on Friday as the sector rebounded from a heavy sell-off earlier this week. SanDisk was Friday's biggest mover as investors rotated back into some AI trade names , surging 15.96%.\n\nMusk posted on X on Thursday, \"I will be donating another share of SpaceX to all kids in America every year.\"\n\nAfter Musk's post, SpaceX shares jumped more than 7% in overnight trading on Blue Ocean ATS, an alternative trading system for U.S. equities that runs during the nighttime hours. U.S. stock exchanges were closed Thursday for the Thanksgiving holiday and closed at 1 p.m. ET on Friday.\n\nShares closed 1.30% higher on Wednesday ahead of Thanksgiving.\n\nSpaceX shares year-to-date. The latest pledge follows SpaceX's announcement Wednesday that it would donate one share of its Class A stock to all active Trump Accounts, tax-advantaged investment accounts for American children, with Musk personally matching the gift.\n\nIn a separate post on X, Musk said SpaceX's contribution would be transferred next month, while his personal donation would follow when his lockup period expires in June next year.\n\nNearly 70 million Trump Accounts had been created as of October, according to the White House.", "source": "CNBC World Economy", "pub_date_str": "27 Nov 2026, 11:54 PM IST", "pub_date_relative": "3h ago"}, {"title": "RBI issues new ATM and card rules: What happens to your free withdrawals, extra charges and contactless payments?", "full_content": "The Reserve Bank of India (RBI) has issued new rules for ATM withdrawals and card payments. The rules cover ATM charges, free withdrawals, contactless payments and card safety.\n\nThe new directions were issued on 27 November. They bring several existing rules together and aim to make them easier for banks and customers to follow.\n\nFor customers, the main point is that the number of free ATM transactions has not changed. Banks can still charge up to \u20b9 23 for every transaction after the free monthly limit is used. Taxes may be added to this amount.\n\nThe RBI has kept the existing free ATM withdrawal limits in place. If you use your own bank's ATM, you can make five free transactions every month. This includes cash withdrawals as well as services such as checking your account balance.\n\nIf you use another bank's ATM, the free limit is three transactions per month in metro cities and five in other locations. Once you cross the free limit, your bank can charge you up to \u20b9 23 for every extra transaction , along with applicable taxes.\n\nThe RBI has also asked banks to tell customers how many free ATM transactions they have left. Banks must also inform them about the charges that may apply after the free limit is crossed.\n\nThis will help customers keep track of their ATM use and avoid unexpected charges.\n\nThere is also good news for people whose ATM transactions fail. If a transaction does not go through because of a technical problem or because the ATM has run out of cash, it will not count towards the free transaction limit. Banks cannot charge customers for such failed transactions.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:53 PM IST", "pub_date_relative": "3h ago"}, {"title": "Budget airline Norse Atlantic files for bankruptcy in Europe after failing to secure funding", "full_content": "Budget carrier Norse Atlantic filed for bankruptcy Friday, saying it failed to secure funding after soaring fuel costs strained the company's operations throughout the year.\n\nIts parent company, Norse Atlantic ASA, concluded that the Norwegian carrier no longer has a basis to continue operations.\n\n\"Despite extensive efforts, the Company has so far not been able to secure sufficient funding to meet its short-term liquidity needs,\" the firm said in a statement Friday.\n\nIt comes days after Norse said it's facing a \"critical financial situation\" and was considering its options from a strategic takeover to ACMI contracts, which refer to short-term capacity leasing. The company's shares closed 85% lower on Wednesday.\n\nThe board has now filed a bankruptcy petition with the Agder District Court, where a trustee will be appointed to manage the process further.\n\n\"The Board of Norse Atlantic Airways AS has made the difficult decision to file for bankruptcy despite extensive efforts from the Company and the Group to find a solution,\" Norse Atlantic CEO Eivind Roald said.\n\n\"We are deeply sorry for the impact this has on our passengers, employees and partners. The Board, management and advisers of the listed entity Norse Atlantic ASA and the UK subsidiary are working to find a solution for the remaining part of the business to continue operations,\" Roald added.\n\nThe company has canceled all flights, and ticket sales have been discontinued.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 11:50 PM IST", "pub_date_relative": "3h ago"}, {"title": "Thanksgiving Leftovers? Wall Street Feasts On A 500-Point Dow Rally, Nasdaq Locks AI-Dip Buying", "full_content": "Wall Street extended its recovery on Black Friday as investors bought beaten-down technology and AI stocks. The Dow, S&P 500 and Nasdaq were heading for strong weekly gains.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:50 PM IST", "pub_date_relative": "3h ago"}, {"title": "Stock Market News Nov. 27, 2026: Dow zooms higher, clinches best week since 2022 as stocks rebound in holiday-shortened trade - MarketWatch", "full_content": "Stock Market News Nov. 27, 2026: Dow zooms higher, clinches best week since 2022 as stocks rebound in holiday-shortened trade MarketWatch Dow rallies nearly 600 points to close out best week since 2022: Live updates CNBC U.S. Indexes Moved Upward Friday; Sandisk Led Increases Barron's US Futures Rally as Tech Rebound Gains Momentum: Markets Wrap Bloomberg Stocks Rally at End of a Week of Wild Swings The New York Times", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 11:50 PM IST", "pub_date_relative": "3h ago"}, {"title": "AI and the decryption nightmare", "full_content": "New breakthroughs call for faster upgrades to security, not panic", "source": "FT Markets", "pub_date_str": "27 Nov 2026, 11:48 PM IST", "pub_date_relative": "3h ago"}, {"title": "Can AI crack encryption?", "full_content": "New models\u2019 advancing capabilities raise concerns over the risks of data leaks in banking and commerce", "source": "FT Markets", "pub_date_str": "27 Nov 2026, 11:46 PM IST", "pub_date_relative": "3h ago"}, {"title": "Gold prices rise in India and China after hitting 15-month low as physical demand improves despite global rate concerns", "full_content": "Gold pared gains on Friday after rising more than 3% earlier in the session. This comes as a firm US dollar, rising Treasury yields and a hawkish Federal Reserve outlook kept investors cautious. On the other hand, bullion remained on track and recorded its first weekly gain in three weeks, supported by bargain buying after hitting a 15-month low earlier this week, Reuters reported.\n\nSpot gold rose 1.6% to $3,622.71 per ounce by 11:05 a.m. ET (1605 GMT), after climbing more than 3% earlier in the session, added the news agency. The precious metal was on track for a weekly gain of nearly 2.5%, recovering from losses over the previous two weeks. US gold futures for December delivery gained 2.5% to $3,620.80 per ounce.\n\n\"This recent bounce looks more like short-covering/profit taking than a change in trend. The Fed is still hiking, real yields are high and the dollar is near multi-month highs. Until one of those shifts, rallies toward $3,750\u20133,800 could attract sellers,\" said Zain Vawda, market analyst at Audacity Capital told Reuters.\n\nThe US dollar remained close to its highest level in 22 months, making dollar-priced bullion more expensive for buyers of other currencies. On the other hand, the benchmark 10-year US Treasury yield rose, adding pressure on the non-yielding metal.\n\nGold fell to its lowest level since late August 2025. It was at $3,426.35 per ounce on Wednesday after strong US inflation data boosted expectations that the Federal Reserve would continue to raise interest rates next month and again in early 2027.\n\n\"A return to $5,000 is possible, but not in the first half of the year. Gold needs the Fed to stop hiking and the dollar to roll over. If that happens by mid-2027, a recovery toward $4,500 is realistic,\" Vawda added to the global agency.\n\nHigher interest rates typically tend to reduce gold's appeal by boosting returns on competing interest-bearing assets.\n\nMeanwhile, physical demand for gold has reportedly improved in key Asian markets.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 11:44 PM IST", "pub_date_relative": "3h ago"}, {"title": "Why is RBI moving gold back to India? What Russia's frozen reserves and 1991 crisis reveal", "full_content": "The Reserve Bank of India (RBI) has brought back around 60 tonnes of gold to India during April-September 2026, increasing the share of its gold reserves held domestically to nearly 84%.\n\nWhile the move has drawn attention amid global geopolitical tensions, the central bank has previously clarified that the decision was part of its regular reserve management process.\n\nThe RBI's latest half-yearly report shows that its domestic gold holdings rose to 740.13 metric tonnes at the end of September 2026, compared with 680.05 metric tonnes at the end of March 2026. Its overall gold holdings remained unchanged at 880.52 metric tonnes.\n\nBut why is the RBI bringing back gold, and how does the move relate to global developments and India's economic history?\n\nThe RBI has previously said that bringing gold back to India was a decision linked to its reserve management operations and domestic storage capacity.\n\nAt a press conference in June 2024, then RBI Governor Shaktikanta Das was asked whether the movement of gold was linked to geopolitical tensions and the freezing of Russian reserves.\n\nDas rejected the suggestion, explaining that the RBI had been buying gold as part of its reserve management operations. As a result, its gold holdings overseas had increased. Since India had adequate domestic storage capacity, the central bank decided to move some of the gold back.\n\nThis remains the central bank's stated position. However, the move has taken place at a time when geopolitical uncertainty has raised questions about the safety of financial assets held overseas.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 11:41 PM IST", "pub_date_relative": "3h ago"}, {"title": "Dow rallies nearly 600 points to close out best week since 2022: Live updates", "full_content": "U.S. equities rose on Friday as investors wrapped up a turbulent, holiday-shortened trading week.\n\nThe Dow Jones Industrial Average was higher by 591.99 points, or 1.18%, to close at 50,774.94. The S&P 500 added 1.6% to end the day at 7,297.49, while the Nasdaq Composite advanced 2.31% to 24,129.50. The moves come amid a volatile week during an even more volatile month.\n\nTechnology stocks supported Friday's bounce. \"Magnificent Seven\" members Meta Platforms and Amazon popped more than 3% and about 4%, respectively, while chipmaker Broadcom increased almost 4%. Shares of artificial intelligence lab Anthropic added nearly 11%.\n\nThe major U.S. stock benchmarks posted strong weekly gains. The Dow and S&P 500 were both up more than 5%. The former notched its biggest weekly advance since October 2022, while the latter posted its best week since April 2025. The Nasdaq has surged more than 6%, scoring its largest weekly gain since April.\n\nDow, 5-day The week kicked off with Jensen Huang getting reinstated as CEO at Nvidia , a move that sent the stock up 31% during Monday's session and drove the S&P 500 and Nasdaq to post their best days since April 2025 . The Dow advanced more than 1,400 points, or roughly 3%.\n\nSince then, however, the S&P 500 and Nasdaq have come under pressure as Nvidia and other AI-related stocks have given back some of Monday's gains.\n\nPrior to Huang's departure earlier this month, sentiment toward the AI trade was already downbeat, with investors growing concerned about debt financing , signs of moderation in capital expenditures and Democratic wins in the midterm elections resulting in a slowdown in data center development .\n\nBut Ben Fulton of WEBs Investments believes the fears surrounding AI, except for those regarding debt financing, are \"a bit overblown,\" noting that the \"biggest risk\" is whether AI companies can \"keep funding the growth they need.\" At the same time, he doesn't think investors can \"afford to be out of the AI story.\"", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 11:41 PM IST", "pub_date_relative": "3h ago"}, {"title": "Upcoming IPO: Swara Baby Products\u2019 public offering date, price band, fundraising and other key things to know", "full_content": "Swara Baby Products Ltd, a contract manufacturer of baby diapers, adult diapers and feminine hygiene products backed by FirstCry, is set to launch its \u20b9 800-crore initial public offering (IPO) on December 2. The company has fixed the price band at \u20b9 105-111 per equity share.\n\nThe three-day public issue will close on December 4, while bidding for anchor investors will take place on December 1, according to a public notice issued on Friday.\n\nAt the upper end of the price band, Swara Baby Products is expected to command a market capitalisation of more than \u20b9 3,200 crore.\n\nThe IPO comprises a fresh issue of equity shares worth \u20b9 500 crore and an offer for sale (OFS) aggregating up to \u20b9 300 crore. The company's shares are scheduled to be listed on the stock exchanges on December 9.\n\nThe company plans to use the net proceeds from the fresh issue for several purposes, including establishing a new manufacturing facility in Madhya Pradesh and repaying or prepaying its outstanding borrowings.\n\nA portion of the proceeds will also be invested in its subsidiaries, Solis Hygiene, Swara Hygiene and K.A. Enterprises Hygiene, to facilitate repayment of their outstanding loans.\n\nAdditionally, the company intends to utilise part of the funds for inorganic expansion through acquisitions and for general corporate purposes.\n\nThe proposed manufacturing facility is expected to support the company's production capacity and strengthen its position in the disposable hygiene products market.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 11:39 PM IST", "pub_date_relative": "3h ago"}, {"title": "Direct vs regular mutual funds: SIPs through distributors stay invested longer, but do higher costs eat into returns?", "full_content": "Investors choosing between direct and regular mutual fund plans face a trade-off between lower costs and professional guidance. Direct plans have lower expense ratios because they do not include distributor commissions. Regular plans, meanwhile, offer access to distributors who can help investors select schemes, review portfolios and stay invested during market volatility. A new study suggests that investors using regular plans tend to have longer holding periods, raising the question of whether the additional cost of distributor support is justified.\n\nAccording to the Wealthy\u2013Monitor Deloitte report, The Human Link: Voice of the Mutual Fund Distributor in 2026 , 34.4% of systematic investment plan (SIP) assets in regular mutual fund plans had remained invested for more than five years as of March 2026. In comparison, the corresponding share for direct plans was 19.9%, a difference of 14.5 percentage points.\n\nThe report analysed AMFI\u2013Crisil Factbook 2026 data. Across all mutual fund investments, 23.5% of assets in regular plans had remained invested for more than five years, compared with around 14% in direct plans.\n\nThe difference points to the potential role of distributor guidance in encouraging investors to remain invested. However, longer holding periods do not necessarily mean regular plans generate better returns.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:29 PM IST", "pub_date_relative": "4h ago"}, {"title": "Deepam Row: Supreme Court Issues Contempt Notices To 15 Tamil Nadu Officials", "full_content": "The temple's Board of Trustees has been suspended, while senior district and police officials have been asked to appear on December 15.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:24 PM IST", "pub_date_relative": "4h ago"}, {"title": "Khushbu Sundar Opposes Fawad Khan's Pakistani Series On Netflix: 'Like India-Pakistan Cricket Match'", "full_content": "Khushbu Sundar says national interests should take precedence over artistic freedom, as FWICE threatens to withdraw workers from Netflix productions over the December 4 release of the Pakistani series.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:22 PM IST", "pub_date_relative": "4h ago"}, {"title": "Black Friday Is Packed With Fake Month-End Deals: Use These Three Tricks To Beat Them", "full_content": "Not every Black Friday discount offers genuine savings. Checking price history, investigating customer reviews and verifying product specifications can help shoppers avoid misleading deals.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:21 PM IST", "pub_date_relative": "4h ago"}, {"title": "Gold, Silver Rates, Nov 27 Highlights: Gold Rebounds From 15-Month Low, Silver Surges Nearly 6%; Check City-Wise Prices", "full_content": "Gold and silver rebound as a weaker US dollar and a recovery in technology stocks lift bullion, even as expectations of Federal Reserve rate hikes persist. Track 22K and 24K gold prices across Mumbai, Delhi, Chennai, Bengaluru and Hyderabad.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:17 PM IST", "pub_date_relative": "4h ago"}], "cfa": [{"title": "Inflation has shoppers hunting for value. That bodes well for Black Friday", "full_content": "Economic headwinds have made consumers more cautious \u2014 but new data and reports from retailers are painting a picture of robust holiday spending through Black Friday and beyond.\n\nThe macroeconomic environment has squeezed wallets. High inflation, fluctuating gas prices and labor uncertainty have dampened consumer sentiment and contributed to a pullback in spending. October's consumer price index rose a seasonally adjusted 0.4%, coming in higher than expected, while the personal consumption expenditures price index accelerated to a seasonally adjusted 3.8% in October compared with last year. Meanwhile, October retail sales grew at their slowest pace in nearly a year, according to the CNBC/NRF Retail Monitor.\n\nThe Conference Board's Consumer Confidence Index slid to its lowest since 2014 in September, with respondents citing concerns about inflation and the job market. It's translated into caution from some retailers like Walmart and Lowe's , which have reported slower sales, smaller baskets and drops in big-ticket and discretionary purchases.\n\nDespite that pullback, recent earnings reports and end-of-year forecasts suggest consumers are still willing to shell out for the holidays.\n\nPlanned spending on gifts and nongifts is estimated to be $1,049 on average this year, up 5.9% from $990 last year, according to The Conference Board. Adjusting for inflation, that figure is still up 3.2% year over year.\n\nHoliday sales are expected to top $1 trillion this year, but that growth is boosted by inflation. Though consumers have said they're willing to spend, experts have noted that shoppers are still emphasizing value and looking for deals where they can.", "source": "CNBC Top News", "pub_date_str": "28 Nov 2026, 03:30 AM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Economics", "Financial Statement Analysis"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "enCore Energy receives Nasdaq notice for minimum bid price non-compliance", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 03:11 AM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "IPST faces Nasdaq delisting risk over missing quarterly report", "full_content": "", "source": "Investing.com News", "pub_date_str": "28 Nov 2026, 03:06 AM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Dollar Rises Toward Best Monthly Streak Since 2024 on AI Risk", "full_content": "(Bloomberg) -- The dollar climbed toward its longest monthly winning streak in two years as a rupture in the artificial intelligence trade and rising interest rates spur demand for safe-haven assets.\n\nThe Bloomberg Dollar Spot Index edged up on Friday and is 1.9% higher in November, putting it on track for a third straight month of gains. The greenback has strengthened against all of its Group-of-10 peers, including the Japanese yen and the Swiss franc.\n\nA slump in technology stocks, coupled with robust economic growth and elevated inflation, propelled the dollar higher over the past three months. The US currency drew support from a flight to safety early Wednesday, when a sharp selloff briefly pushed the Nasdaq 100 into a bear market. This week, the dollar is set to rise 0.2%, extending its longest weekly winning streak since January 2025.\n\n\u201cIt\u2019s a pretty good dollar storm,\u201d said Steven Englander, co-head of FX research and North America macro strategy at Standard Chartered.\n\nMarket repricing for a more hawkish Federal Reserve also supported the dollar this month, according to Sarah Ying, CIBC\u2019s head of FX strategy.\n\nTraders are fully pricing a 25 basis point interest rate hike next month for the Fed, and are betting on the possibility of two additional increases by the middle of next year. Policymakers have been flagging the need for more tightening, with some calling for lifting rates at successive meetings, while others are open to the possibility of raising by more than the usual quarter percentage point in December.\n\nSome Wall Street strategists expect the dollar rally to extend into 2027, pointing to the very AI spending binge that\u2019s making stock markets jittery as a driver of US economic growth and capital flows.", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 02:48 AM IST", "pub_date_relative": "50m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Millions lose access to benefits and pensions services after 'cyber incident' - BBC", "full_content": "Millions lose access to benefits and pensions services after 'cyber incident' BBC UK pensions department hit by 'serious' cyber incident, minister says Reuters DWP \u2018cyber incident\u2019 knocks almost all pensions and benefits systems offline The Guardian UK Pension Agency Takes Systems Offline After Cyber Incident Bloomberg Wave of cyber incidents rattles western economies Financial Times", "source": "Google News Business", "pub_date_str": "28 Nov 2026, 02:12 AM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "US tech stocks rise in latest market swing", "full_content": "All-powerful AI trade has been eclipsed by wild moves in a market struggling to price future earnings", "source": "FT Markets", "pub_date_str": "28 Nov 2026, 01:38 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Canadian dollar holds on to weekly gain as investors bet on December rate hike", "full_content": "TORONTO, - The Canadian dollar remained on track to snap a three-week losing streak against the US dollar on Friday as investors stuck with bets the Bank of Canada would raise interest rates further next month.\n\nThe loonie was trading nearly unchanged at 1.4245 per US dollar, or 70.20 US cents, after moving in a range of 1.4224 to 1.4260.\n\n* For the week, the currency was up 0.7%, after a speech by Bank of Canada Governor Tiff Macklem led to increased expectations for a December rate hike\n\n* \"Comments from Governor Macklem this week underscored the Bank of Canada\u2019s concerns about building inflation pressures across the economy,\" Shaun Osborne and Eric Theoret, strategists at Scotiabank, said in a note\n\n* \"Second round effects will add to inflation persistence and even if somewhat lower oil prices mean that inflation will not rise as much as policymakers had previously expected,\" the strategists said\n\n* Investors see a 77% chance the BoC will raise its benchmark rate by 25 basis points to 2.75% next month after the central bank tightened in October for the first time in three years\n\n* Canadian third-quarter GDP data, due on Monday, could guide rate hike expectations. Economists expect growth to slow to an annualized pace of 1.5% from 3.3% in the second quarter\n\n* The price of oil, one of Canada's major exports, pulled back from an earlier 10-day high. US crude oil futures were trading 0.8% lower $83 a barrel, while the US dollar notched gains against a basket of major currencies", "source": "LiveMint Markets", "pub_date_str": "28 Nov 2026, 12:48 AM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "ET India Ascends: Tiny shops, big dreams \u2014 unlocking the true potential of India's MSMEs", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a ET India Ascends: Tiny shops, big dreams \u2014 unlocking the true potential of India's MSMEs The Economic Times daily newspaper is available online now. Read Today's Paper ET India Ascends: Tiny shops, big dreams \u2014 unlocking the true potential of India's MSMEs SECTIONS ET India Ascends: Tiny shops, big dreams \u2014 unlocking the true potential of India's MSMEs By Ram Singh , ET CONTRIBUTORS Last Updated: Nov 28, 2026, 12:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis India's unincorporated MSME sector is witnessing faster productivity growth and narrowing regional disparities, with manufacturing recording the biggest gains, according to four rounds of ASUSE data. However, technology constraints, credit shortages, inadequate industrial workspaces and skill gaps continue to limit growth, calling for targeted policy interventions to help smaller businesses scale up.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nKYC and KYB: Zydus Lifesciences \u2013 From sales to profit, how Zydus earns. Part 2 of 3\n\nHow rare is Nvidia's CEO comeback, really? The record for 20 years has an answer\n\ s , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 12:13 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The warnings behind this week\u2019s stock-market rally", "full_content": "Also in Weekend Reads: Important tips for Medicare enrollment, how to spot online shopping scams and marital advice from The Moneyist.", "source": "MarketWatch Top Stories", "pub_date_str": "28 Nov 2026, 12:10 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold pares gains as Fed-hike risks linger, eyes first weekly rise in three weeks", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Commodities \u203a Gold pares gains as Fed-hike risks linger, eyes first weekly rise in three weeks The Economic Times daily newspaper is available online now. Read Today's Paper Gold pares gains as Fed-hike risks linger, eyes first weekly rise in three weeks SECTIONS Gold pares gains as Fed-hike risks linger, eyes first weekly rise in three weeks Reuters Last Updated: Nov 28, 2026, 12:09:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Gold prices have recently experienced a modest uptick after bottoming out at a 15-month low. Despite the robustness of the US dollar, surging Treasury yields are making investors wary. Following two weeks of declines, gold is now positioned for a weekly gain close to 2.5%. There has been a notable rise in physical gold demand, notably in India and China.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "28 Nov 2026, 12:09 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Axis Mutual Fund launches Nifty LargeMidcap 250 Index Fund; NFO open until December 11", "full_content": "Axis Mutual Fund has launched the Axis Nifty LargeMidcap 250 Index Fund, an open-ended equity index scheme designed to replicate and track the Nifty LargeMidcap 250 Index. The New Fund Offer (NFO) opened for subscription on November 27, 2026, and will remain open until December 11, 2026.\n\nThe scheme will reopen for regular subscriptions and redemptions within five business days of the allotment date. It aims to generate returns in line with the Nifty LargeMidcap 250 Total Return Index (TRI), subject to tracking error.\n\nThe fund will follow a passive investment strategy, investing in stocks in the same proportion and weightage as their representation in the underlying benchmark.\n\nAccording to the scheme information document (SID), the fund will invest 95-100% of its total assets in securities forming part of the Nifty LargeMidcap 250 Index.\n\nThe remaining 0-5% may be allocated to money market instruments and units of debt and liquid mutual fund schemes.\n\nThe scheme can also invest up to 15% of its net assets in equity derivatives of index constituents for portfolio rebalancing and when the underlying securities are unavailable.\n\nTo meet liquidity requirements, the fund may invest in liquid assets, short-term deposits with scheduled commercial banks, government securities, treasury bills and cash equivalents. It can also invest in repos on government securities with residual maturities of less than 91 days.\n\nAs a passive fund, its primary objective will be to minimise tracking error by replicating changes in index constituents and their respective weights while managing investor subscriptions and redemptions.", "source": "LiveMint Money", "pub_date_str": "28 Nov 2026, 12:08 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stocks snap from a $6 trillion washout to a $3.5 trillion surge as Nvidia, Micron, and SpaceX bounce back - Yahoo Finance", "full_content": "Stocks snap from a $6 trillion washout to a $3.5 trillion surge as Nvidia, Micron, and SpaceX bounce back Yahoo Finance The warnings behind this week\u2019s stock-market rally MarketWatch U.S. Stocks Mixed as Huang Relief Rally Fades WSJ Is This the Bottom? It May Not Matter. Here's Why! The Motley Fool What's Next For Nvidia Stock - Wall Street Weighs Benzinga", "source": "Google News Business", "pub_date_str": "28 Nov 2026, 12:02 AM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Nestl\u00e9 India receives \u20b936.36 lakh EPFO notice, including damages and penalty of over \u20b920 lakh", "full_content": "FMCG major Nestl\u00e9 India said on Friday that it has received a demand of \u20b9 36.36 lakh from the Employees' Provident Fund Organisation (EPFO), including damages and a penalty of over \u20b9 20 lakh, for the period from 2012 to 2019.\n\nThe demand was issued by the EPFO's Regional Office in Mysuru under Sections 7Q and 14B of the Employees' Provident Funds and Miscellaneous Provisions Act, 1952, the company said in a regulatory filing.\n\nNestl\u00e9 India has received a demand of \u20b9 36.36 lakh from the EPFO for the period between 2012 and 2019. The amount includes damages and a penalty of over \u20b9 20 lakh, according to the company's regulatory filing.\n\n\"The company has received an order from the Regional Office of Employees' Provident Fund Organisation demanding an amount of \u20b9 36,36,548, which includes an amount of \u20b9 20,09,516 on account of damages/penalty for the period of 2012-2019 under PF Code,\" it said.\n\nThe order, received by the company on November 26, 2026, has no material impact on its financials, operations or other activities, the filing added.\n\nUnder Section 7Q of the EPF Act, an employer is liable to pay interest on amounts due under the Act, while Section 14B empowers the EPFO to recover damages in the form of a penalty in cases of default in payment of provident fund contributions and other statutory dues.\n\nNestle India is one of the country's leading food and beverage companies, with brands including Maggi, Nescafe, KitKat, Milkmaid and Everyday in its portfolio.\n\nShares of Nestle India were trading at \u20b9 1,316.90 on BSE during the afternoon, down 0.29 per cent from the previous close.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:56 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The Wealthy Barber retirement: David Chilton's final money lessons on saving, debt and investing; what's next for him?", "full_content": "David Chilton, 65, author of The Wealthy Barber, is set to retire at the end of this year, bringing his nearly four-decade career of offering practical personal finance advice to a close.\n\nAs he prepares to step away, Chilton has outlined the money habits he believes can have the greatest impact on people's financial well-being, while highlighting three common mistakes that can undermine their savings.\n\nIn an interview with the Financial Post , Chilton, said his decision to retire was shaped by changing personal priorities, including the arrival of his granddaughter and a desire to spend more time with friends and family.\n\n\"My granddaughter was born and I want to be involved. I've had many friends battle health issues in the last year and I want to spend more time with them, but it also made me realize it could happen to me,\" he said.\n\n\"There are things I want to do while I'm healthy. And, to a smaller degree \u2026 I'd be leaving on a high note.\"\n\nFirst published in 1989, The Wealthy Barber used a fictional barber and his conversations with clients to explain personal finance principles. Chilton followed it with The Wealthy Barber Returns in 2011 and later appeared on CBC's Dragons' Den, hosted a podcast and continued sharing financial advice.\n\nHere are the three money habits Chilton recommends and the mistakes he says people continue to make.\n\nChilton reiterated that saving should be treated as a priority rather than whatever is left after monthly expenses. He recommends automating the process through pre-authorised bank transfers, payroll deductions and investment platforms that move money directly into savings and investment accounts.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:56 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "SpaceX shares jump over 4% amid tech rally and after Musk says he will expand on Trump Account share donations", "full_content": "SpaceX shares rose 4.83% in Friday's shortened trading session, amid broader Nasdaq gains and after CEO Elon Musk expanded his SpaceX share-donation plan for U.S. children.\n\nOther tech-related stocks, including Micron , Qualcomm , Lumentum and Tesla all gained over 5% on Friday as the sector rebounded from a heavy sell-off earlier this week. SanDisk was Friday's biggest mover as investors rotated back into some AI trade names , surging 15.96%.\n\nMusk posted on X on Thursday, \"I will be donating another share of SpaceX to all kids in America every year.\"\n\nAfter Musk's post, SpaceX shares jumped more than 7% in overnight trading on Blue Ocean ATS, an alternative trading system for U.S. equities that runs during the nighttime hours. U.S. stock exchanges were closed Thursday for the Thanksgiving holiday and closed at 1 p.m. ET on Friday.\n\nShares closed 1.30% higher on Wednesday ahead of Thanksgiving.\n\nSpaceX shares year-to-date. The latest pledge follows SpaceX's announcement Wednesday that it would donate one share of its Class A stock to all active Trump Accounts, tax-advantaged investment accounts for American children, with Musk personally matching the gift.\n\nIn a separate post on X, Musk said SpaceX's contribution would be transferred next month, while his personal donation would follow when his lockup period expires in June next year.\n\nNearly 70 million Trump Accounts had been created as of October, according to the White House.", "source": "CNBC World Economy", "pub_date_str": "27 Nov 2026, 11:54 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Budget airline Norse Atlantic files for bankruptcy in Europe after failing to secure funding", "full_content": "Budget carrier Norse Atlantic filed for bankruptcy Friday, saying it failed to secure funding after soaring fuel costs strained the company's operations throughout the year.\n\nIts parent company, Norse Atlantic ASA, concluded that the Norwegian carrier no longer has a basis to continue operations.\n\n\"Despite extensive efforts, the Company has so far not been able to secure sufficient funding to meet its short-term liquidity needs,\" the firm said in a statement Friday.\n\nIt comes days after Norse said it's facing a \"critical financial situation\" and was considering its options from a strategic takeover to ACMI contracts, which refer to short-term capacity leasing. The company's shares closed 85% lower on Wednesday.\n\nThe board has now filed a bankruptcy petition with the Agder District Court, where a trustee will be appointed to manage the process further.\n\n\"The Board of Norse Atlantic Airways AS has made the difficult decision to file for bankruptcy despite extensive efforts from the Company and the Group to find a solution,\" Norse Atlantic CEO Eivind Roald said.\n\n\"We are deeply sorry for the impact this has on our passengers, employees and partners. The Board, management and advisers of the listed entity Norse Atlantic ASA and the UK subsidiary are working to find a solution for the remaining part of the business to continue operations,\" Roald added.\n\nThe company has canceled all flights, and ticket sales have been discontinued.", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 11:50 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers", "Derivatives"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Thanksgiving Leftovers? Wall Street Feasts On A 500-Point Dow Rally, Nasdaq Locks AI-Dip Buying", "full_content": "Wall Street extended its recovery on Black Friday as investors bought beaten-down technology and AI stocks. The Dow, S&P 500 and Nasdaq were heading for strong weekly gains.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:50 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Stock Market News Nov. 27, 2026: Dow zooms higher, clinches best week since 2022 as stocks rebound in holiday-shortened trade - MarketWatch", "full_content": "Stock Market News Nov. 27, 2026: Dow zooms higher, clinches best week since 2022 as stocks rebound in holiday-shortened trade MarketWatch Dow rallies nearly 600 points to close out best week since 2022: Live updates CNBC U.S. Indexes Moved Upward Friday; Sandisk Led Increases Barron's US Futures Rally as Tech Rebound Gains Momentum: Markets Wrap Bloomberg Stocks Rally at End of a Week of Wild Swings The New York Times", "source": "Google News Business", "pub_date_str": "27 Nov 2026, 11:50 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments", "Derivatives"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Gold prices rise in India and China after hitting 15-month low as physical demand improves despite global rate concerns", "full_content": "Gold pared gains on Friday after rising more than 3% earlier in the session. This comes as a firm US dollar, rising Treasury yields and a hawkish Federal Reserve outlook kept investors cautious. On the other hand, bullion remained on track and recorded its first weekly gain in three weeks, supported by bargain buying after hitting a 15-month low earlier this week, Reuters reported.\n\nSpot gold rose 1.6% to $3,622.71 per ounce by 11:05 a.m. ET (1605 GMT), after climbing more than 3% earlier in the session, added the news agency. The precious metal was on track for a weekly gain of nearly 2.5%, recovering from losses over the previous two weeks. US gold futures for December delivery gained 2.5% to $3,620.80 per ounce.\n\n\"This recent bounce looks more like short-covering/profit taking than a change in trend. The Fed is still hiking, real yields are high and the dollar is near multi-month highs. Until one of those shifts, rallies toward $3,750\u20133,800 could attract sellers,\" said Zain Vawda, market analyst at Audacity Capital told Reuters.\n\nThe US dollar remained close to its highest level in 22 months, making dollar-priced bullion more expensive for buyers of other currencies. On the other hand, the benchmark 10-year US Treasury yield rose, adding pressure on the non-yielding metal.\n\nGold fell to its lowest level since late August 2025. It was at $3,426.35 per ounce on Wednesday after strong US inflation data boosted expectations that the Federal Reserve would continue to raise interest rates next month and again in early 2027.\n\n\"A return to $5,000 is possible, but not in the first half of the year. Gold needs the Fed to stop hiking and the dollar to roll over. If that happens by mid-2027, a recovery toward $4,500 is realistic,\" Vawda added to the global agency.\n\nHigher interest rates typically tend to reduce gold's appeal by boosting returns on competing interest-bearing assets.\n\nMeanwhile, physical demand for gold has reportedly improved in key Asian markets.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 11:44 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why is RBI moving gold back to India? What Russia's frozen reserves and 1991 crisis reveal", "full_content": "The Reserve Bank of India (RBI) has brought back around 60 tonnes of gold to India during April-September 2026, increasing the share of its gold reserves held domestically to nearly 84%.\n\nWhile the move has drawn attention amid global geopolitical tensions, the central bank has previously clarified that the decision was part of its regular reserve management process.\n\nThe RBI's latest half-yearly report shows that its domestic gold holdings rose to 740.13 metric tonnes at the end of September 2026, compared with 680.05 metric tonnes at the end of March 2026. Its overall gold holdings remained unchanged at 880.52 metric tonnes.\n\nBut why is the RBI bringing back gold, and how does the move relate to global developments and India's economic history?\n\nThe RBI has previously said that bringing gold back to India was a decision linked to its reserve management operations and domestic storage capacity.\n\nAt a press conference in June 2024, then RBI Governor Shaktikanta Das was asked whether the movement of gold was linked to geopolitical tensions and the freezing of Russian reserves.\n\nDas rejected the suggestion, explaining that the RBI had been buying gold as part of its reserve management operations. As a result, its gold holdings overseas had increased. Since India had adequate domestic storage capacity, the central bank decided to move some of the gold back.\n\nThis remains the central bank's stated position. However, the move has taken place at a time when geopolitical uncertainty has raised questions about the safety of financial assets held overseas.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 11:41 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Alternative Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Dow rallies nearly 600 points to close out best week since 2022: Live updates", "full_content": "U.S. equities rose on Friday as investors wrapped up a turbulent, holiday-shortened trading week.\n\nThe Dow Jones Industrial Average was higher by 591.99 points, or 1.18%, to close at 50,774.94. The S&P 500 added 1.6% to end the day at 7,297.49, while the Nasdaq Composite advanced 2.31% to 24,129.50. The moves come amid a volatile week during an even more volatile month.\n\nTechnology stocks supported Friday's bounce. \"Magnificent Seven\" members Meta Platforms and Amazon popped more than 3% and about 4%, respectively, while chipmaker Broadcom increased almost 4%. Shares of artificial intelligence lab Anthropic added nearly 11%.\n\nThe major U.S. stock benchmarks posted strong weekly gains. The Dow and S&P 500 were both up more than 5%. The former notched its biggest weekly advance since October 2022, while the latter posted its best week since April 2025. The Nasdaq has surged more than 6%, scoring its largest weekly gain since April.\n\nDow, 5-day The week kicked off with Jensen Huang getting reinstated as CEO at Nvidia , a move that sent the stock up 31% during Monday's session and drove the S&P 500 and Nasdaq to post their best days since April 2025 . The Dow advanced more than 1,400 points, or roughly 3%.\n\nSince then, however, the S&P 500 and Nasdaq have come under pressure as Nvidia and other AI-related stocks have given back some of Monday's gains.\n\nPrior to Huang's departure earlier this month, sentiment toward the AI trade was already downbeat, with investors growing concerned about debt financing , signs of moderation in capital expenditures and Democratic wins in the midterm elections resulting in a slowdown in data center development .\n\nBut Ben Fulton of WEBs Investments believes the fears surrounding AI, except for those regarding debt financing, are \"a bit overblown,\" noting that the \"biggest risk\" is whether AI companies can \"keep funding the growth they need.\" At the same time, he doesn't think investors can \"afford to be out of the AI story.\"", "source": "CNBC Top News", "pub_date_str": "27 Nov 2026, 11:41 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Upcoming IPO: Swara Baby Products\u2019 public offering date, price band, fundraising and other key things to know", "full_content": "Swara Baby Products Ltd, a contract manufacturer of baby diapers, adult diapers and feminine hygiene products backed by FirstCry, is set to launch its \u20b9 800-crore initial public offering (IPO) on December 2. The company has fixed the price band at \u20b9 105-111 per equity share.\n\nThe three-day public issue will close on December 4, while bidding for anchor investors will take place on December 1, according to a public notice issued on Friday.\n\nAt the upper end of the price band, Swara Baby Products is expected to command a market capitalisation of more than \u20b9 3,200 crore.\n\nThe IPO comprises a fresh issue of equity shares worth \u20b9 500 crore and an offer for sale (OFS) aggregating up to \u20b9 300 crore. The company's shares are scheduled to be listed on the stock exchanges on December 9.\n\nThe company plans to use the net proceeds from the fresh issue for several purposes, including establishing a new manufacturing facility in Madhya Pradesh and repaying or prepaying its outstanding borrowings.\n\nA portion of the proceeds will also be invested in its subsidiaries, Solis Hygiene, Swara Hygiene and K.A. Enterprises Hygiene, to facilitate repayment of their outstanding loans.\n\nAdditionally, the company intends to utilise part of the funds for inorganic expansion through acquisitions and for general corporate purposes.\n\nThe proposed manufacturing facility is expected to support the company's production capacity and strengthen its position in the disposable hygiene products market.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 11:39 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Direct vs regular mutual funds: SIPs through distributors stay invested longer, but do higher costs eat into returns?", "full_content": "Investors choosing between direct and regular mutual fund plans face a trade-off between lower costs and professional guidance. Direct plans have lower expense ratios because they do not include distributor commissions. Regular plans, meanwhile, offer access to distributors who can help investors select schemes, review portfolios and stay invested during market volatility. A new study suggests that investors using regular plans tend to have longer holding periods, raising the question of whether the additional cost of distributor support is justified.\n\nAccording to the Wealthy\u2013Monitor Deloitte report, The Human Link: Voice of the Mutual Fund Distributor in 2026 , 34.4% of systematic investment plan (SIP) assets in regular mutual fund plans had remained invested for more than five years as of March 2026. In comparison, the corresponding share for direct plans was 19.9%, a difference of 14.5 percentage points.\n\nThe report analysed AMFI\u2013Crisil Factbook 2026 data. Across all mutual fund investments, 23.5% of assets in regular plans had remained invested for more than five years, compared with around 14% in direct plans.\n\nThe difference points to the potential role of distributor guidance in encouraging investors to remain invested. However, longer holding periods do not necessarily mean regular plans generate better returns.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:29 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Gold, Silver Rates, Nov 27 Highlights: Gold Rebounds From 15-Month Low, Silver Surges Nearly 6%; Check City-Wise Prices", "full_content": "Gold and silver rebound as a weaker US dollar and a recovery in technology stocks lift bullion, even as expectations of Federal Reserve rate hikes persist. Track 22K and 24K gold prices across Mumbai, Delhi, Chennai, Bengaluru and Hyderabad.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:17 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Black Friday\u2019s AI Paradox? Retailers Fight Cyber Threats: Amazon Takes Charge To Block Them", "full_content": "AI shopping agents are gaining popularity this Black Friday, but retailers are restricting their access over fraud and cybersecurity concerns. Amazon has taken a particularly firm stance.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:17 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "India's micro entrepreneurs borrow \u20b929.6 lakh crore; personal business loans grow faster: Report", "full_content": "India's micro business entrepreneur (MBE) credit market reached \u20b9 29.6 lakh crore in outstanding balances as of June 2026, with individuals borrowing for business purposes recording faster credit growth than micro businesses, according to a joint study by TransUnion CIBIL and the National Small Industries Corporation (NSIC).\n\nOutstanding credit balances of individual business borrowers grew at a compound annual growth rate ( CAGR ) of 21% over the three years to June 2026, compared with 12% for micro businesses. The trend highlights entrepreneurs' increasing reliance on individual borrowing to finance business operations and expansion.\n\nThe study, titled Micro Business Entrepreneurs in India: Growth, Transformation & Emerging Opportunities, found that micro business entrepreneurs accounted for nearly half of India's commercial credit portfolio.\n\nOf the \u20b9 29.6 lakh crore in outstanding credit, \u20b9 19.1 lakh crore was held by individuals borrowing for business purposes through business loans, commercial vehicle and commercial equipment loans, and loans against personal property. The remaining \u20b9 10.5 lakh crore was held by micro businesses, defined as entities with credit exposure of up to \u20b9 2 crore.\n\nThe report identified significant scope to expand formal enterprise lending, with approximately 3.9 crore individual business borrowers having never accessed credit in an enterprise capacity despite having established credit histories.\n\nOf the 4.1 crore individuals with active business-purpose loans as of March 2026, around 94%, or 3.9 crore borrowers, had never borrowed as enterprises. Nearly 39 lakh individuals in this group had enquired about enterprise credit but had not subsequently taken a loan in that capacity.\n\nTheir credit profiles indicate potential for lenders to expand enterprise-level financing. Around 63% of these borrowers had a CIBIL Score above 730, while 54% had more than two years of business-credit experience.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:11 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "US Trade Deficit Gap Swells 10.7% As AI Buildout Sparks Historic Import Wave: Here's Why", "full_content": "Record imports of AI-related equipment, coupled with strong domestic demand, widen the goods trade gap despite President Donald Trump's tariff push, raising the prospect of another drag on US economic growth.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 11:05 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "\u20b91.5 crore retirement corpus: How much monthly pension can you withdraw to make it last 20 years?", "full_content": "Building a sizeable retirement corpus is only one part of retirement planning. Equally important is deciding how much money to withdraw every month without exhausting savings during one's lifetime. A withdrawal rate that is significantly higher than the returns generated by the retirement corpus can lead to premature depletion of savings.\n\nFor instance, if you have accumulated a retirement corpus of \u20b9 1.5 crore and want to generate a monthly income of \u20b9 1.5 lakh for the next 20 years, will your savings be sufficient?\n\nThe answer depends on the returns generated by the investment and the amount withdrawn every month. Investors also need to account for inflation, which gradually reduces the purchasing power of a fixed monthly pension.\n\nSince retirement savings are generally meant to provide a regular and relatively stable income, investing the entire corpus in low-risk instruments may be a suitable approach for conservative investors.\n\nHowever, such investments are unlikely to consistently generate annualised returns of 10%, 12% or 15%. Assuming the \u20b9 1.5 crore corpus generates an annualised return of 6%, withdrawing \u20b9 1.5 lakh every month would mean an annual withdrawal rate of approximately 12%.\n\nUnder this scenario, the retirement corpus would last only around 10 years, significantly short of the targeted 20-year retirement period.\n\nEven reducing the monthly withdrawal to \u20b9 1.25 lakh would not solve the problem entirely. At the same assumed return of 6%, the corpus would be exhausted in approximately 14 years.\n\nA lower withdrawal amount can help extend the life of retirement savings.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 11:03 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Rs 12.7 Lakh To Rs 84,508: Bengaluru Woman's Groww Portfolio Crashes Mid-Withdrawal; Court Orders Refund", "full_content": "A Bengaluru consumer commission has directed Groww and an associated firm to refund Rs 11.85 lakh with 6% annual interest after a woman's portfolio value plunged during a redemption attempt.", "source": "NDTV Profit", "pub_date_str": "27 Nov 2026, 10:53 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "EPFO's Nidhi Aapke Nikat 2.0 camps: How to check your nearest venue, services available and documents required", "full_content": "The Employees' Provident Fund Organisation (EPFO) is conducting a Nidhi Aapke Nikat awareness campaign across India. The retirement body urged EPFO members to visit the camp and interact with officials to know more about the EPFO's schemes and benefits, understand services and processes, and get on-the-spot grievance redressal.\n\nIn a post on social media, the EPFO's official account also provided a document listing the various camp sites so that subscribers may find one nearest to their location to visit.\n\nThe EPFO has arranged multiple camps in major cities to manage the expected number of visitors. Seven regional offices are holding separate sessions across Bengaluru, while five camps are being organised under the Mumbai-I zone.\n\nSeveral camps are also being held across Delhi NCR and Chennai.\n\nThe schedule covers locations beyond major cities, including Leh in Ladakh, Pulwama in Jammu and Kashmir, and Port Blair in South Andaman.\n\nNidhi Aapke Nikat is the provident and pension fund body's last-mile monthly outreach programme for members, through which it organises camps across India at the district level.\n\nUnder this initiative, the EPFO will set up help desks for members, including pensioners, offering a range of services such as the submission of Digital Life Certificates (DLCs) and other pensioner-centric assistance.\n\nService kiosks are set up to address on-the-spot grievances for employees, employers, and pensioners, as well as to share relevant information with stakeholders.", "source": "LiveMint Money", "pub_date_str": "27 Nov 2026, 10:49 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Zee Entertainment \u20b9600 crore buyback opens on December 1; what eligible shareholders need to know", "full_content": "Zee Entertainment\u2019s \u20b9600 crore share buyback will run from December 1 to 7 at \u20b991 per share. Eligible shareholders of record on November 25 may tender about one share for every 14 held. Promoters will not participate; bid settlement is scheduled by December 14.", "source": "LiveMint Markets", "pub_date_str": "27 Nov 2026, 10:40 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Gold-silver ratio declines: What drives the drop, why it matters, and what it means for bullion prices", "full_content": "Gold recovers towards $3,700 as silver leads precious metals rally; China imports provide additional support.", "source": "LiveMint Money", "pub_date_str": "27 Nov 20
