full_content": "DoorDash strikes $17 billion deal for US rival Instacart in mega grocery delivery bet Reuters DoorDash is buying Instacart for $17 billion CNN DoorDash to buy Instacart for $17 billion in big consolidation for grocery delivery AP News DoorDash to Buy Rival Instacart in $17 Billion Deal Bloomberg.com UAE diplomat running for UN chief faces questions over her country's support for Sudan rebels 10TV", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 07:09 PM IST", "pub_date_relative": "54m ago"}, {"title": "Euro nudges lower after ECB holds steady, stocks inch up", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Euro nudges lower after ECB holds steady, stocks inch up Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Euro nudges lower after ECB holds steady, stocks inch up SECTIONS Euro nudges lower after ECB holds steady, stocks inch up Reuters Last Updated: Oct 29, 2026, 07:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The European Central Bank maintained interest rates, indicating rising inflation risks tied to increasing energy prices. Following the decision, the euro declined against the dollar and the pound, reaching a low not seen in 18 months. Euro zone bond yields also dropped slightly, while European stocks experienced a modest rise. Central bank President Christine Lagarde announced her early departure, effective February 7.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 07:07 PM IST", "pub_date_relative": "56m ago"}, {"title": "US tech stocks fall after earnings fuel AI spending concerns", "full_content": "Nasdaq 100 opens 1.3% down after Google parent Alphabet and Microsoft report lower than expected capex", "source": "FT Markets", "pub_date_str": "29 Oct 2026, 07:06 PM IST", "pub_date_relative": "57m ago"}, {"title": "US Fed Chair Kevin Warsh to bring major change to FOMC\u2019s 2027 meeting schedule? What does it mean for rate decisions?", "full_content": "Federal Reserve Chair Kevin Warsh has announced a change to the US central bank\u2019s meeting schedule, with the Federal Open Market Committee (FOMC) planning to dedicate one of its eight meetings in 2027 exclusively to discussions on monetary policy strategy, without a vote on interest rates or an accompanying policy statement.\n\nWarsh said the revised schedule would take effect next autumn, with the Fed maintaining eight meetings annually but placing greater emphasis on longer-term strategic discussions alongside its regular interest-rate decisions.\n\nThe change is expected to evolve further in 2028, when Warsh expects two meetings to be dedicated to strategy discussions and the remaining six to monetary policy decisions.\n\n\u201cWe believe eight meetings per year is the right number for the FOMC,\u201d Warsh said, explaining that the revised schedule would allow policymakers to balance their assessment of near-term economic developments with broader discussions on the direction of monetary policy.\n\nHe said that while regular meetings are necessary to assess incoming economic data, the central bank also needs time to examine major policy questions over longer horizons.\n\n\u201cI believe the setting of the meeting schedule and agenda is more than some administrative detail. It's an institutional choice affecting the nature and the quality of our deliberations and ultimately the wisdom of our decisions,\u201d Warsh said.\n\nThe announcement comes as the Fed continues to work towards its 2% inflation target, with questions remaining over whether monetary policy should be tightened further.\n\nAsked why the Fed had not raised interest rates despite limited progress towards its inflation target and a relatively stable labour market, Warsh said price stability could not be judged by a single date on the calendar or an isolated economic data point.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 07:05 PM IST", "pub_date_relative": "58m ago"}, {"title": "US inflation heats up in September; consumer spending rises", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US inflation heats up in September; consumer spending rises Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US inflation heats up in September; consumer spending rises SECTIONS US inflation heats up in September; consumer spending rises Reuters Last Updated: Oct 29, 2026, 07:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In September, the US experienced a notable rise in inflation, driven by surging gasoline prices and other consumer goods. The Personal Consumption Expenditures Price Index climbed to 0.5%, up from 0.3% previously. Despite inflation-adjusted consumer spending remaining flat, it still rose by 0.5%, reflecting a resilient economic activity. The Federal Reserve opted to keep interest rates steady, though considerable inflationary pressures have analysts anticipating a possible rate hike in December.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 07:04 PM IST", "pub_date_relative": "59m ago"}, {"title": "ECB keeps rates unchanged but points to mounting inflation risk", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a ECB keeps rates unchanged but points to mounting inflation risk Powered By The Economic Times daily newspaper is available online now. Read Today's Paper ECB keeps rates unchanged but points to mounting inflation risk SECTIONS ECB keeps rates unchanged but points to mounting inflation risk By Reuters Last Updated: Oct 29, 2026, 07:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The European Central Bank has decided to maintain its current interest rates, signaling concerns over inflation driven by escalating energy costs. Meanwhile, borrowing expenses in France have seen a sharp rise, creating anxiety about the nation\u2019s economic outlook amid political upheaval. ECB President Christine Lagarde's early resignation raises questions about the potential investigation into growing French debt.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 07:02 PM IST", "pub_date_relative": "1h ago"}, {"title": "Microsoft's latest earnings beat the Street. Here's what analysts are saying", "full_content": "Microsoft topped earnings expectations for the three-month period ended Sept. 30. Analysts say the stock still has more room to run amid an AI boom.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 06:56 PM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "20% crash in 2026! This FMCG stock is on track for its biggest annual drop in 22 years. Should investors be worried?", "full_content": "Shares of Hindustan Unilever (HUL) were on track to post their worst annual performance in over two decades, as investors largely stayed away from consumer goods stocks this year amid a challenging sector outlook marked by rising input costs, slowing growth expectations and concerns over consumer demand.\n\nSo far in 2026, the stock has lost nearly 20%, falling to \u20b9 1,858 apiece and dragging the company\u2019s market capitalisation below \u20b9 4.5 lakh crore. The stock last witnessed a comparable annual decline in 2004, when it crashed 30%. Since then, it has recorded a double-digit annual loss only once, in 2024.\n\nReflecting the sustained selling pressure, HUL shares have closed in the red in each of the past five months, with losses widening further in October. The stock briefly touched its lowest level since 2019 earlier this month before witnessing a mild recovery.\n\nThe weakness is not limited to HUL. As many as 12 of the 15 constituents in the Nifty FMCG index, including ITC, Godrej Consumer Products, Dabur India, Colgate-Palmolive, Britannia Industries and Nestl\u00e9 India, have declined by between 20% and 40% in 2026.\n\nMarket participants are increasingly concerned that higher commodity prices, particularly crude oil and palm oil, are squeezing margins across the consumer goods sector. Companies are also facing challenges in passing on the full impact of rising input costs to consumers, adding to concerns over profitability and earnings growth.\n\nThe company delivered a mixed performance in the September quarter, with consolidated revenue growing 15% year-on-year (adjusted for the ice-cream demerger) to \u20b9 18,070 crore. This was higher than Motilal Oswal\u2019s estimate of \u20b9 17,490 crore and marked the highest growth in the past 14 quarters.\n\nDespite the inflationary environment, underlying volume growth stood at 7% year-on-year.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 08:02 PM IST", "pub_date_relative": "1m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Restaurant Brands reports mixed results as Burger King's U.S. turnaround shows signs of success", "full_content": "Restaurant Brands International on Thursday reported mixed quarterly results as Popeyes' struggles offset Burger King's successful U.S. turnaround .\n\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nRestaurant Brands reported third-quarter net income attributable to common shareholders of $542 million, or $1.54 per share, up from $315 million, or 96 cents per share, a year earlier.\n\nExcluding certain noncash items, the company earned $1.10 per share.\n\nAcross all of its restaurants, the company reported same-store sales growth of 3.8%. Restaurant Brands has reported same-store sales growth above 3% for the past five quarters.\n\nBurger King was the top performer, with U.S. same-store sales growth of 8.4%. The burger chain's home market is in the middle of multiyear turnaround, with a focus on improving its food and restaurants.\n\n\"The plans we've put in place over the last several years are working, and we're going to keep executing against them,\" Restaurant Brands Chair Patrick Doyle said on the company's earnings conference call. \"Burger King has delivered over four years of industry outperformance, and now we've seen three consecutive quarters of truly exceptional results.\"\n\nTim Hortons reported same-store sales growth of 1.8% in Canada, its home market. In July, the coffee chain launched a line of matcha drinks, bringing more customers to its locations during the sleepier afternoon hours.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:59 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: Kimco Realty tops Q3 2026 EPS estimates, lifts outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 07:56 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: American Water Works Q3 2026 misses estimates", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 07:56 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lyft stock may move 10% on earnings release next week", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 07:55 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "GoDaddy earnings on deck: AI transition tests margin outlook", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 07:55 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Earnings call transcript: HII beats Q3 2026 estimates as backlog swells", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 07:55 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "ECB keeps rates unchanged; euro and bond yields fall", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 07:55 PM IST", "pub_date_relative": "8m ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Nasdaq slides over 1% as Alphabet results revive AI spending fears", "full_content": "", "source": "Investing.com News", "pub_date_str": "29 Oct 2026, 07:54 PM IST", "pub_date_relative": "9m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "European Central Bank keeps key interest rate on hold at 2.5%", "full_content": "The European Central Bank voted to hold interest rates steady on Thursday, meeting market expectations, despite euro zone inflation rising to a three-year high.\n\nIt keeps the central bank's key rate, the deposit facility, at 2.5% following a 25 basis point hike in September .\n\nIn a statement, the institution's Governing Council said rising energy prices posed upside risks to the inflation outlook and downside risks to growth, but that underlying inflation and wages were so far broadly stable.\n\n\"At this point in time we are not seeing second round effects in addition to what is already included in the projections\" released in September, ECB President Christine Lagarde told CNBC's Annette Weisbach during a press conference.\n\nLagarde identified the main developments since the ECB's last meeting as higher energy costs across oil, petrol, fuel, gas and refining margins, and a sharp rise in long-term financing costs, with the average 10-year sovereign yield up by around 35 basis points.\n\n\"If you combine these two factors \u2014 actually, the Governing Council debated whether a hike was appropriate \u2014 but on the basis of the uncertainty that accumulates and that rises as well, on the basis of underlying inflation that has broadly remained unchanged, the Governing Council unanimously decided that we were well positioned enough at this stage to hold and that a measured approach at this point in time remained appropriate,\" Lagarde said.\n\nHeadline inflation in the euro area hit 3.8% last month , the highest level since September 2023. Energy price inflation reached 18.8% amid continued turbulence in the Middle East.\n\nThe resurgence in energy price pressures following the outbreak of the U.S.-Israeli war with Iran in February saw the ECB hike rates in June for the first time since 2023.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:48 PM IST", "pub_date_relative": "15m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Stock market today: Dow, S&P 500, Nasdaq fall as Alphabet stock sell-off drags on tech, AI jitters return - Yahoo Finance", "full_content": "Stock market today: Dow, S&P 500, Nasdaq fall as Alphabet stock sell-off drags on tech, AI jitters return Yahoo Finance Alphabet heads for a $500 billion drop in market value, the biggest in its history Yahoo Finance A potentially historic drop for Alphabet\u2019s stock drags the U.S. market lower Pittsburgh Post-Gazette Alphabet falls 10% in premarket, putting it on course for its biggest ever post-earnings drop CNBC Stock Market Today: Nasdaq Opens Sharply Lower After Google Earnings Disappoint \u2014 Live Updates WSJ", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 07:47 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Steve Eisman gets more conservative with portfolio as AI trade nears 'tipping point'", "full_content": "Steve Eisman of \"The Big Short\" fame thinks the artificial intelligence trade is near a \"tipping point,\" but he's not ready to outright bet against it yet.\n\n\"I've gotten much more conservative in my own portfolio. We have shorted against the box a whole bunch of our positions, so that our risk is much, much, much lower. But I'm not, like, net short any,\" he told CNBC's \"Squawk Box\" on Thursday.\n\nEisman's primary concern pertains to the frontier algorithm models, which are exploiting a climate of fear around their technologies, he believes, in order to set up a competitive regulatory moat against more cost-efficient products and to obscure some faltering fundamentals. Bigwigs in the tech industry have issued similar warnings .\n\nAnthropic left its latest revenue figures blank in its initial IPO filing, but Eisman believes they will show a significant deceleration from the prior quarter. Other figures in the report point to capital efficiency issue, he said.\n\nThe ratio of revenue-to-equipment-expense was 2.08 in the second quarter and 1.7 in the third, marking a significant change in trajectory, Eisman said, citing an analysis he'd been given.\n\nYet, Eisman said he was scared to make a definitive bet against the AI trade because of how intertwined it is with the market as a whole, calling it \"impossible\" for the technology sector to be siloed away from the broader equity market and the rest of the economy.\n\n\"So much of the market is on the other side, and it's still reading tea leaves. I think we're getting closer. I think the numbers from Google scared people,\" he said.\n\nAlphabet's stock tanked after reporting earnings on Wednesday, following a big pullback in its core advertising business as AI queries supplant internet search across its various products.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:45 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Portfolio Management", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "S&P 500 heads for first loss in four days as Alphabet, Caterpillar crack after earnings: Live updates", "full_content": "Stocks were under pressure Thursday, weighed by the latest batch of corporate earnings as two Dow members drop by more than 10%.\n\nThe Nasdaq Composite shed 1.4%, while the S&P 500 slipped 0.5% and was on pace to snap a three-day winning streak. The Dow Jones Industrial Average lost 296 points, or 0.6%.\n\nAlphabet lost 12% after it missed expectations on adjusted earnings per share and revenue in the third quarter. The Google parent posted negative free cash flow of $9.07 billion. The company kept its full-year capital expenditures forecast at $195 billion to $205 billion.\n\nCaterpillar shares slid 10%. While the industrial giant reported better-than-expected revenue and earnings for the third quarter, sales for its construction industries business came in slightly below estimates.\n\nIn contrast, Microsoft was little changed, even after growth in the software giant's Azure cloud infrastructure business helped it post beats on the top and bottom lines in the fiscal first quarter, per LSEG.\n\nNeoclouds fell as Microsoft's lower-than-expected capital expenditures figure pointed to infrastructure partners taking longer to deliver data center capacity.\n\nThe results come as the artificial intelligence trade is in focus. AI stocks, such as the iShares Semiconductor ETF (SOXX) and the Roundhill Memory ETF (DRAM) , have been through a rough patch for most of October, only to perk up in recent days. However, on Thursday, both funds were lower, with SOXX down more than 2% and DRAM falling more than 3%.\n\nOn Wednesday, the Federal Reserve decided to hold steady on rates , leaving the central bank's benchmark interest rate in a range between 3.75% and 4%. The decision to hold was widely expected as the Federal Open Market Committee issued a quarter-percentage-point hike in September.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:45 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "S&P 500 heads for first loss in four days as Alphabet, Caterpillar crack after earnings: Live updates - CNBC", "full_content": "S&P 500 heads for first loss in four days as Alphabet, Caterpillar crack after earnings: Live updates CNBC See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 07:43 PM IST", "pub_date_relative": "20m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Eli Lilly hikes sales outlook, as CEO says there's room for 'dramatic' obesity market expansion", "full_content": "Eli Lilly on Thursday reported third-quarter earnings and revenue that blew past estimates and hiked its full-year sales outlook, as demand for its blockbuster weight loss drug Zepbound and diabetes treatment Mounjaro soared again.\n\nDespite that strength, sales of its new GLP-1 obesity pill Foundayo, which launched in the U.S. in April, were under Wall Street's expectations for the quarter.\n\nThe pharmaceutical giant now expects 2026 revenue to come in between $91 billion and $92 billion, up from a previous guidance of $85 billion to $87 billion.\n\nLilly projects its full-year adjusted earnings will be between $35 and $36 per share, which compares with a previous outlook of $35.50 to $36.50 per share. The company said it raised the underlying profit guidance by $4.07 per share at the midpoint, but noted that it is offset by $4.57 per share in charges tied to deals in the quarter.\n\nLilly's massive diabetes and obesity windfall \u2013 and market share lead over chief rival Novo \u2013 shows no signs of slowing down, even as the company grapples with lower net prices in the U.S. The pharma giant is converting its massive profits into a dealmaking spree, most recently striking an agreement to buy Merida Biosciences to develop a new class of treatments for serious autoimmune and allergic diseases.\n\nHere's what Eli Lilly reported for the third quarter compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n\nResilient demand for Zepbound and Mounjaro has helped fuel several strong quarters for Lilly despite lower prices for the medications in the U.S., which came after a drug pricing deal struck with the Trump administration last year. In a release, Lilly also pointed to expanded U.S.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:41 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Third-quarter U.S. GDP increases a better-than-expected 3.4% as September inflation accelerates", "full_content": "The pace of price increases stepped up in September, keeping inflation well above the Federal Reserve's target, while the economy grew faster than expected in the third quarter, according to Commerce Department reports Thursday.\n\nThe personal consumption expenditures price index increased a seasonally adjusted 0.5% for the month, putting the annual inflation rate at 3.6%. The monthly increase was the largest since March but in line with the Dow Jones consensus, while the annual rate was 0.1 percentage point below.\n\nExcluding food and energy, the core PCE posted respective readings of 0.3% and 3.1%, in line with the consensus. While the Fed follows both measures closely, officials generally see the core reading as more indicative of longer-term inflation trends.\n\nWhile inflation continued to run ahead of the Fed's 2% target, the Commerce Department also reported that gross domestic product was strong in the third quarter.\n\nGDP increased at a seasonally adjusted annualized pace of 3.4%, better than the 3.1% estimate and well ahead of the 2.2% in the second quarter.\n\nAlso, in September consumer spending proved resilient, climbing 0.5%, a bit below the forecast for a 0.6% gain, while personal income rose 0.2%, compared with the estimate for 0.3%.\n\nThe reports come the day after the Fed voted to hold its benchmark interest rate in a range between 3.75%-4%. Despite elevated inflation readings, central bank officials insist they can afford to evaluate incoming data before deciding on their next move.\n\n\"The period right in front of us is information rich. There is a lot that's happening in the world. My colleagues and I are keen to take notice of it,\" Fed Chairman Kevin Warsh said Wednesday.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:41 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Economics", "Equity Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Google shares crash 13% after $9 billion cash burn sparks AI spending fears", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Google shares crash 13% after $9 billion cash burn sparks AI spending fears Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Google shares crash 13% after $9 billion cash burn sparks AI spending fears SECTIONS Google shares crash 13% after $9 billion cash burn sparks AI spending fears By Akash Podishetti , ETMarkets.com Last Updated: Oct 29, 2026, 07:41:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Alphabet shares crashed 13% as third-quarter earnings missed expectations due to heavy AI spending and slowing search ad growth. Net profit fell 25% to $26.17 billion despite a 25% revenue jump to $127.58 billion. Negative free cash flow of $9.1 billion and surging capital expenditure raised market concerns.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 07:41 PM IST", "pub_date_relative": "22m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Wall Street is betting on a clear midterm result. A contested count could rattle already edgy markets \u2014 and these sectors", "full_content": "Man Group said a prolonged midterm count could wrong-foot options markets pricing in a decisive result.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:35 PM IST", "pub_date_relative": "28m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "ServiceNow\u2019s stock is on track for its worst day ever. Here\u2019s what went wrong.", "full_content": "Shares in the software company were down 24% on Thursday morning as investors digested its third-quarter earnings.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 07:31 PM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Open enrollment is a chance to get this \u2018sneaky-good\u2019 investment account that can be \u2018better than a Roth\u2019", "full_content": "With open enrollment season getting underway , health savings accounts are worth considering for more than just paying medical bills.\n\nThat\u2019s because you can invest the money in an HSA and let it grow for decades, with tax advantages that can make the account an especially powerful way to save for retirement.\n\nHSAs are \"sneaky-good and very underrated\" investment tools, says John Bell, a certified financial planner and founder of Free State Financial Planning. For those who are eligible, he generally puts maxing out an employer-sponsored HSA near the top of his saving priorities, just behind getting the full employer match in a 401(k), and ahead of funding a Roth IRA or taxable brokerage account.\n\nThat said, you shouldn't choose a health plan just to get access to an HSA's investment potential. Whether an HSA-eligible plan makes sense depends first on your healthcare needs and the costs and coverage of the plans available to you, CFPs tell CNBC Make It.\n\nLike the more common flexible spending account, or FSA, an HSA lets you set aside tax-advantaged money for qualified medical expenses, such as doctor visits, prescription drugs and dental care.\n\nOne important distinction is that to contribute to an HSA, you generally must be enrolled in a high-deductible health plan. For 2027, such plans have a minimum deductible \u2014 the amount you pay out of pocket before coverage kicks in \u2014 of $1,750 for individuals and $3,500 for families. FSAs don't have the same insurance requirement and are often offered alongside more traditional copay insurance plans, which tend to come with higher premiums and lower deductibles.\n\nBut HSAs differ from FSAs in a few other important ways. HSAs stay with you if you change jobs, and unlike most FSAs, they don't come with a \"use it or lose it\" rule requiring you to spend money in the account over a certain period.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:30 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Christine Lagarde, Boris Vuj\u010di\u0107: Monetary policy statement", "full_content": "Good afternoon, the Vice-President and I welcome you to our press conference.\n\nThe Governing Council today decided to keep the three key ECB interest rates unchanged. Energy prices have continued to rise, posing upside risks to the inflation outlook and downside risks to the growth outlook. While the full effects of the energy shock are still unfolding, underlying inflation has remained broadly stable so far and wages do not show a material response at this stage. The increased magnitude and duration of the energy shock, as well as the implications for indirect and second-round effects, are likely to drive up inflation and lower growth. Financing conditions have tightened since our last meeting, which is likely to weigh on inflation and growth. We are committed to setting monetary policy to ensure that inflation stabilises at our two per cent target in the medium term.\n\nWe remain well positioned to navigate the current elevated uncertainty. We will follow a data-dependent and meeting-by-meeting approach to determining the appropriate monetary policy stance. In particular, our interest rate decisions will be based on our assessment of the inflation outlook and the risks surrounding it, in light of the incoming economic and financial data, as well as the dynamics of underlying inflation and the strength of monetary policy transmission. We are not pre-committing to a particular rate path.\n\nThe decisions taken today are set out in a press release available on our website.\n\nI will now outline in more detail how we see the economy and inflation developing and will then explain our assessment of financial and monetary conditions.\n\nThe incoming data suggest that the euro area economy continued to expand in the third quarter of the year. Services have recovered, after weakening at the start of the Middle East conflict. Manufacturing, digital services and exports are benefiting from AI-related business investment.", "source": "ECB Press", "pub_date_str": "29 Oct 2026, 07:30 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "AI and data analytics to power next phase of government audits, says CAG", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Policy \u203a AI and data analytics to power next phase of government audits, says CAG The Economic Times daily newspaper is available online now. Read Today's Paper AI and data analytics to power next phase of government audits, says CAG SECTIONS AI and data analytics to power next phase of government audits, says CAG ET Bureau Last Updated: Oct 29, 2026, 07:28:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Comptroller and Auditor General of India aims to enhance audits by adopting advanced technologies, including artificial intelligence and machine learning. This integration will allow for more precise identification of risks and anomalies in public governance. Data-driven audits will improve the overall efficiency and effectiveness of the auditing process. CAG intends to create a technology-enabled, citizen-centric institution, providing timely and reliable government accounts.\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "29 Oct 2026, 07:28 PM IST", "pub_date_relative": "35m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Economy grows at fastest pace in a year, GDP shows \u2014 and shows little sign of slowing", "full_content": "The U.S. economy ripped off its fastest rate of growth in a year, amped up by the boom in artificial intelligence and strong spending by wealthier Americans.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 07:26 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "U.S. GDP Increased 3.4% in Third Quarter - The New York Times", "full_content": "U.S. GDP Increased 3.4% in Third Quarter The New York Times Third-quarter U.S. GDP increases a better-than-expected 3.4% as September inflation accelerates CNBC U.S. economy grows at brisk 3.4% pace in third quarter on strong consumer spending and AI investment Pittsburgh Post-Gazette U.S. economy races ahead with 3.4% growth in third quarter Axios U.S. economy grew at a fast clip this summer, thanks to consumer, business spending The Washington Post", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 07:25 PM IST", "pub_date_relative": "38m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Analysis: Kevin Warsh is keeping Wall Street guessing. It may be his most powerful tool.", "full_content": "The Federal Reserve chairman's press conference Wednesday was sharply different from his early appearances in the job, when he often seemed backed into a corner. He's shown he is willing to let the markets guess where he is going \u2014 at least to a point. And he has started using his authority to reshape the institution.\n\nWarsh was appointed by a president who said cutting interest rates was a litmus test for his choice for Fed chair. When the Federal Open Market Committee opted to hold rates flat in June and July, even with inflation well above the Fed's 2% target, a swarm of commentators questioned the new chairman's credibility. The FOMC's subsequent decision in September to raise rates came with such a hawkish reading of the economy by Warsh that the markets swung sharply in the opposite direction. Investors thought the Fed might be locked into a rate hike this week until a pair of top officials came out and appeared to deliberately temper market expectations.\n\nThis week, Warsh put all that behind him. He disavowed any expectation that the Fed is on a set course: \"If we had a firm conclusion about the conduct of monetary policy, we'd announce it to much fanfare today,\" he said.\n\nBut Warsh also gave a strong signal that his current lean is toward higher rates. \"While overall financial conditions are tighter, I'm unwilling and unable to call them tight,\" he said.\n\nHe was preserving his options while laying the intellectual groundwork for a hike in December, should inflation remain stubborn.\n\nWarsh declined to confirm the widespread assumption in the markets that the officials who had talked down the markets had done so at his direction. Fed insiders have said that the Fed's vice chairs usually coordinate messaging with the chair.\n\n\"To suggest somehow that I am some kind of all-knowing person sending messages out, that's not the committee of the FOMC that I know,\" Warsh said. And yet the market got the message that the Fed wouldn't hike this week.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:21 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics", "Derivatives"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "President of the European Central Bank Christine Lagarde to step down. Here's who is tipped to replace her", "full_content": "European Central Bank President Christine Lagarde will step down on Feb. 7 next year, she announced Thursday, formally kicking off a succession race that will be shaped by political bargaining and France's looming fiscal crisis.\n\nLagarde has led the central bank since July 2019, steering its responses to the Covid-19 pandemic, the Russia-Ukraine war and a series of energy price shocks that sent inflation in the European Union above 11% in 2022 and spurred the end of the post-Financial Crisis era of negative interest rates.\n\nLagarde will depart nearly nine months before her term was due to expire in October 2027, while the process to appoint her successor will begin immediately.\n\nMarket watchers noted that the timing moves her departure before the French presidential election next year, in which polling suggests far-right candidate Marine Le Pen is the frontrunner.\n\nLagarde has repeatedly downplayed any suggestion she intends to run herself. If she did run, Lagarde would face an extremely tight timeframe with the first round vote in April.\n\nAn early exit means the new French president \"will have no role in choosing the next ECB president \u2014 particularly significant given the political and fiscal uncertainty surrounding France,\" Felix Feather, Economist at Aberdeen Investments, said in emailed comments.\n\nLagarde did not specify a reason for the timing of her exit. She will take questions from a press conference shortly, after the ECB announced a hold on interest rates at its October meeting.\n\nSenior ECB figures are already in talks about filling other senior roles, with chief economist Philip Lane and influential executive board member Isabel Schnabel, responsible for market operations, also due to step down next year.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:20 PM IST", "pub_date_relative": "42m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why Microsoft stock isn't getting crushed like Google stock after its earnings report - Yahoo Finance", "full_content": "Why Microsoft stock isn't getting crushed like Google stock after its earnings report Yahoo Finance Microsoft stock jumps 4% as cloud growth drives earnings and revenue beat CNBC Microsoft's cloud growth, cash flow offer respite from AI spending fears Reuters Microsoft\u2019s Profit Jumps 32% Despite Big Increase in Spending The New York Times Microsoft profits soar days after announcing thousands of layoffs BBC", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 07:19 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Lilly raised sales guidance for third time this year as Zepbound sales soar. Its stock is rallying.", "full_content": "The drugmaker continues to dominate the market for prescription weight-loss drugs in the U.S.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 07:19 PM IST", "pub_date_relative": "44m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US trade deal will protect all sensitive Indian interests, says Piyush Goyal", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Foreign Trade \u203a US trade deal will protect all sensitive Indian interests, says Piyush Goyal The Economic Times daily newspaper is available online now. Read Today's Paper US trade deal will protect all sensitive Indian interests, says Piyush Goyal SECTIONS US trade deal will protect all sensitive Indian interests, says Piyush Goyal PTI Last Updated: Oct 29, 2026, 07:17:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Commerce Minister Piyush Goyal said India\u2019s trade deal with the US would protect sensitive interests, including those of farmers, and give the country a competitive advantage. He criticised opposition parties for questioning the agreement before its details were released, while defending India\u2019s trade strategy and its decision to stay out of RCEP.\n\nKYB and KYC: Quick commerce, the Damani premium and what DMart must deliver \u2013 3rd and concluding part\n\nKYC and KYB: Inside Damani\u2019s DMart, the retail chain for the middle class. And stock for the long term? \u2013 Part 2 of 3\n\nWill it be a regulatory nightmare if an exchange lists on its own platform?\n\nKYC and KYB: Inside Damani\u2019s Avenue Supermarts that refuses to charge more \u2013 Part 1 of 3\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "29 Oct 2026, 07:17 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Why Alphabet\u2019s stock could see its worst day ever after the latest results", "full_content": "A doubling of cloud revenue wasn\u2019t enough to appease Wall Street as investors grew more concerned that AI is hurting the company\u2019s ability to make money off search queries.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 07:17 PM IST", "pub_date_relative": "46m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Alphabet falls 13%, putting it on course for its biggest ever post-earnings drop", "full_content": "Alphabet shares were down sharply following the opening bell on Thursday while Microsoft traded largely flat as investors focused on the tech giants' latest spending and free cash flow numbers in their third-quarter earnings.\n\nAlphabet plummeted 13% in early trading while Microsoft was little changed.\n\nIf Alphabet closes more than 9.77% lower on Thursday, it would be its worst post-earnings reaction ever. The company went public in 2004.\n\nMicrosoft reported $45.2 billion in capital expenditures and finance leases during the third quarter, which was 30% higher than a year ago, but below analyst projections of $50.67 billion. Free cash flow fell 27% to $18.63 billion but remained positive.\n\nAlphabet, in contrast, reported negative free cash flow of $9.07 billion for the third quarter, which fell much further than the $2.70 billion analysts expected by analysts. The Google parent maintained its full year capital expenditure guidance of between $195 billion and $205 billion.\n\nThe earnings report comes as investors scrutinize AI spending plans of tech companies and are focusing on the returns on those investments.\n\n\"Microsoft is building out its architecture in a measured way and as such contains fewer surprises,\" Ben Barringer, global head of technology research at Quilter Cheviot, said on Thursday.\n\n\"Alphabet, by contrast, saw its share price hit after hours as a result of a fairly messy set of results and a poorly handled earnings call,\" Barringer added.", "source": "CNBC World Economy", "pub_date_str": "29 Oct 2026, 07:16 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Merck & Co., Inc., Rahway, N.J., USA Announces Third-Quarter 2026 Financial Results; Highlights Multiple Milestones Advancing Broad, Diverse Pipeline - Merck | Home", "full_content": "Merck & Co., Inc., Rahway, N.J., USA Announces Third-Quarter 2026 Financial Results; Highlights Multiple Milestones Advancing Broad, Diverse Pipeline Merck | Home Merck tops quarterly estimates, hikes profit outlook as new Keytruda form shows strength CNBC Merck Revenue Up on Keytruda, Winrevair Growth WSJ Dear Merck Stock Fans, Mark Your Calendars for October 29 Barchart.com Our Q3 2026 financial results Merck | Home", "source": "Google News Business", "pub_date_str": "29 Oct 2026, 07:16 PM IST", "pub_date_relative": "47m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "DoorDash to acquire Instacart for $17 billion", "full_content": "DoorDash will acquire Instacart for about $17 billion, the companies announced Thursday, uniting two delivery giants under one roof.\n\nDoorDash will pay $65 a share in cash and stock, an 11% premium to Instacart's closing price on Wednesday, and about 26% above Instacart's closing price on Oct. 22, the last trading day before reports surfaced of a possible sale.\n\nShares of DoorDash jumped more than 8% in premarket trading following news of the deal, while Instacart traded near the flatline.\n\nThe deal is slated to close at the end of 2027 or early 2028, the companies said. DoorDash expects to retain Instacart's brand, enterprise technology products and app once the deal closes.\n\nDoorDash CEO Tony Xu said in a statement that grocery is \"one of the hardest things to get right online.\" He pointed to difficulties around picking the right inventory and delivering perishable goods to customers' doorsteps without damaging them on the way.\n\n\"Instacart has spent years learning to do that well for grocers, while DoorDash has built a delivery network and technology that local stores rely on every day,\" Xu said. \"Together, we could give stores of every size more of those tools and unlock the potential of grocery delivery.\"\n\nDoorDash reported its third-quarter results alongside the deal announcement. Adjusted earnings per share were $1.06, beating the average analyst estimate of 84 cents per share, according to LSEG. Revenue came in at $4.62 billion, topping LSEG estimates of $4.56 billion.\n\nMarketplace gross order value, which tracks the total dollar value of orders on its platform, grew 36% year over year to $33.9 billion, beating consensus estimates of $33.6 billion. Total orders reached 993 million, up 28% from a year ago.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 07:14 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Flat possession delayed for nearly 10 years? Consumer court orders builder to refund \u20b945 lakh with 9% interest", "full_content": "A Mumbai consumer commission has directed real estate developer Soundlines Eco Homes and its partners to refund \u20b9 45.45 lakh, along with 9% annual interest, to a homebuyer who did not receive possession of his flat in Panvel within the agreed deadline. The total payout, including accrued interest, was reported at \u20b9 86.37 lakh.\n\nThe Additional District Consumer Disputes Redressal Commission, Mumbai Suburban, also ordered the developer and its partners to pay \u20b9 75,000 towards litigation costs and mental agony. It held that a homebuyer cannot be expected to wait indefinitely for possession and that the developer\u2019s failure to meet its contractual commitment amounted to a deficiency in service .\n\nThe case concerns Tapan Visaria, a resident of Mulund, who booked an 876 sq ft carpet-area flat on the third floor of the D-Wing in the Sound Delight residential project at Aashte village in Panvel, Raigad district, in August 2015. The flat was priced at \u20b9 50.52 lakh, and the registered agreement for sale dated 7 August 2015 stipulated possession by 31 December 2016, according to a TOI report.\n\nHowever, the buyer did not receive possession within the promised period. The project\u2019s completion timeline was repeatedly extended, with the Maharashtra Real Estate Regulatory Authority (MahaRERA) website subsequently reflecting a deadline of 30 September 2026.\n\nAccording to the complaint, Visaria paid \u20b9 45.45 lakh towards the flat, besides \u20b9 1.38 lakh in taxes, \u20b9 2.53 lakh in stamp duty and \u20b9 30,000 in registration charges.", "source": "LiveMint Money", "pub_date_str": "29 Oct 2026, 07:14 PM IST", "pub_date_relative": "49m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Avadhut Sathe case: Why ASTA may challenge SEBI order before SAT over \u2018grey areas\u2019 in stock-market education rules", "full_content": "Markets trader Avadhut Sathe, director of Avadhut Sathe Trading Academy Private Limited (ASTAPL), will reportedly challenge the Securities and Exchange Board of India (SEBI) order against him and his academy.\n\nThe move comes days after SEBI directed Sathe and ASTA to refund \u20b9 546.17 crore collected from participants for providing unregistered investment advisory and research analyst services, along with interest of \u20b9 67.87 crore.\n\nWhile the SEBI order found that ASTA had provided unregistered investment advisory and research analyst services, the academy maintained that it operated solely as a financial-market training institution.\n\nThe academy used live market data only towards the end of its courses to explain to students how to apply the concepts they had learnt, and these demonstrations accounted for approximately 3-4% of total programme hours, reported Moneycontrol, citing advocate Vijay Sardana, who represented ASTA in its hearing before SEBI.\n\n\u201cASTA\u2019s position is that it has always operated solely as a training academy. None of its social media handles or channels is monetised. The social media handles were created for continuous learning,\u201d Moneycontrol quoted Sardana as saying.\n\nAvadhut Sathe\u2019s case highlights gaps in the regulatory framework, Sardana argued during the hearing, pointing out that educational activities have not been clearly defined under SEBI\u2019s guidelines.\n\nAccording to the Moneycontrol report, ASTA may challenge the regulator\u2019s order before the Securities Appellate Tribunal (SAT), seeking greater clarity on the rules governing stock market education.\n\nSEBI, on 23 October, directed Avadhut Sathe Trading Academy Private Limited and its founder to refund \u20b9 546.17 crore collected from participants for providing unregistered investment advisory and research analyst services, along with interest of \u20b9 67.87 crore.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 07:12 PM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Equity Investments", "Ethical & Professional Standards"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "ET EXPLAINER: What do the new REIT regulation amendments mean for investors?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets _content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Euro nudges lower after ECB holds steady, stocks inch up Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Euro nudges lower after ECB holds steady, stocks inch up SECTIONS Euro nudges lower after ECB holds steady, stocks inch up Reuters Last Updated: Oct 29, 2026, 07:07:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The European Central Bank maintained interest rates, indicating rising inflation risks tied to increasing energy prices. Following the decision, the euro declined against the dollar and the pound, reaching a low not seen in 18 months. Euro zone bond yields also dropped slightly, while European stocks experienced a modest rise. Central bank President Christine Lagarde announced her early departure, effective February 7.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 07:07 PM IST", "pub_date_relative": "56m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US tech stocks fall after earnings fuel AI spending concerns", "full_content": "Nasdaq 100 opens 1.3% down after Google parent Alphabet and Microsoft report lower than expected capex", "source": "FT Markets", "pub_date_str": "29 Oct 2026, 07:06 PM IST", "pub_date_relative": "57m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "US Fed Chair Kevin Warsh to bring major change to FOMC\u2019s 2027 meeting schedule? What does it mean for rate decisions?", "full_content": "Federal Reserve Chair Kevin Warsh has announced a change to the US central bank\u2019s meeting schedule, with the Federal Open Market Committee (FOMC) planning to dedicate one of its eight meetings in 2027 exclusively to discussions on monetary policy strategy, without a vote on interest rates or an accompanying policy statement.\n\nWarsh said the revised schedule would take effect next autumn, with the Fed maintaining eight meetings annually but placing greater emphasis on longer-term strategic discussions alongside its regular interest-rate decisions.\n\nThe change is expected to evolve further in 2028, when Warsh expects two meetings to be dedicated to strategy discussions and the remaining six to monetary policy decisions.\n\n\u201cWe believe eight meetings per year is the right number for the FOMC,\u201d Warsh said, explaining that the revised schedule would allow policymakers to balance their assessment of near-term economic developments with broader discussions on the direction of monetary policy.\n\nHe said that while regular meetings are necessary to assess incoming economic data, the central bank also needs time to examine major policy questions over longer horizons.\n\n\u201cI believe the setting of the meeting schedule and agenda is more than some administrative detail. It's an institutional choice affecting the nature and the quality of our deliberations and ultimately the wisdom of our decisions,\u201d Warsh said.\n\nThe announcement comes as the Fed continues to work towards its 2% inflation target, with questions remaining over whether monetary policy should be tightened further.\n\nAsked why the Fed had not raised interest rates despite limited progress towards its inflation target and a relatively stable labour market, Warsh said price stability could not be judged by a single date on the calendar or an isolated economic data point.", "source": "LiveMint Markets", "pub_date_str": "29 Oct 2026, 07:05 PM IST", "pub_date_relative": "58m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "US inflation heats up in September; consumer spending rises", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a US inflation heats up in September; consumer spending rises Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US inflation heats up in September; consumer spending rises SECTIONS US inflation heats up in September; consumer spending rises Reuters Last Updated: Oct 29, 2026, 07:04:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis In September, the US experienced a notable rise in inflation, driven by surging gasoline prices and other consumer goods. The Personal Consumption Expenditures Price Index climbed to 0.5%, up from 0.3% previously. Despite inflation-adjusted consumer spending remaining flat, it still rose by 0.5%, reflecting a resilient economic activity. The Federal Reserve opted to keep interest rates steady, though consi  Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Vedanta Power Q2 results: Company swings to profit at Rs 83 crore; revenue rises 38% YoY ICRA Share Price Crisil Share Price CARE Ratings Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Vedanta Power Q2 results: Company swings to profit at Rs 83 crore; revenue rises 38% YoY SECTIONS Vedanta Power Q2 results: Company swings to profit at Rs 83 crore; revenue rises 38% YoY By Kumar Gaurav , ETMarkets.com Last Updated: Oct 29, 2026, 06:48:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Vedanta Power reported a turnaround in Q2 FY27, posting \u20b983 crore profit against a \u20b91,688 crore loss last year. Revenue rose 38% to \u20b92,908 crore, while EBITDA surged 122%, supported by record power sales and improved operations.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 06:48 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "A sinking fund can help you avoid holiday debt. Here are the best ways to start", "full_content": "Holiday shopping can be expensive \u2014 and this year, nearly half of Americans said they expect to borrow money to cover purchases they can't immediately pay for, according to the International Council of Shopping Centers .\n\nThis comes as American household debt nears its highest point on record , according to the New York Federal Reserve Bank. Americans hold $5.195 trillion \u2014 or $38,777 per person across 133.97 million households \u2014 on average.\n\nThere's another way to approach holiday shopping that doesn't involve accruing debt. If you start saving incrementally toward your holiday shopping budget now by creating a sinking fund, you may not need high-interest debt to buy your loved ones' gifts.\n\nCNBC Select outlines what a sinking fund is, why it's useful, the best accounts to use and how to set up your plan for this holiday season.\n\nAre you living paycheck to paycheck, or do you have a financial success you're comfortable sharing with a reporter? Please fill out this quick form .\n\nA sinking fund is a savings account for a large, one-time or irregular expense \u2014 which can be for anything from a European vacation to your Medical Board Exam fee.\n\nIt can be a great way to pay for expenses you might otherwise put on a credit card, which helps you avoid interest charges.\n\nYou can use any deposit account for a sinking fund, but Select recommends high-yield savings accounts. That way, your money won't lose its value to inflation sitting in an account without earning interest.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 06:47 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Motilal Oswal Q2 Results: PAT nearly quadruples to Rs 1,070 crore; revenue up 20%", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a Earnings \u203a Motilal Oswal Q2 Results: PAT nearly quadruples to Rs 1,070 crore; revenue up 20% The Economic Times daily newspaper is available online now. Read Today's Paper Motilal Oswal Q2 Results: PAT nearly quadruples to Rs 1,070 crore; revenue up 20% SECTIONS Motilal Oswal Q2 Results: PAT nearly quadruples to Rs 1,070 crore; revenue up 20% By Akash Podishetti , ETMarkets.com Last Updated: Oct 29, 2026, 06:46:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Motilal Oswal reported a 29% year-on-year rise in operating profit to \u20b9718 crore in Q2 FY27, driven by asset management and wealth management growth. Assets under management expanded, while recurring revenue strengthened earnings visibility and business resilience.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "29 Oct 2026, 06:46 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Brigade Enterprises Q2 Results: Net Profit Rises 19% Even As Revenue Dips; Margin Jumps To 35.5%", "full_content": "Brigade Enterprises's revenue was up by 13.5% to Rs 1,196 crore.", "source": "NDTV Profit", "pub_date_str": "29 Oct 2026, 06:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Monetary policy decisions", "full_content": "The Governing Council today decided to keep the three key ECB interest rates unchanged. Energy prices have continued to rise, posing upside risks to the inflation outlook and downside risks to the growth outlook. While the full effects of the energy shock are still unfolding, underlying inflation has remained broadly stable so far and wages do not show a material response at this stage. The increased magnitude and duration of the energy shock, as well as the implications for indirect and second-round effects, are likely to drive up inflation and lower growth. Financing conditions have tightened since the Governing Council\u2019s last meeting, which is likely to weigh on inflation and growth. The Governing Council is committed to setting monetary policy to ensure that inflation stabilises at its 2% target in the medium term.\n\nThe Governing Council remains well positioned to navigate the current elevated uncertainty. It will follow a data-dependent and meeting-by-meeting approach to determining the appropriate monetary policy stance. In particular, the Governing Council\u2019s interest rate decisions will be based on its assessment of the inflation outlook and the risks surrounding it, in light of the incoming economic and financial data, as well as the dynamics of underlying inflation and the strength of monetary policy transmission. The Governing Council is not pre-committing to a particular rate path.\n\nThe interest rates on the deposit facility, the main refinancing operations and the marginal lending facility will remain unchanged at 2.50%, 2.65% and 2.90% respectively.\n\nThe APP and PEPP portfolios are declining at a measured and predictable pace, as the Eurosystem no longer reinvests the principal payments from maturing securities.\n\nThe Governing Council stands ready to adjust all of its instruments within its mandate to ensure that inflation stabilises at its 2% target in the medium term and to preserve the smooth functioning of monetary policy transmission.", "source": "ECB Press", "pub_date_str": "29 Oct 2026, 06:45 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Thursday", "full_content": "Tech is taking it on the chin.", "source": "CNBC Top News", "pub_date_str": "29 Oct 2026, 06:43 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Consumer spending flattens out after inflation surge", "full_content": "Consumer spending rose sharply in September, but it largely reflected households spending more on gas and transportation after an increase in energy costs.", "source": "MarketWatch Top Stories", "pub_date_str": "29 Oct 2026, 06:31 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}], "updated_at": "29 Oct 2026, 08:03 PM IST", "total_stories": 343};

        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';

        renderAll();

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>

</body>
</html>
