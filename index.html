    const allData = {"general": [{"title": "US Market: 10-year yield surges to 5.31%, highest since 2007", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Market: 10-year yield surges to 5.31%, highest since 2007 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Market: 10-year yield surges to 5.31%, highest since 2007 SECTIONS US Market: 10-year yield surges to 5.31%, highest since 2007 By Anupam Nagar , ETMarkets.com Last Updated: Oct 01, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Treasury yields reached multi-year highs as a historic bond selloff extended into a seventh session. The 10-year yield touched 5.31%, while the 30-year exceeded 5.65%. Persistent inflation, energy costs, strong AI investment and shifting Fed expectations pressured bonds. Falling oil prices offered some relief, but global yields remained elevated.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 12:44 PM IST", "pub_date_relative": "4m ago"}, {"title": "Australian businesses raise prices as card surcharge ban takes effect", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "5m ago"}, {"title": "A pilot brawl, then a rapid descent: passengers recount chaos on flydubai flight", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "6m ago"}, {"title": "UK\u2019s Nest pension picks Wellington in \u00a33.5 billion emerging market active equity shift", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "6m ago"}, {"title": "Hang Seng tests 61.8% Fib support at HKD 24,360: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "6m ago"}, {"title": "Natural Gas tests Fib support at $2.966 after double top: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "6m ago"}, {"title": "Crude Oil WTI squeezed at $91 with bear flag forming: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:41 PM IST", "pub_date_relative": "7m ago"}, {"title": "Bitcoin stuck in $82,800-$85,000 range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:40 PM IST", "pub_date_relative": "7m ago"}, {"title": "Airtel Money sets IPO price at \u00a31.96 per share", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:40 PM IST", "pub_date_relative": "7m ago"}, {"title": "London Gas Oil stuck in choppy range near $1,477: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:40 PM IST", "pub_date_relative": "7m ago"}, {"title": "Brent Oil consolidates at $98.59 in tight range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:40 PM IST", "pub_date_relative": "8m ago"}, {"title": "Stock futures rise as traders eye elevated Treasury yields, brace for jobs report due this week: Live updates", "full_content": "Stock futures were higher early Thursday as Wall Street gears up for the start of a new trading month.\n\nFutures tied to the Dow Jones Industrial Average added 170 points, or 0.33%. S&P 500 futures advanced about 0.56%, and Nasdaq-100 futures gained over 1%.\n\nIn regular trading, the broad-market S&P 500 dropped 0.3%, while the Dow lost more than 440 points, or 0.9%. The Nasdaq Composite outperformed, advancing 0.2% on the day.\n\nSeptember, historically a weak month for stocks, wasn't kind to the S&P 500, which dropped 0.5%. Investors grappled with higher oil prices and a surge in Treasury yields, stoking fears of additional rate hikes. The Dow lost 4.3%, while the Nasdaq outperformed and gained 1.9% in the month.\n\nWednesday also marked the end of the third quarter. The S&P 500 and the Nasdaq each advanced about 2%, while the Dow lost 2.7%.\n\nIn Asia, Japan's Nikkei 225 rose 0.86%, while the Topix declined 0.44%. South Korea's benchmark Kospi was down 0.8%, while the small-cap Kosdaq Index started the trading day flat. Mainland China and Hong Kong markets were closed for a holiday.\n\nInvestors are heading into the new trading month weighing a softer inflation picture against still elevated Treasury yields and uncertainty over the Federal Reserve's next rate decision, which is scheduled for the end of October. They're also looking ahead to a fresh round of earnings reports from companies.\n\n\"While those factors remain headwinds, corporate earnings have continued to show resilience,\" said Tracie McMillion, head of global asset allocation strategy at Wells Fargo Investment Institute. \"The key question is whether that earnings strength can continue as borrowing costs remain elevated.\"", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 12:26 PM IST", "pub_date_relative": "21m ago"}, {"title": "PPF, SCSS, SSY interest rates kept unchanged for Dec quarter: How are small savings rates set, why are they frozen?", "full_content": "The government on Wednesday kept interest rates unchanged across a dozen small savings schemes, including the Public Provident Fund (PPF) and Sukanya Samriddhi Yojana (SSY), for the October-December quarter. The rates have now been kept unchanged for 11 consecutive quarters.\n\nSmall savings schemes consist of government-backed deposit and certificate products which are operated through the post office and designated banks. They provide Indian households with a formal and safe savings avenue, as it comes with sovereign guarantee and tax benefits on select schemes.\n\nDeposits under the PPF and SSY accounts will continue to earn interest rates of 7.1% and 8.2%, respectively, which is credited on an annual basis.\n\nThe Senior Citizen Savings Scheme (SCSS) will offer 8.2%, while the National Savings Certificate (NSC) will continue to earn 7.7%. The interest rate on Kisan Vikas Patra (KVP), which matures in 115 months, remains at 7.5%.\n\nFor other small savings schemes, savings deposits will continue to earn 4%, while one-year, two-year and three-year deposits will offer 6.9%, 7% and 7.1%, respectively. The five-year deposit will earn 7.5%, while the five-year recurring deposit will offer 6.7%. The Monthly Income Account Scheme will continue to carry an interest rate of 7.4%.\n\nSmall savings schemes interest rates for Oct-Dec 2026 quarter\n\nThe Ministry of Finance reviews small savings rates every quarter under the market-linked framework adopted following the 2011 Shyamala Gopinath Committee report, with quarterly resets introduced in 2016.\n\nAccording to the Managing Partner of Singhania & Co. Rohit Jain, each scheme is benchmarked to the average yield on central government securities of comparable maturity during the relevant reference period, with a prescribed spread reflecting tenure and social-policy objectives.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 12:25 PM IST", "pub_date_relative": "23m ago"}, {"title": "Multibagger power stock Transformers & Rectifiers share price jumps 10% after PM-DHARA push - Can the rally continue?", "full_content": "Shares of Transformers & Rectifiers (India) Ltd. ( TARIL ) jumped more than 10% on Thursday, October 1, after the Union Cabinet approved the \u20b9 1.86 lakh crore PM-DHARA Scheme a day earlier. The government's large-scale investment in power transmission infrastructure has brought transformer manufacturers into focus, as the planned expansion of electricity networks could create additional demand for power transformers.\n\nThe PM-DHARA scheme, or PM-Developing Harmonized and Accelerated Renewable-energy Access, is aimed at strengthening intra-state transmission infrastructure and deploying 50 GWh of battery storage to facilitate the evacuation of up to 135 GW of renewable energy. The initiative assumes importance as India works towards its target of 500 GW of renewable energy capacity by 2030.\n\nUnder the scheme, \u20b9 1.36 lakh crore has been earmarked for intra-state transmission infrastructure. The planned investment is expected to support the expansion and modernisation of electricity networks across states, potentially creating opportunities for transmission equipment manufacturers and project developers.\n\nFor transformer makers such as TARIL, increased investment in transmission infrastructure could support demand as utilities expand capacity and upgrade existing networks.\n\nThe stock rose as much as 10.5% to hit an intraday high of \u20b9 298.70 on Thursday. Despite the sharp move, the stock remained below its 52-week high of \u20b9 501.25, recorded in October 2025. Its 52-week low stands at \u20b9 224.30, touched in February 2026.\n\nOn a shorter-term basis, TARIL has declined around 6% in one month and 10% over three months. The stock has fallen more than 40% over the past year.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 12:23 PM IST", "pub_date_relative": "25m ago"}, {"title": "Three equity mutual fund categories have delivered 10%+ returns in 2026 so far, check the top-performing funds", "full_content": "Equity mutual fund returns have been sharply uneven in 2026. While several categories are in negative territory, only three equity mutual fund categories have delivered more than 10% so far this year, based on category-level data as of 30 September.\n\nInternational equity funds lead the list with a 21.21% return, followed by pharma funds at 13.98% and small-cap funds at 10.59%. In contrast, large-cap funds have lost 8.17%, while technology funds have fallen 20.27% during the same period.\n\nThe category-level numbers, however, do not tell the whole story. Returns have varied significantly among individual funds within these categories.\n\nThe 21.21% category return for international equity is striking when compared with most India-focused equity categories. But the bigger story is the dispersion within the category.\n\nNippon India Taiwan Equity Fund has returned 96.64% in 2026 so far. That is more than four times the category-level return. The next funds in the table are much closer to one another, with Edelweiss Emerging Markets Opportunities Equity Offshore at 33.99% and HSBC Global Emerging Markets Fund at 30.54%.\n\nNippon India Japan Equity Fund and Franklin Asian Equity Fund have also delivered more than 25% so far this year.\n\nThe second category to cross the 10% mark is pharma, which returned 13.98% through 30 September.\n\nThe top funds have done considerably better than the category average, here as well. Kotak Healthcare Fund delivered 29.10%, more than twice the category return.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 12:17 PM IST", "pub_date_relative": "30m ago"}, {"title": "100% rally in one year! Multibagger auto stock falls 4% \u2014 should you buy? Experts' rationale, target price", "full_content": "SML Mahindra share price fell over 4% in Thursday's trading session despite the company reported 18% jump in its sales in September. The auto stock opened at \u20b9 6,501 on NSE today, as compared to previous close of \u20b9 6,578 on Wednesday and touched an intraday low of \u20b9 6,300.05 on 1 October.\n\nSML Mahindra said in a regulatory filing that its total sales in September 2026 rose 18% year-on-year to 1,124 units, compared with 950 units in the corresponding month last year.\n\nCargo vehicle sales increased 39% YoY to 516 units in September from 370 units a year earlier. Passenger vehicle sales, meanwhile, rose 5% to 608 units from 580 units during the same period.\n\nFor the April-September 2026 period, the company recorded total sales of 9,340 units, marking a 15% increase from 8,145 units sold in the year-ago period.\n\nIn an another exchange filing, the company further informed that the board will meet on 19 October to consider and approve the financial results for the quarter ending on 30 September, 2026.\n\n\u201cIt is hereby informed that a meeting of Board of Directors of the Company is scheduled to be held on 19th October, 2026 (Monday), inter alia, to consider & approve the Unaudited Financial Results of the Company for second quarter and half year ending on 30th September, 2026 (FY 2026-27),\u201d it said.\n\nSML Mahindra has delivered a strong performance over the medium to long term, despite a recent decline. The stock has fallen 3.56% over the past week, indicating some profit-taking or consolidation after its strong run.\n\nOn a one-month basis, SML Mahindra shares have gained 17.65%, while its year-to-date performance stands at 55.63%. The stock has also more than doubled over the past year giving multibagger returns by rising 102.94%.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 12:07 PM IST", "pub_date_relative": "40m ago"}, {"title": "Hero Motors share price doubles from IPO price, gains 104% | What\u2019s next for investors?", "full_content": "Hero Motors share price jumped nearly 10% on Thursday, 1 October, touching a fresh high of \u20b9 167.45 on the BSE. Hero Motors share price has risen 104% from its IPO price of \u20b9 82. The company's market capitalisation stood at \u20b9 7,564.96 crore so far today.\n\nMeanwhile, the company held its 27th Annual General Meeting (AGM), where shareholders considered and adopted the audited financial statements, including the consolidated financial statements, for the financial year ended 31 March 2026, along with the reports of the Board of Directors and auditors.\n\nThe Chairman stated that the results would be declared upon receipt of the consolidated report from the Scrutinizer, within two working days or three days from the conclusion of the AGM, whichever is earlier.\n\nHero Motors share price was in focus on Wednesday following a bulk deal executed on Monday, 28 September. According to BSE data, Irage Broking Services LLP bought 34,01,332 shares at \u20b9 135.70 apiece, while it sold 12,12,381 shares at \u20b9 134.93 per share.\n\nHero Motors made a muted debut on 23 September, with the stock opening at \u20b9 82.10 on the BSE, down 2.26% from its issue price of \u20b9 84. However, the stock staged a sharp recovery during the session and ended at \u20b9 98.51, marking a 17.27% gain over the issue price.\n\nOn the NSE, the shares opened at \u20b9 82, a 2.38% discount to the issue price, before closing at \u20b9 98.40, up 17.14%.\n\nHero Motors is an automotive technology company engaged in designing, developing, manufacturing and supplying engineered powertrain solutions to automotive original equipment manufacturers (OEMs) across the US, Europe, India and the ASEAN region.\n\nIts customer base includes global companies such as BMW AG, Ducati Motor Holding SPA, Enviolo International Inc, Formula Motorsport Ltd and Hummingbird EV.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 12:06 PM IST", "pub_date_relative": "41m ago"}, {"title": "Highway Infrastructure shares jump 9% after Rs 245 crore toll operations win from UP authority, NHAI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Highway Infrastructure shares jump 9% after Rs 245 crore toll operations win from UP authority, NHAI Highway Infrastructure Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Highway Infrastructure shares jump 9% after Rs 245 crore toll operations win from UP authority, NHAI SECTIONS Highway Infrastructure shares jump 9% after Rs 245 crore toll operations win from UP authority, NHAI By Surbhi Khanna , ET Online Last Updated: Oct 01, 2026, 12:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Highway Infrastructure shares jumped after the company secured toll operations orders worth Rs 254 crore from UPEIDA and NHAI. The key order, worth Rs 220.66 crore, involves toll collection and plaza operations on the Gorakhpur Link Expressway, along with deployment of patrol-cum-safety vehicles.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 12:02 PM IST", "pub_date_relative": "45m ago"}, {"title": "Buying property from an NRI is easier, but don\u2019t make this 12.5% TDS mistake", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBuying a house from a non-resident Indian (NRI) involves more tax compliance than buying one from a resident. One part of that process gets simpler from today.\n\nA resident individual or Hindu undivided family (HUF) buying immovable property from an NRI will no longer need a TAN or tax account number just to deduct tax at source on the transaction. Now, the buyer can use PAN and deposit the tax deducted at source (TDS) through Form 141. The form will have a new Schedule E for such transactions.\n\n\u201cForm 141 is not a new form introduced by this notification. It is a consolidated challan-cum-statement that was introduced under the new Income-Tax Act, 2025, for specific TDS transactions. It is already used for depositing TDS on payments by individuals and HUFs to residents, including TDS on purchase of immovable property from a resident. The recent notification has expanded its scope to also cover TDS under Section 393 (2), where a resident individual or HUF purchases immovable property from a non-resident, with a new Schedule E specifically prescribed for such transactions,\u201d said Neeraj Agarwala, senior partner at Nangia & Co LLP.\n\nWhile this removes an administrative step, it does not dilute the buyer's responsibility for TDS, which is higher when the seller is an NRI .\n\nUntil now, an individual or HUF buying a property from an NRI had to mandatorily get a TAN, which could add a few days to the process. A TAN application can be made online, but allotment typically takes about 2 to 10 days, according to Agarwala.\n\nFrom 1 October, this requirement has gone away. The buyer will have to file Schedule E of Form 141 and deposit the TDS within 30 days from the end of the month in which it was deducted.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:57 AM IST", "pub_date_relative": "51m ago"}, {"title": "$2 billion gone in two days! FIIs accelerate selling as Nifty, Sensex set to fall for 8th week running. Will they make a comeback?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a $2 billion gone in two days! FIIs accelerate selling as Nifty, Sensex set to fall for 8th week running. Will they make a comeback? Motilal Oswal Financial Services Share Price Aditya Birla Capital Share Price L&T Finance Share Price HDB Financial Services Share Price Piramal Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper $2 billion gone in two days! FIIs accelerate selling as Nifty, Sensex set to fall for 8th week running. Will they make a comeback? SECTIONS $2 billion gone in two days! FIIs accelerate selling as Nifty, Sensex set to fall for 8th week running. Will they make a comeback? By Veer Sharma , ETMarkets.com Last Updated: Oct 01, 2026, 11:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign institutional investors pulled out over Rs 20,000 crore from Indian equities in two trading sessions as the Nifty and Sensex head for an eighth straight weekly decline. Elevated crude prices, high US bond yields and rate concerns have weighed on sentiment, while analysts differ on the outlook for foreign inflows.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:55 AM IST", "pub_date_relative": "53m ago"}, {"title": "Can technology fix ICICI Lombard's underwriting equation?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nICICI Lombard General Insurance Co.\u2019s Digital Day meet on 29 September has raised hopes of improving the insurer\u2019s profits from its recent slump. The stock gained 4% the next day (Wednesday).\n\nThe management showcased how technology is moving from a back-office enabler to being integrated across the entire length of its business, from underwriting, risk management and pricing to distribution, claims and servicing.\n\nThe digital share of its servicing has expanded from 20% in FY23 to 47% in FY26, and further to 71% in the June quarter (Q1FY27), aiming for 90% by FY29. Digital servicing costs almost 90% less than manual servicing. The insurer\u2019s share of digital sourcing is also set to expand from 6% to 15%, which, along with the shrinkage in product launch time (6 months versus 4 weeks), can bring in 3-5% of gross written premium from new launches by FY29.\n\nThe digital leap is expected to translate into 100-200 basis points higher growth versus the industry, a sustained 10+ percentage point advantage in combined ratio, and 17-20% return on equity (RoE).\n\nCombined ratio measures underwriting profitability; it is the ratio of claims paid and other operating expenses (including commissions paid out) to premiums earned.\n\nThe timing is important, as its stock has fallen 13% since Q1FY27 earnings after the combined ratio worsened to 107.2%, from 102.9% a year ago. Excluding large fire claims and regulation-driven higher provisions, it would have been 102.3%. A higher combined ratio means lower underwriting profitability, while a ratio above 100% indicates an underwriting loss.\n\nNotably, for FY26, ICICI Lombard\u2019s combined ratio stood at 103.4% versus the industry\u2019s 117.8%.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:48 AM IST", "pub_date_relative": "59m ago"}, {"title": "40% return in 6 months! Adani Energy Solutions share price up 5%, outshines Adani Group stocks- What's fuelling rally?", "full_content": "Shares of Adani Energy Solutions Limited surged during Thursday\u2019s intraday trading session. Outperforming other Adani Group stocks, AESL share price was up nearly 5% in the early trading session. The power stock also saw a sharp spurt in volume by more than 3.53 times today.\n\nThe recent uptick in Adani Energy Solutions share price has come as part of a wider rally in the power stocks post PM-Developing Harmonised and Accelerated Renewable-energy Access (PM-Dhara) scheme launch. The Union Cabinet, on Wednesday, approved \u20b9 1.86 lakh crore PM Dhara scheme.\n\nChaired by Prime Minister Narendra Modi, the Union Cabinet, approved the PM-Dhara scheme to boost India's energy infrastructure reforms. The new scheme will help in strengthening the Intra-State Transmission System and facilitate the evacuation of up to 135 GW of renewable energy across States and Union Territories.\n\nThe \u20b9 1.86 lakh crore scheme will help in providing the deployment of 50 GWh of Battery Energy Storage Systems (BESS) at renewable energy developer or generator ends.\n\nBoosting BESS capacity would help in addressing challenges arising from renewable energy intermittency, transmission congestion and peak-hour curtailment. It will also help in meeting electricity demand during non-solar hours.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:44 AM IST", "pub_date_relative": "1h ago"}, {"title": "September Auto Sales Live Updates: Eicher Motors Report 8% Total Sales Growth; M&M Up 15%", "full_content": "September auto sales data will be released today, highlighting demand trends in passenger vehicles, two-wheelers, commercial vehicles, and tractors during the festive season.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Vivo, OnePlus To Motorola: Upcoming Smartphone Launches In October - Full Details", "full_content": "October is set to bring several new smartphones to the market, with Vivo preparing two India launches and OnePlus getting ready to unveil its next flagship in China. Motorola is also expected to bring its latest Edge series phone to India.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "Stock Market Today Live Updates: Sensex Down 100 Points, Nifty Set For Eighth Straight Weekly Loss; Auto, Cement Top Drags", "full_content": "From pre-market signals to the most buzzing stocks in trade, we bring you all top developments from D-Street to keep you updated throughout the day.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:40 AM IST", "pub_date_relative": "1h ago"}, {"title": "GST Collections Rise 14.7% YoY to Rs 2.04 Lakh Crore In September", "full_content": "GST collections in September rose 14.7% year-on-year (YoY) to Rs 2.04 lakh crore. Net GST revenue rose 18.1% to Rs 1.77 lakh crore, the government data showed.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "Bajaj Auto, Hero MotoCorp, M&M tumble: Nifty Auto falls over 3% to lead sectoral loss \u2014 what\u2019s next for the sector?", "full_content": "Shares of automobile companies came under heavy selling pressure on Thursday, with the Nifty Auto index plunging more than 3% intraday to emerge as the biggest loser among sectoral indices. Weak September sales numbers from key automakers weighed on sentiment, while the government's new fuel-efficiency norms for passenger vehicles added another major development for the sector.\n\nBajaj Auto was the biggest decliner among the major auto stocks, falling 8%. Hero MotoCorp, Mahindra & Mahindra (M&M) and Eicher Motors declined around 4% each. Bosch, Ashok Leyland, Tata Motors Commercial Vehicles and TVS Motor Company also fell around 3% each.\n\nAmong auto ancillaries, Uno Minda, Samvardhana Motherson International and Bharat Forge were down around 3%. Maruti Suzuki and Tata Motors PV slipped around 2% each, while tyre makers Apollo Tyres and MRF also shed around 2%.\n\nBajaj Auto reported a 5% year-on-year increase in total sales to 538,443 units in September 2026, although the figure was below Street expectations. Exports provided the key support, jumping 32% year-on-year to 243,987 units from 185,252 units a year earlier.\n\nHowever, domestic sales declined 9% to 294,456 units from 325,252 units in September 2025.\n\nM&M reported total auto sales of 114,874 vehicles for September, representing 15% growth including exports. Its tractor sales, however, dropped 21% to 52,100 units from 66,111 units in the year-ago month.\n\nM&M attributed the decline in tractor volumes to a shift in the festive season, which begins in October this year compared with September last year. The company also pointed to a higher base in September 2025, when volumes had benefited from the implementation of the GST rate cut. M&M's exports stood at 1,892 units, up 62% year-on-year.\n\nSeptember sales data from Maruti Suzuki, Tata Motors, Ashok Leyland and Hero MotoCorp were not available yet.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:39 AM IST", "pub_date_relative": "1h ago"}, {"title": "LG Electronics Shares May Rally 22%, Says Motilal Oswal; Premiumisation, Exports Key Triggers", "full_content": "The brokerage's positive view on LG Electronics is supported by its diversified product portfolio, strong brand franchise, multiple avenues for sustainable revenue growth and better margin profile vs peers.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "India's Gross GST collection ticks up 14.7% in September to Rs 2.04 lakh crore", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Finance \u203a India's Gross GST collection ticks up 14.7% in September to Rs 2.04 lakh crore The Economic Times daily newspaper is available online now. Read Today's Paper India's Gross GST collection ticks up 14.7% in September to Rs 2.04 lakh crore SECTIONS India's Gross GST collection ticks up 14.7% in September to Rs 2.04 lakh crore ET Online Last Updated: Oct 01, 2026, 11:57:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis The Indian government reported a 14.7% increase in GST collections for September 2023 compared to last year. Maharashtra topped the states with collections reaching Rs 29,986 crore, reflecting a 15% growth. Some states, however, experienced significant declines in GST revenues, with Sikkim's collections dropping 51%. Cumulatively, the gross GST collection for the initial half of the fiscal year stood at Rs 12,46,278 crore.\n\nListen Loading... \u00d7 \u00d7 Subscribe to Unlock AI Briefing and Premium Content\n\nSix months after oil spiked, why are markets reacting so sharply now?\n\nGold paradox: Why India, a refining giant, is not a big bullion exporter\n\nA refinery is not a laptop: Why America's diesel problem can't be switched off\n\nHow Irdai\u2019s big reset can change insurance landscape, customer choice\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action\n\n15 Days Free: Unlock All ETPrime Exclusives, Market Tools & ePapers", "source": "Economic Times Economy", "pub_date_str": "01 Oct 2026, 11:37 AM IST", "pub_date_relative": "1h ago"}, {"title": "LIC Housing Finance Bets On Non-Housing, Project Loans To Fuel Double-Digit Disbursement Push", "full_content": "Institutional brokerage Citi noted that the mortgage financier LIC Housing Finance is orchestrating an operational shift toward high-yielding non-housing assets and project finance alongside an extensive overhaul of internal sales productivity.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:34 AM IST", "pub_date_relative": "1h ago"}, {"title": "Railway Stocks Fall: IRCON, RailTel, IRCTC, RVNL Tank Up To 6% \u2014 Here's Why", "full_content": "Among individual railway stocks, IRCON International tumbled 6.23% to hit an intraday low of Rs 109.75. RailTel slipped 3.37% to an intraday low of Rs 257.30, while Titagarh Rail declined 1.91% to Rs 803 per share.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:33 AM IST", "pub_date_relative": "1h ago"}, {"title": "Avengers: Endgame Encore Box Office Collection Day 6: Film Nears Rs 30 Crore Mark, Check Day-Wise Earnings", "full_content": "The film returned to cinemas on September 25 with the special presentation featuring an exclusive look at the upcoming 'Avengers: Doomsday', which is scheduled to release on December 18.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:30 AM IST", "pub_date_relative": "1h ago"}, {"title": "Vishal Nirmiti Vs Nityas Gems IPO GMP Today: Which Has Higher Listing Gain? Day 2 Details", "full_content": "Both mainboard IPOs opened on September 30 and close October 5. Track GMP, subscription status, allotment date and expected listing price here.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:29 AM IST", "pub_date_relative": "1h ago"}, {"title": "A Tailor-Made Opportunity? India's Apparel Stocks Get A China+1 Boost \u2014 Here's Who Benefits From The Export Win", "full_content": "The combined export share of Bangladesh and Vietnam rose from around 7% to more than 13% in 2025, highlighting the scale of the opportunity India has struggled to capture.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:28 AM IST", "pub_date_relative": "1h ago"}, {"title": "Gandhi Jayanti 2026: Are Banks Open Or Closed Tomorrow On October 2? Check RBI Holiday", "full_content": "Gandhi Jayanti 2026: Banks across India will remain closed on October 2. Check the RBI bank holiday status and whether digital services will work.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "Macquarie stock recommendations: ICICI Bank, SBI, PayTM to LIC \u2014 top 11 financial shares to buy on rerating potential", "full_content": "Macquarie stock recommendations India: Amid poor returns by the key benchmark indices of the Indian stock market, global brokerage Macquarie has predicted a turnaround in investors' fortunes through the banking and financial stocks. The brokerage has predicted a strong FY28 for the banking stocks, expecting a rerating in banking and financial stocks. The Macquarie Equity Research expects banks to deliver strong ~18% FY28E EPS growth driven by a ~15bps rise in margins. Attractive valuations offer further support.\n\nExpecting a strong recovery in the earnings of Indian banks and financial companies, the Macquarie Equity Research said, \u201cWe forecast FY28E EPS growth of ~18% and see significant re-rating potential, given undemanding valuations of 1.3x FY28E P/B and 10x P/E.\u201d\n\nThe global brokerage equity research report says that private banks should deliver strong EPS growth in the next two years as margins improve and operating expenses and credit costs fall.\n\n\u201cWe assume a ~75 bps of rate hikes in the next 9\u201312 months, increasingly likely as the Fed enters a tightening cycle, supporting further margin expansion. Including foreign currency non-resident (FCNR) deposits, we forecast ~15 bps of YoY margin expansion in FY28E. The macroeconomic backdrop remains supportive: post-FCNR mobilisation has eased liquidity constraints, loan demand is robust and broad-based, asset quality remains healthy, and rate increases appear imminent,\u201d the Macquarie report went on to add.\n\nSpeaking on the NBFC business, Macquarie's report said that growth should remain strong, but a rate increase and higher bond yields should raise borrowing costs and pressure near-term margins. Asset quality is another risk, particularly for unsecured MFI and personal loans if inflation persists. However, most NBFCs are well capitalised and adequately provisioned.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:24 AM IST", "pub_date_relative": "1h ago"}, {"title": "Food Safety Crackdown: Licences Of Swiggy Instamart, Flipkart, Zepto Dark Stores Suspended In Telangana", "full_content": "The violations flagged in some establishments included expired and damaged food, pest-infested articles, spoiled vegetables with fungal infestation, unhygienic premises and improper food storage.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:23 AM IST", "pub_date_relative": "1h ago"}, {"title": "Hedge funds are piling into the $30 trillion US Treasury market | What happens if they sell?", "full_content": "Hedge funds are becoming a bigger force in the roughly $30 trillion US Treasury market, raising a new question for investors: what happens if these funds suddenly rush for the exit?\n\nHedge funds held about $2 trillion in cash Treasurys at the end of 2025, nearly three times their level five years earlier, according to the Office of Financial Research, cited by CNBC . That amounted to about 7% of the $28.9 trillion in marketable Treasury debt\u2014a record share.\n\nTheir buying has continued in 2026 too. Domestic hedge funds bought a net $60.6 billion of Treasurys in the second quarter, after $26.4 billion in the first quarter, taking their first-half purchases to about $87 billion.\n\nThe growing presence comes as the Treasury market faces pressure from rising yields. The 10-year yield surged to its highest level since 2007 on Monday, and the 30-year soared to the highest since 2002 on Tuesday.\n\nThe concern is less about hedge funds owning Treasurys and more about how they finance those positions.\n\n\u201cHedge funds have placed huge borrowed bets on US government bonds, mostly through the \u2018basis trade,\u2019 earning money from tiny price gaps between bonds and futures,\u201d said Prathamesh Kadiwal, research analyst at Bonanza Portfolio Ltd.\n\nHe said hedge funds now hold a record share of the market, but a sudden rush to sell could send Treasury prices sharply lower and yields higher. \u201cHedge funds have already unwound over $200 billion in positions as profits vanish,\u201d Kadiwal said, adding that a similar dynamic played out in March 2020 and forced the Federal Reserve to intervene.\n\nThe risk can increase when leveraged funds face margin calls. A fall in Treasury prices can force funds to sell assets to meet those calls, potentially pushing prices down further.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:21 AM IST", "pub_date_relative": "1h ago"}, {"title": "South Korean President Lee pushes back on Alaska LNG project after Trump touts Seoul's participation", "full_content": "South Korea's $200 billion investment into the U.S., which President Donald Trump said would transform America \"for generations,\" is not a done deal in totality.\n\nThe South Korean investment plan includes nuclear power plants, a natural gas power facility in Texas and potentially the long-planned Alaska LNG project.\n\nTrump in a Truth Social post late Wednesday stateside said the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion, drawing a response from South Korea's President Lee Jae Myung, who emphasized that involvement in some of the projects remains subject to commercial considerations.\n\nLee in an X post on Thursday local time said that participation in the Alaska LNG project was dependent on its financial viability and legal compliance. He added that investments in nuclear power plants would also require assessment of commercial viability on a plant-by-plant basis.\n\nTrump had hailed South Korean investments in his post late Wednesday stateside, saying that the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion.\n\nThe joint statement earlier on Wednesday, however, had mentioned that work on the project was contingent on \"commercial reasonableness,\" without highlighting details on allocations toward the project.\n\nThe Alaska LNG project seeks to transport natural gas roughly 1,300 kilometers from fields on Alaska's North Slope to the southern part of the state, where it would be liquefied for export to markets including Asia, reported Yonhap. The project has faced longstanding questions over its economics given the large upfront investment required.\n\nIndustry Minister Kim Jung-kwan had described it as \"high-risk\" last year and said participation would be difficult unless it could generate sufficient cash flow.", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 11:14 AM IST", "pub_date_relative": "1h ago"}, {"title": "FlyDubai Scare: SpiceJet Shares Special Message For 'Hero' Pilot Smit Machchhar Who Once Worked With Airline", "full_content": "In a post on X, the airline said its \"heartfelt prayers and deepest respect\" were with the captain for his \"heroic courage\" aboard flight FZ1073.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:12 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: BOJ policymakers see scope for faster rate hikes as inflation pressure builds", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a Global Market: BOJ policymakers see scope for faster rate hikes as inflation pressure builds Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: BOJ policymakers see scope for faster rate hikes as inflation pressure builds SECTIONS Global Market: BOJ policymakers see scope for faster rate hikes as inflation pressure builds By Anupam Nagar , ETMarkets.com Last Updated: Oct 01, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Bank of Japan policymakers saw scope for faster interest rate hikes as persistent inflationary pressures raise concerns about price growth exceeding the central bank\u2019s 2% target. A summary of its September meeting showed support for further tightening, although some policymakers argued against rushing and stressed the need to monitor economic developments.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global Market: Japan\u2019s Nikkei hits six-week high as chip stocks rally on AI optimism", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News \u203a Global Market: Japan\u2019s Nikkei hits six-week high as chip stocks rally on AI optimism Powered By The Economic Times daily newspaper is available online now. Read Today's Paper Global Market: Japan\u2019s Nikkei hits six-week high as chip stocks rally on AI optimism SECTIONS Global Market: Japan\u2019s Nikkei hits six-week high as chip stocks rally on AI optimism By Anupam Nagar , ETMarkets.com Last Updated: Oct 01, 2026, 11:11:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Japan's Nikkei share average soared to a six-week peak, buoyed by chip sector stocks after favorable earnings guidance from Micron Technology. The Nikkei 225 surged 2.28%, while the broader Topix remained relatively stable. Nevertheless, various stocks within the Nikkei faced downturns, particularly in finance. Analysts are wary about the durability of AI stock gains amid Micron's forecasts, with monetary policy talks suggesting possible interest rate hikes, creating market uncertainty.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:11 AM IST", "pub_date_relative": "1h ago"}, {"title": "HFCL stock jumps over 15% in 3 sessions: Will the bullish momentum continue? Check support, and resistance levels", "full_content": "Shares of HFCL jumped 5% to \u20b9 237.95 on Thursday, 1 October, extending gains for the third straight session. In 3 sessions, it has advanced over 15%.\n\nHFCL shares have delivered strong gains across time frames, rising around 13% in the past week and 12% over three months. The stock has surged 227% in six months, while its one-year gain stands at more than 223%, making it a multibagger over the period.\n\nThe stock hit its 52-week high of \u20b9 257 in August 2026 and its 52-week low of \u20b9 59.83 in January 2026.\n\nHFCL recently went ex-dividend for its \u20b9 0.20 final dividend per share for FY26. The key ex-dividend and record date for the payout was September 22, 2026. The company subsequently held its 39th Annual General Meeting on September 29, where shareholders approved the dividend along with several other resolutions.\n\nThe AGM was conducted through video conferencing and other audio-visual means. Shareholders considered HFCL\u2019s audited standalone and consolidated financial statements for the year ended March 31, 2026, along with the Board and auditors\u2019 reports.\n\nAccording to Jigar S Patel, Senior Manager - Technical Research, Anand Rathi Share and Stock Brokers Limited , HFCL is showing signs of losing momentum on the higher side, with the weekly chart indicating a slowdown in the prevailing uptrend. After the recent rise, the stock may enter a consolidation or profit-booking phase, making it prudent for existing investors to consider securing profits at current levels.\n\n\u201cThe immediate support is placed near \u20b9 220, which will be an important level to monitor. As long as this support holds, the broader structure may remain range-bound. On the upside, \u20b9 260 acts as the key resistance. A decisive breakout above \u20b9 260 would be required to revive stronger bullish momentum,\u201d he suggested.\n\nUntil such a breakout occurs, a cautious approach is advisable, with existing holders focusing on profit protection rather than fresh aggressive longs, the expert advised.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:07 AM IST", "pub_date_relative": "1h ago"}, {"title": "Pace Digitek share price jumps 11% | What\u2019s driving the stock?", "full_content": "Pace Digitek share price jumped over 11% on Thursday, 1 October, despite the stock market remaining largely flat.\n\nThe stock has gained 1.80% over the past week, 10.75% in two weeks and 2.22% over the past month. However, it has remained down 18.50% over the past three months.\n\nRajesh Bhosale, Technical Analyst at My Advisor Alpha, said Pace Digitek witnessed a gap-up opening and an extended move during the initial trading session. However, the stock cooled off from its intraday high of around \u20b9 178.\n\nBhosale noted that the \u20b9 178 level coincides with the 200-day SMA, making it a key hurdle for the stock. A sustained break above \u20b9 178 could trigger the next leg of the upmove, with \u20b9 200 emerging as the next key resistance. On the downside, he identified \u20b9 160 as an important support level.\n\nSudeep Shah, Vice President \u2013 Technical and Derivatives Research at SBI Securities, said Pace Digitek has faced resistance around its 50-day EMA twice over the past eight sessions, making this zone an immediate hurdle.\n\nHe noted that despite the recovery from the mid-September lows, the stock continues to trade below key moving averages on the weekly chart, indicating that the broader trend remains weak. The MACD line also remains below zero, suggesting that momentum has yet to strengthen despite the recent recovery.\n\nShah identified the \u20b9 178\u2013 \u20b9 180 zone as immediate resistance. A decisive and sustained breakout above this range could extend the pullback towards \u20b9 185, followed by \u20b9 190 in the short term. On the downside, he pegged the \u20b9 158\u2013 \u20b9 155 zone as immediate support.\n\nPace Digitek share price today opened at an intraday low of \u20b9 165.15 apiece on the BSE , and the stock touched an intraday high of \u20b9 178 per share.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 11:06 AM IST", "pub_date_relative": "1h ago"}, {"title": "The Paradise Box Office Collection Day 7: Nani Film Crosses Rs 100 Crore Mark In India", "full_content": "The film, directed by Srikanth Odela, marks his second collaboration with Nani after 'Dasara'.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 11:05 AM IST", "pub_date_relative": "1h ago"}, {"title": "Micron earnings: AI chip demand drives fresh memory boom", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a News Powered By Micron earnings: AI chip demand drives fresh memory boom Written by Anupam Nagar , ETMarkets.com | Oct 01, 2026, 11:07:39 AM IST 1 / 10 \u200bMicron\u2019s AI Boom Gets Even Bigger Micron Technology delivered a blockbuster fiscal fourth quarter, with revenue and profit beating Wall Street expectations by a wide margin. The memory-chip maker also issued a stronger-than-expected outlook for the first quarter of fiscal 2027, pointing to continued demand from artificial intelligence data centres. (Sources: Reuters, MarketWatch, Yahoo Finance)\n\nMicron reported fiscal fourth-quarter revenue of $54.23 billion, more than four times the $11.32 billion recorded a year earlier. Revenue also exceeded analysts\u2019 expectations of around $51.5 billion, highlighting the strength of the current memory-chip cycle.\n\nMicron reported adjusted earnings of $33.42 per share in the fourth quarter, compared with $3.03 per share a year earlier. The result also topped Wall Street expectations of about $31.83 per share, helped by stronger memory pricing, robust demand and a favourable product mix.\n\nFor the fiscal first quarter, Micron expects revenue of $61.5 billion, plus or minus $1.5 billion. That is well above analysts\u2019 expectations of roughly $57 billion. The company also forecast adjusted earnings of $38.15 per share, plus or minus $1, compared with expectations of around $35.40.\n\nMicron expects supply-demand conditions for memory and storage products to become significantly tighter in fiscal 2027 and 2028. AI data centres require large quantities of DRAM and high-bandwidth memory, while adding semiconductor production capacity can take several years.\n\nMicron said the value of customer commitments under long-term supply agreements has increased to about $32 billion, up from $22 billion in June.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:00 AM IST", "pub_date_relative": "1h ago"}, {"title": "Global bond sell-off deepens as Asian yields jump", "full_content": "Japanese and Australian sovereign debt costs mount despite oil price dipping", "source": "FT Markets", "pub_date_str": "01 Oct 2026, 10:59 AM IST", "pub_date_relative": "1h ago"}, {"title": "TBO Tek shares gain 3%; Nuvama initiates 'Buy' with Rs 2,200 target", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a IPOs/FPOs \u203a TBO Tek shares gain 3%; Nuvama initiates 'Buy' with Rs 2,200 target TBO Tek Share Price The Economic Times daily newspaper is available online now. Read Today's Paper TBO Tek shares gain 3%; Nuvama initiates 'Buy' with Rs 2,200 target SECTIONS TBO Tek shares gain 3%; Nuvama initiates 'Buy' with Rs 2,200 target By Ritesh Presswala , ETMarkets.com Last Updated: Oct 01, 2026, 10:58:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Shares of travel tech firm TBO Tek rose nearly 3% on Thursday to Rs 1,733 after brokerage Nuvama initiated coverage with a Buy rating and a Rs 2,200 target price. The brokerage expects a 35% earnings CAGR over FY27-FY29E, driven by international expansion and hotel business growth.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 10:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "Escorts Kubota Share Price Falls over 3% After September Sales Slump 17% YoY", "full_content": "Escorts Kubota's September tractor sales fell to 15,214 units from 18,267 units a year earlier, while six-month sales rose 10% year-on-year.", "source": "NDTV Profit", "pub_date_str": "01 Oct 2026, 10:58 AM IST", "pub_date_relative": "1h ago"}, {"title": "UK launches new vaping rules to deter young people - The Independent", "full_content": "UK launches new vaping rules to deter young people The Independent Vape duty could push 15% of users towards illegal vapes Scottish Local Retailer IVG Parent Reports HMRC Approvals Ahead of UK Vape Tax vaping360.com Hopes new Vaping Products Duty won't be 'too dramatic' for Manx customers Manx Radio Vape retailers to cut ranges as new duty nearly doubles e-liquid prices The Grocer", "source": "Google News Business", "pub_date_str": "01 Oct 2026, 10:58 AM IST", "pub_date_relative": "1h ago"}], "cfa": [{"title": "US Market: 10-year yield surges to 5.31%, highest since 2007", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a US Stocks \u203a Wall St Guide \u203a US Market: 10-year yield surges to 5.31%, highest since 2007 Powered By The Economic Times daily newspaper is available online now. Read Today's Paper US Market: 10-year yield surges to 5.31%, highest since 2007 SECTIONS US Market: 10-year yield surges to 5.31%, highest since 2007 By Anupam Nagar , ETMarkets.com Last Updated: Oct 01, 2026, 12:44:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis US Treasury yields reached multi-year highs as a historic bond selloff extended into a seventh session. The 10-year yield touched 5.31%, while the 30-year exceeded 5.65%. Persistent inflation, energy costs, strong AI investment and shifting Fed expectations pressured bonds. Falling oil prices offered some relief, but global yields remained elevated.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 12:44 PM IST", "pub_date_relative": "4m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Australian businesses raise prices as card surcharge ban takes effect", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "5m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "UK\u2019s Nest pension picks Wellington in \u00a33.5 billion emerging market active equity shift", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Hang Seng tests 61.8% Fib support at HKD 24,360: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Natural Gas tests Fib support at $2.966 after double top: Live", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:42 PM IST", "pub_date_relative": "6m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Crude Oil WTI squeezed at $91 with bear flag forming: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:41 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Bitcoin stuck in $82,800-$85,000 range: Live levels", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:40 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Airtel Money sets IPO price at \u00a31.96 per share", "full_content": "", "source": "Investing.com News", "pub_date_str": "01 Oct 2026, 12:40 PM IST", "pub_date_relative": "7m ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Stock futures rise as traders eye elevated Treasury yields, brace for jobs report due this week: Live updates", "full_content": "Stock futures were higher early Thursday as Wall Street gears up for the start of a new trading month.\n\nFutures tied to the Dow Jones Industrial Average added 170 points, or 0.33%. S&P 500 futures advanced about 0.56%, and Nasdaq-100 futures gained over 1%.\n\nIn regular trading, the broad-market S&P 500 dropped 0.3%, while the Dow lost more than 440 points, or 0.9%. The Nasdaq Composite outperformed, advancing 0.2% on the day.\n\nSeptember, historically a weak month for stocks, wasn't kind to the S&P 500, which dropped 0.5%. Investors grappled with higher oil prices and a surge in Treasury yields, stoking fears of additional rate hikes. The Dow lost 4.3%, while the Nasdaq outperformed and gained 1.9% in the month.\n\nWednesday also marked the end of the third quarter. The S&P 500 and the Nasdaq each advanced about 2%, while the Dow lost 2.7%.\n\nIn Asia, Japan's Nikkei 225 rose 0.86%, while the Topix declined 0.44%. South Korea's benchmark Kospi was down 0.8%, while the small-cap Kosdaq Index started the trading day flat. Mainland China and Hong Kong markets were closed for a holiday.\n\nInvestors are heading into the new trading month weighing a softer inflation picture against still elevated Treasury yields and uncertainty over the Federal Reserve's next rate decision, which is scheduled for the end of October. They're also looking ahead to a fresh round of earnings reports from companies.\n\n\"While those factors remain headwinds, corporate earnings have continued to show resilience,\" said Tracie McMillion, head of global asset allocation strategy at Wells Fargo Investment Institute. \"The key question is whether that earnings strength can continue as borrowing costs remain elevated.\"", "source": "CNBC Top News", "pub_date_str": "01 Oct 2026, 12:26 PM IST", "pub_date_relative": "21m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Equity Investments", "Fixed Income", "Derivatives", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "PPF, SCSS, SSY interest rates kept unchanged for Dec quarter: How are small savings rates set, why are they frozen?", "full_content": "The government on Wednesday kept interest rates unchanged across a dozen small savings schemes, including the Public Provident Fund (PPF) and Sukanya Samriddhi Yojana (SSY), for the October-December quarter. The rates have now been kept unchanged for 11 consecutive quarters.\n\nSmall savings schemes consist of government-backed deposit and certificate products which are operated through the post office and designated banks. They provide Indian households with a formal and safe savings avenue, as it comes with sovereign guarantee and tax benefits on select schemes.\n\nDeposits under the PPF and SSY accounts will continue to earn interest rates of 7.1% and 8.2%, respectively, which is credited on an annual basis.\n\nThe Senior Citizen Savings Scheme (SCSS) will offer 8.2%, while the National Savings Certificate (NSC) will continue to earn 7.7%. The interest rate on Kisan Vikas Patra (KVP), which matures in 115 months, remains at 7.5%.\n\nFor other small savings schemes, savings deposits will continue to earn 4%, while one-year, two-year and three-year deposits will offer 6.9%, 7% and 7.1%, respectively. The five-year deposit will earn 7.5%, while the five-year recurring deposit will offer 6.7%. The Monthly Income Account Scheme will continue to carry an interest rate of 7.4%.\n\nSmall savings schemes interest rates for Oct-Dec 2026 quarter\n\nThe Ministry of Finance reviews small savings rates every quarter under the market-linked framework adopted following the 2011 Shyamala Gopinath Committee report, with quarterly resets introduced in 2016.\n\nAccording to the Managing Partner of Singhania & Co. Rohit Jain, each scheme is benchmarked to the average yield on central government securities of comparable maturity during the relevant reference period, with a prescribed spread reflecting tenure and social-policy objectives.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 12:25 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Economics", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Multibagger power stock Transformers & Rectifiers share price jumps 10% after PM-DHARA push - Can the rally continue?", "full_content": "Shares of Transformers & Rectifiers (India) Ltd. ( TARIL ) jumped more than 10% on Thursday, October 1, after the Union Cabinet approved the \u20b9 1.86 lakh crore PM-DHARA Scheme a day earlier. The government's large-scale investment in power transmission infrastructure has brought transformer manufacturers into focus, as the planned expansion of electricity networks could create additional demand for power transformers.\n\nThe PM-DHARA scheme, or PM-Developing Harmonized and Accelerated Renewable-energy Access, is aimed at strengthening intra-state transmission infrastructure and deploying 50 GWh of battery storage to facilitate the evacuation of up to 135 GW of renewable energy. The initiative assumes importance as India works towards its target of 500 GW of renewable energy capacity by 2030.\n\nUnder the scheme, \u20b9 1.36 lakh crore has been earmarked for intra-state transmission infrastructure. The planned investment is expected to support the expansion and modernisation of electricity networks across states, potentially creating opportunities for transmission equipment manufacturers and project developers.\n\nFor transformer makers such as TARIL, increased investment in transmission infrastructure could support demand as utilities expand capacity and upgrade existing networks.\n\nThe stock rose as much as 10.5% to hit an intraday high of \u20b9 298.70 on Thursday. Despite the sharp move, the stock remained below its 52-week high of \u20b9 501.25, recorded in October 2025. Its 52-week low stands at \u20b9 224.30, touched in February 2026.\n\nOn a shorter-term basis, TARIL has declined around 6% in one month and 10% over three months. The stock has fallen more than 40% over the past year.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 12:23 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Three equity mutual fund categories have delivered 10%+ returns in 2026 so far, check the top-performing funds", "full_content": "Equity mutual fund returns have been sharply uneven in 2026. While several categories are in negative territory, only three equity mutual fund categories have delivered more than 10% so far this year, based on category-level data as of 30 September.\n\nInternational equity funds lead the list with a 21.21% return, followed by pharma funds at 13.98% and small-cap funds at 10.59%. In contrast, large-cap funds have lost 8.17%, while technology funds have fallen 20.27% during the same period.\n\nThe category-level numbers, however, do not tell the whole story. Returns have varied significantly among individual funds within these categories.\n\nThe 21.21% category return for international equity is striking when compared with most India-focused equity categories. But the bigger story is the dispersion within the category.\n\nNippon India Taiwan Equity Fund has returned 96.64% in 2026 so far. That is more than four times the category-level return. The next funds in the table are much closer to one another, with Edelweiss Emerging Markets Opportunities Equity Offshore at 33.99% and HSBC Global Emerging Markets Fund at 30.54%.\n\nNippon India Japan Equity Fund and Franklin Asian Equity Fund have also delivered more than 25% so far this year.\n\nThe second category to cross the 10% mark is pharma, which returned 13.98% through 30 September.\n\nThe top funds have done considerably better than the category average, here as well. Kotak Healthcare Fund delivered 29.10%, more than twice the category return.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 12:17 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "100% rally in one year! Multibagger auto stock falls 4% \u2014 should you buy? Experts' rationale, target price", "full_content": "SML Mahindra share price fell over 4% in Thursday's trading session despite the company reported 18% jump in its sales in September. The auto stock opened at \u20b9 6,501 on NSE today, as compared to previous close of \u20b9 6,578 on Wednesday and touched an intraday low of \u20b9 6,300.05 on 1 October.\n\nSML Mahindra said in a regulatory filing that its total sales in September 2026 rose 18% year-on-year to 1,124 units, compared with 950 units in the corresponding month last year.\n\nCargo vehicle sales increased 39% YoY to 516 units in September from 370 units a year earlier. Passenger vehicle sales, meanwhile, rose 5% to 608 units from 580 units during the same period.\n\nFor the April-September 2026 period, the company recorded total sales of 9,340 units, marking a 15% increase from 8,145 units sold in the year-ago period.\n\nIn an another exchange filing, the company further informed that the board will meet on 19 October to consider and approve the financial results for the quarter ending on 30 September, 2026.\n\n\u201cIt is hereby informed that a meeting of Board of Directors of the Company is scheduled to be held on 19th October, 2026 (Monday), inter alia, to consider & approve the Unaudited Financial Results of the Company for second quarter and half year ending on 30th September, 2026 (FY 2026-27),\u201d it said.\n\nSML Mahindra has delivered a strong performance over the medium to long term, despite a recent decline. The stock has fallen 3.56% over the past week, indicating some profit-taking or consolidation after its strong run.\n\nOn a one-month basis, SML Mahindra shares have gained 17.65%, while its year-to-date performance stands at 55.63%. The stock has also more than doubled over the past year giving multibagger returns by rising 102.94%.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 12:07 PM IST", "pub_date_relative": "40m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Hero Motors share price doubles from IPO price, gains 104% | What\u2019s next for investors?", "full_content": "Hero Motors share price jumped nearly 10% on Thursday, 1 October, touching a fresh high of \u20b9 167.45 on the BSE. Hero Motors share price has risen 104% from its IPO price of \u20b9 82. The company's market capitalisation stood at \u20b9 7,564.96 crore so far today.\n\nMeanwhile, the company held its 27th Annual General Meeting (AGM), where shareholders considered and adopted the audited financial statements, including the consolidated financial statements, for the financial year ended 31 March 2026, along with the reports of the Board of Directors and auditors.\n\nThe Chairman stated that the results would be declared upon receipt of the consolidated report from the Scrutinizer, within two working days or three days from the conclusion of the AGM, whichever is earlier.\n\nHero Motors share price was in focus on Wednesday following a bulk deal executed on Monday, 28 September. According to BSE data, Irage Broking Services LLP bought 34,01,332 shares at \u20b9 135.70 apiece, while it sold 12,12,381 shares at \u20b9 134.93 per share.\n\nHero Motors made a muted debut on 23 September, with the stock opening at \u20b9 82.10 on the BSE, down 2.26% from its issue price of \u20b9 84. However, the stock staged a sharp recovery during the session and ended at \u20b9 98.51, marking a 17.27% gain over the issue price.\n\nOn the NSE, the shares opened at \u20b9 82, a 2.38% discount to the issue price, before closing at \u20b9 98.40, up 17.14%.\n\nHero Motors is an automotive technology company engaged in designing, developing, manufacturing and supplying engineered powertrain solutions to automotive original equipment manufacturers (OEMs) across the US, Europe, India and the ASEAN region.\n\nIts customer base includes global companies such as BMW AG, Ducati Motor Holding SPA, Enviolo International Inc, Formula Motorsport Ltd and Hummingbird EV.", "source": "LiveMint Markets", "pub_date_str": "01 Oct 2026, 12:06 PM IST", "pub_date_relative": "41m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Highway Infrastructure shares jump 9% after Rs 245 crore toll operations win from UP authority, NHAI", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Highway Infrastructure shares jump 9% after Rs 245 crore toll operations win from UP authority, NHAI Highway Infrastructure Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Highway Infrastructure shares jump 9% after Rs 245 crore toll operations win from UP authority, NHAI SECTIONS Highway Infrastructure shares jump 9% after Rs 245 crore toll operations win from UP authority, NHAI By Surbhi Khanna , ET Online Last Updated: Oct 01, 2026, 12:02:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Highway Infrastructure shares jumped after the company secured toll operations orders worth Rs 254 crore from UPEIDA and NHAI. The key order, worth Rs 220.66 crore, involves toll collection and plaza operations on the Gorakhpur Link Expressway, along with deployment of patrol-cum-safety vehicles.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 12:02 PM IST", "pub_date_relative": "45m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Buying property from an NRI is easier, but don\u2019t make this 12.5% TDS mistake", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBuying a house from a non-resident Indian (NRI) involves more tax compliance than buying one from a resident. One part of that process gets simpler from today.\n\nA resident individual or Hindu undivided family (HUF) buying immovable property from an NRI will no longer need a TAN or tax account number just to deduct tax at source on the transaction. Now, the buyer can use PAN and deposit the tax deducted at source (TDS) through Form 141. The form will have a new Schedule E for such transactions.\n\n\u201cForm 141 is not a new form introduced by this notification. It is a consolidated challan-cum-statement that was introduced under the new Income-Tax Act, 2025, for specific TDS transactions. It is already used for depositing TDS on payments by individuals and HUFs to residents, including TDS on purchase of immovable property from a resident. The recent notification has expanded its scope to also cover TDS under Section 393 (2), where a resident individual or HUF purchases immovable property from a non-resident, with a new Schedule E specifically prescribed for such transactions,\u201d said Neeraj Agarwala, senior partner at Nangia & Co LLP.\n\nWhile this removes an administrative step, it does not dilute the buyer's responsibility for TDS, which is higher when the seller is an NRI .\n\nUntil now, an individual or HUF buying a property from an NRI had to mandatorily get a TAN, which could add a few days to the process. A TAN application can be made online, but allotment typically takes about 2 to 10 days, according to Agarwala.\n\nFrom 1 October, this requirement has gone away. The buyer will have to file Schedule E of Form 141 and deposit the TDS within 30 days from the end of the month in which it was deducted.", "source": "LiveMint Money", "pub_date_str": "01 Oct 2026, 11:57 AM IST", "pub_date_relative": "51m ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "$2 billion gone in two days! FIIs accelerate selling as Nifty, Sensex set to fall for 8th week running. Will they make a comeback?", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Careers Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a $2 billion gone in two days! FIIs accelerate selling as Nifty, Sensex set to fall for 8th week running. Will they make a comeback? Motilal Oswal Financial Services Share Price Aditya Birla Capital Share Price L&T Finance Share Price HDB Financial Services Share Price Piramal Finance Share Price The Economic Times daily newspaper is available online now. Read Today's Paper $2 billion gone in two days! FIIs accelerate selling as Nifty, Sensex set to fall for 8th week running. Will they make a comeback? SECTIONS $2 billion gone in two days! FIIs accelerate selling as Nifty, Sensex set to fall for 8th week running. Will they make a comeback? By Veer Sharma , ETMarkets.com Last Updated: Oct 01, 2026, 11:55:00 AM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Foreign institutional investors pulled out over Rs 20,000 crore from Indian equities in two trading sessions as the Nifty and Sensex head for an eighth straight weekly decline. Elevated crude prices, high US bond yields and rate concerns have weighed on sentiment, while analysts differ on the outlook for foreign inflows.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "01 Oct 2026, 11:55 AM IST", "pub_date_relative": "53m ago", "cfa_topics": ["Equity Investments", "Fixed Income"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Can technology fix ICICI Lombard's underwriting equation?", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nICICI Lombard General Insurance Co.\u2019s Digital Day meet on 29 September has raised hopes of improving the insurer\u2019s profits from its recent slump. The stock gained 4% the next day (Wednesday).\n\nThe management showcased
