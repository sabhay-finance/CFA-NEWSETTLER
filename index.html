    const allData = {"general": [{"title": "Meta chief strategy officer Dave Wehner leaves to join AI infrastructure startup Fireworks as CFO", "full_content": "Dave Wehner, Meta's chief strategy officer, is leaving the company for four-year-old AI startup Fireworks.\n\nAt Fireworks \u2014 an AI inference and model-training platform focused on open models that was valued at $17.5 billion during a Series D fundraising round in July \u2014 Wehner will assume the CFO role, he announced on X on Friday.\n\nWehner will be tasked with scaling the company's finances and operations, Fireworks CEO Lin Qiao said in a statement to CNBC.\n\n\"Fireworks has the right mission for the moment,\" Wehner wrote on X, adding: \"I've become increasingly bullish on what they are building. There's a remarkable depth of technical talent here, coupled with a very practical focus on what customers need.\"\n\nThe AI startup, founded in 2022 by former Meta and Google employees, is a platform that lets developers customize and run open models for their businesses. Its latest investment round was led by Atreides Management, Index Ventures and TCV, but Fireworks is also backed by Nvidia and Sequoia Capital. Business Insider reported that it is in early talks to raise funds again at a possible $30 billion to $40 billion valuation.\n\nWehner joined Meta, then called Facebook, in 2012 and was the company's chief financial officer from 2014 to 2022.\n\n\"Dave helped guide Meta through tremendous growth and complexity over 14 years, and brought disciplined thinking to some of our hardest company-level decisions,\" Meta COO Javier Olivan said in a statement to CNBC.\n\nFireworks is notably smaller than Meta \u2014 the tech giant has about a $1.56 trillion market capitalization as of Friday's close \u2014 and its competitors, which include OpenAI and Anthropic.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 11:21 PM IST", "pub_date_relative": "16m ago"}, {"title": "Sierra Bancorp directo ceipts, the subsequent years' tax returns and the treatment followed in the cases of the other co-owners.\n\nThe taxpayer jointly owned a non- agricultural land parcel measuring approximately 12,363 square metres in Kachigam, Nani Daman, along with his three brothers. The four co-owners had entered into a registered development agreement with Param Corporation for a total consideration of \u20b9 24 crore.\n\nDuring the financial year 2017-18, the taxpayer claimed to have received only \u20b9 25 lakh from the developer. However, the developer deducted TDS of \u20b9 2,86,250 against a reported amount of \u20b9 2.86 crore and furnished the corresponding details in its TDS return.\n\nThe higher amount subsequently appeared in the taxpayer's Form 26AS, which records tax deducted at source against a taxpayer's PAN.\n\nThe taxpayer claimed TDS credit of only \u20b9 25,000, corresponding to the \u20b9 25 lakh actually received during the year. He carried forward the remaining TDS credit of \u20b9 2,61,250 to subsequent years.\n\nThe taxpayer had initially not filed his income tax return for assessment year 2018-19.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 10:46 PM IST", "pub_date_relative": "51m ago"}, {"title": "Coca-Cola evp Perez sells $6.4 million in shares", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 10:45 PM IST", "pub_date_relative": "51m ago"}, {"title": "Scene Box Office Collection Day 2: Suriya-Starrer Holds Strong After A Solid Opening; Check Earnings", "full_content": "Suriya-starrer Scene follows a man caught in a gripping story of crime and conflict. The Tamil film also stars Pooja Hegde and Joju George in key roles.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 10:45 PM IST", "pub_date_relative": "52m ago"}, {"title": "Udta Teer Box Office Day 16: Ayushmann-Sara Film Sees A Weekend Boost, Inches Closer To Rs 55 Crore", "full_content": "Ayushmann Khurrana and Sara Ali Khan's Udta Teer continu day it is launching a task force to help crack down on Tehran's movement of advanced weapons and other sanctioned material over its land borders and through the Caspian Sea.\n\nTask Force Iron Gate, which was first reported by Reuters, will be based in Tampa, Florida, and will coordinate with other U.S. government agencies. Beyond the movement of weapons, it will also focus on halting the flow of dual-use technologies used by Iran and stemming what Washington calls illegal revenue streams.\n\nThe establishment of the task force is the latest illustration of how the U.S. is still searching for ways to increase pressure on Tehran, more than eight months after launching with Israel a war against the Islamic Republic.\n\nWhile U.S. strikes have dealt devastating blows to Iran's conventional military and the U.S. naval blockade has severely restricted its crude exports through the Strait of Hormuz and the Arabian Sea, Iran still poses a formidable threat to the region, and its rulers have tightened their grip on the country.\n\nA Reuters investigation found Iran has created a secret network of military agencies to import at least $2 billion in hardware, explosives and heavy-duty trucks since January 2025, evading both the US naval blockade and Western sanctions.\n\nThe material entered Iran by cargo ship across the Caspian Sea from Russia, by truck from Central Asia, and by freight planes from China, the Reuters investigation showed.\n\nU.S. Central Command said the task force will coordinate with other government agencies. A U.S.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 10:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Delhi Pollution: Schools Shift Classes Up To Class 5 To Hybrid Mode Under GRAP Stage III", "full_content": "Delhi-NCR invokes stricter pollution curbs as primary students are given the option of attending school online or in person.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 10:26 PM IST", "pub_date_relative": "1h ago"}, {"title": "Orry\u2019s Quirky Butterfly Shirt Becomes The Talk Of Khushi Kapoor\u2019s Birthday Bash", "full_content": "The video showed Khushi cutting the cake while holding her pet dog in her arms.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 10:24 PM IST", "pub_date_relative": "1h ago"}, {"title": "Berkshire Hathaway Boosts Buybacks As Operating Income Slips", "full_content": "Berkshire started buying back its own shares in the first quarter for the first time in more than a year, as Chief Executive Officer Greg Abel found the shares were trading below their \"intrinsic value.\"", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 10:18 PM IST", "pub_date_relative": "1h ago"}, {"title": "Berkshire Hathaway steps up share buybacks with $9.6bn of purchases", "full_content": "Insurance slowdown drags on performance, with quarterly operating income falling by 5.8 per cent year-on-year", "source": "FT Markets", "pub_date_str": "07 Nov 2026, 10:13 PM IST", "pub_date_relative": "1h ago"}, {"title": "The S&P 500 could be dangerously exposed to AI. Here are some simple alternatives.", "full_content": "MarketWatch navigation Subscribe Now Account Settings Site Search Clear SEARCH Advanced Search \u2794 Search Results Symbols No results found All News Articles Video Podcasts 0 Results No Results Found Authors No results found Sections No results found Columns No results found Brett Arends's ROI Opinion: The S&P 500 could be dangerously exposed to AI. Here are some simple alternatives. The large-cap index is nowhere near as diversified as you think Updated Nov. 7, 2026, 11:40 a.m. ET Share Resize (8 min)\n\nAI stocks, like Jensen Huang\u2019s chip giant Nvidia, dominate the S&P 500. Photo: Sean Gallup / Getty Images If the turmoil in artificial-intelligence and technology stocks gets any worse, millions of Americans \u2014 actually, tens of millions of Americans \u2014 are suddenly going to discover that their retirement funds are far less diversified than they thought.\n\nThey are going to find out that a shockingly large part of their entire portfolio was being gambled on these AI and technology stocks.\n\nCopyright \u00a9 2026 MarketWatch, Inc. All Rights Reserved. 87990cbe856818d5eddac44c7b1cdeb8", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 10:10 PM IST", "pub_date_relative": "1h ago"}, {"title": "Steel Dynamics EVP & CTO Barry Schneider sells $12.4M in stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 10:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "Exchanging old gold for new jewellery this Diwali? 6 things to check before accepting your jeweller\u2019s valuation | Guide", "full_content": "Diwali is one of the biggest occasions for buying gold jewellery in India. While many households prefer purchasing new ornaments during the festive season, exchanging old gold for new designs can be a convenient way to upgrade jewellery without paying the entire cost upfront.\n\nHowever, exchanging old jewellery is not necessarily the same as getting its full market value . The amount a jeweller offers depends on several factors, including the purity of the gold, its net weight, deductions for stones and other materials, melting charges and the jeweller's exchange policy.\n\nEven a small difference in the valuation can affect how much a buyer ultimately pays for the new jewellery. Before handing over old ornaments this Diwali, here are six things you should check to ensure you get a fair deal.\n\nThe first thing to check is the purity of the jewellery being exchanged. An ornament purchased years ago may have a different gold purity from what the buyer assumes, particularly if it was bought without a hallmark or from a different jeweller.\n\nAsk the jeweller to test the gold in your presence and explain the results. Do not rely solely on an old purchase bill or a verbal assurance about whether the jewellery is 22-karat, 18-karat or 14-karat.\n\nIf the jewellery carries a BIS hallmark , check its details, including the six-digit Hallmark Unique Identification (HUID), through the BIS Care app. However, a hallmark establishes the declared purity of the article; it does not guarantee the exchange price.\n\nThe Bureau of Indian Standards (BIS) also allows consumers to approach its recognised Assaying and Hallmarking Centres to get old gold jewellery tested on a chargeable basis. This can be useful if you are unsure about the jeweller's assessment.\n\nThe weight displayed on the weighing scale may not represent the amount of gold for which you will receive credit.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 10:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "C&F Financial CEO Mark Fox sells $111,990 of company stock", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 10:01 PM IST", "pub_date_relative": "1h ago"}, {"title": "The 2027 tax brackets are out. See what the standard deduction and SALT tax breaks will be.", "full_content": "The tax brackets at the heart of Americans\u2019 income-tax bills will be adjusting at a steeper level in 2027 compared to this year, underscoring inflation\u2019s rekindled presence.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 10:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "I attend free meals hosted by people promoting annuities. I\u2019ve no intention of buying any. Should I stop going?", "full_content": "\u201cSalespeople typically push annuities, Medicare plans and estate-planning services.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 10:00 PM IST", "pub_date_relative": "1h ago"}, {"title": "Why the prognosis for healthcare stocks is uncertain ahead of Congress\u2019 new makeup", "full_content": "Healthcare stocks may struggle to gain momentum as Democrats prepare to take over Congress.\n\nJared Holz, who covers healthcare for Mizuho, says the outlook for the sector is uncertain because of likely gridlock between lawmakers.\n\n\"The next couple of years I really can't see too much happening,\" the firm's sector specialist told CNBC's \" Fast Money \" on Wednesday. \"I'm not sure you want to own everything, but you can pick and choose the names\u2026 Pharma is trading more expensive than tech for the first time in 20 years. So, I backed away from pharma. I would look at medtech.\"\n\nThe State Street Health Care Select ETF (XLV) jumped 3% a day after Election Day.\n\n\"You had this very weird situation where typically you wouldn't have all of these categories work in tandem, and they did . So, I think some things just a little bit off,\" said Holz, a day before healthcare got swept up in Thursday's Wall Street sell-off .\n\nAccording to Holz, healthcare's real booster shot may come if a Democrat wins the White House in 2028.\n\n\"Then I think you see some of the Trump strategies rolled back. That's where I think healthcare could actually perform well,\" said Holz, who added it hinges on Democrats retaining the Senate and House.\n\nFor investors who are long on healthcare, Holz said each subsector should be treated differently.", "source": "CNBC Finance", "pub_date_str": "07 Nov 2026, 09:32 PM IST", "pub_date_relative": "2h ago"}, {"title": "My 93-year-old father changed his will at the 11th hour, leaving my brother his entire $500,000 estate. Can I challenge it?", "full_content": "\u201cMy brother had no job and needed a place to live.\u201d", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 09:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "You follow the rules for smart stock trading. But are they the right rules?", "full_content": "Apply the wisdom of investment pros to develop your own consistent methodology.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 09:30 PM IST", "pub_date_relative": "2h ago"}, {"title": "You\u2019re fired! But you can keep the laptop and insurance. And here\u2019s $10,000.", "full_content": "MarketWatch navigation Subscribe Now Account Settings Site Search Clear SEARCH Advanced Search \u2794 Search Results Symbols No results found All News Articles Video Podcasts 0 Results No Results Found Authors No results found Sections No results found Columns No results found You\u2019re fired! But you can keep the laptop and insurance. And here\u2019s $10,000. Some tech companies are giving more generous severance packages, but here\u2019s what to keep in mind Updated Nov. 7, 2026, 10:44 a.m. ET Share Resize (6 min)\n\nA few tech firms have been letting workers keep their company-issued laptops when they\u2019re let go, along with Photo: MarketWatch photo illustration / iStockphoto When Canva announced it was laying off 22% of its staff on Tuesday, the severance package included unusual benefits for former employees. They were able to keep their company-issued MacBooks, as well as their salary for the next six months, a LinkedIn Premium subscription and healthcare for the next year.\n\nX users immediately said the package was generous, calling it \u201chumane\u201d and saying things like, \u201c We need more founders like thissss.\u201d\n\nCopyright \u00a9 2026 MarketWatch, Inc. All Rights Reserved. 87990cbe856818d5eddac44c7b1cdeb8", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 09:14 PM IST", "pub_date_relative": "2h ago"}, {"title": "Got salary bonus this Diwali? 5 smart ways to strengthen your finances instead of spending it all - Top ideas to follow", "full_content": "Diwali often brings a welcome addition to the monthly salary in the form of a festive bonus, performance-linked payout or annual variable pay. With shopping offers, travel plans and family celebrations competing for attention, however, the additional money can disappear faster than expected.\n\nWhile there is nothing wrong with using part of the bonus to celebrate the festival, treating the entire payout as disposable income could mean missing an opportunity to improve your financial position.\n\nA Diwali bonus can help salaried individuals address gaps in their financial planning, prepare for large expenses and accelerate progress towards long-term goals. The key is to give the money a purpose before deciding how much to spend.\n\nBefore allocating the bonus, take stock of your existing finances. Check your savings, outstanding loans, monthly expenses and upcoming financial commitments.\n\nFor instance, someone who has been postponing an annual insurance premium, school fees or a planned home repair could use the bonus to meet these expenses without disturbing their monthly budget.\n\nIt is also important to check whether you have adequate liquidity to manage unexpected expenses. A financial cushion can help households deal with temporary income disruptions or emergencies without relying on expensive borrowing.\n\nThe Securities and Exchange Board of India (SEBI), through its investor education initiative, recommends budgeting, prioritising essential expenses and maintaining an emergency fund as part of sound money management.\n\nA salary bonus can also be an opportunity to review your insurance coverage, particularly if your financial responsibilities have increased.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 09:01 PM IST", "pub_date_relative": "2h ago"}, {"title": "Berkshire Hathaway more than doubles buybacks in third quarter as earnings decline", "full_content": "Berkshire Hathaway said Saturday it accelerated its share repurchases during the third quarter, as operating and overall profits took a hit.\n\nThe Greg Abel-led conglomerate bought back $9.6 billion worth of Berkshire stock. That's more than double the $4.5 billion repurchased in the second quarter and brings the company's total buybacks for 2026 to about $14.4 billion.\n\nThe sharp increase came as Berkshire's operating earnings \u2014 those from wholly-owned businesses \u2014 fell year over year, as profits from its insurance business pulled back.\n\nBerkshire operating profits totaled $12.705 billion, down 5.8% from $13.485 billion in the year-earlier period. Insurance underwriting tumbled 43% year on year to $1.352 billion, while insurance investment income declined 14% to $2.734 billion. Berkshire's railroad, energy and manufacturing businesses all saw earnings grow year over year.\n\nThe company's overall earnings, which include Berkshire's sprawling stock market portfolio, also dropped 28% in the third quarter to $22.112 billion from $30.796 billion a year prior. Investment gains for the company fell nearly 50% to $9.407 billion.\n\nDespite the earnings pullback, Berkshire stock has outperformed recently amid a massive rotation out of technology stocks. Class A shares are up more than 12% over the past month, while the S&P 500 has dropped 5.5% in that time. Year to date, Berkshire has gained 13%, while the broad market index is up just 7.8%.\n\nBerkshire's five largest equity holdings remained the same in the third quarter: Alphabet , American Express , Apple , Bank of America and Coca-Cola .\n\nBerkshire's cash hoard also grew 3% in the third quarter $377.435 billion from $365.514 billion in the second quarter. However, excluding rail and utility cash along with T-bill payables, the conglomerate's cash holdings totaled $352.3 billion, down 1.9% quarter over quarter.", "source": "CNBC Finance", "pub_date_str": "07 Nov 2026, 08:53 PM IST", "pub_date_relative": "2h ago"}, {"title": "Russia pounds power facilities around Kyiv, damages major bridge", "full_content": "Russian forces hammered energy infrastructure around Ukraine's capital with missiles and drones overnight, straining Kyiv's power supply and heating systems as temperatures headed towards zero, officials said on Saturday.\n\nThree days before Russia and Ukraine are due to take part in U.S.-brokered talks, explosions rocked Kyiv as Moscow unleashed waves of ballistic missiles, several of which hit and damaged the Northern Bridge across the Dnipro River, Mayor Vitali Klitschko said.\n\nStrikes on energy facilities outside Kyiv \u2014 including systems sending power from two nuclear plants to the city and Ukraine's central regions \u2014 caused serious damage, the energy ministry said.\n\n\"The capital is facing serious difficulties with its electricity, water, and heat supplies,\" President Volodymyr Zelenskyy said on X, adding that substations in five other regions were also hit.\n\nHe said only four of the 36 ballistic-type missiles launched by Russia had been intercepted, and that some were North Korean-made and hit an important energy facility.\n\nAt least two people were killed and around a dozen others wounded across Ukraine in the overnight attacks, which also damaged homes, businesses and non-residential buildings, authorities said.\n\nMoscow's defence ministry said it struck what it described as targets in Ukraine's military-industrial sector, as well as energy and transport infrastructure in and around Kyiv.\n\nUkraine also carried out drone and missile attacks on several Russian regions, causing minor damage but no casualties, Russian authorities said on Saturday.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 08:33 PM IST", "pub_date_relative": "3h ago"}], "cfa": [{"title": "Meta chief strategy officer Dave Wehner leaves to join AI infrastructure startup Fireworks as CFO", "full_content": "Dave Wehner, Meta's chief strategy officer, is leaving the company for four-year-old AI startup Fireworks.\n\nAt Fireworks \u2014 an AI inference and model-training platform focused on open models that was valued at $17.5 billion during a Series D fundraising round in July \u2014 Wehner will assume the CFO role, he announced on X on Friday.\n\nWehner will be tasked with scaling the company's finances and operations, Fireworks CEO Lin Qiao said in a statement to CNBC.\n\n\"Fireworks has the right mission for the moment,\" Wehner wrote on X, adding: \"I've become increasingly bullish on what they are building. There's a remarkable depth of technical talent here, coupled with a very practical focus on what customers need.\"\n\nThe AI startup, founded in 2022 by former Meta and Google employees, is a platform that lets developers customize and run open models for their businesses. Its latest investment round was led by Atreides Management, Index Ventures and TCV, but Fireworks is also backed by Nvidia and Sequoia Capital. Business Insider reported that it is in early talks to raise funds again at a possible $30 billion to $40 billion valuation.\n\nWehner joined Meta, then called Facebook, in 2012 and was the company's chief financial officer from 2014 to 2022.\n\n\"Dave helped guide Meta through tremendous growth and complexity over 14 years, and brought disciplined thinking to some of our hardest company-level decisions,\" Meta COO Javier Olivan said in a statement to CNBC.\n\nFireworks is notably smaller than Meta \u2014 the tech giant has about a $1.56 trillion market capitalization as of Friday's close \u2014 and its competitors, which include OpenAI and Anthropic.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 11:21 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Mookuthi Amman 2 Box Office Collection Day 2: Nayanthara's Film Grows Stronger, Beats Opening Day Earnings", "full_content": "The Nayanthara-starrer 'Mookuthi Amman 2' earned Rs 2.33 crore gross in India on Day 2, recording 26.6% occupancy across 1,822 shows.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 11:08 PM IST", "pub_date_relative": "29m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Berkshire Hathaway speeds up stock buybacks, though profit falls - Reuters", "full_content": "Berkshire Hathaway speeds up stock buybacks, though profit falls Reuters Berkshire Hathaway more than doubles buybacks in third quarter as earnings decline CNBC Berkshire Hathaway\u2019s Quarterly Profit Falls After Investment Gains Shrink WSJ Warren Buffett\u2019s Berkshire Just Spent a Record $9.6 Billion Buying Its Own Stock Yahoo Finance Berkshire Hathaway steps up share buybacks with $9.6bn of purchases Financial Times", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 11:07 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Scene Box Office Collection Day 2: Suriya-Starrer Holds Strong After A Solid Opening; Check Earnings", "full_content": "Suriya-starrer Scene follows a man caught in a gripping story of crime and conflict. The Tamil film also stars Pooja Hegde and Joju George in key roles.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 10:45 PM IST", "pub_date_relative": "52m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Binance CFO exits days after catastrophic $6 billion crypto hack", "full_content": "", "source": "Investing.com News", "pub_date_str": "07 Nov 2026, 10:36 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "The wealthiest 10% of Americans are pulling ahead of everyone else. This is what\u2019s making them richer.", "full_content": "MarketWatch navigation Subscribe Now Account Settings Site Search Clear SEARCH Advanced Search \u2794 Search Results Symbols No results found All News Articles Video Podcasts 0 Results No Results Found Authors No results found Sections No results found Columns No results found The wealthiest 10% of Americans are pulling ahead of everyone else. This is what\u2019s making them richer. The wealthiest 10% have a median net worth that is $800,000 greater than it was three years ago Updated Nov. 7, 2026, 12:04 p.m. ET Share Resize (6 min)\n\nEven as many Americans earned more after the pandemic, little of it turned into wealth. Photo: MarketWatch photo illustration / iStockphoto Even in the face of rising costs, Americans\u2019 real median net worth managed to rise by 2% from 2022 to 2025, according to data from the Federal Reserve\u2019s latest Survey of Consumer Finances .\n\nYet to truly feel like you are getting ahead in the postpandemic economy, it has helped to be among the wealthiest 10% of Americans, whose median net worth shot up by 19%, after adjusting for inflation, during that time.\n\nCopyright \u00a9 2026 MarketWatch, Inc. All Rights Reserved. 87990cbe856818d5eddac44c7b1cdeb8", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 10:34 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "India's Diwali Trade Set To Cross Rs 7 Lakh Crore As Gold, Electronics Drive Festive Shopping", "full_content": "Diwali shopping has generated more than Rs 6 lakh crore in business across India, while Delhi alone has recorded sales exceeding Rs 1 lakh crore, according to CAIT.", "source": "NDTV Profit", "pub_date_str": "07 Nov 2026, 10:27 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Expanding on naval blockade, U.S. military looks to restrict Iranian land commerce", "full_content": "Building on a months-long naval blockade on Iran, the U.S. military said on Saturday it is launching a task force to help crack down on Tehran's movement of advanced weapons and other sanctioned material over its land borders and through the Caspian Sea.\n\nTask Force Iron Gate, which was first reported by Reuters, will be based in Tampa, Florida, and will coordinate with other U.S. government agencies. Beyond the movement of weapons, it will also focus on halting the flow of dual-use technologies used by Iran and stemming what Washington calls illegal revenue streams.\n\nThe establishment of the task force is the latest illustration of how the U.S. is still searching for ways to increase pressure on Tehran, more than eight months after launching with Israel a war against the Islamic Republic.\n\nWhile U.S. strikes have dealt devastating blows to Iran's conventional military and the U.S. naval blockade has severely restricted its crude exports through the Strait of Hormuz and the Arabian Sea, Iran still poses a formidable threat to the region, and its rulers have tightened their grip on the country.\n\nA Reuters investigation found Iran has created a secret network of military agencies to import at least $2 billion in hardware, explosives and heavy-duty trucks since January 2025, evading both the US naval blockade and Western sanctions.\n\nThe material entered Iran by cargo ship across the Caspian Sea from Russia, by truck from Central Asia, and by freight planes from China, the Reuters investigation showed.\n\nU.S. Central Command said the task force will coordinate with other government agencies. A U.S.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 10:26 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Financial Statement Analysis", "Ethical & Professional Standards"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "The S&P 500 could be dangerously exposed to AI. Here are some simple alternatives.", "full_content": "MarketWatch navigation Subscribe Now Account Settings Site Search Clear SEARCH Advanced Search \u2794 Search Results Symbols No results found All News Articles Video Podcasts 0 Results No Results Found Authors No results found Sections No results found Columns No results found Brett Arends's ROI Opinion: The S&P 500 could be dangerously exposed to AI. Here are some simple alternatives. The large-cap index is nowhere near as diversified as you think Updated Nov. 7, 2026, 11:40 a.m. ET Share Resize (8 min)\n\nAI stocks, like Jensen Huang\u2019s chip giant Nvidia, dominate the S&P 500. Photo: Sean Gallup / Getty Images If the turmoil in artificial-intelligence and technology stocks gets any worse, millions of Americans \u2014 actually, tens of millions of Americans \u2014 are suddenly going to discover that their retirement funds are far less diversified than they thought.\n\nThey are going to find out that a shockingly large part of their entire portfolio was being gambled on these AI and technology stocks.\n\nCopyright \u00a9 2026 MarketWatch, Inc. All Rights Reserved. 87990cbe856818d5eddac44c7b1cdeb8", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 10:10 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Exchanging old gold for new jewellery this Diwali? 6 things to check before accepting your jeweller\u2019s valuation | Guide", "full_content": "Diwali is one of the biggest occasions for buying gold jewellery in India. While many households prefer purchasing new ornaments during the festive season, exchanging old gold for new designs can be a convenient way to upgrade jewellery without paying the entire cost upfront.\n\nHowever, exchanging old jewellery is not necessarily the same as getting its full market value . The amount a jeweller offers depends on several factors, including the purity of the gold, its net weight, deductions for stones and other materials, melting charges and the jeweller's exchange policy.\n\nEven a small difference in the valuation can affect how much a buyer ultimately pays for the new jewellery. Before handing over old ornaments this Diwali, here are six things you should check to ensure you get a fair deal.\n\nThe first thing to check is the purity of the jewellery being exchanged. An ornament purchased years ago may have a different gold purity from what the buyer assumes, particularly if it was bought without a hallmark or from a different jeweller.\n\nAsk the jeweller to test the gold in your presence and explain the results. Do not rely solely on an old purchase bill or a verbal assurance about whether the jewellery is 22-karat, 18-karat or 14-karat.\n\nIf the jewellery carries a BIS hallmark , check its details, including the six-digit Hallmark Unique Identification (HUID), through the BIS Care app. However, a hallmark establishes the declared purity of the article; it does not guarantee the exchange price.\n\nThe Bureau of Indian Standards (BIS) also allows consumers to approach its recognised Assaying and Hallmarking Centres to get old gold jewellery tested on a chargeable basis. This can be useful if you are unsure about the jeweller's assessment.\n\nThe weight displayed on the weighing scale may not represent the amount of gold for which you will receive credit.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 10:01 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Equity Investments", "Alternative Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "The 2027 tax brackets are out. See what the standard deduction and SALT tax breaks will be.", "full_content": "The tax brackets at the heart of Americans\u2019 income-tax bills will be adjusting at a steeper level in 2027 compared to this year, underscoring inflation\u2019s rekindled presence.", "source": "MarketWatch Top Stories", "pub_date_str": "07 Nov 2026, 10:00 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Why the prognosis for healthcare stocks is uncertain ahead of Congress\u2019 new makeup", "full_content": "Healthcare stocks may struggle to gain momentum as Democrats prepare to take over Congress.\n\nJared Holz, who covers healthcare for Mizuho, says the outlook for the sector is uncertain because of likely gridlock between lawmakers.\n\n\"The next couple of years I really can't see too much happening,\" the firm's sector specialist told CNBC's \" Fast Money \" on Wednesday. \"I'm not sure you want to own everything, but you can pick and choose the names\u2026 Pharma is trading more expensive than tech for the first time in 20 years. So, I backed away from pharma. I would look at medtech.\"\n\nThe State Street Health Care Select ETF (XLV) jumped 3% a day after Election Day.\n\n\"You had this very weird situation where typically you wouldn't have all of these categories work in tandem, and they did . So, I think some things just a little bit off,\" said Holz, a day before healthcare got swept up in Thursday's Wall Street sell-off .\n\nAccording to Holz, healthcare's real booster shot may come if a Democrat wins the White House in 2028.\n\n\"Then I think you see some of the Trump strategies rolled back. That's where I think healthcare could actually perform well,\" said Holz, who added it hinges on Democrats retaining the Senate and House.\n\nFor investors who are long on healthcare, Holz said each subsector should be treated differently.", "source": "CNBC Finance", "pub_date_str": "07 Nov 2026, 09:32 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Got salary bonus this Diwali? 5 smart ways to strengthen your finances instead of spending it all - Top ideas to follow", "full_content": "Diwali often brings a welcome addition to the monthly salary in the form of a festive bonus, performance-linked payout or annual variable pay. With shopping offers, travel plans and family celebrations competing for attention, however, the additional money can disappear faster than expected.\n\nWhile there is nothing wrong with using part of the bonus to celebrate the festival, treating the entire payout as disposable income could mean missing an opportunity to improve your financial position.\n\nA Diwali bonus can help salaried individuals address gaps in their financial planning, prepare for large expenses and accelerate progress towards long-term goals. The key is to give the money a purpose before deciding how much to spend.\n\nBefore allocating the bonus, take stock of your existing finances. Check your savings, outstanding loans, monthly expenses and upcoming financial commitments.\n\nFor instance, someone who has been postponing an annual insurance premium, school fees or a planned home repair could use the bonus to meet these expenses without disturbing their monthly budget.\n\nIt is also important to check whether you have adequate liquidity to manage unexpected expenses. A financial cushion can help households deal with temporary income disruptions or emergencies without relying on expensive borrowing.\n\nThe Securities and Exchange Board of India (SEBI), through its investor education initiative, recommends budgeting, prioritising essential expenses and maintaining an emergency fund as part of sound money management.\n\nA salary bonus can also be an opportunity to review your insurance coverage, particularly if your financial responsibilities have increased.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 09:01 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Berkshire Hathaway more than doubles buybacks in third quarter as earnings decline", "full_content": "Berkshire Hathaway said Saturday it accelerated its share repurchases during the third quarter, as operating and overall profits took a hit.\n\nThe Greg Abel-led conglomerate bought back $9.6 billion worth of Berkshire stock. That's more than double the $4.5 billion repurchased in the second quarter and brings the company's total buybacks for 2026 to about $14.4 billion.\n\nThe sharp increase came as Berkshire's operating earnings \u2014 those from wholly-owned businesses \u2014 fell year over year, as profits from its insurance business pulled back.\n\nBerkshire operating profits totaled $12.705 billion, down 5.8% from $13.485 billion in the year-earlier period. Insurance underwriting tumbled 43% year on year to $1.352 billion, while insurance investment income declined 14% to $2.734 billion. Berkshire's railroad, energy and manufacturing businesses all saw earnings grow year over year.\n\nThe company's overall earnings, which include Berkshire's sprawling stock market portfolio, also dropped 28% in the third quarter to $22.112 billion from $30.796 billion a year prior. Investment gains for the company fell nearly 50% to $9.407 billion.\n\nDespite the earnings pullback, Berkshire stock has outperformed recently amid a massive rotation out of technology stocks. Class A shares are up more than 12% over the past month, while the S&P 500 has dropped 5.5% in that time. Year to date, Berkshire has gained 13%, while the broad market index is up just 7.8%.\n\nBerkshire's five largest equity holdings remained the same in the third quarter: Alphabet , American Express , Apple , Bank of America and Coca-Cola .\n\nBerkshire's cash hoard also grew 3% in the third quarter $377.435 billion from $365.514 billion in the second quarter. However, excluding rail and utility cash along with T-bill payables, the conglomerate's cash holdings totaled $352.3 billion, down 1.9% quarter over quarter.", "source": "CNBC Finance", "pub_date_str": "07 Nov 2026, 08:53 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments", "Portfolio Management"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Russia pounds power facilities around Kyiv, damages major bridge", "full_content": "Russian forces hammered energy infrastructure around Ukraine's capital with missiles and drones overnight, straining Kyiv's power supply and heating systems as temperatures headed towards zero, officials said on Saturday.\n\nThree days before Russia and Ukraine are due to take part in U.S.-brokered talks, explosions rocked Kyiv as Moscow unleashed waves of ballistic missiles, several of which hit and damaged the Northern Bridge across the Dnipro River, Mayor Vitali Klitschko said.\n\nStrikes on energy facilities outside Kyiv \u2014 including systems sending power from two nuclear plants to the city and Ukraine's central regions \u2014 caused serious damage, the energy ministry said.\n\n\"The capital is facing serious difficulties with its electricity, water, and heat supplies,\" President Volodymyr Zelenskyy said on X, adding that substations in five other regions were also hit.\n\nHe said only four of the 36 ballistic-type missiles launched by Russia had been intercepted, and that some were North Korean-made and hit an important energy facility.\n\nAt least two people were killed and around a dozen others wounded across Ukraine in the overnight attacks, which also damaged homes, businesses and non-residential buildings, authorities said.\n\nMoscow's defence ministry said it struck what it described as targets in Ukraine's military-industrial sector, as well as energy and transport infrastructure in and around Kyiv.\n\nUkraine also carried out drone and missile attacks on several Russian regions, causing minor damage but no casualties, Russian authorities said on Saturday.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 08:33 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "\u20b990 dividend per share: This stock announces 900% payout - Do you own? Payment, record date, returns", "full_content": "DIVIDEND Sharmila Bhadoria Published 7 Nov 2026, 08:23 PM IST Prefer Livemint on Google Dividend record date ahead: Shares of Bayer CropScience Limited will remain in focus next week due to the upcoming record date for its \u20b9 90 per equity share dividend payout. The company also announced its second quarter result for the financial year 2026-27.\n\nBayer CropScience Limited share price closed 0.45% higher on Friday, after seeing 1.64% jump over the last five trading sessions.\n\nThe company\u2019s board of directors, on Tuesday, November 3, announced an interim dividend of \u20b9 90 per equity share with a face value of \u20b9 10 each (ie 900% of the face value) for FY27. The board has also fixed record date to determine the eligibility of shareholders for the payout.\n\nThe board fixed Thursday, November 12, as the record date to determine the eligibility of shareholders for the payout. Which means that investors must own the stock before the record date to qualify for the payout.\n\nAs per the company\u2019s BSE filing, the board will disburse the dividend payout among investors by Monday, November 30, 2026.\n\nAlongside announcement of dividend, the company also reported a net profit of \u20b9 166.2 crore in the second quarter of FY27, against \u20b9 152.7 crore reported in the year ago period. Its net profit before tax (PBT) increased by 6% to \u20b9 211.4 crore during the quarter under review.\n\nThe stock closed 0.45% higher at \u20b9 3316.50 per share on BSE with a market capitalisation of \u20b9 14,905.04 crore on Friday. The stock has surged 1.64% in one week, but has declined 6.17% in one month, 21.32% in three months and around 30.29% in one year.\n\nCatch all the Business News , Market News , Breaking News Events, JIO IPO Listing Today LIVE and Latest News Updates on Live Mint. Download The Mint News App to get Daily Market Updates.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 08:23 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "America's newest small business owners with no employees are off to a hot start in AI era", "full_content": "It takes hundreds of billions of dollars for the tech giants to scale artificial intelligence, but it takes just a few AI tools for the smallest companies in the U.S. economy to get up and running with a cost-competitive business model.\n\nAlex Willen expects the 12 e-commerce brands he operates with no employees to generate between $2.5 million and $3 million this year. Kristin Ginn left Microsoft in March and started trnsfrmAItn, an AI-adoption consultancy. Seven months later, she has roughly $250,000 in business received or contracted through year-end with no employees or regular contractors.\n\n\"The biggest misconception is that it's just about individual productivity; it's actually about leveraging AI to perform tasks that previously required a whole team,\" said Stanford economist Erik Brynjolfsson.\n\nEarly research on the impact of AI within the solopreneur business world bears watching.\n\nAccording to Liya Palagashvili, a labor economist and director of the Labor Policy Project at George Mason University's Mercatus Center, new business formation is rising in direct correlation to applications unlikely to become employer firms.\n\nIn industries highly exposed to AI, business applications without early signs of hiring rose 26.8% from the first quarter of 2024 through the first quarter of 2026, from roughly 222,000 to 281,000 per quarter.\n\nOver the same period, applications in those industries with stronger indications of eventually becoming employer businesses fell 6.4%. In construction and wholesale trade, which Palagashvili used as a comparison group, non-employer-type applications declined 0.4%.\n\n\"What AI is doing is giving those capabilities directly into the hands of the individual,\" she said.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 08:15 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Quantitative Methods"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "What midterm election blue wave rebuke of Trump means for renewable energy", "full_content": "As recently as 2022, many leaders in corporate America and the investment community were singing the praises of ESG \u2014 environmental, social, governance \u2014 as the foundation of stakeholder capitalism. It didn't take long for that tune to change, for understandable reasons.\n\nPresident Trump didn't just make \"ESG\", \"sustainability\" and \"climate change\" dirty words in his \"green new scam\" rhetoric. The Trump administration's rollback of environmental regulations , elimination of clean energy subsidies and tax credits , defunding and halting of wind and solar projects, and embrace of the fossil fuels industry accelerated the backlash.\n\nBut renewable energy investing remains alive and well, notably among public and private funders of infrastructure projects and clean technology innovation. And following the midterm elections that gave climate-friendly Democrats control of the House and Senate, the prospects of reviving the clean energy agenda suddenly brightened.\n\nClean energy and solar stocks rallied the day after the election results, which \"potentially reduces the risk of further political interference with renewable energy incentives and provides greater protection for the long-term economics of U.S. wind, solar and battery storage investments,\" Barclays analysts led by Peter Crampton wrote in a note.\n\nWhile Trump can veto legislation to restore subsidies and credits and revive projects, and continue to issue executive orders on energy policy, some Republicans may be more inclined to help Democrats override the president in order to appeal to voters outraged over high energy prices \u2014 a sentiment expressed in the passage of multiple state initiatives to impede the build-out of electricity-hungry data centers.\n\nThe blue wave also shines a spotlight on a bipartisan permitting-reform bill awaiting Senate approval.", "source": "CNBC Top News", "pub_date_str": "07 Nov 2026, 08:03 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Alternative Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "From high-flying AI stocks to tariff-hit alcohol companies, the midterms shook up Wall Street - AP News", "full_content": "From high-flying AI stocks to tariff-hit alcohol companies, the midterms shook up Wall Street AP News These five stock groups could rally after Democrats' midterms sweep, analysts say CNBC Opinion | Politics Shakes Up the Markets WSJ Stock Market Faces a Worst-Case Scenario After Midterm Elections. History Says This Will Happen Next. Yahoo Finance What markets make of the midterms The Economist", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 08:02 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Equity Investments"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Q2 results race: Samvardhana Motherson vs Uno Minda - Which auto ancillary stock scores better? Revenue, profit, target", "full_content": "UNOMINDA Sharmila Bhadoria Published 7 Nov 2026, 07:52 PM IST Prefer Livemint on Google Samvardhana Motherson vs Uno Minda: Two of the most widely tracked auto ancillary firms, Uno Minda and Samvardhana Motherson International recently announced their second quarter results for the financial year 2026-27. While Samvardhana Motherson reported 42% year-on-year jump in its Q2 profit, later reported 36.6% annual jump in profit.\n\nHere is a detailed comparison of the Q2 results of the two companies for FY27, along with their target price post result announcement.\n\nSamvardhana Motherson \u2019s net profit increased by 42% on an annual basis to \u20b9 1,175.32 crore, on strong revenue growth. Its net profit stood at \u20b9 827 crore during the year-ago period. Uno Minda\u2019s net profit stood at \u20b9 440.81 crore in Q2FY27, up 36.6% from \u20b9 322.79 crore reported in the year-ago period.\n\nSamvardhana\u2019s total revenue from operations surged to \u20b9 38,279.85 crore, from \u20b9 30,172.97 crore last fiscal, during the second quarter under review, on a year-on-year basis. Uno Minda \u2019s net revenue increased by 38.2% to \u20b9 6,655.42 crore in the September quarter, up from \u20b9 4,814.03 crore in the year-ago period.\n\nMotilal Oswal increased its target price for Uno Minda to \u20b9 1560 per share, indicating a 17% upside potential in the auto ancillary stock. The brokerage also retained its \u2018Buy\u2019 rating for Samvardhana Motherson International with a revised target price of \u20b9 200 per share. The brokerage indicated a 19% upside potential.\n\nShares of Uno Minda closed 0.46% lower at \u20b9 1327.90 per share on BSE with a market capitalisation of \u20b9 76,681.79 crore on Friday. The auto ancillary stock has delivered 18.7% return in one month, and around 7.67% return in one year.\n\nSamvardhana Motherson share price closed 5.31% lower at \u20b9 158.60 per share on BSE on Friday.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 07:52 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Jim Cramer sends a strong signal to Nvidia stock investors - TheStreet", "full_content": "Jim Cramer sends a strong signal to Nvidia stock investors TheStreet A Retiree Who Bought 1,000 Nvidia Shares at $122 Just Watched Chips Have Their Worst Day Since 2020 Yahoo Finance Krispy Kreme Is Beating Nvidia, and That\u2019s Not Even the Chip Giant\u2019s Biggest Problem Gizmodo Stock Market Today, Nov. 5: Nvidia Slides on AI Chip Selloff as Election Uncertainty Weighs The Motley Fool Jim Cramer Says Nvidia Should Buy Shares on Thursday\u2019s 8% Drop: \u2018If the Cheapest Asset is Your Stock, You Benzinga", "source": "Google News Business", "pub_date_str": "07 Nov 2026, 07:47 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Dividend dhamaka: 4 high yield stocks from brokerages' Diwali stock picks for Samvat 2083- Annual return, target price", "full_content": "BPCL, Canara Bank, Hero MotoCorp and HCL Tech reported annual dividend yields of 2.72%, 3.02%, 3.47% and 3.96%, respectively. Their dividend payments over the past year ranged from \u20b94.20 per share at Canara Bank to \u20b9187 at Hero MotoCorp.", "source": "LiveMint Markets", "pub_date_str": "07 Nov 2026, 07:16 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Corporate Issuers", "Fixed Income"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Meghalaya HC denies pension to ex-Assam Rifles rifleman, says voluntary discharge leads to forfeiture of past service", "full_content": "The court clarified that an employee cannot claim pensionary benefits under Rule 49(2) merely because he has completed 10 years of qualifying service if Rule 26(1), which provides for forfeiture of past service upon resignation, applies to his case", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 07:09 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Democrat shaping AI policy bought chip stocks despite backing congressional trading ban", "full_content": "Rep. Josh Gottheimer disclosed new AI-linked stock purchases months after voting for a congressional trading ban, as Democrats prepare to regulate the industry.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 07:00 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Looking to invest in international funds? Only one scheme remains open for new investors amid fresh subscription curbs", "full_content": "Indian investors seeking overseas exposure through mutual funds have limited choices, with only one scheme accepting fresh SIPs. Three other international funds have suspended new investments and paused existing SIP instalments. Here's what investors should know.", "source": "LiveMint Money", "pub_date_str": "07 Nov 2026, 06:40 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "Anthropic IPO meets AI backlash after midterms show stinging rebuke of data centers", "full_content": "Anthropic is poised to become the first pure-play AI company to hit the public market at a time when the public is increasingly leary of the industry.", "source": "CNBC World Economy", "pub_date_str": "07 Nov 2026, 06:30 PM IST", "pub_date_relative": "5h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (c     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
