ull_content": "Retiring with an ongoing home loan can be difficult. It can force borrowers to make a difficult choice: Should you use a portion of your retirement savings to become debt-free, or continue paying the equated monthly instalments (EMIs) and preserve your corpus?\n\nNow, there is no universal answer to this question. While making repayments on the pending home loan can help reduce applicable interest costs and remove a fixed monthly obligation, utilising too much of the available retirement corpus can also create financial stress and challenges later on. This is because such a strategy can also expose an individual and their family to sudden medical emergencies and other essential needs.\n\nTherefore, the key to tackling such situations is to avoid exhausting retirement savings simply to close out a home loan. Borrowers should focus on first analysing their outstanding principal, remaining tenure, interest rate, monthly cash flow needs, and the amount that they need to fund expenses after retirement.\n\nSarosh Amaria, MD, Tata Capital Housing Finance Limited, explained this in detail, stating, \u201cIn an ideal situation, using your retirement savings to pay off a home loan at age 60 is generally not recommended unless your remaining corpus is large enough to comfortably cover both the payoff and future expenses. While it may eliminate monthly EMI stress and reduce total interest outflow, it leaves no time to rebuild your depleted savings and eventually impacts the financial stability for the rest of the time.", "source": "LiveMint Money", "pub_date_str": "27 Sep 2026, 06:32 AM IST", "pub_date_relative": "32m ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Niti Aayog to review export SOPs amid evolving global trade order", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI Ca icter policies meant to fuel electric vehicle adoption.\n\nSince the Corporate Average Fuel Economy, or CAFE, standards were established in 1975, they have been periodically updated, typically to make vehicles more efficient. Under former President Joe Biden's standards , automakers would have had to increase the fuel efficiency of their passenger cars and light trucks to roughly 50 miles per gallon by 2031. The stricter standards were designed to incentivize electric vehicle production and sales in the U.S.\n\nTrump presented the policy change as a boon for both automakers and consumers, though the final standards have not yet been publicly detailed.\n\n\"These new Standards will take the waste out of building cars in America. That means LOWER PRICES, saving families thousands on a new, beautiful, and safe car \u2014 Far better than the Environmental Monsters that we were building heretofore,\" he wrote in the Truth Social post . \"Every Manufacturer, from General Motors to Ford to Stellantis, has called me wanting to build here, and now they can!\"\n\nThe regulatory change would fulfill a campaign promise from Trump to rescind policies that encouraged or incentivized electric vehicles.\n\nIt is unclear what the final fuel economy standards will be, although Transportation Secretary Sean Duffy previously said that they would be sharply lower than the Biden-era policies.\n\nWeaker fuel economy standards mean that automakers can produce more pickup trucks and SUVs, which are much more profitable than smaller cars but have worse gas mileage. Electric vehicles also become much less attractive to automakers, although some companies, like General Motors , have said that they will still make them.", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 02:51 AM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Rate Market Fear Gauge Is Warning for Corporates: Credit Weekly", "full_content": "Corporate bonds have been relatively resilient amid a global government bond selloff, but the strength may not last.\n\nBond market volatility, a measure of uncertainty about the direction of bond yields, is spiking. Historically, that has foreshadowed trouble for corporate debt, as nervous retail investors and others pull money from the market.\n\nFor now, company profits are strong and higher overall corporate bond yields in part reflect solid economic growth. But, as inflationary pressure builds, the Federal Reserve is boosting rates to slow that growth. Over time, higher rates can hurt the economy and squeeze profits, and corporate bonds are already priced with little margin for error, said Kelly Kowalski, head of investment strategy at MassMutual.\n\n\u201cThe longer yields are elevated and volatile, the more restrictive financial conditions become and the more they weigh on economic activity, corporate margins, and credit quality,\u201d Kowalski said.\n\nThe result may be that company bonds eventually underperform government debt, which would boost the extra yield relative to Treasuries that companies pay to borrow, a difference known as the spread. JPMorgan Chase & Co. strategists including Nathaniel Rosenbaum estimated this week that US high-grade corporate bond spreads should be about 0.07 percentage point wider than they are now based on historical measures of bond and stock market volatility.\n\nYields across bond markets have broadly jumped in the last month as oil prices have climbed and inflation fears have risen. Most benchmark US Treasuries now have yields above 5%, with five-year yields climbing above that threshold for the first time since 2007.\n\nCorporate bonds have largely shrugged off these moves. US high-grade spreads were 77 basis points on Thursday, two basis points tighter than their levels at the start of the month.", "source": "LiveMint Markets", "pub_date_str": "27 Sep 2026, 01:04 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Here's exactly what Paramount promised Hollywood to land WBD \u2014 and why some are still skeptical", "full_content": "A new movie every 11 days? That's what Paramount's David Ellison is promising after clearing a path this week for his company's acquisition of Warner Bros. Discovery , combining two storied Hollywood studios.\n\nThe CEO's settlement with a group of state attorneys general over antitrust concerns stipulates that the newly minted company will release at least 30 films into theaters in 2027 and 2028 and at least 32 films in 2029, 2030 and 2031.\n\nCurrently, the combined entity has 35 films scheduled for release next year, according to data from Rentrak.\n\nBut questions remain about what caliber of releases the industry can expect \u2014 and what happens after the five-year agreement expires.\n\n\"This is much more complicated than simply asking whether 30 movies is enough,\" Paul Dergarabedian, head of marketplace trends at Rentrak, told CNBC. \"Thirty wide releases would represent a meaningful commitment to theatrical, and I think everyone in exhibition would welcome a robust pipeline of films.\n\n\"But ultimately the proof will be in how those movies perform, how varied the slate is, how consistently they reach theaters and how the combined company executes on those commitments,\" he said.\n\nHollywood has been clamoring for more theatrical titles since the Covid pandemic shuttered theaters and clogged the production pipeline. Ellison's theatrical commitment, which he touted as early as April at the industry's annual CinemaCon event, had garnered approval from the CEOs of the \"Big Three\" cinema operators \u2014 AMC's Adam Aron, Cinemark's Sean Gamble and Regal's Eduardo Acuna \u2014 even before Paramount's settlement.\n\nCinema United, the lobbying group that represents theater owners, had been staunchly against the merger, but gave its seal of approval this week, saying the agreement with the states \"accomplishes many of exhibition's objectives.\"", "source": "CNBC Top News", "pub_date_str": "27 Sep 2026, 12:53 AM IST", "pub_date_relative": "6h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "From $6 eggs to $50,000 cars, these charts show how inflation has defined the past 5 years", "full_content": "Rising prices have been crushing consumer confidence and biting at Americans\u2019 wallets for more than five years now.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 11:24 PM IST", "pub_date_relative": "7h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "A 10% risk-free yield? For some, yes.", "full_content": "This could be a bargain, especially for very high earners and those in high-tax locations.", "source": "MarketWatch Top Stories", "pub_date_str": "26 Sep 2026, 10:21 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Fixed Income"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Larry Ellison, Oracle's Co-CEOs Got Nearly $1 Billion In Stock Options: What Went Wrong?", "full_content": "Oracle's top executives received nearly $1 billion in options, but the awards were underwater by the end of fiscal 2026.", "source": "NDTV Profit", "pub_date_str": "26 Sep 2026, 10:09 PM IST", "pub_date_relative": "8h ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Meta and Microsoft led tech sto     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
