    const allData = {"general": [{"title": "G20 finance meeting live updates: Bessent, Warsh to give remarks", "full_content": "Treasury Secretary Scott Bessent and Federal Reserve Chairman Kevin Warsh are set to deliver remarks to kick off Monday's gathering of the Group of 20 finance ministers in Asheville, North Carolina.\n\nThe meeting of international finance leaders, central bank governors and other top officials comes at a precarious time for the world economy, as President Donald Trump 's war in Iran, ballooning U.S. debt and persistent inflation woes have stoked global uncertainty.\n\nThe two-day meeting has attracted numerous high-profile CEOs, including Jamie Dimon of JPMorgan Chase and Goldman Sachs ' David Solomon , who are both set to speak later Monday.\n\nCNBC is reporting on the G20 meeting from Asheville, New York City, Washington, D.C., and Englewood Cliffs, N.J.\n\nBessent thanked the European Union \"for their very fulsome, fulsome support for Operation Economic Outcast\" as he arrived at the G20 meeting.\n\n\"They made it known today in the strongest terms that they supported\" the plan, which aims to strangle Iran's economy by targeting its international \"enablers\" with secondary sanctions, Bessent said.\n\nThe European Commission said in a statement overnight that it \"welcomes efforts at ensuring that Iran ceases its destabilising activities and engages in peace negotiations with good faith.\"\n\nThe commission said it supports efforts to achieve that goal \"through additional economic pressure, including through the US led Operation Economic Outcast.\"", "source": "CNBC Top News", "pub_date_str": "31 Aug 2026, 07:00 PM IST", "pub_date_relative": "just now"}, {"title": "Chewy vs. Shopify: Stable Patterns vs. Rapid Acceleration in Quarterly Revenue", "full_content": "Skip to navigation Skip to main content Skip to right column Chewy vs. Shopify: Stable Patterns vs. Rapid Acceleration in Quarterly Revenue John Ballard, The Motley Fool Mon, August 31, 2026 at 8:15 AM CDT 4 min read CHWY SHOP Chewy: Maintaining Steady Revenue Increments Over the Past Year Chewy (NYSE:CHWY) primarily generates revenue by acting as an online retailer that sells roughly 100,000 unique items--including food, treats, prescribed medications, and everyday wellness supplies for domestic companion animals--supplied by thousands of partner brands across the United States.\n\nWhile simultaneously expanding its physical veterinary care practices into new locations and launching a consolidated private-label brand identity for pet essentials, it reported an operating margin of approximately 4.2% for the quarter ended May 3, 2026.\n\nShopify (NASDAQ:SHOP) primarily generates revenue by providing software and related commercial services across multiple international regions, enabling global merchants to set up digital storefronts, manage physical inventory, process payments, and coordinate shipping logistics.\n\nIt recently authorized an additional $3 billion for share repurchases and experienced intermittent service disruptions over the summer, while concurrently reporting an operating margin of approximately 17% for the quarter ended June 30, 2026.\n\nRevenue here refers to the standardized income-statement revenue line item. This is the most fundamental measure of a company's performance. It serves as a practical gauge of the total incoming money a business generates from its daily operations during a specific quarter before accounting for any subsequent operating costs or taxes.\n\nThe relative performance of these companies' revenue largely reflects each company's addressable market. Chewy is seeing steady, but slower revenue growth in the $150 billion pet industry .", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:45 PM IST", "pub_date_relative": "16m ago"}, {"title": "OpenAI advertising business passes $1 billion in annual revenue", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:44 PM IST", "pub_date_relative": "17m ago"}, {"title": "REIT ETF Investing in 2026: Going Global With REET vs. SCHH's U.S. Focus", "full_content": "Skip to navigation Skip to main content Skip to right column REIT ETF Investing in 2026: Going Global With REET vs. SCHH's U.S. Focus Sarah Sidlow, The Motley Fool Mon, August 31, 2026 at 8:14 AM CDT 5 min read ^GSPC Schwab U.S. REIT ETF (NYSEMKT:SCHH) provides low-cost, concentrated exposure to domestic real estate, while iShares Global REIT ETF (NYSEMKT:REET) offers a broader, international portfolio with a higher historical distribution yield.\n\nReal estate investment trusts (REITs) allow investors to gain exposure to income-producing property without the burdens of direct management. While both funds share a sector focus, their geographic boundaries and fee structures create distinct paths for those seeking either pure domestic exposure or global diversification.\n\nBeta measures price volatility relative to the S&P 500; beta is calculated from monthly returns over the available fund history (up to five years). The 1-yr return represents total return over the trailing 12 months. Dividend yield is the trailing-12-month distribution yield.\n\nThe Schwab fund is the more affordable option with an expense ratio of 0.07%, which is half the cost of the iShares fund. However, income-seeking investors may find the higher payout from the iShares fund more appealing.\n\nThe Schwab U.S. REIT ETF focuses exclusively on the domestic market, holding 120 positions entirely within the real estate sector. Its largest positions include Welltower at 11.07%, Prologis at 8.81%, and Digital Realty Trust at 4.63%. It was launched in 2011. Schwab U.S. REIT ETF has paid $0.66 per share over the trailing 12 months, which on its recent ~$23.85 share price works out to a 2.8% yield.\n\nThe iShares Global REIT ETF provides a much wider net with 316 holdings across developed and emerging markets. Its portfolio is also 100% real estate, and its top holdings include Welltower at 9.14%, Prologis at 7.28%, and Equinix (NASDAQ:EQIX) at 5.63%. It was launched in 2014.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:44 PM IST", "pub_date_relative": "17m ago"}, {"title": "Wall Street analysts bullish on Attovia as itch drug data fuel biotech optimism", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:43 PM IST", "pub_date_relative": "18m ago"}, {"title": "Coinbase and Webull expand crypto partnership to Canada", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:43 PM IST", "pub_date_relative": "18m ago"}, {"title": "Stock Market prediction tomorrow, September 1: What will happen to Sensex, Nifty, Bank Nifty, KOSPI, Nikkei on Tuesday?", "full_content": "Asian equities mostly ended the final trading session of August lower as sentiment weakened following the latest escalation in Middle East tensions, with crude oil prices jumping sharply.\n\nAdding to the cautious mood, global bond yields climbed to multi-year highs as investors braced for the possibility of a rate hike by the US Federal Reserve following comments on Friday by Fed Chairman Kevin Warsh about bringing down inflation despite possible short-term pain for the economy.\n\nJapan\u2019s benchmark Nikkei 225 fell 0.14% to 66,311, while Australia\u2019s S&P/ASX 200 slipped 0.18% to 9,076. South Korea\u2019s Kospi, however, bucked the broader trend and jumped 0.46% to 6,820.\n\nHong Kong\u2019s Hang Seng closed with marginal losses at 25,566, while the Shanghai Composite edged up 0.86% to 3,986.\n\nIn the domestic market, the frontline indices remained under pressure throughout the session. Despite multiple attempts to recover from the day\u2019s lows, buying momentum failed to sustain, with the Nifty 50 eventually settling 0.39% lower at 24,080. The Sensex also lost 0.40% to close at 76,957.\n\nThe weakness also dragged down the benchmarks\u2019 monthly performance, with both er. Five years of overshoot sets a bad track record.\n\nThe underlying inflation data supports his concern. Core PCE, the Fed's preferred gauge, sat at an index value of 130.66 in July 2026, the high in the supplied series and in the 91.7 percentile of recent readings. The Fed's 2% inflation target remains its official yardstick.\n\n\"If inflation does not improve, and I don't think it's going to improve significantly enough, they should confront the reality and be ready to move rates. Otherwise, there's a real possibility of some loss of credibility, \" Ferguson said.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:42 PM IST", "pub_date_relative": "19m ago"}, {"title": "Tim Cook wasn\u2019t a \u2018product guy\u2019 \u2014 so he re-engineered Apple instead", "full_content": "Dismissed as \u201cnot a product guy,\u201d the outgoing CEO proved that supply-chain mastery could take Apple to new heights.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Aug 2026, 06:42 PM IST", "pub_date_relative": "19m ago"}, {"title": "Deepa Jewellers IPO: Price band, lot size, GMP, listing date and other key details of \u20b9460 crore issue", "full_content": "Deepa Jewellers IPO : The initial public offering (IPO) of Deepa Jewellers is set to open on Tuesday, September 1. The issue comprises a fresh issue and an offer for sale (OFS).\n\nThe company proposes to utilise the proceeds from the fresh issue towards funding its long-term working capital requirements, including the procurement, maintenance and expansion of inventory, as well as for general corporate purposes.\n\n1. Deepa Jewellers IPO date : The issue will open for subscription on Tuesday, September 01, and will remain open until Thursday, September 03.\n\n2. Deepa Jewellers IPO price : The price band for the IPO has been fixed at \u20b9 168\u2013 \u20b9 177 per equity share.\n\n3. Deepa Jewellers IPO size : The company aims to raise \u20b9 459.72 crore through the IPO, which comprises a fresh issue of 1.41 crore shares aggregating to \u20b9 250 crore and an offer for sale of 1.18 crore shares aggregating to \u20b9 209.72 crore.\n\nAs part of the OFS, promoter Satwani Holdings LLP and investors Rosewood Investments and India Business Excellence Fund-III will offload shares. The proceeds from the fresh issue will be used for debt repayment and general corporate purposes.\n\n4. Deepa Jewellers IPO lot size : The IPO lot size has been fixed at 84 shares, requiring a minimum investment of \u20b9 14,868 for retail investors.\n\n5. Deepa Jewellers IPO reservation : The IPO has reserved up to 50% of the net offer for qualified institutional buyers (QIBs), at least 15% for non-institutional investors (NIIs), and at least 35% for retail investors.", "source": "LiveMint Markets", "pub_date_str": "31 Aug 2026, 06:41 PM IST", "pub_date_relative": "19m ago"}, {"title": "U.S., Iran exchange strikes for first time since July as Trump threatens strategic oil hub", "full_content": "The U.S. and Iran have traded strikes for the first time in over a month, marking a major escalation in the conflict and renewing fears of further hostilities.\n\nIran's Revolutionary Guard on Monday said it launched an attack on two U.S. bases in Jordan in response to a U.S. strike on Larak Island over the weekend, Iranian media reported .\n\nAmerican forces hit two Iranian rocket launchers on Larak Island on Sunday after the military said the Guard was preparing rockets carrying sea mines for launch into the Strait of Hormuz, U.S. Central Command confirmed to MS NOW.\n\nLarak, a small Iranian island in the Strait of Hormuz, has become a key military and shipping control point for Tehran, used by the Guard to monitor vessel traffic through one of the world's most important maritime routes.\n\n\"Earlier today U.S. forces struck two Iranian launchers on Larak Island. Islamic Revolutionary Guard Corps forces were observed preparing to launch rockets with sea mines into the Strait of Hormuz,\" Navy Capt. Tim Hawkins, a U.S. Central Command spokesperson, said in a statement.\n\n\"Last week, CENTCOM completed clearing sea mines from the strait's international shipping routes. U.S. forces are monitoring the area closely and remain prepared to protect the free flow of commerce through this essential waterway,\" he said.\n\nSunday's attack was the first publicly acknowledged U.S. strike on Iranian positions since late July. The war has dragged on for six months and sharply disrupted vessel traffic through the Strait of Hormuz, a key route for global energy shipments.\n\nThe latest flare-up in military action prompted oil prices to climb above $90 a barrel, as energy market participants monitored the prospect of renewed supply risks in the Middle East.", "source": "CNBC Top News", "pub_date_str": "31 Aug 2026, 06:40 PM IST", "pub_date_relative": "20m ago"}, {"title": "America is asking the wrong question about its $40 trillion in debt, this MIT expert warns", "full_content": "The federal debt may be sustainable, but rising burdens may still be troublesome to the U.S. economy, says one expert.", "source": "MarketWatch Top Stories", "pub_date_str": "31 Aug 2026, 06:40 PM IST", "pub_date_relative": "21m ago"}, {"title": "Raymond James initiates River City Bank stock with outperform rating", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:38 PM IST", "pub_date_relative": "22m ago"}, {"title": "Fortinet launches free cybersecurity curriculum for U.S. high schools", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:38 PM IST", "pub_date_relative": "22m ago"}, {"title": "Cyabra secures Fortune Global 500 food and beverage client", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:38 PM IST", "pub_date_relative": "22m ago"}, {"title": "rhode expands to Sephora stores across 19 European countries", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:38 PM IST", "pub_date_relative": "22m ago"}, {"title": "Sunshine Biopharma receives Canadian approval for atenolol tablets", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:38 PM IST", "pub_date_relative": "22m ago"}, {"title": "Stellantis names new chief communications officer", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:38 PM IST", "pub_date_relative": "22m ago"}, {"title": "rocket companies names alessio sanfilippo as redfin CEO", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:38 PM IST", "pub_date_relative": "22m ago"}, {"title": "Writing a will online and its hidden risks: Why the cheap and fast option isn\u2019t for everyone", "full_content": "Public understanding regarding the necessity of creating a will continues to lag, even with the severe legal and financial hurdles that occur when someone passes intestate. When a household's primary earner dies suddenly, surviving family members often face immense challenges in tracking down and claiming assets scattered across various investment portfolios, bank deposits, insurance claims, and property holdings.\n\nAs familiarity with legacy planning grows, web-based services like Yellow , Aasan Will , KustodianLife, and No Grey are stepping in to streamline document creation. Gaining clarity on how these services function, the prices they charge, and their potential constraints helps individuals evaluate whether a digital solution fits their specific estate needs.\n\nMost online platforms provide a basic do-it-yourself (DIY) option at the lowest cost. Users generally have to enter personal information, including their name and address, details of family members and dependents, information about the executor and witnesses, and, crucially, details of their assets and how they want those assets distributed.\n\nUsing the information provided, the platform generates the will, generally in PDF format. The user must then download and print the document and sign it in the presence of two witnesses. The witnesses must also sign the will. Simply applying a digital signature does not make a will legally valid. Physical execution of the document remains an important requirement.\n\nHowever, the convenience of a DIY will can also be its biggest drawback.\n\nExperts said the DIY route may be suitable for individuals with relatively simple assets and straightforward distribution plans. However, professional assistance may be advisable when the financial or family situation is more complex. Circumstances such as divorce, remarriage, ownership of multiple properties or being an NRI can make expert guidance particularly useful.\n\nAssisted services are available in several formats.", "source": "LiveMint Money", "pub_date_str": "31 Aug 2026, 06:37 PM IST", "pub_date_relative": "23m ago"}], "cfa": [{"title": "G20 finance meeting live updates: Bessent, Warsh to give remarks", "full_content": "Treasury Secretary Scott Bessent and Federal Reserve Chairman Kevin Warsh are set to deliver remarks to kick off Monday's gathering of the Group of 20 finance ministers in Asheville, North Carolina.\n\nThe meeting of international finance leaders, central bank governors and other top officials comes at a precarious time for the world economy, as President Donald Trump 's war in Iran, ballooning U.S. debt and persistent inflation woes have stoked global uncertainty.\n\nThe two-day meeting has attracted numerous high-profile CEOs, including Jamie Dimon of JPMorgan Chase and Goldman Sachs ' David Solomon , who are both set to speak later Monday.\n\nCNBC is reporting on the G20 meeting from Asheville, New York City, Washington, D.C., and Englewood Cliffs, N.J.\n\nBessent thanked the European Union \"for their very fulsome, fulsome support for Operation Economic Outcast\" as he arrived at the G20 meeting.\n\n\"They made it known today in the strongest terms that they supported\" the plan, which aims to strangle Iran's economy by targeting its international \"enablers\" with secondary sanctions, Bessent said.\n\nThe European Commission said in a statement overnight that it \"welcomes efforts at ensuring that Iran ceases its destabilising activities and engages in peace negotiations with good faith.\"\n\nThe commission said it supports efforts to achieve that goal \"through additional economic pressure, including through the US led Operation Economic Outcast.\"", "source": "CNBC Top News", "pub_date_str": "31 Aug 2026, 07:00 PM IST", "pub_date_relative": "just now", "cfa_topics": ["Economics", "Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Chewy vs. Shopify: Stable Patterns vs. Rapid Acceleration in Quarterly Revenue", "full_content": "Skip to navigation Skip to main content Skip to right column Chewy vs. Shopify: Stable Patterns vs. Rapid Acceleration in Quarterly Revenue John Ballard, The Motley Fool Mon, August 31, 2026 at 8:15 AM CDT 4 min read CHWY SHOP Chewy: Maintaining Steady Revenue Increments Over the Past Year Chewy (NYSE:CHWY) primarily generates revenue by acting as an online retailer that sells roughly 100,000 unique items--including food, treats, prescribed medications, and everyday wellness supplies for domestic companion animals--supplied by thousands of partner brands across the United States.\n\nWhile simultaneously expanding its physical veterinary care practices into new locations and launching a consolidated private-label brand identity for pet essentials, it reported an operating margin of approximately 4.2% for the quarter ended May 3, 2026.\n\nShopify (NASDAQ:SHOP) primarily generates revenue by providing software and related commercial services across multiple international regions, enabling global merchants to set up digital storefronts, manage physical inventory, process payments, and coordinate shipping logistics.\n\nIt recently authorized an additional $3 billion for share repurchases and experienced intermittent service disruptions over the summer, while concurrently reporting an operating margin of approximately 17% for the quarter ended June 30, 2026.\n\nRevenue here refers to the standardized income-statement revenue line item. This is the most fundamental measure of a company's performance. It serves as a practical gauge of the total incoming money a business generates from its daily operations during a specific quarter before accounting for any subsequent operating costs or taxes.\n\nThe relative performance of these companies' revenue largely reflects each company's addressable market. Chewy is seeing steady, but slower revenue growth in the $150 billion pet industry .", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:45 PM IST", "pub_date_relative": "16m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI advertising business passes $1 billion in annual revenue", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:44 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "REIT ETF Investing in 2026: Going Global With REET vs. SCHH's U.S. Focus", "full_content": "Skip to navigation Skip to main content Skip to right column REIT ETF Investing in 2026: Going Global With REET vs. SCHH's U.S. Focus Sarah Sidlow, The Motley Fool Mon, August 31, 2026 at 8:14 AM CDT 5 min read ^GSPC Schwab U.S. REIT ETF (NYSEMKT:SCHH) provides low-cost, concentrated exposure to domestic real estate, while iShares Global REIT ETF (NYSEMKT:REET) offers a broader, international portfolio with a higher historical distribution yield.\n\nReal estate investment trusts (REITs) allow investors to gain exposure to income-producing property without the burdens of direct management. While both funds share a sector focus, their geographic boundaries and fee structures create distinct paths for those seeking either pure domestic exposure or global diversification.\n\nBeta measures price volatility relative to the S&P 500; beta is calculated from monthly returns over the available fund history (up to five years). The 1-yr return represents total return over the trailing 12 months. Dividend yield is the trailing-12-month distribution yield.\n\nThe Schwab fund is the more affordable option with an expense ratio of 0.07%, which is half the cost of the iShares fund. However, income-seeking investors may find the higher payout from the iShares fund more appealing.\n\nThe Schwab U.S. REIT ETF focuses exclusively on the domestic market, holding 120 positions entirely within the real estate sector. Its largest positions include Welltower at 11.07%, Prologis at 8.81%, and Digital Realty Trust at 4.63%. It was launched in 2011. Schwab U.S. REIT ETF has paid $0.66 per share over the trailing 12 months, which on its recent ~$23.85 share price works out to a 2.8% yield.\n\nThe iShares Global REIT ETF provides a much wider net with 316 holdings across developed and emerging markets. Its portfolio is also 100% real estate, and its top holdings include Welltower at 9.14%, Prologis at 7.28%, and Equinix (NASDAQ:EQIX) at 5.63%. It was launched in 2014.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:44 PM IST", "pub_date_relative": "17m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Coinbase and Webull expand crypto partnership to Canada", "full_content": "", "source": "Investing.com News", "pub_date_str": "31 Aug 2026, 06:43 PM IST", "pub_date_relative": "18m ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Stock Market prediction tomorrow, September 1: What will happen to Sensex, Nifty, Bank Nifty, KOSPI, Nikkei on Tuesday?", "full_content": "Asian equities mostly ended the final trading session of August lower as sentiment weakened following the latest escalation in Middle East tensions, with crude oil prices jumping sharply.\n\nAdding to the cautious mood, global bond yields climbed to multi-year highs as investors braced for the possibility of a rate hike by the US Federal Reserve following comments on Friday by Fed Chairman Kevin Warsh about bringing down inflation despite possible short-term pain for the economy.\n\nJapan\u2019s benchmark Nikkei 225 fell 0.14% to 66,311, while Australia\u2019s S&P/ASX 200 slipped 0.18% to 9,076. South Korea\u2019s Kospi, however, bucked the broader trend and jumped 0.46% to 6,820.\n\nHong Kong\u2019s Hang Seng closed with marginal losses at 25,566, while the Shanghai Composite edged up 0.86% to 3,986.\n\nIn the domestic market, the frontline indices remained under pressure throughout the session. Despite multiple attempts to recover from the day\u2019s lows, buying momentum failed to sustain, with the Nifty 50 eventually settling 0.39% lower at 24,080. The Sensex also lost 0.40% to close at 76,957.\n\nThe weakness also dragged down the benchmarks\u2019 monthly performance, with both indices wrapping up August with losses of more than 1.40%, snapping their two-month winning run. Meanwhile, the broader markets remained mixed, with the Nifty Midcap 100 gaining 0.24%, while the Nifty Smallcap 100 fell sharply by 0.74%.\n\nConcerns over crude oil prices remained at the forefront after oil surged more than 3% following the US strike on Sunday, which ended a lull in fighting in the war that has now lasted for more than six months.", "source": "LiveMint Markets", "pub_date_str": "31 Aug 2026, 06:42 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Former Fed Vice Chair Predicts 2 Rate Hikes After Fed \u201cMissed the Inflation Target for Roughly Five Years\u201d", "full_content": "Skip to navigation Skip to main content Skip to right column Former Fed Vice Chair Predicts 2 Rate Hikes After Fed \u201cMissed the Inflation Target for Roughly Five Years\u201d Thomas Richmond Mon, August 31, 2026 at 8:12 AM CDT 4 min read Quick Read Ferguson expects two rate hikes before early next year, warning five years of missed inflation targets threaten the Fed's credibility.\n\nFerguson dismisses Warsh's balance sheet hints as ineffective and warns Treasury interference is distorting the bond market signals guiding policy.\n\nConsumer sentiment sits at 49.5, below the 60 recessionary threshold, making Ferguson the hawkish outlier against El-Erian and JPMorgan expecting dovish guidance.\n\nDon't wait: the analyst who called NVIDIA in 2010 just revealed his top 10 AI stocks. See the full list FREE now .\n\nFormer Federal Reserve Vice Chairman Roger Ferguson expects two interest rate hikes across the rest of 2026 and early 2027, warning that persistent inflation could damage the central bank's credibility if officials fail to act. His forecast is more hawkish than those of observers expecting only one increase.\n\n\"Inflation has been sticky for too long. They've missed the inflation target for roughly five years, \" he said, pointing to core CPI around 2.5% or higher. Five years of overshoot sets a bad track record.\n\nThe underlying inflation data supports his concern. Core PCE, the Fed's preferred gauge, sat at an index value of 130.66 in July 2026, the high in the supplied series and in the 91.7 percentile of recent readings. The Fed's 2% inflation target remains its official yardstick.\n\n\"If inflation does not improve, and I don't think it's going to improve significantly enough, they should confront the reality and be ready to move rates. Otherwise, there's a real possibility of some loss of credibility, \" Ferguson said.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:42 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Fixed Income"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Deepa Jewellers IPO: Price band, lot size, GMP, listing date and other key details of \u20b9460 crore issue", "full_content": "Deepa Jewellers IPO : The initial public offering (IPO) of Deepa Jewellers is set to open on Tuesday, September 1. The issue comprises a fresh issue and an offer for sale (OFS).\n\nThe company proposes to utilise the proceeds from the fresh issue towards funding its long-term working capital requirements, including the procurement, maintenance and expansion of inventory, as well as for general corporate purposes.\n\n1. Deepa Jewellers IPO date : The issue will open for subscription on Tuesday, September 01, and will remain open until Thursday, September 03.\n\n2. Deepa Jewellers IPO price : The price band for the IPO has been fixed at \u20b9 168\u2013 \u20b9 177 per equity share.\n\n3. Deepa Jewellers IPO size : The company aims to raise \u20b9 459.72 crore through the IPO, which comprises a fresh issue of 1.41 crore shares aggregating to \u20b9 250 crore and an offer for sale of 1.18 crore shares aggregating to \u20b9 209.72 crore.\n\nAs part of the OFS, promoter Satwani Holdings LLP and investors Rosewood Investments and India Business Excellence Fund-III will offload shares. The proceeds from the fresh issue will be used for debt repayment and general corporate purposes.\n\n4. Deepa Jewellers IPO lot size : The IPO lot size has been fixed at 84 shares, requiring a minimum investment of \u20b9 14,868 for retail investors.\n\n5. Deepa Jewellers IPO reservation : The IPO has reserved up to 50% of the net offer for qualified institutional buyers (QIBs), at least 15% for non-institutional investors (NIIs), and at least 35% for retail investors.", "source": "LiveMint Markets", "pub_date_str": "31 Aug 2026, 06:41 PM IST", "pub_date_relative": "19m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Writing a will online and its hidden risks: Why the cheap and fast option isn\u2019t for everyone", "full_content": "Public understanding regarding the necessity of creating a will continues to lag, even with the severe legal and financial hurdles that occur when someone passes intestate. When a household's primary earner dies suddenly, surviving family members often face immense challenges in tracking down and claiming assets scattered across various investment portfolios, bank deposits, insurance claims, and property holdings.\n\nAs familiarity with legacy planning grows, web-based services like Yellow , Aasan Will , KustodianLife, and No Grey are stepping in to streamline document creation. Gaining clarity on how these services function, the prices they charge, and their potential constraints helps individuals evaluate whether a digital solution fits their specific estate needs.\n\nMost online platforms provide a basic do-it-yourself (DIY) option at the lowest cost. Users generally have to enter personal information, including their name and address, details of family members and dependents, information about the executor and witnesses, and, crucially, details of their assets and how they want those assets distributed.\n\nUsing the information provided, the platform generates the will, generally in PDF format. The user must then download and print the document and sign it in the presence of two witnesses. The witnesses must also sign the will. Simply applying a digital signature does not make a will legally valid. Physical execution of the document remains an important requirement.\n\nHowever, the convenience of a DIY will can also be its biggest drawback.\n\nExperts said the DIY route may be suitable for individuals with relatively simple assets and straightforward distribution plans. However, professional assistance may be advisable when the financial or family situation is more complex. Circumstances such as divorce, remarriage, ownership of multiple properties or being an NRI can make expert guidance particularly useful.\n\nAssisted services are available in several formats.", "source": "LiveMint Money", "pub_date_str": "31 Aug 2026, 06:37 PM IST", "pub_date_relative": "23m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "A 71-Year-Old With $600,000 in an IRA Parked $150,000 in a QLAC. Her RMDs Dropped by a Quarter, and the Check Starts at 85.", "full_content": "Skip to navigation Skip to main content Skip to right column A 71-Year-Old With $600,000 in an IRA Parked $150,000 in a QLAC. Her RMDs Dropped by a Quarter, and the Check Starts at 85. David Beren Mon, August 31, 2026 at 8:05 AM CDT 5 min read Quick Read Moving $150,000 of a $600,000 IRA into a QLAC cuts RMDs by 25% because the IRS excludes QLAC assets from the RMD calculation.\n\nAge 71 is the ideal window to fund a QLAC since SECURE 2.0 delays mandatory RMDs until 73, letting the premium exit the balance first.\n\nThe $150,000 is fully illiquid until payments begin at 85, with no market growth, inflation protection, or emergency access during deferral.\n\nRead More: Learn 7 ways to generate income with a $1,000,000+ portfolio (sponsor)\n\nA 71-year-old retiree with $600,000 in a traditional IRA moved $150,000 into a Qualified Longevity Annuity Contract, or QLAC, with income scheduled to begin at age 85. She has not yet started required minimum distributions. The move is expected to reduce those future RMDs by roughly a quarter. The mechanics behind that reduction and the trade-offs involved are worth walking through in plain language.\n\nA QLAC is a specialized type of deferred income annuity that you buy inside a tax-qualified account like a traditional IRA or 401(k). A deferred income annuity, in plain terms, is a contract where you hand over a premium today in exchange for guaranteed payments that start at a future date and last for life. The QLAC label itself comes from a set of IRS rules that allow the contract's value to sit outside the balance used to calculate your required minimum distributions, as long as the contract checks every box those rules lay out. RMDs, for context, are the mandatory annual withdrawals the IRS requires from most pre-tax retirement accounts once you hit your required beginning date, which is the first age at which those withdrawals become compulsory.\n\nIf you've saved over $1,000,000, this guide is for you.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:35 PM IST", "pub_date_relative": "25m ago", "cfa_topics": ["Economics", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Barclays forecasts two Fed rate hikes after Warsh Jackson Hole speech", "full_content": "Skip to navigation Skip to main content Skip to right column Barclays forecasts two Fed rate hikes after Warsh Jackson Hole speech Cris Tolomia Mon, August 31, 2026 at 8:04 AM CDT 2 min read BCS Barclays now expects the Federal Reserve to raise interest rates at its September and December meetings, reversing a prior forecast of no changes through the remainder of the year, after Federal Reserve Chair Kevin Warsh delivered a hawkish address at the annual Jackson Hole symposium last Friday, according to Reuters .\n\nThe Wall Street brokerage described Warsh's speech as \"notably hawkish\" and said it offered an implicit case for further tightening, according to Reuters. Each of the two projected increases would amount to 25 basis points. The Fed's benchmark federal funds rate currently stands at a target range of 3.5% to 3.75%.\n\nBarclays did note that near-term monthly inflation prints are likely to look considerably cooler than the longer-horizon gauges Warsh cited, but warned that base effects would undercut any apparent improvement in those annual measures before December. Traders are assigning a 60.4% probability to a September hike, CME Group's FedWatch tool showed.\n\nWarsh's Jackson Hole address, his first keynote at the event as Fed chair, drew significant market attention as his clearest opportunity to fill what had been a deliberate communications void since he took office in May. Warsh told the symposium that policymakers would \"have work to do\" if they lacked confidence that inflation was returning to the Fed's 2% target. In his remarks, Warsh cast inflation as unacceptably elevated, judged prevailing financial conditions to be doing too little to restrain demand, and described the labor market as operating at or near full employment.\n\nWarsh reinforced his opposition to providing explicit forward guidance, declining to spell out the conditions that would trigger a policy response. \"I stand here today committed to a discipline, not to a decision,\" he said.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:34 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Quantitative Methods", "Economics", "Portfolio Management"], "exam_note": "Statistical and quantitative tools underpin valuation and risk analysis on the exam."}, {"title": "Jim Cramer's top 10 things to watch in the stock market Monday", "full_content": "Oil is up nearly 4% after U.S. and Iran exchanged attacks for the first time since July.", "source": "CNBC Top News", "pub_date_str": "31 Aug 2026, 06:34 PM IST", "pub_date_relative": "27m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Bitcoin Is Trading Like Gold, Not the Nasdaq \u2014 And Right Now That's the Problem", "full_content": "Skip to navigation Skip to main content Skip to right column Bitcoin Is Trading Like Gold, Not the Nasdaq \u2014 And Right Now That's the Problem Kamina Bashir Mon, August 31, 2026 at 8:01 AM CDT 3 min read GC=F BTC-USD ^IXIC Bitcoin (BTC) and gold have both given back much of last week's gains. The two assets had climbed in step through August as investors piled into the debasement trade.\n\nHowever, Federal Reserve Chairman Kevin Warsh's Jackson Hole speech on Friday broke that run.\n\nThe rally in both assets began in the bond market. The US Treasury said it will double its buyback cap for longer-dated debt to at least $4 billion.\n\nInvestors responded by crowding into alternative assets and moving out of fiat currencies. The MSCI global gold miners index gained 43% in August, its strongest month on record.\n\nFund flows told the same story. Gold and Bitcoin exchange-traded funds together drew $7 billion across five trading days, a record for that window.\n\nThat combination pushed gold to its highest level since mid-May. Price hit an intra-day high of $4,697 an ounce on Tuesday.\n\nBitcoin rode the same trade. The asset touched $81,354 on Binance last week, its highest level in about 3 months.\n\nBoth have since reversed. Gold traded around $4,432 on Monday, down 5.6% from Tuesday's peak.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:31 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Corporate Issuers", "Equity Investments", "Fixed Income", "Alternative Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "This Little-Known AI Company Is Quietly Building for the Data Center Boom", "full_content": "Skip to navigation Skip to main content Skip to right column This Little-Known AI Company Is Quietly Building for the Data Center Boom Vandita Jadeja Mon, August 31, 2026 at 8:00 AM CDT 5 min read POET LITE AAOI NVDA Quick Read POET (NASDAQ: POET) secured a $50 million Lumilens purchase order, and our model sees 137% upside to a $17.74 BUY price target.\n\nLumentum (LITE) generates $1 billion quarterly on the same optical tailwind; Applied Optoelectronics (AAOI) proves hyperscale-qualified 800G suppliers command premium multiples.\n\nPOET holds $796 million in cash to fund its Malaysia production ramp, but four of its last five earnings reports missed estimates.\n\nAct now: the analyst who called NVIDIA in 2010 just named his top 10 AI stocks \u2014 and Poet Technologies didn't make the cut. Grab the names FREE today .\n\nPOET Technologies ( NASDAQ:POET ) is a small-cap photonics designer building optical engines for 400G, 800G, and 1.6T data center interconnects, the plumbing hyperscalers need to move AI traffic without melting their power budgets. With a fresh $50 million purchase order from Lumilens in hand, our proprietary model sees room for a sharp re-rating.\n\nOur 24/7 Wall St. price target for POET is $17.74 over the next 12 months, implying 136.59% upside. The recommendation is buy at medium confidence.\n\nPOET is down 9.09% in the past week but up 17.74% over the past month and 32.74% year over year. Shares traded near $22.89 when POET filed its Q1 report in May, then collapsed to a 52-week low of $3.87 low before rebuilding to today's level (52-week high: $20.81).\n\nThe Q2 FY26 report on August 13 was the reset. Revenue of $569,925 grew 112.29% year over year but missed consensus by 17.58%. GAAP EPS came in at -$0.07, in line with estimates.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:30 PM IST", "pub_date_relative": "30m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "OpenAI's ad business shows blistering growth, hits $1 billion annualized revenue run rate", "full_content": "OpenAI on Monday announced that its advertising business has hit $1 billion in annualized revenue run rate, a milestone that the company is touting as proof of its \"diversified business model.\"\n\nThe artificial intelligence company is gearing up for what is expected to be a massive IPO , and is under pressure to justify its $852 billion valuation to investors. OpenAI said Monday that its ad business, which is roughly 200 days old, builds on its existing revenue engines like its enterprise offerings, consumer subscriptions and usage-based application programming interfaces.\n\nOpenAI began testing ads within its ChatGPT chatbot in the U.S. in February, a decision that was both highly anticipated and controversial. Digital advertising has long been the cash cow for other big tech companies like Google and Meta , but OpenAI's move was ridiculed by its chief rival, Anthropic , which made OpenAI's ad push the focus of its first Super Bowl campaign .\n\nChatGPT Ads are now available in more than 40 countries, and OpenAI said it's rolling out self-service access across India, Europe, the Middle East and North Africa on Monday. Ads within the chatbot appear for OpenAI's Go subscribers and its free tier, which makes up the vast majority of its 1 billion weekly active users.\n\nOpenAI said Monday that its ads are clearly labeled and do not influence ChatGPT's answers. Advertisers do not have access to users' private conversations.\n\n\"Our next phase of growth will bring ChatGPT Ads to more markets and introduce additional formats, objectives, buying options, and measurement capabilities,\" OpenAI said in a release. \"We will also explore new ways for businesses to interact with consumers in more native ways in ChatGPT.\"\n\nWATCH: Experts weigh in on the market\u2019s ability to handle Anthropic and OpenAI going public", "source": "CNBC World Economy", "pub_date_str": "31 Aug 2026, 06:30 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers", "Equity Investments", "Derivatives"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Nextech3D.ai Q1 revenue nearly doubles on event tech, services growth", "full_content": "Skip to navigation Skip to main content Skip to right column Nextech3D.ai Q1 revenue nearly doubles on event tech, services growth Proactive Mon, August 31, 2026 at 8:00 AM CDT 2 min read 1SS.F NTAR NEXCF Nextech3D.AI (CSE:NTAR, OTCQX:NEXCF, FRA:1SS) reported a 101% year-over-year jump in first-quarter revenue, driven by growth in its event technology platform and a newly expanded services business.\n\nRevenue for the quarter ended June 30, 2026 rose to $660,159 from $328,092 a year earlier, the company said.\n\nEvent technology revenue increased 47% to $400,252, while event experience and services revenue totaled $210,934, compared with nil in the prior-year period.\n\nGross profit increased 79% to $530,294, with gross margin at 80%, compared with 90% a year earlier. Net loss from continuing operations widened to $840,759 from $497,763.\n\n\"Our growth was driven by strong execution across both our event technology platform and our newly expanded event experience and services business,\" said Evan Gappelberg, CEO of Nextech3D.AI (CSE:NTAR, OTCQX:NEXCF) .\n\n\"Importantly, our gross profit grew 79% to over $530,000, reflecting the strength of our business model and the value our solutions deliver to customers,\" he added.\n\nCFO Anum Waqas said the growth in event experience and services revenue reflected an expanding and diversified revenue base. \"This growth, combined with disciplined financial management, positions us to improve operating leverage as we continue to scale,\" Waqas said.\n\nThe company said it continues to build out its Eventdex platform as part of a strategy to become a comprehensive \"event operating system\" for enterprise customers, associations, trade shows, conferences and corporate events.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:30 PM IST", "pub_date_relative": "31m ago", "cfa_topics": ["Financial Statement Analysis", "Corporate Issuers"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Stock futures fall after U.S. strikes Iran; Wall Street heads for winning month: Live updates - CNBC", "full_content": "Stock futures fall after U.S. strikes Iran; Wall Street heads for winning month: Live updates CNBC See more headlines & perspectives on Google News", "source": "Google News Business", "pub_date_str": "31 Aug 2026, 06:28 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Derivatives"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Cathie Wood's ARK Invest bought $53M of Nvidia stock after earnings", "full_content": "Skip to navigation Skip to main content Skip to right column Cathie Wood's ARK Invest bought $53M of Nvidia stock after earnings Cris Tolomia Mon, August 31, 2026 at 7:57 AM CDT 1 min read NVDA AMD Cathie Wood's ARK Invest picked up 243,707 Nvidia shares on Friday at a total cost of approximately $53 million, according to Barron's . The buy came after Nvidia stock closed down 4.6% at $217.55 that day, pulling back from a surge driven by the chipmaker's latest earnings report.\n\nThe purchase fits a pattern that has emerged over recent months, with Wood adding to ARK's Nvidia holdings at the same time she has been paring back its AMD exposure. ARK sold 156,286 AMD shares on Friday as well.\n\nNvidia stock was up 0.5% at $218.70 in premarket trading Monday.\n\nNvidia's second-quarter revenue more than doubled , clearing analyst forecasts by the widest margin in two years, and the company projected 70% revenue growth for its fiscal 2028 year. Nvidia stock climbed roughly 7% on Thursday following the report, lifting chip stocks broadly and pushing major indexes higher. The stock's subsequent pullback on Friday set up the entry point for ARK's purchase.\n\nCEO Jensen Huang said demand for the company's products exceeds its ability to supply them.\n\nWood, who serves as ARK's CEO and chief investment officer, rose to prominence by wagering on speculative areas including genomics, robotics, and electric vehicles. ARKK, ARK's largest fund, has seen its value erode at an annualized rate of about 9% across the last five years.\n\nOn a forward earnings basis, Nvidia is priced at 16.7 times expected profits, a discount to the S&P 500's 19.7 times multiple, according to Barron's, citing FactSet data.", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:27 PM IST", "pub_date_relative": "33m ago", "cfa_topics": ["Financial Statement Analysis", "Equity Investments"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Chennai\u2019s rain gets a market price: NCDEX launches RAINCHNNAI weather derivatives futures contract", "full_content": "NCDEX launched RAINCHNNAI, a futures contract allowing market participants to hedge Chennai\u2019s Northeast Monsoon risks. Utilizing a Cumulative Deviation Rainfall model, it complements the RAINMUMBAI contract, providing a complete monsoon risk management cycle from June through December.", "source": "Economic Times Markets", "pub_date_str": "31 Aug 2026, 06:25 PM IST", "pub_date_relative": "36m ago", "cfa_topics": ["Derivatives", "Portfolio Management"], "exam_note": "Know how derivatives are used for hedging and speculation \u2014 key for exam valuation questions."}, {"title": "Stock Market Today: Dow Falls, Oil Prices Jump As U.S., Iran Exchange New Strikes (Live Coverage)", "full_content": "", "source": "Yahoo Finance", "pub_date_str": "31 Aug 2026, 06:24 PM IST", "pub_date_relative": "37m ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}], "updated_at": "31 Aug 2026, 07:01 PM IST", "total_stories": 363};
    let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
