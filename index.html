 order entry, modification, and cancellation.\n\nIt will be followed by order matching, trade confirmation and opening price determination session between 9:45 am and 9:55 am. Next is a five minute buffer and transition period followed by listing at 10 am.\n\nJio Platforms IPO\u2019s grey market premium (GMP) stood at \u20b9 250 per share, at 2:37 pm on October 25, 2026. With this, its estimated listing price is likely to remain close to \u20b9 1369 per share (which is the sum of upper price band of \u20b9 1119 and grey market premium). The latest grey market premium indicates an IPO listing of close to 22.34%.\n\nSuppose an investor receives allotment of one lot of 12 shares, on investment of \u20b9 13428. Considering the current grey market premium (indicating 22.34% of listing gain), the Jio IPO may list at \u20b9 13,428, which makes the potential money gain of \u20b9 3,000 for investors.\n\nThe IPO is a book build issue of \u20b9 30,213 crore and its issue is an entirely a fresh issue of 27 crore shares of \u20b9 30,213 crore.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 04:13 PM IST", "pub_date_relative": "1h ago", "cfa_topics": ["Corporate Issuers", "Equity Investments"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Bharat Coking Coal Q2 Results: PSU Coal India Arm Swings To Profit, Revenue Jumps 40% YoY", "full_content": "Bharat Coking Coal's revenue went up 39% year-on-year to Rs 4,413 crore from Rs 3,173 crore in the preceding fiscal.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 03:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "RailTel Q2 Results: Profit Drops 10% On One-Time Exceptional Loss, Revenue Up 20% YoY", "full_content": "RailTel Corporation of India reported a 20.5% year-on-year rise in Q2 revenue to Rs 1,146 crore, while net profit fell 9.9% to Rs 68.6 crore. EBITDA grew 13.9%, but the margin narrowed to 15.4%.", "source": "NDTV Profit", "pub_date_str": "25 Oct 2026, 03:40 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Bank Nifty tumbles nearly 3%, slips below 55k: More selling pressure ahead for banking stocks? Check key levels to watch", "full_content": "Indian equity benchmarks extended their losses in a holiday-truncated week, with the BSE Sensex falling 2.15% and the NSE Nifty 50 declining 2.36%. The Sensex shed 1,605.44 points, while the Nifty 50 lost 546.15 points over the four trading sessions.\n\nThe selloff, triggered by surging crude oil prices amid the West Asia crisis, wiped out nearly \u20b9 21 lakh crore in investor wealth as benchmark indices declined for four consecutive sessions.\n\nBanking stocks also came under pressure, with the Nifty Bank index falling 2.79% over the week to close at 54,287.35. The index opened at 55,827.45, but persistent selling prevented it from sustaining its recent recovery. It slipped below the 55,000 mark and ended the week down 1,556.65 points, forming a strong bearish weekly candle and snapping its two-week winning streak.\n\nThe decline in banking stocks has been uneven. Over the past week, Yes Bank was the worst performer among the 14 Nifty Bank constituents, tumbling 10.84%, followed by IDFC First Bank, which fell 7.6%, and Axis Bank, down 5.58%. In contrast, PNB, Federal Bank and Union Bank of India posted gains, while ICICI Bank edged up marginally.\n\nOver the past month, Yes Bank plunged 32.19%, followed by IDFC First Bank, down 17.51%, and IndusInd Bank, which declined 13.66%. Federal Bank and ICICI Bank gained 4.35% and 4.32%, respectively, while Kotak Mahindra Bank rose 3.31%.\n\nOn a year-to-date basis, the Nifty Bank index has declined 8.89%, outperforming the Nifty 50 and Sensex, which have fallen 13.51% and 14.19%, respectively. The figures underline the broader weakness in Indian e\n\nHitesh Tailor, Research Analyst at Choice Broking, said Bank Nifty's weekly price action signals renewed selling pressure after the index broke below the 55,000 mark and slipped below its 100-week exponential moving average (EMA), an important technical level.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 03:38 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments", "Alternative Investments", "Portfolio Management"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Peter Lynch on stock picking: 'You shouldn't own a stock if you can't\u2026'", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Peter Lynch on stock picking: 'You shouldn't own a stock if you can't\u2026' The Economic Times daily newspaper is available online now. Read Today's Paper Peter Lynch on stock picking: 'You shouldn't own a stock if you can't\u2026' SECTIONS Peter Lynch on stock picking: 'You shouldn't own a stock if you can't\u2026' By Debaroti Adhikary , ETMarkets.com Last Updated: Oct 25, 2026, 03:32:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Peter Lynch\u2019s investing advice centres on understanding a company before buying its stock. The legendary Fidelity Magellan Fund manager stresses researching business fundamentals, growth prospects and financials rather than investing based on popularity or hearsay.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial markets, investment strategies and stocks alerts, subscribe to our Telegram feeds .)\n\nSubscribe to ET Prime and read the Economic Times ePaper Online.and Sensex Today .\n\nTop Trending Stocks: SBI Share Price , Axis Bank Share Price , HDFC Bank Share Price , Infosys Share Price , Wipro Share Price , NTPC Share Price\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram.", "source": "Economic Times Markets", "pub_date_str": "25 Oct 2026, 03:32 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Equity Investments"], "exam_note": "Equity valuation methods and market mechanics are fundamental CFA exam areas."}, {"title": "Kashmir: Hassan Mir urges month pension hike to \u20b93,000 for widows, orphans and elderly, payment of dues", "full_content": "Apni Party leader Ghulam Hassan Mir has urged the National Conference (NC) led Jammu and Kashmir state government to fulfil the party's election manifesto promise and formally increase monthly pension from \u20b9 1,000 to \u20b9 3,000, according to a report by local publication Greater Kashmir.\n\nMir urged that monthly pension be enhanced to benefit the elderly, orphans, widows and other vulnerable sections of society, the report said. He also called for release of pending pension payments reportedly not being received by beneficiaries over the past four months, it added.\n\nMir said delay in payments is causing considerable hardship to those who depend on the assistance for their daily needs. \u201cThe monthly pension may not mean much to the government, but for these people, it means a lot,\u201d he said. The report added that he also urged the state to investigate the reasons behind delay in payments.\n\n\u201cIf the salaries of senior government officials are withheld, there is an immediate outcry everywhere. Why, then, is there silence when the pensions of the most vulnerable people are delayed?\u201d he questioned, it said.\n\nMeanwhile, the EPFO's Central Board of Trustees is likely to discuss raising the minimum monthly pension under its Employees' Pension Scheme (EPS) at its next meeting in Gujarat on next month, according to a Business Standard report.\n\nThe CBT is expected to hold its 240th meeting in Gir on 19 November, where the issue is expected to be on the agenda, it cited two sources saying. This has been a long pending demand by pensioners and trade unions, it added.\n\nSince September 2014, the Centre has set minimum pension at \u20b9 1,000/month but trade unions and pensioners groups have argued that this is not enough to keep up with cost of living and inflation.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 03:23 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Economics", "Financial Statement Analysis", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "J&K Bank boosts accident insurance to \u20b91 crore for J&K government staff; Check key benefits and loan concessions", "full_content": "Jammu and Kashmir Bank has increased the group personal accident insurance cover for permanent Jammu and Kashmir government employees from the current \u20b9 25 lakh to \u20b9 1 crore under a 5-year agreement signed with the Union Territory administration on 23 October 2026.\n\nThis agreement also focuses on enhancing disability benefits, financial assistance for employees' families, preferential loan facilities and banking concessions. The overall objective is to bring meaningful and positive changes in the lives of permanent government employees in the Union Territory.\n\nAs per the agreement, the accident insurance package provides \u20b9 1.35 crore in air accident cover, \u20b9 75 lakh for permanent total disability and \u20b9 55 lakh for permanent partial disability.\n\nFurthermore, there are also several noticeable additional benefits, including higher education assistance of \u20b9 8 lakh for a male child and \u20b9 10 lakh for a girl child following the insured employee\u2019s untimely demise. In such cases, eligible families can also receive up to \u20b9 10 lakh towards a girl child\u2019s marriage , along with \u20b9 10 lakh in air ambulance cover, subject to the applicable terms, rules and regulations.\n\nThis agreement was signed in the presence of Financial Commissioner (Additional Chief Secretary), Finance Department, Shailendra Kumar, and J&K Bank Managing Director and CEO Amitava Chatterjee. Given the uncertainties and unpredictability of life, the core aim of the agreement was to provide some semblance of assurance to citizens.\n\nAll permanent government employees will be eligible for zero-balance accounts, free international debit cards, with spouse add-on cards and lifetime-free RuPay credit cards.\n\nThe package also provides a 25-basis-point concession on applicable personal loan interest rates, subject to the prescribed benchmark floor.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 03:13 PM IST", "pub_date_relative": "2h ago", "cfa_topics": ["Portfolio Management"], "exam_note": "Asset allocation and portfolio construction concepts appear throughout the CFA curriculum."}, {"title": "From Salman Khan to Virat Kohli: Why are more celebs buying agricultural land in India? Check tax benefits", "full_content": "Agricultural land offers celebrities more than open spaces and peaceful weekend breaks. It combines farming opportunities, investment potential, privacy and a connection with nature. For wealthy buyers, these benefits can make farmland attractive alongside homes and other investments.\n\nSeveral well-known names own farms or rural properties across India. Salman Khan\u2019s Arpita Farms in Panvel covers 150 acres near Mumbai. The estate includes paddy fields, horse stables and large green spaces. Late Dharmendra\u2019s 100-acre Maharashtra estate features vegetables, fruit orchards and sustainable farming arrangements.\n\nVirat Kohli and Anushka Sharma reportedly purchased 5.1 acres of agricultural land in Alibaug. Their purchase, near Aaphale village and Nagveshwar Temple, cost \u20b9 37.86 crore.\n\nShah Rukh Khan\u2019s daughter, Suhana Khan , also owns agricultural and farmhouse land parcels in Alibaug. Amitabh Bachchan has invested in land in Alibaug and Ayodhya.\n\nFor some celebrities, farming provides a closer link with their roots. Nawazuddin Siddiqui purchased 13.75 acres in Budhana, his ancestral hometown in Uttar Pradesh.\n\nOthers have focused on growing food and improving their land. Prakash Raj grows grains and trees, practises sustainable farming and sells homegrown produce.\n\nR Madhavan\u2019s Tamil Nadu farm focuses on coconuts and restoring barren land. His efforts also encourage local birds and support the surrounding environment.\n\nJackie Shroff\u2019s 44,000-square-foot property between Mumbai and Pune includes organic gardening and a fish pond. Aamir Khan owns a rustic two-acre property in Panchgani. Varun Dhawan has also acquired a rural farm property for nature-focused work.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 03:10 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Gold prices jump from \u20b9432 to \u20b91.42 lakh in 50 years: Should you sell inherited gold jewellery, exchange it or keep it?", "full_content": "Gold prices have risen sharply over the years, making inherited jewellery worth revisiting. A necklace passed down by a parent or a pair of old bangles may hold both financial and sentimental value. But should you sell the jewellery at current prices, keep it for future use, or exchange it for a new design?\n\nAccording to Bullion data, gold prices today stand at \u20b9 1,42,500 per 10 grams for 24-karat gold. In 2016, the price was around \u20b9 28,624 per 10 grams, while 20 years ago, in 2006, it was \u20b9 8,400. In 1976, 50 years ago, the gold price was just \u20b9 432 per 10 grams, according to Bankbazaar data.\n\nBut the decision to sell inherited gold involves more than the prevailing gold rate and returns. Purity, resale value, and tax implications can all affect the outcome. Here are six things to check before deciding what to do with inherited gold.\n\nDo not value jewellery only by its total weight. Stones, pearls and other non-gold components must be excluded, while purity determines the applicable rate. Check the hallmark and get the jewellery tested if its purity is uncertain.\n\nA necklace inherited from a parent may have significance beyond its resale price. Consider whether the piece is likely to be worn, preserved, or passed on. Antique craftsmanship may also warrant a separate check before selling it as scrap gold.\n\nThe market rate is not necessarily the amount a jeweller will pay. Ask for the rate applied, net gold weight, and every deduction. Compare written quotations from multiple buyers before finalising the sale.\n\nExample: If the assessed gold weighs 20 grams and the applicable rate is \u20b9 13,070 per gram for 22-karat, its indicative metal value is \u20b9 2,61,400. If the jeweller deducts \u20b9 5,000, the payout would be \u20b9 2,56,400.\n\nExchanging old jewellery can reduce the amount payable for a new piece, but making charges and applicable GST add to the bill.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 03:01 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Alternative Investments"], "exam_note": "Alternative asset classes and their risk-return profiles are increasingly tested."}, {"title": "Why fund managers are mixed on gilt funds", "full_content": "This is a Mint Premium article gifted to you. Subscribe to enjoy similar stories.\n\nBond yields are climbing globally, and Indian investors in gilt funds face a difficult choice: lock in higher yields now or wait for a potentially better entry point.\n\nThe US 10-year Treasury yield is hovering around 5%, up from around 4% a year ago, while Brent crude oil has climbed past $110 a barrel on supply concerns in West Asia, raising the risk that inflation will stay higher for longer.\n\nIn India, yield on the benchmark 10-year government security (g-sec) stood at 7.47% on 23 October, up from around 6.76% in mid-August and about 6.54% a year ago. The yield is at its highest level in three-and-a-half years. Rising US yields, higher crude oil prices and monetary tightening at home have all contributed to the pressure.\n\nFor investors, rising yields cut both ways. Higher yields can make government bonds more attractive to new investors, but they also push down the prices of existing bonds, inflicting mark-to-market losses on debt funds that hold them. Gilt funds, which invest predominantly in government securities, can be particularly sensitive to these moves when their portfolios have longer durations.\n\nOn average, gilt funds\u2019 net asset values (NAVs) have fallen about 2.5% since mid-August. Some fund managers see the correction as an opportunity to build positions gradually. Others believe yields could rise further, making patience the better strategy.\n\nThe argument for investing now rests on the view that yields are already attractive and that much of the expected monetary tightening may be reflected in bond prices.\n\n\u201cYields at close to 7.45-7.5% are a good entry point. But investors should enter in a staggered manner and not put the entire sum in at one go, as oil is rising and yields are elevated globally. We don\u2019t know where the top will be,\u201d said Puneet Pal, head of fixed income at PGIM India Mutual Fund.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 02:57 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics", "Equity Investments", "Fixed Income", "Alternative Investments", "Portfolio Management"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Bank holidays next week: SBI, HDFC, ICICI branches to remain closed on these 3 days from 26-31 Oct? Check RBI calendar", "full_content": "Bank holiday next week : Public and private lenders, including branches of the State Bank of India ( SBI ), HDFC Bank, ICICI Bank , Punjab National Bank (PNB) and Canara Bank will be closed on a number of days between 26-31 October for various reasons, according to the official Reserve Bank of India schedule.\n\nAs per RBI rules, all scheduled and non-scheduled banks observe listed holidays and mandatory closure on second and fourth Saturdays and every Sunday in a month. In-branch services are shut, but digital services (online net banking, app) will remain operational.\n\nUsually, in addition to the common national and gazetted holidays, or weekend offs, banks in India could have local holidays and festivals off, as required. The central bank releases its annual, official bank holiday list in January. Please contact your nearest local bank branch for their confirmed holiday schedule for 2026.\n\nBanks, including the SBI, HDFC Bank , ICICI Bank, Axis Bank, PNB, Canara Bank, Bank of Baroda and other lenders across India will remain closed on the following dates next week:\n\n\u2014 Monday, October 26 (Laxmi Puja / Accession Day / Maharishi Valmiki\u2019s Birthday): Branches will be closed in Agartala, Chandigarh, Jammu, Shimla, and Srinagar.\n\n\u2014 Thursday, October 29 ( Karva Chauth ): Banks in Shimla will remain closed.\n\n\u2014 Saturday, October 31 (Sardar Vallabhbhai Patel's Birthday): Banks in Ahmedabad will be closed.\n\nDuring bank holidays , online banking services remain available across the country to ensure uninterrupted access to banking services. Customers can use these services for convenient financial transactions.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 02:57 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Economics"], "exam_note": "Understand how macroeconomic indicators and policy decisions affect markets \u2014 a core CFA economics topic."}, {"title": "Jio Platforms IPO allotment status check online by PAN number guide for KFin Tech Registrar Portal on ris.kfintech.com", "full_content": "Jio Platforms initial public offering (IPO) allotment is all set to be finalised on Monday, October 26. Backed by Mukesh Ambani\u2019s Reliance Industries Limited (RIL), Jio IPO was subscribed more than 22 times during the bidding period.\n\nAs all eyes are now on the finalisation of allotment shares, here\u2019s how investors can check allotment status on KFin Tech registrar portal.\n\nInvestors can check their allotment status on KFin Technologies website by three different methods, ie, PAN Number, IPO Application Number, and demat account number.\n\n- Select the drop-down menu, and choose Jio Platforms option.\n\n-Readers must note that Reliance Jio IPO name will be visible on the dropdown menu list only after the allotment is officially finalized.\n\n-Once you select Jio IPO, now select PAN number as search type.\n\n-Readers can also select other methods like IPO application number, demat account number.\n\n-Proceed with PAN number option and then enter details like identification number.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 02:53 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Corporate Issuers"], "exam_note": "Corporate finance decisions (capital structure, dividends, M&A) are core exam material."}, {"title": "Cultivation of large cardamom emerges as a lucrative option for higher income from limited land", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a News \u203a Economy \u203a Agriculture \u203a Cultivation of large cardamom emerges as a lucrative option for higher income from limited land The Economic Times daily newspaper is available online now. Read Today's Paper Cultivation of large cardamom emerges as a lucrative option for higher income from limited land SECTIONS Cultivation of large cardamom emerges as a lucrative option for higher income from limited land PTI Last Updated: Oct 25, 2026, 02:20:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis A farmer in Himachal Pradesh's Bilaspur district has cultivated large cardamom for 20 years, producing 2-3 quintals annually on about one bigha of land. Priced at around Rs 1.8 lakh per quintal, the crop offers an alternative income source for farmers with reliable irrigation, according to the agriculture department.\n\nWill oil turn into a lingering problem? Is the world economy, India, or the market prepared?\n\nKYB and KYC: Business behind the wealth creator called \u2018Divi\u2019s Lab\u2019 \u2013 Part 2, concluding\n\nKYB and KYC: Business behind the wealth creator called \u201cDivi\u2019s Lab\u201d \u2013 Part 1\n\nOne company, 2 words. Bond yield and CDS: Will they decide the fate of global markets?\n\nBusiness of Odd Things: Inside an industry that farms fish that nobody is meant to eat\n\nChoose your reason below and click on the Report button. This will alert our moderators to take action", "source": "Economic Times Economy", "pub_date_str": "25 Oct 2026, 02:20 PM IST", "pub_date_relative": "3h ago", "cfa_topics": ["Fixed Income", "Derivatives", "Ethical & Professional Standards"], "exam_note": "Bond pricing, yield curves, and credit analysis are heavily tested in Fixed Income."}, {"title": "Best auto stocks to buy ahead of Diwali 2026: Nuvama bets big on Eicher Motors, Hyundai and Tata Motors PV - Here's why", "full_content": "Eicher Motors , Hyundai and Tata Motors' passenger vehicle business are Nuvama Institutional Equities' top picks in the auto sector ahead of Diwali 2026, as the brokerage favours automakers with new product launches and healthy waiting periods. However, it expects vehicle volume growth to moderate in the second half of FY27 as festive demand shows signs of slowing after a strong first half.\n\nInitial festive-season registrations since Navratri have been mixed. Commercial vehicle (CV) registrations grew 21% year-on-year (YoY), while two-wheeler (2W) registrations rose 13%. Passenger vehicle (PV) registrations, however, declined 9% YoY. Festive-season performance has also lagged the over 20% growth recorded across categories in the first half of FY27.\n\nDealer checks across Madhya Pradesh, Bihar and Jharkhand indicate moderating demand due to a high base following last year's GST cuts, intermittent weakness in rural demand, and longer waiting periods, particularly for passenger vehicles. Meanwhile, electric vehicle (EV) adoption continues to grow at a robust double-digit pace across segments.\n\nAmong two-wheelers, TVS Motor and Honda have gained market share, while Bajaj Auto, Hero MotoCorp and Eicher Motors have lost share. Nuvama attributed Eicher Motors' share loss to waiting periods for key models, including the Bullet 350 and Classic 350.\n\nThe brokerage's dealer survey indicates that a Madhya Pradesh Honda dealer expects growth of 3\u20135% during September\u2013November 2026, compared with 10% in the first half of FY27, citing slower rural demand amid deficient rainfall and lower crop realisations. A Bihar dealer expects Honda's two-wheeler sales to grow 15\u201318% during the festive period, below the 24% growth recorded between April and August 2026.\n\nFor Hero MotoCorp, a Jharkhand dealer expects festive-season growth of 10%, compared with 12% in the first half of FY27.", "source": "LiveMint Markets", "pub_date_str": "25 Oct 2026, 02:05 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Financial Statement Analysis"], "exam_note": "Analyzing financial statements and ratios is the largest CFA L1 topic by weight."}, {"title": "Viral investment tip? SEBI urges investors to check these 3 things before trusting online advice or making payments", "full_content": "With advances in technology, the process of sharing information and ideas has also accelerated. This has facilitated the widespread circulation of investment tips, short-term investment ideas, stock recommendations, and trading advice on social and messaging platforms.\n\nStill, before proceeding with any such investment ideas, it is prudent for well-informed investors to be cautious and verify any tips or freely available information. This is because a seemingly lucrative and harmless investment opportunity or idea may not always be genuine or provide the promised results.\n\nFurthermore, transferring any money without proper background verification, risk assessment, and confirmation of the real recipient of the funds can expose investors to financial fraud and cause regret later on.\n\nTo help seasoned and new investors make meaningful, informed investment decisions, the Securities and Exchange Board of India (SEBI) has highlighted three key checks through its investor awareness initiative, \u2018 Samajh Se Investing Simple.\u2019\n\nIn this initiative, the focus is on understanding investments at a conceptual level, verifying an intermediary\u2019s registration, downloading trading applications with a clearly defined, verified label, and checking payment details before transferring funds. This message has been sent to citizens' WhatsApp numbers to raise awareness.\n\n\u2022 Investment payment? Use SEBI Check Tool before making payment\n\nFor more information and verified resources, visit investor.sebi.gov.in/ssis or download SEBI Saa \u20b9 thi App.\"\n\nTo ensure complete financial protection, before following any investment tip or advice or dealing with a market intermediary, it is prudent for investors to carefully verify the intermediary\u2019s SEBI registration status through official sources. The verification of registration can help investors avoid unauthorised and fraudulent entities posing as fair and legitimate market professionals and participants.", "source": "LiveMint Money", "pub_date_str": "25 Oct 2026, 01:57 PM IST", "pub_date_relative": "4h ago", "cfa_topics": ["Ethical & Professional Standards"], "exam_note": "Ethics cases and the Code of Conduct are tested heavily \u2014 always the first exam topic."}, {"title": "Mcap of 8 of top-10 firms erodes by Rs 1.55 lakh cr; HDFC Bank, Bajaj Fin biggest laggards", "full_content": "Home ETPrime Markets Market Data Masterclass News Industry SME Politics Wealth MF Tech AI World Opinion NRI Panache More Menu Business News \u203a Markets \u203a Stocks \u203a News \u203a Mcap of 8 of top-10 firms erodes by Rs 1.55 lakh cr; HDFC Bank, Bajaj Fin biggest laggards State Bank of India Share Price Punjab National Bank Share Price Union Bank of India Share Price Bank of Baroda Share Price Indian Bank Share Price The Economic Times daily newspaper is available online now. Read Today's Paper Mcap of 8 of top-10 firms erodes by Rs 1.55 lakh cr; HDFC Bank, Bajaj Fin biggest laggards SECTIONS Mcap of 8 of top-10 firms erodes by Rs 1.55 lakh cr; HDFC Bank, Bajaj Fin biggest laggards PTI Last Updated: Oct 25, 2026, 01:57:00 PM IST Rate Story Follow us Share Font Size Abc Small Abc Medium Abc Large Save Print Comment Synopsis Recently, the market witnessed a downturn, with eight of the leading firms in India suffering major valuation losses. The declines of HDFC Bank and Bajaj Finance were particularly striking. The BSE Sensex plummeted by 1,605.44 points, indicating a bearish atmosphere across equities. While Tata Consultancy Services and Larsen & Toubro showed some gains, the overall trend remained negative.\n\n(What's moving Sensex and Nifty Track latest market news , stock tips , Budget 2025 , Share Market on Budget 2025 and expert advice , on ETMarkets . Also, ETMarkets.com is now on Telegram. For fastest news alerts on financial mark     let activeFilter = "All";

    document.addEventListener("DOMContentLoaded", () => {
        if (!allData || !allData.updated_at) {
            document.getElementById("general-feed").innerHTML = '<div class="empty-state">Data could not be loaded.</div>';
            return;
        }
        renderAll();
    });

    function renderAll() {
        document.getElementById("dateline").textContent = allData.updated_at;
        document.getElementById("stat-stories").textContent = allData.total_stories + " stories";
        document.getElementById("count-general").textContent = "(" + allData.general.length + ")";
        document.getElementById("count-cfa").textContent = "(" + allData.cfa.length + ")";

        document.getElementById("general-feed").innerHTML = allData.general.length
            ? allData.general.map((s, i) => storyHTML(s, i + 1, false)).join("")
            : '<div class="empty-state">No stories available.</div>';

        renderFilters();
        renderCFA();
    }

    function storyHTML(s, num, showCFA) {
        const id = "s" + num + (showCFA ? "c" : "g");
        const content = s.full_content || "";
        const isLong = content.length > 400;

        let h = `<article class="story">
            <div class="story-meta-line">
                <span class="story-number">${num}</span>
                <span class="story-source-name">${esc(s.source)}</span>
                <span class="story-dot"></span>
                <span class="story-time-label">${esc(s.pub_date_str)}</span>
                ${s.pub_date_relative ? `<span class="story-dot"></span><span class="story-time-ago">${esc(s.pub_date_relative)}</span>` : ""}
            </div>
            <div class="story-headline">${esc(s.title)}</div>`;

        if (content) {
            h += `<div class="story-body ${isLong ? 'collapsed' : ''}" id="${id}">${esc(content)}</div>`;
            if (isLong) {
                h += `<button class="read-toggle" onclick="toggle('${id}',this)">▾ Continue reading</button>`;
            }
        }

        if (showCFA && s.cfa_topics && s.cfa_topics.length) {
            h += `<div class="cfa-block">
                <div class="cfa-label">CFA L1 Topics</div>
                <div class="cfa-tag-row">`;
            s.cfa_topics.forEach(t => { h += `<span class="cfa-tag">${esc(t)}</span>`; });
            h += `</div>`;
            if (s.exam_note) {
                h += `<div class="exam-note"><strong>Exam relevance —</strong> ${esc(s.exam_note)}</div>`;
            }
            h += `</div>`;
        }

        h += `</article>`;
        return h;
    }

    function toggle(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains("collapsed")) {
            el.classList.remove("collapsed");
            btn.textContent = "▴ Show less";
        } else {
            el.classList.add("collapsed");
            btn.textContent = "▾ Continue reading";
        }
    }

    function renderFilters() {
        const topics = new Set();
        allData.cfa.forEach(s => s.cfa_topics.forEach(t => topics.add(t)));
        const sorted = ["All", ...Array.from(topics).sort()];
        document.getElementById("cfa-filters").innerHTML = sorted.map(t =>
            `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="filterCFA('${esc(t)}')">${esc(t)}</button>`
        ).join("");
    }

    function renderCFA() {
        let stories = allData.cfa;
        if (activeFilter !== "All") stories = stories.filter(s => s.cfa_topics.includes(activeFilter));
        document.getElementById("cfa-feed").innerHTML = stories.length
            ? stories.map((s, i) => storyHTML(s, i + 1, true)).join("")
            : '<div class="empty-state">No stories match this filter.</div>';
    }

    function filterCFA(t) { activeFilter = t; renderFilters(); renderCFA(); }

    function switchTab(tab) {
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        document.querySelectorAll(".feed-section").forEach(s => s.classList.toggle("active", s.id === "section-" + tab));
    }

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
